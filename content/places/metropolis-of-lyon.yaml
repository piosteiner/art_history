description_md: "A French territorial collectivity, also called Grand Lyon: a directly elected metropolitan authority for the city of Lyon and most of its suburbs, with the powers both of a department and of a metropolis — which takes its territory out of the Rhône department. It replaced the Urban Community of Lyon on 1 January 2015 (MAPAM law of January 2014). [[place/lyon|Lyon]] belongs to it since then; from 1793 to the end of 2014 the city was in the [[place/rhone|Rhône]] department.[[source/wikipedia-en-metropolis-of-lyon]]"
