name: Auvergne
kind: site
location: [3.08694, 45.77972]
description_md: |-
  The Auvergne, a remote rural region in the heart of the Massif Central, was known around 1000 for the custom that every church possessed cult statues "according to an ancient tradition".[[source/fehrenbach-1996-die-goldene-madonna|p. 55]] In 1013 Bernard of Angers travelled there to see this folklore for himself, came to mock the golden statues of Sainte Foy in Conques and St Gerald in Aurillac as idols, and left as a devotee of the cult images.[[source/fehrenbach-1996-die-goldene-madonna|p. 55]] [[source/forsyth-1972-the-throne-of-wisdom|p. 10]] About 946 a golden Madonna was made for Bishop Stephen II of Clermont-Ferrand (937–984) as a reliquary for relics of the Virgin; a drawing preserves what would seem to be the first Throne of Wisdom statue in the medieval West.[[source/forsyth-1972-the-throne-of-wisdom|p. 31]] Its metal was removed and melted down in 1793, and the statue disappeared.[[source/forsyth-1972-the-throne-of-wisdom|p. 14]]

  Twelfth-century sculptors of the Auvergne were so proficient that the largest number of surviving [[term/sedes-sapientiae|sedes sapientiae]] statues comes from the region.[[source/forsyth-1972-the-throne-of-wisdom|p. 19]] They favoured walnut, although it was not abundant in the region's forests, and assembled their smaller statues from many separately carved pieces, as in the [[artwork/morgan-madonna|Morgan Madonna]] and [[artwork/montvianeix-madonna|Notre-Dame de Montvianeix]].[[source/forsyth-1972-the-throne-of-wisdom|pp. 16–18]]
