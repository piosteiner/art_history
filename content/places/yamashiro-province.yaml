description_md: "The province around the capital: set up in the 7th century as 山背 (also written 山代), renamed 山城 — “mountain castle” — by Emperor Kanmu in 794 when he named Heian-kyō, for the hills and rivers that made it a natural fortress[[source/wikipedia-ja-yamashiro-no-kuni|延暦13年11月8日（794年12月4日）の平安京命名の際に、桓武天皇が … 「山城国」に改称した]]. It covered the south of today's Kyoto Prefecture — most of the city of Kyoto, Uji and the land towards Nara — and was replaced by the prefecture in 1868. The Ōnin War was fought in it ([[event/onin-war]])."
