description_md: Port at the western end of Honshu on the strait to Kyushu. Off its coast, at Dannoura, the fleet of Minamoto Yoshitsune decisively defeated the Taira in 1185[[source/history-of-japanese-art|pp. 166–167]] ([[event/battle-of-dan-no-ura]]). The port was long called Akamagaseki — a name first recorded in 1185, shortened to Bakan — and the city took the name Shimonoseki in 1902[[source/wikipedia-ja-shimonoseki-shi|下関港周辺は、古くは「赤間関」…と呼ばれており … 1902年6月1日に現在の市名である『下関市』に改名した]].
