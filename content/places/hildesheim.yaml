description_md: |-
  Hildesheim was the see of Bishop [[person/bernward-of-hildesheim|Bernward]] (993–1022), under whom the [[artwork/bernwardstur|Bernward door]] (1015) and the bronze column with the life of Christ were made there.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 28]] Ittai Weinryb speaks of a Hildesheim bronze industry taking shape in the same years as the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]] and the reliquary statue of Sainte Foy.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 54]]

  ## Origins and trade

  The town lay on the east–west trade route between the Rhine and the Elbe; in the early 9th century a small resting place for travelling merchants was set up on the bank of the Innerste, where Christian merchants from the west met Slavic and other merchants from the east and north-east.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 75]] Bernward's church of St. Michael, built on a hill outside the walls, overlooked both the old monastery and the old market near St. Andreas.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 75]]

  ## Frontier town

  In Ittai Weinryb's account, Hildesheim around 1000 lay at a sensitive political junction amid imperial expansion and territorial colonisation, on the front line of the dioceses along the Elbe.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 57]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 59]] It was attacked in 915 and again in 922, and in the late 10th century Slavic raiders plundered Ottonian settlements east of it near the river Tanger.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 59]] Bernward strengthened the town: he was credited with rebuilding its walls twice and enlarged the cathedral precinct with a wall with twelve towers.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 94]][[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] His life describes Hildesheim as lying on an "untamed frontier, full of wild beasts".[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 105]]

  ## Metal and forests

  From the 10th century silver, copper and lead were mined around the Rammelsberg in the Harz and traded through centres such as Goslar, Magdeburg and Hildesheim.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 75]] Anthracological studies have shown a clear link between the beginning of mining in the Harz and increased clearing of its forests, and Weinryb argues that the expansion of mining at Goslar and the rise of the Hildesheim bronze industry devastated the surrounding woods, where from the second half of the 10th century massive beeches gave way to smaller spruces.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 100]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 101]]
