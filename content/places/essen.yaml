description_md: |-
  The church of the former foundation of canonesses in Essen, today's cathedral, holds in its treasury the [[artwork/goldene-madonna-essen|Golden Madonna]] of about 980.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 14]] [[source/fehrenbach-1996-die-goldene-madonna|p. 47]] Until the beginning of the ninth century the oldest Essen served as a fortified outpost of the Frankish mission to the Saxons.[[source/fehrenbach-1996-die-goldene-madonna|p. 53]] Its founder, Altfrid, was the first bishop of [[place/hildesheim|Hildesheim]], and until 947 or 951 Essen was the bishop's proprietary church.[[source/fehrenbach-1996-die-goldene-madonna|p. 77]] Under the abbesses Mathilde (973–1011), a granddaughter of Otto the Great, Sophia (1011–39), a daughter of Otto II, and Theophanu (1039–58), Essen was for about eighty years the most distinguished women's foundation of the empire.[[source/fehrenbach-1996-die-goldene-madonna|p. 49]] Around 1000 it was the only imperial foundation dedicated to Mary.[[source/fehrenbach-1996-die-goldene-madonna|p. 50]]

  The fourteenth-century *Liber ordinarius* describes the processions in which the Golden Madonna was carried through the town and its fields — to St Mark's at Bredeney, to the foundation's estates and, at Candlemas, from the market church of St Gertrude to the "stone" under the linden before the Johanneskirche.[[source/fehrenbach-1996-die-goldene-madonna|p. 47]] A parchment roll of 1404 in the city archive records how the citizens elected a carnival "king of Essen" with a "duke" and a "Raugraf", who organised the annual candle offering to the foundation.[[source/fehrenbach-1996-die-goldene-madonna|p. 51]]
