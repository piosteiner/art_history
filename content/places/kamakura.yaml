description_md: Minamoto no Yoritomo made Kamakura the centre of his government instead of the imperial capital, and obliged his vassals to reside with him there[[source/history-of-japanese-art|pp. 166–169]]. It gave its name to the Kamakura period and stayed the shogunate's seat until its fall in 1333 ([[event/siege-of-kamakura]])[[source/wikipedia-ja-kamakura-shi|鎌倉幕府が置かれ政権の要の地となり、日本史の時代区分でもある「鎌倉時代」の由来にもなった]].
