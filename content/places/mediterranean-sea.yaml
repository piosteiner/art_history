description_md: |-
  An intercontinental sea between Europe, Asia and Africa, almost completely enclosed by land: the Levant to the east, Anatolia and southern Europe to the north, North Africa to the south. To the west the Strait of Gibraltar, only 14 km wide, joins it to the Atlantic; the Bosporus leads to the Black Sea, the Suez Canal to the Red Sea. It covers about 2,500,000 km² and includes fifteen marginal seas, among them the Aegean, Adriatic, Tyrrhenian and Marmara; its average depth is 1,500 m, its deepest point the Calypso Deep in the Ionian Sea (5,109 m). Its shores saw some of the earliest civilisations — Egypt, Greece, the Fertile Crescent — and the sea was a route for merchants, travellers and migrants; the Roman Empire is the only state ever to have controlled all of its coasts.[[source/wikipedia-en-mediterranean-sea]]

  **Whose water.** Like every sea it is divided by law, not by a border on the map: each coastal state's territorial sea along its coast, beyond it up to 200 nautical miles its exclusive economic zone with sovereign rights over the water and the sea floor; what lies beyond belongs to no state — the high seas, informally called "international waters" (not a term of international law).[[source/wikipedia-en-international-waters]] So the sea has no parent place here; its area is drawn from Natural Earth's marine polygons.[[source/natural-earth-marine-polys]]
