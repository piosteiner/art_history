description_md: The mausoleum of Qin Shi Huang, the first emperor of the Qin dynasty, lies in today's Lintong District of [[place/xi-an|Xi'an]], Shaanxi. [[source/wikipedia-en-mausoleum-of-qin-shi-huang|introduction]] It was built over 38 years, from 246 to 208 BCE, beneath a tomb mound 76 metres high in the shape of a truncated pyramid, and its layout follows that of the Qin capital Xianyang, with inner and outer cities. [[source/wikipedia-en-mausoleum-of-qin-shi-huang|introduction]] Work began soon after the emperor came to the throne in 246 BCE at the age of 13, but full-scale construction started only after he had unified China in 221 BCE. [[source/wikipedia-en-mausoleum-of-qin-shi-huang|§ Historical records]] The tomb itself has not been excavated; archaeologists work in the surrounding necropolis, including the terracotta army east of the mound, which served as the mausoleum's garrison. [[source/wikipedia-en-mausoleum-of-qin-shi-huang|introduction]] According to estimates from 2007, more than 8,000 soldiers, 130 chariots with 520 horses and 150 cavalry horses are estimated to stand in its three pits. [[source/wikipedia-en-terracotta-army|introduction]] The [[artwork/kneeling-crossbowman-qin|figure of a kneeling crossbowman]] shown in the lecture "War and Peace in East Asian Art" comes from this complex. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]]
