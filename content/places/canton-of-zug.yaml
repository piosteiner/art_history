relationships:
  - type: in_polity
    to: polity/holy-roman-empire
    period: 962/1415
    notes_md: A Habsburg town under the dukes of Austria until King Sigmund gave Stadt und Amt Zug the Reichsfreiheit in 1415; the alliance of 1352 changed nothing in its lordship.
    sources:
      - accessed: 2026-10-29
        wikidata: Q12548
      - url: https://hls-dhs-dss.ch/de/articles/007373/
        note: "HLS, Zug (Kanton): from 1352 a confederate place (ab 1352 eidgenössischer Ort) — the year only (read by the owner)"
        source: hls-zug-kanton
        accessed: 2026-10-30
      - url: https://en.wikipedia.org/wiki/Zug
        note: “On 27 June 1352, both the town of Zug and the Aeusser Amt entered the Swiss Confederation, the latter being received on exactly the same terms as the town, and not, as was usual in the case of outer districts, as a subject land.”
        source: wikipedia-en-zug
        accessed: 2026-10-30
      - url: https://www.e-periodica.ch/digbib/view?pid=tug-001%3A2002%3A18%3A%3A117
        note: „Für die Stadt Zug und das Amt änderte sich durch die Ereignisse im Juni 1352 wenig. Selbstverständlich blieb Zug habsburgisch“ (S. 110) · „König Sigmund rief zum Reichskrieg gegen Herzog Friedrich auf, verlieh Stadt und Amt Zug die Reichsfreiheit und brachte dadurch sämtliche habsburgischen Ansprüche zum Erlöschen“ (S. 113–114)
        source: glauser-2002
        locator: S. 110, 113–114
        accessed: 2026-10-30
  - type: in_polity
    to: polity/old-swiss-confederacy
    period: 1352-06-27/1352-09-14
    notes_md: "The „Zugerbund“: an alliance forced on the town after its capitulation to the Confederates’ siege — treated as void by all sides from the Brandenburg peace in September 1352; Habsburg recognised it expressly only in 1371."
    sources:
      - accessed: 2026-10-29
        wikidata: Q435583
      - url: https://hls-dhs-dss.ch/de/articles/007373/
        note: "HLS, Zug (Kanton): from 1352 a confederate place (ab 1352 eidgenössischer Ort) — the year only (read by the owner)"
        source: hls-zug-kanton
        accessed: 2026-10-30
      - url: https://en.wikipedia.org/wiki/Zug
        note: “On 27 June 1352, both the town of Zug and the Aeusser Amt entered the Swiss Confederation, the latter being received on exactly the same terms as the town, and not, as was usual in the case of outer districts, as a subject land.”
        source: wikipedia-en-zug
        accessed: 2026-10-30
      - url: https://www.e-periodica.ch/digbib/view?pid=tug-001%3A2002%3A18%3A%3A117
        note: „Kapitulation der Stadt Zug, am 27. Juni 1352, schlossen die Städte Zürich und Luzern, die Länderorte Uri, Schwyz und Unterwalden sowie «der rat und die burger gemeinlich der statt Zuge …» in Luzern ein Bündnis ab“ (S. 104) · „Das Ende Juni abgeschlossene Bündnis … wurde bereits knappe zwei Monate später im gegenseitigen Einvernehmen mit Herzog Albrecht quasi stillschweigend als ungültig betrachtet“ (S. 110) · „Und schliesslich anerkannten die Herzöge nun erstmals ausdrücklich den «Zugerbund» von 1352“ (S. 113, Frieden vom 15. Februar 1371)
        source: glauser-2002
        locator: S. 104, 110, 113
        accessed: 2026-10-30
  - type: in_polity
    to: polity/old-swiss-confederacy
    period: 1415/1798-03-04
    notes_md: A sovereign Ort from the Reichsfreiheit of 1415; it became confederate step by step between 1415 and the Stanser Verkommnis of 1481.
    sources:
      - url: https://www.e-periodica.ch/digbib/view?pid=tug-001%3A2002%3A18%3A%3A117
        note: „Spätestens seit 1415 bildete Zug einen nach aussen souveränen «Ort» … Am ehesten dürfte deshalb zutreffen, dass der Stand Zug zwischen 1415 und 1481 sukzessive eidgenössisch wurde.“
        source: glauser-2002
        locator: S. 115
        accessed: 2026-10-30
      - url: https://hls-dhs-dss.ch/de/articles/007373/
        note: "HLS, Zug (Kanton): from 1415 reichsunmittelbar and a full member of the Old Confederacy (read by the owner)"
        source: hls-zug-kanton
        accessed: 2026-10-30
