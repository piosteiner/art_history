description_md: Changchun ("long spring") is a city in Northeast China and, since 1954, the capital of [[place/jilin|Jilin]] province. [[source/wikipedia-en-changchun|introduction]] From 1932 to 1945 it was renamed Xinjing ("new capital"; Japanese Shinkyō, also written Hsinking) as the capital of the Japanese puppet state of [[polity/manchukuo|Manchukuo]]. [[source/wikipedia-en-changchun|introduction]] The capital was established there on 10 March 1932 and the city renamed on 13 March; the emperor Puyi lived in the Imperial Palace, today a museum. [[source/wikipedia-en-changchun|§ Manchukuo and World War II]] The Metropolitan Plan of Great Xinjing, drawn up from March 1932, drew on the renovation of Paris, the garden-city movement and American planning, and by 1934 the city was known as the "Forest Capital"; because of the war the plan remained unfinished. [[source/wikipedia-en-changchun|§ Construction of Hsinking]] The population grew from 141,712 in 1934 to 863,607 in 1944, of whom 153,614 were Japanese settlers. [[source/wikipedia-en-changchun|§ Construction of Hsinking]] Under Manchukuo the region suffered harsh suppression, forced conscription and labour, while industrialisation and militarisation advanced quickly. [[source/wikipedia-en-changchun|§ Manchukuo and World War II]] The lecture "War and Peace in East Asian Art" showed a lithographed [[artwork/five-year-plan-of-xinjing-map|Five-Year Plan of Xinjing]] of 1935. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]
