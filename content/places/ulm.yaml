      - url: https://de.wikipedia.org/wiki/Ulm
        note: “Damit war für Napoleon der Weg nach Osten frei für die Entscheidungsschlacht gegen die Russen und Österreicher bei Austerlitz. 1810 gelangte Ulm durch einen bayerisch-württembergischen Gebietsaustausch, der im entsprechenden Grenzvertrag geregelt war, vom Königreich Bayern an das Königreich Württemberg. ==== Grenz- und Provinzstadt im Königreich Württemberg (1810 bis 1918) ==== Für Ulm hatte der Übergang an Württemberg schwerwiegende und bis heute andauernde Folgen.”
