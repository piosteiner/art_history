description_md: |-
  The largest and deepest of the Earth's five oceans, from the Arctic Ocean in the north to the Southern Ocean (or, by another definition, Antarctica) in the south, between Asia and Australia in the west and the Americas in the east. At about 165 million km² it covers some 46 % of the Earth's water surface and about a third of its whole surface — more than all land together. The currents divide it at the Equator into the North and the South Pacific; the International Date Line divides it informally into East and West. Its mean depth is 4,000 m; the Challenger Deep in the Mariana Trench is the deepest known point on Earth (10,928 m). Its marginal seas include the Philippine Sea, the South China and East China Seas, the Sea of Japan, the Sea of Okhotsk, the Bering Sea, the Tasman Sea and the Coral Sea.[[source/wikipedia-en-pacific-ocean]]

  **Whose water.** Along every coast the coastal state's territorial sea, beyond it up to 200 nautical miles its exclusive economic zone; the rest — most of the ocean — is high seas, belonging to no state and informally called "international waters" (not a term of international law).[[source/wikipedia-en-international-waters]] So the ocean has no parent place here. Its area is drawn from Natural Earth's North and South Pacific, without the marginal seas, which Natural Earth draws apart.[[source/natural-earth-marine-polys]]
