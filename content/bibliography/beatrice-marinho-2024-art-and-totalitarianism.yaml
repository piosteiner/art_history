description_md: An exercise (Übung, BA and MA) on cultural production under the totalitarian regimes of the twentieth century — Fascist Italy, Nazi Germany, the Soviet Union and, for comparison, Brazil under Vargas — with a focus on exhibitions and monuments, and on how these legacies are dealt with today. Seven sessions, among them a visit to the exhibition *kolonial – Globale Verflechtungen der Schweiz* at the Landesmuseum Zürich (5 November 2024). The programme and the slides are unpublished; cited by session and slide.
