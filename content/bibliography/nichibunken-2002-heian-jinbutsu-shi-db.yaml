description_md: "*Heian jinbutsu shi* (‘Who’s Who in Old Kyoto’) is a database of the International Research Center for Japanese Studies (Nichibunken) in Kyoto with images, the full text and an index of Nichibunken’s copies of the *Heian jinbutsu shi*, 1768–1867 [[source/nichibunken-2002-heian-jinbutsu-shi-db|description]]. It holds 927 pages and was last updated in January 2002 [[source/nichibunken-2002-heian-jinbutsu-shi-db|description]]. A companion database gives 947 tanzaku poem slips written by people listed in the directory [[source/nichibunken-2002-heian-jinbutsu-shi-tanzakucho-db|description]]. It was earlier served from tois.nichibun.ac.jp under the ‘Jidai tōgō jōhō system’, with a page for each person and the pages of each edition [[source/wikipedia-en-hara-school-of-painters|references]]. Scholars such as Ahn Michinaga consult it beside printed reprints [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|n. 1]]."
