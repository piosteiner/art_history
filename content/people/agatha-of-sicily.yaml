description_md: |-
  A Sicilian martyr whose breasts were cut off as part of her torture.

  **In art:** A young woman holding a dish with two breasts on it, or pincers.

  **Famous works**

  - [[artist/francisco-de-zurbaran]], *Saint Agatha* (1630–1633, Musée Fabre, Montpellier)

  *From:* Golden Legend · Christian
