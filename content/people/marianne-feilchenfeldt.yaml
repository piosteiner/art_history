description_md: "Photographer and art dealer. Born Marianne Breslauer in Berlin, a photographer of the New Vision in the late 1920s and 1930s; married the art dealer [[person/walter-feilchenfeldt]] in 1936 and emigrated with him to Amsterdam and, in 1939, to Switzerland. In 1948 the two founded the dealership [[institution/walter-feilchenfeldt-kunsthandel]] in Zürich, which she directed after his death in 1953 — from 1966 with their son [[person/walter-feilchenfeldt-jun]] — until 1990.[[source/wikipedia-de-marianne-feilchenfeldt|“1948 gründete sie mit ihrem Mann … eine Kunsthandlung” · “Nach dem Tod ihres Mannes 1953 übernahm sie das Geschäft” · “1966 bis 1990 … mit ihrem Sohn Walter”]][[source/walterfeilchenfeldt-art-dealing|“1953–1966: Marianne Feilchenfeldt” · “1966–1990: Marianne and Walter Feilchenfeldt jun.”]]"
