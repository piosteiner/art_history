description_md: |-
  A virgin martyr who, in one version (which the Golden Legend itself calls apocryphal), was swallowed by the Devil in the form of a dragon. The cross she held irritated its stomach, and she burst out unharmed. Patron saint of childbirth.

  **In art:** A young woman stepping out of or standing over a dragon, holding a cross.

  **Famous works**

  - [[artist/raphael]] and workshop, *Saint Margaret* (Louvre and Vienna)

  *From:* Golden Legend · Christian
