name: Jerome
kind: person
birth: c. 345
death: 420-10-01
description_md: |-
  A scholar who translated the Bible into Latin (the *Vulgate*) between 382 and 405. He lived as a hermit in the desert and, according to legend, pulled a thorn from the paw of a lion, which then stayed with him.

  **In art:** Either an old scholar in his study with books, a skull and a lion lying at his feet, often in a cardinal's red robe and hat (anachronistic, as there were no cardinals then), or a penitent half-naked hermit beating his chest with a stone.

  **Famous works**

  - [[artist/albrecht-durer]], *Saint Jerome in His Study* (engraving, 1514)
  - [[artist/antonello-da-messina]], *Saint Jerome in His Study* (National Gallery, London)
  - [[artist/leonardo-da-vinci]], *Saint Jerome in the Wilderness* (unfinished, Vatican)
  - [[artist/caravaggio]], *Saint Jerome Writing* (Galleria Borghese)

  *From:* Golden Legend · Christian
