description_md: |-
  Rebecca was chosen as [[binding-of-isaac|Isaac]]'s wife when she offered water to Abraham's servant and his camels at a well.

  **In art:** A young woman at a well offering water from a jug to a traveller, with camels.

  **Famous works**

  - [[artist/nicolas-poussin]], *Eliezer and Rebecca* (Louvre)
  - [[artist/bartolome-esteban-murillo]], *Rebecca and Eliezer* (Prado)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
