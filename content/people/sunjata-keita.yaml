description_md: |-
  Sundiata Keita is the hero of the Epic of Sundiata, passed down for centuries by *griots*, West African oral historians. As a child he could not walk and was mocked by the court, and his family was driven into exile. One day, he pulled himself up on an iron staff so heavy it bent, and stood. He grew into a great leader, returned to defeat the sorcerer-king [[person/sumanguru-kante|Soumaoro Kanté]], and founded the Mali Empire in the 13th century.

  *From:* Epic of Sundiata · Mandinka (West Africa)
