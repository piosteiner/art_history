description_md: |-
  A giant who served travellers by carrying them across a dangerous river. One day, he carried a small child who grew heavier and heavier until it felt like he was carrying the whole world. The child was Christ. Patron saint of travellers.

  **In art:** A giant wading through a river with a staff and a child on his shoulders. Often painted very large opposite the church door.

  **Famous works**

  - [[artist/hieronymus-bosch]], *Saint Christopher* (Museum Boijmans Van Beuningen, Rotterdam)
  - [[artist/dieric-bouts]] or Dieric Bouts the Younger (attribution disputed), *Saint Christopher* (right wing of the *Pearl of Brabant* triptych, Alte Pinakothek, Munich)

  *From:* Golden Legend · Christian
