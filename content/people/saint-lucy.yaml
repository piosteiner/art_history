public_id: 123032
name: Saint Lucy
kind: person
birth: c. 283
death: 304
description_md: |-
  A young Sicilian martyr, whose name comes from *lux*, "light". In later legend, her eyes were torn out (in another version she took them out herself). Patron saint of the blind; her feast is celebrated with candles in Scandinavia.

  **In art:** A young woman holding a dish with two eyes on it.

  **Famous works**

  - [[artist/francesco-del-cossa]], *Saint Lucy* (from the Griffoni Polyptych, National Gallery of Art, Washington)
  - [[artist/caravaggio]], *The Burial of Saint Lucy* (Santa Lucia al Sepolcro, Syracuse)

  *From:* Golden Legend · Christian
