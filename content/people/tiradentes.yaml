description_md: |-
  Joaquim José da Silva Xavier was nicknamed "Tiradentes" ("tooth-puller") because he worked as a dentist. He took part in a plot for independence from Portugal in 1789, was betrayed, and became the only one hanged. He's a national hero, and his execution day is a holiday.

  *From:* Brazilian
