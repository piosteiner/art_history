description_md: |-
  Sisera fled and took refuge in the tent of a woman named Jael, who gave him milk, waited until he fell asleep, and drove a tent peg through his head.

  **In art:** A woman holding a hammer and tent peg over a sleeping soldier.

  **Famous works**

  - [[artist/artemisia-gentileschi]], *Jael and Sisera* (Budapest)
  - Lucas van Leyden, *Jael Killing Sisera* (woodcut)

  *From:* Hebrew Bible, Judges · Hebrew Bible
