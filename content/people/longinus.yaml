description_md: |-
  Longinus was the Roman soldier who pierced Christ's side with a lance, and in legend became a Christian.

  **In art:** A soldier with a lance at the cross, often on horseback.

  **Famous works**

  - Bernini, *Saint Longinus* (St Peter's Basilica, Rome)
  - Rubens, *Le Coup de Lance* (high altarpiece of 1620 for the Récollets church, Royal Museum of Fine Arts Antwerp, KMSKA)

  *From:* New Testament; Christian legend · Christian
