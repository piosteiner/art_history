description_md: |-
  Alfred Rosenberg was born on 12 January 1893 in Reval (Tallinn), then in the Russian Empire, the son of a merchant; his mother died two months after his birth.[[source/wikipedia-en-alfred-rosenberg|§ Early life]] Introduced to Hitler by Dietrich Eckart, he became the party's chief ideologue: author of *The Myth of the Twentieth Century* (1930), one of the main sources of its racial theory, antisemitism, the demand for *Lebensraum* and the rejection of "degenerate" modern art; editor of the *Völkischer Beobachter*; head of the party's office of foreign affairs (1933–1945) and of the "Amt Rosenberg" for cultural policy and surveillance (1934–1945); and during the war Reich Minister for the Occupied Eastern Territories, where he helped direct the crimes against the Slavs. Sentenced at Nuremberg, he was hanged on 16 October 1946.[[source/wikipedia-en-alfred-rosenberg|introduction]]

  ## Art policy

  In 1928 he founded the Combat League for German Culture (Kampfbund für deutsche Kultur), which, with the circle of Bettina Feistel-Rohmeder, stood for a reactionary völkisch art and was notorious for defaming the Expressionists; his books *The Myth of the Twentieth Century* and *Revolution in der bildenden Kunst?* (1934) saw in the modern city the root of the "mongrel art" of Expressionism.[[source/hermand-1994|pp. 36–37]][[source/peters-2017|p. 13]][[source/fulda-soika-2014|p. 188]] His rivalry with [[person/joseph-goebbels|Goebbels]], who favoured a "Nordic Expressionism", ran through the first years of the regime — in 1933 Goebbels's young followers turned the League's rejection of [[artist/emil-nolde|Nolde]] into a public attack on it.[[source/fulda-soika-2014|pp. 188, 190]] In 1937 Goebbels "threw his own convictions overboard" and made Rosenberg's line his own, seizing the initiative from him with the *Entartete Kunst* exhibition; Rosenberg's own campaigns, Peters notes, tended to come at inappropriate times and out of narrow-minded ideology.[[source/peters-2017|pp. 18, 20]] The critic Robert Scholz, who sat on the 1938 commission for the sale of the confiscated works, was Rosenberg's associate.[[source/peters-2017|p. 26]] During the war the [[institution/einsatzstab-reichsleiter-rosenberg]], named after him, looted cultural property throughout the occupied countries.
