description_md: |-
  Peter of Verona, a 13th-century Dominican inquisitor, was murdered with an axe blow to the head.

  **In art:** A Dominican friar with a knife or cleaver in his head.

  **Famous works**

  - [[artist/titian]], *The Death of Saint Peter Martyr* (destroyed by fire in 1867, known from copies)

  *From:* Golden Legend · Christian
