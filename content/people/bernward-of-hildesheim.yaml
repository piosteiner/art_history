description_md: |-
  Bernward (born around 950/960, died 20 November 1022 in Hildesheim) was Bishop of Hildesheim from 993 to 1022 and is venerated as a saint.[[source/wikipedia-de-bernward-von-hildesheim]] He was the patron of the [[artwork/bernwardstur|Bernward door]], the bronze column with the life of Christ and the church of St. Michael in Hildesheim.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]]

  ## Life

  Bernward came from the Saxon nobility and grew up with his maternal grandfather, Count Palatine Adalbero of Saxony; he was educated at the Hildesheim cathedral school.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] From 977 he was probably introduced at court by his uncle Folcmar, bishop of Utrecht, and trained as a notary; from 987 he drafted and wrote royal charters at the court of the Empress Theophanu, and from 987/988 to 993 he was tutor to the young King Otto III.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] Ittai Weinryb describes him as court bishop under Otto II and tutor of Otto III, and notes that Bernward had been ordained by Archbishop Willigis of Mainz, whom Otto I had appointed and who served Otto II as imperial chancellor.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 58]] On 15 January 993 Willigis consecrated him bishop in Mainz.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 88]] In 1001/02 he stayed in Rome as a member of Otto III's court, and in 1006 he travelled to Tours.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 78]][[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]]

  ## Bishop on the frontier

  Around 1000 Hildesheim lay on the front line of the dioceses along the Elbe, in the struggle of the Church and the Ottonian kings to conquer and convert the pagan Slavs.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 59]] In 994 he took in Bishop Ekkehard, who had been driven from Schleswig, and in 994/995 he built two small forts, Mundburg at the confluence of the Aller and the Oker and Wyrinholt further to the north-east, with a chapel he dedicated to St Lambert; in 1013 Henry II confirmed the see's perpetual rights over both as a defence "contra perfidorum incursionem et vastationem sclavorum".[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 59]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 60]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 61]] He took part in Henry II's campaigns and was credited with twice rebuilding the walls of Hildesheim; he enlarged the cathedral precinct with a wall with twelve towers.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 94]][[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] In 1018 Bishop Benno of Oldenburg, who had fled from Starigard, found refuge with him.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 92]]

  ## Patron

  Bernward wanted to give his see a face worthy of its importance on the model of Rome: the bronze door, the bronze column with the deeds of Christ and the church of St. Michael, which he built as an image of the heavenly Jerusalem and as his burial church, are the most famous results, on the UNESCO World Heritage list since 1985.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] St. Michael began as a wooden chapel of the Holy Cross consecrated in 996; around 1010 he began the stone church and monastery, deliberately outside the walls of Hildesheim on a hill, as his biographer Thangmar reports.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 74]] For Abbess Judith of Ringelheim he gave the [[artwork/ringelheimer-kruzifix|Ringelheim crucifix]], a monumental wooden figure of the crucified Christ.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] He gave the [[artwork/bernward-gospels|precious gospel book]] to St. Michael for the altar of Mary in the crypt, consecrated in 1015.[[source/wikipedia-en-rich-bernward-gospels]] Weinryb reads his bronzes as an "avant-garde" bound up with the colonial project of the Ottonian empire in the north-east.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 53]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 54]]

  ## Death and veneration

  On 29 September 1022 he consecrated the still unfinished abbey church of St. Michael, became a monk there on 11 November and died on 20 November 1022; he was buried in its crypt.[[source/wikipedia-de-bernward-von-hildesheim|§ Leben und Werk]] His life was written by his teacher Thangmar (Vita Bernwardi); he was canonised in 1192/93.[[source/wikipedia-de-bernward-von-hildesheim|§ Wirkung]]
