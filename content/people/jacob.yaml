occupations: [shepherd]
description_md: |-
  [[binding-of-isaac|Isaac]]'s son, who tricked his twin brother Esau out of his birthright and their father's blessing. Fleeing, he dreamed of a ladder reaching to heaven with angels going up and down. Later, he wrestled all night with an angel and was renamed Israel.

  **In art:** A man asleep on a stone beneath a ladder of angels, or a man wrestling with a winged figure.

  **Famous works**

  - José de Ribera, *Jacob's Dream* (Prado)
  - [[artist/rembrandt]], *Jacob Wrestling with the Angel* (Berlin)
  - [[artist/eugene-delacroix]], *Jacob Wrestling with the Angel* (Saint-Sulpice, Paris) — [[artwork/jacob-wrestling-with-the-angel-delacroix]]
  - [[artist/paul-gauguin]], *Vision after the Sermon* (Edinburgh)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
