description_md: |-
  Bernard of Clairvaux was a powerful 12th-century abbot and preacher, who had a vision of the [[person/mary|Virgin Mary]].

  **In art:** A white-robed abbot with a white dog, writing as the Virgin appears.

  **Famous works**

  - [[artist/filippino-lippi]], *The Vision of Saint Bernard* (Badia Fiorentina, Florence)

  *From:* Golden Legend · Christian
