description_md: |-
  John Chapman (1774–1845) walked barefoot across Pennsylvania, Ohio and Indiana planting apple-tree nurseries. According to 19th-century accounts, he wore a coffee sack with holes cut for head and arms and a tin pot as a hat. He was kind to animals and was a deeply religious man.

  *From:* American
