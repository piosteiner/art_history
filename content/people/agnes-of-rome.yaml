birth: c. 291
death: 304-01-22
description_md: |-
  A Roman girl of about 12 or 13, martyred for refusing to marry. When she was stripped in public, in one account her hair miraculously grew to cover her body.

  **In art:** A young girl holding a lamb (*agnus* in Latin), with a palm.

  **Famous works**

  - José de Ribera, *Saint Agnes in Prison* (Dresden)
  - Sant'Agnese in Agone (Piazza Navona, Rome)

  *From:* Golden Legend · Christian
