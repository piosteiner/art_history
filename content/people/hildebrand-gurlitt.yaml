description_md: |-
  Hildebrand Gurlitt was born in Dresden in 1895 into a family of artists and scholars: his father Cornelius was an architect and art historian, his sister Cornelia a painter, his cousin [[person/wolfgang-gurlitt|Wolfgang]] an art dealer. A Jewish grandmother made him a "quarter Jew" under the Nuremberg laws. Wounded on the Somme and in Champagne in the First World War, he took his doctorate in art history at Frankfurt in 1924. As first director of the König Albert Museum in Zwickau from 1925 he showed Pechstein, Kollwitz, Heckel, Schmidt-Rottluff and Nolde, had the Bauhaus design the museum and acquired works by Barlach, Feininger, Kandinsky, Kirchner, Klee and Kokoschka; press campaigns led to his dismissal in 1930. He then ran the Hamburg Kunstverein until the National Socialists forced him and its board to resign in 1933.[[source/wikipedia-en-hildebrand-gurlitt|§ Early life; § Early career]]

  From the mid-1930s he bought works cheaply from private owners, among them Jewish owners forced to pay punitive taxes or to sell before fleeing. He was one of the four dealers appointed by the commission for the "utilisation" of degenerate art — with [[person/karl-buchholz|Karl Buchholz]], [[person/ferdinand-moller|Ferdinand Möller]] and [[person/bernhard-a-bohmer|Bernhard A. Böhmer]] — to market confiscated works abroad, for a commission of 10 to 25 percent; the works were kept for them in a trading depot at Schönhausen Palace near Berlin, and they did not always report what they sold. His name stands beside many entries in the ministry's list of the confiscated works, now in the Victoria and Albert Museum.[[source/wikipedia-en-hildebrand-gurlitt|§ Nazi era]][[source/peters-2017|p. 26]] In occupied France he bought works, many of them looted, for Hitler's planned Führermuseum in Linz and for himself.[[source/wikipedia-en-hildebrand-gurlitt|introduction]]

  Captured with twenty crates of art in Aschbach in June 1945, he told the Americans that his collection and records had burned in the bombing of Dresden; he presented himself as a victim of persecution and recovered 115 works. From 1948 he directed the Kunstverein für die Rheinlande und Westfalen in Düsseldorf and staged more than seventy exhibitions of modern art. He died in a car accident in 1956. His son Cornelius kept more than 1,500 works in secret; they came to light in 2013, and Cornelius left them to the [[institution/kunstmuseum-bern|Kunstmuseum Bern]] in 2014.[[source/wikipedia-en-hildebrand-gurlitt|introduction; § Post-war]]
