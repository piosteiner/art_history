description_md: |-
  Saint Gall, a monk, by tradition from Ireland, whose hermitage became the Abbey of St. Gallen; in legend a bear carried wood to his fire and was given bread in return.

  **In art:** Saint Gall with a bear.

  *From:* legend of St. Gallen · Christian
