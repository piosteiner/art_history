description_md: |-
  The parents of the [[person/mary|Virgin Mary]], according to tradition. After many years of childlessness, they were told by an angel they would have a child, and met joyfully at the Golden Gate of Jerusalem.

  **In art:** An older couple embracing at a city gate.

  **Famous works**

  - [[artist/giotto]], *Meeting at the Golden Gate* (Scrovegni Chapel)

  *From:* Christian tradition (Protoevangelium of James); Golden Legend · Christian
