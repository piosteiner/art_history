birth: c. 1507 BCE
death: c. 1458 BCE
description_md: |-
  She ruled Egypt from about 1479 to 1458 BC and was often shown with a false beard and a man's clothing. She sent a famous expedition to the land of Punt for incense trees. Late in the reign of her successor Thutmose III and under his son, her name and images were erased from monuments.

  *From:* Ancient Egyptian
