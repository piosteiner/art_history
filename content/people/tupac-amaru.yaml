description_md: |-
  The first Túpac Amaru was the last Inca ruler, executed by the Spanish in 1572. Two hundred years later, [[person/tupac-amaru-ii|José Gabriel Condorcanqui]] took his name and led the greatest Indigenous uprising against Spanish rule (1780–1781). The rapper Tupac Shakur was named after Túpac Amaru II.

  *From:* Inca
