description_md: |-
  A noble Roman woman. When a visitor showed off her jewels and asked to see Cornelia's, she presented her two sons, saying "These are my jewels." Her sons, Tiberius and Gaius Gracchus, became famous reformers.

  **In art:** A mother presenting her children to a richly dressed woman holding jewellery.

  **Famous works**

  - Angelica Kauffman, *Cornelia, Mother of the Gracchi* (Virginia Museum of Fine Arts, Richmond)

  *From:* Valerius Maximus · Ancient Roman
