birth: 279
death: c. 311
description_md: |-
  A virgin martyr. On her way to execution, a young lawyer mockingly asked her to send him fruit and flowers from paradise. After her death, a child (an angel) brought him a basket of roses and apples, and he converted.

  **In art:** A young woman with a basket of roses or fruit, sometimes with a child angel.

  **Famous works**

  - Hans Baldung Grien, *The Martyrdom of Saint Dorothy* (Prague)
  - Francesco di Giorgio Martini, *Saint Dorothy and the Infant Christ* (National Gallery, London)

  *From:* Golden Legend · Christian
