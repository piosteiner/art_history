description_md: |-
  An 11th-century English noblewoman who, according to legend, rode naked through the streets of Coventry, covered only by her long hair, to persuade her husband to lower the town's heavy taxes. Everyone stayed indoors except, in later versions, one man, "Peeping Tom", who was struck blind (or dead).

  **In art:** A nude woman with long hair riding a white horse through an empty town.

  **Famous works**

  - John Collier, *Lady Godiva* (1897, Herbert Art Gallery and Museum, Coventry)

  *From:* English legend · English
