description_md: |-
  His name means "descending eagle". He led the defence of Tenochtitlan against Cortés in 1521. When he was captured, the Spanish burnt his feet to make him say where the gold was hidden, but they did not find what they were looking for. He's a Mexican national hero.

  *From:* Aztec (Mexica)
