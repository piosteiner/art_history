description_md: |-
  Simon Magus was a magician who tried to buy the apostles' power (the origin of the word "simony"). In legend, he flew over Rome by magic until Peter's prayers made him fall.

  **In art:** A magician falling from the sky.

  **Famous works**

  - [[artist/benozzo-gozzoli]], *The Fall of Simon Magus* (Royal Collection)

  *From:* New Testament, Acts of the Apostles; Christian legend · Christian
