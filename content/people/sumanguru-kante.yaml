description_md: |-
  Soumaoro Kanté was the blacksmith-sorcerer king of Sosso in the Epic of Sundiata. He was said to be invulnerable thanks to powerful magic, with a secret chamber full of fetishes. Sundiata could only beat him after learning his secret weakness: an arrow tipped with the spur of a white rooster. Struck by it, he fled into the mountains of Koulikoro and vanished.

  *From:* Epic of Sundiata · Sosso (West Africa)
