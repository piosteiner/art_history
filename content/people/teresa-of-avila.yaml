birth: 1515-04-07
death: 1582-10-15
description_md: |-
  A 16th-century Spanish mystic and nun who described a vision of an angel piercing her heart with a golden spear, leaving her filled with love for God.

  **In art:** A nun in ecstasy, with an angel holding a golden arrow.

  **Famous works**

  - Bernini, *The Ecstasy of Saint Teresa* (Cornaro Chapel, Santa Maria della Vittoria, Rome) — [[artwork/ecstasy-of-saint-teresa]]

  *From:* her own writings · Christian
