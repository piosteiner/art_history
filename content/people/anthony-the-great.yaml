name: Anthony the Great
given_name: Anthony the
family_name: Great
kind: person
birth: 251
death: c. 357
description_md: |-
  A 3rd–4th-century Egyptian hermit, the father of monasticism, tormented in the desert by demons who tempted and attacked him.

  **In art:** An old monk with a T-shaped cross (*tau*), a bell and a pig, often surrounded by hideous demons.

  **Famous works**

  - [[artist/hieronymus-bosch]], *The Temptation of Saint Anthony* (triptych, Museu Nacional de Arte Antiga, Lisbon)
  - Matthias Grünewald, *Isenheim Altarpiece* (the Temptation panel; Musée Unterlinden, Colmar)
  - Martin Schongauer, *Saint Anthony Tormented by Demons* (engraving)
  - [[artist/salvador-dali]], *The Temptation of Saint Anthony* (1946, Royal Museums of Fine Arts of Belgium, Brussels)

  *From:* Golden Legend · Christian
