description_md: |-
  A young woman locked in a tower by her father, who later beheaded her for becoming a Christian, and was then struck dead by lightning. Patron of artillerymen, miners and firefighters.

  **In art:** A woman holding a tower with three windows (for the [[holy-trinity]]), sometimes with a chalice.

  **Famous works**

  - [[artist/jan-van-eyck]], *Saint Barbara* (1437, unfinished, Royal Museum of Fine Arts Antwerp, KMSKA)

  *From:* Golden Legend · Christian
