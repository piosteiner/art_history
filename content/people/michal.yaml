description_md: |-
  Michal, [[person/saul]]'s daughter and [[person/david]]'s first wife, helped David escape by lowering him from a window and putting a household idol (teraphim) in his bed.

  **In art:** A woman helping a man down a rope.

  **Famous works**

  - Gustave Doré, Bible illustrations

  *From:* Hebrew Bible, Books of Samuel · Hebrew Bible
