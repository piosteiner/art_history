occupations: [thaumaturge, preacher]
description_md: |-
  [[person/elijah]]'s successor, who caught his master's cloak as he rose to heaven. He performed many miracles: parting the Jordan, raising a dead child, and curing the general Naaman of leprosy by having him bathe in the river seven times.

  **In art:** A bald prophet receiving a cloak from a chariot of fire, or a soldier bathing in a river.

  **Famous works**

  - Pieter de Grebber, *Elisha Refusing the Gifts of Naaman* (Frans Hals Museum, Haarlem)

  *From:* Hebrew Bible, Books of Kings · Hebrew Bible
