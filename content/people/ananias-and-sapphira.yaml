description_md: |-
  From the *Acts of the Apostles*. Ananias and his wife Sapphira lied to Peter about the money they had given to the church, secretly keeping back part of the price of land they had sold, and both fell dead, Sapphira about three hours after her husband.

  **In art:** A man collapsing before Peter as others watch.

  **Famous works**

  - [[artist/raphael]], *The Death of Ananias* (tapestry cartoon, 1515, Royal Collection, on loan to the V&A, London)

  *From:* New Testament, Acts of the Apostles · Christian
