description_md: |-
  The tragic hero of the Genpei War, the brilliant younger half-brother of the first shogun, who later turned against him and hunted him to his death. As a boy, he was said to have been trained in swordsmanship by the tengu king Sōjōbō on Mount Kurama. He's the master of [[benkei]].

  **In art:** A slender young warrior practising with long-nosed, winged tengu in a mountain forest, or fighting Benkei on Gojō Bridge.

  **Famous works**

  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *Ushiwaka Learns the Martial Arts on Mt. Kurama* (1880)
  - [[artist/kawanabe-kyosai]], *tengu pictures* (e.g. *The Great Tengu Does Calligraphy*, from *Kyōsai hyakuzu*, c. 1863–66)

  *From:* The Tale of the Heike · Japanese
