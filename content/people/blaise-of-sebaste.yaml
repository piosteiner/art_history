description_md: |-
  Blaise, a bishop, saved a boy choking on a fishbone, and his blessing for sore throats uses two crossed candles.

  **In art:** A bishop with two crossed candles.

  **Famous works**

  - *Basilica of the Fourteen Holy Helpers* (Vierzehnheiligen, Bavaria)

  *From:* Golden Legend · Christian
