description_md: |-
  [[person/rebecca]]'s son [[person/jacob]] fell in love with Rachel, also at a well, and worked seven years for her, but her father tricked him into marrying her older sister [[person/leah]] first, so he worked seven more years for Rachel.

  **Famous works**

  - [[artist/dante-gabriel-rossetti]], *Dante's Vision of Rachel and Leah* (Tate)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
