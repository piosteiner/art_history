description_md: |-
  As a young man, he used black magic to take revenge on relatives who stole his family's land, causing a house to collapse and killing many people. Full of regret, he became a disciple of the teacher Marpa, who made him build and tear down stone towers again and again. He meditated in caves, ate only nettles until his skin turned green, and wrote beautiful songs.

  *From:* Tibetan
