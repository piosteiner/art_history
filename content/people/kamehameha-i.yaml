birth: 1736/1761
birth_label: c. 18th century
death: 1819-05-08
description_md: |-
  He united the islands into one kingdom by 1810. As a young man, according to legend, he moved (overturned) the Naha Stone, estimated to weigh 2.5 to 3.5 tons. It had been foretold that whoever moved it would unite the islands. He is famous for his Law of the Splintered Paddle, which protected ordinary people.

  *From:* Hawaiian
