description_md: |-
  His name means "fasting coyote". He lost his kingdom as a teenager and hid in the mountains, then won it back. He became famous as a poet, philosopher, architect and builder of aqueducts and botanical gardens. His face was on the Mexican 100-peso note.

  *From:* Acolhua (Nahua)
