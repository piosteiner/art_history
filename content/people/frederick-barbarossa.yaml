description_md: |-
  The real German emperor [[person/frederick-i-of-prussia|Frederick I]] (died 1190), called Barbarossa for his red beard. Legend says he isn't dead but asleep in a cave in the Kyffhäuser mountains in Thuringia, his beard growing through the stone table, until Germany needs him again.

  **In art:** An old emperor asleep at a table inside a mountain, with ravens circling outside.

  **Famous works**

  - Bruno Schmitz (architect), *Kyffhäuser Monument* (Kyffhäuser, Thuringia, 1890–1896)

  *From:* German legend · German
