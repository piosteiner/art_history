name: Lorenzo Nasi
given_name: Lorenzo
family_name: Nasi
kind: person
description_md: Florentine cloth merchant; the Madonna of the Goldfinch was painted by Raphael for his marriage to Sandra di Matteo Canigiani (23 February 1506)[[source/wikipedia-it-madonna-del-cardellino|„fu realizzato a Firenze per Lorenzo Nasi, ricco commerciante di panni di lana, in occasione del suo matrimonio“]][[source/uffizi-madonna-of-the-goldfinch|“Giorgio Vasari says that the painting was commissioned for the marriage of Lorenzo Nasi with Sandra di Matteo Canigiani, celebrated on 23 February 1506”]]. His house on Costa San Giorgio collapsed in 1547[[source/wikipedia-it-madonna-del-cardellino|„La coppia abitava nella scoscesa Costa San Giorgio e il 12 novembre 1547 l’abitazione franò“]].
