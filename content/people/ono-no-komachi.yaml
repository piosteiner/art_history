description_md: |-
  Ono no Komachi was a 9th-century woman poet famous for her beauty and her cruelty to lovers. In legend, in old age she became a poor, ugly beggar, which made her a Buddhist lesson about impermanence. She is one of the Thirty-Six Immortal Poets (*Sanjūrokkasen*).

  **In art:** An elegant court lady with long hair and twelve-layered robes, or a ragged old woman sitting on a stupa.

  **Famous works**

  - Yashima Gakutei and others, *Ono no Komachi* (surimono prints)

  *From:* Japanese
