description_md: |-
  Clare was [[person/francis-of-assisi]]'s follower who founded the Poor Clares. According to legend, she drove away invading soldiers by holding up the Eucharist.

  **In art:** Clare as a nun holding a monstrance.

  **Famous works**

  - [[artist/simone-martini]], *Saint Clare* (Lower Basilica, Assisi)

  *From:* Golden Legend · Christian
