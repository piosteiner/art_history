description_md: |-
  His great-nephew Octavian defeated Antony and [[person/cleopatra]] and became Augustus, the first Roman emperor.

  **In art:** An idealised young ruler in armour.

  **Famous works**

  - *Augustus of Prima Porta* (Vatican Museums)
  - *Ara Pacis Augustae* (Rome)

  *From:* history · Ancient Roman
