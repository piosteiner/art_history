description_md: |-
  Lot, Abraham's nephew, escaped the destruction of the sinful cities of Sodom and Gomorrah. His wife looked back at the burning city against God's command and was turned into a pillar of salt. Later, his daughters got him drunk and conceived children by him.

  **In art:** A family fleeing a burning city with a woman turning to salt, or an old man with two women and wine, often in a cave.

  **Famous works**

  - [[artist/albrecht-durer]], *Lot and His Daughters* (Washington)
  - Orazio Gentileschi, *Lot and His Daughters* (several versions)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
