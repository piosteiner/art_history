occupations: [preacher]
description_md: |-
  A prophet who fled from God's command and was swallowed by a great fish (later called a whale). After three days, it spat him out alive. Christians saw it as a symbol of Christ's resurrection.

  **In art:** A man being thrown from a ship into the jaws of a sea monster, or spat out on a shore. Very common in early Christian catacomb art.

  **Famous works**

  - [[artist/michelangelo]], *Jonah* (Sistine Chapel ceiling, above the altar)
  - Pieter Lastman, *Jonah and the Whale* (Düsseldorf)

  *From:* Hebrew Bible, Book of Jonah · Hebrew Bible
