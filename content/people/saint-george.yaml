name: Saint George
kind: person
birth: 275
death: 303-04-24
description_md: |-
  A soldier-saint who, according to legend, killed a dragon that was terrorising a town and demanding human sacrifices, saving a princess. Patron saint of England, Georgia, Catalonia and knights.

  **In art:** A knight in armour on a white horse, spearing a dragon, with a princess nearby. A red cross on a white shield or banner.

  **Famous works**

  - [[artist/paolo-uccello]], *Saint George and the Dragon* (National Gallery, London, and Musée Jacquemart-André, Paris)
  - [[artist/raphael]], *Saint George and the Dragon* (Washington and Louvre)
  - [[artist/donatello]], *Saint George* (Bargello)
  - [[artist/vittore-carpaccio]], *Saint George Slaying the Dragon* (Scuola di San Giorgio degli Schiavoni, Venice)

  *From:* Golden Legend · Christian
