birth: 354-11-14
death: 430-08-29
description_md: |-
  A North African bishop and the great theologian of the early Church, author of the *Confessions* and *The City of God*. In legend, he met a child on a beach trying to pour the sea into a hole, showing how impossible it is to understand God completely.

  **In art:** A bishop with a book, a flaming heart, or in his study.

  **Famous works**

  - Botticelli, *Saint Augustine in His Study* (Ognissanti, Florence)
  - [[artist/vittore-carpaccio]], *The Vision of Saint Augustine* (Scuola di San Giorgio degli Schiavoni, Venice)

  *From:* Golden Legend · Christian
