description_md: |-
  Marie-Josephte Corriveau was hanged in 1763 for killing her second husband. Her body was displayed in an iron cage at a crossroads near Quebec City. Legends grew that she'd killed seven husbands and that she haunted travellers from her cage.

  *From:* French-Canadian
