description_md: |-
  Harun (ruled 786–809) appears in many stories, going out at night in disguise with his vizier Ja'far and his executioner Masrur to see how his people lived. Ja'far was real too; Harun had him executed in 803.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
