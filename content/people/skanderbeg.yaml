description_md: |-
  Gjergj Kastrioti (1405–1468) was taken as a hostage by the Ottomans and trained as a commander, where he was given the name Iskender Bey after Alexander the Great. He changed sides, returned home, and resisted the Ottoman Empire for 25 years. His goat-headed helmet is in a Vienna museum.

  *From:* Albanian
