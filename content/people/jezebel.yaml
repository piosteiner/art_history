description_md: |-
  Jezebel was the wicked wife of King Ahab, who persecuted the prophets, and was thrown from a window and eaten by dogs.

  **In art:** A painted queen at a window.

  **Famous works**

  - John Liston Byam Shaw, *Jezebel* (1896, Russell-Cotes Art Gallery & Museum, Bournemouth)
  - Gustave Doré, Bible illustrations

  *From:* Hebrew Bible, Books of Kings · Hebrew Bible
