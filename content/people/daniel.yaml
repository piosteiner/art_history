occupations: [religious leader, prophet]
description_md: |-
  A Jewish noble at the court of Babylon, famous for interpreting dreams. When he kept praying to God despite a royal ban, he was thrown into a den of lions, but an angel shut their mouths. He also read the mysterious writing that appeared on the wall at King Belshazzar's feast, predicting the fall of Babylon ("the writing on the wall").

  **In art:** A man praying calmly among lions, or a terrified king at a banquet as a hand writes glowing words on the wall.

  **Famous works**

  - Rubens, *Daniel in the Lions' Den* (Washington)
  - [[artist/rembrandt]], *Belshazzar's Feast* (National Gallery, London)

  *From:* Hebrew Bible, Book of Daniel · Hebrew Bible
