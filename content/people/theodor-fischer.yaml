description_md: |-
  Art dealer and gallery owner in Lucerne, of the [[institution/galerie-fischer]] [[source/proveana-theodor-fischer]]. In 1942 he offered [[person/emil-georg-buhrle]] a share in the Coray collection of Old Masters, which Bührle had bought to sell at a profit, and sold him French Impressionists in turn [[source/buehrle-ch-the-collection]].

  On 30 June 1939, at the Grand Hôtel National in Lucerne, he auctioned 125 works of "degenerate art" confiscated from German museums, on behalf of Goebbels's commission for their "utilisation". The sale was meant to raise foreign currency from international buyers, who were assured that the proceeds would not go to rearmament; French works — Gauguin, Van Gogh, Picasso — fetched good prices, while German ones went cheaply, and Van Gogh's self-portrait was by far the most expensive lot at 175,000 Swiss francs.[[source/peters-2017|pp. 28–29]] One commentator saw "the gleeful atmosphere of a shooting match" among the bargain hunters.[[source/hermand-1994|p. 40]]
