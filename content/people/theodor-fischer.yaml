name: Theodor Fischer
given_name: Theodor
family_name: Fischer
description_md: Art dealer and gallery owner in Lucerne, of the [[institution/galerie-fischer]] [[source/proveana-theodor-fischer]]. In 1942 he offered [[person/emil-georg-buhrle]] a share in the Coray collection of Old Masters, which Bührle had bought to sell at a profit, and sold him French Impressionists in turn [[source/buehrle-ch-the-collection]].
