description_md: |-
  The mother of the emperor Constantine, who travelled to Jerusalem and, according to legend, found the True Cross on which Christ was crucified.

  **In art:** A crowned empress holding a large cross, sometimes with nails.

  **Famous works**

  - [[artist/piero-della-francesca]], *The Legend of the True Cross* (San Francesco, Arezzo) — [[artwork/history-of-the-true-cross-arezzo]]
  - [[artist/paolo-veronese]], *The Vision of Saint Helena* (National Gallery, London)

  *From:* Golden Legend · Christian
