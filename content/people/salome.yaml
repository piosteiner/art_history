description_md: |-
  The daughter of Herodias. She danced so beautifully for her stepfather King Herod that he promised her anything. Prompted by her mother, she asked for the head of [[person/john-the-baptist]] on a platter.

  **In art:** A young woman dancing, or holding a platter with a severed head. A favourite subject of the Symbolists.

  **Famous works**

  - Gustave Moreau, *The Apparition* (Musée d'Orsay)
  - [[artist/titian]], *Salome* (Galleria Doria Pamphilj)
  - [[artist/caravaggio]], *Salome with the Head of John the Baptist* (National Gallery, London)
  - Aubrey Beardsley, illustrations for [[person/oscar-wilde]]'s *Salome*

  *From:* New Testament, Gospels · Christian
