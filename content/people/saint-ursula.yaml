birth: 4th century
death: 385
description_md: |-
  A British princess who went on a pilgrimage to Rome with, according to legend, eleven thousand virgin companions. On the way back, they were all massacred by the Huns at Cologne.

  **In art:** A crowned princess sheltering many young women under her cloak, holding an arrow, or scenes of ships and a massacre.

  **Famous works**

  - [[artist/vittore-carpaccio]], *Legend of Saint Ursula* cycle (Accademia, Venice)
  - [[artist/hans-memling]], *Shrine of Saint Ursula* (Memling Museum, Old St John's Hospital, Bruges)

  *From:* Golden Legend · Christian
