description_md: |-
  ## Life

  Benito Mussolini was born on 29 July 1883 in Dovia di Predappio in Romagna and was executed by partisans on 28 April 1945 [[source/wikipedia-en-benito-mussolini|§ Introduction]] [[source/wikipedia-en-benito-mussolini|§ Early life]]. A journalist for the socialist paper *Avanti!*, he was expelled from the Italian Socialist Party for advocating intervention in World War I, founded the interventionist newspaper *Il Popolo d'Italia* in 1914 and served in the army until he was wounded in 1917 [[source/wikipedia-en-benito-mussolini|§ Introduction]] [[source/wikipedia-en-benito-mussolini|§ Beginning of Fascism and service in World War I]]. In 1919 he founded the Fasci Italiani di Combattimento, reorganised in 1921 as the National Fascist Party (PNF) [[source/wikipedia-en-benito-mussolini|§ Introduction]]. After the [[event/march-on-rome|March on Rome]], King Victor Emmanuel III appointed him prime minister on 30 October 1922 [[source/wikipedia-en-march-on-rome|§ Introduction]]. As "Il Duce" he turned Italy into a one-party state and totalitarian dictatorship; he governed until his deposition in July 1943 and then headed the Italian Social Republic, a puppet state of Nazi Germany, until 1945 [[source/wikipedia-en-benito-mussolini|§ Introduction]]. From 22 September 1938 his government issued the Racial Laws against Italian Jews and the Empire's Black subjects [[source/wikipedia-en-benito-mussolini|§ Foreign policy]].

  The term "totalitarianism" was coined in 1923 by the journalist Giovanni Amendola for Mussolini's politics [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 2]]. In 1925 Mussolini adopted it for his regime and defined Fascism on the third anniversary of the March as a system in which "everything [that happens] is done for the state, nothing is outside the state, nothing and no one is against the state" [[source/wikipedia-en-benito-mussolini|§ Consolidation of power]]. [[person/hannah-arendt|Hannah Arendt]] judged that even Mussolini "did not attempt to establish a full-fledged totalitarian regime and contented himself with dictatorship and one-party rule" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 4]].

  ## Art and the image of the Duce

  At the opening of the exhibition *Sette Pittori del Novecento* in Milan on 26 March 1923, Mussolini declared: "it is far from my idea to encourage anything like an art of the State. Art belongs to the domain of the individual." [[source/braun-2000|p. 1]]. Emily Braun argues that he never sanctioned an official style; the regime's mix of administrative control, coercion and tolerance produced a pluralism that drew most artists to coexist with, or openly support, the regime [[source/braun-2000|pp. 1–2]]. He repeatedly called himself an artist and politics an art [[source/braun-2000|p. 7]]. In Fascist discourse and in Mussolini's identification with the Emperor Augustus, the cult of Rome ([[romanita]]) was joined with activism and the cult of youth; his renovations of Rome stripped the Colosseum and the Pantheon of later additions, and in 1925 he demanded that everything "grown up in the centuries of decadence must be swept away" [[source/antliff-2002|p. 152]].

  From 1926 the party fostered his cult: "Mussolini is always right" became a common phrase, and millions of photographs showed him in characteristic poses, often bare-chested while swimming or harvesting [[source/wikipedia-en-benito-mussolini|§ Consolidation of power]]. Artists took up the image — [[artist/adolfo-wildt|Adolfo Wildt]]'s mask ([[artwork/wildt-maschera-di-mussolini]]), shown on the first anniversary of the March in 1923 [[source/manchester-wildt-maschera-di-mussolini]], [[artist/basilio-cascella|Basilio Cascella]]'s [[artwork/cascella-mussolini-harvesting-wheat|Mussolini Harvesting Wheat]] (1939) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]] and [[artist/mario-sironi|Mario Sironi]]'s horseman with the letters DVX ([[artwork/sironi-dux-illustration-1937]]) [[source/steiner-2025-mario-sironi|p. 5]]. Sironi was for over two decades chief caricaturist of Mussolini's *Il Popolo d'Italia* [[source/braun-2000|p. 8]]; Mussolini called him one "who would never betray" him, and said he would have made him an academician were it not for the uproar [[source/braun-2000|p. 10]].

  In late October 1926 Mussolini proclaimed the aim of rendering "unrecognisable both spiritually and physically the face of the nation" within ten years and creating a "new Italian" ([[new-man]]) [[source/dagnino-2016|p. 139]]. He co-wrote the *Dottrina del fascismo* (1932) with Giovanni Gentile [[source/dagnino-2016|p. 141]], and in October 1938 named the bourgeoisie the first enemy of the revolution [[source/dagnino-2016|p. 143]]. On 29 January 1940, according to Galeazzo Ciano, he complained that the Italians were "a race of sheep" whom eighteen years of rule had not transformed [[source/dagnino-2016|p. 147]].

  He opened the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] on 28 October 1932 [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Introduction]]. In 1932 he put [[person/marcello-piacentini|Marcello Piacentini]] in charge of the plans for the Città universitaria in Rome [[source/wikipedia-en-marcello-piacentini|§ Fascist period]], and on 28 October 1935 he spoke there under Sironi's [[artwork/sironi-italia-fra-le-arti-e-le-scienze|L'Italia fra le Arti e le Scienze]] [[source/steiner-2025-mario-sironi|pp. 6–7]]; it was to the "head of government" that Piacentini proposed Sironi for the mural [[source/sapienza-2017-sironi-restauro|p. 2]].
