name: Tutankhamun
description_md: |-
  He became king at about 9 and died at about 19. His tomb was discovered by Howard Carter in 1922, full of treasures, including his golden mask. When Lord Carnarvon, who paid for the dig, died soon afterwards, newspapers invented the "curse of the pharaohs".

  *From:* Ancient Egyptian
