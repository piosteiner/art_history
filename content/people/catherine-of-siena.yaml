description_md: |-
  Catherine of Siena was a 14th-century mystic who received the stigmata (visible, at her request, only to herself) and helped persuade the Pope to return from Avignon to Rome.

  **In art:** Catherine of Siena in a Dominican habit with a lily, a crown of thorns or the stigmata.

  **Famous works**

  - Giovanni di Paolo, *Life of Saint Catherine of Siena* panels (Metropolitan Museum and elsewhere)

  *From:* Golden Legend · Christian
