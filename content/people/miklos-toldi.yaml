description_md: |-
  He was a real 14th-century knight who became a legend in János Arany's poem. He could hold a heavy well-pole out straight in one hand and hurl a piece of millstone. He killed two wolves with his bare hands and beat a bragging Czech knight in a duel.

  *From:* János Arany, Toldi trilogy · Hungarian
