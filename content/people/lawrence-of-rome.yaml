birth: 225-12-31
death: 258-08-10
description_md: |-
  A deacon of Rome martyred in 258, according to tradition by being roasted alive on a gridiron. According to legend ([[person/ambrose]]; the Golden Legend), he joked to his persecutor, "Turn me over, I'm done on this side."

  **In art:** A young deacon in a rich vestment (*dalmatic*) holding a gridiron.

  **Famous works**

  - [[artist/titian]], *The Martyrdom of Saint Lawrence* (Gesuiti, Venice, and El Escorial)
  - Bernini, *The Martyrdom of Saint Lawrence* (Uffizi, Florence)

  *From:* Golden Legend · Christian
