description_md: |-
  Songtsen Gampo (7th century) united Tibet. According to tradition, his Chinese wife, [[person/princess-wencheng]], and his Nepali wife, Princess [[person/bhrikuti]], brought Buddhism and famous Buddha statues to Lhasa, where they're kept in the Jokhang and Ramoche temples.

  *From:* Tibetan
