description_md: |-
  A Roman soldier and secret Christian. When discovered, he was tied to a tree or post and shot with arrows, but survived and was nursed back to health by Saint Irene, before being clubbed to death. Invoked against the plague.

  **In art:** A beautiful nearly nude young man tied to a column or tree, pierced by arrows. One of the few acceptable nude male subjects in Christian art.

  **Famous works**

  - [[artist/andrea-mantegna]], *Saint Sebastian* (Louvre, Vienna and Ca' d'Oro)
  - [[artist/antonello-da-messina]], *Saint Sebastian* (Dresden)
  - [[artist/guido-reni]], *Saint Sebastian* (Capitoline Museums and Genoa)
  - Georges de La Tour, *Saint Sebastian Tended by Irene* (Louvre)

  *From:* Golden Legend · Christian
