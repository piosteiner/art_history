occupations: [politician, monarch]
description_md: |-
  The first king of Israel. Tormented by dark moods, he was soothed by the young [[person/david]] playing the harp, but grew jealous of him and threw a spear at him. Before his last battle, he secretly consulted the Witch of Endor, who summoned the ghost of the prophet Samuel.

  **In art:** A brooding king listening to a youth playing a harp, or a witch raising a ghost.

  **Famous works**

  - [[artist/rembrandt]], *Saul and David* (Mauritshuis)
  - [[artist/salvator-rosa]], *Saul and the Witch of Endor* (Louvre)
  - [[artist/william-blake]], *The Witch of Endor Raising the Spirit of Samuel* (1783, New York Public Library)

  *From:* Hebrew Bible, Books of Samuel · Hebrew Bible
