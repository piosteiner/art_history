description_md: |-
  Charlemagne was the real Frankish emperor (crowned AD 800), who became a legendary figure. In the *Song of Roland*, his nephew [[roland]] died fighting a huge army at the pass of Roncevaux.

  **In art:** An emperor with a crown, orb and sword.

  **Famous works**

  - [[artist/albrecht-durer]], *Emperor Charlemagne* (Nuremberg)

  *From:* The Song of Roland · Frankish
