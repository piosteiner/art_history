description_md: |-
  Vlad III (1428/31 – 1476/77) fought the Ottoman Empire and was famous for impaling his enemies on stakes. His father belonged to the Order of the Dragon (*Dracul*), so he was called Drăculea, "son of the Dragon". Bram Stoker used the name for his vampire in 1897. In Romania, many people see him as a hero who defended his country.

  *From:* Romanian
