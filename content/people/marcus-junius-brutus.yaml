description_md: |-
  Marcus Junius Brutus was one of the assassins of [[person/julius-caesar]] in 44 BC.

  **In art:** Caesar's assassination.

  **Famous works**

  - [[artist/michelangelo]], *Brutus* (bust, Bargello)
  - [[person/vincenzo-camuccini]], *The Death of Julius Caesar* (Naples)

  *From:* history · Ancient Roman
