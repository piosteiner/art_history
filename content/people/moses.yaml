occupations: [military leader, religious leader, legislator, thaumaturge, herder, ruler]
description_md: |-
  Born to Hebrew parents in Egypt, where the Israelites were enslaved, he was set adrift on the Nile in a basket and found by the Pharaoh's daughter. God spoke to him from a burning bush and sent him to free his people. After ten plagues struck Egypt, he led the Israelites out, parted the Red Sea, and on Mount Sinai received the Ten Commandments. When he came down, he found the people worshipping a Golden Calf and smashed the stone tablets.

  **In art:** A bearded old man holding two stone tablets, often with two horns or rays of light on his head (from the Latin Vulgate's rendering of the Hebrew word qaran, "shone", as "horned"). Also as a baby in a basket among the reeds.

  **Famous works**

  - [[artist/michelangelo]], *Moses* (San Pietro in Vincoli, Rome)
  - [[artist/rembrandt]], *Moses Breaking the Tablets of the Law* (Berlin)
  - [[artist/nicolas-poussin]], *The Finding of Moses* (Louvre)
  - [[artist/sandro-botticelli]], *The Trials of Moses* (Sistine Chapel wall)

  *From:* Hebrew Bible, Exodus · Hebrew Bible
