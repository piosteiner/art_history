description_md: |-
  The warrior Kumagai Naozane beheaded the young Taira flute player Atsumori, then became a monk out of grief.

  **In art:** A warrior calling back a young rider from the sea.

  **Famous works**

  - *Battle of Ichi-no-Tani* (screens, various, Edo period)

  *From:* The Tale of the Heike · Japanese
