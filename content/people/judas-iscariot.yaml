description_md: |-
  The apostle who betrayed Jesus for thirty pieces of silver. Filled with remorse, he hanged himself (Matthew; Acts tells of a different death).

  **In art:** Often shown in yellow, with red hair, holding a money bag, sitting apart at the [[last-supper]], or hanging from a tree.

  **Famous works**

  - [[artist/giotto]], *The Kiss of Judas* (Scrovegni Chapel)
  - [[artist/rembrandt]], *Judas Returning the Thirty Silver Pieces* (private collection)

  *From:* New Testament, Gospels · Christian
