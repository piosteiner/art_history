description_md: |-
  The son of a rich merchant who gave up everything to live in poverty, founding the Franciscan order around 1209. He preached to the birds, and on Mount La Verna received the *stigmata*, the wounds of Christ on his own body.

  **In art:** A monk in a brown habit tied with a knotted rope, showing wounds on his hands and feet, preaching to birds, or kneeling as a winged seraph shines rays onto him.

  **Famous works**

  - [[artist/giotto]] (attributed), *Legend of Saint Francis* cycle (Upper Basilica, Assisi)
  - [[artist/giovanni-bellini]], *Saint Francis in the Desert* (Frick Collection)
  - [[artist/caravaggio]], *Saint Francis of Assisi in Ecstasy* (Wadsworth Atheneum, Hartford)

  *From:* Golden Legend · Christian
