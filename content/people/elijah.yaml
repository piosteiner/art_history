occupations: [thaumaturge, prophet]
description_md: |-
  A prophet who challenged the priests of Baal, was fed by ravens in the desert, and was taken up to heaven alive in a whirlwind, with a chariot and horses of fire (in art he rides the chariot).

  **In art:** An old prophet fed by a raven, or rising into the sky in a flaming chariot.

  **Famous works**

  - Washington Allston, *Elijah in the Desert* (Boston)
  - Giovanni Girolamo Savoldo, *Elijah Fed by the Raven* (Washington)

  *From:* Hebrew Bible, Books of Kings · Hebrew Bible
