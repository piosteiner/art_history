name: Xuanzang
kind: person
birth: 602-04-06
death: 664-03-07
description_md: |-
  Xuanzang was a real 7th-century monk who travelled to India to bring back Buddhist scriptures. In the 16th-century novel *Journey to the West*, he's escorted by three magical disciples: the Monkey King [[sun-wukong]], the greedy pig Zhu Bajie, and the quiet river monster Sha Wujing (see the appendix for Sun Wukong).

  **In art:** A monk in a pilgrim's backpack frame with a parasol and a lamp, or a monk on a white horse with a monkey, a pig and a bearded monk.

  **Famous works**

  - *Portrait of Xuanzang carrying scriptures* (hanging scroll, colour on silk, Kamakura period, 14th century, Tokyo National Museum)
  - *Long Corridor paintings* (Summer Palace)
  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *Jade Rabbit — Sun Wukong* (from *One Hundred Aspects of the Moon*)

  *From:* Journey to the West · Chinese Buddhist
