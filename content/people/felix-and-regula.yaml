description_md: |-
  Saint Felix and Saint Regula, patron saints of Zurich, who according to legend were beheaded on the banks of the Limmat and carried their own heads up the hill to where the Grossmünster now stands.

  **In art:** Felix and Regula holding their heads, often with their servant Exuperantius.

  **Famous works**

  - Hans Leu the Elder, *Panorama of Zurich with Felix and Regula* (Swiss National Museum, Zurich)

  *From:* Zurich legend · Christian
