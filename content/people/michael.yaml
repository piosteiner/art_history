description_md: |-
  The leader of the heavenly armies, who cast Satan out of heaven and weighs souls at the [[last-judgement]].

  **In art:** A winged angel in armour with a sword or spear, trampling a dragon or devil, or holding scales.

  **Famous works**

  - [[artist/raphael]], *Saint Michael Vanquishing Satan* (Louvre)
  - [[artist/guido-reni]], *Saint Michael the Archangel* (Santa Maria della Concezione, Rome)

  *From:* Bible; Christian tradition · Christian
