public_id: 122803
name: Catherine of Alexandria
kind: person
birth: 287
death: 305
description_md: |-
  A learned princess who defeated fifty philosophers in debate and refused the emperor's offer to make her his queen. She was condemned to be broken on a spiked wheel, which shattered when she touched it, so she was beheaded instead. The firework "Catherine wheel" is named after her.

  **In art:** A crowned princess with a broken spiked wheel, a sword and a book, sometimes receiving a ring from the Christ child (her "mystic marriage").

  **Famous works**

  - [[artist/caravaggio]], *Saint Catherine of Alexandria* (Thyssen-Bornemisza, Madrid)
  - [[artist/raphael]], *Saint Catherine of Alexandria* (National Gallery, London)
  - Correggio, *The Mystic Marriage of Saint Catherine* (Louvre)

  *From:* Golden Legend · Christian
