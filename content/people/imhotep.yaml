description_md: |-
  He is credited with building the first pyramid, the Step Pyramid of Djoser, about 2650 BC. Two thousand years later, the Egyptians worshipped him as a god of medicine, and the Greeks identified him with [[asclepius]].

  *From:* Ancient Egyptian
