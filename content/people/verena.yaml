description_md: |-
  Verena was a holy woman from the Theban Legion's circle who lived as a hermit near Solothurn and at Zurzach in Aargau, where she cared for the sick.

  **In art:** Verena with a comb and a water jug.

  **Famous works**

  - Verena Gorge (*Verenaschlucht*, near Solothurn)

  *From:* Golden Legend · Christian
