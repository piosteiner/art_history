description_md: |-
  A popular 13th-century Franciscan preacher. When heretics in Rimini refused to listen, he preached to the fish, who lifted their heads from the water to listen. Patron saint of lost things.

  **In art:** A young Franciscan monk holding the infant Christ and a lily, or preaching to fish.

  **Famous works**

  - [[artist/bartolome-esteban-murillo]], *The Vision of Saint Anthony of Padua* (Seville Cathedral)
  - [[artist/donatello]], high altar of the *Basilica of Saint Anthony* (Padua)

  *From:* Golden Legend · Christian
