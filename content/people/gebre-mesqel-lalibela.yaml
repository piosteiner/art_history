description_md: |-
  In about 1200, King Lalibela had eleven churches carved downwards into the living rock to make a "New Jerusalem". According to legend, a swarm of bees surrounded him as a newborn, which his mother took as a sign of his future power. People say angels helped carve the churches at night.

  *From:* Ethiopian
