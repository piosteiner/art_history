description_md: |-
  Jephthah vowed that if he won a battle, he would sacrifice the first thing to come out of his house. When he returned, his only daughter ran out to greet him, dancing.

  **In art:** A girl dancing with a tambourine before a horrified father.

  **Famous works**

  - [[artist/charles-le-brun]], *The Sacrifice of Jephthah* (Uffizi)

  *From:* Hebrew Bible, Judges · Hebrew Bible
