occupations: [Catholic priest, founder of Catholic religious community, friar]
birth: c. 1170
death: 1221-08-13
description_md: |-
  Dominic founded the Dominican order of preachers in 1216. Before he was born, his mother dreamed of a dog carrying a burning torch. The Dominicans' Latin name was punned into *Domini canes*, "the hounds of the Lord".

  **In art:** Dominic in a black and white habit, with a star on his forehead and a dog with a torch.

  **Famous works**

  - [[artist/fra-angelico]], *Saint Dominic Adoring the Crucifixion* (San Marco, Florence)

  *From:* Golden Legend · Christian
