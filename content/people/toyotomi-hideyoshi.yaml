description_md: Of a family so low among the samurai that they were virtually peasants, he rose from foot soldier under Oda Nobunaga to unify the country (1591), with the help of Tokugawa Ieyasu, and took the title of taikō in 1592. In the same year he launched the first of two invasions of the Joseon kingdom of Korea ([[event/japanese-invasions-of-korea]]), both unsuccessful, which devastated Korea's cities and countryside; among the many thousands brought back as booty were hundreds of Korean potters, to whom the great advances in ceramics — porcelain above all — of the Edo period are due. He rebuilt Kyoto and had Sen no Rikyū as his tea master. [[source/history-of-japanese-art|p. 236]]
