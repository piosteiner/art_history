death: 1551
description_md: |-
  A Nahua girl who was sold or kidnapped into slavery among the Maya, so she spoke both languages. She was given to the Spanish in 1519 and became Cortés's interpreter, advisor and the mother of his son. In Mexico, she's seen both as a traitor and as a survivor and the mother of the Mexican people.

  *From:* Nahua
