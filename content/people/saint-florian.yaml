description_md: |-
  Florian, a Roman soldier drowned in the river Enns, is the patron saint of firefighters.

  **In art:** Florian as a Roman soldier pouring water on a burning house.

  **Famous works**

  - Albrecht Altdorfer, *Saint Florian* altarpiece panels (Florence and Nuremberg)

  *From:* Golden Legend · Christian
