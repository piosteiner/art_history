name: John the Baptist
given_name: John the
family_name: Baptist
kind: person
birth: c. 6 BCE
death: c. 30
description_md: |-
  Jesus's cousin, a prophet who lived in the desert, preached repentance and baptised people in the river Jordan, including Jesus. He was beheaded by King [[person/herod-antipas]] at the request of [[person/salome]].

  **In art:** A wild figure in a camel-hair tunic with a thin reed cross, often pointing upwards, with a lamb and a scroll reading *Ecce Agnus Dei* ("Behold the Lamb of God"). Patron saint of Florence.

  **Famous works**

  - [[artist/leonardo-da-vinci]], *Saint John the Baptist* (Louvre) — [[artwork/saint-john-the-baptist]]
  - [[artist/caravaggio]], *The Beheading of Saint John the Baptist* (Valletta Cathedral, his only signed work)
  - [[artist/donatello]], *Saint John the Baptist* (Bargello)

  *From:* New Testament, Gospels · Christian
