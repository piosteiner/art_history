description_md: |-
  Benedict, by a later tradition the twin brother of [[person/scholastica]], is called the father of Western monasticism. Benedict wrote the *Rule of Saint Benedict* around 530 and founded Monte Cassino. Monks who resented his strict rule tried to poison his wine, but the cup shattered when he blessed it.

  **In art:** A monk in a black habit with a book of the Rule, a broken cup with a snake, or a raven.

  **Famous works**

  - [[artist/luca-signorelli]] and Sodoma, *Life of Saint Benedict* frescoes (Monte Oliveto Maggiore, Tuscany)

  *From:* Gregory the Great, Dialogues · Christian
