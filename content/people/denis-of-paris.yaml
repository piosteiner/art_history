birth: 3rd century
death: c. 250
description_md: |-
  The first bishop of Paris, beheaded on Montmartre ("mountain of martyrs", the popular derivation; the name may instead come from Mons Martis). According to legend, he picked up his own head and walked several miles, preaching a sermon.

  **In art:** A bishop holding his own severed head.

  **Famous works**

  - Portal sculptures at Notre-Dame de Paris
  - Henri Bellechose, *The Altarpiece of Saint Denis* (Louvre)

  *From:* Golden Legend · Christian
