description_md: |-
  [[person/jacob]] fell in love with [[person/rachel]] and worked seven years for her, but her father tricked him into marrying her older sister Leah first, so he worked seven more years for Rachel.

  **Famous works**

  - [[artist/dante-gabriel-rossetti]], *Dante's Vision of Rachel and Leah* (Tate)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
