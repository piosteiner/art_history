occupations: [presbyter, Catholic bishop]
description_md: |-
  Two of the Fourteen Holy Helpers, a group of saints invoked together, especially in Germany. Erasmus (Elmo), patron of sailors, had his intestines wound out on a windlass, according to the traditional account.

  **In art:** A bishop with a windlass winding his intestines.

  **Famous works**

  - [[artist/nicolas-poussin]], *The Martyrdom of Saint Erasmus* (Vatican Pinacoteca)
  - *Basilica of the Fourteen Holy Helpers* (Vierzehnheiligen, Bavaria)

  *From:* Golden Legend · Christian
