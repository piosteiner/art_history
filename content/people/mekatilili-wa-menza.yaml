description_md: |-
  In 1913–1914, she rallied the Giriama people to resist British colonial taxes and forced labour, dancing the *kifudu* funeral dance to call people to a meeting. She was arrested in October 1913 and exiled to Kisii; some accounts say she escaped and walked over 1,000 kilometres home (colonial records say she returned five years later).

  *From:* Giriama (Mijikenda)
