public_id: 125262
name: Saint Anne
kind: person
birth: c. 55 BCE
death: c. 12
description_md: |-
  The parents of the [[person/mary|Virgin Mary]], according to tradition. After many years of childlessness, they were told by an angel they would have a child, and met joyfully at the Golden Gate of Jerusalem.

  **In art:** An older couple embracing at a city gate, or Anne holding Mary, who holds the infant Jesus (*Anna Selbdritt*, popular in German art).

  **Famous works**

  - [[artist/giotto]], *Meeting at the Golden Gate* (Scrovegni Chapel)
  - [[artist/leonardo-da-vinci]], *The Virgin and Child with Saint Anne* (Louvre) and the *Burlington House Cartoon* (National Gallery, London) — [[artwork/the-virgin-and-child-with-saint-anne]]

  *From:* Christian tradition (Protoevangelium of James); Golden Legend · Christian
