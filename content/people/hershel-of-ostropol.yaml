description_md: |-
  A real 18th-century jester from Ukraine who became the hero of many Yiddish jokes. Poor but clever, he fooled rich misers and pompous people. Once, he told an innkeeper's wife that if he didn't feed him, he'd "do what his father did". Frightened, she fed him, then asked what his father had done. "He went to bed hungry," said Hershele.

  *From:* Jewish (Yiddish, Ukraine)
