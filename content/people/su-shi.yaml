description_md: |-
  Su Dongpo (1037–1101) wrote the famous *Odes on the Red Cliff* after a boat trip by moonlight.

  **In art:** A small boat at night below a towering cliff.

  **Famous works**

  - Wu Yuanzhi, *Red Cliff* (National Palace Museum, Taipei)
  - Qiao Zhongchang, *Illustration to the Second Prose Poem on the Red Cliff* (Nelson-Atkins Museum)

  *From:* Chinese
