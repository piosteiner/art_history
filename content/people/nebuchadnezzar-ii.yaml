description_md: |-
  The Babylonian king who destroyed Jerusalem. When three young Jews, [[shadrach-meshach-and-abednego]], refused to worship his golden statue, he had them thrown into a blazing furnace, but they walked unharmed in the flames with an angel. Later, he went mad and lived like an animal, eating grass.

  **In art:** A wild, naked, crawling king with long hair and claws.

  **Famous works**

  - [[artist/william-blake]], *Nebuchadnezzar* (Tate)

  *From:* Hebrew Bible, Book of Daniel · Babylonian (biblical)
