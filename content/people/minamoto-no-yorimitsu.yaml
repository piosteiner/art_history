description_md: |-
  The hero Minamoto no Raikō (Yorimitsu) and his four companions (including [[kintaro]]) disguised themselves as mountain priests (yamabushi), drugged [[shuten-doji]] with poisoned sake and cut off his head. Raikō also killed the giant earth spider *Tsuchigumo*.

  **In art:** Warriors fighting a giant spider in a web, or a demon's head biting a warrior's helmet.

  **Famous works**

  - [[artist/kano-motonobu]], *Shuten-dōji emaki* (Suntory Museum of Art)
  - [[artist/utagawa-kuniyoshi]], *Minamoto Raikō and the Earth Spider*

  *From:* folklore · Japanese
