name: Saint Peter
kind: person
birth: -1
death: 11 October 64 – 68
description_md: |-
  A fisherman who became the leader of the apostles, the "rock" on which Christ built his Church. Considered the first Pope. According to tradition, he was crucified upside down in Rome, because he didn't feel worthy to die the same way as Christ.

  **In art:** An old man with short white curly hair and beard, holding two keys (the keys of heaven), sometimes with a rooster. Shown crucified upside down.

  **Famous works**

  - [[artist/caravaggio]], *The Crucifixion of Saint Peter* (Santa Maria del Popolo, Rome)
  - [[artist/masaccio]], *The Tribute Money* (Brancacci Chapel)
  - [[artist/pietro-perugino]], *Delivery of the Keys* (Sistine Chapel)

  *From:* New Testament, Gospels · Christian
