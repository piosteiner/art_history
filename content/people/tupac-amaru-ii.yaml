description_md: |-
  The first Túpac Amaru was the last Inca ruler, executed by the Spanish in 1572. Two hundred years later, José Gabriel Condorcanqui took his name and led the largest uprising against Spanish rule before the wars of independence (1780–1781). The rapper Tupac Shakur was named after Túpac Amaru II.

  *From:* Andean (Quechua)
