description_md: |-
  Bernhard Rust, born in Hanover, took a doctorate in German philology and philosophy and taught at Hanover's Ratsgymnasium; a severe head wound in the First World War left lasting impairments. After the war he led a citizens' militia, took part in the Kapp Putsch and belonged to völkisch and antisemitic leagues. He was Gauleiter of Hanover and Brunswick from 1925 to 1940, became Prussian Minister for Science, Culture and Public Education on 2 February 1933 and then Reich Minister of Science, Education and National Culture, issuing decree after decree to steep German schooling in Nazi ideology.[[source/wikipedia-en-bernhard-rust|introduction; § Life before politics; § Political career]]

  In art policy he was one of the rival centres of power. Hitler's decree of 30 June 1937, which let [[artist/adolf-ziegler|Adolf Ziegler]] impound "degenerate" art in the museums, bypassed Rust's ministry, which was merely informed; it also checked an earlier move by Göring, who had issued a decree to Rust.[[source/peters-2017|p. 17 and n. 33]] [[person/joseph-goebbels|Goebbels]], who attacked Rust repeatedly, wanted the art professors under him dismissed in June 1937; Rust in turn gave the painter Walter Hansen — one of the two amateurs behind the first "degenerate art" display of 1937 — the chance to build up an archive of degenerate art.[[source/peters-2017|pp. 20, 22]]
