description_md: "Lawyer; director of the Rheinisch-Westfälische Elektrizitätswerke (board 1912–1945), chairman of the Folkwang-Museums-Verein 1959–1969. Collector (Nolde, Beckmann, Feininger), Essen[[source/hamburger-kunsthalle-hk-5161|„Ernst Henke war studierter Jurist und Direktor der Rheinisch-Westfälischen Elektrizitätswerke. Hier war er von 1912 bis 1945 Vorstandsmitglied … Vorsitzender des Folkwang-Museums-Vereins von 1959 bis 1969 … In seiner Sammlung befanden sich u.a. Werke von Emil Nolde und Max Beckmann. Laut Hans Hess, Lyonel Feininger, Stuttgart 1959 … besaß Ernst Henke auch das Werk „Rosa Wolke““ · Provenienz: „Henke (1881 – 1974), Essen“]]."
