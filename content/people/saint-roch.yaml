birth: c. 1293
death: 1327-08-24
description_md: |-
  A 14th-century pilgrim who cared for plague victims and caught the plague himself. He hid in the woods, where a dog brought him bread each day. Invoked against the plague, along with Sebastian.

  **In art:** A pilgrim with a staff and scallop shell, lifting his robe to show a plague sore on his thigh, with a dog holding bread.

  **Famous works**

  - Tintoretto, *Saint Roch* scenes (church of San Rocco, beside the Scuola Grande di San Rocco, Venice)

  *From:* Golden Legend · Christian
