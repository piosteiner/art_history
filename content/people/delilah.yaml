description_md: |-
  The Philistines bribed [[person/samson]]'s lover Delilah to discover his secret, and she had his hair cut while he slept.

  **In art:** A strong man asleep in a woman's lap as his hair is cut.

  **Famous works**

  - Rubens, *Samson and Delilah* (National Gallery, London)
  - [[artist/andrea-mantegna]], *Samson and Delilah* (National Gallery, London)

  *From:* Hebrew Bible, Judges · Hebrew Bible
