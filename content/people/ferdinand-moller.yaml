description_md: |-
  Ferdinand Möller ran an art gallery in Berlin. In the summer of 1933 his gallery showed "30 German Artists", with works by [[artist/emil-nolde|Emil Nolde]] among others, organised by the young National Socialists Otto Andreas Schreiber and Hans Weidemann, Goebbels's assistant; the provocative show renewed the quarrel between [[person/joseph-goebbels|Goebbels]] and [[person/alfred-rosenberg|Rosenberg]] over modern art.[[source/fulda-soika-2014|p. 188]]

  From 1938 he was one of the four dealers employed by the commission for the "utilisation" of degenerate art, with [[person/hildebrand-gurlitt|Hildebrand Gurlitt]], [[person/karl-buchholz|Karl Buchholz]] and [[person/bernhard-a-bohmer|Bernhard A. Böhmer]], to sell or exchange confiscated works abroad for a commission of 10 to 25 percent — work whose morality, Peters notes, is disputed to this day.[[source/peters-2017|p. 26]] Against the rules, he is known to have sold a number of the works to buyers inside Germany or to have kept them himself.[[source/wikipedia-de-karl-buchholz-kunsthandler|§ Leben]]
