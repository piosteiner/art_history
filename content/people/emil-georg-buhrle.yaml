description_md: |-
  Born in Pforzheim, he studied philology and art history in Freiburg im Breisgau and Munich and served as a cavalry officer in the First World War. In 1924 the Magdeburg machine-tool firm that employed him sent him to Zürich to run the Werkzeugmaschinenfabrik Oerlikon, which it had bought; he acquired the patent of a 20-mm gun, in connection with Germany's covert rearmament abroad. In 1937 he became the sole owner of the firm and a Swiss citizen, and moved into a house at Zollikerstrasse 178. After the fall of France in 1940 the Swiss military authorities prompted him to supply Germany with guns and ammunition; after the war his firm was on the Allies' black list until 1946 [[source/buehrle-ch-emil-georg-buehrle]].

  He began buying art in November 1936, first mostly from the Zürich gallery of Toni Aktuaryus ([[institution/galerie-aktuaryus]]). In June 1939 he bid at the auction of "degenerate art" from German museums at the [[institution/galerie-fischer]] in Lucerne; during the war he bought about a hundred works, mostly from Swiss dealers, from 1940 increasingly on the advice of [[person/fritz-nathan]]. Of 77 works looted by the Germans in France and found in Switzerland after the war, 13 were his, most bought from the Galerie Fischer; in 1948 the Swiss Federal Supreme Court ordered their restitution, and he bought nine of them a second time, four from [[person/paul-rosenberg]]. From 1951 he added about a hundred works a year, through dealers such as Rosenberg, [[person/germain-seligman]], [[person/georges-wildenstein]], [[institution/marlborough-fine-art-ltd]], [[person/max-kaganovitch]], [[person/walter-feilchenfeldt]], Nathan and his friend [[person/arthur-kauffmann]]. He acquired 633 works in all and left 598 when he died [[source/buehrle-ch-the-collection]]. Founder and owner of the Bührle collection, which passed to the [[institution/foundation-e-g-buhrle-collection]] [[source/proveana-buhrle]].
