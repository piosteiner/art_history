description_md: |-
  Dismas, the Good Thief crucified next to Christ, repented and was promised paradise; Gestas, the other, mocked Jesus.

  **In art:** The good thief usually hangs on Christ's right, turned towards him.

  *From:* New Testament; Christian tradition · Christian
