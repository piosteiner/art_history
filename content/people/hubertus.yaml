description_md: |-
  Two hunters with the same legend: while hunting a stag, they saw a crucifix shining between its antlers, and converted (Hubert's version is borrowed from Eustace's legend and was attached to him only in the 15th century). Hubert is the patron saint of hunters.

  **In art:** A hunter kneeling before a stag with a crucifix between its antlers.

  *From:* Golden Legend · Christian
