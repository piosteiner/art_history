description_md: |-
  Saint Maurice, the African commander of the Theban Legion, martyred at Agaunum (today Saint-Maurice in Valais).

  **In art:** Saint Maurice as a Black knight in armour, often with a banner.

  **Famous works**

  - Matthias Grünewald, *The Meeting of Saint Erasmus and Saint Maurice* (Alte Pinakothek, Munich)

  *From:* Christian legend · Christian
