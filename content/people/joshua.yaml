description_md: |-
  [[person/moses]]'s successor, who led the Israelites into the Promised Land. At Jericho, the people marched around the walls for seven days blowing trumpets, until the walls collapsed. In a later battle, Joshua commanded the sun and the moon to stand still until he had won.

  **In art:** Priests blowing ram's-horn trumpets as city walls fall, or a commander with his arm raised to the sky.

  **Famous works**

  - Lorenzo Ghiberti, *Gates of Paradise* (Florence Baptistery, Joshua panel)
  - John Martin, *Joshua Commanding the Sun to Stand Still upon Gibeon* (Washington)

  *From:* Hebrew Bible, Book of Joshua · Hebrew Bible
