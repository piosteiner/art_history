description_md: |-
  He ruled from age 12 for 68 years (615–683). His tomb in the Temple of the Inscriptions was found in 1952 with a jade death mask and a carved stone lid showing him falling into or rising from the underworld. Some people have claimed it shows an astronaut in a spaceship.

  *From:* Maya
