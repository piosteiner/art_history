description_md: Mishima was a famous writer. He did embrace far right ideas[[source/wikipedia-en-yukio-mishima|“From his mid-30s onwards, Mishima’s far-right ideology and reactionary beliefs became increasingly evident”]] one of which was that the Japanese people were losing their "national essence" [[kokutai]][[source/wikipedia-en-yukio-mishima|“worrying that by embracing these ideas the Japanese people would lose their "national essence" (kokutai) and distinctive cultural heritage”]].
