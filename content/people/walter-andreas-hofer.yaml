description_md: Began at the Munich dealer Bachstitz and from 1922 ran its branch in The Hague; 1930–1934 assistant of the dealer [[person/gottlieb-friedrich-reber]] in Lausanne. In the years before the war he established himself as a supplier of Old Masters to the Nazi leadership; from 1940 he was among the first German dealers allowed by [[person/hermann-goring]] to travel to the occupied Benelux countries and France to buy art. He was the main buyer for Göring's collection and in 1945 evacuated it. Interned at Hersbruck in 1946, he was sentenced in 1950 in absentia by a French military tribunal to ten years, yet went on dealing in Munich into the 1970s; denazification classed him a "Mitläufer" (follower) [[source/proveana-hofer]] [[source/proveana-kunstsammlung-goring]].
