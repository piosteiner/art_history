description_md: |-
  A real 9th-century scholar, poet and statesman, falsely accused and exiled from the court to Kyushu, where he died. After his death, a series of disasters struck the capital, including lightning hitting the palace, which were blamed on his angry spirit. He was deified as Tenjin, god of scholarship, to calm his angry spirit, and students still pray to him before exams. His beloved plum tree is said to have flown after him to his exile.

  **In art:** An official (courtier) in black court robes, sometimes in a rage as a thunder god, the thunder god attacking the palace, or plum blossoms, which he loved.

  **Famous works**

  - *Kitano Tenjin Engi Emaki* (Kitano Tenmangū, Kyoto)

  **Held sacred today:** He is still worshipped as Tenjin, the god of learning; students pray to him before exams.

  *From:* Japanese
