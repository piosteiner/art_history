occupations: [warrior, Nazirite, biblical judge]
description_md: |-
  Samson was an Israelite hero whose supernatural strength came from his uncut hair. He tore apart a lion with his bare hands and killed a thousand Philistines with a donkey's jawbone. The Philistines bribed his lover [[person/delilah]] to discover his secret, and she had his hair cut while he slept. They blinded and imprisoned him. In the end, his hair grew back, and he pulled down the pillars of their temple, killing himself and all the Philistines inside.

  **In art:** A strong man asleep in a woman's lap as his hair is cut, wrestling a lion, or pushing apart two pillars.

  **Famous works**

  - Rubens, *Samson and Delilah* (National Gallery, London)
  - [[artist/rembrandt]], *The Blinding of Samson* (Städel, Frankfurt)
  - [[artist/andrea-mantegna]], *Samson and Delilah* (National Gallery, London)

  *From:* Hebrew Bible, Judges · Hebrew Bible
