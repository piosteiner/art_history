name: Paul the Apostle
given_name: Paul the
family_name: Apostle
kind: person
birth: c. 5
death: August 64 – 67
description_md: |-
  Saul was a persecutor of Christians until, on the road to Damascus, he was struck to the ground by a blinding light and heard Christ's voice (the horse is an addition of art). Converted, he became the great missionary of the early Church, and, by tradition, was beheaded in Rome.

  **In art:** A balding man with a long dark beard, holding a sword (his martyrdom) and a book (his letters), or a man fallen from a horse in a burst of light.

  **Famous works**

  - [[artist/caravaggio]], *The Conversion of Saint Paul* (Santa Maria del Popolo, Rome)
  - [[artist/michelangelo]], *The Conversion of Saul* (Cappella Paolina, Vatican)

  *From:* New Testament, Gospels · Christian
