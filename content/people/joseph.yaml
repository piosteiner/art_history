occupations: [dream interpreter, civil servant]
description_md: |-
  [[person/jacob]]'s favourite son, given a coat of many colours. His jealous brothers sold him into slavery in Egypt. There, he resisted the advances of his master Potiphar's wife, was thrown into prison, and rose to become the Pharaoh's chief minister by interpreting Pharaoh's dreams of fat and thin cows.

  **In art:** A young man in a colourful coat thrown into a well, fleeing a woman who grabs his cloak, or interpreting the Pharaoh's dreams.

  **Famous works**

  - [[artist/rembrandt]], *Joseph Accused by Potiphar's Wife* (Berlin)
  - [[artist/diego-velazquez]], *Joseph's Bloody Coat Brought to Jacob* (El Escorial)
  - Pontormo, *Joseph in Egypt* (National Gallery, London)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
