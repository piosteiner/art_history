description_md: |-
  A free Creole woman (1801–1881), a hairdresser and healer, who was a famous practitioner of Louisiana Voodoo. Many legends grew up about her powers. Her reputed tomb in St. Louis Cemetery No. 1 is still a place of pilgrimage, where visitors leave offerings.

  *From:* Louisiana Creole
