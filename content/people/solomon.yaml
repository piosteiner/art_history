occupations: [monarch, prophet of Islam]
description_md: |-
  [[person/david]]'s son, king of Israel, famous for his wisdom and wealth, and builder of the Temple in Jerusalem. In his most famous judgement, two women claimed the same baby. He ordered it cut in half, and the true mother revealed herself by begging him to give it to the other woman instead. The Queen of Sheba travelled from afar to test his wisdom.

  **In art:** A crowned king on a throne with a soldier holding a baby and a sword before two women, or receiving an exotic queen with gifts.

  **Famous works**

  - [[artist/nicolas-poussin]], *The Judgement of Solomon* (Louvre)
  - [[artist/piero-della-francesca]], *The Meeting of Solomon and the Queen of Sheba* (San Francesco, Arezzo)
  - [[artist/claude-lorrain]], *The Embarkation of the Queen of Sheba* (National Gallery, London)

  *From:* Hebrew Bible, Books of Kings · Hebrew Bible
