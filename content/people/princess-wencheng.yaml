description_md: |-
  [[person/songtsan-gampo|Songtsen Gampo]] (7th century) united Tibet. According to tradition, his Chinese wife, Princess Wencheng, and his Nepali wife, Princess [[person/bhrikuti]], brought Buddhism and famous Buddha statues to Lhasa, where they're kept in the Jokhang and Ramoche temples.

  *From:* Chinese (Tang)
