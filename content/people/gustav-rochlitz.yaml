name: Gustav Rochlitz
given_name: Gustav
family_name: Rochlitz
occupations: [art dealer]
birth: 1889
death: 1972
description_md: "A German painter turned dealer: in Berlin 1921–1931, in Zürich 1931–1933, where the Swiss authorities soon barred him, a German citizen, from dealing at his Galerie Muralto; from 1933 in Paris (from 1936 at 222, rue de Rivoli). In 1941 he received from the Reichsmarschall [[person/hermann-goring]] a pass for unlimited travel between the zones. Arrested at Hohenschwangau on 13 December 1945; the Comité de confiscation des profits illicites de la Seine confiscated his property. He died at Füssen in 1972 [[source/proveana-rochlitz]]."
