description_md: |-
  Kong Fuzi (traditionally 551–479 BC), the philosopher whose teachings on morality, family and good government shaped Chinese civilisation.

  **In art:** A dignified scholar in robes with his hands folded, often with his disciples.

  **Famous works**

  - Wu Daozi (attributed), *Portrait of Confucius* (stone rubbing, Forest of Stone Steles, Xi'an)

  *From:* Chinese
