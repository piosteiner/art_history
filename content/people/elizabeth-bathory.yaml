birth: 1560-08-17
death: 1614-08-21
description_md: |-
  A powerful Hungarian noblewoman (1560–1614) accused of torturing and killing many young servant girls. Legend says she bathed in their blood to stay young. She was walled up in her castle at Čachtice. Some historians think the case against her was exaggerated by political enemies.

  *From:* Hungarian
