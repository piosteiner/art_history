description_md: Bernhard A. Böhmer (1892–1945) was a sculptor and painter who dealt in art in Güstrow in Mecklenburg. From 1938 he was one of the four dealers employed by the commission for the "utilisation" of degenerate art — with [[person/hildebrand-gurlitt|Hildebrand Gurlitt]], [[person/karl-buchholz|Karl Buchholz]] and [[person/ferdinand-moller|Ferdinand Möller]] — to sell or exchange the works confiscated from German museums abroad for foreign currency, for a commission of 10 to 25 percent.[[source/peters-2017|p. 26]][[source/wikipedia-en-hildebrand-gurlitt|§ Nazi era]]
