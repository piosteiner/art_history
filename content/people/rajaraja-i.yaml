description_md: |-
  He ruled from 985 to 1014 and built the Chola Empire into a great sea power that reached Sri Lanka and the Maldives (the raids on Southeast Asia came under his son Rajendra I). His temple in Thanjavur is one of the greatest in India.

  *From:* Tamil (Chola)
