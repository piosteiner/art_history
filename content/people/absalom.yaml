occupations: [ruler, rebel, murderer]
description_md: |-
  [[person/david]]'s handsome rebel son, who led a revolt against his father. Fleeing on a mule after his defeat, his head (in tradition, his long hair) caught in the branches of an oak, leaving him hanging there, and he was killed by David's general. David wept: "O Absalom, my son, my son!"

  **In art:** A young man hanging by his hair from a tree as soldiers stab him with spears.

  **Famous works**

  - Medieval manuscripts and Renaissance prints

  *From:* Hebrew Bible, Books of Samuel · Hebrew Bible
