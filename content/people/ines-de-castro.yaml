birth: 1320-12-25
death: 1355-01-15
description_md: |-
  Prince Pedro of Portugal loved the Galician noblewoman Inês, but his father had her murdered in 1355. When he became king, according to legend, he had her body dug up, crowned, and made the whole court kiss her hand. Their tombs face each other in Alcobaça Monastery.

  *From:* Portuguese
