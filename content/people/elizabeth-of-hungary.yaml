birth: 1207-07-14
death: 1231-11-24
description_md: |-
  A 13th-century princess who gave her wealth to the poor. In a later legend, when her husband caught her carrying bread to the poor in her cloak, she opened it and the bread had turned into roses.

  **In art:** A crowned woman with roses in her apron, or feeding beggars.

  **Famous works**

  - [[artist/simone-martini]], *Saint Elizabeth* (Lower Basilica, Assisi)
  - Elisabethkirche (Marburg)

  *From:* Golden Legend · Christian
