description_md: |-
  A great Byzantine general of the 6th century. According to a later legend, he was falsely accused, blinded by the emperor and reduced to begging in the streets.

  **In art:** A blind old soldier begging with a helmet, guided by a child, recognised by one of his former soldiers.

  **Famous works**

  - [[artist/jacques-louis-david]], *Belisarius Begging for Alms* (Lille)

  *From:* history and legend · Byzantine
