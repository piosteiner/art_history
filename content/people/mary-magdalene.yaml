name: Mary Magdalene
given_name: Mary
family_name: Magdalene
kind: person
death: 1/100
description_md: |-
  A follower of Jesus, a witness to the Crucifixion, and the first to see him risen. Later tradition wrongly merged her with a repentant sinner, so she became the great image of the penitent.

  **In art:** A woman with long loose hair (often red or golden) holding an ointment jar, weeping at the foot of the cross, or as a penitent in the desert with a skull and a book.

  **Famous works**

  - [[artist/donatello]], *Penitent Magdalene* (Museo dell'Opera del Duomo, Florence)
  - [[artist/titian]], *Penitent Magdalene* (Palazzo Pitti)
  - Georges de La Tour, *The Magdalene with the Smoking Flame* (LACMA)
  - [[artist/caravaggio]], *Penitent Magdalene* (Galleria Doria Pamphilj)

  *From:* New Testament, Gospels · Christian
