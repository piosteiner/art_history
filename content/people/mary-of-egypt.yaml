birth: c. 344
death: c. 421
description_md: |-
  A woman who lived a sinful life in Alexandria, then repented and spent 47 years alone in the desert, until her clothes fell apart and she was covered only by her long hair.

  **In art:** An old, emaciated woman covered by her long hair, with three loaves of bread. Often confused with [[person/mary-magdalene]].

  **Famous works**

  - José de Ribera, *Saint Mary of Egypt* (1651, Museo civico Gaetano Filangieri, Naples)

  *From:* Golden Legend · Christian
