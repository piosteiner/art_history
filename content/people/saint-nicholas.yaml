description_md: |-
  A 4th-century bishop of Myra, famous for his secret generosity: he threw bags of gold through a poor man's window as dowries for his three daughters. He's the origin of Santa Claus.

  **In art:** A bishop with three golden balls or purses, sometimes with three children in a tub, whom he brought back to life.

  **Famous works**

  - [[artist/gentile-da-fabriano]], *Quaratesi Altarpiece* predella (Vatican and Washington)
  - [[artist/fra-angelico]], *Perugia Altarpiece* predella (Vatican and Galleria Nazionale dell'Umbria, Perugia)

  *From:* Golden Legend · Christian
