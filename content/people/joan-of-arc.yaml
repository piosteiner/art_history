birth: c. 1412
death: 1431-06-08
description_md: |-
  A real peasant girl who, guided by the voices of saints, led the French army to victory at Orléans in 1429 and saw the king crowned. She was captured, tried for heresy and burned at the stake in 1431, and later declared a saint.

  **In art:** A young woman in armour with a banner, sometimes listening to angelic voices in a garden.

  **Famous works**

  - Jules Bastien-Lepage, *Joan of Arc* (1879; Metropolitan Museum of Art, New York)
  - [[artist/jean-auguste-dominique-ingres]], *Joan of Arc at the Coronation of Charles VII* (1854; Louvre)
  - Emmanuel Frémiet, *Jeanne d'Arc* (gilded bronze equestrian statue, 1874; Place des Pyramides, Paris)

  *From:* French
