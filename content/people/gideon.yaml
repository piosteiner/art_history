description_md: |-
  Gideon asked God for signs, such as dew falling only on a fleece, and defeated a huge army with just 300 men carrying trumpets and torches hidden in jars.

  **In art:** A soldier kneeling by a fleece.

  **Famous works**

  - [[artist/nicolas-poussin]], *Gideon Battling the Midianites* (Vatican Pinacoteca)

  *From:* Hebrew Bible, Judges · Hebrew Bible
