description_md: |-
  Hagar was the Egyptian servant of Abraham's wife Sarah, and mother of his son Ishmael. After Sarah had her own son, [[binding-of-isaac|Isaac]], she had Abraham send Hagar and the boy into the desert. When their water ran out, an angel showed Hagar a well. Ishmael is regarded as an ancestor of the Arab peoples.

  **In art:** A mother and child being sent away by an old man, or a woman in despair in the desert, with an angel pointing to water.

  **Famous works**

  - [[artist/rembrandt]], *Abraham Dismissing Hagar and Ishmael* (etching)
  - [[artist/giovanni-battista-tiepolo]], *Hagar and Ishmael in the Wilderness* (Scuola di San Rocco, Venice)
  - [[artist/claude-lorrain]], *Landscape with Hagar and the Angel* (National Gallery, London)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
