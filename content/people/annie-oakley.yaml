description_md: |-
  Annie Oakley (1860–1926) was an incredible sharpshooter who starred in Buffalo Bill's Wild West show; she could split a playing card edge-on at 30 paces. [[person/calamity-jane]] (about 1852–1903) was a frontierswoman and scout who told many tall tales about herself.

  *From:* American
