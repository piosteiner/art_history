description_md: |-
  He ruled from 1550 to 1581 and conquered Burma, the Shan States, Lan Na, Siam, Lan Xang (Laos) and Manipur (now in north-east India). His empire was the largest ever in Southeast Asia, but it fell apart soon after his death.

  *From:* Burmese
