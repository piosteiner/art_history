description_md: |-
  A righteous, prosperous man whose faith Satan tested with God's permission. He lost his children, his wealth and his health, and sat covered in sores among the ashes (a dung heap in the Greek and Latin Bibles), mocked by his wife and lectured by friends, but never cursed God. In the end, everything was restored to him.

  **In art:** A nearly naked man covered in sores sitting on a dung heap (after the Latin Bible), with his wife pouring water on him or friends around him.

  **Famous works**

  - Georges de La Tour, *Job Mocked by His Wife* (Épinal)
  - [[artist/albrecht-durer]], *Jabach Altarpiece* (Job and his wife, Frankfurt)
  - [[artist/william-blake]], *Illustrations of the Book of Job* (engravings)

  *From:* Hebrew Bible, Book of Job · Hebrew Bible
