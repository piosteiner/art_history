name: Judith
kind: person
description_md: |-
  A brave Jewish widow whose city was besieged by the Assyrian general Holofernes. She went to his camp, charmed him, got him drunk, and cut off his head with his own sword, saving her people.

  From the Book of Judith. When the Assyrian general Holofernes besieged her town, the beautiful widow Judith went to his camp, got him drunk, and cut off his head with his own sword.

  **In art:** A woman beheading a man in bed, helped by her maid, or holding his severed head, often with a sword.

  **Famous works**

  - Artemisia Gentileschi, *Judith Slaying Holofernes* (Uffizi and Naples)
  - Caravaggio, *Judith Beheading Holofernes* (Palazzo Barberini)
  - Donatello, *Judith and Holofernes* (Palazzo Vecchio)
  - Gustav Klimt, *Judith I* (Belvedere, Vienna) — [[artwork/judith-i]]

  *From:* Book of Judith · Jewish
