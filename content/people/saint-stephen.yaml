description_md: |-
  The first Christian martyr, stoned to death outside Jerusalem.

  **In art:** A young deacon with stones on his head or in his hands, and a palm.

  **Famous works**

  - [[artist/fra-angelico]], *Chapel of Nicholas V* frescoes (Vatican)
  - [[artist/rembrandt]], *The Stoning of Saint Stephen* (Lyon)

  *From:* New Testament, Acts of the Apostles · Christian
