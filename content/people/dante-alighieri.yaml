description_md: |-
  Dante Alighieri, the poet of the *Divine Comedy* (early 14th century), described his journey through Hell (*Inferno*), Purgatory and Paradise. [[beatrice]], the woman he loved from afar, guides him through Paradise.

  **In art:** A man in a red robe and laurel wreath, with [[person/virgil]] in Hell.

  **Famous works**

  - [[artist/sandro-botticelli]], *Map of Hell* and *Divine Comedy* drawings (Vatican Library and Kupferstichkabinett, Berlin)
  - Henry Holiday, *Dante and Beatrice* (1883; Walker Art Gallery, Liverpool)
  - [[artist/eugene-delacroix]], *The Barque of Dante* (1822; Louvre)
  - [[artist/auguste-rodin]], *The Gates of Hell* (Musée Rodin)

  *From:* Dante, Divine Comedy · Italian
