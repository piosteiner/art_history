description_md: |-
  Rodrigo Díaz de Vivar, a real Castilian knight of the 11th century, who became the hero of Spain's national epic, the *Cantar de mio Cid*. According to legend, after his death his body was set on his horse, Babieca, in his armour to lead his army to one last victory.

  **Famous works**

  - Anna Hyatt Huntington, *El Cid Campeador* (equestrian bronze, 1927, Hispanic Society of America, New York; further casts in Seville, Valencia, San Francisco, San Diego, Buenos Aires)

  *From:* Cantar de mio Cid · Castilian
