description_md: "Florentine, son of Filippo Strozzi[[source/wikipedia-it-filippo-strozzi|among Filippo’s children: „Roberto Strozzi (12 ottobre 1520 - 1566)“]], friend of Michelangelo, who gave him the two Slaves in 1546; he offered them to the King of France soon after[[source/louvre-esclave-mourant-mr-1590|« Don de l’artiste à son ami Roberto Strozzi en 1546. Offert au roi de France (François Ier?) par Roberto Strozzi peu de temps après »]]."
