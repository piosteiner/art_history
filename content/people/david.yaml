occupations: [herder, ruler, poet, warlord, instrumentalist, monarch]
description_md: |-
  A young shepherd who killed the Philistine giant Goliath with a single stone from his sling and cut off his head. He became the greatest king of Israel and a poet, traditionally the author of the Psalms. As king, he saw [[person/bathsheba]] bathing, took her, and had her husband killed in battle.

  **In art:** A youth with a sling or holding a sword and Goliath's severed head. As king, with a crown and a harp. Bathsheba is shown bathing, often receiving a letter.

  **Famous works**

  - [[artist/michelangelo]], *David* (Accademia, Florence)
  - [[artist/donatello]], *David* (Bargello)
  - Bernini, *David* (Galleria Borghese) — [[artwork/david-bernini]]
  - [[artist/caravaggio]], *David with the Head of Goliath* (Galleria Borghese) — [[artwork/david-with-the-head-of-goliath-borghese]]
  - [[artist/rembrandt]], *Bathsheba at Her Bath* (Louvre)

  *From:* Hebrew Bible, Books of Samuel · Hebrew Bible
