description_md: |-
  She was the daughter of King Sargon of Akkad, about 2300 BC, and the high priestess of the moon god at Ur. Hymns to the goddess Inanna are attributed to her, and she is celebrated as the earliest writer in the world whose name we know, though some scholars doubt that she composed them.

  *From:* Mesopotamian (Sumerian, Babylonian, Assyrian)
