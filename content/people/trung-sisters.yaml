description_md: |-
  In AD 40, Trưng Trắc and Trưng Nhị led an uprising against Chinese Han rule; Vietnamese folk art shows them riding war elephants. They ruled as queens for three years. When they were defeated in 43, they were either executed or took their own lives; Vietnamese tradition says they drowned themselves in a river rather than surrender.

  *From:* Vietnamese
