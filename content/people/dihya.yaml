description_md: |-
  Dihya was a real Amazigh queen of the late 7th century (died 703), known by her enemies as *al-Kahina*, "the priestess" (soothsayer), because she was said to foresee the future. She united Berber tribes in the Aurès Mountains and defeated an invading army in battle, holding them back for years. In the end, she was defeated at El Jem in 703 and killed. Legend says she saw her defeat coming and sent her sons to the other side to save them. She's a powerful symbol of resistance in North Africa today.

  *From:* history and legend · Amazigh (Berber)
