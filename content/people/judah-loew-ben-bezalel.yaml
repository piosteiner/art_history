description_md: |-
  Judah Loew ben Bezalel (about 1520–1609) was one of the great scholars of his time. Legends grew up around him, above all that he made the [[golem-of-prague|Golem]]; his meeting with [[person/emperor-rudolf-ii]] (an audience on 23 February 1592) really happened, though legend embroidered it. His grave in Prague's Old Jewish Cemetery is still covered with notes and stones left by visitors.

  *From:* Jewish (Prague)
