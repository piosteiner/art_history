description_md: "Art dealer and art historian in Zürich, son of [[person/walter-feilchenfeldt]] and [[person/marianne-feilchenfeldt]]. Joined the family dealership [[institution/walter-feilchenfeldt-kunsthandel]] in 1966, directed it alone from 1990 and turned it into Walter Feilchenfeldt AG in 2011.[[source/walterfeilchenfeldt-art-dealing|“1966–1990: Marianne and Walter Feilchenfeldt jun.” · “1990–2011: Walter Feilchenfeldt jun.”]] Museums cite his information and the firm's archive for the provenance of works his father handled (“Auskunft von Walter Feilchenfeldt, Zürich, Sohn von Dr. Walter Feilchenfeldt”)."
