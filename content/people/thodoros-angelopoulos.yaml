description_md: |-
  Theo (Thodoros) Angelopoulos (1935–2012) was a Greek filmmaker, screenwriter and producer, one of the most influential directors of his time [[source/wikipedia-en-theo-angelopoulos|introduction]].

  ## Life and work

  Born in [[place/athens|Athens]] on 27 April 1935, he studied law there, then film at the IDHEC in Paris, and began making films after the 1967 coup [[source/wikipedia-en-theo-angelopoulos|§ Biography]]. In the 1970s he made a series of political films about modern Greece, among them *The Travelling Players* (1975) [[source/wikipedia-en-theo-angelopoulos|§ Biography]]. His style is marked by slow, episodic narratives and long, carefully choreographed takes; recurring themes are exile, return and the history of twentieth-century Greece [[source/wikipedia-en-theo-angelopoulos|§ Biography]]. *Eternity and a Day* won the Palme d'Or in 1998 [[source/wikipedia-en-theo-angelopoulos|introduction]]. He died on 24 January 2012 after an accident while filming *The Other Sea* [[source/wikipedia-en-theo-angelopoulos|§ Death]].

  ## In the seminar

  *Ulysses' Gaze* (1995), loosely based on Homer's *Odyssey*, follows a Greek filmmaker across the Balkans in search of three undeveloped reels by the Manaki brothers, pioneers of film in the region, and ends in besieged Sarajevo; it won the Grand Jury Prize at Cannes in 1995 [[source/wikipedia-en-ulysses-gaze|introduction; § Plot; § Accolades]]. A frame of it — a dismembered statue of Lenin on a barge crossing the Balkans — illustrated the afterlife of monuments, beside Deimantas Narkevičius's [[artwork/once-in-the-xx-century|Once in the XX Century]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 34]].
