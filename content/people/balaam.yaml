occupations: [oracle]
description_md: |-
  The prophet Balaam was riding to curse the Israelites when his donkey refused to go on, because it could see an angel with a sword blocking the road. Balaam beat it, and the donkey spoke to him.

  **In art:** A man beating a donkey that has fallen to its knees, with an angel standing in front of them.

  **Famous works**

  - [[artist/rembrandt]], *Balaam's Ass* (Musée Cognacq-Jay, Paris)

  *From:* Hebrew Bible, Numbers · Hebrew Bible
