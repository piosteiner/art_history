description_md: |-
  A Moabite widow who refused to leave her mother-in-law Naomi, saying "Where you go, I will go." She gleaned grain in the fields of Boaz, who married her. She became the great-grandmother of [[person/david|King David]].

  **In art:** A young woman gleaning wheat in a field.

  **Famous works**

  - [[artist/nicolas-poussin]], *Summer (Ruth and Boaz)*, from *The Four Seasons* (Louvre)

  *From:* Hebrew Bible, Book of Ruth · Hebrew Bible
