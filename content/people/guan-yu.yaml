description_md: |-
  One of the three sworn brothers of the *Romance of the Three Kingdoms* (the Oath of the Peach Garden) with [[romance-of-the-three-kingdoms|Liu Bei]] and Zhang Fei. Guan Yu, with his red face, long beard and halberd, is still worshipped as a god of war, loyalty and business.

  **In art:** A red-faced general with a long beard.

  **Famous works**

  - Shang Xi, *Guan Yu Capturing Pang De* (Palace Museum, Beijing)

  **Held sacred today:** Guan Yu, with his red face, long beard and halberd, is still worshipped as a god of war, loyalty and business.

  *From:* Romance of the Three Kingdoms · Chinese
