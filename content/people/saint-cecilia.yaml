name: Saint Cecilia
kind: person
birth: c. 200
death: 230-11-22
description_md: |-
  A Roman martyr and patron saint of music, who sang to God in her heart while the musicians played at her wedding.

  **In art:** A young woman playing an organ, a lute or a viol, often with angels.

  **Famous works**

  - [[artist/raphael]], *The Ecstasy of Saint Cecilia* (Pinacoteca Nazionale, Bologna)
  - Stefano Maderno, *Saint Cecilia* (marble, Santa Cecilia in Trastevere, Rome)

  *From:* Golden Legend · Christian
