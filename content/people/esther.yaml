description_md: |-
  A Jewish woman who became queen of Persia. When the king's minister Haman plotted to kill all the Jews, she risked her life by appearing before the king uninvited, and saved her people. The festival of Purim celebrates her.

  **In art:** A queen fainting or kneeling before a king, who holds out his sceptre to her.

  **Famous works**

  - [[artist/artemisia-gentileschi]], *Esther before Ahasuerus* (Metropolitan Museum)
  - [[artist/rembrandt]], *Ahasuerus and Haman at the Feast of Esther* (Moscow)

  *From:* Hebrew Bible, Book of Esther · Hebrew Bible
