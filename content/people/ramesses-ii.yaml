description_md: |-
  He reigned for 66 years (1279–1213 BC), fought the Hittites at Kadesh, and built Abu Simbel. His Greek name, Ozymandias, inspired Shelley's poem about a broken statue in the desert: "Look on my works, ye Mighty, and despair!"

  *From:* Ancient Egyptian
