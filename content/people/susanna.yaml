description_md: |-
  A virtuous woman spied on by two old men while she bathed in her garden. When she refused their advances, they falsely accused her of adultery, and she was condemned to death. The young [[person/daniel]] saved her by questioning the elders separately and exposing their lies.

  **In art:** A nude woman bathing, with two old men leering at or grabbing her.

  **Famous works**

  - [[artist/artemisia-gentileschi]], *Susanna and the Elders* (Pommersfelden)
  - Tintoretto, *Susanna and the Elders* (Vienna) — [[artwork/susanna-and-the-elders]]
  - [[artist/rembrandt]], *Susanna* (Mauritshuis)

  *From:* Book of Daniel (additions) · Jewish
