description_md: |-
  In 1521, Lapulapu, a chief (datu) of Mactan, refused to submit to the Spanish expedition. His warriors killed Ferdinand Magellan in the Battle of Mactan. He's honoured in the Philippines as the first hero to resist European colonisation (a retrospective title).

  *From:* Visayan (Mactan)
