description_md: |-
  A Roman soldier who, in a hard winter, cut his military cloak in half with his sword to share it with a beggar. That night, he dreamed of Christ wearing the half cloak.

  **In art:** A soldier on horseback cutting his cloak with a sword for a nearly naked beggar.

  **Famous works**

  - [[artist/el-greco]], *Saint Martin and the Beggar* (1597–1599, National Gallery of Art, Washington)
  - [[artist/simone-martini]], *Saint Martin* chapel frescoes (Lower Basilica, Assisi)

  *From:* Golden Legend · Christian
