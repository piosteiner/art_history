description_md: |-
  Marcello Piacentini (Rome, 8 December 1881 – Rome, 19 May 1960) was an architect and urban planner and one of the main proponents of Fascist architecture in Italy [[source/wikipedia-en-marcello-piacentini|§ Introduction]] [[source/wikipedia-en-marcello-piacentini|§ Early career]] [[source/wikipedia-en-marcello-piacentini|§ Later career]]. The son of the architect Pio Piacentini, he studied at the Regio Istituto di Belle Arti in Rome from 1901 to 1904 [[source/wikipedia-en-marcello-piacentini|§ Early career]]. His Corso Cinema in Rome (1915–18), in reinforced concrete with echoes of the Secession, was taken by the conservative Roman establishment as a provocation of Modernism; in 1921 he founded the journal *Architettura e arti decorative* with Gustavo Giovannoni [[source/wikipedia-en-marcello-piacentini|§ Early career]].

  From 1923 he worked on the urban plan of Rome; *La grande Roma* (1925) and the plan of 1931, which produced the Via dell'Impero, the clearing around the Mausoleum of Augustus and the Via della Conciliazione, sacrificed historic fabric to make the monuments of ancient Rome visible along processional avenues [[source/wikipedia-en-marcello-piacentini|§ Fascist period]]. His monuments at Genoa and Bolzano and the Piazza della Vittoria in Brescia (1928–32) show a stripped, monumental classicism [[source/wikipedia-en-marcello-piacentini|§ Fascist period]]. Against the Rationalists he defended a "simplified neoclassicism" between the Novecento and the Gruppo 7 [[source/wikipedia-en-marcello-piacentini|§ Fascist period]] [[source/wikipedia-en-marcello-piacentini|§ Architectural theories]]. He became Italy's leading architect: Mussolini's favoured agent for the rebuilding of central Rome, member of the Royal Academy of Italy, professor of urban planning and president of the [[institution/sapienza-university-of-rome|Sapienza]] [[source/wikipedia-en-marcello-piacentini|§ Fascist period]]. He designed the Italian Pavilion at the Paris exhibition of 1937 [[source/braun-2000|p. x, fig. 129]].

  In 1932 Mussolini appointed him to supervise the plans for the [[place/citta-universitaria-rome|Città universitaria]] of Rome, completed in 1935 [[source/wikipedia-en-marcello-piacentini|§ Fascist period]] [[source/wikipedia-en-sapienza-university-of-rome|§ History]]; its sixteen buildings were designed by eleven architects [[source/steiner-2025-mario-sironi|p. 6]]. For the decoration of its Aula Magna he proposed [[artist/mario-sironi|Mario Sironi]] to the head of government, and Sironi painted [[artwork/sironi-italia-fra-le-arti-e-le-scienze|L'Italia fra le Arti e le Scienze]] [[source/sapienza-2017-sironi-restauro|p. 2]]. From 1936 he directed the site of the planned world exhibition (EUR), meant as a monumental symbol of the new Empire, which was never completed [[source/wikipedia-en-marcello-piacentini|§ Fascist period]]. After the fall of Fascism he built little; his late works include the Palazzo dello Sport at EUR with Pier Luigi Nervi [[source/wikipedia-en-marcello-piacentini|§ Later career]].
