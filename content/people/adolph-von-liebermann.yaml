description_md: Berlin manufacturer, merchant and art collector; the Nationalgalerie calls him a banker. He bought Adolph Menzel's [[artwork/eisenwalzwerk-moderne-cyklopen]] while it was being painted and sold it to the Nationalgalerie in 1875. He was the uncle of the painter [[artist/max-liebermann]], the brother of Max Liebermann's father Louis.
