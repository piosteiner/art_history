description_md: "Berlin manufacturer, banker and art collector[[source/wikipedia-de-liebermann-familie|„Adolf Ritter Liebermann von Wahlendorf (1829–1893) – Fabrikant, Bankier, Kunstsammler, Mäzen“]]; the Nationalgalerie calls him a banker. He bought Adolph Menzel's [[artwork/eisenwalzwerk-moderne-cyklopen]] while it was being painted and sold it to the Nationalgalerie in 1875[[source/smb-eisenwalzwerk-958605|„Bei Menzel schaltete sich der Bankier Adolph von Liebermann als Käufer erst ein, als mindestens der Plan schon gefaßt war.“ · Erwerbung: „1875 Ankauf aus der Sammlung des Bankiers Adolph von Liebermann, Berlin“]]. He was the uncle of the painter [[artist/max-liebermann]][[source/smb-eisenwalzwerk-958605|Provenienz: „Adolph von Liebermann, Berlin (Onkel des Künstlers), 18.10.1875“]]."
