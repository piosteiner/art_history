death_label: c. 9 February 249
description_md: |-
  A virgin martyr of Alexandria (an "aged virgin" or perhaps a deaconess) whose teeth were smashed out before she leapt into the fire. Patron saint of dentists.

  **In art:** A woman holding pincers gripping a tooth.

  **Famous works**

  - [[artist/francisco-de-zurbaran]], *Saint Apollonia* (Louvre)
  - Jean Fouquet, *The Martyrdom of Saint Apollonia*, Hours of Étienne Chevalier (Musée Condé, Chantilly)

  *From:* Golden Legend · Christian
