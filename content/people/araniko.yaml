description_md: |-
  In 1260, the young Newar artist Arniko led a group of eighty craftsmen from the Kathmandu Valley to Tibet and then to the Mongol court in China. He designed the White Pagoda in Beijing, which still stands.

  *From:* Newar (Nepal)
