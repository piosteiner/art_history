description_md: |-
  Nicodemus was a Pharisee who came to Jesus secretly at night, and later helped bury him.

  **In art:** Two men talking by lamplight.

  **Famous works**

  - Henry Ossawa Tanner, *Nicodemus* (Pennsylvania Academy of the Fine Arts)

  *From:* New Testament, Gospels · Christian
