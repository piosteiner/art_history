description_md: |-
  Young Tobias travelled to collect a debt for his blind father, guided by a companion who turned out to be the archangel [[artist/raphael]]. On the way, he caught a fish whose organs drove away a demon and cured his father's blindness.

  **In art:** A boy carrying a fish, walking with a winged angel and often a small dog.

  **Famous works**

  - Workshop of Andrea del Verrocchio (Leonardo's hand suggested in parts), *Tobias and the Angel* (National Gallery, London)
  - [[artist/rembrandt]], several drawings and paintings of the story

  *From:* Book of Tobit · Jewish
