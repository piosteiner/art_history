description_md: |-
  As king, [[person/david]] saw Bathsheba bathing, took her, and had her husband killed in battle.

  **In art:** Bathsheba is shown bathing, often receiving a letter.

  **Famous works**

  - [[artist/rembrandt]], *Bathsheba at Her Bath* (Louvre)

  *From:* Hebrew Bible, Books of Samuel · Hebrew Bible
