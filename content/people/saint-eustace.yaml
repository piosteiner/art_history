description_md: |-
  Two hunters with the same legend: while hunting a stag, they saw a crucifix shining between its antlers, and converted.

  **In art:** A hunter kneeling before a stag with a crucifix between its antlers.

  **Famous works**

  - [[artist/albrecht-durer]], *Saint Eustace* (engraving)
  - Pisanello, *The Vision of Saint Eustace* (National Gallery, London)

  *From:* Golden Legend · Christian
