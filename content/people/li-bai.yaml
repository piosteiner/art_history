description_md: |-
  Li Bai (701–762), the great poet of wine and the moon, was said in legend to have drowned trying to embrace the moon's reflection in a river.

  **In art:** A poet drinking under the moon or lying drunk.

  **Famous works**

  - Liang Kai, *Li Bai Walking and Chanting* (Tokyo National Museum)

  *From:* Chinese
