description_md: |-
  Lê Lợi drove the Chinese Ming out of Vietnam (1418–1427) with a magic sword given to him by the Dragon King. After his victory, while he was boating on a lake in Hanoi, a giant golden turtle rose up and took the sword back. The lake is now called Hoàn Kiếm, "Lake of the Returned Sword".

  *From:* Vietnamese
