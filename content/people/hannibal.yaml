description_md: |-
  The great Carthaginian general who, in 218 BC, led an army with war elephants across the Alps to invade Italy and came close to defeating Rome.

  **In art:** An army struggling through snowy mountain passes, often with elephants.

  **Famous works**

  - J.M.W. Turner, *Snow Storm: Hannibal and His Army Crossing the Alps* (Tate)
  - [[artist/francisco-goya|Francisco de Goya]], *Hannibal the Conqueror Viewing Italy from the Alps for the First Time* (Museo del Prado, Madrid)

  *From:* history · Carthaginian
