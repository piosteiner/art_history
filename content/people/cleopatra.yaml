description_md: |-
  She spoke many languages and was the only one of her Greek family known to have learned Egyptian. She allied with [[person/julius-caesar]] and then with Mark Antony, against Octavian. After their defeat at Actium, she died by suicide in 30 BC, according to legend from the bite of an asp.

  The last queen of Ptolemaic Egypt, lover of Julius Caesar and then Mark Antony. When they were defeated by Octavian, Antony killed himself, and Cleopatra, in the best-known account, let herself be bitten by an asp (probably an Egyptian cobra) rather than be paraded through Rome; the ancient writers already said the manner of her death was uncertain.

  **In art:** A queen holding a snake to her breast, or the famous banquet where she dissolved a pearl in vinegar and drank it.

  **Famous works**

  - Tiepolo, *The Banquet of Cleopatra* (Melbourne and Palazzo Labia, Venice)
  - [[artist/guido-reni]], *Cleopatra*
  - [[artist/artemisia-gentileschi]], *Cleopatra*
  - Jean-André Rixens, *The Death of Cleopatra* (Toulouse)

  *From:* Ancient Egyptian
