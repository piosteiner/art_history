occupations: [laborer, artisan, carpenter, tektōn]
description_md: |-
  The husband of [[person/mary]] and earthly father of Jesus, a carpenter.

  **In art:** An older bearded man with carpenter's tools, a flowering staff (the sign that chose him as Mary's husband), or holding the Christ child.

  **Famous works**

  - Georges de La Tour, *Saint Joseph the Carpenter* (Louvre)
  - [[artist/raphael]], *The Marriage of the Virgin* (Brera, Milan) — [[artwork/the-marriage-of-the-virgin-raphael]]

  *From:* New Testament; Christian tradition · Christian
