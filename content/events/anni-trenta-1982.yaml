name: "Anni Trenta: Art and Culture in Italy"
kind: exhibition
period: 1982
place: milan
description_md: |-
  *Anni Trenta. Arte e cultura in Italia*, Milan, Palazzo Reale, 1982 — the art of the Fascist decade back on show [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 12]]. The seminar introduced it beside Georg Baselitz's *Adieu* (1982) and Sandro Chia's *Water Bearer* (1981) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 11–12]].

  It came after a decade of re-evaluation: in the 1970s numerous exhibitions in Italy brought to light the richness and diversity of the art made under the regime and rehabilitated whole careers and movements, though at first they isolated painting and sculpture from their political context [[source/braun-2000|p. 4]]. In the same Palazzo Reale, in 1973, the first comprehensive survey of [[artist/mario-sironi|Mario Sironi]] had presented the political side of his career in the light of revisionist studies of Fascism [[source/braun-2000|p. 15]]. In the 1980s, the neo-Expressionism of young Italian painters, the *transavanguardia*, gave Sironi's figurative style a new relevance [[source/braun-2000|p. 16]].
