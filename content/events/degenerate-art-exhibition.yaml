description_md: |-
  The exhibition *Entartete Kunst* ("Degenerate Art") opened in Munich on 19 July 1937, one day after Hitler had opened the first [[event/great-german-art-exhibition-1937|Great German Art Exhibition]] in the new Haus der Deutschen Kunst nearby.[[source/fulda-soika-2014|p. 192]][[source/peters-2017|p. 23]] It is often seen as the planned counterpart of that show, but it was put together ad hoc and only afterwards styled as a long-prepared settling of accounts with modernism.[[source/peters-2017|p. 18]]

  ## How it came about

  "Degenerate art" had been shown before — in the *Schandausstellungen* ("exhibitions of shame") after 1933, such as "Systemkunst" in Karlsruhe, and in anticommunist and antisemitic propaganda shows in Munich in 1936 and 1937.[[source/peters-2017|p. 10]][[source/hermand-1994|p. 37]] In the spring of 1937 the Propaganda Ministry included a display of it in *Gebt mir vier Jahre Zeit* ("Give Me Four Years' Time"), chosen by two amateur painters, Wolfgang Willrich and Walter Hansen, who with authorisations from the ministry and the Gestapo went through the print room and the modern collection of the Berlin Nationalgalerie in the Kronprinzenpalais and other museums.[[source/peters-2017|pp. 21–22]]

  The decision for Munich followed a crisis. On 4 June 1937 [[person/joseph-goebbels|Goebbels]] noted that he wanted "an exhibition in Berlin with works from the era of decay"; on 5 June he and Hitler viewed the jury's selection for the Great German Art Exhibition, and Hitler's rage at it cost Goebbels and his subordinate [[artist/adolf-ziegler|Ziegler]] much prestige. Goebbels now pursued a radical line he knew Hitler would approve. Despite "resistance everywhere", even from Speer, Munich was chosen as the site on 19 June, a month before the opening; as late as 1 July Goebbels was not sure it could open in time. "Führer wants to give a harsh speech against the art of decay," he wrote on 10 July. "And I will make my contribution through the exhibition on the art of decay." Hitler himself visited the show for just under ten minutes a few days before it opened.[[source/peters-2017|pp. 15–16, 20, 22–23]] Its works came from the confiscations that Hitler's decree of 30 June 1937 had authorised Ziegler to carry out in the public collections.[[source/peters-2017|p. 17]]

  ## The exhibition

  Ziegler opened it: "You see around us monstrosities of madness, of impudence, of inability, and degeneration. What this show has to offer causes shock and disgust in all of us." He called the artists "pigs" and announced a thorough purge of the museums.[[source/peters-2017|p. 23]] The official guide promised to show the "disintegration of culture" and the "Jewish and Communist pandemonium" before 1933.[[source/hermand-1994|p. 38]] The show filled the cramped rooms of the plaster-cast collection of the Archäologisches Institut in the Hofgarten arcades with around six hundred paintings, sculptures, drawings, prints and books, reconstructed since the 1980s by Mario-Andreas von Lüttichau. Every current since 1905 was represented — [[movement/expressionism|Expressionism]], [[movement/cubism|Cubism]], [[movement/futurism|Futurism]], [[movement/dada|Dada]], Verism and [[movement/new-objectivity|New Objectivity]], Constructivism — but Expressionism dominated.[[source/peters-2017|p. 23]]

  The arrangement was calculated. The entrance appealed to the visitors' religious feelings: Ludwig Gies's large crucifix, now lost, and works by [[artist/emil-nolde|Nolde]] and [[artist/max-beckmann|Beckmann]] were to show modernism mocking Christianity — an irony in a show by neopagan, anticlerical National Socialists — and a second room turned to Judaism. One wall copied the methods of the Dadaists, with works packed together under slogans and quotations; other rooms — on the image of man in Nolde and [[movement/die-brucke|Die Brücke]], on the anti-war works of [[artist/otto-dix|Otto Dix]], on [[artist/paul-klee|Paul Klee]] and the art of children and of the "mentally ill" — were hung conventionally in two crowded rows, with derisive labels and the prices museums had paid.[[source/peters-2017|pp. 23–25]] Nolde alone was represented by around fifty works, among them the cycle *The Life of Christ*.[[source/fulda-soika-2014|pp. 186, 192]] The brochure's cover showed Otto Freundlich's sculpture *New Man* (1912), since lost.[[source/peters-2017|p. 11, fig. 1]]

  There was no catalogue — only a red slip in the catalogue of the Great German Art Exhibition calling visitors to the nearby *Femeschau*: "See it! Judge for yourself!" The press celebrated: on 20 July Bruno E. Werner wrote that "the will of the Führer has once and for all put an end to the epoch of depravity in art".[[source/peters-2017|p. 25]][[source/hermand-1994|p. 38]] A few saw through it: on 14 November 1937 the critic Carl Linfert observed in the *Frankfurter Zeitung* that the show produced the very thing it claimed to expose. Peters's thesis is that disappointment over the desolate state of art in the Third Reich, rather than any plan, led to the exhibition and the campaign.[[source/peters-2017|p. 25]]

  ## Visitors and tour

  The regime claimed more than two million visitors; the figure, first published in the *Völkischer Beobachter* on 1 December 1937, would mean nearly twenty-four thousand a day in small rooms and is probably exaggerated — the Great German Art Exhibition drew about a quarter of it.[[source/peters-2017|p. 26]] The show then toured: by 1941 it had been in Berlin, Leipzig, Düsseldorf, Salzburg, Hamburg, Stettin, Weimar, Vienna, Frankfurt am Main, Chemnitz, Waldenburg and Halle, its contents changing — works with a market value were taken out for sale, examples of the art of the "mentally ill" added, and the whole tied ever more closely to anti-Bolshevik agitation.[[source/peters-2017|p. 27]][[source/fulda-soika-2014|pp. 188–189]]
