description_md: |-
  The firebombing of Kobe (*Kōbe dai-kūshū*) was part of the American air raids on the Japanese home islands in the last months of the Pacific War [[source/wikipedia-en-bombing-of-kobe|introduction]]. Kobe was then Japan's sixth-largest city, with roughly a million inhabitants, and its largest port, the centre of shipbuilding and marine-engine manufacturing; its houses were mostly built of wood, and its water supply and firefighting equipment were poor [[source/wikipedia-en-bombing-of-kobe|§ Background]].

  ## The raids

  After trials on a "Japanese village" built at the Dugway Proving Ground, Curtis LeMay had B-29 bombers drop incendiaries on Kobe's houses of wood and paper in an "experimental" raid on 4 February 1945 [[source/wikipedia-en-bombing-of-kobe|§ February 4 raid]]. On 16–17 March 1945, 331 B-29s firebombed the city: 8,841 residents were confirmed killed in the firestorms, three square miles — 21 per cent of the urban area — burnt, more than 650,000 people lost their homes and the homes of another million were damaged [[source/wikipedia-en-bombing-of-kobe|§ March 16–17 raid]]. Two airmen of a downed bomber were tried for the "indiscriminate bombing" of Kobe and Osaka and shot [[source/wikipedia-en-bombing-of-kobe|§ March 16–17 raid]]. On 5 June 1945 incendiaries from 530 bombers destroyed a further 3.8 square miles, and 51 per cent of the built-up area was then damaged [[source/wikipedia-en-bombing-of-kobe|§ Other raids]].

  ## Grave of the Fireflies

  Akiyuki Nosaka's semi-autobiographical short story *Grave of the Fireflies* (1967) is set during the bombing [[source/wikipedia-en-bombing-of-kobe|§ See also]]. Isao Takahata's animated film of the same name (1988), made at Studio Ghibli, follows two orphaned siblings who struggle to survive in Kobe after the raid of March 1945 in the last months of the war [[source/wikipedia-en-grave-of-the-fireflies|introduction]]: Seita, fourteen, and his sister Setsuko, four, lose their mother in the fire, move in with an aunt, then into an abandoned bomb shelter, which they light with fireflies; Setsuko dies of malnutrition shortly after Japan's surrender, and Seita of starvation [[source/wikipedia-en-grave-of-the-fireflies|§ Plot]]. Several critics called it an anti-war film; Takahata disagreed [[source/wikipedia-en-grave-of-the-fireflies|introduction]].

  In the lecture *War and Peace in East Asian Art* the film was shown in the anime session together with Katsuhiro Ōtomo's *Akira* (see [[term/anime|anime]]) [[source/thomsen-2019-war-and-peace|image list, 29 March 2019]]. The class notes read it as the fate of a single person and of how the population dealt with the victims of the war — treating them like "human waste" — and point to *genbaku bungaku*, the literature of the atomic bomb, which covers many of the war's atrocities [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]].
