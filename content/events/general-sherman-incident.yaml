description_md: In the 7th month of 1866 the American merchant ship General Sherman sailed up the Taedong river to force trade and was burnt at Pyongyang by its soldiers and people[[source/aks-general-sherman|「1866년(고종 3) 7월 미국 상선 제너럴셔먼호가 평양에서 군민의 화공으로 불타버린 일이다」]]. In 1871 five American warships attacked Ganghwa island in retaliation and were driven back[[source/portal-2000|p. 109]].
