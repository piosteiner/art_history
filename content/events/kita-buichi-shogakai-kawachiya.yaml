name: Kita Buichi's Shogakai at the Kawachiya
kind: gathering
period: 1826/1828
period_label: 8th month, 28th day, between 1826 and 1828 (lunar calendar)
place: tokyo
description_md: Kita Buichi, a son of the painter Kita Busei, invited guests to a *[[term/shogakai|shogakai]]* at the Kawachiya in Yanagibashi on the 28th day of the eighth month of a year between 1826 and 1828 [[source/koyama-2026-ryogoku-yanagibashi-shogakai|pp. 31–33]]. The day was the last of the Ryōgoku river season, with fireworks [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 36]].
