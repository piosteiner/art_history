description_md: The second world’s fair in Paris, decreed by Napoleon III in 1864 and held on the Champ de Mars from 1 April to 3 November 1867.[[source/wikipedia-en-exposition-universelle-1867]] It was the first in which Japan formally took part:[[source/wikipedia-en-first-japanese-embassy-to-europe-1862]] the shogunate sent the [[event/tokugawa-akitake-mission|Tokugawa Akitake Mission]],[[source/wikipedia-en-tokugawa-akitake]] and for the first time Japan showed works of art in a national pavilion, many of them from the Satsuma and Saga domains. The fair brought many visitors into contact with Japanese art, and French artists took up the influence that grew into [[movement/japonisme|Japonisme]].[[source/wikipedia-en-exposition-universelle-1867]]
