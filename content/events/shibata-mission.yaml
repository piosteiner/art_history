name: Shibata Mission
names:
  - lang: ja
    role: original
    text: "{慶応元年遣欧使節|けいおうがんねんけんおうしせつ}"
kind: embassy
period: 1865/1866
description_md: "Sent by the Tokugawa shogunate to France and Britain in the intercalary fifth month of Keiō 1 (summer 1865), with [[person/shibata-takenaka]] as chief envoy, to prepare the building of an ironworks — the later Yokosuka arsenal — and to study Western military systems. In France, which it reached in the seventh month, it concluded the agreements for the ironworks and for military training; in Britain, which was drawing closer to the Satsuma domain, it achieved nothing. It left France in the eleventh month and was back in Japan in the first month of Keiō 2 (early 1866).[[source/wikipedia-ja-shibata-takenaka]] Shibata had asked both countries to send officers to train the shogun’s army: Britain declined, France accepted — the first French military mission to Japan (1867–1868), which Shibata organised.[[source/wikipedia-en-shibata-takenaka]]"
