description_md: The Daewongun's renewed suppression of Catholicism in 1866 killed nine French missionaries; in retaliation a French squadron under Admiral Roze seized Ganghwa island and took away important documents and books from the royal library[[source/portal-2000|p. 109]]. Korean forces drove the French back at the Jeongjoksan fortress[[source/aks-byeongin-yangyo|「1866년(고종 3) 흥선대원군의 천주교 탄압에 대한 보복으로 프랑스군이 강화도에 침입한 사건이다 … 정족산성에서 프랑스 군대를 격퇴했다」]].
