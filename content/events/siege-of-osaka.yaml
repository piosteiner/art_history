description_md: The Tokugawa campaigns of 1614–1615 against the Toyotomi at Osaka castle, which ended the Toyotomi line[[source/history-of-japanese-art|pp. 238–239]]; art history lets the Momoyama period run until then, and Mason and the Kyoto National Museum begin the Edo period with it[[source/wikipedia-ja-azuchi-momoyama-jidai|美術史では、慶長20年（1615年）の豊臣家滅亡までを…]].
