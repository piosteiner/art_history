description_md: Faced with the Mongols' invasion of 1231, the military regime moved the Goryeo capital to Ganghwa island in 1232, exploiting the Mongols' fear of the sea; they invaded six times in thirty years while the court lived on in comfort on the island[[source/portal-2000|p. 78]]. The move, carried out by Choe U, kept Ganghwa the capital until the return to Kaesong in 1270[[source/aks-ganghwa-cheondo|「1232년(고종 19) 몽골의 침략에 대항하기 위해 도읍지를 강화도로 옮긴 사건이다. 이는 최우(崔瑀)에 의해 단행되었고, 1270년(원종 11) 개경(開京)으로 환도(還都)할 때까지」]].
