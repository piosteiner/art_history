description_md: The Tokugawa shogunate’s first diplomatic mission to the United States, sent in 1860 to ratify the new Treaty of Friendship, Commerce and Navigation — the first since Commodore Perry’s opening of Japan in 1854. The warship Kanrin Maru, crewed by Japanese sailors, accompanied the delegation across the Pacific to show how far Japan had mastered Western navigation.[[source/wikipedia-en-japanese-embassy-to-the-united-states]] [[person/fukuzawa-yukichi]] sailed on it as steward to its captain, Kimura Yoshitake.[[source/wikipedia-en-fukuzawa-yukichi]]
