description_md: Sent to Europe by the Tokugawa shogunate to learn about Western civilisation, to ratify treaties and to delay the opening of cities and harbours to foreign trade. It was led by Takenouchi Yasunori, governor of Shimotsuke Province, with Shibata Takenaka at the head of its staff; [[person/fukuzawa-yukichi]] was one of its two translators. The forty men left Shinagawa on 21 January 1862 and negotiated in France, Britain, the Netherlands, Prussia, Russia and Portugal. In the London Protocol of 6 June 1862 Britain accepted that the opening of Osaka, Hyōgo, Edo and Niigata be postponed by five years, to 1 January 1868. In London the mission visited the World Fair of 1862 — five years later Japan formally took part in the Paris World Fair of 1867 — and its members were photographed by Nadar. It returned on 30 January 1863. Despite its name it was the third Japanese embassy to reach Europe, after the Tenshō embassy (1582–1590) and Hasekura Tsunenaga’s expedition (1613–1620).[[source/wikipedia-en-first-japanese-embassy-to-europe-1862]]
