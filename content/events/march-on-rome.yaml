description_md: |-
  The March on Rome (*Marcia su Roma*) of October 1922 brought [[person/benito-mussolini|Benito Mussolini]]'s National Fascist Party to power [[source/wikipedia-en-march-on-rome|§ Introduction]]. After the Red Biennium of 1919–20, Fascist squads — the squadristi or Blackshirts ([[squadrismo]]) — had attacked socialist politicians, unions and local governments, often unhindered by the police [[source/wikipedia-en-march-on-rome|§ Background]]. On 24 October 1922 Mussolini told 60,000 militants in Naples: "Our program is simple: we want to rule Italy." [[source/wikipedia-en-march-on-rome|§ The March]]. On 28 October Blackshirt columns approached the capital; King Victor Emmanuel III refused to sign the state of siege requested by Prime Minister Luigi Facta and on 30 October appointed Mussolini prime minister, and on 31 October the Blackshirts paraded in Rome [[source/wikipedia-en-march-on-rome|§ Introduction]]. The march, of fewer than 30,000 men, was not the seizure of power Fascism later celebrated but the trigger of a constitutional transfer of power, made possible by the authorities' surrender to intimidation [[source/wikipedia-en-march-on-rome|§ The March]].

  The regime made it its founding myth. The Fascist calendar counted 1922 as Year I ([[era-fascista]]), and 28 October was celebrated as the day of the Fascist Revolution [[source/antliff-2002|p. 162]] [[source/steiner-2025-mario-sironi|p. 5]]. Participants received a commemorative medal from 1923 [[source/wikipedia-en-march-on-rome|§ Commemorative medal]]. On the first anniversary in 1923, [[artist/adolfo-wildt|Adolfo Wildt]] showed his plaster mask of Mussolini ([[artwork/wildt-maschera-di-mussolini]]) [[source/manchester-wildt-maschera-di-mussolini]]; on the tenth, 28 October 1932, the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] opened in Rome, its narrative leading up to the March [[source/antliff-2002|p. 157]] [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. [[artist/giacomo-balla|Giacomo Balla]] painted the march ten years later ([[artwork/balla-marcia-su-roma]]) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]]. On the third anniversary, in 1925, Mussolini defined Fascism as a system in which "nothing is outside the state" [[source/wikipedia-en-benito-mussolini|§ Consolidation of power]].
