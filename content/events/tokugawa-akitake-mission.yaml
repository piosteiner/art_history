public_id: 116219
name: Tokugawa Akitake Mission
kind: embassy
period: 1867-02/1868-12-06
description_md: The shogunate’s mission to the [[event/1867-paris-world-s-fair|Paris World’s Fair of 1867]], headed by the fourteen-year-old [[person/tokugawa-akitake]] as the representative of his half-brother, the shogun Tokugawa Yoshinobu. He was chosen because Napoleon III’s son, then ten, was close to him in age, and because after the fair he was to visit the courts of Europe and study in Paris for three to five years. Its 28 members — among them the foreign commissioner Mukōyama Kazufumi (向山一履) in charge and Shibusawa Eiichi as accountant — left Yokohama on a French steamer in the first month of Keiō 3 (February 1867) and reached France about fifty days later, by way of Hong Kong, Saigon, Singapore, Ceylon and Suez.[[source/wikipedia-ja-tokugawa-akitake]] Akitake was received by Napoleon III and, after the fair, by William III of the Netherlands, Leopold II of Belgium, Victor Emmanuel II of Italy and Queen Victoria, and then studied in Paris.[[source/wikipedia-en-tokugawa-akitake]] With the shogun’s return of power to the emperor and the Boshin War the mission lost its standing; most of its members went home. When the Meiji government’s order to return reached him, Akitake sailed from Marseille on 18 October 1868 and landed at Kanagawa on 6 December 1868.[[source/wikipedia-ja-tokugawa-akitake]]
