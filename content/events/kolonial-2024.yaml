description_md: |-
  The exhibition on Switzerland's colonial entanglements at the [[institution/swiss-national-museum]], Landesmuseum Zürich; the seminar visited it on 5 November 2024 [[source/beatrice-marinho-2024-art-and-totalitarianism|programme, session 4]] — read with Purtschert, Falk and Lüthi on Switzerland's "colonialism without colonies" [[source/purtschert-falk-luthi-2016]].

  ## In the seminar

  The visit to the exhibition was the fourth session of the seminar "Art and Totalitarianism" at the University of Zurich, with a meeting point in front of the museum at Museumstrasse 2 [[source/beatrice-marinho-2024-art-and-totalitarianism|programme, session 4]]. The exhibition was discussed again in the seventh session, on colonialism and art, on 17 December 2024, together with readings on colonial museums in France, Belgium and Italy and on Italian colonial architecture [[source/beatrice-marinho-2024-art-and-totalitarianism|programme, session 7]] [[source/falcucci-2021|p. 676]]. The class notes on the visit record the questions the exhibition raised: whether mercenaries or settlers were recruited by foreign firms or states, how "exotic" regions and people were represented — staged, instrumentalised, out of fascination or Orientalism — and how objects and people moved back from the colonies to the colonising countries [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 5 November 2024]].

  ## "Colonialism without colonies"

  The accompanying reading applies the concept of "colonialism without colonies" to places such as Switzerland that were "highly involved in and affected by colonialism without having developed a respective self-conceptualization" [[source/purtschert-falk-luthi-2016|p. 287]]. The authors define it as "the presence and perseverance of colonial structures and power relations in countries that, according to the dominant (self-)perception, have neither been a colonial power nor a colony" [[source/purtschert-falk-luthi-2016|p. 291]]. They note that it is taken for granted, by the government and in public debate, that Switzerland had nothing to do with colonialism or the transatlantic slave trade; when it emerged in 2003 that Swiss participation in the slave trade had been far more extensive than believed, the Federal Council answered that Switzerland aimed "to play a mediating role between African states and former colonizing powers" [[source/purtschert-falk-luthi-2016|pp. 290–291]].

  Earlier research had already linked Switzerland to imperialism: in 1932 Richard Fritz Behrendt wrote that Switzerland reaped the benefits of colonial constellations without military responsibility and called it a *tertius gaudens*, "the third who benefits"; others spoke of a "secret empire" where "no Swiss flags" fly, of a "bank and stock exchange imperium" and of a "part-time colonial power" [[source/purtschert-falk-luthi-2016|pp. 291–292]]. In this view, Switzerland's self-presentation as neutral and humanitarian stands in a constitutive relation to its imperial conduct: "the humanitarian efforts yielded immaterial profits: moral prestige and international repute" [[source/purtschert-falk-luthi-2016|p. 292]].

  ## Colonial images in Swiss everyday life

  As a case study the authors take "Swiss commodity racism", after Anne McClintock's term for a racism spread through the purchase and use of consumer goods [[source/purtschert-falk-luthi-2016|pp. 293–294]]. From around 1900 rising consumerism carried colonial goods and images into Swiss society through advertisements, packaging, photography, film, children's books, exhibitions and museums [[source/purtschert-falk-luthi-2016|p. 294]]. In 1932 the Zurich department store Globus invented its mascot Globi, a blue parrot who carried children off to exotic places "chock-full of colonial images", and in April 1933 it launched, in the *Tages-Anzeiger*, a campaign for white linens around the figure of the "white negro" — an African figure with a white face, black hands and feet, shown like a small child on a stage before a desert backdrop [[source/purtschert-falk-luthi-2016|pp. 294–295]]. The authors read it as a reassemblage of colonial elements familiar to the Swiss public, among them the people's shows (*Völkerschauen*): between 1879 and 1939 about a hundred such shows were staged in Switzerland, in zoos, restaurants, parks and theatres [[source/purtschert-falk-luthi-2016|p. 297]]. Such images continued: in 2004 Globus advertised its "style colonial" in the *Neue Zürcher Zeitung* with the words "Dream of the good, old colonial times …" [[source/purtschert-falk-luthi-2016|p. 298]].

  ## Swiss mercenaries

  Among the cases raised during the visit was that of Hans Christoffel, noted in the class notes as a man who did not act "as a Swiss" and gave up his citizenship to receive his sword of honour [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 5 November 2024]]. Christoffel (1865–1962), from Rothenbrunnen in the Grisons, enlisted in the Royal Netherlands East Indies Army in 1886, fought in the Aceh War, and from 1905 led a brigade, the "tiger column", notorious for torture, executions and the kidnapping of relatives; in 1906 he gave up his Swiss citizenship for Dutch, and on 13 November 1909 he was awarded a sabre of honour [[source/wikipedia-de-hans-christoffel-soldner|§ Leben; § Orden und Auszeichnungen]]. The objects he bought, stole or looted in South-East Asia, given to the museum of Antwerp in 1922, are now in the Museum aan de Stroom [[source/wikipedia-de-hans-christoffel-soldner|§ Leben]]. The exhibition's publication, *kolonial – Globale Verflechtungen der Schweiz* (Zurich 2025), includes Philipp Krauer's essay on the global dimensions of Swiss mercenary service [[source/wikipedia-de-hans-christoffel-soldner|§ Literatur]].
