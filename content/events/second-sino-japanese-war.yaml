description_md: Japan's invasion of the Chinese mainland in 1937, the beginning of its campaign for empire throughout Asia and the Pacific in the Second World War[[source/history-of-japanese-art|pp. 346–347]]; it began with the clash at the Marco Polo Bridge (Lugou Bridge) southwest of Beijing on 7 July 1937[[source/wikipedia-ja-rokokyo-jiken|「1937年（昭和12年）7月7日に…盧溝橋で起きた日本軍と中国国民革命軍第二十九軍との衝突事件」]]. Artists such as Onchi Kōshirō were sent to China as war artists[[source/history-of-japanese-art|pp. 386–387]].
