description_md: Toyotomi Hideyoshi's two invasions of Korea, 1592 and 1597, which failed and devastated the country[[source/history-of-japanese-art|p. 292]]; historians divide the Joseon period into an early and a late half at them[[source/portal-2000|p. 109]]. Thousands of Korean prisoners, among them potters, were taken to Japan, where they founded the porcelain industry of Arita[[source/history-of-japanese-art|pp. 292–293]].
