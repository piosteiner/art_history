public_id: 122700
name: Shogakai Kimoiri Dispute
kind: dispute
period: 1838
period_label: Tenpō 9 (1838), from the 3rd month 25th day (lunar calendar)
place: tokyo
description_md: On the 25th day of the third month of 1838 twenty-three Edo literati, [[artist/tani-buncho|Tani Bunchō]], Kikuchi Gozan and Kita Busei among them, met at the restaurant Chūshuntei to form a 'kimoiri' (肝煎) group that would control all *[[term/shogakai|shogakai]]* by a monthly rota and fixed fees [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 61–63]]. The plan was satirised in the same year in *Shogakai kimoiri nabe* and *Geirin shikairoku*, and opponents around Hata Ginkei held gatherings that expressly excluded the 'kimoiri' [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 61–69]]. Tōjō Kindai, who had joined the group, left it and held such a gathering at the Kawachiya in Yanagibashi five months later [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 66–69]].
