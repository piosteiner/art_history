description_md: |-
  ## The exhibition

  The *Mostra della Rivoluzione Fascista* opened in the Palazzo delle Esposizioni in Rome on 28 October 1932, the tenth anniversary of the [[event/march-on-rome|March on Rome]] [[source/antliff-2002|p. 157]] [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. [[person/benito-mussolini|Mussolini]] opened it, and in nearly two years almost four million people — 3,854,927 by the official count — saw it [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Introduction]] [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. The idea came from Dino Alfieri, president of the National Institute of Fascist Culture, in 1928; Alfieri directed it with Luigi Freddi and others [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Background]] [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. Mussolini wanted "something ultramodern and audacious, free from melancholy memories of the decorative styles of the past" [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Background]].

  The facade by Adalberto Libera and Mario De Renzi carried four tin-plate fasces 25 metres high [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]] [[source/braun-2000|p. ix, fig. 103]]. Inside, rooms designed by teams of a historian and an artist led visitors from the outbreak of the First World War through the founding of the Fasci in 1919 and the squad years to the March, then to a Room of the Duce [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. Designers included [[artist/mario-sironi|Mario Sironi]], Esodo Pratelli, Giuseppe Terragni and [[artist/arnaldo-carpanetti|Arnaldo Carpanetti]] [[source/antliff-2002|p. 154]]; Sironi designed the central rooms on the Fascists' "glorious" activities of 1919–22 [[source/antliff-2002|p. 157]], reproduced by Emily Braun as Rooms Q, R and S, with Terragni's Room O and Carpanetti's Room E [[source/braun-2000|p. ix, figs. 105–110]]. The visit ended in the cylindrical "Sacrarium to the Martyrs" by Libera and Antonio Valente, lit in red, with a large cross inscribed "For the Fatherland", the pennants of the action squads and recorded voices answering "Presente!" [[source/antliff-2002|p. 157]].

  ## Montage and ritual

  The installations used [[photomontage]], typography and "photomosaics" whose precedent lay in El Lissitzky's Soviet installations and in German Dada [[source/antliff-2002|p. 154]]. Braun concludes that montage here "simultaneously overstimulated and distracted the senses" and "did not alter the one-way direction of communication" [[source/antliff-2002|p. 154]]. She describes the visit as a rite of passage through "ritual reenactment and engulfing spectacle" towards rooms "devoted to the cult and apotheosis of a triumphant Fascism" [[source/antliff-2002|p. 157]]. For Jeffrey Schnapp, the passage from the dynamic early rooms to the static Sacrarium turned the violence of Fascism-as-movement into the solemn order of Fascism-as-regime [[source/antliff-2002|p. 157]].

  ## Later history

  Planned for six months, it was extended twice and closed in October 1934 [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. It was mounted again in 1937, beside the [[event/augustan-exhibition-of-romanity|Augustan Exhibition of Romanity]], and in 1942 with a room against Jews and Communists [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Subsequent events]]. The seminar set it among the great exhibitions of the totalitarian regimes, beside the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] of 1937 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 31, 69]], and paired it with [[artist/umberto-boccioni|Umberto Boccioni]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 67]].
