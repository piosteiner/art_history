description_md: |-
  Some of the Restoration's most powerful leaders left Japan in 1871 on a two-year tour of Europe and the United States to study their institutions[[source/history-of-japanese-art|pp. 342–345]]: led by Iwakura Tomomi as ambassador, with Kido Takayoshi, Ōkubo Toshimichi and Itō Hirobumi, the mission travelled through America, Britain, France, Eastern Europe and Russia to prepare the revision of the treaties[[source/ndl-iwakura-mission|「明治4（1871）年11月、岩倉具視を特命全権大使とし…遣外使節団が日本を出発した。使節団は、約2年をかけて」]].

  It built on the shogunate’s earlier missions — the [[event/japanese-embassy-to-the-united-states|embassy to the United States]] of 1860 and the embassies to Europe of [[event/first-japanese-embassy-to-europe|1862]] and [[event/second-japanese-embassy-to-europe|1864]] — and about fifty government officials took part.[[source/wikipedia-en-iwakura-mission]] On its return the government set out to industrialise and “modernise” Japan as quickly as possible, and at the same time to gain standing equal to that of the Western powers.[[source/history-of-japanese-art|pp. 342–345]]
