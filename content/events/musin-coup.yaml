description_md: "In 1170 the military officers rose against a court dominated by civil officials: King Uijong was deposed and replaced by his younger brother, and power fell to the military[[source/portal-2000|p. 78]]. Led by Jeong Jung-bu, Yi Ui-bang and Yi Go, the coup opened a century of military rule and is seen as the watershed between the early and the late Goryeo period[[source/aks-musillan|「정변의 성공으로 이후 100년 간 … 무신 정권 시대가 연출됨으로써 고려시대 전기, 후기를 나누는 고려 역사의 분수령」]]."
