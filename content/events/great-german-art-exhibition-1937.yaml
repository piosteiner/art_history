description_md: |-
  The first Great German Art Exhibition (Grosse Deutsche Kunstausstellung) opened the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich, which the regime built after the city's old exhibition building had burned down in 1931 and promoted with a large campaign. Together with journals such as *Die Kunst im Dritten Reich*, the annual exhibitions from 1937 were meant to give artists aesthetic guidelines and to answer the supposed decay of the Weimar years — but no one knew precisely which art should be the official art of the Third Reich.[[source/peters-2017|pp. 12–13]] Völkisch circles around Bettina Feistel-Rohmeder and [[person/alfred-rosenberg|Rosenberg]]'s Combat League produced mediocre political art that even Hitler rejected, while [[person/joseph-goebbels|Goebbels]] and those around him hoped for some form of German Expressionism; as late as 1936 the Munich Gauleiter Adolf Wagner told a committee member that Nolde and Barlach could be shown — "we are not excluding any names, only works".[[source/peters-2017|pp. 13–14]]

  ## The jury crisis

  The nine-member jury included Gerdy Troost, the architect's widow, the sculptors Karl Albiker, Josef Wackerle and [[artist/arno-breker|Arno Breker]], the painter Conrad Hommel and, for the Reich Chamber of Culture, [[artist/adolf-ziegler|Adolf Ziegler]] and the graphic artist Hans Schweitzer ("Mjölnir"). When Hitler and Goebbels viewed its selection on 5 June 1937, Hitler was "wild with rage"; Goebbels called some of the paintings "outright catastrophic". No guidelines were formulated in response — the jury was simply replaced, and from then until 1944 Hitler's photographer Heinrich Hoffmann chose the works: in 1937 about 1,500 of some 15,000 submissions, for what was also a sales exhibition.[[source/peters-2017|pp. 14–16 and n. 27]] The humiliation of Goebbels's subordinates led directly to the [[event/degenerate-art-exhibition|*Entartete Kunst*]] exhibition, opened next door on the following day.[[source/peters-2017|pp. 18–23]]

  ## Organisation and figures

  A call in the bulletin of the Reich Chamber of Fine Arts in December 1936 asked German artists for their best works, no tendency to be favoured; 25,000 works were announced and 15,000 sent in. The exhibition was organised by the public body "Haus der Deutschen Kunst (Neuer Glaspalast)" under its director Karl Kolb, overseen by Gauleiter Adolf Wagner as state commissioner. Goebbels's diary of 6 June 1937 records the jury's paintings as "in part outright catastrophic"; Hitler replaced the jury by his photographer Heinrich Hoffmann, who made the preselection, while Hitler himself took the final decision.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Vorgeschichte; § Auswahlprozess]] In the end it showed 884 works by 556 artists, from 18 July to 31 October 1937 [[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]] — fewer than the "about 1,500" Peters gives for Hoffmann's selection.[[source/peters-2017|p. 16, n. 27]] The works were not dated, so pictures from the Weimar years could be claimed for National Socialist art.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]

  It had 554,759 visitors and sold about 500 works for about 750,000 Reichsmark; Hitler himself bought for 268,449 Reichsmark. It was the first of eight exhibitions, held every year until 1944; the last closed when American troops entered Munich on 30 April 1945.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Kunstmesse; § Künstler und Besucher; § Bewertung]]

  ## What was shown

  Opening the exhibition, Hitler set "modern" art, as decay, against "German" art, the rebirth of the unchanging Nordic and Germanic, and spoke of a new "community art" free of everything foreign and elitist as well as everything trivial; he had to admit that the development of a new German art would be a long process.[[source/hermand-1994|p. 41]][[source/peters-2017|p. 16]] What dominated was nineteenth-century genre painting: about forty percent of the pictures were pastoral landscapes of a pre-industrial world, thirty-five percent portraits and country scenes, ten percent animals and only five percent explicitly National Socialist subjects such as SA men or party leaders; peasant life made up about twenty percent, the factory a mere two. Painters of the turn of the century — Angelo Jank, Fritz Mackensen, Otto Modersohn, Heinrich von Zügel — hung beside the new peasant painters Adolf Wissel, Oskar Martin-Amorbach and Sepp Hilz, who could have painted the same pictures forty years earlier.[[source/hermand-1994|p. 46]] Its attendance was about a quarter of the two million claimed for the degenerate-art show — evidence, for Peters, of a comparatively small interest in the regime's official art.[[source/peters-2017|p. 26]]
