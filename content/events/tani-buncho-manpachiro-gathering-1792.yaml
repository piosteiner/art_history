public_id: 122698
name: Tani Bunchō's Gathering at the Manpachirō
kind: gathering
period: 1792-02-09
period_label: Kansei 4, 1st month, 17th day (1792)
place: tokyo
description_md: On the 17th day of the first month of 1792 [[artist/tani-buncho|Tani Bunchō]] held a banquet at the Manpachirō (Yorozuya) in Yanagibashi, Edo, at which painters inscribed works at the table that were afterwards mounted together as a scroll [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 33, n. 4]]. [[person/ota-nanpo|Ōta Nanpo]] wrote that 'the so-called *shogakai* of recent times began with this' [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 33, n. 4]]. Kitamura Intei, on the other hand, recorded that Bunchō neither held *shogakai* nor attended other people's [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 36]].
