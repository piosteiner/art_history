public_id: 116833
name: Decree on the Monuments of the Republic
kind: decree
period: 1918-04-12
place: moscow
description_md: "Issued by the Council of People's Commissars: the tsarist monuments were to be removed and replaced with statues and plaques of progressive cultural and political figures. [[person/vladimir-lenin]], the force behind it, took the idea from Campanella's *City of the Sun* [[source/kalashnikov-2023|p. 16]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]."
