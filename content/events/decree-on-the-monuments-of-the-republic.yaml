public_id: 116833
name: Decree on the Monuments of the Republic
kind: decree
period: 1918-04-12
place: moscow
description_md: |-
  On 12 April 1918, a few months after the Bolsheviks took power in Petrograd, the Council of People's Commissars issued the decree "On the monuments of the republic" [[source/kalashnikov-2023|p. 16]]. It ordered the tsarist monuments to be removed and replaced with statues and plaques of progressive cultural and political figures [[source/kalashnikov-2023|p. 16]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. The removed monuments were to go into a museum of bad taste [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].

  ## Lenin's plan

  [[person/vladimir-lenin|Vladimir Lenin]], the force behind it, took the idea from Tommaso Campanella's *City of the Sun*, where monuments and murals educated the citizens [[source/kalashnikov-2023|p. 16]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. The initiative became known as the Lenin Plan for Monumental Propaganda, and for decades Soviet monument builders named it as their model [[source/kalashnikov-2023|p. 16]]. Its monuments spoke to contemporaries, not to posterity: Lenin himself said, "do not think that I . . . imagine marble, granite, and gold letters. For now, we must make everything modestly", and Anatolii Lunacharskii, commissar of enlightenment, wanted them to "serve precisely the task of extensive propaganda, rather than immortalization" [[source/kalashnikov-2023|p. 17]]. In the civil war the leaders hoped that monuments of revolutionary heroes would inspire people to defend the workers' state [[source/kalashnikov-2023|p. 17]].

  The list of subjects, fixed in late July 1918, was dominated by figures of the eighteenth and nineteenth centuries; only two had been active in the Revolution, Georgii Plekhanov and V. Volodarskii [[source/kalashnikov-2023|p. 17]]. The decree also asked for designs marking "the great days of the Russian socialist revolution" — Vladimir Tatlin's [[artwork/monument-to-the-third-international]] was commissioned under the plan [[source/kalashnikov-2023|p. 17]]. Vera Mukhina designed a monument to the publicist Nikolay Novikov within it in 1918, but her clay model cracked in an unheated workshop [[source/wikipedia-en-vera-mukhina|§ Biography]].

  ## Results

  Only a few dozen statues and some plaques were made, in cheap, temporary materials that soon fell apart or were demolished; considered a failure even by its supporters, the plan was given up by 1921 [[source/kalashnikov-2023|p. 19]]. The cubist monuments of avant-garde sculptors like [[artist/boris-korolev|Boris Korolev]] were not understood and soon taken down in favour of more traditional busts [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. From 1922 to 1931 only eight free-standing monuments were commissioned by central decree [[source/kalashnikov-2023|p. 19]]. Only in the Stalin period did monuments take on the self-commemorative function, built to last for posterity, for which the regime spent unprecedented resources [[source/kalashnikov-2023|p. 16]] [[source/kalashnikov-2023|pp. 21–22]].
