description_md: "The sea battle in the strait of Shimonoseki in which the Minamoto destroyed the Taira[[source/history-of-japanese-art|pp. 166–167]] — 25 April 1185 in the Julian calendar (2 May in the Gregorian, as stored here)[[source/wikipedia-en-kamakura-period|“1185: the rival Taira clan is defeated at sea at the Battle of Dan-no-ura”]]. After it Minamoto no Yoritomo won the right to appoint military governors and land stewards, the prevailing date for the end of the Heian and the beginning of the Kamakura period."
