name: Unification of the Three Kingdoms by Silla
names:
  - lang: ko
    role: original
    text: 신라의 삼국 통일
kind: unification
period: 668
place: gyeongju
description_md: In 668, allied with Tang China, Silla brought most of the Korean peninsula under its rule after the fall of Baekje (660) and Goguryeo (668)[[source/portal-2000|p. 43]]. Silla's final victory over its former ally Tang, which drove the Tang armies from the peninsula, came only in 676[[source/aks-silla|「676년 최후의 승리를 거두었다」]].
