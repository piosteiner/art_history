description_md: Also called the Ikeda Mission, after its head Ikeda Nagaoki; Kawazu Sukekuni was his assistant. After Emperor Kōmei’s “order to expel the barbarians” of 1863 and the bombardments of Shimonoseki, the shogunate sent it to obtain France’s agreement to closing the harbour of Yokohama to foreign trade — a return to [[sakoku]]. The task proved impossible, since Yokohama had become the centre of the foreign presence in Japan. On the way, the members were photographed before the Sphinx by Antonio Beato, and in Paris by Nadar; the mission returned in failure on 23 August 1864.[[source/wikipedia-en-second-japanese-embassy-to-europe-1864]]
