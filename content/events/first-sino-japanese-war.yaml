description_md: The war between Qing China and Japan over control of Korea; Japan opened it in July 1894 with an attack on the Gyeongbokgung palace in Seoul[[source/aks-sino-japanese-war|「청일전쟁은 1894년~1895년 조선에 대한 지배권을 둘러싸고 중국(청)과 일본 간에 벌어진 전쟁이다 … 1894년 7월 경복궁을 기습 공격함으로써」]]. Its military successes, with those of the Russo-Japanese War, fed Japan's nationalism and its turn to empire[[source/history-of-japanese-art|pp. 346–347, 382–383]].
