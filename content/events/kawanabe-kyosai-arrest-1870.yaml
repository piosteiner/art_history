public_id: 122702
name: Arrest of Kawanabe Kyōsai
kind: arrest
period: 1870
period_label: Meiji 3 (1870), 10th month, 6th day (lunar calendar)
place: tokyo
description_md: In the tenth month of 1870 a comic picture that [[artist/kawanabe-kyosai|Kawanabe Kyōsai]] drew, drunk, at a *[[term/shogakai|shogakai]]* in a restaurant in the precinct of the Benzaiten at Shinobazu Pond in Ueno was denounced as a satire on government leaders, and he was held for three months [[source/shimizu-sekai-daihyakka-kawanabe-kyosai|s.v. 河鍋暁斎]]. After his release he changed the 狂 of his art name Kyōsai to 暁 [[source/shimizu-sekai-daihyakka-kawanabe-kyosai|s.v. 河鍋暁斎]] [[source/britannica-kokusai-kawanabe-kyosai|s.v. 河鍋暁斎]]. Japanese Wikipedia gives the 6th day of the tenth month and names the restaurant Chōdatei [[source/wikipedia-ja-kawanabe-kyosai|§ 明治の暁斎]].
