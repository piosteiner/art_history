description_md: "The second of the two rebellions after Toba's death[[source/history-of-japanese-art|pp. 102–103]]: Minamoto no Yoshitomo led a coup planned by the Fujiwara and imprisoned the cloistered emperor Go-Shirakawa — the events the Heiji monogatari emaki tells[[source/history-of-japanese-art|pp. 182–183]]. It broke out on the 9th day of the 12th month of Heiji 1 — 19 January 1160 in the Western calendar, which is why it is dated 1159 or 1160[[source/wikipedia-ja-heiji-no-ran|「平治元年12月9日（1160年1月19日）」]]."
