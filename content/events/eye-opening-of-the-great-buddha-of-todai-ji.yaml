name: Eye-opening of the Great Buddha of Tōdai-ji
names:
  - lang: ja
    role: original
    text: 東大寺大仏開眼供養
kind: dedication
period: 752
place: nara
description_md: "The apogee of the Tōdaiji project: in the spring of 752 a magnificent eye-opening ceremony was held for the colossal Birushana (Vairocana) Buddha[[source/history-of-japanese-art|pp. 60–61, 84–85]]. Ordered in 743 and cast in 749, the Buddha was consecrated in Tenpyō-shōhō 4 (752)[[source/todaiji-history|「天平15年（743）に盧舎那大仏造顕（造立）の詔が発せられ…天平21年（749）仏身が鋳造…天平勝宝4年（752）に盛大な開眼」]]."
