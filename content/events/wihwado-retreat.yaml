description_md: In 1388 the general Yi Seong-gye, ordered to invade the Liaodong peninsula held by Ming China, turned back at Wihwa island in the Amnok (Yalu) river to Kaesong and staged a coup d'état[[source/wikipedia-en-wihwado-retreat|“instead decided to turn back to Kaesong and stage a coup d'état”]]; four years later he founded the Joseon dynasty[[source/portal-2000|p. 109]].
