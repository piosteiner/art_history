description_md: "After the fall of Baekje and Goguryeo, Silla turned against its ally: it met the Chinese army in a series of battles in the basin of the Han river and drove it back in 676[[source/portal-2000|p. 66]]. The war began with Silla's attack in March 670 and ended with the battle of Gibeolpo in November 676, after Silla's victory at Maesoseong in 675[[source/aks-silla-tang-war|「670년 3월 신라의 오골성 선제 공격으로 시작되어 676년까지 … 675년 9월의 매소성 전투 … 676년 11월 기벌포 전투를 끝으로」]]."
