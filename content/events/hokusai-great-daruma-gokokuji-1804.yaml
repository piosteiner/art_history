public_id: 122703
name: Hokusai's Great Daruma at the Gokokuji
kind: performance
period: 1804
period_label: Bunka 1, 4th month, 13th day (1804) (lunar calendar)
place: tokyo
description_md: During the public display of the Kannon of the Gokokuji in Edo, on the 13th day of the fourth month of 1804, [[artist/katsushika-hokusai|Katsushika Hokusai]] painted a half-length Daruma beside the hall on joined paper of 120 mats, with brooms for brushes and a sake tub for ink [[source/kato-hokusai-kyokuhitsu-daruma|§ 1804]]. Only from the hall above could the crowd see the whole face, whose eye was large enough to seat a person [[source/kato-hokusai-kyokuhitsu-daruma|§ 1804]].
