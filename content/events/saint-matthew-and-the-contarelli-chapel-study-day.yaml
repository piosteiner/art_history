description_md: "Study days on the [[institution/contarelli-chapel]] and Caravaggio’s three paintings of Saint Matthew, organised by the French Embassy to the Holy See and the Pieux Établissements de la France à Rome et à Lorette with the Académie de France à Rome – Villa Médicis, in the Jubilee Year 2025: six specialists on the figure of Saint Matthew, the subjects and narratives of the paintings and the new genre of religious painting they created. The programme speaks of two days; the Villa Medici lists 29 April 2025."
