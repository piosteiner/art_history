description_md: |-
  The exposition took place during the Spanish Civil War; in autumn 1936 the government of the [[polity/second-spanish-republic|Second Spanish Republic]] considered taking part “indispensable” despite the war.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]][[source/museo-nacional-centro-the-endurance-of-the-pavilion-of-1937-repensar-guernica]] Its pavilion, inaugurated in July 1937, was the mouthpiece in Europe for the Republican cause, seeking international backing against fascism.[[source/museu-nacional-dart-the-pavilion-of-the-spanish-republic-in-paris-museu-nacional-dart-de-c]][[source/calder-foundation-mercury-fountain-1937-calder-foundation]] The organisers placed the pavilions of the [[polity/soviet-union|Soviet Union]] and [[polity/nazi-germany|Nazi Germany]] opposite one another, probably hoping to underline the contrast between two warring systems, but the effect was the opposite: both were neoclassical and monumental, and they looked alike.[[source/golomstock-1990|pp. 132–137]] Their architects, Albert Speer and [[artist/boris-iofan|Boris Iofan]], each received a gold medal.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]][[source/wikipedia-en-worker-and-kolkhoz-woman]]

  The exposition covered 101 hectares at the Trocadéro, on the Champ-de-Mars and along the Seine, with 45 nations taking part.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]] Two museum buildings were built for it, the Palais de Chaillot and the Palais de Tokyo.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]] [[artist/le-corbusier|Le Corbusier]] and [[artist/pierre-jeanneret|Pierre Jeanneret]] showed their canvas Pavillon des Temps Nouveaux, and Alvar Aalto's Finnish pavilion was built entirely of timber.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]]

  [[artist/pablo-picasso|Pablo Picasso]] painted [[artwork/guernica|Guernica]] for the Spanish pavilion between 1 May and 4 June 1937; the Republic's government acquired it from him that year.[[source/museo-nacional-centro-guernica]] The pavilion by [[artist/josep-lluis-sert|Josep Lluís Sert]] and Luis Lacasa also showed [[artist/alexander-calder|Alexander Calder]]'s *Mercury Fountain*, [[artist/joan-miro|Joan Miró]]'s mural *The Catalan Peasant in Revolt (The Reaper)*, since lost, and [[artist/julio-gonzalez|Julio González]]'s *La Montserrat*.[[source/museu-nacional-dart-the-pavilion-of-the-spanish-republic-in-paris-museu-nacional-dart-de-c]] Calder, the only foreign artist in the pavilion, used mercury from Almadén as a symbol of Republican resistance to fascism.[[source/calder-foundation-mercury-fountain-1937-calder-foundation]] [[artist/vera-mukhina|Vera Mukhina]]'s realist sculpture [[artwork/worker-and-kolkhoz-woman|Worker and Kolkhoz Woman]] soared up from the Soviet pavilion,[[source/cioli-ricciardi-schiera-2019|p. 104]] a group of stainless steel 24.5 metres high.[[source/wikipedia-en-worker-and-kolkhoz-woman]] [[artist/josef-thorak|Josef Thorak]]'s *Comradeship* stood outside Speer's German pavilion.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]] [[person/marcello-piacentini|Marcello Piacentini]] designed the Italian pavilion, where [[artist/mario-sironi|Mario Sironi]]'s *Fascist Work* was installed.[[source/braun-2000|p. 183, fig. 128; p. 185, fig. 129]] Another source names Sironi's work there as the mosaic *Corporative Italy*.[[source/wikipedia-en-exposition-internationale-des-arts-et-techniques-dans-la-vie-moderne]] [[artist/raoul-dufy|Raoul Dufy]]'s [[artwork/la-fee-electricite|La Fée Électricité]], 250 plywood panels covering 600 square metres, depicted the scientists and inventors of electricity in the Pavilion of Light and Electricity.[[source/guggenheim-museum-bilbao-the-spirit-of-electricity-guggenheim-museum-bilbao]]
