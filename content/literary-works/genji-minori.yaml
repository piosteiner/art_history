description_md: Lady Murasaki, the true love of Genji's life, is dying. On a stormy evening Genji, Murasaki and the daughter she raised sit together looking at her garden, planned to be beautiful the whole year and now a tangle torn by the wind — the scene of the [[artwork/genji-monogatari-emaki]] (Tokugawa Art Museum).[[source/history-of-japanese-art|p. 118, fig. 141]]
