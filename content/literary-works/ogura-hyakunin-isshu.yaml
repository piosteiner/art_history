description_md: One hundred [[waka]] by one hundred poets, one poem each; the standard version was compiled by Fujiwara no Teika (1162–1241) while he lived in the Ogura district of Kyoto, hence Ogura Hyakunin Isshu. The name also stands for the card game uta-garuta played with these poems.[[source/wikipedia-en-ogura-hyakunin-isshu]]
