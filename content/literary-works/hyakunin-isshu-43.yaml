public_id: 116373
name: Ai mite no
names:
  - lang: ja
    role: original
    text: 逢ひ見ての
kind: waka
parent: ogura-hyakunin-isshu
part_number: "43"
text_original: |-
  逢ひ見ての
  後の心に
  くらぶれば
  むかしは物を
  思はざりけり
text_lang: ja
text_romanization: |-
  Ai mite no
  Nochi no kokoro ni
  Kurabureba
  Mukashi wa mono o
  Omowazari keri
text_translation: |-
  I have met my love.
  When I compare this present
  With feelings of the past,
  My passion is now as if
  I have never loved before.
text_translator: Clay MacCauley, 1917
description_md: Poem 43 of the [[literature/ogura-hyakunin-isshu|Hyakunin Isshu]], by Fujiwara no Atsutada (権中納言敦忠, GonChūnagon Atsutada).[[source/jti-ogura-hyakunin-isshu|poem 43]]
