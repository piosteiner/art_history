text_translator: own
description_md: |-
  The best known of [[person/matsuo-basho]]’s verses, and held to be the one with which he established his own style; since the Edo period it has stood for the [[haiku]] as such. Its season word is the frog (spring). It was first printed in the third, intercalary month of 1686 in *Kawazu awase* (“frog contest”), compiled by his pupil Senka, and in the same year in the anthology *Haru no hi*; 1686 is taken as the year it was written.[[source/wikipedia-ja-furuike-ya]] In Bashō’s time it was a hokku — the name haiku came only with Masaoka Shiki’s reform from 1892.[[source/wikipedia-en-haiku]][[source/wikipedia-en-masaoka-shiki]]
  The "ya" is a [[kireji]].
