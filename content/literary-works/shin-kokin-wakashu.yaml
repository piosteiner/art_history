description_md: The eighth imperial anthology of [[waka]], commissioned in 1201 by the retired emperor Go-Toba, who set up a Bureau of Poetry for it, and presented in 1205, three hundred years after the [[literature/kokin-wakashu|Kokinshū]]. With the [[literature/manyoshu|Man’yōshū]] and the Kokinshū it counts among the three most influential anthologies of Japanese poetry.[[source/wikipedia-en-shin-kokin-wakashu]]
