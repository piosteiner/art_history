name: Meguri aite
names:
  - lang: ja
    role: original
    text: めぐりあひて
kind: waka
parent: ogura-hyakunin-isshu
part_number: "57"
text_original: |-
  めぐりあひて
  見しやそれとも
  わかぬ間に
  雲がくれにし
  夜半の月かげ
text_lang: ja
text_romanization: |-
  Meguri aite
  Mishi ya sore to mo
  Wakanu ma ni
  Kumo-gakure ni shi
  Yowa no tsuki kage
text_translation: |-
  Meeting on the path:
  But I cannot clearly know
  If it was he,
  Because the midnight moon
  In a cloud had disappeared.
text_translator: Clay MacCauley, 1917
