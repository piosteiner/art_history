description_md: The diary [[person/murasaki-shikibu]] kept of her life at the court while in service to the imperial consort Shōshi (988–1074), daughter of Fujiwara no Michinaga; it records among much else the celebrations of 1008 for the birth of Shōshi's son, the imperial heir, on Michinaga's lake.[[source/history-of-japanese-art|pp. 107, 112]] Illustrated in the thirteenth century as the [[artwork/murasaki-shikibu-nikki-emaki-goto]] and its companion scrolls.
