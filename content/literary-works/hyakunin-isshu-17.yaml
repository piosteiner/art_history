public_id: 116347
name: Chihayaburu
names:
  - lang: ja
    role: original
    text: 千早ぶる
kind: waka
parent: ogura-hyakunin-isshu
part_number: "17"
text_original: |-
  千早ぶる
  神代もきかず
  龍田川
  からくれないに
  水くくるとは
text_lang: ja
text_romanization: |-
  Chihayaburu
  Kamiyo mo kikazu
  Tatsuta-gawa
  Kara kurenai ni
  Mizu kukuru to wa
text_translation: |-
  Even when the gods
  Held sway in the ancient days,
  I have never heard
  That water gleamed with autumn red
  As it does in Tatta's stream
text_translator: Clay MacCauley, 1917
