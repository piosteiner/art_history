description_md: The oldest surviving collection of [[waka]], compiled sometime after 759 in the Nara period; its compiler, or the last of several, is widely believed to be Ōtomo no Yakamochi.[[source/wikipedia-en-manyoshu]] Besides [[tanka]] it holds [[choka|chōka]] and [[sedoka|sedōka]].[[source/wikipedia-en-waka]] Its centuries of court poetry fixed the imagery of nature and the seasons on which later poets drew.[[source/history-of-japanese-art|110–111]]
