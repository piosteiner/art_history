description_md: |-
  The *Heian jinbutsu shi* (平安人物志, also written 平安人物誌) is a printed directory of the scholars, poets, calligraphers, painters and other cultural figures living in [[place/kyoto|Kyoto]], compiled under the name Rōkanshi (弄翰子) [[source/cinii-bc07145531-heian-jinbutsu-shi-1768|見返し, 巻頭]]. Its first edition, dated the third month of Meiwa 5 (1768), promised on its inside cover to give each person’s surname, given name, courtesy name, art name, residence and common name [[source/cinii-bc07145531-heian-jinbutsu-shi-1768|見返し, 刊記]]. Nine editions followed one another, roughly one a decade: 1768, 1775, 1782, 1813, 1822, 1830, 1838, 1852 and 1867 [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|p. 2063]]. They were small books of about 16 cm, bound as one volume; the 1813 edition is divided into three *kan* and an appendix [[source/ndl-search-2026-heian-jinbutsu-shi|R000000050-I000088310; R100000136-I1970023484851994652]]. The 1813 contents run from Confucian scholars, poets, calligraphers, seal carvers and painters through waka and renga poets, court-dress experts and connoisseurs to physicians, naturalists, mathematicians, collectors, scholars of Dutch learning and craftsmen, with women and monks in an appendix [[source/rokanshi-1813-heian-jinbutsu-shi|目次]]. The editors left out martial and ‘vulgar’ arts because letters were the main concern, and stated that names were entered as heard, in no order of rank [[source/rokanshi-1813-heian-jinbutsu-shi|凡例 1–2]]. Iwasa nevertheless found that the 73 painters of 1813 open with the heads of the Tosa, Tsurusawa, Kyō-Kanō, Yamamoto, Kishi, Katsuyama, Maruyama, Hara and Yoshimura houses and their sons, an order conscious of standing [[source/iwasa-1997-ki-no-hironari-gagyo|p. 100]]. The number of painters grew from 16 in 1768 to 163 in 1830 and fell to 102 in 1867 [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|table 1]]. Literati painters were listed with the others until 1782 and had their own section from 1822 [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|n. 13]]. Because the book was reissued in the same form, historians compare editions to date careers, ranks and moves: Iwasa follows Ki no Hironari from no. 52 among the painters in 1813 to no. 29 in 1830 and dates his move to Saga between 1813 and 1822 [[source/iwasa-1997-ki-no-hironari-gagyo|pp. 100–101]]. Ahn maps painters’ addresses edition by edition [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|p. 2063]]. The International Research Center for Japanese Studies (Nichibunken) offers images, full text and an index of its copies of the editions from 1768 to 1867 [[source/nichibunken-2002-heian-jinbutsu-shi-db|description]].

  **Editions.** 1768 (明和5), 1775 (安永4), 1782 (天明2), 1813 (文化10), 1822 (文政5), 1830 (文政13), 1838 (天保9), 1852 (嘉永5), 1867 (慶応3); the publishers named in the library records change from edition to edition — 百足屋治郎兵衛 and 銭屋七郎兵衛 in 1768, 林伊兵衛 in 1813, 堺屋仁兵衛 (Shōshodō) from 1822 on [[source/ndl-search-2026-heian-jinbutsu-shi|R100000136-I1970586434872521252; R100000002-I000007315703]]. Library records, Ahn and Iwasa date the third edition Tenmei 2 (1782) [[source/ahn-2010-kinsei-kyoto-eshi-kyoju|table 1]]; the Ashmolean Museum gives 1783 [[source/ashmolean-2013-nanga-nanpin-school|text]]. The 1852 edition closes with an appendix of women, headed ‘placed without regard to rank’ (位置不問甲乙), among them the poet-nun Ōtagaki Rengetsu [[source/rokanshi-1852-heian-jinbutsu-shi|附録 女流]]. Tohoku University Library offers its copies of the 1813, 1822, 1830/1838 and 1852 editions as images under CC BY [[source/tohoku-university-library-heian-jinbutsu-shi-records|records 10010000007700–7705]].

  In Kyoto the directory went together with a culture of public exhibitions of calligraphy and painting. From 1792 the scholar Minagawa Kien held ‘new calligraphy and painting exhibitions’ at Higashiyama, fourteen of them to 1798, each with three to four hundred works sent from all over Japan [[source/iwasa-1997-ki-no-hironari-gagyo|p. 101]]. The *Kōto shoga jinmeiroku* (1847), a Kyoto directory of painters and calligraphers, prints in its colophon the rules for such an exhibition [[source/iwasa-1997-ki-no-hironari-gagyo|p. 101]]. Iwasa Shin’ichi reconstructs the career of the painter Ki no Hironari from both kinds of record: his places in the *Heian jinbutsu shi* of 1813, 1822, 1830 and 1838, and the exhibitions of 1809, 1810 and 1814 to which he sent works [[source/iwasa-1997-ki-no-hironari-gagyo|pp. 100–102]]. The Edo directory [[literature/edo-shoka-jinmeiroku|Edo shoka jinmeiroku]], by contrast, was compiled by an organiser of *[[term/shogakai|shogakai]]*, [[person/senmentei-denshiro|Senmentei]] [[source/senmentei-1815-edo-toji-shoka-jinmeiroku|colophon]] [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 50–51]].
