description_md: A kabuki dance-drama by Namiki Gohei III, based on the Noh play *Ataka* — the first kabuki play adapted closely from Noh — and one of the most popular in the repertory[[source/wikipedia-en-kanjincho|“a kabuki dance-drama by Namiki Gohei III, based on the Noh play Ataka. It is one of the most popular plays in the modern kabuki repertory” · “Kanjinchō was the first kabuki played adapted closely from the Noh theater”]]. First played in March 1840 at the Kawarazaki-za in Edo, with Ichikawa Ebizō V as Benkei[[source/wikipedia-en-kanjincho|“first performed in March 1840 at the Kawarazaki-za, in Edo. Ichikawa Ebizō V, Ichikawa Kuzō II, and Ichikawa Danjūrō VIII played the leading roles of Benkei, Togashi, and Yoshitsune”]]. The fugitive Minamoto no Yoshitsune and his follower Benkei, disguised as priests collecting for the Tōdai-ji, are stopped at Togashi’s barrier; asked for their subscription list, Benkei reads one out from a blank scroll[[source/wikipedia-en-kanjincho|“claim that they are simple priests journeying around the northern provinces, seeking donations for the Tōdai-ji in Nara. Togashi thus asks that they prove themselves to be priests and asks for a kanjinchō, a subscription list of those who have donated already” · “so, in a particularly famous moment in kabuki, he pulls out a blank scroll and begins reading from it as if it were a real subscription list”]].
