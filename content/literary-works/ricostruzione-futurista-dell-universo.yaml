description_md: |-
  By [[artist/giacomo-balla]] and [[artist/fortunato-depero]]: modernism and the avant-gardes as a model of a new world, beside [[artwork/lissitzky-new-man]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]].

  ## The manifesto

  Depero, who had moved to Rome in 1914 and met Balla there, wrote the manifesto with him in 1915; it extended the ideas of the earlier Futurists, seeking abstract equivalents for all forms and elements of the universe in order to make it "more joyful" through an integral re-creation [[source/wikipedia-en-fortunato-depero|§ Early career]]. It has been called "a radical manifesto for the revolution of everyday life" [[source/wikipedia-en-aeropittura|§ Artists]]. In the same year Balla began building abstract "reconstructions" out of wire, cardboard, cloth and tissue paper that could move and even make noises, having concluded that the flat canvas could not convey "the dynamic volume of speed in depth" [[source/wikipedia-en-futurism|§ Italian Futurism]].

  ## Consequences

  The programme led the Futurists into design: Depero's House of Futurist Art in Rovereto (1919) produced toys, tapestries and furniture [[source/wikipedia-en-fortunato-depero|§ Early career]], and Futurist workshops all over Italy made brightly coloured objects in new forms and materials in the spirit of the manifesto — [[artist/cesare-andreoni|Cesare Andreoni]]'s Milan workshop of 1929 among them [[source/wikipedia-it-cesare-andreoni|§ Studio e bottega]]. Emily Braun points out that the Futurists theorised the rejection of art for art's sake in favour of "a total style of life" before the First World War, and that this became standard rhetoric under Fascism [[source/braun-2000|p. 7]]. In the seminar the manifesto stood, with El Lissitzky's *New Man*, for the role of modernism and the avant-gardes: modernism created a new world view that totalitarian regimes could use [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. The [[institution/guggenheim-museum|Guggenheim Museum]] borrowed its title for the exhibition *Italian Futurism, 1909–1944: Reconstructing the Universe* in 2014 [[source/wikipedia-en-futurism|§ Legacy]].
