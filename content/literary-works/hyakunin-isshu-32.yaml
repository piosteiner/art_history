public_id: 116362
name: Yama kawa ni
names:
  - lang: ja
    role: original
    text: 山川に
kind: waka
parent: ogura-hyakunin-isshu
part_number: "32"
text_original: |-
  山川に
  風のかけたる
  しがらみは
  流れもあへぬ
  紅葉なりけり
text_lang: ja
text_romanization: |-
  Yama kawa ni
  Kaze no kaketaru
  Shigarami wa
  Nagare mo aenu
  Momiji nari keri
text_translation: |-
  In a mountain stream
  There is a wattled barrier
  Built by the busy wind.
  Yet it's only maple leaves,
  Powerless to flow away.
text_translator: Clay MacCauley, 1917
description_md: Poem 32 of the [[literature/ogura-hyakunin-isshu|Hyakunin Isshu]], by Harumichi no Tsuraki (春道列樹, Harumichi no Tsuraki).[[source/jti-ogura-hyakunin-isshu|poem 32]]
