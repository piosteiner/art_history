description_md: Genji's young wife bears a son from her affair with Kashiwagi, and Genji must accept the child publicly as his own — as his father once did with Genji's son. The third illustration of the chapter in the [[artwork/genji-monogatari-emaki]] shows the ceremony of acknowledgment, Genji holding the baby, cramped at the top of a steeply slanting floor.[[source/history-of-japanese-art|pp. 117–118, fig. 140]]
