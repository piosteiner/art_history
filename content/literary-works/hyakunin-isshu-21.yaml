public_id: 116351
name: Ima kon to
names:
  - lang: ja
    role: original
    text: 今来むと
kind: waka
parent: ogura-hyakunin-isshu
part_number: "21"
text_original: |-
  今来むと
  いひしばかりに
  長月の
  有明の月を
  待ち出でつるかな
text_lang: ja
text_romanization: |-
  Ima kon to
  Iishi bakari ni
  Nagatsuki no
  Ariake no tsuki o
  Machi idetsuru kana
text_translation: |-
  Just because she said,
  "In a moment I will come,"
  I've awaited her
  Until the moon of daybreak,
  In the long month, has appeared.
text_translator: Clay MacCauley, 1917
description_md: Poem 21 of the [[literature/ogura-hyakunin-isshu|Hyakunin Isshu]], by The Monk Sosei (素性法師, Sosei Hōshi).[[source/jti-ogura-hyakunin-isshu|poem 21]]
