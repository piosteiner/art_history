public_id: 116352
name: Fuku kara ni
names:
  - lang: ja
    role: original
    text: 吹くからに
kind: waka
parent: ogura-hyakunin-isshu
part_number: "22"
text_original: |-
  吹くからに
  秋の草木の
  しをるれば
  むべ山風を
  あらしといふらむ
text_lang: ja
text_romanization: |-
  Fuku kara ni
  Aki no kusaki no
  Shiorureba
  Mube yama kaze o
  Arashi to iuran
text_translation: |-
  It is by its breath
  That autumn's leaves of trees and grass
  Are wasted and driven.
  So they call this mountain wind
  The wild one, the destroyer.
text_translator: Clay MacCauley, 1917
description_md: Poem 22 of the [[literature/ogura-hyakunin-isshu|Hyakunin Isshu]], by Fun'ya no Yasuhide (文屋康秀, Fun'ya no Yasuhide).[[source/jti-ogura-hyakunin-isshu|poem 22]]
