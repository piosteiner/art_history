description_md: |-
  *Water Margin* (水滸傳, *Shuihu zhuan*; Japanese *Suikoden*), also known as *Outlaws of the Marsh*, is a Chinese novel of the Ming dynasty attributed to Shi Nai'an, and one of the first works of Chinese fiction written entirely in the vernacular. [[source/wikipedia-en-water-margin|introduction]] Set in the Northern Song dynasty in the twelfth century, it follows 108 outlaws who gather at Mount Liang to rebel against the government, are later granted an amnesty and fight for the state against the Liao and other rebels. [[source/wikipedia-en-water-margin|introduction]] Mason describes it as the sixteenth-century novel of a band of outlaws who valiantly sacrifice themselves for the emperor. [[source/history-of-japanese-art|p. 288]]

  In Japan a first volume of the *Suikoden* was printed by 1757, and Kyokutei Bakin's version illustrated by [[artist/katsushika-hokusai|Hokusai]], from 1805, started a "Suikoden" craze. [[source/wikipedia-en-water-margin|§ Non-English translations]] In 1827 [[artist/utagawa-kuniyoshi|Utagawa Kuniyoshi]] produced a series of prints of its 108 heroes that were an instant sensation. [[source/history-of-japanese-art|p. 288]] Commissioned by the publisher Kagaya Kichibei and issued from 1827 to 1830, the series made Kuniyoshi famous and set off a craze for full-body pictorial tattoos. [[source/wikipedia-en-water-margin|§ Non-English translations]] One of its sheets is [[artwork/kuniyoshi-li-jun|Li Jun, the Dragon in the Turbulent River]]. [[source/arc-bm-1906-1220-1249]] The lecture "War and Peace in East Asian Art" listed the novel as "Shuihuzhuan / Suikoden / Tales of the Water Margin" together with "Tattoos". [[source/thomsen-2019-war-and-peace|vocabulary list, 3 May 2019]]
