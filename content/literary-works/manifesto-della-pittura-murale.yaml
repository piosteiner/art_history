name: Manifesto della pittura murale
names:
  - lang: en
    role: translation
    text: Manifesto of Mural Painting
kind: manifesto
written: 1933-12
description_md: |-
  Signed by [[artist/mario-sironi]], Massimo Campigli, Carlo Carrà and Achille Funi and published in *La Colonna* in December 1933: the artists commit to Fascism, subordinate their own individuality to the collective work and present mural painting as the fitting art — "La funzione educatrice della pittura è soprattutto una questione di stile" (the educational function of painting is above all a matter of style) [[source/steiner-2025-mario-sironi|p. 9]] [[source/braun-2000|pp. 162–164]]. The text also declares: "Noi crediamo fermamente che l'artista deve ritornare a essere uomo tra gli uomini, come fu nelle epoche della nostra più alta civiltà" (we firmly believe that the artist must return to being a man among men, as in the ages of our highest civilisation) [[source/steiner-2025-mario-sironi|p. 9]]. Pio Steiner reads both passages as evidence of an educational, propagandistic intent [[source/steiner-2025-mario-sironi|p. 9]]. Sironi's writings on mural painting and architecture are studied in Björn Stüben's *Muri ai pittori* (2000) [[source/steiner-2025-mario-sironi|p. 9]].

  Sironi had described the ideal of "a militant artist, that is to say, an artist who serves a moral idea and subordinates his own individuality to the collective cause" [[source/braun-2000|p. 9]]. By the end of the 1920s he regarded easel painting as inadequate for political persuasion and sought a national popular style in murals [[source/braun-2000|p. 16]]. The mural movement he led was, in Emily Braun's view, the avant-garde's answer to a politically engaged art; like Diego Rivera and Fernand Léger, its artists held murals to be the most effective form because of their direct appeal to the collective imagination [[source/braun-2000|p. 17]]. Between 1933 and 1942 Sironi carried out his compositions in fresco, mosaic or bas-relief, aiming at public, collective reception in place of private consumption [[source/berghaus-2001|p. 161]]. Less than two years after the manifesto he finished [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] [[source/steiner-2025-mario-sironi|p. 9]].
