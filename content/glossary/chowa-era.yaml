category: calendar
definition: "Japanese era name (長和) for the years 1013–1016: 1013 is Chōwa 1 (元年) and Chōwa 4 is 1016."
description_md: |-
  **Chōwa** (長和) is a Japanese era name ([[nengo]]), proclaimed in 1013. Its years are counted in lunar years from the new year before the proclamation: 1013 is Chōwa 1 (元年), 1016 its last year, Chōwa 4. A Japanese source dates a year within it as "Chōwa 2" (長和2年) rather than by a continuous count.

  Before: [[kanko-era|Kankō]]. After: [[kannin-era|Kannin]].
