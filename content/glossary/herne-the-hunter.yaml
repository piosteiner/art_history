public_id: 131583
name: Herne the Hunter
category: mythology and legend
definition: A ghostly huntsman with stag's antlers said to haunt Windsor Forest, first mentioned by Shakespeare in The Merry Wives of Windsor.
description_md: |-
  A ghost said to haunt Windsor Forest, wearing antlers and rattling chains, and, in later retellings (after Jacob Grimm), leading a wild hunt at night. He was first mentioned by Shakespeare in *The Merry Wives of Windsor*. According to a later legend, he was a royal huntsman who hanged himself from an oak tree.

  *From:* folklore · English
