name: Deirdre
names: [Deirdre of the Sorrows]
category: mythology and legend
definition: The most tragic heroine of Irish legend, raised in secret by King Conchobar to be his wife, who ran away to Scotland with Naoise; tricked into returning, Naoise was killed and Deirdre died — of grief in later retellings, by dashing her head against a rock in the oldest version.
description_md: |-
  A druid foretold that she'd be beautiful and bring ruin to Ulster. King Conchobar raised her in secret to be his wife, but she ran away to Scotland with the young warrior Naoise. After they were tricked into coming back, Naoise was killed. In the oldest version Deirdre, given to his killer, dashed her head against a rock; later retellings have her die of grief.

  *From:* Ulster Cycle · Irish
