public_id: 113050
name: Longshuo
names:
  - lang: zh
    role: original
    text: 龍朔
category: calendar
definition: "Chinese era name (龍朔) of the Tang for the years 661–663: 661 is Longshuo 1 (元年) and Longshuo 3 is 663."
description_md: |-
  **Longshuo** (龍朔) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 661 under Emperor Gaozong (高宗). Its years are counted in lunar years: 661 is Longshuo 1 (元年), 663 its last year, Longshuo 3. A Chinese source dates a year within it as "Longshuo 2" (龍朔二年) rather than by a continuous count.

  Before: [[xianqing-era|Xianqing]]. After: [[linde-era|Linde]].
sources:
  definition:
    - source: dila-time-authority
