public_id: 132316
name: The Five Senses
category: iconography
definition: Sight, Hearing, Smell, Taste and Touch, shown as women with attributes such as a mirror, instruments, flowers, fruit and a bird.
description_md: |-
  Sight, Hearing, Smell, Taste and Touch.

  **In art:** A woman with a mirror or telescope (Sight), with instruments (Hearing), flowers (Smell), fruit (Taste), and a bird pecking her hand or a tortoise (Touch). The best known are the *Lady and the Unicorn* tapestries (Paris, about 1500).

  **Famous works**

  - *The Lady and the Unicorn* (tapestries, Musée de Cluny, Paris)
  - [[artist/jan-brueghel-the-elder]] and [[artist/peter-paul-rubens]], *The Five Senses* (five panels, 1617–1618, Prado, Madrid)

  *From:* European
