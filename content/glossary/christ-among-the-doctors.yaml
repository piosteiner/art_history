name: Christ among the Doctors
names: [Finding in the Temple, Dispute with the Doctors]
category: iconography
definition: The twelve-year-old Jesus found by his parents in the Temple, astonishing the scholars with his understanding.
description_md: |-
  At twelve, Jesus stayed behind in the Temple in Jerusalem. His parents found him three days later, astonishing the scholars with his understanding.

  **In art:** A boy seated among old scholars with books, debating them, while his parents arrive.

  **Famous works**

  - [[artist/albrecht-durer]], *Christ among the Doctors* (Thyssen-Bornemisza, Madrid)
  - [[artist/william-holman-hunt]], *The Finding of the Saviour in the Temple* (Birmingham)

  *From:* New Testament, Gospels · Christian
