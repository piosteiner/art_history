definition: "Japanese era name (養和) for the years 1181–1182: 1181 is Yōwa 1 (元年) and Yōwa 2 is 1182."
description_md: |-
  **Yōwa** (養和) is a Japanese era name ([[nengo]]), proclaimed in 1181. Its years are counted in lunar years from the new year before the proclamation: 1181 is Yōwa 1 (元年), 1182 its last year, Yōwa 2. A Japanese source dates a year within it as "Yōwa 2" (養和2年) rather than by a continuous count.

  Before: [[jisho-era|Jishō]]. After: [[juei-era|Juei]].
