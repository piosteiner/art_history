name: Bark painting
names: [rarrk, Yirrkala Bark Petitions, Näku Dhäruk, Yirrkala Church Panels]
category: art style
definition: Painting on sheets of bark, especially in Arnhem Land, in fine cross-hatching (rarrk); in 1963 the Yolngu of Yirrkala sent Parliament two bark petitions against mining on their land.
description_md: |-
  Painting on sheets of bark, especially in Arnhem Land, in fine cross-hatching (*rarrk*) that often shows clan designs. In 1963, the Yolngu people of Yirrkala sent the Australian Parliament two bark petitions protesting against mining on their land. They were the first traditional documents recognised by Parliament.

  **Famous works**

  - *Yirrkala Bark Petitions (Näku Dhäruk)* (1963, Parliament House, Canberra)
  - *Yirrkala Church Panels* (1962–1963, Buku-Larrnggay Mulka Centre)

  *From:* Yolngu and other Arnhem Land peoples
