public_id: 132146
name: Descent from the Cross
names: [The Deposition]
category: iconography
definition: Christ's body taken down from the cross by Joseph of Arimathea and Nicodemus.
description_md: |-
  Christ's body is taken down from the cross by [[person/joseph-of-arimathea]] and [[person/nicodemus]].

  **In art:** Men on ladders lowering the body with sheets, while [[person/mary]] faints below.

  **Famous works**

  - [[artist/rogier-van-der-weyden]], *The Descent from the Cross* (Prado) — [[artwork/the-descent-from-the-cross]]
  - Rubens, *The Descent from the Cross* (Antwerp Cathedral)
  - Pontormo, *Deposition from the Cross* (Santa Felicita, Florence)
  - Rosso Fiorentino, *Deposition* (Volterra)

  *From:* New Testament, Gospels · Christian
