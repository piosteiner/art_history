definition: "Chinese era name (宣統) of the Qing for the years 1909–1912: 1909 is Xuantong 1 (元年) and Xuantong 4 is 1912."
description_md: |-
  **Xuantong** (宣統) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1909. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Xuantong Emperor. Its years are counted in lunar years: 1909 is Xuantong 1 (元年), 1912 its last year, Xuantong 4. A Chinese source dates a year within it as "Xuantong 2" (宣統二年) rather than by a continuous count.

  Before: [[guangxu-era|Guangxu]].
