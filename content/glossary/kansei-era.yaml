definition: "Japanese era name (寛政) for the years 1789–1801: 1789 is Kansei 1 (元年) and Kansei 13 is 1801."
description_md: |-
  **Kansei** (寛政) is a Japanese era name ([[nengo]]), proclaimed in 1789. Its years are counted in lunar years from the new year before the proclamation: 1789 is Kansei 1 (元年), 1801 its last year, Kansei 13. A Japanese source dates a year within it as "Kansei 2" (寛政2年) rather than by a continuous count.

  Before: [[tenmei-era|Tenmei]]. After: [[kyowa-era|Kyōwa]].
