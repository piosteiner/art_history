description_md: |-
  A Shrine Madonna (German Schreinmadonna, French Vierge ouvrante) is a medieval wooden statue of the Virgin that can be opened and holds figurative images inside, for instance a Throne of Mercy.[[source/wikipedia-de-schreinmadonna|§ introduction]] Whether the type arose in France or east of the Elbe is unclear.[[source/wikipedia-de-schreinmadonna|§ introduction]]

  ## Form

  In the most elaborate examples the statue opens along a cut that runs vertically through the Virgin's body from neck to feet; inside, a carved Throne of Mercy – God the Father holding the crucified Christ, with the dove of the Holy Spirit – sits in the hollow of her body, and the two halves, opened like wings, carry painted scenes.[[source/gertsman-2015-worlds-within|p. 70]] Closed, the figure is an enthroned Virgin and Child, often a nursing Virgin (Maria lactans).[[source/gertsman-2015-worlds-within|p. 70]] Some open only at the chest, others, like the Shrine Madonna of Bergara, show the Trinity in the lower body, inside the swollen womb.[[source/gertsman-2015-worlds-within|p. 98]] In the Prussian examples the wings show men and women sheltering in the Virgin's body, combining the type with the Virgin of Mercy; the type probably arose in the lands of the Teutonic Order.[[source/gertsman-2015-worlds-within|pp. 89–91]][[source/gnm-objektkatalog-pl-o-2397|Beschreibung]]

  ## Meanings

  Elina Gertsman reads the interior as the Virgin's womb: its three cells on each side of a large central compartment recall late medieval diagrams of a seven-celled uterus, and the opening of the statue performs, again and again, a birth that also recalls the Caesarean section.[[source/gertsman-2015-worlds-within|pp. 72, 78]] What these Madonnas carry is not a child but an image of Christ's sacrifice.[[source/gertsman-2015-worlds-within|p. 73]] The theologian Jean Gerson, in a sermon on the Nativity, attacked a Shrine Madonna in a Carmelite church because it showed the whole Trinity lodged in her belly; that statue is lost.[[source/gertsman-2015-worlds-within|p. 56]][[source/gertsman-2015-worlds-within|p. 207]]

  ## Use

  Small Shrine Madonnas such as the one in New York (36.8 cm) probably served the private devotion of nuns, larger ones such as that of Morlaix (114 cm) public veneration.[[source/gertsman-2015-worlds-within|p. 95]] In Bergara pregnant women brought flowers to the statue when labour began, and the Shrine Madonna of Val d'Ayas was believed to revive stillborn children long enough for baptism.[[source/gertsman-2015-worlds-within|pp. 66–67]]

  The lecture of 2024 treated the type as "a new type of Marian image: Madonnas to open", "between image support and body image".[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 84]]
