definition: Charlemagne's nephew in the Song of Roland, who died with his sword Durendal and horn Olifant at the pass of Roncevaux.
description_md: |-
  [[person/charlemagne]] was the real Frankish emperor (crowned AD 800), who became a legendary figure. In the *Song of Roland*, his nephew Roland, with his sword Durendal and his horn Olifant, died fighting a huge army at the pass of Roncevaux, refusing to blow his horn for help until it was too late.

  **In art:** A knight blowing a horn as he dies in a mountain pass.

  **Famous works**

  - *Roland statue* (Bremen town hall square)

  *From:* The Song of Roland · French (Matter of France)
