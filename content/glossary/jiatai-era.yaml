public_id: 113031
name: Jiatai
names:
  - lang: zh
    role: original
    text: 嘉泰
category: calendar
definition: "Chinese era name (嘉泰) of the Southern Song for the years 1201–1204: 1201 is Jiatai 1 (元年) and Jiatai 4 is 1204."
description_md: |-
  **Jiatai** (嘉泰) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1201 under Emperor Ningzong (寧宗). Its years are counted in lunar years: 1201 is Jiatai 1 (元年), 1204 its last year, Jiatai 4. A Chinese source dates a year within it as "Jiatai 2" (嘉泰二年) rather than by a continuous count.

  Before: [[qingyuan-era|Qingyuan]]. After: [[kaixi-era|Kaixi]].
sources:
  definition:
    - source: dila-time-authority
