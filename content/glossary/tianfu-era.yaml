    text: 天福
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天福) of the Later Han for the years 936–948: 936 is Tianfu 1 (元年) and Tianfu 13 is 948."
description_md: |-
  **Tianfu** (天福) is a Chinese era name ([[nianhao]]) of the Later Han, proclaimed in 947 under Emperor Gaozu (高祖). Its years are counted in lunar years: 936 is Tianfu 1 (元年), 948 its last year, Tianfu 13. A Chinese source dates a year within it as "Tianfu 2" (天福二年) rather than by a continuous count. The founder of the Later Han, Gaozu (高祖), kept it on taking the throne in 947 and counted on: 947 is Tianfu 12.

  After: [[qianyou-era|Qianyou]].
sources:
  definition:
