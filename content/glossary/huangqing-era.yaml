name: Huangqing
names:
  - lang: zh
    role: original
    text: 皇慶
category: calendar
parent: chinese-calendar
definition: "Chinese era name (皇慶) of the Yuan for the years 1312–1313: 1312 is Huangqing 1 (元年) and Huangqing 2 is 1313."
description_md: |-
  **Huangqing** (皇慶) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1312 under Ayurbarwada (仁宗). Its years are counted in lunar years: 1312 is Huangqing 1 (元年), 1313 its last year, Huangqing 2. A Chinese source dates a year within it as "Huangqing 2" (皇慶二年) rather than by a continuous count.

  Before: [[zhida-era|Zhida]]. After: [[yanyou-era|Yanyou]].
sources:
