definition: The story of Scipio Africanus returning a beautiful captive untouched to her fiancé, with her ransom as a wedding gift; a model of self-control.
description_md: |-
  Scipio Africanus, the general who defeated [[person/hannibal]]. After capturing a city in Spain, he was offered a beautiful young captive. When he learned she was engaged, he returned her to her fiancé untouched, and gave her ransom money to the couple as a wedding gift. A model of virtue and self-control.

  **In art:** A general on a throne handing a young woman back to a kneeling young man, with treasure laid at his feet.

  **Famous works**

  - [[artist/nicolas-poussin]], *The Continence of Scipio* (Pushkin Museum, Moscow)
  - [[artist/giovanni-battista-tiepolo]], *The Continence of Scipio* (Villa Cordellina, Montecchio Maggiore)

  *From:* Livy, History of Rome · Ancient Roman
