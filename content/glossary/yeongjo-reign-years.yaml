name: Yeongjo (reign years)
names:
  - lang: ko
    role: original
    text: 영조
  - lang: ko-Hani
    role: alternative
    text: 英祖
category: calendar
definition: "The reign years of Yeongjo of Joseon (英祖, 영조), by which Korean sources date 1725–1776: 1725 is Yeongjo 1, 1776 Yeongjo 52."
description_md: |-
  **Yeongjo** (英祖, 영조): the years of the reign of [[person/yeongjo-of-joseon|Yeongjo of Joseon]], who came to the throne on 30 August 1724. Korean sources count years by the reigning king ([[korean-reign-years]]): 1734 is Yeongjo 10 (영조 10년). His first year is 1725, the year after his accession; the rest of 1724 still counts for his predecessor.

  Before: Gyeongjong. After: [[jeongjo-reign-years|Jeongjo]].
