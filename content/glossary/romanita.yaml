public_id: 116826
name: romanità
category: politics
definition: "The cult of ancient Rome in Fascist Italy: the regime presented itself as Rome's heir."
description_md: Shown above all at the [[event/augustan-exhibition-of-romanity]] (1937–1938) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 69]]; on fusing past and present in Fascist visual culture see [[source/lazzaro-2005]]. In [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] the dress of the figures recalls the Roman past and joins it to the image of a modern Italy [[source/steiner-2025-mario-sironi|p. 5]].
