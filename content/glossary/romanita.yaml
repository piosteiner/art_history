public_id: 116826
name: romanità
category: politics
definition: "The cult of ancient Rome in Fascist Italy: the regime presented itself as Rome's heir."
description_md: |-
  Shown above all at the [[event/augustan-exhibition-of-romanity]] (1937–1938) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 69]]; on fusing past and present in Fascist visual culture see [[source/lazzaro-2005]]. In [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] the dress of the figures recalls the Roman past and joins it to the image of a modern Italy [[source/steiner-2025-mario-sironi|p. 5]], and two Roman insignia beside Italy recall the grandeur of the Empire [[source/steiner-2025-mario-sironi|p. 6]].

  Emilio Gentile concluded that in Fascist discourse and in Mussolini's identification with the Emperor Augustus the "cult of Romanness" was reconciled with activism and the cult of youth, "without reactionary nostalgia" [[source/antliff-2002|p. 152]]. Mussolini's renovations of Rome stripped the Colosseum and the Pantheon of later additions and cleared their surroundings; in 1925 he declared that "everything which has grown up in the centuries of decadence must be swept away" [[source/antliff-2002|p. 152]]. In 1938 the restored Ara Pacis was enclosed in a modernist pavilion [[source/antliff-2002|p. 152]]. Romke Visser calls this "the cult of the Romanità": the Sacrarium of the 1932 [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] fused it with Christian ritual [[source/antliff-2002|p. 157]]. The cult served the centralisation of power in Rome, and the regionalist Strapaese movement rejected it [[source/antliff-2002|p. 158]]. Laying claim to Imperial Rome also served as a springboard to colonial conquest in Africa [[source/antliff-2002|p. 162]]. Jorge Dagnino stresses that the recourse to Rome did not mean rejecting modernity: Giorgio Pini wrote that Italy's ancient roots projected it "towards the future, in the most dynamic of modernities" [[source/dagnino-2016|pp. 146–147]]. Emily Braun counts the "theology of Romanitas" among the images [[artist/mario-sironi|Mario Sironi]] first gave visual form [[source/braun-2000|p. 16]].
