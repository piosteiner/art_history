name: Golem of Prague
names: [Golem]
category: mythology and legend
definition: A clay giant of Jewish legend, said to have been brought to life by Rabbi Judah Loew in 16th-century Prague to protect the ghetto.
description_md: |-
  According to legend, in the 16th century, [[person/judah-loew-ben-bezalel|Rabbi Judah Loew]] made a man of clay from the banks of the Vltava. He brought it to life by writing the word *emet* ("truth") on its forehead, or putting a slip with God's name in its mouth. It protected the ghetto, but when it grew too strong and violent, he erased the first letter, leaving *met* ("dead") — or, in the versions with the slip, pulled it from its mouth. It's said its body still lies in the attic of the Old-New Synagogue.

  *From:* Jewish folklore · Jewish (Prague)
