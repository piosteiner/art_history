category: calendar
definition: "Japanese era name (応和) for the years 961–963: 961 is Ōwa 1 (元年) and Ōwa 3 is 963."
description_md: |-
  **Ōwa** (応和) is a Japanese era name ([[nengo]]), proclaimed in 961. Its years are counted in lunar years from the new year before the proclamation: 961 is Ōwa 1 (元年), 963 its last year, Ōwa 3. A Japanese source dates a year within it as "Ōwa 2" (応和2年) rather than by a continuous count.

  Before: [[tentoku-era|Tentoku]]. After: [[koho-era|Kōhō]].
