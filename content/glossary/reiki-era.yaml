    text: 霊亀
category: calendar
definition: "Japanese era name (霊亀) for the years 715–716: 715 is Reiki 1 (元年) and Reiki 2 is 716."
description_md: |-
  **Reiki** (霊亀) is a Japanese era name ([[nengo]]), proclaimed in 715. Its years are counted in lunar years from the new year before the proclamation: 715 is Reiki 1 (元年), 716 its last year, Reiki 2. A Japanese source dates a year within it as "Reiki 2" (霊亀2年) rather than by a continuous count.

  Before: [[wado-era|Wadō]]. After: Yōrō.
