name: Sinuhe
category: mythology and legend
definition: "The hero of one of the oldest stories in the world (about 1900 BC): an Egyptian official who fled into exile in Syria and longed to be buried in Egypt."
description_md: |-
  In one of the oldest stories in the world (about 1900 BC), Sinuhe overheard news of the pharaoh's murder and fled in panic to Retjenu (Syria-Palestine). He became a rich chieftain there and won a duel against a giant champion. In old age, he longed to be buried in Egypt, and the new pharaoh welcomed him home.

  *From:* Story of Sinuhe · Ancient Egyptian
