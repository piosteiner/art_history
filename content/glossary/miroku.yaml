public_id: 106656
name: Miroku
names:
  - lang: ja
    role: original
    text: "{弥勒|みろく}"
category: iconography
definition: Maitreya, the Buddha of the Future, who waits in the Tosotsu heaven; shown as a meditating youth or as a Buddha.
description_md: |-
  [[person/the-buddha]] of the future, who waits in heaven to come to earth when the teaching of Shakyamuni has been forgotten. In China, he merged with [[budai]], a fat, laughing 10th-century monk, who became the "Laughing Buddha".

  **In art:** A graceful pensive bodhisattva sitting with one leg crossed over the other, a finger touching the cheek.

  **Famous works**

  - *Pensive Bodhisattva* (gilt bronze, Three Kingdoms period, c. 600, National Museum of Korea; usually identified as Maitreya)
  - *Miroku Bosatsu* (Kōryū-ji, Kyoto)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
