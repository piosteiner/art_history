name: Khun Phaen
category: mythology and legend
definition: The handsome, poor hero of Thailand's great folk epic, skilled in magic and war, rival of Khun Chang for Wanthong.
description_md: |-
  Khun Phaen is handsome, poor and skilled in magic and war. [[khun-chang]] is rich, ugly and bald. They both love the beautiful [[wanthong]], who is caught between them. In the end, the king forces her to choose, and when she can't, he has her executed.

  *From:* Khun Chang Khun Phaen · Thai
