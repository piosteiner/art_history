public_id: 131182
name: Kullervo
category: mythology and legend
definition: "The darkest and most tragic figure of the Finnish Kalevala: born a slave, abused and full of rage, he unknowingly seduced his lost sister and fell on his own sword. Tolkien based Túrin Turambar on him."
description_md: |-
  He was born a slave after his uncle wiped out his family. He was abused as a child and grew up full of rage. He took terrible revenge, but without knowing it, he seduced his own lost sister, who then drowned herself. He fell on his own sword. [[person/j-r-r-tolkien]] based Túrin Turambar on him.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
