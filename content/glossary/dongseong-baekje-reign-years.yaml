public_id: 113267
name: Dongseong of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 동성왕
  - lang: ko-Hani
    role: alternative
    text: 東城王
category: calendar
parent: korean-calendar
definition: "The reign years of King Dongseong of Baekje (東城王, 동성왕), by which Korean histories date 479–501: 479 is Dongseong 1, 501 Dongseong 23."
description_md: |-
  **Dongseong** (東城王, 동성왕): the years of the reign of King Dongseong of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 488 is Dongseong 10 (동성왕 10년). The year of the accession, 479, counts as the first year.

  Before: [[samgeun-baekje-reign-years|Samgeun]]. After: [[muryeong-baekje-reign-years|Muryeong]].
sources:
  definition:
    - source: dila-time-authority
