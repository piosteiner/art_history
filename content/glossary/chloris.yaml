name: Chloris
category: mythology and legend
also_in: [iconography]
definition: In Greek myth (told in Ovid's Fasti), the nymph pursued by Zephyrus, the West Wind, and turned into Flora, goddess of flowers.
description_md: |-
  [[zephyrus]], the gentle West Wind of spring, pursued the nymph Chloris and turned her into [[flora]], goddess of flowers.

  **In art:** A nymph from whose mouth flowers spill, grabbed by a bluish winged wind god.

  **Famous works**

  - Botticelli, *Primavera* (right side) — [[artwork/primavera]]

  *From:* Greek mythology; Ovid, Fasti · Ancient Greek
