name: Phra Aphai Mani
category: mythology and legend
definition: The prince with a magic flute in Sunthorn Phu's Thai epic poem, loved by a sea ogress and rescued by a mermaid.
description_md: |-
  In Sunthorn Phu's epic poem, Prince Aphai Mani played a flute that could put people to sleep or kill them. He was kidnapped by an ogress (Phi Suea Samut), who loved him, and he escaped with the help of a mermaid. The ogress chased him across the sea, and in the end he killed her with his flute.

  *From:* Sunthorn Phu, Phra Aphai Mani · Thai
