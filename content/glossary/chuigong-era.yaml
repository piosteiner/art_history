name: Chuigong
names:
  - lang: zh
    role: original
    text: 垂拱
category: calendar
parent: chinese-calendar
definition: "Chinese era name (垂拱) of the Tang for the years 685–688: 685 is Chuigong 1 (元年) and Chuigong 4 is 688."
description_md: |-
  **Chuigong** (垂拱) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 685 under Emperor Ruizong (睿宗). Its years are counted in lunar years: 685 is Chuigong 1 (元年), 688 its last year, Chuigong 4. A Chinese source dates a year within it as "Chuigong 2" (垂拱二年) rather than by a continuous count.

  Before: [[guangzhai-era|Guangzhai]]. After: [[yongchang-era|Yongchang]].
sources:
