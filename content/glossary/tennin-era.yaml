definition: "Japanese era name (天仁) for the years 1108–1110: 1108 is Tennin 1 (元年) and Tennin 3 is 1110."
description_md: |-
  **Tennin** (天仁) is a Japanese era name ([[nengo]]), proclaimed in 1108. Its years are counted in lunar years from the new year before the proclamation: 1108 is Tennin 1 (元年), 1110 its last year, Tennin 3. A Japanese source dates a year within it as "Tennin 2" (天仁2年) rather than by a continuous count.

  Before: [[kasho-era-1106|Kashō]]. After: [[tenei-era|Ten'ei]].
