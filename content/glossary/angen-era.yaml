definition: "Japanese era name (安元) for the years 1175–1177: 1175 is Angen 1 (元年) and Angen 3 is 1177."
description_md: |-
  **Angen** (安元) is a Japanese era name ([[nengo]]), proclaimed in 1175. Its years are counted in lunar years from the new year before the proclamation: 1175 is Angen 1 (元年), 1177 its last year, Angen 3. A Japanese source dates a year within it as "Angen 2" (安元2年) rather than by a continuous count.

  Before: [[joan-era|Jōan]]. After: [[jisho-era|Jishō]].
