name: Zongzhang
names:
  - lang: zh
    role: original
    text: 總章
category: calendar
parent: chinese-calendar
definition: "Chinese era name (總章) of the Tang for the years 668–670: 668 is Zongzhang 1 (元年) and Zongzhang 3 is 670."
description_md: |-
  **Zongzhang** (總章) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 668 under Emperor Gaozong (高宗). Its years are counted in lunar years: 668 is Zongzhang 1 (元年), 670 its last year, Zongzhang 3. A Chinese source dates a year within it as "Zongzhang 2" (總章二年) rather than by a continuous count.

  Before: [[qianfeng-era|Qianfeng]]. After: [[xianheng-era|Xianheng]].
sources:
  definition:
    - source: dila-time-authority
