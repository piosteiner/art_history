name: Oisín
names: [Ossian]
category: mythology and legend
definition: The poet-hero son of Fionn mac Cumhaill, taken by the fairy woman Niamh to Tír na nÓg, the Land of Youth; returning after what felt like three years, he found 300 had passed and aged at once when he touched the ground.
description_md: |-
  [[niamh]] of the Golden Hair rode a white horse across the sea and took Oisín, Fionn's son, to Tír na nÓg. After what felt like three years, he went home to visit, but 300 years had passed. When he fell from the horse and touched the ground, he instantly became a very old man.

  *From:* Fenian Cycle · Irish
