public_id: 113119
name: Tianfu
names:
  - lang: zh
    role: original
    text: 天復
category: calendar
definition: "Chinese era name (天復) of the Tang for the years 901–904: 901 is Tianfu 1 (元年) and Tianfu 4 is 904."
description_md: |-
  **Tianfu** (天復) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 901 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 901 is Tianfu 1 (元年), 904 its last year, Tianfu 4. A Chinese source dates a year within it as "Tianfu 2" (天復二年) rather than by a continuous count.

  Before: [[guanghua-era|Guanghua]]. After: [[tianyou-era|Tianyou]].
sources:
  definition:
    - source: dila-time-authority
