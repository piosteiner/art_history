category: calendar
definition: "Japanese era name (正嘉) for the years 1257–1259: 1257 is Shōka 1 (元年) and Shōka 3 is 1259."
description_md: |-
  **Shōka** (正嘉) is a Japanese era name ([[nengo]]), proclaimed in 1257. Its years are counted in lunar years from the new year before the proclamation: 1257 is Shōka 1 (元年), 1259 its last year, Shōka 3. A Japanese source dates a year within it as "Shōka 2" (正嘉2年) rather than by a continuous count.

  Before: [[kogen-era|Kōgen]]. After: [[shogen-era|Shōgen]].
