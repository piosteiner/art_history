name: Scáthach
category: mythology and legend
definition: A legendary woman warrior of the Ulster Cycle who ran a school of war in her Shadow Fortress (Dún Scáith) on the Isle of Skye, and trained Cú Chulainn and gave him the barbed spear Gáe Bulg.
description_md: |-
  She ran a school of war in her fortress, the Shadow Fortress (Dún Scáith). She taught [[cu-chulainn]] his skills and gave him his terrible barbed spear, the Gáe Bulg.

  *From:* Ulster Cycle · Irish / Scottish
