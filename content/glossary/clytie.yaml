name: Clytie
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the water nymph abandoned by the sun god Helios, who stared after him until she became a flower that always faces the sun.
description_md: |-
  A water nymph who loved the sun god [[helios]] but was abandoned by him. She sat on the ground staring at him as he crossed the sky, until she turned into a flower that always turns to face the sun (the heliotrope, later identified with the sunflower).

  **In art:** A woman gazing upward at the sun, sometimes with sunflowers.

  **Famous works**

  - Frederic Leighton, *Clytie* (his last painting)
  - *Clytie* (Roman marble bust, British Museum)

  *From:* Ovid, Metamorphoses · Ancient Greek
