name: The Goose That Laid the Golden Eggs
category: mythology and legend
definition: Aesop's fable of a farmer who cuts open his goose that lays one golden egg a day, hoping for all the gold at once, and finds nothing.
description_md: |-
  A farmer had a goose that laid one golden egg a day. He grew greedy, cut the goose open to get all the gold at once, and found nothing inside.

  *From:* Aesop's Fables · Ancient Greek
