name: Paintings of exemplary court ladies
category: iconography
definition: Paintings of exemplary court women, meant to teach proper behaviour, among the oldest Chinese scroll paintings.
description_md: |-
  Paintings of exemplary court women, meant to teach proper behaviour, are among the oldest Chinese scroll paintings.

  **Famous works**

  - Gu Kaizhi (attributed), *Admonitions of the Instructress to the Court Ladies* (British Museum)
  - Zhou Fang (attributed), *Court Ladies Wearing Flowered Headdresses* (Liaoning Museum)
  - Emperor Huizong (after Zhang Xuan), *Court Ladies Preparing Newly Woven Silk* (Museum of Fine Arts, Boston)

  *From:* Chinese
