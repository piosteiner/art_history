public_id: 131589
name: Tom Thumb
category: mythology and legend
definition: A boy no bigger than his father's thumb, hero of the first fairy tale printed in English (1621), who became a knight of King Arthur.
description_md: |-
  The first fairy tale printed in English (1621). Born to a couple who wished for a child, he had many adventures: he was swallowed by a cow, carried off by a raven and swallowed by a giant and a fish. He became a knight at [[king-arthur]]'s court, riding a mouse.

  *From:* English folklore (first printed 1621) · English
