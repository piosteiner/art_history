name: The Garden of Love
names: [Fête galante]
category: iconography
definition: Elegant couples in a park or garden, a theme of Rubens and the courtly "merry company" that became the fête galante of eighteenth-century French painting.
description_md: |-
  Elegant couples in a park (the *fête galante*).

  **Famous works**

  - Antoine Watteau, *The Embarkation for Cythera* (Pilgrimage to Cythera, 1717, Louvre, Paris; a second version in Berlin)
  - [[artist/peter-paul-rubens]], *The Garden of Love* (c. 1633, Prado, Madrid)

  *From:* European
