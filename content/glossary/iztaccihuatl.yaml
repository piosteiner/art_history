name: Iztaccíhuatl
names: [Izta]
category: mythology and legend
definition: In Mexican legend, a princess who died of grief believing her lover Popoca dead; her volcano near Mexico City looks like a sleeping woman.
description_md: |-
  The princess Iztaccíhuatl was falsely told that her warrior lover [[popocatepetl|Popoca]] had died in battle, and she died of grief. When he came home, he carried her body up to the mountains and knelt beside her (in one version holding a smoking torch) forever. Her volcano looks like a sleeping woman, and his still smokes.

  *From:* Mexican folklore · Mexican (Nahua)
