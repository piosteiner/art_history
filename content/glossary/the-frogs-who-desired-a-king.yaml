name: The Frogs Who Desired a King
category: mythology and legend
definition: Aesop's fable of frogs who ask Zeus for a king, are bored by the log he sends, and are eaten by the water snake he sends next (a stork or heron in later versions).
description_md: |-
  The frogs asked [[zeus]] for a king. He threw down a log, and they were bored by it. When they asked again, he sent a water snake (in later versions a stork or heron), which ate them.

  *From:* Aesop's Fables · Ancient Greek
