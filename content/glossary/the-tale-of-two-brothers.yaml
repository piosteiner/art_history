name: The Tale of Two Brothers
names: [Bata, Anubis (the brother)]
category: mythology and legend
definition: An ancient Egyptian tale of the farmer Bata, falsely accused by his sister-in-law, who put his heart in a cedar flower and, after many transformations, became pharaoh.
description_md: |-
  Bata's sister-in-law falsely accused him, so he fled to the Valley of the Cedar and put his heart in a cedar flower. When the tree was cut down, he died. His brother found the heart, and he came back as a bull, then two persea trees, then a splinter that made a queen pregnant, and finally became pharaoh.

  *From:* Tale of Two Brothers · Ancient Egyptian
