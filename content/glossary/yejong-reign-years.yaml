category: calendar
definition: "The reign years of King Yejong of Joseon (睿宗, 예종), by which Korean sources date 1469: 1469 is Yejong 1, 1469 Yejong 1."
description_md: |-
  **Yejong** (睿宗, 예종): the years of the reign of King Yejong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1469 is Yejong 1 (예종 1년). The year of the accession, 1469, counts as the first year.

  Before: [[sejo-reign-years|Sejo]]. After: [[seongjong-reign-years|Seongjong]].
