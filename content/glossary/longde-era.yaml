name: Longde
names:
  - lang: zh
    role: original
    text: 龍德
category: calendar
parent: chinese-calendar
definition: "Chinese era name (龍德) of the Later Liang for the years 921–923: 921 is Longde 1 (元年) and Longde 3 is 923."
description_md: |-
  **Longde** (龍德) is a Chinese era name ([[nianhao]]) of the Later Liang, proclaimed in 921 under Zhu Youzhen (末帝). Its years are counted in lunar years: 921 is Longde 1 (元年), 923 its last year, Longde 3. A Chinese source dates a year within it as "Longde 2" (龍德二年) rather than by a continuous count.

  Before: [[zhenming-era|Zhenming]].
sources:
  definition:
    - source: dila-time-authority
