name: Prophets
names: [The Prophets, Isaiah, Jeremiah, Ezekiel]
category: mythology and legend
also_in: [iconography]
definition: The prophets of Israel — the great (major) prophets Isaiah, Jeremiah, Ezekiel and Daniel of the Christian Old Testament, and the twelve minor prophets — shown in art as bearded old men with scrolls.
description_md: |-
  The great prophets of Israel: Isaiah, Jeremiah, Ezekiel and [[person/daniel]], plus the twelve minor prophets, including [[person/jonah]]. Isaiah prophesied, as Christians read Isaiah 7:14, that a virgin would bear a son. Jeremiah lamented the destruction of Jerusalem. Ezekiel had visions of a fiery chariot of four winged creatures, and of a valley of dry bones coming back to life.

  **In art:** Bearded old men with scrolls, often paired with the sibyls.

  **Famous works**

  - [[artist/michelangelo]], the seven prophets on the *Sistine Chapel ceiling*
  - [[artist/rembrandt]], *Jeremiah Lamenting the Destruction of Jerusalem* (Rijksmuseum)
  - [[artist/raphael]], *The Vision of Ezekiel* (Palazzo Pitti)
  - Claus Sluter, *Well of Moses* (Champmol, Dijon)

  *From:* Hebrew Bible, Prophets · Hebrew Bible
