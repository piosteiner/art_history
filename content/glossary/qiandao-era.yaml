name: Qiandao
names:
  - lang: zh
    role: original
    text: 乾道
category: calendar
parent: chinese-calendar
definition: "Chinese era name (乾道) of the Southern Song for the years 1165–1173: 1165 is Qiandao 1 (元年) and Qiandao 9 is 1173."
description_md: |-
  **Qiandao** (乾道) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1165 under Emperor Xiaozong (孝宗). Its years are counted in lunar years: 1165 is Qiandao 1 (元年), 1173 its last year, Qiandao 9. A Chinese source dates a year within it as "Qiandao 2" (乾道二年) rather than by a continuous count.

  Before: [[longxing-era|Longxing]]. After: [[chunxi-era|Chunxi]].
sources:
