name: The scholar recluse in landscape painting
names: [shanshui]
category: iconography
definition: "In Chinese landscape painting (shanshui), the tiny scholar crossing a bridge or gazing at a waterfall: the ideal of withdrawing from the world into harmony with nature."
description_md: |-
  In Chinese landscape painting (*shanshui*, "mountain-water"), a tiny scholar crossing a bridge, sitting in a hut or gazing at a waterfall represents the ideal of withdrawing from the world into harmony with nature.

  **Famous works**

  - Fan Kuan, *Travellers among Mountains and Streams* (National Palace Museum, Taipei)
  - [[artist/guo-xi]], *Early Spring* (National Palace Museum, Taipei)
  - Ma Yuan, *Walking on a Mountain Path in Spring* (National Palace Museum, Taipei)
  - Huang Gongwang, *Dwelling in the Fuchun Mountains* (split between Taipei and Hangzhou)
  - [[artist/zhang-zeduan]], *Along the River During the Qingming Festival* (Palace Museum, Beijing, a city scene)

  *From:* Chinese
