name: Christ and the Woman Taken in Adultery
names: [The Woman Taken in Adultery, Pericope Adulterae]
category: iconography
definition: "Jesus's answer to the scholars who would stone an adulteress: \"Let him who is without sin cast the first stone\"."
description_md: |-
  Scholars brought Jesus a woman caught in adultery and asked whether she should be stoned, as the law said. He wrote in the dust and said, "Let him who is without sin cast the first stone." One by one, they left.

  **In art:** A woman held before Christ by accusers, as he writes on the ground.

  **Famous works**

  - Pieter Bruegel the Elder, *Christ and the Woman Taken in Adultery* (Courtauld)
  - [[artist/rembrandt]], *The Woman Taken in Adultery* (National Gallery, London)
  - [[artist/lucas-cranach-the-elder]], several versions

  *From:* New Testament, Gospels · Christian
