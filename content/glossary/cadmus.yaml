name: Cadmus
category: mythology and legend
definition: The Phoenician prince of Greek myth who founded Thebes where a cow lay down, killed a dragon and sowed its teeth, from which armed warriors sprang; in old age he was turned into a serpent.
description_md: |-
  Cadmus was a Phoenician prince sent to find his sister [[europa]]. He failed, and the oracle of Delphi told him to follow a cow and found a city where it lay down. That city became Thebes. Nearby he killed a dragon, and on the goddess [[athena]]'s advice he sowed its teeth in the ground. Armed warriors sprang up from the earth and fought each other until only five were left, who became the ancestors of the Thebans. In his old age, Cadmus himself was turned into a serpent.

  *From:* Greek mythology · Ancient Greek
