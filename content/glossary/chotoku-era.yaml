definition: "Japanese era name (長徳) for the years 995–998: 995 is Chōtoku 1 (元年) and Chōtoku 4 is 998."
description_md: |-
  **Chōtoku** (長徳) is a Japanese era name ([[nengo]]), proclaimed in 995. Its years are counted in lunar years from the new year before the proclamation: 995 is Chōtoku 1 (元年), 998 its last year, Chōtoku 4. A Japanese source dates a year within it as "Chōtoku 2" (長徳2年) rather than by a continuous count.

  Before: [[shoryaku-era|Shōryaku]]. After: [[choho-era|Chōhō]].
