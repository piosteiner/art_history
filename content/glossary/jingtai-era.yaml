definition: "Chinese era name (景泰) of the Ming for the years 1450–1456: 1450 is Jingtai 1 (元年) and Jingtai 7 is 1456."
description_md: |-
  **Jingtai** (景泰) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1450. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Jingtai Emperor. Its years are counted in lunar years: 1450 is Jingtai 1 (元年), 1456 its last year, Jingtai 7. A Chinese source dates a year within it as "Jingtai 2" (景泰二年) rather than by a continuous count.

  Before: [[zhengtong-era|Zhengtong]]. After: [[tianshun-era|Tianshun]].
