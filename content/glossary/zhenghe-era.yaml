name: Zhenghe
names:
  - lang: zh
    role: original
    text: 政和
category: calendar
parent: chinese-calendar
definition: "Chinese era name (政和) of the Northern Song for the years 1111–1118: 1111 is Zhenghe 1 (元年) and Zhenghe 8 is 1118."
description_md: |-
  **Zhenghe** (政和) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1111 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1111 is Zhenghe 1 (元年), 1118 its last year, Zhenghe 8. A Chinese source dates a year within it as "Zhenghe 2" (政和二年) rather than by a continuous count.

  Before: [[daguan-era|Daguan]]. After: [[chonghe-era|Chonghe]].
sources:
