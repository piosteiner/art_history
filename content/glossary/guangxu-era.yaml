definition: "Chinese era name (光緒) of the Qing for the years 1875–1908: 1875 is Guangxu 1 (元年) and Guangxu 34 is 1908."
description_md: |-
  **Guangxu** (光緒) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1875. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Guangxu Emperor. Its years are counted in lunar years: 1875 is Guangxu 1 (元年), 1908 its last year, Guangxu 34. A Chinese source dates a year within it as "Guangxu 2" (光緒二年) rather than by a continuous count.

  Before: [[tongzhi-era|Tongzhi]]. After: [[xuantong-era|Xuantong]].
