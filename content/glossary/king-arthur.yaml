definition: The legendary king of Britain of Arthurian legend, who drew the sword from the stone, gathered the Knights of the Round Table at Camelot and was carried, mortally wounded, to Avalon.
description_md: |-
  The legendary king of Britain, who proved his right to rule by pulling a sword from a stone. He gathered the Knights of the Round Table at Camelot. After being mortally wounded in battle against his son or nephew [[mordred]], he was carried away by three queens to the island of Avalon, from which, legend says, he will one day return.

  **In art:** A crowned king with the sword [[excalibur]], a round table, or lying wounded in a boat with mourning queens.

  **Famous works**

  - [[artist/edward-burne-jones]], *The Last Sleep of Arthur in Avalon* (Ponce, Puerto Rico)
  - James Archer, *La Mort d'Arthur* (Manchester)

  *From:* Thomas Malory, Le Morte d'Arthur; Tennyson, Idylls of the King · British (Arthurian legend)
