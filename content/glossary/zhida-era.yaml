name: Zhida
names:
  - lang: zh
    role: original
    text: 至大
category: calendar
parent: chinese-calendar
definition: "Chinese era name (至大) of the Yuan for the years 1308–1311: 1308 is Zhida 1 (元年) and Zhida 4 is 1311."
description_md: |-
  **Zhida** (至大) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1308 under Külüg Khan (武宗). Its years are counted in lunar years: 1308 is Zhida 1 (元年), 1311 its last year, Zhida 4. A Chinese source dates a year within it as "Zhida 2" (至大二年) rather than by a continuous count.

  Before: [[dade-era|Dade]]. After: [[huangqing-era|Huangqing]].
sources:
