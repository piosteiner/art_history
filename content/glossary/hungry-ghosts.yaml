name: Hungry ghosts
names: [preta, gaki]
category: mythology and legend
also_in: [iconography]
definition: In Buddhist thought, beings reborn with huge stomachs and tiny mouths, so they are always starving.
description_md: |-
  In Buddhist thought, beings are reborn in six realms: gods, demigods, humans, animals, hungry ghosts and hell beings. The hungry ghosts (*preta*, Japanese *gaki*) have huge stomachs and tiny mouths, so they're always starving.

  **In art:** Emaciated figures with swollen bellies scavenging.

  **Famous works**

  - *Gaki-zōshi (Scroll of Hungry Ghosts)* (Tokyo and Kyoto National Museums)
  - *Jigoku-zōshi (Hell Scrolls)* (Tokyo and Nara National Museums)

  *From:* Buddhist
