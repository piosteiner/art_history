definition: The bodhisattva of practice and meditation, Manjushri's partner, riding a white elephant.
description_md: |-
  The bodhisattva of practice and meditation, [[manjushri]]'s partner.

  **In art:** Riding a white elephant, often with six tusks.

  **Famous works**

  - *Fugen Bosatsu* (Heian period, Tokyo National Museum)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
