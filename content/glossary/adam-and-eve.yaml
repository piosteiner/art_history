name: Adam and Eve
names: [Adam, Eve, The Fall of Man]
category: mythology and legend
also_in: [iconography]
definition: The first humans in the Book of Genesis, expelled from the Garden of Eden after eating the forbidden fruit (the Fall of Man).
description_md: |-
  The first humans, created by God and placed in the Garden of Eden. The serpent tempted Eve to eat the forbidden fruit of the Tree of Knowledge, she shared it with Adam, and they were expelled from Paradise (the Fall of Man).

  **In art:** A nude man and woman beside a tree with a serpent (sometimes with a woman's head) and an apple, which comes from a Latin pun on *malum*, "evil" and "apple". After the Fall, they cover themselves with fig leaves and are driven out by an angel with a flaming sword.

  **Famous works**

  - [[artist/michelangelo]], *The Creation of Adam* and *The Fall* (Sistine Chapel ceiling)
  - [[artist/masaccio]], *The Expulsion from the Garden of Eden* (Brancacci Chapel, Florence)
  - [[artist/albrecht-durer]], *Adam and Eve* (engraving and Prado panels) — [[artwork/durer-adam-und-eva-1504]]
  - [[artist/jan-van-eyck]], Adam and Eve on the *Ghent Altarpiece*
  - [[artist/hieronymus-bosch]], *The Garden of Earthly Delights* (Prado) — [[artwork/the-garden-of-earthly-delights]]

  *From:* Hebrew Bible, Genesis · Hebrew Bible
