definition: In Greek myth, the sorceress princess of Colchis who helped Jason win the Golden Fleece and, when he abandoned her, killed his new bride and her own children.
description_md: |-
  A sorceress, princess of Colchis and granddaughter of the sun god. She helped [[jason]] win the Golden Fleece and fled with him. When he later abandoned her to marry a princess, she killed the bride with a poisoned robe, and then killed her own children.

  **In art:** A woman with a dagger, standing over or clutching her children, or escaping in a chariot drawn by dragons.

  **Famous works**

  - [[artist/eugene-delacroix]], *Medea About to Kill Her Children* (Palais des Beaux-Arts, Lille)
  - Frederick Sandys, *Medea* (Birmingham)
  - [[artist/anselm-feuerbach]], *Medea*

  *From:* Greek mythology; Euripides, Medea · Ancient Greek
