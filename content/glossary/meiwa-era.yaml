category: calendar
definition: "Japanese era name (明和) for the years 1764–1772: 1764 is Meiwa 1 (元年) and Meiwa 9 is 1772."
description_md: |-
  **Meiwa** (明和) is a Japanese era name ([[nengo]]), proclaimed in 1764. Its years are counted in lunar years from the new year before the proclamation: 1764 is Meiwa 1 (元年), 1772 its last year, Meiwa 9. A Japanese source dates a year within it as "Meiwa 2" (明和2年) rather than by a continuous count.

  Before: [[horeki-era|Hōreki]]. After: [[anei-era|An'ei]].
