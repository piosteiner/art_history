name: Yongchun
names:
  - lang: zh
    role: original
    text: 永淳
category: calendar
parent: chinese-calendar
definition: "Chinese era name (永淳) of the Tang for the years 682–683: 682 is Yongchun 1 (元年) and Yongchun 2 is 683."
description_md: |-
  **Yongchun** (永淳) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 682 under Emperor Gaozong (高宗). Its years are counted in lunar years: 682 is Yongchun 1 (元年), 683 its last year, Yongchun 2. A Chinese source dates a year within it as "Yongchun 2" (永淳二年) rather than by a continuous count.

  Before: [[kaiyao-era|Kaiyao]]. After: [[hongdao-era|Hongdao]].
sources:
  definition:
