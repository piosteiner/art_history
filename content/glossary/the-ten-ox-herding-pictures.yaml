definition: A Zen series in which a herdsman searches for, tames and finally forgets an ox, a metaphor for the path to enlightenment.
description_md: |-
  Common subjects of [[zen]] ink painting. The Ten Ox-Herding Pictures show a herdsman searching for, taming and finally forgetting an ox, a metaphor for the path to enlightenment.

  **Famous works**

  - Shubun (attributed), *Ten Ox-Herding Pictures* (Shōkoku-ji, Kyoto)

  *From:* Chan/Zen Buddhist
