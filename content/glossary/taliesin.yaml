name: Taliesin
names: [Gwion Bach]
category: mythology and legend
definition: "The greatest bard of Welsh legend: as the boy Gwion Bach he tasted three drops of the witch Ceridwen's potion of wisdom, fled her through a chain of transformations, was swallowed as a grain and reborn as Taliesin."
description_md: |-
  As the servant boy Gwion Bach, he stirred the witch Ceridwen's potion of wisdom for a year and accidentally tasted three drops. She chased him, and both changed shapes: hare and greyhound, fish and otter, bird and hawk. Finally, he became a grain of wheat and she became a hen and ate him. She then gave birth to him again and cast the baby into the sea in a leather bag; Elffin, who found him, named him Taliesin, the "radiant brow".

  *From:* Hanes Taliesin · Welsh
