definition: "Japanese era name (元暦) for the years 1184–1185: 1184 is Genryaku 1 (元年) and Genryaku 2 is 1185."
description_md: |-
  **Genryaku** (元暦) is a Japanese era name ([[nengo]]), proclaimed in 1184. Its years are counted in lunar years from the new year before the proclamation: 1184 is Genryaku 1 (元年), 1185 its last year, Genryaku 2. A Japanese source dates a year within it as "Genryaku 2" (元暦2年) rather than by a continuous count.

  Before: [[juei-era|Juei]]. After: [[bunji-era|Bunji]].
