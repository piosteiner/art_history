name: Abundantia
names: [Abundance]
category: iconography
definition: "Abundance personified: a woman holding a horn of plenty overflowing with fruit and flowers."
description_md: |-
  Abundance (Abundantia) is a woman holding a horn of plenty overflowing with fruit and flowers. In one version, the cornucopia was the horn of the goat Amalthea, who nursed the infant [[zeus]]; in another ([[person/ovid]]), it was the horn [[heracles]] broke off the river god Achelous.

  **Famous works**

  - Rubens, *Abundance (Abundantia)* (about 1630, National Museum of Western Art, Tokyo)

  *From:* Roman
