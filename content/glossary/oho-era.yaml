definition: "Japanese era name (応保) for the years 1161–1163: 1161 is Ōhō 1 (元年) and Ōhō 3 is 1163."
description_md: |-
  **Ōhō** (応保) is a Japanese era name ([[nengo]]), proclaimed in 1161. Its years are counted in lunar years from the new year before the proclamation: 1161 is Ōhō 1 (元年), 1163 its last year, Ōhō 3. A Japanese source dates a year within it as "Ōhō 2" (応保2年) rather than by a continuous count.

  Before: [[eiryaku-era|Eiryaku]]. After: [[chokan-era|Chōkan]].
