definition: "The reign years of King Injong of Joseon (仁宗, 인종), by which Korean sources date 1545: 1545 is Injong 1, 1545 Injong 1."
description_md: |-
  **Injong** (仁宗, 인종): the years of the reign of King Injong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1545 is Injong 1 (인종 1년). The year of the accession, 1545, counts as the first year.

  Before: [[jungjong-reign-years|Jungjong]]. After: [[myeongjong-reign-years|Myeongjong]].
