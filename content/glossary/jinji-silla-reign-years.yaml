public_id: 113361
name: Jinji of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 진지왕
  - lang: ko-Hani
    role: alternative
    text: 眞智王
category: calendar
parent: korean-calendar
definition: "The reign years of King Jinji of Silla (眞智王, 진지왕), by which Korean histories date 576–579: 576 is Jinji 1, 579 Jinji 4."
description_md: |-
  **Jinji** (眞智王, 진지왕): the years of the reign of King Jinji of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 579 is Jinji 4 (진지왕 4년). The year of the accession, 576, counts as the first year.

  Before: [[jinheung-silla-reign-years|Jinheung]]. After: [[jinpyeong-silla-reign-years|Jinpyeong]].
sources:
  definition:
    - source: dila-time-authority
