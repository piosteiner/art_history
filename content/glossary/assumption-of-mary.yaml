definition: Mary taken up body and soul into heaven, from later tradition, not the Bible.
description_md: |-
  She is then taken up body and soul into heaven (the Assumption). These come from tradition, not the Bible.

  **In art:** Mary rising into the sky on clouds surrounded by angels.

  **Famous works**

  - [[artist/titian]], *Assumption of the Virgin* (*Assunta*, Frari, Venice) — [[artwork/assumption-of-the-virgin-titian]]

  *From:* Christian tradition · Christian
