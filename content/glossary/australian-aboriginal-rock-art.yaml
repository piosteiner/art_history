name: Australian Aboriginal rock art
names: [Murujuga, Kakadu, Ubirr, Burrungkuy, Gwion Gwion, Wandjina, kunbim]
category: art style
definition: One of the oldest and richest rock art traditions on earth, thousands of years old — at Murujuga, in Kakadu next to Arnhem Land and in the Kimberley; many sites are still important to their communities.
description_md: |-
  Australia has one of the oldest and richest rock art traditions on earth, thousands of years old. Many sites are still important to their communities, and some can only be visited with permission or a local guide.

  **Famous works**

  - *Kakadu National Park rock art* (next to Arnhem Land (Ubirr and Burrungkuy/Nourlangie, with "x-ray" style animals))
  - *Murujuga* (Burrup Peninsula, Western Australia, with over a million engravings)
  - *Kimberley rock art* (Western Australia)

  **Held sacred today:** Many sites are still important to their communities, and some can only be visited with permission or a local guide. The Wandjina are sacred to the Worrorra, Ngarinyin and Wunambal peoples; don't reproduce Wandjina images without permission, and point readers to the Mowanjum Aboriginal Art and Culture Centre. Use the name Gwion Gwion, not the old "Bradshaw" paintings.

  *From:* Aboriginal Australian (Ngarda-Ngarli, Bininj/Mungguy, Worrorra, Ngarinyin, Wunambal)
