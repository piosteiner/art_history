definition: "Japanese era name (建永) for the years 1206–1207: 1206 is Ken'ei 1 (元年) and Ken'ei 2 is 1207."
description_md: |-
  **Ken'ei** (建永) is a Japanese era name ([[nengo]]), proclaimed in 1206. Its years are counted in lunar years from the new year before the proclamation: 1206 is Ken'ei 1 (元年), 1207 its last year, Ken'ei 2. A Japanese source dates a year within it as "Ken'ei 2" (建永2年) rather than by a continuous count.

  Before: [[genkyu-era|Genkyū]]. After: [[jogen-era-1207|Jōgen]].
