name: Peri Banu
names: [Paribanou, Pari Banu]
category: mythology and legend
definition: In a tale added to the Nights by Antoine Galland, a fairy princess living in a hidden palace in a mountain, who married Prince Ahmed.
description_md: |-
  Three princes competed for a bride. [[prince-ahmed]]'s arrow flew so far that he followed it to a hidden palace in a mountain, where the fairy Peri Banu lived. He married her. On their earlier quest for rarities, his brothers had found a flying carpet and an ivory tube that showed anyone far away, and Ahmed himself an apple that cured every illness.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
