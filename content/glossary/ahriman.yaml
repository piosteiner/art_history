name: Ahriman
names: [Angra Mainyu]
category: mythology and legend
definition: In Zoroastrian tradition (also Angra Mainyu), the hostile spirit of darkness and destruction opposed to the good creator Ahura Mazda; in the Shahnameh the hidden hand behind many disasters.
description_md: |-
  In Zoroastrian tradition, Ahriman (also Angra Mainyu) is the hostile spirit opposed to the good creator, Ahura Mazda. He brings lies, disease, darkness and death into the world. In the Shahnameh, he is the hidden hand behind many disasters: he corrupts [[zahhak]] and tempts kings into pride.

  *From:* Zoroastrian tradition; Shahnameh · Persian (Zoroastrian)
