definition: In Greek myth the Trojan princess sacrificed on Achilles' tomb after the war at the demand of his ghost.
description_md: |-
  Polyxena was a Trojan princess sacrificed on [[achilles]]' tomb after the war, at the demand of his ghost. [[neoptolemus]] (also called Pyrrhus) was Achilles' brutal son, who killed [[priam]] and [[hector]]'s little son Astyanax.

  **In art:** A young woman led to an altar or tomb by a warrior.

  **Famous works**

  - Pio Fedi, *The Rape of Polyxena* (Loggia dei Lanzi, Florence)
  - Giovanni Battista Pittoni, *The Sacrifice of Polyxena* (Getty)

  *From:* Greek mythology · Ancient Greek
