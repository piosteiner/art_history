public_id: 132312
name: The Seven Deadly Sins
category: iconography
definition: Pride, Greed (Avarice), Lust, Envy, Gluttony, Wrath and Sloth, shown in art as scenes or as symbolic figures.
description_md: |-
  Pride, Greed (Avarice), Lust, Envy, Gluttony, Wrath and Sloth.

  **In art:** Scenes of people committing each sin, or symbolic figures: Pride with a peacock or mirror, Greed with money bags, Lust with a goat or boar, Envy eating her own heart or with snakes, Gluttony feasting, Wrath tearing at clothes, and Sloth asleep.

  **Famous works**

  - [[artist/hieronymus-bosch]] or a follower, *The Seven Deadly Sins and the Four Last Things* (c. 1500 or later, Prado, Madrid) — [[artwork/the-seven-deadly-sins-and-the-four-last-things]]
  - Pieter Bruegel the Elder (design), *The Seven Deadly Sins* (engravings by Pieter van der Heyden, published by Hieronymus Cock, 1556–1558)

  *From:* Christian
