name: The Four Temperaments
names: [sanguine, choleric, melancholic, phlegmatic]
category: iconography
definition: The four kinds of human character of ancient and medieval medicine — sanguine, choleric, melancholic and phlegmatic — based on the four bodily fluids.
description_md: |-
  Ancient and medieval thought divided human character into four temperaments based on the four bodily fluids: sanguine (blood, cheerful), choleric (yellow bile, angry), melancholic (black bile, sad) and phlegmatic (phlegm, calm).

  **Famous works**

  - [[artist/albrecht-durer]], *The Four Apostles* (Munich, often read as the four temperaments)

  *From:* European (classical)
