public_id: 113061
name: Hongdao
names:
  - lang: zh
    role: original
    text: 弘道
category: calendar
definition: "Chinese era name (弘道) of the Tang for the years 683–684: 683 is Hongdao 1 (元年) and Hongdao 2 is 684."
description_md: |-
  **Hongdao** (弘道) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 683 under Emperor Gaozong (高宗). Its years are counted in lunar years: 683 is Hongdao 1 (元年), 684 its last year, Hongdao 2. A Chinese source dates a year within it as "Hongdao 2" (弘道二年) rather than by a continuous count.

  Before: [[yongchun-era|Yongchun]]. After: [[sisheng-era|Sisheng]].
sources:
  definition:
    - source: dila-time-authority
