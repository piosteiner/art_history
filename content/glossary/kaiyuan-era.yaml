name: Kaiyuan
names:
  - lang: zh
    role: original
    text: 開元
category: calendar
definition: "Chinese era name (開元) of the Tang for the years 713–741: 713 is Kaiyuan 1 (元年) and Kaiyuan 29 is 741."
description_md: |-
  **Kaiyuan** (開元) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 713 under Emperor Xuanzong (玄宗). Its years are counted in lunar years: 713 is Kaiyuan 1 (元年), 741 its last year, Kaiyuan 29. A Chinese source dates a year within it as "Kaiyuan 2" (開元二年) rather than by a continuous count.

  Before: [[xiantian-era|Xiantian]]. After: [[tianbao-era|Tianbao]].
sources:
  definition:
