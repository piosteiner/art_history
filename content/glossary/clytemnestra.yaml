definition: In Greek myth the wife of Agamemnon, who murdered him in his bath on his return from Troy (in Aeschylus' version; in Homer Aegisthus is the killer) and was killed by their son Orestes.
description_md: |-
  [[agamemnon]], king of Mycenae, led the Greeks to Troy. To get winds for the fleet, he sacrificed his daughter [[iphigenia]] (in some versions [[artemis]] replaced her with a deer). When he came home, his wife Clytemnestra murdered him in his bath (so in Aeschylus' Oresteia; in [[person/homer]] it is Aegisthus who kills him). Their son [[orestes]] later killed her, and was hunted by the Furies.

  **In art:** A queen with a dagger or axe.

  **Famous works**

  - John Collier, *Clytemnestra*

  *From:* Aeschylus, Oresteia · Ancient Greek
