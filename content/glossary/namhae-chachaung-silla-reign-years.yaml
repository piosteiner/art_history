public_id: 113338
name: Namhae Chachaung of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 남해차차웅
  - lang: ko-Hani
    role: alternative
    text: 南解次次雄
category: calendar
definition: "The reign years of Namhae Chachaung of Silla (南解次次雄, 남해차차웅), by which Korean histories date 4–24: 4 is Namhae Chachaung 1, 24 Namhae Chachaung 21."
description_md: |-
  **Namhae Chachaung** (南解次次雄, 남해차차웅): the years of the reign of Namhae Chachaung of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 13 is Namhae Chachaung 10 (남해차차웅 10년). The year of the accession, 4, counts as the first year.

  Before: [[hyeokgeose-geoseogan-silla-reign-years|Hyeokgeose Geoseogan]]. After: [[yuri-isageum-silla-reign-years|Yuri Isageum]].
sources:
  definition:
    - source: dila-time-authority
