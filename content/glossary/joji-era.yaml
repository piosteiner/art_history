definition: "Japanese era name (貞治) for the years 1362–1368: 1362 is Jōji 1 (元年) and Jōji 7 is 1368."
description_md: |-
  **Jōji** (貞治) is a Japanese era name ([[nengo]]), proclaimed in 1362. Its years are counted in lunar years from the new year before the proclamation: 1362 is Jōji 1 (元年), 1368 its last year, Jōji 7. A Japanese source dates a year within it as "Jōji 2" (貞治2年) rather than by a continuous count.

  Before: [[koan-era-1361|Kōan]]. After: [[oan-era|Ōan]].
