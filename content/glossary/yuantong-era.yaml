public_id: 113134
name: Yuantong
names:
  - lang: zh
    role: original
    text: 元統
category: calendar
definition: "Chinese era name (元統) of the Yuan for the years 1333–1334: 1333 is Yuantong 1 (元年) and Yuantong 2 is 1334."
description_md: |-
  **Yuantong** (元統) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1333 under Toghon Temür (順帝). Its years are counted in lunar years: 1333 is Yuantong 1 (元年), 1334 its last year, Yuantong 2. A Chinese source dates a year within it as "Yuantong 2" (元統二年) rather than by a continuous count.

  Before: [[zhishun-era|Zhishun]]. After: [[zhiyuan-era-1335|Zhiyuan]].
sources:
  definition:
    - source: dila-time-authority
