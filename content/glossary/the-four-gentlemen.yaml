name: The Four Gentlemen
names: [Si Junzi]
category: iconography
definition: Plum blossom, orchid, bamboo and chrysanthemum, the four plants of the ideal scholar's virtues and the four seasons, basic subjects of ink painting.
description_md: |-
  Four plants that represent the virtues of the ideal scholar and the four seasons: the plum blossom (winter, courage, blooming in the snow), the orchid (spring, refinement), bamboo (summer, integrity, bending but never breaking) and the chrysanthemum (autumn, nobility in hard times). They are also basic training subjects for ink painting.

  **Famous works**

  - Wu Zhen, *Bamboo* (several, National Palace Museum, Taipei)
  - Zheng Xie (Zheng Banqiao), *Bamboo* (paintings)
  - Wang Mian, *Plum Blossoms* (Palace Museum, Beijing)

  *From:* Chinese
