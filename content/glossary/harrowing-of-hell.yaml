name: Harrowing of Hell
names: [Anastasis, Descent into Limbo]
category: iconography
definition: Christ's descent into Limbo between his death and Resurrection to free the righteous, beginning with Adam and Eve; the Anastasis of Byzantine art.
description_md: |-
  Between his death and Resurrection, Christ descends into Limbo to free the souls of the righteous, starting with [[adam-and-eve]].

  **In art:** Christ breaking down the gates of Hell, trampling the Devil, and pulling Adam and Eve out by the hand. Called the *Anastasis* in Byzantine art.

  **Famous works**

  - *Anastasis* fresco (Chora Church, Istanbul)
  - [[artist/andrea-mantegna]], *Descent into Limbo*

  *From:* Christian tradition · Christian
