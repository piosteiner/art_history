name: Chonghe
names:
  - lang: zh
    role: original
    text: 重和
category: calendar
parent: chinese-calendar
definition: "Chinese era name (重和) of the Northern Song for the years 1118–1119: 1118 is Chonghe 1 (元年) and Chonghe 2 is 1119."
description_md: |-
  **Chonghe** (重和) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1118 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1118 is Chonghe 1 (元年), 1119 its last year, Chonghe 2. A Chinese source dates a year within it as "Chonghe 2" (重和二年) rather than by a continuous count.

  Before: [[zhenghe-era|Zhenghe]]. After: [[xuanhe-era|Xuanhe]].
sources:
