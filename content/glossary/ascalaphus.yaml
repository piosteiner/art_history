public_id: 131269
name: Ascalaphus
category: mythology and legend
definition: In Greek myth, the gardener of the Underworld who told that Persephone had eaten pomegranate seeds there, and was turned into a screech owl.
description_md: |-
  He saw [[persephone]] eat seven pomegranate seeds in the Underworld and told everyone, so she had to stay there part of every year. As punishment, he was turned into a screech owl, a bird of ill omen.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
