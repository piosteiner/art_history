public_id: 113320
name: Uijong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 의종
  - lang: ko-Hani
    role: alternative
    text: 毅宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Uijong of Goryeo (毅宗, 의종), by which Korean histories date 1147–1170: 1147 is Uijong 1, 1170 Uijong 24."
description_md: |-
  **Uijong** (毅宗, 의종): the years of the reign of King Uijong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1156 is Uijong 10 (의종 10년). The year of the accession, 1147, counts as the first year.

  Before: [[injong-goryeo-reign-years|Injong]]. After: [[myeongjong-goryeo-reign-years|Myeongjong]].
sources:
  definition:
    - source: dila-time-authority
