name: Rostam
names: [Rustam]
category: mythology and legend
definition: The greatest hero of the Persian Shahnameh, champion of the Seven Labours, who unknowingly killed his own son Sohrab.
description_md: |-
  Rostam was so huge at birth that he had to be delivered by an early kind of caesarean section, guided by the [[simurgh]]. He grew into an unbeatable champion of Persia. His most famous adventure is the **Seven Labours**, in which his horse [[rakhsh]] killed a lion, crossed a deadly desert, killed a dragon, defeated a witch, captured a warlord and finally slew the White Demon in its cave. Despite all his strength, his life is full of tragedy, above all killing his own son [[sohrab]] without knowing who he was.

  *From:* Shahnameh · Persian
