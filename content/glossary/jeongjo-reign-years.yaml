public_id: 109295
name: Jeongjo (reign years)
names:
  - lang: ko
    role: original
    text: 정조
  - lang: ko-Hani
    role: alternative
    text: 正祖
category: calendar
definition: "The reign years of Jeongjo of Joseon (正祖, 정조), by which Korean sources date 1777–1800: 1777 is Jeongjo 1, 1800 Jeongjo 24."
description_md: |-
  **Jeongjo** (正祖, 정조): the years of the reign of [[person/jeongjo-of-joseon|Jeongjo of Joseon]], who came to the throne on 10 March 1776. Korean sources count years by the reigning king ([[korean-reign-years]]): 1786 is Jeongjo 10 (정조 10년). His first year is 1777, the year after his accession; the rest of 1776 still counts for his predecessor.

  Before: [[yeongjo-reign-years|Yeongjo]]. After: [[sunjo-reign-years|Sunjo]].
