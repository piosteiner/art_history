public_id: 132342
name: Sacred and Profane Love
category: iconography
definition: Two kinds of love, heavenly and earthly, often shown as two Venuses, one nude and one clothed.
description_md: |-
  Two kinds of love: heavenly, spiritual love and earthly, physical love, in [[artist/titian]]'s painting shown as two women, one nude and one clothed, read since Panofsky as the Neoplatonic "twin Venuses" (earthly and heavenly); other readings see a bride with [[aphrodite|Venus]], and the title is first recorded only in 1693.

  **Famous works**

  - Titian, *Sacred and Profane Love* (Galleria Borghese) — [[artwork/sacred-and-profane-love]]
  - Giovanni Baglione, *Sacred Love versus Profane Love* (1602–03, Gemäldegalerie, Berlin; a second version in the Galleria Nazionale d'Arte Antica, Rome)

  *From:* European
