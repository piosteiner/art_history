name: Wise Men of Chelm
category: mythology and legend
definition: The lovable fools of Chelm in Yiddish humour, a town of people who think they are very wise.
description_md: |-
  In Yiddish humour, Chelm is a town of fools who think they're very wise. They tried to catch the moon in a barrel of water, and when it became cloudy, they thought they'd caught it. When beautiful fresh snow fell, they didn't want the beadle to spoil it with footprints as he went around calling people to prayer, so they had four men carry him on a table.

  *From:* Yiddish humour · Jewish (Yiddish)
