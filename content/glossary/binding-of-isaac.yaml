name: Binding of Isaac
names: [Abraham and Isaac, The Sacrifice of Isaac, Abraham, Isaac]
category: mythology and legend
also_in: [iconography]
definition: "The test of Abraham's faith in Genesis: ordered to sacrifice his son Isaac, he was stopped by an angel and sacrificed a ram instead."
description_md: |-
  God tested Abraham's faith by ordering him to sacrifice his beloved son Isaac. Just as Abraham raised the knife, an angel stopped his hand, and he sacrificed a ram caught in a thicket instead. Abraham is the patriarch of Judaism, Christianity and Islam.

  **In art:** An old man holding a knife over a boy bound on an altar, with an angel grabbing his arm and a ram nearby.

  **Famous works**

  - [[artist/caravaggio]], *The Sacrifice of Isaac* (Uffizi) — [[artwork/sacrifice-of-isaac]]
  - [[artist/rembrandt]], *The Sacrifice of Isaac* (Hermitage)
  - Lorenzo Ghiberti and Filippo Brunelleschi, competition panels for the Florence Baptistery doors (Bargello, 1401)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
