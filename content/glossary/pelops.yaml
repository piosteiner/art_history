name: Pelops
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the hero who won Hippodamia in a chariot race against her father; the Peloponnese is named after him.
description_md: |-
  Pelops won the hand of [[hippodamia]] in a chariot race against her father, who had killed all her previous suitors. He bribed the charioteer to sabotage the king's chariot. The region of the Peloponnese is named after him, and his race was said to be the origin of the Olympic Games.

  **In art:** Two chariots racing, with a crashing wheel.

  **Famous works**

  - East pediment, *Temple of Zeus at Olympia* (Archaeological Museum of Olympia)

  *From:* Greek mythology · Ancient Greek
