name: Apep
names: [Apophis]
category: mythology and legend
definition: In ancient Egyptian belief, the great serpent of chaos (also Apophis) who lay in wait each night to devour the sun and was fought off again and again.
description_md: |-
  In ancient Egyptian belief, the sun god sailed across the sky by day and through the underworld by night. Every night, the enormous serpent Apep (also Apophis) lay in wait in the darkness to devour the sun and plunge the world into chaos. Every night he was fought off and cut to pieces, and every night he returned. His movements were thought to cause earthquakes, and his battles with Set may explain thunderstorms.

  *From:* Egyptian religion · Ancient Egyptian
