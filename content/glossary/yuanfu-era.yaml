name: Yuanfu
names:
  - lang: zh
    role: original
    text: 元符
category: calendar
definition: "Chinese era name (元符) of the Northern Song for the years 1098–1100: 1098 is Yuanfu 1 (元年) and Yuanfu 3 is 1100."
description_md: |-
  **Yuanfu** (元符) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1098 under Emperor Zhezong (哲宗). Its years are counted in lunar years: 1098 is Yuanfu 1 (元年), 1100 its last year, Yuanfu 3. A Chinese source dates a year within it as "Yuanfu 2" (元符二年) rather than by a continuous count.

  Before: [[shaosheng-era|Shaosheng]]. After: [[jianzhong-jingguo-era|Jianzhong Jingguo]].
sources:
