public_id: 132157
name: Noli me tangere
category: iconography
definition: The risen Christ telling Mary Magdalene, who first took him for the gardener, "Do not touch me".
description_md: |-
  [[person/mary-magdalene]] finds the tomb empty and meets the risen Christ, thinking he's the gardener. When she recognises him, he tells her "*Noli me tangere*" ("Do not touch me").

  **In art:** Christ, sometimes holding a spade or hoe, stepping back from a kneeling woman reaching towards him.

  **Famous works**

  - [[artist/titian]], *Noli me tangere* (National Gallery, London)
  - [[artist/fra-angelico]], *Noli me tangere* (San Marco, Florence)
  - Correggio, *Noli me tangere* (Prado)

  *From:* New Testament, Gospels · Christian
