public_id: 131201
name: Gevatter Tod
names: [Godfather Death]
category: mythology and legend
definition: In the Grimms' fairy tale, Death himself, who becomes a poor child's godfather and makes him a famous doctor.
description_md: |-
  Death made his godson a famous doctor: if Death stood at the head of a sickbed, the patient would live, and if he stood at the feet, they would die. The doctor tricked Death twice by turning the bed around. In return, Death took him to a cave full of candles, one for every life, and let his candle go out.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
