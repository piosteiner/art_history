public_id: 113052
name: Qianfeng
names:
  - lang: zh
    role: original
    text: 乾封
category: calendar
definition: "Chinese era name (乾封) of the Tang for the years 666–668: 666 is Qianfeng 1 (元年) and Qianfeng 3 is 668."
description_md: |-
  **Qianfeng** (乾封) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 666 under Emperor Gaozong (高宗). Its years are counted in lunar years: 666 is Qianfeng 1 (元年), 668 its last year, Qianfeng 3. A Chinese source dates a year within it as "Qianfeng 2" (乾封二年) rather than by a continuous count.

  Before: [[linde-era|Linde]]. After: [[zongzhang-era|Zongzhang]].
sources:
  definition:
    - source: dila-time-authority
