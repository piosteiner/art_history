public_id: 113290
name: Gogugwon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 고국원왕
  - lang: ko-Hani
    role: alternative
    text: 故國原王
category: calendar
definition: "The reign years of King Gogugwon of Goguryeo (故國原王, 고국원왕), by which Korean histories date 331–371: 331 is Gogugwon 1, 371 Gogugwon 41."
description_md: |-
  **Gogugwon** (故國原王, 고국원왕): the years of the reign of King Gogugwon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 340 is Gogugwon 10 (고국원왕 10년). The year of the accession, 331, counts as the first year.

  Before: [[micheon-goguryeo-reign-years|Micheon]]. After: [[sosurim-goguryeo-reign-years|Sosurim]].
sources:
  definition:
    - source: dila-time-authority
