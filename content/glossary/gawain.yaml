definition: The Knight of the Round Table who beheaded the Green Knight at Camelot and kept his promise to face the return blow a year later.
description_md: |-
  At Camelot's New Year feast, during the Christmas season, a giant green knight challenged anyone to strike him with an axe, on condition that he could return the blow in a year and a day. Gawain beheaded him, but the knight picked up his head and rode away. A year later, Gawain kept his promise and faced him at the Green Chapel.

  **In art:** A green giant holding up his own severed head, or a knight kneeling before an axe.

  **Famous works**

  - *Cotton Nero A.x manuscript illustrations* (British Library, late 14th century)

  *From:* Sir Gawain and the Green Knight · British (Arthurian legend)
