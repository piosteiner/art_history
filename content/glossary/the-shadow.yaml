public_id: 131378
name: The Shadow
category: mythology and legend
definition: In Andersen's fairy tale (1847), a scholar's shadow that leaves him, becomes a rich and powerful man, and takes over his life.
description_md: |-
  One of Andersen's darkest stories. A scholar's shadow left him, went out into the world, and became rich and powerful. When it came back, the scholar became its servant, its "shadow". In the end, the shadow married a princess and had the real man killed.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
