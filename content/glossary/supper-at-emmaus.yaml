name: Supper at Emmaus
names: [The Supper at Emmaus]
category: iconography
definition: Two disciples recognising the risen Christ as he blesses and breaks bread at supper in Emmaus.
description_md: |-
  Two disciples walking to the village of Emmaus meet a stranger. Only when he blesses and breaks bread at supper do they recognise him as the risen Christ, and he vanishes.

  **In art:** Christ blessing bread at a table with two astonished men.

  **Famous works**

  - [[artist/caravaggio]], *Supper at Emmaus* (National Gallery, London, and Brera, Milan)
  - [[artist/rembrandt]], *Supper at Emmaus* (Louvre)
  - Han van Meegeren, *Supper at Emmaus* (a famous Vermeer forgery, Boijmans, Rotterdam)

  *From:* New Testament, Gospels · Christian
