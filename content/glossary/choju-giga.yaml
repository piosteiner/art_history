definition: Comic scrolls of the twelfth and thirteenth centuries in which frogs, rabbits and monkeys behave like humans; often called the ancestor of manga.
description_md: |-
  Comic scrolls from the 12th–13th centuries showing frogs, rabbits and monkeys behaving like humans: wrestling, swimming, and even holding a Buddhist ceremony with a frog as the Buddha. Often called the ancestor of manga.

  **Famous works**

  - *Chōjū-jinbutsu-giga* (four scrolls, 12th–13th century, Kōzan-ji, Kyoto; deposited at the Tokyo and Kyoto National Museums)

  *From:* Japanese
