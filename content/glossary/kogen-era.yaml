category: calendar
definition: "Japanese era name (康元) for the years 1256–1257: 1256 is Kōgen 1 (元年) and Kōgen 2 is 1257."
description_md: |-
  **Kōgen** (康元) is a Japanese era name ([[nengo]]), proclaimed in 1256. Its years are counted in lunar years from the new year before the proclamation: 1256 is Kōgen 1 (元年), 1257 its last year, Kōgen 2. A Japanese source dates a year within it as "Kōgen 2" (康元2年) rather than by a continuous count.

  Before: [[kencho-era|Kenchō]]. After: Shōka.
