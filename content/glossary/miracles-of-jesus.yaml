public_id: 132117
name: Miracles of Jesus
names: [Wedding at Cana, Raising of Lazarus, Miraculous Draught of Fishes]
category: iconography
definition: "The miracles of Jesus most often painted: the Wedding at Cana, the Raising of Lazarus, the Miraculous Draught of Fishes, Christ Walking on Water and the Healing of the Blind."
description_md: |-
  The most painted miracles are the Wedding at Cana (water into wine), the Raising of Lazarus (bringing a dead friend back to life after four days), the Miraculous Draught of Fishes, Christ Walking on Water, and the Healing of the Blind.

  **In art:** A great feast with wine jars (Cana), a man rising from a tomb in his burial cloths (Lazarus), or fishermen hauling in overflowing nets.

  **Famous works**

  - [[artist/paolo-veronese]], *The Wedding at Cana* (Louvre, its largest painting) — [[artwork/the-wedding-at-cana]]
  - Sebastiano del Piombo, *The Raising of Lazarus* (National Gallery, London)
  - Konrad Witz, *The Miraculous Draught of Fishes* (Geneva, set on Lake Geneva, an early realistic landscape)
  - [[artist/raphael]], *The Miraculous Draught of Fishes* (tapestry cartoon, Royal Collection, on loan to the Victoria and Albert Museum, London)

  *From:* New Testament, Gospels · Christian
