name: Guangming
names:
  - lang: zh
    role: original
    text: 廣明
category: calendar
parent: chinese-calendar
definition: "Chinese era name (廣明) of the Tang for the years 880–881: 880 is Guangming 1 (元年) and Guangming 2 is 881."
description_md: |-
  **Guangming** (廣明) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 880 under Emperor Xizong (僖宗). Its years are counted in lunar years: 880 is Guangming 1 (元年), 881 its last year, Guangming 2. A Chinese source dates a year within it as "Guangming 2" (廣明二年) rather than by a continuous count.

  Before: [[qianfu-era|Qianfu]]. After: [[zhonghe-era|Zhonghe]].
sources:
  definition:
    - source: dila-time-authority
