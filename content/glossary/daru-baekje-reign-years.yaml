public_id: 113246
name: Daru of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 다루왕
  - lang: ko-Hani
    role: alternative
    text: 多婁王
category: calendar
definition: "The reign years of King Daru of Baekje (多婁王, 다루왕), by which Korean histories date 28–77: 28 is Daru 1, 77 Daru 50."
description_md: |-
  **Daru** (多婁王, 다루왕): the years of the reign of King Daru of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 37 is Daru 10 (다루왕 10년). The year of the accession, 28, counts as the first year.

  Before: [[onjo-baekje-reign-years|Onjo]]. After: [[giru-baekje-reign-years|Giru]].
sources:
  definition:
    - source: dila-time-authority
