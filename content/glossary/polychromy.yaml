definition: practice of decorating architectural elements, sculpture, etc., in a variety of colors
description_md: |-
  The decoration of architecture, sculpture and other objects in several colours.[[source/wikipedia-en-polychrome|introduction]] Many works of antiquity and the Middle Ages that are now white, beige or grey — Greco-Roman sculptures, Gothic cathedrals — were originally painted.[[source/wikipedia-en-polychrome|introduction]]

  ## Polychrome wood sculpture

  Until the end of the 15th century it was usual for limewood sculpture and altarpieces in southern Germany to be painted, and many still were long after 1500.[[source/baxandall-1980-limewood-sculptors|p. 41]] The polychromy, now often damaged or lost, was very important for the sculpture: it modified the values of masses and surfaces, accented individual forms and played with the changing fall of light.[[source/baxandall-1980-limewood-sculptors|p. 41]] The technique was much like panel painting and followed the painters' handbooks: the wood was roughened, blemishes and joins were filled with a chalk and plaster paste and sometimes covered with linen, and the whole was sized; then several coats of gesso were applied, polished, and worked with knives into fine relief detail before the painting.[[source/baxandall-1980-limewood-sculptors|p. 41]] The pigments were few — azurite and indigo, terre verte and verdigris, madder, vermilion and red lead, carbon, white lead, and gold leaf — but the range of textures was great, resonant with Renaissance textiles: matt surfaces in egg-size tempera for the inner faces of drapery, bases and backgrounds; glossy ones in oil or resin; flesh built up over veins modelled in the gesso; gold leaf over red bole on the outer robes of the principal figures; translucent glazes over silver leaf; and patterned relief of stamped, gilded and painted tin foil, finely striated to suggest the weave of brocade, on the inner drapery of principal figures.[[source/baxandall-1980-limewood-sculptors|pp. 41–42]] Seen in mixed sun and cloud, the few great retables that keep their original polychromy become, in Michael Baxandall's words, "a sort of figured colour organ".[[source/baxandall-1980-limewood-sculptors|p. 42]]

  ## Monochrome sculpture

  From the 1490s carvers could choose between polychromy and monochromy; Tilman Riemenschneider's altarpiece for Münnerstadt (1490–1492) is the first known monochrome limewood retable.[[source/baxandall-1980-limewood-sculptors|p. 42]] Monochrome sculpture was never bare wood but covered with brown-tinted glazes, sometimes with painted pupils and lips.[[source/baxandall-1980-limewood-sculptors|p. 44]] Much of the bare wood sculpture seen today is polychrome sculpture that has lost its colour — Baroque repainting scraped off in the 19th century is a common case — and Baxandall argues that the detail of a carving, designed either to carry gesso and paint or to be seen through a glaze, usually reveals its original state.[[source/baxandall-1980-limewood-sculptors|p. 48]]
