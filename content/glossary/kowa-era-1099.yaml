category: calendar
definition: "Japanese era name (康和) for the years 1099–1104: 1099 is Kōwa 1 (元年) and Kōwa 6 is 1104."
description_md: |-
  **Kōwa** (康和) is a Japanese era name ([[nengo]]), proclaimed in 1099. Its years are counted in lunar years from the new year before the proclamation: 1099 is Kōwa 1 (元年), 1104 its last year, Kōwa 6. A Japanese source dates a year within it as "Kōwa 2" (康和2年) rather than by a continuous count.

  Before: Jōtoku. After: Chōji.
