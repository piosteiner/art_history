definition: "Japanese era name (建久) for the years 1190–1199: 1190 is Kenkyū 1 (元年) and Kenkyū 10 is 1199."
description_md: |-
  **Kenkyū** (建久) is a Japanese era name ([[nengo]]), proclaimed in 1190. Its years are counted in lunar years from the new year before the proclamation: 1190 is Kenkyū 1 (元年), 1199 its last year, Kenkyū 10. A Japanese source dates a year within it as "Kenkyū 2" (建久2年) rather than by a continuous count.

  Before: [[bunji-era|Bunji]]. After: [[shoji-era|Shōji]].
