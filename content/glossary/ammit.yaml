name: Ammit
names: [Devourer of the Dead]
category: mythology and legend
definition: In ancient Egypt, the Devourer of the Dead — crocodile head, lion forequarters, hippopotamus hindquarters — who ate hearts found heavy at the weighing in the underworld.
description_md: |-
  Ammit was a fearsome Egyptian creature with the head of a crocodile, the front of a lion and the back of a hippopotamus. In the underworld, the heart of each dead person was weighed against a feather. If the heart was heavy with wrongdoing, Ammit ate it, and the soul was gone forever. She wasn't worshipped, only feared.

  *From:* Egyptian religion · Ancient Egyptian
