name: Achilles on Skyros
names: [Death of Achilles]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the episode in which the boy Achilles, hidden as a girl on Skyros, gave himself away to Odysseus by grabbing a sword.
description_md: |-
  To keep him from the war, [[thetis]] hid the boy Achilles dressed as a girl among the daughters of King Lycomedes on Skyros. [[odysseus]] came disguised as a merchant with jewels and weapons, and when a trumpet sounded an alarm Achilles gave himself away by grabbing a weapon. At the end of his life, Paris killed him with an arrow guided by [[apollo]] into his heel.

  **In art:** A young man in women's clothes reaching for a sword among girls examining jewels, or a dying hero clutching an arrow in his heel.

  **Famous works**

  - [[artist/nicolas-poussin]], *Achilles on Skyros* (Boston and Richmond)
  - Rubens and Van Dyck, *Achilles Discovered among the Daughters of Lycomedes* (Prado)
  - Ernst Herter, *The Dying Achilles* (Achilleion, Corfu)

  *From:* Greek mythology · Ancient Greek
