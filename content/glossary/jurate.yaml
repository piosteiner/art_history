name: Jūratė
category: mythology and legend
definition: In the Lithuanian legend, a sea goddess living in an amber palace, chained to its ruins by the thunder god for loving the fisherman Kastytis.
description_md: |-
  Jūratė lived in an amber palace under the sea. She fell in love with the fisherman [[kastytis]], and the thunder god was so furious that he smashed her palace with lightning and chained her to its ruins. The amber that washes up on the beaches is the pieces of her palace. Some say it's also her tears.

  *From:* Lithuanian folklore · Lithuanian
