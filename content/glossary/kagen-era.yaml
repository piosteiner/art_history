    text: 嘉元
category: calendar
definition: "Japanese era name (嘉元) for the years 1303–1306: 1303 is Kagen 1 (元年) and Kagen 4 is 1306."
description_md: |-
  **Kagen** (嘉元) is a Japanese era name ([[nengo]]), proclaimed in 1303. Its years are counted in lunar years from the new year before the proclamation: 1303 is Kagen 1 (元年), 1306 its last year, Kagen 4. A Japanese source dates a year within it as "Kagen 2" (嘉元2年) rather than by a continuous count.

  Before: [[kengen-era|Kengen]]. After: [[tokuji-era|Tokuji]].
