name: Ajax the Great
names: [Telamonian Ajax, Ajax]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the giant Greek warrior at Troy, second only to Achilles, who killed himself when Achilles' armour went to Odysseus.
description_md: |-
  The giant Greek warrior with a huge shield like a tower, second only to [[achilles]]. When Achilles' armour was awarded to [[odysseus]] instead of him, he went mad with rage and humiliation and killed himself by falling on his sword.

  **In art:** A massive warrior playing dice with Achilles, carrying Achilles' body from the battlefield, or fixing his sword in the ground to fall on it.

  **Famous works**

  - Exekias, *The Suicide of Ajax* (amphora, Boulogne-sur-Mer)
  - *Pasquino group* (Menelaus with the body of Patroclus, or Ajax with the body of Achilles; Rome and Florence)

  *From:* Homer, Iliad; Sophocles, Ajax · Ancient Greek
