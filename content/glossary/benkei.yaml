name: Benkei
names: [Saitō Musashibō Benkei]
category: mythology and legend
definition: A towering warrior monk of the late Heian period who, after losing his thousandth duel to Minamoto no Yoshitsune, became his loyal retainer and died standing, pierced by countless arrows, guarding a bridge.
description_md: |-
  Benkei was a towering warrior monk of the late Heian period. He stood on a bridge in Kyoto and challenged every swordsman who passed, taking their swords until he had 999. His thousandth duel was against a slim young man with a flute, [[person/minamoto-no-yoshitsune]], who beat him. Benkei became his fiercely loyal retainer. In his final battle, he held a bridge alone to protect his master and was killed by countless arrows, yet he died on his feet, still standing guard.

  *From:* legend (Heike and Gikeiki tradition) · Japanese
