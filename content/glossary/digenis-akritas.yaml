name: Digenis Akritas
names: [Digenes Akritas]
category: mythology and legend
definition: A Byzantine border hero, "the two-blood border lord", son of an Arab emir and a Greek noblewoman, who wrestled with Death in folk songs.
description_md: |-
  The son of an Arab emir and a Greek noblewoman, he guarded the Byzantine frontier against bandits and monsters. In folk songs, he wrestled with [[charon]], Death himself, on a marble threshing floor for three days before he died.

  *From:* Digenes Akritas · Byzantine Greek
