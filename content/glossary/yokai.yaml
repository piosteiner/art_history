definition: "The countless supernatural creatures of Japanese folklore: the fox, the raccoon dog, the kappa, the tengu, the oni, the tsukumogami and many more."
description_md: |-
  *Yokai* are the countless supernatural creatures of Japanese folklore: the shapeshifting fox (*kitsune*) and raccoon dog (*tanuki*), the river imp *kappa*, the long-nosed mountain goblin *tengu*, ogres (*oni*), shape-shifting cats (*bakeneko*), and objects that come to life after a hundred years (*tsukumogami*).

  **In art:** Long scrolls of bizarre creatures parading, or illustrated encyclopedias of monsters.

  **Famous works**

  - Toriyama Sekien, *The Illustrated Night Parade of a Hundred Demons (Gazu Hyakki Yagyō)* (yokai encyclopedia, 1776)
  - [[artist/kawanabe-kyosai]], *demon and yōkai paintings*

  *From:* folklore · Japanese
