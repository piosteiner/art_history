name: Holy Trinity
names: [Trinity]
category: iconography
definition: The Christian God as Father, Son and Holy Spirit.
description_md: |-
  The Christian God as Father, Son and Holy Spirit.

  **In art:** An old bearded man with Christ on the cross before him and a dove, or, more rarely, three identical figures.

  **Famous works**

  - [[artist/masaccio]], *Holy Trinity* (Santa Maria Novella, Florence, an early masterpiece of perspective)
  - Andrei Rublev, *Trinity* (icon, c. 1411–1425; Tretyakov Gallery 1929–2023, since 2024 back in the Trinity Lavra of St. Sergius, Sergiyev Posad)

  *From:* Christian doctrine · Christian
