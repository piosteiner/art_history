public_id: 131339
name: Qamar al-Zaman
category: mythology and legend
definition: In the Nights, a prince ("Moon of the Age") brought together with Princess Budur by two jinn who argued about which of them was more beautiful.
description_md: |-
  Two jinn carried the sleeping Princess [[budur]] from China to the bed of the sleeping Prince Qamar al-Zaman ("Moon of the Age") to compare them. They woke up, fell in love, then were separated. Budur disguised herself as a man and became a king before they were reunited.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
