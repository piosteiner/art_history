definition: Wool rugs and blankets woven on upright looms by Diné women; some patterns are named after the trading posts where they were sold.
description_md: |-
  Wool rugs and blankets woven on upright looms by Diné women. Some patterns are named after the trading posts where they were sold, like Two Grey Hills or Ganado.

  **Famous works**

  - *so-called chief's blankets* (19th century, many museums)

  *From:* Diné (Navajo)
