name: Nüwa
names: [Nuwa, Nü Wa]
category: mythology and legend
definition: One of the oldest figures of Chinese myth, a goddess with a woman's upper body and a serpent's tail, who shaped the first humans from yellow clay and mended the broken sky with five-coloured stones.
description_md: |-
  Nüwa is one of the oldest figures in Chinese myth, shown with a woman's upper body and a serpent's tail. Feeling lonely in the empty world, she shaped the first humans out of yellow clay. Later, when the sky broke (caused, as the Huainanzi tells it, by the battle of [[gonggong]] and Zhuanxu), she melted five-coloured stones in a divine fire to patch the heavens, and cut the legs off a giant turtle to replace the broken pillars.

  *From:* Chinese mythology · Chinese
