public_id: 131176
name: Ilmarinen
category: mythology and legend
definition: The master smith of the Finnish Kalevala who hammered out the dome of the sky and forged the Sampo, a magic mill grinding out flour, salt and money, as bride-price for the Maiden of Pohjola.
description_md: |-
  He hammered out the dome of the heavens. He also forged the Sampo, a magic mill that grinds out flour, salt and money, as a bride-price for the [[maiden-of-pohjola]]. When his wife died, he forged a new one from gold, but she was cold to sleep beside.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
