definition: A ghostly procession of riders and hounds tearing through the stormy sky in European folklore, a subject of 19th-century painters such as Peter Nicolai Arbo.
description_md: |-
  The Wild Hunt is a ghostly procession of riders and hounds tearing through the stormy sky.

  **In art:** Phantom riders in the clouds.

  **Famous works**

  - Peter Nicolai Arbo, *The Wild Hunt of Odin* (*Åsgårdsreien*, 1872; Nasjonalmuseet, Oslo)

  *From:* folklore · Germanic and European folklore
