definition: "Japanese era name (永暦) for the years 1160–1161: 1160 is Eiryaku 1 (元年) and Eiryaku 2 is 1161."
description_md: |-
  **Eiryaku** (永暦) is a Japanese era name ([[nengo]]), proclaimed in 1160. Its years are counted in lunar years from the new year before the proclamation: 1160 is Eiryaku 1 (元年), 1161 its last year, Eiryaku 2. A Japanese source dates a year within it as "Eiryaku 2" (永暦2年) rather than by a continuous count.

  Before: [[heiji-era|Heiji]]. After: [[oho-era|Ōhō]].
