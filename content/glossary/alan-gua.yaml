name: Alan Gua
names: [Alan Qo'a]
category: mythology and legend
definition: The legendary ancestress of the Mongols in The Secret History of the Mongols, who taught her quarrelling sons with bundled arrows that united they could not be broken; Genghis Khan's family traced its line to her.
description_md: |-
  In *The Secret History of the Mongols*, Alan Gua is a widowed ancestress who gave birth to three more sons, fathered, she said, by a shining man of light who came in through the smoke hole of her tent. When her two older sons doubted her, she gave each of her five sons a single arrow to break, which they did easily. Then she handed them five arrows bound together, which none could break. Her lesson: alone you are weak, united you are unbreakable. Genghis Khan's family traced its line back to her.

  *From:* The Secret History of the Mongols · Mongol
