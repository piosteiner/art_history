definition: In Greek myth the king of the gods, god of the sky and thunder, ruling from Mount Olympus; the Romans called him Jupiter.
description_md: |-
  King of the gods, god of the sky and thunder, who rules from Mount Olympus.

  **In art:** Bearded, mature and powerful. Look for the thunderbolt, an eagle, a sceptre or a throne. He often appears in disguise to seduce mortals: as a bull ([[europa]]), a swan ([[leda]]), a shower of gold ([[danae]]), a cloud (Io) or an eagle ([[ganymede]]).

  **Famous works**

  - Phidias' Statue of Zeus at Olympia (lost, one of the Seven Wonders)
  - Ingres, *Jupiter and Thetis* (Musée Granet, Aix-en-Provence)
  - Correggio, *Jupiter and Io* (Kunsthistorisches Museum, Vienna) — [[artwork/jupiter-und-io]]
  - [[artist/titian]], *The Rape of Europa* (Isabella Stewart Gardner Museum, Boston)

  *From:* Greek mythology · Ancient Greek
