name: Antigone
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the daughter of Oedipus, who buried her brother against King Creon's order and was walled up in a tomb.
description_md: |-
  Daughter of Oedipus, who guided her blind father in exile. When her brother died fighting against Thebes, King Creon forbade his burial. Antigone buried him anyway, choosing the gods' law over the king's, and was walled up in a tomb.

  **In art:** A young woman leading a blind old man, or scattering earth over a body.

  **Famous works**

  - Frederic Leighton, *Antigone*
  - Charles Jalabert, *Oedipus and Antigone* (Musée des Beaux-Arts, Marseille)

  *From:* Greek mythology · Ancient Greek
