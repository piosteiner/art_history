public_id: 113281
name: Chadae of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 차대왕
  - lang: ko-Hani
    role: alternative
    text: 次大王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chadae of Goguryeo (次大王, 차대왕), by which Korean histories date 146–165: 146 is Chadae 1, 165 Chadae 20."
description_md: |-
  **Chadae** (次大王, 차대왕): the years of the reign of King Chadae of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 155 is Chadae 10 (차대왕 10년). The year of the accession, 146, counts as the first year.

  Before: [[taejodae-goguryeo-reign-years|Taejodae]]. After: [[sindae-goguryeo-reign-years|Sindae]].
sources:
  definition:
    - source: dila-time-authority
