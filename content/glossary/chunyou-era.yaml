public_id: 113038
name: Chunyou
names:
  - lang: zh
    role: original
    text: 淳祐
category: calendar
definition: "Chinese era name (淳祐) of the Southern Song for the years 1241–1252: 1241 is Chunyou 1 (元年) and Chunyou 12 is 1252."
description_md: |-
  **Chunyou** (淳祐) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1241 under Emperor Lizong (理宗). Its years are counted in lunar years: 1241 is Chunyou 1 (元年), 1252 its last year, Chunyou 12. A Chinese source dates a year within it as "Chunyou 2" (淳祐二年) rather than by a continuous count.

  Before: [[jiaxi-era|Jiaxi]]. After: [[baoyou-era|Baoyou]].
sources:
  definition:
    - source: dila-time-authority
