public_id: 131587
name: Spring-heeled Jack
category: mythology and legend
definition: A leaping figure in a black cloak, with glowing eyes and blue fire, reported by Londoners from 1837 and never caught.
description_md: |-
  From 1837, Londoners reported a tall, thin figure in a black cloak with clawed hands and glowing eyes, who breathed blue fire and could jump over walls. He attacked people and then bounded away. He was never caught.

  *From:* Victorian urban legend · English
