public_id: 131392
name: Cabracan
category: mythology and legend
definition: In the Popol Vuh, a giant son of Seven Macaw who made earthquakes, overcome by the Hero Twins with a roasted bird coated with earth, which took away his strength before they buried him.
description_md: |-
  [[zipacna]] raised mountains and killed four hundred young men by collapsing a house on them. Cabracan made earthquakes. The twins tricked Zipacna into crawling under a mountain after a fake crab, then dropped it on him, and fed Cabracan a roasted bird coated with earth, which took away his strength.

  *From:* Popol Vuh · K'iche' Maya
