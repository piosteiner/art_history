public_id: 131310
name: Pazuzu
category: mythology and legend
definition: In Mesopotamian belief, the demon king of the wind, with a dog's face, wings and a scorpion's tail, whose amulets also protected against the demon Lamashtu.
description_md: |-
  He brought famine and plague on the southwest wind. Strangely, he was also used as a protector: pregnant women wore his amulets to drive away the female demon Lamashtu, who killed babies.

  *From:* Mesopotamian demonology · Mesopotamian (Sumerian, Babylonian, Assyrian)
