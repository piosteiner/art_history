name: insei
names:
  - lang: ja
    role: original
    text: "{院政|いんせい}"
  - lang: en
    role: translation
    text: cloistered rule
category: other
definition: Government by retired, cloistered emperors, begun by Emperor Shirakawa in 1086, which gave the late Heian period its name.
description_md: form of government in Japan during the Heian period, in which abdicated emperors lived in monasteries but actively participated in politics while the titular emperor performed ceremonies
