name: Zal
category: mythology and legend
definition: In the Persian Shahnameh, the white-haired hero abandoned as a baby and raised by the Simurgh; father of Rostam.
description_md: |-
  Zal was born with completely white hair. His father Saam took this for the work of [[ahriman]] and abandoned the baby on a mountain. The Simurgh, an enormous wise bird, found him and raised him as her own chick. When Zal grew up and returned to people, the [[simurgh]] gave him one of her feathers: burning it would call her to help. He later became a wise hero, married Rudaba, and became [[rostam]]'s father.

  *From:* Shahnameh · Persian
