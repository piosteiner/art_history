definition: In Greek myth the goddess of agriculture, grain and the harvest, mother of Persephone; the Romans called her Ceres.
description_md: |-
  Goddess of agriculture, grain and the harvest, mother of [[persephone]].

  **In art:** A mature woman holding ears of wheat, a sickle or a torch (with which she searched for her daughter), crowned with grain.

  **Famous works**

  - Rubens and [[artist/frans-snyders]], *Ceres and Two Nymphs* (Prado)

  *From:* Greek mythology · Ancient Greek
