category: calendar
definition: "Japanese era name (慶応) for the years 1865–1868: 1865 is Keiō 1 (元年) and Keiō 4 is 1868."
description_md: |-
  **Keiō** (慶応) is a Japanese era name ([[nengo]]), proclaimed in 1865. Its years are counted in lunar years from the new year before the proclamation: 1865 is Keiō 1 (元年), 1868 its last year, Keiō 4. A Japanese source dates a year within it as "Keiō 2" (慶応2年) rather than by a continuous count.

  Before: [[genji-era|Genji]]. After: [[meiji-era|Meiji]].
