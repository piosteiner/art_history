name: Xiangxing
names:
  - lang: zh
    role: original
    text: 祥興
category: calendar
parent: chinese-calendar
definition: "Chinese era name (祥興) of the Southern Song for the years 1278–1279: 1278 is Xiangxing 1 (元年) and Xiangxing 2 is 1279."
description_md: |-
  **Xiangxing** (祥興) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1278 under Zhao Bing (帝昺). Its years are counted in lunar years: 1278 is Xiangxing 1 (元年), 1279 its last year, Xiangxing 2. A Chinese source dates a year within it as "Xiangxing 2" (祥興二年) rather than by a continuous count.

  Before: [[jingyan-era|Jingyan]].
sources:
  definition:
    - source: dila-time-authority
