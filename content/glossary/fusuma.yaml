public_id: 105455
name: fusuma
names:
  - lang: ja
    role: original
    text: "{襖|ふすま}"
  - lang: en
    role: translation
    text: sliding door
category: architecture
definition: Opaque sliding panels of paper over a wooden frame that divide the rooms of a Japanese house, often painted.
description_md: |-
  vertical rectangular panels that slide from side to side to redefine spaces within a room or act as doors; typically 90 cm wide, 180 cm tall, 2–3 cm thick; made of a wooden lattice and a layer of paper or cloth on both sides
  [[fusuma-e]]
