definition: "Chinese era name (咸豐) of the Qing for the years 1851–1861: 1851 is Xianfeng 1 (元年) and Xianfeng 11 is 1861."
description_md: |-
  **Xianfeng** (咸豐) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1851. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Xianfeng Emperor. Its years are counted in lunar years: 1851 is Xianfeng 1 (元年), 1861 its last year, Xianfeng 11. A Chinese source dates a year within it as "Xianfeng 2" (咸豐二年) rather than by a continuous count.

  Before: [[daoguang-era|Daoguang]]. After: [[tongzhi-era|Tongzhi]].
