name: Preah Thong
names: [Kaundinya]
category: mythology and legend
definition: In the Khmer founding myth, the foreign prince (Kaundinya) who married the naga princess Neang Neak and founded Funan, the first kingdom of Cambodia.
description_md: |-
  Preah Thong, also known as Kaundinya, was a prince from a faraway land who arrived on the coast of what is now Cambodia. There he met a naga princess, [[neang-neak]]. After a clash, the two fell in love and married. Their marriage founded Funan, the first kingdom of Cambodia, and the Khmer people trace their origins back to the couple. A huge 21-metre copper statue of the pair was completed in 2022, facing the sea.

  *From:* Cambodian founding myth · Khmer
