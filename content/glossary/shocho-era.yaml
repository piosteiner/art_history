definition: "Japanese era name (正長) for the years 1428–1429: 1428 is Shōchō 1 (元年) and Shōchō 2 is 1429."
description_md: |-
  **Shōchō** (正長) is a Japanese era name ([[nengo]]), proclaimed in 1428. Its years are counted in lunar years from the new year before the proclamation: 1428 is Shōchō 1 (元年), 1429 its last year, Shōchō 2. A Japanese source dates a year within it as "Shōchō 2" (正長2年) rather than by a continuous count.

  Before: [[oei-era|Ōei]]. After: [[eikyo-era|Eikyō]].
