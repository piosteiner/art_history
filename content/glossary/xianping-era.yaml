name: Xianping
names:
  - lang: zh
    role: original
    text: 咸平
category: calendar
parent: chinese-calendar
definition: "Chinese era name (咸平) of the Northern Song for the years 998–1004: 998 is Xianping 1 (元年) and Xianping 7 is 1004."
description_md: |-
  **Xianping** (咸平) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 998 under Emperor Zhenzong (真宗). Its years are counted in lunar years: 998 is Xianping 1 (元年), 1004 its last year, Xianping 7. A Chinese source dates a year within it as "Xianping 2" (咸平二年) rather than by a continuous count.

  Before: [[zhidao-era|Zhidao]]. After: [[jingde-era|Jingde]].
sources:
