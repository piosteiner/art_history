category: calendar
definition: "Japanese era name (文久) for the years 1861–1864: 1861 is Bunkyū 1 (元年) and Bunkyū 4 is 1864."
description_md: |-
  **Bunkyū** (文久) is a Japanese era name ([[nengo]]), proclaimed in 1861. Its years are counted in lunar years from the new year before the proclamation: 1861 is Bunkyū 1 (元年), 1864 its last year, Bunkyū 4. A Japanese source dates a year within it as "Bunkyū 2" (文久2年) rather than by a continuous count.

  Before: [[manen-era|Man'en]]. After: [[genji-era|Genji]].
