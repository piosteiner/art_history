definition: In Greek myth the three goddesses of charm, beauty and joy, Aglaea, Euphrosyne and Thalia, companions of Aphrodite.
description_md: |-
  Goddesses of charm, beauty and joy, companions of [[aphrodite]]: Aglaea, Euphrosyne and Thalia.

  **In art:** Three nude or lightly draped women embracing in a circle, often with the middle one facing away.

  **Famous works**

  - Botticelli, *Primavera* (Uffizi, Florence) — [[artwork/primavera]]
  - [[artist/raphael]], *The Three Graces* (Chantilly)
  - Rubens, *The Three Graces* (Prado) — [[artwork/the-three-graces]]
  - Canova, *The Three Graces*

  *From:* Greek mythology · Ancient Greek
