name: Triton
category: iconography
definition: Greek god, messenger of the sea
description_md: |-
  Triton is the son of [[poseidon]], a merman who calms or stirs the sea by blowing a conch shell.

  **In art:** A merman blowing a shell.

  **Famous works**

  - Bernini, *Triton Fountain* (Piazza Barberini, Rome)

  *From:* Greek mythology · Ancient Greek
