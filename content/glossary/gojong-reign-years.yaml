definition: "The reign years of Gojong of the Korean Empire (高宗, 고종), by which Korean sources date 1864–1895: 1864 is Gojong 1, 1895 Gojong 32."
description_md: |-
  **Gojong** (高宗, 고종): the years of the reign of [[person/gojong-of-korea|Gojong of the Korean Empire]] of Joseon, who came to the throne on 8 December 1863. Korean sources count years by the reigning king ([[korean-reign-years]]): 1873 is Gojong 10 (고종 10년). His first year is 1864, the year after his accession; the rest of 1863 still counts for his predecessor.

  Before: [[cheoljong-reign-years|Cheoljong]]. After: [[geonyang-era|Geonyang]].
