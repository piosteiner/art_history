public_id: 113355
name: Nulji Maripgan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 눌지마립간
  - lang: ko-Hani
    role: alternative
    text: 訥祇麻立干
category: calendar
definition: "The reign years of Nulji Maripgan of Silla (訥祇麻立干, 눌지마립간), by which Korean histories date 417–458: 417 is Nulji Maripgan 1, 458 Nulji Maripgan 42."
description_md: |-
  **Nulji Maripgan** (訥祇麻立干, 눌지마립간): the years of the reign of Nulji Maripgan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 426 is Nulji Maripgan 10 (눌지마립간 10년). The year of the accession, 417, counts as the first year.

  Before: [[silseong-isageum-silla-reign-years|Silseong Isageum]]. After: [[jabi-maripgan-silla-reign-years|Jabi Maripgan]].
sources:
  definition:
    - source: dila-time-authority
