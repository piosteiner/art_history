name: Till Eulenspiegel
names: [Tyl Uilenspiegel]
category: mythology and legend
definition: The great prankster of German and Flemish folklore, who played tricks by taking people's words literally.
description_md: |-
  Till Eulenspiegel (German) is, in the chapbook first printed c. 1510–1512, a joker of the 14th century who played tricks on everyone by taking their words literally. Charles De Coster's 1867 novel made him a Flemish freedom fighter against Spanish rule.

  *From:* German chapbook (16th century) · German, Flemish
