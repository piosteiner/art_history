name: Callisto
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, a nymph of Diana seduced by Jupiter, banished when found pregnant, turned into a bear and then into the constellation of the Great Bear.
description_md: |-
  Callisto, one of [[artemis|Diana]]'s nymphs, whom [[zeus|Jupiter]] seduced. When Diana discovered she was pregnant, she banished her, and Callisto was turned into a bear and finally into the constellation of the Great Bear.

  **In art:** Diana and her nymphs startled at their bath, with a pregnant nymph being exposed.

  **Famous works**

  - [[artist/titian]], *Diana and Callisto* (National Gallery, London and Scottish National Gallery)

  *From:* Ovid, Metamorphoses · Ancient Greek
