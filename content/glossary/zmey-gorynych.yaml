name: Zmey Gorynych
category: mythology and legend
definition: "The most famous Russian dragon: three-headed and fire-breathing, a kidnapper of maidens defeated above all by Dobrynya Nikitich."
description_md: |-
  Zmey Gorynych, whose name means something like "dragon, son of the mountain", is the most famous Russian dragon: many-headed (often three), fire-breathing and evil. He kidnaps maidens and is defeated by brave heroes, most famously [[dobrynya-nikitich]]. Some researchers see the Russian dragons as personifications of foreign invaders.

  *From:* byliny and fairy tales · Russian
