definition: '"Long poem" (長歌): a waka of 5-7 phrases repeated at least twice and closing 5-7-7 — the shortest in the Man’yōshū (no. 802, by Yamanoue no Okura) runs 5-7 5-7 5-7 5-7-7. The form vanished soon after the beginning of the Heian period.'
