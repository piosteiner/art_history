public_id: 113072
name: Zhengsheng
names:
  - lang: zh
    role: original
    text: 證聖
category: calendar
definition: "Chinese era name (證聖) of the Zhou of Empress Wu for the years 694–695: 694 is Zhengsheng 1 (元年) and Zhengsheng 2 is 695."
description_md: |-
  **Zhengsheng** (證聖) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 694 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 694 is Zhengsheng 1 (元年), 695 its last year, Zhengsheng 2. A Chinese source dates a year within it as "Zhengsheng 2" (證聖二年) rather than by a continuous count.

  Before: [[yanzai-era|Yanzai]]. After: [[tiance-wansui-era|Tiance Wansui]].
sources:
  definition:
    - source: dila-time-authority
