definition: "Japanese era name (昌泰) for the years 898–900: 898 is Shōtai 1 (元年) and Shōtai 3 is 900."
description_md: |-
  **Shōtai** (昌泰) is a Japanese era name ([[nengo]]), proclaimed in 898. Its years are counted in lunar years from the new year before the proclamation: 898 is Shōtai 1 (元年), 900 its last year, Shōtai 3. A Japanese source dates a year within it as "Shōtai 2" (昌泰2年) rather than by a continuous count.

  Before: [[kanpyo-era|Kanpyō]]. After: [[engi-era|Engi]].
