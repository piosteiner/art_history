public_id: 131445
name: Iele
category: mythology and legend
definition: In Romanian folklore, dangerous fairy women who dance in circles in clearings at night; whoever sees them or steps into their circle goes mad or is crippled.
description_md: |-
  Beautiful women who dance in circles in clearings at night, often naked under their loose hair, with bells on their ankles. Anyone who sees them, or steps into the circle, goes mad or is crippled. Their real names are secret, so people call them nicknames like "the Beautiful Ones".

  *From:* Romanian folklore · Romanian
