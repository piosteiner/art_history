name: David of Sasun
names: [David of Sassoun]
category: mythology and legend
definition: The hero of the Armenian national epic Daredevils of Sasun, who freed Sasun from the tyrant Msra Melik with his magic horse and the Lightning Sword.
description_md: |-
  David was so strong that as a boy he killed wild animals when he was sent to herd them. With his magic horse Kurkik Jalali and the Lightning Sword, he freed Sasun from the tyrant Msra Melik of Egypt. He split the tyrant in half with one stroke, right through the stone he was hiding under.

  *From:* Daredevils of Sasun · Armenian
