definition: In Greek myth the god of love and desire, in later tradition the son of Aphrodite (in Hesiod one of the first primordial gods); the Romans called him Cupid or Amor.
description_md: |-
  God of love and desire, in later tradition son of [[aphrodite]] (in Hesiod a primordial god).

  **In art:** A winged boy or youth with bow and arrows, sometimes blindfolded ("love is blind"). Many small winged boys are *putti* or *amorini*.

  **Famous works**

  - [[artist/caravaggio]], *Amor Vincit Omnia* (Berlin)
  - Canova, *Psyche Revived by Cupid's Kiss* (Louvre)
  - [[artist/bronzino]], *Venus, Cupid, Folly and Time* (National Gallery, London)

  *From:* Greek mythology · Ancient Greek
