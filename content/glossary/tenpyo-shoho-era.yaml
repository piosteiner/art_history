name: Tenpyō-shōhō
names:
  - lang: ja
    role: original
    text: 天平勝宝
category: calendar
definition: "Japanese era name (天平勝宝) for the years 749–756: 749 is Tenpyō-shōhō 1 (元年) and Tenpyō-shōhō 8 is 756."
description_md: |-
  **Tenpyō-shōhō** (天平勝宝) is a Japanese era name ([[nengo]]), proclaimed in 749. Its years are counted in lunar years from the new year before the proclamation: 749 is Tenpyō-shōhō 1 (元年), 756 its last year, Tenpyō-shōhō 8. A Japanese source dates a year within it as "Tenpyō-shōhō 2" (天平勝宝2年) rather than by a continuous count.

  Before: Tenpyō-kanpō. After: [[tenpyo-hoji-era|Tenpyō-hōji]].
