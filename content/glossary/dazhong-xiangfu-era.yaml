name: Dazhong Xiangfu
names:
  - lang: zh
    role: original
    text: 大中祥符
category: calendar
parent: chinese-calendar
definition: "Chinese era name (大中祥符) of the Northern Song for the years 1008–1016: 1008 is Dazhong Xiangfu 1 (元年) and Dazhong Xiangfu 9 is 1016."
description_md: |-
  **Dazhong Xiangfu** (大中祥符) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1008 under Emperor Zhenzong (真宗). Its years are counted in lunar years: 1008 is Dazhong Xiangfu 1 (元年), 1016 its last year, Dazhong Xiangfu 9. A Chinese source dates a year within it as "Dazhong Xiangfu 2" (大中祥符二年) rather than by a continuous count.

  Before: [[jingde-era|Jingde]]. After: [[tianxi-era|Tianxi]].
sources:
  definition:
