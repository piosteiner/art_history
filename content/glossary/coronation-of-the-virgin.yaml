name: Coronation of the Virgin
category: iconography
definition: Mary crowned Queen of Heaven by Christ, from later tradition, not the Bible.
description_md: |-
  She is crowned Queen of Heaven by Christ (the Coronation). These come from tradition, not the Bible.

  **In art:** Mary kneeling as Christ places a crown on her head.

  **Famous works**

  - [[artist/fra-angelico]], *Coronation of the Virgin* (Louvre)
  - [[artist/diego-velazquez]], *Coronation of the Virgin* (Prado)

  *From:* Christian tradition · Christian
