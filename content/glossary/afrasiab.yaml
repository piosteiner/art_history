name: Afrasiab
category: mythology and legend
definition: In the Persian Shahnameh, the cunning king of Turan and Persia's great enemy for generations, slayer of the prince Siyavash.
description_md: |-
  Afrasiab ruled Turan and waged war against Persia for generations. He is ruthless and clever, a powerful sorcerer in some traditions, and famously escapes again and again. His worst deed was killing the innocent prince Siyavash, which led to decades more of war. In the end, he was found hiding in a cave and finally put to death by Kay Khosrow (the Avesta places his death near the lake Chichast).

  *From:* Shahnameh · Persian
