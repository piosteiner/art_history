name: Scheherazade
category: mythology and legend
definition: The storyteller of One Thousand and One Nights, who saved her life by telling the king a story each night and stopping at its most exciting point.
description_md: |-
  A king, betrayed by his first wife, began marrying a new bride every day and executing her the next morning. Scheherazade volunteered to marry him. Each night she told him a story, but stopped at the most exciting part, so he had to keep her alive to hear the ending. She kept this up for a thousand and one nights, until the king, won over by her wisdom (in some versions after she has borne him children), spared her and gave up his cruelty. Later editions of her tales include Sinbad (an originally independent cycle) and [[aladdin]] and [[ali-baba]], which were added by Antoine Galland in the 18th century and are not in the Arabic manuscripts.

  *From:* One Thousand and One Nights · Persian and Arabic
