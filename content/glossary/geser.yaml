name: Geser
names: [Gesar, King Gesar of Ling]
category: mythology and legend
definition: The hero-king of the Gesar epic, told by Mongols, Tibetans, Buryats and others since at least the 12th century — the longest epic in the world — sent down from heaven to destroy demons and tyrants.
description_md: |-
  Geser (Gesar) is the hero of an epic dating back to roughly the 12th century and told by Mongols, Tibetans, Buryats and others. The Chinese collection of its Tibetan versions fills about 120 volumes with more than a million verses, and some regard it as the longest epic in the world. Geser is sent down from heaven as a scruffy, mocked boy, reveals his true power, and becomes a king who travels across the world destroying demons and tyrants.

  *From:* Epic of King Gesar · Mongol / Tibetan / Buryat
