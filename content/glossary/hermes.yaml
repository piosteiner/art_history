definition: In Greek myth the messenger of the gods, god of travellers, trade, thieves and cunning, and guide of souls to the Underworld; the Romans called him Mercury.
description_md: |-
  Messenger of the gods, god of travellers, trade, thieves and cunning, and guide of souls to the Underworld.

  **In art:** A youth with a winged hat (*petasos*), winged sandals, and the *caduceus*, a staff wound with two snakes.

  **Famous works**

  - Praxiteles (attributed), *Hermes and the Infant Dionysus* (Olympia) — [[artwork/hermes-and-the-infant-dionysus]]
  - Giambologna, *Flying Mercury* (Bargello, Florence)
  - Botticelli, *Primavera* (Mercury at the left; Uffizi, Florence) — [[artwork/primavera]]

  *From:* Greek mythology · Ancient Greek
