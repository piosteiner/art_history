name: Cyparissus
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the youth loved by Apollo who grieved so much for his accidentally killed pet stag that he was turned into a cypress, the tree of mourning.
description_md: |-
  A youth loved by [[apollo]]. Cyparissus accidentally killed his beloved pet stag and grieved so much that he was turned into a cypress tree, the tree of mourning.

  **In art:** A boy weeping over a dead stag.

  *From:* Ovid, Metamorphoses · Ancient Greek
