public_id: 113277
name: Daemusin of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 대무신왕
  - lang: ko-Hani
    role: alternative
    text: 大武神王
category: calendar
parent: korean-calendar
definition: "The reign years of King Daemusin of Goguryeo (大武神王, 대무신왕), by which Korean histories date 18–44: 18 is Daemusin 1, 44 Daemusin 27."
description_md: |-
  **Daemusin** (大武神王, 대무신왕): the years of the reign of King Daemusin of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 27 is Daemusin 10 (대무신왕 10년). The year of the accession, 18, counts as the first year.

  Before: [[yurimyeong-goguryeo-reign-years|Yurimyeong]]. After: [[minjung-goguryeo-reign-years|Minjung]].
sources:
  definition:
    - source: dila-time-authority
