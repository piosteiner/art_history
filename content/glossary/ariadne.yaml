name: Ariadne
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the Cretan princess who gave Theseus the thread that led him out of the Labyrinth, was abandoned by him on Naxos and married Dionysus.
description_md: |-
  Princess of Crete, daughter of King Minos. She gave [[theseus]] the ball of thread that led him out of the Labyrinth, ran away with him, and was abandoned asleep on the island of Naxos. [[dionysus]] found her there, married her, and threw her crown into the sky, where it became the constellation Corona Borealis.

  **In art:** A woman sleeping or grieving on a shore while a ship sails away, or meeting Bacchus and his wild procession, often with a crown of stars.

  **Famous works**

  - [[artist/titian]], *Bacchus and Ariadne* (National Gallery, London)
  - *Sleeping Ariadne* (Vatican Museums)
  - [[artist/annibale-carracci]], *The Triumph of Bacchus and Ariadne* (Palazzo Farnese)
  - [[artist/giorgio-de-chirico]], *Ariadne* series

  *From:* Greek mythology; Ovid, Metamorphoses · Ancient Greek
