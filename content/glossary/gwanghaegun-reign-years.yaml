definition: "The reign years of King Gwanghaegun of Joseon (光海君, 광해군), by which Korean sources date 1609–1622: 1609 is Gwanghaegun 1, 1622 Gwanghaegun 14."
description_md: |-
  **Gwanghaegun** (光海君, 광해군): the years of the reign of King Gwanghaegun of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1618 is Gwanghaegun 10 (광해군 10년). The year of the accession, 1609, counts as the first year.

  Before: [[seonjo-reign-years|Seonjo]]. After: [[injo-reign-years|Injo]].
