name: La Belle Dame sans Merci
category: mythology and legend
also_in: [iconography]
definition: The beautiful, wild fairy woman of John Keats's poem (1819), who enchants a knight and leaves him alone and palely loitering on a cold hillside.
description_md: |-
  From John Keats's poem (1819): a knight meets a beautiful, wild fairy woman in the meadows, who enchants him and leaves him alone and palely loitering on a cold hillside.

  **In art:** A knight on horseback leaning towards a mysterious woman with long hair, who winds it around him.

  **Famous works**

  - Frank Dicksee, *La Belle Dame sans Merci* (1901/02; Bristol Museum & Art Gallery)
  - John William Waterhouse, *La Belle Dame sans Merci* (1893; Hessisches Landesmuseum, Darmstadt)

  *From:* John Keats, La Belle Dame sans Merci · English
