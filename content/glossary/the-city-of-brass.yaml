public_id: 131346
name: The City of Brass
category: mythology and legend
definition: In the Nights, a dead city of brass in the desert, found by an expedition seeking King Solomon's jars of jinn, its people perfectly preserved.
description_md: |-
  An expedition looking for the jars where King [[person/solomon]] imprisoned the jinn found a city of brass whose gates could not be seen from outside. Everyone inside was dead and perfectly preserved, including a queen on a raised couch whose eyes looked alive because quicksilver had been set under them. Written warnings about the vanity of wealth covered the walls.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
