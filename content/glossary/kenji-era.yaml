category: calendar
definition: "Japanese era name (建治) for the years 1275–1277: 1275 is Kenji 1 (元年) and Kenji 3 is 1277."
description_md: |-
  **Kenji** (建治) is a Japanese era name ([[nengo]]), proclaimed in 1275. Its years are counted in lunar years from the new year before the proclamation: 1275 is Kenji 1 (元年), 1277 its last year, Kenji 3. A Japanese source dates a year within it as "Kenji 2" (建治2年) rather than by a continuous count.

  Before: [[bunei-era|Bun'ei]]. After: [[koan-era-1278|Kōan]].
