name: Olwen
category: mythology and legend
definition: The daughter of the giant Ysbaddaden in the Welsh tale Culhwch and Olwen, whose footsteps made white flowers grow; Culhwch had to complete impossible tasks to marry her.
description_md: |-
  To marry Olwen, whose footsteps made white flowers grow, [[culhwch]] had to complete about forty impossible tasks for her giant father Ysbaddaden. These included hunting the magical boar Twrch Trwyth. [[king-arthur|Arthur]] and his warriors helped him.

  *From:* Culhwch and Olwen (Mabinogion) · Welsh
