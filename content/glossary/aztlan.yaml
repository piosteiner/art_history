name: Aztlán
category: mythology and legend
definition: The legendary northern homeland of the Mexica (Aztecs), who wandered until they saw an eagle on a cactus eating a snake and founded Tenochtitlan there in 1325.
description_md: |-
  The Mexica left Aztlán, a place in the north, and wandered for generations. They'd been told to settle where they saw an eagle perched on a prickly pear cactus, eating a snake. They saw it on an island in Lake Texcoco and founded Tenochtitlan, today Mexico City, in 1325. The scene is on Mexico's flag.

  *From:* Aztec migration legend · Aztec (Mexica)
