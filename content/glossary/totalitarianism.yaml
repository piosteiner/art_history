public_id: 116821
name: totalitarianism
category: politics
definition: A form of government that permits no individual freedom and seeks to subordinate every aspect of life to the state.
description_md: |-
  From the Latin *totus*: the system tending to totality. The term was coined in 1923 by the Italian politician and journalist Giovanni Amendola for Mussolini's politics. Unlike an authoritarian regime or a dictatorship, a totalitarian state controls almost every aspect of public and private life [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 2]]. [[person/hannah-arendt|Hannah Arendt]] (1951) named its three marks — ideology, organisation, terror — and counted only Nazism and Stalinism as totalitarian: Mussolini "contented himself with dictatorship and one-party rule" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 3–4]] [[source/arendt-2024]]. Totalitarian art, after Golomstock, is less a style than a cultural phenomenon: art as a weapon of propaganda, the state's monopoly over artistic life, and the choice of the most conservative, most readable of the existing movements [[source/golomstock-1990]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 7, 10]].

  ## The term

  The seminar contrasted the nineteenth century as "the century of revolutions" with the twentieth as "the century of totalitarianisms" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 2]]. Arendt's *The Origins of Totalitarianism* consists of three parts — Antisemitism, Imperialism, Totalitarianism — and calls totalitarianism "a novel form of government, that differs essentially from other forms of political oppression known to us such as despotism, tyranny, and dictatorship"; such movements "are possible wherever there are masses who for one reason or another have acquired the appetite for political organization" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 3–4]]. Fascist ideologues themselves used the word: they gave "absolute primacy" to "national collectivity as organised by the totalitarian state" (Emilio Gentile) [[source/antliff-2002|p. 149]], and their thrust towards the future entailed "an integral and totalitarian conception of politics" that "could not distinguish itself from ethics, religion or any other conception of life" [[source/dagnino-2016|p. 139]]. George Mosse described totalitarianism as a "secular religion" drawing on traditional rites and popular customs in the worship of the nation [[source/braun-2000|p. 3]].

  ## Art and the totalitarian state

  Golomstock saw in the art of the USSR, Nazi Germany and Fascist Italy identical aesthetic conceptions and the same brand of official art; in the mirror of art the systems "betrayed their true likeness and reached a near-absolute identity of style" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 42]]. In his model the foundations of totalitarian art are laid with those of the one-party state: art is declared an ideological weapon, the state monopolises artistic life, builds an apparatus to control it, chooses the most conservative movement as official and wages war on all others [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]]. The process differed in speed: gradual in Russia, astonishingly quick in Germany after 1933, while in Italy it "stretched out over two decades and was never fully completed" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]]. The seminar therefore asked whether Fascism was an "imperfect totalitarianism" or a "strategic artistic pluralism" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]].

  Emily Braun asks whether the avant-garde ideal of merging art and life did not reach its "sinister conclusion" in totalitarianism, in the aestheticisation of politics and daily existence; citing Boris Groys, for whom "reality itself became the material for artistic construction", she notes that in Italy the avant-garde wish to shape the masses by aesthetic means developed "in perfect synchrony with the experiment in totalitarian politics", and that Mussolini called himself an artist and politics an art [[source/braun-2000|p. 7]]. Fascism's attempt to create a [[term/new-man|New Man]] was described by Mussolini in 1926 as a ten-year project; it failed, "like all the other totalitarian experiments espoused by the regime" [[source/dagnino-2016|p. 139]] [[source/dagnino-2016|p. 147]].
