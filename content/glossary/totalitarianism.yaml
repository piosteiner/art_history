name: totalitarianism
category: politics
definition: A form of government that permits no individual freedom and seeks to subordinate every aspect of life to the state.
description_md: "From the Latin *totus*: the system tending to totality. The term was coined in 1923 by the Italian politician and journalist Giovanni Amendola for Mussolini's politics. Unlike an authoritarian regime or a dictatorship, a totalitarian state controls almost every aspect of public and private life [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 2]]. [[person/hannah-arendt]] (1951) named its three marks — ideology, organisation, terror — and counted only Nazism and Stalinism as totalitarian: Mussolini \"contented himself with dictatorship and one-party rule\" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 3–4]] [[source/arendt-2024]]. Totalitarian art, after Golomstock, is less a style than a cultural phenomenon: art as a weapon of propaganda, the state's monopoly over artistic life, and the choice of the most conservative, most readable of the existing movements [[source/golomstock-1990]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 7, 10]]."
