definition: "Japanese era name (延長) for the years 923–930: 923 is Enchō 1 (元年) and Enchō 8 is 930."
description_md: |-
  **Enchō** (延長) is a Japanese era name ([[nengo]]), proclaimed in 923. Its years are counted in lunar years from the new year before the proclamation: 923 is Enchō 1 (元年), 930 its last year, Enchō 8. A Japanese source dates a year within it as "Enchō 2" (延長2年) rather than by a continuous count.

  Before: [[engi-era|Engi]]. After: [[johei-era|Jōhei]].
