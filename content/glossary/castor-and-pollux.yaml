definition: In Greek myth twin brothers, one mortal and one immortal, sons of Leda, who became the constellation Gemini.
description_md: |-
  Twin brothers, one mortal and one immortal, sons of [[leda]]. When Castor died, Pollux shared his immortality with him, and they became the constellation Gemini.

  **In art:** Two young horsemen, often with stars over their heads.

  **Famous works**

  - *The Dioscuri* (Horse Tamers), Piazza del Quirinale (Rome)
  - Rubens, *The Rape of the Daughters of Leucippus* (Alte Pinakothek, Munich)

  *From:* Greek mythology · Ancient Greek
