public_id: 131457
name: Amirani
category: mythology and legend
definition: A giant hero of Georgian legend, often called the Georgian Prometheus, chained to a mountain in the Caucasus for challenging God.
description_md: |-
  A giant hero, son of a goddess of the hunt, who fought dragons and devils. He challenged God himself, so he was chained to a mountain in the Caucasus, where a winged dog licks his chains to wear them thin; every time they are about to break, blacksmiths strike their anvils and the chains grow strong again.

  *From:* Georgian folklore · Georgian
