definition: A region of Greece imagined as an idyllic land of shepherds living in harmony with nature, an image of a lost golden age; "Et in Arcadia ego" means death exists even in paradise.
description_md: |-
  Arcadia was a region of Greece imagined as an idyllic land of shepherds living in harmony with nature, an image of a lost golden age. *Et in Arcadia ego* ("Even in Arcadia, I am here", spoken by Death; also read as "I too was in Arcadia") means that death exists even in paradise.

  **In art:** Shepherds in a peaceful landscape, sometimes gathering around a tomb with that inscription.

  **Famous works**

  - [[artist/nicolas-poussin]], *Et in Arcadia ego* (The Arcadian Shepherds, 1637–1638, Louvre, Paris; earlier version c. 1627, Chatsworth)
  - [[artist/guercino]], *Et in Arcadia ego* (c. 1618–1622, Galleria Nazionale d'Arte Antica, Rome)

  *From:* European (classical)
