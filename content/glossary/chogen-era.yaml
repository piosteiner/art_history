category: calendar
definition: "Japanese era name (長元) for the years 1028–1036: 1028 is Chōgen 1 (元年) and Chōgen 9 is 1036."
description_md: |-
  **Chōgen** (長元) is a Japanese era name ([[nengo]]), proclaimed in 1028. Its years are counted in lunar years from the new year before the proclamation: 1028 is Chōgen 1 (元年), 1036 its last year, Chōgen 9. A Japanese source dates a year within it as "Chōgen 2" (長元2年) rather than by a continuous count.

  Before: Manju. After: Chōryaku.
