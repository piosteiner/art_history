public_id: 113013
name: Yuanfeng
names:
  - lang: zh
    role: original
    text: 元豐
category: calendar
definition: "Chinese era name (元豐) of the Northern Song for the years 1078–1085: 1078 is Yuanfeng 1 (元年) and Yuanfeng 8 is 1085."
description_md: |-
  **Yuanfeng** (元豐) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1078 under Emperor Shenzong (神宗). Its years are counted in lunar years: 1078 is Yuanfeng 1 (元年), 1085 its last year, Yuanfeng 8. A Chinese source dates a year within it as "Yuanfeng 2" (元豐二年) rather than by a continuous count.

  Before: [[xining-era|Xining]]. After: [[yuanyou-era|Yuanyou]].
sources:
  definition:
