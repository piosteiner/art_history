name: Vertumnus
category: mythology and legend
also_in: [iconography]
definition: The Roman god of the seasons and change, who won the nymph Pomona in the disguise of an old woman telling stories of love.
description_md: |-
  [[pomona]] was a nymph of fruit trees and gardens who refused all suitors. Vertumnus, god of the seasons and change, visited her in many disguises and finally won her as an old woman, telling stories of love.

  **In art:** An old woman talking to a young woman in an orchard, often with fruit and a pruning knife.

  **Famous works**

  - Giuseppe Arcimboldo, *Vertumnus* (portrait of Emperor Rudolf II made of fruit and vegetables, Skokloster Castle, Sweden)
  - Pontormo, *Vertumnus and Pomona* (lunette fresco, Villa Medici at Poggio a Caiano)

  *From:* Ovid, Metamorphoses · Ancient Roman
