definition: Eight legendary Daoist figures who achieved immortality, a hugely popular subject in Chinese painting, ceramics and textiles, each recognised by an attribute.
description_md: |-
  Eight legendary Daoist figures who achieved immortality, a hugely popular subject in paintings, ceramics and textiles. They often cross the sea together, each using their own magic.

  **In art:** Each has an attribute. Lü Dongbin: a sword on his back and a fly whisk. Li Tieguai: a beggar with an iron crutch and a gourd. Zhongli Quan: a large fan and a bare belly. Zhang Guolao: an old man riding a donkey backwards. He Xiangu: the only woman, holding a lotus. Lan Caihe: a flower basket. Han Xiangzi: a flute. Cao Guojiu: castanets and court robes.

  **Famous works**

  - *Eight Immortals Crossing the Sea* (a common theme in Ming and Qing porcelain and painting)
  - *Yongle Palace murals* (Shanxi, Yuan dynasty)

  **Held sacred today:** Some of these figures are still honoured in Daoist and folk religion.

  *From:* Chinese (Daoist)
