name: Dangun
names: [Dangun Wanggeom]
category: mythology and legend
definition: Dangun Wanggeom, son of the heavenly prince Hwanung and the bear-woman Ungnyeo, the legendary founder of Gojoseon, the first Korean kingdom, in 2333 BC according to tradition.
description_md: |-
  Dangun Wanggeom was the son of Hwanung and [[ungnyeo]]. In 2333 BC, according to tradition, he founded Gojoseon, the first Korean kingdom. The story is still celebrated every year on National Foundation Day, and Koreans like to say their nation began with patience and transformation rather than conquest.

  *From:* Dangun founding myth (Samguk yusa) · Korean
