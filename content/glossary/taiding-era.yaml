name: Taiding
names:
  - lang: zh
    role: original
    text: 泰定
category: calendar
parent: chinese-calendar
definition: "Chinese era name (泰定) of the Yuan for the years 1324–1327: 1324 is Taiding 1 (元年) and Taiding 4 is 1327."
description_md: |-
  **Taiding** (泰定) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1324 under Yesün Temür (泰定帝). Its years are counted in lunar years: 1324 is Taiding 1 (元年), 1327 its last year, Taiding 4. A Chinese source dates a year within it as "Taiding 2" (泰定二年) rather than by a continuous count.

  Before: [[zhizhi-era|Zhizhi]]. After: [[zhihe-era-1328|Zhihe]].
sources:
