public_id: 107519
name: tonseisha
names:
  - lang: ja
    role: original
    text: "{遁世者|とんせいしゃ}"
category: other
definition: Men who took nominal monastic vows to escape the class system, without joining a temple, and served the Ashikaga as artists and advisers.
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 171, 228
