public_id: 113321
name: Myeongjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 명종
  - lang: ko-Hani
    role: alternative
    text: 明宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Myeongjong of Goryeo (明宗, 명종), by which Korean histories date 1171–1197: 1171 is Myeongjong 1, 1197 Myeongjong 27."
description_md: |-
  **Myeongjong** (明宗, 명종): the years of the reign of King Myeongjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1180 is Myeongjong 10 (명종 10년). The year of the accession, 1171, counts as the first year.

  Before: [[uijong-goryeo-reign-years|Uijong]]. After: [[sinjong-goryeo-reign-years|Sinjong]].
sources:
  definition:
    - source: dila-time-authority
