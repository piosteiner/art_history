name: Lam-ang
names: [Lam-Ang]
category: mythology and legend
definition: The hero of the Ilocano epic Biag ni Lam-ang from the Philippines, who spoke at birth, avenged his father, and was brought back to life after being swallowed by a giant fish.
description_md: |-
  Lam-ang is the hero of an Ilokano epic from the Philippines. He could speak the moment he was born and named himself. Still a boy, he set out to avenge his father, who had been killed by enemies in the mountains, and defeated them single-handed. Later he was swallowed by a giant fish. His wife, Ines Kannoyan, had his bones recovered from the sea, and with the help of his magical pets, a hen (a rooster in many retellings) and a dog, he was brought back to life.

  *From:* Biag ni Lam-ang (Ilocano epic) · Ilocano (Philippines)
