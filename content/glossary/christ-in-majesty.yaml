public_id: 132193
name: Christ in Majesty
names: [Majestas Domini]
category: iconography
definition: The image, most typical of Romanesque art, of Christ enthroned, often in an almond-shaped halo (mandorla), surrounded by the four evangelist symbols.
description_md: |-
  Romanesque art shows Christ in Majesty, enthroned, often inside an almond-shaped halo (*mandorla*), surrounded by the four evangelist symbols.

  **In art:** Christ enthroned in a mandorla, surrounded by the four evangelist symbols.

  **Famous works**

  - Romanesque tympanum of the south portal, Abbey of Saint-Pierre, Moissac (Christ in Majesty with the four evangelist symbols and the 24 elders)

  *From:* Christian iconography · Christian
