name: Antaeus
category: mythology and legend
definition: In Greek myth, a giant of Libya who drew his strength from the earth, killed every wrestling challenger and was defeated by Heracles, who held him aloft.
description_md: |-
  Antaeus was a giant of ancient Libya who challenged every traveller to a wrestling match and killed them all, building a temple to his father [[poseidon]] with their skulls. His secret was that he drew his strength from the earth: every time he was thrown to the ground, he rose stronger. [[heracles]] finally beat him by lifting him into the air and holding him there and crushing him.

  *From:* Greek mythology · Ancient Greek (Libya)
