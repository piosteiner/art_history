name: Handyong
category: mythology and legend
definition: A hero of Ibalong, the epic of the Bikol region of the Philippines, who cleared the land of monsters and then brought law, farming and order to his people.
description_md: |-
  Handyong is one of the heroes of *Ibalong*, an epic from the Bikol region of the Philippines, alongside Baltog and Bantong. Coming to a land overrun by monsters, Handyong and his warriors cleared it of giant beasts, one-eyed creatures and serpents. Afterwards, he became a lawgiver and brought farming and order to his people.

  *From:* Ibalong (Bikol epic) · Bikol (Philippines)
