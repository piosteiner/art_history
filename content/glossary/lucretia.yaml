name: Lucretia
category: mythology and legend
also_in: [iconography]
definition: The virtuous Roman noblewoman raped by Sextus Tarquinius, whose suicide led to the overthrow of the kings and the founding of the Republic.
description_md: |-
  A virtuous Roman noblewoman raped by Sextus Tarquinius, the son of the tyrant king. She told her family what happened and then killed herself with a dagger. Her death led [[lucius-junius-brutus|Brutus]] to overthrow the kings and found the Roman Republic.

  **In art:** A woman stabbing herself with a dagger, often half-dressed, or the attack by Tarquin.

  **Famous works**

  - [[artist/rembrandt]], *Lucretia* (Minneapolis and Washington)
  - [[artist/titian]], *Tarquin and Lucretia* (Cambridge)
  - [[artist/artemisia-gentileschi]], *Lucretia*
  - [[artist/lucas-cranach-the-elder]], several versions

  *From:* Livy, History of Rome · Ancient Roman
