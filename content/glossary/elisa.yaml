name: Elisa
names: [The Wild Swans]
category: mythology and legend
definition: In Andersen's fairy tale The Wild Swans (1838), a princess who knits shirts of nettles in silence to free her eleven brothers from a swan curse.
description_md: |-
  Andersen's version of the Six Swans. Elisa had to knit shirts from stinging nettles from a graveyard, in total silence, to free her eleven brothers. She was about to be burnt as a witch when the swans came down. She threw the shirts over them, and the youngest kept one swan's wing.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
