    text: 宣和
category: calendar
parent: chinese-calendar
definition: "Chinese era name (宣和) of the Northern Song for the years 1119–1125: 1119 is Xuanhe 1 (元年) and Xuanhe 7 is 1125."
description_md: |-
  **Xuanhe** (宣和) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1119 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1119 is Xuanhe 1 (元年), 1125 its last year, Xuanhe 7. A Chinese source dates a year within it as "Xuanhe 2" (宣和二年) rather than by a continuous count. Emperor Qinzong (欽宗), who came to the throne at the end of its last year (25 January 1126), kept it until the new year: 1126 is Jingkang 1.

  Before: [[chonghe-era|Chonghe]]. After: [[jingkang-era|Jingkang]].
