public_id: 131141
name: Gráinne
category: mythology and legend
definition: The woman promised to the aged Fionn mac Cumhaill who laid a geis (a binding obligation) on Diarmuid at the betrothal feast to make him run away with her; stone tombs across Ireland are called "Diarmuid and Gráinne's beds".
description_md: |-
  Gráinne was promised to the aged Fionn, but at the wedding feast, she placed a geis (a binding obligation) on the young warrior [[diarmuid]], who in oral versions has a love spot on his forehead, to make him run away with her. Fionn hunted them across Ireland for years. Stone tombs across the country are still called "Diarmuid and Gráinne's beds".

  *From:* Fenian Cycle (The Pursuit of Diarmuid and Gráinne) · Irish
