category: calendar
definition: "Japanese era name (養老) for the years 717–723: 717 is Yōrō 1 (元年) and Yōrō 7 is 723."
description_md: |-
  **Yōrō** (養老) is a Japanese era name ([[nengo]]), proclaimed in 717. Its years are counted in lunar years from the new year before the proclamation: 717 is Yōrō 1 (元年), 723 its last year, Yōrō 7. A Japanese source dates a year within it as "Yōrō 2" (養老2年) rather than by a continuous count.

  Before: [[reiki-era|Reiki]]. After: [[jinki-era|Jinki]].
