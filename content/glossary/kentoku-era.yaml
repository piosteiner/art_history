definition: "Japanese era name (建徳) for the years 1370–1372 of the Southern Court: 1370 is Kentoku 1 (元年) and Kentoku 3 is 1372."
description_md: |-
  **Kentoku** (建徳) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras, proclaimed in 1370. Its years are counted in lunar years from the new year before the proclamation: 1370 is Kentoku 1 (元年), 1372 its last year, Kentoku 3. A Japanese source dates a year within it as "Kentoku 2" (建徳2年) rather than by a continuous count.

  Before: [[shohei-era|Shōhei]]. After: [[bunchu-era|Bunchū]].
