name: Enki
names: [Ea]
category: mythology and legend
definition: The Mesopotamian god of fresh water, magic, wisdom and crafts (later Ea), the trickster-helper and friend of humankind who warned Utnapishtim of the flood.
description_md: |-
  Enki (later Ea) was the Mesopotamian god of fresh water, magic, wisdom and crafts. He's often the trickster-helper among the gods: when the other gods decided to destroy humanity with a flood, Enki found a clever way to warn [[utnapishtim]] without technically breaking his oath. He was seen as the friend of humankind.

  *From:* Mesopotamian religion · Mesopotamian (Sumerian)
