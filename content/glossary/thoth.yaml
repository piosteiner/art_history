name: Thoth
category: mythology and legend
definition: The ibis-headed Egyptian god of the Moon, wisdom, writing, magic and judgement, held to have invented hieroglyphs; he recorded the weighing of the heart.
description_md: |-
  Thoth was the Egyptian god of the Moon, wisdom, knowledge, time, writing, science, magic and judgement. He was usually shown as a man with the head of an ibis, or as a baboon. Egyptians believed he invented hieroglyphs and kept the records of the gods. In the underworld, he wrote down the result when each dead person's heart was weighed. His wife was [[maat]] (in some accounts Seshat).

  *From:* Egyptian religion · Ancient Egyptian
