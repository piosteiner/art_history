definition: "Japanese era name (嘉暦) for the years 1326–1329: 1326 is Karyaku 1 (元年) and Karyaku 4 is 1329."
description_md: |-
  **Karyaku** (嘉暦) is a Japanese era name ([[nengo]]), proclaimed in 1326. Its years are counted in lunar years from the new year before the proclamation: 1326 is Karyaku 1 (元年), 1329 its last year, Karyaku 4. A Japanese source dates a year within it as "Karyaku 2" (嘉暦2年) rather than by a continuous count.

  Before: [[shochu-era|Shōchū]]. After: [[gentoku-era|Gentoku]].
