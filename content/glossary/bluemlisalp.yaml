name: Blüemlisalp
category: mythology and legend
definition: The legend of the Blüemlisalp in the Bernese Oberland, once the lushest alpine pasture, buried under ice and rock by the curse of a mother whom her rich, arrogant herdsman son turned away.
description_md: |-
  The Blüemlisalp in the Bernese Oberland was once said to be the lushest, most fertile alpine pasture of all, and its herdsman grew rich and arrogant. He spoiled his lover, his cow and his dog, and even paved the path to his hut with cheese. When his poor old mother climbed up to ask for help, he turned her away and gave her spoiled milk. She cursed the alp, and it was buried under ice and rock. Today it's a glacier-covered mountain massif.

  *From:* Alpine legend · Swiss (Bernese Oberland)
