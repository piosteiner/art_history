public_id: 130936
name: Baba Yaga
category: mythology and legend
definition: The forest witch of Slavic fairy tales who lives in a hut on chicken legs and flies in a mortar; sometimes a cannibal, sometimes a dangerous helper who tests heroes.
description_md: |-
  Baba Yaga lives deep in the forest in a hut that stands on giant chicken legs and turns to face whoever approaches. She flies through the air in a mortar, steering with a pestle, and her fence is topped with glowing skulls. She can be a cannibal witch or a wise, if dangerous, helper who tests heroes. Some interpreters see her as a gatekeeper between the world of the living and the world of the dead.

  *From:* Slavic fairy tales · Russian and Slavic
