public_id: 131117
name: The Devil's Bridge
names: [Teufelsbrücke, Teufelsstein]
category: mythology and legend
definition: The legend of the bridge over the Reuss in the Schöllenen Gorge, Uri, built by the Devil for the soul of the first to cross; the locals sent a goat, and the boulder he meant to smash it with, the Teufelsstein, lies near Göschenen.
description_md: |-
  In the Schöllenen Gorge in Uri, the people couldn't build a bridge across the wild Reuss river, so they made a deal with the Devil. He would build it in exchange for the soul of the first creature to cross. When it was finished, the clever locals sent a goat across first (a dog in Scheuchzer's account of 1716). Furious, the Devil picked up a giant boulder to smash the bridge, but an old woman scratched a cross on it, and he dropped it (in Scheuchzer's account a holy man scolded him into dropping it). That boulder, the *Teufelsstein*, can still be seen near Göschenen.

  *From:* Alpine legend · Swiss (Uri)
