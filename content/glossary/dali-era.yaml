name: Dali
names:
  - lang: zh
    role: original
    text: 大曆
category: calendar
definition: "Chinese era name (大曆) of the Tang for the years 766–780: 766 is Dali 1 (元年) and Dali 15 is 780."
description_md: |-
  **Dali** (大曆) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 766 under Emperor Daizong (代宗). Its years are counted in lunar years: 766 is Dali 1 (元年), 780 its last year, Dali 15. A Chinese source dates a year within it as "Dali 2" (大曆二年) rather than by a continuous count.

  Before: [[yongtai-era|Yongtai]]. After: [[jianzhong-era|Jianzhong]].
sources:
  definition:
    - source: dila-time-authority
