definition: In Greek myth the goddess of wisdom, strategic warfare and crafts, born fully armed from Zeus's head and patron of Athens; the Romans called her Minerva.
description_md: |-
  Goddess of wisdom, strategic warfare and crafts, born fully armed from [[zeus]]'s head. Patron of Athens.

  **In art:** Helmet, spear and shield, the *aegis* (a goatskin cloak with [[medusa]]'s head on it), and an owl, her bird of wisdom.

  **Famous works**

  - Phidias, *Athena Parthenos* (lost, known from copies)
  - Botticelli, *Pallas and the Centaur* (Uffizi, Florence)
  - Klimt, *Pallas Athene* (Wien Museum, Vienna)
  - Velázquez, *Las Hilanderas* (The Fable of Arachne; Prado, Madrid) — [[artwork/las-hilanderas]]

  *From:* Greek mythology · Ancient Greek
