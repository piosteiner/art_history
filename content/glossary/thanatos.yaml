name: Thanatos
names: [Mors]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the personification of death, twin brother of Hypnos (Sleep); the Romans called him Mors.
description_md: |-
  The twin brothers Sleep and Death.

  **In art:** Winged youths or bearded men (as on the Euphronios krater), often carrying the body of a fallen warrior, as with Sarpedon at Troy. Thanatos may hold an upside-down torch.

  **Famous works**

  - Euphronios (painter) and Euxitheos (potter), *Sarpedon Krater* (Euphronios krater; Museo Nazionale Archeologico Cerite, Cerveteri)
  - John William Waterhouse, *Sleep and His Half-brother Death*

  *From:* Greek mythology · Ancient Greek
