definition: '"Linked poem" (連歌): collaborative poetry in which several poets add stanzas of 5-7-5 and 7-7 on in turn, each linked to the one before. In the medieval period it was the main form of court verse — chains could grow to a thousand stanzas — and spread to poet-monks and the samurai; the shogun Ashikaga Yoshimitsu gathered the greatest renga poets of his day at his Kinkakuji retreat.'
