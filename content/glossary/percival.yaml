definition: The naive young knight of Arthurian legend, raised in the forest, who failed to ask the right question at the Grail Castle and spent years seeking it again.
description_md: |-
  Percival (Parzival) was a naive young knight raised in the forest, who failed to ask the right question at the Grail Castle and spent years seeking it again.

  **Famous works**

  - August Spiess, *Parzival murals* (Singers' Hall, Neuschwanstein Castle, 1883/84)

  *From:* Wolfram von Eschenbach, Parzival · British and German (Arthurian legend)
