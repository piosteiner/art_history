public_id: 113047
name: Zhenguan
names:
  - lang: zh
    role: original
    text: 貞觀
category: calendar
definition: "Chinese era name (貞觀) of the Tang for the years 627–649: 627 is Zhenguan 1 (元年) and Zhenguan 23 is 649."
description_md: |-
  **Zhenguan** (貞觀) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 627 under Emperor Taizong (太宗). Its years are counted in lunar years: 627 is Zhenguan 1 (元年), 649 its last year, Zhenguan 23. A Chinese source dates a year within it as "Zhenguan 2" (貞觀二年) rather than by a continuous count.

  Before: [[wude-era|Wude]]. After: [[yonghui-era|Yonghui]].
sources:
  definition:
    - source: dila-time-authority
