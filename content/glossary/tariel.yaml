public_id: 131459
name: Tariel
category: mythology and legend
definition: The hero of Shota Rustaveli's Georgian epic The Knight in the Panther's Skin, a warrior in a panther's skin mourning his lost love Nestan-Darejan.
description_md: |-
  The knight Avtandil and King Rostevan came upon a mysterious warrior wearing a panther's skin, weeping by a river. It was Tariel, mourning the loss of the beautiful princess [[nestan-darejan]], who had been kidnapped and imprisoned in a fortress. With his friends, he rescued her.

  *From:* Shota Rustaveli, The Knight in the Panther's Skin · Georgian
