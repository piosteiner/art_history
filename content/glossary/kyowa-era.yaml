category: calendar
definition: "Japanese era name (享和) for the years 1801–1804: 1801 is Kyōwa 1 (元年) and Kyōwa 4 is 1804."
description_md: |-
  **Kyōwa** (享和) is a Japanese era name ([[nengo]]), proclaimed in 1801. Its years are counted in lunar years from the new year before the proclamation: 1801 is Kyōwa 1 (元年), 1804 its last year, Kyōwa 4. A Japanese source dates a year within it as "Kyōwa 2" (享和2年) rather than by a continuous count.

  Before: [[kansei-era|Kansei]]. After: [[bunka-era|Bunka]].
