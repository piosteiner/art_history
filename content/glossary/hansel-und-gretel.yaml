name: Hänsel und Gretel
names: [Hansel and Gretel]
category: mythology and legend
definition: The Grimms' fairy tale of a brother and sister, left in the forest, who outwit a witch living in a house of bread, cake and sugar.
description_md: |-
  Left in the forest by their parents, they found a house made of bread, cake and sugar. The witch who lived there wanted to fatten and eat Hänsel, but Gretel pushed her into her own oven.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
