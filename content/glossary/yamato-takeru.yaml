public_id: 131678
name: Yamato Takeru
category: religion
definition: A legendary Japanese prince and warrior who turned a grass fire back on his enemies with the sword Kusanagi ("Grass-Cutter").
description_md: |-
  Yamato Takeru was a legendary prince and warrior. In his most famous adventure, enemies trapped him on a grassy plain and set it on fire. He used the sword Kusanagi to cut away the grass around him and turn the fire back on them, and the sword came to be called "Grass-Cutter". When he died, his soul was said to fly away as a great white bird.

  **Held sacred today:** He is enshrined and honoured as a *kami* at shrines in Japan.

  *From:* Kojiki, Nihon shoki · Japanese
