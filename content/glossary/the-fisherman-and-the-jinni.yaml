public_id: 131332
name: The Fisherman and the Jinni
category: mythology and legend
definition: A tale of the Nights in which a poor fisherman frees a jinni from a jar and tricks him back inside.
description_md: |-
  The jinni had been trapped for so long that he'd sworn to kill whoever freed him. The fisherman told him he didn't believe such a huge jinni could fit into such a small jar. When the jinni went back inside to prove it, the fisherman slammed the lid shut.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
