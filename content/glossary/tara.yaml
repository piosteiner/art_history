definition: A female bodhisattva or Buddha of compassion, especially important in Tibetan Buddhism; Green Tara protects from danger, White Tara grants long life.
description_md: |-
  A female bodhisattva or Buddha of compassion, especially important in Tibetan Buddhism. According to legend, she was born from a tear of Avalokiteshvara. Green Tara protects from danger; White Tara grants long life.

  **In art:** A graceful seated woman, green or white, with one leg extended ready to step down and help, holding lotus flowers. White Tara has extra eyes on her forehead, palms and soles.

  **Famous works**

  - *Green Tara* (Nepalese gilt copper, Metropolitan Museum and elsewhere)
  - *Tibetan thangka paintings*

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist (Tibetan)
