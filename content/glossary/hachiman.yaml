name: Hachiman
names:
  - lang: ja
    role: original
    text: "{八幡|はちまん}"
category: iconography
definition: The Shinto god of war, held to be the deified Emperor Ōjin; protector of Tōdaiji and, through the Theory of Origin and Manifestation, a bodhisattva — so also shown as a monk.
