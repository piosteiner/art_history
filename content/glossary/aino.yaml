public_id: 131184
name: Aino
category: mythology and legend
definition: The young girl of the Finnish Kalevala promised by her brother Joukahainen to the old Väinämöinen, who walked into the sea rather than marry him and became a fish.
description_md: |-
  Her brother [[joukahainen]] lost a singing duel to [[vainamoinen]] and promised his sister to the old hero to save himself. Aino didn't want to marry him, so she walked into the sea, drowned, and became a fish. When Väinämöinen caught her, she slipped back into the water, laughing at him.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
