name: Isokelekel
category: mythology and legend
definition: The hero of Pohnpeian tradition who came from across the sea with 333 followers and overthrew the Saudeleur dynasty of Nan Madol.
description_md: |-
  According to legend, Nan Madol, a city of huge basalt blocks built on artificial islands, was made by two sorcerer brothers, Olisihpa and Olosohpa, who flew the stones there by magic. Olosohpa became the first Saudeleur; his later, tyrannical descendants were overthrown by the hero Isokelekel, who came from across the sea with 333 followers.

  *From:* Pohnpeian tradition · Pohnpeian
