definition: The twin sons of Mars and a Vestal Virgin, suckled by a she-wolf, who founded Rome; Romulus killed Remus over its walls.
description_md: |-
  Twin sons of the god [[ares|Mars]] and a Vestal Virgin, abandoned in a basket on the river Tiber. A she-wolf found and suckled them, and a shepherd raised them. They grew up to found Rome, but argued over its walls, and Romulus killed Remus.

  **In art:** Two babies feeding from a she-wolf, or a shepherd discovering them.

  **Famous works**

  - *Capitoline Wolf* (Capitoline Museums; the twins were added in the Renaissance)
  - Rubens, *Romulus and Remus* (Pinacoteca Capitolina, Capitoline Museums) — [[artwork/rubens-romulus-und-remus]]

  *From:* Livy, History of Rome · Ancient Roman
