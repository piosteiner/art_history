name: Ascension of Jesus
names: [The Ascension]
category: iconography
definition: Christ rising into heaven forty days after the Resurrection.
description_md: |-
  Forty days after the Resurrection, Christ rises into heaven (the Ascension).

  **In art:** Christ rising into the clouds, sometimes with only his feet visible at the top of the picture.

  **Famous works**

  - [[artist/giotto]], *The Ascension* (Scrovegni Chapel)

  *From:* New Testament, Gospels · Christian
