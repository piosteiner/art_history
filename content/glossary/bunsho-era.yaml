definition: "Japanese era name (文正) for the years 1466–1467: 1466 is Bunshō 1 (元年) and Bunshō 2 is 1467."
description_md: |-
  **Bunshō** (文正) is a Japanese era name ([[nengo]]), proclaimed in 1466. Its years are counted in lunar years from the new year before the proclamation: 1466 is Bunshō 1 (元年), 1467 its last year, Bunshō 2. A Japanese source dates a year within it as "Bunshō 2" (文正2年) rather than by a continuous count.

  Before: [[kansho-era|Kanshō]]. After: [[onin-era|Ōnin]].
