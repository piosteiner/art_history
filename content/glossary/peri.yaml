name: Peri
names: [Pari]
category: mythology and legend
definition: In Persian legend, beautiful winged spirits (pari), at first dangerous and enchanting, later imagined as fairy-like fallen beings seeking to return to paradise.
description_md: |-
  Peris (also Pari) are graceful, winged beings of Persian legend. In older belief they were dangerous, enchanting spirits. Later they became more like fairies or fallen angels, banished from paradise and trying to earn their way back. The name is still a popular girl's name in Iran.

  *From:* Persian legend · Persian
