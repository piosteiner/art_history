description_md: "Yew (*Taxus baccata*) has been verified in only one early medieval sculpture, the core of the reliquary statue of [[artwork/sainte-foy-conques|Sainte Foy]] in Conques, which makes it apparently unique in early European sculpture.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] The wood is ill suited to carving: yew trunks are comparatively narrow, often hollow with age and grow unevenly; the wood is hard, tough and toxic; and because it was in high demand for weapons, above all archers' bows, the slow-growing tree became scarce.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] The Conques core consists of three pieces of yew, nailed and dowelled together and only roughly shaped with a rasp.[[source/endemann-2020-wood-carving-and-staffering|p. 152]]"
