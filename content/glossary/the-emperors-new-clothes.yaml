public_id: 131366
name: The Emperor's New Clothes
category: mythology and legend
definition: Andersen's fairy tale (1837) of a vain emperor tricked by swindlers into parading naked in cloth said to be invisible to the stupid.
description_md: |-
  Two swindlers claimed to weave cloth that was invisible to anyone stupid. Nobody dared to admit they couldn't see it, until a child shouted, "But he isn't wearing anything!"

  *From:* Hans Christian Andersen, Fairy Tales · Danish
