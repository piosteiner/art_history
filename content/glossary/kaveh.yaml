name: Kaveh
names: [Kaveh the Blacksmith]
category: mythology and legend
definition: In the Persian Shahnameh, the blacksmith who led the uprising against the tyrant Zahhak; his leather apron raised as a banner became the Derafsh Kaviani, the royal standard of Persia.
description_md: |-
  Kaveh was an ordinary blacksmith who lost his children to [[zahhak]]'s serpents. When his last son was taken, he stormed into the king's court and refused to stay silent. He raised his leather blacksmith's apron on a spear as a banner, and the people rallied behind it. That banner, later decorated with jewels, became the *Derafsh Kaviani*, the royal standard of Persia for centuries. Kaveh's uprising brought the hero [[fereydun]] to power and ended Zahhak's reign.

  *From:* Shahnameh · Persian
