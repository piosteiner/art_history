public_id: 113262
name: Guisin of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 구이신왕
  - lang: ko-Hani
    role: alternative
    text: 久尒辛王
category: calendar
definition: "The reign years of King Guisin of Baekje (久尒辛王, 구이신왕), by which Korean histories date 420–427: 420 is Guisin 1, 427 Guisin 8."
description_md: |-
  **Guisin** (久尒辛王, 구이신왕): the years of the reign of King Guisin of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 427 is Guisin 8 (구이신왕 8년). The year of the accession, 420, counts as the first year.

  Before: [[jeonji-baekje-reign-years|Jeonji]]. After: [[biyu-baekje-reign-years|Biyu]].
sources:
  definition:
    - source: dila-time-authority
