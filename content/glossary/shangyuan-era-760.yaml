public_id: 113092
name: Shangyuan
names:
  - lang: zh
    role: original
    text: 上元
category: calendar
parent: chinese-calendar
definition: "Chinese era name (上元) of the Tang for the years 760–761: 760 is Shangyuan 1 (元年) and Shangyuan 2 is 761."
description_md: |-
  **Shangyuan** (上元) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 760 under Emperor Suzong (肅宗). Its years are counted in lunar years: 760 is Shangyuan 1 (元年), 761 its last year, Shangyuan 2. A Chinese source dates a year within it as "Shangyuan 2" (上元二年) rather than by a continuous count.

  Before: [[qianyuan-era|Qianyuan]]. After: [[baoying-era|Baoying]].
sources:
  definition:
    - source: dila-time-authority
