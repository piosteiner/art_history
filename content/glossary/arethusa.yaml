public_id: 131267
name: Arethusa
category: mythology and legend
definition: In Greek myth, a nymph who, fleeing the river god Alpheus, was turned into a spring that flows under the sea to Syracuse in Sicily.
description_md: |-
  Chased by the river god Alpheus, she prayed to [[artemis]], who turned her into a stream that flowed under the sea from Greece to Sicily. The spring of Arethusa still exists in Syracuse.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
