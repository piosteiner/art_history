definition: "Japanese era name (元徳) for the years 1329–1331: 1329 is Gentoku 1 (元年) and Gentoku 3 is 1331."
description_md: |-
  **Gentoku** (元徳) is a Japanese era name ([[nengo]]), proclaimed in 1329. Its years are counted in lunar years from the new year before the proclamation: 1329 is Gentoku 1 (元年), 1331 its last year, Gentoku 3. A Japanese source dates a year within it as "Gentoku 2" (元徳2年) rather than by a continuous count.

  Before: [[karyaku-era|Karyaku]]. After: [[genko-era-1331|Genkō]].
