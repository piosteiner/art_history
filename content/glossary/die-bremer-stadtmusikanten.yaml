name: Die Bremer Stadtmusikanten
names: [The Bremen Town Musicians]
category: mythology and legend
definition: In the Grimms' fairy tale, a donkey, a dog, a cat and a rooster, too old to work, who set off to become town musicians in Bremen.
description_md: |-
  Too old to work, they ran away to Bremen. On the way, they stood on each other's backs and gave a terrible concert at the window of a robbers' house. The robbers ran away in fear, and the animals lived there happily ever after. They never even reached Bremen.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
