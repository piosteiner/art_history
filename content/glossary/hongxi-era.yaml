definition: "Chinese era name (洪熙) of the Ming for the year 1425: 1425 is Hongxi 1 (元年), its only year."
description_md: |-
  **Hongxi** (洪熙) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1425. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Hongxi Emperor. Its years are counted in lunar years: 1425 is Hongxi 1 (元年), its only year.

  Before: [[yongle-era|Yongle]]. After: [[xuande-era|Xuande]].
