definition: In Greek myth, the Phoenician princess carried across the sea to Crete by Zeus disguised as a white bull; the continent of Europe is named after her.
description_md: |-
  A Phoenician princess. Zeus disguised himself as a beautiful white bull, she climbed on his back, and he carried her across the sea to Crete. The continent of Europe is named after her.

  **In art:** A woman riding a white bull through the waves, often with cupids.

  **Famous works**

  - [[artist/titian]], *The Rape of Europa* (Isabella Stewart Gardner Museum, Boston)
  - [[artist/rembrandt]], *The Abduction of Europa* (Getty)
  - Valentin Serov, *The Rape of Europa*

  *From:* Greek mythology; Ovid, Metamorphoses · Ancient Greek (Phoenician princess)
