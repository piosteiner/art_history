name: Urashima Tarō
names: [Urashima Taro]
category: mythology and legend
definition: The fisherman of Japanese folktale who saved a turtle, spent three days at the Dragon Palace beneath the sea, and returned to find 300 years had passed; opening the forbidden box turned him into an old man.
description_md: |-
  Urashima Tarō was a young fisherman who saved a sea turtle from being tormented by children. To thank him, the turtle carried him to the Dragon Palace beneath the sea, where he spent what seemed three happy days with the princess (three years in some versions). When he wanted to go home, she gave him a box and told him never to open it. Back on land, everyone he knew was gone: 300 years had passed. In despair, he opened the box, and a puff of white smoke turned him into an old man.

  *From:* folktale · Japanese
