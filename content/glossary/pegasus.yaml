definition: In Greek myth the winged horse born from Medusa's blood and tamed by Bellerophon.
description_md: |-
  Pegasus is the winged horse born from [[medusa]]'s blood, tamed by [[bellerophon]]. The Chimera is the fire-breathing monster he killed: lion, goat and serpent in one.

  **In art:** The white winged horse, often with the Muses on Mount Helicon.

  **Famous works**

  - [[artist/odilon-redon]], *Pegasus* series

  *From:* Greek mythology · Ancient Greek
