name: Mahakala
category: religion
also_in: [iconography]
definition: A fierce protector of Tibetan Buddhism, dark and many-armed, wearing a skull crown in a ring of flames.
description_md: |-
  Tibetan art also shows fierce protectors like Mahakala, and complex cosmic diagrams (*mandalas*), sometimes made of coloured sand and destroyed when finished.

  **In art:** A dark, fierce, multi-armed protector wearing skull crowns and standing on corpses, in a ring of flames.

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Tibetan Buddhist
