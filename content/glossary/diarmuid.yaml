name: Diarmuid
names: [Diarmuid Ua Duibhne]
category: mythology and legend
definition: Diarmuid Ua Duibhne, the young warrior with a love spot on his forehead whom Gráinne bound by a geis (a binding obligation) to run away with her from the aged Fionn, who hunted them across Ireland for years.
description_md: |-
  [[grainne]] was promised to the aged Fionn, but at the wedding feast, she placed a geis (a binding obligation) on the young warrior Diarmuid, who in oral versions has a love spot on his forehead, to make him run away with her. Fionn hunted them across Ireland for years. Stone tombs across the country are still called "Diarmuid and Gráinne's beds".

  *From:* Fenian Cycle (The Pursuit of Diarmuid and Gráinne) · Irish
