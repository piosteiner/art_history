public_id: 113386
name: Jeonggang of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 정강왕
  - lang: ko-Hani
    role: alternative
    text: 定康王
category: calendar
definition: "The reign years of King Jeonggang of Silla (定康王, 정강왕), by which Korean histories date 886–887: 886 is Jeonggang 1, 887 Jeonggang 2."
description_md: |-
  **Jeonggang** (定康王, 정강왕): the years of the reign of King Jeonggang of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 887 is Jeonggang 2 (정강왕 2년). The year of the accession, 886, counts as the first year.

  Before: [[heongang-silla-reign-years|Heongang]]. After: [[jinseong-silla-reign-years|Jinseong]].
sources:
  definition:
    - source: dila-time-authority
