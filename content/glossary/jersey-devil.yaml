public_id: 131653
name: Jersey Devil
category: mythology and legend
definition: A winged creature with hooves, a goat's head, bat wings and a forked tail said to haunt the New Jersey Pine Barrens since 1735.
description_md: |-
  In 1735, according to legend, a woman called Mother Leeds, pregnant with her thirteenth child, cursed it in despair. In some versions it turned into a creature with hooves, a goat's head, bat wings and a forked tail, and it flew up the chimney into the woods.

  *From:* folklore · American (New Jersey)
