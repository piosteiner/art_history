public_id: 115900
name: jōruri play
names: [Bunraku play, puppet play]
category: literary genre
parent: play
definition: A play for the Japanese puppet theatre ([[bunraku]]), recited by a chanter (tayū) to the shamisen — the chanting and playing together are called jōruri (浄瑠璃). Its most famous playwright was Chikamatsu Monzaemon (1653–1724).
