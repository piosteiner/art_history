public_id: 113041
name: Jingding
names:
  - lang: zh
    role: original
    text: 景定
category: calendar
definition: "Chinese era name (景定) of the Southern Song for the years 1260–1264: 1260 is Jingding 1 (元年) and Jingding 5 is 1264."
description_md: |-
  **Jingding** (景定) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1260 under Emperor Lizong (理宗). Its years are counted in lunar years: 1260 is Jingding 1 (元年), 1264 its last year, Jingding 5. A Chinese source dates a year within it as "Jingding 2" (景定二年) rather than by a continuous count.

  Before: [[kaiqing-era|Kaiqing]]. After: [[xianchun-era|Xianchun]].
sources:
  definition:
    - source: dila-time-authority
