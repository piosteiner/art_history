public_id: 106668
name: Yakushi
names:
  - lang: ja
    role: original
    text: "{薬師|やくし}"
category: iconography
parent: buddha
definition: The Medicine Buddha, who heals the sick as a doctor would; often holds a medicine jar.
description_md: |-
  [[person/the-buddha]] of healing, who rules the Eastern Pure Land. In Japan, one of the earliest and most important Buddhas.

  **In art:** A seated Buddha holding a small medicine jar in his left hand, often flanked by the bodhisattvas of the sun and moon (Nikkō and Gakkō), with twelve guardian generals.

  **Famous works**

  - *Yakushi Triad* (bronze, Yakushi-ji, Nara)
  - *Twelve Heavenly Generals* (Shin-Yakushi-ji, Nara)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
