    text: ningyō jōruri
category: performing arts
definition: "Japanese puppet theatre from Osaka: puppeteers, a chanter (tayū) and shamisen players; named after the Bunrakuza of 1805."
description_md: "Japanese puppet theatre, founded in Osaka at the beginning of the 17th century: puppeteers, chanters (tayū) and shamisen players perform together; chanting and shamisen are called jōruri[[source/wikipedia-en-bunraku|“a form of traditional Japanese puppet theatre, founded in Osaka in the beginning of the 17th century” · “Three kinds of performers take part in a bunraku performance: the Ningyōtsukai or Ningyōzukai (puppeteers), the tayū (chanters), and shamisen musicians” · “The combination of chanting and shamisen playing is called jōruri”]]. Its rise came with the playwright Chikamatsu Monzaemon and the chanter Takemoto Gidayū, who opened his puppet theatre in Osaka in 1684[[source/wikipedia-en-bunraku|“It rose to popularity after the playwright Chikamatsu Monzaemon (1653–1724) began a collaboration with the chanter Takemoto Gidayu (1651–1714), who established the Takemoto puppet theater in Osaka in 1684”]]; the name comes from the Bunrakuza, the Osaka theatre of 1805[[source/wikipedia-en-bunraku|“Originally, the term bunraku referred only to the particular theater established in 1805 in Osaka, which was named the Bunrakuza”]]. A play: [[sonezaki-shinju]]."
