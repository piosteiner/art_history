public_id: 116822
name: New Man
category: politics
definition: The new human being that the totalitarian regimes set out to create — warrior, worker, member of the collective.
description_md: |-
  Mussolini announced in 1926 that within ten years the face of the nation would be "unrecognisable" and a "new Italian" created; Fascism's New Man was warrior, embodiment of authority, worker and squadrista [[source/dagnino-2016|p. 139]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 55–59]]. Éric Michaud sees the figure as a product of the war years in all of Europe — the mobilised masses and the millions of maimed men at the front — from [[artwork/masereel-debout-les-morts]] and [[artwork/leger-la-partie-de-cartes]] to [[artwork/lissitzky-new-man]] and [[artwork/worker-and-kolkhoz-woman]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, pp. 89–104]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 60–65]].

  ## In Fascist Italy

  In May 1924 Mussolini called Fascism "the greatest endeavour in our history in making Italians" — the anthropological experiment was presented as both means and end of the revolution [[source/dagnino-2016|pp. 130–131]]. Its roots lay in the war: the soldier of the trenches, wrote Giuseppe Bottai, had become a "man among men" with a "youthful masculinity" [[source/dagnino-2016|p. 135]], and in [[squadrismo]] many saw a redeeming experience [[source/dagnino-2016|p. 136]]. The New Man was to be collectively organised, a disciplined participant in the nation, realising himself in the state [[source/dagnino-2016|p. 140]]. Bottai called him an "integral man … wholly oriented towards totality" [[source/dagnino-2016|p. 141]]. After the invasion of Ethiopia (1935) and the proclamation of the Empire (1936) the project was radicalised: the new Italian was to be a soldier of a "warrior nation" [[source/dagnino-2016|pp. 142, 144]], the anti-bourgeois and racial campaigns of the late 1930s were meant to purge everything that did not fit the ideal [[source/dagnino-2016|p. 143]]. In January 1940 Mussolini admitted failure, calling the Italians "a race of sheep" [[source/dagnino-2016|p. 147]].

  Emily Braun notes that only in Italy was the avant-garde employed in shaping a Fascist "new man" throughout the regime [[source/braun-2000|p. 8]]. The seminar showed the figure as warrior in Anselmo Bucci's [[artwork/bucci-sailor-throwing-a-bomb]] (1918), as power and authority in [[artwork/sironi-italia-fra-le-arti-e-le-scienze]], and as worker in Duilio Cambellotti's [[artwork/cambellotti-la-redenzione-dell-agro]] (1934) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 56–58]].
