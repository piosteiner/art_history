public_id: 116822
name: New Man
category: politics
definition: The new human being that the totalitarian regimes set out to create — warrior, worker, member of the collective.
description_md: Mussolini announced in 1926 that within ten years the face of the nation would be "unrecognisable" and a "new Italian" created; Fascism's New Man was warrior, embodiment of authority, worker and squadrista [[source/dagnino-2016]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 55–59]]. Éric Michaud sees the figure as a product of the war years in all of Europe — the mobilised masses and the millions of maimed men at the front — from [[artwork/masereel-debout-les-morts]] and [[artwork/leger-la-partie-de-cartes]] to [[artwork/lissitzky-new-man]] and [[artwork/worker-and-kolkhoz-woman]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, pp. 89–104]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 60–65]].
