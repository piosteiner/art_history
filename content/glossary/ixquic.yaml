name: Ixquic
names: [Xquic, Blood Moon]
category: mythology and legend
definition: In the Popol Vuh, the daughter of an underworld lord who became pregnant by the skull of the twins' father and escaped to the world above — the mother of the Hero Twins.
description_md: |-
  She visited the tree where the head of the twins' father hung, and the skull spat into her hand and made her pregnant. Her father ordered owls to kill her and bring her heart, but she persuaded them to bring a lump of red tree sap instead, and escaped to the world above.

  *From:* Popol Vuh · K'iche' Maya
