public_id: 131453
name: Satanaya
category: mythology and legend
definition: The wise and powerful mother of the Narts in the Nart sagas of the Caucasus, who advised the heroes and could see the future.
description_md: |-
  The beautiful, cunning matriarch who advised the heroes and could see the future. She raised [[sosruko]] and could control the weather. Some scholars think she may be linked to the Amazon legends.

  *From:* Nart sagas · Circassian, Ossetian (Nart sagas)
