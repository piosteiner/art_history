public_id: 131180
name: Louhi
names: [Mistress of the North]
category: mythology and legend
definition: The witch queen of Pohjola, the dark North, in the Finnish Kalevala, who kept the Sampo in a copper mountain, attacked the heroes who stole it as a giant eagle, and hid the sun and moon inside a mountain.
description_md: |-
  The Mistress of the North kept the Sampo locked inside a copper mountain. When the heroes stole it, she turned into a giant eagle with warriors on her wings and attacked their ship, and the Sampo broke into pieces in the sea. She also hid the sun and moon inside a mountain.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
