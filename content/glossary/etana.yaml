name: Etana
category: mythology and legend
definition: In Mesopotamian myth, a king of Kish who, seeking the plant of birth, flew towards heaven on the back of an eagle he had rescued.
description_md: |-
  He had no son, so to find the plant of birth, he rescued an eagle from a pit, where a snake had thrown it after the eagle betrayed it. The eagle carried him up towards heaven, but Etana grew frightened and they went back down to earth; on another attempt he found the plant of birth, and his son Balih was born.

  *From:* Myth of Etana · Mesopotamian (Sumerian, Babylonian, Assyrian)
