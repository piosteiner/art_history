name: The Trojan Horse
names: [Trojan Horse, Wooden Horse]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the giant wooden horse, Odysseus's trick, in which Greek soldiers were smuggled into Troy to end the war.
description_md: |-
  [[odysseus]]'s trick that ended the war. The Greeks built a giant wooden horse, hid soldiers inside, and pretended to sail away. The Trojans dragged it into the city, and at night the soldiers crept out and opened the gates.

  **In art:** A huge wooden horse being pulled through the gates of Troy.

  **Famous works**

  - Giovanni Domenico Tiepolo, *The Procession of the Trojan Horse into Troy* (National Gallery, London)
  - *Mykonos vase* (relief pithos, Archaeological Museum of Mykonos; one of the earliest known images, about 675 BC)

  *From:* Homer, Odyssey; Virgil, Aeneid · Ancient Greek
