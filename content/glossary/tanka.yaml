definition: '"Short poem" (短歌): the waka of five lines of 5-7-5-7-7 on (syllabic units), thirty-one in all — hence also misohitomoji (三十一文字). In time the word waka came to mean the tanka alone; the name tanka was taken up again at the end of the nineteenth century.'
