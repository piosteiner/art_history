definition: traditional ideal for womanhood in East Asia
description_md: "\"Good wife, wise mother\" (良妻賢母, *ryōsai kenbo*) is an ideal of womanhood in East Asia, first formulated in Japan: Nakamura Masanao coined the phrase in a speech on 16 March 1875, and it accompanied the slogan \"wealthy country, strong army\" (*fukoku kyōhei*). [[source/wikipedia-en-good-wife-wise-mother|introduction]] The Meiji government used it to define women's role as one within the home, and from the late 1890s to 1945 it was spread by the mass media and taught in girls' schools, from 1911 in the ethics textbooks of the elementary schools. [[source/wikipedia-en-good-wife-wise-mother|§ Japan]] In the 1930s and during the Second World War the state tied it to its family-state ideology, with propaganda stressing women's duty to bear future soldiers. [[source/wikipedia-en-good-wife-wise-mother|§ Japan]] Mason describes how, during Japan's effort at empire building, women were urged as part of the war effort to tend to their families and conserve the country's resources. [[source/history-of-japanese-art|p. 370]] Under Japanese rule the ideal also reached Korea, where it mixed with Confucian and Protestant ideals of womanhood. [[source/wikipedia-en-good-wife-wise-mother|introduction]] The term was on the vocabulary list of Klaus Friese's guest lecture \"Trumpets and Textiles\", which showed a [[artwork/shufu-no-tomo-1938-10-title-page|title page of the women's magazine Shufu no Tomo]] of 1938. [[source/thomsen-2019-war-and-peace|vocabulary list, 10 May 2019 (guest lecture, Klaus Friese)]] [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]]"
