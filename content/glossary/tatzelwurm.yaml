name: Tatzelwurm
names: [Stollenwurm]
category: mythology and legend
definition: "A creature reported in the Alps for centuries: a thick lizard- or worm-like body with short legs and often a cat-like head, said to hiss, leap at people and have poisonous breath; a classic alpine cryptid."
description_md: |-
  The Tatzelwurm ("clawed worm") is a creature reported in the Alps for centuries: a thick, lizard- or worm-like body with short legs and, in many accounts, a cat-like head. It's said to hiss, leap at people and have a poisonous breath. Mountain dwellers reported sightings well into the 20th century, and it's a classic alpine cryptid.

  *From:* Alpine folklore · Alpine
