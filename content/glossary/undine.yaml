name: Undine
category: mythology and legend
also_in: [iconography]
definition: A soulless water spirit who could gain a soul only by marrying a mortal man; made famous by Fouqué's novella Undine (1811).
description_md: |-
  A water spirit with no soul, who could gain one only by marrying a mortal man. When he was unfaithful, she had to return to the water, and when he married another she took his life with a kiss. Made famous by Friedrich de la Motte Fouqué's novella *Undine* (1811), based on Paracelsus's elemental spirits.

  **In art:** A water nymph rising from a stream or embracing a knight.

  **Famous works**

  - John William Waterhouse, *Undine* (1872, whereabouts unknown)
  - Arthur Rackham, illustrations for Fouqué's *Undine* (English translation by W. L. Courtney, 1909)

  *From:* Friedrich de la Motte Fouqué, Undine · German
