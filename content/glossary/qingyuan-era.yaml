name: Qingyuan
names:
  - lang: zh
    role: original
    text: 慶元
category: calendar
parent: chinese-calendar
definition: "Chinese era name (慶元) of the Southern Song for the years 1195–1200: 1195 is Qingyuan 1 (元年) and Qingyuan 6 is 1200."
description_md: |-
  **Qingyuan** (慶元) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1195 under Emperor Ningzong (寧宗). Its years are counted in lunar years: 1195 is Qingyuan 1 (元年), 1200 its last year, Qingyuan 6. A Chinese source dates a year within it as "Qingyuan 2" (慶元二年) rather than by a continuous count.

  Before: [[shaoxi-era|Shaoxi]]. After: [[jiatai-era|Jiatai]].
sources:
  definition:
