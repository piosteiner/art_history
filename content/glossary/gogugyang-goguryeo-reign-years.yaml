public_id: 113292
name: Gogugyang of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 고국양왕
  - lang: ko-Hani
    role: alternative
    text: 故國壤王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gogugyang of Goguryeo (故國壤王, 고국양왕), by which Korean histories date 384–391: 384 is Gogugyang 1, 391 Gogugyang 8."
description_md: |-
  **Gogugyang** (故國壤王, 고국양왕): the years of the reign of King Gogugyang of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 391 is Gogugyang 8 (고국양왕 8년). The year of the accession, 384, counts as the first year.

  Before: [[sosurim-goguryeo-reign-years|Sosurim]]. After: [[gwanggaeto-goguryeo-reign-years|Gwanggaeto]].
sources:
  definition:
    - source: dila-time-authority
