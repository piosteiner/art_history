definition: "Japanese era name (建保) for the years 1213–1219: 1213 is Kempo 1 (元年) and Kempo 7 is 1219."
description_md: |-
  **Kempo** (建保) is a Japanese era name ([[nengo]]), proclaimed in 1213. Its years are counted in lunar years from the new year before the proclamation: 1213 is Kempo 1 (元年), 1219 its last year, Kempo 7. A Japanese source dates a year within it as "Kempo 2" (建保2年) rather than by a continuous count.

  Before: [[kenryaku-era|Kenryaku]]. After: [[jokyu-era|Jōkyū]].
