public_id: 106644
name: dry lacquer
names:
  - lang: ja
    role: original
    text: "{乾漆|かんしつ}"
category: technique
definition: Sculpture built up from layers of hemp or linen cloth soaked in lacquer, modelled over a core; light and durable. Introduced from China in the seventh century.
sources:
  definition:
    - source: history-of-japanese-art
      locator: p. 86
