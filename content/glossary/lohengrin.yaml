definition: The Swan Knight of German legend, Parzival's son, who arrives in a boat drawn by a swan and must never be asked his name.
description_md: |-
  Lohengrin is the Swan Knight, [[percival|Parzival]]'s son, who arrives in a boat drawn by a swan and must never be asked his name.

  **In art:** A knight in a swan boat.

  **Famous works**

  - August von Heckel, *Lohengrin murals* (Salon, Neuschwanstein Castle, 1882/83)

  *From:* Wolfram von Eschenbach, Parzival; Wagner, Lohengrin · German
