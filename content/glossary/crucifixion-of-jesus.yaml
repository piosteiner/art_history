public_id: 132144
name: Crucifixion of Jesus
names: [The Crucifixion, INRI]
category: iconography
definition: Christ nailed to the cross between two thieves under the sign INRI, with Mary, John and Mary Magdalene at its foot.
description_md: |-
  Christ is nailed to the cross between two thieves. The sign above him reads *INRI* (*Iesus Nazarenus Rex Iudaeorum*, "Jesus of Nazareth, King of the Jews"). At the foot of the cross stand his mother [[person/mary]], John the apostle and [[person/mary-magdalene]].

  **In art:** Christ on the cross, often with a skull at its base ([[adam-and-eve|Adam]]'s skull, as Golgotha means "place of the skull"), soldiers casting lots for his robe, a spear and a sponge on a pole, and the sun and moon darkened.

  **Famous works**

  - Matthias Grünewald, *Isenheim Altarpiece* (Colmar)
  - [[artist/diego-velazquez]], *Christ Crucified* (Prado)
  - [[artist/masaccio]], *Crucifixion* (Naples)
  - [[artist/salvador-dali]], *Christ of Saint John of the Cross* (Glasgow)
  - [[artist/cimabue]], *Crucifix* (Santa Croce, Florence, damaged in the 1966 flood)

  *From:* New Testament, Gospels · Christian
