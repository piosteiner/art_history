definition: "In Ovid's Metamorphoses, a married couple tested by jealousy: Cephalus killed his hidden, spying wife Procris with his never-missing spear."
description_md: |-
  A married couple whose love was tested by jealousy. Procris, suspecting her husband had a lover, hid in the bushes to spy on him while he was hunting. Hearing a rustle, Cephalus threw his never-missing spear, and killed her.

  **In art:** A dying woman in a forest with a spear in her side, a grieving hunter and his dog.

  **Famous works**

  - Piero di Cosimo, *A Satyr Mourning over a Nymph* (National Gallery, London)
  - [[artist/claude-lorrain]], *Landscape with Cephalus and Procris Reunited by Diana* (National Gallery, London)

  *From:* Ovid, Metamorphoses · Ancient Greek
