public_id: 109291
name: Seonjo (reign years)
names:
  - lang: ko
    role: original
    text: 선조
  - lang: ko-Hani
    role: alternative
    text: 宣祖
category: calendar
definition: "The reign years of Seonjo of Joseon (宣祖, 선조), by which Korean sources date 1568–1608: 1568 is Seonjo 1, 1608 Seonjo 41."
description_md: |-
  **Seonjo** (宣祖, 선조): the years of the reign of [[person/seonjo-of-joseon|Seonjo of Joseon]], who came to the throne on 13 July 1567. Korean sources count years by the reigning king ([[korean-reign-years]]): 1577 is Seonjo 10 (선조 10년). His first year is 1568, the year after his accession; the rest of 1567 still counts for his predecessor.

  Before: [[myeongjong-reign-years|Myeongjong]]. After: Gwanghaegun.
