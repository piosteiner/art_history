name: Csodaszarvas
names: [The Miraculous Stag]
category: mythology and legend
definition: The Miraculous Stag of Hungarian legend, a shining white stag that led the brothers Hunor and Magor to a new homeland.
description_md: |-
  The brothers [[hunor]] and [[magor]] chased a shining white stag across the marshes. It led them to a new land, where they carried off and married the two daughters of Dula, prince of the Alans. Their children became the Huns and the Magyars.

  *From:* Hungarian origin legend · Hungarian
