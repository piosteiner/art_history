name: Egeria
category: mythology and legend
also_in: [iconography]
definition: In Roman legend, the nymph who advised King Numa at night in a sacred grove.
description_md: |-
  The second king of Rome, Numa, was said to receive advice from the nymph Egeria, who met him at night in a sacred grove.

  **In art:** A king with a nymph in a moonlit grove by a spring.

  **Famous works**

  - [[artist/claude-lorrain]], *Landscape with Egeria Mourning over Numa* (Naples)

  *From:* Livy, History of Rome · Ancient Roman
