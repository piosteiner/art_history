name: Chiron
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the wise centaur who taught heroes like Achilles, Jason and Asclepius.
description_md: |-
  Centaurs are half horse and half man, usually wild and drunken. Chiron was the exception: a wise centaur who taught heroes like [[achilles]], [[jason]] and [[asclepius]].

  **In art:** A gentle centaur teaching a boy to play the lyre or shoot a bow.

  **Famous works**

  - *Chiron Teaching Achilles* (Herculaneum fresco, Naples)

  *From:* Greek mythology · Ancient Greek
