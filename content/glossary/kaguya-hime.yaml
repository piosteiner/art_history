definition: The heroine of Japan's oldest surviving monogatari (late 9th or early 10th century), found as a tiny girl in a glowing bamboo stalk, who turns out to be from the Moon.
description_md: |-
  The heroine of Japan's oldest surviving monogatari (late 9th or early 10th century): a bamboo cutter finds a tiny girl inside a glowing bamboo stalk. She grows into a beautiful woman and sets impossible tasks for her five noble suitors. Even the emperor courts her, but she reveals she's from the Moon and must return, and a heavenly procession comes down on a cloud to take her away.

  **In art:** A glowing bamboo stalk with a tiny girl, or a princess ascending to the Moon on a cloud with a heavenly entourage.

  **Famous works**

  - *Taketori monogatari emaki* (early 17th-century handscrolls, Chester Beatty Library, Dublin; and various Edo-period scrolls and books)
  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *One Hundred Aspects of the Moon* (print series)

  *From:* The Tale of the Bamboo Cutter · Japanese
