description_md: |-
  A Kunstschrank is a richly furnished collector's cabinet of the kind made above all in Augsburg in the late sixteenth and early seventeenth centuries. The lecture treated it as a "profane shrine": the cabinet as a Kunstkammer in miniature [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]]. As Jeffrey Chipps Smith puts it, in such cabinets "the microcosm of the Kunstkammer had been reduced still further, becoming here a world inside of a single cabinet": the viewer activates it by opening doors and drawers, searching for hidden compartments and moving the cabinet to learn how it opens, so that "the furniture can be as marvelous as the contents" [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 63]].

  ## Examples

  The best-known examples were assembled by the Augsburg art dealer and diplomat Philipp Hainhofer. The [[artwork/pommerscher-kunstschrank|Pomeranian Kunstschrank]], made from 1610 by between 24 and 28 craftsmen for Duke Philipp II of Pomerania and delivered in 1617, was a writing cabinet fitted out like a miniature cabinet of curiosities with about 200 objects, from an apothecary's set and games to astronomical instruments [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]] [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]]. Its owner Ernst Bogislaw von Croy was the first to call it a "Kunstschrank" in an inventory [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. A second cabinet by Hainhofer, made about 1625–1631 and given in 1632 to King Gustav Adolf of Sweden, survives in the Gustavianum in Uppsala ([[artwork/kunstschrank-gustav-adolf-uppsala|see there]]) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 55]]. Related cabinets shown in the lecture are an Augsburg [[artwork/augsburger-hausaltar-kabinettschrank-bnm|house-altar cabinet]] of about 1600 in Munich, an [[artwork/antwerpener-kabinettschrank-rijksmuseum|Antwerp cabinet]] of about 1650 and [[artist/pierre-gole|Pierre Gole]]'s [[artwork/gole-kabinett-rijksmuseum|cabinet]] of 1645–1650, both in Amsterdam [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 47–54]].

  ## Materials

  Such cabinets were typically veneered with ebony over a carcass of walnut, oak or softwood and decorated with silver, ivory, bone, tortoiseshell, stones, corals and paintings on copper or alabaster [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 38, 47–58]]. The lecture linked them with the colonial trade in tropical woods, ebony serving as the "wrapping" of European luxury furniture [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]].
