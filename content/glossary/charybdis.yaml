name: Charybdis
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the whirlpool monster opposite Scylla that swallowed the sea three times a day.
description_md: |-
  Two sea monsters on either side of a narrow strait. [[scylla]], in [[person/ovid]]'s version once a beautiful nymph turned into a monster by the jealous [[circe]], had six heads (later imagined as dogs) that snatched sailors from ships. Charybdis was a whirlpool that swallowed the sea three times a day. "Between Scylla and Charybdis" means choosing between two dangers.

  **In art:** A ship between a cliff and a whirlpool.

  **Famous works**

  - [[artist/henry-fuseli]], *Odysseus between Scylla and Charybdis* (Aargauer Kunsthaus, Aarau)

  *From:* Homer, Odyssey · Ancient Greek
