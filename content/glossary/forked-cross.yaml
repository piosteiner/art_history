category: object type
definition: Y-shaped cross
description_md: |-
  A forked cross (German Gabelkreuz, also Gabelkruzifix) is a Gothic type of crucifix in the shape of a Y, which arose under the influence of mysticism in the late thirteenth or early fourteenth century and is found above all in the Rhineland; the figure on it is called crucifixus dolorosus, the "suffering crucified Christ".[[source/wikipedia-de-gabelkreuz|§ introduction]]

  ## Form

  Typically the body hangs from a forked tree with the head sunk deep on the chest, the mouth distorted with pain and the eyes breaking; the arms are stretched upwards rather than sideways, the emaciated body is bent, with protruding ribs and a gaping side wound, and fingers and toes are spread and cramped.[[source/wikipedia-de-gabelkreuz|§ Beschreibung]] The fork is thought to stand for the Tree of Life; almost all such crosses are branch crosses.[[source/wikipedia-de-gabelkreuz|§ Beschreibung]][[source/wikipedia-de-gabelkreuz|§ Entstehung]] The figures, in their painted state, were so frightening that in 1306 the Bishop of London is said to have had one removed.[[source/wikipedia-de-gabelkreuz|§ Beschreibung]]

  ## Examples

  The forked crucifix of St. Maria im Kapitol in Cologne (lecture: 1304) was long held to be the oldest; it probably prompted the spread of the type in the Rhineland, where it was followed by the crosses of Bocholt, Andernach, Thorr, Lage and others.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]][[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 41, 62–68]] Strong Italian influence suggests that the first examples were imports or the work of travelling carvers.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] The term crucifixus dolorosus was introduced by Géza de Francovich; the old name "plague cross" is misleading, since the type predates the great plague.[[source/wikipedia-de-gabelkreuz|§ Entstehung]]

  The lecture presented the forked cross as "a new type of Crucifixion image: the wounded Christ" and linked it to the late medieval devotion of compassio and imitatio Christi.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 40]]
