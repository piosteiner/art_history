name: Hang Jebat
category: mythology and legend
definition: Hang Tuah's closest sworn brother in the Malay Hikayat Hang Tuah, who rebelled against the Sultan to avenge his friend's supposed execution and was killed by Hang Tuah himself.
description_md: |-
  Hang Jebat is [[hang-tuah]]'s closest sworn brother. When he believed Hang Tuah had been executed for a crime he didn't commit, he turned on the Sultan in fury and seized the palace. He was killed by Hang Tuah himself. Malaysians still argue about which of the two was the true hero: the loyal servant or the rebel who stood up against injustice.

  *From:* Hikayat Hang Tuah · Malay
