public_id: 132097
name: Nativity of Jesus
names: [The Nativity]
category: iconography
definition: The birth of Jesus in Bethlehem, laid in a manger (in a stable or, in Eastern tradition, a cave).
description_md: |-
  Jesus is born in Bethlehem and laid in a manger (by tradition in a stable), and visited by shepherds whom angels have told of his birth.

  **In art:** The baby in a manger with [[person/mary]] and [[person/saint-joseph|Joseph]], an ox and a donkey, shepherds kneeling and angels overhead.

  **Famous works**

  - [[artist/giotto]], *Nativity* (Scrovegni Chapel, Padua)
  - [[artist/hugo-van-der-goes]], *Portinari Altarpiece* (Uffizi) — [[artwork/portinari-triptych]]
  - Botticelli, *Mystic Nativity* (National Gallery, London)
  - Correggio, *Holy Night* (Dresden)

  *From:* New Testament, Gospels · Christian
