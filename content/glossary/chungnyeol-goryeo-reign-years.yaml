public_id: 113327
name: Chungnyeol of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 충렬왕
  - lang: ko-Hani
    role: alternative
    text: 忠烈王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chungnyeol of Goryeo (忠烈王, 충렬왕), by which Korean histories date 1275–1308: 1275 is Chungnyeol 1, 1308 Chungnyeol 34."
description_md: |-
  **Chungnyeol** (忠烈王, 충렬왕): the years of the reign of King Chungnyeol of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1284 is Chungnyeol 10 (충렬왕 10년). The year of the accession, 1275, counts as the first year.

  Before: [[wonjong-goryeo-reign-years|Wonjong]]. After: [[chungseon-goryeo-reign-years|Chungseon]].
sources:
