definition: "The reign years of King Gyeongjong of Joseon (景宗, 경종), by which Korean sources date 1721–1724: 1721 is Gyeongjong 1, 1724 Gyeongjong 4."
description_md: |-
  **Gyeongjong** (景宗, 경종): the years of the reign of King Gyeongjong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1724 is Gyeongjong 4 (경종 4년). The year of the accession, 1721, counts as the first year.

  Before: [[sukjong-reign-years|Sukjong]]. After: [[yeongjo-reign-years|Yeongjo]].
