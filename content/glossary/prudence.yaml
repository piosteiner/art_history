name: Prudence
category: iconography
definition: The cardinal virtue of Prudence, often shown with three faces looking to the past, present and future.
description_md: |-
  Prudence is often shown with three faces looking to the past, present and future, sometimes with three animal heads beneath (wolf, lion and dog).

  **Famous works**

  - [[artist/titian]], *Allegory of Prudence* (National Gallery, London)

