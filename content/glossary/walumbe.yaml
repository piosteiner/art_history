name: Walumbe
category: mythology and legend
definition: Death in Ganda tradition, the brother of Nambi, who followed her and Kintu to earth.
description_md: |-
  [[kintu]] lived alone with his cow until he fell in love with [[nambi]], the daughter of the sky king Gulu. Gulu gave him impossible tests: eating a huge meal, finding his own cow in a herd. Though Gulu had told them not to come back for anything, one of them went back for the forgotten millet (Kintu in Johnston's version, Nambi in others), and her brother Walumbe (Death) followed her to earth.

  *From:* Ganda tradition · Ganda (Buganda)
