public_id: 132148
name: Lamentation of Christ
names: [The Lamentation]
category: iconography
definition: The mourners grieving over the dead Christ, laid on the ground or on a stone slab.
description_md: |-
  Mary holds her dead son's body in her lap (*Pietà*, "pity"), or the mourners grieve over him (Lamentation).

  **In art:** A group weeping over a body laid on the ground or on a stone slab.

  **Famous works**

  - [[artist/giotto]], *Lamentation* (Scrovegni Chapel) — [[artwork/lamentation-giotto-scrovegni]]
  - [[artist/andrea-mantegna]], *Lamentation of Christ* (Brera, Milan, famous for its foreshortening) — [[artwork/dead-christ-mantegna]]
  - [[artist/hans-holbein-the-younger]], *The Body of the Dead Christ in the Tomb* (Basel)

  *From:* New Testament, Gospels · Christian
