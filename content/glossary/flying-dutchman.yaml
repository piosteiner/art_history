public_id: 131495
name: Flying Dutchman
category: mythology and legend
definition: A legendary ghost ship doomed to sail the seas forever and never make port; seeing it means disaster.
description_md: |-
  A Dutch captain swore he'd round the Cape of Good Hope in a storm even if it took until Judgement Day. Now he's doomed to sail the seas forever. Seeing the ship means disaster.

  *From:* maritime folklore · Dutch, maritime
