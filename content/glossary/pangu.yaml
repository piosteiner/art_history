name: Pangu
names: [Pan Gu]
category: mythology and legend
definition: The primordial giant of Chinese creation myth who grew inside a cosmic egg for 18,000 years, split it to separate sky and earth, and whose body became the world when he died.
description_md: |-
  In the beginning, there was only chaos, and from it formed a cosmic egg. Inside it, Pangu grew (accounts give 18,000 years). He woke, split the egg with his axe, and pushed the sky up and the earth down, growing taller each day to hold them apart. When he finally died, his body became the world: his breath the wind, his voice thunder, his eyes the sun and moon, his body the mountains, and his blood the rivers.

  *From:* Chinese creation myth · Chinese
