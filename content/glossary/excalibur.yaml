name: Excalibur
category: mythology and legend
also_in: [iconography]
definition: King Arthur's sword in Arthurian legend, given to him by the Lady of the Lake and thrown back into the lake as he lay dying.
description_md: |-
  The Lady of the Lake gave [[king-arthur|Arthur]] the sword Excalibur. As Arthur lay dying, he ordered the knight Bedivere (Griflet in the earlier French version) to throw it back into the lake, and an arm rose from the water to catch it.

  **In art:** A woman's arm rising from water holding a sword.

  **Famous works**

  - Aubrey Beardsley, *How Sir Bedivere Cast the Sword Excalibur into the Water* (illustration)

  *From:* Arthurian legend · British (Arthurian legend)
