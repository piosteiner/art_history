definition: In Greek myth the old king of Troy, father of Hector, Paris and Cassandra, killed at the altar by Neoptolemus when Troy fell.
description_md: |-
  The old king and queen of Troy, parents of [[hector]], Paris and [[cassandra]]. Priam was killed at the altar by [[achilles]]' son [[neoptolemus]] when Troy fell. [[hecuba]] was enslaved and, in some versions, turned into a dog.

  **In art:** An old king kneeling to kiss Achilles' hands, or murdered at the altar.

  **Famous works**

  - Jean-Baptiste Regnault, *The Death of Priam* (Musée de Picardie, Amiens)

  *From:* Homer, Iliad · Ancient Greek
