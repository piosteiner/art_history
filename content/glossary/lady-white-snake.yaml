name: Lady White Snake
names: [Bai Suzhen, Xu Xian, Fahai, Green Snake]
category: mythology and legend
also_in: [iconography]
definition: A white snake spirit who became a beautiful woman and married the scholar Xu Xian, until the monk Fahai imprisoned her beneath the Leifeng Pagoda.
description_md: |-
  A white snake spirit who turned into a beautiful woman and married a young scholar, Xu Xian. A Buddhist monk, Fahai, exposed her true form and imprisoned her beneath the Leifeng Pagoda by West Lake in Hangzhou.

  **In art:** A woman in white beside a woman in green (her companion Xiaoqing, the Green Snake), with a pagoda and a lake, or a monk confronting a giant serpent.

  **Famous works**

  - *Long Corridor paintings* (Summer Palace, Beijing)
  - *Peking opera and folk prints*

  *From:* Legend of the White Snake · Chinese
