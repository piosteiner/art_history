name: Mothman
category: mythology and legend
definition: A tall winged figure with glowing red eyes reported in Point Pleasant, West Virginia, in 1966–1967.
description_md: |-
  In 1966–1967, people in Point Pleasant, West Virginia, reported a tall, winged man with glowing red eyes. In December 1967, the Silver Bridge collapsed and 46 people died, and some people believed Mothman had come to warn them. The town now has a Mothman statue and festival.

  *From:* modern legend · American (West Virginia)
