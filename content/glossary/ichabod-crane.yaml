name: Ichabod Crane
category: mythology and legend
definition: The gangly, nervous schoolteacher of Washington Irving's The Legend of Sleepy Hollow (1820), chased by the Headless Horseman and never seen again.
description_md: |-
  In Washington Irving's *The Legend of Sleepy Hollow* (1820), the gangly schoolteacher Ichabod Crane is chased one night by the ghost of a Hessian soldier whose head was shot off by a cannonball. The horseman throws his "head" at him (possibly just a pumpkin), and Ichabod is never seen again.

  *From:* Washington Irving, The Legend of Sleepy Hollow (1820) · American
