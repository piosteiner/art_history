definition: "Japanese era name (長承) for the years 1132–1135: 1132 is Chōshō 1 (元年) and Chōshō 4 is 1135."
description_md: |-
  **Chōshō** (長承) is a Japanese era name ([[nengo]]), proclaimed in 1132. Its years are counted in lunar years from the new year before the proclamation: 1132 is Chōshō 1 (元年), 1135 its last year, Chōshō 4. A Japanese source dates a year within it as "Chōshō 2" (長承2年) rather than by a continuous count.

  Before: [[tensho-era-1131|Tenshō]]. After: [[hoen-era|Hōen]].
