public_id: 112949
name: Qianyou
names:
  - lang: zh
    role: original
    text: 乾祐
category: calendar
definition: "Chinese era name (乾祐) of the Later Han for the years 948–951: 948 is Qianyou 1 (元年) and Qianyou 4 is 951."
description_md: |-
  **Qianyou** (乾祐) is a Chinese era name ([[nianhao]]) of the Later Han, proclaimed in 948 under Emperor Gaozu (高祖). Its years are counted in lunar years: 948 is Qianyou 1 (元年), 951 its last year, Qianyou 4. A Chinese source dates a year within it as "Qianyou 2" (乾祐二年) rather than by a continuous count.

  Before: [[tianfu-era|Tianfu]].
sources:
  definition:
    - source: dila-time-authority
