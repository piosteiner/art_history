name: rakan
names:
  - lang: ja
    role: original
    text: "{羅漢|らかん}"
category: iconography
definition: "Arhats: disciples who have reached a high rank on the way to Enlightenment and are free from rebirth; revered in Zen, often in groups of sixteen."
description_md: |-
  Enlightened disciples of the Buddha, usually in groups of 16, 18 or 500, who in East Asian tradition stay in the world, awaiting the coming of Maitreya.

  **In art:** Eccentric, often strange-looking old monks with long eyebrows, sometimes taming tigers or dragons, or sitting in rocky landscapes.

  **Famous works**

  - Guanxiu, *Sixteen Arhats* (attributed, Imperial Household Agency, Japan)
  - *Yixian glazed ceramic luohan* (Liao or Jin dynasty, British Museum, Metropolitan Museum and elsewhere)
  - *Five Hundred Rakan* (Gohyaku Rakan-ji, Tokyo)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
