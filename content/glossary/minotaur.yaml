name: Minotaur
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the monster half man and half bull, son of the Cretan queen Pasiphaë and a bull, kept in the Labyrinth and killed by Theseus.
description_md: |-
  The Minotaur, half man and half bull, was the son of the Cretan queen Pasiphaë and a bull, kept in the Labyrinth. The Harpies are winged women who snatch food and people away. The Sphinx sets riddles (see [[oedipus]]). The Hydra is the many-headed serpent of Lerna. The Cyclopes are one-eyed giants who forged [[zeus]]'s thunderbolts.

  **In art:** A bull's head on a man's body.

  **Famous works**

  - [[artist/pablo-picasso]], *Minotauromachy* (etching, 1935) and *Vollard Suite*

  *From:* Greek mythology · Ancient Greek
