name: Actaeon
category: mythology and legend
also_in: [iconography]
definition: A Theban prince and hunter of Greek myth who saw the goddess Artemis bathing; she turned him into a stag, and his own hounds tore him apart.
description_md: |-
  Actaeon was a prince of Thebes and a skilled hunter trained by a centaur. In one version, he insulted the goddess [[artemis]]. In the better-known version, he stumbled upon her bathing in the forest. Either way, she cursed him and turned him into a stag. His own hunting dogs didn't recognise him, chased him down and tore him apart.

  Two famous victims of Diana. Actaeon, the hunter who saw her bathing and was turned into a stag.

  **In art:** Diana and her nymphs startled at their bath, with a man turning into a stag.

  **Famous works**

  - [[artist/titian]], *Diana and Actaeon* (National Gallery, London and Scottish National Gallery)
  - Titian, *The Death of Actaeon* (National Gallery, London)

  *From:* Greek mythology; Ovid, Metamorphoses · Ancient Greek
