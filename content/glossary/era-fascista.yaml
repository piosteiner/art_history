public_id: 116824
name: Era Fascista
category: calendar
definition: "The count of years of the Fascist regime in Italy, from the March on Rome in October 1922: year I = 1922/23."
description_md: |-
  Written in Roman numerals beside the Christian year; 1935 fell in year XIV, which is why the numerals XIV stood above Italy in [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] [[source/steiner-2025-mario-sironi|p. 5]]. The count began with Mussolini's appointment as prime minister after the [[event/march-on-rome|March on Rome]] in 1922, year I [[source/steiner-2025-mario-sironi|p. 5]].

  Roger Griffin, as summarised by Mark Antliff, describes the count as the "superimposition over the Gregorian calendar" of a Fascist time frame that marked a regenerative break with the recent past [[source/antliff-2002|p. 162]]. It was punctuated by holidays with a twofold mythic meaning: 23 March (founding of the Fasci), 21 April (founding of Rome), 24 May (Italy's entry into the First World War), 20 September (Rome joined to the Kingdom) and 28 October (the March on Rome) [[source/antliff-2002|p. 162]]. Ordinary Italians were to experience time as having a transcendent core, on a par with the time of Christianity [[source/antliff-2002|p. 162]]. The facade of the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] of 1932 bore two large X's, one for the decade since 1922 and one for the decade to 1942 [[source/wikipedia-en-exhibition-of-the-fascist-revolution|§ Event]]. The numerals XIV on Sironi's mural were painted over in 1950 and uncovered in the restoration of 2015–2017 [[source/steiner-2025-mario-sironi|pp. 10–11]].
