public_id: 116824
name: Era Fascista
category: calendar
definition: "The count of years of the Fascist regime in Italy, from the March on Rome in October 1922: year I = 1922/23."
description_md: Written in Roman numerals beside the Christian year; 1935 fell in year XIV, which is why the numerals XIV stood above Italy in [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] [[source/steiner-2025-mario-sironi|p. 5]].
