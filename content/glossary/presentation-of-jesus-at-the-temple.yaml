name: Presentation of Jesus at the Temple
names: [The Presentation in the Temple]
category: iconography
definition: Mary and Joseph bringing the baby Jesus to the Temple in Jerusalem, where Simeon recognises him as the Messiah.
description_md: |-
  Mary and [[person/saint-joseph|Joseph]] bring the baby to the Temple in Jerusalem, where the old man Simeon recognises him as the Messiah.

  **In art:** An old man holding the baby in a temple, with [[person/mary]] offering two doves.

  **Famous works**

  - [[artist/andrea-mantegna]], *Presentation at the Temple* (Berlin)
  - [[artist/rembrandt]], *Simeon's Song of Praise* (Simeon in the Temple, 1631, Mauritshuis)

  *From:* New Testament, Gospels · Christian
