public_id: 113037
name: Jiaxi
names:
  - lang: zh
    role: original
    text: 嘉熙
category: calendar
definition: "Chinese era name (嘉熙) of the Southern Song for the years 1237–1241: 1237 is Jiaxi 1 (元年) and Jiaxi 5 is 1241."
description_md: |-
  **Jiaxi** (嘉熙) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1237 under Emperor Lizong (理宗). Its years are counted in lunar years: 1237 is Jiaxi 1 (元年), 1241 its last year, Jiaxi 5. A Chinese source dates a year within it as "Jiaxi 2" (嘉熙二年) rather than by a continuous count.

  Before: [[duanping-era|Duanping]]. After: [[chunyou-era|Chunyou]].
sources:
  definition:
    - source: dila-time-authority
