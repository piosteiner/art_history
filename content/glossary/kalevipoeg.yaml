name: Kalevipoeg
category: mythology and legend
definition: The giant son of Kalev, hero of Estonia's national epic, who was killed by his own cursed sword and now guards the gates of Hell.
description_md: |-
  He threw boulders that are still scattered around Estonia, and carried boards for a city. He journeyed to the ends of the earth, and in hell defeated the Devil in a trial of strength and rescued three maidens. He was killed by his own cursed sword when he walked into a river, and he now guards the gates of Hell.

  *From:* Kalevipoeg (Kreutzwald, 1857–1861) · Estonian
