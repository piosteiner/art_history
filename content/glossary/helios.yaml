definition: In Greek myth the sun god who drives the sun chariot across the sky, later merged with Apollo.
description_md: |-
  Helios is the sun god who drives the sun chariot across the sky (later merged with [[apollo]]). His son [[phaethon]] begged to drive it, lost control, scorched the earth and was struck down by [[zeus]]'s thunderbolt.

  **In art:** A radiant crowned figure in a chariot of four horses.

  *From:* Greek mythology · Ancient Greek
