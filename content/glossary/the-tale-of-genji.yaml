definition: The court lady Murasaki Shikibu's tale of the "Shining Prince" Genji (around 1000), often called the world's first novel and illustrated for a thousand years.
description_md: |-
  Written around 1000 by the court lady [[person/murasaki-shikibu]], often called the world's first novel. It follows the life and loves of the "Shining Prince" Genji at the Heian court. Its 54 chapters were illustrated again and again over a thousand years.

  **In art:** Court scenes seen from above with the roofs removed (*fukinuki yatai*), with stylised faces drawn as "a line for the eye, a hook for the nose" (*hikime kagibana*).

  **Famous works**

  - *Genji Monogatari Emaki* (12th century, Tokugawa Art Museum, Nagoya, and Gotoh Museum, Tokyo)
  - [[artist/tawara-sotatsu|Tawaraya Sōtatsu]], *Sekiya and Miotsukushi* (screens, Seikadō Bunko)
  - Tosa Mitsuoki, *Genji album leaves*

  *From:* Murasaki Shikibu, The Tale of Genji · Japanese
