public_id: 106635
name: Amida
names:
  - lang: ja
    role: original
    text: "{阿弥陀|あみだ}"
category: iconography
parent: buddha
definition: Amitābha, the Buddha of the West, flanked by the bodhisattvas Kannon and Seishi.
description_md: |-
  The Buddha of Infinite Light, who rules the Western Pure Land, a paradise where believers can be reborn by calling his name. Central to Pure Land Buddhism in China and Japan.

  **In art:** Usually seated in meditation, or descending on clouds with his attendants to welcome the dying (*raigō* in Japan).

  **Famous works**

  - *Great Buddha of Kamakura (Kamakura Daibutsu)* (bronze, 13th century)
  - [[artist/jocho]], *Amida Buddha* (Phoenix Hall, Byōdo-in, Uji)
  - *Amida Descending over the Mountains* (Yamagoshi Amida, 13th century, Zenrin-ji, Kyoto; another version in the Kyoto National Museum)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
