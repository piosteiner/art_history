name: Scenes from the Life of the Buddha
names: [Parinirvana, Great Departure, First Sermon]
category: iconography
definition: "The most common scenes of the Buddha's life in art: his birth in the Lumbini garden, the Great Departure, the enlightenment, the First Sermon and the parinirvana."
description_md: |-
  The most common scenes: his miraculous birth from his mother Maya's side in the Lumbini garden, the Great Departure from the palace on his horse, the enlightenment under the Bodhi tree while resisting the attacks and temptations of the demon Mara, the First Sermon in the Deer Park at Sarnath, and his death and final release (*parinirvana*).

  **In art:** The *parinirvana* shows the Buddha lying on his right side, surrounded by grieving disciples and animals. A Wheel of the Law with two deer stands for the First Sermon. In early Indian art, the Buddha himself isn't shown; he's represented by symbols such as footprints, an empty throne, a parasol or the Bodhi tree (the usual reading; some scholars, following Susan Huntington, read these scenes as showing later worship at the sites instead).

  **Famous works**

  - *Sanchi Stupa gateways* (India)
  - *Ajanta Caves murals* (India)
  - *Borobudur relief panels* (Java)
  - *Gal Vihara reclining Buddha* (Polonnaruwa, Sri Lanka)
  - *Butsu Nehan-zu* (Parinirvana painting, dated 1086, Kongōbu-ji, Mount Kōya; National Treasure)

  *From:* Buddhist
