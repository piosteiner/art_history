public_id: 131605
name: Hatupatu
category: mythology and legend
definition: A young man of Māori tradition who escaped from the bird-woman Kurangaituku, hiding in a rock that opened for him.
description_md: |-
  [[kurangaituku]] was a giant woman with wings and bird claws who caught birds with her long lips. In the Te Arawa telling she captured Hatupatu and kept him in her cave. He escaped, wearing her feather cloaks, and hid inside a rock that opened for him, which you can still see. She chased him to the hot springs of Rotorua and fell into a boiling pool.

  *From:* Māori tradition · Māori
