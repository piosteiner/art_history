public_id: 113322
name: Sinjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 신종
  - lang: ko-Hani
    role: alternative
    text: 神宗
category: calendar
definition: "The reign years of King Sinjong of Goryeo (神宗, 신종), by which Korean histories date 1198–1204: 1198 is Sinjong 1, 1204 Sinjong 7."
description_md: |-
  **Sinjong** (神宗, 신종): the years of the reign of King Sinjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1204 is Sinjong 7 (신종 7년). The year of the accession, 1198, counts as the first year.

  Before: [[myeongjong-goryeo-reign-years|Myeongjong]]. After: [[huijong-goryeo-reign-years|Huijong]].
sources:
  definition:
    - source: dila-time-authority
