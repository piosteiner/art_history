public_id: 131263
name: Perdix
category: mythology and legend
definition: In Greek myth as Ovid tells it, Daedalus's clever nephew, inventor of the saw and the compass, whom Athena turned into a partridge.
description_md: |-
  As a boy, he invented the saw and the compass. [[daedalus]] was so jealous that he pushed him off the Acropolis, but [[athena]] caught him and turned him into a partridge, which is why partridges fly low and nest on the ground.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
