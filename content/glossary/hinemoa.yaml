name: Hinemoa
category: mythology and legend
definition: A Māori chief's daughter who swam across Lake Rotorua at night, guided by the sound of Tūtānekai's flute, to reach the young man she loved; one of New Zealand's best-loved love stories.
description_md: |-
  Hinemoa was a Māori chief's daughter who fell in love with Tūtānekai, a young man of illegitimate birth who lived on an island in Lake Rotorua. Her family hid the canoes so she couldn't reach him. So one night, guided by the sound of his flute across the water, she swam the 3.2 km across the lake to his island, keeping afloat with gourds tied to her body. It's one of New Zealand's best-loved love stories.

  *From:* Te Arawa tradition · Māori
