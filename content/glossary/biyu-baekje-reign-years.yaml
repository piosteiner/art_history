public_id: 113263
name: Biyu of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 비유왕
  - lang: ko-Hani
    role: alternative
    text: 毗有王
category: calendar
parent: korean-calendar
definition: "The reign years of King Biyu of Baekje (毗有王, 비유왕), by which Korean histories date 427–455: 427 is Biyu 1, 455 Biyu 29."
description_md: |-
  **Biyu** (毗有王, 비유왕): the years of the reign of King Biyu of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 436 is Biyu 10 (비유왕 10년). The year of the accession, 427, counts as the first year.

  Before: [[guisin-baekje-reign-years|Guisin]]. After: [[gaero-baekje-reign-years|Gaero]].
sources:
  definition:
    - source: dila-time-authority
