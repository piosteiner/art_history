name: Menelaus
category: mythology and legend
definition: In Greek myth the king of Sparta, Helen's husband and Agamemnon's brother.
description_md: |-
  Other Greek leaders at Troy. [[diomedes]] was so fierce that he even wounded the gods [[aphrodite]] and [[ares]], and with [[odysseus]] stole the sacred statue of [[athena]] (the *Palladium*) from Troy. [[nestor]] was the wise, talkative old king of Pylos. Menelaus, king of Sparta, was [[helen-of-troy|Helen]]'s husband and [[agamemnon]]'s brother.

  *From:* Homer, Iliad · Ancient Greek
