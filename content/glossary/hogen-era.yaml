category: calendar
definition: "Japanese era name (保元) for the years 1156–1159: 1156 is Hōgen 1 (元年) and Hōgen 4 is 1159."
description_md: |-
  **Hōgen** (保元) is a Japanese era name ([[nengo]]), proclaimed in 1156. Its years are counted in lunar years from the new year before the proclamation: 1156 is Hōgen 1 (元年), 1159 its last year, Hōgen 4. A Japanese source dates a year within it as "Hōgen 2" (保元2年) rather than by a continuous count.

  Before: [[kyuju-era|Kyūju]]. After: [[heiji-era|Heiji]].
