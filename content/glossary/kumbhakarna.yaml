name: Kumbhakarna
category: mythology and legend
definition: In the Ramayana, Ravana's giant younger brother, cursed to sleep six months at a time, who fought for his brother out of loyalty though he thought the war wrong.
description_md: |-
  Kumbhakarna was [[ravana]]'s younger brother, a giant so huge and hungry that he was said to threaten the whole world. Through a slip of the tongue when asking the gods for a blessing, he was cursed to sleep for six months at a time and, in the common retelling, wake only for one day (Wikipedia gives six months awake). When Lanka was in danger, he was woken with great effort. He told Ravana plainly that the war was wrong, but fought for his brother anyway out of loyalty, and fell on the battlefield.

  *From:* Ramayana · Indian
