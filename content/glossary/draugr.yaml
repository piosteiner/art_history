name: Draugr
category: mythology and legend
definition: "The undead of the Norse sagas: corpses that rise from their burial mounds to guard their treasure."
description_md: |-
  Corpses that rise from their burial mounds, huge, heavy and swollen, black or deathly pale, guarding their treasure and killing anyone who comes near. Glam, the revenant in Grettir's Saga, cursed Grettir to be afraid of the dark forever.

  *From:* Icelandic sagas · Norse
