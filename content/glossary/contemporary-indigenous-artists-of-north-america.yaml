name: Contemporary Indigenous artists of North America
names: [Jaune Quick-to-See Smith, Kent Monkman, Fritz Scholder, Wendy Red Star, Jeffrey Gibson]
category: art style
definition: Important Indigenous artists in North American museum collections today, among them Jaune Quick-to-See Smith, Kent Monkman, Fritz Scholder, Wendy Red Star and Jeffrey Gibson.
description_md: |-
  Some important artists in museum collections today: Jaune Quick-to-See Smith (Salish and Kootenai), Kent Monkman (Cree), Fritz Scholder (Luiseño), Wendy Red Star (Apsáalooke/Crow, photography) and Jeffrey Gibson (Mississippi Band of Choctaw and Cherokee), whose *the space in which to place me* (2024) was the first solo presentation by an Indigenous artist in the US Pavilion at the Venice Biennale.

  **Famous works**

  - Jaune Quick-to-See Smith, *Trade (Gifts for Trading Land with White People)* (1992, Chrysler Museum; retrospective Memory Map, Whitney, 2023)
  - Kent Monkman, *mistikôsiwak (Wooden Boat People)* (Welcoming the Newcomers and Resurgence of the People, Metropolitan Museum Great Hall commission, 2019)
  - Wendy Red Star, *Four Seasons* (photo series, 2006)
  - Fritz Scholder, *Super Indian No. 2* (1971, promised gift to the Denver Art Museum)
  - Jeffrey Gibson, *the space in which to place me* (US Pavilion, Venice Biennale, 2024)

  *From:* Indigenous North American
