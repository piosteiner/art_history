definition: "Chinese era name (正德) of the Ming for the years 1506–1521: 1506 is Zhengde 1 (元年) and Zhengde 16 is 1521."
description_md: |-
  **Zhengde** (正德) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1506. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Zhengde Emperor. Its years are counted in lunar years: 1506 is Zhengde 1 (元年), 1521 its last year, Zhengde 16. A Chinese source dates a year within it as "Zhengde 2" (正德二年) rather than by a continuous count.

  Before: [[hongzhi-era|Hongzhi]]. After: [[jiajing-era|Jiajing]].
