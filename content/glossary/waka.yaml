definition: 'Poetry in classical Japanese (和歌, "Japanese poem"). Up to the Man’yōshū in the eighth century the word covered several forms — tanka, chōka, sedōka and others; as the others fell out of use early in the Heian period, waka came to mean the tanka alone: thirty-one syllables in five lines (5-7-5-7-7), the basic form from which most other Japanese forms derived.'
