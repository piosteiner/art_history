name: Erlik Khan
names: [Erlik]
category: mythology and legend
definition: In Turkic and Mongol belief, the lord of the dead who rules the lowest level of the underworld, judges souls and sends sickness; rival of the creator Ulgen.
description_md: |-
  In Turkic and Mongol belief, the cosmos has layers: the bright upper world of the sky, the middle world of humans, and the dark underworld. At the lowest level of the underworld rules Erlik Khan, lord of the dead. He judges souls, sends sickness and misfortune, and is the rival of the benevolent creator [[ulgen]]. Shamans journeyed down to bargain with him for the souls of the sick.

  *From:* Turkic and Mongol belief · Turkic and Mongol
