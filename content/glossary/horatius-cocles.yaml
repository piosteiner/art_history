name: Horatius Cocles
category: mythology and legend
also_in: [iconography]
definition: The Roman who held a bridge alone against an Etruscan army while it was destroyed behind him, then, in Livy's version, swam the Tiber in full armour.
description_md: |-
  Horatius held a bridge alone against an Etruscan army while the Romans destroyed it behind him, then jumped into the Tiber in full armour and, in Livy's version, swam to safety (in Polybius he drowned).

  **In art:** A warrior defending a bridge.

  **Famous works**

  - [[artist/charles-le-brun]], *Horatius Cocles Defending the Bridge* (Dulwich)

  *From:* Livy, History of Rome · Ancient Roman
