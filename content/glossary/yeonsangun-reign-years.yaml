category: calendar
definition: "The reign years of King Yeonsangun of Joseon (燕山君, 연산군), by which Korean sources date 1496–1505: 1496 is Yeonsangun 1, 1505 Yeonsangun 10."
description_md: |-
  **Yeonsangun** (燕山君, 연산군): the years of the reign of King Yeonsangun of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1505 is Yeonsangun 10 (연산군 10년). The year of the accession, 1496, counts as the first year.

  Before: [[seongjong-reign-years|Seongjong]]. After: [[jungjong-reign-years|Jungjong]].
