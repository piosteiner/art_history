public_id: 113284
name: Sansang of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 산상왕
  - lang: ko-Hani
    role: alternative
    text: 山上王
category: calendar
definition: "The reign years of King Sansang of Goguryeo (山上王, 산상왕), by which Korean histories date 197–227: 197 is Sansang 1, 227 Sansang 31."
description_md: |-
  **Sansang** (山上王, 산상왕): the years of the reign of King Sansang of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 206 is Sansang 10 (산상왕 10년). The year of the accession, 197, counts as the first year.

  Before: [[gogukcheon-goguryeo-reign-years|Gogukcheon]]. After: [[dongcheon-goguryeo-reign-years|Dongcheon]].
sources:
  definition:
    - source: dila-time-authority
