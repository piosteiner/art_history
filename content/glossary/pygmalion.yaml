definition: In Ovid's Metamorphoses, the sculptor of Cyprus who fell in love with his own statue of a woman, which Venus brought to life.
description_md: |-
  A sculptor in Cyprus who carved a statue of a woman so beautiful that he fell in love with it. [[aphrodite|Venus]] answered his prayers and brought it to life. (The name "Galatea" was added much later.)

  **In art:** A sculptor embracing a statue whose marble is turning into living flesh.

  **Famous works**

  - Jean-Léon Gérôme, *Pygmalion and Galatea* (Metropolitan Museum)
  - [[artist/edward-burne-jones]], *Pygmalion and the Image* series (Birmingham Museum and Art Gallery)

  *From:* Ovid, Metamorphoses · Ancient Greek
