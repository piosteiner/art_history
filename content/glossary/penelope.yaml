name: Penelope
category: mythology and legend
also_in: [iconography]
definition: In Greek myth Odysseus's faithful wife, who, in his twenty-year absence, held off the suitors for three years by weaving a shroud by day and unpicking it at night.
description_md: |-
  [[odysseus]]'s faithful wife. During his twenty-year absence she held off the suitors, for three years, by promising to choose one when she had finished weaving a shroud, then secretly unpicked it every night.

  **In art:** A woman at a loom, waiting, often with the old dog [[argos]] or her son [[telemachus]].

  **Famous works**

  - Pinturicchio, *Penelope with the Suitors* (National Gallery, London)
  - Waterhouse, *Penelope and the Suitors* (Aberdeen Art Gallery)

  *From:* Homer, Odyssey · Ancient Greek
