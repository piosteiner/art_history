public_id: 131374
name: The Tinderbox
category: mythology and legend
definition: In Andersen's fairy tale (1835), a magic tinderbox that calls up three giant dogs who do whatever the soldier who owns it wants.
description_md: |-
  A witch asked a soldier to fetch an old tinderbox from inside a hollow tree, guarded by three dogs. One had eyes as big as teacups, one as big as millwheels, and one as big as a round tower. When he struck the tinderbox, the dogs appeared and did whatever he wanted.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
