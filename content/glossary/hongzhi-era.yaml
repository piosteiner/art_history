definition: "Chinese era name (弘治) of the Ming for the years 1488–1505: 1488 is Hongzhi 1 (元年) and Hongzhi 18 is 1505."
description_md: |-
  **Hongzhi** (弘治) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1488. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Hongzhi Emperor. Its years are counted in lunar years: 1488 is Hongzhi 1 (元年), 1505 its last year, Hongzhi 18. A Chinese source dates a year within it as "Hongzhi 2" (弘治二年) rather than by a continuous count.

  Before: [[chenghua-era|Chenghua]]. After: [[zhengde-era|Zhengde]].
