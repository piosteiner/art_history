definition: "Japanese era name (貞応) for the years 1222–1224: 1222 is Jōō 1 (元年) and Jōō 3 is 1224."
description_md: |-
  **Jōō** (貞応) is a Japanese era name ([[nengo]]), proclaimed in 1222. Its years are counted in lunar years from the new year before the proclamation: 1222 is Jōō 1 (元年), 1224 its last year, Jōō 3. A Japanese source dates a year within it as "Jōō 2" (貞応2年) rather than by a continuous count.

  Before: [[jokyu-era|Jōkyū]]. After: [[gennin-era|Gennin]].
