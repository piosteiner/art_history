name: Holy Family
names: [The Holy Family]
category: iconography
definition: Mary, Joseph and the child Jesus, often with the young John the Baptist and his mother Elizabeth, or Mary's mother Anne.
description_md: |-
  Mary, [[person/saint-joseph|Joseph]] and the child Jesus, often with the young [[person/john-the-baptist]] and his mother Elizabeth, or [[person/mary]]'s mother Anne.

  **In art:** A domestic family group. Joseph is usually shown as an older man with a carpenter's tools. The child John the Baptist wears a camel skin and holds a reed cross.

  **Famous works**

  - [[artist/michelangelo]], *Doni Tondo* (Uffizi) — [[artwork/doni-tondo]]
  - [[artist/leonardo-da-vinci]], *The Virgin and Child with Saint Anne* (Louvre) — [[artwork/the-virgin-and-child-with-saint-anne]]
  - Leonardo da Vinci, *Virgin of the Rocks* (Louvre and National Gallery, London)

  *From:* Christian tradition · Christian
