public_id: 113307
name: Gyeongjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 경종
  - lang: ko-Hani
    role: alternative
    text: 景宗
category: calendar
definition: "The reign years of King Gyeongjong of Goryeo (景宗, 경종), by which Korean histories date 976–981: 976 is Gyeongjong 1, 981 Gyeongjong 6."
description_md: |-
  **Gyeongjong** (景宗, 경종): the years of the reign of King Gyeongjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 981 is Gyeongjong 6 (경종 6년). The year of the accession, 976, counts as the first year.

  Before: [[gwangjong-goryeo-reign-years|Gwangjong]]. After: [[seongjong-goryeo-reign-years|Seongjong]].
sources:
  definition:
    - source: dila-time-authority
