name: Gumiho
names: [nine-tailed fox]
category: mythology and legend
definition: The nine-tailed fox of Korean folklore, a fox of a thousand years that takes the shape of a beautiful woman to seduce and devour its victims.
description_md: |-
  The gumiho is a fox that has lived a thousand years and grown nine tails. It can transform into a beautiful woman to seduce and devour its victims, often eating their liver or heart. In some tales, a gumiho can become fully human if it doesn't kill anyone for a thousand days, and many stories turn on whether she manages it.

  *From:* folklore · Korean
