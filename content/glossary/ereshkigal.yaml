public_id: 131307
name: Ereshkigal
category: mythology and legend
definition: In Mesopotamian myth, the queen of the Underworld, before whom her sister Inanna (Ishtar) stood naked after passing its seven gates.
description_md: |-
  When her sister Inanna (Ishtar) went down into the Underworld, she had to take off a piece of clothing or jewellery at each of seven gates, until she stood naked before Ereshkigal. In the Sumerian poem the seven judges of the Underworld (the Anuna) struck her dead with the look of death, and her corpse was hung on a hook. Inanna was brought back to life, but she had to send her husband Dumuzi to take her place.

  *From:* Inanna's Descent to the Netherworld · Mesopotamian (Sumerian, Babylonian, Assyrian)
