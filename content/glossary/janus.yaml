definition: The two-faced Roman god of beginnings, doorways and transitions, with no Greek equivalent; January is named after him.
description_md: |-
  The Roman god of beginnings, doorways and transitions, with no Greek equivalent. The month of January is named after him.

  **In art:** A head with two faces looking in opposite directions; on Roman coins both are bearded, in later art often one old and one young.

  **Famous works**

  - Common on Roman coins and as a motif in allegories of [[father-time|Time]] and [[prudence]]

  *From:* Roman religion · Ancient Roman
