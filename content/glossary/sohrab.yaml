name: Sohrab
names: [Suhrab]
category: mythology and legend
definition: In the Persian Shahnameh, the son of Rostam and the princess Tahmineh, killed in single combat by his father, who did not know him.
description_md: |-
  [[rostam]] spent one night with the princess Tahmineh and left her a bracelet (an armband) as a sign for their child. Their son Sohrab grew up far away, became a great warrior, and set out to find his father. Through a chain of mistakes and hidden identities, the two finally met on the battlefield as enemies. Neither knew who the other was. Rostam mortally wounded Sohrab, and only then saw the armband on his arm. It's one of the most famous tragedies in Persian literature.

  *From:* Shahnameh · Persian
