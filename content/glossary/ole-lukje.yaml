name: Ole Lukøje
names: [Ole Lukoie, Ole Shut-Eye]
category: mythology and legend
definition: In Andersen's tale (1841), the Danish Sandman, who brings children good dreams under a picture umbrella; his brother is Death.
description_md: |-
  He sneaks up on children in the evening and blows on their necks to make them sleepy. He has two umbrellas: one with pictures, which he opens over good children to give them beautiful dreams, and a plain one for naughty children, who don't dream at all. His brother is Death.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
