definition: "Japanese era name (宝暦) for the years 1751–1764: 1751 is Hōreki 1 (元年) and Hōreki 14 is 1764."
description_md: |-
  **Hōreki** (宝暦) is a Japanese era name ([[nengo]]), proclaimed in 1751. Its years are counted in lunar years from the new year before the proclamation: 1751 is Hōreki 1 (元年), 1764 its last year, Hōreki 14. A Japanese source dates a year within it as "Hōreki 2" (宝暦2年) rather than by a continuous count.

  Before: [[kanen-era|Kan'en]]. After: [[meiwa-era|Meiwa]].
