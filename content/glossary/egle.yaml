name: Eglė
names: [Eglė the Queen of Serpents]
category: mythology and legend
definition: In the Lithuanian tale Eglė the Queen of Serpents, a girl who married the grass snake prince Žilvinas and turned into a spruce when her brothers killed him.
description_md: |-
  A grass snake hid in her clothes while she bathed and wouldn't leave until she promised to marry him. He turned out to be Žilvinas, a prince who lived under the sea, and they were happy together. Her brothers lured him out with a secret call and killed him with scythes. In her grief, Eglė turned herself into a spruce and her children into an oak, an ash, a birch and an aspen.

  *From:* Lithuanian folklore · Lithuanian
