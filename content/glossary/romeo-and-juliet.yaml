name: Romeo and Juliet
category: mythology and legend
also_in: [iconography]
definition: The star-crossed lovers of Shakespeare's tragedy, one of the plays that inspired countless paintings in the eighteenth and nineteenth centuries.
description_md: |-
  Shakespeare's plays inspired countless paintings, especially in the 18th and 19th centuries: the star-crossed lovers *Romeo and Juliet*, [[lady-macbeth]] sleepwalking, the three witches of *Macbeth*, King Lear in the storm, and the fairies [[titania]], [[oberon]] and [[puck]] from *A Midsummer Night's Dream*, where Titania falls in love with Bottom, who has a donkey's head.

  **In art:** Lovers on a balcony.

  **Famous works**

  - Frank Dicksee, *Romeo and Juliet* (1884; Southampton City Art Gallery)

  *From:* William Shakespeare, Romeo and Juliet · English
