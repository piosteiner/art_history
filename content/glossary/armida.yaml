name: Armida
category: mythology and legend
also_in: [iconography]
definition: The sorceress of Tasso's Jerusalem Delivered (1581), who lures the crusader Rinaldo to her enchanted garden.
description_md: |-
  In Tasso's *Jerusalem Delivered* (1581), the sorceress Armida lures the crusader [[rinaldo]] to her enchanted garden, and he forgets the war until his companions show him his reflection in a shield.

  **In art:** A sorceress cradling a sleeping knight in a garden.

  **Famous works**

  - [[artist/giovanni-battista-tiepolo]], *Rinaldo and Armida* scenes (four canvases, c. 1742–45, Art Institute of Chicago; a pair painted c. 1751–53 for the Würzburg Residenz, Bavarian State Painting Collections)
  - [[artist/nicolas-poussin]], *Rinaldo and Armida* (c. 1628–30; Dulwich Picture Gallery, London)

  *From:* Torquato Tasso, Jerusalem Delivered · Italian
