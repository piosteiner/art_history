name: Vila
names: [Vile]
category: mythology and legend
definition: South Slavic fairy women of the mountains, clouds and lakes, who help heroes but can be deadly when offended.
description_md: |-
  Beautiful, long-haired women warriors who live in the mountains, clouds and lakes. They can shoot arrows, heal and change into swans, falcons, wolves or snakes. They help heroes like Marko, but they can also be deadly if they're offended.

  *From:* folklore · South Slavic
