public_id: 131199
name: Frau Holle
names: [Mother Hulda]
category: mythology and legend
definition: In the Grimms' fairy tale, an old woman in a world below a well who makes it snow on earth when her featherbeds are shaken.
description_md: |-
  A hard-working girl fell down a well into Frau Holle's world. She worked for her and shook out her featherbeds so hard that snow fell on the world above. As a reward, she was showered with gold. Her lazy stepsister did the same but was showered with pitch, which never came off.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
