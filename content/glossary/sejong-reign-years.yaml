definition: "The reign years of Sejong the Great (世宗, 세종), by which Korean sources date 1419–1450: 1419 is Sejong 1, 1450 Sejong 32."
description_md: |-
  **Sejong** (世宗, 세종): the years of the reign of [[person/sejong-the-great|Sejong the Great]] of Joseon, who came to the throne on 19 August 1418. Korean sources count years by the reigning king ([[korean-reign-years]]): 1428 is Sejong 10 (세종 10년). His first year is 1419, the year after his accession; the rest of 1418 still counts for his predecessor.

  Before: [[taejong-reign-years|Taejong]]. After: [[munjong-reign-years|Munjong]].
