name: Resurrection of Jesus
names: [The Resurrection]
category: iconography
definition: Christ rising from the tomb on the third day.
description_md: |-
  On the third day, Christ rises from the tomb.

  **In art:** Christ stepping out of or floating above the tomb holding a banner with a red cross, while Roman guards sleep or fall back in fear.

  **Famous works**

  - [[artist/piero-della-francesca]], *The Resurrection* (Sansepolcro)
  - Matthias Grünewald, *Resurrection* panel of the *Isenheim Altarpiece*

  *From:* New Testament, Gospels · Christian
