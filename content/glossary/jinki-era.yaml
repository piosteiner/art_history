definition: "Japanese era name (神亀) for the years 724–728: 724 is Jinki 1 (元年) and Jinki 5 is 728."
description_md: |-
  **Jinki** (神亀) is a Japanese era name ([[nengo]]), proclaimed in 724. Its years are counted in lunar years from the new year before the proclamation: 724 is Jinki 1 (元年), 728 its last year, Jinki 5. A Japanese source dates a year within it as "Jinki 2" (神亀2年) rather than by a continuous count.

  Before: [[yoro-era|Yōrō]]. After: [[tenpyo-era|Tenpyō]].
