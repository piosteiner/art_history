definition: In Greek myth the king of the Titans and father of Zeus, who swallowed his children at birth; the Romans called him Saturn, and he was later linked with Chronos (Time).
description_md: |-
  King of the Titans, father of [[zeus]]. Warned that a child would overthrow him, he swallowed each of his children at birth. Zeus escaped and overthrew him. Later linked with Chronos ([[father-time|Time]]).

  **In art:** An old man with a scythe or sickle, sometimes devouring a child. As Father Time, he has wings and an hourglass.

  **Famous works**

  - Goya, *Saturn Devouring His Son* (Prado) — [[artwork/saturn-devouring-his-son]]
  - Rubens, *Saturn* (Prado)

  *From:* Greek mythology · Ancient Greek
