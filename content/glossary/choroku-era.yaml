definition: "Japanese era name (長禄) for the years 1457–1460: 1457 is Chōroku 1 (元年) and Chōroku 4 is 1460."
description_md: |-
  **Chōroku** (長禄) is a Japanese era name ([[nengo]]), proclaimed in 1457. Its years are counted in lunar years from the new year before the proclamation: 1457 is Chōroku 1 (元年), 1460 its last year, Chōroku 4. A Japanese source dates a year within it as "Chōroku 2" (長禄2年) rather than by a continuous count.

  Before: [[kosho-era|Kōshō]]. After: [[kansho-era|Kanshō]].
