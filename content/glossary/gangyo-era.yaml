definition: "Japanese era name (元慶) for the years 877–885: 877 is Gangyō 1 (元年) and Gangyō 9 is 885."
description_md: |-
  **Gangyō** (元慶) is a Japanese era name ([[nengo]]), proclaimed in 877. Its years are counted in lunar years from the new year before the proclamation: 877 is Gangyō 1 (元年), 885 its last year, Gangyō 9. A Japanese source dates a year within it as "Gangyō 2" (元慶2年) rather than by a continuous count.

  Before: [[jogan-era|Jōgan]]. After: [[ninna-era|Ninna]].
