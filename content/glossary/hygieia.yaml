definition: In Greek myth the goddess of health, daughter of Asclepius, from whom the word "hygiene" comes.
description_md: |-
  [[asclepius]] is the god of medicine, a son of [[apollo]] taught by the centaur [[chiron]]. His daughter Hygieia is the goddess of health (hence "hygiene").

  **In art:** Hygieia feeds a snake from a bowl.

  **Famous works**

  - [[artist/gustav-klimt]], *Medicine* (ceiling painting for the University of Vienna, destroyed in 1945; Hygieia survives in photos)

  *From:* Greek mythology · Ancient Greek
