public_id: 113001
name: Qianxing
names:
  - lang: zh
    role: original
    text: 乾興
category: calendar
definition: "Chinese era name (乾興) of the Northern Song for the years 1022–1023: 1022 is Qianxing 1 (元年) and Qianxing 2 is 1023."
description_md: |-
  **Qianxing** (乾興) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1022 under Emperor Zhenzong (真宗). Its years are counted in lunar years: 1022 is Qianxing 1 (元年), 1023 its last year, Qianxing 2. A Chinese source dates a year within it as "Qianxing 2" (乾興二年) rather than by a continuous count.

  Before: [[tianxi-era|Tianxi]]. After: [[tiansheng-era|Tiansheng]].
sources:
  definition:
    - source: dila-time-authority
