name: Timingila
names: [Timingilagila]
category: mythology and legend
definition: In Indian legend, a gigantic sea creature able to swallow whales whole, itself swallowed in some tales by the still bigger Timingilagila.
description_md: |-
  Timingila is a gigantic sea creature from Indian legend, so large that it can swallow other whales in a single bite. Some tales describe an even bigger monster, the Timingilagila, which swallows the Timingila.

  *From:* Indian legend · Indian
