public_id: 113336
name: Gongyang of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 공양왕
  - lang: ko-Hani
    role: alternative
    text: 恭讓王
category: calendar
definition: "The reign years of King Gongyang of Goryeo (恭讓王, 공양왕), by which Korean histories date 1389–1392: 1389 is Gongyang 1, 1392 Gongyang 4."
description_md: |-
  **Gongyang** (恭讓王, 공양왕): the years of the reign of King Gongyang of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1392 is Gongyang 4 (공양왕 4년). The year of the accession, 1389, counts as the first year.

  Before: [[chang-goryeo-reign-years|Chang]].
sources:
  definition:
    - source: dila-time-authority
