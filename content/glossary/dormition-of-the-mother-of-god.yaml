name: Dormition of the Mother of God
names: [Dormition, Death of the Virgin]
category: iconography
definition: Mary falling asleep in death surrounded by the apostles, from later tradition, not the Bible.
description_md: |-
  At the end of her life, [[person/mary]] falls asleep in death, surrounded by the apostles (the Dormition). These come from tradition, not the Bible.

  **In art:** Mary on her deathbed among the apostles.

  **Famous works**

  - [[artist/caravaggio]], *Death of the Virgin* (Louvre) — [[artwork/death-of-the-virgin]]

  *From:* Christian tradition · Christian
