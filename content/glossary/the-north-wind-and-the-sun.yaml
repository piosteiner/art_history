name: The North Wind and the Sun
category: mythology and legend
definition: "Aesop's fable of a contest between the North Wind and the Sun to make a traveller take off his cloak: kindness achieves more than force."
description_md: |-
  They argued about who was stronger and agreed to test it on a traveller. The wind blew hard, but the man only held his cloak tighter. The sun shone gently, and the man took his cloak off by himself. Moral: kindness achieves more than force.

  *From:* Aesop's Fables · Ancient Greek
