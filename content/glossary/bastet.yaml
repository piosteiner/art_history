name: Bastet
category: mythology and legend
definition: The Egyptian goddess who began as a fierce lioness and became the cat goddess of home, music, joy and protection, honoured at Bubastis.
description_md: |-
  Bastet began as a fierce lioness warrior goddess and became, over time, the gentle cat goddess of home, music, joy and protection. Her city, Bubastis, held huge festivals in her honour, and cats there were so sacred that harming one was a serious crime. Many cats were mummified and buried in her temples.

  *From:* Egyptian religion · Ancient Egyptian
