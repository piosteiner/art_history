public_id: 131569
name: Leviathan
category: mythology and legend
definition: The giant sea serpent of the Hebrew Bible and Jewish legend, whose flesh will be served to the righteous at the end of time.
description_md: |-
  In Jewish legend, God created a giant sea serpent (Leviathan), a giant land beast ([[behemoth]]) and a giant bird ([[ziz]]), so huge that its wings could block out the sun. At the end of time, their flesh will be served at a great feast for the righteous.

  *From:* Hebrew Bible, Jewish legend · Jewish
