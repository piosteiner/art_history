definition: In Greek myth the god of the sea, earthquakes and horses, brother of Zeus; the Romans called him Neptune.
description_md: |-
  God of the sea, earthquakes and horses, brother of [[zeus]].

  **In art:** Bearded, muscular, holding a trident, riding sea horses or a shell chariot, surrounded by tritons and nereids.

  **Famous works**

  - The *Artemision Bronze* (Zeus or Poseidon, debated — more likely Zeus; National Archaeological Museum, Athens) — [[artwork/artemision-bronze]]
  - Giambologna, *Fountain of Neptune*, Bologna
  - Bartolomeo Ammannati, *Fountain of Neptune*, Florence

  *From:* Greek mythology · Ancient Greek
