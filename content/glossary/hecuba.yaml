name: Hecuba
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the queen of Troy, mother of Hector, Paris and Cassandra, enslaved after the fall of the city.
description_md: |-
  The old king and queen of Troy, parents of [[hector]], Paris and [[cassandra]]. [[priam]] was killed at the altar by [[achilles]]' son [[neoptolemus]] when Troy fell. Hecuba was enslaved and, in some versions, turned into a dog.

  **In art:** A grieving old queen.

  *From:* Homer, Iliad; Euripides, Hecuba · Ancient Greek
