category: calendar
definition: "Japanese era name (建長) for the years 1249–1256: 1249 is Kenchō 1 (元年) and Kenchō 8 is 1256."
description_md: |-
  **Kenchō** (建長) is a Japanese era name ([[nengo]]), proclaimed in 1249. Its years are counted in lunar years from the new year before the proclamation: 1249 is Kenchō 1 (元年), 1256 its last year, Kenchō 8. A Japanese source dates a year within it as "Kenchō 2" (建長2年) rather than by a continuous count.

  Before: [[hoji-era|Hōji]]. After: [[kogen-era|Kōgen]].
