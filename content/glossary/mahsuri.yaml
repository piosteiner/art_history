name: Mahsuri
category: mythology and legend
definition: A young woman of Langkawi in Malay legend, falsely accused of adultery and executed; white blood flowed from her wound as a sign of innocence, and her dying curse left the island without prosperity for seven generations.
description_md: |-
  Mahsuri was a young woman on the island of Langkawi, admired for her beauty and kindness. A jealous woman, the village chief's wife Wan Mahora, spread rumours, and villagers falsely accused her of adultery while her husband was away at war, and she was sentenced to death. As she died, white blood flowed from her wound as a sign of her innocence, and with her last breath she cursed Langkawi to have no prosperity for seven generations. The island was soon raided and burned, and only bloomed again at the end of the 20th century.

  *From:* legend of Langkawi · Malay
