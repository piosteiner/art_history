name: Gordafarid
category: mythology and legend
definition: In the Persian Shahnameh, the warrior woman who rode out in armour against Sohrab and outwitted him; one of its most celebrated heroines.
description_md: |-
  When Sohrab attacked a Persian border fortress, its champion was captured. Gordafarid, the commander's daughter, put on armour, hid her hair under a helmet and rode out to fight [[sohrab]] herself. She held her own against him, and when he pulled off her helmet and saw who she was, she tricked him into letting her return to the fortress, then mocked him from the walls. She's one of the most celebrated heroines of the Shahnameh.

  *From:* Shahnameh · Persian
