public_id: 131533
name: Caleuche
category: mythology and legend
definition: A glowing ghost ship of Chiloé folklore, crewed by the drowned and warlocks, that sails at night full of music.
description_md: |-
  A ghost ship that sails the waters around Chiloé at night, glowing and full of music and party noise. Its crew are the drowned and warlocks. It can sink under the water or turn into a rock.

  *From:* folklore · Chilote (Chiloé)
