name: Baoli
names:
  - lang: zh
    role: original
    text: 寶歷
category: calendar
parent: chinese-calendar
definition: "Chinese era name (寶歷) of the Tang for the years 825–827: 825 is Baoli 1 (元年) and Baoli 3 is 827."
description_md: |-
  **Baoli** (寶歷) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 825 under Emperor Jingzong (敬宗). Its years are counted in lunar years: 825 is Baoli 1 (元年), 827 its last year, Baoli 3. A Chinese source dates a year within it as "Baoli 2" (寶歷二年) rather than by a continuous count.

  Before: [[changqing-era|Changqing]]. After: [[taihe-era|Taihe]].
sources:
