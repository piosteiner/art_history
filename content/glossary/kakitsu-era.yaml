definition: "Japanese era name (嘉吉) for the years 1441–1444: 1441 is Kakitsu 1 (元年) and Kakitsu 4 is 1444."
description_md: |-
  **Kakitsu** (嘉吉) is a Japanese era name ([[nengo]]), proclaimed in 1441. Its years are counted in lunar years from the new year before the proclamation: 1441 is Kakitsu 1 (元年), 1444 its last year, Kakitsu 4. A Japanese source dates a year within it as "Kakitsu 2" (嘉吉2年) rather than by a continuous count.

  Before: [[eikyo-era|Eikyō]]. After: [[bunan-era|Bun'an]].
