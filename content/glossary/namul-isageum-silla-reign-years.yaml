public_id: 113353
name: Namul Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 나물이사금
  - lang: ko-Hani
    role: alternative
    text: 奈勿尼師今
category: calendar
definition: "The reign years of Namul Isageum of Silla (奈勿尼師今, 나물이사금), by which Korean histories date 356–402: 356 is Namul Isageum 1, 402 Namul Isageum 47."
description_md: |-
  **Namul Isageum** (奈勿尼師今, 나물이사금): the years of the reign of Namul Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 365 is Namul Isageum 10 (나물이사금 10년). The year of the accession, 356, counts as the first year.

  Before: [[heulhae-isageum-silla-reign-years|Heulhae Isageum]]. After: [[silseong-isageum-silla-reign-years|Silseong Isageum]].
sources:
  definition:
    - source: dila-time-authority
