name: Yu the Great
names: [Da Yu]
category: mythology and legend
definition: The legendary Chinese ruler who tamed the Great Flood by digging channels to lead the water to the sea rather than damming it, and founded the first Chinese dynasty, the Xia.
description_md: |-
  When a great flood drowned China, Yu's father tried to stop it with dams for nine years and failed. Yu took over and tried something different: he dug channels to lead the water out to the sea. The work took thirteen years. He was so devoted that he passed by his own home three times without going in. He became a legendary ruler and the founder of the first Chinese dynasty.

  *From:* Chinese legend · Chinese
