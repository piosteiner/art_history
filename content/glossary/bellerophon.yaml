name: Bellerophon
category: mythology and legend
definition: The Greek hero who tamed the winged horse Pegasus and killed the Chimera, but was thrown when he tried to ride up to Mount Olympus and spent the rest of his life wandering alone.
description_md: |-
  Bellerophon, a son of [[poseidon]] (in [[person/homer]], of Glaucus), tamed the winged horse [[pegasus]] with a golden bridle. The king of Lycia set him the task of killing the [[chimera]], a monster with a lion's body, a goat's head on its back and a snake for a tail. Flying above it on Pegasus, Bellerophon killed it. He went on to many victories, but grew so proud that he tried to ride Pegasus up to Mount Olympus. The gods sent a gadfly to sting the horse, Bellerophon was thrown, and he spent the rest of his life wandering alone.

  *From:* Greek mythology · Ancient Greek
