public_id: 113294
name: Jangsu of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 장수왕
  - lang: ko-Hani
    role: alternative
    text: 長壽王
category: calendar
definition: "The reign years of King Jangsu of Goguryeo (長壽王, 장수왕), by which Korean histories date 413–491: 413 is Jangsu 1, 491 Jangsu 79."
description_md: |-
  **Jangsu** (長壽王, 장수왕): the years of the reign of King Jangsu of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 422 is Jangsu 10 (장수왕 10년). The year of the accession, 413, counts as the first year.

  Before: [[gwanggaeto-goguryeo-reign-years|Gwanggaeto]]. After: [[munjamyeong-goguryeo-reign-years|Munjamyeong]].
sources:
  definition:
    - source: dila-time-authority
