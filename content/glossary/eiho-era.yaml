definition: "Japanese era name (永保) for the years 1081–1083: 1081 is Eihō 1 (元年) and Eihō 3 is 1083."
description_md: |-
  **Eihō** (永保) is a Japanese era name ([[nengo]]), proclaimed in 1081. Its years are counted in lunar years from the new year before the proclamation: 1081 is Eihō 1 (元年), 1083 its last year, Eihō 3. A Japanese source dates a year within it as "Eihō 2" (永保2年) rather than by a continuous count.

  Before: [[joryaku-era|Jōryaku]]. After: [[otoku-era|Ōtoku]].
