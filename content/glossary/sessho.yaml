name: sesshō
names:
  - lang: ja
    role: translation
    text: "{摂政|せっしょう}"
  - regent
category: politics
definition: A regent who governed in the name of a child emperor, or for an empress regnant. Administration by sesshō or [[kanpaku]] was the main form of government in the Middle Heian period (951–1086).
