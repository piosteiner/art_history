name: Djedi
category: mythology and legend
definition: In the tales told to King Khufu (Westcar Papyrus), a 110-year-old magician who could put cut-off heads back on.
description_md: |-
  In the stories told to King Khufu (who built the Great Pyramid), Djedi ate 500 loaves of bread and a shoulder of beef and drank 100 jars of beer every day. He refused to show his trick on a prisoner, so he used a goose instead: he cut off its head, put it back on, and the goose waddled away cackling.

  *From:* Westcar Papyrus · Ancient Egyptian
