name: Oedipus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the king of Thebes who solved the riddle of the Sphinx and unknowingly killed his father and married his mother.
description_md: |-
  The king of Thebes who unknowingly killed his father and married his mother, exactly as a prophecy foretold. Before that, he freed Thebes by solving the riddle of the [[sphinx]]. When he discovered the truth, he blinded himself.

  **In art:** Usually facing the Sphinx (a winged lion with a woman's head), or blind and led by his daughter [[antigone]].

  **Famous works**

  - Ingres, *Oedipus and the Sphinx* (Louvre)
  - Gustave Moreau, *Oedipus and the Sphinx* (Metropolitan Museum)

  *From:* Greek mythology · Ancient Greek
