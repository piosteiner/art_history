definition: "Japanese era name (嘉慶) for the years 1387–1389: 1387 is Kakei 1 (元年) and Kakei 3 is 1389."
description_md: |-
  **Kakei** (嘉慶) is a Japanese era name ([[nengo]]), proclaimed in 1387. Its years are counted in lunar years from the new year before the proclamation: 1387 is Kakei 1 (元年), 1389 its last year, Kakei 3. A Japanese source dates a year within it as "Kakei 2" (嘉慶2年) rather than by a continuous count.

  Before: [[shitoku-era|Shitoku]]. After: [[koo-era|Kōō]].
