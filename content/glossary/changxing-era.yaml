name: Changxing
names:
  - lang: zh
    role: original
    text: 長興
category: calendar
definition: "Chinese era name (長興) of the Later Tang for the years 930–933: 930 is Changxing 1 (元年) and Changxing 4 is 933."
description_md: |-
  **Changxing** (長興) is a Chinese era name ([[nianhao]]) of the Later Tang, proclaimed in 930 under Emperor Mingzong (明宗). Its years are counted in lunar years: 930 is Changxing 1 (元年), 933 its last year, Changxing 4. A Chinese source dates a year within it as "Changxing 2" (長興二年) rather than by a continuous count.

  Before: [[tiancheng-era|Tiancheng]]. After: [[yingshun-era|Yingshun]].
sources:
