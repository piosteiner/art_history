definition: "Jōruri play by Chikamatsu Monzaemon (1703) for the puppet theatre: the clerk Tokubei and the courtesan Ohatsu die together; the first domestic tragedy of the genre."
description_md: A jōruri play for the puppet theatre by Chikamatsu Monzaemon, written after a double suicide of 22 May 1703 and first performed on 20 June 1703[[source/wikipedia-en-the-love-suicides-at-sonezaki|“a jōruri play by the Japanese playwright Chikamatsu Monzaemon. The double suicides that occurred on May 22, 1703, inspired Chikamatsu to write this play and thus The Love Suicides at Sonezaki made its debut performance on June 20, 1703”]]. The orphaned oil clerk Tokubei and the courtesan Ohatsu, who love each other, choose to die together[[source/wikipedia-en-the-love-suicides-at-sonezaki|“The two central characters are an orphaned oil clerk named Tokubei and Ohatsu, the courtesan he loves”]]. It was Chikamatsu’s first domestic play (*sewamono*) and first love-suicide play (*shinjūmono*) — until then jōruri had mostly told history[[source/wikipedia-en-the-love-suicides-at-sonezaki|“Chikamatsu’s first "domestic tragedy" or "domestic play" (sewamono) and his first love-suicide play (shinjūmono). Until this play, the common topic for jōruri was jidaimono or "history plays"”]]; its success was such that the shogunate banned his love-suicide plays in 1722[[source/wikipedia-en-the-love-suicides-at-sonezaki|“the bakufu banned Chikamatsu’s shinjū plays in 1722 because of their content’s popularity”]].
