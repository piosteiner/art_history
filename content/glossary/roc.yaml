public_id: 131325
name: Roc
category: mythology and legend
definition: A bird of Middle Eastern legend so huge that it feeds elephants to its chicks; Sinbad escaped an island tied to one's leg.
description_md: |-
  Sinbad tied himself to a Roc's leg to escape from an island. Marco Polo claimed it lived in Madagascar, and it might be based on the giant extinct elephant bird there.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
