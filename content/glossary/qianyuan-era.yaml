public_id: 113091
name: Qianyuan
names:
  - lang: zh
    role: original
    text: 乾元
category: calendar
definition: "Chinese era name (乾元) of the Tang for the years 758–760: 758 is Qianyuan 1 (元年) and Qianyuan 3 is 760."
description_md: |-
  **Qianyuan** (乾元) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 758 under Emperor Suzong (肅宗). Its years are counted in lunar years: 758 is Qianyuan 1 (元年), 760 its last year, Qianyuan 3. A Chinese source dates a year within it as "Qianyuan 2" (乾元二年) rather than by a continuous count.

  Before: [[zhide-era|Zhide]]. After: [[shangyuan-era-760|Shangyuan]].
sources:
  definition:
    - source: dila-time-authority
