name: Marcus Curtius
category: mythology and legend
also_in: [iconography]
definition: The young Roman soldier who rode into a chasm in the Forum, saying Rome's greatest treasure was its courage, and the chasm closed over him.
description_md: |-
  When a chasm opened in the Roman Forum, a prophecy said it would close only if Rome threw in its greatest treasure. The young soldier Marcus Curtius said Rome's greatest treasure was its courage, and rode into it on horseback, and it closed over him.

  **In art:** A horseman leaping into a fiery pit.

  **Famous works**

  - Benjamin Robert Haydon, *Marcus Curtius Leaping into the Gulf* (Exeter)
  - Pietro Bernini, *Marcus Curtius* (ancient relief of a horse completed with the rider by Pietro Bernini, Galleria Borghese, Rome)

  *From:* Livy, History of Rome · Ancient Roman
