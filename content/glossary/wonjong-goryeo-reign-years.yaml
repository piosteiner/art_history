public_id: 113326
name: Wonjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 원종
  - lang: ko-Hani
    role: alternative
    text: 元宗
category: calendar
definition: "The reign years of King Wonjong of Goryeo (元宗, 원종), by which Korean histories date 1260–1274: 1260 is Wonjong 1, 1274 Wonjong 15."
description_md: |-
  **Wonjong** (元宗, 원종): the years of the reign of King Wonjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1269 is Wonjong 10 (원종 10년). The year of the accession, 1260, counts as the first year.

  Before: [[gojong-goryeo-reign-years|Gojong]]. After: [[chungnyeol-goryeo-reign-years|Chungnyeol]].
sources:
  definition:
    - source: dila-time-authority
