category: calendar
definition: "Chinese era name (雍正) of the Qing for the years 1723–1735: 1723 is Yongzheng 1 (元年) and Yongzheng 13 is 1735."
description_md: |-
  **Yongzheng** (雍正) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1723. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Yongzheng Emperor. Its years are counted in lunar years: 1723 is Yongzheng 1 (元年), 1735 its last year, Yongzheng 13. A Chinese source dates a year within it as "Yongzheng 2" (雍正二年) rather than by a continuous count.

  Before: [[kangxi-era|Kangxi]]. After: [[qianlong-era|Qianlong]].
