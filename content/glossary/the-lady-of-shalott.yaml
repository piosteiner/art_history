name: The Lady of Shalott
names: [Elaine of Astolat]
category: mythology and legend
also_in: [iconography]
definition: The cursed lady of Tennyson's poem, who may see the world only in a mirror and dies floating to Camelot after looking at Sir Lancelot.
description_md: |-
  From Tennyson's poem: a lady under a curse that forbids her to look directly at the world, so she sees it only in a mirror and weaves what she sees. When she glimpses [[lancelot|Sir Lancelot]] riding past, she looks out of the window, the mirror cracks, and she floats down the river to Camelot in a boat, dying as she sings.

  **In art:** A pale woman in white in a drifting boat with candles and a tapestry, or a woman at a loom before a cracking mirror.

  **Famous works**

  - John William Waterhouse, *The Lady of Shalott* (1888, Tate, plus two later versions)
  - [[artist/william-holman-hunt]], *The Lady of Shalott* (Hartford)

  *From:* Alfred Tennyson, The Lady of Shalott · British (Arthurian legend)
