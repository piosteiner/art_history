name: Flagellation of Christ
names: [The Flagellation]
category: iconography
definition: Christ whipped by soldiers during his Passion, in art usually tied to a column.
description_md: |-
  Christ was whipped (flagellated), crowned with thorns and mocked by soldiers.

  **In art:** Christ tied to a column being whipped.

  **Famous works**

  - [[artist/piero-della-francesca]], *The Flagellation of Christ* (Urbino) — [[artwork/piero-flagellazione]]
  - [[artist/caravaggio]], *The Flagellation of Christ* (Naples)

  *From:* New Testament, Gospels · Christian
