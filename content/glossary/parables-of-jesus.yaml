name: Parables of Jesus
names: [Prodigal Son, Good Samaritan]
category: iconography
definition: The stories Jesus told to teach; most often painted are the Prodigal Son, the Good Samaritan, the Wise and Foolish Virgins and the Blind Leading the Blind.
description_md: |-
  Stories Jesus told to teach. Most often painted: the Prodigal Son (a son wastes his inheritance, returns in shame and is welcomed by his father), the Good Samaritan, the Wise and Foolish Virgins, and the Blind Leading the Blind.

  **In art:** A ragged young man kneeling before an embracing father, or a traveller tending a wounded man by the road.

  **Famous works**

  - [[artist/rembrandt]], *The Return of the Prodigal Son* (Hermitage)
  - Pieter Bruegel the Elder, *The Blind Leading the Blind* (Naples)
  - [[artist/vincent-van-gogh]], *The Good Samaritan (after Delacroix)* (Otterlo)

  *From:* New Testament, Gospels · Christian
