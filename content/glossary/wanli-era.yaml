definition: "Chinese era name (萬曆) of the Ming for the years 1573–1620: 1573 is Wanli 1 (元年) and Wanli 48 is 1620."
description_md: |-
  **Wanli** (萬曆) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1573. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Wanli Emperor. Its years are counted in lunar years: 1573 is Wanli 1 (元年), 1620 its last year, Wanli 48. A Chinese source dates a year within it as "Wanli 2" (萬曆二年) rather than by a continuous count.

  Before: [[longqing-era|Longqing]]. After: [[taichang-era|Taichang]].
