category: calendar
definition: "Japanese era name (至徳) for the years 1384–1387: 1384 is Shitoku 1 (元年) and Shitoku 4 is 1387."
description_md: |-
  **Shitoku** (至徳) is a Japanese era name ([[nengo]]), proclaimed in 1384. Its years are counted in lunar years from the new year before the proclamation: 1384 is Shitoku 1 (元年), 1387 its last year, Shitoku 4. A Japanese source dates a year within it as "Shitoku 2" (至徳2年) rather than by a continuous count.

  Before: [[eitoku-era|Eitoku]]. After: Kakei.
