category: calendar
definition: "Japanese era name (承和) for the years 834–847: 834 is Jōwa 1 (元年) and Jōwa 14 is 847."
description_md: |-
  **Jōwa** (承和) is a Japanese era name ([[nengo]]), proclaimed in 834. Its years are counted in lunar years from the new year before the proclamation: 834 is Jōwa 1 (元年), 847 its last year, Jōwa 14. A Japanese source dates a year within it as "Jōwa 2" (承和2年) rather than by a continuous count.

  Before: [[tencho-era|Tenchō]]. After: [[kasho-era-848|Kashō]].
