public_id: 113269
name: Seong of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 성왕
  - lang: ko-Hani
    role: alternative
    text: 聖王
category: calendar
parent: korean-calendar
definition: "The reign years of King Seong of Baekje (聖王, 성왕), by which Korean histories date 523–554: 523 is Seong 1, 554 Seong 32."
description_md: |-
  **Seong** (聖王, 성왕): the years of the reign of King Seong of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 532 is Seong 10 (성왕 10년). The year of the accession, 523, counts as the first year.

  Before: [[muryeong-baekje-reign-years|Muryeong]]. After: [[wideok-baekje-reign-years|Wideok]].
sources:
  definition:
    - source: dila-time-authority
