public_id: 109302
name: Yunghui
names:
  - lang: ko
    role: original
    text: 융희
  - lang: ko-Hani
    role: alternative
    text: 隆熙
category: calendar
definition: "Korean era name (隆熙, 융희) of the Korean Empire for the years 1907–1910: 1907 is Yunghui 1."
description_md: |-
  **Yunghui** (隆熙, 융희) is an era name of Korea's own, proclaimed in 1907: with the solar calendar (1896) Korea stopped dating by the Chinese emperors' eras and the king's reign years ([[korean-reign-years]]). It is the era of [[person/sunjong-of-korea|Sunjong of the Korean Empire]], the Yunghui Emperor, the last ruler before the annexation by Japan in 1910.

  Before: [[gwangmu-era|Gwangmu]].
