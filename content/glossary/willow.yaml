description_md: Willow was, with poplar, among the soft woods of loose growth used for all kinds of carved objects in central and northern Europe up to the end of the twelfth century, regardless of geology or climate.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] Thanks to their rapid growth and large trunks, willow and poplar were the most common timber of the European Middle Ages for door leaves, floorboards, baking utensils, bowls, tools and furniture.[[source/endemann-2020-wood-carving-and-staffering|p. 148]] In such loose-celled wood part of the shrinkage on drying is absorbed by the structure of the sculpture.[[source/endemann-2020-wood-carving-and-staffering|p. 148]] Willow crucifixes include the [[artwork/boston-crucifix|Boston Crucifix]] and the crucifix from [[artwork/kreuz-aus-st-georg-koln|St Georg in Cologne]], whose sculptor chose a bent tree for the curve of the body.[[source/endemann-2020-wood-carving-and-staffering|pp. 144, 151]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 21]] The Catalan [[artwork/mare-de-deu-de-ger|Mare de Déu de Ger]] is also of willow.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 44]]
