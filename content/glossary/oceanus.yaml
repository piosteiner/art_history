description_md: |-
  Oceanus is the Titan of the great river encircling the world.

  **In art:** A bearded giant riding a shell chariot drawn by sea horses.

  **Famous works**

  - Nicola Salvi and Pietro Bracci, *Trevi Fountain* (Oceanus at the centre, Rome)

  *From:* Greek mythology · Ancient Greek
