name: Electra
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the daughter of Agamemnon, who mourned her murdered father and helped her brother Orestes avenge him.
description_md: |-
  The children of [[agamemnon]]. Electra mourned her murdered father for years and waited for her brother [[orestes]] to return from exile and avenge him. Together, they killed their mother [[clytemnestra]] and her lover Aegisthus (Orestes strikes the blows; how far Electra takes part differs between Aeschylus, Sophocles and [[person/euripides]]).

  **In art:** A grieving young woman at a tomb.

  **Famous works**

  - Frederic Leighton, *Electra at the Tomb of Agamemnon* (Ferens Art Gallery, Hull)
  - *Orestes and Electra* (Roman marble group, Naples)

  *From:* Greek mythology · Ancient Greek
