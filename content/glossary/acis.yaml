name: Acis
names: [Acis and Galatea]
category: mythology and legend
definition: In Ovid's Metamorphoses, the shepherd loved by the nereid Galatea, crushed by the jealous Cyclops Polyphemus and turned into a river.
description_md: |-
  Acis, the lover of the nereid [[galatea]], was crushed by the jealous [[polyphemus]] and turned into a river.

  *From:* Ovid, Metamorphoses · Ancient Greek
