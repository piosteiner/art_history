public_id: 131472
name: Basat
category: mythology and legend
definition: The hero of the Book of Dede Korkut who blinded the one-eyed giant Tepegöz with a red-hot spit and escaped from his cave in a ramskin.
description_md: |-
  The Oghuz Polyphemus. He was born to a shepherd and a fairy and was given two men and five hundred sheep to eat every day. The hero Basat blinded him with a red-hot spit and escaped from his cave by wearing a ramskin.

  *From:* Book of Dede Korkut · Oghuz Turkic
