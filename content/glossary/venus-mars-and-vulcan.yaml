name: Venus, Mars and Vulcan
category: mythology and legend
also_in: [iconography]
definition: The story of Vulcan catching his wife Venus and her lover Mars in an invisible net and calling the gods to laugh at them (told in Homer's Odyssey, Book 8, and by Ovid).
description_md: |-
  Vulcan discovered that his wife Venus was having an affair with Mars. He forged an invisible net, caught the lovers in bed and called the other gods to laugh at them.

  **In art:** Lovers caught in a net, with gods laughing, or Vulcan searching the bed while Mars hides under it.

  **Famous works**

  - Tintoretto, *Venus, Mars and Vulcan* (Alte Pinakothek, Munich)
  - Alexandre Charles Guillemot, *Mars and Venus Surprised by Vulcan* (Indianapolis)

  *From:* Homer, Odyssey; Ovid, Metamorphoses · Ancient Greek
