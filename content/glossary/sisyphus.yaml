definition: In Greek myth the man who cheated death and must roll a boulder up a hill for ever in Tartarus.
description_md: |-
  Four men punished forever in Tartarus. Sisyphus cheated death, and must roll a boulder up a hill that always rolls back down.

  **In art:** A man pushing a boulder uphill.

  **Famous works**

  - [[artist/titian]], *Sisyphus* (Prado, from the *Furias* series)

  *From:* Greek mythology · Ancient Greek
