public_id: 131279
name: Iphis
category: mythology and legend
definition: In Ovid's Metamorphoses, a girl raised secretly as a boy, whom the goddess Isis turned into a man just before her wedding to Ianthe.
description_md: |-
  Her father wanted a son, so her mother raised her secretly as a boy. When she was engaged to the girl Ianthe, whom she truly loved, the goddess Isis turned her into a man just before the wedding.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
