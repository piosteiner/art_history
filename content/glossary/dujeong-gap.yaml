definition: 'Joseon armour: scales of iron or leather nailed with iron nails inside a coat shaped like a robe, so that from outside only the nail heads (dujeong) show; first recorded in the "Illustrated Treatise on Weapons" of the Gukjo oryeui seorye, published under King Seongjong.'
