name: The Town Mouse and the Country Mouse
category: mythology and legend
definition: Aesop's fable of a country mouse who, after a feast in the city interrupted by barking hounds (a cat in many later retellings), prefers a simple life in peace to riches and fear.
description_md: |-
  The town mouse mocked his country cousin's simple food. In the city, they ate a feast, but were chased off by barking hounds (in Horace's telling; a cat in many later retellings). The country mouse went home, preferring a simple life in peace to riches and fear.

  *From:* Aesop's Fables · Ancient Greek
