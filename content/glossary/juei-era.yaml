definition: "Japanese era name (寿永) for the years 1182–1184: 1182 is Juei 1 (元年) and Juei 3 is 1184."
description_md: |-
  **Juei** (寿永) is a Japanese era name ([[nengo]]), proclaimed in 1182. Its years are counted in lunar years from the new year before the proclamation: 1182 is Juei 1 (元年), 1184 its last year, Juei 3. A Japanese source dates a year within it as "Juei 2" (寿永2年) rather than by a continuous count.

  Before: [[yowa-era|Yōwa]]. After: [[genryaku-era|Genryaku]].
