name: Cincinnatus
category: mythology and legend
also_in: [iconography]
definition: The Roman farmer called from his plough to be dictator, who gave up power after 16 days and went home; a symbol of civic virtue.
description_md: |-
  A Roman farmer called from his plough to be dictator in a crisis. After defeating the enemy in 16 days, he gave up absolute power and went home to his farm. He became a symbol of civic virtue.

  **In art:** A farmer at his plough receiving envoys from the Senate.

  **Famous works**

  - Juan Antonio Ribera, *Cincinnatus Leaves the Plough to Dictate Laws to Rome* (Prado)

  *From:* Livy, History of Rome · Ancient Roman
