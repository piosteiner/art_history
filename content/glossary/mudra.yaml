name: Mudra
names: [Dhyana mudra, Bhumisparsha mudra, Abhaya mudra, Varada mudra, Dharmachakra mudra, Vitarka mudra]
category: iconography
definition: "The symbolic hand gestures that show what a Buddha or bodhisattva is doing: meditating, calling the earth to witness, protecting, giving, teaching."
description_md: |-
  Symbolic hand gestures that show what a Buddha or bodhisattva is doing.

  **In art:** *Dhyana* mudra: hands resting in the lap, palms up (meditation). *Bhumisparsha* mudra: the right hand touching the ground (calling the earth to witness his enlightenment). *Abhaya* mudra: the right hand raised, palm out ("fear not", protection). *Varada* mudra: the hand lowered, palm out (giving, compassion). *Dharmachakra* mudra: both hands at the chest, forming circles (turning the Wheel of the Law, teaching). *Vitarka* mudra: thumb and index finger forming a circle (discussion, teaching).

  *From:* Buddhist
