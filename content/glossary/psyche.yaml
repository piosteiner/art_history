name: Psyche
names: [Cupid and Psyche]
category: mythology and legend
also_in: [iconography]
definition: The mortal beloved of Cupid, who lost him by lighting a lamp to see his face and won him back through Venus's impossible tasks; her name means both "soul" and "butterfly" in Greek.
description_md: |-
  Psyche was a mortal so beautiful that [[aphrodite|Venus]] grew jealous and sent [[eros|Cupid]] to make her fall in love with a hideous, wretched man. Instead, he fell in love with her himself and visited her only in the dark, forbidding her to see his face. When she lit a lamp to look, a drop of oil woke him and he fled. After a series of impossible tasks set by Venus, including a journey to the Underworld, she was reunited with him and made immortal.

  **In art:** A young woman holding an oil lamp over a sleeping winged youth, or the lovers embracing. Psyche sometimes has butterfly wings (*psyche* means both "soul" and "butterfly" in Greek).

  **Famous works**

  - Canova, *Psyche Revived by Cupid's Kiss* (Louvre)
  - [[artist/raphael]] and workshop, *Loggia of Cupid and Psyche* (Villa Farnesina, Rome)
  - François Gérard, *Psyche and Amor* (Louvre)
  - Bouguereau, *The Abduction of Psyche*

  *From:* Apuleius, The Golden Ass · Ancient Roman
