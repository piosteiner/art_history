name: Mae Nak
names: [Mae Nak Phra Khanong]
category: mythology and legend
definition: "Thailand's most famous ghost: a wife who died in childbirth while her husband was at war and waited for him as if nothing had happened."
description_md: |-
  While her husband Mak was away at war, Nak died giving birth along with her baby. When he came home, she was waiting for him as if nothing had happened. When he saw her stretch her arm impossibly long to pick up a lime that had fallen under the house, he realised she was a ghost and fled.

  *From:* Thai folklore · Thai
