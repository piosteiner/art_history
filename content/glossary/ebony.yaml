description_md: |-
  Ebony (ancient Egyptian hbnj, Greek ἔβενος, Latin (h)ebenus, botanically Diospyros) is the wood of evergreen trees up to 30 m high with trunks up to 1.3 m in diameter, native to Sri Lanka and southern India, with related species in Madagascar and Cameroon [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 46]]. Its heartwood is hard, heavy and dark brown to black, its sapwood light [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 46]].

  In the lecture ebony stood for tropical woods as the "wrapping" of European luxury furniture in the colonial period [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]]. Cabinets of the seventeenth century were veneered with ebony over a carcass of cheaper wood — walnut, oak or softwood — as in an Augsburg [[artwork/augsburger-hausaltar-kabinettschrank-bnm|house-altar cabinet]] of about 1600, the [[artwork/pommerscher-kunstschrank|Pomeranian Kunstschrank]] (1610–1617), an [[artwork/antwerpener-kabinettschrank-rijksmuseum|Antwerp cabinet]] of about 1650 and [[artist/pierre-gole|Pierre Gole]]'s [[artwork/gole-kabinett-rijksmuseum|cabinet]] (1645–1650) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 38, 47, 51, 53]]. In Italian Renaissance intarsia, by contrast, black tones were usually obtained from native bog oak, oak darkened by long storage in peat bogs [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]].
