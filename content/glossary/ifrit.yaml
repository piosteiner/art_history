public_id: 130850
name: Ifrit
category: mythology and legend
definition: In Arabic tales, a fiery, cunning and powerful kind of jinn or demon, that can be shut in jars or bound by magic rings.
description_md: |-
  Ifrits are among the most powerful jinn or demons in Arabic tales, associated with smoke and fire. In *One Thousand and One Nights*, they appear as huge, dangerous beings that can be trapped in jars or commanded with magic rings, grant power, or take terrible revenge.

  *From:* Arabic folklore; One Thousand and One Nights · Arabic
