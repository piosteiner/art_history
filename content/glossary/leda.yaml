name: Leda
names: [Leda and the Swan]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the Spartan queen seduced by Zeus in the form of a swan; from her eggs hatched, in the common version, Helen, Clytemnestra, and Castor and Pollux (other versions differ).
description_md: |-
  A Spartan queen seduced by [[zeus]] in the form of a swan. In the common version she laid eggs from which [[helen-of-troy|Helen]], [[clytemnestra]], and [[castor-and-pollux]] hatched; some accounts mention no eggs.

  **In art:** A woman embracing a swan, sometimes with hatching eggs and babies.

  **Famous works**

  - [[artist/leonardo-da-vinci]], *Leda and the Swan* (lost, known from copies)
  - [[artist/michelangelo]], *Leda* (lost, known from copies)
  - Correggio, *Leda and the Swan* (Gemäldegalerie, Berlin)
  - [[artist/salvador-dali]], *Leda Atomica*

  *From:* Greek mythology · Ancient Greek
