name: Xiantian
names:
  - lang: zh
    role: original
    text: 先天
category: calendar
definition: "Chinese era name (先天) of the Tang for the years 712–713: 712 is Xiantian 1 (元年) and Xiantian 2 is 713."
description_md: |-
  **Xiantian** (先天) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 712 under Emperor Xuanzong (玄宗). Its years are counted in lunar years: 712 is Xiantian 1 (元年), 713 its last year, Xiantian 2. A Chinese source dates a year within it as "Xiantian 2" (先天二年) rather than by a continuous count.

  Before: [[yanhe-era|Yanhe]]. After: [[kaiyuan-era|Kaiyuan]].
sources:
