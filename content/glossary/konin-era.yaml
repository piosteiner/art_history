definition: "Japanese era name (弘仁) for the years 810–823: 810 is Kōnin 1 (元年) and Kōnin 14 is 823."
description_md: |-
  **Kōnin** (弘仁) is a Japanese era name ([[nengo]]), proclaimed in 810. Its years are counted in lunar years from the new year before the proclamation: 810 is Kōnin 1 (元年), 823 its last year, Kōnin 14. A Japanese source dates a year within it as "Kōnin 2" (弘仁2年) rather than by a continuous count.

  Before: [[daido-era|Daidō]]. After: [[tencho-era|Tenchō]].
