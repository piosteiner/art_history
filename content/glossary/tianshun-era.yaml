definition: "Chinese era name (天順) of the Ming for the years 1457–1464: 1457 is Tianshun 1 (元年) and Tianshun 8 is 1464."
description_md: |-
  **Tianshun** (天順) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1457 by Emperor Yingzong on his return to the throne; his first reign had been the Zhengtong era. Its years are counted in lunar years: 1457 is Tianshun 1 (元年), 1464 its last year, Tianshun 8. A Chinese source dates a year within it as "Tianshun 2" (天順二年) rather than by a continuous count.

  Before: [[jingtai-era|Jingtai]]. After: [[chenghua-era|Chenghua]].
