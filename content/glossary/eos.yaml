definition: In Greek myth the goddess of the dawn, who opens the gates of heaven each morning for the sun; the Romans called her Aurora.
description_md: |-
  Goddess of the dawn, who opens the gates of heaven each morning for the sun.

  **In art:** A winged or rosy-fingered woman scattering flowers before the sun chariot.

  **Famous works**

  - [[artist/guido-reni]], *Aurora* (ceiling fresco, Casino Rospigliosi, Rome)
  - [[artist/guercino]], *Aurora* (Casino Ludovisi)

  *From:* Greek mythology · Ancient Greek
