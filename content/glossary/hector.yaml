name: Hector
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the noble prince and greatest warrior of Troy, killed by Achilles, whose body his father Priam begged back.
description_md: |-
  Hector was the noble prince and greatest warrior of Troy. His farewell to his wife [[andromache]] and baby son before his last battle is one of the most moving scenes in [[person/homer]]. [[achilles]] killed him and dragged his body around the walls of Troy, until Hector's old father, King [[priam]], came at night, guided by [[hermes]], to beg for it.

  **In art:** A warrior saying farewell to his wife and child, or Priam kneeling before Achilles.

  **Famous works**

  - [[artist/giorgio-de-chirico]], *Hector and Andromache*
  - Alexander Ivanov, *Priam Asking Achilles to Return Hector's Body* (1824)

  *From:* Homer, Iliad · Ancient Greek
