public_id: 113345
name: Beolhyu Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 벌휴이사금
  - lang: ko-Hani
    role: alternative
    text: 伐休尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Beolhyu Isageum of Silla (伐休尼師今, 벌휴이사금), by which Korean histories date 184–196: 184 is Beolhyu Isageum 1, 196 Beolhyu Isageum 13."
description_md: |-
  **Beolhyu Isageum** (伐休尼師今, 벌휴이사금): the years of the reign of Beolhyu Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 193 is Beolhyu Isageum 10 (벌휴이사금 10년). The year of the accession, 184, counts as the first year.

  Before: [[adalla-isageum-silla-reign-years|Adalla Isageum]]. After: [[nahae-isageum-silla-reign-years|Nahae Isageum]].
sources:
  definition:
    - source: dila-time-authority
