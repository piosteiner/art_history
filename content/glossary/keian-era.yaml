definition: "Japanese era name (慶安) for the years 1648–1652: 1648 is Keian 1 (元年) and Keian 5 is 1652."
description_md: |-
  **Keian** (慶安) is a Japanese era name ([[nengo]]), proclaimed in 1648. Its years are counted in lunar years from the new year before the proclamation: 1648 is Keian 1 (元年), 1652 its last year, Keian 5. A Japanese source dates a year within it as "Keian 2" (慶安2年) rather than by a continuous count.

  Before: Shōhō. After: [[joo-era-1652|Jōō]].
