name: Heonjong (reign years)
names:
  - lang: ko
    role: original
    text: 헌종
  - lang: ko-Hani
    role: alternative
    text: 憲宗
category: calendar
definition: "The reign years of Heonjong of Joseon (憲宗, 헌종), by which Korean sources date 1835–1849: 1835 is Heonjong 1, 1849 Heonjong 15."
description_md: |-
  **Heonjong** (憲宗, 헌종): the years of the reign of [[person/heonjong-of-joseon|Heonjong of Joseon]], who came to the throne on 18 November 1834. Korean sources count years by the reigning king ([[korean-reign-years]]): 1844 is Heonjong 10 (헌종 10년). His first year is 1835, the year after his accession; the rest of 1834 still counts for his predecessor.

  Before: [[sunjo-reign-years|Sunjo]]. After: [[cheoljong-reign-years|Cheoljong]].
