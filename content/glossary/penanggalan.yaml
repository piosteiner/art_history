public_id: 130995
name: Penanggalan
category: mythology and legend
definition: "A creature of Malay folklore: a woman whose head detaches at night and flies off with her entrails dangling beneath, to feed on blood, especially that of newborns and mothers."
description_md: |-
  The penanggalan is one of the most horrifying creatures of Malay folklore: a woman who, at night, detaches her head from her body and flies off with her entrails dangling below. She feeds on blood, especially that of newborns and mothers. Afterwards, she soaks her organs in vinegar to shrink them back into her body, and people planted thorny plants around their houses to snag her.

  *From:* folklore · Malay
