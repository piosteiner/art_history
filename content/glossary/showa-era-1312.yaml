category: calendar
definition: "Japanese era name (正和) for the years 1312–1317: 1312 is Shōwa 1 (元年) and Shōwa 6 is 1317."
description_md: |-
  **Shōwa** (正和) is a Japanese era name ([[nengo]]), proclaimed in 1312. Its years are counted in lunar years from the new year before the proclamation: 1312 is Shōwa 1 (元年), 1317 its last year, Shōwa 6. A Japanese source dates a year within it as "Shōwa 2" (正和2年) rather than by a continuous count.

  Before: [[ocho-era|Ōchō]]. After: [[bunpo-era|Bunpō]].
