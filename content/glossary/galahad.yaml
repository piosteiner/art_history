definition: Lancelot's son, the purest Knight of the Round Table, the only one granted the full vision of the Holy Grail.
description_md: |-
  In most versions since Robert de Boron, the [[holy-grail|Grail]] is the cup Christ used at the [[last-supper]], which disappeared and was sought by the knights. Only the purest knight, Sir Galahad, [[lancelot]]'s son, was finally granted its full vision, with [[percival|Perceval]] and Bors beside him.

  **In art:** A knight in white or shining armour kneeling before a glowing chalice held by angels or a maiden.

  **Famous works**

  - George Frederic Watts, *Sir Galahad* (Harvard)
  - [[artist/edward-burne-jones]], [[artist/william-morris]] and John Henry Dearle (Morris & Co.), *Holy Grail tapestries* (some hangings of the later weavings in Birmingham Museum and Art Gallery)
  - Edwin Austin Abbey, *The Quest and Achievement of the Holy Grail* (murals, Boston Public Library)

  *From:* Arthurian legend · British (Arthurian legend)
