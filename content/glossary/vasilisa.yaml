name: Vasilisa
names: [Vasilisa the Beautiful]
category: mythology and legend
definition: The heroine of the Russian fairy tale who survived Baba Yaga's impossible tasks with the help of her dead mother's magic doll.
description_md: |-
  Vasilisa's dying mother gave her a tiny magic doll. Her cruel stepmother later sent her into the forest to fetch fire from [[baba-yaga]], hoping she would never return. The witch set impossible tasks, like sorting poppy seeds from soil overnight, and the doll did them while Vasilisa slept. Baba Yaga, baffled and impressed, sent her home with a skull-lantern whose burning eyes turned the wicked stepmother and stepsisters to ash.

  *From:* Russian fairy tale "Vasilisa the Beautiful" · Russian
