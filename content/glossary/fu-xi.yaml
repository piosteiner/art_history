definition: With Nüwa, the legendary creator pair of China; he taught humans hunting, fishing and writing and invented the eight trigrams of the I Ching.
description_md: |-
  The legendary creator pair: Nüwa and her brother and husband Fu Xi, who taught humans hunting, fishing and writing, and invented the eight trigrams of the *I Ching*.

  **In art:** A man and a woman with entwined serpent tails, holding a set square and a compass, under the sun and moon.

  **Famous works**

  - *Fu Xi and Nüwa* (silk paintings from Astana tombs, Turfan, Xinjiang, Tang dynasty)
  - *Han dynasty tomb reliefs* (Wu Liang Shrine, Shandong)

  *From:* Chinese
