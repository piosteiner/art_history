category: calendar
definition: "Japanese era name (慶長) for the years 1596–1615: 1596 is Keichō 1 (元年) and Keichō 20 is 1615."
description_md: |-
  **Keichō** (慶長) is a Japanese era name ([[nengo]]), proclaimed in 1596. Its years are counted in lunar years from the new year before the proclamation: 1596 is Keichō 1 (元年), 1615 its last year, Keichō 20. A Japanese source dates a year within it as "Keichō 2" (慶長2年) rather than by a continuous count.

  Before: [[bunroku-era|Bunroku]]. After: [[genna-era|Genna]].
