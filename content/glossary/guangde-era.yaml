public_id: 113094
name: Guangde
names:
  - lang: zh
    role: original
    text: 廣德
category: calendar
definition: "Chinese era name (廣德) of the Tang for the years 763–764: 763 is Guangde 1 (元年) and Guangde 2 is 764."
description_md: |-
  **Guangde** (廣德) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 763 under Emperor Daizong (代宗). Its years are counted in lunar years: 763 is Guangde 1 (元年), 764 its last year, Guangde 2. A Chinese source dates a year within it as "Guangde 2" (廣德二年) rather than by a continuous count.

  Before: [[baoying-era|Baoying]]. After: [[yongtai-era|Yongtai]].
sources:
  definition:
    - source: dila-time-authority
