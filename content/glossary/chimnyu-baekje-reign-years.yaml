public_id: 113258
name: Chimnyu of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 침류왕
  - lang: ko-Hani
    role: alternative
    text: 枕流王
category: calendar
definition: "The reign years of King Chimnyu of Baekje (枕流王, 침류왕), by which Korean histories date 384–385: 384 is Chimnyu 1, 385 Chimnyu 2."
description_md: |-
  **Chimnyu** (枕流王, 침류왕): the years of the reign of King Chimnyu of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 385 is Chimnyu 2 (침류왕 2년). The year of the accession, 384, counts as the first year.

  Before: [[geungusu-baekje-reign-years|Geungusu]]. After: [[jinsa-baekje-reign-years|Jinsa]].
sources:
  definition:
    - source: dila-time-authority
