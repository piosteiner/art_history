public_id: 130852
name: Marid
category: mythology and legend
definition: In Arabic folklore, a rebellious and, by some accounts, mightiest kind of jinn, sometimes linked to water and the sea, rebellious and hard to bind.
description_md: |-
  Marids are described by some (e.g. Lane) as the most powerful of the jinn, by others as below the ifrit, sometimes linked to water and the sea. In stories they are rebellious, hard to bind, and dangerous to anyone who tries to command them.

  *From:* Arabic folklore · Arabic
