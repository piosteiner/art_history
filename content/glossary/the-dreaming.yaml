definition: The English term for the Aboriginal Australian understanding of how the land, its creatures, its laws and its people came to be through the journeys of ancestral beings.
description_md: |-
  The Dreaming (or Dreamtime) is the English term for the Aboriginal understanding of how the land, its creatures, its laws and its people came to be, through the journeys of ancestral beings across the country. These stories are tied to specific places and peoples, and they are more than tales: they hold law, kinship and knowledge of the land, and are part of one of the oldest continuous cultures on earth.

  **Held sacred today:** Many Dreaming stories are sacred and belong to particular communities, and there are rules about who may hear or tell them. For that reason, this doc doesn't retell individual ones. The best way to learn is from Aboriginal-led sources, such as stories that communities have chosen to share publicly, or resources from AIATSIS (the Australian Institute of Aboriginal and Torres Strait Islander Studies).

  *From:* Aboriginal Australian traditions · Aboriginal Australian
