name: Enkidu
category: mythology and legend
definition: In the Epic of Gilgamesh, the wild man created from clay who lived among the animals and became Gilgamesh's truest friend; his death drives the hero's quest.
description_md: |-
  Enkidu was created by the gods out of clay and lived wild among the animals, running with gazelles and freeing beasts from hunters' traps. He was brought into civilisation, fought [[gilgamesh]] in an epic wrestling match, and the two became inseparable. His death, sent by the gods as punishment, is one of the most moving moments in ancient literature.

  Created from clay, he lived with the animals and ate grass with the gazelles, until [[shamhat]] taught him to be human. The gods made him die of illness as punishment for killing the Bull of Heaven and [[humbaba]].

  *From:* Epic of Gilgamesh · Mesopotamian
