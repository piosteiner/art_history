definition: "Chinese era name (康熙) of the Qing for the years 1662–1722: 1662 is Kangxi 1 (元年) and Kangxi 61 is 1722."
description_md: |-
  **Kangxi** (康熙) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1662. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Kangxi Emperor. Its years are counted in lunar years: 1662 is Kangxi 1 (元年), 1722 its last year, Kangxi 61. A Chinese source dates a year within it as "Kangxi 2" (康熙二年) rather than by a continuous count.

  Before: [[shunzhi-era|Shunzhi]]. After: [[yongzheng-era|Yongzheng]].
