name: Atalanta
category: mythology and legend
definition: A huntress of Greek myth, abandoned as a baby and nursed by a she-bear, who drew first blood in the Calydonian boar hunt and was won in a footrace by a suitor who dropped three golden apples.
description_md: |-
  Atalanta's father wanted a son, so he left her on a mountain to die. A she-bear nursed her, and she grew up in the wild to become a better hunter than most heroes. She drew first blood in the great Calydonian boar hunt, killed centaurs who attacked her, and beat the hero Peleus at wrestling. She swore to marry only a man who could outrun her, and suitors who lost were killed. Melanion ([[hippomenes]] in [[person/ovid]]'s version) finally won by dropping three golden apples during the race, which she couldn't resist stopping to pick up.

  *From:* Greek mythology · Ancient Greek
