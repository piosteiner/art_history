definition: In Greek myth the virgin goddess of the hunt, wild animals and (from Roman times) the moon, Apollo's twin sister; the Romans called her Diana.
description_md: |-
  Goddess of the hunt, wild animals and (from Roman times) the moon, [[apollo]]'s twin sister, a virgin goddess.

  **In art:** A young huntress with bow and quiver, a crescent moon on her forehead, hounds or a deer, often bathing with her nymphs.

  **Famous works**

  - *Diana of Versailles* (Louvre)
  - [[artist/titian]], *Diana and Actaeon* and *Diana and Callisto* (National Gallery, London, and National Galleries of Scotland, Edinburgh)
  - Boucher, *Diana Leaving Her Bath* (Louvre, Paris)

  *From:* Greek mythology · Ancient Greek
