definition: The fourteenth-century novel (attributed to Shi Nai'an) of 108 outlaws at Mount Liang who fight corrupt officials; Kuniyoshi's prints of its tattooed heroes started a craze in Japan.
description_md: |-
  A 14th-century novel about 108 outlaws who gather at Mount Liang to fight corrupt officials, including the tiger-killer Wu Song and the tattooed monk Lu Zhishen. In Japan, Kuniyoshi's print series of its heroes, covered in tattoos, started a craze for full-body tattoos.

  **In art:** Muscular, tattooed warriors fighting tigers or enemies.

  **Famous works**

  - [[artist/utagawa-kuniyoshi]], *One Hundred and Eight Heroes of the Popular Shuihuzhuan* (print series, 1827–1830)
  - Chen Hongshou, *Water Margin playing card designs*

  *From:* Water Margin · Chinese
