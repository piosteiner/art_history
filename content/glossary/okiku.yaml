name: Okiku
category: mythology and legend
also_in: [iconography]
definition: The ghost of a servant killed and thrown into a well, who counts plates every night and screams when she reaches nine.
description_md: |-
  Okiku, a servant, was killed and thrown down a well after being falsely accused of losing one of ten precious plates (in the folk version; in Okamoto Kidō's 1916 play she breaks one herself). Her ghost counts the plates every night and screams when she reaches nine (the missing tenth one).

  **In art:** A pale woman with long loose hair rising from a well.

  **Famous works**

  - [[artist/katsushika-hokusai]], *One Hundred Ghost Stories* (Okiku rising from a well)

  *From:* Banchō Sarayashiki · Japanese
