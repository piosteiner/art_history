name: Incredulity of Saint Thomas
names: [Doubting Thomas, The Incredulity of Saint Thomas]
category: iconography
definition: The apostle Thomas placing his finger in Christ's wound, the origin of "doubting Thomas".
description_md: |-
  The apostle Thomas refused to believe in the Resurrection until he could touch Christ's wounds. Christ invited him to place his finger in the wound in his side (the Gospel does not say that he did; art shows him doing it). The origin of "doubting Thomas".

  **In art:** A man pushing his finger into the wound in Christ's side.

  **Famous works**

  - [[artist/caravaggio]], *The Incredulity of Saint Thomas* (Potsdam)
  - [[artist/andrea-del-verrocchio]], *Christ and Saint Thomas* (Orsanmichele, Florence)

  *From:* New Testament, Gospels · Christian
