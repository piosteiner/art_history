definition: "Japanese era name (康平) for the years 1058–1065: 1058 is Kōhei 1 (元年) and Kōhei 8 is 1065."
description_md: |-
  **Kōhei** (康平) is a Japanese era name ([[nengo]]), proclaimed in 1058. Its years are counted in lunar years from the new year before the proclamation: 1058 is Kōhei 1 (元年), 1065 its last year, Kōhei 8. A Japanese source dates a year within it as "Kōhei 2" (康平2年) rather than by a continuous count.

  Before: [[tengi-era|Tengi]]. After: [[jiryaku-era|Jiryaku]].
