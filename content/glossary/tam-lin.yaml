public_id: 131160
name: Tam Lin
category: mythology and legend
definition: The young man taken by the Fairy Queen in the Scottish ballad, rescued by Janet on Halloween night by pulling him from his horse in the fairy procession and holding on while he was turned into a snake, a lion and a burning coal.
description_md: |-
  Janet rescued Tam Lin on Halloween night by pulling him from his horse in the fairy procession and holding on to him while the fairies turned him into a snake, a lion, a burning coal and more.

  *From:* Scottish ballad · Scottish
