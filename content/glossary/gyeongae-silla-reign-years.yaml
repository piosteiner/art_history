public_id: 113391
name: Gyeongae of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 경애왕
  - lang: ko-Hani
    role: alternative
    text: 景哀王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gyeongae of Silla (景哀王, 경애왕), by which Korean histories date 924–927: 924 is Gyeongae 1, 927 Gyeongae 4."
description_md: |-
  **Gyeongae** (景哀王, 경애왕): the years of the reign of King Gyeongae of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 927 is Gyeongae 4 (경애왕 4년). The year of the accession, 924, counts as the first year.

  Before: [[gyeongmyeong-silla-reign-years|Gyeongmyeong]]. After: [[gyeongsun-silla-reign-years|Gyeongsun]].
sources:
  definition:
    - source: dila-time-authority
