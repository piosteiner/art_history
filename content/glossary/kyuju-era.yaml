definition: "Japanese era name (久寿) for the years 1154–1156: 1154 is Kyūju 1 (元年) and Kyūju 3 is 1156."
description_md: |-
  **Kyūju** (久寿) is a Japanese era name ([[nengo]]), proclaimed in 1154. Its years are counted in lunar years from the new year before the proclamation: 1154 is Kyūju 1 (元年), 1156 its last year, Kyūju 3. A Japanese source dates a year within it as "Kyūju 2" (久寿2年) rather than by a continuous count.

  Before: [[ninpei-era|Ninpei]]. After: [[hogen-era|Hōgen]].
