public_id: 113073
name: Tiance Wansui
names:
  - lang: zh
    role: original
    text: 天冊萬歲
category: calendar
definition: "Chinese era name (天冊萬歲) of the Zhou of Empress Wu for the year 695: 695 is Tiance Wansui 1 (元年), its only year."
description_md: |-
  **Tiance Wansui** (天冊萬歲) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 695 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 695 is Tiance Wansui 1 (元年), its only year.

  Before: [[zhengsheng-era|Zhengsheng]]. After: [[wansui-dengfeng-era|Wansui Dengfeng]].
sources:
  definition:
    - source: dila-time-authority
