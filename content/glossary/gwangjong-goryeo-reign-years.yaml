public_id: 113306
name: Gwangjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 광종
  - lang: ko-Hani
    role: alternative
    text: 光宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Gwangjong of Goryeo (光宗, 광종), by which Korean histories date 950–975: 950 is Gwangjong 1, 975 Gwangjong 26."
description_md: |-
  **Gwangjong** (光宗, 광종): the years of the reign of King Gwangjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 959 is Gwangjong 10 (광종 10년). The year of the accession, 950, counts as the first year.

  Before: [[jeongjong-goryeo-reign-years|Jeongjong]]. After: [[gyeongjong-goryeo-reign-years|Gyeongjong]].
sources:
  definition:
    - source: dila-time-authority
