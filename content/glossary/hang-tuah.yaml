name: Hang Tuah
category: mythology and legend
definition: The legendary warrior and admiral of the 15th-century Malacca Sultanate, hero of the Malay epic Hikayat Hang Tuah, whose absolute loyalty to his sultan led him to kill his closest friend, Hang Jebat.
description_md: |-
  Hang Tuah was the greatest warrior of the Malacca Sultanate in the 15th century, admiral to the Sultan, and the hero of the *Hikayat Hang Tuah*. He and his four sworn brothers were inseparable. When Hang Tuah was unjustly condemned, his closest friend [[hang-jebat]] ran amok in the palace to avenge him. But Hang Tuah had been secretly hidden by the Bendahara, who brought him back; the Sultan pardoned him and ordered him to kill Jebat. Choosing absolute loyalty to his ruler over loyalty to his friend, he did. The saying "Never shall the Malays vanish from the earth", popularly attributed to him, became a national motto; it is not in the Hikayat and was popularised in 1950 by Abdul Samad Ahmad.

  *From:* Hikayat Hang Tuah · Malay
