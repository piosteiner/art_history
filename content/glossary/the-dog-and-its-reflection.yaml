public_id: 131255
name: The Dog and Its Reflection
category: mythology and legend
definition: Aesop's fable of a dog who snaps at his own reflection's bigger piece of meat and drops his own into the water.
description_md: |-
  A dog carrying a piece of meat (a bone in later retellings) looked into a stream and saw another dog with something bigger. He snapped at it and dropped his own into the water.

  *From:* Aesop's Fables · Ancient Greek
