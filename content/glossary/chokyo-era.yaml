definition: "Japanese era name (長享) for the years 1487–1489: 1487 is Chōkyō 1 (元年) and Chōkyō 3 is 1489."
description_md: |-
  **Chōkyō** (長享) is a Japanese era name ([[nengo]]), proclaimed in 1487. Its years are counted in lunar years from the new year before the proclamation: 1487 is Chōkyō 1 (元年), 1489 its last year, Chōkyō 3. A Japanese source dates a year within it as "Chōkyō 2" (長享2年) rather than by a continuous count.

  Before: [[bunmei-era|Bunmei]]. After: [[entoku-era|Entoku]].
