name: The Ages of Man
names: [Stages of life]
category: iconography
definition: The stages of human life, from infancy to old age, usually three, four, seven or, on the staircase of life, ten, often shown as a row of figures or a staircase of life.
description_md: |-
  The stages of human life, from infancy to old age, usually three, four, seven or, on the staircase of life, ten.

  **In art:** A row of figures of different ages, or a staircase of life rising and falling. Death often waits at the end.

  **Famous works**

  - [[artist/titian]], *The Three Ages of Man* (c. 1512–1514, Scottish National Gallery, Edinburgh)
  - [[artist/gustav-klimt]], *The Three Ages of Woman* (1905, Galleria Nazionale d'Arte Moderna, Rome)
  - Hans Baldung Grien, *The Three Ages of Woman and Death* (c. 1509–1510, Kunsthistorisches Museum, Vienna)
  - [[artist/caspar-david-friedrich]], *The Stages of Life* (1835, Museum der bildenden Künste, Leipzig)

  *From:* European
