public_id: 132258
name: Mordred
category: mythology and legend
definition: King Arthur's treacherous nephew (or son), who seized the throne and the queen; he fell at the Battle of Camlann, where Arthur was mortally wounded.
description_md: |-
  Mordred, [[king-arthur|Arthur]]'s treacherous nephew (or son), seized the throne and his queen while Arthur was away, and at the Battle of Camlann Arthur killed him but was himself mortally wounded (in Geoffrey of Monmouth he is carried to Avalon).

  *From:* Arthurian legend · British (Arthurian legend)
