definition: "Japanese era name (元禄) for the years 1688–1704: 1688 is Genroku 1 (元年) and Genroku 17 is 1704."
description_md: |-
  **Genroku** (元禄) is a Japanese era name ([[nengo]]), proclaimed in 1688. Its years are counted in lunar years from the new year before the proclamation: 1688 is Genroku 1 (元年), 1704 its last year, Genroku 17. A Japanese source dates a year within it as "Genroku 2" (元禄2年) rather than by a continuous count.

  Before: [[jokyo-era|Jōkyō]]. After: [[hoei-era|Hōei]].
