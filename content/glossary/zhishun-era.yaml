name: Zhishun
names:
  - lang: zh
    role: original
    text: 至順
category: calendar
parent: chinese-calendar
definition: "Chinese era name (至順) of the Yuan for the years 1330–1333: 1330 is Zhishun 1 (元年) and Zhishun 4 is 1333."
description_md: |-
  **Zhishun** (至順) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1330 under Tugh Temür (文宗). Its years are counted in lunar years: 1330 is Zhishun 1 (元年), 1333 its last year, Zhishun 4. A Chinese source dates a year within it as "Zhishun 2" (至順二年) rather than by a continuous count.

  Before: [[tianli-era|Tianli]]. After: [[yuantong-era|Yuantong]].
sources:
  definition:
