name: Koschei the Deathless
names: [Koschei, Koshchei]
category: mythology and legend
definition: The skeletal, immortal sorcerer of Russian fairy tales who kidnaps brides; his death is hidden in a needle inside an egg, inside a duck, inside a hare, in an iron chest under an oak.
description_md: |-
  Koschei is the great villain of Russian fairy tales, a skeletal, immortal sorcerer who kidnaps brides and cannot be killed by any sword. His secret is that his death is not in his body. It's hidden in a needle, inside an egg, inside a duck, inside a hare, locked in an iron chest buried under an oak tree on a distant island. Only a hero who finds and breaks the needle (or, in other versions, the egg) can end him.

  *From:* Russian fairy tales (skazki) · Russian
