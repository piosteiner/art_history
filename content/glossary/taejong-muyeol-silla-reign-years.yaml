public_id: 113365
name: Taejong Muyeol of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 태종무열왕
  - lang: ko-Hani
    role: alternative
    text: 太宗武烈王
category: calendar
definition: "The reign years of King Taejong Muyeol of Silla (太宗武烈王, 태종무열왕), by which Korean histories date 654–661: 654 is Taejong Muyeol 1, 661 Taejong Muyeol 8."
description_md: |-
  **Taejong Muyeol** (太宗武烈王, 태종무열왕): the years of the reign of King Taejong Muyeol of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 661 is Taejong Muyeol 8 (태종무열왕 8년). The year of the accession, 654, counts as the first year.

  Before: [[jindeok-silla-reign-years|Jindeok]]. After: [[munmu-silla-reign-years|Munmu]].
sources:
  definition:
    - source: dila-time-authority
