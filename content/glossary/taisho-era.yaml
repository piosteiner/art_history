definition: "Japanese era name (大正) for the years 1912–1926: 1912 is Taishō 1 (元年) and Taishō 15 is 1926."
description_md: |-
  **Taishō** (大正) is a Japanese era name ([[nengo]]), proclaimed in 1912. Its years are counted in lunar years from the new year before the proclamation: 1912 is Taishō 1 (元年), 1926 its last year, Taishō 15. A Japanese source dates a year within it as "Taishō 2" (大正2年) rather than by a continuous count. Since 1868 an era is that of an emperor ([[one-reign-one-era]]): Taishō is the era of [[person/emperor-taisho|Emperor Taishō]], who is called after it since his death.

  Before: [[meiji-era|Meiji]]. After: [[showa-era-1926|Shōwa]].
