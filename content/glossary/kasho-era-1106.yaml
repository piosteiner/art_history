definition: "Japanese era name (嘉承) for the years 1106–1108: 1106 is Kashō 1 (元年) and Kashō 3 is 1108."
description_md: |-
  **Kashō** (嘉承) is a Japanese era name ([[nengo]]), proclaimed in 1106. Its years are counted in lunar years from the new year before the proclamation: 1106 is Kashō 1 (元年), 1108 its last year, Kashō 3. A Japanese source dates a year within it as "Kashō 2" (嘉承2年) rather than by a continuous count.

  Before: [[choji-era|Chōji]]. After: [[tennin-era|Tennin]].
