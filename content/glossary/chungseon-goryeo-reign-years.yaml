public_id: 113328
name: Chungseon of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 충선왕
  - lang: ko-Hani
    role: alternative
    text: 忠宣王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chungseon of Goryeo (忠宣王, 충선왕), by which Korean histories date 1309–1313: 1309 is Chungseon 1, 1313 Chungseon 5."
description_md: |-
  **Chungseon** (忠宣王, 충선왕): the years of the reign of King Chungseon of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1313 is Chungseon 5 (충선왕 5년). The year of the accession, 1309, counts as the first year.

  Before: [[chungnyeol-goryeo-reign-years|Chungnyeol]]. After: [[chungsuk-goryeo-reign-years|Chungsuk]].
sources:
  definition:
    - source: dila-time-authority
