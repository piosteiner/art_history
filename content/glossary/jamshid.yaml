public_id: 130813
name: Jamshid
category: mythology and legend
definition: In Persian legend and the Shahnameh, a glorious early king of a golden age, linked to the world-revealing Cup of Jamshid, who lost his divine glory (farr) through pride.
description_md: |-
  Jamshid was one of the greatest legendary kings of Persia. He ruled for centuries, taught people crafts, medicine and how to build, and his reign was a golden age without sickness or death. He is also linked to the magical Cup of Jamshid, in which the whole world could be seen. But in the end he grew proud and declared himself divine. At that moment the *farr*, the god-given glory of kingship, left him. His people turned away, [[zahhak]] seized the throne, and after years in hiding Jamshid was captured and sawn in half.

  *From:* Shahnameh · Persian
