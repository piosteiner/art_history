public_id: 113024
name: Jianyan
names:
  - lang: zh
    role: original
    text: 建炎
category: calendar
definition: "Chinese era name (建炎) of the Southern Song for the years 1127–1130: 1127 is Jianyan 1 (元年) and Jianyan 4 is 1130."
description_md: |-
  **Jianyan** (建炎) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1127 under Emperor Gaozong (高宗). Its years are counted in lunar years: 1127 is Jianyan 1 (元年), 1130 its last year, Jianyan 4. A Chinese source dates a year within it as "Jianyan 2" (建炎二年) rather than by a continuous count.

  Before: [[jingkang-era|Jingkang]]. After: [[shaoxing-era|Shaoxing]].
sources:
  definition:
    - source: dila-time-authority
