definition: "Japanese era name (天安) for the years 857–859: 857 is Ten'an 1 (元年) and Ten'an 3 is 859."
description_md: |-
  **Ten'an** (天安) is a Japanese era name ([[nengo]]), proclaimed in 857. Its years are counted in lunar years from the new year before the proclamation: 857 is Ten'an 1 (元年), 859 its last year, Ten'an 3. A Japanese source dates a year within it as "Ten'an 2" (天安2年) rather than by a continuous count.

  Before: [[saiko-era|Saikō]]. After: [[jogan-era|Jōgan]].
