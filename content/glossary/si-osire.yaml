name: Si-Osire
names: [Si-Osiris]
category: mythology and legend
definition: In the Egyptian Demotic tales, the magical son of Setne Khamwas, who showed his father the afterlife and was a great dead magician reborn.
description_md: |-
  As a child, he read his father's book-scrolls without opening them and then a Nubian chieftain's sealed letter, and took his father down into the underworld to show him that a poor man was rewarded and a rich man punished. He was really a great dead magician reborn to defend Egypt in a magic duel against a Nubian sorcerer.

  *From:* Setne Khamwas tales (Demotic) · Ancient Egyptian
