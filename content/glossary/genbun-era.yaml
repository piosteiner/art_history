category: calendar
definition: "Japanese era name (元文) for the years 1736–1741: 1736 is Genbun 1 (元年) and Genbun 6 is 1741."
description_md: |-
  **Genbun** (元文) is a Japanese era name ([[nengo]]), proclaimed in 1736. Its years are counted in lunar years from the new year before the proclamation: 1736 is Genbun 1 (元年), 1741 its last year, Genbun 6. A Japanese source dates a year within it as "Genbun 2" (元文2年) rather than by a continuous count.

  Before: [[kyoho-era|Kyōhō]]. After: [[kanpo-era|Kanpō]].
