public_id: 113272
name: Beop of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 법왕
  - lang: ko-Hani
    role: alternative
    text: 法王
category: calendar
parent: korean-calendar
definition: "The reign years of King Beop of Baekje (法王, 법왕), by which Korean histories date 599–600: 599 is Beop 1, 600 Beop 2."
description_md: |-
  **Beop** (法王, 법왕): the years of the reign of King Beop of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 600 is Beop 2 (법왕 2년). The year of the accession, 599, counts as the first year.

  Before: [[hye-baekje-reign-years|Hye]]. After: [[mu-baekje-reign-years|Mu]].
sources:
  definition:
    - source: dila-time-authority
