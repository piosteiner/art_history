name: Namjil the Cuckoo
names: [Khökhöö Namjil]
category: mythology and legend
definition: A herder of Mongol legend whose winged horse was killed when its wings were cut off; from its hair, skin and bones he made the first morin khuur, the horse-head fiddle.
description_md: |-
  Namjil was a young herder in the army who sang so beautifully he was called "the Cuckoo". He fell in love with a woman in a faraway land, who gave him a winged horse so he could fly to her every night. He had to land outside his village and walk the horse in, so no one would see its wings. One night he was in a hurry and flew right into the village. A jealous woman cut off the horse's wings, and it died. Heartbroken, Namjil made the first *morin khuur* from its skin and tail hair, with a horse's head on the top, and played mournful songs for the love he had lost.

  *From:* legend of the morin khuur · Mongol
