definition: "Japanese era name (宝亀) for the years 770–780: 770 is Hōki 1 (元年) and Hōki 11 is 780."
description_md: |-
  **Hōki** (宝亀) is a Japanese era name ([[nengo]]), proclaimed in 770. Its years are counted in lunar years from the new year before the proclamation: 770 is Hōki 1 (元年), 780 its last year, Hōki 11. A Japanese source dates a year within it as "Hōki 2" (宝亀2年) rather than by a continuous count.

  Before: [[jingo-keiun-era|Jingo-keiun]]. After: [[teno-era|Ten'ō]].
