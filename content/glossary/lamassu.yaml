public_id: 131314
name: Lamassu
category: mythology and legend
definition: An Assyrian protective spirit with a human head, the body of a bull or lion and eagle's wings, carved in stone at palace gates.
description_md: |-
  Huge stone lamassu guarded the gates of Assyrian palaces. Seen from the front, they're standing still, and seen from the side, they're walking, so they have five legs.

  *From:* Assyrian palace sculpture · Mesopotamian (Sumerian, Babylonian, Assyrian)
