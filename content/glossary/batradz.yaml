public_id: 131455
name: Batradz
names: [Batraz]
category: mythology and legend
definition: A hero of the Nart sagas of the Caucasus made of red-hot steel; the throwing of his sword into the sea has been compared to the Excalibur legend.
description_md: |-
  He was born glowing hot from a cyst on his father's back and was thrown into the sea, where he grew up; the smith Kurdalægon later heated him white-hot and plunged him into the sea to temper him. Some scholars think the end of his story, when his sword is thrown into the sea, inspired the [[king-arthur]] legend of [[excalibur]], through Sarmatian soldiers in Roman Britain.

  *From:* Nart sagas · Ossetian (Nart sagas)
