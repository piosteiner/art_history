name: Arachne
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the mortal weaver who matched Athena in a weaving contest and was turned into a spider.
description_md: |-
  A mortal weaver who boasted that she was better than [[athena]]. Her flawless tapestry showed the gods' scandals, and the furious goddess turned her into a spider.

  **In art:** A weaving contest with a goddess, or a woman turning into a spider.

  **Famous works**

  - Velázquez, *Las Hilanderas* (The Spinners, Prado) — [[artwork/las-hilanderas]]
  - Gustave Doré, illustration of Arachne for Dante's *Purgatorio*

  *From:* Ovid, Metamorphoses · Ancient Greek
