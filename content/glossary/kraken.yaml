public_id: 131601
name: Kraken
category: mythology and legend
definition: A giant sea monster of Norwegian folklore big enough to be mistaken for an island, probably based on the giant squid.
description_md: |-
  Norwegian fishermen told of a creature off the coast so huge that sailors mistook its back for an island. When it sank, the whirlpool could pull down whole ships. It's probably based on the giant squid.

  *From:* folklore · Norwegian
