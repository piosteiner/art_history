definition: "Chinese era name (順治) of the Qing for the years 1644–1661: 1644 is Shunzhi 1 (元年) and Shunzhi 18 is 1661."
description_md: |-
  **Shunzhi** (順治) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1644. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Shunzhi Emperor. Its years are counted in lunar years: 1644 is Shunzhi 1 (元年), 1661 its last year, Shunzhi 18. A Chinese source dates a year within it as "Shunzhi 2" (順治二年) rather than by a continuous count.

  After: [[kangxi-era|Kangxi]].
