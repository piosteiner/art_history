category: calendar
definition: "Japanese era name (明徳) for the years 1390–1394: 1390 is Meitoku 1 (元年) and Meitoku 5 is 1394."
description_md: |-
  **Meitoku** (明徳) is a Japanese era name ([[nengo]]), proclaimed in 1390. Its years are counted in lunar years from the new year before the proclamation: 1390 is Meitoku 1 (元年), 1394 its last year, Meitoku 5. A Japanese source dates a year within it as "Meitoku 2" (明徳2年) rather than by a continuous count.

  Before: Kōō. After: [[oei-era|Ōei]].
