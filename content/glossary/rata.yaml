public_id: 131009
name: Rata
names: [Rātā]
category: mythology and legend
definition: A Polynesian hero who felled a great tree for a canoe without asking the forest god's permission; the forest spirits raised it again each night until he apologised, and then built the canoe for him.
description_md: |-
  Rata wanted to build a canoe to reach the people who held his murdered father's bones, so he cut down a great tree. But the spirits of the forest raised the tree up again, because he hadn't asked the forest god's permission. When he hid and caught them, he learned his lesson. He apologised, and the spirits built the canoe for him themselves.

  *From:* Polynesian tradition · Polynesian / Māori
