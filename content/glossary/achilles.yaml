name: Achilles
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the greatest Greek warrior at Troy, son of Thetis, invulnerable except for his heel, who killed Hector and was killed by Paris's arrow.
description_md: |-
  The greatest Greek warrior at Troy, son of the sea nymph [[thetis]]. In a later version (first found in Statius' Achilleid, 1st century AD), she dipped him in the river Styx to make him invulnerable, but held him by the heel. He withdrew from the war in anger, returned in fury when his beloved friend [[patroclus]] was killed, slew [[hector]], and was finally killed by Paris's arrow in his heel.

  **In art:** A young armoured hero with spear and shield, dragging Hector's body behind his chariot, playing dice with [[ajax-the-great|Ajax]], mourning Patroclus, or hidden as a girl among the daughters of Lycomedes.

  **Famous works**

  - Exekias, amphora of *Achilles and Ajax Playing Dice* (Vatican)
  - Sosias Painter, *Achilles Bandaging Patroclus* (Berlin)
  - Rubens, *Achilles* tapestry series
  - Ingres, *The Envoys of Agamemnon* (École nationale supérieure des Beaux-Arts, Paris)
  - Franz Matsch, *Triumphant Achilles* (Achilleion, Corfu)

  *From:* Homer, Iliad · Ancient Greek
