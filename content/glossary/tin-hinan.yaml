name: Tin Hinan
category: mythology and legend
definition: "Half history, half myth: the ancestress and queen of the Tuareg, said to have crossed the Sahara on a camel; a tomb in the Algerian Sahara is traditionally hers."
description_md: |-
  Half history, half myth, Tin Hinan is said to have crossed the Sahara from the north on a camel and become the ancestress and queen of the Tuareg people. Her name means "woman of the tents", a hint at her nomadic life and leadership. A real ancient tomb in the Algerian Sahara is traditionally said to be hers, and the Tuareg still trace their noble lineage back to her.

  *From:* Tuareg tradition · Tuareg
