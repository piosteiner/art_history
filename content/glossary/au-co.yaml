name: Âu Cơ
category: mythology and legend
definition: The mountain fairy of Vietnamese legend who laid a sack of a hundred eggs, the ancestors of the Vietnamese people.
description_md: |-
  The dragon king [[lac-long-quan]] married the mountain fairy Âu Cơ. She laid a sack of a hundred eggs, which hatched into a hundred sons. Because he belonged to the sea and she to the mountains, they separated: fifty sons went with their father to the coast and fifty with their mother to the mountains. The Vietnamese call themselves "children of the dragon, grandchildren of the fairy".

  *From:* Vietnamese founding myth · Vietnamese
