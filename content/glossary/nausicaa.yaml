name: Nausicaa
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the Phaeacian princess who found the shipwrecked Odysseus on the beach and helped him reach her father's palace.
description_md: |-
  A Phaeacian princess who found the shipwrecked, naked [[odysseus]] on the beach while she and her maids were washing clothes and playing ball. She helped him reach her father's palace.

  **In art:** Young women by the sea doing laundry or playing ball, as a man emerges from the bushes covering himself with a branch.

  **Famous works**

  - Pieter Lastman, *Odysseus and Nausicaa* (Alte Pinakothek, Munich)
  - Rubens, *Landscape with Odysseus and Nausicaa* (Palazzo Pitti)

  *From:* Homer, Odyssey · Ancient Greek
