definition: The knight of German legend who spent a year in the Venusberg with the goddess Venus.
description_md: |-
  Tannhäuser is the knight who spent a year in the Venusberg with the goddess [[aphrodite|Venus]].

  **In art:** A knight in the grotto of Venus.

  **Famous works**

  - Josef Aigner, *Tannhäuser murals* (Study, Neuschwanstein Castle, 1880/81)

  *From:* German legend; Wagner, Tannhäuser · German
