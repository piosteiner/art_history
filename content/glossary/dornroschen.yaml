name: Dornröschen
names: [Sleeping Beauty, Little Briar Rose]
category: mythology and legend
definition: In the Grimms' fairy tale, a princess cursed to prick her finger on a spindle and sleep for a hundred years behind a wall of thorns.
description_md: |-
  A thirteenth wise woman (fairy), angry at not being invited to the christening, cursed her to die from pricking her finger on a spindle. Another fairy softened this to a hundred years of sleep. A wall of thorns grew around the castle, and when the hundred years were up, the thorns turned into large, beautiful flowers and let a prince through.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
