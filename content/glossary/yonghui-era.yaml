public_id: 113048
name: Yonghui
names:
  - lang: zh
    role: original
    text: 永徽
category: calendar
definition: "Chinese era name (永徽) of the Tang for the years 650–656: 650 is Yonghui 1 (元年) and Yonghui 7 is 656."
description_md: |-
  **Yonghui** (永徽) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 650 under Emperor Gaozong (高宗). Its years are counted in lunar years: 650 is Yonghui 1 (元年), 656 its last year, Yonghui 7. A Chinese source dates a year within it as "Yonghui 2" (永徽二年) rather than by a continuous count.

  Before: [[zhenguan-era|Zhenguan]]. After: [[xianqing-era|Xianqing]].
sources:
  definition:
    - source: dila-time-authority
