public_id: 113029
name: Shaoxi
names:
  - lang: zh
    role: original
    text: 紹熙
category: calendar
definition: "Chinese era name (紹熙) of the Southern Song for the years 1190–1194: 1190 is Shaoxi 1 (元年) and Shaoxi 5 is 1194."
description_md: |-
  **Shaoxi** (紹熙) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1190 under Emperor Guangzong (光宗). Its years are counted in lunar years: 1190 is Shaoxi 1 (元年), 1194 its last year, Shaoxi 5. A Chinese source dates a year within it as "Shaoxi 2" (紹熙二年) rather than by a continuous count.

  Before: [[chunxi-era|Chunxi]]. After: [[qingyuan-era|Qingyuan]].
sources:
  definition:
    - source: dila-time-authority
