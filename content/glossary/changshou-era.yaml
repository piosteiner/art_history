name: Changshou
names:
  - lang: zh
    role: original
    text: 長壽
category: calendar
definition: "Chinese era name (長壽) of the Zhou of Empress Wu for the years 692–694: 692 is Changshou 1 (元年) and Changshou 3 is 694."
description_md: |-
  **Changshou** (長壽) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 692 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 692 is Changshou 1 (元年), 694 its last year, Changshou 3. A Chinese source dates a year within it as "Changshou 2" (長壽二年) rather than by a continuous count.

  Before: [[ruyi-era|Ruyi]]. After: [[yanzai-era|Yanzai]].
sources:
  definition:
