definition: "Japanese era name (安貞) for the years 1227–1229: 1227 is Antei 1 (元年) and Antei 3 is 1229."
description_md: |-
  **Antei** (安貞) is a Japanese era name ([[nengo]]), proclaimed in 1227. Its years are counted in lunar years from the new year before the proclamation: 1227 is Antei 1 (元年), 1229 its last year, Antei 3. A Japanese source dates a year within it as "Antei 2" (安貞2年) rather than by a continuous count.

  Before: [[karoku-era|Karoku]]. After: [[kangi-era|Kangi]].
