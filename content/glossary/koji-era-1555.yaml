definition: "Japanese era name (弘治) for the years 1555–1558: 1555 is Kōji 1 (元年) and Kōji 4 is 1558."
description_md: |-
  **Kōji** (弘治) is a Japanese era name ([[nengo]]), proclaimed in 1555. Its years are counted in lunar years from the new year before the proclamation: 1555 is Kōji 1 (元年), 1558 its last year, Kōji 4. A Japanese source dates a year within it as "Kōji 2" (弘治2年) rather than by a continuous count.

  Before: [[tenbun-era|Tenbun]]. After: [[eiroku-era|Eiroku]].
