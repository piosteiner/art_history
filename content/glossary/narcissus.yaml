name: Narcissus
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the beautiful youth who rejected the nymph Echo and fell in love with his own reflection; the narcissus flower grew in his place.
description_md: |-
  The nymph [[echo]] was cursed to only repeat others' last words. She fell in love with the beautiful youth Narcissus, who rejected her, and she faded away until only her voice remained. As punishment, Narcissus fell in love with his own reflection in a pool, and wasted away. In his place grew the narcissus flower.

  **In art:** A youth gazing at his reflection in water, often with a nymph watching from the background, or narcissus flowers.

  **Famous works**

  - [[artist/caravaggio]] (attributed), *Narcissus* (Galleria Nazionale d'Arte Antica, Palazzo Barberini, Rome)
  - Waterhouse, *Echo and Narcissus* (Walker Art Gallery, Liverpool)
  - [[artist/nicolas-poussin]], *Echo and Narcissus* (Louvre)
  - [[artist/salvador-dali]], *Metamorphosis of Narcissus* (Tate)

  *From:* Ovid, Metamorphoses · Ancient Greek
