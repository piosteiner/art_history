name: Shaoxing
names:
  - lang: zh
    role: original
    text: 紹興
category: calendar
definition: "Chinese era name (紹興) of the Southern Song for the years 1131–1162: 1131 is Shaoxing 1 (元年) and Shaoxing 32 is 1162."
description_md: |-
  **Shaoxing** (紹興) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1131 under Emperor Gaozong (高宗). Its years are counted in lunar years: 1131 is Shaoxing 1 (元年), 1162 its last year, Shaoxing 32. A Chinese source dates a year within it as "Shaoxing 2" (紹興二年) rather than by a continuous count.

  Before: [[jianyan-era|Jianyan]]. After: [[longxing-era|Longxing]].
sources:
  definition:
    - source: dila-time-authority
