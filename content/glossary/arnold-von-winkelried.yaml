name: Arnold von Winkelried
names: [Winkelried]
category: mythology and legend
definition: The legendary hero of the Battle of Sempach (1386) who threw himself onto the Habsburg knights' spears to open a gap for his comrades; historians are unsure whether he existed, but he became a Swiss symbol of self-sacrifice.
description_md: |-
  Arnold von Winkelried is the legendary hero of the Battle of Sempach in 1386. The Swiss were facing an impenetrable wall of Habsburg knights with long spears. According to legend, Winkelried shouted "Look after my wife and children!", threw himself onto the spears, gathering as many as he could into his own body, and opened a gap through which his comrades broke the enemy line. Historians are unsure whether he really existed, but he became a Swiss symbol of self-sacrifice.

  *From:* Swiss legend (Battle of Sempach) · Swiss
