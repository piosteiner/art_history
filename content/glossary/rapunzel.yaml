public_id: 131216
name: Rapunzel
category: mythology and legend
definition: In the Grimms' fairy tale, a girl locked by a witch in a tower without a door, who lets down her very long hair for the witch to climb.
description_md: |-
  A witch locked her in a tower without a door, and she climbed up by Rapunzel's hair. When she found out about a prince's visits, she cut off Rapunzel's hair and sent her into the wilderness, and the prince fell from the tower into thorns, which blinded him. Years later, Rapunzel's tears healed his eyes.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
