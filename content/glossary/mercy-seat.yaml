name: Mercy Seat
names: [Gnadenstuhl, Throne of Mercy]
category: iconography
definition: 'The "Gnadenstuhl" image of the Trinity: God the Father holding the crucified Christ, with the dove of the Holy Spirit between them.'
description_md: |-
  In the "Mercy Seat" (*Gnadenstuhl*) type, God the Father holds the crucified Christ, with the dove of the Holy Spirit between them.

  **In art:** An old bearded man with Christ on the cross before him and a dove.

  **Famous works**

  - [[artist/albrecht-durer]], *Adoration of the Trinity* (Landauer Altarpiece, 1511, Kunsthistorisches Museum, Vienna)

  *From:* Christian iconography · Christian
