    text: 延慶
category: calendar
definition: "Japanese era name (延慶) for the years 1308–1311: 1308 is Enkyō 1 (元年) and Enkyō 4 is 1311."
description_md: |-
  **Enkyō** (延慶) is a Japanese era name ([[nengo]]), proclaimed in 1308. Its years are counted in lunar years from the new year before the proclamation: 1308 is Enkyō 1 (元年), 1311 its last year, Enkyō 4. A Japanese source dates a year within it as "Enkyō 2" (延慶2年) rather than by a continuous count.

  Before: Tokuji. After: Ōchō.
