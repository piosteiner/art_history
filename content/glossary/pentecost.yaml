public_id: 132165
name: Pentecost
category: iconography
definition: The descent of the Holy Spirit on the apostles and Mary as tongues of fire, ten days after the Ascension.
description_md: |-
  Ten days later, the Holy Spirit descends on the apostles and [[person/mary]] as tongues of fire, and they begin speaking in many languages (Pentecost).

  **In art:** The apostles gathered around Mary with flames above their heads and a dove.

  **Famous works**

  - [[artist/el-greco]], *Pentecost* (Prado)

  *From:* New Testament, Gospels · Christian
