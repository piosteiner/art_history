name: Gonggong
category: mythology and legend
definition: A monstrous water god of Chinese myth with a serpent's body and red hair, who smashed his head against Mount Buzhou, a pillar of the sky, tearing the heavens open; Nüwa had to repair them.
description_md: |-
  Gonggong was a monstrous water god, often shown with a serpent's body and red hair. After losing a battle for the throne of heaven (against Zhurong, or Zhuanxu in the Huainanzi), he flew into a rage and smashed his head against Mount Buzhou, one of the pillars holding up the sky. The sky tore open, and floods and fire poured onto the earth. The goddess [[nuwa]] had to repair the heavens with five-coloured stones and prop up the sky with the legs of a giant turtle.

  *From:* Chinese mythology · Chinese
