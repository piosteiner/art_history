definition: "Japanese era name (嘉祥) for the years 848–850: 848 is Kashō 1 (元年) and Kashō 3 is 850."
description_md: |-
  **Kashō** (嘉祥) is a Japanese era name ([[nengo]]), proclaimed in 848. Its years are counted in lunar years from the new year before the proclamation: 848 is Kashō 1 (元年), 850 its last year, Kashō 3. A Japanese source dates a year within it as "Kashō 2" (嘉祥2年) rather than by a continuous count.

  Before: [[jowa-era|Jōwa]]. After: [[ninju-era|Ninju]].
