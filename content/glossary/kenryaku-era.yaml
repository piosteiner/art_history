definition: "Japanese era name (建暦) for the years 1211–1213: 1211 is Kenryaku 1 (元年) and Kenryaku 3 is 1213."
description_md: |-
  **Kenryaku** (建暦) is a Japanese era name ([[nengo]]), proclaimed in 1211. Its years are counted in lunar years from the new year before the proclamation: 1211 is Kenryaku 1 (元年), 1213 its last year, Kenryaku 3. A Japanese source dates a year within it as "Kenryaku 2" (建暦2年) rather than by a continuous count.

  Before: [[jogen-era-1207|Jōgen]]. After: [[kempo-era|Kempo]].
