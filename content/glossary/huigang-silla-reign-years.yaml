public_id: 113379
name: Huigang of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 희강왕
  - lang: ko-Hani
    role: alternative
    text: 僖康王
category: calendar
parent: korean-calendar
definition: "The reign years of King Huigang of Silla (僖康王, 희강왕), by which Korean histories date 836–838: 836 is Huigang 1, 838 Huigang 3."
description_md: |-
  **Huigang** (僖康王, 희강왕): the years of the reign of King Huigang of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 838 is Huigang 3 (희강왕 3년). The year of the accession, 836, counts as the first year.

  Before: [[heungdeok-silla-reign-years|Heungdeok]]. After: [[minae-silla-reign-years|Minae]].
sources:
  definition:
    - source: dila-time-authority
