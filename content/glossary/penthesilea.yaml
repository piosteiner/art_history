name: Penthesilea
category: mythology and legend
definition: A queen of the Amazons who came to fight for Troy after Hector's death and was killed by Achilles, who fell in love with her as she died.
description_md: |-
  Penthesilea was a queen of the [[the-amazons|Amazons]], the legendary warrior women. After the death of [[hector]], she came to Troy with her warriors to fight against the Greeks and killed many of them. She finally faced [[achilles]], who struck her down. In the tragic ending, as he took off her helmet and saw her face, he fell in love with her as she died.

  *From:* Greek mythology (Trojan cycle) · Ancient Greek
