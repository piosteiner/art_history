public_id: 131655
name: Bell Witch
category: mythology and legend
definition: A spirit that from 1817 tormented the Bell family on their farm in Tennessee and was blamed for John Bell's death in 1820.
description_md: |-
  From 1817, a spirit attacked the Bell family on their farm in Tennessee: it knocked, scratched, pulled the bedclothes, spoke in many voices and sang hymns. It's blamed for the death of John Bell in 1820. It said it was the witch of a neighbour, Kate Batts.

  *From:* folklore · American (Tennessee)
