definition: In Greek myth the wild, lustful followers of Dionysus, men with horse or goat features.
description_md: |-
  The followers of [[dionysus]] and nature spirits. Satyrs are wild, lustful men with horse or goat features. [[silenus]] is the fat, drunken old tutor of Dionysus. The maenads are women in an ecstatic frenzy. The nymphs are spirits of nature: dryads (trees), naiads (springs and rivers), oreads (mountains) and nereids (the sea).

  **In art:** Revelling processions (a *bacchanal*).

  **Famous works**

  - [[artist/titian]], *The Bacchanal of the Andrians* (Prado)
  - [[artist/nicolas-poussin]], *Bacchanalian Revel before a Term* (National Gallery, London)
  - *Barberini Faun* (Glyptothek, Munich)

  *From:* Greek mythology · Ancient Greek
