name: Kiss of Judas
names: [The Betrayal, The Taking of Christ, Arrest of Jesus]
category: iconography
definition: Judas Iscariot identifying Jesus to the soldiers with a kiss, for thirty pieces of silver.
description_md: |-
  [[person/judas-iscariot]] leads soldiers to Jesus and identifies him with a kiss, for thirty pieces of silver. Peter cuts off the ear of the high priest's servant Malchus with a sword.

  **In art:** Judas kissing Christ, surrounded by soldiers with torches and lanterns, and Peter slicing off a soldier's ear.

  **Famous works**

  - [[artist/giotto]], *The Kiss of Judas* (Scrovegni Chapel)
  - [[artist/caravaggio]], *The Taking of Christ* (National Gallery of Ireland, Dublin)

  *From:* New Testament, Gospels · Christian
