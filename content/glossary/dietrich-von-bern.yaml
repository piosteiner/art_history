name: Dietrich von Bern
names: [Theodoric of Verona]
category: mythology and legend
definition: The exiled king of medieval German legend, based on the Ostrogothic king Theodoric the Great ("Bern" is Verona), who lived for years at Etzel's court and captures Hagen at the end of the Nibelungenlied.
description_md: |-
  Dietrich von Bern is a legendary version of the real Ostrogothic king Theodoric the Great. "Bern" here means Verona in Italy, not the Swiss capital. In the legends, his evil uncle Ermenrich drove him from his kingdom, and he lived for many years in exile at the court of Etzel, king of the Huns. Some stories say he could breathe fire when enraged. He is the hero of a whole cycle of medieval epics, and at the end of the Nibelungenlied he is the one who finally captures Hagen.

  *From:* Dietrich cycle; Nibelungenlied · German / Germanic
