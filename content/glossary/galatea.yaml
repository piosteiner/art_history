name: Galatea
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, a nereid loved by the Cyclops Polyphemus; she loved the shepherd Acis, whom the jealous Cyclops crushed with a boulder.
description_md: |-
  A different Galatea: a nereid loved by the Cyclops Polyphemus. She loved the shepherd [[acis]] instead, and in jealousy [[polyphemus]] crushed Acis with a boulder.

  **In art:** A sea nymph riding a shell chariot drawn by dolphins, with a giant [[cyclopes|Cyclops]] watching from the shore.

  **Famous works**

  - [[artist/raphael]], *The Triumph of Galatea* (Villa Farnesina, Rome)
  - Gustave Moreau, *Galatea* (Musée d'Orsay)

  *From:* Ovid, Metamorphoses · Ancient Greek
