category: mythology and legend
definition: The Mesopotamian sun god and god of justice (Sumerian Utu), who saw everything; the Code of Hammurabi stele shows the king before him.
description_md: |-
  Shamash (Sumerian Utu) was the Mesopotamian sun god and god of justice. Because the sun crossed the whole sky each day, he saw everything and was the judge of right and wrong. The famous Code of Hammurabi stele shows the king before Shamash. He also helped [[gilgamesh]] and [[enkidu]] defeat [[humbaba]].

  *From:* Mesopotamian religion · Mesopotamian
