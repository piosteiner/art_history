    text: 永治
category: calendar
definition: "Japanese era name (永治) for the years 1141–1142: 1141 is Eiji 1 (元年) and Eiji 2 is 1142."
description_md: |-
  **Eiji** (永治) is a Japanese era name ([[nengo]]), proclaimed in 1141. Its years are counted in lunar years from the new year before the proclamation: 1141 is Eiji 1 (元年), 1142 its last year, Eiji 2. A Japanese source dates a year within it as "Eiji 2" (永治2年) rather than by a continuous count.

  Before: [[hoen-era|Hōen]]. After: [[koji-era-1142|Kōji]].
