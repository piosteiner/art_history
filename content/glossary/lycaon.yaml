public_id: 131265
name: Lycaon
category: mythology and legend
definition: In Greek myth, a cruel king of Arcadia turned into a wolf by Zeus for serving him human flesh — the first werewolf.
description_md: |-
  A cruel king of [[arcadia]] who served [[zeus]] a dish of human flesh to test whether he was really a god. Zeus turned him into a wolf, and his anger caused the Great Flood.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
