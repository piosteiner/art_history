definition: In Greek myth the Trojan princess given prophecy by Apollo and cursed so that no one would believe her.
description_md: |-
  A Trojan princess whom [[apollo]] gave the gift of prophecy. When she rejected him, he cursed her so that no one would ever believe her. She foresaw the fall of Troy, and no one listened.

  **In art:** A wild-haired woman in despair, often clinging to [[athena]]'s statue as the Greek soldier Ajax the Lesser drags her away.

  **Famous works**

  - Evelyn De Morgan, *Cassandra*
  - Solomon J. Solomon, *Ajax and Cassandra*

  *From:* Greek mythology · Ancient Greek
