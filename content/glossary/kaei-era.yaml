    text: 嘉永
category: calendar
definition: "Japanese era name (嘉永) for the years 1848–1854: 1848 is Kaei 1 (元年) and Kaei 7 is 1854."
description_md: |-
  **Kaei** (嘉永) is a Japanese era name ([[nengo]]), proclaimed in 1848. Its years are counted in lunar years from the new year before the proclamation: 1848 is Kaei 1 (元年), 1854 its last year, Kaei 7. A Japanese source dates a year within it as "Kaei 2" (嘉永2年) rather than by a continuous count.

  Before: [[koka-era|Kōka]]. After: [[ansei-era|Ansei]].
