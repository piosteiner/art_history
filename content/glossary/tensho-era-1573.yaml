definition: "Japanese era name (天正) for the years 1573–1592: 1573 is Tenshō 1 (元年) and Tenshō 20 is 1592."
description_md: |-
  **Tenshō** (天正) is a Japanese era name ([[nengo]]), proclaimed in 1573. Its years are counted in lunar years from the new year before the proclamation: 1573 is Tenshō 1 (元年), 1592 its last year, Tenshō 20. A Japanese source dates a year within it as "Tenshō 2" (天正2年) rather than by a continuous count.

  Before: [[genki-era|Genki]]. After: [[bunroku-era|Bunroku]].
