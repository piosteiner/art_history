public_id: 131443
name: Baba Cloanța
category: mythology and legend
definition: In Romanian fairy tales, the ugly old witch who is the mother of the zmei.
description_md: |-
  Zmei are shape-shifting dragon-men with human features who kidnap princesses and are always defeated by [[fat-frumos]]. Their ugly old mother, Baba Cloanța, is just as dangerous.

  *From:* Romanian folklore · Romanian
