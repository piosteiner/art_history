name: Woodland School
names: [Woodlands style, Norval Morrisseau, Copper Thunderbird]
category: art style
definition: The style founded by the Anishinaabe painter Norval Morrisseau (1932–2007), with bold black outlines and bright colours showing Anishinaabe stories and "x-ray" views inside figures.
description_md: |-
  Norval Morrisseau (Anishinaabe, 1932–2007), called "Copper Thunderbird", founded a style known as the Woodland School, with bold black outlines and bright colours, showing Anishinaabe stories and "x-ray" views inside figures. Elders at first criticised him for painting sacred stories publicly, and he chose which ones to share.

  **Famous works**

  - Norval Morrisseau, *Androgyny* (1983, Indigenous Art Collection, Crown–Indigenous Relations and Northern Affairs Canada)

  **Held sacred today:** Morrisseau is one of the most forged artists in the world; police seized over 1,000 fake paintings. Only use images and works from museum or official collections (the Indigenous Art Collection, Crown–Indigenous Relations and Northern Affairs Canada), never from auction or sales sites.

  *From:* Anishinaabe
