name: Last Supper
names: [The Last Supper]
category: iconography
definition: Jesus's final meal with his twelve apostles, where he announced his betrayal and blessed the bread and wine.
description_md: |-
  Jesus's final meal with his twelve apostles, where he announced that one of them would betray him, and blessed the bread and wine.

  **In art:** Christ and twelve men at a long table. Judas is often set apart, sometimes on the opposite side of the table, holding a money bag. The young John often leans or sleeps on Christ's breast.

  **Famous works**

  - [[artist/leonardo-da-vinci]], *The Last Supper* (Santa Maria delle Grazie, Milan) — [[artwork/the-last-supper-leonardo]]
  - Tintoretto, *The Last Supper* (San Giorgio Maggiore, Venice)
  - [[artist/andrea-del-castagno]], *Last Supper* (Sant'Apollonia, Florence)
  - [[artist/paolo-veronese]], *The Feast in the House of Levi* (Accademia, Venice; renamed after the Inquisition objected to it as a Last Supper)

  *From:* New Testament, Gospels · Christian
