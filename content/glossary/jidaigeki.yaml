category: performing arts
definition: Japanese film, TV, games, and theatre genre
description_md: |-
  *Jidaigeki* ("period drama") is a genre of Japanese film, television and theatre set before the Meiji Restoration of 1868, showing the lives of samurai, farmers, craftsmen and merchants of their time and relying on established conventions of make-up, language, catchphrases and plots [[source/wikipedia-en-jidaigeki|introduction]]. The sword-fight film, [[term/chanbara|chanbara]], is a sub-genre of it [[source/wikipedia-en-jidaigeki|introduction]]. Many jidaigeki take place in Edo; others follow travellers, as the long-running television series *Mito Kōmon* — the fictitious travels of the retired vice-shogun Tokugawa Mitsukuni, disguised as a merchant — and the *Zatoichi* films and series [[source/wikipedia-en-jidaigeki|§ Types]].

  The vocabulary list of the lecture *War and Peace in East Asian Art* of 12 April 2019 has the term beside *The Sword of Doom*, Chūshingura and Mito Kōmon [[source/thomsen-2019-war-and-peace|vocabulary list, 12 April 2019]].
