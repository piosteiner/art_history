category: iconography
definition: One of the four temperaments of medieval medicine, linked to Saturn, black bile, genius and creative despair.
description_md: |-
  One of the four temperaments of medieval medicine, linked to the planet Saturn, black bile, genius and creative despair.

  **In art:** A winged figure sitting with her head in her hand, surrounded by tools, measuring instruments and geometric shapes.

  **Famous works**

  - [[artist/albrecht-durer]], *Melencolia I* (engraving, 1514)
  - [[artist/lucas-cranach-the-elder]], *Melancholy* (1532; versions in the Musée Unterlinden, Colmar, and the Statens Museum for Kunst, Copenhagen)

  *From:* European
