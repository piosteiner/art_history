public_id: 112996
name: Zhidao
names:
  - lang: zh
    role: original
    text: 至道
category: calendar
definition: "Chinese era name (至道) of the Northern Song for the years 995–997: 995 is Zhidao 1 (元年) and Zhidao 3 is 997."
description_md: |-
  **Zhidao** (至道) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 995 under Emperor Taizong (太宗). Its years are counted in lunar years: 995 is Zhidao 1 (元年), 997 its last year, Zhidao 3. A Chinese source dates a year within it as "Zhidao 2" (至道二年) rather than by a continuous count.

  Before: [[chunhua-era|Chunhua]]. After: [[xianping-era|Xianping]].
sources:
  definition:
    - source: dila-time-authority
