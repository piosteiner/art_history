name: Lāčplēsis
names: [The Bear-Slayer]
category: mythology and legend
definition: The Bear-Slayer, Latvia's national hero, a man with bear's ears who fought the German crusaders and the Black Knight.
description_md: |-
  Born to a she-bear and raised as the son of the Lord of Lielvārde, he tore a bear apart by its jaws with his bare hands. His bear's ears gave him his superhuman strength. He fought German crusaders and the Black Knight. In the end, they fell together into the river Daugava, and the legend says he'll come back one day to defeat the Black Knight once and for all.

  *From:* Andrejs Pumpurs, Lāčplēsis (1888) · Latvian
