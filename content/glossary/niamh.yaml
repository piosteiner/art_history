name: Niamh
names: [Niamh Chinn Óir]
category: mythology and legend
definition: Niamh of the Golden Hair, the fairy woman of the Irish Fenian Cycle who rode a white horse across the sea and took Oisín to Tír na nÓg, the Land of Youth.
description_md: |-
  Niamh of the Golden Hair rode a white horse across the sea and took [[oisin]], Fionn's son, to Tír na nÓg. After what felt like three years, he went home to visit, but 300 years had passed. When he fell from the horse and touched the ground, he instantly became a very old man.

  *From:* Fenian Cycle · Irish
