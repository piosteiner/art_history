public_id: 113382
name: Munseong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 문성왕
  - lang: ko-Hani
    role: alternative
    text: 文聖王
category: calendar
parent: korean-calendar
definition: "The reign years of King Munseong of Silla (文聖王, 문성왕), by which Korean histories date 839–857: 839 is Munseong 1, 857 Munseong 19."
description_md: |-
  **Munseong** (文聖王, 문성왕): the years of the reign of King Munseong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 848 is Munseong 10 (문성왕 10년). The year of the accession, 839, counts as the first year.

  Before: [[sinmu-silla-reign-years|Sinmu]]. After: [[heonan-silla-reign-years|Heonan]].
sources:
  definition:
    - source: dila-time-authority
