definition: "Japanese era name (治承) for the years 1177–1181: 1177 is Jishō 1 (元年) and Jishō 5 is 1181."
description_md: |-
  **Jishō** (治承) is a Japanese era name ([[nengo]]), proclaimed in 1177. Its years are counted in lunar years from the new year before the proclamation: 1177 is Jishō 1 (元年), 1181 its last year, Jishō 5. A Japanese source dates a year within it as "Jishō 2" (治承2年) rather than by a continuous count.

  Before: [[angen-era|Angen]]. After: Yōwa.
