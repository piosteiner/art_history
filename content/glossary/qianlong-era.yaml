definition: "Chinese era name (乾隆) of the Qing for the years 1736–1795: 1736 is Qianlong 1 (元年) and Qianlong 60 is 1795."
description_md: |-
  **Qianlong** (乾隆) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1736. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Qianlong Emperor. Its years are counted in lunar years: 1736 is Qianlong 1 (元年), 1795 its last year, Qianlong 60. A Chinese source dates a year within it as "Qianlong 2" (乾隆二年) rather than by a continuous count.

  Before: [[yongzheng-era|Yongzheng]]. After: [[jiaqing-era|Jiaqing]].
