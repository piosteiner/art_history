name: Holy Grail
names: [Grail]
category: mythology and legend
also_in: [iconography]
definition: In most versions since Robert de Boron (c. 1200), the cup Christ used at the Last Supper, sought by the Knights of the Round Table; only the purest knight, Galahad, was granted its full vision.
description_md: |-
  In most versions since Robert de Boron, the Grail is the cup Christ used at the [[last-supper]], which disappeared and was sought by the knights. Only the purest knight, [[galahad|Sir Galahad]], [[lancelot]]'s son, was finally granted its full vision, with [[percival|Perceval]] and Bors beside him. In German tradition, Parzival (Percival) is the Grail hero, in Wolfram von Eschenbach's *Parzival* (early 13th century), where the Grail is a stone.

  **In art:** A knight in white or shining armour kneeling before a glowing chalice held by angels or a maiden.

  **Famous works**

  - George Frederic Watts, *Sir Galahad* (Harvard)
  - [[artist/edward-burne-jones]], [[artist/william-morris]] and John Henry Dearle (Morris & Co.), *Holy Grail tapestries* (some hangings of the later weavings in Birmingham Museum and Art Gallery)
  - Edwin Austin Abbey, *The Quest and Achievement of the Holy Grail* (murals, Boston Public Library)

  *From:* Arthurian legend; Wolfram von Eschenbach, Parzival · Christian (Arthurian legend)
