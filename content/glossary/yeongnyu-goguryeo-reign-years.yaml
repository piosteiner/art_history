public_id: 113301
name: Yeongnyu of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 영류왕
  - lang: ko-Hani
    role: alternative
    text: 榮留王
category: calendar
definition: "The reign years of King Yeongnyu of Goguryeo (榮留王, 영류왕), by which Korean histories date 618–642: 618 is Yeongnyu 1, 642 Yeongnyu 25."
description_md: |-
  **Yeongnyu** (榮留王, 영류왕): the years of the reign of King Yeongnyu of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 627 is Yeongnyu 10 (영류왕 10년). The year of the accession, 618, counts as the first year.

  Before: [[yeongyang-goguryeo-reign-years|Yeongyang]]. After: [[bojang-goguryeo-reign-years|Bojang]].
sources:
  definition:
    - source: dila-time-authority
