description_md: |-
  Oak is, with walnut, one of the hardwoods of medieval sculpture.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] Before 1100 it was used, like walnut, mainly in the Rhineland and the adjacent regions of Belgium and Westphalia, and figures of hardwood come without exception from the plains.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] In tenth-century sculpture hard and soft woods appear about equally often; the share of hardwood fell to about 37 % in the eleventh and 23 % in the twelfth century and rose to about 47 % in the thirteenth, after which oak became more popular in the lowlands of central and northern Europe and along the Upper Rhine.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] Oak shrinks far less than lime: its tangential shrinkage is 0.8 %, against 9.1 % for lime.[[source/endemann-2020-wood-carving-and-staffering|p. 148]] Among the Romanesque Madonnas of France, oak was used in the north (Saint-Denis, Mont-devant-Sassey); its heterogeneous grain makes it more likely to split than walnut.[[source/forsyth-1972-the-throne-of-wisdom|pp. 16, 18]] Early oak figures include the [[artwork/gero-cross|Gero Cross]] and the [[artwork/gerresheimer-kruzifix|Gerresheim Crucifix]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 18]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 21]]

  ## Properties

  Oak is ring-porous: large vessels mark the early wood of each annual ring.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 30]] Its strong rays present much resistance to the tool, and Michael Baxandall calls it "dense and aggressively structured".[[source/baxandall-1980-limewood-sculptors|p. 34]] Being denser, it shrinks less violently than limewood, and where limewood splits rather than warps, oak warps more than it splits; it is also less quickly permeated by moisture.[[source/baxandall-1980-limewood-sculptors|pp. 34–36]] Oak tolerates almost anything a carver insists on in the large form, but in the middle forms it has a very strong character — "the assertive structure of strong longitudinal fibres, thick resilient radial rays and coarse annular late wood" — and offers "a positive cubic medium".[[source/baxandall-1980-limewood-sculptors|pp. 38–39]] Around 1520 the Lübeck sculptors Benedikt Dreyer and Claus Berg carved in oak a kind of sculpture shaped by southern limewood styles, in which, in Baxandall's words, "southern limewood ideas and northern oak matter are in balanced tension".[[source/baxandall-1980-limewood-sculptors|pp. 38–39]]

  ## The tree

  Oaks spread in Central Europe, together with elms, limes and ashes, from about 10,000 years ago; unlike beech, oak and hornbeam sprout again from the stump after felling, which favoured them in woods that were used continually.[[source/fansa-vorlauf-2007-holz-kultur|pp. 29–31]] The curved timber of such oaks, *Krummholz*, was valued for ships' hulls.[[source/fansa-vorlauf-2007-holz-kultur|pp. 29–31]] In ancient Greece the oak was the tree of Zeus — at Dodona the god was believed to dwell in one especially old oak — and in Rome that of Jupiter.[[source/cusack-2011-the-sacred-tree|pp. 43–44]][[source/cusack-2011-the-sacred-tree|p. 51]]
