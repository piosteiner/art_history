definition: "Japanese era name (興国) for the years 1340–1346 of the Southern Court: 1340 is Kōkoku 1 (元年) and Kōkoku 7 is 1346."
description_md: |-
  **Kōkoku** (興国) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras, proclaimed in 1340. Its years are counted in lunar years from the new year before the proclamation: 1340 is Kōkoku 1 (元年), 1346 its last year, Kōkoku 7. A Japanese source dates a year within it as "Kōkoku 2" (興国2年) rather than by a continuous count.

  Before: [[engen-era|Engen]]. After: [[shohei-era|Shōhei]].
