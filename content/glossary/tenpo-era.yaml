definition: "Japanese era name (天保) for the years 1830–1844: 1830 is Tenpō 1 (元年) and Tenpō 15 is 1844."
description_md: |-
  **Tenpō** (天保) is a Japanese era name ([[nengo]]), proclaimed in 1831. Its years are counted in lunar years from the new year before the proclamation: 1830 is Tenpō 1 (元年), 1844 its last year, Tenpō 15. A Japanese source dates a year within it as "Tenpō 2" (天保2年) rather than by a continuous count.

  Before: [[bunsei-era|Bunsei]]. After: [[koka-era|Kōka]].
