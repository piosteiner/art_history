name: Akvan
names: [Akvan Div]
category: mythology and legend
definition: In the Persian Shahnameh, the shape-shifting demon (div) who appeared as a golden onager and threw the sleeping Rostam into the sea.
description_md: |-
  The Akvan Div haunted the herds of the Persian king, appearing as a wild onager (a kind of wild ass) with golden fur. [[rostam]] searched for it for days, but it kept vanishing. When the exhausted hero finally fell asleep, Akvan lifted the ground he lay on into the sky and gave him a cruel choice: be thrown onto the mountains or into the sea. Rostam knew demons do the opposite of what you ask, so he begged for the mountains. Akvan threw him into the sea, exactly as Rostam hoped. He swam ashore and later killed the demon.

  *From:* Shahnameh · Persian
