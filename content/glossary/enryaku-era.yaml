definition: "Japanese era name (延暦) for the years 782–805: 782 is Enryaku 1 (元年) and Enryaku 24 is 805."
description_md: |-
  **Enryaku** (延暦) is a Japanese era name ([[nengo]]), proclaimed in 782. Its years are counted in lunar years from the new year before the proclamation: 782 is Enryaku 1 (元年), 805 its last year, Enryaku 24. A Japanese source dates a year within it as "Enryaku 2" (延暦2年) rather than by a continuous count.

  Before: [[teno-era|Ten'ō]]. After: [[daido-era|Daidō]].
