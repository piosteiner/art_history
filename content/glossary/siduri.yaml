public_id: 131301
name: Siduri
category: mythology and legend
definition: In the Epic of Gilgamesh, the tavern keeper at the edge of the world who in the Old Babylonian version tells Gilgamesh to give up his search for immortality and enjoy life.
description_md: |-
  She ran an inn by the sea at the end of the world. In the Old Babylonian version, she told [[gilgamesh]] to give up his search for immortality and enjoy life instead: good food, clean clothes, dancing and a family. It's one of the oldest pieces of life advice ever written.

  *From:* Epic of Gilgamesh · Mesopotamian (Sumerian, Babylonian, Assyrian)
