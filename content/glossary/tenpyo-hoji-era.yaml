definition: "Japanese era name (天平宝字) for the years 757–764: 757 is Tenpyō-hōji 1 (元年) and Tenpyō-hōji 8 is 764."
description_md: |-
  **Tenpyō-hōji** (天平宝字) is a Japanese era name ([[nengo]]), proclaimed in 757. Its years are counted in lunar years from the new year before the proclamation: 757 is Tenpyō-hōji 1 (元年), 764 its last year, Tenpyō-hōji 8. A Japanese source dates a year within it as "Tenpyō-hōji 2" (天平宝字2年) rather than by a continuous count.

  Before: [[tenpyo-shoho-era|Tenpyō-shōhō]]. After: [[tenpyo-jingo-era|Tenpyō-jingo]].
