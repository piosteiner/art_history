definition: "Japanese era name (元久) for the years 1204–1206: 1204 is Genkyū 1 (元年) and Genkyū 3 is 1206."
description_md: |-
  **Genkyū** (元久) is a Japanese era name ([[nengo]]), proclaimed in 1204. Its years are counted in lunar years from the new year before the proclamation: 1204 is Genkyū 1 (元年), 1206 its last year, Genkyū 3. A Japanese source dates a year within it as "Genkyū 2" (元久2年) rather than by a continuous count.

  Before: [[kennin-era|Kennin]]. After: [[kenei-era|Ken'ei]].
