name: Momotarō
names: [Peach Boy, Momotaro]
category: mythology and legend
definition: The Peach Boy of Japanese folktale, found inside a giant peach, who with a dog, a monkey and a pheasant defeated the oni of Onigashima, Demon Island, and brought their treasure home.
description_md: |-
  An old childless couple found a giant peach floating down a river, and when they cut it open, a baby boy was inside. They named him Momotarō, "Peach Boy". When he grew up, he set off to defeat the oni (ogres) who were raiding the land from their fortress on Onigashima, Demon Island. Along the way, he shared his millet dumplings with a dog, a monkey and a pheasant, who joined him. Together they stormed the island, defeated the oni and brought their treasure home.

  *From:* folktale · Japanese
