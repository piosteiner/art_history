definition: "Japanese era name (享徳) for the years 1452–1455: 1452 is Kyōtoku 1 (元年) and Kyōtoku 4 is 1455."
description_md: |-
  **Kyōtoku** (享徳) is a Japanese era name ([[nengo]]), proclaimed in 1452. Its years are counted in lunar years from the new year before the proclamation: 1452 is Kyōtoku 1 (元年), 1455 its last year, Kyōtoku 4. A Japanese source dates a year within it as "Kyōtoku 2" (享徳2年) rather than by a continuous count.

  Before: [[hotoku-era|Hōtoku]]. After: [[kosho-era|Kōshō]].
