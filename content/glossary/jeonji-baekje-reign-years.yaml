public_id: 113261
name: Jeonji of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 전지왕
  - lang: ko-Hani
    role: alternative
    text: 腆支王
category: calendar
definition: "The reign years of King Jeonji of Baekje (腆支王, 전지왕), by which Korean histories date 405–420: 405 is Jeonji 1, 420 Jeonji 16."
description_md: |-
  **Jeonji** (腆支王, 전지왕): the years of the reign of King Jeonji of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 414 is Jeonji 10 (전지왕 10년). The year of the accession, 405, counts as the first year.

  Before: [[asin-baekje-reign-years|Asin]]. After: [[guisin-baekje-reign-years|Guisin]].
sources:
  definition:
    - source: dila-time-authority
