category: calendar
definition: "Japanese era name (寛平) for the years 889–897: 889 is Kanpyō 1 (元年) and Kanpyō 9 is 897."
description_md: |-
  **Kanpyō** (寛平) is a Japanese era name ([[nengo]]), proclaimed in 889. Its years are counted in lunar years from the new year before the proclamation: 889 is Kanpyō 1 (元年), 897 its last year, Kanpyō 9. A Japanese source dates a year within it as "Kanpyō 2" (寛平2年) rather than by a continuous count.

  Before: [[ninna-era|Ninna]]. After: [[shotai-era|Shōtai]].
