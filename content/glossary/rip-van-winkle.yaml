public_id: 131651
name: Rip Van Winkle
category: mythology and legend
definition: The villager of Washington Irving's story who slept for twenty years in the Catskill Mountains and woke after the American Revolution.
description_md: |-
  Another Washington Irving story. A lazy villager in the Catskill Mountains drank with ghostly Dutch sailors playing ninepins and fell asleep. He woke up twenty years later with a long grey beard, to find the American Revolution had happened while he slept.

  *From:* Washington Irving, Rip Van Winkle (1819) · American
