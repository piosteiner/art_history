name: Iara
names: [Yara]
category: mythology and legend
definition: A beautiful river mermaid of the Amazon in Brazilian folklore, who sings on rocks and draws men into the water.
description_md: |-
  A beautiful woman who sings on rocks in the river and draws men into the water, where they drown or vanish forever. In some versions, she was a warrior who was so skilled that her jealous brothers tried to kill her; she killed them defending herself and was punished by being thrown into the river (in other versions they killed her and threw her body in).

  *From:* folklore · Brazilian (Tupi-Guarani)
