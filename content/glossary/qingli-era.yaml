name: Qingli
names:
  - lang: zh
    role: original
    text: 慶曆
category: calendar
parent: chinese-calendar
definition: "Chinese era name (慶曆) of the Northern Song for the years 1041–1048: 1041 is Qingli 1 (元年) and Qingli 8 is 1048."
description_md: |-
  **Qingli** (慶曆) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1041 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1041 is Qingli 1 (元年), 1048 its last year, Qingli 8. A Chinese source dates a year within it as "Qingli 2" (慶曆二年) rather than by a continuous count.

  Before: [[kangding-era|Kangding]]. After: [[huangyou-era|Huangyou]].
sources:
