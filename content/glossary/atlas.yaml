definition: In Greek myth the Titan condemned to hold up the sky for ever, often shown carrying a globe.
description_md: |-
  The Titan condemned to hold up the sky (often shown as the globe) for ever.

  **In art:** A strong man bending under a globe on his shoulders.

  **Famous works**

  - *Farnese Atlas* (Naples)
  - Lee Lawrie, *Atlas* (Rockefeller Center, New York)

  *From:* Greek mythology · Ancient Greek
