definition: "Japanese era name (治暦) for the years 1065–1069: 1065 is Jiryaku 1 (元年) and Jiryaku 5 is 1069."
description_md: |-
  **Jiryaku** (治暦) is a Japanese era name ([[nengo]]), proclaimed in 1065. Its years are counted in lunar years from the new year before the proclamation: 1065 is Jiryaku 1 (元年), 1069 its last year, Jiryaku 5. A Japanese source dates a year within it as "Jiryaku 2" (治暦2年) rather than by a continuous count.

  Before: [[kohei-era|Kōhei]]. After: [[enkyu-era|Enkyū]].
