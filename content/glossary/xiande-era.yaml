public_id: 112961
name: Xiande
names:
  - lang: zh
    role: original
    text: 顯德
category: calendar
definition: "Chinese era name (顯德) of the Later Zhou for the years 954–960: 954 is Xiande 1 (元年) and Xiande 7 is 960."
description_md: |-
  **Xiande** (顯德) is a Chinese era name ([[nianhao]]) of the Later Zhou, proclaimed in 954 under Emperor Taizu (太祖). Its years are counted in lunar years: 954 is Xiande 1 (元年), 960 its last year, Xiande 7. A Chinese source dates a year within it as "Xiande 2" (顯德二年) rather than by a continuous count.

  Before: [[guangshun-era|Guangshun]].
sources:
  definition:
    - source: dila-time-authority
