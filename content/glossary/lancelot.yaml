definition: The greatest of the Knights of the Round Table and one of King Arthur's closest friends, whose love for Queen Guinevere led to the fall of Camelot.
description_md: |-
  [[guinevere]] was [[king-arthur|Arthur]]'s queen. Her love affair with Sir Lancelot, the greatest of the knights and one of Arthur's closest friends, split the Round Table apart and led to the fall of Camelot.

  **In art:** A queen and a knight in a secret embrace, or a repentant queen in a convent.

  **Famous works**

  - [[artist/dante-gabriel-rossetti]], *Arthur's Tomb* (Tate)
  - Herbert James Draper, *Lancelot and Guinevere*

  *From:* Arthurian legend · British (Arthurian legend)
