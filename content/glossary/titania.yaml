definition: The fairy queen of Shakespeare's A Midsummer Night's Dream, who falls in love with the weaver Bottom while he has a donkey's head.
description_md: |-
  From *A Midsummer Night's Dream*: the fairies Titania, [[oberon]] and [[puck]], where Titania falls in love with Bottom, who has a donkey's head.

  **In art:** A fairy queen embracing a man with a donkey's head.

  **Famous works**

  - [[artist/henry-fuseli]], *Titania and Bottom* (c. 1790; Tate, London)
  - Joseph Noel Paton, *The Quarrel of Oberon and Titania* (1849; Scottish National Gallery, Edinburgh)

  *From:* William Shakespeare, A Midsummer Night's Dream · English
