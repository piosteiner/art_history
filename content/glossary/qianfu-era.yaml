name: Qianfu
names:
  - lang: zh
    role: original
    text: 乾符
category: calendar
parent: chinese-calendar
definition: "Chinese era name (乾符) of the Tang for the years 874–879: 874 is Qianfu 1 (元年) and Qianfu 6 is 879."
description_md: |-
  **Qianfu** (乾符) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 874 under Emperor Xizong (僖宗). Its years are counted in lunar years: 874 is Qianfu 1 (元年), 879 its last year, Qianfu 6. A Chinese source dates a year within it as "Qianfu 2" (乾符二年) rather than by a continuous count.

  Before: [[xiantong-era|Xiantong]]. After: [[guangming-era|Guangming]].
sources:
  definition:
    - source: dila-time-authority
