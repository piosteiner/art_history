name: Sterntaler
names: [The Star Money]
category: mythology and legend
definition: The Grimms' fairy tale of a poor orphan girl who gives everything away and is rewarded when the stars fall from the sky as silver coins.
description_md: |-
  She gave away her bread, cap, jacket and finally her shirt to people poorer than she was. Standing alone in the forest at night, she saw the stars fall from the sky as silver coins, and she was given a fine new linen shirt to collect them in.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
