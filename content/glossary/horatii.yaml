name: Horatii
names: [The Oath of the Horatii, Horatii and Curiatii]
category: mythology and legend
also_in: [iconography]
definition: The three Roman brothers who fought three Alban champions, the Curiatii, to decide a war; only one Horatius survived, and Rome won.
description_md: |-
  In a war between Rome and the city of Alba Longa, the two sides agreed to settle it by a fight between three champions each: the Roman Horatii brothers and the Alban Curiatii. Only one Horatius survived, and Rome won.

  **In art:** Three brothers swearing an oath with raised arms before their father, who holds out their swords, while the women grieve.

  **Famous works**

  - [[artist/jacques-louis-david]], *The Oath of the Horatii* (Louvre), the founding painting of Neoclassicism — [[artwork/the-oath-of-the-horatii]]

  *From:* Livy, History of Rome · Ancient Roman
