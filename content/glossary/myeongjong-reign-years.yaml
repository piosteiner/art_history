name: Myeongjong (reign years)
names:
  - lang: ko
    role: original
    text: 명종
  - lang: ko-Hani
    role: alternative
    text: 明宗
category: calendar
definition: "The reign years of Myeongjong of Joseon (明宗, 명종), by which Korean sources date 1546–1567: 1546 is Myeongjong 1, 1567 Myeongjong 22."
description_md: |-
  **Myeongjong** (明宗, 명종): the years of the reign of [[person/myeongjong-of-joseon|Myeongjong of Joseon]], who came to the throne on 16 July 1545. Korean sources count years by the reigning king ([[korean-reign-years]]): 1555 is Myeongjong 10 (명종 10년). His first year is 1546, the year after his accession; the rest of 1545 still counts for his predecessor.

  Before: [[injong-reign-years|Injong]]. After: [[seonjo-reign-years|Seonjo]].
