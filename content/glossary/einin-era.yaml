category: calendar
definition: "Japanese era name (永仁) for the years 1293–1298: 1293 is Einin 1 (元年) and Einin 6 is 1298."
description_md: |-
  **Einin** (永仁) is a Japanese era name ([[nengo]]), proclaimed in 1293. Its years are counted in lunar years from the new year before the proclamation: 1293 is Einin 1 (元年), 1298 its last year, Einin 6. A Japanese source dates a year within it as "Einin 2" (永仁2年) rather than by a continuous count.

  Before: [[shoo-era|Shōō]]. After: [[shoan-era|Shōan]].
