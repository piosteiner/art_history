public_id: 132354
name: The Seven Liberal Arts
category: iconography
definition: The medieval curriculum — Grammar, Rhetoric, Logic (trivium) and Arithmetic, Geometry, Music, Astronomy (quadrivium) — each shown as a woman with an attribute.
description_md: |-
  The medieval school curriculum: the *trivium* (Grammar, Rhetoric, Logic) and the *quadrivium* (Arithmetic, Geometry, Music, Astronomy). Each is a woman with an attribute, often accompanied by a famous practitioner: Grammar with a whip and pupils, Geometry with a compass, Music with bells or an organ, Astronomy with an astrolabe.

  **Famous works**

  - Botticelli, *A Young Man Being Introduced to the Seven Liberal Arts* (fresco from the Villa Lemmi, Louvre)
  - *Chartres Cathedral, Royal Portal sculptures* (Chartres)
  - Andrea di Bonaiuto, *Triumph of Saint Thomas Aquinas* (Spanish Chapel, Santa Maria Novella)

  *From:* European (medieval)
