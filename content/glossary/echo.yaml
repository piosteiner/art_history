definition: In Ovid's Metamorphoses, the nymph cursed to repeat only others' last words, who loved Narcissus and faded away until only her voice remained.
description_md: |-
  The nymph Echo was cursed to only repeat others' last words. She fell in love with the beautiful youth [[narcissus]], who rejected her, and she faded away until only her voice remained.

  **In art:** A nymph watching from the background as a youth gazes at his reflection in water.

  **Famous works**

  - Waterhouse, *Echo and Narcissus* (Walker Art Gallery, Liverpool)
  - [[artist/nicolas-poussin]], *Echo and Narcissus* (Louvre)

  *From:* Ovid, Metamorphoses · Ancient Greek
