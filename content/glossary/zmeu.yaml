name: Zmeu
names: [zmei]
category: mythology and legend
definition: In Romanian folklore, a shape-shifting dragon-man with human features who kidnaps princesses and is almost always defeated by a hero such as Făt-Frumos.
description_md: |-
  Zmei are shape-shifting dragon-men with human features who kidnap princesses and are almost always defeated by a hero such as [[fat-frumos]]. Their ugly old mother, [[baba-cloanta]], is just as dangerous.

  *From:* Romanian folklore · Romanian
