public_id: 112950
name: Kaiyun
names:
  - lang: zh
    role: original
    text: 開運
category: calendar
definition: "Chinese era name (開運) of the Later Jin for the years 944–947: 944 is Kaiyun 1 (元年) and Kaiyun 4 is 947."
description_md: |-
  **Kaiyun** (開運) is a Chinese era name ([[nianhao]]) of the Later Jin, proclaimed in 944 under Shi Chonggui (出帝). Its years are counted in lunar years: 944 is Kaiyun 1 (元年), 947 its last year, Kaiyun 4. A Chinese source dates a year within it as "Kaiyun 2" (開運二年) rather than by a continuous count.

  Before: [[tianfu-era|Tianfu]].
sources:
  definition:
    - source: dila-time-authority
