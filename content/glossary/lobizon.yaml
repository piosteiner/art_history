name: Lobizón
names: [Luisón, Luison]
category: mythology and legend
definition: The werewolf of South American folklore, said to be the seventh son in a row, who changes on Friday nights under the full moon.
description_md: |-
  The seventh son in a row is said to become a lobizón, a creature like a wolf or dog, on Friday nights under the full moon. Because seventh sons were sometimes abandoned or killed out of this fear, the President of Argentina became the godparent of seventh sons — informally since the 19th century, officially from 1907, by decree since 1973. The tradition still exists.

  *From:* folklore · Guaraní, Rioplatense
