name: Flight into Egypt
names: [The Flight into Egypt, Rest on the Flight into Egypt]
category: iconography
definition: Joseph, warned by an angel, taking Mary and the baby Jesus to safety in Egypt.
description_md: |-
  Warned by an angel in a dream, [[person/saint-joseph|Joseph]] takes [[person/mary]] and the baby to safety in Egypt.

  **In art:** Mary and the child on a donkey, led by Joseph, or the family resting on the way, often under a palm tree.

  **Famous works**

  - [[artist/giotto]], *Flight into Egypt* (Scrovegni Chapel)
  - [[artist/caravaggio]], *Rest on the Flight into Egypt* (Galleria Doria Pamphilj)
  - Adam Elsheimer, *The Flight into Egypt* (Munich, a famous night scene)

  *From:* New Testament, Gospels · Christian
