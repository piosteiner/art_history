name: Pele
category: religion
definition: The Hawaiian goddess of fire and volcanoes, said to live in the crater of Kīlauea on Hawaiʻi's Big Island.
description_md: |-
  Pele is the goddess of fire and volcanoes, said to have travelled across the ocean from her homeland and to live in the crater of Kīlauea on Hawaiʻi's Big Island. Her moods are seen in the volcano's eruptions, and her stories are full of fiery passions and rivalries with her sisters.

  **Held sacred today:** Pele is still deeply honoured in Hawaiʻi, and people leave offerings for her at the volcano today.

  *From:* Hawaiian tradition · Hawaiian
