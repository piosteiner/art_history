public_id: 131636
name: Madhavi
category: mythology and legend
definition: The courtesan and brilliant dancer of the Tamil epic Silappatikaram, for whom Kovalan left Kannagi; later a Buddhist nun.
description_md: |-
  A courtesan and brilliant dancer whom Kovalan left [[kannagi]] for. Later, she gave up her life of pleasure and became a Buddhist nun. Her daughter Manimekalai is the heroine of the sequel epic.

  *From:* Silappatikaram · Tamil
