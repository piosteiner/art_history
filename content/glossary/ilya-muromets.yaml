name: Ilya Muromets
category: mythology and legend
definition: "The most beloved of the Russian bogatyrs: a peasant's son who sat paralysed for thirty-three years, was healed by pilgrims and defeated Nightingale the Robber."
description_md: |-
  Ilya Muromets was a peasant's son who could not walk and sat on the stove of his parents' home for thirty-three years. One day, wandering pilgrims healed him (in some versions his great strength comes from the dying giant Svyatogor). He rode off to serve the prince in Kiev, defeated the monstrous bandit Nightingale the Robber, whose whistle could flatten forests, and defended the land against invaders. He's the most beloved of all the bogatyrs.

  *From:* byliny · Russian
