definition: "Japanese era name (弘長) for the years 1261–1264: 1261 is Kōchō 1 (元年) and Kōchō 4 is 1264."
description_md: |-
  **Kōchō** (弘長) is a Japanese era name ([[nengo]]), proclaimed in 1261. Its years are counted in lunar years from the new year before the proclamation: 1261 is Kōchō 1 (元年), 1264 its last year, Kōchō 4. A Japanese source dates a year within it as "Kōchō 2" (弘長2年) rather than by a continuous count.

  Before: [[buno-era|Bun'ō]]. After: [[bunei-era|Bun'ei]].
