public_id: 106661
name: shinmei-zukuri
names:
  - lang: ja
    role: original
    text: "{神明造|しんめいづくり}"
category: architecture
definition: "The style of the shrine at Ise: a raised hall of plain wood on round posts, three bays wide, entered on a long side, with a thatched gable roof, chigi at the gable ends and katsuogi on the ridge; derived from the raised granaries of the Yayoi period."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 56–57
