definition: The knight of medieval legend who escorted the Irish princess Isolde to his uncle King Mark and, after drinking a love potion with her by accident, was bound to her in a fatal love.
description_md: |-
  Sir Tristan escorted the Irish princess [[isolde]] to marry his uncle, King Mark of Cornwall. On the voyage, they accidentally drank a love potion, and fell into a love that destroyed them both. Wagner turned it into his opera *Tristan und Isolde*.

  **In art:** A knight and a lady sharing a goblet on a ship, or a dying knight with a lady arriving too late.

  **Famous works**

  - John William Waterhouse, *Tristan and Isolde with the Potion*
  - Edmund Blair Leighton, *Tristan and Isolde*
  - [[artist/dante-gabriel-rossetti]] (design), *Sir Tristram and La Belle Ysoude Drinking the Love Potion* (stained-glass panel, Morris, Marshall, Faulkner & Co., 1862; Bradford Museums and Galleries)

  *From:* Tristan legend; Wagner, Tristan und Isolde · Celtic and medieval European
