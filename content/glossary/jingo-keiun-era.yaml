    text: 神護景雲
category: calendar
definition: "Japanese era name (神護景雲) for the years 767–769: 767 is Jingo-keiun 1 (元年) and Jingo-keiun 3 is 769."
description_md: |-
  **Jingo-keiun** (神護景雲) is a Japanese era name ([[nengo]]), proclaimed in 767. Its years are counted in lunar years from the new year before the proclamation: 767 is Jingo-keiun 1 (元年), 769 its last year, Jingo-keiun 3. A Japanese source dates a year within it as "Jingo-keiun 2" (神護景雲2年) rather than by a continuous count.

  Before: [[tenpyo-jingo-era|Tenpyō-jingo]]. After: [[hoki-era|Hōki]].
