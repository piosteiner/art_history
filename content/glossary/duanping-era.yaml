name: Duanping
names:
  - lang: zh
    role: original
    text: 端平
category: calendar
parent: chinese-calendar
definition: "Chinese era name (端平) of the Southern Song for the years 1234–1236: 1234 is Duanping 1 (元年) and Duanping 3 is 1236."
description_md: |-
  **Duanping** (端平) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1234 under Emperor Lizong (理宗). Its years are counted in lunar years: 1234 is Duanping 1 (元年), 1236 its last year, Duanping 3. A Chinese source dates a year within it as "Duanping 2" (端平二年) rather than by a continuous count.

  Before: [[shaoding-era|Shaoding]]. After: [[jiaxi-era|Jiaxi]].
sources:
