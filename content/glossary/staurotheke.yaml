category: object type
definition: reliquary containing fragments of the True Cross
description_md: A staurotheke (from the Greek *stauros*, "cross", and *theke*, "container") is a reliquary for fragments of the True Cross.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The box-shaped type was common in Byzantium from the ninth century.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The best-known example, the [[artwork/limburger-staurothek|Limburg Staurotheke]] of the later tenth century, holds a double-armed cross with a relic composed of seven particles.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 47]]
