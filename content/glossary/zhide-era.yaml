name: Zhide
names:
  - lang: zh
    role: original
    text: 至德
category: calendar
definition: "Chinese era name (至德) of the Tang for the years 756–758: 756 is Zhide 1 (元年) and Zhide 3 is 758."
description_md: |-
  **Zhide** (至德) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 756 under Emperor Suzong (肅宗). Its years are counted in lunar years: 756 is Zhide 1 (元年), 758 its last year, Zhide 3. A Chinese source dates a year within it as "Zhide 2" (至德二年) rather than by a continuous count.

  Before: [[tianbao-era|Tianbao]]. After: [[qianyuan-era|Qianyuan]].
sources:
