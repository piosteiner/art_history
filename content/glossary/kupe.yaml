name: Kupe
category: mythology and legend
definition: The legendary Polynesian navigator and chief from Hawaiki, said to be the first human to discover New Zealand while chasing a giant octopus across the ocean.
description_md: |-
  Kupe was a legendary Polynesian explorer, navigator and chief from Hawaiki, said to be the first human to discover New Zealand. In one tradition, he chased a giant octopus across the ocean, and the hunt led him to the new land. He later sailed home and passed on directions so others could follow.

  *From:* Māori tradition · Māori / Polynesian
