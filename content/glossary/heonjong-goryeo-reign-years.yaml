public_id: 113316
name: Heonjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 헌종
  - lang: ko-Hani
    role: alternative
    text: 獻宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Heonjong of Goryeo (獻宗, 헌종), by which Korean histories date 1095: 1095 is Heonjong 1, 1095 Heonjong 1."
description_md: |-
  **Heonjong** (獻宗, 헌종): the years of the reign of King Heonjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1095 is Heonjong 1 (헌종 1년). The year of the accession, 1095, counts as the first year.

  Before: [[seonjong-goryeo-reign-years|Seonjong]]. After: [[sukjong-goryeo-reign-years|Sukjong]].
sources:
  definition:
    - source: dila-time-authority
