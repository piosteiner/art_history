definition: "Japanese era name (永万) for the years 1165–1166: 1165 is Eiman 1 (元年) and Eiman 2 is 1166."
description_md: |-
  **Eiman** (永万) is a Japanese era name ([[nengo]]), proclaimed in 1165. Its years are counted in lunar years from the new year before the proclamation: 1165 is Eiman 1 (元年), 1166 its last year, Eiman 2. A Japanese source dates a year within it as "Eiman 2" (永万2年) rather than by a continuous count.

  Before: [[chokan-era|Chōkan]]. After: [[ninan-era|Nin'an]].
