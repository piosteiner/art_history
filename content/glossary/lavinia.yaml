definition: In Virgil's Aeneid, the Latin princess whom Aeneas married.
description_md: |-
  Lavinia was the Latin princess [[aeneas]] married. [[turnus]], her former suitor, led the war against Aeneas and was killed by him in single combat.

  **Famous works**

  - [[artist/pietro-da-cortona]], *Aeneid* frescoes (Palazzo Pamphilj, Rome)

  *From:* Virgil, Aeneid · Ancient Roman
