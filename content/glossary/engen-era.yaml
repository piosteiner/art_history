definition: "Japanese era name (延元) for the years 1336–1340 of the Southern Court: 1336 is Engen 1 (元年) and Engen 5 is 1340."
description_md: |-
  **Engen** (延元) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras, proclaimed in 1336. Its years are counted in lunar years from the new year before the proclamation: 1336 is Engen 1 (元年), 1340 its last year, Engen 5. A Japanese source dates a year within it as "Engen 2" (延元2年) rather than by a continuous count.

  After: [[kokoku-era|Kōkoku]].
