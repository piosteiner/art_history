name: Makeda
names: [Queen of Sheba]
category: mythology and legend
definition: The Queen of Sheba of the Ethiopian epic Kebra Nagast, who visited King Solomon; their son Menelik I founded Ethiopia's royal dynasty.
description_md: |-
  In the Ethiopian epic *Kebra Nagast* ("Glory of the Kings"), Queen Makeda travelled to Jerusalem to test [[person/solomon]]'s wisdom. Their son [[menelik-i]] founded Ethiopia's royal dynasty. According to the legend, he brought the Ark of the Covenant back to Ethiopia, where it's said to be kept in Aksum today.

  *From:* Kebra Nagast · Ethiopian
