name: La Llorona
names: [The Weeping Woman]
category: mythology and legend
definition: In Mexican folklore, the ghost of a woman who drowned her own children and wanders by rivers at night crying for them.
description_md: |-
  In the best-known version, she drowned her own children after their father left her, and now she's doomed to look for them forever, wailing "¡Ay, mis hijos!" by rivers at night. It's one of Mexico's most famous ghost stories.

  *From:* Mexican folklore · Mexican
