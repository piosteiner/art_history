description_md: |-
  In medieval wood sculpture walnut was, with oak, one of the hardwoods.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] Up to the end of the eleventh century, the early use of hardwoods such as oak and walnut seems to have been limited to the Rhineland and the adjacent regions of Belgium and Westphalia; later walnut became common in the climatically favourable parts of the Rhineland, France and Belgium.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] The throne of the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]] (about 980) is of lime and walnut.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 14]]

  For the Romanesque Madonnas of France, Ilene Forsyth found walnut favoured in the south — the [[artwork/morgan-madonna|Morgan Madonna]], [[artwork/montvianeix-madonna|Notre-Dame de Montvianeix]], Orcival — while oak and birch were used further north; she noted that walnut was not available in large natural supply in the Auvergne, where resinous woods abound.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] Its homogeneous grain and uniform vessels make walnut less likely to split than oak, which suited the Auvergne practice of assembling small statues from many separately carved pieces.[[source/forsyth-1972-the-throne-of-wisdom|p. 18]] The Morgan Madonna consists of at least twenty-two pieces of walnut.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]]

  In the late sixth century, the anonymous pilgrim of Piacenza reported that the relic of the True Cross in Jerusalem was of walnut.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 42]]
