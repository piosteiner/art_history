public_id: 130922
name: Adze
category: mythology and legend
definition: In the folklore of the Ewe people of Ghana and Togo, a vampire spirit that flies about as a firefly and can possess humans.
description_md: |-
  In the folklore of the Ewe people of Ghana and Togo, the adze is a vampire spirit that flies about in the form of a firefly. It slips into houses at night to drink people's blood and can possess humans, turning them into witches.

  *From:* folklore · Ewe (Ghana and Togo)
