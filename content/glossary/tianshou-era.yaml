name: Tianshou
names:
  - lang: zh
    role: original
    text: 天授
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天授) of the Zhou of Empress Wu for the years 690–692: 690 is Tianshou 1 (元年) and Tianshou 3 is 692."
description_md: |-
  **Tianshou** (天授) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 690 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 690 is Tianshou 1 (元年), 692 its last year, Tianshou 3. A Chinese source dates a year within it as "Tianshou 2" (天授二年) rather than by a continuous count.

  Before: [[zaichu-era|Zaichu]]. After: [[ruyi-era|Ruyi]].
sources:
  definition:
    - source: dila-time-authority
