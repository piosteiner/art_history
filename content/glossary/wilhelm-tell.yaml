definition: Switzerland's legendary national hero, forced by the bailiff Gessler to shoot an apple off his son's head with his crossbow.
description_md: |-
  Switzerland's national hero. The Habsburg bailiff Gessler forced him to shoot an apple off his son's head with his crossbow. He did, and later killed Gessler and helped free the Swiss cantons. Made famous by Schiller's play *Wilhelm Tell* (1804).

  **In art:** A man with a crossbow and a boy with an apple on his head, or a hero leaping from a boat in a storm on Lake Lucerne (the *Tellsprung*).

  **Famous works**

  - Richard Kissling, *Tell Monument* (Altdorf, 1895)
  - [[artist/ferdinand-hodler]], *Wilhelm Tell* (1896/97; Kunstmuseum Solothurn)

  *From:* Swiss legend; Friedrich Schiller, Wilhelm Tell · Swiss
