public_id: 112992
name: Taiping Xingguo
names:
  - lang: zh
    role: original
    text: 太平興國
category: calendar
definition: "Chinese era name (太平興國) of the Northern Song for the years 976–984: 976 is Taiping Xingguo 1 (元年) and Taiping Xingguo 9 is 984."
description_md: |-
  **Taiping Xingguo** (太平興國) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 977 under Emperor Taizong (太宗). Its years are counted in lunar years: 976 is Taiping Xingguo 1 (元年), 984 its last year, Taiping Xingguo 9. A Chinese source dates a year within it as "Taiping Xingguo 2" (太平興國二年) rather than by a continuous count.

  Before: [[kaibao-era|Kaibao]]. After: [[yongxi-era|Yongxi]].
sources:
  definition:
    - source: dila-time-authority
