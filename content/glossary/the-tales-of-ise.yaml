definition: A tenth-century collection of short poem stories about the poet-courtier Ariwara no Narihira; its irises at the eight bridges (Yatsuhashi) are a famous subject.
description_md: |-
  A 10th-century collection of short poem stories, mostly about the handsome poet-courtier Narihira and his love affairs. In the most famous scene, he crossed eight bridges (Yatsuhashi) on a journey and wrote a poem about the irises blooming there.

  **In art:** Purple irises along zigzag wooden bridges, often without any people at all, or a courtier on horseback seeing [[mount-fuji]].

  **Famous works**

  - [[artist/ogata-korin]], *Irises* (screens, Nezu Museum, Tokyo)
  - Ogata Kōrin, *Irises at Yatsuhashi* (Metropolitan Museum)

  *From:* The Tales of Ise · Japanese
