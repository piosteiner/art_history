name: Ghul
names: [Ghoul]
category: mythology and legend
definition: In pre-Islamic Arabian folklore, a shapeshifting desert creature that haunts graveyards and lures travellers to devour them; origin of the English word "ghoul".
description_md: |-
  In pre-Islamic Arabian folklore, the ghul is a shapeshifting desert creature that haunts graveyards and lonely places. It lures travellers off the path, often taking the form of an animal or a woman, and devours them, or feeds on the dead. The English word "ghoul" comes directly from it.

  *From:* pre-Islamic Arabian folklore · Arabic
