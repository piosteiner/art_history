name: Xianqing
names:
  - lang: zh
    role: original
    text: 顯慶
category: calendar
parent: chinese-calendar
definition: "Chinese era name (顯慶) of the Tang for the years 656–661: 656 is Xianqing 1 (元年) and Xianqing 6 is 661."
description_md: |-
  **Xianqing** (顯慶) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 656 under Emperor Gaozong (高宗). Its years are counted in lunar years: 656 is Xianqing 1 (元年), 661 its last year, Xianqing 6. A Chinese source dates a year within it as "Xianqing 2" (顯慶二年) rather than by a continuous count.

  Before: [[yonghui-era|Yonghui]]. After: [[longshuo-era|Longshuo]].
sources:
  definition:
