name: Iphigenia
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the daughter of Agamemnon, sacrificed to get winds for the Greek fleet (in some versions replaced by a deer).
description_md: |-
  [[agamemnon]], king of Mycenae, led the Greeks to Troy. To get winds for the fleet, he sacrificed his daughter Iphigenia (in some versions [[artemis]] replaced her with a deer). When he came home, his wife [[clytemnestra]] murdered him in his bath (so in Aeschylus' Oresteia; in [[person/homer]] it is Aegisthus who kills him). Their son [[orestes]] later killed her, and was hunted by the Furies.

  **In art:** A young girl led to the altar.

  **Famous works**

  - Tiepolo, *The Sacrifice of Iphigenia* (Villa Valmarana ai Nani, Vicenza)

  *From:* Euripides, Iphigenia in Aulis · Ancient Greek
