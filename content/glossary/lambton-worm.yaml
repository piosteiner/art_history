name: Lambton Worm
category: mythology and legend
definition: A giant worm-dragon of County Durham legend, fished from a river by young John Lambton and killed by him on his return from the Crusades.
description_md: |-
  Young John Lambton skipped church to go fishing and caught a small, ugly worm, which he threw into a well. It grew into a huge dragon that coiled around a hill and ate sheep and children. He came back from the Crusades, wearing armour covered in spikes, and killed it in the river. Because he broke a vow (to kill the first living thing he met after the fight, which was his father), his family was cursed for nine generations.

  *From:* folklore · English (County Durham)
