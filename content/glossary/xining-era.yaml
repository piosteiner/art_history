name: Xining
names:
  - lang: zh
    role: original
    text: 熙寧
category: calendar
parent: chinese-calendar
definition: "Chinese era name (熙寧) of the Northern Song for the years 1068–1077: 1068 is Xining 1 (元年) and Xining 10 is 1077."
description_md: |-
  **Xining** (熙寧) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1068 under Emperor Shenzong (神宗). Its years are counted in lunar years: 1068 is Xining 1 (元年), 1077 its last year, Xining 10. A Chinese source dates a year within it as "Xining 2" (熙寧二年) rather than by a continuous count.

  Before: [[zhiping-era|Zhiping]]. After: [[yuanfeng-era|Yuanfeng]].
sources:
