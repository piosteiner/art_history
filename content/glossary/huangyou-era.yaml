public_id: 113008
name: Huangyou
names:
  - lang: zh
    role: original
    text: 皇祐
category: calendar
definition: "Chinese era name (皇祐) of the Northern Song for the years 1049–1054: 1049 is Huangyou 1 (元年) and Huangyou 6 is 1054."
description_md: |-
  **Huangyou** (皇祐) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1049 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1049 is Huangyou 1 (元年), 1054 its last year, Huangyou 6. A Chinese source dates a year within it as "Huangyou 2" (皇祐二年) rather than by a continuous count.

  Before: [[qingli-era|Qingli]]. After: [[zhihe-era|Zhihe]].
sources:
