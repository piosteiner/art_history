definition: In Greek myth the sorceress of the island of Aeaea who turned Odysseus's men into pigs and became his lover for a year.
description_md: |-
  A sorceress on the island of Aeaea who turned [[odysseus]]'s men into pigs. Odysseus resisted her magic with a herb from [[hermes]], and she became his lover for a year.

  **In art:** A beautiful woman offering a cup or holding a wand, with pigs or other animals at her feet.

  **Famous works**

  - Waterhouse, *Circe Offering the Cup to Ulysses* (Gallery Oldham) and *Circe Invidiosa* (Art Gallery of South Australia, Adelaide)
  - Dosso Dossi, *Circe and Her Lovers in a Landscape* (National Gallery of Art, Washington)

  *From:* Homer, Odyssey · Ancient Greek
