public_id: 113325
name: Gojong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 고종
  - lang: ko-Hani
    role: alternative
    text: 高宗
category: calendar
definition: "The reign years of King Gojong of Goryeo (高宗, 고종), by which Korean histories date 1214–1260: 1214 is Gojong 1, 1260 Gojong 47."
description_md: |-
  **Gojong** (高宗, 고종): the years of the reign of King Gojong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1223 is Gojong 10 (고종 10년). The year of the accession, 1214, counts as the first year.

  Before: [[gangjong-goryeo-reign-years|Gangjong]]. After: [[wonjong-goryeo-reign-years|Wonjong]].
sources:
  definition:
    - source: dila-time-authority
