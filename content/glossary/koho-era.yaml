definition: "Japanese era name (康保) for the years 964–967: 964 is Kōhō 1 (元年) and Kōhō 4 is 967."
description_md: |-
  **Kōhō** (康保) is a Japanese era name ([[nengo]]), proclaimed in 964. Its years are counted in lunar years from the new year before the proclamation: 964 is Kōhō 1 (元年), 967 its last year, Kōhō 4. A Japanese source dates a year within it as "Kōhō 2" (康保2年) rather than by a continuous count.

  Before: [[owa-era|Ōwa]]. After: [[anna-era|Anna]].
