name: Aeolus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the keeper of the winds, who gave Odysseus the bad winds tied up in a bag.
description_md: |-
  Other episodes of the *Odyssey*. Aeolus, keeper of the winds, gave [[odysseus]] all the bad winds tied up in a bag, but his curious crew opened it and were blown back. [[the-lotus-eaters]]' fruit made men forget their homes. In the Underworld (the *Nekyia*), Odysseus summoned the dead with blood to consult the prophet Tiresias.

  **In art:** Sailors opening a bag as storm winds burst out.

  **Famous works**

  - Alessandro Allori and others, *Odyssey* fresco cycles (Palazzo Salviati, Florence)
  - *Odyssey Landscapes* (Roman frescoes, Vatican Museums)

  *From:* Homer, Odyssey · Ancient Greek
