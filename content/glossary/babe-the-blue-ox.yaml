name: Babe the Blue Ox
category: mythology and legend
definition: Paul Bunyan's huge ox in American tall tales, turned blue in the Winter of the Blue Snow.
description_md: |-
  He was so big that his footprints made Minnesota's ten thousand lakes, and he dug the Grand Canyon by dragging his axe behind him. His ox Babe turned blue in the Winter of the Blue Snow. Many of the stories were made up or spread by a lumber company's advertising.

  *From:* American tall tales · American
