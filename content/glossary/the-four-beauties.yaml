name: The Four Beauties
names: [Xi Shi, Wang Zhaojun, Diaochan, Yang Guifei]
category: mythology and legend
also_in: [iconography]
definition: "Four legendary beautiful women of Chinese history and legend: Xi Shi, Wang Zhaojun, Diaochan and Yang Guifei."
description_md: |-
  Four legendary beautiful women of Chinese history. Xi Shi was so lovely that fish forgot to swim when they saw her reflection. Wang Zhaojun was a court lady sent to marry a nomad chieftain, playing her *pipa* lute sadly on her way to the north. Diaochan used her beauty to turn two warlords against each other. Yang Guifei was the favourite consort of the Tang emperor Xuanzong; when rebellion broke out, his soldiers forced him to have her executed.

  **In art:** Elegant court women: one washing silk in a stream (Xi Shi), one on horseback with a lute in the snow (Wang Zhaojun), one emerging from a bath (Yang Guifei).

  **Famous works**

  - Qian Xuan, *Yang Guifei Mounting a Horse* (Freer Gallery)
  - Qiu Ying, *Spring Dawn in the Han Palace* (court ladies, National Palace Museum, Taipei)
  - *Yang Guifei (Yōkihi)* (many Japanese paintings)

  *From:* Chinese
