public_id: 131318
name: Adapa
category: mythology and legend
definition: In Mesopotamian myth, a wise man who, following his god's advice, refused the bread and water of eternal life and so stayed mortal.
description_md: |-
  He broke the wing of the South Wind. Called to heaven to be judged, he followed his god's advice not to eat the food offered to him. But it was actually the bread and water of eternal life, so he stayed mortal.

  *From:* Myth of Adapa · Mesopotamian (Sumerian, Babylonian, Assyrian)
