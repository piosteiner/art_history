public_id: 113014
name: Yuanyou
names:
  - lang: zh
    role: original
    text: 元祐
category: calendar
definition: "Chinese era name (元祐) of the Northern Song for the years 1086–1094: 1086 is Yuanyou 1 (元年) and Yuanyou 9 is 1094."
description_md: |-
  **Yuanyou** (元祐) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1086 under Emperor Zhezong (哲宗). Its years are counted in lunar years: 1086 is Yuanyou 1 (元年), 1094 its last year, Yuanyou 9. A Chinese source dates a year within it as "Yuanyou 2" (元祐二年) rather than by a continuous count.

  Before: [[yuanfeng-era|Yuanfeng]]. After: [[shaosheng-era|Shaosheng]].
sources:
  definition:
    - source: dila-time-authority
