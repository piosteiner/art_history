name: Cyclopes
names: [Cyclops]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the one-eyed giants; in Hesiod three brothers who forged Zeus's thunderbolts, in Homer's Odyssey a race of cave-dwelling shepherds such as Polyphemus.
description_md: |-
  The Minotaur, half man and half bull, was the son of the Cretan queen Pasiphaë and a bull, kept in the Labyrinth. The Harpies are winged women who snatch food and people away. The Sphinx sets riddles (see [[oedipus]]). The Hydra is the many-headed serpent of Lerna. The Cyclopes are one-eyed giants: in Hesiod the smiths who forged [[zeus]]'s thunderbolts, in the Odyssey shepherds like [[polyphemus]].

  **In art:** A one-eyed giant.

  **Famous works**

  - [[artist/odilon-redon]], *The Cyclops* (Kröller-Müller Museum, Otterlo)

  *From:* Greek mythology · Ancient Greek
