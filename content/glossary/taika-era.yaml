definition: "Japanese era name (大化) for the years 645–650: 645 is Taika 1 (元年) and Taika 6 is 650."
description_md: |-
  **Taika** (大化) is a Japanese era name ([[nengo]]), proclaimed in 645. Its years are counted in lunar years from the new year before the proclamation: 645 is Taika 1 (元年), 650 its last year, Taika 6. A Japanese source dates a year within it as "Taika 2" (大化2年) rather than by a continuous count.

  After: [[hakuchi-era|Hakuchi]].
