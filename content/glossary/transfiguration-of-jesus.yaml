public_id: 132123
name: Transfiguration of Jesus
names: [The Transfiguration]
category: iconography
definition: Jesus transformed in dazzling light on a mountain before three disciples, with Moses and Elijah beside him.
description_md: |-
  On a mountain, Jesus was transformed in dazzling light before three of his disciples, with the prophets [[person/moses]] and [[person/elijah]] appearing beside him.

  **In art:** Christ floating in radiant white light, with Moses and Elijah, and disciples fallen to the ground below.

  **Famous works**

  - [[artist/raphael]], *The Transfiguration* (Vatican Pinacoteca, his last painting)
  - [[artist/giovanni-bellini]], *The Transfiguration* (Naples)

  *From:* New Testament, Gospels · Christian
