definition: "Japanese era name (貞永) for the years 1232–1233: 1232 is Jōei 1 (元年) and Jōei 2 is 1233."
description_md: |-
  **Jōei** (貞永) is a Japanese era name ([[nengo]]), proclaimed in 1232. Its years are counted in lunar years from the new year before the proclamation: 1232 is Jōei 1 (元年), 1233 its last year, Jōei 2. A Japanese source dates a year within it as "Jōei 2" (貞永2年) rather than by a continuous count.

  Before: [[kangi-era|Kangi]]. After: [[tenpuku-era|Tenpuku]].
