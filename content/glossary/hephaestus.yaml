definition: In Greek myth the god of fire and the forge, the lame smith of the gods and husband of Aphrodite (in the Odyssey; elsewhere of a Grace); the Romans called him Vulcan.
description_md: |-
  God of fire and the forge, the lame smith of the gods, husband of [[aphrodite]] (in the Odyssey; elsewhere of a Grace).

  **In art:** A bearded blacksmith with hammer, tongs and anvil, often limping, working at a forge with the [[cyclopes]].

  **Famous works**

  - Velázquez, *Apollo in the Forge of Vulcan* (Prado) — [[artwork/apollo-in-the-forge-of-vulcan]]

  *From:* Greek mythology · Ancient Greek
