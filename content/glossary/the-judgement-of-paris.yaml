name: The Judgement of Paris
names: [Paris, Apple of Discord]
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the contest in which the Trojan prince Paris gave the golden apple "to the fairest" to Aphrodite, who bribed him with Helen, so causing the Trojan War.
description_md: |-
  At a wedding, the goddess of discord threw in a golden apple inscribed "to the fairest". Hera, [[athena]] and [[aphrodite]] each claimed it, and the Trojan prince Paris was chosen to decide. Aphrodite bribed him with the most beautiful woman in the world, [[helen-of-troy|Helen]], and so caused the Trojan War.

  **In art:** A young shepherd holding an apple before three nude goddesses, often with [[hermes]].

  **Famous works**

  - Rubens, *The Judgement of Paris* (National Gallery, London, and Prado)
  - [[artist/lucas-cranach-the-elder]], several versions
  - Marcantonio Raimondi after [[artist/raphael]], engraving (which inspired Manet's *Le Déjeuner sur l'herbe*)

  *From:* Greek mythology, Trojan cycle · Ancient Greek
