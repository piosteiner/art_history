public_id: 131525
name: Curupira
category: mythology and legend
definition: The protector of the forest in Brazilian folklore, a small red-haired boy whose backwards feet lead hunters astray.
description_md: |-
  A small, red-haired boy whose feet point backwards, so hunters who follow his footprints get lost. He protects animals and plants, and punishes people who hunt too much or cut down trees by leading them deep into the forest.

  *From:* folklore · Brazilian (Tupi)
