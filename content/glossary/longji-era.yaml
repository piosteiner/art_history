name: Longji
names:
  - lang: zh
    role: original
    text: 龍紀
category: calendar
parent: chinese-calendar
definition: "Chinese era name (龍紀) of the Tang for the years 889–890: 889 is Longji 1 (元年) and Longji 2 is 890."
description_md: |-
  **Longji** (龍紀) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 889 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 889 is Longji 1 (元年), 890 its last year, Longji 2. A Chinese source dates a year within it as "Longji 2" (龍紀二年) rather than by a continuous count.

  Before: [[wende-era|Wende]]. After: [[dashun-era|Dashun]].
sources:
