name: Ceyx and Alcyone
names: [Alcyone, Halcyone, Ceyx]
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, a devoted couple turned into kingfishers after Ceyx drowned; the "halcyon days" are named after Alcyone.
description_md: |-
  A devoted married couple. Ceyx drowned at sea, and Alcyone learned of his death in a dream sent by the god of sleep. She threw herself into the sea, and the gods turned them both into kingfishers. The calm "halcyon days" of winter, when kingfishers nest, are named after her.

  **In art:** A woman waiting on the shore by a stormy sea, or two birds flying above the waves.

  **Famous works**

  - Herbert James Draper, *Halcyone*

  *From:* Ovid, Metamorphoses · Ancient Greek
