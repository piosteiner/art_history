definition: "Japanese era name (正慶) for the years 1332–1333: 1332 is Shōkyō 1 (元年) and Shōkyō 2 is 1333."
description_md: |-
  **Shōkyō** (正慶) is a Japanese era name ([[nengo]]), proclaimed in 1332. Its years are counted in lunar years from the new year before the proclamation: 1332 is Shōkyō 1 (元年), 1333 its last year, Shōkyō 2. A Japanese source dates a year within it as "Shōkyō 2" (正慶2年) rather than by a continuous count.

  Before: [[genko-era-1331|Genkō]]. After: [[kemmu-era|Kemmu]].
