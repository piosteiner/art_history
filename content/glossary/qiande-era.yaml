name: Qiande
names:
  - lang: zh
    role: original
    text: 乾德
category: calendar
parent: chinese-calendar
definition: "Chinese era name (乾德) of the Northern Song for the years 963–968: 963 is Qiande 1 (元年) and Qiande 6 is 968."
description_md: |-
  **Qiande** (乾德) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 963 under Emperor Taizu (太祖). Its years are counted in lunar years: 963 is Qiande 1 (元年), 968 its last year, Qiande 6. A Chinese source dates a year within it as "Qiande 2" (乾德二年) rather than by a continuous count.

  Before: [[jianlong-era|Jianlong]]. After: [[kaibao-era|Kaibao]].
sources:
