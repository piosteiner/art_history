name: Yūrei
names: [Japanese ghosts]
category: mythology and legend
also_in: [iconography]
definition: The vengeful ghosts of Japanese folklore, usually women who were wronged and died unjustly, shown in white with long loose hair and no feet.
description_md: |-
  Vengeful spirits, usually women who were wronged and died unjustly. The most famous are [[oiwa]], from the kabuki play *Yotsuya Kaidan*, poisoned and disfigured by her husband, and [[okiku]], a servant killed and thrown down a well after being falsely accused of losing one of ten precious plates.

  **In art:** A pale woman in a white burial kimono, with long loose black hair, limp hands and no feet, floating above the ground, often coming out of a well or a paper lantern.

  **Famous works**

  - [[artist/katsushika-hokusai]], *One Hundred Ghost Stories (Hyaku monogatari)* (series, Oiwa as a lantern, Okiku rising from a well)
  - [[artist/maruyama-okyo]] (attributed), *The Ghost of Oyuki* (University of California, Berkeley)
  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *New Forms of Thirty-Six Ghosts* (series)

  *From:* folklore · Japanese
