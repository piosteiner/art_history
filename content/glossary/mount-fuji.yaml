definition: Japan's sacred mountain and a symbol of immortality, its name linked in the Tale of the Bamboo Cutter to fushi, "no death" (a folk etymology).
description_md: |-
  Mount Fuji is Japan's sacred mountain and a symbol of immortality. Its name was linked to the word *fushi*, "no death". In the old *Tale of the Bamboo Cutter*, the elixir of immortality left by the moon princess [[kaguya-hime]] was burned on its summit, and its smoke still rises.

  **Famous works**

  - [[artist/katsushika-hokusai]], *Fine Wind, Clear Morning (Red Fuji)*
  - Katsushika Hokusai, *One Hundred Views of Mount Fuji* (picture books)
  - [[artist/sesshu-toyo]] (attributed), *Fuji and Seiken-ji*

  *From:* Japanese
