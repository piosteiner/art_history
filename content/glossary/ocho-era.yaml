definition: "Japanese era name (応長) for the years 1311–1312: 1311 is Ōchō 1 (元年) and Ōchō 2 is 1312."
description_md: |-
  **Ōchō** (応長) is a Japanese era name ([[nengo]]), proclaimed in 1311. Its years are counted in lunar years from the new year before the proclamation: 1311 is Ōchō 1 (元年), 1312 its last year, Ōchō 2. A Japanese source dates a year within it as "Ōchō 2" (応長2年) rather than by a continuous count.

  Before: [[enkyo-era-1308|Enkyō]]. After: [[showa-era-1312|Shōwa]].
