name: Nereids
category: iconography
definition: sea nymphs in Greek mythology, daughters of Nereus
description_md: |-
  The Nereids are the fifty sea nymphs, daughters of the old sea god Nereus. The most famous is [[thetis]], mother of [[achilles]].

  **In art:** Sea nymphs riding dolphins and sea monsters.

  *From:* Greek mythology · Ancient Greek
