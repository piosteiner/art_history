name: Zhenyuan
names:
  - lang: zh
    role: original
    text: 貞元
category: calendar
definition: "Chinese era name (貞元) of the Tang for the years 785–805: 785 is Zhenyuan 1 (元年) and Zhenyuan 21 is 805."
description_md: |-
  **Zhenyuan** (貞元) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 785 under Emperor Dezong (德宗). Its years are counted in lunar years: 785 is Zhenyuan 1 (元年), 805 its last year, Zhenyuan 21. A Chinese source dates a year within it as "Zhenyuan 2" (貞元二年) rather than by a continuous count.

  Before: [[xingyuan-era|Xingyuan]]. After: [[yongzhen-era|Yongzhen]].
sources:
  definition:
    - source: dila-time-authority
