public_id: 113074
name: Wansui Dengfeng
names:
  - lang: zh
    role: original
    text: 萬歲登封
category: calendar
definition: "Chinese era name (萬歲登封) of the Zhou of Empress Wu for the year 696: 696 is Wansui Dengfeng 1 (元年), its only year."
description_md: |-
  **Wansui Dengfeng** (萬歲登封) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 696 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 696 is Wansui Dengfeng 1 (元年), its only year.

  Before: [[tiance-wansui-era|Tiance Wansui]]. After: [[wansui-tongtian-era|Wansui Tongtian]].
sources:
  definition:
    - source: dila-time-authority
