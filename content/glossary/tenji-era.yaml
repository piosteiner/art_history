definition: "Japanese era name (天治) for the years 1124–1125: 1124 is Tenji 1 (元年) and Tenji 2 is 1125."
description_md: |-
  **Tenji** (天治) is a Japanese era name ([[nengo]]), proclaimed in 1124. Its years are counted in lunar years from the new year before the proclamation: 1124 is Tenji 1 (元年), 1125 its last year, Tenji 2. A Japanese source dates a year within it as "Tenji 2" (天治2年) rather than by a continuous count.

  Before: [[hoan-era|Hōan]]. After: [[daiji-era|Daiji]].
