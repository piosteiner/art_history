definition: In Greek myth the king of the Lapiths and Theseus's best friend, whose wedding ended in the battle with the centaurs.
description_md: |-
  King of the [[the-lapiths|Lapiths]] and [[theseus]]'s best friend. His wedding to Hippodamia (a different one) ended in the battle with the centaurs. He and Theseus later tried to kidnap [[persephone]] from the Underworld and were trapped there in chairs of forgetfulness.

  **In art:** See [[centaurs|Centaurs]] and [[chiron|Chiron]].

  **Famous works**

  - Piero di Cosimo, *The Fight between the Lapiths and the Centaurs* (National Gallery, London)

  *From:* Greek mythology · Ancient Greek
