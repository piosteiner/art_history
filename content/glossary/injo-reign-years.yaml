definition: "The reign years of Injo of Joseon (仁祖, 인조), by which Korean sources date 1623–1649: 1623 is Injo 1, 1649 Injo 27."
description_md: |-
  **Injo** (仁祖, 인조): the years of the reign of [[person/injo-of-joseon|Injo of Joseon]], who came to the throne on 14 March 1623. Korean sources count years by the reigning king ([[korean-reign-years]]): 1632 is Injo 10 (인조 10년). His first year is the year of his accession — he replaced his predecessor by force or founded the dynasty.

  Before: [[gwanghaegun-reign-years|Gwanghaegun]]. After: [[hyojong-reign-years|Hyojong]].
