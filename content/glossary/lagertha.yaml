name: Lagertha
category: mythology and legend
definition: A legendary shieldmaiden described by Saxo Grammaticus, who fought among the men so bravely that Ragnar Lodbrok married her, and who later turned a civil war for him with a fleet of her own.
description_md: |-
  Lagertha is a legendary shieldmaiden described by the medieval historian Saxo Grammaticus. When women were forced into humiliation by an invading king, she took up arms and fought among the men so bravely that Ragnar Lodbrok fell for her. He married her, and later she came to his aid in a civil war with a fleet of her own, turning the battle.

  *From:* Saxo Grammaticus, Gesta Danorum · Norse / Danish
