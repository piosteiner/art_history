definition: "Japanese era name (康永) for the years 1342–1344: 1342 is Kōei 1 (元年) and Kōei 3 is 1344."
description_md: |-
  **Kōei** (康永) is a Japanese era name ([[nengo]]), proclaimed in 1342. Its years are counted in lunar years from the new year before the proclamation: 1342 is Kōei 1 (元年), 1344 its last year, Kōei 3. A Japanese source dates a year within it as "Kōei 2" (康永2年) rather than by a continuous count.

  Before: [[ryakuo-era|Ryakuō]]. After: [[kanno-era|Kannō]].
