public_id: 131597
name: Huldra
category: mythology and legend
definition: A beautiful forest woman of Scandinavian folklore with a cow's tail, hollow from behind like a rotting tree, who lures young men into the woods.
description_md: |-
  She looks like a beautiful woman from the front, but she has a cow's tail, and from behind, she's hollow like a rotting tree. She lures young men into the woods. If a man marries her in a church, her tail falls off, but she becomes ugly.

  *From:* folklore · Scandinavian
