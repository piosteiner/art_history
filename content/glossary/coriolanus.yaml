name: Coriolanus
category: mythology and legend
also_in: [iconography]
definition: The banished Roman general who led Rome's enemies against his city until his mother and wife persuaded him to turn back.
description_md: |-
  A Roman general who was banished and joined Rome's enemies, leading an army against his own city. Only the pleas of his mother Veturia and his wife Volumnia (Livy's names; in [[person/plutarch]] they are Volumnia and Vergilia) persuaded him to turn back.

  **In art:** A general in his tent, with his mother, wife and children kneeling before him.

  **Famous works**

  - [[artist/nicolas-poussin]], *Coriolanus Entreated by His Mother* (Les Andelys)

  *From:* Livy; Plutarch · Ancient Roman
