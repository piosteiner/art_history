name: Qianhua
names:
  - lang: zh
    role: original
    text: 乾化
category: calendar
parent: chinese-calendar
definition: "Chinese era name (乾化) of the Later Liang for the years 911–915: 911 is Qianhua 1 (元年) and Qianhua 5 is 915."
description_md: |-
  **Qianhua** (乾化) is a Chinese era name ([[nianhao]]) of the Later Liang, proclaimed in 911 under Emperor Taizu (太祖). Its years are counted in lunar years: 911 is Qianhua 1 (元年), 915 its last year, Qianhua 5. A Chinese source dates a year within it as "Qianhua 2" (乾化二年) rather than by a continuous count.

  Before: [[kaiping-era|Kaiping]]. After: [[zhenming-era|Zhenming]].
sources:
