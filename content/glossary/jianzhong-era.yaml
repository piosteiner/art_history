public_id: 113097
name: Jianzhong
names:
  - lang: zh
    role: original
    text: 建中
category: calendar
definition: "Chinese era name (建中) of the Tang for the years 780–783: 780 is Jianzhong 1 (元年) and Jianzhong 4 is 783."
description_md: |-
  **Jianzhong** (建中) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 780 under Emperor Dezong (德宗). Its years are counted in lunar years: 780 is Jianzhong 1 (元年), 783 its last year, Jianzhong 4. A Chinese source dates a year within it as "Jianzhong 2" (建中二年) rather than by a continuous count.

  Before: [[dali-era|Dali]]. After: [[xingyuan-era|Xingyuan]].
sources:
  definition:
    - source: dila-time-authority
