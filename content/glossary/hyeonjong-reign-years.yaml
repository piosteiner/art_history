category: calendar
definition: "The reign years of King Hyeonjong of Joseon (顯宗, 현종), by which Korean sources date 1660–1674: 1660 is Hyeonjong 1, 1674 Hyeonjong 15."
description_md: |-
  **Hyeonjong** (顯宗, 현종): the years of the reign of King Hyeonjong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1669 is Hyeonjong 10 (현종 10년). The year of the accession, 1660, counts as the first year.

  Before: [[hyojong-reign-years|Hyojong]]. After: [[sukjong-reign-years|Sukjong]].
