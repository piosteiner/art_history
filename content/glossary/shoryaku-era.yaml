definition: "Japanese era name (正暦) for the years 990–994: 990 is Shōryaku 1 (元年) and Shōryaku 5 is 994."
description_md: |-
  **Shōryaku** (正暦) is a Japanese era name ([[nengo]]), proclaimed in 990. Its years are counted in lunar years from the new year before the proclamation: 990 is Shōryaku 1 (元年), 994 its last year, Shōryaku 5. A Japanese source dates a year within it as "Shōryaku 2" (正暦2年) rather than by a continuous count.

  Before: [[eiso-era|Eiso]]. After: [[chotoku-era|Chōtoku]].
