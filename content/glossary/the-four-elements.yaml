name: The Four Elements
category: iconography
definition: Earth, Water, Air and Fire, into which ancient and medieval thought divided the world.
description_md: |-
  Ancient and medieval thought divided the world into four elements (Earth, Water, Air and Fire) and human character into four temperaments based on the four bodily fluids.

  **Famous works**

  - Giuseppe Arcimboldo, *The Four Elements* (faces made of animals, fire and objects, Vienna and elsewhere)

  *From:* European (classical)
