name: Boto
names: [Encantado]
category: mythology and legend
definition: The pink Amazon river dolphin of Brazilian folklore that turns into a handsome man in a white suit on festival nights.
description_md: |-
  On festival nights, the pink Amazon river dolphin turns into a handsome man in a white suit and a hat (to hide his blowhole), and seduces girls at dances. He goes back to the river before dawn.

  *From:* folklore · Brazilian (Amazon)
