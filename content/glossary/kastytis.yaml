name: Kastytis
category: mythology and legend
definition: In the Lithuanian legend, the fisherman loved by the sea goddess Jūratė; the amber on the Baltic shore is said to be the pieces of her palace.
description_md: |-
  [[jurate]] lived in an amber palace under the sea. She fell in love with the fisherman Kastytis, and the thunder god was so furious that he smashed her palace with lightning and chained her to its ruins. The amber that washes up on the beaches is the pieces of her palace. Some say it's also her tears.

  *From:* Lithuanian folklore · Lithuanian
