public_id: 131148
name: Fionnuala
category: mythology and legend
definition: The eldest of the Children of Lir, who as a swan protected her three brothers through 900 years of storms on the cold seas.
description_md: |-
  Their jealous stepmother Aoife turned the four children of Lir into swans. Fionnuala, the eldest, protected her brothers through storms on the cold seas. When they finally changed back, they were ancient and died soon afterwards.

  *From:* Irish legend (Children of Lir) · Irish
