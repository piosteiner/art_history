name: Deucalion
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the survivor of the great flood sent by Zeus, who with his wife Pyrrha repeopled the earth by throwing stones.
description_md: |-
  The Greek Noah and his wife. They survived a great flood sent by [[zeus]] in a wooden chest (in Apollodorus; in [[person/ovid]] a small boat). Told by an oracle to throw "the bones of their mother" over their shoulders, they understood it meant stones, the bones of Mother Earth. Deucalion's stones became men and [[pyrrha]]'s became women.

  **In art:** A couple throwing stones behind them, with figures rising from the ground.

  **Famous works**

  - Rubens, *Deucalion and Pyrrha* (Prado)
  - Giovanni Maria Bottalla, *Deucalion and Pyrrha* (Museu Nacional de Belas Artes, Rio de Janeiro)

  *From:* Greek mythology · Ancient Greek
