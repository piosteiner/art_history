public_id: 113256
name: Geunchogo of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 근초고왕
  - lang: ko-Hani
    role: alternative
    text: 近肖古王
category: calendar
parent: korean-calendar
definition: "The reign years of King Geunchogo of Baekje (近肖古王, 근초고왕), by which Korean histories date 346–375: 346 is Geunchogo 1, 375 Geunchogo 30."
description_md: |-
  **Geunchogo** (近肖古王, 근초고왕): the years of the reign of King Geunchogo of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 355 is Geunchogo 10 (근초고왕 10년). The year of the accession, 346, counts as the first year.

  Before: [[gye-baekje-reign-years|Gye]]. After: [[geungusu-baekje-reign-years|Geungusu]].
sources:
  definition:
    - source: dila-time-authority
