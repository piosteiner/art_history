name: Lady Macbeth
category: mythology and legend
also_in: [iconography]
definition: The ambitious wife in Shakespeare's Macbeth, painted sleepwalking with a candle or seizing the daggers.
description_md: |-
  Shakespeare's plays inspired countless paintings, especially in the 18th and 19th centuries, among them Lady Macbeth sleepwalking and the three witches of *Macbeth*.

  **In art:** A sleepwalking queen with a candle.

  **Famous works**

  - [[artist/henry-fuseli]], *Lady Macbeth Seizing the Daggers* (exhibited 1812?; Tate, London)

  *From:* William Shakespeare, Macbeth · English
