definition: "Japanese era name (仁平) for the years 1151–1154: 1151 is Ninpei 1 (元年) and Ninpei 4 is 1154."
description_md: |-
  **Ninpei** (仁平) is a Japanese era name ([[nengo]]), proclaimed in 1151. Its years are counted in lunar years from the new year before the proclamation: 1151 is Ninpei 1 (元年), 1154 its last year, Ninpei 4. A Japanese source dates a year within it as "Ninpei 2" (仁平2年) rather than by a continuous count.

  Before: [[kyuan-era|Kyūan]]. After: [[kyuju-era|Kyūju]].
