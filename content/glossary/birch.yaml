description_md: Birch belongs to the woods that were seldom used for medieval sculpture because they are difficult to work or less suitable for carving; such woods became more common only in the thirteenth century.[[source/endemann-2020-wood-carving-and-staffering|pp. 143, 146]] Among the Romanesque Madonnas of France, birch was used in the north, as for the [[artwork/autun-madonna|Autun Madonna]] in New York.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]]
