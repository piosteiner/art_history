name: Shengli
names:
  - lang: zh
    role: original
    text: 聖曆
category: calendar
parent: chinese-calendar
definition: "Chinese era name (聖曆) of the Zhou of Empress Wu for the years 697–700: 697 is Shengli 1 (元年) and Shengli 4 is 700."
description_md: |-
  **Shengli** (聖曆) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 697 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 697 is Shengli 1 (元年), 700 its last year, Shengli 4. A Chinese source dates a year within it as "Shengli 2" (聖曆二年) rather than by a continuous count.

  Before: [[shengong-era|Shengong]]. After: [[jiushi-era|Jiushi]].
sources:
  definition:
    - source: dila-time-authority
