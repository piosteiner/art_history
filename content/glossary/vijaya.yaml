name: Vijaya
names: [Prince Vijaya]
category: mythology and legend
definition: The legendary first king of Sri Lanka in the chronicle Mahavamsa, a banished Indian prince who betrayed the yakkhini queen Kuveni.
description_md: |-
  According to the chronicle *Mahavamsa*, Prince Vijaya was banished from India and landed in Sri Lanka, where the yakkhini (demon princess) [[kuveni]] was spinning under a tree. She fell in love with him and helped him defeat her own people. Once he became king, he sent her away to marry an Indian princess. In the Mahavamsa she was killed by her own people; in a later folk version she cursed him.

  *From:* Mahavamsa · Sinhalese
