definition: In Greek and Roman myth the god of light (later also of the sun), music, poetry, prophecy and healing, and leader of the Muses.
description_md: |-
  God of light (later also of the sun), music, poetry, prophecy and healing. Leader of the Muses.

  **In art:** Young, beardless and idealised. A lyre or a bow, a laurel wreath, sometimes the sun chariot.

  **Famous works**

  - *Apollo Belvedere* (Vatican Museums)
  - Bernini, *Apollo and Daphne* (Galleria Borghese) — [[artwork/apollo-and-daphne]]
  - [[artist/raphael]], *The Parnassus* (Stanza della Segnatura, Vatican)

  *From:* Greek mythology · Ancient Greek
