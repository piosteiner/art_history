definition: In Homer's Odyssey Odysseus's old dog, who waited twenty years and was the only one to recognise his master on his return, then died.
description_md: |-
  [[odysseus]]'s old dog, who waited twenty years for him. When Odysseus finally came home disguised as a beggar, only Argos recognised him, wagged his tail, and died.

  **In art:** An old dog on a dung heap lifting its head towards a beggar.

  **Famous works**

  - Common in Neoclassical illustrations, for example John Flaxman's *Odyssey* outlines

  *From:* Homer, Odyssey · Ancient Greek
