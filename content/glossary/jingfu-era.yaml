name: Jingfu
names:
  - lang: zh
    role: original
    text: 景福
category: calendar
parent: chinese-calendar
definition: "Chinese era name (景福) of the Tang for the years 892–893: 892 is Jingfu 1 (元年) and Jingfu 2 is 893."
description_md: |-
  **Jingfu** (景福) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 892 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 892 is Jingfu 1 (元年), 893 its last year, Jingfu 2. A Chinese source dates a year within it as "Jingfu 2" (景福二年) rather than by a continuous count.

  Before: [[dashun-era|Dashun]]. After: [[qianning-era|Qianning]].
sources:
