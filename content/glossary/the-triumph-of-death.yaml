public_id: 132341
name: The Triumph of Death
category: iconography
definition: Death riding over people of all ranks, a theme that spread after the Black Death of 1348 (the fresco in the Camposanto, Pisa, may be a little earlier).
description_md: |-
  The Triumph of Death shows Death riding over people of all ranks, a theme that spread after the Black Death of 1348.

  **Famous works**

  - Pieter Bruegel the Elder, *The Triumph of Death* (Prado) — [[artwork/the-triumph-of-death]]
  - *Triumph of Death* (fresco, c. 1446, Galleria Regionale della Sicilia, Palazzo Abatellis, Palermo)

  *From:* European
