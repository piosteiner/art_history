    text: 天承
category: calendar
definition: "Japanese era name (天承) for the years 1131–1132: 1131 is Tenshō 1 (元年) and Tenshō 2 is 1132."
description_md: |-
  **Tenshō** (天承) is a Japanese era name ([[nengo]]), proclaimed in 1131. Its years are counted in lunar years from the new year before the proclamation: 1131 is Tenshō 1 (元年), 1132 its last year, Tenshō 2. A Japanese source dates a year within it as "Tenshō 2" (天承2年) rather than by a continuous count.

  Before: [[daiji-era|Daiji]]. After: [[chosho-era|Chōshō]].
