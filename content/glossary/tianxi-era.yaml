name: Tianxi
names:
  - lang: zh
    role: original
    text: 天禧
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天禧) of the Northern Song for the years 1017–1021: 1017 is Tianxi 1 (元年) and Tianxi 5 is 1021."
description_md: |-
  **Tianxi** (天禧) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1017 under Emperor Zhenzong (真宗). Its years are counted in lunar years: 1017 is Tianxi 1 (元年), 1021 its last year, Tianxi 5. A Chinese source dates a year within it as "Tianxi 2" (天禧二年) rather than by a continuous count.

  Before: [[dazhong-xiangfu-era|Dazhong Xiangfu]]. After: [[qianxing-era|Qianxing]].
sources:
