definition: "Tao Yuanming's story (around AD 421) of a fisherman who finds a hidden, peaceful valley cut off from the world: China's version of utopia."
description_md: |-
  A story by the poet [[person/tao-yuanming]] (around AD 421): a fisherman follows a stream of floating peach blossoms through a cave and discovers a hidden, peaceful valley whose people have lived cut off from the world for centuries. When he leaves, he can never find it again. China's version of utopia.

  **In art:** A boat on a river lined with blossoming peach trees, leading to a cave and a hidden village.

  **Famous works**

  - Qiu Ying, *Peach Blossom Spring*
  - [[artist/wang-hui]] (attributed), *Peach Blossom Spring* (17th century, Kyoto National Museum)

  *From:* Tao Yuanming, The Peach Blossom Spring · Chinese
