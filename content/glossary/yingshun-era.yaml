name: Yingshun
names:
  - lang: zh
    role: original
    text: 應順
category: calendar
parent: chinese-calendar
definition: "Chinese era name (應順) of the Later Tang for the year 934: 934 is Yingshun 1 (元年), its only year."
description_md: |-
  **Yingshun** (應順) is a Chinese era name ([[nianhao]]) of the Later Tang, proclaimed in 934 under Emperor Min (閔帝). Its years are counted in lunar years: 934 is Yingshun 1 (元年), its only year.

  Before: [[changxing-era|Changxing]]. After: [[qingtai-era|Qingtai]].
sources:
