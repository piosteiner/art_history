category: calendar
definition: "Korean era name (建陽, 건양) of the Korean Empire for the years 1896–1897: 1896 is Geonyang 1."
description_md: |-
  **Geonyang** (建陽, 건양) is an era name of Korea's own, proclaimed in 1896: with the solar calendar (1896) Korea stopped dating by the Chinese emperors' eras and the king's reign years ([[korean-reign-years]]). It is the era of [[person/gojong-of-korea|Gojong of the Korean Empire]].

  Before: [[gojong-reign-years|Gojong]]. After: [[gwangmu-era|Gwangmu]].
