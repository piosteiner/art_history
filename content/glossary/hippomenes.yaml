public_id: 131295
name: Hippomenes
category: mythology and legend
definition: In Ovid's Metamorphoses, the young man who won the race against Atalanta with three golden apples from Aphrodite; the two were later turned into lions.
description_md: |-
  [[atalanta]] would only marry a man who could beat her in a race, and the losers were killed. [[aphrodite]] gave Hippomenes three golden apples. He threw them in her way during the race, and Atalanta stopped to pick them up. But he forgot to thank Aphrodite, and later the two lovers were turned into lions.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
