name: Perseus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the son of Zeus and Danaë who beheaded the Gorgon Medusa and rescued Andromeda from a sea monster.
description_md: |-
  Son of Zeus and [[danae]]. With a mirrored shield from [[athena]], winged sandals from [[hermes]] and a cap of invisibility, he beheaded the Gorgon Medusa, whose gaze turned people to stone. On the way home, he rescued [[andromeda]] from a sea monster.

  **In art:** A young hero holding Medusa's severed head, with a curved sword (*harpe*), winged sandals and a shield. Sometimes riding [[pegasus]], who sprang from [[medusa]]'s blood.

  **Famous works**

  - Benvenuto Cellini, *Perseus with the Head of Medusa* (Loggia dei Lanzi, Florence)
  - Canova, *Perseus Triumphant* (Vatican Museums; a second version in the Metropolitan Museum)
  - [[artist/edward-burne-jones]], *The Perseus Cycle* (Stuttgart)
  - [[artist/titian]], *Perseus and Andromeda* (Wallace Collection)

  *From:* Greek mythology · Ancient Greek
