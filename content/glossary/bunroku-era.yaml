definition: "Japanese era name (文禄) for the years 1592–1596: 1592 is Bunroku 1 (元年) and Bunroku 5 is 1596."
description_md: |-
  **Bunroku** (文禄) is a Japanese era name ([[nengo]]), proclaimed in 1592. Its years are counted in lunar years from the new year before the proclamation: 1592 is Bunroku 1 (元年), 1596 its last year, Bunroku 5. A Japanese source dates a year within it as "Bunroku 2" (文禄2年) rather than by a continuous count.

  Before: [[tensho-era-1573|Tenshō]]. After: [[keicho-era|Keichō]].
