definition: "Japanese era name (寛永) for the years 1624–1644: 1624 is Kan'ei 1 (元年) and Kan'ei 21 is 1644."
description_md: |-
  **Kan'ei** (寛永) is a Japanese era name ([[nengo]]), proclaimed in 1624. Its years are counted in lunar years from the new year before the proclamation: 1624 is Kan'ei 1 (元年), 1644 its last year, Kan'ei 21. A Japanese source dates a year within it as "Kan'ei 2" (寛永2年) rather than by a continuous count.

  Before: [[genna-era|Genna]]. After: Shōhō.
