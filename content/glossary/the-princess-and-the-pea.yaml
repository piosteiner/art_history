public_id: 131380
name: The Princess and the Pea
category: mythology and legend
definition: Andersen's fairy tale (1835) of a girl who proves she is a real princess by feeling a single pea through twenty mattresses.
description_md: |-
  A queen put a single pea under twenty mattresses and twenty featherbeds. In the morning, the girl said she'd hardly slept a wink because something hard had bruised her. Only a true princess could be so sensitive.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
