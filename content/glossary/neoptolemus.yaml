definition: In Greek myth Achilles' brutal son, also called Pyrrhus, who killed Priam and Hector's son Astyanax.
description_md: |-
  [[polyxena]] was a Trojan princess sacrificed on [[achilles]]' tomb after the war, at the demand of his ghost. Neoptolemus (also called Pyrrhus) was Achilles' brutal son, who killed [[priam]] and (in some versions, such as the Little Iliad) [[hector]]'s little son Astyanax.

  **In art:** A warrior leading a young woman to an altar or tomb.

  *From:* Greek mythology · Ancient Greek
