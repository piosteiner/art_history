name: Shitennō
names:
  - lang: ja
    role: original
    text: "{四天王|してんのう}"
category: iconography
definition: "The Four Guardian Kings of the four directions, set at the corners of an altar: Tamonten (north), Zōchōten (south), Jikokuten (east) and Kōmokuten (west), each with his attribute."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 75, 77
