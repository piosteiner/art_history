name: Shitennō
names:
  - lang: ja
    role: original
    text: "{四天王|してんのう}"
category: iconography
definition: "The Four Guardian Kings of the four directions, set at the corners of an altar: Tamonten (north), Zōchōten (south), Jikokuten (east) and Kōmokuten (west), each with his attribute."
description_md: |-
  The Four Heavenly Kings (Japanese: *Shitennō*) guard the four directions.

  **In art:** Armoured warriors trampling demons.

  **Famous works**

  - *Shitennō* (clay, 8th century, from the Kaidan-dō, Tōdai-ji, Nara)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
