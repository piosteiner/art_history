name: Vajrapani
category: religion
also_in: [iconography]
definition: The bodhisattva of power and protector of the Buddha, holding a thunderbolt sceptre; in Gandharan art sometimes modelled on Heracles.
description_md: |-
  The bodhisattva of power and protector of the Buddha. In Gandharan art, he was sometimes modelled on [[heracles]].

  **In art:** A fierce, dark-blue figure with flaming hair, holding a thunderbolt sceptre (*vajra*).

  **Famous works**

  - *Vajrapani as Heracles* (relief, Gandhara, British Museum)
  - *Tibetan and Nepalese bronzes*

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
