definition: In Greek myth the most beautiful woman in the world, daughter of Zeus and Leda and wife of Menelaus, whose abduction by Paris launched the Trojan War.
description_md: |-
  The most beautiful woman in the world, daughter of [[zeus]] and [[leda]], and wife of King Menelaus of Sparta. Her abduction (or elopement) with Paris launched the Greek expedition against Troy: "the face that launched a thousand ships".

  **In art:** A beautiful woman being led onto a ship by Paris, or standing on the walls of Troy.

  **Famous works**

  - [[artist/guido-reni]], *The Abduction of Helen* (Louvre)
  - Gustave Moreau, *Helen on the Ramparts of Troy*
  - [[artist/jacques-louis-david]], *The Loves of Paris and Helen* (Louvre)

  *From:* Homer, Iliad · Ancient Greek
