name: Mami Wata
category: religion
definition: '"Mother Water", a water spirit honoured across West and Central Africa and the African diaspora, linked to wealth, healing, beauty and danger.'
description_md: |-
  Mami Wata is one of Africa's most widespread spiritual figures, a water spirit honoured across West and Central Africa and in the African diaspora. She's often pictured as a beautiful woman with a fish's tail or with a snake wrapped around her, and is linked to wealth, healing, beauty and danger.

  **Held sacred today:** She is actively venerated in several living traditions, including Vodun.

  *From:* African traditional religions · West and Central African, African diaspora
