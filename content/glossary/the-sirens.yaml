definition: In Greek myth creatures whose song lured sailors to their deaths, half woman and half bird in Greek art, later imagined as mermaids.
description_md: |-
  [[calypso]] was a nymph who held [[odysseus]] on her island for seven years, offering him immortality if he stayed. The Sirens were creatures whose song lured sailors to their deaths, half woman and half bird in Greek art, later imagined as mermaids.

  **In art:** The Sirens as bird-women on a vase, or as seductive sea maidens.

  **Famous works**

  - Siren Painter, *Odysseus and the Sirens* (vase, British Museum)

  *From:* Homer, Odyssey · Ancient Greek
