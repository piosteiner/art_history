category: calendar
definition: "Japanese era name (正徳) for the years 1711–1716: 1711 is Shōtoku 1 (元年) and Shōtoku 6 is 1716."
description_md: |-
  **Shōtoku** (正徳) is a Japanese era name ([[nengo]]), proclaimed in 1711. Its years are counted in lunar years from the new year before the proclamation: 1711 is Shōtoku 1 (元年), 1716 its last year, Shōtoku 6. A Japanese source dates a year within it as "Shōtoku 2" (正徳2年) rather than by a continuous count.

  Before: [[hoei-era|Hōei]]. After: [[kyoho-era|Kyōhō]].
