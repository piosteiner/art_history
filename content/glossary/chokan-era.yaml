definition: "Japanese era name (長寛) for the years 1163–1165: 1163 is Chōkan 1 (元年) and Chōkan 3 is 1165."
description_md: |-
  **Chōkan** (長寛) is a Japanese era name ([[nengo]]), proclaimed in 1163. Its years are counted in lunar years from the new year before the proclamation: 1163 is Chōkan 1 (元年), 1165 its last year, Chōkan 3. A Japanese source dates a year within it as "Chōkan 2" (長寛2年) rather than by a continuous count.

  Before: [[oho-era|Ōhō]]. After: [[eiman-era|Eiman]].
