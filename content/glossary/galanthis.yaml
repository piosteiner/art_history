public_id: 131289
name: Galanthis
category: mythology and legend
definition: In Ovid's Metamorphoses, Alcmene's clever servant, who tricked Lucina, the birth goddess acting for Hera (Juno), into giving up the spell that held back the birth of Heracles and was turned into a weasel.
description_md: |-
  When Alcmene was giving birth to [[heracles]], the jealous [[hera]] (Juno) had the birth goddess Lucina stop the birth with magic. Her servant Galanthis tricked Lucina into giving up her spell. As punishment, Lucina turned her into a weasel.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
