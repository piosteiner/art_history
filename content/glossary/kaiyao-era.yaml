name: Kaiyao
names:
  - lang: zh
    role: original
    text: 開耀
category: calendar
parent: chinese-calendar
definition: "Chinese era name (開耀) of the Tang for the years 681–682: 681 is Kaiyao 1 (元年) and Kaiyao 2 is 682."
description_md: |-
  **Kaiyao** (開耀) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 681 under Emperor Gaozong (高宗). Its years are counted in lunar years: 681 is Kaiyao 1 (元年), 682 its last year, Kaiyao 2. A Chinese source dates a year within it as "Kaiyao 2" (開耀二年) rather than by a continuous count.

  Before: [[yonglong-era|Yonglong]]. After: [[yongchun-era|Yongchun]].
sources:
