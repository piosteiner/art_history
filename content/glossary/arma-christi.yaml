definition: objects associated with the Passion of Jesus Christ in Christian symbolism and art
description_md: |-
  The *Arma Christi* are the instruments of the Passion: the cross, nails, crown of thorns, spear, sponge, whip, dice and ladder.

  **In art:** A collection of Passion objects.

