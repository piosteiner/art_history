name: Oberon
category: mythology and legend
also_in: [iconography]
definition: The fairy king of Shakespeare's A Midsummer Night's Dream, husband of Titania.
description_md: |-
  From *A Midsummer Night's Dream*: the fairies [[titania]], Oberon and [[puck]], where Titania falls in love with Bottom, who has a donkey's head. (The name, through the French Auberon, may go back to the dwarf Alberich of German tradition.)

  **Famous works**

  - Joseph Noel Paton, *The Quarrel of Oberon and Titania* (1849; Scottish National Gallery, Edinburgh)

  *From:* William Shakespeare, A Midsummer Night's Dream · English
