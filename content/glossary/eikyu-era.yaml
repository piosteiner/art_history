definition: "Japanese era name (永久) for the years 1113–1118: 1113 is Eikyū 1 (元年) and Eikyū 6 is 1118."
description_md: |-
  **Eikyū** (永久) is a Japanese era name ([[nengo]]), proclaimed in 1113. Its years are counted in lunar years from the new year before the proclamation: 1113 is Eikyū 1 (元年), 1118 its last year, Eikyū 6. A Japanese source dates a year within it as "Eikyū 2" (永久2年) rather than by a continuous count.

  Before: [[tenei-era|Ten'ei]]. After: [[genei-era|Gen'ei]].
