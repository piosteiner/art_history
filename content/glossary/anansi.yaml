public_id: 130912
name: Anansi
category: mythology and legend
definition: The spider trickster of the Akan peoples of Ghana, who won all the world's stories from the sky god by cleverness; his tales live on in the Caribbean.
description_md: |-
  Anansi is the famous spider trickster of the Akan peoples of Ghana. In the best-known tale, all stories belonged to the sky god, who set Anansi a seemingly impossible price: capture a python, a leopard, a swarm of hornets and the dwarf (fairy) Mmoatia. Using nothing but cleverness, Anansi caught them all and won the stories for humankind. His tales travelled across the Atlantic and are still told in the Caribbean today.

  *From:* Akan folktales · Akan (Ghana)
