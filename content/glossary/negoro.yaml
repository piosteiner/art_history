public_id: 107177
name: negoro
names:
  - lang: ja
    role: original
    text: "{根来|ねごろ}"
category: technique
parent: lacquer
definition: Lacquer ware finished in red over black, so that the black shows through where the red wears off with use; red and black were the standard colours of Japanese lacquer.
