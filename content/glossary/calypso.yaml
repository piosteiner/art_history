definition: In Greek myth the nymph who held Odysseus on her island for seven years, offering him immortality if he stayed.
description_md: |-
  Calypso was a nymph who held [[odysseus]] on her island for seven years, offering him immortality if he stayed. [[the-sirens]] were creatures whose song lured sailors to their deaths, half woman and half bird in Greek art, later imagined as mermaids.

  **In art:** Calypso in a grotto with Odysseus gazing out to sea.

  **Famous works**

  - [[artist/arnold-bocklin]], *Odysseus and Calypso* (Kunstmuseum Basel)

  *From:* Homer, Odyssey · Ancient Greek
