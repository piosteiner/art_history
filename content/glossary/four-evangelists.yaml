definition: "Matthew, Mark, Luke and John, the traditional authors of the four Gospels, each with a symbol: winged man, lion, ox and eagle."
description_md: |-
  The authors of the four Gospels: Matthew, Mark, Luke and John.

  **In art:** Each has a symbol from the vision of Ezekiel (and the four living creatures of Revelation 4), assigned as in [[person/jerome]]: Matthew a winged man or angel, Mark a winged lion, Luke a winged ox, and John an eagle. Luke is also shown painting the Virgin, which made him patron of painters' guilds. [[person/john-the-evangelist]] is young and beardless, often with a cup with a snake coming out of it.

  **Famous works**

  - *Book of Kells* (Trinity College, Dublin)
  - [[artist/caravaggio]], *The Inspiration of Saint Matthew* (San Luigi dei Francesi) — [[artwork/san-matteo-e-langelo-seconda-versione]]
  - [[artist/rogier-van-der-weyden]], *Saint Luke Drawing the Virgin* (Boston)
  - [[artist/albrecht-durer]], *The Four Apostles* (Alte Pinakothek, Munich; shows John, Peter, Mark and Paul, so only two of the evangelists)

  *From:* New Testament, Gospels · Christian
