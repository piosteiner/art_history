public_id: 107167
name: Jizō
names:
  - lang: ja
    role: original
    text: "{地蔵|じぞう}"
category: iconography
parent: bodhisattva
definition: Kṣitigarbha, the bodhisattva who helps suffering beings and protects children and travellers; shown as a shaven-headed monk.
description_md: |-
  The bodhisattva who vowed to help souls in all the realms of hell. In Japan, Jizō is the protector of children (including those who died young), travellers and pregnant women.

  **In art:** A gentle shaven-headed monk holding a wish-granting jewel and a staff with jingling rings. Stone Jizō statues along roads and in temples often wear red bibs and caps knitted by their visitors.

  **Famous works**

  - [[artist/kaikei]], *Jizō Bosatsu* (Tōdai-ji, Nara)
  - *Rows of Jizō* (Zōjō-ji (Tokyo) and Hase-dera (Kamakura))

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
