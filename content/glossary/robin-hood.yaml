name: Robin Hood
category: mythology and legend
also_in: [iconography]
definition: The legendary English outlaw of Sherwood Forest who robbed the rich to give to the poor.
description_md: |-
  The legendary English outlaw of Sherwood Forest who, in the later tradition, robbed the rich to give to the poor, with Maid Marian, Little John and Friar Tuck.

  **In art:** An archer in green in a forest, often shooting in a contest.

  **Famous works**

  - Howard Pyle, *The Merry Adventures of Robin Hood* (novel written and illustrated by Pyle, 1883)

  *From:* English ballads · English
