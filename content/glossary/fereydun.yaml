name: Fereydun
category: mythology and legend
definition: In the Persian Shahnameh, the hero-king who struck down Zahhak with an ox-headed mace and chained him in Mount Damavand, and who divided the world among his three sons.
description_md: |-
  Fereydun was hidden as a child because [[zahhak]] had dreamed that he would be overthrown by him. Raised in secret, he grew into a mighty warrior. With Kaveh's rebellion behind him, he struck Zahhak down with an ox-headed mace. He didn't kill him, though. On the advice of an angel he chained him in a cave on Mount Damavand instead (in the Middle Persian Bundahishn, Ahura Mazda stops him because noxious creatures would pour from Zahhak's body). Fereydun later split the world between his three sons, Salm, Tur and Iraj, which led to a tragic war between the brothers.

  *From:* Shahnameh · Persian
