name: Marko Kraljević
names: [Prince Marko]
category: mythology and legend
definition: The great hero of South Slavic epic songs, based on a real 14th-century prince, who rides the wine-drinking horse Šarac and fights Ottoman champions.
description_md: |-
  Based on a real 14th-century prince, in songs he's a giant with a huge mace who drinks wine by the bucket, rides his piebald horse Šarac (who also drinks wine) and is helped by the fairy Vila Ravijojla. He fights Ottoman champions and the three-hearted monster Musa Kesedžija. It's said he isn't dead, just asleep in a cave.

  *From:* South Slavic epic poetry · South Slavic
