public_id: 107155
name: Dainichi
names:
  - lang: ja
    role: original
    text: "{大日如来|だいにちにょらい}"
category: iconography
parent: buddha
definition: Mahāvairocana, the “Great Sun” Buddha at the centre of Shingon Buddhism, of whom all other Buddhas and deities are manifestations; at the centre of both mandalas of the Two Realms.
description_md: |-
  The cosmic Buddha, the Buddha of the universe itself, central to [[esoteric-buddhism]].

  **In art:** Often crowned and jewelled like a king, at the centre of a mandala.

  **Famous works**

  - *Great Buddha of Tōdai-ji* (Nara, bronze, 8th century)
  - *Fengxian Temple Vairocana* (Longmen Grottoes)
  - *Taizōkai and Kongōkai Mandalas* (Mandalas of the Two Realms, 2nd half of the 9th century, Tō-ji (Kyōōgokoku-ji), Kyoto)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
