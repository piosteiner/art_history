definition: In Greek myth, the beautiful young hunter loved by Venus, killed by a wild boar; the anemone grew from his blood.
description_md: |-
  Adonis was a beautiful young hunter loved by [[aphrodite|Venus]]. She begged him not to hunt dangerous beasts, but he went anyway and was killed by a wild boar. From his blood grew the anemone.

  **In art:** Venus clinging to Adonis as he leaves with his hounds, or mourning over his dead body.

  **Famous works**

  - [[artist/titian]], *Venus and Adonis* (Prado)
  - Rubens, *Venus and Adonis* (Metropolitan Museum)
  - Canova, *Venus and Adonis* (Geneva)

  *From:* Ovid, Metamorphoses · Ancient Greek
