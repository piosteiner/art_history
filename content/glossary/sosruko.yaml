name: Sosruko
names: [Sosruquo]
category: mythology and legend
definition: "The trickster hero of the Nart sagas, the epics of Caucasian peoples such as the Circassians and Ossetians: born from a stone, his body tempered into steel."
description_md: |-
  The Nart sagas are the epics of Caucasian peoples like the Circassians and Ossetians. Sosruko was born from a rock and tempered in water by the smith Tlepsh, so his whole body was steel, except his knees, which were held by tongs. He stole fire from a giant for his people. His enemies killed him by rolling a spiked wheel at his knees.

  *From:* Nart sagas · Circassian, Ossetian (Nart sagas)
