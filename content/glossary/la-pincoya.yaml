public_id: 131535
name: La Pincoya
names: [Pincoya]
category: mythology and legend
definition: A sea spirit of Chiloé folklore whose dance on the shore decides whether fish will be plentiful.
description_md: |-
  A long-haired, beautiful woman who dances on the beach. If she dances facing the sea, there'll be plenty of fish; if she faces the land, the fish will disappear. She rescues drowning sailors and takes them to the [[caleuche]].

  *From:* folklore · Chilote (Chiloé)
