public_id: 106654
name: kondō
names:
  - lang: ja
    role: original
    text: "{金堂|こんどう}"
category: architecture
definition: "The “golden hall” of a Buddhist temple: the hall of worship that houses the principal images on a raised altar platform; in some temples called hondō, main hall."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 61, 63–64
