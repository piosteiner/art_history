definition: A child-eating demoness converted by the Buddha, who became a protector of children and childbirth.
description_md: |-
  A demoness who ate other people's children. [[person/the-buddha]] hid her youngest son to make her feel the grief she caused, and she converted, becoming a protector of children and childbirth.

  **In art:** A gentle mother holding a baby and a pomegranate, sometimes surrounded by many children.

  **Famous works**

  - *Hariti* (Gandhara reliefs, British Museum and Lahore Museum)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
