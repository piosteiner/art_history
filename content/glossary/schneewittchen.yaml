name: Schneewittchen
names: [Snow White]
category: mythology and legend
definition: In the Grimms' fairy tale, a princess who flees from her jealous stepmother and is helped by seven dwarfs.
description_md: |-
  In the original Grimm version, the evil queen tries three times to kill her: with a lace bodice, a poisoned comb and a poisoned apple. At Snow White's wedding, the queen has to dance in red-hot iron shoes until she dies.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
