definition: "Japanese era name (寛徳) for the years 1044–1046: 1044 is Kantoku 1 (元年) and Kantoku 3 is 1046."
description_md: |-
  **Kantoku** (寛徳) is a Japanese era name ([[nengo]]), proclaimed in 1044. Its years are counted in lunar years from the new year before the proclamation: 1044 is Kantoku 1 (元年), 1046 its last year, Kantoku 3. A Japanese source dates a year within it as "Kantoku 2" (寛徳2年) rather than by a continuous count.

  Before: [[chokyu-era|Chōkyū]]. After: [[eisho-era-1046|Eishō]].
