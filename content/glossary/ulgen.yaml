name: Ulgen
names: [Bai-Ulgen]
category: mythology and legend
definition: The benevolent creator god (Bai-Ulgen) of Altai and other Turkic and Siberian traditions, who lives in the upper sky; rival of Erlik Khan.
description_md: |-
  Ulgen (also Bai-Ulgen) is the kind creator god of Altai and other Turkic and Siberian traditions. He lives high in the sky, in the upper levels of the layered cosmos, and is the rival of [[erlik-khan]], the lord of the underworld. Shamans travelled up to him to ask for blessings, good weather and healing.

  *From:* Turkic religion · Altai and other Turkic and Siberian peoples
