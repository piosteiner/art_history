definition: "Japanese era name (宝永) for the years 1704–1711: 1704 is Hōei 1 (元年) and Hōei 8 is 1711."
description_md: |-
  **Hōei** (宝永) is a Japanese era name ([[nengo]]), proclaimed in 1704. Its years are counted in lunar years from the new year before the proclamation: 1704 is Hōei 1 (元年), 1711 its last year, Hōei 8. A Japanese source dates a year within it as "Hōei 2" (宝永2年) rather than by a continuous count.

  Before: [[genroku-era|Genroku]]. After: [[shotoku-era|Shōtoku]].
