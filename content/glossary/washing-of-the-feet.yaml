name: Washing of the Feet
names: [Christ Washing the Feet of the Apostles]
category: iconography
definition: Jesus washing his disciples' feet at the Last Supper as a lesson in humility.
description_md: |-
  During the [[last-supper]], Jesus washes his disciples' feet as a lesson in humility. Peter at first refuses.

  **In art:** Christ kneeling with a basin before Peter.

  **Famous works**

  - Tintoretto, *Christ Washing the Feet of the Disciples* (Prado)
  - Ford Madox Brown, *Jesus Washing Peter's Feet* (Tate)

  *From:* New Testament, Gospels · Christian
