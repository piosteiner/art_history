public_id: 130918
name: Inkanyamba
category: mythology and legend
definition: In Zulu folklore, a huge serpent living in deep pools beneath waterfalls, whose anger sends storms and tornadoes.
description_md: |-
  In Zulu folklore, the Inkanyamba is a huge serpent that lives in deep pools, above all the pool beneath Howick Falls. Its mood controls the weather: calm when it's pleased, but when angry it sends violent storms and tornadoes across the land.

  *From:* folklore · Zulu
