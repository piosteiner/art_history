public_id: 113026
name: Longxing
names:
  - lang: zh
    role: original
    text: 隆興
category: calendar
definition: "Chinese era name (隆興) of the Southern Song for the years 1163–1165: 1163 is Longxing 1 (元年) and Longxing 3 is 1165."
description_md: |-
  **Longxing** (隆興) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1163 under Emperor Xiaozong (孝宗). Its years are counted in lunar years: 1163 is Longxing 1 (元年), 1165 its last year, Longxing 3. A Chinese source dates a year within it as "Longxing 2" (隆興二年) rather than by a continuous count.

  Before: [[shaoxing-era|Shaoxing]]. After: [[qiandao-era|Qiandao]].
sources:
  definition:
    - source: dila-time-authority
