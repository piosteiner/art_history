name: Menehune
category: mythology and legend
definition: Small, strong people of Hawaiian tradition who build fishponds, dams and temples in a single night.
description_md: |-
  Small, strong people who lived in the forests and valleys of Hawaiʻi. They worked only at night and could build a fishpond, a dam or a temple in one night, but if the job wasn't finished by sunrise, they left it forever. The Alekoko fishpond on Kauaʻi is said to be their work.

  *From:* Hawaiian tradition · Hawaiian
