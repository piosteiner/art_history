public_id: 132350
name: Cornucopia
names: [Horn of plenty]
category: iconography
definition: The horn of plenty, overflowing with fruit and flowers; in one myth the horn of the goat Amalthea, who nursed the infant Zeus; in another, the horn Heracles broke off the river god Achelous.
description_md: |-
  In one version, the cornucopia was the horn of the goat Amalthea, who nursed the infant [[zeus]]; in [[person/ovid]]'s version, the horn [[heracles]] broke off the river god Achelous. [[abundantia|Abundance]] (Abundantia) is a woman holding it, overflowing with fruit and flowers.

  *From:* Ancient Greek and Roman
