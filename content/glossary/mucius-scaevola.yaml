name: Mucius Scaevola
category: mythology and legend
also_in: [iconography]
definition: The young Roman who held his right hand in a fire before the Etruscan king Porsenna to show Roman courage; Scaevola means "left-handed".
description_md: |-
  A young Roman who tried to assassinate an Etruscan king besieging Rome, but failed. To show Roman courage, he thrust his right hand into a fire and held it there. The impressed king let him go and made peace. *Scaevola* means "left-handed".

  **In art:** A young man holding his hand in a flaming altar before a king.

  **Famous works**

  - Workshop of Peter Paul Rubens (after his design, perhaps with Anthony van Dyck), *Mucius Scaevola before Lars Porsenna* (Museum of Fine Arts, Budapest)

  *From:* Livy, History of Rome · Ancient Roman
