name: Umay
category: mythology and legend
definition: A mother goddess of the ancient Turks, protector of childbirth, children and the family, sometimes imagined with wings.
description_md: |-
  Umay is a mother goddess of the ancient Turks, linked to fertility, childbirth and the protection of children and the family. She was imagined as a kind, motherly figure, sometimes with wings, watching over newborns and their mothers. She's a gentle counterpart to the dreaded albasty.

  *From:* Turkic religion · Turkic
