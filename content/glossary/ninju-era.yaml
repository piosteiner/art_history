definition: "Japanese era name (仁寿) for the years 851–853: 851 is Ninju 1 (元年) and Ninju 3 is 853."
description_md: |-
  **Ninju** (仁寿) is a Japanese era name ([[nengo]]), proclaimed in 851. Its years are counted in lunar years from the new year before the proclamation: 851 is Ninju 1 (元年), 853 its last year, Ninju 3. A Japanese source dates a year within it as "Ninju 2" (仁寿2年) rather than by a continuous count.

  Before: [[kasho-era-848|Kashō]]. After: [[saiko-era|Saikō]].
