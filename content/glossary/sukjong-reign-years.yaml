category: calendar
definition: "The reign years of Sukjong of Joseon (肅宗, 숙종), by which Korean sources date 1675–1720: 1675 is Sukjong 1, 1720 Sukjong 46."
description_md: |-
  **Sukjong** (肅宗, 숙종): the years of the reign of [[person/sukjong-of-joseon|Sukjong of Joseon]], who came to the throne on 23 August 1674. Korean sources count years by the reigning king ([[korean-reign-years]]): 1684 is Sukjong 10 (숙종 10년). His first year is 1675, the year after his accession; the rest of 1674 still counts for his predecessor.

  Before: Hyeonjong. After: Gyeongjong.
