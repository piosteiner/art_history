name: Kintarō
names: [Kintaro, Golden Boy]
category: mythology and legend
definition: The Golden Boy of Japanese folklore, raised by a mountain witch on Mount Ashigara, who wrestled bears and rode a giant bear, and later became one of the legendary retainers who hunted monsters.
description_md: |-
  Kintarō was a boy of superhuman strength, raised by a mountain witch on Mount Ashigara. He grew up among the animals, wrestled bears for fun, and rode a giant bear like a horse. He was so strong he could uproot trees. When a famous samurai discovered him, he became a great warrior and one of the legendary retainers who hunted down monsters.

  *From:* folklore · Japanese
