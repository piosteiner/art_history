name: Baptism of Christ
names: [The Baptism of Christ]
category: iconography
definition: Jesus's baptism by John in the Jordan, with the Holy Spirit descending as a dove.
description_md: |-
  Jesus is baptised by John in the Jordan, and the Holy Spirit descends on him as a dove.

  **In art:** Jesus standing in a river while John pours water over his head, with a dove above and angels holding his clothes.

  **Famous works**

  - [[artist/piero-della-francesca]], *The Baptism of Christ* (National Gallery, London)
  - [[artist/andrea-del-verrocchio]] and [[artist/leonardo-da-vinci]], *The Baptism of Christ* (Uffizi) — [[artwork/the-baptism-of-christ]]

  *From:* New Testament, Gospels · Christian
