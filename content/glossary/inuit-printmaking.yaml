definition: The prints made with Inuit artists at the Kinngait Studios in Cape Dorset (now Kinngait, Nunavut) since 1959, inspired by Japanese printmaking.
description_md: |-
  In 1959, the Kinngait Studios in Cape Dorset (Nunavut) began making prints with Inuit artists, inspired by Japanese printmaking. They became famous around the world.

  **Famous works**

  - Kenojuak Ashevak, *The Enchanted Owl* (stonecut, 1960; it appeared on a Canadian stamp, issued in 1970)
  - Pitseolak Ashoona, *prints of camp life*
  - Annie Pootoogook, *drawings of modern Arctic life*

  *From:* Inuit
