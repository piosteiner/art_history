public_id: 113387
name: Jinseong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 진성왕
  - lang: ko-Hani
    role: alternative
    text: 眞聖王
category: calendar
definition: "The reign years of Queen Jinseong of Silla (眞聖王, 진성왕), by which Korean histories date 887–897: 887 is Jinseong 1, 897 Jinseong 11."
description_md: |-
  **Jinseong** (眞聖王, 진성왕): the years of the reign of Queen Jinseong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 896 is Jinseong 10 (진성왕 10년). The year of the accession, 887, counts as the first year.

  Before: [[jeonggang-silla-reign-years|Jeonggang]]. After: [[hyogong-silla-reign-years|Hyogong]].
sources:
  definition:
    - source: dila-time-authority
