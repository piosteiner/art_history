name: Briseis
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the captive woman given to Achilles; when Agamemnon took her, Achilles refused to fight, setting off the "wrath of Achilles".
description_md: |-
  A captive woman given to [[achilles]] as a prize. When Agamemnon took her from him, Achilles refused to fight, setting off the "wrath of Achilles" that opens the *Iliad*.

  **In art:** A young woman being led away from Achilles' tent by heralds.

  **Famous works**

  - *Briseis Led Away from Achilles* (fresco from the House of the Tragic Poet, Pompeii, Naples)
  - [[artist/giovanni-battista-tiepolo]], *Briseis Led to Agamemnon* (Villa Valmarana, Vicenza)

  *From:* Homer, Iliad · Ancient Greek
