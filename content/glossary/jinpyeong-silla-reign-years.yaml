public_id: 113362
name: Jinpyeong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 진평왕
  - lang: ko-Hani
    role: alternative
    text: 眞平王
category: calendar
definition: "The reign years of King Jinpyeong of Silla (眞平王, 진평왕), by which Korean histories date 579–632: 579 is Jinpyeong 1, 632 Jinpyeong 54."
description_md: |-
  **Jinpyeong** (眞平王, 진평왕): the years of the reign of King Jinpyeong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 588 is Jinpyeong 10 (진평왕 10년). The year of the accession, 579, counts as the first year.

  Before: [[jinji-silla-reign-years|Jinji]]. After: [[seondeok-silla-reign-years|Seondeok]].
sources:
  definition:
    - source: dila-time-authority
