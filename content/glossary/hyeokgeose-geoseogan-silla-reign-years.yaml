public_id: 113337
name: Hyeokgeose Geoseogan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 혁거세거서간
  - lang: ko-Hani
    role: alternative
    text: 赫居世居西干
category: calendar
definition: "The reign years of Hyeokgeose Geoseogan of Silla (赫居世居西干, 혁거세거서간), by which Korean histories date 57 BC – 4 CE: 57 BC is Hyeokgeose Geoseogan 1, 4 Hyeokgeose Geoseogan 61."
description_md: |-
  **Hyeokgeose Geoseogan** (赫居世居西干, 혁거세거서간): the years of the reign of Hyeokgeose Geoseogan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 48 BC is Hyeokgeose Geoseogan 10 (혁거세거서간 10년). The year of the accession, 57 BC, counts as the first year.

  After: [[namhae-chachaung-silla-reign-years|Namhae Chachaung]].
sources:
  definition:
    - source: dila-time-authority
