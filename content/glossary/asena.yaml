name: Asena
names: [the Grey Wolf]
category: mythology and legend
definition: In the legend of the Göktürks, the grey she-wolf who saved the last wounded boy of a destroyed tribe; their descendants became the ancestors of the Turks.
description_md: |-
  In the legend of the Göktürks, an enemy army wiped out a whole tribe, leaving only a wounded boy. A she-wolf (named Asena in modern Turkish tradition; unnamed in the old tales) found him, nursed him back to health and hid him in a cave in the mountains. Their descendants became the ancestors of the Turks. The grey wolf is still a powerful Turkic symbol today.

  *From:* Göktürk legend · Turkic (Göktürk)
