name: Div-e Sepid
names: [the White Demon, White Div]
category: mythology and legend
definition: In the Persian Shahnameh, the White Demon, giant demon lord of Mazandaran, slain by Rostam in the last of his Seven Labours.
description_md: |-
  The White Demon ruled the land of Mazandaran with an army of divs. He captured the Persian king and blinded him and his army with sorcery. In his seventh and last labour, [[rostam]] found the White Demon sleeping in a dark cave, woke him, and killed him in a brutal fight. The demon's heart and blood were then used to cure the blindness of the king and his soldiers.

  *From:* Shahnameh · Persian
