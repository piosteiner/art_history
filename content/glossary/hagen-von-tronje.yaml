name: Hagen von Tronje
names: [Hagen of Tronje, Högni]
category: mythology and legend
definition: The grim, loyal vassal of the Burgundian kings in the Nibelungenlied, who murdered Siegfried, sank the Nibelung treasure in the Rhine and fought to the last at Etzel's court.
description_md: |-
  Hagen of Tronje was the fiercely loyal vassal of the Burgundian kings. To protect his queen's honour and his lords' power, he murdered [[siegfried]]. Later, he sank the entire Nibelung treasure in the Rhine so that [[kriemhild]] could never use it. On the journey to Etzel's court, river spirits warned him that all but one would die, yet he went anyway and fought to the last. He's one of literature's great anti-heroes: a murderer, but utterly brave and loyal.

  *From:* Nibelungenlied · German / Germanic
