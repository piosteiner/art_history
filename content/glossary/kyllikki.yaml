public_id: 131195
name: Kyllikki
category: mythology and legend
definition: The proud island maiden of the Finnish Kalevala carried off by Lemminkäinen on his sledge; she broke her promise not to go dancing in the village, and he went off to war.
description_md: |-
  She refused every suitor, so [[lemminkainen]] grabbed her during a dance and took her away on his sledge. They swore promises to each other: he wouldn't go to war, and she wouldn't go dancing in the village. She broke hers first, and he went off to war.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
