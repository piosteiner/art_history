description_md: |-
  Used for painted panels in Italy beside poplar[[source/wikipedia-en-panel-painting|“In Italy it was usually seasoned poplar, willow or linden”]] and, in the Middle Ages, in the Upper Rhine and Bavaria; Albrecht Altdorfer liked it[[source/wikipedia-en-panel-painting|“In the Middle Ages, spruce and lime were used in the Upper Rhine and often in Bavaria” · “Lime was popular with Albrecht Altdorfer”]].

  ## Limewood sculpture

  Southern Germany was the region of sculpture in limewood.[[source/baxandall-1980-limewood-sculptors|p. 27]] To the north, in northern Germany and the Netherlands, carvers mostly used oak or sometimes walnut, and to the west, in France and Burgundy, walnut and sometimes oak; the hills north of the river Main and the Vosges mark the boundary.[[source/baxandall-1980-limewood-sculptors|p. 27]] What distinguished the south, according to Michael Baxandall, was that limewood "was a central medium in the sense that it was used for a central genre of the culture, the retable altarpiece".[[source/baxandall-1980-limewood-sculptors|p. 27]]

  Germany has two native species of lime: the small-leaved *Winterlinde* (*Tilia cordata*), which grows throughout the country, and the broad-leaved *Sommerlinde* (*Tilia platyphyllos*), which stops roughly along the line where limewood sculpture stopped.[[source/baxandall-1980-limewood-sculptors|p. 28]] The broad-leaved lime grows faster and bigger, is a little softer and lighter, and shrinks — and so splits — by about 5½ per cent on drying against 7 per cent in the small-leaved tree.[[source/baxandall-1980-limewood-sculptors|p. 28]] Renaissance Germany called the two "tame" (*zahm*) and "wild"; the botanist Hieronymus Bock praised the tame lime and noted that the carved images honoured in churches were made from its wood.[[source/baxandall-1980-limewood-sculptors|p. 28]] Northern carvers, by contrast, had cheap East Baltic timber imported by the Hansa, which included oak but not limewood.[[source/baxandall-1980-limewood-sculptors|p. 28]] Good limewood was expensive even in the south: when Nuremberg recodified the sale of wood from its forests of St Sebald and St Lorenz in 1516, limewood and sallow were charged 10 Pfund, against 5 for oak and 3 for beech.[[source/baxandall-1980-limewood-sculptors|pp. 28–29]] The lime also had magico-religious and festive associations: in Early New High German *Linde* could mean a holy grove as well as a limetree.[[source/baxandall-1980-limewood-sculptors|p. 31]]

  ## Properties

  Limewood is a hardwood with quite coarse but evenly arranged fibres, little-differentiated annual rings and weak rays; its thin-walled cells make it light and let a tool cut across the grain without difficulty.[[source/baxandall-1980-limewood-sculptors|p. 34]] In its "uniformity, softness, elasticity, readiness to yield across grain" it is a tractable material for the carver.[[source/baxandall-1980-limewood-sculptors|p. 34]] Its lightness, however, makes it shrink violently, so that it tends to split in radial cracks ("starshake") rather than warp, and, being diffuse-porous, it keeps swelling and shrinking with the humidity of the air.[[source/baxandall-1980-limewood-sculptors|pp. 34–36]] Carvers therefore removed the heartwood and hollowed their figures out from behind, leaving a thick "C" of sapwood that could be cut into thin, membrane-like forms apt for drapery.[[source/baxandall-1980-limewood-sculptors|p. 36]] For Baxandall limewood was "a medium of the grand form and of the surface, whether polychrome or monochrome".[[source/baxandall-1980-limewood-sculptors|p. 48]]
