name: Kannon
names:
  - lang: ja
    role: original
    text: "{観音|かんのん}"
category: iconography
parent: bodhisattva
definition: Avalokiteśvara, the bodhisattva of compassion, the most popular of all bodhisattvas; appears in many forms (eleven-headed, thousand-armed, with a lasso).
description_md: |-
  The bodhisattva of compassion, who hears the cries of the world. Shown as male in India, but in China gradually as a female figure from around the 10th century onwards.

  **In art:** A small Amitabha Buddha in the crown, a vase of pure water and a willow branch, a lotus. Some forms have eleven heads or a thousand arms, with an eye in each palm, to see and help all beings. The Water-Moon Guanyin sits relaxed on a rock by water, gazing at the moon's reflection. White-robed Guanyin is popular in ink painting.

  **Famous works**

  - *Guanyin of the Southern Sea* (Water-Moon type, painted wood, 10th–12th century, Nelson-Atkins Museum of Art, Kansas City)
  - [[artist/mu-qi]], *Guanyin, Monkeys and Crane triptych* (Daitoku-ji, Kyoto)
  - *Sanjūsangen-dō* (Kyoto, 1,001 statues of Thousand-Armed Kannon)
  - *Kudara Kannon* (Hōryū-ji, Nara)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
