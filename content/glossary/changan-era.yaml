public_id: 113080
name: Chang'an
names:
  - lang: zh
    role: original
    text: 長安
category: calendar
definition: "Chinese era name (長安) of the Zhou of Empress Wu for the years 701–704: 701 is Chang'an 1 (元年) and Chang'an 4 is 704."
description_md: |-
  **Chang'an** (長安) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 701 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 701 is Chang'an 1 (元年), 704 its last year, Chang'an 4. A Chinese source dates a year within it as "Chang'an 2" (長安二年) rather than by a continuous count.

  Before: [[dazu-era|Dazu]]. After: [[shenlong-era|Shenlong]].
sources:
  definition:
    - source: dila-time-authority
