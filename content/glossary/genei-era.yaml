category: calendar
definition: "Japanese era name (元永) for the years 1118–1120: 1118 is Gen'ei 1 (元年) and Gen'ei 3 is 1120."
description_md: |-
  **Gen'ei** (元永) is a Japanese era name ([[nengo]]), proclaimed in 1118. Its years are counted in lunar years from the new year before the proclamation: 1118 is Gen'ei 1 (元年), 1120 its last year, Gen'ei 3. A Japanese source dates a year within it as "Gen'ei 2" (元永2年) rather than by a continuous count.

  Before: [[eikyu-era|Eikyū]]. After: [[hoan-era|Hōan]].
