public_id: 131362
name: The Ugly Duckling
category: mythology and legend
definition: In Andersen's fairy tale (1843), a bird mocked for being ugly that grows into a swan.
description_md: |-
  Bullied and chased away by the other farm animals, he spent a hard winter alone. In spring, he saw beautiful swans and flew to them, expecting to be killed, then saw his own reflection in the water. Andersen saw himself in this story.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
