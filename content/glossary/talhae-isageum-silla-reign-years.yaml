public_id: 113340
name: Talhae Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 탈해이사금
  - lang: ko-Hani
    role: alternative
    text: 脫解尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Talhae Isageum of Silla (脫解尼師今, 탈해이사금), by which Korean histories date 57–80: 57 is Talhae Isageum 1, 80 Talhae Isageum 24."
description_md: |-
  **Talhae Isageum** (脫解尼師今, 탈해이사금): the years of the reign of Talhae Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 66 is Talhae Isageum 10 (탈해이사금 10년). The year of the accession, 57, counts as the first year.

  Before: [[yuri-isageum-silla-reign-years|Yuri Isageum]]. After: [[pasa-isageum-silla-reign-years|Pasa Isageum]].
sources:
