name: Nyurgun Bootur
names: [Nyurgun Bootur the Swift]
category: mythology and legend
definition: Nyurgun Bootur the Swift, central hero of the Olonkho, the oral epic tradition of the Yakut, sent down from the upper world to protect the middle world from underworld demons.
description_md: |-
  Nyurgun Bootur the Swift is the central hero of the *Olonkho*, the great oral epic tradition of the Yakut people. He is sent down from the upper world to protect the people of the middle world, the earth, from the monstrous demons of the underworld, who steal souls and threaten the heavens. The best-known version, Platon Oyunsky's Nyurgun Bootur the Swift, runs to about 36,000 verses. Olonkho storytellers performed it from memory, mixing spoken verse and sung dialogue, and were respected almost like shamans.

  *From:* Olonkho · Yakut (Sakha)
