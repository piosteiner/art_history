public_id: 113368
name: Hyoso of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 효소왕
  - lang: ko-Hani
    role: alternative
    text: 孝昭王
category: calendar
definition: "The reign years of King Hyoso of Silla (孝昭王, 효소왕), by which Korean histories date 692–702: 692 is Hyoso 1, 702 Hyoso 11."
description_md: |-
  **Hyoso** (孝昭王, 효소왕): the years of the reign of King Hyoso of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 701 is Hyoso 10 (효소왕 10년). The year of the accession, 692, counts as the first year.

  Before: [[sinmun-silla-reign-years|Sinmun]]. After: [[seongdeok-silla-reign-years|Seongdeok]].
sources:
  definition:
    - source: dila-time-authority
