definition: In Greek myth the war of the gods against the Giants, children of Gaia, which the gods won with the help of Heracles.
description_md: |-
  The Titanomachy was the ten-year war in which [[zeus]] and the Olympians overthrew [[cronus]] and the Titans. The Gigantomachy was a later war against the Giants, children of [[gaia]], which the gods won with the help of [[heracles]].

  **In art:** Gods fighting enormous figures, often with snake legs, and collapsing rocks and buildings.

  **Famous works**

  - *Pergamon Altar* (Pergamon Museum, Berlin)
  - Giulio Romano, *Sala dei Giganti* (Palazzo Te, Mantua)

  *From:* Greek mythology · Ancient Greek
