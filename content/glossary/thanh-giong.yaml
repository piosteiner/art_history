name: Thánh Gióng
category: mythology and legend
definition: A boy of Vietnamese legend who did not speak until invaders came, then grew into a giant overnight, drove them off and rode into the sky.
description_md: |-
  He didn't speak or move until he was three, but when invaders came, he suddenly spoke and asked for an iron horse, armour and a sword (an iron rod in some tellings). He grew into a giant overnight, ate the whole village's rice, and drove off the enemy. When his weapon broke, he pulled up bamboo to fight with. Afterwards, he rode up into the sky.

  *From:* Vietnamese legend · Vietnamese
