public_id: 113308
name: Seongjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 성종
  - lang: ko-Hani
    role: alternative
    text: 成宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Seongjong of Goryeo (成宗, 성종), by which Korean histories date 982–997: 982 is Seongjong 1, 997 Seongjong 16."
description_md: |-
  **Seongjong** (成宗, 성종): the years of the reign of King Seongjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 991 is Seongjong 10 (성종 10년). The year of the accession, 982, counts as the first year.

  Before: [[gyeongjong-goryeo-reign-years|Gyeongjong]]. After: [[mokjong-goryeo-reign-years|Mokjong]].
sources:
  definition:
    - source: dila-time-authority
