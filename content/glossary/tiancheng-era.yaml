name: Tiancheng
names:
  - lang: zh
    role: original
    text: 天成
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天成) of the Later Tang for the years 926–930: 926 is Tiancheng 1 (元年) and Tiancheng 5 is 930."
description_md: |-
  **Tiancheng** (天成) is a Chinese era name ([[nianhao]]) of the Later Tang, proclaimed in 926 under Emperor Mingzong (明宗). Its years are counted in lunar years: 926 is Tiancheng 1 (元年), 930 its last year, Tiancheng 5. A Chinese source dates a year within it as "Tiancheng 2" (天成二年) rather than by a continuous count.

  Before: [[tongguang-era|Tongguang]]. After: [[changxing-era|Changxing]].
sources:
