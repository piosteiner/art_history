public_id: 131285
name: Dryope
category: mythology and legend
definition: In Ovid's Metamorphoses, a young mother turned into a lotus tree after picking a flower from a tree that was a transformed nymph.
description_md: |-
  She picked a flower from a lotus tree for her baby, without knowing it was a transformed nymph. As punishment, bark grew over her own body from the feet up. Her last words asked that her son be brought to play beneath her branches.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
