definition: "Chinese era name (宣德) of the Ming for the years 1426–1435: 1426 is Xuande 1 (元年) and Xuande 10 is 1435."
description_md: |-
  **Xuande** (宣德) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1426. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Xuande Emperor. Its years are counted in lunar years: 1426 is Xuande 1 (元年), 1435 its last year, Xuande 10. A Chinese source dates a year within it as "Xuande 2" (宣德二年) rather than by a continuous count.

  Before: [[hongxi-era|Hongxi]]. After: [[zhengtong-era|Zhengtong]].
