name: Yuanhe
names:
  - lang: zh
    role: original
    text: 元和
category: calendar
parent: chinese-calendar
definition: "Chinese era name (元和) of the Tang for the years 806–821: 806 is Yuanhe 1 (元年) and Yuanhe 16 is 821."
description_md: |-
  **Yuanhe** (元和) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 806 under Emperor Xianzong (憲宗). Its years are counted in lunar years: 806 is Yuanhe 1 (元年), 821 its last year, Yuanhe 16. A Chinese source dates a year within it as "Yuanhe 2" (元和二年) rather than by a continuous count.

  Before: [[yongzhen-era|Yongzhen]]. After: [[changqing-era|Changqing]].
sources:
