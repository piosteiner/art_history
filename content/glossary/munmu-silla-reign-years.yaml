public_id: 113366
name: Munmu of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 문무왕
  - lang: ko-Hani
    role: alternative
    text: 文武王
category: calendar
definition: "The reign years of King Munmu of Silla (文武王, 문무왕), by which Korean histories date 661–681: 661 is Munmu 1, 681 Munmu 21."
description_md: |-
  **Munmu** (文武王, 문무왕): the years of the reign of King Munmu of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 670 is Munmu 10 (문무왕 10년). The year of the accession, 661, counts as the first year.

  Before: [[taejong-muyeol-silla-reign-years|Taejong Muyeol]]. After: [[sinmun-silla-reign-years|Sinmun]].
sources:
  definition:
    - source: dila-time-authority
