definition: "Japanese era name (正応) for the years 1288–1292: 1288 is Shōō 1 (元年) and Shōō 5 is 1292."
description_md: |-
  **Shōō** (正応) is a Japanese era name ([[nengo]]), proclaimed in 1288. Its years are counted in lunar years from the new year before the proclamation: 1288 is Shōō 1 (元年), 1292 its last year, Shōō 5. A Japanese source dates a year within it as "Shōō 2" (正応2年) rather than by a continuous count.

  Before: [[koan-era-1278|Kōan]]. After: [[einin-era|Einin]].
