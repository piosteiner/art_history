name: Massacre of the Innocents
names: [The Massacre of the Innocents]
category: iconography
definition: King Herod's order to kill all boys of two years and under in and around Bethlehem after hearing of the birth of a new "king of the Jews".
description_md: |-
  King Herod, hearing of the birth of a new "king of the Jews", ordered all boys of two years and under in and around Bethlehem to be killed.

  **In art:** Soldiers attacking babies while mothers try to protect them.

  **Famous works**

  - Pieter Bruegel the Elder, *The Massacre of the Innocents* (Royal Collection, set in a snowy Flemish village)
  - Rubens, *The Massacre of the Innocents* (Art Gallery of Ontario)
  - [[artist/guido-reni]], *The Massacre of the Innocents* (Bologna)

  *From:* New Testament, Gospels · Christian
