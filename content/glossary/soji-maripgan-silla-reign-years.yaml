name: Soji Maripgan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 소지마립간
  - lang: ko-Hani
    role: alternative
    text: 炤知麻立干
category: calendar
parent: korean-calendar
definition: "The reign years of Soji Maripgan of Silla (炤知麻立干, 소지마립간), by which Korean histories date 479–500: 479 is Soji Maripgan 1, 500 Soji Maripgan 22."
description_md: |-
  **Soji Maripgan** (炤知麻立干, 소지마립간): the years of the reign of Soji Maripgan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 488 is Soji Maripgan 10 (소지마립간 10년). The year of the accession, 479, counts as the first year.

  Before: [[jabi-maripgan-silla-reign-years|Jabi Maripgan]]. After: [[jijeung-maripgan-silla-reign-years|Jijeung Maripgan]].
