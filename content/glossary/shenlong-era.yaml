public_id: 113081
name: Shenlong
names:
  - lang: zh
    role: original
    text: 神龍
category: calendar
definition: "Chinese era name (神龍) of the Zhou of Empress Wu for the years 705–707: 705 is Shenlong 1 (元年) and Shenlong 3 is 707."
description_md: |-
  **Shenlong** (神龍) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 705 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 705 is Shenlong 1 (元年), 707 its last year, Shenlong 3. A Chinese source dates a year within it as "Shenlong 2" (神龍二年) rather than by a continuous count.

  Before: [[changan-era|Chang'an]]. After: [[jinglong-era|Jinglong]].
sources:
  definition:
    - source: dila-time-authority
