name: The Shipwrecked Sailor
names: [The Serpent King]
category: mythology and legend
definition: An ancient Egyptian tale of a sailor washed up on a magical island ruled by a giant golden serpent, which, the serpent said, would become water once he had left.
description_md: |-
  The snake, thirty cubits long with a beard and scales of gold and lapis lazuli, told him how a falling star had burnt up his family of seventy-four serpents (and, in some translations, his daughter too). He sent the sailor home with treasures. He told the sailor that he would never see the island again, for it would become water.

  *From:* Tale of the Shipwrecked Sailor · Ancient Egyptian
