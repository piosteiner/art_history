name: Hotu Matuʻa
category: mythology and legend
definition: The legendary first chief who sailed to Rapa Nui (Easter Island).
description_md: |-
  Hotu Matuʻa was the legendary first chief who sailed to the island. Later, in the [[tangata-manu|Birdman]] (*Tangata manu*) contest, young men climbed down sea cliffs and swam to a small island to find the first sooty tern egg of the season. Whoever brought it back unbroken made his sponsor the Birdman for a year.

  *From:* Rapa Nui tradition · Rapa Nui
