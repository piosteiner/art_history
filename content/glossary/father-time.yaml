name: Father Time
names: [Time]
category: iconography
definition: "Time personified, merged with the god Cronus/Saturn who devours everything: a winged old man with a scythe and an hourglass."
description_md: |-
  Time, merged with the god [[cronus]]/Saturn, who devours everything.

  **In art:** A winged old man with a scythe and an hourglass, sometimes revealing [[truth]] by pulling away a curtain ("Truth, the daughter of Time").

  **Famous works**

  - [[artist/bronzino]], *An Allegory with Venus and Cupid* (National Gallery, London)
  - [[artist/nicolas-poussin]], *A Dance to the Music of Time* (c. 1634–1636, Wallace Collection, London)

  *From:* European
