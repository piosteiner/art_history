name: Paolo and Francesca
names: [Francesca da Rimini]
category: mythology and legend
also_in: [iconography]
definition: The tragic lovers of Dante's Inferno, condemned to be blown forever on an eternal whirlwind.
description_md: |-
  The tragic lovers Paolo and Francesca, condemned to be blown forever on an eternal whirlwind, are among the most painted episodes of Dante's *Divine Comedy*.

  **In art:** A pair of lovers swirling in a dark wind.

  **Famous works**

  - Ary Scheffer, *Francesca da Rimini and Paolo Malatesta Appraised by Dante and Virgil* (1835; Wallace Collection, London)
  - [[artist/auguste-rodin]], *The Kiss* (Musée Rodin)

  *From:* Dante, Divine Comedy (Inferno, Canto V) · Italian
