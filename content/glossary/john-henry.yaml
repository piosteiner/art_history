name: John Henry
category: mythology and legend
definition: A Black "steel-driving man" of American folklore who raced a steam drill, won, and died with his hammer in his hand.
description_md: |-
  A Black "steel-driving man" who hammered a steel drill into rock to make holes for the explosives that blasted railroad tunnels. When a steam-powered drill was brought in, he raced it and won, but then collapsed and died with his hammer in his hand. He became a symbol of the strength and dignity of working people.

  *From:* American folklore · African American
