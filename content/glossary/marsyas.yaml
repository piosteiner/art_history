name: Marsyas
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the satyr who challenged Apollo to a music contest with Athena's flute, lost and was flayed alive.
description_md: |-
  A satyr who picked up the flute (the double-pipe aulos) that [[athena]] had thrown away and became so skilled that he challenged [[apollo]] to a music contest. He lost, and Apollo flayed him alive.

  **In art:** A satyr tied to a tree being skinned, or a contest between the lyre and the flute.

  **Famous works**

  - [[artist/titian]], *The Flaying of Marsyas* (Kroměříž, Czech Republic)
  - [[artist/raphael]], *Apollo and Marsyas* (ceiling, Stanza della Segnatura)
  - José de Ribera, *Apollo Flaying Marsyas* (Naples and Brussels)

  *From:* Greek mythology · Ancient Greek
