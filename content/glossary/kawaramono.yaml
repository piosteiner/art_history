name: kawaramono
names:
  - lang: ja
    role: original
    text: "{河原者|かわらもの}"
category: society
definition: "“River-bed people”: an outcast group living along the Kamo and Katsura rivers who did the city’s most despised work; some became noted garden makers in the fifteenth century."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 216–217
