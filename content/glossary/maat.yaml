name: Ma'at
names: [Maat]
category: mythology and legend
definition: The Egyptian goddess and idea of truth, justice, balance and cosmic order, shown with an ostrich feather — the feather against which hearts were weighed.
description_md: |-
  Ma'at was both a goddess and an idea: truth, justice, harmony and the right order of the universe. She was shown as a woman with an ostrich feather in her hair. That feather was the one every dead person's heart was weighed against. Pharaohs were expected to uphold Ma'at, and the whole of Egyptian life was meant to keep the world in balance against chaos.

  *From:* Egyptian religion · Ancient Egyptian
