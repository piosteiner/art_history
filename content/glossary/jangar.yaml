public_id: 131057
name: Jangar
category: mythology and legend
definition: The orphan khan of the Oirat and Kalmyk epic Jangar, one of the two great Mongol epics, who rules Bomba (Bumba), a paradise without winter, hunger or old age, and defends it with his twelve champions.
description_md: |-
  Jangar is the hero of one of the two great Mongol epics, told especially among the Oirat and Kalmyk peoples. He comes from a long line of mighty khans, but is orphaned as a small child. He grows into a great warrior and rules the land of Bumba, a paradise without winter, hunger or old age. With his twelve legendary champions, he defends it against invading monsters and enemy khans.

  *From:* Jangar epic · Mongol (Oirat, Kalmyk)
