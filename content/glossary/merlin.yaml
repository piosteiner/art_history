name: Merlin
category: mythology and legend
also_in: [iconography]
definition: The wizard and adviser of King Arthur in Arthurian legend, imprisoned for ever by the enchantress Vivien (Nimue) with his own magic.
description_md: |-
  The wizard Merlin, [[king-arthur|Arthur]]'s adviser, fell in love with the enchantress [[vivien]] (also called Nimue). She learned all his magic and then used it to imprison him forever in a tree, a cave or a tower of air.

  **In art:** An old bearded wizard entangled in a hawthorn tree, with a young woman reading from a book of spells.

  **Famous works**

  - [[artist/edward-burne-jones]], *The Beguiling of Merlin* (Lady Lever Art Gallery, Port Sunlight)

  *From:* Arthurian legend · British (Arthurian legend)
