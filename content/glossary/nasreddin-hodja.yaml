name: Nasreddin Hodja
names: [Nasreddin]
category: mythology and legend
definition: The wise fool of thousands of funny stories told from Turkey to China.
description_md: |-
  He's the hero of thousands of funny stories from Turkey to China. Once, he rode his donkey backwards, explaining that he didn't want to turn his back on his students. At a feast, he was ignored in his old clothes, but treated with respect in a fur coat, so he started feeding his soup to the coat.

  *From:* folklore · Turkish and wider Middle Eastern / Central Asian folklore
