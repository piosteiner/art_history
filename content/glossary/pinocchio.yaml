name: Pinocchio
category: mythology and legend
definition: The wooden puppet who wants to be a real boy, from Carlo Collodi's novel (1883).
description_md: |-
  In Carlo Collodi's original novel (1883), he's much naughtier than in the Disney film. He kills the talking cricket with a hammer, his feet burn off, and he's hanged by the Fox and the Cat. In the end, he saves his father Geppetto from a giant shark and becomes a real boy.

  *From:* Carlo Collodi, The Adventures of Pinocchio (1883) · Italian
