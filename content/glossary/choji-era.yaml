definition: "Japanese era name (長治) for the years 1104–1106: 1104 is Chōji 1 (元年) and Chōji 3 is 1106."
description_md: |-
  **Chōji** (長治) is a Japanese era name ([[nengo]]), proclaimed in 1104. Its years are counted in lunar years from the new year before the proclamation: 1104 is Chōji 1 (元年), 1106 its last year, Chōji 3. A Japanese source dates a year within it as "Chōji 2" (長治2年) rather than by a continuous count.

  Before: [[kowa-era-1099|Kōwa]]. After: [[kasho-era-1106|Kashō]].
