name: Sibyls
names: [The Sibyls, Cumaean Sibyl]
category: mythology and legend
also_in: [iconography]
definition: The prophetesses of the ancient world, among them the Cumaean Sibyl; Christian tradition paired them with the prophets as foretelling Christ.
description_md: |-
  Prophetesses of the ancient world. The most famous, the Cumaean Sibyl, guided [[aeneas]] into the Underworld and sold the Sibylline Books of prophecy to a Roman king. Christian tradition believed the sibyls had foretold the coming of Christ, so they were paired with the Old Testament prophets.

  **In art:** Powerful women reading or holding large books and scrolls, each with a name like the Delphic, Cumaean, Persian, Libyan or Erythraean Sibyl.

  **Famous works**

  - [[artist/michelangelo]], the five Sibyls on the *Sistine Chapel ceiling*
  - [[artist/raphael]], *Sibyls* (Santa Maria della Pace, Rome)
  - [[artist/domenichino]], *The Cumaean Sibyl* (Capitoline Museums)

  *From:* Virgil, Aeneid; Christian tradition · Ancient Greek and Roman; Christian tradition
