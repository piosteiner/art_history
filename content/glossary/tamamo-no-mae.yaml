name: Tamamo-no-Mae
category: mythology and legend
definition: In Japanese legend, the most beautiful and learned woman at the 12th-century imperial court, unmasked as a wicked nine-tailed fox spirit; killed, her body became the Sesshō-seki, the "killing stone".
description_md: |-
  Tamamo-no-Mae was the most beautiful and learned woman at the court of the emperor in the 12th century. But the emperor fell mysteriously ill, and a court diviner discovered that she was really a wicked nine-tailed fox spirit. She fled, was hunted down and killed, and her body turned into the Sesshō-seki, the "killing stone", said to slay anyone who touches it.

  *From:* legend · Japanese
