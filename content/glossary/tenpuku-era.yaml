category: calendar
definition: "Japanese era name (天福) for the years 1233–1234: 1233 is Tenpuku 1 (元年) and Tenpuku 2 is 1234."
description_md: |-
  **Tenpuku** (天福) is a Japanese era name ([[nengo]]), proclaimed in 1233. Its years are counted in lunar years from the new year before the proclamation: 1233 is Tenpuku 1 (元年), 1234 its last year, Tenpuku 2. A Japanese source dates a year within it as "Tenpuku 2" (天福2年) rather than by a continuous count.

  Before: [[joei-era|Jōei]]. After: [[bunryaku-era|Bunryaku]].
