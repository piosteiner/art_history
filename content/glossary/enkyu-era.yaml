category: calendar
definition: "Japanese era name (延久) for the years 1069–1074: 1069 is Enkyū 1 (元年) and Enkyū 6 is 1074."
description_md: |-
  **Enkyū** (延久) is a Japanese era name ([[nengo]]), proclaimed in 1069. Its years are counted in lunar years from the new year before the proclamation: 1069 is Enkyū 1 (元年), 1074 its last year, Enkyū 6. A Japanese source dates a year within it as "Enkyū 2" (延久2年) rather than by a continuous count.

  Before: [[jiryaku-era|Jiryaku]]. After: Jōhō.
