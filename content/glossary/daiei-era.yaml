definition: "Japanese era name (大永) for the years 1521–1528: 1521 is Daiei 1 (元年) and Daiei 8 is 1528."
description_md: |-
  **Daiei** (大永) is a Japanese era name ([[nengo]]), proclaimed in 1521. Its years are counted in lunar years from the new year before the proclamation: 1521 is Daiei 1 (元年), 1528 its last year, Daiei 8. A Japanese source dates a year within it as "Daiei 2" (大永2年) rather than by a continuous count.

  Before: [[eisho-era-1504|Eishō]]. After: [[kyoroku-era|Kyōroku]].
