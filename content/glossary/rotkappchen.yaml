name: Rotkäppchen
names: [Little Red Riding Hood, Little Red Cap]
category: mythology and legend
definition: In the Grimms' fairy tale, a girl in a red cap who meets the wolf on the way to her grandmother's house.
description_md: |-
  The wolf ate the grandmother and then the girl. In the Grimm version, a huntsman cut them both out of the wolf's belly alive and filled it with stones.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
