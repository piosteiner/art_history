name: Jumong
names: [Dongmyeong of Goguryeo]
category: mythology and legend
definition: The egg-born archer of Korean legend, son of Yuhwa, daughter of the river god, who fled jealous princes over a bridge of fish and turtles and founded Goguryeo, one of Korea's Three Kingdoms.
description_md: |-
  Jumong's mother, Yuhwa, was the daughter of the river god. Seduced by the heavenly Haemosu and exiled by her father, she was found by King Geumwa ("golden frog"), and later gave birth to Jumong from an egg. The boy was such a skilled archer that his name means "good archer". Jealous princes plotted to kill him, so he fled. When a river blocked his escape, fish and turtles rose to form a bridge for him. He went on to found Goguryeo, one of Korea's Three Kingdoms.

  *From:* Goguryeo founding myth · Korean
