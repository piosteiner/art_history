category: literary genre
definition: "A record of the writer’s days and thoughts. As literature, the Japanese diary (nikki, 日記; nikki bungaku, diary literature) flourished in the Heian period: the Tosa nikki of about 935, the Kagerō nikki (The Gossamer Years) of Fujiwara no Michitsuna’s mother and the diary of Murasaki Shikibu."
