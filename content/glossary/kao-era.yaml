definition: "Japanese era name (嘉応) for the years 1169–1171: 1169 is Kaō 1 (元年) and Kaō 3 is 1171."
description_md: |-
  **Kaō** (嘉応) is a Japanese era name ([[nengo]]), proclaimed in 1169. Its years are counted in lunar years from the new year before the proclamation: 1169 is Kaō 1 (元年), 1171 its last year, Kaō 3. A Japanese source dates a year within it as "Kaō 2" (嘉応2年) rather than by a continuous count.

  Before: [[ninan-era|Nin'an]]. After: [[joan-era|Jōan]].
