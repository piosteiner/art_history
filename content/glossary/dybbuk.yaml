name: Dybbuk
category: mythology and legend
definition: In Jewish folklore, the restless soul of a dead person that clings to and possesses a living one; the subject of S. An-sky's play The Dybbuk (written 1913–1916, first staged 1920).
description_md: |-
  The soul of a dead person who couldn't find peace and clings to a living person. In S. An-sky's famous play *The Dybbuk* (written 1913–1916, first staged 1920), the soul of Hanan, a poor scholar, possesses his beloved [[person/leah]] on her wedding day to another man. A rabbi drives him out, but Leah dies to join him.

  *From:* Jewish folklore · Jewish (Ashkenazi)
