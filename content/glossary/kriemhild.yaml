name: Kriemhild
names: [Gudrun]
category: mythology and legend
definition: Siegfried's widow in the Nibelungenlied, who married Etzel (Attila), king of the Huns, to avenge her husband's murder, had the Burgundian court slaughtered at his castle and killed Hagen with Siegfried's sword.
description_md: |-
  Kriemhild was [[siegfried]]'s wife and the sister of the Burgundian king Gunther. When Siegfried's body bled again in Hagen's presence, she knew who had murdered him. She spent years planning her revenge. She married Etzel (Attila), king of the Huns, and invited her brothers and their court to a feast at his castle. There she had them all slaughtered, and finally killed Hagen herself with Siegfried's own sword, before she was struck down too.

  *From:* Nibelungenlied · German / Germanic
