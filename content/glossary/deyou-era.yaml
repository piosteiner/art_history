name: Deyou
names:
  - lang: zh
    role: original
    text: 德祐
category: calendar
parent: chinese-calendar
definition: "Chinese era name (德祐) of the Southern Song for the years 1275–1276: 1275 is Deyou 1 (元年) and Deyou 2 is 1276."
description_md: |-
  **Deyou** (德祐) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1275 under Emperor Gong (恭帝). Its years are counted in lunar years: 1275 is Deyou 1 (元年), 1276 its last year, Deyou 2. A Chinese source dates a year within it as "Deyou 2" (德祐二年) rather than by a continuous count.

  Before: [[xianchun-era|Xianchun]]. After: [[jingyan-era|Jingyan]].
sources:
