name: Brünhild
names: [Brunhild, Brynhildr]
category: mythology and legend
definition: The warrior queen of Iceland in the Nibelungenlied, won by King Gunther through Siegfried's invisible help in contests of strength; her fury at the trick set off Siegfried's murder.
description_md: |-
  Brünhild was a queen of immense strength who ruled in Iceland and would only marry a man who could beat her in contests of spear-throwing, stone-throwing and leaping. King Gunther wanted her, but couldn't win, so [[siegfried]] secretly helped him, invisible under his magic cloak. When Brünhild later discovered the trick, her humiliation and fury set off the chain of events that led to Siegfried's murder.

  *From:* Nibelungenlied · German / Germanic
