name: The Snow Queen
category: mythology and legend
definition: In Andersen's fairy tale (1844), the queen of ice who carries the boy Kai off to her palace in the far north.
description_md: |-
  A troll's mirror shattered, and splinters got into [[kai]]'s eye and heart, making him cold and cruel. The Snow Queen carried him off to her ice palace in the far north. [[gerda]] searched for him through the seasons, helped by a robber girl, a reindeer and two wise women. Her warm tears melted the ice in his heart.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
