name: Fáfnir
names: [Fafnir]
category: mythology and legend
definition: The dwarf of Norse legend who killed his father for a cursed hoard of gold and turned into a dragon to guard it; Sigurd killed him from a pit, and by tasting his blood understood the language of birds.
description_md: |-
  Fáfnir was a dwarf who killed his own father to take a cursed hoard of gold. He became so consumed by greed that he turned into a dragon to guard it. He was killed by the hero [[siegfried|Sigurd]], who hid in a pit and stabbed him from below as he crawled past. When Sigurd tasted the dragon's blood, he suddenly understood the language of birds, who warned him of betrayal. Sigurd is the same hero as the German Siegfried.

  *From:* Völsunga saga; Poetic Edda · Norse
