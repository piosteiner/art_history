public_id: 131291
name: Aesacus
category: mythology and legend
definition: In Greek myth, a Trojan prince who threw himself off a cliff in grief and was turned by Tethys into a diving bird.
description_md: |-
  He threw himself off a cliff in grief after the nymph he loved died of a snakebite. The sea goddess Tethys caught him and turned him into a diving bird, which still keeps diving into the sea, trying to die.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
