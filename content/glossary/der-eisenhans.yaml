public_id: 131203
name: Der Eisenhans
names: [Iron John, Iron Hans]
category: mythology and legend
definition: In the Grimms' fairy tale, a wild man with a body brown like rusty iron and hair down to his knees, found at the bottom of a forest pool, who raises a prince and is at last revealed as a king under a curse.
description_md: |-
  A king caught him and locked him in a cage. The prince let him go, and in return Iron John raised him in the woods. His hair turned to gold in a magic spring. Later, Iron John secretly helped him win battles. In the end, he was revealed to be a king under a curse.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
