public_id: 113111
name: Zhonghe
names:
  - lang: zh
    role: original
    text: 中和
category: calendar
definition: "Chinese era name (中和) of the Tang for the years 881–885: 881 is Zhonghe 1 (元年) and Zhonghe 5 is 885."
description_md: |-
  **Zhonghe** (中和) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 881 under Emperor Xizong (僖宗). Its years are counted in lunar years: 881 is Zhonghe 1 (元年), 885 its last year, Zhonghe 5. A Chinese source dates a year within it as "Zhonghe 2" (中和二年) rather than by a continuous count.

  Before: [[guangming-era|Guangming]]. After: [[guangqi-era|Guangqi]].
sources:
  definition:
    - source: dila-time-authority
