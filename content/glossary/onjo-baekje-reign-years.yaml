public_id: 113245
name: Onjo of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 온조왕
  - lang: ko-Hani
    role: alternative
    text: 溫祚王
category: calendar
definition: "The reign years of King Onjo of Baekje (溫祚王, 온조왕), by which Korean histories date 18 BC – 28 CE: 18 BC is Onjo 1, 28 Onjo 46."
description_md: |-
  **Onjo** (溫祚王, 온조왕): the years of the reign of King Onjo of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 9 BC is Onjo 10 (온조왕 10년). The year of the accession, 18 BC, counts as the first year.

  After: [[daru-baekje-reign-years|Daru]].
sources:
  definition:
    - source: dila-time-authority
