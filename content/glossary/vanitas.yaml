name: Vanitas
names: [Memento mori, Death and the Maiden]
category: iconography
definition: A reminder in art that life is short and earthly things are empty ("vanity of vanities, all is vanity"); very popular in seventeenth-century Dutch still lifes.
description_md: |-
  A reminder that life is short and earthly things are empty ("vanity of vanities, all is vanity"). *Memento mori* means "remember that you will die". Very popular in Dutch still lifes of the 17th century.

  **In art:** A skull, a guttering candle, an hourglass, wilting flowers, soap bubbles, a watch, musical instruments, books and jewels. The Death and the Maiden theme shows a skeleton embracing a young woman.

  **Famous works**

  - [[artist/hans-holbein-the-younger]], *The Ambassadors* (National Gallery, London, with a distorted skull)
  - Pieter Claesz, *Vanitas Still Life* (various)
  - Harmen Steenwijck, *An Allegory of the Vanities of Human Life* (National Gallery, London)
  - Hans Baldung Grien, *Death and the Maiden* (1517, Kunstmuseum Basel)
  - Niklaus Manuel Deutsch, *Death as a Mercenary Embracing a Young Woman* ("Death and the Maiden", 1517, Kunstmuseum Basel)

  *From:* European
