name: Iku-Turso
category: mythology and legend
definition: A sea monster of Finnish myth that Louhi called up to attack the heroes sailing away with the Sampo; Väinämöinen grabbed him by the ears and banished him to the depths.
description_md: |-
  [[louhi]] called him up from the sea to attack the heroes as they sailed away with the Sampo. [[vainamoinen]] grabbed him by the ears and banished him back to the depths.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
