name: Alcestis
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the queen who volunteered to die in place of her husband Admetus and was brought back from death by Heracles.
description_md: |-
  A queen who volunteered to die in place of her husband Admetus. [[heracles]], a guest in the house, wrestled Death at her tomb and brought her back.

  **In art:** A veiled woman being led back from the tomb by Heracles.

  **Famous works**

  - Frederic Leighton, *Hercules Wrestling with Death for the Body of Alcestis* (Wadsworth Atheneum, Hartford)

  *From:* Greek mythology · Ancient Greek
