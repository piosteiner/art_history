name: Linde
names:
  - lang: zh
    role: original
    text: 麟德
category: calendar
parent: chinese-calendar
definition: "Chinese era name (麟德) of the Tang for the years 664–666: 664 is Linde 1 (元年) and Linde 3 is 666."
description_md: |-
  **Linde** (麟德) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 664 under Emperor Gaozong (高宗). Its years are counted in lunar years: 664 is Linde 1 (元年), 666 its last year, Linde 3. A Chinese source dates a year within it as "Linde 2" (麟德二年) rather than by a continuous count.

  Before: [[longshuo-era|Longshuo]]. After: [[qianfeng-era|Qianfeng]].
sources:
