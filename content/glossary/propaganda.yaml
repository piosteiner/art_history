public_id: 116825
name: propaganda
category: politics
definition: Communication that spreads a political idea in order to steer what people believe and do.
description_md: |-
  For [[person/hannah-arendt|Hannah Arendt]], totalitarianism thrives where fiction replaces reality — people believe not what they see but what they want to believe — and propaganda steers the masses with precision [[source/arendt-2024|pp. 346, 351–352]] [[source/steiner-2025-mario-sironi|pp. 7–8]]. In the seminar: art and culture as ideological weapon and means of struggle for power [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 7]].

  ## Propaganda and art in totalitarian states

  What distinguishes a totalitarian regime from an authoritarian one or a dictatorship is that the state controls almost every aspect of an individual's life, above all through the massive use of propaganda, which seeks to mould the minds of all citizens with a state ideology; propaganda and the mass media — and with them art — play the key role [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 2]]. Igor Golomstock describes totalitarian art not as an artistic genre but as a cultural phenomenon "arising from the use of art as a propaganda tool of the totalitarian state" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 10]]; in his model the state first declares art and culture "an ideological weapon and a means of struggle for power" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]]. To work for political purposes, the style of such art had to be easy to understand and to read [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Walter Benjamin had diagnosed the reverse movement in 1935: "The logical result of Fascism is the introduction of aesthetics into political life […] Communism responds by politicizing art" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 6]].

  ## Fascist Italy

  Italian Fascism was particularly inventive in mass festivities, organised leisure and propaganda, while painting and sculpture were left largely to their traditional standards and audiences; the regime followed two strategies, one controlling the general population through the mass media and organised leisure, the other courting the prestige and support of the cultural elite [[source/braun-2000|p. 4]]. For Emily Braun, "creative freedom" was itself a pre-eminent form of Fascist propaganda, used to present the regime as a "Third Way" between the "inhumanity" of Communism and the "decadence" of liberal individualism [[source/braun-2000|p. 4]]; the regime "exploited the propaganda value of 'creative freedom'" [[source/braun-2000|p. 17]]. Art histories long treated art and propaganda as mutually exclusive [[source/braun-2000|p. 4]]. [[artist/mario-sironi|Mario Sironi]], cartoonist of Mussolini's *Il Popolo d'Italia* for two decades, "was equally at home with crude propaganda and poetic evocation" [[source/braun-2000|pp. 8–9]].

  Fascism's "new politics" drew on the propaganda of the First World War: the cult of the fallen soldier became a core element of its secular religion [[source/antliff-2002|p. 156]]. According to Fascist propaganda, the war had confronted men with an extreme choice between heroism and cowardice, idealism and selfishness [[source/dagnino-2016|p. 135]]. At the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] in 1932 photomontage and "photomosaic" were used so that images and texts worked by "subliminal suggestion", overstimulating and distracting the senses [[source/antliff-2002|p. 154]]. Dagnino warns against dismissing the Fascist project of a [[term/new-man|New Man]] as "an empty slogan or cheap propaganda" [[source/dagnino-2016|p. 147]].

  ## Abroad and in the colonies

  The floating exhibition of the [[event/nave-italia-cruise-1924|Nave Italia]] to Latin America in 1924 had a "Commissar for Culture and National Propaganda", Eugenio Coselschi [[source/moure-cecchini-2016|p. 6]]; the careful choice of industrial goods, artworks and decorative objects turned the sample fair into political propaganda [[source/moure-cecchini-2016|pp. 20–21]]. Rome's Museo Coloniale, founded in 1923, was conceived from the start "not as a scientific institution but as a vehicle for government propaganda", staffed by officials of the Ministry of the Colonies [[source/falcucci-2021|p. 703]]; the Fascist party also used the Roman remains excavated in Libya as an instrument of propaganda [[source/falcucci-2021|p. 701]]. Maps, photographs, paintings, postcards, films and museum displays together formed a "visual colonialism" that justified subjugation [[source/falcucci-2021|p. 716]]. The audiences of imperial propaganda ranged from the elite to the "often uneducated" masses; popular enthusiasm for empire was limited to times of crisis, as in Italy in the 1930s, yet in general such propaganda was very effective [[source/falcucci-2021|pp. 716–717]].
