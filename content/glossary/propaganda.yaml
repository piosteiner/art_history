public_id: 116825
name: propaganda
category: politics
definition: Communication that spreads a political idea in order to steer what people believe and do.
description_md: "For [[person/hannah-arendt]], totalitarianism thrives where fiction replaces reality — people believe not what they see but what they want to believe — and propaganda steers the masses with precision [[source/arendt-2024|pp. 346, 351–352]] [[source/steiner-2025-mario-sironi|pp. 7–8]]. In the seminar: art and culture as ideological weapon and means of struggle for power [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 7]]."
