category: calendar
definition: "Japanese era name (建仁) for the years 1201–1203: 1201 is Kennin 1 (元年) and Kennin 3 is 1203."
description_md: |-
  **Kennin** (建仁) is a Japanese era name ([[nengo]]), proclaimed in 1201. Its years are counted in lunar years from the new year before the proclamation: 1201 is Kennin 1 (元年), 1203 its last year, Kennin 3. A Japanese source dates a year within it as "Kennin 2" (建仁2年) rather than by a continuous count.

  Before: [[shoji-era|Shōji]]. After: [[genkyu-era|Genkyū]].
