name: Ganymede
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the beautiful Trojan prince carried up to Olympus by Zeus in the form of an eagle to be cupbearer of the gods.
description_md: |-
  A beautiful Trojan prince whom [[zeus]], in the form of an eagle, carried up to Olympus to be cupbearer of the gods.

  **In art:** A boy or youth carried into the sky by an eagle.

  **Famous works**

  - [[artist/rembrandt]], *The Abduction of Ganymede* (Gemäldegalerie Alte Meister, Dresden), showing him as a crying toddler
  - Correggio, *Abduction of Ganymede* (Kunsthistorisches Museum, Vienna)
  - [[artist/michelangelo]], *The Rape of Ganymede* (drawing)

  *From:* Greek mythology; Ovid, Metamorphoses · Ancient Greek
