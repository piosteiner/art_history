definition: "Chinese era name (正統) of the Ming for the years 1436–1449: 1436 is Zhengtong 1 (元年) and Zhengtong 14 is 1449."
description_md: |-
  **Zhengtong** (正統) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1436, the first era of Emperor Yingzong, who is known by it as the Zhengtong Emperor; on his return to the throne in 1457 he proclaimed the Tianshun era. Its years are counted in lunar years: 1436 is Zhengtong 1 (元年), 1449 its last year, Zhengtong 14. A Chinese source dates a year within it as "Zhengtong 2" (正統二年) rather than by a continuous count.

  Before: [[xuande-era|Xuande]]. After: [[jingtai-era|Jingtai]].
