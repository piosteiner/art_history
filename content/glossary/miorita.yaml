name: Miorița
category: mythology and legend
definition: A Romanian ballad in which a ewe lamb warns her shepherd that two others plan to kill him, and he calmly tells her how to bury him.
description_md: |-
  The ewe lamb Miorița warned the shepherd that two other shepherds were planning to kill him. Instead of running away, he calmly told her where to bury him and to tell his mother he'd married a princess (death) at a wedding where the stars were candles.

  *From:* Miorița (Romanian ballad) · Romanian
