definition: "Japanese era name (承安) for the years 1171–1175: 1171 is Jōan 1 (元年) and Jōan 5 is 1175."
description_md: |-
  **Jōan** (承安) is a Japanese era name ([[nengo]]), proclaimed in 1171. Its years are counted in lunar years from the new year before the proclamation: 1171 is Jōan 1 (元年), 1175 its last year, Jōan 5. A Japanese source dates a year within it as "Jōan 2" (承安2年) rather than by a continuous count.

  Before: [[kao-era|Kaō]]. After: [[angen-era|Angen]].
