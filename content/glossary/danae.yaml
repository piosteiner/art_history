name: Danaë
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the princess locked in a bronze chamber (in later tellings a tower) by her father, to whom Zeus came as a shower of gold; mother of Perseus.
description_md: |-
  A princess locked in a bronze chamber (in later tellings a tower) by her father, because a prophecy said her son would kill him. Zeus came to her as a shower of gold, and she gave birth to [[perseus]].

  **In art:** A reclining woman receiving a shower of golden coins or light, often with an old servant catching the coins in her apron.

  **Famous works**

  - [[artist/titian]], *Danaë* (several versions, e.g. Museo di Capodimonte, Naples, and Prado)
  - [[artist/rembrandt]], *Danaë* (Hermitage)
  - Correggio, *Danaë* (Galleria Borghese) — [[artwork/danae-correggio]]
  - [[artist/gustav-klimt]], *Danaë*

  *From:* Greek mythology · Ancient Greek
