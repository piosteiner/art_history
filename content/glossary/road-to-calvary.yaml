name: Road to Calvary
names: [The Road to Calvary, Christ Carrying the Cross, Veil of Veronica]
category: iconography
definition: Christ carrying his cross to Golgotha, helped by Simon of Cyrene; in later legend Saint Veronica wiped his face with a cloth that kept its image.
description_md: |-
  Christ carries his cross to Golgotha, the place of execution. Simon of Cyrene is forced to help him; later tradition (the Stations of the Cross) adds that he falls three times and that [[person/saint-veronica]] wipes his face with a cloth, which miraculously keeps the image of his face.

  **In art:** Christ bent under a heavy cross in a crowd, or a woman holding up a cloth with a face on it (the *Veil of Veronica*, or *Sudarium*).

  **Famous works**

  - Pieter Bruegel the Elder, *The Procession to Calvary* (Vienna) — [[artwork/the-procession-to-calvary]]
  - [[artist/hieronymus-bosch]] (follower), *Christ Carrying the Cross* (Ghent)
  - [[artist/raphael]], *Lo Spasimo* (Prado)

  *From:* New Testament, Gospels · Christian
