name: Kairos
names: [Occasio, Opportunity]
category: iconography
definition: "Opportunity personified: a youth with winged feet and a single lock of hair on his forehead, bald at the back — to be seized as he comes."
description_md: |-
  Opportunity, the fleeting right moment. Kairos is a young man with wings on his feet and a single lock of hair on his forehead, bald at the back: you must seize him as he comes, because once he has passed, there's nothing to grab. Occasio is the female Roman version, often balanced on a wheel or ball.

  **Famous works**

  - *Kairos* (relief, copy after Lysippos, Turin)
  - [[artist/andrea-mantegna]] (attributed), *Occasio and Poenitentia* (Palazzo Ducale, Mantua)

  *From:* Ancient Greek and Roman
