category: calendar
definition: "Japanese era name (文和) for the years 1352–1355: 1352 is Bunna 1 (元年) and Bunna 4 is 1355."
description_md: |-
  **Bunna** (文和) is a Japanese era name ([[nengo]]), proclaimed in 1352. Its years are counted in lunar years from the new year before the proclamation: 1352 is Bunna 1 (元年), 1355 its last year, Bunna 4. A Japanese source dates a year within it as "Bunna 2" (文和2年) rather than by a continuous count.

  Before: Kannō. After: Enbun.
