public_id: 113297
name: Anwon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 안원왕
  - lang: ko-Hani
    role: alternative
    text: 安原王
category: calendar
parent: korean-calendar
definition: "The reign years of King Anwon of Goguryeo (安原王, 안원왕), by which Korean histories date 531–545: 531 is Anwon 1, 545 Anwon 15."
description_md: |-
  **Anwon** (安原王, 안원왕): the years of the reign of King Anwon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 540 is Anwon 10 (안원왕 10년). The year of the accession, 531, counts as the first year.

  Before: [[anjang-goguryeo-reign-years|Anjang]]. After: [[yangwon-goguryeo-reign-years|Yangwon]].
sources:
  definition:
    - source: dila-time-authority
