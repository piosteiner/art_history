name: Semele
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the Theban princess and lover of Zeus who burned to ashes when he showed himself in his true form; mother of Dionysus.
description_md: |-
  A Theban princess and lover of [[zeus]], mother of [[dionysus]]. The jealous [[hera]], in disguise, persuaded her to ask Zeus to show himself in his true divine form. He did, and she burned to ashes. Zeus saved the unborn Dionysus and sewed him into his own thigh until he was born.

  **In art:** A woman collapsing before a blazing, enthroned god.

  **Famous works**

  - Gustave Moreau, *Jupiter and Semele* (Musée Gustave Moreau, Paris)
  - Rubens, *The Death of Semele* (Royal Museums of Fine Arts of Belgium, Brussels)

  *From:* Ovid, Metamorphoses · Ancient Greek
