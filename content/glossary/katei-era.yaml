category: calendar
definition: "Japanese era name (嘉禎) for the years 1235–1238: 1235 is Katei 1 (元年) and Katei 4 is 1238."
description_md: |-
  **Katei** (嘉禎) is a Japanese era name ([[nengo]]), proclaimed in 1235. Its years are counted in lunar years from the new year before the proclamation: 1235 is Katei 1 (元年), 1238 its last year, Katei 4. A Japanese source dates a year within it as "Katei 2" (嘉禎2年) rather than by a continuous count.

  Before: [[bunryaku-era|Bunryaku]]. After: [[ryakunin-era|Ryakunin]].
