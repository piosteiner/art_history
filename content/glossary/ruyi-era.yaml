public_id: 113069
name: Ruyi
names:
  - lang: zh
    role: original
    text: 如意
category: calendar
definition: "Chinese era name (如意) of the Zhou of Empress Wu for the year 692: 692 is Ruyi 1 (元年), its only year."
description_md: |-
  **Ruyi** (如意) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 692 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 692 is Ruyi 1 (元年), its only year.

  Before: [[tianshou-era|Tianshou]]. After: [[changshou-era|Changshou]].
sources:
  definition:
    - source: dila-time-authority
