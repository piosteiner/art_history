definition: sculpture of Christ on a donkey used during processions on Palm Sunday especially in south German roman-catholic tradition
description_md: |-
  The Palmesel is a wooden figure of Christ riding a donkey, used in the Palm Sunday procession of the Roman Catholic Church.[[source/wikipedia-de-palmesel]] The procession with green branches and hymns recalls Christ's entry into Jerusalem on a donkey and is attested from the 7th century; from the 10th century village priests rode a donkey in it, and since the animal was often stubborn it was usually replaced by a wooden donkey with a figure of Christ.[[source/wikipedia-de-palmesel|§ Geschichte und Gestaltung]] During the Enlightenment the custom was pushed back and often forbidden – Archbishop Hieronymus von Colloredo of Salzburg banned such "theatrical representations" in 1779 and 1782 – and many Palmesel were destroyed; in 1897 only fifty were said to survive in the whole of Bavaria.[[source/wikipedia-de-palmesel|§ Geschichte und Gestaltung]] Old examples are still carried in Thaur and Hall in Tyrol.[[source/wikipedia-de-palmesel|§ Beispiele]]

  An example of the mid-11th century, carved from spruce and fir, is the [[artwork/palmesel-landesmuseum-zurich|Palmesel in the Swiss National Museum]] in Zurich.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 113]] The lecture set it beside the relief of the entry into Jerusalem on the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne and beside present-day processions in Seville, Ammerschwihr and Thaur.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 112]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 115]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 116]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 117]]
