definition: In Greek and Roman myth the Trojan priest who warned against the wooden horse and was strangled with his sons by two sea serpents.
description_md: |-
  A Trojan priest who warned his people not to trust the wooden horse ("I fear the Greeks, even bearing gifts"). Two great sea serpents came out of the sea and strangled him and his sons.

  **In art:** A man and two boys writhing in the coils of giant snakes.

  **Famous works**

  - *Laocoön and His Sons* (Vatican Museums), rediscovered in Rome in 1506 and hugely influential on [[artist/michelangelo]]
  - [[artist/el-greco]], *Laocoön* (National Gallery of Art, Washington)

  *From:* Virgil, Aeneid · Ancient Greek
