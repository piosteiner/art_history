public_id: 113374
name: Wonseong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 원성왕
  - lang: ko-Hani
    role: alternative
    text: 元聖王
category: calendar
definition: "The reign years of King Wonseong of Silla (元聖王, 원성왕), by which Korean histories date 785–798: 785 is Wonseong 1, 798 Wonseong 14."
description_md: |-
  **Wonseong** (元聖王, 원성왕): the years of the reign of King Wonseong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 794 is Wonseong 10 (원성왕 10년). The year of the accession, 785, counts as the first year.

  Before: [[seondeok-silla-reign-years-780|Seondeok]]. After: [[soseong-silla-reign-years|Soseong]].
sources:
  definition:
    - source: dila-time-authority
