name: Jiangshi
names: [hopping vampire]
category: mythology and legend
definition: A reanimated corpse of Chinese folklore in Qing official robes that hops with arms outstretched and drains the life energy of the living; stopped by a paper talisman on its forehead.
description_md: |-
  The jiangshi is a reanimated corpse from Chinese folklore, dressed in the official robes of the Qing dynasty. Because its body is stiff with death, it moves by hopping with its arms stretched out in front. It drains the life energy of the living. It can be stopped by sticking a paper talisman on its forehead, and is said to be afraid of mirrors, sticky rice and peach-wood swords.

  *From:* folklore · Chinese
