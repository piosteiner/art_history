public_id: 132422
name: Portraits of monks and patriarchs
category: iconography
definition: Realistic portrait sculptures and paintings of famous monks, especially in Japan.
description_md: |-
  Realistic portrait sculptures and paintings of famous monks, especially in Japan.

  **Famous works**

  - *Ganjin* (dry-lacquer portrait of the blind Chinese monk, Tōshōdai-ji, Nara)
  - [[kosho-era]], *Kūya Shōnin* (statue with six small Amida Buddhas coming out of his mouth, one for each syllable of his prayer, early 13th century, Rokuharamitsu-ji, Kyoto)
  - [[artist/unkei]], *Muchaku and Seshin* (1212, Hokuendō, Kōfuku-ji, Nara; imagined portraits of the Indian monks Asanga and Vasubandhu)

  *From:* Japanese Buddhist
