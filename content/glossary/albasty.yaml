public_id: 130891
name: Albasty
category: mythology and legend
definition: In Kazakh, Kyrgyz and other steppe folklore, a much-feared female demon with long hair who preys on newborns and mothers in childbirth.
description_md: |-
  The albasty is a much-feared female demon in Kazakh, Kyrgyz and other steppe folklore. She appears as a long-haired woman, or sometimes as an animal, and preys on newborns and mothers during childbirth. Communities used charms and ritual specialists to keep her away.

  *From:* steppe folklore · Kazakh, Kyrgyz and other steppe peoples
