public_id: 132173
name: Last Judgement
names: [The Last Judgement, Last Judgment]
category: iconography
definition: Christ's return at the end of time to judge the living and the dead.
description_md: |-
  At the end of time, Christ returns to judge the living and the dead. The saved rise to heaven and the damned are cast into hell.

  **In art:** Christ enthroned in the centre, the archangel [[person/michael]] weighing souls on scales, the dead rising from their graves, and devils dragging sinners into hell.

  **Famous works**

  - [[artist/michelangelo]], *The Last Judgement* (Sistine Chapel altar wall)
  - [[artist/giotto]], *Last Judgement* (Scrovegni Chapel)
  - [[artist/hans-memling]], *The Last Judgement* (Gdańsk)
  - [[artist/rogier-van-der-weyden]], *Beaune Altarpiece* (Beaune)
  - [[artist/hieronymus-bosch]], *The Last Judgement* (Vienna) — [[artwork/the-last-judgment]]

  *From:* New Testament · Christian
