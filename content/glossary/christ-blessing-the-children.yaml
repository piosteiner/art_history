name: Christ Blessing the Children
names: [Suffer the little children]
category: iconography
definition: 'Jesus laying his hands on children: "Let the little children come to me"; especially popular in Protestant Germany.'
description_md: |-
  When the disciples tried to send children away, Jesus said, "Let the little children come to me."

  **In art:** Christ surrounded by mothers and children, laying his hands on them. Especially popular in Protestant Germany.

  **Famous works**

  - [[artist/lucas-cranach-the-elder]], *Christ Blessing the Children* (several versions, Hamburg and elsewhere)

  *From:* New Testament, Gospels · Christian
