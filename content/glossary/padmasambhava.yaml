definition: The eighth-century teacher said to have brought Buddhism to Tibet by subduing its local demons.
description_md: |-
  Padmasambhava (Guru Rinpoche), the 8th-century teacher said to have brought Buddhism to Tibet by subduing its local demons.

  **In art:** A moustached teacher in a lotus hat holding a skull cup and a staff.

  **Famous works**

  - *Tibetan thangka collections* (Rubin Museum of Art, New York)
  - *Lukhang temple murals* (behind the Potala Palace, Lhasa)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Tibetan Buddhist
