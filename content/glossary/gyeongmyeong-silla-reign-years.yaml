public_id: 113390
name: Gyeongmyeong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 경명왕
  - lang: ko-Hani
    role: alternative
    text: 景明王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gyeongmyeong of Silla (景明王, 경명왕), by which Korean histories date 917–924: 917 is Gyeongmyeong 1, 924 Gyeongmyeong 8."
description_md: |-
  **Gyeongmyeong** (景明王, 경명왕): the years of the reign of King Gyeongmyeong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 924 is Gyeongmyeong 8 (경명왕 8년). The year of the accession, 917, counts as the first year.

  Before: [[sindeok-silla-reign-years|Sindeok]]. After: [[gyeongae-silla-reign-years|Gyeongae]].
sources:
  definition:
    - source: dila-time-authority
