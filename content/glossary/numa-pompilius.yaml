name: Numa Pompilius
category: mythology and legend
also_in: [iconography]
definition: The legendary second king of Rome, a peaceful lawgiver advised at night by the nymph Egeria.
description_md: |-
  The second king of Rome, a peaceful lawgiver who founded many Roman religious rites. He was said to receive advice from the nymph [[egeria]], who met him at night in a sacred grove.

  **In art:** A king with a nymph in a moonlit grove by a spring.

  **Famous works**

  - [[artist/claude-lorrain]], *Landscape with Egeria Mourning over Numa* (Naples)

  *From:* Livy, History of Rome · Ancient Roman
