category: calendar
definition: "Japanese era name (元仁) for the years 1224–1225: 1224 is Gennin 1 (元年) and Gennin 2 is 1225."
description_md: |-
  **Gennin** (元仁) is a Japanese era name ([[nengo]]), proclaimed in 1224. Its years are counted in lunar years from the new year before the proclamation: 1224 is Gennin 1 (元年), 1225 its last year, Gennin 2. A Japanese source dates a year within it as "Gennin 2" (元仁2年) rather than by a continuous count.

  Before: [[joo-era-1222|Jōō]]. After: [[karoku-era|Karoku]].
