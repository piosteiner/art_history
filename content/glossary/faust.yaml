name: Faust
names: [Mephistopheles, Gretchen]
category: mythology and legend
also_in: [iconography]
definition: The scholar of German legend, based on a real sixteenth-century alchemist, who sold his soul to the Devil, Mephistopheles; made famous by Goethe's Faust.
description_md: |-
  A scholar who sold his soul to the Devil, Mephistopheles, in exchange for knowledge and pleasure. He seduced the innocent Gretchen (Margarete), with tragic results. Based on a real 16th-century German alchemist, he became famous through Goethe's *Faust* (1808 and 1832).

  **In art:** An old scholar in a study, a red-clad devil with a feathered cap, or a young girl at a spinning wheel or in prison.

  **Famous works**

  - [[artist/rembrandt]], *A Scholar in his Study ('Faust')* (etching, c. 1652)
  - [[artist/eugene-delacroix]], *Faust* (17 lithographs for Stapfer's French translation, Paris: Motte, 1828)
  - Ary Scheffer, *Margaret at the Spinning Wheel* (*Marguerite au rouet*, c. 1831; Musée des Beaux-Arts, Caen)

  *From:* Johann Wolfgang von Goethe, Faust · German
