definition: The legendary founder of Daoism and author of the Daodejing, shown as a white-bearded sage riding a water buffalo.
description_md: |-
  The legendary founder of [[daoism]] and author of the *Daodejing* (6th century BC, according to tradition). According to legend, as he left China forever through the western pass, the gatekeeper Yinxi asked him to write down his wisdom.

  **In art:** An old sage with a long beard riding a water buffalo or ox.

  **Famous works**

  - Zhang Lu, *Laozi Riding an Ox* (Ming dynasty, hanging scroll, National Palace Museum, Taipei)

  **Held sacred today:** Some of these figures are still honoured in Daoist and folk religion.

  *From:* Daodejing · Chinese (Daoist)
