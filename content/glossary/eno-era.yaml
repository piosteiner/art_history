    text: 延応
category: calendar
definition: "Japanese era name (延応) for the years 1239–1240: 1239 is En'ō 1 (元年) and En'ō 2 is 1240."
description_md: |-
  **En'ō** (延応) is a Japanese era name ([[nengo]]), proclaimed in 1239. Its years are counted in lunar years from the new year before the proclamation: 1239 is En'ō 1 (元年), 1240 its last year, En'ō 2. A Japanese source dates a year within it as "En'ō 2" (延応2年) rather than by a continuous count.

  Before: Ryakunin. After: Ninji.
