definition: "Japanese era name (寛和) for the years 985–986: 985 is Kanna 1 (元年) and Kanna 2 is 986."
description_md: |-
  **Kanna** (寛和) is a Japanese era name ([[nengo]]), proclaimed in 985. Its years are counted in lunar years from the new year before the proclamation: 985 is Kanna 1 (元年), 986 its last year, Kanna 2. A Japanese source dates a year within it as "Kanna 2" (寛和2年) rather than by a continuous count.

  Before: [[eikan-era|Eikan]]. After: [[eien-era|Eien]].
