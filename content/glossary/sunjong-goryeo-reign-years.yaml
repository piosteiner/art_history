public_id: 113314
name: Sunjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 순종
  - lang: ko-Hani
    role: alternative
    text: 順宗
category: calendar
definition: "The reign years of King Sunjong of Goryeo (順宗, 순종), by which Korean histories date 1083: 1083 is Sunjong 1, 1083 Sunjong 1."
description_md: |-
  **Sunjong** (順宗, 순종): the years of the reign of King Sunjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1083 is Sunjong 1 (순종 1년). The year of the accession, 1083, counts as the first year.

  Before: [[munjong-goryeo-reign-years|Munjong]]. After: [[seonjong-goryeo-reign-years|Seonjong]].
sources:
  definition:
    - source: dila-time-authority
