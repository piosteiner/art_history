public_id: 131581
name: Black Shuck
category: mythology and legend
definition: A huge black ghost dog with fiery eyes of East Anglian folklore, said to have burst into the church at Bungay in 1577.
description_md: |-
  It roams the coast and countryside of East Anglia. In 1577, during a storm, it was said to have burst into the church at Bungay, killing two people, and then appeared at Blythburgh, where scorch marks on the church door are still called "the Devil's fingerprints".

  *From:* folklore · English (East Anglia)
