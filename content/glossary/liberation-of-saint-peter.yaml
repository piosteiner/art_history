public_id: 132189
name: Liberation of Saint Peter
names: [Deliverance of Saint Peter, Peter Freed from Prison]
category: iconography
definition: The angel freeing Peter from prison; with episodes of Paul's journeys, such as his sermon in Athens and the viper on Malta.
description_md: |-
  An angel woke Peter in prison, his chains fell off, and he walked out past the guards. Paul preached to the philosophers of Athens on the Areopagus, was shipwrecked on Malta, and was bitten by a viper without harm.

  **In art:** A glowing angel leading a man out of a dark prison, or a man preaching with raised arms before a crowd.

  **Famous works**

  - [[artist/raphael]], *The Deliverance of Saint Peter* (Stanza di Eliodoro, Vatican)
  - Raphael, *Saint Paul Preaching in Athens* (tapestry cartoon, Royal Collection, on loan to the V&A, London)

  *From:* New Testament, Acts of the Apostles · Christian
