    text: "{不動明王|ふどうみょうおう}"
category: iconography
parent: myoo
definition: "Fudō Myōō, the Immovable One, the most important of the Myōō and the wrathful aspect of Dainichi: a sword in his right hand, a lasso in his left, seated or standing on a rock, framed by flames."
description_md: |-
  The most important of the Wisdom Kings is Acala (Japanese: Fudō Myō-ō, the "Immovable").

  **In art:** A fierce, blue or dark figure with bulging eyes and fangs, holding a sword and a rope (to bind evil), surrounded by flames, sitting on a rock.

  **Famous works**

  - *Fudō Myō-ō* (Tō-ji, Kyoto)
  - *Red Fudō* (Myōō-in, Mount Kōya)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist (Esoteric)
