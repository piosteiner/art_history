name: The Three Friends of Winter
names: [Suihan Sanyou, shōchikubai]
category: iconography
definition: "The pine, bamboo and plum, which stay green or flower in winter: perseverance, loyalty in adversity and friendship."
description_md: |-
  The pine, bamboo and plum, which all stay green or flower in winter. They symbolise perseverance and loyalty in adversity, and friendship.

  **Famous works**

  - Zhao Mengjian, *Three Friends of the Cold Season* (National Palace Museum, Taipei)

  *From:* Chinese
