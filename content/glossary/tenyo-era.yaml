definition: "Japanese era name (天養) for the years 1144–1145: 1144 is Ten'yō 1 (元年) and Ten'yō 2 is 1145."
description_md: |-
  **Ten'yō** (天養) is a Japanese era name ([[nengo]]), proclaimed in 1144. Its years are counted in lunar years from the new year before the proclamation: 1144 is Ten'yō 1 (元年), 1145 its last year, Ten'yō 2. A Japanese source dates a year within it as "Ten'yō 2" (天養2年) rather than by a continuous count.

  Before: [[koji-era-1142|Kōji]]. After: [[kyuan-era|Kyūan]].
