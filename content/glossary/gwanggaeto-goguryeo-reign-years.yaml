public_id: 113293
name: Gwanggaeto of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 광개토왕
  - lang: ko-Hani
    role: alternative
    text: 廣開土王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gwanggaeto of Goguryeo (廣開土王, 광개토왕), by which Korean histories date 391–412: 391 is Gwanggaeto 1, 412 Gwanggaeto 22."
description_md: |-
  **Gwanggaeto** (廣開土王, 광개토왕): the years of the reign of King Gwanggaeto of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 400 is Gwanggaeto 10 (광개토왕 10년). The year of the accession, 391, counts as the first year.

  Before: [[gogugyang-goguryeo-reign-years|Gogugyang]]. After: [[jangsu-goguryeo-reign-years|Jangsu]].
sources:
  definition:
    - source: dila-time-authority
