category: iconography
definition: artistic theme, depiction of the ancestors of Christ
description_md: |-
  The Tree of Jesse represents the genealogy of Christ: medieval theologians traced his lineage from David through the kings of Judah to the Virgin in this image.[[source/forsyth-1972-the-throne-of-wisdom|p. 23]] Early examples include the window of the [[artwork/wurzel-jesse-fenster-saint-denis|abbey church of Saint-Denis]] (about 1145) and that of the west façade of [[artwork/wurzel-jesse-fenster-chartres|Chartres Cathedral]] (about 1150).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 97]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 104]] In books the tree grew out of the L-initial of the Gospel of Matthew (*Liber generationis*), as in the Bible des Capucins of 1175–1200.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 103]]

  ## Form

  In its typical form Jesse, often larger than the other figures, lies asleep at the bottom; from his side or navel grows a trunk or vine that branches to either side, with ancestors of Christ — usually David and Solomon, often crowned — among scrolling foliage, and Mary and Christ at the top.[[source/wikipedia-en-tree-of-jesse|§ Modes of depiction]] The earliest example is an 11th-century illuminated manuscript; the theme appears in psalters, stained glass, portal sculpture, wall paintings, embroidery and ivories, and was always far more common in northern Europe than in Italy.[[source/wikipedia-en-tree-of-jesse|introduction; § Modes of depiction]] The window placed by Abbot Suger in Saint-Denis about 1140 is the oldest known complex version and, with the [[artwork/wurzel-jesse-fenster-chartres|Jesse window at Chartres]], became the model for many later windows.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]]

  ## Wood

  The lecture "Aus dem Wald" traced the theme from the Bible of Saint-Bénigne (about 1125/35) and the Lambeth Bible (about 1150) to Chartres and to the oak predella of [[artwork/douwerman-sieben-schmerzen-altar-predella|Henrick Douwerman's Seven Sorrows altarpiece at Kalkar]] (1518–1521), where the tree of the genealogy is itself carved from wood.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 49]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 52]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 53]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 54]] Other carved Jesse trees include the larger than life-sized recumbent Jesse at St Mary's, Abergavenny, cut from a single piece of oak — the survivor of a 15th-century "roote of Jesse" destroyed in the Reformation.[[source/wikipedia-en-tree-of-jesse|§ Wood carving]]
