public_id: 112989
name: Jianlong
names:
  - lang: zh
    role: original
    text: 建隆
category: calendar
definition: "Chinese era name (建隆) of the Northern Song for the years 960–963: 960 is Jianlong 1 (元年) and Jianlong 4 is 963."
description_md: |-
  **Jianlong** (建隆) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 960 under Emperor Taizu (太祖). Its years are counted in lunar years: 960 is Jianlong 1 (元年), 963 its last year, Jianlong 4. A Chinese source dates a year within it as "Jianlong 2" (建隆二年) rather than by a continuous count.

  After: [[qiande-era|Qiande]].
sources:
  definition:
    - source: dila-time-authority
