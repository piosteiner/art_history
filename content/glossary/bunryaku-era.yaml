definition: "Japanese era name (文暦) for the years 1234–1235: 1234 is Bunryaku 1 (元年) and Bunryaku 2 is 1235."
description_md: |-
  **Bunryaku** (文暦) is a Japanese era name ([[nengo]]), proclaimed in 1234. Its years are counted in lunar years from the new year before the proclamation: 1234 is Bunryaku 1 (元年), 1235 its last year, Bunryaku 2. A Japanese source dates a year within it as "Bunryaku 2" (文暦2年) rather than by a continuous count.

  Before: [[tenpuku-era|Tenpuku]]. After: [[katei-era|Katei]].
