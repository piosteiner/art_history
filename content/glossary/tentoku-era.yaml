definition: "Japanese era name (天徳) for the years 957–960: 957 is Tentoku 1 (元年) and Tentoku 4 is 960."
description_md: |-
  **Tentoku** (天徳) is a Japanese era name ([[nengo]]), proclaimed in 957. Its years are counted in lunar years from the new year before the proclamation: 957 is Tentoku 1 (元年), 960 its last year, Tentoku 4. A Japanese source dates a year within it as "Tentoku 2" (天徳2年) rather than by a continuous count.

  Before: [[tenryaku-era|Tenryaku]]. After: [[owa-era|Ōwa]].
