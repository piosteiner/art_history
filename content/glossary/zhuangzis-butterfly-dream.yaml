name: Zhuangzi's butterfly dream
names: [Zhuangzi]
category: mythology and legend
also_in: [iconography]
definition: The Daoist philosopher Zhuangzi's dream of being a butterfly, after which he did not know whether he was a man dreaming or a butterfly dreaming.
description_md: |-
  The Daoist philosopher Zhuangzi dreamed he was a butterfly, and when he woke, he didn't know whether he was a man who had dreamed of being a butterfly, or a butterfly now dreaming it was a man.

  **In art:** A sage asleep, with a butterfly fluttering nearby.

  *From:* Zhuangzi · Chinese (Daoist)
