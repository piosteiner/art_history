definition: "Japanese era name (大同) for the years 806–810: 806 is Daidō 1 (元年) and Daidō 5 is 810."
description_md: |-
  **Daidō** (大同) is a Japanese era name ([[nengo]]), proclaimed in 806. Its years are counted in lunar years from the new year before the proclamation: 806 is Daidō 1 (元年), 810 its last year, Daidō 5. A Japanese source dates a year within it as "Daidō 2" (大同2年) rather than by a continuous count.

  Before: [[enryaku-era|Enryaku]]. After: [[konin-era|Kōnin]].
