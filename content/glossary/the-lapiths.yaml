definition: In Greek myth the people of Thessaly ruled by Pirithous, who fought the centaurs at his wedding.
description_md: |-
  King of the Lapiths and [[theseus]]'s best friend. His wedding to Hippodamia (a different one) ended in the battle with the centaurs. He and Theseus later tried to kidnap [[persephone]] from the Underworld and were trapped there in chairs of forgetfulness.

  **In art:** Men fighting centaurs.

  **Famous works**

  - Piero di Cosimo, *The Fight between the Lapiths and the Centaurs* (National Gallery, London)

  *From:* Greek mythology · Ancient Greek
