name: Jiushi
names:
  - lang: zh
    role: original
    text: 久視
category: calendar
parent: chinese-calendar
definition: "Chinese era name (久視) of the Zhou of Empress Wu for the years 700–701: 700 is Jiushi 1 (元年) and Jiushi 2 is 701."
description_md: |-
  **Jiushi** (久視) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 700 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 700 is Jiushi 1 (元年), 701 its last year, Jiushi 2. A Chinese source dates a year within it as "Jiushi 2" (久視二年) rather than by a continuous count.

  Before: [[shengli-era|Shengli]]. After: [[dazu-era|Dazu]].
sources:
  definition:
