definition: "Japanese era name (康暦) for the years 1379–1381: 1379 is Kōryaku 1 (元年) and Kōryaku 3 is 1381."
description_md: |-
  **Kōryaku** (康暦) is a Japanese era name ([[nengo]]), proclaimed in 1379. Its years are counted in lunar years from the new year before the proclamation: 1379 is Kōryaku 1 (元年), 1381 its last year, Kōryaku 3. A Japanese source dates a year within it as "Kōryaku 2" (康暦2年) rather than by a continuous count.

  Before: [[eiwa-era|Eiwa]]. After: [[eitoku-era|Eitoku]].
