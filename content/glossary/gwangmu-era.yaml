definition: "Korean era name (光武, 광무) of the Korean Empire for the years 1897–1907: 1897 is Gwangmu 1."
description_md: |-
  **Gwangmu** (光武, 광무) is an era name of Korea's own, proclaimed in 1897: with the solar calendar (1896) Korea stopped dating by the Chinese emperors' eras and the king's reign years ([[korean-reign-years]]). It is the era of [[person/gojong-of-korea|Gojong of the Korean Empire]], who proclaimed the Korean Empire in 1897 and is called the Gwangmu Emperor.

  Before: [[geonyang-era|Geonyang]]. After: [[yunghui-era|Yunghui]].
