name: Rakshasa
names: [rakshasi]
category: mythology and legend
definition: In Indian myth, a race of usually malevolent shape-shifting beings who disrupt sacred rituals and sometimes eat humans, though some in the epics are honourable; the female is a rakshasi.
description_md: |-
  Rakshasas are a race of usually malevolent beings with supernatural powers. They are known to shape-shift, disrupt sacred rituals and sometimes eat humans. Not all of them are evil, though: some rakshasas in the epics are honourable warriors or even protectors. The female form is called a rakshasi.

  *From:* Ramayana; Mahabharata; Indian folklore · Indian
