definition: "Japanese era name (正中) for the years 1324–1326: 1324 is Shōchū 1 (元年) and Shōchū 3 is 1326."
description_md: |-
  **Shōchū** (正中) is a Japanese era name ([[nengo]]), proclaimed in 1324. Its years are counted in lunar years from the new year before the proclamation: 1324 is Shōchū 1 (元年), 1326 its last year, Shōchū 3. A Japanese source dates a year within it as "Shōchū 2" (正中2年) rather than by a continuous count.

  Before: [[genko-era|Genkō]]. After: [[karyaku-era|Karyaku]].
