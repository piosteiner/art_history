name: Abu Hasan
names: [The Sleeper Awakened]
category: mythology and legend
definition: In the Nights, a man of Baghdad whom Harun al-Rashid, as a prank, made caliph for a day.
description_md: |-
  As a prank, [[person/harun-al-rashid]] drugged Abu Hasan and let him wake up in the palace, where everyone treated him as the caliph. The next day, he was put back home and thought he was going mad. The same idea is used in Shakespeare's *The Taming of the Shrew*.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
