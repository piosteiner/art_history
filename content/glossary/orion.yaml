name: Orion
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the giant hunter, blinded and healed by the rising sun, who was placed among the stars as the constellation Orion.
description_md: |-
  A giant hunter who was blinded and then had his sight restored by the rays of the rising sun. He was killed by a scorpion or by [[artemis]], and placed among the stars as the constellation Orion, with the Scorpion on the opposite side of the sky.

  **In art:** A giant striding towards the sunrise with a small figure on his shoulders guiding him.

  **Famous works**

  - [[artist/nicolas-poussin]], *Landscape with Blind Orion Searching for the Rising Sun* (Metropolitan Museum)

  *From:* Greek mythology · Ancient Greek
