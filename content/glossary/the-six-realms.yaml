name: The Six Realms
names: [Wheel of Life, Bhavachakra]
category: iconography
definition: The six realms of rebirth in Buddhist thought — gods, demigods, humans, animals, hungry ghosts and hell beings — shown as the Wheel of Life.
description_md: |-
  In Buddhist thought, beings are reborn in six realms: gods, demigods, humans, animals, hungry ghosts and hell beings.

  **In art:** The Wheel of Life held in the jaws of a fearsome figure of impermanence, often identified as [[yama]], lord of death, or as Mara.

  **Famous works**

  - *Bhavachakra (Wheel of Life) murals* (Tibetan monastery entrances)

  *From:* Buddhist
