name: Cú Chulainn
names: [Sétanta, Cuchulain]
category: mythology and legend
definition: The great hero of the Irish Ulster Cycle, named "Culann's Hound" after killing a smith's guard dog as a boy, who defended Ulster alone against Queen Medb's army and died tied to a standing stone.
description_md: |-
  As a boy called Sétanta, he killed the fierce guard dog of the smith Culann, then offered to take its place, so he was named "Culann's Hound". In battle, he went into a terrifying "warp spasm" that twisted his body. He defended Ulster alone against Queen [[medb]]'s army, and when he was dying, he tied himself to a standing stone so he could die on his feet.

  *From:* Ulster Cycle · Irish
