definition: "Japanese era name (慶雲) for the years 704–707: 704 is Keiun 1 (元年) and Keiun 4 is 707."
description_md: |-
  **Keiun** (慶雲) is a Japanese era name ([[nengo]]), proclaimed in 704. Its years are counted in lunar years from the new year before the proclamation: 704 is Keiun 1 (元年), 707 its last year, Keiun 4. A Japanese source dates a year within it as "Keiun 2" (慶雲2年) rather than by a continuous count.

  Before: [[taiho-era|Taihō]]. After: [[wado-era|Wadō]].
