definition: "Japanese era name (永正) for the years 1504–1521: 1504 is Eishō 1 (元年) and Eishō 18 is 1521."
description_md: |-
  **Eishō** (永正) is a Japanese era name ([[nengo]]), proclaimed in 1504. Its years are counted in lunar years from the new year before the proclamation: 1504 is Eishō 1 (元年), 1521 its last year, Eishō 18. A Japanese source dates a year within it as "Eishō 2" (永正2年) rather than by a continuous count.

  Before: [[bunki-era|Bunki]]. After: [[daiei-era|Daiei]].
