name: Njal
names: [Njáll Þorgeirsson]
category: mythology and legend
definition: Njáll Þorgeirsson, the wise lawyer and seer of Njáls saga, who spent his life trying to settle a blood feud by law and died burned in his house with his wife Bergthóra, who refused to leave him.
description_md: |-
  Njal is the central figure of *Njal's Saga*, one of the greatest Icelandic sagas. He was a wise and peaceful man, an expert in the law, who could even see the future. He spent his life trying to settle a growing chain of revenge killings through law and compromise. In the end, his enemies surrounded his house and set it on fire. They offered to let his wife, Bergthóra, leave, but she refused to leave him, and they died together.

  *From:* Njáls saga · Icelandic
