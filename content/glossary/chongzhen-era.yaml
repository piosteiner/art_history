name: Chongzhen
names:
  - lang: zh
    role: original
    text: 崇禎
category: calendar
definition: "Chinese era name (崇禎) of the Ming for the years 1628–1644: 1628 is Chongzhen 1 (元年) and Chongzhen 17 is 1644."
description_md: |-
  **Chongzhen** (崇禎) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1628. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Chongzhen Emperor. Its years are counted in lunar years: 1628 is Chongzhen 1 (元年), 1644 its last year, Chongzhen 17. A Chinese source dates a year within it as "Chongzhen 2" (崇禎二年) rather than by a continuous count.

  Before: [[tianqi-era|Tianqi]].
