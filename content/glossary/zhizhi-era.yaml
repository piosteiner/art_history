public_id: 113128
name: Zhizhi
names:
  - lang: zh
    role: original
    text: 至治
category: calendar
definition: "Chinese era name (至治) of the Yuan for the years 1321–1323: 1321 is Zhizhi 1 (元年) and Zhizhi 3 is 1323."
description_md: |-
  **Zhizhi** (至治) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1321 under Shidebala (英宗). Its years are counted in lunar years: 1321 is Zhizhi 1 (元年), 1323 its last year, Zhizhi 3. A Chinese source dates a year within it as "Zhizhi 2" (至治二年) rather than by a continuous count.

  Before: [[yanyou-era|Yanyou]]. After: [[taiding-era|Taiding]].
sources:
  definition:
    - source: dila-time-authority
