public_id: 131323
name: Sinbad the Sailor
category: mythology and legend
definition: In the One Thousand and One Nights, a merchant of Baghdad who went on seven fantastic voyages.
description_md: |-
  He landed on a whale he thought was an island, was carried off by a giant [[roc]] bird, escaped from a giant cannibal, was buried alive with his dead wife, and was ridden like a donkey by the Old Man of the Sea.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
