public_id: 113283
name: Gogukcheon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 고국천왕
  - lang: ko-Hani
    role: alternative
    text: 故國川王
category: calendar
definition: "The reign years of King Gogukcheon of Goguryeo (故國川王, 고국천왕), by which Korean histories date 179–197: 179 is Gogukcheon 1, 197 Gogukcheon 19."
description_md: |-
  **Gogukcheon** (故國川王, 고국천왕): the years of the reign of King Gogukcheon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 188 is Gogukcheon 10 (고국천왕 10년). The year of the accession, 179, counts as the first year.

  Before: [[sindae-goguryeo-reign-years|Sindae]]. After: [[sansang-goguryeo-reign-years|Sansang]].
sources:
  definition:
    - source: dila-time-authority
