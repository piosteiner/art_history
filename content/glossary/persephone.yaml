definition: In Greek myth the daughter of Demeter, abducted by Hades to be queen of the Underworld, who returns each spring; the Romans called her Proserpina.
description_md: |-
  Daughter of Demeter, abducted by [[hades]] to be queen of the Underworld. She returns to earth each spring, bringing the seasons.

  **In art:** A young woman holding a pomegranate (she ate its seeds in the Underworld and so had to return), or being carried off by Hades.

  **Famous works**

  - Bernini, *The Rape of Proserpina* (Galleria Borghese, Rome) — [[artwork/the-rape-of-proserpina]]
  - [[artist/dante-gabriel-rossetti]], *Proserpine*
  - Frederic Leighton, *The Return of Persephone*

  *From:* Greek mythology · Ancient Greek
