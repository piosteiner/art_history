definition: "Japanese era name (文保) for the years 1317–1319: 1317 is Bunpō 1 (元年) and Bunpō 3 is 1319."
description_md: |-
  **Bunpō** (文保) is a Japanese era name ([[nengo]]), proclaimed in 1317. Its years are counted in lunar years from the new year before the proclamation: 1317 is Bunpō 1 (元年), 1319 its last year, Bunpō 3. A Japanese source dates a year within it as "Bunpō 2" (文保2年) rather than by a continuous count.

  Before: [[showa-era-1312|Shōwa]]. After: [[geno-era|Gen'ō]].
