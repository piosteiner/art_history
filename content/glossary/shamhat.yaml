public_id: 131297
name: Shamhat
category: mythology and legend
definition: In the Epic of Gilgamesh, the harimtu (often described as a temple prostitute) who brought the wild man Enkidu into the human world.
description_md: |-
  She spent six days and seven nights with him, and afterwards the wild animals ran from him. She taught him to eat bread, drink beer and wear clothes, and led him to Uruk.

  *From:* Epic of Gilgamesh · Mesopotamian (Sumerian, Babylonian, Assyrian)
