public_id: 113102
name: Changqing
names:
  - lang: zh
    role: original
    text: 長慶
category: calendar
definition: "Chinese era name (長慶) of the Tang for the years 821–825: 821 is Changqing 1 (元年) and Changqing 5 is 825."
description_md: |-
  **Changqing** (長慶) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 821 under Emperor Muzong (穆宗). Its years are counted in lunar years: 821 is Changqing 1 (元年), 825 its last year, Changqing 5. A Chinese source dates a year within it as "Changqing 2" (長慶二年) rather than by a continuous count.

  Before: [[yuanhe-era|Yuanhe]]. After: [[baoli-era|Baoli]].
sources:
  definition:
