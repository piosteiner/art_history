name: Adoration of the Magi
names: [The Three Kings, Biblical Magi]
category: iconography
definition: The wise men from the East who followed a star to Bethlehem with gold, frankincense and myrrh; tradition made them three kings, Caspar, Melchior and Balthazar.
description_md: |-
  Wise men from the East follow a star to Bethlehem and bring gifts of gold, frankincense and myrrh. Tradition later made them three kings, Caspar, Melchior and Balthazar, representing the three known continents and three ages of man.

  **In art:** Three richly dressed kings of different ages, one often African, kneeling before the child with gifts, and a large procession of followers.

  **Famous works**

  - [[artist/gentile-da-fabriano]], *Adoration of the Magi* (Uffizi)
  - Botticelli, *Adoration of the Magi* (Uffizi, with a self-portrait) — [[artwork/adoration-of-the-magi-botticelli-uffizi]]
  - [[artist/leonardo-da-vinci]], *Adoration of the Magi* (unfinished, Uffizi) — [[artwork/adoration-of-the-magi]]
  - [[artist/benozzo-gozzoli]], *Procession of the Magi* (Palazzo Medici Riccardi)

  *From:* New Testament, Gospels · Christian
