public_id: 113285
name: Dongcheon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 동천왕
  - lang: ko-Hani
    role: alternative
    text: 東川王
category: calendar
definition: "The reign years of King Dongcheon of Goguryeo (東川王, 동천왕), by which Korean histories date 227–248: 227 is Dongcheon 1, 248 Dongcheon 22."
description_md: |-
  **Dongcheon** (東川王, 동천왕): the years of the reign of King Dongcheon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 236 is Dongcheon 10 (동천왕 10년). The year of the accession, 227, counts as the first year.

  Before: [[sansang-goguryeo-reign-years|Sansang]]. After: [[jungcheon-goguryeo-reign-years|Jungcheon]].
sources:
  definition:
    - source: dila-time-authority
