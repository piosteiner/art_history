public_id: 131357
name: Thumbelina
category: mythology and legend
definition: In Andersen's fairy tale (1835), a girl the size of a thumb, born from a flower, who escapes a toad and a mole and marries a tiny flower prince.
description_md: |-
  She was kidnapped by a toad who wanted her to marry his son, then nearly married a rich, blind mole. She nursed a frozen swallow back to health, and it carried her away to a warm country, where she married a tiny flower prince.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
