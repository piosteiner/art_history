category: calendar
definition: "Japanese era name (天平) for the years 729–749: 729 is Tenpyō 1 (元年) and Tenpyō 21 is 749."
description_md: |-
  **Tenpyō** (天平) is a Japanese era name ([[nengo]]), proclaimed in 729. Its years are counted in lunar years from the new year before the proclamation: 729 is Tenpyō 1 (元年), 749 its last year, Tenpyō 21. A Japanese source dates a year within it as "Tenpyō 2" (天平2年) rather than by a continuous count.

  Before: Jinki. After: Tenpyō-kanpō.
