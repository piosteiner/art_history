public_id: 116823
name: squadrismo
category: politics
definition: The violence of the armed Fascist squads (squadre d'azione), and its later cult.
description_md: |-
  The cult of the squads offered an image of certainty and of the modern development of the self: speed, selflessness, creative aggressiveness [[source/dagnino-2016|p. 137]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 59]].

  The armed squads were formed with the Fascist movement in March 1919, the first sign of its intent to militarise politics [[source/dagnino-2016|p. 136]]. From 1919 the squadristi, or Blackshirts, attacked socialist politicians and militants, broke strikes and drove out elected local governments, often unhindered or even armed by the police [[source/wikipedia-en-march-on-rome|§ Background]]. During their raids into socialist areas they destroyed red flags and forced respect for the national flag and Fascist insignia [[source/antliff-2002|p. 156]]. For Roberto Farinacci, squadrismo had to transform the "national psyche"; for many young men too young for the war, fighting in a squad was a life-changing, redeeming experience [[source/dagnino-2016|p. 136]]. After 1922 the punitive battles of the Red Biennium took on a mythic dimension as heroism forged in the war [[source/antliff-2002|p. 156]]. In February 1923 the squads were turned into a national militia, the MVSN [[source/wikipedia-en-benito-mussolini|§ Appointment as prime minister]].

  The cult lived on in images: [[artist/mario-sironi|Mario Sironi]]'s cartoons showed the squadristi in a heroic light [[source/braun-2000|p. 12]], and the lorries in his urban landscapes of 1920–21 are the Fiat 18 BL trucks of the squads [[source/antliff-2002|pp. 152–153]]. The Sacrarium of the 1932 [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] was lined with the squads' pennants [[source/antliff-2002|p. 157]]. A postcard of 1941, *Squadrists returning from the Pisan Expedition*, shows the cult as an image of the [[new-man|New Man]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 59]].
