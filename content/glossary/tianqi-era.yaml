definition: "Chinese era name (天啓) of the Ming for the years 1621–1627: 1621 is Tianqi 1 (元年) and Tianqi 7 is 1627."
description_md: |-
  **Tianqi** (天啓) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1621. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Tianqi Emperor. Its years are counted in lunar years: 1621 is Tianqi 1 (元年), 1627 its last year, Tianqi 7. A Chinese source dates a year within it as "Tianqi 2" (天啓二年) rather than by a continuous count.

  Before: [[taichang-era|Taichang]]. After: [[chongzhen-era|Chongzhen]].
