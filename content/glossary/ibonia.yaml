public_id: 131510
name: Ibonia
category: mythology and legend
definition: The great hero of the Malagasy epic, who spoke from his mother's womb and went on a quest to rescue his promised bride from the monster Raivato.
description_md: |-
  Even before he was born, he spoke from his mother's womb and chose his own birth. He grew up to be a great hero, going on a quest to rescue his promised bride Iampelasoamananoro from the monster Raivato. Among his tricks, he disguised himself in an old man's skin.

  *From:* Ibonia epic · Malagasy
