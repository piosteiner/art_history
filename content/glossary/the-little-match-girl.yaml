public_id: 131360
name: The Little Match Girl
category: mythology and legend
definition: In Andersen's fairy tale (1845), a poor girl selling matches on New Year's Eve who sees visions in their light and is found frozen in the morning.
description_md: |-
  Too afraid to go home without money, she lit her matches one by one to stay warm. In their light, she saw a warm stove, a Christmas tree, and finally her dead grandmother, who took her up to heaven. In the morning, she was found frozen in the street, smiling.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
