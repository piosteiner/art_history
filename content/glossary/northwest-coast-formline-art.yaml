name: Northwest Coast formline art
names: [totem poles, formline]
category: art style
definition: "The art of the Pacific Northwest coast nations: formline, a design system of flowing black and red lines, ovoids and U-shapes, and carved cedar poles showing family and clan crests."
description_md: |-
  The art of nations of the Pacific Northwest coast, like the Haida, Tlingit, Tsimshian and Kwakwaka'wakw. Formline is a design system of flowing, swelling black and red lines, ovoids and U-shapes. Poles (often called "totem poles") show crests: family and clan emblems like Raven, Eagle, Bear and Killer Whale, telling of a family's history and rights.

  **In art:** Carved and painted cedar poles, masks, bentwood boxes, Chilkat blankets and argillite carvings.

  **Famous works**

  - Bill Reid (Haida), *The Raven and the First Men* (yellow cedar, 1980, Museum of Anthropology, University of British Columbia, Vancouver)
  - Bill Reid, *The Spirit of Haida Gwaii* (bronze, Canadian Embassy, Washington, and Vancouver Airport)
  - *Poles at Stanley Park and SG̱ang Gwaay* (Vancouver; SG̱ang Gwaay a UNESCO World Heritage Site)

  *From:* Haida, Tlingit, Tsimshian, Kwakwaka'wakw
