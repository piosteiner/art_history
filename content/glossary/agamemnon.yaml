name: Agamemnon
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the king of Mycenae who led the Greeks to Troy, sacrificed his daughter Iphigenia and was murdered by his wife Clytemnestra.
description_md: |-
  Agamemnon, king of Mycenae, led the Greeks to Troy. To get winds for the fleet, he sacrificed his daughter [[iphigenia]] (in some versions [[artemis]] replaced her with a deer). When he came home, his wife [[clytemnestra]] murdered him in his bath (so in Aeschylus' Oresteia; in [[person/homer]] it is Aegisthus who kills him). Their son [[orestes]] later killed her, and was hunted by the Furies.

  **Famous works**

  - *Mask of Agamemnon* (gold death mask, National Archaeological Museum, Athens; not really his) — [[artwork/mask-of-agamemnon]]

  *From:* Homer, Iliad; Aeschylus, Oresteia · Ancient Greek
