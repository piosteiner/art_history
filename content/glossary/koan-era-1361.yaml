definition: "Japanese era name (康安) for the years 1361–1362: 1361 is Kōan 1 (元年) and Kōan 2 is 1362."
description_md: |-
  **Kōan** (康安) is a Japanese era name ([[nengo]]), proclaimed in 1361. Its years are counted in lunar years from the new year before the proclamation: 1361 is Kōan 1 (元年), 1362 its last year, Kōan 2. A Japanese source dates a year within it as "Kōan 2" (康安2年) rather than by a continuous count.

  Before: [[enbun-era|Enbun]]. After: [[joji-era|Jōji]].
