name: The Ship of Fools
names: [Das Narrenschiff]
category: iconography
definition: A satirical theme from Sebastian Brant's book Das Narrenschiff (Basel, 1494), showing humanity as a boatload of fools sailing to the fools' paradise Narragonia.
description_md: |-
  The Ship of Fools, from Sebastian Brant's book *Das Narrenschiff* (Basel, 1494), shows humanity as a boatload of fools sailing nowhere.

  **Famous works**

  - [[artist/hieronymus-bosch]], *The Ship of Fools* (Louvre)
  - [[artist/albrecht-durer]] (attributed), *woodcuts for Das Narrenschiff*

  *From:* Sebastian Brant, Das Narrenschiff (Basel, 1494) · German
