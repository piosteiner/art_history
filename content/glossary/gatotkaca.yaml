public_id: 130997
name: Gatotkaca
category: mythology and legend
definition: A flying hero of Javanese wayang shadow-puppet theatre, son of Bima, made invincible as a baby — "muscles of wire and bones of iron" — who guards the skies and dies heroically in the great war.
description_md: |-
  Gatotkaca is one of the most beloved heroes of Javanese wayang shadow-puppet theatre. The son of the mighty Bima, he was made invincible as a baby when the gods plunged him into a volcanic crater. He can fly, has "muscles of wire and bones of iron", and guards the skies for his family. He dies heroically in the great war, crashing down on [[karna]]'s chariot as he falls.

  *From:* wayang (Mahabharata tradition) · Javanese
