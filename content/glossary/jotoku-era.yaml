category: calendar
definition: "Japanese era name (承徳) for the years 1097–1099: 1097 is Jōtoku 1 (元年) and Jōtoku 3 is 1099."
description_md: |-
  **Jōtoku** (承徳) is a Japanese era name ([[nengo]]), proclaimed in 1097. Its years are counted in lunar years from the new year before the proclamation: 1097 is Jōtoku 1 (元年), 1099 its last year, Jōtoku 3. A Japanese source dates a year within it as "Jōtoku 2" (承徳2年) rather than by a continuous count.

  Before: [[eicho-era|Eichō]]. After: [[kowa-era-1099|Kōwa]].
