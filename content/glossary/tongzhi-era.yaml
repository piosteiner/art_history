definition: "Chinese era name (同治) of the Qing for the years 1862–1874: 1862 is Tongzhi 1 (元年) and Tongzhi 13 is 1874."
description_md: |-
  **Tongzhi** (同治) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1862. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Tongzhi Emperor. Its years are counted in lunar years: 1862 is Tongzhi 1 (元年), 1874 its last year, Tongzhi 13. A Chinese source dates a year within it as "Tongzhi 2" (同治二年) rather than by a continuous count.

  Before: [[xianfeng-era|Xianfeng]]. After: [[guangxu-era|Guangxu]].
