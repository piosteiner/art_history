name: Icarus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the son of Daedalus, who flew too close to the sun on wings of feathers and wax, so the wax melted and he fell into the sea.
description_md: |-
  Imprisoned on Crete, [[daedalus]] made wings from feathers and wax. He warned Icarus not to fly too high, but the boy got carried away, the sun melted the wax, and he fell into the sea.

  Daedalus was the brilliant inventor who built the Labyrinth for King Minos. Imprisoned with his son Icarus, he built them wings of feathers and wax. Icarus flew too close to the sun, the wax melted, and he fell into the sea.

  **In art:** A boy falling from the sky with melting wings.

  **Famous works**

  - Pieter Bruegel the Elder (attributed), *Landscape with the Fall of Icarus* (Royal Museums of Fine Arts of Belgium, Brussels)
  - Canova, *Daedalus and Icarus* (Museo Correr, Venice)
  - Herbert James Draper, *The Lament for Icarus* (Tate)
  - Matisse, *Icarus* (from *Jazz*)

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
