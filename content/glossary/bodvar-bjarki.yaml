name: Bödvar Bjarki
names: [Böðvarr Bjarki]
category: mythology and legend
definition: The greatest champion of the Danish king Hrolf Kraki, whose spirit fought as a giant bear in the king's last battle while his body sat in a trance in the hall.
description_md: |-
  Bödvar Bjarki was the greatest champion of the Danish king Hrolf Kraki. In the king's final battle, a huge bear appeared on the battlefield, fighting for Hrolf and killing enemies left and right. Meanwhile, Bödvar sat motionless in the king's hall, as if in a trance. When a friend shook him awake to come and fight, the bear vanished, and the battle turned against Hrolf: his enemies overwhelmed and killed the king, Bödvar and all his warriors. The bear had been Bödvar's spirit all along.

  *From:* Hrólfs saga kraka · Norse / Danish
