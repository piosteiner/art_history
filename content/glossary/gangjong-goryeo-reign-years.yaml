public_id: 113324
name: Gangjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 강종
  - lang: ko-Hani
    role: alternative
    text: 康宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Gangjong of Goryeo (康宗, 강종), by which Korean histories date 1212–1214: 1212 is Gangjong 1, 1214 Gangjong 3."
description_md: |-
  **Gangjong** (康宗, 강종): the years of the reign of King Gangjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1214 is Gangjong 3 (강종 3년). The year of the accession, 1212, counts as the first year.

  Before: [[huijong-goryeo-reign-years|Huijong]]. After: [[gojong-goryeo-reign-years|Gojong]].
sources:
  definition:
    - source: dila-time-authority
