name: Common Chinese symbols
category: iconography
definition: "A quick reference to Chinese symbols, many based on puns: the bat for fortune, the peach and crane for longevity, the carp for perseverance, the lotus for purity."
description_md: |-
  A quick reference. Bat: good fortune (pun on *fu*). Peach: longevity. Crane: longevity and the immortals. Pine: longevity and steadfastness. Carp: perseverance (a carp that leaps the Dragon Gate becomes a dragon, meaning success in the exams). Lotus: purity, rising clean from the mud. Mandarin ducks: a faithful married couple. Peony: wealth and honour. Gourd: magic and health. Deer: official salary (pun on *lu*). Tiger: courage and protection from evil. Five bats: the Five Blessings.

  *From:* Chinese
