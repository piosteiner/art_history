public_id: 130910
name: Mwindo
category: mythology and legend
definition: The miracle hero of the oral Mwindo epic of the Nyanga people of the Congo, born able to walk and speak, who defeated his own father.
description_md: |-
  The Mwindo epic is an oral tale of the Nyanga people of the Congo, performed by a bard with a calabash rattle and bells. Mwindo's father, a chief, wanted only daughters and tried to kill any son. Mwindo was born anyway, already able to walk and speak, carrying a magical scepter. His father sealed him in a drum and threw him into the river, but Mwindo survived, travelled through the underworld, and finally defeated his father. Later he killed a dragon, angered the gods, and was carried up into the sky for a year to learn humility before returning as a wise ruler.

  *From:* Mwindo epic · Nyanga (Congo)
