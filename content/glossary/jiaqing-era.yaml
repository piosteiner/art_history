definition: "Chinese era name (嘉慶) of the Qing for the years 1796–1820: 1796 is Jiaqing 1 (元年) and Jiaqing 25 is 1820."
description_md: |-
  **Jiaqing** (嘉慶) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1796. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Jiaqing Emperor. Its years are counted in lunar years: 1796 is Jiaqing 1 (元年), 1820 its last year, Jiaqing 25. A Chinese source dates a year within it as "Jiaqing 2" (嘉慶二年) rather than by a continuous count.

  Before: [[qianlong-era|Qianlong]]. After: [[daoguang-era|Daoguang]].
