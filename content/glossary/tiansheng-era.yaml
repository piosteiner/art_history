name: Tiansheng
names:
  - lang: zh
    role: original
    text: 天聖
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天聖) of the Northern Song for the years 1023–1032: 1023 is Tiansheng 1 (元年) and Tiansheng 10 is 1032."
description_md: |-
  **Tiansheng** (天聖) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1023 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1023 is Tiansheng 1 (元年), 1032 its last year, Tiansheng 10. A Chinese source dates a year within it as "Tiansheng 2" (天聖二年) rather than by a continuous count.

  Before: [[qianxing-era|Qianxing]]. After: [[mingdao-era|Mingdao]].
sources:
