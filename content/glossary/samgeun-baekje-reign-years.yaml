public_id: 113266
name: Samgeun of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 삼근왕
  - lang: ko-Hani
    role: alternative
    text: 三斤王
category: calendar
parent: korean-calendar
definition: "The reign years of King Samgeun of Baekje (三斤王, 삼근왕), by which Korean histories date 477–479: 477 is Samgeun 1, 479 Samgeun 3."
description_md: |-
  **Samgeun** (三斤王, 삼근왕): the years of the reign of King Samgeun of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 479 is Samgeun 3 (삼근왕 3년). The year of the accession, 477, counts as the first year.

  Before: [[munju-baekje-reign-years|Munju]]. After: [[dongseong-baekje-reign-years|Dongseong]].
sources:
  definition:
    - source: dila-time-authority
