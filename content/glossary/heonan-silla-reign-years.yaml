public_id: 113383
name: Heonan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 헌안왕
  - lang: ko-Hani
    role: alternative
    text: 憲安王
category: calendar
definition: "The reign years of King Heonan of Silla (憲安王, 헌안왕), by which Korean histories date 857–861: 857 is Heonan 1, 861 Heonan 5."
description_md: |-
  **Heonan** (憲安王, 헌안왕): the years of the reign of King Heonan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 861 is Heonan 5 (헌안왕 5년). The year of the accession, 857, counts as the first year.

  Before: [[munseong-silla-reign-years|Munseong]]. After: [[gyeongmun-silla-reign-years|Gyeongmun]].
sources:
  definition:
    - source: dila-time-authority
