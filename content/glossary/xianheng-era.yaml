name: Xianheng
names:
  - lang: zh
    role: original
    text: 咸亨
category: calendar
parent: chinese-calendar
definition: "Chinese era name (咸亨) of the Tang for the years 670–674: 670 is Xianheng 1 (元年) and Xianheng 5 is 674."
description_md: |-
  **Xianheng** (咸亨) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 670 under Emperor Gaozong (高宗). Its years are counted in lunar years: 670 is Xianheng 1 (元年), 674 its last year, Xianheng 5. A Chinese source dates a year within it as "Xianheng 2" (咸亨二年) rather than by a continuous count.

  Before: [[zongzhang-era|Zongzhang]]. After: [[shangyuan-era|Shangyuan]].
sources:
