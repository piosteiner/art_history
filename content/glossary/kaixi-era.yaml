name: Kaixi
names:
  - lang: zh
    role: original
    text: 開禧
category: calendar
parent: chinese-calendar
definition: "Chinese era name (開禧) of the Southern Song for the years 1205–1207: 1205 is Kaixi 1 (元年) and Kaixi 3 is 1207."
description_md: |-
  **Kaixi** (開禧) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1205 under Emperor Ningzong (寧宗). Its years are counted in lunar years: 1205 is Kaixi 1 (元年), 1207 its last year, Kaixi 3. A Chinese source dates a year within it as "Kaixi 2" (開禧二年) rather than by a continuous count.

  Before: [[jiatai-era|Jiatai]]. After: [[jiading-era|Jiading]].
sources:
