definition: In Greek myth the ferryman who rows the souls of the dead across the river Styx (or Acheron) for a coin.
description_md: |-
  Charon is the ferryman who rows the souls of the dead across the river Styx (or Acheron), for a coin placed in the corpse's mouth. [[cerberus]] is the three-headed dog who guards the gates. [[heracles]] dragged him into daylight as his last labour.

  **In art:** A grim old boatman with a pole.

  **Famous works**

  - [[artist/joachim-patinir]], *Landscape with Charon Crossing the Styx* (Prado)
  - [[artist/michelangelo]], Charon in *The Last Judgement* (Sistine Chapel)

  *From:* Greek mythology · Ancient Greek
