definition: A paid public gathering in late Edo and Meiji Japan at which calligraphers, painters and poets wrote and painted to order before guests, with food and drink.
description_md: |-
  A *shogakai* (書画会), a 'calligraphy-and-painting gathering', was an event at which literati assembled guests at a restaurant or teahouse, wrote and painted before them and then held a drinking party [[source/nikkoku-shogakai|s.v. 書画会]]. Robert Campbell calls it a public gathering for writing and painting on the spot, usually held by one person — a painter, calligrapher or poet, later also popular writers, *ukiyo-e* artists and flower masters [[source/campbell-1987-tenpoki-zengo-shogakai|p. 48]]. Such gatherings are said to have begun in Kyoto in the Kansei era and in Edo at about the same time; they multiplied in the Bunka–Bunsei and again in the Tenpō era and stayed in fashion until the middle of the Meiji period [[source/campbell-1987-tenpoki-zengo-shogakai|p. 47]]. [[person/ota-nanpo|Ōta Nanpo]] named a gathering held by [[artist/tani-buncho|Tani Bunchō]] at the Manpachirō in Yanagibashi on the 17th day of the first month of 1792 as the beginning of the 'so-called *shogakai*' [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 33, n. 4]]. The host bore the costs and hoped to profit from the fees, but usually left the arrangements to a professional organiser such as the fan dealer Senmentei Denshirō; a printed or handwritten flyer, sent out months ahead, named the host, his circle, the artists who would paint, the date, the venue and the fee [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 50–51]]. Guests paid a seat fee of a few *monme* of silver — three on the flyers Campbell reproduces — ordered paintings and inscriptions on fans and silk from the artists present and gave each artist a further gift [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 48, 59]]. In Edo the favourite venues were the rental rooms of restaurants in Yanagibashi: of 266 gatherings recorded on surviving flyers of about 1835–1860, 50 were held at the Kawachiya and 37 at the Manpachirō [[source/campbell-1987-tenpoki-zengo-shogakai|p. 59]]. Terakado Seiken's *Edo hanjōki* (1832) mocked the signboards hung up months in advance, the geisha serving sake and the guests fighting for the works [[source/washihara-2015-bakumatsuki-bunjin-seikei|pp. 100–102]]. In 1838 twenty-three leading literati tried to control all *shogakai* through a 'kimoiri' cartel with a monthly rota and fixed fees, which rival writers ridiculed in print [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 61–69]]. The *Nihon daihyakka zensho* also uses the word for one-day exhibitions at temples and restaurants, such as Minagawa Kien's in Kyoto from 1792 [[source/kimura-nipponica-shogakai|s.v. 書画会]].

  The *shogakai* and the printed directories of Edo’s notables were made by the same people. The fan dealer [[person/senmentei-denshiro|Senmentei]], whom hosts consulted on the forms of a gathering and to whom they left its organisation, also compiled the *Edo tōji shoka jinmeiroku* of 1815 and 1818 [[source/washihara-2015-bakumatsuki-bunjin-seikei|p. 102]] [[source/senmentei-1815-edo-toji-shoka-jinmeiroku|colophon]]. The Confucian Tōjō Kindai, a member of the 1838 cartel and host of many gatherings, prefaced the directory editions of 1836 and 1842, and a satire of about 1845 mocked him for ‘making a directory in league with Senmentei’ [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 66–67]] [[source/nishimura-1836-edo-genzai-koeki-shoka-jinmeiroku|preface]]. The directories named the masters and their addresses for visitors from the provinces, by 1842 expressly also for those who wanted to ask them for brushwork [[source/nishimura-1842-koeki-shoka-jinmeiroku-nihen|凡例]]. Washihara Tomoyoshi reads the sale of such a book as a sign of the commercial spirit behind the *shogakai* boom [[source/washihara-2015-bakumatsuki-bunjin-seikei|p. 102]]. Historians identify the artists named on *shogakai* flyers through the same directories: Koyama Shūko did so for the Kita Buichi invitation, Campbell for the members of the 1838 cartel [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 35, n. 1]] [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 68–69]]. Rankings were part of the same world: in 1816 the Confucian Ōta Kinjō accused the poet Ōkubo Shibutsu, said to have helped make a ranking sheet of literati, of praising at *shogakai* those who joined his circle and shunning the rest [[source/campbell-1987-tenpoki-zengo-shogakai|pp. 47–48]].
