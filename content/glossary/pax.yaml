name: Pax
names: [Peace]
category: iconography
definition: "Peace personified: a woman with an olive branch, a dove or a cornucopia, sometimes nursing a child, set against War as Mars or a Fury."
description_md: |-
  Peace (Pax) is a woman with an olive branch, a dove or a cornucopia, often nursing a child. War is [[ares|Mars]] or a Fury with a torch, overturning everything in his path.

  **Famous works**

  - Rubens, *Minerva Protects Pax from Mars* (National Gallery, London)
  - Rubens, *The Consequences of War* (Palazzo Pitti)
  - [[artist/ambrogio-lorenzetti]], *Allegory of Good and Bad Government* (Sala dei Nove, Palazzo Pubblico, Siena, 1338–39; Peace reclines in the Good Government wall)

  *From:* Roman and European
