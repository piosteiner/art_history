public_id: 113296
name: Anjang of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 안장왕
  - lang: ko-Hani
    role: alternative
    text: 安臧王
category: calendar
parent: korean-calendar
definition: "The reign years of King Anjang of Goguryeo (安臧王, 안장왕), by which Korean histories date 519–531: 519 is Anjang 1, 531 Anjang 13."
description_md: |-
  **Anjang** (安臧王, 안장왕): the years of the reign of King Anjang of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 528 is Anjang 10 (안장왕 10년). The year of the accession, 519, counts as the first year.

  Before: [[munjamyeong-goguryeo-reign-years|Munjamyeong]]. After: [[anwon-goguryeo-reign-years|Anwon]].
sources:
  definition:
    - source: dila-time-authority
