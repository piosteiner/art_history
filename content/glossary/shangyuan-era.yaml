public_id: 113055
name: Shangyuan
names:
  - lang: zh
    role: original
    text: 上元
category: calendar
definition: "Chinese era name (上元) of the Tang for the years 674–676: 674 is Shangyuan 1 (元年) and Shangyuan 3 is 676."
description_md: |-
  **Shangyuan** (上元) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 674 under Emperor Gaozong (高宗). Its years are counted in lunar years: 674 is Shangyuan 1 (元年), 676 its last year, Shangyuan 3. A Chinese source dates a year within it as "Shangyuan 2" (上元二年) rather than by a continuous count.

  Before: [[xianheng-era|Xianheng]]. After: [[yifeng-era|Yifeng]].
sources:
  definition:
    - source: dila-time-authority
