definition: Belts of white and purple shell beads made by the Haudenosaunee Confederacy and other Eastern nations to record treaties, laws and agreements — not money to them (though European colonists used loose wampum beads as currency).
description_md: |-
  Belts of white and purple shell beads made by the Haudenosaunee (Iroquois) Confederacy and other Eastern nations. They record treaties, laws and agreements. The belts are not money (though colonists used loose wampum beads as currency).

  **Famous works**

  - *Two Row Wampum (Kaswentha)* (representing an agreement with the Dutch — according to Haudenosaunee tradition, 1613: two parallel rows of purple beads for two peoples travelling side by side without interfering)
  - *Hiawatha Belt* (symbol of the Confederacy, now on the Haudenosaunee flag)

  *From:* Haudenosaunee and other Eastern nations
