public_id: 131021
name: Jingwei
category: mythology and legend
definition: In Chinese myth, an emperor's daughter who drowned in the Eastern Sea and became a small bird, forever dropping pebbles and twigs into the waves to fill it — a byword for stubborn determination.
description_md: |-
  Jingwei was the daughter of an ancient emperor. She drowned while playing in the Eastern Sea and was transformed into a small bird. Furious at the sea that took her life, she vowed to fill it up. Ever since, she has carried a pebble or twig in her beak and dropped it into the waves, never giving up. In Chinese, her name stands for stubborn determination against impossible odds.

  *From:* Classic of Mountains and Seas · Chinese
