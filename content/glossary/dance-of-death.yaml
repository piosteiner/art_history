name: Dance of Death
names: [Totentanz, Danse macabre]
category: iconography
definition: A late medieval theme showing Death, as skeletons, leading people of every rank in a dance to the grave.
description_md: |-
  A late medieval theme showing Death, as skeletons, leading people of every rank, from pope and emperor to peasant and child, in a dance to the grave. Death comes for everyone equally.

  **In art:** A procession or chain of skeletons each dancing with a living person.

  **Famous works**

  - [[artist/hans-holbein-the-younger]], *The Dance of Death* (woodcuts designed c. 1526 in Basel, cut by Hans Lützelburger, published 1538)
  - *Basel Dance of Death* (Totentanz, fragments in the Historisches Museum Basel)
  - Bernt Notke, *Danse Macabre* (fragment, late 15th century, St Nicholas' Church (Niguliste Museum), Art Museum of Estonia, Tallinn)

  *From:* European
