public_id: 113319
name: Injong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 인종
  - lang: ko-Hani
    role: alternative
    text: 仁宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Injong of Goryeo (仁宗, 인종), by which Korean histories date 1123–1146: 1123 is Injong 1, 1146 Injong 24."
description_md: |-
  **Injong** (仁宗, 인종): the years of the reign of King Injong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1132 is Injong 10 (인종 10년). The year of the accession, 1123, counts as the first year.

  Before: [[yejong-goryeo-reign-years|Yejong]]. After: [[uijong-goryeo-reign-years|Uijong]].
sources:
  definition:
    - source: dila-time-authority
