definition: In Greek myth the primordial Sky, father of the Titans with Gaia, castrated by his son Cronus.
description_md: |-
  The primordial Earth and Sky, parents of the Titans. Uranus imprisoned his children inside [[gaia]], so she gave her son [[cronus]] a sickle, and he castrated his father. From the foam around his severed genitals, which Cronus threw into the sea, [[aphrodite]] was born (in Hesiod; from the blood that fell on the earth came the [[the-furies|Erinyes]], the Giants and the Meliae).

  **In art:** Gaia as a reclining earth mother with fruit, Uranus as the starry sky.

  **Famous works**

  - Giorgio Vasari and Cristofano Gherardi, *The Mutilation of Uranus by Saturn* (Palazzo Vecchio, Florence)

  *From:* Greek mythology · Ancient Greek
