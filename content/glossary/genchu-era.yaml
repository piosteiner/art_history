category: calendar
definition: "Japanese era name (元中) for the years 1384–1392 of the Southern Court: 1384 is Genchū 1 (元年) and Genchū 9 is 1392."
description_md: |-
  **Genchū** (元中) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras, proclaimed in 1384. Its years are counted in lunar years from the new year before the proclamation: 1384 is Genchū 1 (元年), 1392 its last year, Genchū 9. A Japanese source dates a year within it as "Genchū 2" (元中2年) rather than by a continuous count.

  Before: [[kowa-era-1381|Kōwa]].
