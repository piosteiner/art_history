name: Zhizheng
names:
  - lang: zh
    role: original
    text: 至正
category: calendar
parent: chinese-calendar
definition: "Chinese era name (至正) of the Yuan for the years 1341–1367: 1341 is Zhizheng 1 (元年) and Zhizheng 27 is 1367."
description_md: |-
  **Zhizheng** (至正) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1341 under Toghon Temür (順帝). Its years are counted in lunar years: 1341 is Zhizheng 1 (元年), 1367 its last year, Zhizheng 27. A Chinese source dates a year within it as "Zhizheng 2" (至正二年) rather than by a continuous count.

  Before: [[zhiyuan-era-1335|Zhiyuan]].
sources:
  definition:
    - source: dila-time-authority
