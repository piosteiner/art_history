public_id: 131293
name: Cyane
category: mythology and legend
definition: In Ovid's Metamorphoses, a Sicilian nymph who tried to stop Hades carrying off Persephone and melted away into her own pool in grief.
description_md: |-
  She tried to stop [[hades]] when he kidnapped [[persephone]]. Hades struck the ground and burst through her pool to the Underworld. She cried so much that she melted away into the water.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
