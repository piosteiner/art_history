definition: "Japanese era name (貞観) for the years 859–877: 859 is Jōgan 1 (元年) and Jōgan 19 is 877."
description_md: |-
  **Jōgan** (貞観) is a Japanese era name ([[nengo]]), proclaimed in 859. Its years are counted in lunar years from the new year before the proclamation: 859 is Jōgan 1 (元年), 877 its last year, Jōgan 19. A Japanese source dates a year within it as "Jōgan 2" (貞観2年) rather than by a continuous count.

  Before: [[tenan-era|Ten'an]]. After: [[gangyo-era|Gangyō]].
