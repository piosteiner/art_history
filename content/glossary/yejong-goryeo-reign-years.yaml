public_id: 113318
name: Yejong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 예종
  - lang: ko-Hani
    role: alternative
    text: 睿宗
category: calendar
definition: "The reign years of King Yejong of Goryeo (睿宗, 예종), by which Korean histories date 1106–1122: 1106 is Yejong 1, 1122 Yejong 17."
description_md: |-
  **Yejong** (睿宗, 예종): the years of the reign of King Yejong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1115 is Yejong 10 (예종 10년). The year of the accession, 1106, counts as the first year.

  Before: [[sukjong-goryeo-reign-years|Sukjong]]. After: [[injong-goryeo-reign-years|Injong]].
sources:
  definition:
    - source: dila-time-authority
