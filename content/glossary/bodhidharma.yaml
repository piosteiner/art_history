definition: The semi-legendary monk, described as Indian or as Persian, who brought Chan (Zen) Buddhism to China, said to have meditated facing a wall for nine years; the origin of the Daruma doll.
description_md: |-
  The legendary Indian monk who brought Chan ([[zen]]) Buddhism to China. He is said to have meditated facing a wall for nine years; later legends add that his legs withered away (hence the legless Daruma doll) and that he cut off his own eyelids to stay awake, the first tea plants growing where they fell. The round Daruma dolls with blank eyes come from him.

  **In art:** A fierce, bearded, bulging-eyed monk in a red robe, often painted in a few quick (bold ink) brushstrokes, or crossing the Yangtze River standing on a reed. The Daruma doll is a round, legless figure that always rights itself.

  **Famous works**

  - [[artist/hakuin-ekaku]], *Daruma* (many ink paintings, 18th century)
  - [[artist/sesshu-toyo]], *Huike Offering His Arm to Bodhidharma* (Sainen-ji, Aichi)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Chan/Zen Buddhist
