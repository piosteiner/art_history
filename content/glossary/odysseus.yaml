definition: In Greek myth the cleverest of the Greek heroes, king of Ithaca, whose ten-year journey home from Troy is told in Homer's Odyssey; the Romans called him Ulysses.
description_md: |-
  The cleverest of the Greek heroes, king of Ithaca. After Troy fell, it took him ten more years to get home, through the adventures of [[person/homer]]'s *Odyssey*: blinding the Cyclops Polyphemus, escaping the witch [[circe]], resisting the [[the-sirens|Sirens]], passing between [[scylla]] and [[charybdis]], and being held for years by the nymph [[calypso]]. At home, he killed the suitors who had been courting his wife.

  **In art:** A bearded man in a sailor's conical cap (*pilos*), tied to the mast of his ship, or offering wine to the [[cyclopes|Cyclops]].

  **Famous works**

  - Waterhouse, *Ulysses and the Sirens* (National Gallery of Victoria, Melbourne)
  - Herbert James Draper, *Ulysses and the Sirens* (Ferens Art Gallery, Hull)
  - Turner, *Ulysses Deriding Polyphemus* (National Gallery, London)
  - *Sperlonga sculptures* (Polyphemus group; Museo Archeologico Nazionale, Sperlonga)

  *From:* Homer, Odyssey · Ancient Greek
