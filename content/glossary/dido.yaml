name: Dido
category: mythology and legend
also_in: [iconography]
definition: The founder-queen of Carthage, who loved Aeneas and killed herself on a funeral pyre when he left her to sail for Italy.
description_md: |-
  The queen and founder of Carthage. [[aeneas]] landed there, and they fell in love. When the gods ordered him to sail on to Italy, he left her, and she killed herself on a funeral pyre, cursing his descendants.

  **In art:** A queen on a burning pyre with a sword, or Aeneas telling her the story of Troy.

  **Famous works**

  - [[artist/guercino]], *The Death of Dido* (Galleria Spada, Rome)
  - Turner, *Dido Building Carthage* (National Gallery, London)
  - Pierre-Narcisse Guérin, *Aeneas Tells Dido the Misfortunes of Troy* (Louvre)

  *From:* Virgil, Aeneid · Ancient Roman (Carthaginian queen)
