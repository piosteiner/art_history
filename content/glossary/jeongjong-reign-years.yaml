definition: "The reign years of King Jeongjong of Joseon (定宗, 정종), by which Korean sources date 1399–1400: 1399 is Jeongjong 1, 1400 Jeongjong 2."
description_md: |-
  **Jeongjong** (定宗, 정종): the years of the reign of King Jeongjong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1400 is Jeongjong 2 (정종 2년). The year of the accession, 1399, counts as the first year.

  Before: [[taejo-reign-years|Taejo]]. After: [[taejong-reign-years|Taejong]].
