public_id: 131189
name: Antero Vipunen
category: mythology and legend
definition: A giant of the Finnish Kalevala who lies asleep underground with trees growing on his body and knows every magic word; Väinämöinen, swallowed by him, hammered in his belly until he gave up his songs.
description_md: |-
  Trees have grown on his body while he sleeps. [[vainamoinen]] needed three magic words to finish his boat, so he woke Vipunen, who swallowed him. Inside his belly, Väinämöinen built a forge and hammered until the giant gave up all his songs.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
