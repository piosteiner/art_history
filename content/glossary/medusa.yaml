definition: In Greek myth one of the three Gorgons, with snakes for hair, whose gaze turned anyone to stone; beheaded by Perseus.
description_md: |-
  One of the three Gorgons, with snakes for hair, whose gaze turned anyone to stone. In Ovid's version, she was a beautiful woman punished by [[athena]].

  **In art:** A severed head with writhing snakes and a screaming or anguished face, also used as a protective symbol (*gorgoneion*) on shields and armour.

  **Famous works**

  - [[artist/caravaggio]], *Medusa* (painted on a shield, Uffizi) — [[artwork/medusa]]
  - Rubens, *The Head of Medusa* (Kunsthistorisches Museum, Vienna)
  - Bernini, *Bust of Medusa* (Capitoline Museums)

  *From:* Greek mythology · Ancient Greek
