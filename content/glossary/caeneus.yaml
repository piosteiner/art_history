name: Caeneus
names: [Caenis]
category: mythology and legend
definition: In Greek myth, Caenis, a woman turned by Poseidon into Caeneus, a warrior whose skin no weapon could cut.
description_md: |-
  Caenis was raped by [[poseidon]], who then offered her a wish. She asked to become a man so that it could never happen again, and he made her a warrior whose skin no weapon could cut. In the battle of the [[the-lapiths|Lapiths]] and [[centaurs]], the centaurs buried Caeneus under a mountain of tree trunks, and he flew out as a bird with tawny wings.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
