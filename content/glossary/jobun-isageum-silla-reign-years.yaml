public_id: 113347
name: Jobun Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 조분이사금
  - lang: ko-Hani
    role: alternative
    text: 助賁尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Jobun Isageum of Silla (助賁尼師今, 조분이사금), by which Korean histories date 230–247: 230 is Jobun Isageum 1, 247 Jobun Isageum 18."
description_md: |-
  **Jobun Isageum** (助賁尼師今, 조분이사금): the years of the reign of Jobun Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 239 is Jobun Isageum 10 (조분이사금 10년). The year of the accession, 230, counts as the first year.

  Before: [[nahae-isageum-silla-reign-years|Nahae Isageum]]. After: [[cheomhae-isageum-silla-reign-years|Cheomhae Isageum]].
sources:
