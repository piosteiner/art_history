name: Christ and the Samaritan Woman
names: [Samaritan Woman at the Well]
category: iconography
definition: Jesus asking a Samaritan woman for water at Jacob's well and offering her "living water".
description_md: |-
  At Jacob's well, Jesus asked a Samaritan woman for water and told her he offered "living water", surprising her by revealing that he knew all about her life.

  **In art:** Christ seated at a well talking to a woman with a water jar.

  **Famous works**

  - [[artist/annibale-carracci]], *Christ and the Samaritan Woman* (Brera, Milan)
  - Duccio, panel from the *Maestà* (Thyssen-Bornemisza)

  *From:* New Testament, Gospels · Christian
