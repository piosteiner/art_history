definition: "Japanese era name (正治) for the years 1199–1200: 1199 is Shōji 1 (元年) and Shōji 2 is 1200."
description_md: |-
  **Shōji** (正治) is a Japanese era name ([[nengo]]), proclaimed in 1199. Its years are counted in lunar years from the new year before the proclamation: 1199 is Shōji 1 (元年), 1200 its last year, Shōji 2. A Japanese source dates a year within it as "Shōji 2" (正治2年) rather than by a continuous count.

  Before: [[kenkyu-era|Kenkyū]]. After: [[kennin-era|Kennin]].
