category: calendar
definition: "Japanese era name (文永) for the years 1264–1275: 1264 is Bun'ei 1 (元年) and Bun'ei 12 is 1275."
description_md: |-
  **Bun'ei** (文永) is a Japanese era name ([[nengo]]), proclaimed in 1264. Its years are counted in lunar years from the new year before the proclamation: 1264 is Bun'ei 1 (元年), 1275 its last year, Bun'ei 12. A Japanese source dates a year within it as "Bun'ei 2" (文永2年) rather than by a continuous count.

  Before: Kōchō. After: Kenji.
