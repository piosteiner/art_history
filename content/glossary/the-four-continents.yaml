public_id: 132318
name: The Four Continents
category: iconography
definition: Europe, Asia, Africa and America as four women with exotic attributes, images that reflect the European colonial views of the early modern period.
description_md: |-
  The four known parts of the world in early modern times: Europe, Asia, Africa and America.

  **In art:** Four women, each with exotic attributes: Europe crowned with a horse, Asia with a camel or incense, Africa with an elephant or lion, and America with a feather headdress, bow and crocodile or armadillo. These images reflect the European colonial views of the time.

  **Famous works**

  - [[artist/giovanni-battista-tiepolo]], *Allegory of the Planets and Continents* (ceiling fresco over the staircase, 1752–1753, Würzburg Residence)
  - [[artist/gian-lorenzo-bernini]], *Fountain of the Four Rivers* (1651, Piazza Navona, Rome; the continents as four river gods: Danube, Nile, Ganges, Río de la Plata)

  *From:* European
