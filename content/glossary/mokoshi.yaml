public_id: 106657
name: mokoshi
names:
  - lang: ja
    role: original
    text: "{裳階|もこし}"
category: architecture
definition: A pent roof added below the main roof of each storey, so that a building seems to have twice as many storeys; the east pagoda of Yakushiji is the best-known example.
sources:
  definition:
    - source: history-of-japanese-art
      locator: p. 67
