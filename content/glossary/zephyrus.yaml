name: Zephyrus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the gentle West Wind of spring, who (in Ovid's Fasti) carried off the nymph Chloris and turned her into Flora.
description_md: |-
  Zephyrus, the gentle West Wind of spring, pursued the nymph [[chloris]] and turned her into [[flora]], goddess of flowers.

  **In art:** A bluish winged wind god grabbing a nymph from whose mouth flowers spill.

  **Famous works**

  - Botticelli, *Primavera* (right side) and *The Birth of Venus* (Zephyrus blowing Venus ashore) — [[artwork/primavera]]

  *From:* Greek mythology; Ovid, Fasti · Ancient Greek
