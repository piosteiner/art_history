definition: "The reign years of King Seongjong of Joseon (成宗, 성종), by which Korean sources date 1470–1495: 1470 is Seongjong 1, 1495 Seongjong 26."
description_md: |-
  **Seongjong** (成宗, 성종): the years of the reign of King Seongjong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1479 is Seongjong 10 (성종 10년). The year of the accession, 1470, counts as the first year.

  Before: [[yejong-reign-years|Yejong]]. After: [[yeonsangun-reign-years|Yeonsangun]].
