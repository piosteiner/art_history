description_md: '"Dieser Terminus, dessen Übersetzung "Welch einer Mensch" bedeutet, bezeichnet die Zurschaustellung von Jesus Christus mit Dornenkrone, Rohrstab, Purpurmantel und gefesselten Händen und bezieht sich auf den Ausspruch des Pilatus während der Verurteilung Jesu (Joh. 19,5)" aus Lexikon der Symbole und Attribute der Kunst von Hildegard Kretschmer, 12. Auflage 2019, S. 92'
