public_id: 113360
name: Jinheung of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 진흥왕
  - lang: ko-Hani
    role: alternative
    text: 眞興王
category: calendar
definition: "The reign years of King Jinheung of Silla (眞興王, 진흥왕), by which Korean histories date 540–576: 540 is Jinheung 1, 576 Jinheung 37."
description_md: |-
  **Jinheung** (眞興王, 진흥왕): the years of the reign of King Jinheung of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 549 is Jinheung 10 (진흥왕 10년). The year of the accession, 540, counts as the first year.

  Before: [[beopheung-silla-reign-years|Beopheung]]. After: [[jinji-silla-reign-years|Jinji]].
sources:
  definition:
    - source: dila-time-authority
