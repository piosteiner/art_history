name: Dazhbog
category: mythology and legend
definition: The generous Slavic god of the sun and good fortune, "the giving god"; old Russian writings call the Russian people his grandchildren.
description_md: |-
  Dazhbog, whose name means something like "the giving god", was a Slavic god of the sun and of good fortune. Old Russian writings call the Russian people his grandchildren. He brought warmth, light and plenty.

  *From:* Slavic religion · Slavic
