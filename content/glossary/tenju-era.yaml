definition: "Japanese era name (天授) for the years 1375–1381: 1375 is Tenju 1 (元年) and Tenju 7 is 1381."
description_md: |-
  **Tenju** (天授) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras,, proclaimed in 1375. Its years are counted in lunar years from the new year before the proclamation: 1375 is Tenju 1 (元年), 1381 its last year, Tenju 7. A Japanese source dates a year within it as "Tenju 2" (天授2年) rather than by a continuous count.

  Before: [[bunchu-era|Bunchū]]. After: [[kowa-era-1381|Kōwa]].
