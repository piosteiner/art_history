public_id: 113093
name: Baoying
names:
  - lang: zh
    role: original
    text: 寶應
category: calendar
definition: "Chinese era name (寶應) of the Tang for the years 762–763: 762 is Baoying 1 (元年) and Baoying 2 is 763."
description_md: |-
  **Baoying** (寶應) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 762 under Emperor Daizong (代宗). Its years are counted in lunar years: 762 is Baoying 1 (元年), 763 its last year, Baoying 2. A Chinese source dates a year within it as "Baoying 2" (寶應二年) rather than by a continuous count.

  Before: [[shangyuan-era-760|Shangyuan]]. After: [[guangde-era|Guangde]].
sources:
  definition:
    - source: dila-time-authority
