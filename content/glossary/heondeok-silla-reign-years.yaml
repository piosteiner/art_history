public_id: 113377
name: Heondeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 헌덕왕
  - lang: ko-Hani
    role: alternative
    text: 憲德王
category: calendar
parent: korean-calendar
definition: "The reign years of King Heondeok of Silla (憲德王, 헌덕왕), by which Korean histories date 809–826: 809 is Heondeok 1, 826 Heondeok 18."
description_md: |-
  **Heondeok** (憲德王, 헌덕왕): the years of the reign of King Heondeok of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 818 is Heondeok 10 (헌덕왕 10년). The year of the accession, 809, counts as the first year.

  Before: [[aejang-silla-reign-years|Aejang]]. After: [[heungdeok-silla-reign-years|Heungdeok]].
sources:
  definition:
    - source: dila-time-authority
