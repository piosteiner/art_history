name: Tianbao
names:
  - lang: zh
    role: original
    text: 天寶
category: calendar
definition: "Chinese era name (天寶) of the Tang for the years 742–756: 742 is Tianbao 1 (元年) and Tianbao 15 is 756."
description_md: |-
  **Tianbao** (天寶) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 742 under Emperor Xuanzong (玄宗). Its years are counted in lunar years: 742 is Tianbao 1 (元年), 756 its last year, Tianbao 15. A Chinese source dates a year within it as "Tianbao 2" (天寶二年) rather than by a continuous count.

  Before: [[kaiyuan-era|Kaiyuan]]. After: [[zhide-era|Zhide]].
sources:
  definition:
    - source: dila-time-authority
