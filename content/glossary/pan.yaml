definition: In Greek myth the goat-legged god of the wild, shepherds and flocks, who plays the panpipes; the Romans called him Faunus.
description_md: |-
  God of the wild, shepherds and flocks.

  **In art:** Goat legs, horns and a beard, playing the panpipes (*syrinx*). Satyrs and fauns look similar.

  **Famous works**

  - [[artist/luca-signorelli]], *The Education of Pan* (also called *The Realm of Pan*; formerly Kaiser-Friedrich-Museum, Berlin, destroyed by fire in 1945)
  - [[artist/arnold-bocklin]], *Pan in the Reeds* (Neue Pinakothek, Munich)

  *From:* Greek mythology · Ancient Greek
