public_id: 131011
name: Tinirau
category: mythology and legend
definition: A handsome Polynesian chief linked to the sea and fish, whose pet whale Tutunui was killed and eaten by Kae; he sent women to recognise Kae by his crooked teeth and bring him to justice.
description_md: |-
  Tinirau was a handsome chief linked to the sea and fish, and he had a pet whale named Tutunui. He lent the whale to a man named Kae to carry him home, but Kae killed and ate Tutunui. Tinirau sent a group of women to find Kae, recognise him by his overlapping teeth (by making him laugh), and bring him back, where Tinirau killed him.

  *From:* Polynesian tradition · Polynesian / Māori
