name: Huma
names: [Huma bird]
category: mythology and legend
definition: In Persian legend, the bird of fortune that never lands; anyone its shadow falls on is destined to become a king.
description_md: |-
  The Huma is a legendary bird said to fly high above the earth and never land. Anyone its shadow falls on is destined to become a king. In some tales, it is also said that whoever kills a Huma dies within forty days.

  *From:* Persian legend · Persian
