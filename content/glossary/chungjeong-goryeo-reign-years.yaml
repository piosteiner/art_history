public_id: 113332
name: Chungjeong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 충정왕
  - lang: ko-Hani
    role: alternative
    text: 忠定王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chungjeong of Goryeo (忠定王, 충정왕), by which Korean histories date 1349–1351: 1349 is Chungjeong 1, 1351 Chungjeong 3."
description_md: |-
  **Chungjeong** (忠定王, 충정왕): the years of the reign of King Chungjeong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1351 is Chungjeong 3 (충정왕 3년). The year of the accession, 1349, counts as the first year.

  Before: [[chungmok-goryeo-reign-years|Chungmok]]. After: [[gongmin-goryeo-reign-years|Gongmin]].
sources:
  definition:
    - source: dila-time-authority
