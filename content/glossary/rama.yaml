name: Rama
category: religion
definition: The divine prince of the Ramayana, an incarnation of Vishnu, who was exiled for fourteen years, rescued Sita from Ravana and returned to rule justly.
description_md: |-
  Rama is the hero of the Ramayana, an incarnation of the god Vishnu, who was exiled from his kingdom for fourteen years, rescued Sita from [[ravana]] and returned to rule justly. Around him stand the great Hindu gods: Brahma, Vishnu and Shiva, associated with creation, preservation and transformation, and goddesses such as Durga, Lakshmi, Saraswati and Kali.

  **Held sacred today:** Hinduism is a living religion with over a billion followers, and these are its central gods.

  *From:* Ramayana · Hindu
