name: Andromeda
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the Ethiopian princess chained to a rock as a sacrifice to a sea monster and rescued by Perseus, who married her.
description_md: |-
  An Ethiopian princess chained to a rock as a sacrifice to a sea monster, because her mother Cassiopeia had boasted that she (or, in some versions, Andromeda) was more beautiful than the sea nymphs. [[perseus]] rescued her and married her.

  **In art:** A nude woman chained to a rock, with a monster rising from the sea and Perseus swooping in.

  **Famous works**

  - Rubens, *Perseus Freeing Andromeda* (Hermitage)
  - [[artist/titian]], *Perseus and Andromeda* (Wallace Collection)
  - Edward Poynter, *Andromeda*

  *From:* Ovid, Metamorphoses · Ancient Greek (Ethiopian princess)
