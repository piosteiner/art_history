definition: In Greek myth the ten-year war in which Zeus and the Olympians overthrew Cronus and the Titans.
description_md: |-
  The Titanomachy was the ten-year war in which [[zeus]] and the Olympians overthrew [[cronus]] and the Titans. The Gigantomachy was a later war against the Giants, children of [[gaia]], which the gods won with the help of [[heracles]].

  **In art:** Gods fighting enormous figures, and collapsing rocks and buildings.

  **Famous works**

  - Cornelis van Haarlem, *The Fall of the Titans* (Copenhagen)

  *From:* Greek mythology · Ancient Greek
