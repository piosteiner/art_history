definition: In Greek myth the hero who sailed on the ship Argo with the Argonauts to fetch the Golden Fleece from Colchis, helped by the sorceress Medea.
description_md: |-
  Jason sailed on the ship *Argo* with heroes like [[heracles]], [[orpheus]], and [[castor-and-pollux]], to fetch the Golden Fleece from Colchis. He succeeded with the help of the sorceress [[medea]], who later took terrible revenge when he left her.

  **In art:** A hero holding or taking the golden ram's fleece from a tree guarded by a dragon, often with Medea.

  **Famous works**

  - Gustave Moreau, *Jason and Medea* (Musée d'Orsay)
  - Thorvaldsen, *Jason with the Golden Fleece* (Thorvaldsens Museum, Copenhagen)
  - Waterhouse, *Jason and Medea*

  *From:* Greek mythology · Ancient Greek
