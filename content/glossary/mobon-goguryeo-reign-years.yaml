public_id: 113279
name: Mobon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 모본왕
  - lang: ko-Hani
    role: alternative
    text: 慕本王
category: calendar
definition: "The reign years of King Mobon of Goguryeo (慕本王, 모본왕), by which Korean histories date 48–53: 48 is Mobon 1, 53 Mobon 6."
description_md: |-
  **Mobon** (慕本王, 모본왕): the years of the reign of King Mobon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 53 is Mobon 6 (모본왕 6년). The year of the accession, 48, counts as the first year.

  Before: [[minjung-goguryeo-reign-years|Minjung]]. After: [[taejodae-goguryeo-reign-years|Taejodae]].
sources:
  definition:
    - source: dila-time-authority
