definition: "Chinese era name (嘉靖) of the Ming for the years 1522–1566: 1522 is Jiajing 1 (元年) and Jiajing 45 is 1566."
description_md: |-
  **Jiajing** (嘉靖) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1522. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Jiajing Emperor. Its years are counted in lunar years: 1522 is Jiajing 1 (元年), 1566 its last year, Jiajing 45. A Chinese source dates a year within it as "Jiajing 2" (嘉靖二年) rather than by a continuous count.

  Before: [[zhengde-era|Zhengde]]. After: [[longqing-era|Longqing]].
