public_id: 131081
name: Memnon
category: mythology and legend
definition: A king of the Ethiopians, son of Eos, the goddess of dawn, who fought for Troy in armour made by Hephaestus and was killed by Achilles; the morning dew is said to be his mother's tears.
description_md: |-
  Memnon was the son of [[eos]], goddess of the dawn, and a king of the Ethiopians. He came to defend Troy wearing armour made by the god [[hephaestus]] and was one of the greatest warriors on the Trojan side. [[achilles]] killed him in single combat. His mother was so heartbroken that the morning dew is said to be her tears, shed for him every dawn.

  *From:* Greek mythology (Trojan cycle) · Ancient Greek
