name: Neang Neak
names: [Nagi Soma, Soma]
category: mythology and legend
definition: In the Khmer founding myth, the naga princess (Nagi Soma) who married Preah Thong; her father drank up the waters and gave the dried land, Cambodia, as her dowry.
description_md: |-
  Neang Neak (also Nagi Soma) was the daughter of the naga king, ruler of serpent beings who lived beneath the waters. When she married [[preah-thong]], her father drank up all the water covering the land and gave it to the couple as a dowry. That dried land became Cambodia. In some versions, Neang Neak used the power of her jewel to raise a protective barrier around the new kingdom.

  *From:* Cambodian founding myth · Khmer
