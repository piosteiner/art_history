name: Yongxi
names:
  - lang: zh
    role: original
    text: 雍熙
category: calendar
parent: chinese-calendar
definition: "Chinese era name (雍熙) of the Northern Song for the years 984–988: 984 is Yongxi 1 (元年) and Yongxi 5 is 988."
description_md: |-
  **Yongxi** (雍熙) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 984 under Emperor Taizong (太宗). Its years are counted in lunar years: 984 is Yongxi 1 (元年), 988 its last year, Yongxi 5. A Chinese source dates a year within it as "Yongxi 2" (雍熙二年) rather than by a continuous count.

  Before: [[taiping-xingguo-era|Taiping Xingguo]]. After: [[duangong-era|Duangong]].
sources:
