category: calendar
definition: "Japanese era name (万寿) for the years 1024–1027: 1024 is Manju 1 (元年) and Manju 4 is 1027."
description_md: |-
  **Manju** (万寿) is a Japanese era name ([[nengo]]), proclaimed in 1024. Its years are counted in lunar years from the new year before the proclamation: 1024 is Manju 1 (元年), 1027 its last year, Manju 4. A Japanese source dates a year within it as "Manju 2" (万寿2年) rather than by a continuous count.

  Before: [[jian-era|Jian]]. After: [[chogen-era|Chōgen]].
