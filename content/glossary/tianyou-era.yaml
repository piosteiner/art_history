name: Tianyou
names:
  - lang: zh
    role: original
    text: 天祐
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天祐) of the Tang for the years 904–907: 904 is Tianyou 1 (元年) and Tianyou 4 is 907."
description_md: |-
  **Tianyou** (天祐) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 904 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 904 is Tianyou 1 (元年), 907 its last year, Tianyou 4. A Chinese source dates a year within it as "Tianyou 2" (天祐二年) rather than by a continuous count.

  Before: [[tianfu-era-901|Tianfu]].
sources:
  definition:
    - source: dila-time-authority
