public_id: 113323
name: Huijong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 희종
  - lang: ko-Hani
    role: alternative
    text: 熙宗
category: calendar
definition: "The reign years of King Huijong of Goryeo (熙宗, 희종), by which Korean histories date 1205–1212: 1205 is Huijong 1, 1212 Huijong 8."
description_md: |-
  **Huijong** (熙宗, 희종): the years of the reign of King Huijong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1212 is Huijong 8 (희종 8년). The year of the accession, 1205, counts as the first year.

  Before: [[sinjong-goryeo-reign-years|Sinjong]]. After: [[gangjong-goryeo-reign-years|Gangjong]].
sources:
  definition:
    - source: dila-time-authority
