public_id: 131493
name: Santa Compaña
category: mythology and legend
definition: A procession of the dead in Galician folklore, souls in hooded robes walking through the woods at night, led by a living person.
description_md: |-
  Souls in hooded robes, carrying candles, walk through the woods at night, led by a living person who carries a cross or a cauldron of holy water (sometimes both). That person must lead the procession every night until they pass the cross to someone else.

  *From:* folklore · Galician
