definition: "Japanese era name (天長) for the years 824–833: 824 is Tenchō 1 (元年) and Tenchō 10 is 833."
description_md: |-
  **Tenchō** (天長) is a Japanese era name ([[nengo]]), proclaimed in 824. Its years are counted in lunar years from the new year before the proclamation: 824 is Tenchō 1 (元年), 833 its last year, Tenchō 10. A Japanese source dates a year within it as "Tenchō 2" (天長2年) rather than by a continuous count.

  Before: [[konin-era|Kōnin]]. After: [[jowa-era|Jōwa]].
