public_id: 113106
name: Huichang
names:
  - lang: zh
    role: original
    text: 會昌
category: calendar
definition: "Chinese era name (會昌) of the Tang for the years 841–847: 841 is Huichang 1 (元年) and Huichang 7 is 847."
description_md: |-
  **Huichang** (會昌) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 841 under Emperor Wuzong (武宗). Its years are counted in lunar years: 841 is Huichang 1 (元年), 847 its last year, Huichang 7. A Chinese source dates a year within it as "Huichang 2" (會昌二年) rather than by a continuous count.

  Before: [[kaicheng-era|Kaicheng]]. After: [[dazhong-era|Dazhong]].
sources:
  definition:
    - source: dila-time-authority
