definition: "Chinese era name (道光) of the Qing for the years 1821–1850: 1821 is Daoguang 1 (元年) and Daoguang 30 is 1850."
description_md: |-
  **Daoguang** (道光) is a Chinese era name ([[nianhao]]) of the Qing, proclaimed in 1821. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Daoguang Emperor. Its years are counted in lunar years: 1821 is Daoguang 1 (元年), 1850 its last year, Daoguang 30. A Chinese source dates a year within it as "Daoguang 2" (道光二年) rather than by a continuous count.

  Before: [[jiaqing-era|Jiaqing]]. After: [[xianfeng-era|Xianfeng]].
