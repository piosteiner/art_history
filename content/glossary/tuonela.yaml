name: Tuonela
names: [Swan of Tuonela, Manala]
category: mythology and legend
definition: The Finnish land of the dead, across a black river on which a sacred black swan swims; Lemminkäinen was killed trying to shoot the swan, the subject of Sibelius's The Swan of Tuonela.
description_md: |-
  Tuonela lies across a black river, and a sacred black swan swims on it. [[lemminkainen]] was killed while trying to shoot the swan. Sibelius wrote a famous piece of music, *The Swan of Tuonela*.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
