definition: The Genesis story of a tower meant to reach heaven, stopped when God confused the builders' language and scattered them.
description_md: |-
  After the Flood, people tried to build a tower reaching up to heaven. God stopped them by confusing their language so they could no longer understand each other, and scattered them across the earth.

  **In art:** A gigantic spiralling tower under construction, swarming with tiny workers.

  **Famous works**

  - Pieter Bruegel the Elder, *The Tower of Babel* (Vienna and Rotterdam)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
