public_id: 131244
name: The Crow and the Pitcher
category: mythology and legend
definition: Aesop's fable of a thirsty crow that drops pebbles into a jug until the water rises high enough to drink.
description_md: |-
  A thirsty crow found a jug with only a little water at the bottom. It dropped in pebbles one by one until the water rose high enough to drink. Scientists have since found that real rooks, close relatives of crows, can solve this puzzle.

  *From:* Aesop's Fables · Ancient Greek
