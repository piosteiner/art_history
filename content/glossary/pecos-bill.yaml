public_id: 131645
name: Pecos Bill
category: mythology and legend
definition: A Texas cowboy of American tall tales (invented by Tex O'Reilly in 1923), raised by coyotes, who rode a mountain lion and a tornado.
description_md: |-
  He fell out of his family's wagon as a baby and was raised by coyotes. He rode a mountain lion, used a rattlesnake as a lasso, and once rode a tornado until it rained itself out.

  *From:* American tall tales · American
