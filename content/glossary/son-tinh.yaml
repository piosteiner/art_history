name: Sơn Tinh
category: mythology and legend
definition: The Mountain Spirit of Vietnamese legend, who won Princess Mỵ Nương and raises the mountains against the floods of his rival Thủy Tinh.
description_md: |-
  Both wanted to marry Princess Mỵ Nương. The king said whoever brought the wedding gifts first would win, and Sơn Tinh arrived first. The furious [[thuy-tinh]] sent floods, and Sơn Tinh raised the mountains higher. Every year, the floods in northern Vietnam are said to be Thủy Tinh's revenge.

  *From:* Vietnamese legend · Vietnamese
