public_id: 113329
name: Chungsuk of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 충숙왕
  - lang: ko-Hani
    role: alternative
    text: 忠肅王
category: calendar
definition: "The reign years of King Chungsuk of Goryeo (忠肅王, 충숙왕), by which Korean histories date 1314–1330 and 1332–1339: 1314 is Chungsuk 1, 1330 Chungsuk 17."
description_md: |-
  **Chungsuk** (忠肅王, 충숙왕): the years of the reign of King Chungsuk of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1323 is Chungsuk 10 (충숙왕 10년). The year of the accession, 1314, counts as the first year. King Chungsuk reigned twice, 1314–1330 and 1332–1339; the second reign counts its years anew.

  Before: [[chungseon-goryeo-reign-years|Chungseon]]. After: [[chunghye-goryeo-reign-years|Chunghye]].
sources:
  definition:
    - source: dila-time-authority
