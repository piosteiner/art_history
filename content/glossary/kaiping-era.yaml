    role: original
    text: 開平
category: calendar
parent: chinese-calendar
definition: "Chinese era name (開平) of the Later Liang for the years 907–911: 907 is Kaiping 1 (元年) and Kaiping 5 is 911."
description_md: |-
  **Kaiping** (開平) is a Chinese era name ([[nianhao]]) of the Later Liang, proclaimed in 907 under Emperor Taizu (太祖). Its years are counted in lunar years: 907 is Kaiping 1 (元年), 911 its last year, Kaiping 5. A Chinese source dates a year within it as "Kaiping 2" (開平二年) rather than by a continuous count.

  After: [[qianhua-era|Qianhua]].
sources:
