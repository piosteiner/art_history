definition: "Liberty personified: a woman in a Phrygian cap, often with a torch or broken chains."
description_md: |-
  Common figures in political and moral allegories.

  **In art:** Liberty: a woman in a Phrygian cap (identified with the pileus, the cap of freed Roman slaves, and worn in the French Revolution), often with a torch or broken chains.

  **Famous works**

  - [[artist/eugene-delacroix]], *Liberty Leading the People* (1830, Louvre, Paris) — [[artwork/liberty-leading-the-people]]
  - [[artist/frederic-auguste-bartholdi]], *Liberty Enlightening the World* (Statue of Liberty, dedicated 1886, Liberty Island, New York) — [[artwork/statue-of-liberty]]

  *From:* European
