definition: "Japanese era name (朱鳥) for the year 686: 686 is Shuchō 1 (元年), its only year."
description_md: |-
  **Shuchō** (朱鳥) is a Japanese era name ([[nengo]]), proclaimed in 686. Its years are counted in lunar years from the new year before the proclamation: 686 is Shuchō 1 (元年), its only year.

  Before: [[hakuchi-era|Hakuchi]]. After: [[taiho-era|Taihō]].
