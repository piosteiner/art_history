definition: "Japanese era name (正平) for the years 1346–1370 of the Southern Court: 1346 is Shōhei 1 (元年) and Shōhei 25 is 1370."
description_md: |-
  **Shōhei** (正平) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras, proclaimed in 1346. Its years are counted in lunar years from the new year before the proclamation: 1346 is Shōhei 1 (元年), 1370 its last year, Shōhei 25. A Japanese source dates a year within it as "Shōhei 2" (正平2年) rather than by a continuous count.

  Before: [[kokoku-era|Kōkoku]]. After: [[kentoku-era|Kentoku]].
