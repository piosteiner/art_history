name: Kallikantzaroi
names: [Kallikantzaros]
category: mythology and legend
definition: Christmas goblins of Greek folklore who saw at the tree holding up the earth and come to the surface for the twelve days of Christmas.
description_md: |-
  All year, they live underground sawing at the tree that holds up the earth. Just before they cut through, Christmas comes, and they climb up to the surface for the twelve days of Christmas to cause trouble. When they go back down, the tree has healed.

  *From:* folklore · Greek
