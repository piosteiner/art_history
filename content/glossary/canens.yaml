public_id: 131283
name: Canens
category: mythology and legend
definition: In Ovid's Metamorphoses, the wife of King Picus, whose singing could move rocks and trees; searching for her husband, she sang her grief until she faded into thin air.
description_md: |-
  The witch [[circe]] fell in love with King [[picus]], and when he turned her down, she turned him into a woodpecker. His wife Canens, whose singing could move rocks and trees, wandered searching for him for six days, then sang her grief until she faded into thin air.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
