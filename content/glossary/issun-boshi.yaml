name: Issun-bōshi
names: [Issun-boshi, One-Inch Boy]
category: mythology and legend
definition: The one-inch boy of Japanese folktale who travelled to the capital in a rice bowl with a needle for a sword, stabbed an oni from inside its stomach and grew to full size with its magic mallet.
description_md: |-
  Issun-bōshi was born no bigger than a thumb. He set off to the capital using a rice bowl as a boat, a chopstick as an oar and a sewing needle as a sword. When an oni attacked the princess he served, it swallowed him whole, so he stabbed it from inside until it spat him out and fled. It dropped its magic mallet, and with it he grew to full size (in one variant the princess wields it).

  *From:* folktale · Japanese
