public_id: 113384
name: Gyeongmun of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 경문왕
  - lang: ko-Hani
    role: alternative
    text: 景文王
category: calendar
definition: "The reign years of King Gyeongmun of Silla (景文王, 경문왕), by which Korean histories date 861–875: 861 is Gyeongmun 1, 875 Gyeongmun 15."
description_md: |-
  **Gyeongmun** (景文王, 경문왕): the years of the reign of King Gyeongmun of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 870 is Gyeongmun 10 (경문왕 10년). The year of the accession, 861, counts as the first year.

  Before: [[heonan-silla-reign-years|Heonan]]. After: [[heongang-silla-reign-years|Heongang]].
sources:
  definition:
    - source: dila-time-authority
