name: Dahut
names: [Ahes]
category: mythology and legend
definition: The wild daughter of King Gradlon in Breton legend, who stole the key of the dyke gate for her lover, in some versions the Devil in disguise, and so let the sea swallow the city of Ys.
description_md: |-
  Ys was a beautiful city protected from the sea by a dyke with a gate. King Gradlon's wild daughter Dahut stole the key for her lover, in some versions the Devil in disguise, and opened the gate. The sea swallowed the city. It's said that you can still hear its church bells under the waves.

  *From:* legend of Ys · Breton
