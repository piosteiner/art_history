public_id: 113252
name: Chaekgye of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 책계왕
  - lang: ko-Hani
    role: alternative
    text: 責稽王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chaekgye of Baekje (責稽王, 책계왕), by which Korean histories date 286–298: 286 is Chaekgye 1, 298 Chaekgye 13."
description_md: |-
  **Chaekgye** (責稽王, 책계왕): the years of the reign of King Chaekgye of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 295 is Chaekgye 10 (책계왕 10년). The year of the accession, 286, counts as the first year.

  Before: [[goi-baekje-reign-years|Goi]]. After: [[bunseo-baekje-reign-years|Bunseo]].
sources:
  definition:
    - source: dila-time-authority
