name: Allerleirauh
names: [All-Kinds-of-Fur]
category: mythology and legend
definition: In the Grimms' fairy tale, a princess who flees from her father in a cloak made of a thousand kinds of fur and works as a scullery maid.
description_md: |-
  She ran away from her own father, who wanted to marry her, wearing a coat of a thousand kinds of fur and blackened with soot. She worked as a scullery maid in another king's kitchen, until, after finding her golden ring, spinning wheel and reel hidden in his soup, he recognised her by the ring he had slipped onto her finger while they danced.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
