name: Girim Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 기림이사금
  - lang: ko-Hani
    role: alternative
    text: 基臨尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Girim Isageum of Silla (基臨尼師今, 기림이사금), by which Korean histories date 298–310: 298 is Girim Isageum 1, 310 Girim Isageum 13."
description_md: |-
  **Girim Isageum** (基臨尼師今, 기림이사금): the years of the reign of Girim Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 307 is Girim Isageum 10 (기림이사금 10년). The year of the accession, 298, counts as the first year.

  Before: [[yurye-isageum-silla-reign-years|Yurye Isageum]]. After: [[heulhae-isageum-silla-reign-years|Heulhae Isageum]].
sources:
