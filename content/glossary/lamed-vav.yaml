name: Lamed Vav
names: [Tzadikim Nistarim, the Thirty-Six Righteous]
category: mythology and legend
definition: The thirty-six hidden righteous people of Jewish tradition whose goodness keeps the world from being destroyed in every generation.
description_md: |-
  In every generation, there are thirty-six righteous people whose goodness keeps the world from being destroyed. They're humble and hidden, often poor craftsmen, and don't know they're among the thirty-six themselves.

  *From:* Jewish tradition · Jewish
