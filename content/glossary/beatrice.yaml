definition: The woman Dante loved from afar, who guides him through Paradise in the Divine Comedy.
description_md: |-
  [[person/dante-alighieri]], the poet of the *Divine Comedy* (early 14th century), described his journey through Hell (*Inferno*), Purgatory and Paradise. Beatrice, the woman he loved from afar, guides him through Paradise.

  **In art:** A young woman meeting the poet, often in a Florentine street.

  **Famous works**

  - Henry Holiday, *Dante and Beatrice* (1883; Walker Art Gallery, Liverpool)

  *From:* Dante, Divine Comedy · Italian
