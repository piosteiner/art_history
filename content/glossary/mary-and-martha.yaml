name: Mary and Martha
names: [Christ in the House of Martha and Mary, Martha of Bethany, Mary of Bethany]
category: iconography
definition: "The sisters of Lazarus: Martha worked in the kitchen while Mary sat listening at Jesus's feet, \"the better part\"."
description_md: |-
  Sisters of Lazarus. When Jesus visited, Martha worked busily in the kitchen while Mary sat listening at his feet. Jesus said Mary had chosen "the better part".

  **In art:** A kitchen scene with a woman preparing food, and Christ teaching in the background.

  **Famous works**

  - [[artist/diego-velazquez]], *Christ in the House of Martha and Mary* (National Gallery, London)
  - [[artist/johannes-vermeer]], *Christ in the House of Martha and Mary* (Edinburgh)

  *From:* New Testament, Gospels · Christian
