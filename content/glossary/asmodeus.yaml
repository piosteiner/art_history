name: Asmodeus
names: [Ashmedai]
category: mythology and legend
definition: The king of demons in Jewish legend, whom King Solomon captured to help build the Temple and who for a time ruled in Solomon's place.
description_md: |-
  According to the Talmud, King [[person/solomon]] captured Ashmedai with a chain and a ring engraved with God's name, and made him help build the Temple. Ashmedai tricked Solomon into giving him the ring, threw him four hundred parasangs away, and ruled as king in his place until Solomon got it back.

  *From:* Talmud · Jewish
