public_id: 113084
name: Jingyun
names:
  - lang: zh
    role: original
    text: 景雲
category: calendar
definition: "Chinese era name (景雲) of the Tang for the years 710–712: 710 is Jingyun 1 (元年) and Jingyun 3 is 712."
description_md: |-
  **Jingyun** (景雲) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 710 under Emperor Ruizong (睿宗). Its years are counted in lunar years: 710 is Jingyun 1 (元年), 712 its last year, Jingyun 3. A Chinese source dates a year within it as "Jingyun 2" (景雲二年) rather than by a continuous count.

  Before: [[tanglong-era|Tanglong]]. After: [[taiji-era|Taiji]].
sources:
  definition:
    - source: dila-time-authority
