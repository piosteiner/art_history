public_id: 131491
name: Basajaun
category: mythology and legend
definition: The hairy "lord of the forest" of Basque legend, a giant wild man who protects flocks in the Pyrenees.
description_md: |-
  A giant, hairy wild man who protects flocks of sheep, warning shepherds of storms and wolves. In legend, he knew the secrets of farming, sawing, the mill axle and welding, and humans (or the trickster San Martin Txiki) stole them from him.

  *From:* folklore · Basque
