public_id: 107502
name: Niō
names:
  - lang: ja
    role: original
    text: "{仁王|におう}"
category: iconography
definition: "Kongō Rikishi: a pair of muscular guardians at a temple gate, one with open mouth (Agyō), one with closed (Ungyō)."
description_md: |-
  The two Niō (Kongōrikishi) are fierce, muscular gate guardians, one with an open mouth and one closed, their mouths forming "a" and "um" (hūṃ), the first and last sounds of the Sanskrit alphabet (Siddham script).

  **In art:** Near-naked muscular giants in dynamic poses at temple gates.

  **Famous works**

  - [[artist/unkei]] and [[artist/kaikei]] (with Jōkaku and Tankei), *Niō* (Nandaimon Gate, Tōdai-ji, Nara, 1203)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
