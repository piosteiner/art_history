name: Yifeng
names:
  - lang: zh
    role: original
    text: 儀鳳
category: calendar
parent: chinese-calendar
definition: "Chinese era name (儀鳳) of the Tang for the years 676–679: 676 is Yifeng 1 (元年) and Yifeng 4 is 679."
description_md: |-
  **Yifeng** (儀鳳) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 676 under Emperor Gaozong (高宗). Its years are counted in lunar years: 676 is Yifeng 1 (元年), 679 its last year, Yifeng 4. A Chinese source dates a year within it as "Yifeng 2" (儀鳳二年) rather than by a continuous count.

  Before: [[shangyuan-era|Shangyuan]]. After: [[diaolu-era|Diaolu]].
sources:
  definition:
    - source: dila-time-authority
