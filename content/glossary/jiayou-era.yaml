public_id: 113010
name: Jiayou
names:
  - lang: zh
    role: original
    text: 嘉祐
category: calendar
definition: "Chinese era name (嘉祐) of the Northern Song for the years 1056–1063: 1056 is Jiayou 1 (元年) and Jiayou 8 is 1063."
description_md: |-
  **Jiayou** (嘉祐) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1056 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1056 is Jiayou 1 (元年), 1063 its last year, Jiayou 8. A Chinese source dates a year within it as "Jiayou 2" (嘉祐二年) rather than by a continuous count.

  Before: [[zhihe-era|Zhihe]]. After: [[zhiping-era|Zhiping]].
sources:
  definition:
    - source: dila-time-authority
