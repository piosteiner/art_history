public_id: 131236
name: The Lion and the Mouse
category: mythology and legend
definition: "Aesop's fable of a lion who spares a mouse and is later freed from a hunter's net by it: even the small can help the great."
description_md: |-
  A lion spared a mouse that woke him. Later, the lion was caught in a hunter's net, and the mouse gnawed through the ropes to set him free. Moral: even the small can help the great.

  *From:* Aesop's Fables · Ancient Greek
