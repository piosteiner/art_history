name: Wenming
names:
  - lang: zh
    role: original
    text: 文明
category: calendar
definition: "Chinese era name (文明) of the Tang for the year 684: 684 is Wenming 1 (元年), its only year."
description_md: |-
  **Wenming** (文明) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 684 under Emperor Ruizong (睿宗). Its years are counted in lunar years: 684 is Wenming 1 (元年), its only year.

  Before: [[sisheng-era|Sisheng]]. After: [[guangzhai-era|Guangzhai]].
sources:
