definition: In Greek myth the nine daughters of Zeus and Mnemosyne (Memory), goddesses of the arts, usually shown with Apollo on Mount Parnassus.
description_md: |-
  The nine daughters of [[zeus]] and Mnemosyne (Memory), goddesses of the arts. Calliope (epic poetry), Clio (history), Erato (love poetry), Euterpe (music), Melpomene (tragedy), Polyhymnia (sacred song), Terpsichore (dance), Thalia (comedy) and Urania (astronomy).

  **In art:** Usually with [[apollo]] on Mount Parnassus, each with her own attribute: Clio a scroll or trumpet, Melpomene a tragic mask, Thalia a comic mask, Urania a globe, Terpsichore a lyre.

  **Famous works**

  - [[artist/raphael]], *Parnassus* (Vatican)
  - Vermeer, *The Art of Painting* (Kunsthistorisches Museum, Vienna; the model posed as Clio) — [[artwork/the-art-of-painting]]

  *From:* Greek mythology · Ancient Greek
