public_id: 113117
name: Qianning
names:
  - lang: zh
    role: original
    text: 乾寧
category: calendar
definition: "Chinese era name (乾寧) of the Tang for the years 894–898: 894 is Qianning 1 (元年) and Qianning 5 is 898."
description_md: |-
  **Qianning** (乾寧) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 894 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 894 is Qianning 1 (元年), 898 its last year, Qianning 5. A Chinese source dates a year within it as "Qianning 2" (乾寧二年) rather than by a continuous count.

  Before: [[jingfu-era|Jingfu]]. After: [[guanghua-era|Guanghua]].
sources:
  definition:
    - source: dila-time-authority
