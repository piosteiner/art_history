category: calendar
definition: "Japanese era name (康治) for the years 1142–1143: 1142 is Kōji 1 (元年) and Kōji 2 is 1143."
description_md: |-
  **Kōji** (康治) is a Japanese era name ([[nengo]]), proclaimed in 1142. Its years are counted in lunar years from the new year before the proclamation: 1142 is Kōji 1 (元年), 1143 its last year, Kōji 2. A Japanese source dates a year within it as "Kōji 2" (康治2年) rather than by a continuous count.

  Before: [[eiji-era|Eiji]]. After: [[tenyo-era|Ten'yō]].
