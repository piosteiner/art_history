public_id: 113378
name: Heungdeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 흥덕왕
  - lang: ko-Hani
    role: alternative
    text: 興德王
category: calendar
definition: "The reign years of King Heungdeok of Silla (興德王, 흥덕왕), by which Korean histories date 826–836: 826 is Heungdeok 1, 836 Heungdeok 11."
description_md: |-
  **Heungdeok** (興德王, 흥덕왕): the years of the reign of King Heungdeok of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 835 is Heungdeok 10 (흥덕왕 10년). The year of the accession, 826, counts as the first year.

  Before: [[heondeok-silla-reign-years|Heondeok]]. After: [[huigang-silla-reign-years|Huigang]].
sources:
  definition:
    - source: dila-time-authority
