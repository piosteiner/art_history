name: Nisse
names: [Tomte]
category: mythology and legend
definition: A little bearded farm gnome in a red cap of Scandinavian folklore, who looks after farm and house and must be given porridge at Christmas.
description_md: |-
  A small, old, bearded man who lives on a farm and looks after the animals and the house. On Christmas Eve, he must be given a bowl of porridge with butter. If he's forgotten or insulted, he plays tricks or leaves, and the farm's luck leaves with him.

  *From:* folklore · Scandinavian
