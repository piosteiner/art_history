definition: The Noh play of a heavenly maiden whose feather robe a fisherman finds at Miho no Matsubara and returns in exchange for a heavenly dance.
description_md: |-
  A fisherman found a heavenly maiden's feather robe hanging on a pine tree at Miho no Matsubara. Without it, she couldn't return to heaven. He gave it back in exchange for a heavenly dance. It's a famous [[noh-play]].

  **In art:** A celestial woman dancing in the air above a pine-lined beach, with [[mount-fuji]] behind.

  **Famous works**

  - *Noh masks and costumes*
  - *Edo and Meiji period prints*

