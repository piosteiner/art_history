definition: An installation of 200 painted hollow log coffins by 43 artists from Ramingining (1987–1988), commemorating the Aboriginal people who died defending their land since 1788.
description_md: |-
  An installation of 200 hollow log coffins (*dupun*) painted by 43 artists from Ramingining in Arnhem Land, for Australia's 1988 bicentenary. It commemorates all the Aboriginal people who died defending their land since 1788. One pole for each year from 1788 to 1988. Conceived by Djon Mundine; artists include David Malangi and George Milpurrurru.

  **Famous works**

  - *The Aboriginal Memorial* (1987–1988, National Gallery of Australia, Canberra)

  **Held sacred today:** Aboriginal and Torres Strait Islander visitors are warned that this page contains names and images of deceased persons.

  *From:* Ramingining artists, Arnhem Land
