definition: In Greek myth, the Athenian princess carried off by Boreas, the North Wind.
description_md: |-
  [[boreas]], the cold North Wind, carried off the Athenian princess Orithyia.

  **In art:** A winged, wild-haired old man flying off with a struggling woman.

  **Famous works**

  - Rubens, *Boreas Abducting Oreithyia* (Gemäldegalerie der Akademie der bildenden Künste, Vienna)
  - Evelyn De Morgan, *Boreas and Oreithyia*

  *From:* Ovid, Metamorphoses · Ancient Greek
