name: Lorelei
category: mythology and legend
also_in: [iconography]
definition: A siren of German Romantic poetry, first in Clemens Brentano's ballad of 1801, who sits on a high rock on the Rhine combing her golden hair and singing, distracting boatmen, who are wrecked on the rocks.
description_md: |-
  The Lorelei is a siren who sits on a high rock on the Rhine combing her golden hair and singing, distracting boatmen, who are wrecked on the rocks; the figure comes from Clemens Brentano's ballad of 1801 and was made famous by Heinrich Heine's poem "Die Lorelei" (1824).

  **In art:** A golden-haired woman on a cliff above the river.

  **Famous works**

  - Carl Joseph Begas, *Die Lureley* (1835, Begas Haus, Heinsberg)

  *From:* Heinrich Heine, Die Lorelei · German
