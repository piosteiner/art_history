definition: "Japanese era name (弘安) for the years 1278–1287: 1278 is Kōan 1 (元年) and Kōan 10 is 1287."
description_md: |-
  **Kōan** (弘安) is a Japanese era name ([[nengo]]), proclaimed in 1278. Its years are counted in lunar years from the new year before the proclamation: 1278 is Kōan 1 (元年), 1287 its last year, Kōan 10. A Japanese source dates a year within it as "Kōan 2" (弘安2年) rather than by a continuous count.

  Before: Kenji. After: [[shoo-era|Shōō]].
