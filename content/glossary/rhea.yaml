definition: In Greek myth a Titaness and mother of the Olympians, who saved the baby Zeus; merged with Cybele, the Great Mother from Anatolia.
description_md: |-
  A Titaness, mother of the Olympians. She saved the baby [[zeus]] by giving [[cronus]] a stone wrapped in swaddling clothes to swallow instead. Merged with Cybele, the Great Mother from Anatolia.

  **In art:** A matron with a turreted crown (city walls), in a chariot drawn by lions.

  **Famous works**

  - Rubens (workshop), *Cybele* designs
  - *Cibeles Fountain* (Madrid)

  *From:* Greek mythology · Ancient Greek
