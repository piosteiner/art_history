public_id: 113255
name: Gye of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 계왕
  - lang: ko-Hani
    role: alternative
    text: 契王
category: calendar
definition: "The reign years of King Gye of Baekje (契王, 계왕), by which Korean histories date 344–346: 344 is Gye 1, 346 Gye 3."
description_md: |-
  **Gye** (契王, 계왕): the years of the reign of King Gye of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 346 is Gye 3 (계왕 3년). The year of the accession, 344, counts as the first year.

  Before: [[biryu-baekje-reign-years|Biryu]]. After: [[geunchogo-baekje-reign-years|Geunchogo]].
sources:
  definition:
    - source: dila-time-authority
