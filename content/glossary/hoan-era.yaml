definition: "Japanese era name (保安) for the years 1120–1124: 1120 is Hōan 1 (元年) and Hōan 5 is 1124."
description_md: |-
  **Hōan** (保安) is a Japanese era name ([[nengo]]), proclaimed in 1120. Its years are counted in lunar years from the new year before the proclamation: 1120 is Hōan 1 (元年), 1124 its last year, Hōan 5. A Japanese source dates a year within it as "Hōan 2" (保安2年) rather than by a continuous count.

  Before: Gen'ei. After: [[tenji-era|Tenji]].
