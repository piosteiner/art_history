definition: In Greek myth the god of war, violence and courage, and Aphrodite's lover; the Romans called him Mars.
description_md: |-
  God of war, violence and courage, and [[aphrodite]]'s lover.

  **In art:** An armoured warrior with helmet, spear and shield. Often shown disarmed and asleep next to Venus, as "love conquers war".

  **Famous works**

  - *Ludovisi Ares* (Palazzo Altemps, Rome)
  - Botticelli, *Venus and Mars* (National Gallery, London)
  - Velázquez, *Mars Resting* (Prado, Madrid)

  *From:* Greek mythology · Ancient Greek
