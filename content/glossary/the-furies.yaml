definition: "In Greek myth the goddesses of vengeance (three in Virgil and later writers: Alecto, Megaera and Tisiphone), who hunt down those who have killed their own family."
description_md: |-
  Goddesses of vengeance (three in [[person/virgil]] and later writers: Alecto, Megaera and Tisiphone), who hunt down those who have killed their own family.

  **In art:** Winged women with snakes in their hair, holding whips and torches.

  **Famous works**

  - William-Adolphe Bouguereau, *The Remorse of Orestes* (Chrysler Museum, Norfolk)
  - John Singer Sargent, *Orestes Pursued by the Furies* (rotunda mural, Museum of Fine Arts, Boston)

  *From:* Greek mythology · Ancient Greek
