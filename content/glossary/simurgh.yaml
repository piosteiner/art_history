name: Simurgh
category: mythology and legend
definition: In Persian mythology, the enormous, wise and kindly bird who raised Zal, guided the birth of Rostam and revealed the secret of the tamarisk arrow.
description_md: |-
  The Simurgh lives on a sacred mountain and is so old that it is said to have seen the world destroyed three times. It raised the abandoned baby [[zal]], gave him a feather to summon help, guided the birth of [[rostam]], and revealed the secret of the tamarisk arrow. It stands for wisdom, healing and protection.

  *From:* Persian mythology; Shahnameh · Persian
