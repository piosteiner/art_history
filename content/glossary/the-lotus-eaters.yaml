name: The Lotus-Eaters
names: [Lotophagi]
category: mythology and legend
also_in: [iconography]
definition: In Homer's Odyssey the people whose lotus fruit made Odysseus's men forget their homes.
description_md: |-
  Other episodes of the *Odyssey*. [[aeolus]], keeper of the winds, gave [[odysseus]] all the bad winds tied up in a bag, but his curious crew opened it and were blown back. The Lotus-Eaters' fruit made men forget their homes. In the Underworld (the *Nekyia*), Odysseus summoned the dead with blood to consult the prophet Tiresias.

  **In art:** Men lounging in a dreamy land.

  *From:* Homer, Odyssey · Ancient Greek
