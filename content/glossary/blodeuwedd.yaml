public_id: 131152
name: Blodeuwedd
category: mythology and legend
definition: The woman made of oak, broom and meadowsweet flowers by the magicians Math and Gwydion in the Welsh Mabinogion as a wife for Lleu; she plotted his death and was turned into an owl.
description_md: |-
  In the *Mabinogion*, the magicians Math and Gwydion made her from oak, broom and meadowsweet flowers as a wife for Lleu. She fell in love with another man and plotted Lleu's death, so Gwydion turned her into an owl, a bird hated by other birds.

  *From:* Mabinogion (Math fab Mathonwy) · Welsh
