description_md: |-
  The part of the plant body that the cambium, the growing tissue of shoot and stem, forms towards the inside in the course of secondary thickening; facing it on the outside is the bark, made of bast and outer bark.[[source/fansa-vorlauf-2007-holz-kultur|p. 17]] In the wood of today's flowering plants four kinds of cells serve its three functions of support, water transport and storage: tracheids and vessel elements, dead tubes with thickened, lignified walls that carry water; wood fibres with still thicker walls that give strength; and living parenchyma cells that store starch or oil.[[source/fansa-vorlauf-2007-holz-kultur|p. 17]] Lignification — the deposit of the polymer lignin in the cellulose framework of the cell wall — together with this differentiation of cells made trunks, and so trees, possible.[[source/fansa-vorlauf-2007-holz-kultur|p. 17]] Wood has a history of some 400 million years, beginning soon after plants colonised the land around the turn from the Silurian to the Devonian.[[source/fansa-vorlauf-2007-holz-kultur|p. 17]]

  ## Wood for the carver

  Michael Baxandall describes wood as a more complex material for carving than the sandstone or limestone of south German sculptors, which is homogeneous and inert; wood is neither.[[source/baxandall-1980-limewood-sculptors|p. 32]] In hardwoods — dicotyledonous trees, not conifers — storage cells, fibres, vessels and ducts run along the axis of the trunk, the grain; each annual ring has a zone of early (spring) and late (summer) wood; rays of living cells radiate from the centre; and the inner heartwood, whose cells are dead and clogged with resins and gums, differs from the outer sapwood that carries water.[[source/baxandall-1980-limewood-sculptors|pp. 32–33]] Fresh wood holds much water; as the water bound in the cell walls — some 25–30 per cent of the dry weight — dries out, wood shrinks across the grain but not along it, and less radially than tangentially, so that its typical fracture is a radial crack, "starshake".[[source/baxandall-1980-limewood-sculptors|p. 34]] Since wood keeps reacting to the humidity of the air, Baxandall writes, "all wood-carvings remain slow-motion mobiles".[[source/baxandall-1980-limewood-sculptors|p. 36]] He borrows from Paracelsus the idea that those who work wood must read it by "chiromancy", to know "what it is apt and good for".[[source/baxandall-1980-limewood-sculptors|p. 32]]

  ## A wooden culture

  The lecture "Aus dem Wald" quotes Werner Sombart's view that culture before the 19th century bore an "ausgesprochen hölzernes Gepräge", a decidedly wooden stamp,[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 22]] and Michel Pastoureau's observation that medieval lists of the materials used by people always named wood first, as the *materia prima*.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 23]] Isidore of Seville connected the Greek *hyle*, matter, with the Latin *silva*, woodland: "materia is connected with woods".[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 24]]
