definition: "Japanese era name (天禄) for the years 970–973: 970 is Tenroku 1 (元年) and Tenroku 4 is 973."
description_md: |-
  **Tenroku** (天禄) is a Japanese era name ([[nengo]]), proclaimed in 970. Its years are counted in lunar years from the new year before the proclamation: 970 is Tenroku 1 (元年), 973 its last year, Tenroku 4. A Japanese source dates a year within it as "Tenroku 2" (天禄2年) rather than by a continuous count.

  Before: [[anna-era|Anna]]. After: [[tenen-era|Ten'en]].
