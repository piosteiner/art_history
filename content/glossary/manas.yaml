name: Manas
category: mythology and legend
definition: The hero of the Kyrgyz national Epic of Manas, kept alive by oral storytellers (manaschi), who unites the scattered Kyrgyz tribes.
description_md: |-
  Manas is the hero of the Kyrgyz national epic, one of the longest poems in the world, kept alive for centuries by oral storytellers called *manaschi*. Manas grows from a boy of incredible strength into a warrior who gathers the scattered Kyrgyz tribes and leads them against their enemies. He rides his loyal horse Ak-Kula and is supported by his wise wife Kanykei and forty companions. The epic continues with the stories of his son and grandson.

  *From:* Epic of Manas · Kyrgyz
