name: The Boy Who Cried Wolf
category: mythology and legend
definition: Aesop's fable of a shepherd boy who cries "Wolf!" as a joke so often that nobody believes him when a real wolf comes.
description_md: |-
  A shepherd boy shouted "Wolf!" as a joke so many times that when a real wolf came, nobody believed him.

  *From:* Aesop's Fables · Ancient Greek
