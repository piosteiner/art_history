public_id: 131625
name: Hina
category: mythology and legend
definition: In many Polynesian islands, a woman tired of endless work who left the earth to live on the Moon.
description_md: |-
  In many Polynesian islands, Hina was a woman tired of her endless work, who left the earth to live on the Moon. In a Hawaiian version (collected by Westervelt) she tired of beating tapa cloth and climbed the rainbow to the moon, where you can still see her with her calabash.

  *From:* Polynesian tradition · Polynesian
