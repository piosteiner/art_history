name: The Seven Sages of the Bamboo Grove
names: [Ji Kang, Ruan Ji]
category: mythology and legend
also_in: [iconography]
definition: A group of third-century scholars and poets who withdrew from corrupt politics to drink wine, play music and discuss philosophy in a bamboo grove.
description_md: |-
  A group of 3rd-century scholars and poets, including Ji Kang and Ruan Ji, who withdrew from corrupt politics to drink wine, play music and discuss philosophy in a bamboo grove. A model of the free-spirited scholar.

  **In art:** A group of relaxed scholars in a grove, drinking and playing the *guqin* (zither).

  **Famous works**

  - *Seven Sages of the Bamboo Grove and Rong Qiqi* (brick relief, Nanjing Museum)
  - *Kano school screen paintings* (Japan)

  *From:* Chinese
