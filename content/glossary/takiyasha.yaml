definition: The sorceress daughter of the rebel warlord Taira no Masakado, who summoned a giant skeleton to attack her father's enemies.
description_md: |-
  Takiyasha was the daughter of the rebel warlord Taira no Masakado, said to be a sorceress who carried on her father's rebellion after his death by summoning spirits. She used sorcery to summon a giant skeleton to frighten the emperor's envoy, Ōya no Mitsukuni, in her father's ruined palace.

  **In art:** A gigantic skeleton bursting through a torn curtain over a group of samurai, or crawling out of a ruined palace, summoned by a witch reading a scroll.

  **Famous works**

  - [[artist/utagawa-kuniyoshi]], *Takiyasha the Witch and the Skeleton Spectre* (triptych print, about 1844)

  *From:* folklore · Japanese
