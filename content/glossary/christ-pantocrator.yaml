definition: '"Ruler of All", the main image of Christ in Byzantine and Orthodox art: facing the viewer, holding a book and blessing.'
description_md: |-
  "Ruler of All", the main image of Christ in Byzantine and Orthodox art.

  **In art:** A bearded Christ facing the viewer, holding a book, with his right hand raised in blessing, often in the dome or apse of a church.

  **Famous works**

  - *Christ Pantocrator* (Saint Catherine's Monastery, Sinai, 6th century, one of the oldest icons)
  - *Christ Pantocrator* mosaic (Cefalù Cathedral, Sicily)

  *From:* Christian iconography · Christian
