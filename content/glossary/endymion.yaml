definition: In Greek myth the beautiful shepherd (in other versions a king of Elis) loved by the moon goddess Selene and put into an eternal sleep so he would stay young forever.
description_md: |-
  [[selene]] is the moon goddess (later merged with [[artemis]]). She fell in love with the beautiful shepherd Endymion (in other versions a hunter or a king of Elis), who was put into an eternal sleep so he would stay young forever.

  **In art:** A goddess with a crescent moon looking down on a sleeping youth, often bathed in moonlight.

  **Famous works**

  - Anne-Louis Girodet, *The Sleep of Endymion* (Louvre)

  *From:* Greek mythology · Ancient Greek
