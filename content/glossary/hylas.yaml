definition: In Greek myth, the young companion of Heracles on the Argonauts' voyage, pulled into a spring by water nymphs who fell in love with him.
description_md: |-
  Hylas was the young companion of [[heracles]] on the voyage of the [[the-argonauts|Argonauts]]. When he went to fetch water from a spring, the water nymphs fell in love with him and pulled him under, and he was never seen again.

  **In art:** A young man at a pool, surrounded by nymphs pulling him into the water.

  **Famous works**

  - Waterhouse, *Hylas and the Nymphs* (Manchester Art Gallery)

  *From:* Greek mythology (Argonautica) · Ancient Greek
