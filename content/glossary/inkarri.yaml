public_id: 131521
name: Inkarri
category: mythology and legend
definition: The Inca king of Andean legend whose buried head and body are slowly growing together; when joined he will return and restore the Andean world.
description_md: |-
  After the Spanish conquest, a legend grew that the Spanish had cut up the Inca king (Atahualpa in Wikipedia's version) and buried his head and limbs in different places. Underground, his body is slowly growing back toward his head. When they're joined, he'll return and restore the Andean world.

  *From:* Andean legend · Andean (Quechua)
