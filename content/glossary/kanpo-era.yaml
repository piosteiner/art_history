definition: "Japanese era name (寛保) for the years 1741–1744: 1741 is Kanpō 1 (元年) and Kanpō 4 is 1744."
description_md: |-
  **Kanpō** (寛保) is a Japanese era name ([[nengo]]), proclaimed in 1741. Its years are counted in lunar years from the new year before the proclamation: 1741 is Kanpō 1 (元年), 1744 its last year, Kanpō 4. A Japanese source dates a year within it as "Kanpō 2" (寛保2年) rather than by a continuous count.

  Before: [[genbun-era|Genbun]]. After: [[enkyo-era-1744|Enkyō]].
