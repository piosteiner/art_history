definition: "Japanese era name (嘉保) for the years 1094–1096: 1094 is Kahō 1 (元年) and Kahō 3 is 1096."
description_md: |-
  **Kahō** (嘉保) is a Japanese era name ([[nengo]]), proclaimed in 1094. Its years are counted in lunar years from the new year before the proclamation: 1094 is Kahō 1 (元年), 1096 its last year, Kahō 3. A Japanese source dates a year within it as "Kahō 2" (嘉保2年) rather than by a continuous count.

  Before: [[kanji-era|Kanji]]. After: [[eicho-era|Eichō]].
