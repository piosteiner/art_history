public_id: 113271
name: Hye of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 혜왕
  - lang: ko-Hani
    role: alternative
    text: 惠王
category: calendar
parent: korean-calendar
definition: "The reign years of King Hye of Baekje (惠王, 혜왕), by which Korean histories date 598–599: 598 is Hye 1, 599 Hye 2."
description_md: |-
  **Hye** (惠王, 혜왕): the years of the reign of King Hye of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 599 is Hye 2 (혜왕 2년). The year of the accession, 598, counts as the first year.

  Before: [[wideok-baekje-reign-years|Wideok]]. After: [[beop-baekje-reign-years|Beop]].
sources:
  definition:
    - source: dila-time-authority
