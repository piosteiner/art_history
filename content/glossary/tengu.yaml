definition: The long-nosed, winged mountain goblins of Japanese folklore; their king Sōjōbō was said to have taught the boy Yoshitsune swordsmanship.
description_md: |-
  The long-nosed mountain goblin *tengu* is one of the yōkai. As a boy, [[person/minamoto-no-yoshitsune]] was said to have been trained in swordsmanship by the tengu king Sōjōbō on Mount Kurama.

  **In art:** Long-nosed, winged figures in a mountain forest.

  **Famous works**

  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *Ushiwaka Learns the Martial Arts on Mt. Kurama* (1880)
  - [[artist/kawanabe-kyosai]], *tengu pictures* (e.g. *The Great Tengu Does Calligraphy*, from *Kyōsai hyakuzu*, c. 1863–66)

  *From:* folklore · Japanese
