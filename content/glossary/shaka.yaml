category: iconography
parent: buddha
definition: Shakyamuni, the Historical Buddha, born a prince in northern India in the fifth century BCE.
description_md: |-
  Siddhartha Gautama, a prince from the Shakya clan, born in present-day Nepal (around the 5th century BC). He left his palace after seeing old age, sickness and death, and attained enlightenment while meditating under a Bodhi tree.

  **In art:** Recognised by the *lakshanas*, the marks of a Buddha: the *ushnisha* (a cranial bump showing wisdom), the *urna* (a dot or curl between the eyebrows), long earlobes (from the heavy earrings he wore as a prince), tight snail-shell curls, and a simple monastic robe. Often seated cross-legged on a lotus throne with a halo.

  **Famous works**

  - *Gandhara Buddhas* (Greco-Buddhist style, 1st–5th centuries)
  - *Sarnath Buddha* (Gupta period, Sarnath Museum)
  - *Bamiyan Buddhas* (Afghanistan, destroyed in 2001)
  - *Yungang and Longmen Grottoes* (China)
  - *Seokguram Grotto* (Gyeongju, Korea)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
