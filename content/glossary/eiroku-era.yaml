definition: "Japanese era name (永禄) for the years 1558–1570: 1558 is Eiroku 1 (元年) and Eiroku 13 is 1570."
description_md: |-
  **Eiroku** (永禄) is a Japanese era name ([[nengo]]), proclaimed in 1558. Its years are counted in lunar years from the new year before the proclamation: 1558 is Eiroku 1 (元年), 1570 its last year, Eiroku 13. A Japanese source dates a year within it as "Eiroku 2" (永禄2年) rather than by a continuous count.

  Before: [[koji-era-1555|Kōji]]. After: [[genki-era|Genki]].
