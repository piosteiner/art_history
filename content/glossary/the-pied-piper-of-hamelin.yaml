name: The Pied Piper of Hamelin
category: mythology and legend
also_in: [iconography]
definition: The piper of a German legend dated to 1284, who rid Hamelin of its rats and, unpaid, led away the town's children.
description_md: |-
  A German legend dated to 1284 (the rats appear only in versions from the 16th century on): a piper in colourful clothes rid the town of Hamelin of its rats by luring them into the river with his music. When the townspeople refused to pay him, he played again and led away the town's children, who were never seen again.

  **In art:** A piper in motley clothes followed by rats or by a line of children.

  **Famous works**

  - Kate Greenaway, *The Pied Piper of Hamelin* (illustrations for Robert Browning's poem, 1888)

  *From:* German legend · German
