name: Bes
category: mythology and legend
definition: The Egyptian protector of children, homes and women in childbirth, shown face-on as a short, bearded, lion-like figure sticking out his tongue.
description_md: |-
  Bes was a friendly and helpful god who protected children, cared for women during childbirth, and helped people feel safe and happy at home. Unusually for an Egyptian god, he was shown face-on as a short, bearded, lion-like figure, sticking out his tongue. Behind the funny look, he was a fierce guardian who carried knives, warded off demons and killed snakes.

  *From:* Egyptian religion · Ancient Egyptian
