public_id: 113058
name: Yonglong
names:
  - lang: zh
    role: original
    text: 永隆
category: calendar
definition: "Chinese era name (永隆) of the Tang for the years 680–681: 680 is Yonglong 1 (元年) and Yonglong 2 is 681."
description_md: |-
  **Yonglong** (永隆) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 680 under Emperor Gaozong (高宗). Its years are counted in lunar years: 680 is Yonglong 1 (元年), 681 its last year, Yonglong 2. A Chinese source dates a year within it as "Yonglong 2" (永隆二年) rather than by a continuous count.

  Before: [[diaolu-era|Diaolu]]. After: [[kaiyao-era|Kaiyao]].
sources:
  definition:
    - source: dila-time-authority
