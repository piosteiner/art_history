name: The Cowherd and the Weaver Girl
names: [Qixi, Tanabata, Vega and Altair]
category: mythology and legend
also_in: [iconography]
definition: The love story of a heavenly weaver and a humble cowherd, separated by the Milky Way and allowed to meet once a year on a bridge of magpies.
description_md: |-
  A love story. The Weaver Girl, a heavenly maiden who wove the clouds, fell in love with a humble cowherd. The gods separated them with the Milky Way, the Silver River, but once a year, on the seventh night of the seventh month, magpies form a bridge so they can meet. They are the stars Vega and Altair. The festival is Qixi in China, Tanabata in Japan.

  **In art:** Two lovers meeting on a bridge of birds across the starry sky.

  **Famous works**

  - *Qing dynasty New Year prints*
  - [[artist/utagawa-hiroshige]], *Tanabata prints*

  *From:* Chinese and Japanese
