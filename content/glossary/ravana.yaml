name: Ravana
names: [Krong Reap]
category: mythology and legend
definition: In the Ramayana, the ten-headed rakshasa king of Lanka, learned and mighty but proud, who abducted Sita and fell in battle against Rama.
description_md: |-
  Ravana, whose name means "roaring", is the great antagonist of the Ramayana. He was a rakshasa king of enormous power and learning, a scholar and a devoted worshipper, but also proud and ruthless. He abducted Sita, the wife of the prince [[rama]], and carried her off to his island kingdom of Lanka. Rama raised an army, crossed the sea and besieged Lanka, and in the end Ravana fell in battle. He is a classic tragic villain: brilliant and mighty, undone by pride and desire.

  In the Reamker, the ten-headed demon king of Lanka is called Krong Reap. As in the Indian Ramayana, he abducts the princess Seda (Sita) and is defeated after a great war. The Reamker gives the story a Buddhist feel, showing the balance of good and evil in the world. He's a fixture of Khmer classical dance, where he wears a towering masked headdress.

  In the Ramayana, Ravana is the ten-headed demon king of Lanka who kidnaps Sita. Some Sri Lankans see him instead as a wise, powerful king, a great musician who invented the ravanahatha (a stringed instrument), and a skilled healer. Many places on the island are named after him.

  *From:* Ramayana · Indian
