definition: "Japanese era name (康応) for the years 1389–1390: 1389 is Kōō 1 (元年) and Kōō 2 is 1390."
description_md: |-
  **Kōō** (康応) is a Japanese era name ([[nengo]]), proclaimed in 1389. Its years are counted in lunar years from the new year before the proclamation: 1389 is Kōō 1 (元年), 1390 its last year, Kōō 2. A Japanese source dates a year within it as "Kōō 2" (康応2年) rather than by a continuous count.

  Before: [[kakei-era|Kakei]]. After: [[meitoku-era|Meitoku]].
