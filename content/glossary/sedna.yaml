name: Sedna
category: mythology and legend
definition: "In Inuit tradition, the sea-mother: a girl thrown into the sea whose severed fingers became the seals, walruses and whales; mistress of the deep animals."
description_md: |-
  Sedna was once a mortal girl who, in one widespread version, was thrown from a boat into the icy sea by her own father. When she clung to the side, her fingers were chopped away, and from those severed joints the seals, walruses and whales were born. She sank to the bottom and became mistress of the deep. When people break taboos, her hair tangles with their sins and she withholds the animals, and only a shaman diving down to comb her hair can free them again.

  *From:* Inuit tradition · Inuit
