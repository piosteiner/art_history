name: Dundubhi
category: mythology and legend
definition: In the Ramayana, a rakshasa in the form of a mountain-sized buffalo, killed in a duel by the vanara king Vali.
description_md: |-
  Dundubhi was a rakshasa who took the shape of an enormous buffalo, as big as a mountain. He challenged Vali, king of the vanaras (a monkey people), at the gates of his city. Vali killed him in a duel and hurled the carcass so far that it landed near a sage's hermitage. Later, [[rama]] sent the skeleton flying even further with just his big toe, to prove his strength.

  *From:* Ramayana · Indian
