public_id: 113352
name: Heulhae Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 흘해이사금
  - lang: ko-Hani
    role: alternative
    text: 訖解尼師今
category: calendar
definition: "The reign years of Heulhae Isageum of Silla (訖解尼師今, 흘해이사금), by which Korean histories date 310–356: 310 is Heulhae Isageum 1, 356 Heulhae Isageum 47."
description_md: |-
  **Heulhae Isageum** (訖解尼師今, 흘해이사금): the years of the reign of Heulhae Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 319 is Heulhae Isageum 10 (흘해이사금 10년). The year of the accession, 310, counts as the first year.

  Before: [[girim-isageum-silla-reign-years|Girim Isageum]]. After: [[namul-isageum-silla-reign-years|Namul Isageum]].
sources:
  definition:
    - source: dila-time-authority
