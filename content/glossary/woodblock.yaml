public_id: 108623
name: woodblock
category: object type
definition: A block of wood carved in relief for printing text or images.
description_md: |-
  A woodblock is the block of wood from which a woodcut is printed. In the relief process of the woodcut, the lines that print are left standing as raised ridges and the non-printing areas are cut away [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. A drawing on paper was transferred in reverse onto the block (the "Reissen") and then cut with knives (the "Formschnitt"), usually by different people [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. In a Nuremberg book project of the 1490s the block cutter was paid far more than the draughtsman, and the best specialists worked internationally [[source/bockem-2016-jacopo-de-barbari|p. 54]].

  For woodblocks, mostly hard fruit woods with fine and dense fibres were used — pear, apple and cherry, and increasingly box in the sixteenth century; the blocks were cut as plank wood, with the grain running parallel to the printing surface [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Prints were first made by stamping the inked block onto the paper or by rubbing the paper laid onto it; from about 1460 portable hand presses and from 1470 printing presses were used [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]].

  Surviving blocks are rare. The lecture showed the South German [[artwork/martyrium-des-sebastian-druckstock-bm|Martyrdom of St Sebastian]] (c. 1470/75, pear wood) in the British Museum, [[artist/albrecht-durer|Albrecht Dürer]]'s [[artwork/durer-samson-druckstock-met|Samson block]] (c. 1497/98, pear wood) in the Metropolitan Museum and the six pear-wood [[artwork/barbari-matrici-veduta-di-venezia|blocks of the view of Venice]] of 1500 in the Museo Correr [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 20–24, 63]]. Blocks could be altered for later editions: the Venice blocks received inserted pieces when the date was removed and the campanile updated [[source/bockem-2016-jacopo-de-barbari|p. 47]].
