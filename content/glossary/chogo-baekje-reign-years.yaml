public_id: 113249
name: Chogo of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 초고왕
  - lang: ko-Hani
    role: alternative
    text: 肖古王
category: calendar
definition: "The reign years of King Chogo of Baekje (肖古王, 초고왕), by which Korean histories date 166–214: 166 is Chogo 1, 214 Chogo 49."
description_md: |-
  **Chogo** (肖古王, 초고왕): the years of the reign of King Chogo of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 175 is Chogo 10 (초고왕 10년). The year of the accession, 166, counts as the first year.

  Before: [[gaeru-baekje-reign-years|Gaeru]]. After: [[gusu-baekje-reign-years|Gusu]].
sources:
  definition:
    - source: dila-time-authority
