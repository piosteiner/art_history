public_id: 113346
name: Nahae Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 나해이사금
  - lang: ko-Hani
    role: alternative
    text: 奈解尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Nahae Isageum of Silla (奈解尼師今, 나해이사금), by which Korean histories date 196–230: 196 is Nahae Isageum 1, 230 Nahae Isageum 35."
description_md: |-
  **Nahae Isageum** (奈解尼師今, 나해이사금): the years of the reign of Nahae Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 205 is Nahae Isageum 10 (나해이사금 10년). The year of the accession, 196, counts as the first year.

  Before: [[beolhyu-isageum-silla-reign-years|Beolhyu Isageum]]. After: [[jobun-isageum-silla-reign-years|Jobun Isageum]].
sources:
