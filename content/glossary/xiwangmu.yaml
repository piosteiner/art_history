definition: A powerful goddess who lives on Mount Kunlun and owns the Peaches of Immortality, which ripen only once every 3,000 years.
description_md: |-
  A powerful goddess who lives on Mount Kunlun and owns the Peaches of Immortality, which ripen only once every 3,000 years.

  **In art:** A regal woman with a headdress, often with peaches, a phoenix or a nine-tailed fox and a three-legged crow.

  **Famous works**

  - *Han dynasty tomb reliefs and bronze mirrors*

  **Held sacred today:** Some of these figures are still honoured in Daoist and folk religion.

  *From:* Chinese (Daoist)
