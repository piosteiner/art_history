category: calendar
definition: "Japanese era name (天文) for the years 1532–1555: 1532 is Tenbun 1 (元年) and Tenbun 24 is 1555."
description_md: |-
  **Tenbun** (天文) is a Japanese era name ([[nengo]]), proclaimed in 1532. Its years are counted in lunar years from the new year before the proclamation: 1532 is Tenbun 1 (元年), 1555 its last year, Tenbun 24. A Japanese source dates a year within it as "Tenbun 2" (天文2年) rather than by a continuous count.

  Before: [[kyoroku-era|Kyōroku]]. After: [[koji-era-1555|Kōji]].
