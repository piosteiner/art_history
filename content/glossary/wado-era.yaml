definition: "Japanese era name (和銅) for the years 708–714: 708 is Wadō 1 (元年) and Wadō 7 is 714."
description_md: |-
  **Wadō** (和銅) is a Japanese era name ([[nengo]]), proclaimed in 708. Its years are counted in lunar years from the new year before the proclamation: 708 is Wadō 1 (元年), 714 its last year, Wadō 7. A Japanese source dates a year within it as "Wadō 2" (和銅2年) rather than by a continuous count.

  Before: [[keiun-era|Keiun]]. After: [[reiki-era|Reiki]].
