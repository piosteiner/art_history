name: Salvator Mundi
category: iconography
definition: '"Saviour of the World": a devotional image of Christ blessing and holding a crystal globe.'
description_md: |-
  *Salvator Mundi* ("Saviour of the World") shows Christ blessing and holding a crystal globe.

  **In art:** Christ with a glass orb.

  **Famous works**

  - [[artist/leonardo-da-vinci]] (attributed; disputed), *Salvator Mundi* (private collection, sold at Christie's New York in 2017 for a record $450.3 million)

  *From:* Christian iconography · Christian
