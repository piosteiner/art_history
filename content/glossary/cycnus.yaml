name: Cycnus
category: mythology and legend
definition: In Greek myth, the name of several figures turned into swans, best known Phaethon's friend, who mourned him on the river bank until he became a swan.
description_md: |-
  Several Cycnuses were turned into swans. The best known was [[phaethon]]'s close friend, who mourned him so much on the banks of the river where he fell that he became a swan. Swans avoid the sky, because they remember [[zeus]]'s fire.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
