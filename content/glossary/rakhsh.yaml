name: Rakhsh
category: mythology and legend
definition: In the Persian Shahnameh, the hero Rostam's fiercely loyal horse, of almost human intelligence, who died beside his master.
description_md: |-
  [[rostam]] searched through countless horses before choosing Rakhsh, the only one strong enough to carry him. Rakhsh is described as having almost human intelligence. During the Seven Labours, a lion attacked while Rostam was asleep, and Rakhsh fought and killed it on his own. Another night, he woke his master three times to warn him of a dragon. Rakhsh stayed at Rostam's side until the very end, and the two died together in a hidden pit of spears.

  *From:* Shahnameh · Persian
