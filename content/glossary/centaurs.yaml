definition: In Greek myth creatures half horse and half man, usually wild and drunken, who fought the Lapiths at the wedding of Pirithous (the Centauromachy).
description_md: |-
  Centaurs are half horse and half man, usually wild and drunken. At the wedding of the Lapith king [[pirithous]], they tried to carry off the bride, starting a huge battle (the Centauromachy).

  **In art:** Men fighting centaurs.

  **Famous works**

  - Parthenon south metopes (British Museum)
  - West pediment, *Temple of Zeus at Olympia* (Archaeological Museum of Olympia)
  - [[artist/michelangelo]], *Battle of the Centaurs* (relief, Casa Buonarroti, Florence)

  *From:* Greek mythology · Ancient Greek
