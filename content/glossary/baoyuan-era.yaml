name: Baoyuan
names:
  - lang: zh
    role: original
    text: 寶元
category: calendar
parent: chinese-calendar
definition: "Chinese era name (寶元) of the Northern Song for the years 1038–1040: 1038 is Baoyuan 1 (元年) and Baoyuan 3 is 1040."
description_md: |-
  **Baoyuan** (寶元) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1038 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1038 is Baoyuan 1 (元年), 1040 its last year, Baoyuan 3. A Chinese source dates a year within it as "Baoyuan 2" (寶元二年) rather than by a continuous count.

  Before: [[jingyou-era|Jingyou]]. After: [[kangding-era|Kangding]].
sources:
