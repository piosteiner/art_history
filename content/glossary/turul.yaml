name: Turul
names: [Turúl]
category: mythology and legend
definition: A great bird of prey in Hungarian legend, which appeared in a dream to Emese foretelling that her son Álmos would found a line of kings; a symbol of Hungary.
description_md: |-
  It appeared in a dream to Emese, the mother of Álmos. It told her that a great river would flow from her womb over strange lands, foretelling that her son would found a line of kings. It's now a symbol of Hungary.

  *From:* Hungarian origin legend · Hungarian
