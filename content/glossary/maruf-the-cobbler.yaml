name: Ma'ruf the Cobbler
category: mythology and legend
definition: In the Nights, a poor shoemaker who pretended to be a rich merchant awaiting his caravan, married the king's daughter, and was saved by a jinni of a magic ring.
description_md: |-
  Running away from his nagging wife, he arrived in a foreign city and claimed his huge caravan was on its way. He borrowed fortunes and married the king's daughter. Just as he was about to be found out, he found a magic ring with a jinni who brought the caravan for real.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
