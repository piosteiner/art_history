public_id: 113127
name: Yanyou
names:
  - lang: zh
    role: original
    text: 延祐
category: calendar
definition: "Chinese era name (延祐) of the Yuan for the years 1314–1320: 1314 is Yanyou 1 (元年) and Yanyou 7 is 1320."
description_md: |-
  **Yanyou** (延祐) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1314 under Ayurbarwada (仁宗). Its years are counted in lunar years: 1314 is Yanyou 1 (元年), 1320 its last year, Yanyou 7. A Chinese source dates a year within it as "Yanyou 2" (延祐二年) rather than by a continuous count.

  Before: [[huangqing-era|Huangqing]]. After: [[zhizhi-era|Zhizhi]].
sources:
  definition:
    - source: dila-time-authority
