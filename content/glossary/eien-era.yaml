category: calendar
definition: "Japanese era name (永延) for the years 987–989: 987 is Eien 1 (元年) and Eien 3 is 989."
description_md: |-
  **Eien** (永延) is a Japanese era name ([[nengo]]), proclaimed in 987. Its years are counted in lunar years from the new year before the proclamation: 987 is Eien 1 (元年), 989 its last year, Eien 3. A Japanese source dates a year within it as "Eien 2" (永延2年) rather than by a continuous count.

  Before: [[kanna-era|Kanna]]. After: [[eiso-era|Eiso]].
