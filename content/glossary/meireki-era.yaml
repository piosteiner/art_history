definition: "Japanese era name (明暦) for the years 1655–1658: 1655 is Meireki 1 (元年) and Meireki 4 is 1658."
description_md: |-
  **Meireki** (明暦) is a Japanese era name ([[nengo]]), proclaimed in 1655. Its years are counted in lunar years from the new year before the proclamation: 1655 is Meireki 1 (元年), 1658 its last year, Meireki 4. A Japanese source dates a year within it as "Meireki 2" (明暦2年) rather than by a continuous count.

  Before: [[joo-era-1652|Jōō]]. After: [[manji-era|Manji]].
