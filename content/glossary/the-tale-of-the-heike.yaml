definition: The war epic of the Genpei War (1180–1185) between the Taira (Heike) and Minamoto (Genji) clans, ending with the destruction of the Taira at Dan-no-ura.
description_md: |-
  The epic of the Genpei War (1180–1185) between the Taira (Heike) and Minamoto ([[genji-era]]) clans. Famous episodes include the sea battle of Dan-no-ura, where the child emperor Antoku drowned and the Taira were destroyed, and the archer Nasu no Yoichi shooting a fan from a boat. The warrior Kumagai Naozane beheaded the young Taira flute player Atsumori, then became a monk out of grief. The Taira ghosts are said to live on as Heike crabs, whose shells look like angry faces.

  **In art:** Battle scenes on land and sea, a warrior calling back a young rider from the sea, a sea battle with drowning nobles, and the ghosts of drowned Taira warriors rising from the waves or Heike crabs with faces of samurai on their shells.

  **Famous works**

  - *Night Attack on the Sanjō Palace* (from the Heiji Monogatari Emaki, 13th century, Museum of Fine Arts, Boston) — illustrates the Heiji Disturbance (1159–60), not the Tale of the Heike
  - *Battle of Ichi-no-Tani* (screens, various, Edo period)
  - [[artist/utagawa-kuniyoshi]], *The Ghost of Taira no Tomomori at Daimotsu Bay* (*Taira Tomomori borei no zu*, print)
  - Utagawa Kuniyoshi, *Taira Ghosts Attacking Yoshitsune's Ship at Daimotsu Bay*

  *From:* The Tale of the Heike · Japanese
