category: calendar
definition: "Japanese era name (観応) for the years 1350–1351: 1350 is Kannō 1 (元年) and Kannō 2 is 1351."
description_md: |-
  **Kannō** (観応) is a Japanese era name ([[nengo]]), proclaimed in 1350. Its years are counted in lunar years from the new year before the proclamation: 1350 is Kannō 1 (元年), 1351 its last year, Kannō 2. A Japanese source dates a year within it as "Kannō 2" (観応2年) rather than by a continuous count.

  Before: [[koei-era|Kōei]]. After: [[bunna-era|Bunna]].
