definition: In Greek myth the Titan who (in later versions) shaped humans from clay and stole fire from the gods for them, and was chained to a rock as punishment.
description_md: |-
  The Titan who (in later versions, e.g. Apollodorus and [[person/ovid]]) shaped humans from clay and stole fire from the gods for them. As punishment, [[zeus]] chained him to a rock where an eagle ate his liver every day, until [[heracles]] freed him.

  **In art:** A muscular man chained to a rock, with an eagle tearing at his side, or carrying a torch.

  **Famous works**

  - Rubens (eagle by Frans Snyders), *Prometheus Bound* (Philadelphia Museum of Art)
  - Gustave Moreau, *Prometheus*

  *From:* Greek mythology · Ancient Greek
