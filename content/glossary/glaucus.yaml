definition: In Ovid's Metamorphoses, the fisherman who ate a magic herb and became a sea god with a fish's tail; he loved the nymph Scylla.
description_md: |-
  Glaucus was a fisherman who ate a magic herb and turned into a sea god with a fish's tail. He loved the nymph [[scylla]], and in jealousy [[circe]] turned her into a monster.

  **Famous works**

  - Laurent de La Hyre, *Landscape with Glaucus and Scylla* (Getty)

  *From:* Ovid, Metamorphoses · Ancient Greek
