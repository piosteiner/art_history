name: Shaoding
names:
  - lang: zh
    role: original
    text: 紹定
category: calendar
parent: chinese-calendar
definition: "Chinese era name (紹定) of the Southern Song for the years 1228–1233: 1228 is Shaoding 1 (元年) and Shaoding 6 is 1233."
description_md: |-
  **Shaoding** (紹定) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1228 under Emperor Lizong (理宗). Its years are counted in lunar years: 1228 is Shaoding 1 (元年), 1233 its last year, Shaoding 6. A Chinese source dates a year within it as "Shaoding 2" (紹定二年) rather than by a continuous count.

  Before: [[baoqing-era|Baoqing]]. After: [[duanping-era|Duanping]].
sources:
