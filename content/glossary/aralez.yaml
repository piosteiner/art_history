name: Aralez
category: mythology and legend
definition: Dog spirits of Armenian legend who licked the wounds of the fallen to revive them; Semiramis called on them to bring Ara the Beautiful back to life.
description_md: |-
  Queen Semiramis of Assyria fell in love with King Ara of Armenia, but he refused to marry her. She went to war to capture him alive, but he was killed in battle against her orders. According to legend, she tried to bring him back to life with the help of dog spirits, the Aralez, who licked his wounds.

  *From:* Armenian legend · Armenian
