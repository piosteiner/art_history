name: Tuccia
category: mythology and legend
also_in: [iconography]
definition: The Vestal Virgin who proved her innocence by carrying water from the Tiber in a sieve without spilling a drop.
description_md: |-
  Tuccia, accused of breaking her vow, proved her innocence by carrying water from the Tiber in a sieve without spilling a drop.

  **In art:** A veiled woman carrying a sieve full of water.

  **Famous works**

  - [[artist/andrea-mantegna]], *Tuccia with a Sieve* (National Gallery, London)

  *From:* Valerius Maximus; Pliny · Ancient Roman
