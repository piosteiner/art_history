definition: The goddess of luck, who turns the Wheel of Fortune, raising some people up and throwing others down.
description_md: |-
  The goddess of luck, who turns the Wheel of Fortune, raising some people up and throwing others down.

  **In art:** A woman (often blindfolded) standing on a ball or globe, holding a sail, a rudder or a cornucopia, or turning a great wheel with kings rising and falling on it.

  **Famous works**

  - [[artist/albrecht-durer]], *Nemesis (The Great Fortune)* (engraving, c. 1501–1502)
  - [[artist/edward-burne-jones]], *The Wheel of Fortune* (1875–1883, Musée d'Orsay, Paris)

  *From:* Roman
