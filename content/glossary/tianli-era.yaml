name: Tianli
names:
  - lang: zh
    role: original
    text: 天曆
category: calendar
parent: chinese-calendar
definition: "Chinese era name (天曆) of the Yuan for the years 1328–1329: 1328 is Tianli 1 (元年) and Tianli 2 is 1329."
description_md: |-
  **Tianli** (天曆) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1328 under Tugh Temür (文宗). Its years are counted in lunar years: 1328 is Tianli 1 (元年), 1329 its last year, Tianli 2. A Chinese source dates a year within it as "Tianli 2" (天曆二年) rather than by a continuous count.

  Before: [[tianshun-era-1328|Tianshun]]. After: [[zhishun-era|Zhishun]].
sources:
