definition: Household objects that come alive after a hundred years in Japanese folklore — umbrellas, lanterns, sandals — and march in the Night Parade.
description_md: |-
  *Tsukumogami* are household objects that came alive after a hundred years (umbrellas, lanterns, sandals).

  **In art:** Walking objects in the parade of yōkai.

  **Famous works**

  - Tosa Mitsunobu (attributed), *Hyakki Yagyō Emaki* (Shinju-an, Daitoku-ji, Kyoto)

  *From:* folklore · Japanese
