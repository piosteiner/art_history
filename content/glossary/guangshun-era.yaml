public_id: 112960
name: Guangshun
names:
  - lang: zh
    role: original
    text: 廣順
category: calendar
definition: "Chinese era name (廣順) of the Later Zhou for the years 951–953: 951 is Guangshun 1 (元年) and Guangshun 3 is 953."
description_md: |-
  **Guangshun** (廣順) is a Chinese era name ([[nianhao]]) of the Later Zhou, proclaimed in 951 under Emperor Taizu (太祖). Its years are counted in lunar years: 951 is Guangshun 1 (元年), 953 its last year, Guangshun 3. A Chinese source dates a year within it as "Guangshun 2" (廣順二年) rather than by a continuous count.

  After: [[xiande-era|Xiande]].
sources:
  definition:
    - source: dila-time-authority
