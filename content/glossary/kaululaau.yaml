public_id: 131629
name: Kaululāʻau
category: mythology and legend
definition: A young chief of Hawaiian tradition banished to Lānaʻi, who tricked and defeated its ghosts and made the island safe for people.
description_md: |-
  Lānaʻi was once believed to be home only to evil spirits ruled by [[pahulu]], a goddess and the leading spirit of the island. The young chief Kaululaʻau was banished there and tricked the ghosts again and again, until he defeated them and made the island safe for people (in Fornander's version all died except Pahulu and a few others, who escaped to Kahoʻolawe).

  *From:* Hawaiian tradition · Hawaiian
