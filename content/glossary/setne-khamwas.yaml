public_id: 131411
name: Setne Khamwas
category: mythology and legend
definition: The hero of Egyptian Demotic tales, based on the real Prince Khaemwaset, son of Ramesses II, who stole the magic Book of Thoth from a tomb.
description_md: |-
  Based on the real Prince Khaemwaset, son of [[person/ramesses-ii]] and the first "Egyptologist", who restored old monuments. In the stories, he stole the magic Book of Thoth from a tomb, where the ghost of the magician Naneferkaptah lived with his wife and son. Naneferkaptah's ghost tricked him with a terrible illusion until he gave it back.

  *From:* Setne Khamwas tales (Demotic) · Ancient Egyptian
