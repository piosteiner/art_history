name: Ekalavya
category: mythology and legend
definition: In the Mahabharata, the tribal boy who taught himself archery before a clay statue of the teacher Drona and cut off his right thumb as the fee Drona demanded.
description_md: |-
  Ekalavya was a tribal boy who wanted to learn archery from the great teacher Drona, but was refused because of his birth. So he made a clay statue of Drona, practised in front of it every day, and became a better archer than Drona's star pupil, the prince Arjuna. When Drona found out, he demanded his teacher's fee: Ekalavya's right thumb. Ekalavya cut it off without hesitation, knowing it would end his skill as an archer.

  *From:* Mahabharata · Indian
