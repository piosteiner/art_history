definition: The Demon Queller of Chinese legend, a scholar who became a hunter of demons in the afterlife; his image was hung at New Year to protect homes.
description_md: |-
  The Demon Queller. According to legend, a scholar who killed himself after being unfairly rejected in the imperial exams because of his ugliness, and became a hunter of demons in the afterlife. His image was hung at New Year to protect homes.

  **In art:** A fierce, bearded man in an official's robe and hat, with a sword, chasing or riding on demons, sometimes drunk.

  **Famous works**

  - Gong Kai, *Zhong Kui Travelling* (Freer Gallery, Washington)
  - *Shōki* (many Japanese versions)

  *From:* Chinese
