    text: 承元
category: calendar
definition: "Japanese era name (承元) for the years 1207–1211: 1207 is Jōgen 1 (元年) and Jōgen 5 is 1211."
description_md: |-
  **Jōgen** (承元) is a Japanese era name ([[nengo]]), proclaimed in 1207. Its years are counted in lunar years from the new year before the proclamation: 1207 is Jōgen 1 (元年), 1211 its last year, Jōgen 5. A Japanese source dates a year within it as "Jōgen 2" (承元2年) rather than by a continuous count.

  Before: [[kenei-era|Ken'ei]]. After: [[kenryaku-era|Kenryaku]].
