definition: In Greek myth a sea nymph, one of the Nereids, mother of Achilles, who begged Zeus to honour her son.
description_md: |-
  The Nereids are the fifty sea nymphs, daughters of the old sea god Nereus. The most famous is Thetis, mother of [[achilles]], who begged [[zeus]] to honour her son.

  **In art:** Thetis kneeling before an enthroned Zeus, or dipping baby Achilles into the Styx.

  **Famous works**

  - Ingres, *Jupiter and Thetis* (Aix-en-Provence)
  - Rubens, *Thetis Dipping Achilles into the River Styx* (Rotterdam)

  *From:* Greek mythology · Ancient Greek
