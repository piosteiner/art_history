name: Börte Chino
names: [the Grey Wolf, Borte Chino]
category: mythology and legend
definition: The blue-grey wolf from which, according to The Secret History of the Mongols, the Mongols descend, together with a fallow doe, after they crossed a great lake to the sacred mountain Burkhan Khaldun.
description_md: |-
  *The Secret History of the Mongols* opens by saying the Mongols descend from a blue-grey wolf, Börte Chino, and a fallow doe, who crossed a great lake together and settled near the sacred mountain Burkhan Khaldun. Like Asena for the Turks, the wolf stands for courage, loyalty and the strength of the pack.

  *From:* The Secret History of the Mongols · Mongol
