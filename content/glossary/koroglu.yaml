name: Köroğlu
category: mythology and legend
definition: '"Son of the blind man": the outlaw hero, poet and musician of Turkic epic who took to the mountains to fight cruel lords, riding the horse Kırat.'
description_md: |-
  Köroğlu's father was a stableman who was blinded by the Bey of Bolu. His son swore revenge, took to the mountains with a band of outlaws, and became a Robin Hood-like folk hero who protected ordinary people against tyrants. He rode a legendary horse named Kırat and was also a poet and musician. His story is told from Turkey and Azerbaijan to Central Asia.

  His father, a groom, was blinded by a cruel lord (the Bey of Bolu in the Turkish version) (*Köroğlu* means "son of the blind man"). He became a Robin Hood-style outlaw in the mountains with his wonderful horse Qırat, and sang songs while he fought.

  *From:* Köroğlu epic · Turkic (Turkey, Azerbaijan, Central Asia)
