definition: "Japanese era name (元治) for the years 1864–1865: 1864 is Genji 1 (元年) and Genji 2 is 1865."
description_md: |-
  **Genji** (元治) is a Japanese era name ([[nengo]]), proclaimed in 1864. Its years are counted in lunar years from the new year before the proclamation: 1864 is Genji 1 (元年), 1865 its last year, Genji 2. A Japanese source dates a year within it as "Genji 2" (元治2年) rather than by a continuous count.

  Before: [[bunkyu-era|Bunkyū]]. After: [[keio-era|Keiō]].
