public_id: 130967
name: Utnapishtim
category: mythology and legend
definition: In the Epic of Gilgamesh, the man warned by the god Enki who survived the great flood in a boat and was granted immortality with his wife.
description_md: |-
  Long before [[gilgamesh]], the wise god Ea ([[enki]]) warned a man named Utnapishtim through a dream that the gods were about to flood the world. He built a great boat and saved his family, craftsmen and the animals. Afterwards, the gods granted him and his wife immortality, and they lived far away at the edge of the world. Gilgamesh travelled to him to learn the secret of eternal life.

  The god Ea warned him to build a giant boat before the gods flooded the world. Afterwards, he and his wife were made immortal and sent to live far away, at the mouth of the rivers.

  *From:* Epic of Gilgamesh · Mesopotamian (Babylonian)
