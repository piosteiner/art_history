category: calendar
definition: "Japanese era name (万治) for the years 1658–1661: 1658 is Manji 1 (元年) and Manji 4 is 1661."
description_md: |-
  **Manji** (万治) is a Japanese era name ([[nengo]]), proclaimed in 1658. Its years are counted in lunar years from the new year before the proclamation: 1658 is Manji 1 (元年), 1661 its last year, Manji 4. A Japanese source dates a year within it as "Manji 2" (万治2年) rather than by a continuous count.

  Before: [[meireki-era|Meireki]]. After: [[kanbun-era|Kanbun]].
