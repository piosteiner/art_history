public_id: 113082
name: Jinglong
names:
  - lang: zh
    role: original
    text: 景龍
category: calendar
definition: "Chinese era name (景龍) of the Tang for the years 707–710: 707 is Jinglong 1 (元年) and Jinglong 4 is 710."
description_md: |-
  **Jinglong** (景龍) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 707 under Emperor Zhongzong (中宗). Its years are counted in lunar years: 707 is Jinglong 1 (元年), 710 its last year, Jinglong 4. A Chinese source dates a year within it as "Jinglong 2" (景龍二年) rather than by a continuous count.

  Before: [[shenlong-era|Shenlong]]. After: [[tanglong-era|Tanglong]].
sources:
  definition:
    - source: dila-time-authority
