name: Beowulf
category: mythology and legend
also_in: [iconography]
definition: The hero of the Old English epic Beowulf, who killed the monster Grendel and his mother and died in old age fighting a dragon.
description_md: |-
  The hero of the Old English epic *Beowulf* (composed, by scholars' differing estimates, between the 7th and the early 11th century; the only manuscript dates from c. 975–1025). He tore off the arm of the monster [[grendel]], who was attacking the hall of the Danish king Hrothgar. He then killed Grendel's mother in her underwater lair, and died in old age fighting a dragon.

  **In art:** A warrior wrestling a monster in a mead hall, or diving into a dark lake.

  **Famous works**

  - J. H. F. Bacon, *Beowulf* illustrations in M. I. Ebbutt, *Hero-Myths & Legends of the British Race* (London: Harrap, 1910)

  *From:* Beowulf · Anglo-Saxon
