definition: "The sons of Adam and Eve in Genesis: Cain, a farmer, killed his brother Abel, a shepherd, the first murder in the Bible."
description_md: |-
  The sons of [[adam-and-eve]]. Cain, a farmer, killed his brother Abel, a shepherd, out of jealousy because God preferred Abel's offering. It's the first murder in the Bible.

  **In art:** One man striking another with a club or jawbone, often near two altars with smoke.

  **Famous works**

  - [[artist/titian]], *Cain and Abel* (Santa Maria della Salute, Venice)
  - [[artist/peter-paul-rubens]], *Cain Slaying Abel* (Courtauld)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
