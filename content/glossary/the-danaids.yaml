definition: In Greek myth the fifty daughters of Danaus who (all but Hypermnestra) murdered their husbands on their wedding night and must fill a leaking jar for ever.
description_md: |-
  The Danaids, who (all but Hypermnestra) murdered their husbands on their wedding night, must fill a leaking jar.

  **In art:** Women carrying jars of water.

