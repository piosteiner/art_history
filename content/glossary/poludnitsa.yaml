public_id: 130950
name: Poludnitsa
names: [the Noon Maiden, Lady Midday]
category: mythology and legend
definition: "In Slavic folklore, the Noon Maiden: a tall woman in white with a scythe who walks the fields at summer noon and strikes those who work in the heat or answer her questions wrongly."
description_md: |-
  The poludnitsa is a spirit who walks the fields at noon in summer, often appearing as a tall woman in white carrying a scythe. She stops people working or travelling in the hottest part of the day and asks them difficult questions. Those who answer wrongly, or who don't stop work, are struck with sunstroke or worse.

  *From:* Slavic folklore · Slavic
