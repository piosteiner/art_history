definition: "Japanese era name (貞元) for the years 976–977: 976 is Jōgen 1 (元年) and Jōgen 2 is 977."
description_md: |-
  **Jōgen** (貞元) is a Japanese era name ([[nengo]]), proclaimed in 976. Its years are counted in lunar years from the new year before the proclamation: 976 is Jōgen 1 (元年), 977 its last year, Jōgen 2. A Japanese source dates a year within it as "Jōgen 2" (貞元2年) rather than by a continuous count.

  Before: [[tenen-era|Ten'en]]. After: [[tengen-era|Tengen]].
