definition: In Ovid's *Metamorphoses* the god of dreams, son of Somnus (the Greek Hypnos), who takes on human shapes in people's dreams.
description_md: |-
  The god of dreams, in [[person/ovid]] son of [[hypnos|Somnus]] (Hypnos), who takes on human shapes in people's dreams. The drug morphine is named after him.

  **In art:** A sleeping winged youth, often with poppies.

  **Famous works**

  - Jean-Bernard Restout, *Morpheus* (Cleveland)
  - Guérin, *Morpheus and Iris*

  *From:* Greek mythology · Ancient Greek
