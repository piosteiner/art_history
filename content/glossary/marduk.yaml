name: Marduk
category: mythology and legend
definition: The chief god of Babylon, who in the Enūma Eliš defeated Tiamat and was made king of the gods.
description_md: |-
  He agreed to fight [[tiamat]] only if the other gods made him their king. He caught her in a net, blew a wind into her mouth and shot an arrow through her belly. His temple tower in Babylon, the Etemenanki, may be the origin of the [[tower-of-babel]] story.

  *From:* Enūma Eliš · Mesopotamian (Sumerian, Babylonian, Assyrian)
