name: Seven Macaw
names: [Vucub Caquix]
category: mythology and legend
definition: In the Popol Vuh, a boastful bird who claimed to be the sun and moon before the real sun existed, and was brought down by the Hero Twins.
description_md: |-
  Before the real sun existed, he claimed his jewelled teeth and metal eyes made him the sun and moon. The twins shot him with a blowgun and replaced his jewel teeth with white corn, so he lost his glory and died.

  *From:* Popol Vuh · K'iche' Maya
