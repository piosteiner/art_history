category: calendar
definition: "Japanese era name (正元) for the years 1259–1260: 1259 is Shōgen 1 (元年) and Shōgen 2 is 1260."
description_md: |-
  **Shōgen** (正元) is a Japanese era name ([[nengo]]), proclaimed in 1259. Its years are counted in lunar years from the new year before the proclamation: 1259 is Shōgen 1 (元年), 1260 its last year, Shōgen 2. A Japanese source dates a year within it as "Shōgen 2" (正元2年) rather than by a continuous count.

  Before: [[shoka-era|Shōka]]. After: [[buno-era|Bun'ō]].
