public_id: 113358
name: Jijeung Maripgan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 지증마립간
  - lang: ko-Hani
    role: alternative
    text: 智證麻立干
category: calendar
parent: korean-calendar
definition: "The reign years of Jijeung Maripgan of Silla (智證麻立干, 지증마립간), by which Korean histories date 500–514: 500 is Jijeung Maripgan 1, 514 Jijeung Maripgan 15."
description_md: |-
  **Jijeung Maripgan** (智證麻立干, 지증마립간): the years of the reign of Jijeung Maripgan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 509 is Jijeung Maripgan 10 (지증마립간 10년). The year of the accession, 500, counts as the first year.

  Before: [[soji-maripgan-silla-reign-years|Soji Maripgan]]. After: [[beopheung-silla-reign-years|Beopheung]].
sources:
  definition:
    - source: dila-time-authority
