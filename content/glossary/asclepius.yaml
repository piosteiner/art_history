definition: In Greek myth the god of medicine, a son of Apollo, whose staff with one coiled snake is still the symbol of medicine.
description_md: |-
  Asclepius is the god of medicine, a son of [[apollo]] taught by the centaur [[chiron]]. He grew so skilled that he raised the dead, so [[zeus]] killed him with a thunderbolt. His daughter [[hygieia]] is the goddess of health (hence "hygiene").

  **In art:** A bearded man with a staff with one snake coiled around it (the Rod of Asclepius, still the symbol of medicine).

  *From:* Greek mythology · Ancient Greek
