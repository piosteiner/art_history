definition: "Japanese era name (応徳) for the years 1084–1087: 1084 is Ōtoku 1 (元年) and Ōtoku 4 is 1087."
description_md: |-
  **Ōtoku** (応徳) is a Japanese era name ([[nengo]]), proclaimed in 1084. Its years are counted in lunar years from the new year before the proclamation: 1084 is Ōtoku 1 (元年), 1087 its last year, Ōtoku 4. A Japanese source dates a year within it as "Ōtoku 2" (応徳2年) rather than by a continuous count.

  Before: [[eiho-era|Eihō]]. After: [[kanji-era|Kanji]].
