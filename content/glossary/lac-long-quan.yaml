name: Lạc Long Quân
category: mythology and legend
definition: The dragon lord of Vietnamese legend who, with the mountain fairy Âu Cơ, fathered the hundred sons from whom the Vietnamese descend.
description_md: |-
  The dragon king Lạc Long Quân married the mountain fairy Âu Cơ. She laid a sack of a hundred eggs, which hatched into a hundred sons. Because he belonged to the sea and she to the mountains, they separated: fifty sons went with their father to the coast and fifty with their mother to the mountains. The Vietnamese call themselves "children of the dragon, grandchildren of the fairy".

  *From:* Vietnamese founding myth · Vietnamese
