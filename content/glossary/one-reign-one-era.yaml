name: one reign, one era
names:
  - lang: ja
    role: original
    text: 一世一元
category: calendar
definition: The rule, in Japan since 1868, that an emperor reigns in a single era — after his death he is called by its name (Emperor Meiji, Emperor Shōwa).
description_md: |-
  **One reign, one era** (一世一元, issei ichigen): since the decree of 1868 that made Meiji the era of the new emperor, Japan changes its era name ([[nengo]]) only when an emperor comes to the throne. The era and the reign are one; after his death the emperor is known by the name of his era — [[person/emperor-meiji|Emperor Meiji]], [[person/emperor-taisho|Emperor Taishō]], [[person/hirohito|Hirohito]] as Emperor Shōwa. The rule was written into law with the Era Name Act of 1979. Since an abdication ended the [[heisei-era|Heisei]] era in 2019, [[person/akihito|Akihito]] is alive while his era is closed; [[reiwa-era|Reiwa]] is that of [[person/naruhito|Naruhito]].

  The rule follows the Ming and Qing emperors of China, who also kept one era each and are known by it (the Qianlong Emperor; see [[nianhao]]).
