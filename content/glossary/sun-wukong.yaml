name: Sun Wukong
names: [the Monkey King]
category: religion
definition: The rebellious stone monkey of Journey to the West who defied heaven and later protected the monk Xuanzang on his pilgrimage.
description_md: |-
  Sun Wukong was born from a magic stone and became king of the monkeys. He learned seventy-two transformations, could leap across the clouds, and carried a staff that could shrink to the size of a needle or grow as tall as the sky. He wreaked havoc in heaven, ate the peaches of immortality and defeated armies of celestial soldiers, until the Buddha trapped him under a mountain for 500 years. He was finally freed to protect the monk [[person/xuanzang]] on his long pilgrimage in *Journey to the West*.

  **Held sacred today:** Although he's best known from a novel, Sun Wukong is worshipped as a deity in temples in parts of China, Taiwan and Southeast Asia.

  *From:* Wu Cheng'en, Journey to the West · Chinese
