name: Princess Bari
names: [Bari, Barideggi]
category: religion
definition: The abandoned seventh daughter of Korean shamanic tradition who fetched healing water from the underworld and became the guide of the dead.
description_md: |-
  A king who wanted a son cast out his seventh daughter as soon as she was born. Years later, the king and queen fell deathly ill, and only water from the underworld could heal them. Their six favoured daughters refused to go. Bari, the one they had abandoned, made the dangerous journey, brought back the healing water and saved them. She became the goddess who guides the souls of the dead into the afterlife.

  **Held sacred today:** Princess Bari is the patron of Korean *mudang* shamans, and her story is sung in sacred rituals for the dead to this day.

  *From:* Korean shamanic epic (Barideggi) · Korean
