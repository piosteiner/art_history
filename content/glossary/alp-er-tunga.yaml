public_id: 130886
name: Alp Er Tunga
category: mythology and legend
definition: A legendary king of the ancient Turks, usually identified with Afrasiab of the Shahnameh, whose death is lamented in a famous elegy.
description_md: |-
  Alp Er Tunga is a legendary king of the ancient Turks. He is usually identified with [[afrasiab]] from the Shahnameh, the same king Persia fought for generations, but seen from the other side. To the Turks, he is a great hero-king, and a famous elegy laments his death.

  *From:* Turkic legend · Turkic
