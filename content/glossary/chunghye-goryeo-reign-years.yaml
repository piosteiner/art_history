public_id: 113330
name: Chunghye of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 충혜왕
  - lang: ko-Hani
    role: alternative
    text: 忠惠王
category: calendar
parent: korean-calendar
definition: "The reign years of King Chunghye of Goryeo (忠惠王, 충혜왕), by which Korean histories date 1331–1332 and 1340–1344: 1331 is Chunghye 1, 1332 Chunghye 2."
description_md: |-
  **Chunghye** (忠惠王, 충혜왕): the years of the reign of King Chunghye of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1332 is Chunghye 2 (충혜왕 2년). The year of the accession, 1331, counts as the first year. King Chunghye reigned twice, 1331–1332 and 1340–1344; the second reign counts its years anew.

  Before: [[chungsuk-goryeo-reign-years|Chungsuk]]. After: [[chungmok-goryeo-reign-years|Chungmok]].
sources:
  definition:
    - source: dila-time-authority
