definition: In Greek myth the mother of Apollo and Artemis, hounded by Hera, who turned Lycian peasants into frogs; the Romans called her Latona.
description_md: |-
  Mother of Apollo and [[artemis]], hounded by the jealous [[hera]]. When peasants in Lycia muddied a pond to stop her drinking, she turned them into frogs.

  **In art:** A woman with two babies, or peasants turning into frogs.

  **Famous works**

  - *Latona Fountain* (Gardens of Versailles)

  *From:* Greek mythology · Ancient Greek
