public_id: 113019
name: Daguan
names:
  - lang: zh
    role: original
    text: 大觀
category: calendar
definition: "Chinese era name (大觀) of the Northern Song for the years 1107–1110: 1107 is Daguan 1 (元年) and Daguan 4 is 1110."
description_md: |-
  **Daguan** (大觀) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1107 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1107 is Daguan 1 (元年), 1110 its last year, Daguan 4. A Chinese source dates a year within it as "Daguan 2" (大觀二年) rather than by a continuous count.

  Before: [[chongning-era|Chongning]]. After: [[zhenghe-era|Zhenghe]].
sources:
  definition:
    - source: dila-time-authority
