public_id: 113339
name: Yuri Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 유리이사금
  - lang: ko-Hani
    role: alternative
    text: 儒理尼師今
category: calendar
definition: "The reign years of Yuri Isageum of Silla (儒理尼師今, 유리이사금), by which Korean histories date 24–57: 24 is Yuri Isageum 1, 57 Yuri Isageum 34."
description_md: |-
  **Yuri Isageum** (儒理尼師今, 유리이사금): the years of the reign of Yuri Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 33 is Yuri Isageum 10 (유리이사금 10년). The year of the accession, 24, counts as the first year.

  Before: [[namhae-chachaung-silla-reign-years|Namhae Chachaung]]. After: [[talhae-isageum-silla-reign-years|Talhae Isageum]].
sources:
  definition:
    - source: dila-time-authority
