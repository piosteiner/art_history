public_id: 131329
name: Ali Baba
category: mythology and legend
definition: In a tale added to the Nights by Antoine Galland, a poor woodcutter who discovers the treasure cave of the forty thieves with the words "Open Sesame!".
description_md: |-
  He heard the thieves say the magic words "Open Sesame!" and stole their gold. The real hero is [[morgiana]], his servant. She marked every door on the street with chalk to confuse the thieves, poured boiling oil into the jars where they were hiding, and killed their leader during a dance with a dagger.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
