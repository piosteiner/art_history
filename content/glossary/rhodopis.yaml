name: Rhodopis
category: mythology and legend
definition: In a story told by Strabo, a courtesan in Egypt whose sandal an eagle dropped in the pharaoh's lap — the oldest Cinderella story.
description_md: |-
  According to the Greek writer Strabo, an eagle stole the sandal of the courtesan Rhodopis while she was bathing, and dropped it into the pharaoh's lap. He searched all of Egypt for the woman whose foot it fit and married her.

  *From:* Strabo, Geography · Ancient Greek, set in Egypt
