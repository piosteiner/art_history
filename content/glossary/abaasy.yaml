name: Abaasy
names: [Abasy]
category: mythology and legend
definition: In Yakut belief, iron-toothed demon-spirits of the lower world, often one-eyed and one-armed, who feed on human souls; the great enemies of the Olonkho.
description_md: |-
  The abaasy are demon-spirits that dwell in the lower world, the "kingdom of darkness". They are often the spirits of the long dead, haunting graves and lonely places and feeding on human souls. They are the great enemies in the Olonkho, and [[nyurgun-bootur]] fights them. They're often described as one-eyed, one-armed and iron-toothed.

  *From:* Olonkho; Yakut belief · Yakut (Sakha)
