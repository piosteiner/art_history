public_id: 131001
name: Bernardo Carpio
category: mythology and legend
definition: A legendary giant strongman of Tagalog folklore, trapped between two mountains in Montalban; his struggles to free himself cause earthquakes, and he will one day break free to liberate his people.
description_md: |-
  Bernardo Carpio is a legendary strongman of Tagalog folklore, sometimes said to be a giant whose huge footprints can be seen in the mountains of Montalban. In the most famous version, he is trapped between two great mountains that crash together. Every time he struggles to free himself, the earth shakes. Legend says one day he will break free and liberate his people. The original pre-colonial name of the hero is lost; the Spanish name came later.

  *From:* folklore · Tagalog (Philippines)
