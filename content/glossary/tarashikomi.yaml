public_id: 105495
name: tarashikomi
names:
  - lang: ja
    role: original
    text: "{たらし込み|たらしこみ}"
  - lang: en
    role: translation
    text: dripping in
category: technique
definition: Dropping ink or colour into a still-wet layer so that the pigments run together in soft, mottled pools; associated with Sōtatsu and the Rinpa painters.
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 316–317
