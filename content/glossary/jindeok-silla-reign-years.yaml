public_id: 113364
name: Jindeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 진덕왕
  - lang: ko-Hani
    role: alternative
    text: 眞德王
category: calendar
parent: korean-calendar
definition: "The reign years of Queen Jindeok of Silla (眞德王, 진덕왕), by which Korean histories date 647–654: 647 is Jindeok 1, 654 Jindeok 8."
description_md: |-
  **Jindeok** (眞德王, 진덕왕): the years of the reign of Queen Jindeok of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 654 is Jindeok 8 (진덕왕 8년). The year of the accession, 647, counts as the first year.

  Before: [[seondeok-silla-reign-years|Seondeok]]. After: [[taejong-muyeol-silla-reign-years|Taejong Muyeol]].
sources:
  definition:
    - source: dila-time-authority
