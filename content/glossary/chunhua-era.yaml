name: Chunhua
names:
  - lang: zh
    role: original
    text: 淳化
category: calendar
parent: chinese-calendar
definition: "Chinese era name (淳化) of the Northern Song for the years 990–994: 990 is Chunhua 1 (元年) and Chunhua 5 is 994."
description_md: |-
  **Chunhua** (淳化) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 990 under Emperor Taizong (太宗). Its years are counted in lunar years: 990 is Chunhua 1 (元年), 994 its last year, Chunhua 5. A Chinese source dates a year within it as "Chunhua 2" (淳化二年) rather than by a continuous count.

  Before: [[duangong-era|Duangong]]. After: [[zhidao-era|Zhidao]].
sources:
  definition:
