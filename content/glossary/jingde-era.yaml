public_id: 112998
name: Jingde
names:
  - lang: zh
    role: original
    text: 景德
category: calendar
definition: "Chinese era name (景德) of the Northern Song for the years 1004–1008: 1004 is Jingde 1 (元年) and Jingde 5 is 1008."
description_md: |-
  **Jingde** (景德) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1004 under Emperor Zhenzong (真宗). Its years are counted in lunar years: 1004 is Jingde 1 (元年), 1008 its last year, Jingde 5. A Chinese source dates a year within it as "Jingde 2" (景德二年) rather than by a continuous count.

  Before: [[xianping-era|Xianping]]. After: [[dazhong-xiangfu-era|Dazhong Xiangfu]].
sources:
  definition:
