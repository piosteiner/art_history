definition: "Japanese era name (宝治) for the years 1247–1249: 1247 is Hōji 1 (元年) and Hōji 3 is 1249."
description_md: |-
  **Hōji** (宝治) is a Japanese era name ([[nengo]]), proclaimed in 1247. Its years are counted in lunar years from the new year before the proclamation: 1247 is Hōji 1 (元年), 1249 its last year, Hōji 3. A Japanese source dates a year within it as "Hōji 2" (宝治2年) rather than by a continuous count.

  Before: Kangen. After: [[kencho-era|Kenchō]].
