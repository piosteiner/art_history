name: The Little Mermaid
category: mythology and legend
definition: In Andersen's fairy tale (1837), a mermaid who gives up her voice to the sea witch to gain legs and win a human prince.
description_md: |-
  She traded her voice to the sea witch for legs, but every step felt like walking on knives. If the prince married someone else, she'd turn into sea foam. He did. Her sisters gave her a knife to kill him and become a mermaid again, but she refused and threw herself into the sea. Her body dissolved into foam, but instead of ceasing to exist she became a daughter of the air, with the chance to earn an immortal soul.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
