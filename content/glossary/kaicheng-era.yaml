public_id: 113105
name: Kaicheng
names:
  - lang: zh
    role: original
    text: 開成
category: calendar
definition: "Chinese era name (開成) of the Tang for the years 836–841: 836 is Kaicheng 1 (元年) and Kaicheng 6 is 841."
description_md: |-
  **Kaicheng** (開成) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 836 under Emperor Wenzong (文宗). Its years are counted in lunar years: 836 is Kaicheng 1 (元年), 841 its last year, Kaicheng 6. A Chinese source dates a year within it as "Kaicheng 2" (開成二年) rather than by a continuous count.

  Before: [[taihe-era|Taihe]]. After: [[huichang-era|Huichang]].
sources:
  definition:
    - source: dila-time-authority
