name: Manco Cápac
category: mythology and legend
definition: The legendary first Inca, who with Mama Ocllo rose from Lake Titicaca and founded Cusco where his golden staff sank into the ground.
description_md: |-
  In one legend (known from Garcilaso de la Vega, 1609), they rose from Lake Titicaca and were sent by the Sun to bring civilisation. They carried a golden staff and walked until it sank completely into the ground, and that's where they founded Cusco. He taught the men farming, and she taught the women spinning.

  *From:* Inca legend · Inca
