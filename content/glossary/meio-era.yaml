definition: "Japanese era name (明応) for the years 1492–1501: 1492 is Meiō 1 (元年) and Meiō 10 is 1501."
description_md: |-
  **Meiō** (明応) is a Japanese era name ([[nengo]]), proclaimed in 1492. Its years are counted in lunar years from the new year before the proclamation: 1492 is Meiō 1 (元年), 1501 its last year, Meiō 10. A Japanese source dates a year within it as "Meiō 2" (明応2年) rather than by a continuous count.

  Before: [[entoku-era|Entoku]]. After: Bunki.
