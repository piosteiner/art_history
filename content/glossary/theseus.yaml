definition: In Greek myth the hero and king of Athens who killed the Minotaur in the Labyrinth on Crete with the help of Ariadne's thread.
description_md: |-
  Hero and king of Athens. He travelled into the Labyrinth on Crete, killed the [[minotaur]], and found his way out with the thread [[ariadne]] gave him. On the way home, he abandoned her on the island of Naxos.

  **In art:** A young hero wrestling or clubbing the Minotaur (half man, half bull), or with Ariadne and her ball of thread.

  **Famous works**

  - Canova, *Theseus and the Minotaur* (V&A, London)
  - Antoine-Louis Barye, *Theseus Fighting the Minotaur*

  *From:* Greek mythology · Ancient Greek
