public_id: 131272
name: Coronis
category: mythology and legend
definition: In Greek myth, Apollo's beloved, shot by him after the raven reported her unfaithfulness; the raven was turned black, and their son was Asclepius.
description_md: |-
  The raven was once white. It told [[apollo]] that his beloved Coronis was unfaithful. In his rage, Apollo shot her, then regretted it immediately. He turned the raven black forever as punishment for bringing bad news. Their son, saved from her body, was [[asclepius]].

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
