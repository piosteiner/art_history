public_id: 131150
name: Étaín
category: mythology and legend
definition: A beautiful woman of Irish legend turned by a jealous rival into a pool of water, a worm and a purple fly, who after years blown about the world fell into a woman's cup and was born again as a human girl.
description_md: |-
  A jealous rival turned her into a pool of water, then a worm, then a glorious purple fly. After being blown around the world for many years, she fell into a woman's cup, was swallowed, and was born again as a human girl.

  *From:* Tochmarc Étaíne (Mythological Cycle) · Irish
