public_id: 131232
name: The Fox and the Crow
category: mythology and legend
definition: "Aesop's fable of a crow who drops her cheese when a flattering fox persuades her to sing: don't trust flatterers."
description_md: |-
  A crow sat in a tree with a piece of cheese. The fox praised her beautiful voice until she opened her beak to sing and dropped it. Moral: don't trust flatterers.

  *From:* Aesop's Fables · Ancient Greek
