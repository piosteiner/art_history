public_id: 113248
name: Gaeru of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 개루왕
  - lang: ko-Hani
    role: alternative
    text: 蓋婁王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gaeru of Baekje (蓋婁王, 개루왕), by which Korean histories date 128–166: 128 is Gaeru 1, 166 Gaeru 39."
description_md: |-
  **Gaeru** (蓋婁王, 개루왕): the years of the reign of King Gaeru of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 137 is Gaeru 10 (개루왕 10년). The year of the accession, 128, counts as the first year.

  Before: [[giru-baekje-reign-years|Giru]]. After: [[chogo-baekje-reign-years|Chogo]].
sources:
  definition:
    - source: dila-time-authority
