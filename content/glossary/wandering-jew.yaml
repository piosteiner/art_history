public_id: 131579
name: Wandering Jew
names: [Ahasver]
category: mythology and legend
definition: A figure of Christian legend, cursed to wander the earth until the Second Coming for mocking Jesus; a legend often used against Jews.
description_md: |-
  This is a Christian, not a Jewish, legend, and it was often used against Jews. A man mocked Jesus on the way to the crucifixion and was cursed to live until the Second Coming. In Germany he was called Ahasver.

  *From:* Christian legend · Christian (European)
