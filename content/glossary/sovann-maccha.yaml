name: Sovann Maccha
names: [Suvannamaccha]
category: mythology and legend
definition: In the Khmer and Thai versions of the Ramayana, the golden mermaid princess, daughter of the demon king, who fell in love with the monkey general Hanuman instead of sabotaging his bridge.
description_md: |-
  Sovann Maccha (Suvannamaccha, "golden fish") appears in the Khmer and Thai versions of the epic, but not the Indian one. She's a mermaid princess and the daughter of the demon king. Her father sends her to sabotage the bridge being built to Lanka, so she and her mermaids carry off the stones. The monkey general [[hanuman]] tries to catch her; she evades him until he woos her, and the two fall in love, and the bridge gets built. She's one of the most beloved figures in Cambodian dance.

  In the Thai and Cambodian versions of the Ramayana (Ramakien and Reamker), the monkey general Hanuman built a bridge to Lanka, but a golden mermaid and her fish kept stealing the stones. Hanuman caught her, they fell in love, and she let him finish the bridge.

  *From:* Reamker; Ramakien · Khmer and Thai
