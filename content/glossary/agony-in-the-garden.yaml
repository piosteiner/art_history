name: Agony in the Garden
names: [The Agony in the Garden, Gethsemane]
category: iconography
definition: Jesus praying in anguish in the Garden of Gethsemane while his disciples sleep.
description_md: |-
  In the Garden of Gethsemane, Jesus prays in anguish while his disciples fall asleep. An angel appears to strengthen him (Luke 22:43); in art the angel often brings a cup, the image of his prayer "let this cup pass from me", the symbol of his coming suffering.

  **In art:** Christ kneeling on a rock in prayer at night, an angel with a chalice, and three sleeping apostles.

  **Famous works**

  - [[artist/andrea-mantegna]], *The Agony in the Garden* (National Gallery, London)
  - [[artist/giovanni-bellini]], *The Agony in the Garden* (National Gallery, London)

  *From:* New Testament, Gospels · Christian
