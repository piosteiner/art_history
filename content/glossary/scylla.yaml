name: Scylla
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the sea monster with six heads (later shown as dogs' heads at her waist), in Ovid's and Hyginus' version once a nymph turned into a monster by Circe, who snatched sailors from passing ships.
description_md: |-
  Two sea monsters on either side of a narrow strait. Scylla, in [[person/ovid]]'s version once a beautiful nymph turned into a monster by the jealous [[circe]], had six heads (later imagined as dogs) that snatched sailors from ships. [[charybdis]] was a whirlpool that swallowed the sea three times a day. "Between Scylla and Charybdis" means choosing between two dangers.

  **In art:** A woman with dogs or serpents growing from her waist, or a ship between a cliff and a whirlpool.

  **Famous works**

  - Bartholomeus Spranger, *Glaucus and Scylla* (Kunsthistorisches Museum, Vienna)
  - [[artist/henry-fuseli]], *Odysseus between Scylla and Charybdis* (Aargauer Kunsthaus, Aarau)

  *From:* Homer, Odyssey; Ovid, Metamorphoses · Ancient Greek
