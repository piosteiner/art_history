definition: "The Three Star Gods of good fortune: Fu (blessings), Lu (prosperity and rank) and Shou (longevity), an old man with a huge bald forehead and a peach."
description_md: |-
  The Three Star Gods of good fortune: Fu (Blessings), Lu (Prosperity and official rank), and Shou (Longevity), an old man with a huge bald forehead and a peach.

  **In art:** Three figures together, often in porcelain.

  **Famous works**

  - *Ming and Qing porcelain, woodblock prints and New Year pictures*

  **Held sacred today:** Some of these figures are still honoured in Daoist and folk religion.

  *From:* Chinese (folk religion)
