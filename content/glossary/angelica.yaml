definition: The princess of Ariosto's Orlando Furioso (1516), chained to a rock as prey for a sea monster and rescued by Ruggiero on a hippogriff.
description_md: |-
  In Ariosto's *Orlando Furioso* (1516), [[ruggiero]] rides a hippogriff (half eagle, half horse) to rescue the princess Angelica, chained to a rock as prey for a sea monster.

  **In art:** A knight on a winged horse spearing a sea monster.

  **Famous works**

  - [[artist/jean-auguste-dominique-ingres]], *Roger Freeing Angelica* (1819; Louvre)

  *From:* Ludovico Ariosto, Orlando Furioso · Italian
