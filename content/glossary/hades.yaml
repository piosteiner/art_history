definition: In Greek myth the god of the Underworld and the dead, brother of Zeus; the Romans called him Pluto.
description_md: |-
  God of the Underworld and the dead, brother of [[zeus]].

  **In art:** Dark and bearded, with a sceptre or bident, and the three-headed dog [[cerberus]] beside him. Usually shown abducting [[persephone]].

  **Famous works**

  - Bernini, *The Rape of Proserpina* (Galleria Borghese) — [[artwork/the-rape-of-proserpina]]
  - [[artist/rembrandt]], *The Rape of Proserpina* (Gemäldegalerie, Berlin)

  *From:* Greek mythology · Ancient Greek
