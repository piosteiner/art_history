name: The Rape of the Sabine Women
names: [The Abduction of the Sabine Women, Sabine women]
category: mythology and legend
also_in: [iconography]
definition: The Roman legend of Romulus's men seizing the daughters of the Sabines, who later threw themselves between the two armies to make peace.
description_md: |-
  The first Romans had no wives, so [[romulus-and-remus|Romulus]] invited the neighbouring Sabines to a festival, and the Romans seized their daughters. Later, when the Sabines attacked Rome, the women, now wives and mothers, threw themselves between the two armies to make peace.

  **In art:** A chaotic scene of soldiers carrying off struggling women, or women with babies standing between armies.

  **Famous works**

  - Giambologna, *The Rape of the Sabine Women* (Loggia dei Lanzi, Florence)
  - [[artist/nicolas-poussin]], *The Abduction of the Sabine Women* (Metropolitan Museum and Louvre)
  - [[artist/jacques-louis-david]], *The Intervention of the Sabine Women* (Louvre)

  *From:* Livy, History of Rome · Ancient Roman
