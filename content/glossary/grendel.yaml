definition: The monster of the Old English epic Beowulf, who attacked the hall of the Danish king Hrothgar until Beowulf tore off his arm.
description_md: |-
  In the Old English epic *Beowulf*, [[beowulf]] tore off the arm of the monster Grendel, who was attacking the hall of the Danish king Hrothgar. He then killed Grendel's mother in her underwater lair.

  **In art:** A warrior wrestling a monster in a mead hall.

  *From:* Beowulf · Anglo-Saxon
