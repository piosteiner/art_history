definition: In Greek myth the son of Odysseus, who set out to find news of his father guided by Athena disguised as Mentor.
description_md: |-
  [[odysseus]]'s son, who grew up without his father. In the *Odyssey*, he sets out to find news of him, guided by [[athena]] disguised as the old man Mentor (the origin of the word "mentor"), and helps him fight the suitors.

  **In art:** A young man travelling with an old adviser, or beside [[penelope]].

  **Famous works**

  - [[artist/jacques-louis-david]], *Farewell of Telemachus and Eucharis* (Getty)

  *From:* Homer, Odyssey · Ancient Greek
