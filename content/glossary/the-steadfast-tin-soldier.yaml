name: The Steadfast Tin Soldier
category: mythology and legend
definition: In Andersen's fairy tale (1838), a one-legged toy soldier who loves a paper ballerina and melts with her in a stove.
description_md: |-
  He fell out of a window, sailed down a gutter in a paper boat, and was swallowed by a fish, which by chance was served back in the same house. A child threw him into the stove, and the wind blew the ballerina in after him. In the morning, all that was left was a small tin heart and her burnt spangle.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
