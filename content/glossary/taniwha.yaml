public_id: 131609
name: Taniwha
category: mythology and legend
definition: Powerful water beings of Māori tradition, guardians or dangerous monsters of rivers, caves and the sea.
description_md: |-
  Taniwha can be guardians who protect a tribe, or dangerous monsters who drown and eat people. They often look like giant lizards, sharks or dragons. When a motorway in New Zealand was planned, it was changed to avoid disturbing a taniwha's home.

  *From:* Māori tradition · Māori
