name: Şahmeran
names: [Shahmaran]
category: mythology and legend
definition: The queen of the snakes in Turkish and Kurdish legend, half woman and half serpent, betrayed by the young man she loved.
description_md: |-
  She lived in a secret cave with her snakes and fell in love with a young man who found her. He promised to keep her secret, but the sultan's vizier forced him to reveal it, because eating her flesh would cure the sultan. Before she died, she told them to give her extract to the vizier and her flesh to the sultan; the vizier died, the sultan recovered, and her beloved, who drank the water she was cooked in, gained her wisdom.

  *From:* folklore · Turkish and Kurdish
