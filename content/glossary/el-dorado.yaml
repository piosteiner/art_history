name: El Dorado
category: mythology and legend
definition: 'The "golden man": a Muisca ritual on Lake Guatavita that the Spanish turned into the legend of a lost city of gold.'
description_md: |-
  It began with a real ritual of the Muisca people: a new chief was covered in gold dust and rowed out onto Lake Guatavita, where he threw gold offerings into the water. The Spanish heard the story and turned it into a lost golden city, and many expeditions died looking for it.

  *From:* legend · Muisca, Spanish colonial
