name: Jiading
names:
  - lang: zh
    role: original
    text: 嘉定
category: calendar
parent: chinese-calendar
definition: "Chinese era name (嘉定) of the Southern Song for the years 1208–1224: 1208 is Jiading 1 (元年) and Jiading 17 is 1224."
description_md: |-
  **Jiading** (嘉定) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1208 under Emperor Ningzong (寧宗). Its years are counted in lunar years: 1208 is Jiading 1 (元年), 1224 its last year, Jiading 17. A Chinese source dates a year within it as "Jiading 2" (嘉定二年) rather than by a continuous count.

  Before: [[kaixi-era|Kaixi]]. After: [[baoqing-era|Baoqing]].
sources:
  definition:
