public_id: 131174
name: Väinämöinen
category: mythology and legend
definition: The old, wise singer-hero of the Finnish Kalevala, who works magic by singing, made the first kantele from a giant pike's jawbone, and at the end sails away in a copper boat, promising to return when needed.
description_md: |-
  He was born already old, after some 730 years in his mother's womb while she floated on the sea (seven hundred years of her wandering and thirty summers more). He works magic by singing, and he once sang a rival into a swamp up to his neck. He made the first *kantele*, a Finnish harp, from the jawbone of a giant pike. At the end of the epic, he sails away in a copper boat and promises to come back when he's needed.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
