name: Pirouz
names: [Piruz]
category: mythology and legend
definition: An Asiatic cheetah born at the Asiatic cheetah breeding centre in Touran (Khar Turan National Park), Iran on 1 May 2022, the first of his kind bred in captivity, who became a national symbol of hope and died on 28 February 2023.
description_md: |-
  Pirouz, meaning "victorious", was born on 1 May 2022 at the Asiatic cheetah breeding centre in Touran, the only survivor of three cubs. The birth was the first time Asiatic cheetahs had reproduced in captivity. After a caesarean birth his mother did not recognise the cubs, and they were raised without her. Pirouz fought on, became famous across Iran, and gave many people hope for this critically endangered cheetah. Sadly, he died of kidney failure on 28 February 2023, at just 10 months old.

  *From:* Iranian
