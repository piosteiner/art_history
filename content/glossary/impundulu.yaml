name: Impundulu
names: [lightning bird]
category: mythology and legend
definition: In Xhosa and Zulu tradition, the lightning bird that strikes where lightning falls and serves witches as a familiar.
description_md: |-
  In Xhosa and Zulu tradition, the impundulu is a lightning bird, said to strike the earth wherever lightning falls. It serves witches as a familiar, can take human form, and in some tales drinks blood. Traditional healers were said to hunt for the eggs it laid where lightning had struck.

  *From:* folklore · Xhosa and Zulu
