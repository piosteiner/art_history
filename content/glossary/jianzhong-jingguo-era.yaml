name: Jianzhong Jingguo
names:
  - lang: zh
    role: original
    text: 建中靖國
category: calendar
parent: chinese-calendar
definition: "Chinese era name (建中靖國) of the Northern Song for the year 1101: 1101 is Jianzhong Jingguo 1 (元年), its only year."
description_md: |-
  **Jianzhong Jingguo** (建中靖國) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1101 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1101 is Jianzhong Jingguo 1 (元年), its only year.

  Before: [[yuanfu-era|Yuanfu]]. After: [[chongning-era|Chongning]].
sources:
  definition:
