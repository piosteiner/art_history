definition: "Japanese era name (元和) for the years 1615–1624: 1615 is Genna 1 (元年) and Genna 10 is 1624."
description_md: |-
  **Genna** (元和) is a Japanese era name ([[nengo]]), proclaimed in 1615. Its years are counted in lunar years from the new year before the proclamation: 1615 is Genna 1 (元年), 1624 its last year, Genna 10. A Japanese source dates a year within it as "Genna 2" (元和2年) rather than by a continuous count.

  Before: [[keicho-era|Keichō]]. After: [[kanei-era|Kan'ei]].
