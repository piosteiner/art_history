name: Alberich
category: mythology and legend
definition: The dwarf who guarded the Nibelung treasure and owned the Tarnkappe, a cloak of invisibility; defeated by Siegfried, he became his treasure-keeper. His name lies behind the French Auberon and the fairy king Oberon.
description_md: |-
  Alberich was the dwarf who guarded the treasure of the Nibelungs and owned the *Tarnkappe*, a magical cloak that made its wearer invisible and gave him the strength of twelve men. [[siegfried]] defeated him and took both. Alberich then became Siegfried's loyal treasure-keeper. The name later inspired the French name "Auberon" and the fairy king [[oberon]].

  *From:* Nibelungenlied · German / Germanic
