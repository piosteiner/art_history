name: The Fountain of Youth
category: iconography
definition: A magical spring that makes anyone who bathes in it young again.
description_md: |-
  A magical spring that makes anyone who bathes in it young again. In Cranach's painting, old women arrive on carts and stretchers on one side and come out young on the other.

  **Famous works**

  - [[artist/lucas-cranach-the-elder]], *The Fountain of Youth* (Gemäldegalerie, Berlin)

