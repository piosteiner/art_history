definition: "Japanese era name (承保) for the years 1074–1077: 1074 is Jōhō 1 (元年) and Jōhō 4 is 1077."
description_md: |-
  **Jōhō** (承保) is a Japanese era name ([[nengo]]), proclaimed in 1074. Its years are counted in lunar years from the new year before the proclamation: 1074 is Jōhō 1 (元年), 1077 its last year, Jōhō 4. A Japanese source dates a year within it as "Jōhō 2" (承保2年) rather than by a continuous count.

  Before: [[enkyu-era|Enkyū]]. After: [[joryaku-era|Jōryaku]].
