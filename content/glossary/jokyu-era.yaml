definition: "Japanese era name (承久) for the years 1219–1222: 1219 is Jōkyū 1 (元年) and Jōkyū 4 is 1222."
description_md: |-
  **Jōkyū** (承久) is a Japanese era name ([[nengo]]), proclaimed in 1219. Its years are counted in lunar years from the new year before the proclamation: 1219 is Jōkyū 1 (元年), 1222 its last year, Jōkyū 4. A Japanese source dates a year within it as "Jōkyū 2" (承久2年) rather than by a continuous count.

  Before: [[kempo-era|Kempo]]. After: [[joo-era-1222|Jōō]].
