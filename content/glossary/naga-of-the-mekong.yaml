public_id: 131562
name: Naga of the Mekong
names: [Naga fireballs]
category: mythology and legend
definition: Giant serpents said to live in the Mekong River, who are said to make the glowing fireballs that rise from the river each October.
description_md: |-
  On the full moon at the end of Buddhist Lent in October, glowing red balls rise out of the Mekong. Local people say they're fireballs breathed out by the Naga to celebrate. Explanations offered range from marsh gas to flares or tracer rounds fired from the Lao bank.

  *From:* folklore · Lao, Thai
