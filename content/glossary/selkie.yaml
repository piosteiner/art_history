name: Selkie
category: mythology and legend
definition: A seal of Irish and Scottish folklore that can take off its skin to become human; a man who hides a selkie woman's skin keeps her as his wife.
description_md: |-
  Selkies are seals that can take off their skins to become humans; if a man hides a selkie woman's skin, she has to stay as his wife.

  *From:* folklore · Irish / Scottish
