definition: Seven gods of good fortune from Japanese, Chinese and Indian traditions, often shown together on their treasure ship.
description_md: |-
  Seven gods of good fortune from Japanese, Chinese and Indian traditions, often shown together on their treasure ship (*takarabune*), which sails into port in the first days of the New Year.

  **In art:** Ebisu (fishing rod and sea bream, god of fishermen and business), Daikokuten (a mallet and rice bales, wealth), Bishamonten (armour and a pagoda, the warrior protector), Benzaiten (the only woman, playing a *biwa* lute, arts and music), Fukurokuju (a very tall forehead, wisdom and longevity), Jurōjin (an old man with a staff and a deer, longevity) and Hotei (the fat laughing monk with a sack, happiness).

  **Famous works**

  - *netsuke, ukiyo-e New Year prints and Kano school paintings*

  **Held sacred today:** The Shinto gods (kami) are still worshipped today.

  *From:* Japanese
