category: calendar
definition: "Japanese era name (寛治) for the years 1087–1094: 1087 is Kanji 1 (元年) and Kanji 8 is 1094."
description_md: |-
  **Kanji** (寛治) is a Japanese era name ([[nengo]]), proclaimed in 1087. Its years are counted in lunar years from the new year before the proclamation: 1087 is Kanji 1 (元年), 1094 its last year, Kanji 8. A Japanese source dates a year within it as "Kanji 2" (寛治2年) rather than by a continuous count.

  Before: [[otoku-era|Ōtoku]]. After: [[kaho-era|Kahō]].
