name: La Befana
names: [Befana]
category: mythology and legend
definition: A kind old witch of Italian folklore who flies on her broom on the night of 5 January, leaving presents for good children and coal for naughty ones.
description_md: |-
  The Three Wise Men stopped at her house and invited her to come with them to see the baby Jesus, but she was too busy cleaning. She changed her mind and went after them, but never found them. On the night of 5 January, she still flies around on her broom and leaves presents for good children and coal for naughty ones.

  *From:* folklore · Italian
