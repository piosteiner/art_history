definition: "Japanese era name (享禄) for the years 1528–1532: 1528 is Kyōroku 1 (元年) and Kyōroku 5 is 1532."
description_md: |-
  **Kyōroku** (享禄) is a Japanese era name ([[nengo]]), proclaimed in 1528. Its years are counted in lunar years from the new year before the proclamation: 1528 is Kyōroku 1 (元年), 1532 its last year, Kyōroku 5. A Japanese source dates a year within it as "Kyōroku 2" (享禄2年) rather than by a continuous count.

  Before: [[daiei-era|Daiei]]. After: [[tenbun-era|Tenbun]].
