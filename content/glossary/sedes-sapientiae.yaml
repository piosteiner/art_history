definition: devotional title for Mary
description_md: |-
  *Sedes sapientiae*, Seat or Throne of Wisdom, is a devotional title of [[person/mary|Mary]]: in images of this type she sits on a throne with the Christ Child on her lap.[[source/wikipedia-en-seat-of-wisdom|§ Introduction]] The invocation arose in the eleventh century; since Christ was understood as Wisdom incarnate, Mary, holding him, becomes its "seat".[[source/wikipedia-en-seat-of-wisdom|§ History]]

  ## Meaning

  The image rests on the typological reading of King Solomon's great throne of ivory overlaid with gold (1 Kings 10:18–20).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 58]] Peter Damian (c. 1007–1072/73) called Mary that "glorious throne": Christ, "our Solomon" and the Wisdom of the Father, prepared a throne for himself in the lap of the chaste Virgin.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 59]] Adam of St Victor's hymn *Salve Mater Salvatoris* addresses her as *thronus Salomonis*, whose ivory and gold signify her chastity and charity.[[source/forsyth-1972-the-throne-of-wisdom|p. 26]] Reliefs at Arezzo and Beaucaire carry the inscription "On the lap of the Mother sits the Wisdom of the Father", and the statue of the priest Martinus of 1199 a similar one.[[source/forsyth-1972-the-throne-of-wisdom|pp. 26–27]] The Child is shown not as an infant but as a "child-man", strictly frontal on the central axis as in the Byzantine *nikopoia*; holding a book and blessing, he appears as king and priest, while Mary, as his mother, embodies the lineage of David.[[source/forsyth-1972-the-throne-of-wisdom|pp. 22–23]] [[source/forsyth-1972-the-throne-of-wisdom|p. 28]]

  ## Romanesque wooden statues

  Romanesque Madonnas in Majesty have two irreducible features: the Throne of Wisdom iconography and their mobility.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]] To be carried they had to be light, under life-size and made of wood, and they were carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]] The earliest were completely sheathed in gold or silver, such as the tenth-century golden Madonna of Clermont-Ferrand, now lost; by the second quarter of the eleventh century plain painted wooden statues were common, and in the twelfth they far outnumbered the metal ones.[[source/forsyth-1972-the-throne-of-wisdom|pp. 10, 15]] More than a hundred survive in France alone, most from the twelfth century and the largest number from the Auvergne.[[source/forsyth-1972-the-throne-of-wisdom|pp. 9, 15, 19]] Examples include the [[artwork/morgan-madonna|Morgan Madonna]], [[artwork/montvianeix-madonna|Notre-Dame de Montvianeix]], the [[artwork/autun-madonna|Autun Madonna]] and the [[artwork/madonna-des-presbyters-martinus|Madonna of the priest Martinus]].[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folien 34–46]]

  Frank Fehrenbach warned against classing the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]] as a *sedes sapientiae*, since its Child is not enthroned and does not face the beholder.[[source/fehrenbach-1996-die-goldene-madonna|p. 76]] In the second half of the twelfth century the type dominated the tympana of the great cathedrals, as in the Incarnation portal at Chartres; Gothic art separated its strands again.[[source/forsyth-1972-the-throne-of-wisdom|pp. 29–30]]
