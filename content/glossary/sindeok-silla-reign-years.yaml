public_id: 113389
name: Sindeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 신덕왕
  - lang: ko-Hani
    role: alternative
    text: 神德王
category: calendar
parent: korean-calendar
definition: "The reign years of King Sindeok of Silla (神德王, 신덕왕), by which Korean histories date 912–917: 912 is Sindeok 1, 917 Sindeok 6."
description_md: |-
  **Sindeok** (神德王, 신덕왕): the years of the reign of King Sindeok of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 917 is Sindeok 6 (신덕왕 6년). The year of the accession, 912, counts as the first year.

  Before: [[hyogong-silla-reign-years|Hyogong]]. After: [[gyeongmyeong-silla-reign-years|Gyeongmyeong]].
sources:
  definition:
    - source: dila-time-authority
