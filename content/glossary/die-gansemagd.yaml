name: Die Gänsemagd
names: [The Goose Girl]
category: mythology and legend
definition: In the Grimms' fairy tale, a princess forced by her servant to change places with her and to work as a goose girl.
description_md: |-
  On her journey to her wedding, her servant forced her to swap places and had her talking horse [[falada]] killed. The horse's head was nailed above a gate, where it still spoke to her every morning. In the end, the truth was found out, and the false bride was cruelly punished.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
