name: porcelain
names:
  - lang: ja
    role: original
    text: "{磁器|じき}"
category: material
definition: A white, translucent ceramic of kaolin clay fired at a very high temperature; made in China for centuries, in Japan from about 1616 at Arita in Kyūshū, where Korean potters found the clay.
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 292–293
