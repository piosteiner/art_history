name: Plains ledger art
names: [ledger art, Fort Marion]
category: art style
definition: Drawings by Plains artists of the late nineteenth century on the pages of accounting ledger books, after the destruction of the buffalo ended painting on hides.
description_md: |-
  Drawings by Plains artists (Cheyenne, Kiowa, Lakota and others) in the late 19th century, on pages of accounting ledger books. Painting on buffalo hides was traditional; when the buffalo were destroyed, artists used paper. Some of the most famous were made by Kiowa and Cheyenne men imprisoned at Fort Marion in Florida (1875–1878).

  **In art:** Lively drawings of warriors on horseback, battles, ceremonies and daily life, drawn over the printed lines of the ledgers.

  **Famous works**

  - *Fort Marion ledger books* (various museums)
  - Dwayne Wilcox (Oglala Lakota), *contemporary ledger art*

  **Held sacred today:** Some drawings show sacred ceremonies like the Sun Dance, so take care which images you use.

  *From:* Cheyenne, Kiowa, Lakota and other Plains nations
