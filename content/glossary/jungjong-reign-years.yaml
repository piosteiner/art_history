definition: "The reign years of Jungjong of Joseon (中宗, 중종), by which Korean sources date 1506–1544: 1506 is Jungjong 1, 1544 Jungjong 39."
description_md: |-
  **Jungjong** (中宗, 중종): the years of the reign of [[person/jungjong-of-joseon|Jungjong of Joseon]], who came to the throne on 12 September 1506. Korean sources count years by the reigning king ([[korean-reign-years]]): 1515 is Jungjong 10 (중종 10년). His first year is the year of his accession — he replaced his predecessor by force or founded the dynasty.

  Before: [[yeonsangun-reign-years|Yeonsangun]]. After: [[injong-reign-years|Injong]].
