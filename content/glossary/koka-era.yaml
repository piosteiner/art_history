category: calendar
definition: "Japanese era name (弘化) for the years 1844–1848: 1844 is Kōka 1 (元年) and Kōka 5 is 1848."
description_md: |-
  **Kōka** (弘化) is a Japanese era name ([[nengo]]), proclaimed in 1845. Its years are counted in lunar years from the new year before the proclamation: 1844 is Kōka 1 (元年), 1848 its last year, Kōka 5. A Japanese source dates a year within it as "Kōka 2" (弘化2年) rather than by a continuous count.

  Before: [[tenpo-era|Tenpō]]. After: [[kaei-era|Kaei]].
