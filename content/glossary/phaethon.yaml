definition: In Greek myth, retold by Ovid, the son of the sun god Helios who lost control of his father's sun chariot and was struck down by Zeus.
description_md: |-
  He begged his father [[helios]] to let him drive the sun chariot for one day. He lost control of the horses, scorching the earth (which, the story says, turned Africa's deserts to sand and its people's skin dark) until [[zeus]] struck him down with a thunderbolt. His grieving sisters, the Heliades, turned into poplar trees, and their tears became amber.

  Helios is the sun god who drives the sun chariot across the sky (later merged with [[apollo]]). His son Phaethon begged to drive it, lost control, scorched the earth and was struck down by Zeus's thunderbolt.

  **In art:** Phaethon is shown tumbling from the sky.

  **Famous works**

  - Rubens, *The Fall of Phaeton* (National Gallery of Art, Washington)
  - [[artist/michelangelo]], *The Fall of Phaeton* (drawing)

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
