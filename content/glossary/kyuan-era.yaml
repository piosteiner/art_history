category: calendar
definition: "Japanese era name (久安) for the years 1145–1150: 1145 is Kyūan 1 (元年) and Kyūan 6 is 1150."
description_md: |-
  **Kyūan** (久安) is a Japanese era name ([[nengo]]), proclaimed in 1145. Its years are counted in lunar years from the new year before the proclamation: 1145 is Kyūan 1 (元年), 1150 its last year, Kyūan 6. A Japanese source dates a year within it as "Kyūan 2" (久安2年) rather than by a continuous count.

  Before: [[tenyo-era|Ten'yō]]. After: Ninpei.
