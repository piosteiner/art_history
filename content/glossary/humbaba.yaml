name: Humbaba
names: [Huwawa]
category: mythology and legend
definition: In the Epic of Gilgamesh, the monstrous guardian of the Cedar Forest, killed by Gilgamesh and Enkidu.
description_md: |-
  He had seven terrifying auras, and some ancient images (such as clay masks of c. 1800–1600 BC) show his face as coiled intestines. [[gilgamesh]] and [[enkidu]] killed him and cut down his cedars.

  *From:* Epic of Gilgamesh · Mesopotamian (Sumerian, Babylonian, Assyrian)
