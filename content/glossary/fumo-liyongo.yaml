name: Fumo Liyongo
names: [Liyongo]
category: mythology and legend
definition: The hero-poet of the Swahili coast, a giant warrior who could only be killed with a copper nail or pin in his navel.
description_md: |-
  A giant warrior and poet of the Swahili coast. Nobody could kill him with a weapon, except with a copper needle stuck into his navel. His own son was bribed to betray him and stabbed him. Some sources say that, struck by the copper pin, Liyongo knelt, leaning on his bow, so that his death would not be seen.

  *From:* Swahili epic poetry · Swahili
