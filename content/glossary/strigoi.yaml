public_id: 131449
name: Strigoi
category: mythology and legend
definition: In Romanian folklore, the restless dead who rise from their graves, or living witches whose souls leave their bodies at night, draining the life of relatives and livestock.
description_md: |-
  Strigoi are the troubled souls of the dead who rise from their graves, or living witches whose souls leave their bodies at night. They drain the life from relatives and livestock. Garlic, stakes and turning the corpse face down were ways to stop them.

  *From:* Romanian folklore · Romanian
