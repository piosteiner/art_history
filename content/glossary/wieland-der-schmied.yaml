name: Wieland der Schmied
names: [Wayland the Smith, Völundr, Wieland, Völund]
category: mythology and legend
definition: The master smith of Germanic legend (English Wayland, Norse Völund), lamed and held captive by a greedy king, who took terrible revenge and flew away on wings he had forged.
description_md: |-
  Wieland (English Wayland, Norse Völund) was the greatest smith of legend. A greedy king captured him, had his tendons cut so he couldn't escape, and forced him to forge treasures on an island. Wieland took terrible revenge: he killed the king's sons and made goblets from their skulls. Then he forged himself a pair of wings and flew away, laughing, from the king's hall.

  In England, a Neolithic burial mound in Oxfordshire is called Wayland's Smithy. According to legend, if you leave your horse there overnight with a coin, he'll shoe it by morning.

  *From:* Germanic legend (Völundarkviða, Thidrekssaga) · German / Germanic
