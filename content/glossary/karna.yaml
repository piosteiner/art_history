name: Karna
category: mythology and legend
definition: In the Mahabharata, the generous archer born to a princess and the sun god, raised by a charioteer, who fought against his own brothers out of loyalty to his friend.
description_md: |-
  Karna is one of the most beloved tragic heroes of the Mahabharata. Born to a princess and the sun god, he was abandoned at birth in a basket on a river and raised by a humble charioteer. All his life he was mocked for his low birth, despite being one of the greatest archers ever. Out of loyalty to the one prince who befriended him, he fought against his own brothers, without knowing for most of his life that they were his brothers. He was famous for never refusing anyone who asked him for something, even when it cost him his own protective armour.

  *From:* Mahabharata · Indian
