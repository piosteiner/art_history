name: Hanuman
category: religion
definition: The devoted monkey companion of Rama in the Ramayana, spiritual son of the wind god Vayu, one of the most widely worshipped deities of Hinduism.
description_md: |-
  Hanuman is a divine *vanara* (monkey being) and the devoted companion of the prince [[rama]]. He is said to be the son of the wind god Vayu. When Sita was abducted, he leapt across the sea to Lanka, found her, and set the city ablaze with his burning tail. Later, when Rama's brother Lakshmana was mortally wounded, Hanuman flew to the Himalayas and, unsure which herb would heal him, carried back the whole mountain. He is considered immortal. In the Khmer Reamker, he appears as a white monkey.

  **Held sacred today:** Hanuman is one of the most widely worshipped deities in Hinduism, with temples and daily prayers across India and beyond.

  *From:* Ramayana · Hindu
