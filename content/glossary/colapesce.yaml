name: Colapesce
names: [Cola Pesce, Nicola]
category: mythology and legend
definition: A boy of Sicilian legend who became half fish and stayed beneath the sea to hold up the breaking column on which Sicily stands.
description_md: |-
  Nicola loved the sea so much that his mother cursed him to become a fish. The king tested him by throwing a cup and his crown into the sea, and Nicola fetched them. Diving deep, he found that Sicily stands on three columns, and one of them is breaking. He stayed down there to hold it up, and when he shifts his weight, Mount Etna rumbles.

  *From:* folklore · Sicilian
