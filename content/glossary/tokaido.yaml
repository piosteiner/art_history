definition: "The Eastern Sea Road: the main highway of Edo-period Japan, from Nihonbashi in Edo along the Pacific coast of Honshū to Kyoto, with fifty-three post stations — the subject of Hiroshige’s Fifty-three Stations and of several of Hokusai’s views of Mount Fuji."
description_md: |-
  The **Tōkaidō** (東海道, “Eastern Sea Road”) was the main highway of Tokugawa Japan. It followed the east coast of Honshū from Edo to the head of Ise Bay and turned inland towards Lake Biwa and Kyoto, its terminal point.^[“This ‘Eastern Sea Route’ was the main highway that followed the east coast of Honshu from Edo to the head of Ise Bay and then turned inland towards Lake Biwa and the terminal point of Kyoto” — [[source/history-of-japanese-art|279]]] Between Nihonbashi in Edo and the Sanjō Ōhashi bridge in Kyoto lay fifty-three post stations (shukuba), where travellers changed horses and porters and found inns; the crossing of Ise Bay from Miya to Kuwana, seventeen miles by boat, was its longest and most dangerous passage.^[“the longest water passage along the Tokaido and also the most dangerous” — [[source/history-of-japanese-art|292]]]^[The fifty-three stations in order, from Shinagawa to Ōtsu: [[source/wikipedia-ja-tokaido-gojusan-tsugi]]]

  The road was a subject in its own right. The small towns along it produced Ōtsu-e, cheap pictures named after the station of Ōtsu.^[“These much cruder images are known as Otsu-e, after a town famous for producing them on the Tōkaidō” — [[source/history-of-japanese-art|279]]] In the summer of 1832 Hiroshige travelled it to Kyoto with the convoy carrying the shōgun’s annual gift of horses to the emperor, and from the journey came the *Fifty-three Stations of the Tōkaidō* (published 1834), the series that made his name and eclipsed Hokusai’s.^[“in the summer of 1832 … Hiroshige set out for Kyoto along the Tokaido with a convoy escorting a group of horses, an annual gift from the shogun to the emperor” · “So popular was the Tokaido series that Hiroshige’s reputation quickly eclipsed that of Hokusai” — [[source/history-of-japanese-art|292–293]]] Several of Hokusai’s [[artwork/thirty-six-views-of-mount-fuji]] look at the mountain from its stations — five name the road in their titles (Hodogaya, Yoshida, Kanaya, Ejiri and Tago Bay, Shinagawa’s Goten-yama) — and its course is drawn on that series’ map. The road itself is the place [[place/tokaido]].
