definition: In Greek myth the goddess of love and beauty, in Hesiod's version born from the sea foam (in Homer the daughter of Zeus and Dione); the Romans called her Venus.
description_md: |-
  Goddess of love and beauty, in Hesiod's version born from the sea foam (in [[person/homer]] the daughter of [[zeus]] and Dione).

  **In art:** Usually nude or lightly draped, with her son [[eros]] (Cupid), doves, swans, roses, a mirror or a scallop shell.

  **Famous works**

  - *Venus de Milo* (Louvre) — [[artwork/venus-de-milo]]
  - Praxiteles, *Aphrodite of Knidos* (copies)
  - Botticelli, *The Birth of Venus* and *Primavera* (Uffizi, Florence) — [[artwork/the-birth-of-venus]]
  - [[artist/titian]], *Venus of Urbino* (Uffizi, Florence) — [[artwork/venus-of-urbino]]
  - Velázquez, *The Rokeby Venus* (National Gallery, London)

  *From:* Greek mythology · Ancient Greek
