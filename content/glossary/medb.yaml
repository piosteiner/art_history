name: Medb
names: [Maeve]
category: mythology and legend
definition: The proud warrior queen of Connacht in the Ulster Cycle who, finding her husband one prize bull richer, started the Cattle Raid of Cooley to steal the Brown Bull of Ulster.
description_md: |-
  When she argued with her husband about who was richer, she found he had one prize bull more than she did. So she started a war, the Cattle Raid of Cooley (*Táin Bó Cúailnge*), to steal the great Brown Bull of Ulster.

  *From:* Ulster Cycle (Táin Bó Cúailnge) · Irish
