public_id: 113349
name: Michu Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 미추이사금
  - lang: ko-Hani
    role: alternative
    text: 味鄒尼師今
category: calendar
definition: "The reign years of Michu Isageum of Silla (味鄒尼師今, 미추이사금), by which Korean histories date 262–284: 262 is Michu Isageum 1, 284 Michu Isageum 23."
description_md: |-
  **Michu Isageum** (味鄒尼師今, 미추이사금): the years of the reign of Michu Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 271 is Michu Isageum 10 (미추이사금 10년). The year of the accession, 262, counts as the first year.

  Before: [[cheomhae-isageum-silla-reign-years|Cheomhae Isageum]]. After: [[yurye-isageum-silla-reign-years|Yurye Isageum]].
sources:
  definition:
    - source: dila-time-authority
