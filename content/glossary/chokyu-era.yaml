definition: "Japanese era name (長久) for the years 1040–1044: 1040 is Chōkyū 1 (元年) and Chōkyū 5 is 1044."
description_md: |-
  **Chōkyū** (長久) is a Japanese era name ([[nengo]]), proclaimed in 1040. Its years are counted in lunar years from the new year before the proclamation: 1040 is Chōkyū 1 (元年), 1044 its last year, Chōkyū 5. A Japanese source dates a year within it as "Chōkyū 2" (長久2年) rather than by a continuous count.

  Before: [[choryaku-era|Chōryaku]]. After: [[kantoku-era|Kantoku]].
