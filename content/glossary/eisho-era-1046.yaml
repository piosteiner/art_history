category: calendar
definition: "Japanese era name (永承) for the years 1046–1052: 1046 is Eishō 1 (元年) and Eishō 7 is 1052."
description_md: |-
  **Eishō** (永承) is a Japanese era name ([[nengo]]), proclaimed in 1046. Its years are counted in lunar years from the new year before the proclamation: 1046 is Eishō 1 (元年), 1052 its last year, Eishō 7. A Japanese source dates a year within it as "Eishō 2" (永承2年) rather than by a continuous count.

  Before: [[kantoku-era|Kantoku]]. After: [[tengi-era|Tengi]].
