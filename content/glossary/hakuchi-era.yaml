name: Hakuchi
names:
  - lang: ja
    role: original
    text: 白雉
category: calendar
definition: "Japanese era name (白雉) for the years 650–654: 650 is Hakuchi 1 (元年) and Hakuchi 5 is 654."
description_md: |-
  **Hakuchi** (白雉) is a Japanese era name ([[nengo]]), proclaimed in 650. Its years are counted in lunar years from the new year before the proclamation: 650 is Hakuchi 1 (元年), 654 its last year, Hakuchi 5. A Japanese source dates a year within it as "Hakuchi 2" (白雉2年) rather than by a continuous count.

  Before: [[taika-era|Taika]]. After: [[shucho-era|Shuchō]].
