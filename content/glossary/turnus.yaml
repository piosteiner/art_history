definition: In Virgil's Aeneid, Lavinia's former suitor, who led the war against Aeneas and was killed by him in single combat.
description_md: |-
  Characters from the second half of the *Aeneid*. [[lavinia]] was the Latin princess [[aeneas]] married. Turnus, her former suitor, led the war against Aeneas and was killed by him in single combat.

  **In art:** Duels between armoured heroes.

  **Famous works**

  - Luca Giordano, *The Duel of Aeneas and Turnus* (Bavarian State Painting Collections, Munich)
  - [[artist/pietro-da-cortona]], *Aeneid* frescoes (Palazzo Pamphilj, Rome)

  *From:* Virgil, Aeneid · Ancient Roman
