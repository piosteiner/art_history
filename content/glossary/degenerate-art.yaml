definition: term used by the German Nazi regime to describe modern art
description_md: |-
  The term was older than National Socialism: the regime took up the nineteenth-century discourse of decadence and degeneration, narrowed it to racist themes and made it the basis of a destructive art policy; "degenerate art" and "looted art" are distinct, Peters stresses, but interwoven.[[source/peters-2017|pp. 9–10]] Expressionism bore the brunt — "at variance with natural instincts", "alien to the race", "Papuan-like" — and pamphlets after Rosenberg's *Myth of the Twentieth Century* called it "mongrel art"; Wolfgang Willrich's pamphlet of 1937 denounced the "cultural Bolshevism" of the Expressionists, and Bettina Feistel-Rohmeder's *Im Terror des Kunstbolschewismus* and Adolf Dresler's *Deutsche Kunst und entartete Kunst* (1939) the "scrawlings of subhumans".[[source/hermand-1994|pp. 37, 40]]

  After the "exhibitions of shame" from 1933,[[source/peters-2017|p. 10]] works so labelled were confiscated from German public collections from 1937 — first on Hitler's decree of 30 June 1937 for [[artist/adolf-ziegler|Adolf Ziegler]], legalised only afterwards by the law of 31 May 1938 on the confiscation of products of degenerate art[[source/peters-2017|p. 17]] — and shown in the [[event/degenerate-art-exhibition|*Entartete Kunst* exhibition]] in Munich and on its tour. Peters puts the number of works taken at nearly twenty-two thousand, mostly on paper, about a quarter of them destroyed;[[source/peters-2017|p. 28]] Hermand at about sixteen thousand, and in Berlin alone in March 1939 1,004 paintings and 3,825 works on paper were burned.[[source/hermand-1994|p. 40]] A commission chaired by [[person/joseph-goebbels|Goebbels]] had the rest sold or exchanged abroad for foreign currency by four dealers, and 125 works were auctioned in Lucerne on 30 June 1939; this "Verwertungsaktion" officially ended in 1941.[[source/peters-2017|pp. 26, 28–29]]

  Im Jahr 2026 erinnern die Forderungen und Formulierungen der AfD an die der NS-Zeit.[[source/tages-anzeiger-afd-angriff-auf-das-bauhaus]]
