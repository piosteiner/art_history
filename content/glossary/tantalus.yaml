public_id: 131840
name: Tantalus
category: mythology and legend
definition: In Greek myth the king who served his own son as a meal to the gods and stands for ever in Tartarus beneath fruit and water that move out of reach (hence "tantalise").
description_md: |-
  Four men punished forever in Tartarus. Tantalus served his own son as a meal to the gods, and stands in water beneath fruit trees, but the water and fruit always move out of reach (hence "tantalise").

  *From:* Greek mythology · Ancient Greek
