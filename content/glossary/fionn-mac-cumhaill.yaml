name: Fionn mac Cumhaill
names: [Finn McCool]
category: mythology and legend
definition: The leader of the Fianna in the Irish Fenian Cycle, who gained all the world's wisdom by sucking his thumb burnt on the Salmon of Knowledge; in folklore a giant who built the Giant's Causeway.
description_md: |-
  As a boy, he burnt his thumb cooking the Salmon of Knowledge, and when he sucked it, he gained all the world's wisdom. In folklore, he became a giant who built the Giant's Causeway to cross the sea to Scotland.

  *From:* Fenian Cycle · Irish
