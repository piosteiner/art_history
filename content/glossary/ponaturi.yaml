public_id: 131611
name: Ponaturi
category: mythology and legend
definition: Sea goblins of Māori tradition who come ashore at night and are killed by sunlight; the hero Tawhaki tricked them into sleeping past dawn.
description_md: |-
  These goblins live under the sea and come onto land at night to sleep in a great house. Sunlight kills them. In one version the hero Tawhaki and his brother Karihi, helped by their mother Urutonga, tricked them by blocking up all the gaps of the house so they slept past dawn, then set fire to the house and opened the door to let in the sun.

  *From:* Māori tradition · Māori
