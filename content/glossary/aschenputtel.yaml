name: Aschenputtel
names: [Cinderella]
category: mythology and legend
definition: In the Grimms' fairy tale, a girl forced to do housework in the ashes who goes to the king's ball in dresses thrown down by a bird in the hazel tree on her mother's grave.
description_md: |-
  In the Grimm version, there's no fairy godmother. Instead, a bird in the hazel tree she planted on her mother's grave throws down her dresses, and doves help her. Her stepsisters cut off parts of their own feet to fit the golden slipper, and doves peck out their eyes at the wedding.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
