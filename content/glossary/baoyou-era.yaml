name: Baoyou
names:
  - lang: zh
    role: original
    text: 寶祐
category: calendar
parent: chinese-calendar
definition: "Chinese era name (寶祐) of the Southern Song for the years 1253–1258: 1253 is Baoyou 1 (元年) and Baoyou 6 is 1258."
description_md: |-
  **Baoyou** (寶祐) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1253 under Emperor Lizong (理宗). Its years are counted in lunar years: 1253 is Baoyou 1 (元年), 1258 its last year, Baoyou 6. A Chinese source dates a year within it as "Baoyou 2" (寶祐二年) rather than by a continuous count.

  Before: [[chunyou-era|Chunyou]]. After: [[kaiqing-era|Kaiqing]].
sources:
