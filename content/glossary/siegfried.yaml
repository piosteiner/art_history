name: Siegfried
names: [Sigurd, Sigurðr]
category: mythology and legend
definition: The dragon slayer of the Nibelungenlied (Norse Sigurd), whose bath in dragon's blood made his skin hard as horn except where a linden leaf fell; Hagen speared him in that spot.
description_md: |-
  Siegfried (the Norse Sigurd) is the great hero of the Nibelungenlied. He killed a dragon and bathed in its blood, which made his skin as hard as horn. But a linden leaf fell between his shoulder blades while he bathed, leaving one spot unprotected. He won the treasure of the Nibelungs and a cloak of invisibility, and married the Burgundian princess [[kriemhild]]. Trusting her husband's safety to the wrong man, Kriemhild sewed a cross onto his clothing to mark his weak spot. Hagen used it to spear Siegfried in the back while he drank from a spring.

  *From:* Nibelungenlied · German / Germanic
