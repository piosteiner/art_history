name: Zhenming
names:
  - lang: zh
    role: original
    text: 貞明
category: calendar
parent: chinese-calendar
definition: "Chinese era name (貞明) of the Later Liang for the years 915–921: 915 is Zhenming 1 (元年) and Zhenming 7 is 921."
description_md: |-
  **Zhenming** (貞明) is a Chinese era name ([[nianhao]]) of the Later Liang, proclaimed in 915 under Zhu Youzhen (末帝). Its years are counted in lunar years: 915 is Zhenming 1 (元年), 921 its last year, Zhenming 7. A Chinese source dates a year within it as "Zhenming 2" (貞明二年) rather than by a continuous count.

  Before: [[qianhua-era|Qianhua]]. After: [[longde-era|Longde]].
sources:
