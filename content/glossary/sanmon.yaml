public_id: 107508
name: sanmon
names:
  - lang: ja
    role: original
    text: "{三門|さんもん}"
category: architecture
definition: "The “mountain gate” of a Zen temple: two storeys, three entrance doors below, an upper floor reached by covered stairs that holds images of Shaka and the sixteen rakan."
sources:
