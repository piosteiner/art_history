definition: "Japanese era name (元亀) for the years 1570–1573: 1570 is Genki 1 (元年) and Genki 4 is 1573."
description_md: |-
  **Genki** (元亀) is a Japanese era name ([[nengo]]), proclaimed in 1570. Its years are counted in lunar years from the new year before the proclamation: 1570 is Genki 1 (元年), 1573 its last year, Genki 4. A Japanese source dates a year within it as "Genki 2" (元亀2年) rather than by a continuous count.

  Before: [[eiroku-era|Eiroku]]. After: [[tensho-era-1573|Tenshō]].
