category: calendar
definition: "Japanese era name (正安) for the years 1299–1301: 1299 is Shōan 1 (元年) and Shōan 3 is 1301."
description_md: |-
  **Shōan** (正安) is a Japanese era name ([[nengo]]), proclaimed in 1299. Its years are counted in lunar years from the new year before the proclamation: 1299 is Shōan 1 (元年), 1301 its last year, Shōan 3. A Japanese source dates a year within it as "Shōan 2" (正安2年) rather than by a continuous count.

  Before: Einin. After: Kengen.
