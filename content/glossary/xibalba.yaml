name: Xibalba
names: [One Death, Seven Death]
category: mythology and legend
definition: The Maya underworld, "the place of fear", ruled by One Death and Seven Death, the setting of the Hero Twins' trials in the Popol Vuh.
description_md: |-
  It was ruled by One Death and Seven Death, with demon lords like Pus Master, Bone Sceptre and Blood Gatherer, each of whom brought a different kind of illness or death. You reached it by a road down through rivers of blood and scorpions.

  *From:* Popol Vuh · K'iche' Maya
