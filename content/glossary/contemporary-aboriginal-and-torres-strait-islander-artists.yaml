name: Contemporary Aboriginal and Torres Strait Islander artists
names: [Gordon Bennett, Tracey Moffatt, Rover Thomas, Ken Thaiday Sr, Archie Moore, dhari]
category: art style
definition: Important contemporary artists such as Gordon Bennett, Tracey Moffatt, Rover Thomas, Ken Thaiday Sr and Archie Moore, winner of the Golden Lion at the 2024 Venice Biennale.
description_md: |-
  Some important contemporary artists: Gordon Bennett, paintings on colonial history; Tracey Moffatt, photography and film; Rover Thomas (Kukatja and Wangkajunga), painter of the Kimberley and Warmun; Ken Thaiday Sr (Meriam, Torres Strait), dance headdresses (*dhari*); Archie Moore (Kamilaroi and Bigambul), whose installation *kith and kin* won the Golden Lion at the 2024 Venice Biennale.

  **Famous works**

  - Gordon Bennett, *Possession Island (Abstraction)* (1991, Tate)
  - Tracey Moffatt, *Something More* (1989, MCA Australia)
  - Archie Moore, *kith and kin* (Golden Lion 2024; QAGOMA and Tate)
  - Ken Thaiday Sr, *Baizam dhari (Hammerhead shark headdress)* (NGV)

  **Held sacred today:** Aboriginal and Torres Strait Islander visitors are warned that this page contains names and images of deceased persons.

  *From:* Aboriginal and Torres Strait Islander
