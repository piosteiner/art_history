category: calendar
definition: "Japanese era name (応安) for the years 1368–1374: 1368 is Ōan 1 (元年) and Ōan 7 is 1374."
description_md: |-
  **Ōan** (応安) is a Japanese era name ([[nengo]]), proclaimed in 1368. Its years are counted in lunar years from the new year before the proclamation: 1368 is Ōan 1 (元年), 1374 its last year, Ōan 7. A Japanese source dates a year within it as "Ōan 2" (応安2年) rather than by a continuous count.

  Before: [[joji-era|Jōji]]. After: [[eiwa-era|Eiwa]].
