public_id: 113311
name: Deokjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 덕종
  - lang: ko-Hani
    role: alternative
    text: 德宗
category: calendar
parent: korean-calendar
definition: "The reign years of King Deokjong of Goryeo (德宗, 덕종), by which Korean histories date 1032–1034: 1032 is Deokjong 1, 1034 Deokjong 3."
description_md: |-
  **Deokjong** (德宗, 덕종): the years of the reign of King Deokjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1034 is Deokjong 3 (덕종 3년). The year of the accession, 1032, counts as the first year.

  Before: [[hyeonjong-goryeo-reign-years|Hyeonjong]]. After: [[jeongjong-goryeo-reign-years-1035|Jeongjong]].
sources:
  definition:
    - source: dila-time-authority
