public_id: 113003
name: Mingdao
names:
  - lang: zh
    role: original
    text: 明道
category: calendar
definition: "Chinese era name (明道) of the Northern Song for the years 1032–1033: 1032 is Mingdao 1 (元年) and Mingdao 2 is 1033."
description_md: |-
  **Mingdao** (明道) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1032 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1032 is Mingdao 1 (元年), 1033 its last year, Mingdao 2. A Chinese source dates a year within it as "Mingdao 2" (明道二年) rather than by a continuous count.

  Before: [[tiansheng-era|Tiansheng]]. After: [[jingyou-era|Jingyou]].
sources:
