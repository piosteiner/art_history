name: Shahryar
category: mythology and legend
definition: In the One Thousand and One Nights, the king who, betrayed by his wife, married a new bride every night and had her killed, until Scheherazade's stories stopped him.
description_md: |-
  After his wife betrayed him, King Shahryar married a new bride every night and had her killed the next morning. [[scheherazade]] volunteered to marry him. Her younger sister [[dunyazad]] asked for a story every night, as they'd planned, and Scheherazade always stopped at the most exciting part, so the king kept her alive to hear the end.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
