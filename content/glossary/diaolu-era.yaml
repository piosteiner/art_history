name: Diaolu
names:
  - lang: zh
    role: original
    text: 調露
category: calendar
parent: chinese-calendar
definition: "Chinese era name (調露) of the Tang for the years 679–680: 679 is Diaolu 1 (元年) and Diaolu 2 is 680."
description_md: |-
  **Diaolu** (調露) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 679 under Emperor Gaozong (高宗). Its years are counted in lunar years: 679 is Diaolu 1 (元年), 680 its last year, Diaolu 2. A Chinese source dates a year within it as "Diaolu 2" (調露二年) rather than by a continuous count.

  Before: [[yifeng-era|Yifeng]]. After: [[yonglong-era|Yonglong]].
sources:
