name: Chunxi
names:
  - lang: zh
    role: original
    text: 淳熙
category: calendar
parent: chinese-calendar
definition: "Chinese era name (淳熙) of the Southern Song for the years 1174–1190: 1174 is Chunxi 1 (元年) and Chunxi 17 is 1190."
description_md: |-
  **Chunxi** (淳熙) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1174 under Emperor Xiaozong (孝宗). Its years are counted in lunar years: 1174 is Chunxi 1 (元年), 1190 its last year, Chunxi 17. A Chinese source dates a year within it as "Chunxi 2" (淳熙二年) rather than by a continuous count.

  Before: [[qiandao-era|Qiandao]]. After: [[shaoxi-era|Shaoxi]].
sources:
