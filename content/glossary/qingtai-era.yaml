public_id: 112959
name: Qingtai
names:
  - lang: zh
    role: original
    text: 清泰
category: calendar
definition: "Chinese era name (清泰) of the Later Tang for the years 934–936: 934 is Qingtai 1 (元年) and Qingtai 3 is 936."
description_md: |-
  **Qingtai** (清泰) is a Chinese era name ([[nianhao]]) of the Later Tang, proclaimed in 934 under Li Congke, Prince of Lu (潞王). Its years are counted in lunar years: 934 is Qingtai 1 (元年), 936 its last year, Qingtai 3. A Chinese source dates a year within it as "Qingtai 2" (清泰二年) rather than by a continuous count.

  Before: [[yingshun-era|Yingshun]].
sources:
  definition:
    - source: dila-time-authority
