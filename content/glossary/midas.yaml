definition: In Greek myth the king of Phrygia whose touch turned everything to gold, and who was given donkey's ears by Apollo.
description_md: |-
  A king of Phrygia who asked [[dionysus]] that everything he touched turn to gold, until even his food turned to gold (his daughter turning to gold is Nathaniel Hawthorne's addition of 1852). He washed the gift away in the river Pactolus. Later, at a music contest between [[pan]] and [[apollo]] judged by the mountain god Tmolus, he disputed the verdict and preferred Pan, so Apollo gave him donkey's ears.

  **In art:** A king surrounded by golden objects, or with donkey's ears, at a music contest.

  **Famous works**

  - [[artist/nicolas-poussin]], *Midas and Bacchus* (Alte Pinakothek, Munich)
  - [[artist/jacob-jordaens]], *Apollo and Pan* (Prado)

  *From:* Greek mythology · Ancient Greek
