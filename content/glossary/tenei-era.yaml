definition: "Japanese era name (天永) for the years 1110–1113: 1110 is Ten'ei 1 (元年) and Ten'ei 4 is 1113."
description_md: |-
  **Ten'ei** (天永) is a Japanese era name ([[nengo]]), proclaimed in 1110. Its years are counted in lunar years from the new year before the proclamation: 1110 is Ten'ei 1 (元年), 1113 its last year, Ten'ei 4. A Japanese source dates a year within it as "Ten'ei 2" (天永2年) rather than by a continuous count.

  Before: [[tennin-era|Tennin]]. After: [[eikyu-era|Eikyū]].
