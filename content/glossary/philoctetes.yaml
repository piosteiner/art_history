name: Philoctetes
category: mythology and legend
definition: The Greek archer who inherited the bow of Heracles, was abandoned on an island for ten years with a festering snakebite, and had to be fetched back because Troy could not fall without the bow; he shot Paris.
description_md: |-
  Philoctetes was the one who lit the funeral pyre of [[heracles]], and in return received his famous bow. On the way to the Trojan War, he was bitten by a snake, and the wound festered and stank so badly that the Greeks abandoned him alone on an island for ten years. Then a prophecy revealed that Troy could only be taken with the bow of Heracles. The Greeks had to return and persuade the man they'd abandoned to help them. He was healed and, in the best-known version, shot Paris, the prince who had started the war.

  *From:* Greek mythology (Trojan cycle) · Ancient Greek
