name: Jingkang
names:
  - lang: zh
    role: original
    text: 靖康
category: calendar
parent: chinese-calendar
definition: "Chinese era name (靖康) of the Northern Song for the years 1126–1127: 1126 is Jingkang 1 (元年) and Jingkang 2 is 1127."
description_md: |-
  **Jingkang** (靖康) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1126 under Emperor Qinzong (欽宗). Its years are counted in lunar years: 1126 is Jingkang 1 (元年), 1127 its last year, Jingkang 2. A Chinese source dates a year within it as "Jingkang 2" (靖康二年) rather than by a continuous count.

  Before: [[xuanhe-era|Xuanhe]]. After: [[jianyan-era|Jianyan]].
sources:
