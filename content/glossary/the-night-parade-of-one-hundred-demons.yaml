definition: A parade of yōkai that marches through the streets on certain nights, painted on long, comic, crowded scrolls.
description_md: |-
  The *Hyakki Yagyō* is a parade of demons that marches through the streets on certain nights. On those nights, a procession of yōkai (supernatural creatures) marches through the streets, among them *tsukumogami*, household objects that came alive after a hundred years (umbrellas, lanterns, sandals); kappa, river imps with a water-filled dish on their heads; and *bakeneko*, shape-shifting cats.

  **In art:** Comic, crowded parades of odd creatures and walking objects.

  **Famous works**

  - Tosa Mitsunobu (attributed), *Hyakki Yagyō Emaki* (Shinju-an, Daitoku-ji, Kyoto)
  - Toriyama Sekien, *Gazu Hyakki Yagyō* (yōkai encyclopedia, 1776)
  - [[artist/kawanabe-kyosai]], *yōkai paintings*

  *From:* folklore · Japanese
