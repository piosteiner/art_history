public_id: 113009
name: Zhihe
names:
  - lang: zh
    role: original
    text: 至和
category: calendar
definition: "Chinese era name (至和) of the Northern Song for the years 1054–1056: 1054 is Zhihe 1 (元年) and Zhihe 3 is 1056."
description_md: |-
  **Zhihe** (至和) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1054 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1054 is Zhihe 1 (元年), 1056 its last year, Zhihe 3. A Chinese source dates a year within it as "Zhihe 2" (至和二年) rather than by a continuous count.

  Before: [[huangyou-era|Huangyou]]. After: [[jiayou-era|Jiayou]].
sources:
