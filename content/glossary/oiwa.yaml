name: Oiwa
category: mythology and legend
also_in: [iconography]
definition: The ghost of the kabuki play Yotsuya Kaidan, poisoned and disfigured by her husband, whom she haunts.
description_md: |-
  Oiwa was poisoned and disfigured by her husband and haunts him in the kabuki play *Yotsuya Kaidan*.

  **In art:** A disfigured ghost appearing in a paper lantern.

  **Famous works**

  - [[artist/katsushika-hokusai]], *One Hundred Ghost Stories* (Oiwa as a lantern)

  *From:* Yotsuya Kaidan · Japanese
