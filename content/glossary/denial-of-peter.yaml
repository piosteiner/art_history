name: Denial of Peter
names: [Peter's Denial]
category: iconography
definition: Peter's denial of knowing Jesus three times during the night before the rooster crowed.
description_md: |-
  As Jesus foretold, Peter denied knowing him three times during the night before the rooster crowed.

  **In art:** Peter by a fire being questioned by a servant girl, sometimes with a rooster.

  **Famous works**

  - [[artist/caravaggio]], *The Denial of Saint Peter* (Metropolitan Museum)
  - [[artist/rembrandt]], *The Denial of Saint Peter* (Rijksmuseum)

  *From:* New Testament, Gospels · Christian
