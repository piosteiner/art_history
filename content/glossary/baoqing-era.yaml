name: Baoqing
names:
  - lang: zh
    role: original
    text: 寶慶
category: calendar
parent: chinese-calendar
definition: "Chinese era name (寶慶) of the Southern Song for the years 1225–1228: 1225 is Baoqing 1 (元年) and Baoqing 4 is 1228."
description_md: |-
  **Baoqing** (寶慶) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1225 under Emperor Lizong (理宗). Its years are counted in lunar years: 1225 is Baoqing 1 (元年), 1228 its last year, Baoqing 4. A Chinese source dates a year within it as "Baoqing 2" (寶慶二年) rather than by a continuous count.

  Before: [[jiading-era|Jiading]]. After: [[shaoding-era|Shaoding]].
sources:
  definition:
