public_id: 131303
name: Tiamat
category: mythology and legend
definition: In the Babylonian creation epic Enūma Eliš, the primeval goddess of salt water and chaos, killed by Marduk, who made heaven and earth from her body.
description_md: |-
  In the Babylonian creation epic *Enūma Eliš*, she created an army of monsters to fight the younger gods. The hero-god [[marduk]] killed her and split her body in two to make heaven and earth.

  *From:* Enūma Eliš · Mesopotamian (Sumerian, Babylonian, Assyrian)
