name: Zahhak
category: mythology and legend
definition: In the Persian Shahnameh, the serpent-shouldered tyrant king, the great villain of Persian myth, overthrown and chained inside Mount Damavand.
description_md: |-
  Zahhak began as a prince who was led astray by [[ahriman]], the spirit of evil. Ahriman first tempted him into killing his own father to take the throne. Later, disguised as a cook, Ahriman asked for one reward: to kiss the prince's shoulders. Where he kissed, two black serpents grew out, and no matter how often they were cut off, they grew back. The serpents could only be calmed by feeding them human brains every day, so Zahhak's reign became a thousand years of terror in which two men were killed daily. He is finally overthrown and chained inside Mount Damavand, where legend says he still waits.

  *From:* Shahnameh · Persian
