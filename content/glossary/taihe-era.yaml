public_id: 113104
name: Taihe
names:
  - lang: zh
    role: original
    text: 大和
category: calendar
definition: "Chinese era name (大和) of the Tang for the years 827–835: 827 is Taihe 1 (元年) and Taihe 9 is 835."
description_md: |-
  **Taihe** (大和) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 827 under Emperor Wenzong (文宗). Its years are counted in lunar years: 827 is Taihe 1 (元年), 835 its last year, Taihe 9. A Chinese source dates a year within it as "Taihe 2" (大和二年) rather than by a continuous count.

  Before: [[baoli-era|Baoli]]. After: [[kaicheng-era|Kaicheng]].
sources:
  definition:
    - source: dila-time-authority
