public_id: 131501
name: Menelik I
category: mythology and legend
definition: The son of Solomon and Makeda in Ethiopian tradition, the first emperor of Ethiopia, who brought the Ark of the Covenant home.
description_md: |-
  He grew up in Ethiopia, visited his father in Jerusalem as a young man, and came home with the Ark of the Covenant. The legend says the Ark itself decided to go with him, and the wagons flew over the ground.

  *From:* Kebra Nagast · Ethiopian
