public_id: 132093
name: Annunciation
names: [The Annunciation]
category: iconography
definition: The archangel Gabriel's announcement to Mary that she will bear the son of God.
description_md: |-
  The archangel Gabriel appears to [[person/mary]] and announces that she will bear the son of God.

  **In art:** An angel, often holding a lily, kneeling before Mary, who is usually reading. A dove (the Holy Spirit) descends on a ray of light.

  **Famous works**

  - [[artist/fra-angelico]], *The Annunciation* (San Marco, Florence, and Prado)
  - [[artist/leonardo-da-vinci]], *The Annunciation* (Uffizi) — [[artwork/annunciation]]
  - [[artist/simone-martini]] and [[artist/lippo-memmi]], *The Annunciation with Saint Margaret and Saint Ansanus* (Uffizi) — [[artwork/annunciation-with-saints-maxima-and-ansanus]]
  - Robert Campin and workshop, *Mérode Altarpiece* (The Cloisters, Metropolitan Museum of Art, New York)

  *From:* New Testament, Gospels · Christian
