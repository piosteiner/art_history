public_id: 113066
name: Yongchang
names:
  - lang: zh
    role: original
    text: 永昌
category: calendar
definition: "Chinese era name (永昌) of the Tang for the year 689: 689 is Yongchang 1 (元年), its only year."
description_md: |-
  **Yongchang** (永昌) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 689 under Emperor Ruizong (睿宗). Its years are counted in lunar years: 689 is Yongchang 1 (元年), its only year.

  Before: [[chuigong-era|Chuigong]]. After: [[zaichu-era|Zaichu]].
sources:
  definition:
    - source: dila-time-authority
