name: Grootslang
category: mythology and legend
definition: In South African folklore, the "big snake", a monstrous serpent said to hoard diamonds in a deep cave in the Richtersveld.
description_md: |-
  The Grootslang, meaning "big snake" in Afrikaans, is a legendary monster said to live in a deep cave in the Richtersveld of South Africa. One version says the gods made a mistake at the dawn of time and created a creature too powerful and destructive. They split it into elephants and pythons, but one escaped. It hoards diamonds and lures greedy people to their death.

  According to legend, a great snake lives in a cave full of diamonds in the Richtersveld, luring treasure hunters in.

  *From:* folklore · South African (Afrikaans)
