name: Orpheus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the greatest musician, who went down into the Underworld to bring back his wife Eurydice and lost her by looking back.
description_md: |-
  Orpheus was the greatest musician of myth, whose singing could charm animals, trees and even stones. When his wife [[eurydice]] died, he went down into the Underworld and moved [[hades]] to let her go, on one condition: he must not look back at her until they reached the light. He looked back, and lost her forever. He was later torn apart by maenads, and his head kept singing as it floated down a river.

  **In art:** A young man with a lyre, surrounded by animals, or turning back towards a fading Eurydice. His floating head on a lyre is a favourite Symbolist subject.

  **Famous works**

  - Canova, *Orpheus and Eurydice* (Museo Correr, Venice)
  - Gustave Moreau, *Orpheus* (Musée d'Orsay)
  - Rubens, *Orpheus and Eurydice* (Prado)
  - Frederic Leighton, *Orpheus and Eurydice*

  *From:* Greek mythology · Ancient Greek
