name: Mulan
names: [Hua Mulan]
category: mythology and legend
definition: Hua Mulan, the heroine of the Chinese Ballad of Mulan, who disguised herself as a man to take her old father's place in the army and fought for twelve years without being discovered.
description_md: |-
  When the emperor called every family to send a man to war, Hua Mulan's father was too old and her brother too young. So she disguised herself as a man, took her father's place, and fought for twelve years. She was offered high office without anyone discovering her secret. When the war ended, she turned down every reward except a fast horse to ride home. Her old comrades were astonished when she came out in a dress.

  *From:* Ballad of Mulan · Chinese
