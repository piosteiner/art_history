public_id: 113067
name: Zaichu
names:
  - lang: zh
    role: original
    text: 載初
category: calendar
definition: "Chinese era name (載初) of the Tang for the years 689–690: 689 is Zaichu 1 (元年) and Zaichu 2 is 690."
description_md: |-
  **Zaichu** (載初) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 689 under Emperor Ruizong (睿宗). Its years are counted in lunar years: 689 is Zaichu 1 (元年), 690 its last year, Zaichu 2. A Chinese source dates a year within it as "Zaichu 2" (載初二年) rather than by a continuous count.

  Before: [[yongchang-era|Yongchang]]. After: [[tianshou-era|Tianshou]].
sources:
  definition:
    - source: dila-time-authority
