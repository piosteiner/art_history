public_id: 105498
name: tsuketate
names:
  - lang: ja
    role: original
    text: "{付立|つけたて}"
category: technique
definition: Modelling forms with daubs of ink, dark over light, instead of outlines, so that they gain volume; a hallmark of the Maruyama–Shijō school.
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 320–321
