public_id: 131327
name: Aladdin
category: mythology and legend
definition: "The hero of a tale added to the Nights by Antoine Galland: a lazy boy who finds a magic lamp with a genie and marries the sultan's daughter."
description_md: |-
  An evil sorcerer from North Africa tricked him into fetching an old lamp from a cave. Trapped in the cave, Aladdin rubbed a magic ring the sorcerer had lent him and its genie set him free; later, when his mother rubbed the lamp to clean it, the genie of the lamp appeared. He used it to become rich and marry the sultan's daughter Badroulbadour. The original story is set in China.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
