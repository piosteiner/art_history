category: calendar
definition: "Chinese era name (隆慶) of the Ming for the years 1567–1572: 1567 is Longqing 1 (元年) and Longqing 6 is 1572."
description_md: |-
  **Longqing** (隆慶) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1567. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Longqing Emperor. Its years are counted in lunar years: 1567 is Longqing 1 (元年), 1572 its last year, Longqing 6. A Chinese source dates a year within it as "Longqing 2" (隆慶二年) rather than by a continuous count.

  Before: [[jiajing-era|Jiajing]]. After: [[wanli-era|Wanli]].
