public_id: 131186
name: Joukahainen
category: mythology and legend
definition: The young, boastful singer of the Finnish Kalevala who lost a singing duel to Väinämöinen, sank into a swamp and saved himself by promising his sister Aino; later he shot Väinämöinen's horse from under him.
description_md: |-
  He challenged [[vainamoinen]] to a singing contest and lost, sinking into a swamp, and saved himself by offering his sister [[aino]]. Later, he shot Väinämöinen's horse out from under him with a crossbow to get his revenge.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
