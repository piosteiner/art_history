definition: "Chinese era name (泰昌) of the Ming for the year 1620: 1620 is Taichang 1 (元年), its only year."
description_md: |-
  **Taichang** (泰昌) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1620. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Taichang Emperor. Its years are counted in lunar years: 1620 is Taichang 1 (元年), its only year.

  Before: [[wanli-era|Wanli]]. After: [[tianqi-era|Tianqi]].
