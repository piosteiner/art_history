definition: The bodhisattva of wisdom, with a flaming sword that cuts through ignorance, often riding a lion.
description_md: |-
  The bodhisattva of wisdom.

  **In art:** Holding a flaming sword that cuts through ignorance and a book or scroll of scripture, often riding a lion.

  **Famous works**

  - [[artist/kaikei]], *Monju on a Lion* (Abe Monju-in, Nara)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
