public_id: 130946
name: Firebird
names: [Zhar-ptitsa]
category: mythology and legend
definition: The glowing bird of Slavic fairy tales (Zhar-ptitsa) that steals golden apples from a tsar's garden; one feather lights a whole room, and chasing it starts the hero's quest.
description_md: |-
  The Firebird is a magical bird with feathers that glow like embers. In many tales, it steals golden apples from a tsar's garden, and the tsar's sons are sent to catch it. A single lost feather is enough to light a dark room, and finding a lost feather or chasing the bird usually leads the hero into a great quest.

  *From:* Slavic fairy tales · Russian and Slavic
