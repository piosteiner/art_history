definition: The gathering of AD 353 at which Wang Xizhi and his friends composed poems while floating wine cups down a stream; his preface became the most famous work of Chinese calligraphy.
description_md: |-
  In AD 353, the calligrapher Wang Xizhi gathered with friends at the Orchid Pavilion to compose poems while floating wine cups down a stream. His preface to their poems became the most famous work of Chinese calligraphy.

  **In art:** Scholars sitting along a winding stream with wine cups floating past, and a pavilion.

  **Famous works**

  - Wang Xizhi, *Preface to the Orchid Pavilion Poems* (known only from copies, Palace Museum, Beijing)
  - Wen Zhengming, *Orchid Pavilion Gathering* (1542, Palace Museum, Beijing)

  *From:* Wang Xizhi, Preface to the Orchid Pavilion Poems · Chinese
