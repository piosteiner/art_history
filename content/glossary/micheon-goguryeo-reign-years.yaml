public_id: 113289
name: Micheon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 미천왕
  - lang: ko-Hani
    role: alternative
    text: 美川王
category: calendar
definition: "The reign years of King Micheon of Goguryeo (美川王, 미천왕), by which Korean histories date 300–331: 300 is Micheon 1, 331 Micheon 32."
description_md: |-
  **Micheon** (美川王, 미천왕): the years of the reign of King Micheon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 309 is Micheon 10 (미천왕 10년). The year of the accession, 300, counts as the first year.

  Before: [[bongsang-goguryeo-reign-years|Bongsang]]. After: [[gogugwon-goguryeo-reign-years|Gogugwon]].
sources:
  definition:
    - source: dila-time-authority
