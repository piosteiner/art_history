public_id: 131401
name: Ahuizotl
category: mythology and legend
definition: In Aztec folklore, a dog-like water monster with a hand at the end of its tail, which pulled people under the water.
description_md: |-
  It lived in deep water and grabbed people who came too close with the hand on its tail, pulling them under. They'd be found later without eyes, teeth or nails. An Aztec emperor was named after it.

  *From:* Aztec folklore · Aztec (Mexica)
