public_id: 132196
name: Man of Sorrows
category: iconography
definition: A devotional image of the dead or suffering Christ showing his wounds.
description_md: |-
  Devotional images rather than scenes. The Man of Sorrows shows the dead or suffering Christ showing his wounds.

  **In art:** A wounded Christ standing in his tomb.

  **Famous works**

  - [[artist/giovanni-bellini]], *Dead Christ Supported by Angels* (several versions)
  - [[artist/albrecht-durer]], *Christ as the Man of Sorrows* (c. 1493, Staatliche Kunsthalle Karlsruhe)

  *From:* Christian iconography · Christian
