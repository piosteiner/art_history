public_id: 131274
name: Nyctimene
category: mythology and legend
definition: In Greek myth, a princess whom Athena, taking pity on her shame, turned into an owl, the bird that comes out only at night.
description_md: |-
  Ashamed of a terrible secret, she hid in the forest, and [[athena]] took pity on her and turned her into an owl, a bird that only comes out at night.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
