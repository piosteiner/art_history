public_id: 109288
name: Sejo (reign years)
names:
  - lang: ko
    role: original
    text: 세조
  - lang: ko-Hani
    role: alternative
    text: 世祖
category: calendar
definition: "The reign years of Sejo of Joseon (世祖, 세조), by which Korean sources date 1455–1468: 1455 is Sejo 1, 1468 Sejo 14."
description_md: |-
  **Sejo** (世祖, 세조): the years of the reign of [[person/sejo-of-joseon|Sejo of Joseon]], who came to the throne on 20 June 1455. Korean sources count years by the reigning king ([[korean-reign-years]]): 1464 is Sejo 10 (세조 10년). His first year is the year of his accession — he replaced his predecessor by force or founded the dynasty.

  Before: [[danjong-reign-years|Danjong]]. After: [[yejong-reign-years|Yejong]].
