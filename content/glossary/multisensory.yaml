name: multisensory
names:
  - lang: en
    role: alternative
    text: intersensoriality
category: aesthetics
definition: Engaging several senses at once. Material culture theory studies objects, buildings and landscapes in all their sensory dimensions; the senses connect in many ways (intersensoriality) rather than merge (synaesthesia), and are ranked differently from one society to another.
