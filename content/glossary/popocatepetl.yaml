name: Popocatépetl
names: [Popoca]
category: mythology and legend
definition: In Mexican legend, the warrior lover of the princess Iztaccíhuatl, who knelt beside her body forever holding a torch and became the smoking volcano near Mexico City.
description_md: |-
  The princess [[iztaccihuatl]] was falsely told that her warrior lover Popoca had died in battle, and she died of grief. When he came home, he carried her body up to the mountains and knelt beside her (in one version holding a smoking torch) forever. Her volcano looks like a sleeping woman, and his still smokes.

  *From:* Mexican folklore · Mexican (Nahua)
