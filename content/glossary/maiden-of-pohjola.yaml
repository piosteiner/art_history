public_id: 131188
name: Maiden of Pohjola
names: [Pohjan neito]
category: mythology and legend
definition: Louhi's beautiful daughter in the Finnish Kalevala, first seen by Väinämöinen sitting on a rainbow weaving gold cloth, who set her suitors impossible tasks and married Ilmarinen.
description_md: |-
  [[vainamoinen]] first saw her sitting on a rainbow and weaving gold cloth. She set him impossible tasks before she'd marry him, but in the end, she married [[ilmarinen]].

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
