public_id: 113100
name: Yongzhen
names:
  - lang: zh
    role: original
    text: 永貞
category: calendar
definition: "Chinese era name (永貞) of the Tang for the years 805–806: 805 is Yongzhen 1 (元年) and Yongzhen 2 is 806."
description_md: |-
  **Yongzhen** (永貞) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 805 under Emperor Xianzong (憲宗). Its years are counted in lunar years: 805 is Yongzhen 1 (元年), 806 its last year, Yongzhen 2. A Chinese source dates a year within it as "Yongzhen 2" (永貞二年) rather than by a continuous count.

  Before: [[zhenyuan-era|Zhenyuan]]. After: [[yuanhe-era|Yuanhe]].
sources:
  definition:
    - source: dila-time-authority
