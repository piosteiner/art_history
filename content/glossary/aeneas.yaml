name: Aeneas
category: mythology and legend
also_in: [iconography]
definition: The Trojan prince, son of Venus, who carried his father Anchises out of burning Troy and reached Italy, where his descendants founded Rome; hero of Virgil's Aeneid.
description_md: |-
  A Trojan prince, son of [[aphrodite|Venus]], who escaped the burning city carrying his old father Anchises on his back and leading his young son Ascanius by the hand. After years of wandering, he reached Italy, and his descendants founded Rome. He's the hero of [[person/virgil]]'s *Aeneid*.

  **In art:** A warrior carrying an old man on his shoulders out of a burning city, often with a child at his side.

  **Famous works**

  - Bernini, *Aeneas, Anchises and Ascanius* (Galleria Borghese) — [[artwork/aeneas-anchises-and-ascanius]]
  - Federico Barocci, *Aeneas Fleeing Troy* (Galleria Borghese)
  - [[artist/raphael]], *The Fire in the Borgo* (Stanza dell'incendio del Borgo, Vatican, with a quoted Aeneas group)

  *From:* Virgil, Aeneid · Ancient Roman (Trojan hero)
