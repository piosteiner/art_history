definition: The fourteenth-century novel attributed to Luo Guanzhong of the wars after the fall of the Han dynasty, with the sworn brothers Liu Bei, Guan Yu and Zhang Fei and the strategist Zhuge Liang.
description_md: |-
  The 14th-century novel *Romance of the Three Kingdoms* tells of the wars after the fall of the Han dynasty. Its heroes include the three sworn brothers Liu Bei, [[person/guan-yu]] and Zhang Fei (the Oath of the Peach Garden), and the brilliant strategist Zhuge Liang.

  **In art:** Three men swearing an oath under blossoming peach trees, a red-faced general with a long beard, or a strategist with a feather fan.

  **Famous works**

  - Shang Xi, *Guan Yu Capturing Pang De* (Palace Museum, Beijing)
  - [[artist/utagawa-kuniyoshi]], *Tsūzoku Sangokushi* (A Popular Romance of the Three Kingdoms, print triptychs, 1853–54)

  *From:* Romance of the Three Kingdoms · Chinese
