public_id: 131514
name: Ravololona
category: mythology and legend
definition: A classic royal name in old Malagasy tales of the Merina highlands, meaning "lady of flowers".
description_md: |-
  From Malagasy folk tales. The name [[andriambahoaka]] means "lord of the people", and Ravololona means "lady of flowers". They are classic royal names in old tales of the Merina highlands.

  *From:* Malagasy folk tales · Malagasy (Merina)
