category: object type
definition: traditional Japanese hip- or thigh-length kimono-style jacket
description_md: "A haori (羽織) is a traditional Japanese jacket worn over a kimono. [[source/wikipedia-en-haori|introduction]] It resembles a shortened kimono without overlapping front panels, has a thinner collar and two narrow triangular panels at the side seams, and is usually tied at the front with two short cords (haori himo). [[source/wikipedia-en-haori|introduction]] In the Edo period, sumptuary edicts led merchant-class men to wear haori with plain outsides and lavishly decorated linings, a trend still seen in men's haori today. [[source/wikipedia-en-haori|introduction]] In the early 1800s geisha of Fukagawa in Edo began to wear haori, until then a men's garment, and by the 1930s women wearing haori had become common. [[source/wikipedia-en-haori|introduction]] In wartime Japan the hidden lining could carry propaganda: one man's haori reproduces an *Asahi* newspaper extra on clashes in Manchuria. [[source/kushner-2011-drive-to-mobilize|p. 20]] The term was on the vocabulary list of Klaus Friese's guest lecture on war in Japanese material culture, which showed a [[artwork/mfk-haori-2017-64-11|silk haori of 1932]]. [[source/thomsen-2019-war-and-peace|vocabulary list, 10 May 2019 (guest lecture, Klaus Friese)]] [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]]"
