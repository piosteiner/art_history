public_id: 113015
name: Shaosheng
names:
  - lang: zh
    role: original
    text: 紹聖
category: calendar
definition: "Chinese era name (紹聖) of the Northern Song for the years 1094–1097: 1094 is Shaosheng 1 (元年) and Shaosheng 4 is 1097."
description_md: |-
  **Shaosheng** (紹聖) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1094 under Emperor Zhezong (哲宗). Its years are counted in lunar years: 1094 is Shaosheng 1 (元年), 1097 its last year, Shaosheng 4. A Chinese source dates a year within it as "Shaosheng 2" (紹聖二年) rather than by a continuous count.

  Before: [[yuanyou-era|Yuanyou]]. After: [[yuanfu-era|Yuanfu]].
sources:
  definition:
    - source: dila-time-authority
