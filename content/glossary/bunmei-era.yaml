definition: "Japanese era name (文明) for the years 1469–1487: 1469 is Bunmei 1 (元年) and Bunmei 19 is 1487."
description_md: |-
  **Bunmei** (文明) is a Japanese era name ([[nengo]]), proclaimed in 1469. Its years are counted in lunar years from the new year before the proclamation: 1469 is Bunmei 1 (元年), 1487 its last year, Bunmei 19. A Japanese source dates a year within it as "Bunmei 2" (文明2年) rather than by a continuous count.

  Before: [[onin-era|Ōnin]]. After: [[chokyo-era|Chōkyō]].
