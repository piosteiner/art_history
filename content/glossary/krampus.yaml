public_id: 131497
name: Krampus
category: mythology and legend
definition: The horned companion of Saint Nicholas in Alpine folklore, who punishes naughty children on the night of 5 December.
description_md: |-
  On 5 December, the night before Saint Nicholas Day, Krampus roams the Alps with chains and birch rods, punishing naughty children and carrying them off in a basket. Young men still dress up in hairy costumes and huge carved masks for the *Krampuslauf*.

  *From:* folklore · Alpine
