name: Ileana Cosânzeana
names: [Ileana Cosanzeana]
category: mythology and legend
definition: The fairest princess of Romanian fairy tales, so beautiful that the sun stops to look at her, rescued by Făt-Frumos.
description_md: |-
  [[fat-frumos]] ("handsome lad") is the classic hero who fights dragons (*zmei*) and witches to rescue Ileana Cosanzeana, the fairest of all, whose beauty is so great that the sun stops to look at her.

  *From:* Romanian folklore · Romanian
