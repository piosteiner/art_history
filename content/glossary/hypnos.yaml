definition: In Greek myth the god of sleep, twin brother of Thanatos (Death); the Romans called him Somnus.
description_md: |-
  The twin brothers Sleep and Death.

  **In art:** Winged youths or bearded men (as on the Euphronios krater), often carrying the body of a fallen warrior, as with Sarpedon at Troy.

  **Famous works**

  - Euphronios (painter) and Euxitheos (potter), *Sarpedon Krater* (Euphronios krater; Museo Nazionale Archeologico Cerite, Cerveteri)
  - John William Waterhouse, *Sleep and His Half-brother Death*

  *From:* Greek mythology · Ancient Greek
