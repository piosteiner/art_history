name: Tenpyō-jingo
names:
  - lang: ja
    role: original
    text: 天平神護
category: calendar
definition: "Japanese era name (天平神護) for the years 765–766: 765 is Tenpyō-jingo 1 (元年) and Tenpyō-jingo 2 is 766."
description_md: |-
  **Tenpyō-jingo** (天平神護) is a Japanese era name ([[nengo]]), proclaimed in 765. Its years are counted in lunar years from the new year before the proclamation: 765 is Tenpyō-jingo 1 (元年), 766 its last year, Tenpyō-jingo 2. A Japanese source dates a year within it as "Tenpyō-jingo 2" (天平神護2年) rather than by a continuous count.

  Before: [[tenpyo-hoji-era|Tenpyō-hōji]]. After: Jingo-keiun.
