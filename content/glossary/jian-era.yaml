definition: "Japanese era name (治安) for the years 1021–1023: 1021 is Jian 1 (元年) and Jian 3 is 1023."
description_md: |-
  **Jian** (治安) is a Japanese era name ([[nengo]]), proclaimed in 1021. Its years are counted in lunar years from the new year before the proclamation: 1021 is Jian 1 (元年), 1023 its last year, Jian 3. A Japanese source dates a year within it as "Jian 2" (治安2年) rather than by a continuous count.

  Before: [[kannin-era|Kannin]]. After: [[manju-era|Manju]].
