public_id: 107518
name: tenmoku
names:
  - lang: ja
    role: original
    text: "{天目|てんもく}"
category: technique
definition: Tea bowls with dark iron glazes — black, brown, streaked, silvery or with “star” spots — named after Mount Tianmu in China, whose Chan monasteries used Jian ware; imitated in Seto.
sources:
  definition:
    - source: history-of-japanese-art
      locator: p. 233
