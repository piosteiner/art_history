public_id: 107525
name: Zen
names:
  - lang: ja
    role: original
    text: "{禅|ぜん}"
category: religion
definition: "Chan Buddhism, brought from China in the late twelfth and early thirteenth centuries: Enlightenment through meditation (zazen) and kōan rather than scripture; the Rinzai and Sōtō schools. Zen monks were advisers to the shoguns and carried Song culture — ink painting, poetry, gardens, tea — into Japan."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 211–212
