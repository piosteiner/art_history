definition: A fat, laughing tenth-century Chinese monk with a cloth sack, merged with Maitreya as the "Laughing Buddha" (Japanese Hotei).
description_md: |-
  In China, Maitreya merged with Budai, a fat, laughing 10th-century monk, who became the "Laughing Buddha".

  **In art:** A jolly, big-bellied monk with a cloth sack (Budai, Japanese Hotei).

  **Famous works**

  - *Feilai Feng laughing Buddha* (Hangzhou)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Chinese Buddhist
