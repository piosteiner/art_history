definition: In Greek myth the queen of the gods, Zeus's wife and goddess of marriage, famously jealous of his lovers; the Romans called her Juno.
description_md: |-
  Queen of the gods, [[zeus]]'s wife, goddess of marriage, famously jealous of his lovers.

  **In art:** A dignified, crowned queen with a sceptre, often in a chariot drawn by peacocks. The peacock is her bird: she set the hundred eyes of the slain giant Argus in its tail.

  **Famous works**

  - Tintoretto, *The Origin of the Milky Way* (National Gallery, London)
  - Rubens, *Juno and Argus* (Wallraf-Richartz-Museum, Cologne)

  *From:* Greek mythology · Ancient Greek
