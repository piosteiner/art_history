name: Night Marchers
names: [Huakaʻi Pō]
category: mythology and legend
definition: Ghostly processions of ancient warriors in Hawaiian tradition, marching to drums with torches along old paths at night.
description_md: |-
  On certain nights, spirits of ancient warriors march to drums with torches along old paths to ancient battle sites or other sacred places. If you see them, you must lie face down and not look at them, or you might die, unless you have an ancestor among them.

  *From:* Hawaiian tradition · Hawaiian
