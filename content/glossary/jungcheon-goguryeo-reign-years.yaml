public_id: 113286
name: Jungcheon of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 중천왕
  - lang: ko-Hani
    role: alternative
    text: 中川王
category: calendar
parent: korean-calendar
definition: "The reign years of King Jungcheon of Goguryeo (中川王, 중천왕), by which Korean histories date 248–270: 248 is Jungcheon 1, 270 Jungcheon 23."
description_md: |-
  **Jungcheon** (中川王, 중천왕): the years of the reign of King Jungcheon of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 257 is Jungcheon 10 (중천왕 10년). The year of the accession, 248, counts as the first year.

  Before: [[dongcheon-goguryeo-reign-years|Dongcheon]]. After: [[seocheon-goguryeo-reign-years|Seocheon]].
sources:
  definition:
    - source: dila-time-authority
