category: calendar
definition: "Japanese era name (平治) for the years 1159–1159: 1159 is Heiji 1 (元年) and Heiji 1 is 1159."
description_md: |-
  **Heiji** (平治) is a Japanese era name ([[nengo]]), proclaimed in 1159. Its years are counted in lunar years from the new year before the proclamation: 1159 is Heiji 1 (元年), 1159 its last year, Heiji 1. A Japanese source dates a year within it as "Heiji 1" (平治元年) rather than by a continuous count.

  Before: [[hogen-era|Hōgen]]. After: [[eiryaku-era|Eiryaku]].
