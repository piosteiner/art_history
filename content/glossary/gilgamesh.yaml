name: Gilgamesh
category: mythology and legend
definition: King of Uruk, two-thirds god and one-third man, hero of the Epic of Gilgamesh, one of the oldest surviving works of literature, who searched in vain for immortality.
description_md: |-
  Gilgamesh was the king of Uruk in ancient Mesopotamia, said to be two-thirds god and one-third man, and possibly based on a real king. He starts out as an arrogant tyrant. The gods send the wild man [[enkidu]] to balance him, and the two become best friends, slaying the forest guardian [[humbaba]] and the Bull of Heaven. When Enkidu dies, the grieving Gilgamesh travels to the end of the world in search of eternal life. He fails, but returns home wiser. It is among the oldest surviving works of literature.

  Two-thirds god and one-third man, he was a tyrant until the gods made a wild man, Enkidu, to stop him. After they fought, they became best friends and went on adventures together. When Enkidu died, Gilgamesh went to the ends of the earth looking for immortality. He found a plant of eternal youth on the seabed, but a snake stole it while he was bathing.

  *From:* Epic of Gilgamesh · Mesopotamian (Sumerian, Babylonian)
