public_id: 132370
name: The Tree of Life
category: iconography
definition: The tree that grows in the midst of the Garden of Eden in Genesis, and an image of life and creation found in many cultures.
description_md: |-
  Images of the cycle of life and of creation. The Tree of Life grows at the centre of Paradise and appears in almost every culture.

  **Famous works**

  - [[artist/gustav-klimt]], *The Tree of Life* (Stoclet Frieze, Brussels)

  *From:* many cultures
