public_id: 131382
name: Hunahpu
category: mythology and legend
definition: One of the Hero Twins of the K'iche' Maya epic Popol Vuh, who with his brother Xbalanque defeated the Lords of Xibalba and rose up as the sun.
description_md: |-
  Their father and uncle were killed by the Lords of the Underworld after losing a ball game. The twins went down to [[xibalba]] themselves and survived the Dark House, the Razor House, the Cold House, the Jaguar House, the Fire House and the Bat House. They won by trickery, sacrificing and reviving each other, then tricked the lords into being sacrificed and never brought back. They rose up as the sun and the moon.

  *From:* Popol Vuh · K'iche' Maya
