name: Nga
category: mythology and legend
definition: In Nenets belief, the god of death and disease, one of the two creator gods beside the sky god Num, who brought mortality into a world meant to be deathless.
description_md: |-
  In Nenets belief, the world was meant to be deathless. Nga, god of death and disease and one of the two creator gods beside the sky god Num, changed that by bringing mortality to humankind. He dwells in the underworld, and the Nenets told stories of shamans who travelled down to face him.

  *From:* Nenets belief · Nenets
