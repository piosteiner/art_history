definition: "The reign years of King Hyojong of Joseon (孝宗, 효종), by which Korean sources date 1650–1659: 1650 is Hyojong 1, 1659 Hyojong 10."
description_md: |-
  **Hyojong** (孝宗, 효종): the years of the reign of King Hyojong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1659 is Hyojong 10 (효종 10년). The year of the accession, 1650, counts as the first year.

  Before: [[injo-reign-years|Injo]]. After: [[hyeonjong-reign-years|Hyeonjong]].
