definition: "Japanese era name (寛文) for the years 1661–1673: 1661 is Kanbun 1 (元年) and Kanbun 13 is 1673."
description_md: |-
  **Kanbun** (寛文) is a Japanese era name ([[nengo]]), proclaimed in 1661. Its years are counted in lunar years from the new year before the proclamation: 1661 is Kanbun 1 (元年), 1673 its last year, Kanbun 13. A Japanese source dates a year within it as "Kanbun 2" (寛文2年) rather than by a continuous count.

  Before: [[manji-era|Manji]]. After: [[enpo-era|Enpō]].
