public_id: 113118
name: Guanghua
names:
  - lang: zh
    role: original
    text: 光化
category: calendar
definition: "Chinese era name (光化) of the Tang for the years 898–901: 898 is Guanghua 1 (元年) and Guanghua 4 is 901."
description_md: |-
  **Guanghua** (光化) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 898 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 898 is Guanghua 1 (元年), 901 its last year, Guanghua 4. A Chinese source dates a year within it as "Guanghua 2" (光化二年) rather than by a continuous count.

  Before: [[qianning-era|Qianning]]. After: [[tianfu-era-901|Tianfu]].
sources:
  definition:
    - source: dila-time-authority
