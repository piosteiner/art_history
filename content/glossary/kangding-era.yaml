public_id: 113006
name: Kangding
names:
  - lang: zh
    role: original
    text: 康定
category: calendar
definition: "Chinese era name (康定) of the Northern Song for the years 1040–1041: 1040 is Kangding 1 (元年) and Kangding 2 is 1041."
description_md: |-
  **Kangding** (康定) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1040 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1040 is Kangding 1 (元年), 1041 its last year, Kangding 2. A Chinese source dates a year within it as "Kangding 2" (康定二年) rather than by a continuous count.

  Before: [[baoyuan-era|Baoyuan]]. After: [[qingli-era|Qingli]].
sources:
  definition:
    - source: dila-time-authority
