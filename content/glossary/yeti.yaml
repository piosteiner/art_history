name: Yeti
names: [Abominable Snowman]
category: mythology and legend
definition: 'The "Abominable Snowman": a large, hairy, ape-like creature of Sherpa and Tibetan stories of the high Himalayas.'
description_md: |-
  Sherpa and Tibetan stories tell of a large, hairy, ape-like creature in the high mountains. Explorers in the 20th century reported strange footprints in the snow. Monasteries in Nepal used to keep what they claimed were yeti scalps and hands.

  *From:* folklore · Sherpa, Tibetan
