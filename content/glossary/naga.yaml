name: Naga
names: [Nāga]
category: mythology and legend
definition: Serpent beings of the waters and the underworld, guardians of treasure, rain and land; multi-headed nagas line the causeways of Angkor Wat.
description_md: |-
  Nagas are serpent beings who live in the waters and the underworld, and they are everywhere in Khmer art: multi-headed snakes line the causeways of Angkor Wat as protective railings. In Khmer belief, they guard treasure, rain and the land itself, and the Khmer see themselves as partly descended from them through [[neang-neak]].

  *From:* Khmer belief · Khmer (and wider South and Southeast Asian)
