name: Orishas
names: [Orisha]
category: religion
definition: The divine spirits of the Yoruba religion of Nigeria and Benin, among them Ogun, Shango and Yemoja, whose traditions live on in Santería and Candomblé.
description_md: |-
  The orishas are spirits of the Yoruba religion of Nigeria and Benin, each with their own domain and personality. Among them are Ogun, the god of iron and war, Shango, the god of thunder and lightning, said to have been a king of Oyo, and Yemoja, the motherly spirit of rivers (and, in Cuba and Brazil, of the sea). Their traditions crossed the Atlantic during the slave trade and live on in religions like Santería in Cuba and Candomblé in Brazil.

  **Held sacred today:** The orishas are worshipped by millions of people in Africa and the Americas today.

  *From:* Yoruba religion · Yoruba
