name: Aesop
category: mythology and legend
definition: The legendary Greek storyteller of the 6th century BC to whom the short animal fables with a moral are credited.
description_md: |-
  According to legend, he was an ugly but clever slave on the island of Samos in the 6th century BC. He won his freedom through his wit. Later, he was thrown off a cliff by the people of Delphi after insulting them.

  *From:* Aesop's Fables · Ancient Greek
