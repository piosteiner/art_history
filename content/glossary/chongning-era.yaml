name: Chongning
names:
  - lang: zh
    role: original
    text: 崇寧
category: calendar
parent: chinese-calendar
definition: "Chinese era name (崇寧) of the Northern Song for the years 1102–1106: 1102 is Chongning 1 (元年) and Chongning 5 is 1106."
description_md: |-
  **Chongning** (崇寧) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1102 under Emperor Huizong (徽宗). Its years are counted in lunar years: 1102 is Chongning 1 (元年), 1106 its last year, Chongning 5. A Chinese source dates a year within it as "Chongning 2" (崇寧二年) rather than by a continuous count.

  Before: [[jianzhong-jingguo-era|Jianzhong Jingguo]]. After: [[daguan-era|Daguan]].
sources:
  definition:
