name: Dobrynya Nikitich
category: mythology and legend
definition: The second of the three great Russian bogatyrs, known for courtesy and diplomacy, who fought the dragon Zmey Gorynych for three days.
description_md: |-
  Dobrynya Nikitich is the second of the three great bogatyrs, known for his courtesy and diplomacy as well as his strength. His most famous deed was battling the dragon [[zmey-gorynych]], who had carried off the prince's niece. He fought the dragon for three days until he won and freed the captives.

  *From:* byliny · Russian
