name: Tancred and Clorinda
names: [Clorinda, Tancred]
category: mythology and legend
also_in: [iconography]
definition: The episode of Tasso's Jerusalem Delivered in which the crusader Tancred unknowingly kills the woman he loves, the warrior Clorinda, in a duel.
description_md: |-
  Also from Tasso's *Jerusalem Delivered*: the crusader Tancred unknowingly kills the woman he loves, the warrior Clorinda, in a duel.

  **In art:** A knight baptising a dying woman in armour.

  **Famous works**

  - Domenico Tintoretto, *Tancred Baptizing Clorinda* (c. 1586–1600; Museum of Fine Arts, Houston)

  *From:* Torquato Tasso, Jerusalem Delivered · Italian
