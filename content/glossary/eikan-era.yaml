category: calendar
definition: "Japanese era name (永観) for the years 983–984: 983 is Eikan 1 (元年) and Eikan 2 is 984."
description_md: |-
  **Eikan** (永観) is a Japanese era name ([[nengo]]), proclaimed in 983. Its years are counted in lunar years from the new year before the proclamation: 983 is Eikan 1 (元年), 984 its last year, Eikan 2. A Japanese source dates a year within it as "Eikan 2" (永観2年) rather than by a continuous count.

  Before: [[tengen-era|Tengen]]. After: [[kanna-era|Kanna]].
