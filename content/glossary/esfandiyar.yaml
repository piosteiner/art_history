name: Esfandiyar
category: mythology and legend
definition: In the Persian Shahnameh, the devout, invulnerable prince — save for his eyes — killed by Rostam with a tamarisk arrow revealed by the Simurgh.
description_md: |-
  Esfandiyar was a devout prince whose body had been made invulnerable, except for his eyes. His father, who feared losing the throne, sent him to bring [[rostam]] back in chains, knowing it would end in a fight. The two heroes battled, and Rostam was badly hurt. Zal called on the [[simurgh]], who revealed the secret: an arrow made of tamarisk wood, shot into the eyes. Rostam killed Esfandiyar with it, and was cursed for doing so.

  *From:* Shahnameh · Persian
