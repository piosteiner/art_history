definition: "Japanese era name (安政) for the years 1854–1860: 1854 is Ansei 1 (元年) and Ansei 7 is 1860."
description_md: |-
  **Ansei** (安政) is a Japanese era name ([[nengo]]), proclaimed in 1855. Its years are counted in lunar years from the new year before the proclamation: 1854 is Ansei 1 (元年), 1860 its last year, Ansei 7. A Japanese source dates a year within it as "Ansei 2" (安政2年) rather than by a continuous count.

  Before: [[kaei-era|Kaei]]. After: [[manen-era|Man'en]].
