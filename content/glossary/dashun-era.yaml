public_id: 113115
name: Dashun
names:
  - lang: zh
    role: original
    text: 大順
category: calendar
definition: "Chinese era name (大順) of the Tang for the years 890–892: 890 is Dashun 1 (元年) and Dashun 3 is 892."
description_md: |-
  **Dashun** (大順) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 890 under Emperor Zhaozong (昭宗). Its years are counted in lunar years: 890 is Dashun 1 (元年), 892 its last year, Dashun 3. A Chinese source dates a year within it as "Dashun 2" (大順二年) rather than by a continuous count.

  Before: [[longji-era|Longji]]. After: [[jingfu-era|Jingfu]].
sources:
  definition:
    - source: dila-time-authority
