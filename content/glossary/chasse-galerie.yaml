name: Chasse-galerie
names: [La Chasse-galerie]
category: mythology and legend
definition: A French-Canadian tale of lumberjacks who made a deal with the Devil to fly their canoe home through the sky on New Year's Eve.
description_md: |-
  On New Year's Eve, a group of lumberjacks working far away in the forest wanted to see their sweethearts. They made a deal with the Devil to fly their canoe through the sky to their village, but they mustn't say God's name or touch a church steeple, or they'd lose their souls.

  *From:* Quebec folklore · French-Canadian
