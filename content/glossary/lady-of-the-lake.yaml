name: Lady of the Lake
category: mythology and legend
also_in: [iconography]
definition: A mysterious enchantress of Arthurian legend who lives beneath a lake and gave King Arthur the sword Excalibur.
description_md: |-
  A mysterious enchantress who lives beneath a lake and gave [[king-arthur|Arthur]] the sword [[excalibur]]. As Arthur lay dying, he ordered the knight Bedivere (Griflet in the earlier French version) to throw it back into the lake, and an arm rose from the water to catch it.

  **In art:** A woman's arm rising from water holding a sword, or a misty enchantress.

  **Famous works**

  - Aubrey Beardsley, *How Sir Bedivere Cast the Sword Excalibur into the Water* (illustration)

  *From:* Arthurian legend · British (Arthurian legend)
