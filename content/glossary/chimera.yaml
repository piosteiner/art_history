name: Chimera
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the fire-breathing monster, lion, goat and serpent in one, killed by Bellerophon riding Pegasus.
description_md: |-
  [[pegasus]] is the winged horse born from [[medusa]]'s blood, tamed by [[bellerophon]]. The Chimera is the fire-breathing monster he killed: lion, goat and serpent in one.

  **In art:** The three-part Chimera.

  **Famous works**

  - *Chimera of Arezzo* (Etruscan bronze, Museo Archeologico Nazionale, Florence)

  *From:* Greek mythology · Ancient Greek
