name: Hermaphroditus
names: [Salmacis and Hermaphroditus, Salmacis]
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the son of Hermes and Aphrodite, merged with the nymph Salmacis into one body with both sexes.
description_md: |-
  Hermaphroditus, son of [[hermes]] and [[aphrodite]], bathed in the pool of the nymph Salmacis. She fell in love with him and clung to him, praying never to be separated, and the gods merged them into one body with both sexes.

  **In art:** A nymph embracing a reluctant youth in a pool, or a reclining figure with both female and male features.

  **Famous works**

  - Bartholomeus Spranger, *Hermaphroditus and the Nymph Salmacis* (Kunsthistorisches Museum, Vienna)
  - *Sleeping Hermaphroditus* (Louvre and Galleria Borghese; the Louvre mattress was added by Bernini)

  *From:* Ovid, Metamorphoses · Ancient Greek
