definition: "Chinese era name (成化) of the Ming for the years 1465–1487: 1465 is Chenghua 1 (元年) and Chenghua 23 is 1487."
description_md: |-
  **Chenghua** (成化) is a Chinese era name ([[nianhao]]) of the Ming, proclaimed in 1465. Under the Ming and Qing an emperor kept one era for his whole reign and is known by it: the Chenghua Emperor. Its years are counted in lunar years: 1465 is Chenghua 1 (元年), 1487 its last year, Chenghua 23. A Chinese source dates a year within it as "Chenghua 2" (成化二年) rather than by a continuous count.

  Before: [[tianshun-era|Tianshun]]. After: [[hongzhi-era|Hongzhi]].
