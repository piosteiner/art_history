definition: A giant, drunken oni king who kidnapped young women from Kyoto until Minamoto no Raikō drugged him with poisoned sake and beheaded him.
description_md: |-
  Shuten-dōji was a giant, drunken oni (demon) king who kidnapped young women from Kyoto. The hero Minamoto no Raikō (Yorimitsu) and his four companions (including [[kintaro]]) disguised themselves as mountain priests (yamabushi), drugged him with poisoned sake and cut off his head, which then flew at Raikō.

  **In art:** A huge red demon's head flying through the air and biting a warrior's helmet.

  **Famous works**

  - [[artist/kano-motonobu]], *Shuten-dōji emaki* (Suntory Museum of Art)

