name: The Seven Virtues
names: [Prudence, Justice, Fortitude, Temperance, Faith, Hope, Charity]
category: iconography
definition: The four cardinal virtues (Prudence, Justice, Fortitude, Temperance) and the three theological virtues (Faith, Hope, Charity), each shown as a woman with her attribute.
description_md: |-
  The four cardinal virtues ([[prudence]], Justice, Fortitude, Temperance) and the three theological virtues (Faith, [[hope]], Charity).

  **In art:** Each is a woman with her own attribute. Prudence: a mirror and a snake, sometimes with two or three faces. Justice: scales and a sword, and from the 16th century often a blindfold. Fortitude: a column, armour or a lion. Temperance: two jugs, pouring water into wine. Faith: a cross or chalice. Hope: an anchor, looking upwards. Charity: a woman nursing or surrounded by children, or with a flaming heart.

  **Famous works**

  - [[artist/giotto]], *Virtues and Vices* (grisaille frescoes, c. 1305, Scrovegni Chapel, Padua)
  - Piero del Pollaiuolo and Botticelli, *The Seven Virtues* (Uffizi)
  - [[artist/raphael]], *Cardinal and Theological Virtues* (Stanza della Segnatura, Vatican)

  *From:* Christian
