name: Hou Yi
names: [Houyi, Yi]
category: mythology and legend
definition: The divine archer of Chinese myth who shot down nine of the ten suns scorching the earth; his wife Chang'e drank his elixir of immortality and floated up to the Moon.
description_md: |-
  Long ago, ten suns rose into the sky at once and scorched the earth. Hou Yi, the greatest archer of all, shot down nine of them with a bow of tiger bone and arrows of dragon tendon, leaving one to light the world. He later obtained an elixir of immortality from [[xiwangmu]], the Queen Mother of the West. His wife [[change]] drank it instead and floated up to the Moon, where she lives to this day. In some versions, Hou Yi had become a tyrant, and Chang'e drank it to stop him ruling forever.

  *From:* Chinese mythology · Chinese
