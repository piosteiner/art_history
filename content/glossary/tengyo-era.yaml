definition: "Japanese era name (天慶) for the years 938–946: 938 is Tengyō 1 (元年) and Tengyō 9 is 946."
description_md: |-
  **Tengyō** (天慶) is a Japanese era name ([[nengo]]), proclaimed in 938. Its years are counted in lunar years from the new year before the proclamation: 938 is Tengyō 1 (元年), 946 its last year, Tengyō 9. A Japanese source dates a year within it as "Tengyō 2" (天慶2年) rather than by a continuous count.

  Before: [[johei-era|Jōhei]]. After: [[tenryaku-era|Tenryaku]].
