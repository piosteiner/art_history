definition: In Greek myth the god of wine, ecstasy, theatre and fertility; the Romans called him Bacchus.
description_md: |-
  God of wine, ecstasy, theatre and fertility.

  **In art:** A young man crowned with vine leaves and grapes, holding a wine cup or a *thyrsus* (a staff tipped with a pine cone). His followers are satyrs and maenads, and his chariot is drawn by leopards or tigers.

  **Famous works**

  - [[artist/caravaggio]], *Bacchus* (Uffizi) — [[artwork/bacchus]]
  - [[artist/michelangelo]], *Bacchus* (Bargello)
  - [[artist/titian]], *Bacchus and Ariadne* (National Gallery, London)

  *From:* Greek mythology · Ancient Greek
