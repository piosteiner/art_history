name: Noah's Ark
names: [Noah, The Flood]
category: mythology and legend
also_in: [iconography]
definition: The Genesis story of the righteous Noah, who saved his family and two of every animal from the Flood in an ark.
description_md: |-
  God sent a great flood to destroy a wicked world, but told the righteous Noah to build an ark and save his family and two of every animal (seven pairs of the clean animals, Genesis 7:2). When the waters went down, a dove returned with an olive branch, and God set a rainbow in the sky as a promise never to flood the earth again. Later, Noah planted a vineyard and was found drunk and naked by his son Ham, whose brothers Shem and Japheth covered him.

  **In art:** The ark on stormy waters, animals boarding in pairs, a dove with an olive branch, or Noah lying drunk.

  **Famous works**

  - [[artist/michelangelo]], *The Deluge* and *The Drunkenness of Noah* (Sistine Chapel)
  - Edward Hicks, *Noah's Ark*
  - [[artist/paolo-uccello]], *The Flood* (Santa Maria Novella, Florence)

  *From:* Hebrew Bible, Genesis · Hebrew Bible
