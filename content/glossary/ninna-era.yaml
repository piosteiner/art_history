category: calendar
definition: "Japanese era name (仁和) for the years 885–888: 885 is Ninna 1 (元年) and Ninna 4 is 888."
description_md: |-
  **Ninna** (仁和) is a Japanese era name ([[nengo]]), proclaimed in 885. Its years are counted in lunar years from the new year before the proclamation: 885 is Ninna 1 (元年), 888 its last year, Ninna 4. A Japanese source dates a year within it as "Ninna 2" (仁和2年) rather than by a continuous count.

  Before: [[gangyo-era|Gangyō]]. After: [[kanpyo-era|Kanpyō]].
