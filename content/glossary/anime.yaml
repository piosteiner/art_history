description_md: |-
  ## Anime of war and peace

  The lecture *War and Peace in East Asian Art* (spring 2019) gave a session to anime of war and peace [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]]. Its topics were utter defeat and destruction, the emperor becoming human, occupation and rule by foreign forces, and how war and its victims are dealt with; behind them post-war Japan — westernisation, a loss of identity, the need to establish new values and culture in comparison with the West [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]]. The questions put to each work: freedom in word and action against slavery, authority and control, revolution and the reversal of order, technology as good or bad, the future as progress or regress [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]].

  ### Akira, Steamboy, Appleseed

  Katsuhiro Ōtomo's *Akira* (1988), after his own manga (1982–1990), is set in 2019 in a Tokyo rebuilt after a third world war [[source/thomsen-2019-war-and-peace|handout on Akira, 29 March 2019]]. The manga set off an anime boom in the English-speaking world in the 1990s [[source/thomsen-2019-war-and-peace|handout on Akira, 29 March 2019]]. The handout names the film's debts: *Blade Runner* (1982), set in the same year 2019; the film *Japan's Longest Day* for the military conspiracy; *Barefoot Gen*, Keiji Nakazawa's manga about Hiroshima (1973–1985), with its anime and films; Ōtomo's unfinished manga *Fireball* (1979); and further the youth of the 1960s and the Olympic Games held in Tokyo in 1964 rather than in 1940 as planned [[source/thomsen-2019-war-and-peace|handout on Akira, 29 March 2019]]. Its soundtrack by Geinoh Yamashirogumi draws on Indonesian gamelan and noh music; the film is widely cited as a landmark of Japanese animation and of Japanese cyberpunk [[source/wikipedia-en-akira-1988-film|introduction]]. The class notes saw a vast sea of metropolis exploding from within, a run-down world of entertainment as a window onto the commercially successful one, anarchy, a superior entity both frightening and impressive, salarymen; a destruction that engulfs all modern construction until only silence remains and the elements crash on what once dominated nature; a technology that cannot explain what happens, and the emergence of a messiah [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]].

  Ōtomo's *Steamboy* (2004), a steampunk film set in an alternative nineteenth century, was the most expensive Japanese film made until then — ¥2.4 billion and ten years in production [[source/wikipedia-en-steamboy|introduction]]. The notes: human labour; a power that slips out of control because someone pushed too far, created at the cost of human lives and developed in hiding; war as a playground for the wealthy, literally weaponised humans [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]]. Shinji Aramaki's *Appleseed* (2004), after Masamune Shirow's manga, is a post-apocalyptic film about a former soldier among genetically engineered clones [[source/wikipedia-en-appleseed-2004-film|introduction]]; the notes: the failing of humanity, futuristic architecture [[source/thomsen-2019-war-and-peace|lecture of 29 March 2019, class notes]]. Isao Takahata's *Grave of the Fireflies* (1988), shown in the same session, is described under [[event/bombing-of-kobe|the bombing of Kobe]] [[source/thomsen-2019-war-and-peace|image list, 29 March 2019]].

  ### Samurai in anime

  On 12 April 2019 three works stood beside Okamoto's samurai film *The Sword of Doom* (see [[term/chanbara|samurai cinema]]): *Afro Samurai* (2007), a five-part anime series by Gonzo with Samuel L. Jackson and Takashi Okazaki, music by the hip-hop artist The RZA; Shinichirō Watanabe's series *Samurai Champloo* (2004); and Satoshi Kon's anime film *Millennium Actress* [[source/thomsen-2019-war-and-peace|image list, 12 April 2019]]. *Afro Samurai* goes back to Okazaki's manga, inspired by his love of hip hop and soul music, and follows a samurai's revenge for his father [[source/wikipedia-en-afro-samurai|introduction]]. *Samurai Champloo* (26 episodes, 2004–2005) sets a fictionalised Edo period against anachronisms such as hip hop, following the tea waitress Fuu, the outlaw Mugen and the rōnin Jin [[source/wikipedia-en-samurai-champloo|introduction]].

  ### Heidi

  Takahata's series *Heidi, Girl of the Alps* came up in the lecture of 5 April 2019 with "Swissness" and the production team's journey to Switzerland — see [[term/rokehan|rokehan]] [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]].
