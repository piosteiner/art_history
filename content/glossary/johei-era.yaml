definition: "Japanese era name (承平) for the years 931–937: 931 is Jōhei 1 (元年) and Jōhei 7 is 937."
description_md: |-
  **Jōhei** (承平) is a Japanese era name ([[nengo]]), proclaimed in 931. Its years are counted in lunar years from the new year before the proclamation: 931 is Jōhei 1 (元年), 937 its last year, Jōhei 7. A Japanese source dates a year within it as "Jōhei 2" (承平2年) rather than by a continuous count.

  Before: [[encho-era|Enchō]]. After: [[tengyo-era|Tengyō]].
