public_id: 113334
name: U of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 우왕
  - lang: ko-Hani
    role: alternative
    text: 禑王
category: calendar
definition: "The reign years of King U of Goryeo (禑王, 우왕), by which Korean histories date 1375–1388: 1375 is U 1, 1388 U 14."
description_md: |-
  **U** (禑王, 우왕): the years of the reign of King U of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1384 is U 10 (우왕 10년). The year of the accession, 1375, counts as the first year.

  Before: [[gongmin-goryeo-reign-years|Gongmin]]. After: [[chang-goryeo-reign-years|Chang]].
sources:
  definition:
    - source: dila-time-authority
