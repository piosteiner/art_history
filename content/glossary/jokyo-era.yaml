definition: "Japanese era name (貞享) for the years 1684–1688: 1684 is Jōkyō 1 (元年) and Jōkyō 5 is 1688."
description_md: |-
  **Jōkyō** (貞享) is a Japanese era name ([[nengo]]), proclaimed in 1684. Its years are counted in lunar years from the new year before the proclamation: 1684 is Jōkyō 1 (元年), 1688 its last year, Jōkyō 5. A Japanese source dates a year within it as "Jōkyō 2" (貞享2年) rather than by a continuous count.

  Before: [[tenna-era|Tenna]]. After: [[genroku-era|Genroku]].
