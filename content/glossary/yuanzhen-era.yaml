public_id: 113123
name: Yuanzhen
names:
  - lang: zh
    role: original
    text: 元貞
category: calendar
definition: "Chinese era name (元貞) of the Yuan for the years 1295–1297: 1295 is Yuanzhen 1 (元年) and Yuanzhen 3 is 1297."
description_md: |-
  **Yuanzhen** (元貞) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1295 under Temür (成宗). Its years are counted in lunar years: 1295 is Yuanzhen 1 (元年), 1297 its last year, Yuanzhen 3. A Chinese source dates a year within it as "Yuanzhen 2" (元貞二年) rather than by a continuous count.

  Before: [[zhiyuan-era|Zhiyuan]]. After: [[dade-era|Dade]].
sources:
  definition:
    - source: dila-time-authority
