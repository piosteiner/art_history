public_id: 130901
name: Anzar
category: mythology and legend
definition: The Amazigh lord of rain, who took the water away when a young woman refused him; rain-calling rituals still invoke his name.
description_md: |-
  Anzar is the Amazigh lord of rain. In the best-known tale, he fell in love with a beautiful young woman who bathed in a river. When she refused him, he took the water away, and the land dried up. Only when she agreed to join him did the rain return. Rain-calling rituals in Kabyle and other Berber communities still invoke his name today.

  *From:* Amazigh tradition · Amazigh (Berber, Kabyle)
