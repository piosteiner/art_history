name: Kaiqing
names:
  - lang: zh
    role: original
    text: 開慶
category: calendar
parent: chinese-calendar
definition: "Chinese era name (開慶) of the Southern Song for the years 1259–1260: 1259 is Kaiqing 1 (元年) and Kaiqing 2 is 1260."
description_md: |-
  **Kaiqing** (開慶) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1259 under Emperor Lizong (理宗). Its years are counted in lunar years: 1259 is Kaiqing 1 (元年), 1260 its last year, Kaiqing 2. A Chinese source dates a year within it as "Kaiqing 2" (開慶二年) rather than by a continuous count.

  Before: [[baoyou-era|Baoyou]]. After: [[jingding-era|Jingding]].
sources:
