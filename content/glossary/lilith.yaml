name: Lilith
names: [Lilitu]
category: mythology and legend
definition: "A female night demon: the lilitu of Mesopotamia and, in medieval Jewish folklore, Adam's first wife, who left Eden and became the mother of demons."
description_md: |-
  The Mesopotamian lilitu were wind spirits. In medieval Jewish folklore, Lilith was created at the same time as [[adam-and-eve|Adam]] and refused to lie beneath him, so she left Eden and became the mother of demons.

  *From:* Mesopotamian demonology; Jewish folklore · Mesopotamian (Sumerian, Babylonian, Assyrian)
