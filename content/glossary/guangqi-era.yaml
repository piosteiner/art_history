public_id: 113112
name: Guangqi
names:
  - lang: zh
    role: original
    text: 光啟
category: calendar
definition: "Chinese era name (光啟) of the Tang for the years 885–888: 885 is Guangqi 1 (元年) and Guangqi 4 is 888."
description_md: |-
  **Guangqi** (光啟) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 885 under Emperor Xizong (僖宗). Its years are counted in lunar years: 885 is Guangqi 1 (元年), 888 its last year, Guangqi 4. A Chinese source dates a year within it as "Guangqi 2" (光啟二年) rather than by a continuous count.

  Before: [[zhonghe-era|Zhonghe]]. After: [[wende-era|Wende]].
sources:
  definition:
    - source: dila-time-authority
