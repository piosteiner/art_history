name: shōgun
names:
  - lang: ja
    role: original
    text: "{将軍|しょうぐん}"
category: other
definition: "Short for sei-i taishōgun, “barbarian-subduing great general”: the military ruler who headed the bakufu while the emperor reigned in name."
