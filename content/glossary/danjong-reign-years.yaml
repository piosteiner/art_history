category: calendar
definition: "The reign years of King Danjong of Joseon (端宗, 단종), by which Korean sources date 1453–1454: 1453 is Danjong 1, 1454 Danjong 2."
description_md: |-
  **Danjong** (端宗, 단종): the years of the reign of King Danjong of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1454 is Danjong 2 (단종 2년). The year of the accession, 1453, counts as the first year.

  Before: [[munjong-reign-years|Munjong]]. After: [[sejo-reign-years|Sejo]].
