public_id: 131055
name: Kiyohime
category: mythology and legend
definition: In Japanese legend, a woman whose rage at a monk who broke his promise turned her into a great serpent; she coiled around the temple bell of Dōjō-ji where he hid and melted it with her fiery breath.
description_md: |-
  Kiyohime fell in love with a travelling monk, who promised to return to her but broke his word and fled. Furious, she chased him, and her anger transformed her into a great serpent. The monk hid under the bell of a temple, but she coiled around it and breathed fire until the bell melted and he died inside.

  *From:* legend of Dōjō-ji · Japanese
