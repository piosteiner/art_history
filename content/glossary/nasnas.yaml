public_id: 130854
name: Nasnas
category: mythology and legend
definition: In Arabic folklore, a creature like half a person split down the middle — half a head, one arm, one leg — that hops with surprising speed.
description_md: |-
  The nasnas is a creature from Arabic folklore that looks like a person split down the middle: half a head, one arm, one leg. It hops around with surprising speed. Some stories say it was a punished people; others that it is the offspring of a jinn (a shiqq) and a human.

  *From:* Arabic folklore · Arabic
