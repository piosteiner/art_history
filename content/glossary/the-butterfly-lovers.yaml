name: The Butterfly Lovers
names: [Liang Shanbo, Zhu Yingtai]
category: mythology and legend
also_in: [iconography]
definition: "China's Romeo and Juliet: Zhu Yingtai and Liang Shanbo, who rose from his grave as a pair of butterflies."
description_md: |-
  China's Romeo and Juliet. Zhu Yingtai disguised herself as a man to go to school, where she fell in love with her classmate Liang Shanbo. Forced to marry another man, on her wedding day she stopped at Liang's grave, which opened for her, and threw herself in, and the two lovers rose from it as a pair of butterflies.

  **In art:** Two butterflies rising from a grave, or a young woman disguised as a scholar.

  *From:* Chinese
