definition: In Greek myth a nation of warrior women; their battle with the Greeks (the Amazonomachy) was a favourite subject of Greek sculpture.
description_md: |-
  A nation of warrior women. [[hippolyta]] was their queen, whose belt [[heracles]] took as his ninth labour. The battle between Greeks and Amazons (the Amazonomachy) was a favourite subject of Greek sculpture.

  **In art:** Women warriors on horseback in short tunics, with bows, axes and crescent-shaped shields.

  **Famous works**

  - *Mausoleum at Halicarnassus* frieze (British Museum)
  - Rubens, *The Battle of the Amazons* (Alte Pinakothek, Munich)
  - [[artist/franz-von-stuck]], *Amazon* (Villa Stuck, Munich)

  *From:* Greek mythology · Ancient Greek
