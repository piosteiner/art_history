definition: "Japanese era name (大治) for the years 1126–1130: 1126 is Daiji 1 (元年) and Daiji 5 is 1130."
description_md: |-
  **Daiji** (大治) is a Japanese era name ([[nengo]]), proclaimed in 1126. Its years are counted in lunar years from the new year before the proclamation: 1126 is Daiji 1 (元年), 1130 its last year, Daiji 5. A Japanese source dates a year within it as "Daiji 2" (大治2年) rather than by a continuous count.

  Before: [[tenji-era|Tenji]]. After: [[tensho-era-1131|Tenshō]].
