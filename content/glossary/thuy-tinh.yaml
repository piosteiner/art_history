name: Thủy Tinh
category: mythology and legend
definition: The Water Spirit of Vietnamese legend who lost Princess Mỵ Nương to Sơn Tinh; the yearly floods of northern Vietnam are said to be his revenge.
description_md: |-
  Both wanted to marry Princess Mỵ Nương. The king said whoever brought the wedding gifts first would win, and [[son-tinh]] arrived first. The furious Thủy Tinh sent floods, and Sơn Tinh raised the mountains higher. Every year, the floods in northern Vietnam are said to be Thủy Tinh's revenge.

  *From:* Vietnamese legend · Vietnamese
