public_id: 113257
name: Geungusu of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 근구수왕
  - lang: ko-Hani
    role: alternative
    text: 近仇首王
category: calendar
parent: korean-calendar
definition: "The reign years of King Geungusu of Baekje (近仇首王, 근구수왕), by which Korean histories date 375–384: 375 is Geungusu 1, 384 Geungusu 10."
description_md: |-
  **Geungusu** (近仇首王, 근구수왕): the years of the reign of King Geungusu of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 384 is Geungusu 10 (근구수왕 10년). The year of the accession, 375, counts as the first year.

  Before: [[geunchogo-baekje-reign-years|Geunchogo]]. After: [[chimnyu-baekje-reign-years|Chimnyu]].
sources:
  definition:
    - source: dila-time-authority
