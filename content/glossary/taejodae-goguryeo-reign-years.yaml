public_id: 113280
name: Taejodae of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 태조대왕
  - lang: ko-Hani
    role: alternative
    text: 太祖大王
category: calendar
parent: korean-calendar
definition: "The reign years of King Taejodae of Goguryeo (太祖大王, 태조대왕), by which Korean histories date 53–146: 53 is Taejodae 1, 146 Taejodae 94."
description_md: |-
  **Taejodae** (太祖大王, 태조대왕): the years of the reign of King Taejodae of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 62 is Taejodae 10 (태조대왕 10년). The year of the accession, 53, counts as the first year.

  Before: [[mobon-goguryeo-reign-years|Mobon]]. After: [[chadae-goguryeo-reign-years|Chadae]].
sources:
  definition:
    - source: dila-time-authority
