name: Hope
names: [Spes]
category: iconography
definition: "Hope personified: the anchor of the theological virtue, and the Symbolists' new image of a blindfolded woman on a globe."
description_md: |-
  Besides the anchor of the theological virtue, the Symbolists created a new image of Hope.

  **Famous works**

  - George Frederic Watts, *Hope* (1886, second version, Tate; first version private collection) — a blindfolded woman on a globe playing a lyre with one string left
  - [[artist/gustav-klimt]], *Hope I* (1903, National Gallery of Canada, Ottawa) and *Hope II* (1907–08, Museum of Modern Art, New York)

  *From:* European
