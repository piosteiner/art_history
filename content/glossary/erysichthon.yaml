name: Erysichthon
category: mythology and legend
definition: In Greek myth, a king who cut down a sacred oak of Demeter and was cursed with a hunger that could never be satisfied.
description_md: |-
  He cut down a sacred oak of [[demeter]], killing the nymph who lived in it. Demeter cursed him with a hunger that could never be satisfied. He sold everything, even his daughter, to buy food, and in the end, he ate himself.

  *From:* Ovid, Metamorphoses · Ancient Greek and Roman
