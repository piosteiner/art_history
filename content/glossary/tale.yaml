category: literary genre
definition: A prose narrative of invented or retold events. In traditional Japanese literature the monogatari (物語) is an extended prose tale, closely tied to oral tradition and almost always fictional or fictionalised — among them The Tale of Genji and The Tale of the Heike. The women of the Heian court were famous for such tales, and for their diaries.
