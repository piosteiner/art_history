name: The Fox and the Grapes
category: mythology and legend
definition: Aesop's fable of a fox who cannot reach some grapes and walks away saying they were probably sour anyway — the origin of "sour grapes".
description_md: |-
  A fox who couldn't reach some grapes walked away saying they were probably sour anyway. This is where the phrase "sour grapes" comes from.

  *From:* Aesop's Fables · Ancient Greek
