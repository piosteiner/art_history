name: Rougarou
names: [loup-garou]
category: mythology and legend
definition: The Cajun werewolf of the Louisiana bayous, from the French loup-garou.
description_md: |-
  Its name comes from the French *loup-garou*. A creature with a man's body and a wolf's head, which hunts in the bayous. In one variation it was said to go after Catholics who didn't keep Lent, and in a common blood-sucking legend its curse lasted 101 days.

  *From:* folklore · Cajun (Louisiana)
