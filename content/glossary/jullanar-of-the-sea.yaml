public_id: 131342
name: Jullanar of the Sea
names: [Julnar]
category: mythology and legend
definition: In the Nights, a princess of an underwater kingdom who was sold to a human king and stayed silent for a year before saying she was pregnant.
description_md: |-
  She came from an underwater kingdom and refused to speak for a year after she was sold to the king as a slave. When she finally spoke, she said she was pregnant. Their son Badr Basim was later turned into a bird by an evil sorceress queen.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
