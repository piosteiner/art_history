definition: '"One who serves": the military class that developed in the Heian period (794–1185), largely out of the aristocratic and imperial clans, first as a kind of police force in the cities and on the great estates. By the end of the twelfth century the samurai had in effect taken over the government, and dominated it until 1868.'
