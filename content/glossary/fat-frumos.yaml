public_id: 131437
name: Făt-Frumos
category: mythology and legend
definition: The handsome hero of Romanian fairy tales, who fights dragons (zmei) and witches to rescue the princess Ileana Cosânzeana.
description_md: |-
  Făt-Frumos ("handsome lad") is the classic hero who fights dragons (*zmei*) and witches to rescue [[ileana-cosanzeana|Ileana Cosanzeana]], the fairest of all, whose beauty is so great that the sun stops to look at her.

  *From:* Romanian folklore · Romanian
