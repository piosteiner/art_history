name: Entombment of Christ
names: [The Entombment]
category: iconography
definition: Christ's body wrapped in linen and laid in a rock tomb.
description_md: |-
  Christ's body is wrapped in linen and laid in a rock tomb.

  **In art:** Mourners carrying the body to a tomb or lowering it into a stone sarcophagus.

  **Famous works**

  - [[artist/caravaggio]], *The Entombment of Christ* (Vatican Pinacoteca)
  - [[artist/raphael]], *The Deposition* (also called *The Entombment*, Galleria Borghese) — [[artwork/the-deposition-raphael]]
  - [[artist/titian]], *The Entombment of Christ* (Louvre)

  *From:* New Testament, Gospels · Christian
