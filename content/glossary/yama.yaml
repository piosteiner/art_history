definition: The king of the dead who judges souls; in Chinese Buddhism one of the Ten Kings who judge the dead in turn.
description_md: |-
  The king of the dead, who judges souls. In Chinese Buddhism, he's one of the Ten Kings (the fifth) who judge the dead in turn, each in his own court.

  **In art:** A fierce-faced judge in Chinese official's robes behind a desk, with record-keepers, a mirror that shows the deeds of the dead, and demons torturing sinners.

  **Famous works**

  - Lu Xinzhong (workshop), *Ten Kings of Hell* (Song dynasty, many sets in Japanese and Western museums)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
