name: Zhiping
names:
  - lang: zh
    role: original
    text: 治平
category: calendar
parent: chinese-calendar
definition: "Chinese era name (治平) of the Northern Song for the years 1064–1067: 1064 is Zhiping 1 (元年) and Zhiping 4 is 1067."
description_md: |-
  **Zhiping** (治平) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1064 under Emperor Yingzong (英宗). Its years are counted in lunar years: 1064 is Zhiping 1 (元年), 1067 its last year, Zhiping 4. A Chinese source dates a year within it as "Zhiping 2" (治平二年) rather than by a continuous count.

  Before: [[jiayou-era|Jiayou]]. After: [[xining-era|Xining]].
sources:
