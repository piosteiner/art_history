public_id: 131242
name: The Wolf in Sheep's Clothing
category: mythology and legend
definition: The fable, later credited to Aesop (first told by the 12th-century Greek rhetorician Nikephoros Basilakis), of a wolf who dresses in a sheep's skin to get close to the flock.
description_md: |-
  A wolf dressed himself in a sheep's skin to get close to the flock. In some versions, the shepherd ends up taking him for a sheep and killing him for dinner.

  *From:* Aesop's Fables · Ancient Greek
