name: elytron
category: material
definition: The hardened forewing of a beetle, a protective wing-case; the iridescent elytra of jewel beetles were set into decorative work, as on the Tamamushi Shrine.
description_md: An elytron (plural elytra, from the Greek for "sheath, cover") is the modified, hardened forewing of a beetle; it serves as a protective wing-case for the hindwings beneath, which are used for flying.[[source/wikipedia-en-elytron|introduction; § Description]] Used as a decorative material, the iridescent wing-cases of jewel beetles give their name to the [[artwork/tamamushi-shrine|Tamamushi Shrine]], a miniature Buddhist shrine of the mid-seventh century at Hōryūji, Nara.[[source/wikipedia-en-tamamushi-shrine|introduction]] The wings of the *tamamushi*, a jewel beetle native to Japan, were laid under the bands of openwork bronze attached to the members of the building and the edges of plinth and dais — a technique known as beetlewing.[[source/wikipedia-en-tamamushi-shrine|§ Technology]] Penelope Mason imagines that the iridescence of the wings "must have made striking contrast with the strong pure colors of the paintings — reds, yellows, light browns, and greens applied to a black ground".[[source/history-of-japanese-art|p. 75]] The wings have since exfoliated.[[source/wikipedia-en-tamamushi-shrine|introduction]] The monk Kenshin already mentioned the shrine's tamamushi wings in his account of Prince Shōtoku of the 1230s or 1240s.[[source/wikipedia-en-tamamushi-shrine|§ History]]
