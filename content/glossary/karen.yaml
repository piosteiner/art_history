public_id: 131370
name: Karen
names: [The Red Shoes]
category: mythology and legend
definition: In Andersen's fairy tale The Red Shoes (1845), a vain girl cursed by an angel to dance in her red shoes without stopping.
description_md: |-
  Karen was so vain about her red shoes that she wore them to church. An angel cursed her to dance in them without stopping, day and night. In the end, she asked an executioner to cut off her feet, and the shoes danced away with them.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
