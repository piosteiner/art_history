name: Dokkaebi
category: mythology and legend
definition: Mischievous Korean goblins, often born from old household objects, who love pranks, drinking and wrestling, and carry a magic club that can summon anything they wish.
description_md: |-
  Dokkaebi are Korean goblins, often born from old household objects like brooms. They love pranks, drinking, and challenging people to wrestling matches, and they carry a magic club that can summon anything they wish. They reward good people with treasure and play nasty tricks on greedy ones.

  *From:* folklore · Korean
