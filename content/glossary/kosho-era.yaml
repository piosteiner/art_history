definition: "Japanese era name (康正) for the years 1455–1457: 1455 is Kōshō 1 (元年) and Kōshō 3 is 1457."
description_md: |-
  **Kōshō** (康正) is a Japanese era name ([[nengo]]), proclaimed in 1455. Its years are counted in lunar years from the new year before the proclamation: 1455 is Kōshō 1 (元年), 1457 its last year, Kōshō 3. A Japanese source dates a year within it as "Kōshō 2" (康正2年) rather than by a continuous count.

  Before: [[kyotoku-era|Kyōtoku]]. After: [[choroku-era|Chōroku]].
