definition: "Japanese era name (延享) for the years 1744–1748: 1744 is Enkyō 1 (元年) and Enkyō 5 is 1748."
description_md: |-
  **Enkyō** (延享) is a Japanese era name ([[nengo]]), proclaimed in 1744. Its years are counted in lunar years from the new year before the proclamation: 1744 is Enkyō 1 (元年), 1748 its last year, Enkyō 5. A Japanese source dates a year within it as "Enkyō 2" (延享2年) rather than by a continuous count.

  Before: [[kanpo-era|Kanpō]]. After: [[kanen-era|Kan'en]].
