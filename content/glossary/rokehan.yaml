definition: "Location hunting: a production team's journey to the places a work is set in — the makers of Heidi travelled to Switzerland."
description_md: |-
  *Rokehan* (location hunting) is a production team's journey to the places in which a work is set. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]] For the anime *Heidi*, the production team went to Switzerland to explore the places that might matter for the production — an idea of Europe and of idyllic countries for makers who came out of the shadow of war. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]]

  ## Heidi

  *Arupusu no shōjo Haiji* (*Heidi, Girl of the Alps*) is an anime series in 52 parts of 1973, directed by Isao Takahata. [[source/thomsen-2019-war-and-peace|image list, 5 April 2019]] For an accurate depiction of the settings, the staff were sent on a scouting trip to Switzerland: in summer 1973 Takahata, [[artist/hayao-miyazaki|Hayao Miyazaki]] and the character designer Yōichi Kotabe spent two days in Maienfeld and then travelled on to [[place/frankfurt|Frankfurt]]. [[source/wikipedia-en-heidi-girl-of-the-alps|§ Production]] The results of their research served as reference for the settings, backgrounds and character designs; the group stayed at a hut that became the model for the grandfather's cottage. [[source/wikipedia-en-heidi-girl-of-the-alps|§ Production]] Kotabe dropped Heidi's pigtails after a Swiss librarian told him that a five-year-old girl in the mountains would not be able to tie them. [[source/wikipedia-en-heidi-girl-of-the-alps|§ Production]]

  ## In the lecture

  The term was on the vocabulary list of 5 April 2019, beside [[term/bunbu|bunbu]], Miyazaki Hayao, Shinto and [[term/anime|anime]]. [[source/thomsen-2019-war-and-peace|vocabulary list, 5 April 2019]] The class notes connect it with Heidi, "Swissness" and the series' various adaptations. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]]
