definition: "Japanese era name (寛延) for the years 1748–1751: 1748 is Kan'en 1 (元年) and Kan'en 4 is 1751."
description_md: |-
  **Kan'en** (寛延) is a Japanese era name ([[nengo]]), proclaimed in 1748. Its years are counted in lunar years from the new year before the proclamation: 1748 is Kan'en 1 (元年), 1751 its last year, Kan'en 4. A Japanese source dates a year within it as "Kan'en 2" (寛延2年) rather than by a continuous count.

  Before: [[enkyo-era-1744|Enkyō]]. After: [[horeki-era|Hōreki]].
