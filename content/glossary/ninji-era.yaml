definition: "Japanese era name (仁治) for the years 1240–1243: 1240 is Ninji 1 (元年) and Ninji 4 is 1243."
description_md: |-
  **Ninji** (仁治) is a Japanese era name ([[nengo]]), proclaimed in 1240. Its years are counted in lunar years from the new year before the proclamation: 1240 is Ninji 1 (元年), 1243 its last year, Ninji 4. A Japanese source dates a year within it as "Ninji 2" (仁治2年) rather than by a continuous count.

  Before: [[eno-era|En'ō]]. After: [[kangen-era|Kangen]].
