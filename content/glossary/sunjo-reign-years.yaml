public_id: 109296
name: Sunjo (reign years)
names:
  - lang: ko
    role: original
    text: 순조
  - lang: ko-Hani
    role: alternative
    text: 純祖
category: calendar
definition: "The reign years of Sunjo of Joseon (純祖, 순조), by which Korean sources date 1801–1834: 1801 is Sunjo 1, 1834 Sunjo 34."
description_md: |-
  **Sunjo** (純祖, 순조): the years of the reign of [[person/sunjo-of-joseon|Sunjo of Joseon]], who came to the throne on 4 July 1800. Korean sources count years by the reigning king ([[korean-reign-years]]): 1810 is Sunjo 10 (순조 10년). His first year is 1801, the year after his accession; the rest of 1800 still counts for his predecessor.

  Before: [[jeongjo-reign-years|Jeongjo]]. After: [[heonjong-reign-years|Heonjong]].
