definition: "Japanese era name (延徳) for the years 1489–1492: 1489 is Entoku 1 (元年) and Entoku 4 is 1492."
description_md: |-
  **Entoku** (延徳) is a Japanese era name ([[nengo]]), proclaimed in 1489. Its years are counted in lunar years from the new year before the proclamation: 1489 is Entoku 1 (元年), 1492 its last year, Entoku 4. A Japanese source dates a year within it as "Entoku 2" (延徳2年) rather than by a continuous count.

  Before: [[chokyo-era|Chōkyō]]. After: [[meio-era|Meiō]].
