definition: "Japanese era name (安和) for the years 968–969: 968 is Anna 1 (元年) and Anna 2 is 969."
description_md: |-
  **Anna** (安和) is a Japanese era name ([[nengo]]), proclaimed in 968. Its years are counted in lunar years from the new year before the proclamation: 968 is Anna 1 (元年), 969 its last year, Anna 2. A Japanese source dates a year within it as "Anna 2" (安和2年) rather than by a continuous count.

  Before: [[koho-era|Kōhō]]. After: [[tenroku-era|Tenroku]].
