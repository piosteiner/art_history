definition: "Japanese era name (保延) for the years 1135–1141: 1135 is Hōen 1 (元年) and Hōen 7 is 1141."
description_md: |-
  **Hōen** (保延) is a Japanese era name ([[nengo]]), proclaimed in 1135. Its years are counted in lunar years from the new year before the proclamation: 1135 is Hōen 1 (元年), 1141 its last year, Hōen 7. A Japanese source dates a year within it as "Hōen 2" (保延2年) rather than by a continuous count.

  Before: [[chosho-era|Chōshō]]. After: [[eiji-era|Eiji]].
