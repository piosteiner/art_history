name: Saci-Pererê
names: [Saci]
category: mythology and legend
definition: A one-legged trickster of Brazilian folklore with a pipe and a magic red cap, who travels in whirlwinds.
description_md: |-
  A mischievous Black boy with one leg who smokes a pipe and wears a magic red cap. He travels in whirlwinds, hides things, braids horses' manes and spoils food. If you steal his cap, he has to grant you a wish.

  *From:* folklore · Brazilian
