name: Duangong
names:
  - lang: zh
    role: original
    text: 端拱
category: calendar
parent: chinese-calendar
definition: "Chinese era name (端拱) of the Northern Song for the years 988–990: 988 is Duangong 1 (元年) and Duangong 3 is 990."
description_md: |-
  **Duangong** (端拱) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 988 under Emperor Taizong (太宗). Its years are counted in lunar years: 988 is Duangong 1 (元年), 990 its last year, Duangong 3. A Chinese source dates a year within it as "Duangong 2" (端拱二年) rather than by a continuous count.

  Before: [[yongxi-era|Yongxi]]. After: [[chunhua-era|Chunhua]].
sources:
  definition:
    - source: dila-time-authority
