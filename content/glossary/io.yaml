definition: In Greek myth, a priestess of Hera loved by Zeus, who came to her as a dark cloud and turned her into a white cow to hide her from Hera.
description_md: |-
  A priestess of [[hera]] loved by [[zeus]], who came to her as a dark cloud. To hide her from Hera, he turned her into a white cow (in other versions Hera herself transformed her), and Hera set the hundred-eyed giant Argus to guard her.

  **In art:** A woman embraced by a cloud with a barely visible face, or a white cow guarded by Argus.

  **Famous works**

  - Correggio, *Jupiter and Io* (Kunsthistorisches Museum, Vienna) — [[artwork/jupiter-und-io]]

  *From:* Greek mythology; Ovid, Metamorphoses · Ancient Greek
