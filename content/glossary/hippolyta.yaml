definition: In Greek myth the queen of the Amazons, whose belt Heracles took as his ninth labour.
description_md: |-
  A nation of warrior women. Hippolyta was their queen, whose belt [[heracles]] took as his ninth labour. The battle between Greeks and [[the-amazons|Amazons]] (the Amazonomachy) was a favourite subject of Greek sculpture.

  **In art:** A woman warrior on horseback.

  *From:* Greek mythology · Ancient Greek
