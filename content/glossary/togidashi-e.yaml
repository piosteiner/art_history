name: togidashi-e
names:
  - lang: ja
    role: original
    text: "{研出蒔絵|とぎだしまきえ}"
  - lang: en
    role: translation
    text: polished-out picture
category: technique
parent: lacquer
definition: A lacquer technique in which the design is covered with further layers of lacquer and then polished back until it shows flush with the surface.
