definition: In Greek myth the goddess of the hearth and home, eldest of the Olympians; the Romans called her Vesta.
description_md: |-
  Goddess of the hearth and home, eldest of the Olympians.

  **In art:** Rarely shown. A modest, veiled woman with a flame or a hearth. In Rome, her sacred fire was tended by the [[vestal-virgins]], who appear more often in art than she does.

  *From:* Greek mythology · Ancient Greek
