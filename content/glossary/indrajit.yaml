name: Indrajit
names: [Meghanada]
category: mythology and legend
definition: In the Ramayana, Ravana's eldest son (also Meghanada), a sorcerer-warrior named "conqueror of Indra", killed by Lakshmana.
description_md: |-
  Indrajit, also called Meghanada, was [[ravana]]'s eldest son and the mightiest warrior in Lanka after his father. His name means "conqueror of Indra", because he once defeated and captured Indra, king of the gods. He fought invisibly from behind the clouds, using illusions and powerful divine weapons, and nearly won the war for Lanka on his own. He was finally killed by [[rama]]'s brother Lakshmana.

  *From:* Ramayana · Indian
