definition: In Greek myth, the youth loved by Apollo and accidentally killed by his discus; the hyacinth grew from his blood.
description_md: |-
  A youth loved by [[apollo]]. Hyacinthus was accidentally killed by Apollo's discus (in some versions, blown off course by the jealous West Wind), and from his blood grew the hyacinth flower.

  **In art:** Apollo holding a dying youth with a discus nearby.

  **Famous works**

  - [[artist/giovanni-battista-tiepolo]], *The Death of Hyacinthus* (Thyssen-Bornemisza, Madrid)
  - Benvenuto Cellini, *Apollo and Hyacinth* (Bargello)

  *From:* Ovid, Metamorphoses · Ancient Greek
