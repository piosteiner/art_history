name: The Forty-Seven Rōnin
names: [Chūshingura, 47 rōnin, Lord Asano, Kira]
category: mythology and legend
also_in: [iconography]
definition: "A true story of 1701–1703: the masterless samurai of Lord Asano avenged him on the official Kira, knowing they would have to die for it; Japan's most famous story of loyalty."
description_md: |-
  A real event of 1701–1703. Lord Asano was forced to commit suicide after drawing his sword on the official Kira. His 47 masterless samurai (*rōnin*) waited almost two years, then stormed Kira's house on a snowy night and took his head, after which 46 of them were ordered to commit seppuku (20 March 1703); the youngest, Terasaka Kichiemon, was pardoned. It became Japan's most famous story of loyalty and its most popular kabuki story, retold in kabuki and puppet theatre.

  **In art:** Warriors in matching black-and-white triangle-patterned (or striped) coats storming a mansion in the snow, or the rōnin presenting the head at their lord's grave at Sengaku-ji.

  **Famous works**

  - [[artist/utagawa-kuniyoshi]], *Faithful Samurai (Portraits of the Faithful Samurai)* (print series)
  - [[artist/katsushika-hokusai]], *Chūshingura* (series)
  - [[artist/utagawa-hiroshige]], *Chūshingura* (print series)

  *From:* Chūshingura · Japanese
