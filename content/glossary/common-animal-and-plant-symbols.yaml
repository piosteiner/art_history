name: Common animal and plant symbols
category: iconography
definition: "A quick reference for symbols in Western painting: the dog for fidelity, the pelican for Christ's sacrifice, the lily for purity, the skull for mortality and more."
description_md: |-
  A quick reference for symbols that appear in all kinds of paintings.

  **In art:** A dog means fidelity. A lamb means Christ or innocence. A lion means strength, Saint Mark or Saint Jerome. A peacock means immortality (its flesh was thought not to decay) or pride. A pelican pecking its breast to feed its young with its blood means Christ's sacrifice. A goldfinch, often held by the Christ child, foretells the Passion. A unicorn means purity, and can only be tamed by a virgin. A snake means sin or the Devil, but a snake biting its tail (*ouroboros*) means eternity. A lily means purity and the Virgin. A red rose means love or martyrdom. A pomegranate means resurrection or the Church. An apple means temptation. Grapes and wheat mean the wine and bread of the Eucharist. An owl means wisdom ([[athena]]) or darkness and evil. A skull means mortality. Laurel means victory or poetry, and an olive branch means peace.

  **Famous works**

  - [[artist/jan-van-eyck]], *The Arnolfini Portrait* (1434, National Gallery, London; full of disputed symbols)
  - [[artist/raphael]], *Madonna of the Goldfinch* (Uffizi) — [[artwork/madonna-of-the-goldfinch]]
  - *The Hunt of the Unicorn* (seven tapestries, Southern Netherlands, c. 1495–1505, The Cloisters, Metropolitan Museum of Art, New York)

  *From:* European (Christian)
