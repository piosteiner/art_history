public_id: 132314
name: The Four Seasons
category: iconography
definition: "The cycle of the year in art: the seasons as gods (Flora, Ceres, Bacchus, an old man by a fire) or as landscapes with the labours of the months."
description_md: |-
  The cycle of the year.

  **In art:** Spring as [[flora]] or [[aphrodite|Venus]] with flowers, Summer as [[demeter|Ceres]] with wheat, Autumn as [[dionysus|Bacchus]] with grapes, and Winter as an old man by a fire. Or landscapes with seasonal labours, like the medieval "labours of the months".

  **Famous works**

  - Pieter Bruegel the Elder, *The Hunters in the Snow* and the other paintings of the seasons series (1565; five survive, three in the Kunsthistorisches Museum, Vienna, others in New York and Prague) — [[artwork/the-hunters-in-the-snow]]
  - Giuseppe Arcimboldo, *The Four Seasons* (heads made of fruit, vegetables and flowers, Vienna and Louvre)
  - [[artist/limbourg-brothers]], calendar of the *Très Riches Heures du Duc de Berry* (1412–1416, Musée Condé, Chantilly) — [[artwork/tres-riches-heures]]
  - [[artist/nicolas-poussin]], *The Four Seasons* (Louvre)

  *From:* European
