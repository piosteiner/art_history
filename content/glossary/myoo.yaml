public_id: 107176
name: Myōō
names:
  - lang: ja
    role: original
    text: "{明王|みょうおう}"
category: iconography
definition: "Kings of Higher Knowledge (vidyārāja): wrathful deities of esoteric Buddhism who subdue evil and the passions; usually five, around Fudō."
description_md: |-
  Ferocious protectors in [[esoteric-buddhism]] who scare away evil and destroy obstacles to enlightenment. The most important is Acala (Japanese: Fudō Myō-ō, the "Immovable").

  **In art:** Fierce figures surrounded by flames; the chief of them, [[fudo]], is blue or dark, with bulging eyes and fangs, holding a sword and a rope (to bind evil), sitting on a rock.

  **Famous works**

  - *Fudō Myō-ō* (Tō-ji, Kyoto)
  - *Red Fudō* (Myōō-in, Mount Kōya)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist (Esoteric)
