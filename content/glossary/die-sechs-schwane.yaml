public_id: 131208
name: Die sechs Schwäne
names: [The Six Swans]
category: mythology and legend
definition: The Grimms' fairy tale of a sister who frees her six brothers from a swan curse by staying silent for six years and sewing them shirts of starflowers.
description_md: |-
  To break the spell, she had to stay silent for six years and sew six shirts from starflowers. Accused by her mother-in-law of being a cannibal who had eaten her own babies, she was about to be burnt at the stake when the swans flew down. She threw the shirts over them, but one sleeve was unfinished, so the youngest kept a swan's wing instead of an arm.

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
