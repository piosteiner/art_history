category: calendar
definition: "Japanese era name (宝徳) for the years 1449–1452: 1449 is Hōtoku 1 (元年) and Hōtoku 4 is 1452."
description_md: |-
  **Hōtoku** (宝徳) is a Japanese era name ([[nengo]]), proclaimed in 1449. Its years are counted in lunar years from the new year before the proclamation: 1449 is Hōtoku 1 (元年), 1452 its last year, Hōtoku 4. A Japanese source dates a year within it as "Hōtoku 2" (宝徳2年) rather than by a continuous count.

  Before: [[bunan-era|Bun'an]]. After: [[kyotoku-era|Kyōtoku]].
