public_id: 130920
name: Tokoloshe
category: mythology and legend
definition: In Zulu tradition, a small, dwarf-like spirit summoned to harm others, able to become invisible; some people still raise their beds on bricks against it.
description_md: |-
  The tokoloshe is a small, dwarf-like spirit from Zulu tradition, said to be summoned by people who want to harm others. It can become invisible and causes trouble, illness or worse. The belief is so well known that some people still raise their beds on bricks to stay out of its reach.

  In Zulu and Xhosa folklore, a short, hairy creature summoned by people to make trouble for their enemies. People still put their beds on bricks to stay out of its reach.

  *From:* folklore · Zulu (Southern Africa)
