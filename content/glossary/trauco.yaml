public_id: 131537
name: Trauco
category: mythology and legend
definition: A short, ugly forest creature of Chiloé folklore with a stone axe and no feet, who can kill with a look.
description_md: |-
  A small, ugly man who wears clothes of plant fibre, carries a stone axe, and has no feet. He can kill with a look. He's blamed for unexpected pregnancies in Chiloé folklore.

  *From:* folklore · Chilote (Chiloé)
