name: Hervor
names: [Hervör, Hervard]
category: mythology and legend
definition: The shieldmaiden of the Hervarar saga who sailed to her berserker father Angantyr's haunted burial mound and demanded the cursed dwarf-forged sword Tyrfing from his ghost.
description_md: |-
  Hervor was the daughter of the berserker Angantyr, who was buried with his sword Tyrfing in a burial mound on an island. Tyrfing had been forged by dwarves and cursed: it would kill a man every time it was drawn and would cause three great evils. Dressed as a man and calling herself Hjörvard (Hervarðr), Hervor sailed to the island at night, stood at the haunted mound among ghostly fires, and demanded the sword. Her father's ghost warned her it would destroy her family line. She took it anyway.

  *From:* Hervarar saga (The Saga of Hervör and Heidrek) · Norse
