description_md: |-
  A winged altarpiece (German Flügelaltar or Flügelretabel, also Wandelaltar) is a form of retable, common in central and northern Europe, whose fixed centre – a painted panel or a carved shrine – can be closed by movable wings.[[source/wikipedia-de-flugelaltar|§ introduction]][[source/wikipedia-en-winged-altarpiece|§ introduction]] With two wings it is a triptych, with four a pentaptych, with more a polyptych; the different views are called openings (Wandlungen).[[source/wikipedia-de-flugelaltar|§ Beschreibung]] Above the retable may rise a superstructure (Gesprenge) of pinnacles and finials; below, the predella can hold relics.[[source/wikipedia-de-flugelaltar|§ Beschreibung]]

  ## History

  The type arose around 1300 as a liturgically changeable retable; the oldest surviving examples are in the abbeys of Doberan and Cismar, and the display of relics and miracle-working images is discussed as a reason for its rise.[[source/wikipedia-de-flugelaltar|§ Geschichte]] It flourished in the late Middle Ages; in Italy, where polyptychs were usually built without hinges, it was never as popular.[[source/wikipedia-en-winged-altarpiece|§ introduction]] Between 1450 and 1525 a building boom in the Empire and the wish of donors and corporations for their own altars made the retable a prestige object; more altarpieces were made between 1500 and 1525 than ever before.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 189]]

  ## Opening and closing

  The wings were usually kept closed except on Sundays and feast days.[[source/wikipedia-en-winged-altarpiece|§ introduction]] More wings allowed a finer match between the display and the rank of the feast: like a book of images, the altarpiece opened a new "page" for each occasion.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 187]] The prior of the Nuremberg Carmelites prescribed in 1523 the days on which Veit Stoss's altarpiece was to be opened and when it had to be closed again.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 102]]

  ## Unpainted retables

  Late medieval winged altarpieces were normally painted and gilded; unpainted ones became more frequent later.[[source/wikipedia-de-flugelaltar|§ Beschreibung]] Georg Habenicht argues that they were mostly unfinished rather than programmatic: the division of the trades let patrons pay for the parts one after another, and the end of the donor market with the Reformation left many in this provisional state.[[source/habenicht-2016-das-ungefasste-altarretabel|pp. 184–185]]
