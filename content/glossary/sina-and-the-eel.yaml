name: Sina and the Eel
category: mythology and legend
definition: A Samoan and Tongan story of the origin of the coconut, which grew from the buried head of the eel that loved Sina.
description_md: |-
  A girl named Sina kept a pet eel, which grew huge and followed her everywhere. In one Samoan version it was really the Tui Fiti, the King of Fiji, who had come to see her. When it was dying, it asked her to bury its head. A coconut tree grew from the grave, and the three marks on a coconut are the eel's eyes and mouth, so whenever Sina drank from it, she was kissing him.

  *From:* Polynesian tradition · Samoan, Tongan
