name: Feeding of the Five Thousand
names: [Miracle of the Loaves and Fishes, Calming the storm]
category: iconography
definition: Jesus feeding 5,000 people with five loaves and two fish; with other miracles such as the calming of the storm on the Sea of Galilee.
description_md: |-
  More miracles: Jesus fed 5,000 people with five loaves and two fish. He raised the daughter of Jairus from the dead, healed a paralysed man who was let down through a roof, and calmed a storm on the Sea of Galilee.

  **In art:** Baskets of bread and fish among a huge crowd, or a boat tossed by a storm with Christ asleep.

  **Famous works**

  - [[artist/rembrandt]], *The Storm on the Sea of Galilee* (stolen from the Gardner Museum, Boston, in 1990, never recovered)
  - Tintoretto, *The Miracle of the Loaves and Fishes* (Metropolitan Museum)
  - Delacroix, *Christ on the Sea of Galilee* (several versions)

  *From:* New Testament, Gospels · Christian
