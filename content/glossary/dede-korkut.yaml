name: Dede Korkut
names: [Korkut Ata]
category: mythology and legend
definition: The legendary wise man and bard of the Oghuz Turks, who sang on his kopuz and, in legend, fled from his own death.
description_md: |-
  Dede Korkut is the legendary wise man and storyteller of the Oghuz Turks, who blessed heroes, named children and sang their stories on his *kopuz*, a stringed instrument. In a Kazakh legend of Korkyt Ata, he learned of his coming death and fled to the four corners of the world to escape it, but everywhere he went, people were digging his grave. Finally he spread his carpet on the Syr Darya and played his kobyz day and night, because death could not take him while he played. When he fell asleep, death came as a snake.

  The *Book of Dede Korkut* is the epic of the Oghuz Turks. Korkut is a wise old storyteller with a *kopuz* (lute) who names the heroes and blesses them. In one story, he fled from Death to every corner of the world, but Death was waiting wherever he went.

  *From:* Book of Dede Korkut · Oghuz Turkic
