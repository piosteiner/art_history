public_id: 131146
name: Children of Lir
category: mythology and legend
definition: The Irish legend of the four children of Lir, turned into swans for 900 years by their jealous stepmother Aoife; when they changed back they were ancient and died soon afterwards.
description_md: |-
  Their jealous stepmother Aoife turned the four children of Lir into swans. [[fionnuala]], the eldest, protected her brothers through storms on the cold seas. When they finally changed back, they were ancient and died soon afterwards.

  *From:* Irish legend · Irish
