definition: In Greek myth the strongest of heroes, son of Zeus and Alcmene, who performed the Twelve Labours and became a god after his death; the Romans called him Hercules.
description_md: |-
  The strongest of heroes, son of [[zeus]] and the mortal Alcmene. In Apollodorus' version, driven mad by [[hera]], he killed his own family, and as penance performed the Twelve Labours (in [[person/euripides]]' Herakles the madness comes after the labours): the Nemean Lion, the [[hydra]], the Ceryneian Hind, the Erymanthian Boar, the Augean Stables, the Stymphalian Birds, the Cretan Bull, the Mares of Diomedes, [[hippolyta]]'s Belt, the Cattle of Geryon, the Apples of the Hesperides and [[cerberus]]. After his death on a funeral pyre, he became a god.

  **In art:** A bearded, massively muscular man with a club and the skin of the Nemean Lion worn over his head and shoulders. "Hercules at the Crossroads" shows him choosing between Virtue and Vice.

  **Famous works**

  - *Farnese Hercules* (Naples National Archaeological Museum)
  - Antonio del Pollaiuolo, *Hercules and the Hydra* (Uffizi)
  - [[artist/annibale-carracci]], *The Choice of Hercules* (Museo di Capodimonte, Naples)
  - Zurbarán, *Labours of Hercules* series (Prado)

  *From:* Greek mythology · Ancient Greek
