name: Ophelia
category: mythology and legend
also_in: [iconography]
definition: Hamlet's beloved in Shakespeare's play, who went mad and drowned in a brook when a willow branch broke as she hung her flower garlands on it.
description_md: |-
  From Shakespeare's *Hamlet*: Hamlet's beloved, who went mad after he rejected her and killed her father. Hanging her flower garlands on a willow, she fell into the brook when a branch broke, and floated singing until she drowned.

  **In art:** A young woman floating in a stream among flowers, or sitting on a willow branch above the water.

  **Famous works**

  - [[artist/john-everett-millais]], *Ophelia* (1851–52; Tate Britain, London)
  - John William Waterhouse, *Ophelia* (three versions, 1889, 1894, 1910)
  - [[artist/eugene-delacroix]], *The Death of Ophelia* (Louvre; other versions in Munich, 1838, and Winterthur)

  *From:* William Shakespeare, Hamlet · English
