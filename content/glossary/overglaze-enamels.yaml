public_id: 107915
name: overglaze enamels
names:
  - lang: ja
    role: original
    text: "{上絵|うわえ}"
category: technique
definition: Lead-fluxed coloured enamels painted over the fired glaze and fixed in a second, lower firing; in Japan first mastered at Arita in the mid-seventeenth century.
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 293–294
