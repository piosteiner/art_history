name: mingei
names:
  - lang: ja
    role: original
    text: "{民藝|みんげい}"
category: art style
definition: "“Folk craft”: the movement led from the 1920s by Yanagi Sōetsu, for whom true beauty lay in functional objects of natural materials made by anonymous craftspeople — wabi and sabi in modern terms."
sources:
  definition:
    - source: history-of-japanese-art
      locator: pp. 345–346
