name: Kaibao
names:
  - lang: zh
    role: original
    text: 開寶
category: calendar
parent: chinese-calendar
definition: "Chinese era name (開寶) of the Northern Song for the years 968–976: 968 is Kaibao 1 (元年) and Kaibao 9 is 976."
description_md: |-
  **Kaibao** (開寶) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 968 under Emperor Taizu (太祖). Its years are counted in lunar years: 968 is Kaibao 1 (元年), 976 its last year, Kaibao 9. A Chinese source dates a year within it as "Kaibao 2" (開寶二年) rather than by a continuous count.

  Before: [[qiande-era|Qiande]]. After: [[taiping-xingguo-era|Taiping Xingguo]].
sources:
