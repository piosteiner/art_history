public_id: 113309
name: Mokjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 목종
  - lang: ko-Hani
    role: alternative
    text: 穆宗
category: calendar
definition: "The reign years of King Mokjong of Goryeo (穆宗, 목종), by which Korean histories date 998–1009: 998 is Mokjong 1, 1009 Mokjong 12."
description_md: |-
  **Mokjong** (穆宗, 목종): the years of the reign of King Mokjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1007 is Mokjong 10 (목종 10년). The year of the accession, 998, counts as the first year.

  Before: [[seongjong-goryeo-reign-years|Seongjong]]. After: [[hyeonjong-goryeo-reign-years|Hyeonjong]].
sources:
  definition:
    - source: dila-time-authority
