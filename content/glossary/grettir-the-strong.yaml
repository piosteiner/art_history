name: Grettir the Strong
names: [Grettir Ásmundarson]
category: mythology and legend
definition: Grettir Ásmundarson, Iceland's most famous outlaw and hero of Grettis saga, who defeated the draugr Glámr and was cursed by him to fear the dark; he was killed on the island of Drangey.
description_md: |-
  Grettir was immensely strong but quick-tempered and unlucky, and he was outlawed in Iceland for almost twenty years. His greatest deed was fighting Glámr, a *draugr* (an undead revenant) who was terrorising a farm. Grettir beat him, but as he died, Glámr cursed him to be afraid of the dark for the rest of his life. Grettir spent his last years on the steep island of Drangey with his brother, where his enemies finally killed him.

  *From:* Grettis saga · Icelandic
