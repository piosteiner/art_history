name: Ashwatthama
category: mythology and legend
definition: In the Mahabharata, the warrior born with a protective gem in his forehead, cursed to wander the earth for thousands of years after his night attack on sleeping warriors.
description_md: |-
  Ashwatthama was a great warrior of the Mahabharata, born with a gem in his forehead that protected him. After his father was killed by a trick, he took terrible revenge, attacking the enemy camp at night and killing sleeping warriors. As punishment, the gem was torn from his forehead and he was cursed to wander the earth for thousands of years, alone, with a wound that never heals. Folk tales still say he roams the forests of India today.

  *From:* Mahabharata · Indian
