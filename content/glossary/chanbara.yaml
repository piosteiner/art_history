description_md: |-
  *Chanbara* ("sword fighting") is the Japanese film genre known in English as samurai cinema, roughly the equivalent of the Western and the swashbuckler, and a sub-genre of [[term/jidaigeki|jidaigeki]] [[source/wikipedia-en-samurai-cinema|introduction]]. Samurai films after the Second World War became more action-based, with darker and more violent characters, often psychologically or physically scarred warriors; usually set in the Tokugawa era (1600–1868), many deal with masterless [[term/ronin|rōnin]] or with samurai facing the end of their way of life [[source/wikipedia-en-samurai-cinema|introduction]]. They were made constantly until the early 1970s, when overexposure on television, ageing stars and the decline of the Japanese film industry ended most production [[source/wikipedia-en-samurai-cinema|introduction]].

  ## The Sword of Doom

  Kihachi Okamoto's *The Sword of Doom* (*Dai-bosatsu Tōge*, "Great Bodhisattva Pass", 1966), with Tatsuya Nakadai, follows the amoral swordsman Ryūnosuke Tsukue, who joins the Shinsengumi and ends, haunted by the people he has killed, cutting down a gang of assassins in a burning courtesan house [[source/wikipedia-en-the-sword-of-doom|introduction; § Plot]]. It adapts Kaizan Nakazato's serial novel *Daibosatsu Tōge*, begun in 1913 and left unfinished at his death in 1944, which had been filmed several times before [[source/wikipedia-en-the-sword-of-doom|§ Production]].

  In the lecture *War and Peace in East Asian Art* the film stood beside a print from Utagawa Kuniyoshi's series [[artwork/biographies-of-loyal-and-righteous-samurai|of the loyal retainers]] (1848) [[source/thomsen-2019-war-and-peace|image list, 12 April 2019]]; the vocabulary list of the day groups it with the samurai, the samurai films of the 1960s, [[term/chushingura|Chūshingura]], Mito Kōmon and jidaigeki [[source/thomsen-2019-war-and-peace|vocabulary list, 12 April 2019]]. Samurai in anime of the 2000s, shown the same day, are described under [[term/anime|anime]].
