name: The Ant and the Grasshopper
category: mythology and legend
definition: Aesop's fable of a grasshopper who sings all summer while the ant stores food, and goes hungry in winter; a cicada in the Greek original and in La Fontaine's version.
description_md: |-
  The grasshopper sang all summer while the ant stored food. When winter came, the grasshopper was starving and begged the ant for food. In the Greek original, and in La Fontaine's version, it's a cicada.

  *From:* Aesop's Fables · Ancient Greek
