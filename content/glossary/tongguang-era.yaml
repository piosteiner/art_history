public_id: 112955
name: Tongguang
names:
  - lang: zh
    role: original
    text: 同光
category: calendar
definition: "Chinese era name (同光) of the Later Tang for the years 923–926: 923 is Tongguang 1 (元年) and Tongguang 4 is 926."
description_md: |-
  **Tongguang** (同光) is a Chinese era name ([[nianhao]]) of the Later Tang, proclaimed in 923 under Emperor Zhuangzong (莊宗). Its years are counted in lunar years: 923 is Tongguang 1 (元年), 926 its last year, Tongguang 4. A Chinese source dates a year within it as "Tongguang 2" (同光二年) rather than by a continuous count.

  After: [[tiancheng-era|Tiancheng]].
sources:
  definition:
    - source: dila-time-authority
