name: Xolo
names: [Xoloitzcuintli]
category: mythology and legend
definition: The hairless Mexican dog (xoloitzcuintli), which in Aztec belief carried the dead across the river on the way to Mictlan.
description_md: |-
  In Aztec belief, the dead had to cross a wide river on the way to Mictlan, the land of the dead, and a dog would carry them across on its back. That's why dogs were sometimes buried with their owners.

  *From:* Aztec belief · Aztec (Mexica)
