description_md: |-
  Roman goddess of flowers and spring (Greek: [[chloris]]).

  **In art:** A young woman crowned with flowers, scattering blossoms.

  **Famous works**

  - Botticelli, *Primavera* (right side, Chloris turning into Flora) — [[artwork/primavera]]
  - [[artist/titian]], *Flora* (Uffizi)

  *From:* Roman mythology · Ancient Roman
