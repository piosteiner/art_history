name: Melusine
category: mythology and legend
also_in: [iconography]
definition: A fairy woman of French and Luxembourgish legend with a serpent's or fish's tail, from whom the Lusignan and Luxembourg dynasties claimed descent.
description_md: |-
  A fairy woman of French and Luxembourgish legend who married a nobleman on the condition that he never see her on Saturdays. When he spied on her bathing, he saw that from the waist down she had a serpent's or fish's tail. She flew away as a dragon. The Lusignan family and the Luxembourg dynasty claimed descent from her.

  **In art:** A woman with a serpent or fish tail in a bath, or a winged dragon-woman flying from a castle.

  **Famous works**

  - [[artist/limbourg-brothers]], *Très Riches Heures du Duc de Berry*, March (Musée Condé, Chantilly; Melusine as a winged dragon above a tower of the Château de Lusignan)
  - Moritz von Schwind, *Die schöne Melusine* (cycle of watercolours, 1869; Belvedere, Vienna)

  *From:* folklore · French and Luxembourgish
