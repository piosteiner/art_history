public_id: 113270
name: Wideok of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 위덕왕
  - lang: ko-Hani
    role: alternative
    text: 威德王
category: calendar
definition: "The reign years of King Wideok of Baekje (威德王, 위덕왕), by which Korean histories date 554–598: 554 is Wideok 1, 598 Wideok 45."
description_md: |-
  **Wideok** (威德王, 위덕왕): the years of the reign of King Wideok of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 563 is Wideok 10 (위덕왕 10년). The year of the accession, 554, counts as the first year.

  Before: [[seong-baekje-reign-years|Seong]]. After: [[hye-baekje-reign-years|Hye]].
sources:
  definition:
    - source: dila-time-authority
