name: Māui
names: [Maui]
category: mythology and legend
definition: The great culture hero and trickster of Polynesia, who fished up the North Island of New Zealand with a magic jawbone hook, snared the sun to lengthen the days and stole fire for humankind.
description_md: |-
  Māui is the great culture hero and trickster of Polynesia, more a folk hero than a god. He was born too early and cast into the sea by his mother, where sea spirits wrapped him in seaweed and jellyfish until his grandfather found him. He grew up clever and full of tricks, could shapeshift into birds and worms, and had superhuman strength. With a magic jawbone hook he fished up the North Island of New Zealand from the sea, snared the sun to make the days longer, and stole fire for humankind. He finally died trying to win immortality for people from the goddess of death.

  *From:* Polynesian tradition · Polynesian / Māori
