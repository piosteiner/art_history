name: Polyphemus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the one-eyed Cyclops, son of Poseidon, who trapped Odysseus and his men and was blinded by them; also the jealous lover of Galatea.
description_md: |-
  The one-eyed [[cyclopes|Cyclops]], son of [[poseidon]], who trapped [[odysseus]] and his men in his cave and ate several of them. Odysseus got him drunk, told him his name was "Nobody", and blinded him with a burning stake. When the Cyclops shouted "Nobody is hurting me!", no one came to help. The men escaped clinging to the bellies of his sheep.

  **In art:** A giant one-eyed figure being blinded with a stake, or men hiding under sheep. Also the jealous lover of [[galatea]].

  **Famous works**

  - *Sperlonga sculptures* (Museo Archeologico Nazionale, Sperlonga)
  - [[artist/annibale-carracci]], *Polyphemus* frescoes (Palazzo Farnese)
  - Turner, *Ulysses Deriding Polyphemus*

  *From:* Homer, Odyssey · Ancient Greek
