definition: "In Greek myth the three sisters who control every life: Clotho spins the thread, Lachesis measures it and Atropos cuts it; the Romans called them the Parcae."
description_md: |-
  Three sisters who control every life: Clotho spins the thread, Lachesis measures it, and Atropos cuts it.

  **In art:** Three women, often old, with spindle, measuring rod and shears.

  **Famous works**

  - Goya, *Atropos* (The Fates), one of the Black Paintings (Prado)

  *From:* Greek mythology · Ancient Greek
