name: Four Latin Doctors of the Church
names: [Doctors of the Church, Latin Church Fathers]
category: mythology and legend
also_in: [iconography]
definition: Jerome, Augustine, Ambrose and Gregory the Great, the great teachers of the early Western Church.
description_md: |-
  The great teachers of the early Western Church: [[person/jerome]] (see above), Augustine (see above), [[person/ambrose]] and [[person/gregory-i|Gregory the Great]].

  **In art:** Ambrose as a bishop with a beehive or a whip. Gregory as a pope with a triple crown and a dove at his ear.

  **Famous works**

  - [[artist/michael-pacher]], *Altarpiece of the Church Fathers* (Alte Pinakothek, Munich)
  - [[artist/raphael]], *Disputation of the Holy Sacrament* (Stanza della Segnatura, Vatican)

  *From:* Christian tradition · Christian
