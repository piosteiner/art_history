    text: 哲宗
category: calendar
definition: "The reign years of Cheoljong of Joseon (哲宗, 철종), by which Korean sources date 1850–1863: 1850 is Cheoljong 1, 1863 Cheoljong 14."
description_md: |-
  **Cheoljong** (哲宗, 철종): the years of the reign of [[person/cheoljong-of-joseon|Cheoljong of Joseon]], who came to the throne on 9 June 1849. Korean sources count years by the reigning king ([[korean-reign-years]]): 1859 is Cheoljong 10 (철종 10년). His first year is 1850, the year after his accession; the rest of 1849 still counts for his predecessor.

  Before: [[heonjong-reign-years|Heonjong]]. After: [[gojong-reign-years|Gojong]].
