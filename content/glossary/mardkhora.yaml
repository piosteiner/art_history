name: Mardkhora
names: [Manticore]
category: mythology and legend
definition: The man-eating beast with a human face, a lion's body and a tail of poisonous spines; from the Persian "mardkhora" (man-eater) comes the word manticore.
description_md: |-
  The manticore comes from the Persian word *mardkhora*, meaning "man-eater". It was described as a creature with a human face, a lion's body and a tail full of poisonous spines it could shoot. The Greeks heard about it through Ctesias, a Greek physician at the Persian court, who placed it in India; through [[person/aristotle]] and Pliny it entered European bestiaries.

  *From:* Persian legend; Greek and European bestiaries · Persian
