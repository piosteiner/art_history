name: Meleager
category: mythology and legend
definition: The Greek hero whose life was bound to a log in the fire; he led the Calydonian boar hunt and gave the hide to Atalanta, and when he killed his uncles in the quarrel, his mother burned the log and he died.
description_md: |-
  When Meleager was born, the Fates appeared to his mother, Althaea, and said he would live only until a log in the fire burned away. She snatched it from the flames and hid it. Meleager grew into a great hero and gathered the heroes for the hunt of the monstrous Calydonian boar. When he killed it, he gave its hide to [[atalanta]], whom he loved. His uncles were outraged that a woman should get the prize, and in the quarrel Meleager killed them. Grief-stricken at her brothers' deaths, Althaea threw the log back into the fire, and Meleager died.

  *From:* Greek mythology · Ancient Greek
