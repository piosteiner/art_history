public_id: 113275
name: Dongmyeongseong of Goguryeo (reign years)
names:
  - lang: ko
    role: original
    text: 동명성왕
  - lang: ko-Hani
    role: alternative
    text: 東明聖王
category: calendar
parent: korean-calendar
definition: "The reign years of King Dongmyeongseong of Goguryeo (東明聖王, 동명성왕), by which Korean histories date 37 BC–19 BC: 37 BC is Dongmyeongseong 1, 19 BC Dongmyeongseong 19."
description_md: |-
  **Dongmyeongseong** (東明聖王, 동명성왕): the years of the reign of King Dongmyeongseong of Goguryeo. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 28 BC is Dongmyeongseong 10 (동명성왕 10년). The year of the accession, 37 BC, counts as the first year.

  After: [[yurimyeong-goguryeo-reign-years|Yurimyeong]].
sources:
  definition:
    - source: dila-time-authority
