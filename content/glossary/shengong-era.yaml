public_id: 113076
name: Shengong
names:
  - lang: zh
    role: original
    text: 神功
category: calendar
definition: "Chinese era name (神功) of the Zhou of Empress Wu for the year 697: 697 is Shengong 1 (元年), its only year."
description_md: |-
  **Shengong** (神功) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 697 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 697 is Shengong 1 (元年), its only year.

  Before: [[wansui-tongtian-era|Wansui Tongtian]]. After: [[shengli-era|Shengli]].
sources:
  definition:
    - source: dila-time-authority
