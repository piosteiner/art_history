category: technique
definition: process by which a duplicate sculpture (often metal) is cast from an original sculpture
description_md: |-
  In lost-wax casting the object is first modelled in wax and enclosed in a mould; the wax is melted out and replaced by molten metal, so that the mould can be used only once.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 96]] The great bronze doors of Aachen (around 800), Mainz (around 1000/1009) and Hildesheim (1015) were all made this way.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]]

  The lecture traced the process on the [[artwork/bernwardstur|Bernward door]]: a wax model of the whole door was made (about 210 kg per leaf), with the relief fields modelled separately in wax and set into the overall form lying flat; details, surface textures and the inscription were worked into the bronze only after casting.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 71]] The mould of fired clay was strengthened at the back by an iron grid; several furnaces were needed at once, the molten metal ran through channels into the hollow mould, and where it did not fill the mould a second pour (Überfangguss) was necessary.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 71]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 72]] German Wikipedia adds that the Hildesheim scenes were scraped out of solid slabs of wax or tallow and assembled on an iron frame, and that the mould was filled standing on its long side.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]]

  For medieval people, Ittai Weinryb argues, a process in which a bell, a column or a door was first formed in wax, enclosed in a mould and then emerged as an image in bronze amounted to a magical, technological "enchantment" in Alfred Gell's sense.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 96]]
