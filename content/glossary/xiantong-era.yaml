name: Xiantong
names:
  - lang: zh
    role: original
    text: 咸通
category: calendar
definition: "Chinese era name (咸通) of the Tang for the years 860–874: 860 is Xiantong 1 (元年) and Xiantong 15 is 874."
description_md: |-
  **Xiantong** (咸通) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 860 under Emperor Yizong (懿宗). Its years are counted in lunar years: 860 is Xiantong 1 (元年), 874 its last year, Xiantong 15. A Chinese source dates a year within it as "Xiantong 2" (咸通二年) rather than by a continuous count.

  Before: [[dazhong-era|Dazhong]]. After: [[qianfu-era|Qianfu]].
sources:
