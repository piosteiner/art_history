public_id: 113388
name: Hyogong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 효공왕
  - lang: ko-Hani
    role: alternative
    text: 孝恭王
category: calendar
definition: "The reign years of King Hyogong of Silla (孝恭王, 효공왕), by which Korean histories date 897–912: 897 is Hyogong 1, 912 Hyogong 16."
description_md: |-
  **Hyogong** (孝恭王, 효공왕): the years of the reign of King Hyogong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 906 is Hyogong 10 (효공왕 10년). The year of the accession, 897, counts as the first year.

  Before: [[jinseong-silla-reign-years|Jinseong]]. After: [[sindeok-silla-reign-years|Sindeok]].
sources:
  definition:
    - source: dila-time-authority
