definition: "The reign years of Taejong of Joseon (太宗, 태종), by which Korean sources date 1401–1418: 1401 is Taejong 1, 1418 Taejong 18."
description_md: |-
  **Taejong** (太宗, 태종): the years of the reign of [[person/taejong-of-joseon|Taejong of Joseon]], who came to the throne on 22 November 1400. Korean sources count years by the reigning king ([[korean-reign-years]]): 1410 is Taejong 10 (태종 10년). His first year is 1401, the year after his accession; the rest of 1400 still counts for his predecessor.

  Before: [[jeongjong-reign-years|Jeongjong]]. After: [[sejong-reign-years|Sejong]].
