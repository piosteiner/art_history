category: calendar
definition: "Japanese era name (元応) for the years 1319–1321: 1319 is Gen'ō 1 (元年) and Gen'ō 3 is 1321."
description_md: |-
  **Gen'ō** (元応) is a Japanese era name ([[nengo]]), proclaimed in 1319. Its years are counted in lunar years from the new year before the proclamation: 1319 is Gen'ō 1 (元年), 1321 its last year, Gen'ō 3. A Japanese source dates a year within it as "Gen'ō 2" (元応2年) rather than by a continuous count.

  Before: [[bunpo-era|Bunpō]]. After: [[genko-era|Genkō]].
