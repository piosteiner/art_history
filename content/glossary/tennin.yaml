name: tennin
names:
  - lang: ja
    role: original
    text: "{天人|てんにん}"
category: iconography
definition: Apsaras, celestial beings who fly on clouds playing music and dancing, in the host of Amida’s paradise.
description_md: |-
  Celestial nymphs of Hindu and Buddhist mythology, dancers and musicians who fly in the heavens, scattering flowers and playing music.

  **In art:** Floating women with long, fluttering scarves and ribbons that suggest flight, playing instruments.

  **Famous works**

  - *Feitian murals* (Mogao Caves, Dunhuang, China)
  - *Angkor Wat apsara reliefs* (Cambodia, 12th century; a Hindu temple)
  - *Flying celestials on the halo panels of the Phoenix Hall* (Byōdo-in, Uji)

  *From:* Buddhist
