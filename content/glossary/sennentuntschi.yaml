name: Sennentuntschi
category: mythology and legend
definition: In Alpine legend, a female doll of straw, rags and wood made by lonely herders on the summer pasture, who came to life and took terrible revenge on them when the cattle were driven down to the valley.
description_md: |-
  Lonely alpine herders (*Sennen*), spending the long summer high on the alp, made themselves a female doll out of straw, rags and wood. They talked to her, treated her as a companion and mistreated her. One day the doll came alive. At first she seemed to put up with her lot, but when the time came to drive the cows back down to the valley, she took a terrible revenge on the herders. Swiss television's late-night broadcast in 1981 of Hansjörg Schneider's play Sennentuntschi (written 1972) caused a scandal in Switzerland and even led to a criminal complaint for blasphemy.

  *From:* Alpine legend · Swiss (Alpine)
