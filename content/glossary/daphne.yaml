name: Daphne
names: [Apollo and Daphne]
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the nymph who fled from Apollo and was turned into a laurel tree, which became his sacred plant.
description_md: |-
  [[eros|Cupid]] struck [[apollo]] with a golden arrow of love and the nymph Daphne with a lead arrow of rejection. As Apollo chased her, she prayed to her father, a river god, and was turned into a laurel tree. Apollo made the laurel his sacred plant.

  **In art:** A running nymph whose fingers are turning into branches and feet into roots, with Apollo just reaching her.

  **Famous works**

  - Bernini, *Apollo and Daphne* (Galleria Borghese) — [[artwork/apollo-and-daphne]]
  - Piero or Antonio del Pollaiuolo (attributed), *Apollo and Daphne* (National Gallery, London)

  *From:* Ovid, Metamorphoses · Ancient Greek
