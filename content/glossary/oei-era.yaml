definition: "Japanese era name (応永) for the years 1394–1428: 1394 is Ōei 1 (元年) and Ōei 35 is 1428."
description_md: |-
  **Ōei** (応永) is a Japanese era name ([[nengo]]), proclaimed in 1394. Its years are counted in lunar years from the new year before the proclamation: 1394 is Ōei 1 (元年), 1428 its last year, Ōei 35. A Japanese source dates a year within it as "Ōei 2" (応永2年) rather than by a continuous count.

  Before: [[meitoku-era|Meitoku]]. After: [[shocho-era|Shōchō]].
