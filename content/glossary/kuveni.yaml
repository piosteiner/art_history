name: Kuveni
category: mythology and legend
definition: The yakkhini (demon princess) of Sri Lankan legend who helped Prince Vijaya conquer her own people, was cast aside and, in a later folk version, cursed him.
description_md: |-
  According to the chronicle *Mahavamsa*, [[vijaya|Prince Vijaya]] was banished from India and landed in Sri Lanka, where the yakkhini (demon princess) Kuveni was spinning under a tree. She fell in love with him and helped him defeat her own people. Once he became king, he sent her away to marry an Indian princess. In the Mahavamsa she was killed by her own people; in a later folk version she cursed him.

  *From:* Mahavamsa · Sinhalese
