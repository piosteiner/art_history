definition: The Chinese moon goddess, wife of the archer Hou Yi, who drank the elixir of immortality and floated up to the Moon, where she lives with the Jade Rabbit.
description_md: |-
  The wife of the archer [[hou-yi]], who drank the elixir of immortality (in most versions given to Hou Yi by the [[xiwangmu|Queen Mother of the West]]; why she drank it differs by version) and floated up to the Moon. She lives there with the Jade Rabbit, who pounds the elixir in a mortar. She is celebrated at the Mid-Autumn Festival with mooncakes.

  **In art:** A beautiful woman floating up to the Moon in flowing robes, often with a white rabbit, or in a palace on the Moon.

  **Famous works**

  - Tang Yin, *Chang'e Holding a Cassia Branch* (Ming dynasty; Metropolitan Museum of Art)
  - [[artist/tsukioka-yoshitoshi|Tsukioka Yoshitoshi]], *One Hundred Aspects of the Moon* (Japanese prints)

  *From:* Chinese
