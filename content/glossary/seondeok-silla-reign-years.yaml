public_id: 113363
name: Seondeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 선덕왕
  - lang: ko-Hani
    role: alternative
    text: 善德王
category: calendar
parent: korean-calendar
definition: "The reign years of Queen Seondeok of Silla (善德王, 선덕왕), by which Korean histories date 632–647: 632 is Seondeok 1, 647 Seondeok 16."
description_md: |-
  **Seondeok** (善德王, 선덕왕): the years of the reign of [[person/queen-seondeok-of-silla|Queen Seondeok]] of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 641 is Seondeok 10 (선덕왕 10년). The year of the accession, 632, counts as the first year.

  Before: [[jinpyeong-silla-reign-years|Jinpyeong]]. After: [[jindeok-silla-reign-years|Jindeok]].
sources:
  definition:
    - source: dila-time-authority
