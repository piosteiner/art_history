name: Hippolytus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth the son of Theseus, falsely accused by his stepmother Phaedra, cursed by his father and dragged to death by his horses.
description_md: |-
  [[phaedra]], [[theseus]]'s wife and [[ariadne]]'s sister, fell in love with her stepson Hippolytus, who rejected her. In Euripides' version she falsely accused him of attacking her and hanged herself (in [[person/seneca]] she kills herself after his death). Theseus cursed his son, and a bull from the sea frightened his horses, dragging him to his death.

  **In art:** A young man thrown from his chariot by a bull rising from the waves.

  **Famous works**

  - Pierre-Narcisse Guérin, *Phaedra and Hippolytus* (Louvre)
  - Lawrence Alma-Tadema, *The Death of Hippolytus*

  *From:* Greek mythology · Ancient Greek
