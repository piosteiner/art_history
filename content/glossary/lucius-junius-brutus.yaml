definition: The founder of the Roman Republic after Lucretia's death, who sentenced his own sons to death for plotting to bring back the kings.
description_md: |-
  Two famous men named Brutus. Lucius Junius Brutus founded the Roman Republic after [[lucretia]]'s death, and later sentenced his own sons to death for plotting to bring back the kings.

  **In art:** A stern father seated while his sons' bodies are carried in.

  **Famous works**

  - [[artist/jacques-louis-david]], *The Lictors Bring to Brutus the Bodies of His Sons* (Louvre)

  *From:* Livy, History of Rome · Ancient Roman
