definition: The god of examinations, a demon-like figure standing on one foot on a sea turtle's head and holding a brush.
description_md: |-
  Kuixing is the god of examinations, a demon-like figure standing on one foot on the head of a sea turtle and holding a brush.

  **In art:** A leaping demon with a writing brush.

  **Famous works**

  - *Ming and Qing porcelain, woodblock prints and New Year pictures*

  **Held sacred today:** Some of these figures are still honoured in Daoist and folk religion.

  *From:* Chinese (folk religion)
