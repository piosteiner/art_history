name: Nezha
category: religion
definition: The fierce child-god of Chinese tradition, reborn from lotus roots after giving his life to save his parents, who rides wheels of fire.
description_md: |-
  Nezha was born as a ball of flesh that split open to reveal a young boy. As a child, he fought and killed the son of the Dragon King. To save his parents from the dragons' revenge, he gave up his own life. A Daoist immortal then rebuilt his body from lotus roots and leaves, and he returned as a powerful protector, riding wheels of fire and wielding a spear.

  **Held sacred today:** Nezha is a Daoist deity, still worshipped in temples today.

  *From:* Investiture of the Gods · Chinese (Daoist)
