name: Sisheng
names:
  - lang: zh
    role: original
    text: 嗣聖
category: calendar
parent: chinese-calendar
definition: "Chinese era name (嗣聖) of the Tang for the year 684: 684 is Sisheng 1 (元年), its only year."
description_md: |-
  **Sisheng** (嗣聖) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 684 under Emperor Zhongzong (中宗). Its years are counted in lunar years: 684 is Sisheng 1 (元年), its only year.

  Before: [[hongdao-era|Hongdao]]. After: [[wenming-era|Wenming]].
sources:
