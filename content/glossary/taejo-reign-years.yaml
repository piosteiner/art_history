definition: "The reign years of King Taejo of Joseon (太祖, 태조), by which Korean sources date 1392–1398: 1392 is Taejo 1, 1398 Taejo 7."
description_md: |-
  **Taejo** (太祖, 태조): the years of the reign of [[person/taejo-of-joseon|King Taejo]] of Joseon. Korean sources of the Joseon period count years by the reigning king ([[korean-reign-years]]): 1398 is Taejo 7 (태조 7년). The year of the accession, 1392, counts as the first year.

  After: [[jeongjong-reign-years|Jeongjong]].
