category: calendar
definition: "Japanese era name (元弘) for the years 1331–1332: 1331 is Genkō 1 (元年) and Genkō 2 is 1332."
description_md: |-
  **Genkō** (元弘) is a Japanese era name ([[nengo]]), proclaimed in 1331. Its years are counted in lunar years from the new year before the proclamation: 1331 is Genkō 1 (元年), 1332 its last year, Genkō 2. A Japanese source dates a year within it as "Genkō 2" (元弘2年) rather than by a continuous count.

  Before: [[gentoku-era|Gentoku]]. After: [[shokyo-era|Shōkyō]].
