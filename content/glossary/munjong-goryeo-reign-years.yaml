public_id: 113313
name: Munjong of Goryeo (reign years)
names:
  - lang: ko
    role: original
    text: 문종
  - lang: ko-Hani
    role: alternative
    text: 文宗
category: calendar
definition: "The reign years of King Munjong of Goryeo (文宗, 문종), by which Korean histories date 1047–1083: 1047 is Munjong 1, 1083 Munjong 37."
description_md: |-
  **Munjong** (文宗, 문종): the years of the reign of King Munjong of Goryeo. The Goryeosa, the history of Goryeo, dates events by the reigning king's year ([[korean-reign-years]]): 1056 is Munjong 10 (문종 10년). The year of the accession, 1047, counts as the first year.

  Before: [[jeongjong-goryeo-reign-years-1035|Jeongjong]]. After: [[sunjong-goryeo-reign-years|Sunjong]].
sources:
  definition:
    - source: dila-time-authority
