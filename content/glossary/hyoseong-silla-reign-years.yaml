public_id: 113370
name: Hyoseong of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 효성왕
  - lang: ko-Hani
    role: alternative
    text: 孝成王
category: calendar
parent: korean-calendar
definition: "The reign years of King Hyoseong of Silla (孝成王, 효성왕), by which Korean histories date 737–742: 737 is Hyoseong 1, 742 Hyoseong 6."
description_md: |-
  **Hyoseong** (孝成王, 효성왕): the years of the reign of King Hyoseong of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 742 is Hyoseong 6 (효성왕 6년). The year of the accession, 737, counts as the first year.

  Before: [[seongdeok-silla-reign-years|Seongdeok]]. After: [[gyeongdeok-silla-reign-years|Gyeongdeok]].
sources:
  definition:
    - source: dila-time-authority
