definition: 'Comic, unorthodox linked verse (俳諧, haikai: "vulgar", "earthy"), which developed in the sixteenth century out of the aristocratic renga and drew its effect from satire and puns; under Matsuo Bashō (1644–1694) its tone became more serious.'
