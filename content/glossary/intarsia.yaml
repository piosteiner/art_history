definition: decorative inlay technique using precisely fit pieces of material, most often veneer, to produce a design
description_md: |-
  Intarsia is the technique of inlaying pieces of wood of different colour and grain into a surface to form images or patterns. The word comes from Italian "tarsia", inlay, and the derived "intarsiare" and "intarsio"; it goes back to the Arabic tarṣīʿ, incrustation [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]]. Following Thomas Rohark, the lecture defines it as laying different woods into or against each other on a flat surface so that a level surface with inclusions of different colour and structure results; the inserted pieces end flush with the surface, and the visibility of the wood is decisive [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]].

  ## History

  Wood inlay is documented in ancient Egypt and Rome, where Pliny the Elder described veneers of precious woods applied to cheaper timber "in order to make a single tree sell many times over" [[source/ajmar-2024-reciprocal-design|p. 28]]. The immediate antecedents of Italian intarsia are usually sought in Islamic Spain, where wood inlay was used for minbars and many smaller objects [[source/ajmar-2024-reciprocal-design|p. 28]] — the lecture showed the [[artwork/minbar-kutubiyya|minbar of the Kutubiyya Mosque]], made in Córdoba in 1137–1144 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 36]]. In Italy the technique developed from the fourteenth century, applying a thin veneer of wooden tesserae to a flat matrix or into a hollow carved to receive them [[source/ajmar-2024-reciprocal-design|p. 28]]; early examples are Sienese works in Orvieto [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 42–44]]. In fifteenth-century Florence, Vasari reports, Filippo Brunelleschi taught perspective to intarsia makers [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 20]], and perspectival views, feigned cupboards and still lifes became its characteristic subjects, as in the [[artwork/sagrestia-delle-messe-intarsie|Sagrestia delle Messe]] of Florence Cathedral and the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo]] of Urbino [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 21–33, 58–66]].

  ## Materials and making

  The palette of Italian Renaissance intarsia included walnut (mid to dark brown, used for the ground and for inlays), spindle wood (white to beige), bog oak (dark brown to black: oak darkened by long storage in peat bogs), pear (red-brown), mulberry (golden brown), and further cherry, box, maple, smoke tree, cypress, willow and lime; walnut, poplar, elm, chestnut, larch and fir served for the supporting structure [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]]. The pieces were cut after a design drawing, which was used up as a cutting template, fitted together and trimmed on the panel with a shoulder knife, glued with bone or fish glue, the joints filled, the surface smoothed with planes and sand and finished with an oily varnish [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 53]]. Makers also used wood that would otherwise have been discarded: "green wood" stained by the fungus Chlorociboria, oak attacked by woodworm, bog oak, wood shaped by heat, dyed wood, and chipboard made from shavings — practices Marta Ajmar calls "reciprocal design" [[source/ajmar-2024-reciprocal-design|pp. 30–31, 39–44]].

  ## Reception

  Vasari thought intarsia suited only to designs with buildings and rectangular objects, practised by people "possessing more patience than disegno", and short-lived because of worms and fire; Galileo used "intarsiare" derogatorily for disjointed poetry [[source/ajmar-2024-reciprocal-design|p. 29]].
