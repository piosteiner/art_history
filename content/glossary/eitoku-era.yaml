definition: "Japanese era name (永徳) for the years 1381–1384: 1381 is Eitoku 1 (元年) and Eitoku 4 is 1384."
description_md: |-
  **Eitoku** (永徳) is a Japanese era name ([[nengo]]), proclaimed in 1381. Its years are counted in lunar years from the new year before the proclamation: 1381 is Eitoku 1 (元年), 1384 its last year, Eitoku 4. A Japanese source dates a year within it as "Eitoku 2" (永徳2年) rather than by a continuous count.

  Before: [[koryaku-era|Kōryaku]]. After: [[shitoku-era|Shitoku]].
