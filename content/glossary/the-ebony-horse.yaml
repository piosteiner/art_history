name: The Ebony Horse
category: mythology and legend
definition: In the Nights, a mechanical horse of ebony and ivory made by a Persian sage (an Indian in Galland's version), which flies when a pin on its side is turned.
description_md: |-
  A Persian sage gave a king a horse of ebony and ivory that could fly when you turned a pin on its right side. The prince flew away on it and fell in love with a princess, and the sage, seeking revenge for the king's treatment of him, kidnapped her on the horse.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
