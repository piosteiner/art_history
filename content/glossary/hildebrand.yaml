name: Hildebrand
category: mythology and legend
definition: Dietrich von Bern's old weapons master who, in the Hildebrandslied, the oldest surviving heroic poem in German, meets his own son Hadubrand at the border and is forced by honour to fight him.
description_md: |-
  Hildebrand was [[dietrich-von-bern]]'s loyal old weapons master, who followed him into exile for thirty years. In the *Hildebrandslied*, the oldest surviving heroic poem in German, he returns home and meets a young warrior at the border, his son Hadubrand, who doesn't recognise him. Hildebrand reveals who he is and offers him gifts, but Hadubrand thinks it's a trick and insults him. Honour forces the two to fight. The poem breaks off before the end; the related versions suggest that the father killed his son, though some later medieval versions (such as the Jüngeres Hildebrandslied) end in reconciliation.

  *From:* Hildebrandslied · German / Germanic
