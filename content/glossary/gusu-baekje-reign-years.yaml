public_id: 113250
name: Gusu of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 구수왕
  - lang: ko-Hani
    role: alternative
    text: 仇首王
category: calendar
parent: korean-calendar
definition: "The reign years of King Gusu of Baekje (仇首王, 구수왕), by which Korean histories date 214–234: 214 is Gusu 1, 234 Gusu 21."
description_md: |-
  **Gusu** (仇首王, 구수왕): the years of the reign of King Gusu of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 223 is Gusu 10 (구수왕 10년). The year of the accession, 214, counts as the first year.

  Before: [[chogo-baekje-reign-years|Chogo]]. After: [[goi-baekje-reign-years|Goi]].
sources:
  definition:
    - source: dila-time-authority
