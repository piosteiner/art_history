name: Rumpelstilzchen
names: [Rumpelstiltskin]
category: mythology and legend
definition: In the Grimms' fairy tale, a little man who spins straw into gold for a miller's daughter in exchange for her firstborn child, unless she can guess his name.
description_md: |-
  He spun gold for a miller's daughter in exchange for her firstborn child. He'd only let her off if she could guess his name. A messenger overheard him dancing around a fire singing it. When she named him, he stamped so hard in rage that he tore himself in two (in the first edition of 1812 he simply ran away angrily and never came back).

  *From:* Grimms' Fairy Tales (Kinder- und Hausmärchen) · German
