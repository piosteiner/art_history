name: Apocalypse
names: [The Apocalypse, Four Horsemen of the Apocalypse, Book of Revelation]
category: iconography
definition: "The visions of the Book of Revelation: the Four Horsemen, the Woman Clothed with the Sun, the seven-headed beast and Michael fighting the dragon."
description_md: |-
  The visions of the *Book of Revelation*: the Four Horsemen (often read as Conquest, War, Famine and Death; only Death is named in the text), the Woman Clothed with the Sun, the seven-headed beast, and the archangel [[person/michael]] fighting the dragon.

  **In art:** Four horsemen trampling people, a woman with the moon under her feet facing a dragon, or the Lamb of God on an altar.

  **Famous works**

  - [[artist/albrecht-durer]], *Apocalypse* woodcuts, including *The Four Horsemen*
  - Hubert and [[artist/jan-van-eyck]], *Ghent Altarpiece* (*Adoration of the Mystic Lamb*, Ghent)
  - *Apocalypse Tapestry* (Angers)

  *From:* New Testament, Book of Revelation · Christian
