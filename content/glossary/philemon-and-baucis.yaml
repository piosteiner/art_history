name: Philemon and Baucis
names: [Baucis and Philemon]
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the poor old couple who alone welcomed Jupiter and Mercury in disguise and were turned into an oak and a linden growing side by side.
description_md: |-
  A poor old couple who were the only people in their village to welcome [[zeus|Jupiter]] and [[hermes|Mercury]] when they came disguised as travellers. The gods flooded the village, turned the couple's hut into a temple, and granted their wish to die at the same moment. They were turned into an oak and a linden tree, growing side by side.

  **In art:** Two old people serving two strangers at a humble table, often trying to catch their only goose to cook it.

  **Famous works**

  - [[artist/rembrandt]], *Philemon and Baucis* (National Gallery of Art, Washington)
  - Rubens, *Landscape with Philemon and Baucis* (Kunsthistorisches Museum, Vienna)
  - Adam Elsheimer, *Jupiter and Mercury in the House of Philemon and Baucis* (Gemäldegalerie Alte Meister, Dresden)

  *From:* Ovid, Metamorphoses · Ancient Greek
