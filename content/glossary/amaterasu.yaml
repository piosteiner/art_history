name: Amaterasu
category: religion
definition: The Japanese goddess of the sun, central kami of Shinto, who hid in a cave and plunged the world into darkness; legendary ancestress of the imperial family.
description_md: |-
  Amaterasu is the Japanese goddess of the sun. When her wild brother [[susanoo]], god of storms, rampaged through her realm, she hid in a cave and the world fell into darkness. The other gods lured her out by holding a riotous party outside, with a dance that made them roar with laughter, and a mirror hung in a tree. Susanoo was banished, and on earth he slew Yamata no Orochi, an eight-headed serpent, finding the sword Kusanagi in its tail. Amaterasu is the legendary ancestress of Japan's imperial family.

  **Held sacred today:** Both are central *kami* of [[shinto]], Japan's living religion, and Amaterasu is enshrined at Ise, its holiest shrine.

  *From:* Kojiki, Nihon shoki · Japanese (Shinto)
