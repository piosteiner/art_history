public_id: 131033
name: Ungnyeo
category: mythology and legend
definition: The bear who became a woman in the Korean founding myth by enduring 100 days in a cave on garlic and mugwort; she married the heavenly prince Hwanung and became the mother of Dangun.
description_md: |-
  A bear and a tiger lived together in a cave and prayed to the heavenly prince Hwanung to become human. He gave them each 20 cloves of garlic and a bundle of mugwort and told them to stay out of the sunlight, eating only this, for 100 days. The tiger gave up from hunger. The bear endured, and on the 21st day she became a woman, Ungnyeo, "bear woman". She married Hwanung and became the mother of the Korean people.

  *From:* Dangun founding myth (Samguk yusa) · Korean
