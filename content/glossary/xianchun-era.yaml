public_id: 113042
name: Xianchun
names:
  - lang: zh
    role: original
    text: 咸淳
category: calendar
definition: "Chinese era name (咸淳) of the Southern Song for the years 1265–1274: 1265 is Xianchun 1 (元年) and Xianchun 10 is 1274."
description_md: |-
  **Xianchun** (咸淳) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1265 under Emperor Duzong (度宗). Its years are counted in lunar years: 1265 is Xianchun 1 (元年), 1274 its last year, Xianchun 10. A Chinese source dates a year within it as "Xianchun 2" (咸淳二年) rather than by a continuous count.

  Before: [[jingding-era|Jingding]]. After: [[deyou-era|Deyou]].
sources:
  definition:
    - source: dila-time-authority
