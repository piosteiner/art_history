category: calendar
definition: "Japanese era name (承応) for the years 1652–1655: 1652 is Jōō 1 (元年) and Jōō 4 is 1655."
description_md: |-
  **Jōō** (承応) is a Japanese era name ([[nengo]]), proclaimed in 1652. Its years are counted in lunar years from the new year before the proclamation: 1652 is Jōō 1 (元年), 1655 its last year, Jōō 4. A Japanese source dates a year within it as "Jōō 2" (承応2年) rather than by a continuous count.

  Before: [[keian-era|Keian]]. After: [[meireki-era|Meireki]].
