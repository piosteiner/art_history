name: namban
names:
  - lang: ja
    role: original
    text: "{南蛮|なんばん}"
category: iconography
definition: "“Southern barbarians”: the Portuguese and Spanish traders and missionaries in Japan from the 1540s, and the screens that show them — tall Europeans in pantaloons and capes, a galleon in port, the Jesuit church in Kyoto."
