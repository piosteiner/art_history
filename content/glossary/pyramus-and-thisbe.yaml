name: Pyramus and Thisbe
names: [Pyramus, Thisbe]
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, two young lovers of Babylon who spoke through a crack in a wall and died by each other's misunderstanding; the model for Romeo and Juliet.
description_md: |-
  Two young lovers in Babylon whose families forbade their love, so they spoke through a crack in the wall. They agreed to meet by a tomb. Thisbe arrived first, fled from a lion and dropped her veil. Pyramus found the bloody veil, thought she was dead and killed himself, and she then killed herself on his sword. This story inspired *Romeo and Juliet*.

  **In art:** A woman finding her lover dead beneath a mulberry tree, or two lovers at a wall.

  **Famous works**

  - Hans Baldung Grien, *Pyramus and Thisbe* (Gemäldegalerie, Berlin)
  - [[artist/nicolas-poussin]], *Landscape with Pyramus and Thisbe* (Städel, Frankfurt)
  - Waterhouse, *Thisbe*

  *From:* Ovid, Metamorphoses · Babylonian setting (Roman tale)
