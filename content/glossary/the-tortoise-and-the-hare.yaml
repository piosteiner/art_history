name: The Tortoise and the Hare
category: mythology and legend
definition: Aesop's fable of a race won by the slow but steady tortoise while the over-confident hare takes a nap.
description_md: |-
  The hare was so sure he'd win a race that he took a nap, and the slow but steady tortoise crossed the finish line first.

  *From:* Aesop's Fables · Ancient Greek
