definition: "Japanese era name (斉衡) for the years 854–856: 854 is Saikō 1 (元年) and Saikō 3 is 856."
description_md: |-
  **Saikō** (斉衡) is a Japanese era name ([[nengo]]), proclaimed in 854. Its years are counted in lunar years from the new year before the proclamation: 854 is Saikō 1 (元年), 856 its last year, Saikō 3. A Japanese source dates a year within it as "Saikō 2" (斉衡2年) rather than by a continuous count.

  Before: [[ninju-era|Ninju]]. After: [[tenan-era|Ten'an]].
