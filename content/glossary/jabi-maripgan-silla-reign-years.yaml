public_id: 113356
name: Jabi Maripgan of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 자비마립간
  - lang: ko-Hani
    role: alternative
    text: 慈悲麻立干
category: calendar
definition: "The reign years of Jabi Maripgan of Silla (慈悲麻立干, 자비마립간), by which Korean histories date 458–479: 458 is Jabi Maripgan 1, 479 Jabi Maripgan 22."
description_md: |-
  **Jabi Maripgan** (慈悲麻立干, 자비마립간): the years of the reign of Jabi Maripgan of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 467 is Jabi Maripgan 10 (자비마립간 10년). The year of the accession, 458, counts as the first year.

  Before: [[nulji-maripgan-silla-reign-years|Nulji Maripgan]]. After: [[soji-maripgan-silla-reign-years|Soji Maripgan]].
sources:
  definition:
    - source: dila-time-authority
