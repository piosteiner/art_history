public_id: 113075
name: Wansui Tongtian
names:
  - lang: zh
    role: original
    text: 萬歲通天
category: calendar
parent: chinese-calendar
definition: "Chinese era name (萬歲通天) of the Zhou of Empress Wu for the years 696–697: 696 is Wansui Tongtian 1 (元年) and Wansui Tongtian 2 is 697."
description_md: |-
  **Wansui Tongtian** (萬歲通天) is a Chinese era name ([[nianhao]]) of the Zhou of Empress Wu, proclaimed in 696 under Empress Wu Zetian (則天皇后). Its years are counted in lunar years: 696 is Wansui Tongtian 1 (元年), 697 its last year, Wansui Tongtian 2. A Chinese source dates a year within it as "Wansui Tongtian 2" (萬歲通天二年) rather than by a continuous count.

  Before: [[wansui-dengfeng-era|Wansui Dengfeng]]. After: [[shengong-era|Shengong]].
sources:
  definition:
    - source: dila-time-authority
