name: Starkad
names: [Starkaðr, Starcatherus]
category: mythology and legend
definition: A giant warrior of Norse legend granted three lifetimes by Odin and cursed by Thor to commit a terrible deed in each, the worst the sacrifice of his own king and friend Víkar to Odin.
description_md: |-
  Starkad was a huge warrior descended from giants. Odin granted him three lifetimes, the finest weapons and great skill as a poet. But Thor, hostile to his giant ancestry, cursed every gift: in each of his lives, Starkad would commit a terrible deed. His most famous was killing his own king and friend, Vikar, as a sacrifice to Odin. He wandered for centuries, fighting in battle after battle, full of sorrow, until in old age he promised his gold to Hather if he would end his life.

  *From:* Gesta Danorum; Gautreks saga · Norse
