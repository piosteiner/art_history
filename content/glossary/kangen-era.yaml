category: calendar
definition: "Japanese era name (寛元) for the years 1243–1246: 1243 is Kangen 1 (元年) and Kangen 4 is 1246."
description_md: |-
  **Kangen** (寛元) is a Japanese era name ([[nengo]]), proclaimed in 1243. Its years are counted in lunar years from the new year before the proclamation: 1243 is Kangen 1 (元年), 1246 its last year, Kangen 4. A Japanese source dates a year within it as "Kangen 2" (寛元2年) rather than by a continuous count.

  Before: [[ninji-era|Ninji]]. After: [[hoji-era|Hōji]].
