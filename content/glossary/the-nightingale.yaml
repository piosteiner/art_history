public_id: 131368
name: The Nightingale
category: mythology and legend
definition: In Andersen's fairy tale (1843), a little grey bird whose song, for a time passed over for a jewelled mechanical bird, drives Death away from the emperor of China.
description_md: |-
  The emperor loved the nightingale's song, but replaced it with a jewelled mechanical bird. When Death came to sit on his chest, the real nightingale returned and sang so beautifully that Death left.

  *From:* Hans Christian Andersen, Fairy Tales · Danish
