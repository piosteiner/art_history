category: calendar
definition: "Japanese era name (寛弘) for the years 1004–1012: 1004 is Kankō 1 (元年) and Kankō 9 is 1012."
description_md: |-
  **Kankō** (寛弘) is a Japanese era name ([[nengo]]), proclaimed in 1004. Its years are counted in lunar years from the new year before the proclamation: 1004 is Kankō 1 (元年), 1012 its last year, Kankō 9. A Japanese source dates a year within it as "Kankō 2" (寛弘2年) rather than by a continuous count.

  Before: [[choho-era|Chōhō]]. After: [[chowa-era|Chōwa]].
