definition: "Japanese era name (文化) for the years 1804–1818: 1804 is Bunka 1 (元年) and Bunka 15 is 1818."
description_md: |-
  **Bunka** (文化) is a Japanese era name ([[nengo]]), proclaimed in 1804. Its years are counted in lunar years from the new year before the proclamation: 1804 is Bunka 1 (元年), 1818 its last year, Bunka 15. A Japanese source dates a year within it as "Bunka 2" (文化2年) rather than by a continuous count.

  Before: [[kyowa-era|Kyōwa]]. After: [[bunsei-era|Bunsei]].
