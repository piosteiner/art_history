public_id: 113274
name: Uija of Baekje (reign years)
names:
  - lang: ko
    role: original
    text: 의자왕
  - lang: ko-Hani
    role: alternative
    text: 義慈王
category: calendar
definition: "The reign years of King Uija of Baekje (義慈王, 의자왕), by which Korean histories date 641–660: 641 is Uija 1, 660 Uija 20."
description_md: |-
  **Uija** (義慈王, 의자왕): the years of the reign of King Uija of Baekje. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 650 is Uija 10 (의자왕 10년). The year of the accession, 641, counts as the first year.

  Before: [[mu-baekje-reign-years|Mu]].
sources:
  definition:
    - source: dila-time-authority
