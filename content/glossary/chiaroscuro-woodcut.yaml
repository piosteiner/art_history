definition: The European colour woodcut of the 16th century, printed from a key block for the lines and one or more tone blocks.
description_md: "European woodcuts with coloured blocks were invented in Germany in 1508: the chiaroscuro woodcut conceived for two blocks was probably first made by Lucas Cranach the Elder in 1508 or 1509, swiftly followed by Hans Burgkmair[[source/wikipedia-en-woodcut|“the true chiaroscuro woodcut conceived for two blocks was probably first invented by Lucas Cranach the Elder in Germany in 1508 or 1509 … swiftly followed by Hans Burgkmair”]]."
