definition: "Japanese era name (享保) for the years 1716–1736: 1716 is Kyōhō 1 (元年) and Kyōhō 21 is 1736."
description_md: |-
  **Kyōhō** (享保) is a Japanese era name ([[nengo]]), proclaimed in 1716. Its years are counted in lunar years from the new year before the proclamation: 1716 is Kyōhō 1 (元年), 1736 its last year, Kyōhō 21. A Japanese source dates a year within it as "Kyōhō 2" (享保2年) rather than by a continuous count.

  Before: [[shotoku-era|Shōtoku]]. After: [[genbun-era|Genbun]].
