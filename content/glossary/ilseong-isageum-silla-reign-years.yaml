public_id: 113343
name: Ilseong Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 일성이사금
  - lang: ko-Hani
    role: alternative
    text: 逸聖尼師今
category: calendar
definition: "The reign years of Ilseong Isageum of Silla (逸聖尼師今, 일성이사금), by which Korean histories date 134–154: 134 is Ilseong Isageum 1, 154 Ilseong Isageum 21."
description_md: |-
  **Ilseong Isageum** (逸聖尼師今, 일성이사금): the years of the reign of Ilseong Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 143 is Ilseong Isageum 10 (일성이사금 10년). The year of the accession, 134, counts as the first year.

  Before: [[jima-isageum-silla-reign-years|Jima Isageum]]. After: [[adalla-isageum-silla-reign-years|Adalla Isageum]].
sources:
  definition:
    - source: dila-time-authority
