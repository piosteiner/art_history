definition: Warlike demigods converted by the Buddha to protect Buddhism, one of the Eight Legions of guardians; in Japan shown with three faces and six arms.
description_md: |-
  The Asuras were warlike demigods converted by the Buddha to become protectors of Buddhism. They belong to the Eight Legions (*Hachibushū*) of guardians, along with dragons and celestial musicians.

  **In art:** A slender figure with three faces and six thin arms, with a gentle, sorrowful expression.

  **Famous works**

  - *Ashura* (hollow dry-lacquer statue, 734, Kōfuku-ji, Nara; National Treasure)

  **Held sacred today:** Buddhism is a living religion, and many of these images are objects of worship as well as artworks.

  *From:* Buddhist
