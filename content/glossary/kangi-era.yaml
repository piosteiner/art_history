category: calendar
definition: "Japanese era name (寛喜) for the years 1229–1232: 1229 is Kangi 1 (元年) and Kangi 4 is 1232."
description_md: |-
  **Kangi** (寛喜) is a Japanese era name ([[nengo]]), proclaimed in 1229. Its years are counted in lunar years from the new year before the proclamation: 1229 is Kangi 1 (元年), 1232 its last year, Kangi 4. A Japanese source dates a year within it as "Kangi 2" (寛喜2年) rather than by a continuous count.

  Before: [[antei-era|Antei]]. After: [[joei-era|Jōei]].
