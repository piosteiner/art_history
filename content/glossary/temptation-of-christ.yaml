name: Temptation of Christ
names: [The Temptation of Christ]
category: iconography
definition: Jesus's forty days of fasting in the desert after his baptism, when the Devil tempted him three times.
description_md: |-
  After his baptism, Jesus fasted forty days in the desert and was tempted three times by the Devil.

  **In art:** Christ in the wilderness with a devil, sometimes on a mountain top or temple roof.

  **Famous works**

  - Duccio, *The Temptation of Christ on the Mountain* (Frick Collection)

  *From:* New Testament, Gospels · Christian
