name: Guinevere
category: mythology and legend
also_in: [iconography]
definition: King Arthur's queen in Arthurian legend, whose love affair with Sir Lancelot split the Round Table and led to the fall of Camelot.
description_md: |-
  Guinevere was [[king-arthur|Arthur]]'s queen. Her love affair with [[lancelot|Sir Lancelot]], the greatest of the knights and one of Arthur's closest friends, split the Round Table apart and led to the fall of Camelot.

  **In art:** A queen and a knight in a secret embrace, or a repentant queen in a convent.

  **Famous works**

  - [[artist/william-morris]], *La Belle Iseult* (1858, Tate; long mistaken for Guinevere)
  - [[artist/dante-gabriel-rossetti]], *Arthur's Tomb* (Tate)
  - Herbert James Draper, *Lancelot and Guinevere*

  *From:* Arthurian legend · British (Arthurian legend)
