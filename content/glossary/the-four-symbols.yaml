name: The Four Symbols
names: [Azure Dragon, Vermilion Bird, White Tiger, Black Tortoise]
category: mythology and legend
also_in: [iconography]
definition: "The guardians of the four directions: the Azure Dragon (east), the Vermilion Bird (south), the White Tiger (west) and the Black Tortoise (north)."
description_md: |-
  The Azure Dragon of the East, the Vermilion Bird of the South, the White Tiger of the West, and the Black Tortoise of the North (a tortoise entwined with a snake). They also appear in Korean and Japanese tombs.

  **Famous works**

  - *Gangseo Great Tomb murals* (Goguryeo, North Korea)
  - *Kitora and Takamatsuzuka Tomb murals* (Asuka, Nara, c. 700; Takamatsuzuka's Vermilion Bird is lost)

  *From:* Chinese
