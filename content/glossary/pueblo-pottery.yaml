name: Pueblo pottery
names: [black-on-black pottery, Maria Martinez, Julian Martinez]
category: art style
definition: The pottery tradition of the Pueblo peoples of the Southwest, including the black-on-black ware developed by Maria and Julian Martinez of San Ildefonso Pueblo.
description_md: |-
  The pottery tradition of the Pueblo peoples of the Southwest. Maria Martinez (1887–1980) and her husband Julian of San Ildefonso Pueblo developed the famous black-on-black pottery in the early 20th century, with shiny and matte black designs.

  **In art:** Hand-coiled vessels with polished and painted surfaces.

  **Famous works**

  - Maria and Julian Martinez, *black-on-black jars* (Smithsonian American Art Museum and many others)

  *From:* Pueblo peoples (Tewa, San Ildefonso Pueblo)
