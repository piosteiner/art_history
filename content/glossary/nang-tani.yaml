public_id: 131560
name: Nang Tani
category: mythology and legend
definition: A ghost woman in green of Thai folklore who lives in wild banana trees and appears on full-moon nights.
description_md: |-
  A beautiful woman in green who lives in wild banana trees and appears on full-moon nights. She can be kind and give food to monks, but she takes revenge on men who mistreat women.

  *From:* Thai folklore · Thai
