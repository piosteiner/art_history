description_md: |-
  The god of weddings.

  **In art:** A youth with a wedding torch and a garland of flowers, often in wedding scenes.

  **Famous works**

  - Common in Baroque marriage allegories, for example Rubens's *Marie de' Medici Cycle* (Louvre)

  *From:* Greek mythology · Ancient Greek
