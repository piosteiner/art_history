name: Jingyou
names:
  - lang: zh
    role: original
    text: 景祐
category: calendar
parent: chinese-calendar
definition: "Chinese era name (景祐) of the Northern Song for the years 1034–1038: 1034 is Jingyou 1 (元年) and Jingyou 5 is 1038."
description_md: |-
  **Jingyou** (景祐) is a Chinese era name ([[nianhao]]) of the Northern Song, proclaimed in 1034 under Emperor Renzong (仁宗). Its years are counted in lunar years: 1034 is Jingyou 1 (元年), 1038 its last year, Jingyou 5. A Chinese source dates a year within it as "Jingyou 2" (景祐二年) rather than by a continuous count.

  Before: [[mingdao-era|Mingdao]]. After: [[baoyuan-era|Baoyuan]].
sources:
