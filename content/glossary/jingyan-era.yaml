name: Jingyan
names:
  - lang: zh
    role: original
    text: 景炎
category: calendar
parent: chinese-calendar
definition: "Chinese era name (景炎) of the Southern Song for the years 1276–1278: 1276 is Jingyan 1 (元年) and Jingyan 3 is 1278."
description_md: |-
  **Jingyan** (景炎) is a Chinese era name ([[nianhao]]) of the Southern Song, proclaimed in 1276 under Emperor Duanzong (端宗). Its years are counted in lunar years: 1276 is Jingyan 1 (元年), 1278 its last year, Jingyan 3. A Chinese source dates a year within it as "Jingyan 2" (景炎二年) rather than by a continuous count.

  Before: [[deyou-era|Deyou]]. After: [[xiangxing-era|Xiangxing]].
sources:
