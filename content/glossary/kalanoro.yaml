name: Kalanoro
category: mythology and legend
definition: Small, hairy wild forest people of Malagasy folklore with backwards-pointing feet.
description_md: |-
  Hairy little forest beings with long nails and feet that point backwards, so if you follow their tracks you go the wrong way. They live in caves near water and sometimes steal food or carry off children, but some give healing powers to people they like.

  *From:* folklore · Malagasy
