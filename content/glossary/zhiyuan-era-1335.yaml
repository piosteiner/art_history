name: Zhiyuan
names:
  - lang: zh
    role: original
    text: 至元
category: calendar
parent: chinese-calendar
definition: "Chinese era name (至元) of the Yuan for the years 1335–1340: 1335 is Zhiyuan 1 (元年) and Zhiyuan 6 is 1340."
description_md: |-
  **Zhiyuan** (至元) is a Chinese era name ([[nianhao]]) of the Yuan, proclaimed in 1335 under Toghon Temür (順帝). Its years are counted in lunar years: 1335 is Zhiyuan 1 (元年), 1340 its last year, Zhiyuan 6. A Chinese source dates a year within it as "Zhiyuan 2" (至元二年) rather than by a continuous count.

  Before: [[yuantong-era|Yuantong]]. After: [[zhizheng-era|Zhizheng]].
sources:
