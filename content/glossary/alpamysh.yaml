name: Alpamysh
category: mythology and legend
definition: The hero of one of the oldest Central Asian epics, held seven years in a pit, who returns home in disguise to defeat a usurper.
description_md: |-
  Alpamysh is the hero of one of the oldest Central Asian epics, told by Uzbeks, Kazakhs, Karakalpaks and others. After winning his bride in a contest of strength, he is captured by the Kalmyk khan and held in his dungeon for seven years. When he finally escapes and returns home disguised, he finds his family oppressed and his wife about to be forced into marriage. He reveals himself, defeats the usurper, and sets things right. It's very similar to [[odysseus]]'s homecoming.

  *From:* Alpamysh (epic) · Uzbek, Kazakh, Karakalpak
