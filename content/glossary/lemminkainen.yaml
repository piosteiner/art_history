public_id: 131178
name: Lemminkäinen
category: mythology and legend
definition: The handsome, reckless adventurer of the Finnish Kalevala, killed and cut to pieces in the black river of Tuonela; his mother raked his pieces out, sewed him together and revived him with honey brought by a bee.
description_md: |-
  Trying to win the [[maiden-of-pohjola]], he was killed and cut to pieces in the black river of [[tuonela]], the land of the dead. His mother raked his pieces out of the river, sewed him back together and brought him back to life with honey brought by a bee.

  *From:* Kalevala (Elias Lönnrot, 1835) · Finnish
