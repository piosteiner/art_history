name: Visitation
names: [The Visitation]
category: iconography
definition: The pregnant Mary's visit to her cousin Elizabeth, pregnant with John the Baptist.
description_md: |-
  The pregnant [[person/mary]] visits her cousin Elizabeth, pregnant with [[person/john-the-baptist]], who leaps in her womb.

  **In art:** Two women embracing, one young and one older.

  **Famous works**

  - Pontormo, *The Visitation* (Carmignano)
  - [[artist/domenico-ghirlandaio]], *The Visitation* (Louvre)

  *From:* New Testament, Gospels · Christian
