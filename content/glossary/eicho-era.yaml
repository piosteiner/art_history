definition: "Japanese era name (永長) for the years 1096–1097: 1096 is Eichō 1 (元年) and Eichō 2 is 1097."
description_md: |-
  **Eichō** (永長) is a Japanese era name ([[nengo]]), proclaimed in 1096. Its years are counted in lunar years from the new year before the proclamation: 1096 is Eichō 1 (元年), 1097 its last year, Eichō 2. A Japanese source dates a year within it as "Eichō 2" (永長2年) rather than by a continuous count.

  Before: [[kaho-era|Kahō]]. After: [[jotoku-era|Jōtoku]].
