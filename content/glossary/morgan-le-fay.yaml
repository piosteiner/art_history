definition: A powerful sorceress of Arthurian legend, in most versions King Arthur's half-sister, sometimes his enemy and sometimes his healer.
description_md: |-
  [[king-arthur|Arthur]]'s half-sister, a powerful sorceress, sometimes his enemy and sometimes his healer. She is one of the queens who carries him to Avalon.

  **In art:** A dark-haired enchantress with spell books, potions or a loom.

  **Famous works**

  - Frederick Sandys, *Morgan le Fay* (Birmingham)
