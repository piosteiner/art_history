name: Burunduk
category: mythology and legend
definition: In an Evenki animal tale, the hard-working chipmunk who got his stripes from the claws of a grateful bear; burunduk is the Russian word for chipmunk.
description_md: |-
  In an Evenki animal tale, a starving bear, woken from his winter sleep, asked a little chipmunk for food. The chipmunk shared the roots and nuts from its autumn stores, and the grateful bear stroked its back with his clawed paw, leaving the stripes chipmunks wear to this day. *Burunduk* is the Russian word for chipmunk.

  *From:* Evenki animal tale · Evenki
