public_id: 131585
name: Jenny Greenteeth
category: mythology and legend
definition: A green-skinned river hag of English folklore who pulls children into duckweed-covered ponds.
description_md: |-
  A green-skinned witch with long hair and sharp teeth who lives in ponds covered in duckweed and pulls children who come too close down into the water. Parents used her to keep children away from dangerous water.

  *From:* folklore · English
