name: Vodyanoy
category: mythology and legend
definition: In Slavic folklore, the male spirit of lakes, rivers and millponds, an old frog-faced man with a green beard, who drowns those who anger him.
description_md: |-
  The vodyanoy is a male water spirit who guards lakes, rivers and millponds. He's often pictured as an old man with a frog-like face, a green beard and long hair covered in slime. He can be a helpful guardian, but drowns people who anger him and drags people down to serve him in his underwater palace (in Czech and Slovak lore he keeps the souls of the drowned in pots).

  *From:* Slavic folklore · Slavic
