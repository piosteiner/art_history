public_id: 113095
name: Yongtai
names:
  - lang: zh
    role: original
    text: 永泰
category: calendar
definition: "Chinese era name (永泰) of the Tang for the years 765–766: 765 is Yongtai 1 (元年) and Yongtai 2 is 766."
description_md: |-
  **Yongtai** (永泰) is a Chinese era name ([[nianhao]]) of the Tang, proclaimed in 765 under Emperor Daizong (代宗). Its years are counted in lunar years: 765 is Yongtai 1 (元年), 766 its last year, Yongtai 2. A Chinese source dates a year within it as "Yongtai 2" (永泰二年) rather than by a continuous count.

  Before: [[guangde-era|Guangde]]. After: [[dali-era|Dali]].
sources:
  definition:
    - source: dila-time-authority
