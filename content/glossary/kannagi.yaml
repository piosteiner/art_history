public_id: 131634
name: Kannagi
category: mythology and legend
definition: The wronged wife of the Tamil epic Silappatikaram ("The Tale of the Anklet"), whose curse set Madurai on fire after her husband was wrongly executed.
description_md: |-
  In the Tamil epic *Silappatikaram* ("The Tale of the Anklet"), Kannagi's husband Kovalan was wrongly executed by the king of Madurai for stealing the queen's anklet. Kannagi went to court and broke open her own anklet to show it was full of rubies, while the queen's had pearls. The king died of shame, and her curse set Madurai on fire.

  *From:* Silappatikaram · Tamil
