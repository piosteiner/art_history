definition: The benevolent creature of water, rain and power, symbol of the emperor (imperial dragons have five claws), often chasing a flaming pearl.
description_md: |-
  The dragon is a benevolent creature of water, rain and power, the symbol of the emperor. Imperial dragons have five claws. Together with the phoenix, it means a happy marriage.

  **In art:** A long serpentine creature with a camel-like head, antlers and claws, chasing a flaming pearl.

  **Famous works**

  - Chen Rong, *Nine Dragons* (handscroll, Museum of Fine Arts, Boston)
  - *Nine-Dragon Wall* (Forbidden City, Beijing)

  *From:* Chinese
