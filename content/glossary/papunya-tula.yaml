name: Papunya Tula
names: [Western Desert painting, dot painting, Clifford Possum Tjapaltjarri]
category: art style
definition: The Western Desert painting movement begun at Papunya near Alice Springs in 1971, when men of several desert communities painted their Tjukurrpa/Jukurrpa stories on boards and canvas.
description_md: |-
  In 1971 at Papunya, near Alice Springs, men from several desert communities began painting their *Tjukurrpa* or *Jukurrpa* stories onto boards and canvas with acrylic paint, encouraged by the teacher Geoffrey Bardon. Some sacred elements were later hidden or changed into dot patterns, so outsiders couldn't read restricted knowledge. This became the famous Western Desert "dot painting" movement.

  **Famous works**

  - Clifford Possum Tjapaltjarri, *Warlugulong* (1977, National Gallery of Australia)
  - *works by Papunya Tula Artists* (the artist-owned company)

  **Held sacred today:** Aboriginal and Torres Strait Islander visitors are warned that this page contains names and images of deceased persons. Some sacred elements were hidden or changed into dot patterns so outsiders couldn't read restricted knowledge.

  *From:* Western Desert peoples
