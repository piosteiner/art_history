name: jātaka
names:
  - lang: ja
    role: original
    text: "{本生譚|ほんじょうたん}"
category: iconography
definition: A story of one of the earlier lives of the Buddha.
description_md: |-
  Stories of the Buddha's former lives, when he was born as animals and people and practised virtue. In the most famous, as a prince, he threw himself off a cliff to feed a starving tigress and her cubs.

  **In art:** Story scenes, often with animals, in a series of panels.

  **Famous works**

  - *Tamamushi Shrine* (the Hungry Tigress panels, Hōryū-ji, Nara)
  - *Bharhut and Sanchi stupa reliefs* (India)
  - *Ajanta Caves murals* (India)
  - *Borobudur reliefs* (Java)

  *From:* Buddhist
