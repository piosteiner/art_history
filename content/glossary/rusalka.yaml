public_id: 130952
name: Rusalka
category: mythology and legend
definition: In Slavic folklore, the restless spirit of a young woman who died tragically, often by drowning, who lures young men to their death; unlike a mermaid she has legs.
description_md: |-
  In Slavic folklore, a rusalka is the spirit of a young woman who died tragically, often by drowning. She lives in rivers and lakes, sometimes climbs into trees by the water to sing and comb her hair, and lures young men to their death. Unlike the Western mermaid, the rusalka is usually imagined with legs rather than a fish tail.

  *From:* Slavic folklore · Slavic
