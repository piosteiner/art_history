name: Paracelsus's elementals
names: [gnome, undine, sylph, salamander]
category: mythology and legend
definition: The four kinds of elemental beings described by the 16th-century Swiss physician Paracelsus — gnomes of earth, undines of water, sylphs of air and salamanders of fire; the word "gnome" is generally credited to him.
description_md: |-
  Paracelsus was a Swiss physician and alchemist of the 16th century, from Einsiedeln. In his writings on spirits of nature, he described four kinds of elemental beings: *gnomes* of the earth, *undines* of the water, *sylphs* of the air and *salamanders* of fire. The word "gnome" is generally credited to him. These ideas went on to shape later fantasy worlds.

  *From:* Paracelsus, Liber de nymphis, sylphis, pygmaeis et salamandris · Swiss (Renaissance natural philosophy)
