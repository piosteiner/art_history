name: Shadrach, Meshach and Abednego
names: [The Fiery Furnace, Three Youths]
category: mythology and legend
also_in: [iconography]
definition: The three young Jews thrown into a blazing furnace by Nebuchadnezzar, who walked unharmed in the flames with an angel.
description_md: |-
  When three young Jews, Shadrach, Meshach and Abednego, refused to worship his golden statue, he had them thrown into a blazing furnace, but they walked unharmed in the flames with an angel.

  **In art:** Three young men standing calmly in flames.

  **Famous works**

  - Early Christian catacomb paintings of the three youths

  *From:* Hebrew Bible, Book of Daniel · Hebrew Bible
