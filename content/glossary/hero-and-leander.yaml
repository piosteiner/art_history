definition: In Greek myth the lovers Hero, priestess of Aphrodite at Sestos, and Leander, who swam the Hellespont to her each night until he drowned.
description_md: |-
  Hero was a priestess of [[aphrodite]] at Sestos. Every night, her lover Leander swam across the Hellespont, guided by the lamp she held in her tower. One stormy night the wind blew out the lamp, and Leander drowned. Hero threw herself from the tower.

  **In art:** A woman holding a lamp in a tower above a stormy sea, or a drowned youth on the shore.

  **Famous works**

  - Rubens, *Hero and Leander* (Yale University Art Gallery)
  - Turner, *The Parting of Hero and Leander* (National Gallery, London)
  - Evelyn De Morgan, *Hero Awaiting the Return of Leander*

  *From:* Greek mythology; Musaeus, Hero and Leander · Ancient Greek
