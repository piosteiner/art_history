name: Tangata manu
names: [Birdman]
category: mythology and legend
definition: The Birdman contest of Rapa Nui, in which young men raced to bring back the season's first sooty tern egg and made their sponsor Birdman for a year.
description_md: |-
  [[hotu-matua]] was the legendary first chief who sailed to the island. Later, in the Birdman (*Tangata manu*) contest, young men climbed down sea cliffs and swam to a small island to find the first sooty tern egg of the season. Whoever brought it back unbroken made his sponsor the Birdman for a year.

  *From:* Rapa Nui tradition · Rapa Nui
