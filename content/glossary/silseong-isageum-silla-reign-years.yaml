public_id: 113354
name: Silseong Isageum of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 실성이사금
  - lang: ko-Hani
    role: alternative
    text: 實聖尼師今
category: calendar
parent: korean-calendar
definition: "The reign years of Silseong Isageum of Silla (實聖尼師今, 실성이사금), by which Korean histories date 402–417: 402 is Silseong Isageum 1, 417 Silseong Isageum 16."
description_md: |-
  **Silseong Isageum** (實聖尼師今, 실성이사금): the years of the reign of Silseong Isageum of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 411 is Silseong Isageum 10 (실성이사금 10년). The year of the accession, 402, counts as the first year.

  Before: [[namul-isageum-silla-reign-years|Namul Isageum]]. After: [[nulji-maripgan-silla-reign-years|Nulji Maripgan]].
sources:
