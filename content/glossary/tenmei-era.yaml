definition: "Japanese era name (天明) for the years 1781–1789: 1781 is Tenmei 1 (元年) and Tenmei 9 is 1789."
description_md: |-
  **Tenmei** (天明) is a Japanese era name ([[nengo]]), proclaimed in 1781. Its years are counted in lunar years from the new year before the proclamation: 1781 is Tenmei 1 (元年), 1789 its last year, Tenmei 9. A Japanese source dates a year within it as "Tenmei 2" (天明2年) rather than by a continuous count.

  Before: [[anei-era|An'ei]]. After: [[kansei-era|Kansei]].
