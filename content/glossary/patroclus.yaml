name: Patroclus
category: mythology and legend
also_in: [iconography]
definition: In Greek myth Achilles' closest companion, killed by Hector while wearing Achilles' armour.
description_md: |-
  [[achilles]]' closest companion. He went into battle wearing Achilles' armour and was killed by [[hector]], which drove Achilles back into the fighting.

  **In art:** Usually being bandaged by Achilles or carried dead from the battlefield.

  **Famous works**

  - Sosias Painter (see above)
  - [[artist/jacques-louis-david]], *Patroclus* (Musée Thomas-Henry, Cherbourg)

  *From:* Homer, Iliad · Ancient Greek
