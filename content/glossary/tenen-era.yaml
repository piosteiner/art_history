definition: "Japanese era name (天延) for the years 974–975: 974 is Ten'en 1 (元年) and Ten'en 2 is 975."
description_md: |-
  **Ten'en** (天延) is a Japanese era name ([[nengo]]), proclaimed in 974. Its years are counted in lunar years from the new year before the proclamation: 974 is Ten'en 1 (元年), 975 its last year, Ten'en 2. A Japanese source dates a year within it as "Ten'en 2" (天延2年) rather than by a continuous count.

  Before: [[tenroku-era|Tenroku]]. After: [[jogen-era-976|Jōgen]].
