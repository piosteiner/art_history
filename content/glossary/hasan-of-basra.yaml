public_id: 131349
name: Hasan of Basra
category: mythology and legend
definition: In the Nights, a goldsmith who hid a bird maiden's feather dress so she would stay with him, and later crossed seven valleys and seas to find her again.
description_md: |-
  He spied on a group of bird maidens taking off their feather dresses to bathe, and hid the dress of the most beautiful one so she'd stay with him. Three years later, while he was away, she got the dress back and flew with their children to the Islands of Wak-Wak. He crossed seven valleys and seas to find her again.

  *From:* One Thousand and One Nights · Arabic, Persian, Indian and Egyptian
