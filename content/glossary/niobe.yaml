name: Niobe
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the queen of Thebes whose fourteen children were shot by Apollo and Artemis after she boasted over their mother Leto; she wept until she turned to stone.
description_md: |-
  A queen of Thebes who boasted that her fourteen children (the number in [[person/ovid]]; it varies between sources) made her better than the goddess [[leto]], who had only two. Leto's children, [[apollo]] and [[artemis]], shot all of Niobe's children dead with arrows. Niobe wept until she turned into a stone that still weeps.

  **In art:** A mother shielding her children from arrows shot from the sky.

  **Famous works**

  - *Niobe Group* (Uffizi)
  - [[artist/jacques-louis-david]], *Apollo and Diana Attacking the Children of Niobe* (Dallas Museum of Art)

  *From:* Ovid, Metamorphoses · Ancient Greek
