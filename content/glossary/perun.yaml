name: Perun
category: mythology and legend
definition: The chief god of the ancient Slavs, god of thunder, lightning, war and oaths, who chased the serpent god of the underworld with lightning bolts.
description_md: |-
  Perun was the chief god of the ancient Slavs, god of thunder, lightning, war and oaths. In the scholarly reconstruction of Ivanov and Toporov, he ruled from the top of the world tree, and his great enemy was the serpent god Veles of the underworld, who stole his cattle. Perun chased him across the world with lightning bolts, and every thunderstorm was their battle.

  *From:* Slavic religion · Slavic
