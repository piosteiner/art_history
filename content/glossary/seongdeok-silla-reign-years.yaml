public_id: 113369
name: Seongdeok of Silla (reign years)
names:
  - lang: ko
    role: original
    text: 성덕왕
  - lang: ko-Hani
    role: alternative
    text: 聖德王
category: calendar
parent: korean-calendar
definition: "The reign years of King Seongdeok of Silla (聖德王, 성덕왕), by which Korean histories date 702–737: 702 is Seongdeok 1, 737 Seongdeok 36."
description_md: |-
  **Seongdeok** (聖德王, 성덕왕): the years of the reign of King Seongdeok of Silla. The Samguk sagi, the history of the Three Kingdoms, dates events by the reigning king's year ([[korean-reign-years]]): 711 is Seongdeok 10 (성덕왕 10년). The year of the accession, 702, counts as the first year.

  Before: [[hyoso-silla-reign-years|Hyoso]]. After: [[hyoseong-silla-reign-years|Hyoseong]].
sources:
  definition:
    - source: dila-time-authority
