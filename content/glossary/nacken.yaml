public_id: 131595
name: Näcken
names: [Neck, Nix]
category: mythology and legend
definition: A water spirit of Scandinavian folklore who plays the violin in waterfalls so beautifully that people dance until they die or drown.
description_md: |-
  A handsome man, nowadays usually pictured naked, who sits in waterfalls and streams playing a violin so beautifully that people dance until they die, or drown trying to reach him. If you give him a gift, he'll teach you to play like him. He can also take the form of a white horse.

  *From:* folklore · Scandinavian
