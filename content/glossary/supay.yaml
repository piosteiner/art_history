name: Supay
category: mythology and legend
definition: The Inca god of death and ruler of the underworld Uku Pacha, later equated with the Devil and seen in the Diablada dance of the Oruro Carnival.
description_md: |-
  Supay ruled Uku Pacha, the inner world beneath the earth where the dead dwelt, and the name also covered a whole host of underworld demons. After the Spanish conquest, missionaries equated him with the Devil. In Bolivia he still appears as the horned devil of the Diablada dance at the Oruro Carnival, and miners leave offerings to a related figure, El Tío, deep in the mines.

  *From:* Andean religion · Inca, Andean
