category: calendar
definition: "Japanese era name (天応) for the years 781–782: 781 is Ten'ō 1 (元年) and Ten'ō 2 is 782."
description_md: |-
  **Ten'ō** (天応) is a Japanese era name ([[nengo]]), proclaimed in 781. Its years are counted in lunar years from the new year before the proclamation: 781 is Ten'ō 1 (元年), 782 its last year, Ten'ō 2. A Japanese source dates a year within it as "Ten'ō 2" (天応2年) rather than by a continuous count.

  Before: [[hoki-era|Hōki]]. After: [[enryaku-era|Enryaku]].
