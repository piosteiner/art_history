definition: In Ovid's Metamorphoses, the nymph turned into reeds as Pan caught her; from them he made the first panpipes.
description_md: |-
  The nymph Syrinx fled from [[pan]] and was turned into reeds just as he caught her. As the wind blew through them, they made a sad sound, so Pan cut them and made the first panpipes, which are named after her.

  **In art:** A goat-legged god grasping at a nymph in the reeds by a river.

  **Famous works**

  - Rubens and [[artist/jan-brueghel-the-elder]], *Pan and Syrinx* (Kassel)
  - [[artist/francois-boucher]], *Pan and Syrinx* (National Gallery, London)

  *From:* Ovid, Metamorphoses · Ancient Greek
