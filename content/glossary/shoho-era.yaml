definition: "Japanese era name (正保) for the years 1644–1648: 1644 is Shōhō 1 (元年) and Shōhō 5 is 1648."
description_md: |-
  **Shōhō** (正保) is a Japanese era name ([[nengo]]), proclaimed in 1645. Its years are counted in lunar years from the new year before the proclamation: 1644 is Shōhō 1 (元年), 1648 its last year, Shōhō 5. A Japanese source dates a year within it as "Shōhō 2" (正保2年) rather than by a continuous count.

  Before: [[kanei-era|Kan'ei]]. After: [[keian-era|Keian]].
