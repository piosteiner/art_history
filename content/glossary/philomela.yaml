name: Philomela
category: mythology and legend
also_in: [iconography]
definition: In Ovid's Metamorphoses, the princess raped and mutilated by her brother-in-law Tereus, who wove her story into a tapestry and was turned into a nightingale.
description_md: |-
  King Tereus raped his sister-in-law Philomela and cut out her tongue so she couldn't tell. She wove the story into a tapestry and sent it to her sister [[procne]], his wife. In revenge, Procne killed her own son and served him to Tereus. As he chased them with an axe, all three were turned into birds: Philomela into a nightingale, Procne into a swallow (so in the Roman versions; the earlier Greek accounts make Procne the nightingale and Philomela the swallow) and Tereus into a hoopoe.

  **In art:** Two women presenting a severed head to a horrified king at a table.

  **Famous works**

  - Rubens, *Tereus Confronted with the Head of His Son Itys* (Prado)

  *From:* Ovid, Metamorphoses · Ancient Greek
