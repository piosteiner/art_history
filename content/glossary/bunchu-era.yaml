definition: "Japanese era name (文中) for the years 1372–1375: 1372 is Bunchū 1 (元年) and Bunchū 4 is 1375."
description_md: |-
  **Bunchū** (文中) is a Japanese era name ([[nengo]]) of the Southern Court (1336–1392), used beside the Northern Court's eras,, proclaimed in 1372. Its years are counted in lunar years from the new year before the proclamation: 1372 is Bunchū 1 (元年), 1375 its last year, Bunchū 4. A Japanese source dates a year within it as "Bunchū 2" (文中2年) rather than by a continuous count.

  Before: [[kentoku-era|Kentoku]]. After: [[tenju-era|Tenju]].
