category: calendar
definition: "Japanese era name (寛正) for the years 1460–1466: 1460 is Kanshō 1 (元年) and Kanshō 7 is 1466."
description_md: |-
  **Kanshō** (寛正) is a Japanese era name ([[nengo]]), proclaimed in 1460. Its years are counted in lunar years from the new year before the proclamation: 1460 is Kanshō 1 (元年), 1466 its last year, Kanshō 7. A Japanese source dates a year within it as "Kanshō 2" (寛正2年) rather than by a continuous count.

  Before: [[choroku-era|Chōroku]]. After: [[bunsho-era|Bunshō]].
