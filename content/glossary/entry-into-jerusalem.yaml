name: Entry into Jerusalem
names: [The Entry into Jerusalem, Palm Sunday]
category: iconography
definition: Jesus riding into Jerusalem on a donkey, welcomed with palm branches (Palm Sunday).
description_md: |-
  Jesus rides into Jerusalem on a donkey, and crowds welcome him by spreading palm branches and cloaks on the road (Palm Sunday).

  **In art:** Christ on a donkey, crowds with palm branches, people climbing trees to see.

  **Famous works**

  - [[artist/giotto]], *Entry into Jerusalem* (Scrovegni Chapel)
  - [[artist/pietro-lorenzetti]], *Entry into Jerusalem* (Lower Basilica, Assisi)

  *From:* New Testament, Gospels · Christian
