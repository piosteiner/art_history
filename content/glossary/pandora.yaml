name: Pandora
category: mythology and legend
also_in: [iconography]
definition: In Greek myth, the first woman, who opened the jar (later called a box) that released all evils into the world, leaving only Hope inside.
description_md: |-
  The first woman, made by the gods. She was given a jar (later called a box) and told never to open it. Out of curiosity she did, releasing all the evils into the world. Only Hope remained inside.

  **In art:** A woman holding or opening a box or jar, with smoke or spirits escaping.

  **Famous works**

  - [[artist/dante-gabriel-rossetti]], *Pandora*
  - Waterhouse, *Pandora*
  - Jean Cousin the Elder, *Eva Prima Pandora* (Louvre)

  *From:* Hesiod, Works and Days · Ancient Greek
