description_md: |-
  ## Origins

  Novecento Italiano ("the Italian twentieth century") was founded in Milan in 1922 by Anselmo Bucci, Leonardo Dudreville, Achille Funi, Gian Emilio Malerba, Pietro Marussig, Ubaldo Oppi and [[artist/mario-sironi|Mario Sironi]], brought together by the dealer Lino Pesaro and the critic Margherita Sarfatti, who worked on Mussolini's *Il Popolo d'Italia* [[source/wikipedia-en-novecento-italiano|§ History]]. The name recalled the great centuries of Italian art, the Quattrocento and Cinquecento; the group sought a renewed yet traditional Italian art and to revive large figure painting in the classical manner, without a precise programme [[source/wikipedia-en-novecento-italiano|§ History]]. At the opening of the exhibition *Sette Pittori del Novecento* in Milan on 26 March 1923, [[person/benito-mussolini|Mussolini]] declared that "Art belongs to the domain of the individual" and that the State had only to encourage artists "from the artistic and national point of view" [[source/braun-2000|p. 1]]. After Oppi's departure in 1924 the group split and was refounded; the new Novecento Italiano held its first exhibition in Milan in 1926 ([[event/first-novecento-italiano-exhibition-1926]]) [[source/wikipedia-en-novecento-italiano|§ History]].

  ## Style and politics

  Braun places the "Magic Realism of the Novecento group" between Sironi's Metaphysical painting and the archaism of the mural movement [[source/braun-2000|p. 8]]. Günter Berghaus describes the movement led by Sarfatti as firmly allied to the Fascist cause and closer to the position of a State art than any competing faction; in 1927 Sarfatti called its artists "revolutionaries of the modern restoration" [[source/berghaus-2001|p. 161]]. He disputes Braun's view of it as an avant-garde: the group appeared only after Fascism's revolutionary phase, favoured conservative values in art and politics, and its classicist harmony was "the aesthetic flipside to the political return to order" [[source/berghaus-2001|pp. 159, 161]]. Antliff counts the art of the *novecento* among the strands of modernism Italian Fascism promoted [[source/antliff-2002|p. 148]].

  ## Rivals and end

  Mussolini, personally little interested in art, divided official support among several groups, and Novecento competed with Futurism and the regionalist Strapaese [[source/wikipedia-en-novecento-italiano|§ History]]. Strapaese's adherents condemned the "internationalist aesthetics of the novecento", with Futurism and Rationalism, as "Stracittà" movements importing foreign, cosmopolitan values [[source/antliff-2002|p. 158]]. Achille Starace attacked the group in the Fascist press, critics denounced its "un-Italian" qualities, and in the 1930s the Corrente group at the Brera Academy formed in opposition to it [[source/wikipedia-en-novecento-italiano|§ History]]. Later members included [[artist/arturo-tosi|Arturo Tosi]], on its governing committee and in its exhibitions of 1926 and 1929 [[source/wikipedia-en-arturo-tosi|§ Biography]], and [[artist/arnaldo-carpanetti|Arnaldo Carpanetti]] of its second wave [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]]. The group depended on Sarfatti and fell apart after she was distanced from Mussolini, partly because of the anti-Semitic laws of 1938; it was formally dissolved in 1943 [[source/wikipedia-en-novecento-italiano|§ History]].
