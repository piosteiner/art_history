description_md: |-
  Socialist realism was the official art doctrine of the Soviet Union and, after the Second World War, of other socialist countries: an idealised realistic art that was to advance the socialist cause through inspiring images [[source/wikipedia-en-socialist-realism|introduction]]. In the seminar's periodisation it lasted from 1932 to the end of the 1980s [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].

  ## Origins

  The term was first used in print by Ivan Gronsky in May 1932 and approved at meetings that included Stalin; the First Congress of Soviet Writers proclaimed it in 1934 the only acceptable method for Soviet culture in all media [[source/wikipedia-en-socialist-realism|§ Debate within Soviet art]] [[source/wikipedia-en-socialist-realism|introduction]]. Groys likewise dates its declaration as the sole method of Soviet art to 1934, with its tenets laid down earlier [[source/groys-1994|p. 154]]. Maxim Gorky put its mixture of realism and desire this way: "if to the meaning of what has been extracted from the given we add… what we desire, this gives us the romanticism which lies at the foundation of myth" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 25]]. Its forerunner was the "heroic realism" of the Association of Artists of Revolutionary Russia (AKhRR), founded in 1922 and dissolved in 1932 when the artists' organisations were reorganised [[source/wikipedia-en-socialist-realism|§ Association of Artists of Revolutionary Russia (AKhRR)]].

  ## A state art

  Golomstock described how the state declares art an ideological weapon, takes a monopoly over artistic life, builds an apparatus to control it, and from the many movements selects "always the most conservative" one as official and obligatory [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]]. The forced assimilation of Soviet artists into socialist realism in the 1930s removed Soviet art from the transnational conversations it had led in the early Bolshevik years [[source/rasmussen-2022|p. 51]]. In the Soviet Union the purchases of museums were governed by the Union of Soviet Artists ([[institution/artists-union-of-the-ussr]]), whose collective exhibitions on set themes — the army, industry and agriculture, portraits of the leaders — were the usual way art reached the public [[source/groys-1994|p. 159]].

  ## Realism as transformation

  "Realism" did not mean the mimesis of an external reality, which was dismissed as "naturalism", but the will to make an artistic ideal real [[source/groys-1994|p. 156]]. Art was to show the world as it must become; with control over both reality and its representation, the Party could make art self-referential and fulfil the avant-garde's dream of a total space in which art and life coincide [[source/groys-1994|p. 157]]. For Groys the aesthetic of Stalinist socialist realism is therefore the culmination of the avant-garde project, not its opposite [[source/groys-1994|p. 147]]. In practice it filled Soviet life with posters, monuments, frescoes and mosaics modelled on museum art, while paintings for museums were reproduced as posters and illustrations [[source/groys-1994|p. 158]]. The avant-garde and religious art were removed from Soviet museums or refused [[source/groys-1994|p. 158]].

  Typical subjects were happy peasants and workers, industrial and agricultural scenes, and heroic portraits of Stalin for his cult of personality, in a "forced optimism" that allowed no tragedy [[source/wikipedia-en-socialist-realism|§ Characteristics]]. The seminar's examples include [[artwork/yablonska-bread]], [[artwork/s-gerasimov-collective-farm-festival]], [[artwork/gerasimov-lenin-on-the-tribune]], [[artwork/deineka-defence-of-sevastopol]] and [[artwork/worker-and-kolkhoz-woman]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 15, 19, 22, 43, 65]]. Its language travelled from the USSR to the People's Republic of China [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].

  ## Afterlife

  After Stalin's death Khrushchev condemned the excessive restrictions, but socialist realism remained the official style in limited force until 1991 [[source/wikipedia-en-socialist-realism|§ Reception and impact]] [[source/wikipedia-en-socialist-realism|§ Soviet Union]]. The project failed, Groys argues, because it produced a mass of art with value neither for museums nor for a market [[source/groys-1994|p. 161]]. Returning a socialist realist painting to the museum would be "tantamount to placing an Andy Warhol Campbell's soup can back on the supermarket shelf" [[source/groys-1994|pp. 160–161]].
