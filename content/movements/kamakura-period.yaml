name: Kamakura period
names:
  - lang: ja
    role: original
    text: "{鎌倉時代|かまくらじだい}"
kind: period
period: 1185/1333
description_md: "**Dates.** The start depends on which step of Minamoto no Yoritomo's rise counts: 1185, when he won the right to appoint military governors (shugo) and land stewards (jitō) after the Taira were defeated at Dan-no-ura — the prevailing view[[source/history-of-japanese-art|pp. 102–103]]; 1192, his appointment as [[shogun]][[source/history-of-japanese-art|pp. 166–167]] — the older view, still used by the Tokyo National Museum; or 1183, the court's recognition of his rule over the east[[source/wikipedia-ja-kamakura-jidai|1183年説、1185年説、1192年説]][[source/wikipedia-en-kamakura-period|“In the past, the most popular theory was that the year was 1192 … Later, the prevailing theory was that the year was 1185”]][[source/nabunken-style-manual-2022|pp. 29–31]]. It ends in 1333, when the supporters of Emperor Go-Daigo took Kamakura and the shogunate fell[[source/wikipedia-en-kamakura-period|“the Siege of Kamakura in 1333 which ended the rule of the shogunate”]]."
