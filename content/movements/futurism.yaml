description_md: |-
  Futurism (Italian *Futurismo*) was an artistic and social movement that originated in Italy in the early twentieth century; it celebrated dynamism, speed, technology, youth and violence, and objects such as the car, the aeroplane and the industrial city [[source/wikipedia-en-futurism|§ Introduction]]. Its members worked in every medium — painting, sculpture, design, architecture, theatre, film, music, literature and even cuisine [[source/wikipedia-en-futurism|§ Introduction]].

  ## Foundation and programme

  The movement was founded in [[place/milan|Milan]] in 1909 by the poet and theorist [[person/filippo-tommaso-marinetti|Filippo Tommaso Marinetti]], whose *Manifesto of Futurism* first appeared on 5 February 1909 in *La gazzetta dell'Emilia* and was reprinted in *Le Figaro* on 20 February 1909 [[source/wikipedia-en-futurism|§ Italian Futurism]]. Marinetti was soon joined by the painters [[artist/umberto-boccioni|Umberto Boccioni]], Carlo Carrà, [[artist/giacomo-balla|Giacomo Balla]] and Gino Severini and the composer Luigi Russolo [[source/wikipedia-en-futurism|§ Italian Futurism]]. The Futurists rejected the cult of the past and its museums — the *Manifesto of the Futurist Painters* of 1910 declared war on "the mindless, snobbish, and fanatical religion of the past, religion nurtured by the pernicious existence of the museums" — and were passionate Italian nationalists [[source/wikipedia-en-futurism|§ Italian Futurism]]. The *Technical Manifesto of Futurist Painting* (11 April 1910) committed them to a "universal dynamism" to be represented directly in painting [[source/wikipedia-en-futurism|§ Italian Futurism]].

  ## Style

  In 1910 and 1911 the Futurist painters still worked with the stippled colour of [[movement/divisionism|Divisionism]]; after a visit to Paris in 1911 they took over the fragmented planes of [[movement/cubism|Cubism]] as a means of analysing energy and expressing movement [[source/wikipedia-en-futurism|§ Italian Futurism]]. The Florentine critic Ardengo Soffici summed up the claim: "Impressionism is the thesis, Cubism is the antithesis, Futurism is the synthesis of modern painting" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 44]]. Boccioni, the group's main theorist, wrote in *Pittura e scultura futuriste (dinamismo plastico)* (1914): "While the impressionists paint a picture to give one particular moment and subordinate the life of the picture to its resemblance to this moment, we synthesize every moment (time, place, form, color-tone) and thus paint the picture" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 44]] [[source/wikipedia-en-umberto-boccioni|§ Biography]]. His triptych *States of Mind* (1911) introduced new means such as "lines of force", which convey the direction of objects through space, and "simultaneity", which combines memory, present impression and anticipation [[source/wikipedia-en-futurism|§ Italian Futurism]]. For the historian Monica Cioli, the constant reference to the machine — a "transversal myth" of the avant-gardes of the time — was a pillar of the movement [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 52]]. From 1915 Balla and [[artist/fortunato-depero|Fortunato Depero]] extended the programme into the whole environment in the manifesto [[literature/ricostruzione-futurista-dell-universo|*Ricostruzione futurista dell'universo*]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]].

  ## Nationalism and war

  Italian Futurism admired violence from the outset: the founding manifesto promised to "glorify war—the world's only hygiene—militarism, patriotism" [[source/wikipedia-en-futurism|§ Italian Futurism]]. Before 1914 the anarchist-leaning Futurists Boccioni, Carrà and Marinetti joined followers of Georges Sorel (among them the then socialist [[person/benito-mussolini|Mussolini]]), the nationalist Enrico Corradini and the Florentine critics Giovanni Papini and Soffici in advocating an Italian national socialism; calling Italy a "proletarian nation", they exalted war — the conquest of Libya in 1911, irredentist war with Austria, intervention in the [[event/world-war-i|First World War]] — as the catalyst of Italy's spiritual unification [[source/antliff-2002|p. 150]]. With the circle of *La Voce*, the Futurists supplied the "modernist nationalism" on which the later aesthetic politics of Fascism were built, and they too invoked Italy's past achievements to claim the superiority of the "Italian race" and to justify colonial conquest [[source/braun-2000|p. 6]]. In 1914 they campaigned against Austria-Hungary and against Italian neutrality — Boccioni tore up an Austrian flag in Milan's Teatro Dal Verme in September — and when Italy entered the war in 1915 many of them enlisted [[source/wikipedia-en-futurism|§ Italian Futurism]]. The war divided Futurism internationally: Marinetti's Italians fought on the side of nationalist war, whereas the Russian Futurists were pacifists and internationalists [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 47]]. Boccioni was killed in 1916, and the Florentine group had already left the movement by the end of 1914 [[source/wikipedia-en-futurism|§ Italian Futurism]].

  ## Futurism and Fascism

  After the war Marinetti revived the movement — the so-called "Second Futurism" [[source/wikipedia-en-futurism|§ Italian Futurism]]. His Futurist Party (1918–19) allied itself with the Arditi assault veterans and Mussolini's Fasci di Combattimento in a campaign for national revolution outside parliament [[source/antliff-2002|p. 150]]; in 1919 Mussolini drew nationalists, Futurists and war veterans together into the Fasci [[source/antliff-2002|p. 156]]. In April 1919 Marinetti helped sack the press of the socialist paper *Avanti!*, an attack in which four people died [[source/braun-2000|p. 12]]. The Futurists' anarchist leanings made for stormy relations with Mussolini after the National Fascist Party was founded in 1921 [[source/antliff-2002|p. 150]]; Marinetti walked out of the 1920 party congress and withdrew from politics for three years [[source/wikipedia-en-futurism|§ 1920s and 1930s]], publicly reconciling himself with the regime after 1924, while dissident Futurist factions wavered [[source/antliff-2002|pp. 166–167]]. In 1924 socialists, communists and anarchists left the Milan Futurist Congress [[source/wikipedia-en-futurism|§ 1920s and 1930s]].

  Postwar Futurism kept an uneasy relationship with the regime, defending its artistic independence while demanding recognition as the founding spirit of Fascism itself [[source/braun-2000|p. 9]]. Marinetti tried and failed to make Futurism the official state art; Mussolini gave patronage to many styles, and [[movement/novecento-italiano|Novecento Italiano]], promoted by Margherita Sarfatti, became Futurism's rival [[source/wikipedia-en-futurism|§ 1920s and 1930s]]. The regime's promotion of "all strands of modernism", from Rationalist architecture to Futurism and the Novecento [[source/antliff-2002|p. 148]], has been read either as an imperfect totalitarianism or as a strategic artistic pluralism — the state, for instance, bought [[artist/enrico-prampolini|Enrico Prampolini]]'s [[artwork/prampolini-feminine-landscape|*Feminine Landscape*]] in 1930 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]]. Its opponents among the Fascists of Strapaese condemned the Futurist cult of the machine as foreign, cosmopolitan and bourgeois [[source/antliff-2002|p. 158]]. Marinetti himself became a member of the Reale Accademia d'Italia [[source/braun-2000|p. 10]], openly criticised the antimodernist and anti-Semitic campaign that followed the Racial Laws of 1938, and later supported the Republic of Salò; he died in 1944 [[source/braun-2000|pp. 9–10]]. Towards the end of the 1930s right-wing Fascists took over the German notion of "degenerate art" and condemned Futurism [[source/wikipedia-en-futurism|§ 1920s and 1930s]]. Of the original Futurist painters only [[artist/mario-sironi|Mario Sironi]] became a prominent Fascist artist working closely with the regime; Boccioni, Balla and Carrà had reached their maturity before the war [[source/braun-2000|p. 9]].

  From 1926 the second generation turned to [[movement/aeropittura|aeropittura]], launched in the manifesto *Perspectives of Flight* (1929), whose signatories included Depero, Marinetti and Prampolini [[source/wikipedia-en-futurism|§ Aeropainting]]. Futurism also travelled: the Futurists, shown at the decorative-arts exhibition in Monza in 1923, were left out of the floating exhibition of the [[event/nave-italia-cruise-1924|Nave Italia]] to Latin America in 1924 [[source/moure-cecchini-2016|pp. 9, 12]], but Marinetti made a successful lecture tour of Brazil, Uruguay and Argentina in 1926 and returned to Argentina in 1936 [[source/moure-cecchini-2016|p. 20]].

  ## Interpretations

  Walter Benjamin quoted a Futurist text praising the beauty of the war in Ethiopia and linked *l'art pour l'art* to Marinetti's defence of Fascist violence, aligning Futurism with the "aestheticization" of politics [[source/antliff-2002|p. 154]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 6]]. Later historians objected that Futurism's fragmentary, dynamic, collage-based aesthetic is precisely what Benjamin associated with anti-Fascism; for Andrew Hewitt the Futurists sought to rejuvenate an ossified society through violence, making struggle itself an aesthetic and political principle [[source/antliff-2002|p. 154]]. Emily Braun notes that Futurism fulfils the criteria of the historical avant-garde better than any other movement — political activism, desacralisation of the art object — yet is absent from Peter Bürger's theory, and that its pre-war idea of a "total style of life" became standard rhetoric under Fascism [[source/braun-2000|p. 7]]. Igor Golomstock saw totalitarian art translating the Futurists' abstract "lines of force" into the concrete image of war, as in [[artwork/boccioni-carica-di-lancieri|Boccioni's *Carica di lancieri*]] beside Deineka's [[artwork/deineka-defence-of-sevastopol|*Defence of Sevastopol*]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 43, 46]]; [[artwork/the-city-rises|*The City Rises*]] and Sironi's still urban landscapes show two modernisms with different relations to the past [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 53]] [[source/antliff-2002|p. 152]].

  As an organised movement Futurism is considered to have ended with Marinetti's death in 1944; many Futurists had difficulty in their careers after the Second World War because of their association with the regime [[source/wikipedia-en-futurism|§ Legacy]] [[source/wikipedia-en-futurism|§ 1920s and 1930s]].
