public_id: 105300
name: Korean Neolithic
names:
  - lang: ko
    role: original
    text: 신석기 시대
  - lang: ko-Hani
    role: alternative
    text: 新石器時代
  - lang: en
    role: alternative
    text: Chulmun period
kind: period
period: -1495 or earlier
period_label: c. 10,000–1500 BCE
description_md: "**Dates.** In Korea the Neolithic is defined not by farming but by pottery, among people who still lived mainly by hunting, fishing and gathering. It begins about 10,000 BCE: the oldest pottery found so far, at Gosan-ri on Jeju island, dates to about 7500 BCE, and pottery probably appeared earlier still[[source/aks-neolithic|「서기전 7500년 전후의 절대연대를 갖는 제주 고산리 유적의 유기질혼입토기」]]. It ends about 1500 BCE, when a culture of rice farming and plain (mumun) pottery arrived[[source/aks-neolithic|「도작 농경과 무문토기를 주체로 하는 문화가 유입됨에 따라 종말을 맞이한다」]]. Portal (2000) still gives c. 6000–1000 BCE, before radiocarbon dates moved both ends back[[source/portal-2000|pp. 24, 29]]. Its start lies before 4713 BCE, the first date that can be stored here, so it stays open."
