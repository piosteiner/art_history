name: Unified Silla period
names:
  - lang: ko
    role: original
    text: 통일 신라
  - lang: ko-Hani
    role: alternative
    text: 統一新羅
kind: period
period: 668/935
description_md: "**Dates.** Its start has two dates: 668, when Goguryeo fell to the allied armies of Silla and Tang and the Three Kingdoms period ended[[source/aks-three-kingdoms|668년]][[source/portal-2000|p. 43]], or 676, when Silla, after five years of war against its former ally, drove the Tang armies from the peninsula[[source/aks-silla|「676년 최후의 승리를 거두었다」]]. It ends in November 935, when its last king, Gyeongsun, surrendered to Goryeo[[source/aks-silla|「경순왕은 935년 11월 고려에 자진 항복해」]]. Mason's timeline ends it already in 918, with the founding of Goryeo[[source/history-of-japanese-art|p. 392]], but Silla went on for 17 more years. Many Korean historians prefer the name “Northern and Southern States period”, which gives equal weight to Balhae in the north[[source/aks-northern-southern-states|남북국시대]]."
