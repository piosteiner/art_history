name: Post-Impressionism
kind: movement
period: 1886/1905
description_md: Umbrella term for artists who moved beyond Impressionism's naturalism towards expressive colour, structure and symbolism[[source/wikipedia-en-post-impressionism|“Post-Impressionism emerged as a reaction against Impressionists’ concern for the naturalistic depiction of light and colour. Its broad emphasis on abstract qualities or symbolic content …”]]; the critic Roger Fry first used it in 1906 and made it known with his exhibition *Manet and the Post-Impressionists* in 1910[[source/wikipedia-en-post-impressionism|“The term Post-Impressionism was first used by art critic Roger Fry in 1906.” · “Roger Fry used the term again when he organised the 1910 exhibition Manet and the Post-Impressionists”]].
