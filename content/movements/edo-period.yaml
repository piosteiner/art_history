public_id: 100018
name: Edo period
names: [Tokugawa period]
kind: period
period: 1603/1868
description_md: |-
  Japan under the Tokugawa shogunate, with Edo (Tokyo) as its political centre[[source/wikipedia-en-edo-period|“the period between 1600 or 1603 and 1868 in the history of Japan, when the country was under the rule of the Tokugawa shogunate”]][[source/wikipedia-en-ukiyo-e|“In 1603, the city of Edo (Tokyo) became the seat of the ruling Tokugawa shogunate”]].

  **Dates.** Here 1603–1868, the usual dates and those of Nabunken and the Tokyo National Museum[[source/nabunken-style-manual-2022|pp. 29–31]]: it begins with Tokugawa Ieyasu's appointment as shōgun on 24 March 1603 and ends with the change of era to Meiji on 23 October 1868[[source/wikipedia-ja-edo-jidai|1603年3月24日…から、1868年10月23日…]]. Other starts: 1600, Ieyasu's victory at Sekigahara (the Getty thesaurus); 1615, the fall of the Toyotomi at Osaka (Mason, the Kyoto National Museum). Other end: 1867, when the last shōgun, Yoshinobu, returned power to the emperor on 9 November (Taisei hōkan; the Nara National Museum)[[source/wikipedia-ja-taisei-hokan|慶応3年10月14日（1867年11月9日）]].
