    to: place/korean-peninsula
    period: -2000/-1000
    sources:
      - note: “Im Hyo-jae considers the period from 2000 to 1000 BC as the Late Neolithic, but Nelson calls this the Megalithic period, on the basis that the appearance of both megaliths and plain (mumun) pottery indicates a profound change in society” (p. 28)
        source: portal-2000
        locator: pp. 28–29
