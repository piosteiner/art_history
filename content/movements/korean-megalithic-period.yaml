description_md: "**Dates.** The millennium of megaliths (dolmens), stone-cist graves and plain (mumun) pottery: Im Hyo-jae counts it as the Late Neolithic, Sarah Nelson as a Megalithic period of its own, because these signal a profound change in society[[source/portal-2000|pp. 28–29]]."
