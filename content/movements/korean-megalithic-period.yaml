period: -2000/-1000
description_md: "**Dates.** It begins about 2000 BCE with dolmens and other megaliths, stone-cist graves and plain (mumun) pottery — for Im Hyo-jae the Late Neolithic, for Sarah Nelson a Megalithic period of its own, because these signal a profound change in society — and ends about 1000 BCE, when Korean-made bronzes begin the Bronze Age proper[[source/portal-2000|pp. 28–29]]."
