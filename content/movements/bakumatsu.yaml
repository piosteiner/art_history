description_md: "**Dates.** Usually counted from 1853, when Commodore Perry's warships forced Japan to give up its seclusion, to 1867, when the shogunate returned power to the emperor[[source/wikipedia-en-bakumatsu|“Between 1853 and 1867 …”]]; Mason names no first year and ends it with the fall of the shogunate in 1868[[source/history-of-japanese-art|p. 278]]."
