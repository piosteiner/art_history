period: 1392/1573
description_md: "**Dates.** Here in the narrower sense used by Mason and all four national institutions[[source/nabunken-style-manual-2022|pp. 29–31]]: it begins in 1392 with the reunion of the two courts, which ended the Nanbokuchō period, and ends in 1573, when Oda Nobunaga drove the last Ashikaga [[shogun]], Yoshiaki, out of Kyoto and the shogunate fell. In the wider sense it is the whole time of the Ashikaga shogunate, beginning in 1336 with Takauji's Kenmu code or in 1338 with his appointment as shōgun — the dates of the Getty thesaurus and Wikidata — and ending likewise in 1573; the narrowest reading also cuts off the Sengoku period from 1467 or 1493[[source/wikipedia-ja-muromachi-jidai|広義では…1336年…または…1338年…から…1573年]]."
