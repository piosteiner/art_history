public_id: 105301
name: Korean Palaeolithic
names:
  - lang: ko
    role: original
    text: 구석기 시대
  - lang: ko-Hani
    role: alternative
    text: 舊石器時代
kind: period
period_label: before c. 10,000 BCE
description_md: "**Dates.** It begins with the first humans and their stone tools on the peninsula — North Korean archaeologists claim about a million years for the Komunmoru cave, a date disputed[[source/aks-palaeolithic|「북한에서는 검은모루유적의 석기들을 1백만년 전의 것이라고 주장한다」]][[source/portal-2000|p. 23]]. It ends with the end of the Ice Age, when the Neolithic begins about 10,000 years ago[[source/aks-palaeolithic|「약 1만년 전에 신석기시대가 시작되기 전까지」]]; Portal puts the end at 10,000 BCE and notes the debate over a Mesolithic or a gap in settlement before the Neolithic[[source/portal-2000|p. 24]]. Dates before 4713 BCE cannot be stored here, so the period has a label only."
