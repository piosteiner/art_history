description_md: |-
  The ukiyo-e school that held a monopoly on Kabuki posters and programmes in Edo[[source/history-of-japanese-art|pp. 280–281]].

  **Dates.** It begins in 1687, when its founder Torii Kiyomoto (1645–1702), an actor of female roles, moved from Osaka to Edo and was asked to design a poster for a Kabuki theatre; Kiyonobu I and Kiyomasu I developed its vigorous actor prints, and Torii Kiyonaga (1752–1815) led it from 1785[[source/history-of-japanese-art|pp. 280–285]]. Mason follows it to the end of the 18th century; its end is left open here.
