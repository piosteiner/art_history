description_md: "**Dates.** A stage of stone-tool industries, not an event. Portal's dates are 100,000–40,000 BCE[[source/portal-2000|p. 23]]; the Encyclopedia of Korean Culture counts it from the beginning of the last glacial period, about 100,000 years ago, to the appearance of blade industries about 35,000 years ago[[source/aks-palaeolithic|「10만년 전에서 … 3만 5천년 전후한 시기까지」]]."
