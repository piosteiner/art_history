name: Kofun period
names:
  - lang: ja
    role: original
    text: "{古墳時代|こふんじだい}"
kind: period
period: 300/710
description_md: |-
  Defined by archaeology, after its burial mounds (kofun); it runs on through the first two historical periods, Asuka and Hakuhō[[source/history-of-japanese-art|p. 10]].

  **Dates.** Named after the burial mounds (kofun), above all the keyhole-shaped ones; it begins with their appearance in the 3rd century[[source/wikipedia-ja-kofun-jidai|「前方後円墳に代表される古墳が盛んに造られた時代」]]. Its end is open because tombs went on being built into the Asuka period: the 6th century (Nabunken, Kyoto) or the 7th (Tokyo, Nara)[[source/nabunken-style-manual-2022|pp. 29–31]]; Mason lets it run to 710.
