public_id: 105251
name: Kofun period
names:
  - lang: ja
    role: original
    text: "{古墳時代|こふんじだい}"
kind: period
period: 300/710
description_md: "**Dates.** Named after its burial mounds (kofun); it begins in the 3rd century with the appearance of the great keyhole-shaped tombs[[source/wikipedia-ja-kofun-jidai|「前方後円墳の出現を特徴とし…」]]. Its end depends on which tombs count: the late 6th century, when keyhole-shaped tombs ceased to be built (Nabunken, Kyoto); the 7th century, to include the smaller “terminal” tombs built on into the Asuka period (Tokyo, Nara)[[source/nabunken-style-manual-2022|pp. 29–31]][[source/wikipedia-ja-shumatsuki-kofun|「6世紀末には前方後円墳築造の時代が終焉を迎える…」]]; or 710 (Mason), letting the archaeological period run on through the Asuka and Hakuhō periods until the move to Heijō-kyō[[source/history-of-japanese-art|p. 10]]."
