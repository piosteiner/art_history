description_md: |-
  The Japanese folk-craft movement. Its leading thinker, [[person/yanagi-soetsu]] (1889–1961), held that true beauty could be achieved only in works that were functional and made of natural materials by anonymous craftspeople using traditional techniques — the old aesthetic of simplicity and austerity, [[wabi]] and [[sabi]], redefined in terms meaningful to the twentieth century. A reaction to the glitter of the crafts the Meiji government sent to the world’s fairs, it drew on a sense of national identity from a less aggressive, more liberal base; through it a great deal of Japan’s folk culture was preserved, and it helped prepare the system of National Treasures and Living National Treasures.[[source/history-of-japanese-art|pp. 345–346]] The idea is the glossary term [[mingei]].

  Yanagi came to it through the Korean ceramics of the Joseon period, made by “nameless craftsmen”; in 1925, after long talks with the potters [[artist/hamada-shoji]] and Kawai Kanjirō, the three coined the word mingei — from minshū, the common people, and kōgei, craft — which Yanagi translated as “folk craft”, not “folk art”. He declared the movement in 1926, published *Kōgei no michi* (The Way of Crafts) in 1928 and the magazine *Kōgei* from 1931, the year the Japan Folk Craft Association was founded; in 1936 he opened the Japan Folk Crafts Museum (Nihon Mingeikan) in Tokyo.[[source/wikipedia-en-mingei]]

  Hamada took up Yanagi’s idea of anonymous craftsmanship and never signed his work; he had spent 1920–1923 in St Ives helping the English potter [[artist/bernard-leach]], the third major figure of the movement, to set up his workshop, then settled at Mashiko north of Tokyo. His mature style — as in [[artwork/hamada-loop-dish|his dish with loop designs]] — attracted a legion of imitators and gave the movement a new direction.[[source/history-of-japanese-art|p. 354]] Mingei was the single prewar aesthetic movement that found immediate favour after 1945,[[source/history-of-japanese-art|p. 346]] giving the new traditionalism of the postwar years its liberal air: art comes from the people, village craft is valued as much as the work of the trained artist.[[source/history-of-japanese-art|pp. 379–380]] [[sosaku-hanga|Sōsaku hanga]] survived the war in part through its sympathy with it.[[source/history-of-japanese-art|pp. 386–387]]
