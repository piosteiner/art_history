    to: place/korean-peninsula
    period: c. 1500 BCE–c. 300 BCE
    sources:
      - note: “the Bronze Age proper (1000 BC–c. 300 BC), which is generally thought to have begun around 1000 BC with the appearance of Korean-made bronzes”
        source: portal-2000
        locator: p. 29
