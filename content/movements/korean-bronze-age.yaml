public_id: 105294
name: Korean Bronze Age
names:
  - lang: ko
    role: original
    text: 청동기 시대
  - lang: ko-Hani
    role: alternative
    text: 靑銅器時代
kind: period
period: c. 1500 BCE–c. 300 BCE
description_md: "**Dates.** The time of bronzes and plain (mumun) pottery, also called the “plain-pottery period”. In today's chronology of the Encyclopedia of Korean Culture its earliest phase, before the Liaoning-type bronze dagger, lies in the 15th–12th century BCE, its centre in the first half of the first millennium BCE, its late phase in the 5th–4th century BCE[[source/aks-bronze-age|「조기는 … 서기전 15~12세기경에 해당한다」]]; it gives way about 300 BCE to the Early Iron Age, when iron came into use[[source/aks-iron-age|「철기가 사용되기 시작한 서기전 300년경부터」]]. Portal (2000) begins it about 1000 BCE with the first Korean-made bronzes and counts the centuries before to a Late Neolithic or Megalithic period[[source/portal-2000|p. 29]]."
relationships:
