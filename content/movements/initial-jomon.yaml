description_md: "**Dates.** One of the six phases into which the Jōmon — too long to treat as one — is usually divided by the development of its pottery[[source/history-of-japanese-art|p. 14]]; its limits are changes in pottery and way of life, dated by radiocarbon, not events. Still small, mobile groups (about 20,000 people over both early phases); it ends about 5000 BCE, when the settled pit-house villages of the Early Jōmon appear[[source/history-of-japanese-art|pp. 15–16]]."
