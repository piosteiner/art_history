description_md: |-
  Cubo-Futurism (Russian *kubofuturizm*) was the main style of painting and sculpture among the Russian Futurists in the 1910s, combining the forms of French analytical [[movement/cubism|Cubism]] with the Italian [[movement/futurism|Futurist]] representation of movement [[source/wikipedia-en-cubo-futurism|§ Introduction]] [[source/wikipedia-en-futurism|§ Russian Futurism]].

  ## Name and origins

  The term first appeared in a lecture in 1913: the critic Korney Chukovsky used it for the poets of the Hylaea group around David and Vladimir Burliuk — Vladimir Mayakovsky, Aleksei Kruchonykh, Velimir Khlebnikov, Benedikt Livshits and Vasily Kamensky — before it came to mean painters influenced by both Cubism and Futurism [[source/wikipedia-en-cubo-futurism|§ Origin of the term]]. The circle went back to the Union of Youth of 1910, brought together by David Burliuk under the name *budetlyane* in response to Marinetti's Futurist manifesto of 1909 [[source/wikipedia-en-cubo-futurism|§ 'Hylea' and the impact of Marinetti's 'Futurist Manifesto]]. Collectors such as Sergei Shchukin and Ivan Morozov had made Cubist and Futurist works accessible to artists in Moscow and St Petersburg [[source/wikipedia-en-cubo-futurism|§ Impact of Russian art collectors]].

  ## Artists and works

  Natalia Goncharova applied Cubist and Futurist means as early as 1909; [[artist/kazimir-malevich|Kazimir Malevich]] called the works he showed at the "Donkey's Tail" (1912) and "Target" (1913) exhibitions "Cubo-Futurist" [[source/wikipedia-en-cubo-futurism|§ Development of the movement]]. Instead of the industrial scenes of the Italians, Malevich painted rural Russian subjects in this idiom; [[artwork/malevich-the-knifegrinder|*The Knifegrinder*]] (c. 1912–13) is the standard example, its flickering metallic planes turning the figure into part of a mechanical rhythm [[source/wikipedia-en-cubo-futurism|§ Development of the movement]] [[source/wikipedia-en-cubo-futurism|§ Art]]. Aleksandra Ekster and [[artist/ljubow-sergejewna-popowa|Lyubov Popova]], who painted in the style in 1913–14, belonged to a movement with an unusually large share of women painters compared with Italy [[source/wikipedia-en-cubo-futurism|§ Development of the movement]]. Poets and painters worked together on the opera *Victory over the Sun* (1913), with sets and costumes by Malevich [[source/wikipedia-en-cubo-futurism|§ Development of the movement]].

  ## Russian and Italian Futurism

  Like the Italians the Russian Futurists were fascinated by dynamism, speed and modern city life, but ideologically they were their opposite: many embraced the political and social visions of the emerging communist movement [[source/wikipedia-en-futurism|§ Russian Futurism]]. By 1914 they had turned hostile to the Italians, and Marinetti's lecture tour of Russia that year met with general unfriendliness [[source/wikipedia-en-cubo-futurism|§ Development of the movement]]. Golomstock: "Although war was hailed by Marinetti as 'the world's only hygiene', the First World War placed the Italian and Russian Futurists in ideologically opposed camps: the former joined the protagonists of nationalist war whereas the latter were pacifists and internationalists" — the seminar showed this with Malevich's *Knife Grinder* [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 47]].

  ## End and afterlife

  Cubo-Futurism can be said to have ended with the 0,10 exhibition of 1915–16, where Malevich launched [[movement/suprematism|Suprematism]]; Gino Severini dated its end to 1916, the *Encyclopædia Britannica* has the style in use until about 1919 [[source/wikipedia-en-cubo-futurism|§ End of Cubo-Futurism]]. In the 1930s, after giving up abstraction, Malevich painted peasants in traditional clothes but still in a Futurist-Cubist form [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].
