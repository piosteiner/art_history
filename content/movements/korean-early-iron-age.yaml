description_md: "**Dates.** Portal's “300 BC–0”: there is no year 0, so it ends here with 1 BCE[[source/portal-2000|p. 38]]. Iron came with the Chinese commanderies in the north, but Choi Sung-rak sees an earlier, native iron industry in the south from the time of Wiman Chosŏn (194–108 BCE)[[source/portal-2000|pp. 38–40]]."
