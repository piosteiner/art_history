      - note: “This period is sometimes divided into the Early Iron Age (300 BC–0) and the Later Iron Age or Proto-Three Kingdoms period (0–AD 300). Choi Sung-rak divides it rather into four phases”
        source: portal-2000
        locator: p. 38
