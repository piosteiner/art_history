description_md: |-
  The hereditary school of painters to the shogunate, which combined Chinese ink-painting themes with the bold decorative manner of large wall and screen paintings[[source/history-of-japanese-art|pp. 228–229, 311]].

  **Dates.** It rose with Kanō Masanobu (1434–1530), official painter to the Ashikaga shogunate from 1481; his son Motonobu (1476–1559) formulated its style; Eitoku and, under the Tokugawa, Tanyū and the four Edo branches (oku eshi) set the standard of painting throughout the Edo period[[source/history-of-japanese-art|pp. 228–229, 311]]. It ended as the official school with the fall of the shogunate in 1868 — Kanō Hōgai fared badly after the Restoration until Fenollosa took him up[[source/history-of-japanese-art|p. 363]].
