description_md: |-
  The Kyoto school of Edo-period realism: drawing from life, Western ideas of space and the tsuketate brushwork, applied to traditional Japanese formats[[source/history-of-japanese-art|pp. 318–322]].

  **Dates.** Founded by Maruyama Ōkyo (1733–95); after his death in 1795 his friend Matsumura Goshun founded the Shijō school, named after the fourth ward of Kyoto where his studio stood, and the style flourished throughout the rest of the Edo period[[source/history-of-japanese-art|pp. 319, 322]]; Kyoto's nihonga of the 20th century grew out of it[[source/history-of-japanese-art|p. 369]].
