description_md: |-
  The most prolific school of ukiyo-e prints in the 19th century[[source/history-of-japanese-art|p. 288]].

  **Dates.** Founded in the late 1700s by Utagawa Toyoharu (1735–1814), a painter of perspective pictures (uki-e) whose greatest gift was teaching; his studio produced Toyokuni I (1769–1825), Kuniyoshi (1798–1861) and, through Toyohiro, Hiroshige (1797–1858), and so carried the school through the 19th century[[source/history-of-japanese-art|pp. 288, 292]].
