kind: school
period: 17th century–19th century
description_md: |-
  A school of decorative painting and design — bright colours, gold and silver grounds, flattened and stylised motifs from classical poetry and the seasons — that shaped not only painting but lacquer, ceramics and textiles. It is not a family lineage like the Kanō or Tosa but an association of shared aesthetic values; its name comes from the second syllable of Ogata Kōrin's name[[source/history-of-japanese-art|pp. 312–313]].

  **Dates.** It traces its origins to Hon'ami Kōetsu and Tawaraya Sōtatsu in Kyoto in the early 17th century — Kōetsu's artists' community at Takagamine from 1615[[source/history-of-japanese-art|pp. 238–239]] — was revitalised by Ogata Kōrin (1658–1716) around 1700 and revived in Edo by Sakai Hōitsu, who held a ceremony for the centenary of Kōrin's death in 1815; his follower Suzuki Kiitsu (1796–1858) carried it into the mid-19th century[[source/history-of-japanese-art|pp. 312–317]]. It lived on in the nihonga of the 20th century[[source/history-of-japanese-art|pp. 345, 365]].
