public_id: 105303
name: Three Kingdoms period (Korea)
names:
  - lang: ko
    role: original
    text: 삼국 시대
  - lang: ko-Hani
    role: alternative
    text: 三國時代
kind: period
period: c. 300–668
description_md: "**Dates.** Goguryeo in the north, Baekje in the southwest and Silla in the southeast — at first four, with the Gaya confederation, which Silla absorbed in 532[[source/portal-2000|p. 43]]. Its start depends on the evidence: usually the 4th century, when the three had completed the institutions of ancient states; some include their formation and the old histories' founding dates — 57 BCE (Silla), 37 BCE (Goguryeo), 18 BCE (Baekje), 42 CE (Gaya)[[source/aks-three-kingdoms|「4세기 이후부터 신라의 삼국통일까지를 의미하는 것이 일반적」]][[source/portal-2000|p. 43]]. It ends in 668, when the allied armies of Silla and Tang took Pyongyang and Goguryeo fell[[source/aks-three-kingdoms|「668년 … 고구려의 평양성이 함락되었다 … 이로써 삼국시대는 종결되었다」]]."
relationships:
  - type: active_in
    to: place/korean-peninsula
    period: c. 300–668
    sources:
      - note: "“the Three Kingdoms period (c. AD 300–668)” · “Specific dates … have been traditionally assigned to the foundation of each of the Three Kingdoms: Koguryo in 37 BC, Paekche in 18 BC and Silla in 57 BC. The corresponding date for Kaya is AD 42. Modern scholarship … is moving towards a re-assessment of these dates … a Three Kingdoms period from c. AD 300 which ended in AD 668 in the unification of the peninsula under Silla. These issues remain controversial.”"
        source: portal-2000
        locator: p. 43
