    text: "{縄文時代|じょうもんじだい}"
kind: period
period: -395 or earlier
period_label: c. 11,000–400 BCE
description_md: "**Dates.** Both ends are archaeological, not events: the period begins with the first pottery and ends where wet-rice farming and metal tools of the Yayoi culture take over, so its dates move with new radiocarbon results — the start is now usually put at about 16,000 years ago[[source/wikipedia-ja-jomon-jidai|「始期に関しては一般的に1万6000±850年前と考えられている」]]. Mason gives c. 11,000–400 BCE; the national institutions differ: Nabunken ca. 14,000–800 BCE, the Tokyo National Museum ca. 11,000 BCE–5th century BCE, Kyoto and Nara before 10,000 BCE to about the 5th century BCE[[source/nabunken-style-manual-2022|pp. 29–31]]. Dates before 4713 BCE cannot be stored here, so the start stays open."
