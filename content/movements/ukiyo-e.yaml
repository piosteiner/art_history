name: Ukiyo-e
names: [浮世絵, pictures of the floating world]
kind: school
parent: edo-period
period: 17th–19th century
description_md: |-
  Japanese genre of woodblock prints and paintings — landscapes, actors, beauties, tales[[source/wikipedia-en-ukiyo-e|“Its artists produced woodblock prints and paintings of such subjects as female beauties; kabuki actors and sumo wrestlers; scenes from history and folk tales; travel scenes and landscapes …”]].
  Its flat colour and bold composition fed directly into European *Japonisme*[[source/wikipedia-en-ukiyo-e|“From the 1870s onward, Japonisme became a prominent trend and had a strong influence on the early French Impressionists … as well as influencing Post-Impressionists such as Vincent van Gogh”]].
