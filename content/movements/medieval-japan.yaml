period: 1185/1573
description_md: "**Dates.** Mason's “Mediaeval period” groups the Kamakura, Nanbokuchō and Muromachi periods[[source/history-of-japanese-art|pp. 10, 392]]: it begins in 1185, when the samurai under Minamoto no Yoritomo took the real power and the [[shogun]] became the title with which it lay[[source/history-of-japanese-art|pp. 168–169]], and ends in 1573 with the fall of the Ashikaga shogunate; what follows, from the Momoyama period, Mason calls Early Modern[[source/history-of-japanese-art|pp. 234–235]]. Nabunken's “Feudal Japan” is the same epoch, dated by centuries (ca. 12th–16th century)[[source/nabunken-style-manual-2022|pp. 29–31]]."
relationships:
