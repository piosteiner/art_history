description_md: |-
  The Nara school of Buddhist sculptors whose hallmarks were realism and a classicism learnt from the sculpture of the 8th century; its masters were Unkei and Kaikei[[source/history-of-japanese-art|pp. 188–189]].

  **Dates.** It traced its origins to the sculptor Raijō (1044–1119), a second-generation disciple of Jōchō; it came into its own in the Kamakura period with the rebuilding of Tōdaiji and Kōfukuji after the Genpei War[[source/history-of-japanese-art|pp. 186–189]].
