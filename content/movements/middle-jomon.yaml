period: c. 2500 BCE–c. 1500 BCE
description_md: "**Dates.** One of the six phases into which the Jōmon — too long to treat as one — is usually divided by the development of its pottery[[source/history-of-japanese-art|p. 14]]; its limits are changes in pottery and way of life, dated by radiocarbon, not events. The time of the largest settled communities and the most exuberant pottery, from about 2500 BCE; it ends about 1500 BCE, when many Middle Jōmon settlements were abandoned and the population shifted[[source/history-of-japanese-art|pp. 18, 20]]."
