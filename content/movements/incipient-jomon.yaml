description_md: "**Dates.** One of the six phases into which the Jōmon — too long to treat as one — is usually divided by the development of its pottery[[source/history-of-japanese-art|p. 14]]; its limits are changes in pottery and way of life, dated by radiocarbon, not events. It begins with the earliest pottery — small, round-based vessels suited to a mobile life — and gives way to the Initial phase about 8000 BCE[[source/history-of-japanese-art|p. 15]]."
