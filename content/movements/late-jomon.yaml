description_md: "**Dates.** One of the six phases into which the Jōmon — too long to treat as one — is usually divided by the development of its pottery[[source/history-of-japanese-art|p. 14]]; its limits are changes in pottery and way of life, dated by radiocarbon, not events. It begins about 1500 BCE with that shift of settlement and ends about 1000 BCE with the Final phase[[source/history-of-japanese-art|p. 20]]."
