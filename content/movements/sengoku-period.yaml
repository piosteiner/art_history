      note: 「戦国時代は、一般的に15世紀後半から16世紀後半、応仁の乱（…1467年 - 1477年）から織田信長の上洛（永禄11年、1568年）までの期間とされている」 · 「室町幕府が滅亡した天正元年（1573年）を下限とする見解などがある」 · 「畿内では明応2年（1493年）の明応の政変を戦国時代の始期とし」 · 「関東地方では、享徳3年（1455年）に勃発した享徳の乱によって…天正18年（1590年）の…小田原征伐によって戦国時代が終わった」
