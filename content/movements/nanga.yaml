description_md: |-
  Japanese painting after the ideal of the Chinese scholar-amateurs (see [[bunjinga]]): landscapes and the “four gentlemen” in ink and light colour, learnt largely from Chinese printed manuals such as the Mustard-Seed Garden Manual of Painting[[source/history-of-japanese-art|pp. 326–327]].

  **Dates.** A native school calling itself bunjinga arose only in the early 18th century, with Gion Nankai (1677–1751), Yanagisawa Kien and Sakaki Hyakusen; its great masters were Ike Taiga and Yosa Buson, followed in the 19th century by Uragami Gyokudō, Tanomura Chikuden and Tani Bunchō[[source/history-of-japanese-art|pp. 326–343]]. In the Meiji period it continued with Tomioka Tessai (1837–1924) but lost ground to yōga and nihonga[[source/history-of-japanese-art|p. 361]].
