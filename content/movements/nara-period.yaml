period: 710/794
description_md: "**Dates.** It begins in 710, when Empress Genmei moved the capital to Heijō-kyō (Nara)[[source/history-of-japanese-art|pp. 40–41]], and ends in 794, when Emperor Kanmu moved it to Heian-kyō — after an interim at Nagaoka-kyō from 784[[source/wikipedia-en-nara-period|“Empress Genmei established the capital of Heijō-kyō”]]. All sources agree[[source/nabunken-style-manual-2022|pp. 29–31]]."
