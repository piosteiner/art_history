name: Proto-Three Kingdoms period
names:
  - lang: ko
    role: original
    text: 원삼국 시대
  - lang: ko-Hani
    role: alternative
    text: 原三國時代
  - lang: en
    role: alternative
    text: Later Iron Age (Korea)
kind: period
period: 1–c. 300
description_md: "**Dates.** A term proposed by the archaeologist Kim Won-yong for the formative stage of the Three Kingdoms, between the archaeologists' “Iron Age II” and the historians' “Samhan” or “early Three Kingdoms”[[source/aks-proto-three-kingdoms|「고고학자 김원용이 ‘원삼국시대’의 사용을 제안하였다」]]. It begins at the turn of the era (or about 100 BCE) — the conventional division of the Iron Age, not an event — and ends about 300 CE, when the kingdoms had formed as states[[source/aks-iron-age|「서기 전후(혹은 서기전 100년)부터 서기 300년까지」]][[source/portal-2000|pp. 38, 43]]."
