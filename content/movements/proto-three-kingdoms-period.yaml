description_md: "**Dates.** It begins with the Common Era — the conventional division of the Iron Age, not an event — and ends about 300 CE, when, by archaeological and documentary evidence, the kingdoms of Goguryeo, Baekje and Silla had formed as states; modern scholarship puts it in place of the traditional founding dates[[source/portal-2000|pp. 38, 43]]."
