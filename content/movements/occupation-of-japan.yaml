description_md: "**Dates.** Japan under Allied (American) administration after the Second World War: from the surrender on 2 September 1945 to 28 April 1952, when the Treaty of San Francisco came into force and Japan regained its sovereignty[[source/wikipedia-en-occupation-of-japan|“from the surrender … on September 2, 1945 … until the Treaty of San Francisco took effect on April 28, 1952”]]. Mason marks it as a period of its own, 1945–1952, at whose end Japanese architecture and the arts were “once again finding [their] feet”[[source/history-of-japanese-art|pp. 351, 392]]."
