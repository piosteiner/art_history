public_id: 101097
name: Meiji era
kind: period
period: 1868-10-23/1912-07-30
description_md: "**Dates.** It begins on 23 October 1868, when the era was changed to Meiji with the edict that each emperor should have a single era name[[source/history-of-japanese-art|pp. 252, 342–343]][[source/wikipedia-ja-edo-jidai|1868年10月23日…「一世一元の詔」]], and ends with Emperor Meiji's death on 30 July 1912[[source/wikipedia-en-meiji-era|“from October 23, 1868, to July 30, 1912”]]. All the institutions agree[[source/nabunken-style-manual-2022|pp. 29–31]]; Mason's preface has 1911, her chapter 7 1912."
