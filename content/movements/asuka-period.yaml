kind: period
period: 552/645
description_md: "**Dates.** Here after Mason: from 552, the official introduction of Buddhism from Paekche (another tradition gives 538), to the coup of 645 that opened the Taika Reform; the years to 710 are then the Hakuhō period of art history[[source/history-of-japanese-art|p. 10]][[source/wikipedia-ja-asuka-jidai|552年…或いは538年…仏教が公伝]]. The national institutions date Asuka 592/593–710 and have no Hakuhō period[[source/nabunken-style-manual-2022|pp. 29–31]]: 592 (Sushun 5, whose 12th month falls in 593 by the Western calendar), when the court was seated at Asuka, or 593, when Prince Shōtoku became regent, to 710, the move to Heijō-kyō[[source/wikipedia-ja-asuka-jidai|崇峻天皇5年（592年…）から和銅3年（710年）]]."
