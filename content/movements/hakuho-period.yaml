description_md: "**Dates.** An art-historical division after Mason: it begins with the coup of 645 that opened the Taika Reform and ends in 710 with the move of the capital to Heijō-kyō[[source/history-of-japanese-art|p. 10]]. The national institutions count these years to the Asuka period (592/593–710)[[source/nabunken-style-manual-2022|pp. 29–31]]."
