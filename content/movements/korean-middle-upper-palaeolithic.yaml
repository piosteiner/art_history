name: Middle–Upper Palaeolithic (Korea)
kind: period
parent: korean-palaeolithic
period_label: 40,000–10,000 BCE
description_md: "**Dates.** A stage of stone-tool industries, not an event: from about 40,000 BCE (Portal) — the Encyclopedia of Korean Culture puts the arrival of the Upper Palaeolithic blade industries with modern humans at about 35,000 years ago[[source/aks-palaeolithic|「한반도에는 대체로 3만 5천년 전에 현생인류의 출현과 같은 시기에 유입된 것으로 추정된다」]] — to the end of the Pleistocene about 10,000 BCE, when the grey deer and reindeer shown at Sokchang-ri died out as the climate grew warmer[[source/portal-2000|p. 24]]."
