description_md: |-
  Suprematism is the abstract art founded by [[artist/kazimir-malevich|Kazimir Malevich]], based on "the supremacy of pure artistic feeling" and on the fundamental forms of geometry — the square, the circle, the rectangle — in a limited range of colours [[source/wikipedia-en-suprematism|introduction]].

  ## Beginning

  The movement was announced at the Last Futurist Exhibition *0,10* in Petrograd in 1915, where Malevich and his group showed works in the new style [[source/wikipedia-en-suprematism|introduction]]. Its centrepiece was the [[artwork/black-square-1915|Black Square]], hung in the "beautiful corner" where the main icon hangs in an Orthodox house [[source/wikipedia-en-suprematism|§ Birth of the movement]]. Malevich traced its birth to his designs for the opera *Victory over the Sun* (1913), whose stage curtain was a black square [[source/wikipedia-en-suprematism|§ Influences on the movement]]. Among his group were Aleksandra Ekster, Liubov Popova, Olga Rozanova, Ivan Kliun, Ivan Puni and Nadezhda Udaltsova; their journal *Supremus* was planned but never appeared [[source/wikipedia-en-suprematism|introduction]].

  ## Art from nothing

  In Groys's reading Suprematism arises from removing all remnants of traditional representation from the picture, leaving the *Black Square* as a sign of pure nonobjectivity [[source/groys-1994|p. 148]]. Creativity becomes deletion: for Malevich destruction coincides with creativity, which is why he cared little for museums and the monuments of the past [[source/groys-1994|p. 149]]. In his essay "On the Museum" he even urged the Soviet authorities not to hinder the ruin of old art [[source/groys-1994|p. 147]]. In the seminar the *Black Square* was the starting point of art from nothing, in line with the new power [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].

  Unlike Constructivism, with its cult of the useful object, Suprematism was anti-materialist and anti-utilitarian [[source/wikipedia-en-suprematism|§ Difference from Constructivism]]. [[artist/el-lissitzky|El Lissitzky]] carried it to the West, turning it into his *Prouns* [[source/wikipedia-en-suprematism|§ El Lissitzky: Bridge to the West]].

  ## Under Stalin

  From the late 1920s the avant-garde came under harsh attack, and in 1934 socialist realism became official policy and prohibited abstraction ([[movement/socialist-realism]]) [[source/wikipedia-en-suprematism|§ Social context]]. Malevich painted his self-portrait of 1933 in the traditional manner but signed it with a tiny black square [[source/wikipedia-en-suprematism|§ Social context]]. After 1924 he lost his state positions and in the 1930s gave up abstraction [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].
