description_md: The kingdom of the south-east around Kyŏngju, founded by tradition in 57 BCE, which absorbed Kaya in 532–562 and, allied with Tang China, conquered Paekche and Koguryŏ to unify most of the peninsula in 668 (Unified Silla, 668–935). [[source/portal-2000|pp. 43, 58–59, 68]]
