description_md: The kingdom of the south-west, founded by tradition in 18 BCE, with its capitals at Hansŏng, Ungjin (Kongju) and from 538 Sabi (Puyŏ); in close contact with the Southern Dynasties of China and with Japan, to which it brought Buddhism. Conquered by Silla and Tang China in 660. [[source/portal-2000|pp. 50–55]]
