description_md: The northernmost of the Three Kingdoms, founded by tradition in 37 BCE, with its capitals at Kungnae-sŏng (Ji’an) and from 427 at P’yŏngyang; its greatest king, Kwanggaet’o (391–413), ruled Manchuria and the north of the peninsula. Conquered by Silla and Tang China in 668. [[source/portal-2000|pp. 43–49]]
