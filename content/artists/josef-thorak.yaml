biography_md: |-
  Austrian-German sculptor, known for oversized monumental sculptures, above all of male figures, and one of the most prominent sculptors of the Third Reich [[source/wikipedia-en-josef-thorak|introduction]].

  ## Life and early work

  Thorak was born in Vienna on 7 February 1889; after an apprenticeship as a potter and classes with the sculptor Anton Hanak, he studied sculpture at the Academy of Fine Arts in Vienna from 1911 to 1915, interrupted by war service [[source/wikipedia-en-josef-thorak|§ Early life and education]]. He then worked in a studio under Ludwig Manzel at the Prussian Academy of Arts in Berlin and joined the Berlin Secession in 1917; expressionist influences can be seen in his generally neoclassical style [[source/wikipedia-en-josef-thorak|§ Early life and education]]. In the 1920s he lived mainly on commissions for soldiers' cemetery monuments, and the museum director Wilhelm von Bode wrote a monograph on him in 1929 [[source/wikipedia-en-josef-thorak|§ Career]].

  ## Sculptor of the Third Reich

  After 1933 Thorak profited from friendships with prominent members of the party: he sculpted busts of Joseph Goebbels, Atatürk and Piłsudski, Hindenburg's death mask in 1934, and in 1936 a bust of Hitler at the Obersalzberg; Alfred Rosenberg arranged a solo exhibition for him in 1935 [[source/wikipedia-en-josef-thorak|§ Career]]. With [[artist/arno-breker|Arno Breker]] he became one of the two "official sculptors" of the Third Reich; in 1937 he was appointed professor of sculpture at the Munich Academy, and in 1939 Hitler had a studio built for him in Baldham to a design by Albert Speer [[source/wikipedia-en-josef-thorak|§ Career]]. After a studio visit in 1937, Goebbels called him "our greatest sculptural talent"; for his muscular neoclassical nudes he was nicknamed "Professor Thorax" [[source/wikipedia-en-josef-thorak|§ Career]]. His best-known works of these years include [[artwork/thorak-the-family|The Family]] and *Comradeship*, colossal groups outside the German pavilion at the [[event/paris-international-exposition-1937|Paris International Exposition of 1937]], a boxer modelled on Max Schmeling for the Olympic grounds in Berlin (1936), and the unfinished *Monument to Work* for the Reichsautobahn [[source/wikipedia-en-josef-thorak|§ Works]]. In 1943 he acquired Schloss Prielau, which had been seized from the family of Hugo von Hofmannsthal because of their Jewish ancestry [[source/wikipedia-en-josef-thorak|§ Career]].

  The preference for sculpture in Nazi Germany is part of the wider picture: sculpture and architecture were the preferred genres of the Third Reich [[source/peters-2017|p. 14]].

  ## After 1945

  After the war Thorak made decorative ceramics and religious sculpture; he was declared denazified in 1948, held a final exhibition at the Mirabell Palace in Salzburg in 1951, and died in Bad Endorf in Bavaria in February 1952 [[source/wikipedia-en-josef-thorak|§ Later life and death]].
