biography_md: |-
  German painter and printmaker, noted for harshly realistic depictions of German society in the Weimar Republic and of the brutality of war; with [[artist/george-grosz|George Grosz]] and [[artist/max-beckmann|Max Beckmann]] he is counted among the most important artists of the [[movement/new-objectivity|Neue Sachlichkeit]] [[source/wikipedia-en-otto-dix|introduction]].

  ## Life

  Dix was born in Untermhaus, now part of Gera in Thuringia, the son of an iron-foundry worker; after an apprenticeship with the painter Carl Senff (1906–1910) he entered the Kunstgewerbeschule in Dresden in 1910 [[source/wikipedia-en-otto-dix|§ Early life and education]]. He volunteered for the German army in 1914, served as a non-commissioned officer of a machine-gun unit on the Western Front, took part in the Battle of the Somme, and was wounded in the neck in August 1918 [[source/wikipedia-en-otto-dix|§ World War I service]]. The war marked his work for good: it led to the portfolio of fifty etchings *Der Krieg* (1924) and to the triptych [[artwork/dix-der-krieg|Der Krieg]], painted 1929–1932 [[source/wikipedia-en-otto-dix|§ World War I service]].

  After the war Dix studied in Dresden, co-founded the Dresden Secession in 1919, met Grosz in 1920 and, influenced by [[movement/dada|Dada]], began using collage, showing works at the First International Dada Fair in Berlin [[source/wikipedia-en-otto-dix|§ Post-war artwork]]. From the mid-1920s he painted in an increasingly realistic manner, with thin oil glazes over tempera in the way of the old masters; his painting *The Trench* (1923), showing the dismembered bodies of soldiers, was hidden behind a curtain by the Wallraf-Richartz Museum, and in 1925 the mayor of Cologne, Konrad Adenauer, cancelled its purchase [[source/wikipedia-en-otto-dix|§ Post-war artwork]]. He took part in the Neue Sachlichkeit exhibition in Mannheim in 1925, and his pictures of legless and disfigured veterans showed their forgotten place in German society [[source/wikipedia-en-otto-dix|§ Post-war artwork]].

  ## Under National Socialism

  The völkisch German Art Society had singled out Dix as "degenerate" before 1933; in April 1933 he was dismissed as professor of painting at the Dresden Academy for a "violation of the moral sensibilities" of the nation and later moved to Lake Constance [[source/wikipedia-en-otto-dix|§ The Nazis and World War II]]. Hermand counts him among the artists who did not emigrate and were "ruthlessly removed from their positions and honorary posts" [[source/hermand-1994|p. 37]]. In the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] of 1937 his antiwar themes were shown in a conventional, crowded two-row hanging in rooms beside those of Nolde, the Brücke and Klee [[source/peters-2017|p. 24]]; *The Trench* and *War Cripples* were among the works exhibited [[source/wikipedia-en-otto-dix|§ The Nazis and World War II]]. Paintings by Dix were among the twenty-one works from German museums that the [[institution/kunstmuseum-basel|Kunstmuseum Basel]] acquired between April 1939 and spring 1940 [[source/peters-2017|p. 29]]. As a compulsory member of the Reich Chamber of Fine Arts he had to promise to paint only inoffensive landscapes; in 1939 he was briefly arrested, and at the end of the war, conscripted into the Volkssturm, he was taken prisoner by French troops and released in February 1946 [[source/wikipedia-en-otto-dix|§ The Nazis and World War II]].

  After the war Dix painted mostly religious allegories and scenes of post-war suffering, received honours in both German states, and died on 25 July 1969 in Singen am Hohentwiel [[source/wikipedia-en-otto-dix|§ Later life and death]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed Dix's war triptych as an example of how, after the First World War, war was often shown in its gruesome aspects [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 18; class notes, 24 September 2024]], and his [[artwork/dix-die-skatspieler|Skat Players]] with Éric Michaud's reading of his soldiers as "a frightening mix of wounded flesh, metal pieces, and tubes" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 64]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 93]]. "Otto Dix and the Degenerate Art Exhibition (1937)" was one of its examples of the relation between works and exhibitions under the regimes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 67]].
