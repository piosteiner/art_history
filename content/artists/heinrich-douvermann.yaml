biography_md: |-
  Heinrich (Henrick) Douvermann or Douwerman, a German woodcarver, born perhaps about 1480, possibly in Dinslaken, and died in Kalkar in 1543 or 1544; he is one of the best-known Lower Rhenish artists of his time.[[source/wikipedia-de-heinrich-douvermann|introduction]]

  ## Life

  The sources on his life are scant: his birth year can only be inferred from his journeyman years, and Dinslaken as his birthplace rests on weak evidence.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] Before 1506 he left the workshop of Dries Holthuys in Cleves, where he had probably trained alongside his rival Henrik van Holt, with whom older literature confused him.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] After travels whose destinations are unknown — Ulm, Flanders and the northern Netherlands have been suggested — he set up a workshop in Cleves about 1510 and married; the records there document mainly his considerable debts, which may explain why he left.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] By 1517 at the latest he was a citizen of Kalkar, where in 1518 he received the commission for the [[artwork/douwerman-sieben-schmerzen-altar-kalkar|Seven Sorrows retable]] of St. Nicolai, consecrated in 1522 — his only authenticated work made entirely in his workshop and the basis for all other attributions.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]]

  ## Work

  With his teacher Dries Holthuys, his contemporary Henrik van Holt and his pupil Arnt van Tricht he is one of the leading sculptors, working mainly in oak, who shaped the art of the lower left Lower Rhine between Cleves, Kalkar and Xanten at the transition from late Gothic to Renaissance; his rank rests on his virtuosity, the many viewpoints and varied forms of his figures and his independent iconographic invention.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] Research in the 1990s considerably reduced the list of works attributed to him.[[source/wikipedia-de-heinrich-douvermann|§ Die einzelnen Werke]] He is described as one of the great masters of sculpture in visible, unpainted wood, usually with reference to the [[artwork/douwerman-sieben-schmerzen-altar-predella|Root of Jesse in the predella]] of the Kalkar retable, though at least as many of his carvings are or were painted.[[source/wikipedia-de-heinrich-douvermann|§ Die einzelnen Werke]] Other works include a Mary Magdalene and a St John the Baptist in Kalkar, crucifixes in Griethausen, Aachen and Kempen, a St Margaret in Berlin, a St Christopher in Utrecht, the predella of the Marienaltar in Xanten (about 1535) and an enthroned Madonna in the Musée de Cluny, Paris (about 1540).[[source/wikipedia-de-heinrich-douvermann|§ Die einzelnen Werke]] The lecture "Aus dem Wald" made the Kalkar retable the case study of its first session.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]]
