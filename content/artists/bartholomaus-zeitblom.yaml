biography_md: |-
  German painter (about 1450 – about 1519), the leading master of the school of Ulm, recorded there from 1482 to 1518.[[source/wikipedia-en-bartholomaus-zeitblom|§ introduction]] He was born in Nördlingen and was the pupil and son-in-law of Hans Schüchlein.[[source/wikipedia-en-bartholomaus-zeitblom|§ Biography]] His paintings are noted for clear, cool, delicate colour and restrained single figures.[[source/wikipedia-en-bartholomaus-zeitblom|§ Biography]]

  For the high altarpiece of Blaubeuren abbey (1491–1494) he painted, with [[artist/bernhard-strigel|Bernhard Strigel]], the Passion scenes of the closed wings and the sixteen scenes from the life of John the Baptist, and his workshop painted and gilded [[artist/michel-erhart|Michel Erhart]]'s carved figures.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36, 39–41, 63]] In his workshop the same painters worked on panels and on sculpture – the lecture compared eyes and mouths on panels and on carved figures from the retable of the castle chapel at Kilchberg near Tübingen (about 1494).[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 65]] Other works include the altarpiece of Heerberg (1497), panels of the Eschach altarpiece (1495) and four panels of the legend of Saint Valentine in Augsburg.[[source/wikipedia-en-bartholomaus-zeitblom|§ Biography]]
