biography_md: |-
  French painter, born in Ornans in the Doubs on 10 June 1819, who led the Realism movement in nineteenth-century French painting; committed to painting only what he could see, he rejected academic convention and the Romanticism of the previous generation [[source/wikipedia-en-gustave-courbet|introduction; § Biography]].

  ## Realism

  Courbet came to Paris in 1839, soon left the studio of Steuben and Hesse, and taught himself by copying Spanish, Flemish and French masters in the Louvre; trips to the Netherlands and Belgium in 1846–1847 strengthened his conviction that painters should portray the life around them [[source/wikipedia-en-gustave-courbet|§ Biography]]. His first Salon success, *After Dinner at Ornans*, won a gold medal in 1849 and was bought by the state [[source/wikipedia-en-gustave-courbet|§ Biography]]. His paintings of the late 1840s and early 1850s challenged convention by showing unidealised peasants and workers on a scale traditionally reserved for religious or historical subjects [[source/wikipedia-en-gustave-courbet|introduction]]. History painting did not interest him; the only source for living art, he held, was the artist's own experience, and his work, with that of [[artist/honore-daumier|Honoré Daumier]] and [[artist/jean-francois-millet|Jean-François Millet]], became known as [[movement/french-realism|Realism]] [[source/wikipedia-en-gustave-courbet|§ Realism]]. [[artwork/the-stone-breakers|The Stone Breakers]] (1849) caused a sensation at the Paris Salon of 1850, and [[artwork/a-burial-at-ornans|A Burial at Ornans]] was judged, in Sarah Faunce's words, "like an upstart in dirty boots crashing a genteel party" [[source/wikipedia-en-gustave-courbet|§ The Stone Breakers; § A Burial at Ornans]]. When the Exposition Universelle of 1855 rejected *A Burial at Ornans* and [[artwork/the-painter-s-studio|The Artist's Studio]], he showed forty of his paintings in his own Pavilion of Realism next door [[source/wikipedia-en-gustave-courbet|§ The Artist's Studio]]. Courbet associated his realism with political anarchism; [[person/pierre-joseph-proudhon|Pierre-Joseph Proudhon]] admired *The Stone Breakers* as an icon of peasant life [[source/wikipedia-en-gustave-courbet|§ Biography; § A Burial at Ornans]].

  ## The Commune and exile

  During the Paris Commune of 1871 Courbet organised a Federation of Artists; having earlier proposed that the Vendôme Column be taken down, he was imprisoned for six months after the Commune, and in 1873, when the new government decided to rebuild the column at his expense, he went into exile in Switzerland [[source/wikipedia-en-gustave-courbet|introduction; § Courbet and the Paris Commune; § Exile and death]]. There he took part in Swiss exhibitions, was watched by the Swiss intelligence service, and inspired younger artists such as [[artist/auguste-baud-bovy|Auguste Baud-Bovy]] and [[artist/ferdinand-hodler|Ferdinand Hodler]] [[source/wikipedia-en-gustave-courbet|§ Exile and death]]. He died in La Tour-de-Peilz on 31 December 1877, a day before the first instalment for the column was due [[source/wikipedia-en-gustave-courbet|§ Exile and death]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed *The Stone Breakers* beside [[artist/caravaggio|Caravaggio]]'s [[artwork/madonna-di-loreto|Pilgrims' Madonna]] as a reminder of the traditions of realism on which the official art of the regimes drew [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 24]].
