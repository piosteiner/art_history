biography_md: |-
  Sir Peter Paul Rubens (28 June 1577 – 30 May 1640), a Flemish painter and diplomat, the most influential artist of the Flemish Baroque.[[source/wikipedia-en-peter-paul-rubens|introduction]] His dynamic compositions, full of movement, colour and sensuality, draw on classical and Christian history; he painted altarpieces, portraits, landscapes and history paintings of mythological and allegorical subjects and designed tapestry cartoons, prints and his own house.[[source/wikipedia-en-peter-paul-rubens|introduction]] Michael Jaffé's catalogue lists 1,403 works.[[source/wikipedia-en-peter-paul-rubens|introduction]] He was one of the last major artists to use wooden panels consistently, even for very large works, but painted on canvas when a work had to travel far.[[source/wikipedia-en-peter-paul-rubens|introduction]]

  ## Life

  Born in Siegen in Nassau to Antwerp parents in exile, he received a humanist education in Cologne and Antwerp and trained there with Tobias Verhaecht, Adam van Noort and Otto van Veen.[[source/wikipedia-en-peter-paul-rubens|§ Early life; § Apprenticeship]] From 1600 to 1608 he was in Italy, in the service of Duke Vincenzo I Gonzaga of Mantua, in Genoa and above all in Rome, where Caravaggio's naturalism impressed him and he painted the high altar of the Chiesa Nuova.[[source/wikipedia-en-peter-paul-rubens|§ Italy (1600–1608)]] Back in Antwerp he became court painter to the Archdukes Albert and Isabella in 1609, married Isabella Brant and built his house and studio, now the Rubenshuis; the *Raising of the Cross* (1610) and the *Descent from the Cross* (1611–1614) made him Flanders' leading painter.[[source/wikipedia-en-peter-paul-rubens|§ Antwerp (1609–1621)]] In the 1620s he painted the Marie de' Medici cycle for Paris and served the Spanish Habsburgs as a diplomat; Philip IV ennobled him and Charles I of England knighted him in 1630.[[source/wikipedia-en-peter-paul-rubens|§ Marie de' Medici Cycle and diplomatic missions (1621–1630)]] In 1630 he married Helena Fourment, and in 1635 bought the estate of Het Steen; he died of heart failure caused by gout in 1640 and is buried in St James' Church, Antwerp.[[source/wikipedia-en-peter-paul-rubens|§ Last decade (1630–1640); § Death]]

  ## In the lecture

  The lecture "Aus dem Wald" showed his [[artwork/rubens-romulus-und-remus|*Romulus and Remus discovered by the shepherd Faustulus*]] in the Capitoline Museums as an image of the sacred fig of Rome, the Ficus Ruminalis.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 72]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 75]]
