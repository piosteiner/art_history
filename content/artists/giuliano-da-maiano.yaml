biography_md: |-
  Giuliano da Maiano made the intarsia of the east and west walls of the Sagrestia delle Messe, the north sacristy of [[institution/florence-cathedral|Florence Cathedral]]: the east wall with the Annunciation, saints and prophets in 1463–1465, the west wall with the Nativity and the Presentation in the Temple in 1465–1468 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 26–27]]. Among the figures of the east wall are St Crescentius and the prophet Isaiah [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 30]]. The lecture marked the vanishing lines of the east wall to show its perspectival construction [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 33]] and compared his Annunciation with [[artwork/domenico-veneziano-annunciazione-fitzwilliam|Domenico Veneziano's predella panel]] of the same subject [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 74–76]].

  His Nativity was shown beside the green elf-cup fungus (Chlorociboria) and wood stained blue-green by it, the "green wood" that intarsia makers used [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 85–87]]. For the [[artwork/sagrestia-delle-messe-intarsie|panelling as a whole]] see there.
