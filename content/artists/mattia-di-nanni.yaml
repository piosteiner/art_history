biography_md: |-
  Mattia di Nanni was a Sienese intarsia maker of the early fifteenth century [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 45]]. In 1426–1430 he made a [[artwork/mattia-di-nanni-ciclo-sala-del-consiglio|cycle of intarsia panels]] with heroes of Roman history for the Sala del Consiglio of the [[institution/palazzo-pubblico|Palazzo Pubblico]] in Siena [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45–47]]. Two parts survive: a panel with [[artwork/mattia-di-nanni-tarsie-montreal|Manius Curius Dentatus, Pompey the Great and Mettius Curtius]] in Montreal and a figure of [[artwork/mattia-di-nanni-scipio-met|Scipio Africanus]] in the Metropolitan Museum of Art [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45–48]].

  His panels combine walnut with oak, poplar, dark bog oak, fruit wood or rosewood and bone [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45–48]] — a range that the lecture used to introduce the palette of Italian intarsia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]].
