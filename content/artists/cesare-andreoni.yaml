biography_md: |-
  Cesare Andreoni (1903–1961) was an Italian [[movement/futurism|Futurist]] painter and designer, born in [[place/milan|Milan]] on 30 June 1903 and died there on 1 July 1961; he lived and worked in Milan all his life [[source/wikipedia-it-cesare-andreoni|§ Biografia]].

  ## Life

  The son of a landowner, he broke off his classical schooling and from 1924 attended the [[institution/brera-academy|Brera Academy]] irregularly [[source/wikipedia-it-cesare-andreoni|§ Origini e formazione]]. Drawn to heroic adventure, he followed Gabriele D'Annunzio to Fiume in 1919 at the age of sixteen and later went to Africa with General Graziani from 1921 to 1923 [[source/wikipedia-it-cesare-andreoni|§ Origini e formazione]]. On 10 November 1924, during the first Futurist Congress in Milan, he asked to be admitted to the movement; [[person/filippo-tommaso-marinetti|Marinetti]] befriended him and repeatedly presented his work [[source/wikipedia-it-cesare-andreoni|§ L'adesione al Futurismo]].

  ## Work

  His Futurist painting passed through phases: the "mechanical aesthetic" of the 1920s (*La metropoli*, 1928–30; *Officina*, shown at the Venice Biennale of 1930), soft biomorphic forms around 1930–31 close to [[artist/enrico-prampolini|Prampolini]], and from 1931, when he signed the manifesto of [[movement/aeropittura|aeropittura]] with the Milanese Futurist group, lyrical aerial landscapes [[source/wikipedia-it-cesare-andreoni|§ Le fasi della pittura futurista di Andreoni]]. His last Futurist phase was an openly aviatory, documentary aeropainting tied to war — *La beffa di Addis Abeba* (1935–36), *La guerra di Spagna* (1936), *Frecce nere* (1937–38) [[source/wikipedia-it-cesare-andreoni|§ Le fasi della pittura futurista di Andreoni]]; [[artwork/andreoni-aeropainting-and-tanks|*Aeropainting and Tanks*]] (1936) belongs to these years [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 17]]. He exhibited at the Venice Biennales of 1932, 1934, 1936 and 1938 and the Rome Quadriennales of 1939 and 1943 [[source/wikipedia-it-cesare-andreoni|§ Le fasi della pittura futurista di Andreoni]].

  In the spirit of the manifesto [[literature/ricostruzione-futurista-dell-universo|*Ricostruzione futurista dell'universo*]] he opened a workshop in Milan in 1929 that produced objects, furniture and clothing to his designs, and he worked on interiors for the Milan Triennales, among them the reception hall of the town hall of the new town of Aprilia (1936) [[source/wikipedia-it-cesare-andreoni|§ Studio e bottega]] [[source/wikipedia-it-cesare-andreoni|§ Protodesigner]]. In 1934 he signed the Futurist manifesto for the first exhibition of mural art in Genoa [[source/wikipedia-it-cesare-andreoni|§ Protodesigner]]. In 1941 Marinetti presented his first solo show, *Aeropitture futuriste di guerra*, and Andreoni went to the front as a war correspondent, in Croatia (April–June 1941) and with the Italian army in Russia (August 1941 to the end of 1942); an illness contracted there kept him from large works after the war [[source/wikipedia-it-cesare-andreoni|§ Corrispondente di guerra e il dopoguerra]].
