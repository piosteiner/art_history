biography_md: |-
  A German photographer, born on 11 October 1954 in Geldern, the son of the ceramic potter Gisela Struth and the bank director Heinrich Struth; he lives and works in Berlin and New York.[[source/wikipedia-en-thomas-struth|introduction; § Early life and education]] From 1973 to 1980 he studied at the Düsseldorf Academy, at first painting under Peter Kleemann and, from 1974, Gerhard Richter; with Richter's support he joined the first year of Bernd and Hilla Becher's new photography class in 1976, together with Candida Höfer, Axel Hütte and Tata Ronkholz.[[source/wikipedia-en-thomas-struth|§ Early life and education]]

  ## Work

  His early work consists of black-and-white photographs of deserted streets taken from a central perspective — first in Düsseldorf, shown in 1976 as a grid of 49 photographs, then in New York, Paris, Rome, Edinburgh, Tokyo and elsewhere; the pictures are neither staged nor digitally manipulated, and he preferred the even grey light of early morning.[[source/wikipedia-en-thomas-struth|§ Work]] From the mid-1980s he made family portraits, and from 1989 his best-known cycle, the *Museum Photographs* of visitors in great museums and churches.[[source/wikipedia-en-thomas-struth|§ Work]] Between 1998 and 2006 he looked for jungle settings in Japan, Australia, China, America and Europe for his *Pictures from Paradise*, the first eight of which were taken in 1998 in the Daintree Rainforest in Australia;[[source/wikipedia-en-thomas-struth|§ Work]] [[artwork/struth-paradise-19|*Paradise 19*]] of 1999 shows the Bavarian Forest near Zwiesel.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 12]] Later series record techno-industrial and research sites (2010), theme parks and, in *Animals* (2017–2018), wildlife research in Berlin.[[source/wikipedia-en-thomas-struth|§ Work]] From 1993 to 1996 he was the first professor of photography at the Staatliche Hochschule für Gestaltung in Karlsruhe.[[source/wikipedia-en-thomas-struth|§ Work]]
