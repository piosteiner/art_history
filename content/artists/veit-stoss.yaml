biography_md: |-
  German sculptor, carver and painter of sculpture (born about 1447 in Horb am Neckar; died 1533 in Nuremberg), active above all in Kraków (1477–1496) and Nuremberg (from 1496 until his death).[[source/wikipedia-de-veit-stoss|§ introduction]][[source/wikipedia-de-veit-stoss|§ Leben]] Where he trained is unknown; his work shows influences of the Upper Rhine, especially Niclaus Gerhaert and the engravings of Master E. S., of Michel Erhart in Ulm and, probably indirectly, of Netherlandish art.[[source/wikipedia-de-veit-stoss|§ Leben]]

  ## Kraków and Nuremberg

  His first major work is the painted and gilded high altarpiece of St. Mary's in Kraków (completed 1489), with almost three-metre figures of the Death of the Virgin in the centre.[[source/wikipedia-de-veit-stoss|§ Krakauer Periode]] Back in Nuremberg in 1496 he worked mainly in limewood; from 1503 he was entangled in a long lawsuit for forgery and fled in 1504 to Münnerstadt, where he painted Tilman Riemenschneider's Magdalene retable, unpainted since its installation in 1492.[[source/wikipedia-de-veit-stoss|§ Nürnberg]] The Angelic Salutation in St. Lorenz (1517/18), hanging from the vault of the choir, is among his outstanding late works.[[source/wikipedia-de-veit-stoss|§ Nürnberg]]

  ## The Carmelite altarpiece

  His last work was the altarpiece of the Nuremberg Carmelite church (1520–23), commissioned by his son Andreas, prior of the monastery; it was to remain without hasty painting and is now in Bamberg Cathedral.[[source/wikipedia-de-veit-stoss|§ Nürnberg]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 100]] The prior's note that no prior should "lightly" have it painted is one of very few documents about leaving a carved altarpiece unpainted.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 102]][[source/wikipedia-de-tilman-riemenschneider|§ Farbige Fassung und „Holzsichtigkeit“]] Stoss's design drawing for it survives in Kraków.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 101]]
