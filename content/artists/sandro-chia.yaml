biography_md: |-
  Sandro Chia (born 1946) is an Italian painter and sculptor; in the late 1970s and early 1980s he was, with Francesco Clemente, Enzo Cucchi, Nicola De Maria and Mimmo Paladino, a principal member of the Italian neo-expressionist movement that the critic Achille Bonito Oliva named [[movement/transavanguardia|Transavanguardia]] [[source/wikipedia-en-sandro-chia|§ Introduction]].

  ## Life

  Chia was born in [[place/florence|Florence]] on 20 April 1946 and studied at the Istituto d'Arte (1962–67) and the Accademia di Belle Arti in Florence until 1969 [[source/wikipedia-en-sandro-chia|§ Life]]. After travels in Europe, Turkey and India he settled in [[place/rome|Rome]] in 1970 and began to exhibit the following year [[source/wikipedia-en-sandro-chia|§ Life]]. He spent the winter of 1980–81 on a study grant in Mönchengladbach and then moved to [[place/new-york-city|New York]], where he lived for more than twenty years and taught at the School of Visual Arts in 1984–85 [[source/wikipedia-en-sandro-chia|§ Life]]. He now divides his time between New York and Montalcino near Siena [[source/wikipedia-it-sandro-chia|§ Biografia]].

  ## Work

  Chia's early work tended towards Conceptualism; from the mid-1970s he turned to figuration [[source/wikipedia-en-sandro-chia|§ Work]]. In June 1979 Paul Maenz showed him with Clemente, Cucchi, De Maria and Paladino in his Cologne gallery, and in the same year Bonito Oliva described the group in *Flash Art* as a new movement, "Transavanguardia" [[source/wikipedia-en-sandro-chia|§ Work]]; another account traces the name to the "Aperto '80" section of the Venice Biennale [[source/wikipedia-en-transavantgarde|§ Introduction]]. The movement answered Conceptual art by reviving painting, figuration and mythic imagery [[source/wikipedia-en-transavantgarde|§ Introduction]]. Works by Chia were shown at the Guggenheim Museum's "Italian Art Now: An American Perspective" in 1982, and he had exhibitions at the Guggenheim (1983), the Metropolitan Museum of Art (1984) and the Nationalgalerie in Berlin (1992); he took part in the Venice Biennale in 1984 and 1988 [[source/wikipedia-en-transavantgarde|§ Introduction]] [[source/wikipedia-en-sandro-chia|§ Work]]. His [[artwork/chia-water-bearer|*Water Bearer*]] (1981) is in the [[institution/tate-gallery|Tate]] [[source/wikipedia-it-sandro-chia|§ Opere]]; the seminar *Art and Totalitarianism* opened with it and [[artist/georg-baselitz|Georg Baselitz]]'s [[artwork/baselitz-adieu|*Adieu*]] (1982) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 11]].
