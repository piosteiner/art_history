public_id: 117248
name: Berenger
active: c. 1000
biography_md: |-
  Bronze caster, known only by his name on the doors he cast for Archbishop Willigis of Mainz: "Meister Berenger" made the great bronze doors of Willigis's cathedral, which according to their inscription were the first doors made of metal since Charlemagne[[source/wikipedia-de-mainzer-dom]] — around 1009 in the German Wikipedia's account of the Bernward door,[[source/wikipedia-de-bernwardstur]] around 1000 in the lecture.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]] Today they form the [[artwork/mainzer-marktportal-bronzetur|Marktportal]] of [[institution/mainz-cathedral|Mainz Cathedral]].

  His doors are named as a counterpart of the Hildesheim [[artwork/bernwardstur|Bernward door]] (around 1015), whose master is not known — unlike the Mainz door, which names its caster; unlike the Bernward door, Berenger's have no figures.[[source/wikipedia-de-bernwardstur]] Nothing else is known of him.
