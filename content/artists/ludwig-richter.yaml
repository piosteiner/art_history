biography_md: |-
  Adrian Ludwig Richter (28 September 1803 – 19 June 1884), a German painter and etcher who belonged to both Romanticism and the Biedermeier; he was the most popular and in many ways the most typical German illustrator of the mid-19th century, and made woodcuts for the fairy tales of the Brothers Grimm.[[source/wikipedia-en-ludwig-richter|introduction]]

  ## Life

  Born in Friedrichstadt, Dresden, he trained with his father, the engraver Carl August Richter.[[source/wikipedia-en-ludwig-richter|§ Life]] He was in Italy from 1823 to 1826, and from 1828 to 1836 worked as a designer for the Meissen porcelain factory.[[source/wikipedia-en-ludwig-richter|§ Life]] In 1841 he became professor and head of the landscape studio at the Dresden Academy.[[source/wikipedia-en-ludwig-richter|§ Life]] An eye disease ended his work in 1874; he was pensioned in 1877 and died at Loschwitz near Dresden.[[source/wikipedia-en-ludwig-richter|§ Life]]

  ## Work

  As a painter he aimed at a thorough blending of figures and landscape, as in the *Ferry at the Schreckenstein* (1836) and the *Bridal Procession in Springtime* (1847) in Dresden.[[source/wikipedia-en-ludwig-richter|§ Life]] His 240 etchings include about 140 views of Saxony; his more than 3,000 drawings and his book illustrations — for *The Vicar of Wakefield* (1841), Musäus' *Volksmärchen der Deutschen* (1842), the *Goethe Album* (1855), Schiller's *Glocke* (1857) and cycles such as *Kinderleben* (1852) and *Fürs Haus* (1858–1861) — show his individuality most fully.[[source/wikipedia-en-ludwig-richter|§ Main works]] His autobiography, *Lebenserinnerungen eines deutschen Malers*, was edited by his son Heinrich.[[source/wikipedia-en-ludwig-richter|§ Publications]] The lecture "Aus dem Wald" showed his painting [[artwork/richter-genoveva-im-wald|*Genoveva im Wald*]] of 1841 in the Hamburger Kunsthalle among Romantic images of the forest.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 11]]
