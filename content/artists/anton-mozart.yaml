biography_md: |-
  Anton Mozart was a painter who worked on the Kunstschränke assembled by the Augsburg dealer Philipp Hainhofer. He painted the [[artwork/mozart-ubergabe-des-pommerschen-kunstschranks|handing over of the Pomeranian Kunstschrank]] to Duke Philipp II of Pomerania (1617, oil on wood, 39.4 × 45.4 cm, Kunstgewerbemuseum Berlin) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 32]], which shows Hainhofer presenting the cabinet to the ducal couple and court together with the artists and craftsmen and could be pulled out of the cabinet itself [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]]. For the [[artwork/pommerscher-kunstschrank|Pomeranian cabinet]] he also painted, according to attribution, the landscapes with the Four Elements on the inner sides of the four doors [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]].

  He is also named as painter of the [[artwork/kunstschrank-gustav-adolf-uppsala|cabinet given to King Gustav Adolf of Sweden]] in 1632, now in the Gustavianum in Uppsala [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 55]].
