biography_md: |-
  A German cartographer, astronomer, geodesist, instrument maker and physician, born about 1455/1465 and died in Nuremberg in 1532.[[source/wikipedia-en-erhard-etzlaub|introduction]] Little is known of his life: an "Erhart Etzlauber" became a citizen of Nuremberg in 1484; if he is the "Eberhardus Eczleiben" who matriculated at Erfurt in 1469, he was born between 1455 and 1460.[[source/wikipedia-en-erhard-etzlaub|§ Life]] Letters of 1500 and 1507 describe him as a well-known maker of instruments ("compasses") and a geodesist; one of 1517 says he had practised as a physician for at least four years and came from Erfurt, and in 1515 he called himself "astronomer and physician, from Erfurt University".[[source/wikipedia-en-erhard-etzlaub|§ Life]] He was buried between 20 December 1531 and 21 February 1532, very probably in January or early February 1532, and left no heirs.[[source/wikipedia-en-erhard-etzlaub|§ Life]]

  ## Maps

  For the Holy Year 1500 he designed the "Rom-Weg" map of the way to Rome, a woodcut of 41 × 29 cm, the earliest printed road map of Central Europe; like all his maps it has south at the top, and dotted lines allow distances to be counted in German miles.[[source/wikipedia-en-erhard-etzlaub|§ The "Romweg" Map; § The "Roman Empire" road map]] An improved edition followed in 1501, printed in Nuremberg by Georg Glogkendon.[[source/wikipedia-en-erhard-etzlaub|§ The "Romweg" Map; § The "Roman Empire" road map]] His data were widely used in the first half of the 16th century, among others by Martin Waldseemüller and Sebastian Münster.[[source/wikipedia-en-erhard-etzlaub|§ The "Romweg" Map; § The "Roman Empire" road map]] Securely his are also a woodcut map of 1492 with 100 places within 120 km of Nuremberg and a map of Nuremberg's territory of 1519, painted on parchment by the Nuremberg painter Michel Graf; an earlier similar map of 1516 survives only in a copy of 1600, and a parchment map of 1516 is, with some probability, of his design.[[source/wikipedia-en-erhard-etzlaub|§ More maps]] The lecture "Aus dem Wald" gives him the [[artwork/etzlaub-waldplan-von-nurnberg|plan of Nuremberg's forests of St Lorenz and St Sebald]] in the Germanisches Nationalmuseum, which Michael Baxandall dates 1516 and describes as painted "after Erhard Etzlaub".[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 29]][[source/baxandall-1980-limewood-sculptors|p. 30]]

  ## Instruments and almanacs

  Etzlaub's "Kompast", pocket sundials fitted with a compass, were in demand as far as Lisbon and Rome; two survive, one of 1511 in the Germanisches Nationalmuseum.[[source/wikipedia-en-erhard-etzlaub|§ The instrument maker]] Miniature maps engraved on their lids let users set the gnomon to their latitude.[[source/wikipedia-en-erhard-etzlaub|§ The instrument maker]] From 1515 he published wall almanacs with feast days, phases of the moon, planetary positions and advice on health, from 1520 in versions for different regions.[[source/wikipedia-en-erhard-etzlaub|§ Etzlaub's "almanachs"]]
