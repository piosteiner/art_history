biography_md: |-
  German painter of portraits and religious subjects of the Swabian school (about 1461 – 4 May 1528), the most important member of a family of artists in Memmingen, where he was born; he was probably a pupil of [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]] in Ulm.[[source/wikipedia-en-bernhard-strigel|§ introduction]] He was in high favour with Emperor Maximilian I, in whose service he travelled repeatedly to Augsburg, Innsbruck and Vienna, and painted several portraits of the emperor.[[source/wikipedia-en-bernhard-strigel|§ introduction]]

  With Zeitblom he painted the wings of the high altarpiece of Blaubeuren (1491–1494): the four Passion scenes of the closed state and the sixteen scenes from the life of John the Baptist of the first opening.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 39–40]] His religious works include four wings with the life of the Virgin in Berlin and ten paintings of the Genealogy of Christ in Nuremberg; his portraits, such as that of the humanist Cuspinian and his family (1520), are generally rated higher.[[source/wikipedia-en-bernhard-strigel|§ introduction]]
