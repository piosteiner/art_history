biography_md: |-
  A German Romantic landscape painter (5 September 1774 – 7 May 1840), generally considered the most important German artist of his generation; his often symbolic, anti-classical pictures convey a subjective, emotional response to nature, frequently with contemplative figures seen against night skies, morning mists, bare trees or Gothic ruins.[[source/wikipedia-en-caspar-david-friedrich|introduction]]

  ## Life

  Friedrich was born in Greifswald, then in Swedish Pomerania, the sixth of ten children of a candle-maker and soap-boiler, and was raised in a strict Lutheran household; as a boy he saw his younger brother drown after falling through the ice.[[source/wikipedia-en-caspar-david-friedrich|§ Early years and family]] He studied in Greifswald with Johann Gottfried Quistorp from 1790, who took his pupils drawing outdoors, and at the Copenhagen Academy from 1794 to 1798, then settled in Dresden.[[source/wikipedia-en-caspar-david-friedrich|introduction; § Early years and family; § Move to Dresden]] Travels from 1801 to the Baltic coast, Bohemia, the Krkonoše and the Harz gave him his subjects — woods, hills, harbours and effects of light, studied in pencil and painted from memory.[[source/wikipedia-en-caspar-david-friedrich|§ Move to Dresden]] A prize at Goethe's Weimar competition in 1805 established his reputation, and his first major painting, the *Cross in the Mountains* (Tetschen Altar) of 1808, provoked a controversy over landscape as religious art.[[source/wikipedia-en-caspar-david-friedrich|§ Move to Dresden]] In 1818 he became a member of the Saxon Academy, but never received the professorship he hoped for; in the same year he married Caroline Bommer, with whom he had three children.[[source/wikipedia-en-caspar-david-friedrich|§ Move to Dresden; § Marriage]] From the 1820s his reputation declined; he lived increasingly as a recluse, walking alone through woods and fields, and after a stroke in 1835 could no longer paint in oil.[[source/wikipedia-en-caspar-david-friedrich|§ Later life; § Death]] He died in Dresden in 1840, in relative poverty and little noticed.[[source/wikipedia-en-caspar-david-friedrich|§ Later life; § Death]]

  ## Reputation

  An exhibition of thirty-two of his paintings in Berlin in 1906 began a revival; he influenced the Expressionists and later the Surrealists and Existentialists.[[source/wikipedia-en-caspar-david-friedrich|introduction]] His popularity under National Socialism was followed by a sharp decline, and since the 1970s he has been regarded internationally as one of the most important artists of German Romanticism.[[source/wikipedia-en-caspar-david-friedrich|introduction]] The lecture "Aus dem Wald" opened its survey of modern images of the forest with two of his paintings, [[artwork/mann-und-frau-den-mond-betrachtend|*Man and Woman Contemplating the Moon*]] and [[artwork/friedrich-der-abend-1821|*Der Abend*]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 8]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 9]]
