biography_md: Painter of [[artwork/hanasaki-himawari|ひまわり]] (Sunflowers, 1958) in the [[institution/keio-art-collection|Keio Art Collection]]; Keio Object Hub gives his name, read Hanasaki Toshiyoshi, but no dates.[[source/objecthub-keio-ac-jp|object 6332 (ひまわり)]] A Keio graduate of that name is known — the businessman Hanasaki Toshiyoshi (1899–1994), president and later chairman of Sumitomo Marine and Fire Insurance;[[source/wikipedia-ja-hanasaki-toshiyoshi]] that he painted it is not attested.
