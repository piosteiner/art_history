biography_md: "Potter, and with [[person/yanagi-soetsu]] and [[artist/hamada-shoji]] one of the three who coined the word mingei in 1925.[[source/mingeikan-about]] Born in Yasugi in Shimane, he graduated from the Tokyo Higher Polytechnical School in 1914 and worked at the Kyoto Research Institute for Ceramics, where Hamada, whom he had met in Tokyo, followed him; in 1920 he built his own climbing kiln in Kyoto. Trained in chemical glazes and soon known for them, he turned — after meeting Yanagi and Hamada — to natural ones, and is regarded as a master of glazes: copper red, iron brown, chrome and cobalt. Like Hamada he never signed his work (“My work itself is my best signature”), and he refused every official honour, among them the title of Living National Treasure. His house in Gojōzaka, Kyoto, is a museum run by his family.[[source/wikipedia-en-kawai-kanjiro]]"
