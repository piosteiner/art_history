biography_md: |-
  The name under which a German late Gothic sculptor who signed three works with the monogram H.W. is usually known; the identification with a documented Hans Witten is still disputed, and the correct designation is the notname Master H.W.[[source/wikipedia-de-hans-witten|introduction]] He was probably born in Braunschweig about 1470/80 and died after 1522, probably in Annaberg.[[source/wikipedia-de-hans-witten|introduction]] He counts among the leading masters of late Gothic sculpture; he probably made the pulpit of the Aegidienkirche in Braunschweig and then went to Saxony, where he created his main works, among them the Tulip Pulpit in Freiberg Cathedral.[[source/wikipedia-de-hans-witten|introduction]]

  ## Name and identity

  The reconstruction of his work starts from three works bearing the monogram: the St Helena on the town hall in Halle (1502), the winged altarpiece in Borna (1511) and the *Schöne Tür* in Annaberg (1512).[[source/wikipedia-de-hans-witten|§ Leben und Namensgebung; § Werke]] Searching the archives of these places, Walter Hentschel found a "Hans Witten", whom he identified for a time with a "Hans von Cöln" also named in the sources; a Hans Witten von Köln is listed as a citizen of Chemnitz in 1502, and in 1507 the maker of the Ehrenfriedersdorf altarpiece is named once as Hans von Köln and once as Hans Witten von Köln.[[source/wikipedia-de-hans-witten|§ Leben und Namensgebung]] Curt Langer divided this person into two contemporaries, the painter Hans von Köln and the sculptor and carver Hans Witten.[[source/wikipedia-de-hans-witten|§ Leben und Namensgebung]]

  ## Work

  Called a "Bildhauerdichter", a sculptor-poet, for his inventive and imaginative art, he worked mainly in Upper Saxony and developed a distinctive personal style, influenced by Lower Saxon sculpture and by the engravings of Martin Schongauer and the prints of Albrecht Dürer; his works are more late Gothic than Renaissance in character.[[source/wikipedia-de-hans-witten|§ Werke]] Besides the signed works and the Tulip Pulpit (about 1508–1510), works attributed to him in Chemnitz include the branchwork portal of the Schlosskirche (1504–1505), a grieving Virgin in the Schlossbergmuseum and the [[artwork/witten-geisselsaule-chemnitz|Flagellation column]] in the Schlosskirche.[[source/wikipedia-de-hans-witten|§ Werke]] The lecture "Aus dem Wald" presents the column, of polychrome oak, as an example of Gregory C. Bryda's thesis that late medieval German artists deliberately foregrounded the woodiness of their subjects and materials.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 40]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]]
