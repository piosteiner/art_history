biography_md: |-
  Late Gothic sculptor and carver of the Ulm school (born around 1440/45, probably in Constance; died after 1522 in Ulm).[[source/wikipedia-de-michel-erhart|§ introduction]] Nothing is known of his origins; after travels that probably took him to Constance, Strasbourg and perhaps the Netherlands, he appears in the Ulm tax lists in 1469 as "Michel, bildhower".[[source/wikipedia-de-michel-erhart|§ Leben]] He first worked in the workshop of Jörg Syrlin the Elder on the choir stalls of Ulm Minster and had his own workshop with several assistants by 1474 at the latest.[[source/wikipedia-de-michel-erhart|§ Werk]] His style was formed by the spacious, realistic manner of Niclaus Gerhaert van Leyden, whose work he studied in Strasbourg.[[source/wikipedia-de-michel-erhart|§ Werk]] Between 1469 and 1522 he is the sculptor most often named in the Ulm archives.[[source/wikipedia-de-michel-erhart|§ Leben]]

  His main work is the carving of the high altarpiece of Blaubeuren abbey (1491–1494), made with the cabinetmaker Jörg Syrlin the Younger and the painter Bartholomäus Zeitblom; the carved figures are attributed to him and his son [[artist/gregor-erhart|Gregor Erhart]] in varying shares.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36]][[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] His only signed work is a crucifix of 1494 in St. Michael, Schwäbisch Hall, and the Virgin of Mercy from Ravensburg (around 1480–90, Bode-Museum, Berlin) is unanimously attributed to him.[[source/wikipedia-de-michel-erhart|§ Werk]] Elina Gertsman cites that figure, "carved in pliant limewood", in which Mary shelters the townspeople under her cloak, as an example of the Virgin of Mercy – the type that Prussian Shrine Madonnas vary with their painted crowds of the faithful.[[source/gertsman-2015-worlds-within|p. 91]]

  Erhart married Margarethe, daughter of the master builder Vincenz Ensinger; their son Gregor set up his own workshop in Augsburg.[[source/wikipedia-de-michel-erhart|§ Leben]]
