biography_md: |-
  Aleksandr Deyneka (also Deineka, 1899–1969) was a Soviet painter, graphic artist and sculptor, regarded as one of the most important Russian modernist figurative painters of the first half of the twentieth century [[source/wikipedia-en-aleksandr-deyneka|introduction]].

  ## Life and work

  Born in Kursk, he studied at the Kharkov art college and at the Vkhutemas, and was a founding member of the groups OST and Oktyabr [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]]. His paintings and drawings show labour, genre scenes and often sport [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]]. His *Collective Farmer on a Bicycle* (1935) has been called typical of socialist realism ([[movement/socialist-realism]]) [[source/wikipedia-en-aleksandr-deyneka|introduction]]. He later painted monumental works such as *The Defence of Petrograd* (1928), his best-known painting, and in the war years [[artwork/deineka-defence-of-sevastopol]] (1942) [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]]. His mosaics decorate Mayakovskaya metro station in Moscow [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]]. He became People's Painter of the USSR in 1963, received the Lenin Prize in 1964, and was buried in the Novodevichy Cemetery [[source/wikipedia-en-aleksandr-deyneka|§ Honours and awards]] [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]].

  ## In the seminar

  His *Defence of Sevastopol* was set beside Boccioni's *Charge of the Lancers* to show how totalitarian art turned the Futurists' abstract "lines of force" into the concrete image of war [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. On socialist realism he said: "I don't know whether it's a good picture or a bad one, but it seems that it's real" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 45]].
