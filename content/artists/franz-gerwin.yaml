biography_md: |-
  German painter, born in Lünen, died in Bochum in 1960; his work matched the National Socialist idea of "German art".[[source/wikipedia-de-franz-gerwin|introduction]] His [[artwork/gerwin-hochofen|*Hochöfen*]] (1940) was shown at the Great German Art Exhibition of 1941.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]]

  **Birth year.** The German Wikipedia gives 9 June 1891,[[source/wikipedia-de-franz-gerwin|introduction]] Ines Schlenker 1894;[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Wikidata records both.
