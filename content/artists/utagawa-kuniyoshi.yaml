biography_md: |-
  Utagawa Kuniyoshi (1798–1861) was a woodblock-print designer of the Utagawa school, best known today for his warrior pictures (musha-e), especially his triptychs. [[source/history-of-japanese-art|p. 288]]

  ## Life and work

  The Utagawa school, the most prolific of the nineteenth century, was founded in the late 1700s by Utagawa Toyoharu, and both [[artist/utagawa-toyokuni|Toyokuni]] and Kuniyoshi traced their lineage to it. [[source/history-of-japanese-art|p. 288]] Kuniyoshi studied with Toyokuni but then preferred to go his own way. [[source/history-of-japanese-art|p. 288]] In 1827 he produced a series of warrior prints of the one hundred and eight heroes of the Chinese novel *Shuihuzhuan* (Japanese *Suikoden*, the [[literature/water-margin|Water Margin]]), inspired stylistically by [[artist/shoun-genkei|Shōun Genkei]]'s sculptures of the five hundred rakan at the Gohyaku Rakanji in Edo; the prints were an instant sensation. [[source/history-of-japanese-art|p. 288]] The publisher Kagaya Kichibei had commissioned the series, which ran from 1827 to 1830, made Kuniyoshi famous and started a craze for full-body pictorial tattoos. [[source/wikipedia-en-water-margin|§ Non-English translations]] One of its sheets is [[artwork/kuniyoshi-li-jun|Li Jun, the Dragon in the Turbulent River]]. [[source/arc-bm-1906-1220-1249]]

  One of his most dramatic and gruesome prints is the triptych [[artwork/takiyasha-the-witch-and-the-skeleton-spectre|Takiyasha the Witch and the Skeleton Spectre]] of about 1845, after the Kabuki play *Sōma dairi* performed in 1844, in which Masakado's daughter summons a giant skeleton. [[source/history-of-japanese-art|p. 289]] In this triptych Kuniyoshi captured the late Edo taste for the bizarre. [[source/history-of-japanese-art|p. 289]]

  The lecture "War and Peace in East Asian Art" also showed a print from his series *The Loyal Retainers*, Japan, 1848. [[source/thomsen-2019-war-and-peace|image list, 12 April 2019]]
