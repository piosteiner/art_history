biography_md: |-
  Vera Mukhina (1889–1953) was a Soviet sculptor, called "the queen of Soviet sculpture" [[source/wikipedia-en-vera-mukhina|introduction]].

  ## Life

  Born in Riga into a wealthy merchant family, she studied in Moscow and from 1912 in Paris, at the Académie de la Grande Chaumière and with Antoine Bourdelle [[source/wikipedia-en-vera-mukhina|§ Biography]]. Within the Lenin Plan for Monumental Propaganda she designed a monument to Nikolay Novikov in 1918, which remained unrealised, and further monuments up to 1923 ([[event/decree-on-the-monuments-of-the-republic]]) [[source/wikipedia-en-vera-mukhina|§ Biography]]. She produced Cubist sculpture as late as 1922 but became a leading figure of socialist realism ([[movement/socialist-realism]]) in style and ideology [[source/wikipedia-en-vera-mukhina|§ Biography]]. She taught at the Vkhutemas and Vkhutein (1926–1930) [[source/wikipedia-en-vera-mukhina|§ Biography]].

  ## Worker and Kolkhoz Woman

  She became internationally known with [[artwork/worker-and-kolkhoz-woman]] (1937), which crowned [[artist/boris-iofan|Boris Iofan]]'s Soviet pavilion in Paris [[source/wikipedia-en-vera-mukhina|§ Work]]. Between 1941 and 1952 she won the Stalin Prize five times, and in 1943 she was named People's Artist of the USSR [[source/wikipedia-en-vera-mukhina|§ Biography]]. She persuaded the authorities not to demolish the Freedom Monument in Riga [[source/wikipedia-en-vera-mukhina|§ Biography]]. She died in Moscow on 6 October 1953 [[source/wikipedia-en-vera-mukhina|§ Death and legacy]].

  ## Monuments for posterity

  Mukhina described monuments as "a call-to-arms to future generations", through which "the government [makes] vivid and long-lasting role model[s]" [[source/kalashnikov-2023|p. 26]]. She also foresaw that "the contemporary life of our people, its suffering and great victories, will be transmitted to posterity primarily through works of art" [[source/kalashnikov-2023|p. 141]]. Kalashnikov notes that her former workshop in Moscow now houses a museum of Orthodox icons [[source/kalashnikov-2023|p. 142]]. In the seminar her group was read through Éric Michaud as a realist imitation of Lissitzky's New Man [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 65]].
