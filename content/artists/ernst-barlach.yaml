biography_md: |-
  German expressionist sculptor, medallist, printmaker and writer, born in Wedel in Holstein on 2 January 1870; a supporter of the war before 1914, he turned against it through his own service and is known above all for sculptures protesting against war [[source/wikipedia-en-ernst-barlach|introduction; § Youth]].

  ## Life and work

  Barlach studied at the Gewerbeschule in Hamburg and from 1891 to 1895 at the Dresden Academy, then worked in an Art Nouveau manner and drew for *Jugend* [[source/wikipedia-en-ernst-barlach|§ Study years; § Seeking]]. A journey to Russia in 1906 shaped his style; with a fixed salary from the dealer [[person/paul-cassirer|Paul Cassirer]], he developed figures in wood and bronze, swathed in heavy drapery like early Gothic sculpture, concentrating on faces and hands [[source/wikipedia-en-ernst-barlach|§ Formative years]]. In 1910 he settled in Güstrow in Mecklenburg, where he spent the rest of his life [[source/wikipedia-en-ernst-barlach|§ Formative years]]. He volunteered as an infantryman in 1915–1916, was discharged after three months, and returned a pacifist [[source/wikipedia-en-ernst-barlach|§ Formative years]]. After the war he became a member of the Prussian Academy of Arts (1919) and won the Kleist Prize for his drama *Die Sündflut* (1924) [[source/wikipedia-en-ernst-barlach|§ Popularity]].

  ## War memorials and the Nazis

  His war memorials refused heroism: the Magdeburg memorial (1929) showed soldiers marked by horror and despair beside a mourning widow and a skeleton in a German helmet; nationalists and Nazis claimed the soldiers must be foreign, and it was removed [[source/wikipedia-en-ernst-barlach|§ Interwar and World War II eras]]. After the National Socialists came to power, the leading art journals of the new Reich described Barlach's figures as "idiotic" [[source/hermand-1994|p. 37]]. Yet the regime's attitude was at first unsettled: in May 1933 Goebbels's assistant Hans Weidemann sent works by Nolde and Barlach to an exhibition of ecclesiastical art at the Chicago World's Fair and organised a private exhibition of Nolde, Barlach, Heckel, Lehmbruck and Schmidt-Rottluff in the Propaganda Ministry [[source/fulda-soika-2014|pp. 188–189]]. As late as 1936 Eberhard Hanfstaengl asked whether Nolde and Barlach could be shown in the [[event/great-german-art-exhibition-1937|Great German Art Exhibition]], and Gauleiter Adolf Wagner answered: "we are not excluding any names, only works" [[source/peters-2017|p. 14]].

  In 1936 his works were confiscated from an exhibition with those of [[artist/kathe-kollwitz|Käthe Kollwitz]] and [[artist/wilhelm-lehmbruck|Wilhelm Lehmbruck]]; most of his other works, among them the Güstrow and Hamburg memorials, were confiscated as "degenerate art", he was forbidden to work as a sculptor, and his academy memberships were cancelled [[source/wikipedia-en-ernst-barlach|§ Interwar and World War II eras]]. The Nazis removed *Der Geistkämpfer* from Kiel in 1937 and sawed it apart to melt it down, but it was saved [[source/wikipedia-en-ernst-barlach|§ Interwar and World War II eras]]. Bernhard A. Böhmer of Güstrow was one of the four dealers whom the Nazi commission employed from 1938 to sell "degenerate" art abroad [[source/peters-2017|p. 26]]; a Bernhard Böhmer had been a friend of Barlach's since 1925 [[source/wikipedia-en-ernst-barlach|§ Popularity; § Interwar and World War II eras]]. Barlach died in Rostock on 24 October 1938 and is buried in Ratzeburg [[source/wikipedia-en-ernst-barlach|introduction; § Death and legacy]].
