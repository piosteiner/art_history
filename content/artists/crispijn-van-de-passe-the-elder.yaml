biography_md: |-
  Crispijn (van) de Passe the Elder (about 1564, Arnemuiden – buried 6 March 1637, Utrecht), a Dutch engraver and publisher and the founder of a dynasty of engravers.[[source/wikipedia-en-van-de-passe-family|introduction; § Crispijn the Elder]]

  ## Life

  Born in Arnemuiden in Zeeland, he trained and worked from 1580 in Antwerp, then the centre of the print trade, became a member of its Guild of St Luke in 1584–1585 and worked for the Plantin Press.[[source/wikipedia-en-van-de-passe-family|§ Crispijn the Elder]] He worked mainly as a reproductive engraver after designs by Antwerp artists, above all Maerten de Vos, whose wife's niece Magdalena de Bock he married.[[source/wikipedia-en-van-de-passe-family|§ Crispijn the Elder]] As an Anabaptist he was at risk of persecution during the Dutch Revolt: he moved to Aachen, set up his own engraving and publishing business in Cologne in 1589, had to leave again in 1611 and settled in Utrecht by about 1612, where he made engravings for the English and other markets.[[source/wikipedia-en-van-de-passe-family|§ Crispijn the Elder]] Four of his children — Simon, Crispijn II, Willem and Magdalena — became engravers in the family business.[[source/wikipedia-en-van-de-passe-family|§ The second generation]]

  ## Work

  The family's engravings are mostly portraits and book title pages, with relatively few large narrative subjects, and their styles are so similar that the members are hard to tell apart without a signature or date.[[source/wikipedia-en-van-de-passe-family|introduction]] Among Crispijn the Elder's best-known works is an engraving of the English Gunpowder Plotters.[[source/wikipedia-en-van-de-passe-family|§ Crispijn the Elder]] The lecture "Aus dem Wald" showed [[artwork/passe-erysichthon|Erysichthon felling the tree of Ceres]], an engraving by "Crispijn van de Passe" for an edition of Ovid's *Metamorphoses* of 1602–1607, in the Rijksmuseum.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 65]]
