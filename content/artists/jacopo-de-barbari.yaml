biography_md: |-
  Jacopo de' Barbari was a painter and printmaker of Venetian origin who worked at the courts north of the Alps around 1500. The dialect of his own handwriting in his letter to Frederick the Wise reveals that he came from the Venetian area, although he never called himself a Venetian in his surviving signatures and autographs [[source/bockem-2016-jacopo-de-barbari|p. 32]]. In that letter, written between October 1500 and August 1501, he discussed the status of painting on the basis of Aristotle and Alberti in order to have it admitted among the liberal arts [[source/bockem-2016-jacopo-de-barbari|p. 50]]. Albrecht Dürer, in drafts for the dedication of his treatise on human proportion (1528), names him as an important personal source and stimulus for his studies of construction and proportion [[source/bockem-2016-jacopo-de-barbari|p. 50]].

  ## Career

  Barbari was appointed to the service of King Maximilian I in Augsburg on 1 April 1500 [[source/bockem-2016-jacopo-de-barbari|p. 55]]. A document of February 1504 orders payment to "Antonien Kolben und Jacoben Barbarj Maler von Venedig" for their services — 200 gulden for Kolb and 254 for Barbari — when he was no longer in Maximilian's service [[source/bockem-2016-jacopo-de-barbari|p. 51]]. In February 1506 Dürer wrote from Venice to Willibald Pirckheimer that there were many better painters there than "meister Jacob", but that Anton Kolb swore no better painter lived on earth [[source/bockem-2016-jacopo-de-barbari|p. 33]].

  ## The view of Venice

  Since Ernst Georg Harzen proposed it in 1855, the great woodcut [[artwork/barbari-veduta-di-venezia|view of Venice]] published in 1500 by the Nuremberg merchant Anton Kolb has been attributed to Barbari [[source/bockem-2016-jacopo-de-barbari|p. 50]], and the lecture presents it, with its surviving [[artwork/barbari-matrici-veduta-di-venezia|pear-wood blocks]], under his name [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 40, 63]]. Beate Böckem argues that his share is not documented, that he was already in Maximilian's service during the final phase of the project, and that he was at most one of many artists involved in Kolb's undertaking [[source/bockem-2016-jacopo-de-barbari|pp. 51, 54–55, 58]]. Stylistic comparisons with his engravings and with the three-part woodcut "Triumph of Men over Satyrs" attributed to him suggest a certain relationship, especially in the figures of Mercury and Neptune [[source/bockem-2016-jacopo-de-barbari|pp. 51–52]].
