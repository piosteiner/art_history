biography_md: French painter, former stockbroker. Leading figure of the Pont-Aven school and Synthetism; spent nine weeks with Van Gogh in Arles in 1888 and his later years in Tahiti and the Marquesas Islands in French Polynesia[[source/wikipedia-en-paul-gauguin|“Initially working as a stockbroker” · “His painting later evolved towards Synthetism” · “In 1888, at Theo’s instigation, Gauguin and Vincent spent nine weeks painting together at Vincent’s Yellow House in Arles” · “Gauguin’s later years in Tahiti and the Marquesas Islands were marked by health problems and financial struggles”]][[source/wikipedia-en-post-impressionism|“encompasses Les Nabis, Neo-Impressionism, Symbolism, Cloisonnism, the Pont-Aven School, and Synthetism”]].
