biography_md: |-
  German sculptor and cabinetmaker of the Ulm school (about 1455–1521), born in Ulm, the son of Jörg Syrlin the Elder.[[source/wikipedia-en-jorg-syrlin-the-younger|§ introduction]] He built the case of the high altarpiece of Blaubeuren abbey (1491–1494), whose carvings are by [[artist/michel-erhart|Michel Erhart]] and whose painting is by [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]]; the choir stalls of the abbey church are also his and date from about the same time.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36]][[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  In Ulm the cabinetmaker often took the commission for a whole altarpiece, built the case and the superstructure, and passed the carving and painting to subcontractors such as the workshop of [[artist/niklaus-weckmann|Niklaus Weckmann]] and to Ulm painters.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]] Many of Weckmann's sculptures were long attributed to Syrlin the Younger.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]] The contract for the shrine of the high altar of Ulm Minster, made by his father, shows how many different woods a cabinetmaker could combine – Gerhard Weilandt compared the result to a large piece of intarsia.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 31]]
