biography_md: |-
  Vyacheslav Akhunov (born 1948) is a Kyrgyz-born Uzbek artist and author working in performance, video and painting, who lives in [[place/tashkent|Tashkent]] [[source/wikipedia-en-vyacheslav-akhunov|introduction]].

  ## Life and work

  He was born in [[place/osh|Osh]] in the Kirghiz SSR to a Russian mother and an Uzbek father and graduated in 1979 from the Moscow State Institute of Art [[source/wikipedia-en-vyacheslav-akhunov|§ Biography]]. He has spoken of being silenced in the Soviet years, which inspired his large installation *Breathe Quietly* (1976–2013) [[source/wikipedia-en-vyacheslav-akhunov|§ Biography]]. Having started with conventional landscapes, workers and propaganda posters, he turned to conceptual art through contact with the Moscow Conceptualists; his later work satirises Soviet slogans and propaganda in text and image [[source/wikipedia-en-vyacheslav-akhunov|§ Artistic works and exhibitions]]. He has shown at dOCUMENTA (13), the Central Asian pavilion of the Venice Biennale and the 2026 Venice Biennale, and his work is in the Auckland Art Gallery [[source/wikipedia-en-vyacheslav-akhunov|§ Artistic works and exhibitions]].

  ## In the seminar

  His [[artwork/akhunov-red-mantra-cccp]] (1978–1988) represented contemporary perspectives on the Soviet legacy [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 40]].
