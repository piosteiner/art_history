biography_md: |-
  Fortunato Depero (1892–1960) was an Italian [[movement/futurism|Futurist]] painter, writer, sculptor and graphic designer [[source/wikipedia-en-fortunato-depero|§ Introduction]].

  ## Early years and Futurism

  He was born on 30 March 1892 in Fondo (or, according to other sources, neighbouring Malosco) in Trentino, then part of Austria-Hungary, and grew up in [[place/rovereto|Rovereto]]; rejected by the Vienna Academy, he trained as a marble worker [[source/wikipedia-en-fortunato-depero|§ Early life]]. In 1913 he discovered the Futurist journal *Lacerba* in Florence and in 1914 moved to Rome, where he met [[artist/giacomo-balla|Giacomo Balla]] [[source/wikipedia-en-fortunato-depero|§ Early career]]. With Balla he wrote the manifesto [[literature/ricostruzione-futurista-dell-universo|*Ricostruzione futurista dell'universo*]] in 1915, which sought abstract equivalents for all forms of the universe in order to make it "more joyful" [[source/wikipedia-en-fortunato-depero|§ Early career]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]]. In 1919 he founded the House of Futurist Art in Rovereto, which produced toys, tapestries and furniture; in 1925 he represented the Futurists at the Paris exhibition of decorative arts and showed a Futurist Hall at the Monza Biennale [[source/wikipedia-en-fortunato-depero|§ Early career]]. In 1927 he designed the "bolted book" *Depero futurista 1913–1927* [[source/wikipedia-en-fortunato-depero|§ 1920s]].

  ## Under Fascism

  From the 1920s Depero made propaganda for the National Fascist Party, writing songs and painting posters [[source/wikipedia-en-fortunato-depero|§ 1920s]]. He lived in New York from 1928 to 1930, with little commercial success [[source/wikipedia-en-fortunato-depero|§ 1920s]]. In 1929 he signed the manifesto of [[movement/aeropittura|aeropittura]] [[source/wikipedia-en-aeropittura|§ Origins]]. In the 1930s he edited the magazine *Dinamo*, designed advertising for Campari (including the Campari Soda bottle, 1932), worked for the state tourist board ENIT, and made works glorifying Italian colonialism; some of his works of the decade have been criticised as racist for their stereotypes [[source/wikipedia-en-fortunato-depero|§ 1930s and 1940s]]. German pressure on Italy to abandon Futurism from 1937 ended his official work for the government [[source/wikipedia-en-fortunato-depero|§ 1930s and 1940s]].

  ## After the war

  Because of his association with Fascism Depero had difficulties after 1945 and went to the United States again, living in New Milford, Connecticut, from 1947 to 1949 [[source/wikipedia-en-fortunato-depero|§ Post-war period]]. Back in Rovereto he opened the Galleria Museo Depero in 1959 and died there on 29 November 1960 [[source/wikipedia-en-fortunato-depero|§ Post-war period]]. The Casa d'Arte Futurista Depero is now a venue of the [[institution/mart-rovereto|MART]] [[source/wikipedia-en-fortunato-depero|§ Works]].
