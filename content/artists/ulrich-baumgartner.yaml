name: Ulrich Baumgartner
given_name: Ulrich
family_name: Baumgartner
active: 1610/1631
biography_md: |-
  Ulrich Baumgartner was an Augsburg cabinetmaker (Kistler) of the Kunstschränke that Philipp Hainhofer assembled: the woodwork of the [[artwork/pommerscher-kunstschrank|Pomeranian Kunstschrank]] (1610–1617) and of the [[artwork/kunstschrank-gustav-adolf-uppsala|cabinet given to Gustav II Adolf of Sweden]] (c. 1625–1631) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 38, 55]].

  For the Pomeranian cabinet, ordered by Duke Philipp II of Pomerania and made by Augsburg craftsmen from 1610, Baumgartner built the cabinet itself; when the dismantled cabinet reached Stettin at the end of August 1617, he assembled it there [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The surviving [[artwork/pommerscher-kunstschrank-pultbrett|writing desk]] from its contents also has woodwork by him, on an oak frame with veneers of ebony, palisander and other exotic woods [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 40]]. The Uppsala cabinet, veneered with ebony and set with silver, ivory, stones and corals, stands 2.40 m high with its table [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 55]].
