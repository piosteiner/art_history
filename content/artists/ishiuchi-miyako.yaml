biography_md: |-
  Ishiuchi Miyako (born 27 March 1947) is a Japanese photographer. [[source/wikipedia-en-miyako-ishiuchi|introduction]]

  ## Life and work

  Born in Nitta District, Gunma, she grew up in [[place/kiryu|Kiryū]] and Yokosuka, home of a large naval base, and later said that Yokosuka was the starting point of her photography. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] She studied textile dyeing and weaving in the design department of Tama Art University but left in her second year. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] Her first series, *Yokosuka Stories* (1976–77), documented the city of her youth, and in 1979 she received the Kimura Ihei Award for *APARTMENT*. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] Her grainy, blurred large prints belong to the photography of the late 1960s and 1970s; from the early 1990s she photographed the bodies of the very old in close-up, and later work addresses skin, clothing and time. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] In *Hiroshima* she photographed the clothes of victims of the atomic bombing, and in *Frida: Love and Pain* (2012) the personal belongings of Frida Kahlo. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] She represented Japan at the Venice Biennale in 2005 and received the Hasselblad Award in 2014. [[source/wikipedia-en-miyako-ishiuchi|introduction]]

  ## Hiroshima

  In 2007 she photographed the belongings of victims kept at the Hiroshima Peace Memorial Museum, often only part of an object, and was surprised by the colours and contemporary patterns of garments that could still be worn today. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] The lecture "War and Peace in East Asian Art" showed [[artwork/ishiuchi-hiroshima-43|hiroshima #43 (Yamane Shizuko)]], a chromogenic print of 2007. [[source/thomsen-2019-war-and-peace|image list, 24 May 2019]]
