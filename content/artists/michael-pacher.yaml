biography_md: |-
  Painter and sculptor from Tyrol (about 1435 – August 1498), one of the first artists to bring the principles of Renaissance painting to Germany.[[source/wikipedia-en-michael-pacher|§ introduction]] He was born near Brixen; little is known of his training, but he visited Padua, where the frescoes of Andrea Mantegna, with their low viewpoints and mastery of perspective, shaped his style.[[source/wikipedia-en-michael-pacher|§ Early life and influences]] By 1467 he had a workshop for altarpieces in Bruneck in the Puster valley.[[source/wikipedia-en-michael-pacher|§ Career]]

  His masterpiece is the high altarpiece of St. Wolfgang im Salzkammergut (1471–81), commissioned by Abbot Benedikt Eck of Mondsee: a carved and gilded Coronation of the Virgin in the shrine of Swiss stone pine, with two pairs of painted wings, 10.88 m high – today the only altarpiece by Pacher that survives complete.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ introduction]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Geschichte des Altars]] The Church Fathers altarpiece for Neustift (1483) blurs the boundary between painting and sculpture.[[source/wikipedia-en-michael-pacher|§ Altarpiece of the Church Fathers]] Pacher died in 1498, possibly in Salzburg, where he had been working on an altarpiece for the Franciscans since 1484.[[source/wikipedia-en-michael-pacher|§ Death]][[source/wikipedia-en-michael-pacher|§ Career]]
