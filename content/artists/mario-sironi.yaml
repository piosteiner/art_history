biography_md: |-
  ## Early years

  Mario Sironi was born on 12 May 1885 in Sassari, Sardinia; his father was an engineer and his maternal grandfather the architect and sculptor Ignazio Villa [[source/wikipedia-en-mario-sironi|§ Biography]]. He grew up in Rome and began to study engineering at the University of Rome, which he gave up after a nervous breakdown in 1903, the first of the severe depressions that recurred throughout his life [[source/wikipedia-en-mario-sironi|§ Biography]]. He then attended the Scuola Libera del Nudo of the Accademia di Belle Arti di Roma, where he met [[artist/giacomo-balla|Giacomo Balla]], "his first real teacher" [[source/wikipedia-en-mario-sironi|§ Biography]]. From 1903 he was a close friend of [[artist/umberto-boccioni|Umberto Boccioni]] and Gino Severini and belonged to Balla's circle in Rome, whose members shared a political ideal closer to Anarcho-Syndicalism than to the reformist socialism of the PSI and put their art at the service of workers' education [[source/berghaus-2001|p. 157]]. Like his friends he painted at first in a Divisionist manner under Balla's guidance; he went to Milan in 1905 and to Paris in 1906, saw Expressionist works on visits to Germany between 1908 and 1911, and lived mainly in Rome from 1909 to 1914 [[source/wikipedia-en-mario-sironi|§ Biography]].

  ## Futurism and the war

  The first, hesitant Futurist traces appear in his work in 1913–14, and only after his move from Rome to Milan in the winter of 1914–15 did he adopt the Futurist idiom more fully [[source/berghaus-2001|p. 157]]. In 1914 he exhibited with the Futurists at the Galleria Sprovieri in Rome [[source/wikipedia-en-mario-sironi|§ Biography]]. [[person/filippo-tommaso-marinetti|Filippo Tommaso Marinetti]] introduced him to Margherita Sarfatti's salon, where he met [[person/benito-mussolini|Benito Mussolini]], and to Umberto Notari, who employed him as caricaturist of the journal *Gli avvenimenti* [[source/berghaus-2001|pp. 157–158]]. Emily Braun argues that his adherence to [[movement/futurism|Futurism]] rested on ideological rather than artistic affinity, since his canvases of these years differ markedly from the loud, colourful works of the other Futurists [[source/berghaus-2001|p. 158]]. He joined the interventionist campaigns and, soon after entering the movement's leadership, followed the Futurists into voluntary army service [[source/berghaus-2001|p. 158]], as a member of the Lombard Volunteer Cyclists and Drivers [[source/wikipedia-en-mario-sironi|§ Biography]]. Braun calls him the only visual artist among the original Futurists who became a prominent Fascist working in close collaboration with the regime: from Futurism he carried forward collage, Expressionist distortion and abstraction, together with "activist concepts of violence, virility, dynamism, and manipulation of the crowd" [[source/braun-2000|p. 9]]. In 1919, at the end of his active service, he married Matilde Fabbrini, who bore him two daughters, Aglae and Rossana; the couple separated in 1930 but never divorced [[source/braun-2000|pp. 11–12]].

  ## Novecento and the Fascist press

  After the war Sironi was active in the Futurist Political Party and in the Fasci di Combattimento, and in the early 1920s his painting turned from a Futurist to a Metaphysical style [[source/berghaus-2001|p. 158]]. In his urban landscapes of 1920–21 he used [[artist/giorgio-de-chirico|Giorgio de Chirico]]'s pictorial means to shroud the proletarian suburbs of Milan in silence and immobility; Braun identifies the lorries crossing the empty streets as the Fiat 18 BL trucks of the Fascist squads [[source/antliff-2002|pp. 152–153]]. In 1922 he was one of the founders of [[movement/novecento-italiano|Novecento Italiano]] [[source/wikipedia-en-mario-sironi|§ Biography]], and through the 1920s he consolidated his place in the Fascist cultural establishment under the protection of Margherita Sarfatti and of Mussolini himself [[source/berghaus-2001|p. 159]]. In the late 1920s he painted monumental nudes, peasants and family groups in bare, mountainous landscapes, replacing the pure forms of his earlier work with a primitivist classicism [[source/wikipedia-en-mario-sironi|§ Biography]]. Günter Berghaus describes the thick layering of paint, the gestural brushwork and the *non-finito* of these canvases, whose heavy, earthy palette suited their archetypal shepherds, fishermen, peasants and workers [[source/berghaus-2001|p. 160]].

  For over two decades Sironi was chief caricaturist of Mussolini's newspaper *Il Popolo d'Italia*, and he shaped a graphic style that came to be associated with the Fascist press and its exhibition installations [[source/braun-2000|p. 8]]. In all he contributed more than 1,700 cartoons to *Il Popolo d'Italia* and *La Rivista Illustrata del Popolo d'Italia* [[source/wikipedia-en-mario-sironi|§ Biography]] — among them [[artwork/sironi-dux-illustration-1937|the rider beside the letters DVX]] of 1937 [[source/steiner-2025-mario-sironi|p. 5]]. Many of his cartoons show the squadristi in a heroic light and applaud Mussolini's use of force, though there is no evidence that he took part in punitive expeditions [[source/braun-2000|p. 12]]. They followed the regime's policy throughout the *ventennio*, with the significant exception of the anti-Semitic campaign [[source/braun-2000|p. 12]].

  ## Murals and exhibitions

  By the end of the 1920s Sironi had come to regard easel painting as an inadequate vehicle of political persuasion and devoted himself to public commissions and propaganda installations; with his murals of the 1930s he sought a national popular style [[source/braun-2000|p. 16]]. For the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] of 1932 he designed the central rooms on the Fascists' activities between 1919 and 1922 [[source/antliff-2002|p. 157]]; Braun reproduces his Rooms Q, R and S [[source/braun-2000|p. ix, figs. 106–109]]. His public works of the decade include *Charter of Labor* (1931–32), *Works and Days* at the V Triennale in Milan (1933), *Fascist Work* at the VI Triennale (1936), installed again at the Paris exhibition of 1937, and the bas-relief *The People of Italy* for the Palazzo del "Popolo d'Italia" (1939–42) [[source/braun-2000|pp. vi, x, pl. XIII, figs. 123, 126, 128, 137]]. In December 1933 he signed the [[literature/manifesto-della-pittura-murale|Manifesto della pittura murale]] with Massimo Campigli, Carlo Carrà and Achille Funi [[source/steiner-2025-mario-sironi|p. 9]]. Between 1933 and 1942 he carried out his compositions as murals in fresco, mosaic or bas-relief, to replace the private consumption of art with public, collective reception [[source/berghaus-2001|p. 161]]. In 1935 he painted [[artwork/sironi-italia-fra-le-arti-e-le-scienze|L'Italia fra le Arti e le Scienze]] in the Aula Magna of the new university city in Rome [[source/wikipedia-en-mario-sironi|§ Biography]] [[source/steiner-2025-mario-sironi|p. 4]]. Braun sees the mural movement he led as the avant-garde's answer to the demand for a politically engaged art: like Diego Rivera and [[artist/fernand-leger|Fernand Léger]], Sironi held murals to be the most effective form because of their direct appeal to the popular and collective imagination [[source/braun-2000|p. 17]].

  ## Myth and the regime

  Braun calls Sironi "a Fascist of unquestionable faith" and the first to visualise the system of images by which the regime legitimised its power: the cult of origins in the Great War and the Fascist Revolution, the theology of Romanitas ([[romanita]]), the omnipotent Duce and the "Third Way" of the Corporate State [[source/braun-2000|p. 16]]. In Mark Antliff's summary of Braun, the myth Sironi fabricated for the masses "focused on the primacy of the Italian people"; he rejected naturalist verisimilitude and didactic imagery and relied on fragmentation, expressive brushwork and figural deformation to provoke an emotional rather than a purely cognitive response [[source/antliff-2002|p. 152]]. Berghaus sees in his joining of modernity and tradition, Expressionism and classicism, a Fascist "third way" in aesthetics — a minority position among the artists who supported the regime [[source/berghaus-2001|p. 161]].

  Within the regime he remained contested. For the conservatives around Roberto Farinacci, the archaic stylisations of his figures epitomised the decadence, xenophilia and even "Jewishness" of modern art, while to the younger generation his allegories stood for all that was stale in classical revivals [[source/braun-2000|p. 11]]. Without the protection of Mussolini and Giuseppe Bottai, Berghaus argues, he could not have won competitions and state commissions [[source/berghaus-2001|p. 161]]. He was never admitted to the Reale Accademia d'Italia; Mussolini admitted that he would make Sironi an academician were he not afraid of an uproar, since people would say that the illustrator of his own newspaper enjoyed his protection [[source/braun-2000|p. 10]]. In the 1930s Mussolini told the journalist Yvon De Begnac that Sironi was one "who would never betray" him [[source/braun-2000|p. 10]].

  ## After the fall of Fascism

  Sironi stayed loyal to Mussolini and followed him into the Republic of Salò [[source/berghaus-2001|p. 162]]. He had returned to easel painting in 1943 and worked in relative isolation, a withdrawal that deepened after his daughter Rossana's suicide in 1948 [[source/wikipedia-en-mario-sironi|§ Biography]]; he became estranged from his other daughter, Aglae [[source/braun-2000|p. 12]]. His late paintings sometimes approach abstraction, resembling assemblages of archaeological fragments [[source/wikipedia-en-mario-sironi|§ Biography]]; Braun places them in the orbit of Art Informel [[source/braun-2000|p. 8]]. He died in Milan on 13 August 1961 [[source/wikipedia-en-mario-sironi|§ Biography]], having survived Mussolini by some two decades "without apology or explanation" [[source/braun-2000|p. 10]].

  ## Reception

  The retrospective at the Venice Biennale of 1962 founded the myth of a neglected genius, but left out his propaganda work, political cartoons and the photographs of his public commissions [[source/braun-2000|p. 14]]. The first objective analysis of his politics came from Mario De Micheli's essay on the cartoons for an exhibition in Turin in 1964, and the first comprehensive survey from the Palazzo Reale in Milan in 1973 [[source/braun-2000|pp. 14–15]]. International attention followed the exhibition *Les Réalismes* at the Centre Pompidou [[source/braun-2000|p. 15]] [[source/wikipedia-en-mario-sironi|§ Legacy]]. After his death three quarters of his estate — some 16,000 items — were studies for political satires and were locked away in a bank vault [[source/berghaus-2001|p. 157]]. Braun concludes that his art succeeded "not in spite of but because of Fascism" [[source/braun-2000|p. 16]]. The Art and Totalitarianism seminar at Zurich set "Mario Sironi and fascist art" as a topic and set his *City Landscape* of 1921 beside Boccioni's *The City Rises* [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 53, 71]].
