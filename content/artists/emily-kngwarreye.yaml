biography_md: |-
  An Anmatyerre artist from Utopia (about 1910–1996) who began painting on canvas in her late seventies and made over 3,000 works in eight years. Her paintings, based on her country and the yam plant, are often compared to abstract expressionism. Tate and the National Gallery of Victoria now spell her name Emily Kam Kngwarray.

  **Famous works**

  - Emily Kam Kngwarray, *Earth's Creation* (1994, private collection; one of the most expensive Australian paintings by a woman)
  - Emily Kam Kngwarray, *Anwerlarr anganenty (Big yam Dreaming)* (1995, National Gallery of Victoria)

  **Held sacred today:** Aboriginal and Torres Strait Islander visitors are warned that this page contains names and images of deceased persons.

  *From:* Anmatyerre
