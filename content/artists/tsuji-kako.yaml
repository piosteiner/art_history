biography_md: |-
  Tsuji Kakō (1870–1931), born in Kyoto, was a Japanese painter trained by Kōno Bairei in the Maruyama and Shijō schools. [[source/wikipedia-en-tsuji-kako|introduction]] Nihonga in Kyoto centred on artists of the Maruyama–Shijō tradition, which since the eighteenth century had absorbed Western perspective, modelling in light and shade and drawing from nature; Kōno Bairei (1844–95) was the master with whom [[artist/takeuchi-seiho|Takeuchi Seihō]] also began his studies in 1881. [[source/history-of-japanese-art|p. 369]]

  Kakō's Zen training, which he began in 1899, influenced much of his painting and brought his name an association with the unconventional. [[source/wikipedia-en-tsuji-kako|introduction]] He became one of the leading figures of the Shijō and Maruyama movements beside Takeuchi Seihō, Kikuchi Hōbun, Taniguchi Kōkyō and Yamamoto Shunkyo, but his individual approach meant that his work never gained their appeal. [[source/wikipedia-en-tsuji-kako|introduction]] In the last ten years of the Meiji era he was preoccupied with the study of waves; his style broke with tradition and he experimented with colour, and contemporary articles discussed his work critically. [[source/wikipedia-en-tsuji-kako|introduction]]

  The lecture "War and Peace in East Asian Art" showed his hanging scroll [[artwork/tsuji-kako-the-rising-sun|The Rising Sun]], colours and gold on silk, of about 1930. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]
