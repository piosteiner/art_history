biography_md: Buddhist sculptor, the eldest son of [[artist/unkei]] and his successor at the head of the [[movement/kei-school]] until the middle of the 13th century; his best-known work is the seated Thousand-armed Kannon, the principal icon of the Sanjūsangendō of Rengeō-in in Kyoto[[source/tnm-unkei-exhibition-2017|“As Unkei’s successor, Tankei headed the Kei school of Buddhist sculpture until the middle of the 13th century. Several of his works are extant, including the seated image of the Thousand-Armed Kannon Bosatsu that serves as the principal icon of the Sanjusangendo hall of Rengeoin temple in Kyoto”]]. Born in 1173[[source/kobayashi-1954-unkei|“in 1173 was born his first son, Tankei”]].
