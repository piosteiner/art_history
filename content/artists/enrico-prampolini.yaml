biography_md: |-
  Enrico Prampolini (1894–1956) was an Italian [[movement/futurism|Futurist]] painter, sculptor and stage designer, born in [[place/modena|Modena]] on 20 April 1894 and died in [[place/rome|Rome]] on 17 June 1956 [[source/wikipedia-en-enrico-prampolini|§ Introduction]].

  ## Life and work

  After studying with [[artist/duilio-cambellotti|Duilio Cambellotti]] at the Academy of Fine Arts in Rome he became a leading Futurist painter, scenographer and architect, in close contact with the European avant-garde — the Section d'Or, Dada, the Bauhaus, De Stijl, Abstraction-Création — and with Picasso, Mondrian, Kandinsky and Cocteau [[source/wikipedia-en-enrico-prampolini|§ Life]]. In 1917 he founded the magazine *Noi* with Bino Sanminiatelli and designed the sets of Anton Giulio Bragaglia's Futurist film *Thaïs*; in 1927 he founded the "Futurist Theatre Prampolini" [[source/wikipedia-en-enrico-prampolini|§ Life]]. His painting moved between abstraction and figuration: *Spatial-Landscape Construction* (1919) is quasi-abstract, *Simultaneous Landscape* (1922) wholly abstract, *Umbrian Landscape* (1929) figurative again, and by 1931 he had adopted a biomorphic "cosmic idealism", as in *Pilot of the Infinite* (1931) [[source/wikipedia-en-enrico-prampolini|§ Introduction]].

  ## Under Fascism

  Prampolini signed the manifesto of [[movement/aeropittura|aeropittura]], *Perspectives of Flight*, in 1929; the critic Enrico Crispolti saw his "cosmic idealism" as the typical "vision of cosmic projection" within aeropainting [[source/wikipedia-en-aeropittura|§ Origins]]. He helped design the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] of 1932 [[source/wikipedia-en-enrico-prampolini|§ Introduction]], made the mosaic *Le comunicazioni* for the post office tower in La Spezia with Fillìa in 1933, and took part in the art competition of the 1936 Olympic Games [[source/wikipedia-en-enrico-prampolini|§ Life]]. In 1930 the Ministry of National Education bought his [[artwork/prampolini-feminine-landscape|*Feminine Landscape*]] — for the seminar an example of the question whether Fascism was an "imperfect totalitarianism" or a "strategic artistic pluralism" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]]. From 1944 he taught theatre and set design at the [[institution/brera-academy|Brera Academy]] in Milan [[source/wikipedia-en-enrico-prampolini|§ Life]].
