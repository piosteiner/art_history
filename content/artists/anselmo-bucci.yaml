biography_md: |-
  Anselmo Bucci (1887–1955) was an Italian painter and printmaker, born in Fossombrone [[source/wikipedia-en-anselmo-bucci|§ Biography]].

  ## Life

  After studying at the [[institution/brera-academy|Brera Academy]] in [[place/milan|Milan]] in 1904–05 he moved to [[place/paris|Paris]] in 1906 with Leonardo Dudreville; he painted Symbolist works with Fauvist overtones and exhibited at the Salon des Indépendants from 1910 [[source/wikipedia-en-anselmo-bucci|§ Biography]]. In 1915 he enlisted in the Volunteer Cyclist Battalion, and his first solo show (Milan, Famiglia Artistica, 1915) took place while he was on leave [[source/wikipedia-en-anselmo-bucci|§ Biography]] — the battalion in which [[artist/umberto-boccioni|Umberto Boccioni]] also served [[source/wikipedia-en-umberto-boccioni|§ Military service and death]]. His work [[artwork/bucci-sailor-throwing-a-bomb|*Sailor Throwing a Bomb*]] (1918) belongs to the war years [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 56]].

  In 1922 he joined the post-war "return to order" of [[movement/novecento-italiano|Novecento Italiano]] and was one of the founders of the "Sette pittori del Novecento Italiano", taking part in its first show in 1926 but not in the second [[source/wikipedia-en-anselmo-bucci|§ Biography]]. He exhibited at the Venice Biennale in 1920 and 1924, when the city's gallery of modern art bought one of his works [[source/wikipedia-en-anselmo-bucci|§ Biography]]. In the 1930s he divided his time between Milan and Paris; in 1938 he painted the fresco *Italian Civilization Putting an End to Slavery* for the Palazzo di Giustizia in Milan [[source/wikipedia-en-anselmo-bucci|§ Biography]]. He died in Monza in 1955 [[source/wikipedia-en-anselmo-bucci|§ Biography]].
