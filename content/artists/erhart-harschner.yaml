name: Erhart Harschner
given_name: Erhart
family_name: Harschner
active: c. 1500
biography_md: Cabinetmaker (Kistler) in Würzburg around 1500. Kistler made an altarpiece's casing — the base and the frame — around the carved figures; for one casing Harschner was paid hardly less than [[artist/tilman-riemenschneider|Riemenschneider]] for the whole set of figures.[[source/wikipedia-de-tilman-riemenschneider]] In 1499 the town council of Rothenburg commissioned from him the casing of the [[artwork/heilig-blut-altar-rothenburg|Heilig-Blut-Altar]] in St. Jakob; Riemenschneider's contract for the figures followed on 15 April 1501.[[source/wikipedia-de-stadtkirche-st-jakob-rothenburg]]
