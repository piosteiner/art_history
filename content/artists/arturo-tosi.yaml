biography_md: |-
  Arturo Tosi was born in Busto Arsizio on 25 July 1871 and died in Milan on 3 January 1956; he was best known for his landscapes [[source/wikipedia-en-arturo-tosi|§ Introduction]] [[source/wikipedia-en-arturo-tosi|§ Biography]]. He moved to Milan in 1882, attended the nude class of the [[institution/brera-academy|Brera Academy]] in 1890–91 and made his debut at the first Triennale of Fine Arts in 1891, where Vittore Grubicy noticed him and steered him towards the Lombard tradition of the late nineteenth century [[source/wikipedia-en-arturo-tosi|§ Biography]]. He specialised in the valleys around Bergamo and exhibited at every Venice Biennale from 1909 until 1956 [[source/wikipedia-en-arturo-tosi|§ Biography]].

  In the 1920s he came into contact with Margherita Sarfatti; his first solo show was held in 1923 at the Galleria Pesaro in Milan [[source/wikipedia-en-arturo-tosi|§ Biography]]. He sat on the governing committee of the [[movement/novecento-italiano|Novecento Italiano]] and took part in its first and second exhibitions in Milan (1926 and 1929) as well as those abroad [[source/wikipedia-en-arturo-tosi|§ Biography]]. From the 1930s he counted among the most respected Italian painters, and in 1943 became a member of the Accademia di San Luca [[source/wikipedia-en-arturo-tosi|§ Biography]]. "Arturo Tosi and the Novecento Italiano group" was a topic of the Art and Totalitarianism seminar, illustrated by [[artwork/tosi-zoagli-dal-ponte|Zoagli dal ponte]] (1937) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]].
