biography_md: |-
  German carver and sculptor (born about 1460 in Heiligenstadt; died 7 July 1531 in Würzburg), mayor of Würzburg and one of the most important artists of the transition from Late Gothic to Renaissance.[[source/wikipedia-de-tilman-riemenschneider|§ introduction]] With Michel Erhart, Veit Stoss and Michael Pacher he shaped the south German limewood altarpiece, most of which remained unpainted – first for financial reasons, later because the market for donations collapsed.[[source/wikipedia-de-tilman-riemenschneider|§ introduction]]

  ## Life

  He grew up in Osterode; his training in the 1470s is undocumented but probably took place in Strasbourg, among followers of Niclaus Gerhaert, and in Ulm, perhaps with Michel Erhart.[[source/wikipedia-de-tilman-riemenschneider|§ Frühe Jahre]] On 7 December 1483 he joined the Würzburg guild of St. Luke as a journeyman; by marrying a goldsmith's widow in 1485 he gained citizenship and the rank of master.[[source/wikipedia-de-tilman-riemenschneider|§ Würzburger Zeit]] From 1504 he sat on the city council and in 1520/21 he was elected mayor; after the Peasants' War of 1525 he was imprisoned and tortured for two months with the other councillors and released only on payment of half his property.[[source/wikipedia-de-tilman-riemenschneider|§ Öffentliche Ämter]][[source/wikipedia-de-tilman-riemenschneider|§ Zeit des Bauernkriegs]]

  ## Unpainted altarpieces

  His Holy Blood altarpiece in Rothenburg (1501–1505) – figures and ornament in limewood, left visible with a protective glaze, in a case by Erhart Harschner – became the focus of the debate on unpainted retables: after a transparent surface film was diagnosed on it, he was regarded as the "inventor" of the unpainted winged retable.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]][[source/habenicht-2016-das-ungefasste-altarretabel|p. 30]] Georg Habenicht doubts this: the master of the Lorch high altar of 1483 delivered unpainted work earlier, and even Riemenschneider must have known that the carvings he delivered unpainted were as a rule to be painted later.[[source/habenicht-2016-das-ungefasste-altarretabel|pp. 184–185]] Unpainted figures were nevertheless not left untreated: eyes, lips and blood were painted directly on the wood and the whole was coated with a pigmented glaze.[[source/wikipedia-de-tilman-riemenschneider|§ Farbige Fassung und „Holzsichtigkeit“]]

  ## Work

  His main works include the Magdalene altarpiece for Münnerstadt (1490–1492), the Creglingen altarpiece (1495–1499), the tomb of Emperor Henry II and Cunigunde in Bamberg Cathedral (1499–1513) and the [[artwork/heilig-blut-altar-rothenburg|Holy Blood altarpiece in Rothenburg]] (1501–1505).[[source/wikipedia-en-tilman-riemenschneider|§ Major works]] He is regarded as one of the first sculptors of the 15th century who did not have all his figures painted.[[source/wikipedia-en-tilman-riemenschneider|§ Art]] Michael Baxandall calls the Münnerstadt altarpiece the first known limewood retable to have been monochrome; the parish, it seems, was not won over and had it painted by [[artist/veit-stoss|Veit Stoss]] in 1503–1504.[[source/baxandall-1980-limewood-sculptors|p. 42]][[source/baxandall-1980-limewood-sculptors|p. 48]] His monochrome works were never bare wood but covered with a brown-tinted glaze — on the Holy Blood altar egg-white and oil coloured with ochre, black, lime and lead-white.[[source/baxandall-1980-limewood-sculptors|p. 44]] Without gesso the surface itself could carry the effect: in his St Barbara in Munich the hair is rendered with V-section grooves, the brocade of the headdress by a smooth top plane against a ground pitted a millimetre deeper, and seams and fringes by short cuts with a skew chisel or a small gouge.[[source/baxandall-1980-limewood-sculptors|p. 44]] His small St Paul, cut from a short arc of sapwood, is built of overlapping, freely hung drapery sheets.[[source/baxandall-1980-limewood-sculptors|p. 38]] The lecture "Aus dem Wald" names him, with Michel Erhart, Veit Stoss and Hans Leinberger, among the masters who in Baxandall's account exploited the possibilities of wood with skill, and shows his *Noli me tangere* relief of 1490–1492 in limewood, 143.5 × 101.5 cm, now in the Bode-Museum, Berlin.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 32]]
