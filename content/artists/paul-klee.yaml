biography_md: |-
  Swiss-born German artist, born in Münchenbuchsee near Bern on 18 December 1879, whose highly individual style drew on expressionism, cubism and surrealism; his Bauhaus lectures, published in English as the *Paul Klee Notebooks*, are counted among the key texts of modern art [[source/wikipedia-en-paul-klee|introduction; § Early life and training]].

  ## Life and work

  The son of a German music teacher and a Swiss singer, Klee studied at the Academy of Fine Arts in Munich from 1898 under Heinrich Knirr and Franz von Stuck [[source/wikipedia-en-paul-klee|§ Early life and training]]. In 1911 he joined the editorial circle of the almanac *Der Blaue Reiter*, founded by [[artist/franz-marc|Franz Marc]] and [[artist/wassily-kandinsky|Wassily Kandinsky]] [[source/wikipedia-en-paul-klee|§ Affiliation to the "Blaue Reiter", 1911]]. His breakthrough as a colourist came on a trip to Tunisia in 1914 with [[artist/august-macke|August Macke]] and Louis Moilliet: "Color and I are one. I am a painter" [[source/wikipedia-en-paul-klee|§ Trip to Tunis, 1914]]. Conscripted in 1916, he served behind the front and kept painting; by 1917 critics acclaimed him as the best of the new German artists [[source/wikipedia-en-paul-klee|§ Military career]].

  Klee taught at the [[institution/bauhaus|Bauhaus]] from January 1921 to April 1931 and then at the Düsseldorf Academy from 1931 to 1933 [[source/wikipedia-en-paul-klee|§ Mature career]].

  ## Under National Socialism

  In 1933 a Nazi newspaper attacked him, the Gestapo searched his home and he was dismissed from his post; his self-portrait *Struck from the List* (1933) records the moment, and late in 1933 the family emigrated to Switzerland [[source/wikipedia-en-paul-klee|§ Mature career]]. Hermand lists him among the artists who preferred to emigrate [[source/hermand-1994|p. 37]]. In the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] of 1937 his work stood for the "stylistic complexes in connection with the phenomena of primitivism, children's drawings, and the art of the 'mentally ill' as sources for the modern" [[source/peters-2017|p. 24]]. Works by Klee were among the twenty-one paintings from German museums acquired by the [[institution/kunstmuseum-basel|Kunstmuseum Basel]] between April 1939 and spring 1940 [[source/peters-2017|p. 29]]. Besides the works seized from museums, works of his were looted from Jewish collectors, and several have since been restituted or claimed [[source/wikipedia-en-paul-klee|§ Nazi looting and restitutions]].

  ## Last years

  From 1935 Klee suffered from the illness later diagnosed as scleroderma; even so he made more than 1,200 works in 1939 [[source/wikipedia-en-paul-klee|§ Mature career; § Death]]. He died in Muralto near Locarno on 29 June 1940 without Swiss citizenship — the authorities, who found his art too revolutionary, granted his request six days after his death — and was buried in [[place/bern|Bern]] [[source/wikipedia-en-paul-klee|§ Death]].
