biography_md: 'A priest known from the inscription of the enthroned Madonna he made for the Camaldolese monastery of Borgo San Sepolcro in January 1199: the work was made "through the devout labour and offered love of the priest Martinus" in the time of Abbot Peter — see [[artwork/madonna-des-presbyters-martinus|*Thronende Madonna des Presbyters Martinus*]].[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 57]]'
