biography_md: |-
  Alfredo Catarsini (1899–1993) was an Italian painter, born in Viareggio on 17 January 1899 and died there on 28 March 1993; apart from short periods he spent his whole life in that city [[source/wikipedia-it-alfredo-catarsini|§ Biografia]].

  ## Life and work

  At fifteen he went to Paris with relatives and met Amedeo Modigliani in Montmartre; in 1919 he graduated from the Istituto di Belle Arti in [[place/lucca|Lucca]] and joined the artists of the Versilia around Lorenzo Viani [[source/wikipedia-it-alfredo-catarsini|§ Gli esordi]]. His career accelerated in the 1930s: in 1933 he took part in the "Golfo della Spezia" painting prize organised by [[person/filippo-tommaso-marinetti|Marinetti]] and joined the "Second Futurism" [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. In 1937 he exhibited at the second exhibition of the Fascist national artists' union in Naples, and in 1939 he won a shared second prize at the Premio Cremona for *I rurali ascoltano* (*The Country People Listen*) [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. At the second Premio Cremona in 1940 he showed [[artwork/catarsini-the-wheat-of-luccas-reclamation|*Il grano della bonifica lucchese*]], and as a prizewinner he was among the artists whose works were sent to Hannover that September to represent Italian art [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. The Premio Cremona, begun at the end of the 1930s, was the state-sponsored exhibition that emulated the didactic realism of Nazi art; the term "Fascist art" is still used, pejoratively, above all for its paintings [[source/braun-2000|p. 4]].

  In 1942 he showed *Donne nel rifugio antiaereo* (*Women in the Air-Raid Shelter*) at the Venice Biennale, and in 1944, evacuated to San Martino in Freddana near Lucca, he painted in the apse of the parish church the Virgin descending among people amid tanks, bombers and destroyed houses [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. After the war he developed what he called "Riflessismo" and "Simbolismo meccanico", taught at the art school of Pietrasanta from 1951 to 1968 and published a novel of the Resistance, *Giorni neri* (1968) [[source/wikipedia-it-alfredo-catarsini|§ Attività artistica]] [[source/wikipedia-it-alfredo-catarsini|§ Il dopoguerra]].
