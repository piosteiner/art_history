biography_md: Sculptor of the Kei school, a disciple of Kōkei though not a relative; two sculptors of this name worked in Nara in the 1200s. The Yuima of Kōfukuji is signed by him (1196); he probably knew Song Chinese sculpture. [[source/history-of-japanese-art|pp. 192–193]]
