biography_md: |-
  Three Dutch miniature painters, Herman, Paul (Pol) and Jean (Johan) de Limbourg from Nijmegen, active in France and Burgundy in the early 15th century in the International Gothic style; they painted the miniatures and borders of the Belles Heures and the [[artwork/tres-riches-heures|Très Riches Heures]] of John, Duke of Berry.[[source/wikipedia-en-limbourg-brothers|introduction]]

  ## Family and training

  Their father Arnold de Limbourch, a woodcarver and sculptor, married Mechteld Maelwael in 1385; her family were painters in the service of the Duke of Guelders, and her brother Jean Malouel became court painter to Philip the Bold, Duke of Burgundy.[[source/wikipedia-en-limbourg-brothers|§ Family background and early life]] The three brothers were born between about 1385 and 1388.[[source/wikipedia-en-limbourg-brothers|§ Family background and early life]] Herman and Jean were apprenticed to a Parisian goldsmith in 1399; sent home during an epidemic, they were imprisoned in Brussels, and Philip the Bold paid their ransom in May 1400.[[source/wikipedia-en-limbourg-brothers|§ Family background and early life]] In February 1402 Philip engaged Paul and Jean for four years to illuminate a Bible — possibly the Bible moralisée Ms. fr. 166 in Paris — at a daily rate.[[source/wikipedia-en-limbourg-brothers|§ Philip the Bold]]

  ## In the service of the Duke of Berry

  After Philip's death in 1404 they worked for his brother John, Duke of Berry, first on the Belles Heures, finished in 1409, then on the Très Riches Heures.[[source/wikipedia-en-limbourg-brothers|§ Jean de Berry]] The duke's accounts record lavish gifts — rings for Paul and all three brothers, a large house in Bourges for Paul — and all three became *valets de chambre*.[[source/wikipedia-en-limbourg-brothers|§ Jean de Berry]] In the first half of 1416 the duke and the three brothers, none yet 30, died, possibly of plague, leaving the Très Riches Heures unfinished.[[source/wikipedia-en-limbourg-brothers|§ Death]] Their work, largely inaccessible, was forgotten until the 19th century; it combines a northern tradition with Italian influences.[[source/wikipedia-en-limbourg-brothers|§ Death]] The lecture "Aus dem Wald" used two calendar months of the Très Riches Heures, February and December, as images of the use of the forest for fuel and for hunting.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 48]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 53]]
