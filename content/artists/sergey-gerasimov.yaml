biography_md: |-
  Sergey Gerasimov (1885–1964) was a Soviet painter who studied under the Impressionist Konstantin Korovin and became a leading figure of Moscow's art schools and artists' union [[source/wikipedia-en-sergey-vasilyevich-gerasimov|introduction]] [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]].

  ## Life

  He studied at the Moscow School of Painting, Sculpture and Architecture from 1907 to 1912 and later joined the Makovets group [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. In the 1920s and 1930s he taught at the Vkhutemas and painted works sympathetic to the new government in a style later known as socialist realism ([[movement/socialist-realism]]), while remaining known as a liberal whose painting showed the influence of Impressionism [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. This set him against his namesake [[artist/aleksandr-gerasimov|Aleksandr Gerasimov]], who replaced him at the head of the painters' union under Stalin [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. During the war he was evacuated with the Surikov Institute to Samarkand (1941–1943), where some of his best-known pictures were painted [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. He directed the Surikov Institute from 1943 to 1948 and was dismissed in the campaign against "formalism" as a former pupil of Korovin; under Khrushchev he again led the artists' union until his death in 1964 [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]].

  ## In the seminar

  His [[artwork/s-gerasimov-collective-farm-festival]] (1937) stood for socialist optimism [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 22–23]].
