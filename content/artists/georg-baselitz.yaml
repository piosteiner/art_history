biography_md: |-
  German-Austrian painter, sculptor and graphic artist, born Hans-Georg Bruno Kern in Deutschbaselitz in Upper Lusatia on 23 January 1938; he became known in the 1960s for figurative, expressive paintings, and from 1969 painted his subjects upside down [[source/wikipedia-en-georg-baselitz|introduction]].

  ## Life

  Baselitz grew up in what became East Germany, in the ruins of the post-war years, which informed his later work [[source/wikipedia-en-georg-baselitz|introduction]]. Rejected by the Dresden Academy in 1955, he enrolled at the art school in East Berlin in 1956 but was expelled after two semesters for "sociopolitical immaturity"; from 1957 he studied at the Hochschule der Künste in West Berlin, and in 1961 he took the name Georg Baselitz after his birthplace [[source/wikipedia-en-georg-baselitz|§ Background]]. He lived in Salzburg from 2013, took Austrian citizenship in 2015, and died on 30 April 2026 at the age of 88 [[source/wikipedia-en-georg-baselitz|§ Background]].

  ## Work

  His first solo exhibition, in West Berlin in 1963, caused a scandal when the public prosecutor seized two paintings, *Die große Nacht im Eimer* and *Der nackte Mann*, as obscene [[source/wikipedia-en-georg-baselitz|§ 1957–1969]]. In the series *Helden* (Heroes, 1965–1966) ragged, broken figures throw overboard "the illusory and megalomaniacal ideals of the Third Reich and East Germany" [[source/wikipedia-en-georg-baselitz|§ Series of Heroes and Fractures]]. His first inverted picture, *Der Wald auf dem Kopf* (1969), was based on a painting by Louis-Ferdinand von Rayski that had hung in his school; inversion was meant to stress colour, form and the picture's surface rather than its content [[source/wikipedia-en-georg-baselitz|§ Inverted paintings]]. His influences ranged widely, among them Socialist Realism, Mannerism and African sculpture [[source/wikipedia-en-georg-baselitz|introduction]]. From 1981 he had a studio near Arezzo, first showed in New York in 1981, turned increasingly to sculpture from 1982, and in 1983 began a professorship at the Hochschule der Künste Berlin [[source/wikipedia-en-georg-baselitz|§ 1981–1989]].

  The seminar "Art and Totalitarianism" opened with his [[artwork/baselitz-adieu|Adieu]] (1982) and [[artwork/chia-water-bearer|Sandro Chia's Water Bearer]] (1981), asking with Igor Golomstock whether the figurative painting of the 1980s takes up the realism of the totalitarian regimes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 10–11]] [[source/golomstock-1990]].
