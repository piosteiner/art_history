biography_md: |-
  Deimantas Narkevičius (born 1964) is a Lithuanian artist, trained as a sculptor, who works mainly with film and video [[source/wikipedia-en-deimantas-narkevicius|introduction]].

  ## Life

  He was born in Utena in the Lithuanian SSR in 1964; Soviet cinema and television of his childhood shaped his later work [[source/wikipedia-en-deimantas-narkevicius|§ Childhood in Utena]]. After school he worked for a year and a half in a museum of Soviet art, and in 1987 he began to study sculpture at the Vilnius Art Institute ([[institution/vilnius-academy-of-art]]); in 1992–1993 he lived in London [[source/wikipedia-en-deimantas-narkevicius|§ Student years in Vilnius and London]]. He represented Lithuania at the 49th Venice Biennale in 2001 [[source/wikipedia-en-deimantas-narkevicius|§ Film career]].

  ## Monuments and memory

  Most of his films deal with the cultural legacy of communism and the attempts to erase it after 1989 and 1991, with an emphasis on statues, sculptors and moving images [[source/wikipedia-en-deimantas-narkevicius|§ Film career]]. *The Role of a Lifetime* (2003) includes drawings of Grūtas Park, where many of Lithuania's Soviet monuments ended up; [[artwork/once-in-the-xx-century]] (2004) runs the removal of Vilnius's Lenin statue backwards; *The Head* (2007) documents the making of Lev Kerbel's Karl Marx head in Karl-Marx-Stadt; *20 July.2015* (2016) the removal of the socialist realist sculptures from Vilnius's Green Bridge [[source/wikipedia-en-deimantas-narkevicius|§ Film career]]. Of such objects he said: "Objects from that period are not a crime. They are rather testimonies to historical crimes" [[source/wikipedia-en-deimantas-narkevicius|§ Film career]].

  ## In the seminar

  *Once in the XX Century* stood for contemporary perspectives on the Soviet legacy [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 40]].
