biography_md: |-
  A Swiss graphic designer, painter, illustrator, engraver and sculptor, born in Lucerne on 21 February 1909, the third of eight children of a cabin-cruiser engineer; he died on 21 March 2015, aged 106.[[source/wikipedia-en-hans-erni|introduction; § Career]] He studied art at the Académie Julian in Paris and later in Berlin, and admired Picasso and Braque; in 1936 he began to work in abstraction.[[source/wikipedia-en-hans-erni|introduction; § Career]]

  ## Work

  His first major public success was the mural *Switzerland, Vacation Land of the People* for the national exhibition in Zurich in 1939.[[source/wikipedia-en-hans-erni|introduction]] From 1940 to 1945 he served in the Swiss army as a camouflage painter.[[source/wikipedia-en-hans-erni|§ Career]] He designed Swiss banknotes in the 1940s that were printed but never issued, because a member of the Lucerne cantonal government denounced him as a communist, although Erni never belonged to any political party.[[source/wikipedia-en-hans-erni|introduction]] Over his career he made about 300 posters and several murals — for the Red Cross, the IOC, the United Nations and ICAO among others — illustrated some 200 books and designed 90 postage stamps and 25 medals.[[source/wikipedia-en-hans-erni|introduction]] In 1964 he took part in documenta in Kassel; in 1979 the Swiss Museum of Transport in Lucerne opened a large collection of his works, now the Hans Erni Museum, for which he painted a mural 30 metres long.[[source/wikipedia-en-hans-erni|introduction; § Career]] One of his posters, [[artwork/erni-rettet-den-wald|*Rettet den Wald*]] of 1983, is in the poster collection of the Museum für Gestaltung in Zurich.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 13]]
