biography_md: |-
  Giacomo Balla (1871–1958) was an Italian painter, teacher and poet and one of the key figures of [[movement/futurism|Futurism]]; his paintings set out to depict light, movement and speed [[source/wikipedia-en-giacomo-balla|§ Introduction]].

  ## Early career

  Balla was born in [[place/turin|Turin]] on 18 July 1871, the son of a chemist with an interest in photography who died in 1878, after which Balla worked in a lithography shop to support his mother [[source/wikipedia-en-giacomo-balla|§ Biography]]. After academic studies in Turin he moved to [[place/rome|Rome]] in 1895, where he worked for several years as an illustrator, caricaturist and portrait painter; from 1899, when he showed at the Venice Biennale, his work appeared at exhibitions in Rome, Venice, Munich, Berlin, Düsseldorf and at the Salon d'Automne in Paris [[source/wikipedia-en-giacomo-balla|§ Biography]]. Around 1902 he taught the techniques of [[movement/divisionism|Divisionism]] to [[artist/umberto-boccioni|Umberto Boccioni]] and Gino Severini [[source/wikipedia-en-giacomo-balla|§ Biography]].

  ## Futurism

  Balla signed the manifesto of the Futurist painters in 1910 as an established artist about a decade older than the other signatories [[source/wikipedia-en-giacomo-balla|§ Biography]]. *Dynamism of a Dog on a Leash* (1912) multiplies legs, tail and leash into a blur of movement, following the *Technical Manifesto*'s claim that moving objects "constantly multiply themselves" [[source/wikipedia-en-futurism|§ Italian Futurism]]; works such as *Abstract Speed + Sound* (1913–14) study speed as symbolised by the automobile [[source/wikipedia-en-giacomo-balla|§ Notable works]]. Balla said that after twenty paintings on the velocity of cars he felt that the single plane of the canvas could not suggest "the dynamic volume of speed in depth", and from 1915 he built abstract "reconstructions" of wire, cardboard, cloth and tissue paper [[source/wikipedia-en-futurism|§ Italian Futurism]]. In 1914 he designed Futurist furniture and "antineutral" clothing, and in 1915 the sculpture *Boccioni's Fist*, based on "lines of force" [[source/wikipedia-en-giacomo-balla|§ Biography]]. With [[artist/fortunato-depero|Fortunato Depero]] he wrote the manifesto [[literature/ricostruzione-futurista-dell-universo|*Ricostruzione futurista dell'universo*]] in 1915 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]] [[source/wikipedia-en-fortunato-depero|§ Early career]]. Unlike other leading Futurists he was not interested in machines or violence; his work tended towards the witty and whimsical [[source/wikipedia-en-giacomo-balla|§ Introduction]]. Balla, like Boccioni and Carlo Carrà, reached artistic maturity before the First World War — unlike [[artist/mario-sironi|Mario Sironi]], the one original Futurist who became a leading artist of the Fascist regime [[source/braun-2000|p. 9]].

  ## Under Fascism

  Initially sympathetic to Fascism, Balla later changed his mind and was shunned by the regime that had once appreciated him; in the 1930s he renounced Futurism and abstraction and returned to a naturalistic style [[source/wikipedia-en-giacomo-balla|§ Biography]]. In these years he painted [[artwork/balla-marcia-su-roma|*Marcia su Roma*]] (1931–32), a history painting of the [[event/march-on-rome|March on Rome]] of 1922 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]]. The seminar took his career — from [[artwork/balla-velocita-astratta|*Velocità astratta*]] (1913) to *The March on Rome* — as a case for the relation between modernism and totalitarian art [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. Balla died in Rome on 1 March 1958; his work was re-evaluated after the war and shown at documenta 8 in Kassel in 1987 [[source/wikipedia-en-giacomo-balla|§ Biography]] [[source/wikipedia-en-giacomo-balla|§ Legacy]].
