biography_md: |-
  Yokoyama Taikan (1868–1958) was one of the three pupils of [[artist/hashimoto-gaho|Hashimoto Gahō]] who led the nihonga movement in the first three decades of the twentieth century, with [[artist/shimomura-kanzan|Shimomura Kanzan]] and [[artist/hishida-shunso|Hishida Shunsō]]. [[source/history-of-japanese-art|p. 364]]

  ## Life

  Born Sakai Hidemaro in Mito, the eldest son of a samurai of the Mito domain, he moved with his family to Tokyo in 1878 and took the surname Yokoyama in 1888. [[source/wikipedia-en-yokoyama-taikan|§ Early life]] In 1889 he entered the first class of the Tōkyō Bijutsu Gakkō, opened by [[person/okakura-kakuzo|Okakura Kakuzō]], and studied there under Hashimoto Gahō. [[source/wikipedia-en-yokoyama-taikan|§ Early life]] Taikan, Kanzan and Shunsō became friends as students, taught at the school, resigned when Okakura left in 1898, and helped him found the Nihon Bijutsuin. [[source/history-of-japanese-art|pp. 364–365]] In 1903 Taikan and Hishida travelled to India and the next year to Europe and the United States. [[source/history-of-japanese-art|p. 365]] When the academy had fallen into financial straits and moved to Izura in 1906, Okakura's disciples stayed faithful, and in 1914, a year after his death, Taikan and Shimomura with a new generation of nihonga artists reorganised it; its annual shows are known as the Inten. [[source/history-of-japanese-art|p. 367]]

  ## Work

  Taikan and Hishida developed a style that did without the outlines of traditional ink painting and defined forms with planes of colour; its critics called it the "muddled style" (mōrōtai), more neutrally the "buried-line technique". [[source/history-of-japanese-art|p. 365]] Taikan's great contribution was the further development of this style, seen in [[artwork/taikan-floating-lights|Floating Lights]] of 1909. [[source/history-of-japanese-art|p. 365]] His [[artwork/taikan-kutsugen|Kutsugen]] of 1898 shows the Chinese poet Qu Yuan standing heroically against a hostile wind and was recognised at the academy's first exhibition as a comment on Okakura's struggle with the Ministry of Education. [[source/history-of-japanese-art|p. 366]] [[source/history-of-japanese-art|p. 367]] He later turned almost entirely to monochrome ink. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]]

  ## Nationalism and war

  Influenced by Okakura's nationalist thought, Taikan repeatedly painted [[place/mount-fuji|Mount Fuji]] and presented such paintings to the imperial family. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]] He was appointed to the Imperial Arts Academy in 1935 and was among the first recipients of the Order of Culture in 1937. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]] During the Second World War he gave his earnings from painting sales to the military, which led to his arrest and interrogation by the occupation authorities after Japan's surrender. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]] The lecture "War and Peace in East Asian Art" showed his [[artwork/taikan-fan-mount-fuji-and-the-rising-sun|fan painting of Mount Fuji and the rising sun]] of the early 1940s. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] He died in Tokyo on 26 February 1958. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]]
