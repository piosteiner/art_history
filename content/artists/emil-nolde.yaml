biography_md: |-
  Emil Nolde, born Hans Emil Hansen near the village of Nolde in the Duchy of Schleswig — since 1920 part of Denmark — grew up on a farm of Danish and Frisian Protestant peasants. He trained as a woodcarver and illustrator in Flensburg (1884–1891), worked in furniture factories, travelled through Munich, Karlsruhe and Berlin and studied at the School of Applied Arts in Karlsruhe from 1889. He became one of the first Expressionists and for a time a member of [[movement/die-brucke|Die Brücke]]; he is known for his brushwork and colour — golden yellows and deep reds — in oils and in watercolours of storm-swept landscapes and flowers, a preoccupation that reflects his interest in [[artist/vincent-van-gogh|Van Gogh]].[[source/wikipedia-en-emil-nolde|introduction; § Early life]]

  ## A "German" artist?

  Throughout the Weimar Republic critics stressed what they took to be his German nature: he was "German to the deepest secrets of his blood", one wrote in 1927, and even the left-liberal Jewish critic Paul Westheim saw in his paintings "the visionary [work] of a nordic human". Nolde himself had long believed that he was a lone fighter against French influence on German art, and in April 1933 he welcomed the "forcefully executed and beautiful rising of the German people".[[source/fulda-soika-2014|pp. 186–187]] The young [[person/joseph-goebbels|Joseph Goebbels]] admired his work and tried, in the months after January 1933, to have the regime adopt Expressionism — relabelled "Nordic Expressionism" — as the modern German aesthetic. When an official of the new Propaganda Ministry sounded him out for the directorship of the Vereinigte Staatliche Kunstschule in Berlin, Nolde was willing ("I would probably have had to do it for the cause") and used the meeting to disqualify a rival candidate, his former Brücke colleague Max Pechstein, by claiming that Pechstein was a Jew; in his memoirs he later wrote that he had turned the post down.[[source/fulda-soika-2014|pp. 187–188]]

  Young National Socialists around Goebbels's assistant Hans Weidemann and the student leader Otto Andreas Schreiber championed him: they had him apply to [[person/alfred-rosenberg|Rosenberg]]'s Combat League for German Culture, turned its rejection into a public attack on the League, showed him in "30 German Artists" at the gallery of [[person/ferdinand-moller|Ferdinand Möller]] in the summer of 1933, sent his works to the Chicago World's Fair and hung a private exhibition of Nolde, [[artist/ernst-barlach|Barlach]], [[artist/erich-heckel|Heckel]], Lehmbruck and [[artist/karl-schmidt-rottluff|Schmidt-Rottluff]] in the ministry itself.[[source/fulda-soika-2014|pp. 188–189]] Alois Schardt, the new director of the Nationalgalerie, planned two halls of the Kronprinzenpalais for him; Magda Goebbels tried out Nolde paintings for the couple's new residence, which — according to Albert Speer — were taken down after Hitler's visit. Gertrud Stickforth, widow of Karl Ernst Osthaus, defended him in the *Völkischer Beobachter* as "the Germans' German" who had fought "the Jewish pack" around Max Liebermann, and Nolde took up her argument in all his later letters to officials.[[source/fulda-soika-2014|pp. 189–190]]

  Even after [[person/adolf-hitler|Hitler]]'s attack on modern art at the Nuremberg rally of September 1933, Nolde's admirers kept his hopes alive. Erna Hanfstaengl showed him in her Munich gallery and placed watercolours in her brother's flat for Hitler to see; through Himmler's wife she had him invited as guest of honour to the tenth anniversary of the Hitler Putsch on 9 November 1933, after which Nolde wrote that "the Führer is great and noble in his aspirations and a genius man of action".[[source/fulda-soika-2014|p. 190]] He lent his name to the 1934 declaration of artists in favour of Hitler's fusion of the offices of chancellor and president, wrote the second volume of his memoirs, *Jahre der Kämpfe*, as a narrative acceptable to the new rulers — his quarrel with Max Liebermann and [[person/paul-cassirer|Paul Cassirer]] over the Berlin Secession's rejection of *Pentecost* now a lone fight against Jewish domination of the art world, with antisemitic passages absent from the first volume of 1931 — and ten days after Hitler's 1934 Nuremberg speech joined the National Socialist association of Northern Schleswig (NSAN).[[source/fulda-soika-2014|pp. 190–191]]

  ## Defamed and banned

  The collaboration yielded almost nothing. In 1937 he was asked to leave the Prussian Academy of Arts and stayed only by pointing to his party membership; 1,052 of his works were confiscated from German museums, more than of any other artist, and the *Entartete Kunst* exhibition that opened in Munich on 19 July 1937 showed around fifty of his paintings, prints and watercolours, with the cycle *The Life of Christ* at its centre.[[source/fulda-soika-2014|pp. 186, 191–192]] Works by Nolde hung at the very entrance of the show, beside Ludwig Gies's crucifix, to suggest that modernism mocked Christianity, and a further room was given to him and the Brücke.[[source/peters-2017|pp. 23–24]] He felt "dishonoured", yet in July 1938, after the law that retrospectively legalised the confiscations, he wrote to Goebbels for the return of his loans to museums, calling his art "German, strong, harsh and deep"; the ministry returned them, *The Life of Christ* among them. After the November pogroms of 1938 he protested to the Reich press chief Otto Dietrich against being listed among Jews, in a letter steeped in antisemitism, and obtained a press directive that he was not to be called a Jew.[[source/fulda-soika-2014|pp. 192–193]]

  In August 1941, after an inspection of his recent work, [[artist/adolf-ziegler|Adolf Ziegler]], president of the Reich Chamber of Fine Arts, expelled him "because of a lack of reliability" and forbade him "any professional [...] activity in the area of the fine arts"; future works were to go before a "Committee for the Assessment of Inferior Artistic Products". It was not quite the "ban on painting" of his later memoirs — he could work in private, but not exhibit, sell or buy materials. He still hoped: in May 1942 he and his wife Ada spent weeks in Vienna in the hope of meeting Baldur von Schirach, and in 1944 Ada wrote to officials of his patriotism and party membership.[[source/fulda-soika-2014|pp. 186, 193–194]] He went on painting small watercolours, which he hoped to carry out in oil once the ban was lifted and which after the war he called his "unpainted pictures" (*ungemalte Bilder*).[[source/fulda-soika-2014|p. 186]]

  ## Afterwards

  After 1945 the visible persecution dominated his image. Siegfried Lenz's novel *The German Lesson* (1968) turned his story into a fiction of the artist against the village policeman, and Chancellor Helmut Schmidt, opening a Nolde exhibition in the Bonn chancellery in 1982, called his defamation a key moment of his own life. Few contradicted: the critic Adolf Behne warned in 1947 that Nolde should not hide behind the label "degenerate", and Karl Hofer privately called him "Nazi-Emil". Until his death at Seebüll in 1956 Nolde presented the "unpainted pictures" as proof of persecution and aesthetic resistance, without mentioning that he had shared the regime's cultural aspirations; artworks like his, Fulda and Soika conclude, "remind us that there is no natural link between modernist art and democratic values".[[source/fulda-soika-2014|pp. 186, 194]]
