biography_md: |-
  German expressionist painter and printmaker, born in Aschaffenburg on 6 May 1880, one of the founders of the artists' group [[movement/die-brucke|Die Brücke]], a key group in the rise of [[movement/expressionism|Expressionism]] [[source/wikipedia-en-ernst-ludwig-kirchner|introduction; § Early life and education]].

  ## Dresden and Berlin

  Kirchner studied architecture at the Royal Saxon Polytechnic in Dresden from 1901 and art in Munich in 1903–1904; in 1905, with the architecture students Fritz Bleyl, [[artist/karl-schmidt-rottluff|Karl Schmidt-Rottluff]] and [[artist/erich-heckel|Erich Heckel]], he founded Die Brücke, which sought a bridge between the past — Dürer, Grünewald, Cranach — and the avant-garde of the present, and revived the woodcut [[source/wikipedia-en-ernst-ludwig-kirchner|§ Student in Munich, Dresden; § Die Brücke, 1905-1913]]. He moved to Berlin in 1911; his *Chronik der Brücke* of 1913 led to the end of the group, and in the next two years he painted his Berlin street scenes [[source/wikipedia-en-ernst-ludwig-kirchner|§ Die Brücke, 1905-1913]]. Volunteering for military service in 1914, he was discharged after a breakdown in 1915 and spent time in sanatoria [[source/wikipedia-en-ernst-ludwig-kirchner|§ Military service and mental breakdown, 1914-1916]].

  ## Davos

  From 1917 Kirchner lived near [[place/davos|Davos]], from 1918 at Frauenkirch, where the farmers and the mountains became his subjects; younger Basel artists of the group Rot-Blau worked under his guidance in the mid-1920s [[source/wikipedia-en-ernst-ludwig-kirchner|§ Davos, 1917-1938]]. He became a member of the Prussian Academy of Arts in 1931, but after 1933 he could no longer sell his paintings in Germany [[source/wikipedia-en-ernst-ludwig-kirchner|§ Davos, 1917-1938]].

  ## Under National Socialism

  Peters counts Kirchner, with Max Beckmann, Emil Nolde and Oskar Schlemmer, among the important artists who "did not go directly into the opposition or completely refused to cooperate", some of whom had not even understood that they were being rejected and defamed [[source/peters-2017|p. 16]]. Hermand notes that he, Nolde and Max Pechstein "attempted to resist these measures by avowing Germanic attitudes", but "their protests were fruitless" [[source/hermand-1994|p. 37]]. In 1937 he was forced to resign from the Prussian Academy; he wrote that "the reason why we founded the Brücke was to encourage truly German art, made in Germany. And now it is supposed to be un-German" [[source/wikipedia-en-ernst-ludwig-kirchner|§ Davos, 1917-1938]]. The Brücke artists were at the centre of the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] in Munich in 1937 [[source/peters-2017|p. 22]]; 25 of the 639 works by Kirchner removed from German museums were shown in it, and more than 600 of his works were sold or destroyed [[source/wikipedia-en-ernst-ludwig-kirchner|introduction; § Davos, 1917-1938]].

  Increasingly disturbed by events in Germany and, after the Anschluss, by the thought of a German invasion of Switzerland, Kirchner died by a gunshot in front of his house in Frauenkirch on 15 June 1938; there are doubts whether it was suicide [[source/wikipedia-en-ernst-ludwig-kirchner|§ Death]].
