biography_md: |-
  Benedetto da Maiano was a Florentine sculptor and architect who began as a woodworker (intagliatore di legname) and excelled in intarsia [[source/ajmar-2024-reciprocal-design|p. 29]]. According to Giorgio Vasari he abandoned intarsia after a commission for the court of King Matthias Corvinus: on the journey to Hungary mildew and damp softened the glue of his intarsia chests so that almost all the pieces fell off — in Vasari's words the fault lay "in the exercise, which was low, and not in Benedetto's ingenuity, which was high and rare" [[source/ajmar-2024-reciprocal-design|p. 29]].

  The lecture gives him the wooden panelling with intarsia of the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo of Federico da Montefeltro]] in the Palazzo Ducale of Urbino, 1474–1476 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]]. Its panels include the [[artwork/studiolo-urbino-federico-da-montefeltro|portrait of the duke]], his [[artwork/studiolo-urbino-rustung|armour]], a [[artwork/studiolo-urbino-fingierter-schrank|feigned cupboard]] with books, hourglass, candle and hand brush, and a [[artwork/studiolo-urbino-ausblick-landschaft|view through an arcade onto a landscape]] with a basket of fruit and a squirrel [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 61–65]].
