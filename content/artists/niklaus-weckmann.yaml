biography_md: |-
  German sculptor, documented in Ulm from 1481 to 1527; his exact dates of life are unknown.[[source/wikipedia-de-niklaus-weckmann|§ introduction]] He first worked on commissions of [[artist/jorg-syrlin-the-younger|Jörg Syrlin the Younger]] and built up the leading carving workshop of southern Germany.[[source/wikipedia-de-niklaus-weckmann|§ introduction]] Syrlin, as cabinetmaker, built the cases and superstructures of altarpieces and gave the carving and painting of the figures to Weckmann's workshop and the panels to Ulm painters.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]]

  Until well into the twentieth century his name was forgotten and many of his works were attributed to Syrlin; only Wolfgang Deutsch's study of 1966 and the Stuttgart exhibition of 1993 ("Meisterwerke massenhaft") established his œuvre.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 31]] Some 600 works from the workshop survive; the organisers of the exhibition estimated its total output at about 6,000, at least 70 works a year.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]] Telling the master's hand from the workshop's is difficult, and the workshop went on producing works with his signature after his death, continued by his stepson of the same name.[[source/wikipedia-de-niklaus-weckmann|§ Die „Werkstatt Weckmann“]]

  Late works include the figures of the Talheim altarpiece (about 1520) and the Flagellation relief from Zwiefalten (1520), both now in Stuttgart; some reliefs of the Death of the Virgin of about 1520 were designed to remain unpainted.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 62, 66]][[source/wikipedia-de-niklaus-weckmann|§ Wichtige Werke Weckmanns]]
