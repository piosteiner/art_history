biography_md: |-
  Renato Righetti (1905–1982), known by the pseudonym Renato Di Bosso, was an Italian sculptor and painter of [[movement/futurism|Futurism]] and [[movement/aeropittura|aeropittura]], born in [[place/verona|Verona]] on 19 September 1905 and died in Negrar on 19 December 1982 [[source/wikipedia-it-renato-righetti|§ Introduction]].

  ## Life and work

  Born into a family of woodcarvers, he studied at the Verona school of decorative art and graduated from the Accademia Cignaroli in 1925; his first works still show the influence of [[artist/adolfo-wildt|Adolfo Wildt]] [[source/wikipedia-it-renato-righetti|§ Biografia]]. Through the works of [[artist/umberto-boccioni|Boccioni]] he turned to Futurism and in 1931 founded the Verona Futurist group "Umberto Boccioni"; from the early 1930s repeated flights led him to aeropainting, and on Marinetti's advice he took the name Di Bosso after the boxwood he favoured for sculpture [[source/wikipedia-it-renato-righetti|§ Biografia]]. He signed several Futurist manifestos — on open-air opera sets for the Arena di Verona (1932), the "Italian tie" (1933) and, in 1941, his own manifesto of "aerosilografia" (aero-woodcut) [[source/wikipedia-it-renato-righetti|§ Biografia]]. He showed at the Venice Biennale (1934, 1936, 1940, 1942) and the Rome Quadriennale (1935, 1939, 1943) [[source/wikipedia-it-renato-righetti|§ Biografia]]. Among his works are the steel sculpture *Milite della rivoluzione fascista* (1935) in the Galleria nazionale d'arte moderna in Rome and *Spiralando sull'Arena di Verona* (1935) in the [[institution/mart-rovereto|MART]] [[source/wikipedia-it-renato-righetti|§ Opere nelle collezioni (parziale)]].

  In 1942 he and [[artist/alfredo-ambrosi|Alfredo Ambrosi]] published *Eroi macchine ali contro nature morte*, renewing the Futurist attack on the still life [[source/wikipedia-it-renato-righetti|§ Biografia]] — see [[literature/eroi-macchine-ali-contro-nature-morte|*Heroes, Machines, Wings against Still Lifes*]]. His studio was bombed during the war and many works were destroyed; afterwards he worked mainly as a critic and returned to exhibiting only in the later 1960s, when the "Second Futurism" was rediscovered [[source/wikipedia-it-renato-righetti|§ Biografia]].
