biography_md: |-
  Basilio Cascella, born in 1860 to a tailor's family that moved to Ortona in 1870, died in Rome on 24 July 1950 [[source/wikipedia-en-basilio-cascella|§ Introduction]] [[source/wikipedia-en-basilio-cascella|§ Biography]]. He trained as a lithographer, in Pescara and from 1875 in Rome, and in Naples from 1879 came into contact with Domenico Morelli and Francesco Paolo Michetti and began to paint in the manner of Verismo [[source/wikipedia-en-basilio-cascella|§ Biography]]. He worked as painter, graphic artist and illustrator, opened a lithographic illustration business in Milan and exhibited in Turin (1884), Venice (1887), London (1888) and Palermo (1891) [[source/wikipedia-en-basilio-cascella|§ Biography]]. In Abruzzo he joined Michetti's circle, frequented by Gabriele D'Annunzio, and from 1899 published illustrated magazines, among them *L'illustrazione abruzzese* and *La Grande Illustrazione*, with contributions by Pirandello, Marinetti, Pascoli and others [[source/wikipedia-en-basilio-cascella|§ Biography]]. His sons Tommaso, Michele and Gioacchino also became artists [[source/wikipedia-en-basilio-cascella|§ Biography]].

  From 1917 he worked as a ceramist in Rapino, producing large tile panels, among them those of the Milano Centrale station (1930) [[source/wikipedia-en-basilio-cascella|§ Biography]]. In the 1920s he joined the National Fascist Party, and from 1929 to 1934 he sat as a deputy in the Chamber [[source/wikipedia-en-basilio-cascella|§ Biography]]. After moving to Rome in 1928 he turned to celebrating events of the regime, and in Parliament argued that art should find its end "in the application that forms the pride of the nations", allowing the Fascist state to use art to exalt itself [[source/wikipedia-en-basilio-cascella|§ Work and style]]. His painting [[artwork/cascella-mussolini-harvesting-wheat|Mussolini Harvesting Wheat]] (1939) shows the leader among the people [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]]. Most of his work is in the Basilio Cascella Civic Museum in Pescara [[source/wikipedia-en-basilio-cascella|§ Work and style]].
