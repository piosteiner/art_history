biography_md: |-
  Yevgeny Kibrik (born Herz Kibrik, 1906–1978) was a Soviet graphic artist, illustrator and teacher, People's Artist of the USSR from 1967 [[source/wikipedia-ru-kibrik-evgeny-adolfovich|introduction]].

  ## Life

  Kibrik was born on 21 February 1906 in Voznesensk, in today's Ukraine, into a well-to-do Jewish family [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]]. He studied at the art school in Odesa from 1922 and from 1925 at the Vkhutein in Leningrad under Kuzma Petrov-Vodkin, then joined Pavel Filonov's studio in 1927 and his collective "Masters of Analytical Art" [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]]. He worked mainly as a book illustrator, chiefly in lithography [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]]. On 28 August 1941 he was arrested in Leningrad for "counter-revolutionary agitation" and deported to Mariinsk; the case was dropped in June 1942 and he was released in July [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]].

  ## Lenin in 1917

  In 1946–1947 he made the series of drawings *V. I. Lenin in 1917*, counted among the most important works of the Soviet images of Lenin; two of its sheets earned him a Stalin Prize of the third degree in 1948 [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]] [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Признание]]. In the seminar his [[artwork/kibrik-leaders-of-october]] (1946–1947) represented history painting in Stalin's time [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]]. He taught for 25 years, from 1954 to 1978, as a professor at the Surikov Institute in Moscow, and died there on 18 July 1978 [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]].
