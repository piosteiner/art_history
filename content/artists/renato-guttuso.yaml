biography_md: |-
  Renato Guttuso (1911–1987) was an Italian painter and politician, one of the key figures of Italian expressionism; his art is marked by social and political commentary, and as a member of the Italian Communist Party he sat in the Senate from 1976 to 1983 [[source/wikipedia-en-renato-guttuso|§ Introduction]].

  ## Early years

  Guttuso was born on 26 December 1911 in Bagheria near [[place/palermo|Palermo]]; his family suffered from the hostility of Fascists and clergy towards his father, a land surveyor and amateur watercolourist [[source/wikipedia-en-renato-guttuso|§ Early life]]. In 1933 his first article on Picasso fell foul of Fascist censorship [[source/wikipedia-en-renato-guttuso|§ Early life]]. Two of his paintings were accepted for the Rome Quadriennale in 1931 [[source/wikipedia-en-renato-guttuso|§ Early life]]. In 1937 he took second place for art criticism at the Littoriali della cultura e dell'arte in Naples, and in 1938, at the Littoriali in Palermo, obliged to appear in the uniform of the Fascist university group, he competed with *Fucilazione in campagna*, dedicated to the poet Federico García Lorca, shot by Franco's supporters [[source/wikipedia-it-renato-guttuso|§ L'arte sociale di Guttuso]].

  ## Against Fascism

  In 1937 Guttuso moved to [[place/rome|Rome]], where he lived among the anti-Novecento artists — Mario Mafai, [[artist/corrado-cagli|Corrado Cagli]] and others — and joined the movement around the journal *Corrente*, characterised by its opposition to Fascist rule [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]] [[source/wikipedia-it-renato-guttuso|§ L'arte sociale di Guttuso]]. In 1940 he joined the clandestine Communist Party [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]]. His *Crucifixion* (1940), which won second prize at the Premio Bergamo in 1942, was denounced by the clergy and the Fascists for showing the horrors of war through a religious subject [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]]. In 1943 he took part in the partisan struggle [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]]. His drawings *Massacri* circulated clandestinely because they depicted Nazi repressions such as the Ardeatine Caves massacre [[source/wikipedia-it-renato-guttuso|§ L'arte sociale di Guttuso]]; from the same years comes the lithograph [[artwork/guttuso-gott-mit-uns|*Gott mit uns*]] (1944), which the seminar presented as an artistic strategy of resistance [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]].

  ## After the war

  In 1945 he co-founded the Fronte Nuovo delle Arti and turned to the lives of peasants and workers, as in *Occupation of the Uncultivated Lands of Sicily* (1949) [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]] [[source/wikipedia-en-renato-guttuso|§ Later life and career]]. He designed the emblem of the re-founded Italian Communist Party [[source/wikipedia-it-renato-guttuso|§ L'arte sociale di Guttuso]], received the Lenin Peace Prize in 1972 and painted *The Funeral of Togliatti* the same year [[source/wikipedia-en-renato-guttuso|§ Political career]] [[source/wikipedia-en-renato-guttuso|§ Later life and career]]. He died in Rome on 18 January 1987 [[source/wikipedia-en-renato-guttuso|§ Death]].
