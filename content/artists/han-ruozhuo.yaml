biography_md: Han Ruozhuo was a Chinese painter active in the early 12th century, known in the lecture "War and Peace in East Asian Art" through [[artwork/han-ruozhuo-sparrows-and-rice-stalks|Sparrows and Rice Stalks]]. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]] The painting's rice stalks, bent with grain, were read as a symbol of a well-run and prosperous country, one of the ways in which peace was pictured. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]
