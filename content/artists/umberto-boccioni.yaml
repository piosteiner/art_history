biography_md: |-
  Umberto Boccioni (1882–1916) was an Italian painter and sculptor and one of the principal figures and the main theorist of [[movement/futurism|Futurism]] [[source/wikipedia-en-umberto-boccioni|§ Introduction]] [[source/wikipedia-en-umberto-boccioni|§ Biography]].

  ## Training

  Born in Reggio Calabria on 19 October 1882, he grew up in Forlì, Genoa and Padua, finished school in Catania and, some time after 1898, studied at the Scuola Libera del Nudo of the Accademia di Belle Arti in [[place/rome|Rome]] [[source/wikipedia-en-umberto-boccioni|§ Biography]]. There he and Gino Severini became pupils of [[artist/giacomo-balla|Giacomo Balla]], who taught them the technique of [[movement/divisionism|Divisionism]] [[source/wikipedia-en-umberto-boccioni|§ Biography]]. After stays in [[place/paris|Paris]] and Russia in 1906 and a short time at the Venice academy, he settled in [[place/milan|Milan]] in 1907, where he met the Divisionist Gaetano Previati in 1908 and [[person/filippo-tommaso-marinetti|Marinetti]] early in 1910 [[source/wikipedia-en-umberto-boccioni|§ Biography]]. Until 1909 he also worked as a commercial illustrator [[source/wikipedia-en-umberto-boccioni|§ Biography]].

  ## Futurist painter and sculptor

  On 11 February 1910 Boccioni signed the *Manifesto of Futurist Painters* with Balla, Carlo Carrà, Luigi Russolo and Severini, and on 8 March he read it at the Politeama Chiarella in [[place/turin|Turin]] [[source/wikipedia-en-umberto-boccioni|§ Biography]]. [[artwork/the-city-rises|*The City Rises*]] (1910), on which he worked for nearly a year, is considered his turning point to Futurism [[source/wikipedia-en-umberto-boccioni|§ Development of Futurism]]. The triptych *States of Mind* (1911) brought his interest in Henri Bergson, Cubism and the experience of modern life together and introduced "lines of force" and "simultaneity" [[source/wikipedia-en-futurism|§ Italian Futurism]]. In 1912 he turned to sculpture with the *Technical Manifesto of Futurist Sculpture*; his main work, *Unique Forms of Continuity in Space* (1913), existed only in plaster during his life and was first cast in bronze in 1931 [[source/wikipedia-en-umberto-boccioni|§ Sculpture]]. In his book *Pittura e scultura futuriste (dinamismo plastico)* (1914) he wrote: "While the impressionists paint a picture to give one particular moment […], we synthesize every moment (time, place, form, color-tone) and thus paint the picture" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 44]].

  ## Politics and war

  Before the First World War Boccioni was among the anarchist-oriented Futurists who, with nationalists and followers of Georges Sorel, advocated an Italian national socialism and exalted war as the means of Italy's spiritual unification [[source/antliff-2002|p. 150]]. In September 1914, during the campaign for intervention, he tore up an Austrian flag in Milan's Teatro Dal Verme [[source/wikipedia-en-futurism|§ Italian Futurism]]. In 1915 he served in the Lombard Battalion of Volunteer Cyclists and Motorists and fought at Dosso Casina on 24 October 1915; drafted into an artillery regiment near [[place/verona|Verona]] in 1916, he was thrown from his horse during a cavalry exercise on 16 August 1916 and died the next day in Verona's military hospital [[source/wikipedia-en-umberto-boccioni|§ Military service and death]]. His war collage [[artwork/boccioni-carica-di-lancieri|*Carica di lancieri*]] (1915) dates from this period [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 43–44]].

  ## Afterlife under Fascism

  Boccioni, Balla and Carrà had reached their maturity before the war; of the original Futurist painters only [[artist/mario-sironi|Mario Sironi]] became a prominent Fascist artist [[source/braun-2000|p. 9]]. After his death *Carica di lancieri* was shown at the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] in 1932 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 44, 67]]. Golomstock read the Futurists' abstract "lines of force" as an idea of struggle that totalitarian art later made concrete as the image of war [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. In 1988 the Metropolitan Museum of Art held a retrospective of 100 works [[source/wikipedia-en-umberto-boccioni|§ Introduction]].
