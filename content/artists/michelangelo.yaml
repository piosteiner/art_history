biography_md: |-
  Michelangelo di Lodovico Buonarroti Simoni (6 March 1475 – 18 February 1564), an Italian sculptor, painter, architect and poet of the High Renaissance, born in the Republic of Florence and active mostly in Rome from his thirties; he is one of the best-documented artists of the 16th century and the first Western artist whose biography was published in his lifetime, in Vasari's *Lives* of 1550.[[source/wikipedia-en-michelangelo|introduction]]

  ## Early years

  Born at Caprese near Arezzo, he grew up in Florence and, after his mother's death in 1481, with a stonecutter's family at Settignano, where his father owned a marble quarry.[[source/wikipedia-en-michelangelo|§ Early life, 1475–1488]] In 1488, aged 13, he was apprenticed to [[artist/domenico-ghirlandaio|Domenico Ghirlandaio]], who in 1489 sent him and Francesco Granacci to Lorenzo de' Medici; from 1490 to 1492 he was at the Medici's Platonic Academy, where he carved the *Madonna of the Stairs* and the *Battle of the Centaurs*.[[source/wikipedia-en-michelangelo|§ Apprenticeships, 1488–1492]] After Lorenzo's death he carved a polychrome wooden crucifix for Santo Spirito (1493), whose prior had allowed him to study anatomy on corpses from the church's hospital.[[source/wikipedia-en-michelangelo|§ Bologna, Florence, and Rome, 1492–1499]] In Rome from 1496 he made the *Bacchus* and the *Pietà*; back in Florence he completed the *David* in 1504.[[source/wikipedia-en-michelangelo|§ Bologna, Florence, and Rome, 1492–1499; § Florence, 1499–1505]]

  ## Rome and Florence

  In 1505 Pope Julius II called him to Rome for his tomb, a project that occupied him for forty years and was never finished to his satisfaction; its *Moses* is in San Pietro in Vincoli.[[source/wikipedia-en-michelangelo|§ Tomb of Julius II, 1505–1545]] Between 1508 and 1512 he painted the [[artwork/sistine-chapel-ceiling|ceiling of the Sistine Chapel]], over 500 square metres with more than 300 figures and nine scenes from Genesis at its centre.[[source/wikipedia-en-michelangelo|§ Sistine Chapel ceiling, 1508 –1512]] For the Medici popes he worked in Florence on the Medici Chapel and the Laurentian Library at San Lorenzo; from 1534 to 1541 he painted the *Last Judgment* on the altar wall of the Sistine Chapel, and from 1546 he was architect of St Peter's, whose dome was completed after his death.[[source/wikipedia-en-michelangelo|§ Florence under Medici popes, 1513 – early 1534; § Rome, 1534–1546; § St Peter's Basilica, 1546–1564]] Vasari called him *divino*, and contemporaries admired his *terribilità*, his power to inspire awe.[[source/wikipedia-en-michelangelo|introduction]]
