biography_md: |-
  Kazimir Malevich (1879–1935) was a Russian avant-garde artist and theorist, the founder of [[movement/suprematism|Suprematism]] and one of the pioneers of abstract painting [[source/wikipedia-en-kazimir-malevich|introduction]].

  ## Life to 1917

  Born near Kyiv to a Polish family, Malevich worked mainly in Russia [[source/wikipedia-en-kazimir-malevich|introduction]]. In Moscow he came to know Western modern art through the collections of Sergei Shchukin and Ivan Morozov [[source/wikipedia-en-kazimir-malevich|§ Kursk and Moscow (1896–1905)]]. He exhibited with Natalia Goncharova and Mikhail Larionov and called his style of 1912–1913 "Cubo-Futurist" ([[movement/cubo-futurism]]); his [[artwork/malevich-the-knifegrinder]] was first shown at the *Target* exhibition in 1913 [[source/wikipedia-en-kazimir-malevich|§ Target Exhibition and Cubo-Futurism (1913)]]. In 1913 he designed the sets and costumes of the opera *Victory over the Sun*, whose curtain held the first black square [[source/wikipedia-en-kazimir-malevich|§ Target Exhibition and Cubo-Futurism (1913)]]. At the *0,10* exhibition in Petrograd in December 1915 he showed 39 abstract paintings, among them the [[artwork/black-square-1915|Black Square]] [[source/wikipedia-en-kazimir-malevich|§ Last Futurist Exhibition 0,10 (1915)]].

  ## After the Revolution

  The Black Square, a starting point of art from nothing, was in line with the new power [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. Malevich sat on the arts collegium of Narkompros and its commissions for monuments and museums in 1918–1919 and taught in Vitebsk beside [[artist/marc-chagall|Marc Chagall]] [[source/wikipedia-en-kazimir-malevich|§ Post-revolutionary years (1918–1935)]]. In his essay "On the Museum" he called on the authorities not to hinder the destruction of old art, which would clear the way for a new aesthetic [[source/groys-1994|p. 147]]: "One could feel more sorry about a screw breaking off than about the destruction of St. Basil Cathedral" [[source/groys-1994|p. 148]]. Groys reads his art as creation by deletion, in which destruction coincides with creativity [[source/groys-1994|p. 149]].

  ## Under Stalin

  After 1924 Malevich lost his state positions and travelled to Europe [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]; in 1927 he exhibited in Warsaw and Berlin, leaving most of his paintings in Berlin [[source/wikipedia-en-kazimir-malevich|§ Travel to Poland and Germany (1927)]]. In the autumn of 1930 the OGPU arrested and interrogated him in Leningrad [[source/wikipedia-en-kazimir-malevich|§ Stalinism and censorship]]. In the 1930s he gave up abstraction and painted peasants in traditional dress, still in a Futurist-Cubist form [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. He died of cancer in Leningrad on 15 May 1935, lying in state under the *Black Square* [[source/wikipedia-en-kazimir-malevich|§ Death]]. Daniil Kharms wrote *On the Death of Malevich* [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].
