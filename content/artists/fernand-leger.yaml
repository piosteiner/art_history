biography_md: |-
  French painter, sculptor and filmmaker, born in Argentan in Normandy on 4 February 1881; in his early work he developed a personal form of [[movement/cubism|cubism]], called "tubism", which he gradually turned into a more figurative, populist style [[source/wikipedia-en-fernand-leger|introduction; § Biography]].

  ## Early work

  Léger trained as an architect and worked as an architectural draughtsman in Paris, studied at the School of Decorative Arts and attended the École des Beaux-Arts and the Académie Julian; he began to paint seriously only at twenty-five [[source/wikipedia-en-fernand-leger|§ Biography]]. In 1911, with Metzinger, Gleizes, Le Fauconnier and Delaunay, he presented Cubism to the public as an organised group at the Salon des Indépendants, and in 1912 he joined the Puteaux Group (Section d'Or) [[source/wikipedia-en-fernand-leger|§ 1909–1914]].

  ## The war and the "mechanical period"

  Mobilised in August 1914, Léger spent two years at the front in the Argonne and nearly died after a mustard-gas attack at Verdun in September 1916; while convalescing he painted [[artwork/leger-la-partie-de-cartes|The Card Players]] (1917), whose robot-like figures reflect his experience of the war [[source/wikipedia-en-fernand-leger|§ 1914–1920]]. He recalled being "stunned by the sight of the breech of a 75 millimeter in the sunlight", and the painting began his "mechanical period" of sleek, tubular, machine-like forms [[source/wikipedia-en-fernand-leger|§ 1914–1920]]. In 1918 the writer Blaise Cendrars asked him to illustrate his short text *J'ai tué*: "all that remains is a smooth and well-organized assemblage of metallic fragments and human bodies", as Éric Michaud writes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 63]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 92]]. For Michaud, Léger's soldiers present "the positive side of the radical transformation humanity undergoes in the war" — already "new men" — in contrast to the maimed bodies in [[artist/otto-dix|Otto Dix]] and [[artist/frans-masereel|Frans Masereel]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 61–64]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, pp. 92–93]].

  ## Later work

  In the 1920s Léger's figure paintings belonged to the post-war "return to order"; he co-directed the film *Ballet mécanique* (1924) and taught at the Académie Moderne from 1924 [[source/wikipedia-en-fernand-leger|§ 1920s]]. During the Second World War he lived in the United States and taught at Yale; back in France in 1945 he joined the Communist Party and painted monumental scenes of popular life — acrobats, builders, country outings [[source/wikipedia-en-fernand-leger|§ 1940s]]. He died at his home in 1955 and is buried in Gif-sur-Yvette [[source/wikipedia-en-fernand-leger|§ 1950s]].
