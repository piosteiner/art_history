biography_md: |-
  Italian painter of the first half of the thirteenth century from Pisa, the earliest Italian painter whose name is found inscribed on a surviving work; he is best known for his painted crucifixes.[[source/wikipedia-en-giunta-pisano|§ introduction]] His dates are uncertain: he may have been born around 1180 or 1202 and died around 1250 or 1258.[[source/wikipedia-en-giunta-pisano|§ Works]]

  His masterpiece is the crucifix for San Domenico in Bologna, signed "Cuius docta manus me pixit Junta Pisanus".[[source/wikipedia-en-giunta-pisano|§ Works]] The lecture dates it 1254 and contrasts it with an older painted cross from the Santo Sepolcro in Pisa as an example of the change from Christus triumphans to Christus patiens.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]] Giunta's crucifixes replaced the traditional Byzantine image of the serene crucified Christ with Christ dying in agony, and strongly influenced Cimabue.[[source/wikipedia-en-giunta-pisano|§ Influence]] A crucifix of 1236 for the high altar of the Upper Church at Assisi is lost.[[source/wikipedia-en-giunta-pisano|§ Works]]
