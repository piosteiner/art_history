biography_md: |-
  Albert Namatjira (Western Arrernte, 1902–1959) became famous painting watercolour landscapes of Central Australia at Hermannsburg mission. In 1957, he was among the first Aboriginal people granted citizenship rights — a conditional citizenship: he still had limited land rights in the Northern Territory, and his family didn't get the same rights. He was convicted of supplying alcohol to another Aboriginal man and sentenced to six months in prison; after a public outcry he served less than two months on the Papunya reserve, and he died in 1959. The Hermannsburg School of watercolourists continues today.

  **Famous works**

  - Albert Namatjira, *watercolour landscapes of the MacDonnell Ranges* (National Gallery of Australia and others)

  **Held sacred today:** Aboriginal and Torres Strait Islander visitors are warned that this page contains names and images of deceased persons. Describe his 1957 citizenship as conditional, with the discrimination he faced and his 1959 imprisonment, rather than only as an honour.

  *From:* Western Arrernte
