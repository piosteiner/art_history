biography_md: |-
  German artist, born Georg Ehrenfried Groß in Berlin on 26 July 1893, known above all for caricatural drawings and paintings of Berlin life in the 1920s and a prominent member of Berlin [[movement/dada|Dada]] and the [[movement/new-objectivity|New Objectivity]] [[source/wikipedia-en-george-grosz|introduction]].

  ## Life

  Grosz grew up in Stolp in Pomerania and in Berlin, studied at the Dresden Academy of Fine Arts from 1909 to 1911 and from 1912 to 1917 at the Berlin College of Arts and Crafts under Emil Orlik [[source/wikipedia-en-george-grosz|§ Early life and education]]. He volunteered for military service in November 1914, was discharged in 1915, drafted again in January 1917 and discharged as permanently unfit in May [[source/wikipedia-en-george-grosz|§ Early life and education]]. In 1916 he changed the spelling of his name to "George Grosz" as a protest against German nationalism; his friend Helmut Herzfeld became [[artist/john-heartfield|John Heartfield]] at the same time [[source/wikipedia-en-george-grosz|§ Early life and education]].

  After the November Revolution he joined the Spartacist League, which became the Communist Party of Germany (KPD); in 1920 he published the drawings *Gott mit uns*, a satire on German society, was fined for insulting the army, and organised and exhibited at the First International Dada Fair [[source/wikipedia-en-george-grosz|§ Political engagement (1918–1921)]]. A six-month stay in Soviet Russia in 1922 left him unimpressed, and he left the KPD in 1923 [[source/wikipedia-en-george-grosz|§ Trip to Russia (1922–1923)]]. In 1928 he and his publisher Wieland Herzfelde were prosecuted for blasphemy over anticlerical drawings in the portfolio *Hintergrund*, among them a crucified Christ in a gas mask and combat boots; they were acquitted in 1929 [[source/wikipedia-en-george-grosz|§ Later activities in Germany]].

  ## Work

  In Berlin from 1918, Grosz used satirical drawings, mostly pen and ink, to attack the bourgeois supporters of the Weimar Republic; corpulent businessmen, wounded soldiers, prostitutes and sex crimes were his great subjects [[source/wikipedia-en-george-grosz|§ Work]]. His art influenced other New Objectivity painters, and in the United States social realists such as Ben Shahn and William Gropper [[source/wikipedia-en-george-grosz|§ Legacy and estate]]. The seminar "Art and Totalitarianism" showed his [[artwork/grosz-to-them-peace-is-assured|To Them Peace Is Assured]] (1920) beside [[artist/otto-dix|Otto Dix]]'s war triptych as an example of how war was shown in its gruesome aspects after the First World War [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 18; class notes, 24 September 2024]].

  ## Emigration

  Bitterly anti-Nazi, Grosz taught the summer semester of 1932 at the Art Students League of New York and emigrated with his family on 12 January 1933; their ship reached New York on 23 January, a week before Hitler came to power [[source/wikipedia-en-george-grosz|§ Emigration to the U.S.]]. Hermand notes that Grosz "had prudently chosen to leave Germany well before 1933" [[source/hermand-1994|p. 37]]. He became a US citizen in 1938 and taught at the Art Students League until 1955 [[source/wikipedia-en-george-grosz|§ Emigration to the U.S.]]. In America he rejected his earlier caricature and painted nudes and landscape watercolours, with exceptions such as *Cain, or Hitler in Hell* (1944) [[source/wikipedia-en-george-grosz|§ Work]]. He returned to Berlin in May 1959 and died there on 6 July 1959 after a fall down a flight of stairs [[source/wikipedia-en-george-grosz|§ Personal life and death]].
