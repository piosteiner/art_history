biography_md: |-
  Giovanni da Verona (1457–1525) was an Olivetan monk and one of the most distinguished intarsia masters of the Renaissance; Marta Ajmar calls him the initiator of a manner of inlay that combined ambitious, multi-layered design with material experiment [[source/ajmar-2024-reciprocal-design|p. 25]]. He was active roughly between 1494 and 1523, almost exclusively in and for religious houses [[source/ajmar-2024-reciprocal-design|p. 31]].

  ## Works

  For the monastery church of [[institution/santa-maria-in-organo|Santa Maria in Organo]] in Verona he made a choir (1493–1499) and a sacristy entirely decorated with intarsia (1519–1523), working with a large team of other artisans [[source/ajmar-2024-reciprocal-design|p. 40]]; the lecture dates the [[artwork/sagrestia-santa-maria-in-organo-tarsie|sacristy panelling]] 1518–1525 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 69]]. In 1504–1506 he made the [[artwork/coro-monte-oliveto-maggiore|choir stalls]] of the abbey of Monte Oliveto Maggiore, with perspectival views through arcades onto ancient ruins [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 67]].

  ## Materials

  Compared with the Canozi brothers, who used more than twenty kinds of wood, Fra Giovanni worked with a narrower range — walnut, maple, spindle wood, "green wood", bog oak and a few others — and widened it by dyeing the wood [[source/ajmar-2024-reciprocal-design|p. 31]]. He used "green wood", stained by the fungus Chlorociboria, systematically in his cycles [[source/ajmar-2024-reciprocal-design|p. 40]], and bought it in 1504 for Monte Oliveto from an outside supplier for 14 soldi [[source/ajmar-2024-reciprocal-design|p. 41]]. He also exploited heat to model forms, as in the rounded grapes of a cupboard panel in Verona [[source/ajmar-2024-reciprocal-design|p. 41]].
