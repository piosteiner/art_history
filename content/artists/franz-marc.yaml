biography_md: |-
  German painter and printmaker, born in [[place/munich|Munich]] on 8 February 1880, one of the key figures of German [[movement/expressionism|Expressionism]] and a founding member of *Der Blaue Reiter* (The Blue Rider) [[source/wikipedia-en-franz-marc|introduction; § Early life]].

  ## Life and work

  The son of the landscape painter Wilhelm Marc, he studied from 1900 at the [[institution/academy-of-fine-arts-munich|Academy of Fine Arts in Munich]] [[source/wikipedia-en-franz-marc|§ Early life]]. In 1910 he formed an important friendship with [[artist/august-macke|August Macke]] and showed at the second exhibition of the Neue Künstlervereinigung in the Thannhauser gallery in Munich [[source/wikipedia-en-franz-marc|§ Career]]. In 1911 he founded the journal *Der Blaue Reiter* with Macke, [[artist/wassily-kandinsky|Wassily Kandinsky]] and others who split from the Neue Künstlervereinigung, and showed in its first exhibition in Munich in 1911–1912 [[source/wikipedia-en-franz-marc|§ Der Blaue Reiter]]. Influenced by [[artist/robert-delaunay|Robert Delaunay]], futurism and cubism, he painted animals in bright, increasingly abstract colour — *The Tiger* and *Red Deer* in 1912, *The Tower of Blue Horses*, *The Foxes* and *Fate of the Animals* in 1913 [[source/wikipedia-en-franz-marc|§ Der Blaue Reiter]]. Drafted as a cavalryman in 1914, he was killed at Verdun on 4 March 1916 [[source/wikipedia-en-franz-marc|introduction; § Wartime]].

  ## "Degenerate art"

  In 1936 and 1937 the National Socialists condemned the long-dead Marc as a "degenerate artist" and had about 130 of his works removed from German museums [[source/wikipedia-en-franz-marc|§ Nazi Germany and the seizure of so-called "degenerate" art]]. Yet in the regime's early years Alois J. Schardt, an enthusiastic advocate of Marc and Lyonel Feininger and briefly head of the Nationalgalerie in Berlin, tried to draw a line from German Romanticism to expressionism, until his ideas were forbidden after a few months [[source/peters-2017|p. 13]]. *The Blue Horses* was sold at the [[event/lucerne-auction-of-degenerate-art-1939|Galerie Fischer auction in Lucerne]] in June 1939 and went to the Musée des Beaux-Arts in Liège [[source/wikipedia-en-franz-marc|§ Nazi Germany and the seizure of so-called "degenerate" art]]. Paintings by Marc were also among the twenty-one works from German museums acquired by the [[institution/kunstmuseum-basel|Kunstmuseum Basel]] between April 1939 and spring 1940 [[source/peters-2017|p. 29]]. *The Foxes* (1913), once owned by the Jewish banker Kurt Grawi, was restituted by the city of Düsseldorf to his heirs after a recommendation of the German Advisory Commission in 2021 [[source/wikipedia-en-franz-marc|§ Nazi Germany and the seizure of so-called "degenerate" art]].
