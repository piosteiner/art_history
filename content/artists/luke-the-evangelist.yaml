biography_md: |-
  The authors of the four Gospels: Matthew, Mark, Luke and John.

  **In art:** His symbol from the vision of Ezekiel is a winged ox; also shown painting the Virgin, which made him patron of painters' guilds.

  *From:* New Testament, Gospels · Christian
