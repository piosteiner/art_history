biography_md: |-
  Adolfo Wildt was born in Milan on 1 March 1868 to a Swiss family settled in Lombardy and died there on 12 March 1931 [[source/wikipedia-en-adolfo-wildt|§ Introduction]] [[source/wikipedia-en-adolfo-wildt|§ Later career]]. He left school at nine to work as a hairdresser and then as a goldsmith, and at eleven was apprenticed to the sculptor Giuseppe Grandi, who taught him to carve marble [[source/wikipedia-en-adolfo-wildt|§ Early life]]. From 1888 he assisted the sculptor Federico Villa and later enrolled at the [[institution/brera-academy|Brera Academy]] [[source/wikipedia-en-adolfo-wildt|§ Early life]]. His first exhibited work, a portrait of his wife (1893), was bought at once by the Galleria Nazionale d'Arte Moderna in Rome [[source/wikipedia-en-adolfo-wildt|§ Early career]]. From 1894 the Prussian collector Franz Rose supported him under an eighteen-year contract, and he showed in Milan, Munich, Zurich, Berlin and Dresden; Adolf von Hildebrand and Auguste Rodin admired the opalescent transparency of his marbles [[source/wikipedia-en-adolfo-wildt|§ Early career]].

  After Rose's death in 1912 he had to face the art market for the first time; he exhibited internationally from 1914 and at the Venice Biennale in 1921, 1924 and 1926 [[source/wikipedia-en-adolfo-wildt|§ Later career]]. In 1921 he founded a school of marble sculpture in Milan and published a book, *The Art of Marble*; in 1927 the school became a three-year course at the Brera Academy, where Lucio Fontana and Fausto Melotti were among his pupils [[source/wikipedia-en-adolfo-wildt|§ Later career]]. His sculpture, rooted in late-nineteenth-century Romanticism, the Secession and Art Nouveau, combines smooth, pure surfaces with an almost frenzied drama [[source/wikipedia-en-adolfo-wildt|§ Artwork]].

  His portrait of Mussolini as a mask, [[artwork/wildt-maschera-di-mussolini|Maschera di Mussolini (Il Duce)]], was first shown in plaster on the first anniversary of the March on Rome in 1923 [[source/manchester-wildt-maschera-di-mussolini]]. "Adolfo Wildt and the representations of Mussolini" was a topic of the Art and Totalitarianism seminar [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]].
