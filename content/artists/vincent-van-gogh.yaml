biography_md: |-
  Dutch painter whose roughly ten-year career produced some 860 oil paintings, most of them in his last two years[[source/wikipedia-en-vincent-van-gogh|“In just over a decade he created about 2,100 artworks, including around 860 oil paintings, most of them in the last two years of his life”]].
  In Paris he discovered Impressionism and collected hundreds of Japanese woodblock prints; in Arles and
  Saint-Rémy he developed the saturated colour and expressive brushwork that made him a founder of modern art[[source/wikipedia-en-vincent-van-gogh|“while in Paris he collected hundreds of them” · “His paintings grew brighter in colour as he developed a style that became fully realised during his stay in Arles” · “bold colours and dramatic, impulsive and expressive brushwork that contributed to the foundations of modern art”]].
