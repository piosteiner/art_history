biography_md: |-
  German visual artist, born Helmut Herzfeld, who pioneered the use of art as a political weapon; some of his best-known photomontages were anti-Nazi and anti-fascist statements [[source/wikipedia-en-john-heartfield|introduction]].

  ## Life

  Heartfield was born in Berlin-Schmargendorf on 19 June 1891, the son of the socialist writer Franz Herzfeld; he studied art in Munich from 1908 to 1911 and from 1912 at the Charlottenburg School of Arts and Crafts [[source/wikipedia-en-john-heartfield|§ Early life, education and work]]. During the First World War he anglicised his name to "John Heartfield" in protest against the anti-British fervour in Germany; in 1916 he and [[artist/george-grosz|George Grosz]] began pasting pictures together, the technique later called photomontage, and in 1917 he, his brother Wieland Herzfelde and Grosz founded the Malik publishing house [[source/wikipedia-en-john-heartfield|§ Early life, education and work]]. He joined Berlin Club Dada, helped organise the First International Dada Fair in 1920, and joined the Communist Party of Germany in January 1918 [[source/wikipedia-en-john-heartfield|§ Early life, education and work]].

  ## Photomontage against National Socialism

  Besides stage sets for Erwin Piscator and Bertolt Brecht and book jackets, photomontage was his main form of expression; he worked chiefly for *Die Rote Fahne* and for the weekly *Arbeiter-Illustrierte-Zeitung* (AIZ), whose covers carried his political montages from 1930 to 1938 at a circulation of up to 500,000 copies [[source/wikipedia-en-john-heartfield|§ Interwar period]]. He is best known for the 240 political photomontages of these years, which often turned Nazi symbols such as the swastika against their own propaganda — among them *Adolf, the Superman* (1932) and *Hurrah, die Butter ist alle!* (1935) [[source/wikipedia-en-john-heartfield|§ Works]]. When the SS broke into his Berlin flat in April 1933 he escaped over the mountains to Czechoslovakia, where the AIZ continued to appear in Prague; in 1938 he fled again, to England, where he was interned as an enemy alien [[source/wikipedia-en-john-heartfield|§ Interwar period; § Selection of notable works]]. Hermand lists him among the artists who preferred to emigrate after 1933 [[source/hermand-1994|p. 37]].

  The seminar "Art and Totalitarianism" took his [[artwork/heartfield-wie-im-mittelalter-so-im-dritten-reich|Wie im Mittelalter … so im Dritten Reich]] (1934) as its example of artistic strategies of resistance [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]], and a student presentation in the session of 19 November 2024 was devoted to his anti-Nazi collages [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 77]].

  ## Later life

  In 1950 Heartfield moved to East Berlin, where he was at first met with suspicion and refused admission to the Academy of Arts; after the intervention of Brecht and Stefan Heym he was admitted in 1956 and worked on stage designs for the Berliner Ensemble and the Deutsches Theater [[source/wikipedia-en-john-heartfield|§ Postwar period]]. He died in East Berlin on 26 April 1968 [[source/wikipedia-en-john-heartfield|§ Death and legacy]].
