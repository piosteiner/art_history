biography_md: |-
  Duilio Cambellotti (1876–1960) was an Italian applied artist, illustrator, painter, sculptor and designer of the [[movement/arts-and-crafts-movement|Arts and Crafts]] and [[movement/art-nouveau|Art Nouveau]] movements, known for his versatility and his loyalty to agrarian themes [[source/wikipedia-en-duilio-cambellotti|§ Introduction]]. He was born in [[place/rome|Rome]] on 10 May 1876 and died there on 31 January 1960 [[source/wikipedia-en-duilio-cambellotti|§ Introduction]].

  ## Craft and theatre

  The son of a woodcarver and decorator, he trained as an accountant but attended courses in chasing and engraving at the Rome Academy of Fine Arts between 1893 and 1897; in 1954 he called himself self-taught [[source/wikipedia-it-duilio-cambellotti|§ Gli anni di studio]]. A follower of William Morris, he believed in restoring craftsmanship to art and design, designed lamps and furniture emblematic of Art Nouveau, and won the Alinari Prize in 1901 for illustrations to Dante's *Divine Comedy* [[source/wikipedia-en-duilio-cambellotti|§ Introduction]]. He worked as a stage designer for the Istituto Nazionale del Dramma Antico in Syracuse from its first production in 1914 until 1939, and designed stained glass, among others for the Casina delle Civette in Rome [[source/wikipedia-it-duilio-cambellotti|§ Scenografo per il teatro]] [[source/wikipedia-it-duilio-cambellotti|§ Architetto]]. [[artist/enrico-prampolini|Enrico Prampolini]] was among his students at the Rome academy [[source/wikipedia-en-enrico-prampolini|§ Life]].

  ## The peasant world and the Agro Pontino

  Rural motifs — above all the ear of wheat — recur throughout his work; he celebrated the "heroic atmosphere" of peasant culture against the decadence of the cities [[source/wikipedia-en-duilio-cambellotti|§ Introduction]] [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]]. In 1905, with Alessandro Marcucci, Giovanni Cena, [[artist/giacomo-balla|Giacomo Balla]], the writer Sibilla Aleramo and other Roman intellectuals, he founded the first schools for peasants on the edge of the Pontine Marshes, and in 1911 he designed the exhibition of the schools of the Agro Romano [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]]. In the years of the regime's *bonifica integrale* his work turned to the theme of labour and the "conquest of the land" [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]]; in 1933 he decorated the new Palazzo del Governo in Ragusa with tempera paintings on the Fascist revolution [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]], and in 1934 he painted [[artwork/cambellotti-la-redenzione-dell-agro|*La redenzione dell'Agro*]] for [[place/latina|Latina]], which the seminar read as an image of the [[term/new-man|New Man]] as worker [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 58]]. A civic museum devoted to him is in Latina [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]].
