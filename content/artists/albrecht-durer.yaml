biography_md: |-
  Albrecht Dürer (21 May 1471 – 6 April 1528), a German painter, printmaker and theorist of the German Renaissance from [[place/nuremberg|Nuremberg]].[[source/wikipedia-en-albrecht-durer|introduction]] His woodcuts made him famous across Europe in his twenties; he was in contact with Raphael, Giovanni Bellini and Leonardo, and from 1512 was patronised by Emperor Maximilian I.[[source/wikipedia-en-albrecht-durer|introduction]] His introduction of classical motifs and the nude into northern art and his treatises on perspective and proportion make him one of the central figures of the Northern Renaissance.[[source/wikipedia-en-albrecht-durer|introduction]]

  ## Life

  The son of a goldsmith who had come to Nuremberg from Hungary, he learned goldsmithing and drawing from his father and was apprenticed in 1486 to Michael Wolgemut, the leading Nuremberg painter; his godfather Anton Koberger became Germany's most successful publisher.[[source/wikipedia-en-albrecht-durer|§ Early life (1471–1490)]] After his years of travel from 1490 — he reached Colmar in 1492, shortly after Martin Schongauer's death — he married Agnes Frey in 1494 and went to Venice the same year; a second Italian journey followed in 1505–1507.[[source/wikipedia-en-albrecht-durer|§ Wanderjahre and marriage (1490–1494); § First journey to Italy (1494–1495); § Second journey to Italy (1505–1507)]] In 1520–1521 he travelled to the Netherlands to secure the patronage of Charles V; he returned ill, and in his last years worked mainly on his theoretical books, published from 1525.[[source/wikipedia-en-albrecht-durer|§ Journey to the Netherlands (1520–1521); § Final years, Nuremberg (1521–1528)]] He died in Nuremberg in 1528 and is buried in the Johannisfriedhof.[[source/wikipedia-en-albrecht-durer|§ Journey to the Netherlands (1520–1521); § Final years, Nuremberg (1521–1528)]]

  ## Work

  Back in Nuremberg in 1495 he opened his own workshop; his woodcuts — the *Apocalypse* of 1498, the *Great Passion*, the *Life of the Virgin* — were larger and more complex than earlier German woodcuts, though the blocks were cut by specialist craftsmen.[[source/wikipedia-en-albrecht-durer|§ Return to Nuremberg (1495–1505)]] Jacopo de' Barbari, who came to Nuremberg in 1500, set him on lifelong studies of proportion that led to the engraving of [[artwork/durer-adam-und-eva-1504|*Adam and Eve*]] (1504), the only engraving signed with his full name.[[source/wikipedia-en-albrecht-durer|§ Return to Nuremberg (1495–1505)]] Studies from nature such as the *Young Hare* (1502) and the *Great Piece of Turf* (1503) belong to the same years.[[source/wikipedia-en-albrecht-durer|§ Return to Nuremberg (1495–1505)]] His most famous engravings, *Knight, Death and the Devil*, *St Jerome in His Study* and *Melencolia I*, date from 1513–1514; for Maximilian he designed the *Triumphal Arch*, printed from 192 blocks.[[source/wikipedia-en-albrecht-durer|§ Nuremberg and the masterworks (1507–1520); § Patronage of Maximilian I]] Michael Baxandall illustrates his discussion of limewood with Dürer's watercolour *Three Lime-trees* of about 1494, formerly in the Kunsthalle Bremen.[[source/baxandall-1980-limewood-sculptors|p. 27]][[source/baxandall-1980-limewood-sculptors|p. 29]]
