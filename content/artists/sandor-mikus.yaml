biography_md: |-
  Sándor Mikus (1903–1982) was a Hungarian sculptor and teacher, twice winner of the Kossuth Prize [[source/wikipedia-hu-mikus-sandor|introduction]] [[source/wikipedia-hu-mikus-sandor|§ Díjai, kitüntetései]].

  ## Life

  Born in Sződ on 11 August 1903, he taught himself to draw and model and worked as a mechanic at the Tungsram works in Újpest from 1924 to 1927 [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]]. Encouraged by Aurél Bernáth and Pál Pátzay, he went to Italy and lived in Florence and Rome until 1930, where he worked in Pátzay's studio; that year he showed at the Venice Biennale [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]]. At the Paris World's Fair of 1937 he won two gold medals [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]]. His small bronzes and medals of the 1930s and 1940s show the human figure in the classical tradition, calm and timeless [[source/wikipedia-hu-mikus-sandor|§ Művei]].

  ## The Stalin monument

  After the war he taught at the Hungarian Academy of Fine Arts (1949–1975) and was its president from 1958 to 1961 [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]]. In 1950 he won the competition for the Stalin monument in Budapest ([[artwork/stalin-monument-budapest]]), which was pulled down in the [[event/hungarian-revolution-of-1956|revolution of 1956]] [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]]. From then on he mostly made monumental public commissions, often enlarging his earlier small sculptures [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]] [[source/wikipedia-hu-mikus-sandor|§ Művei]]. He died in Budapest on 17 September 1982 [[source/wikipedia-hu-mikus-sandor|introduction]].
