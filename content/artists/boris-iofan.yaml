biography_md: |-
  Boris Iofan (1891–1976) was a Soviet architect, known for Stalinist buildings such as the House on the Embankment and for the winning design of the [[artwork/palace-of-the-soviets|Palace of the Soviets]] [[source/wikipedia-en-boris-iofan|introduction]].

  ## Life

  Born in [[place/odessa|Odesa]], he went to Italy before the First World War and graduated in architecture in Rome in 1916 [[source/wikipedia-en-boris-iofan|§ Background]]. His first major work, a sanatorium for the Party elite at Barvikha (1929), brought him to the top of the state [[source/wikipedia-en-boris-iofan|§ Background]]. The House on the Embankment (1931), a block of 505 apartments for the Soviet elite, became an icon of early Stalinism, and Iofan lived there all his life [[source/wikipedia-en-boris-iofan|§ Background]]. Since 1989 it has housed an exhibition on the repression of its residents in the Great Terror [[source/kalashnikov-2023|p. 143]].

  ## The Palace of the Soviets and Paris

  As chief architect Iofan prepared the very competitions he went on to win between 1931 and 1933 [[source/wikipedia-en-palace-of-the-soviets|§ The architect]]. His design won a gold medal at the [[event/paris-international-exposition-1937|1937 exhibition in Paris]], where he also built the Soviet pavilion; the idea of [[artist/vera-mukhina|Vera Mukhina]]'s [[artwork/worker-and-kolkhoz-woman]] on its top was his [[source/wikipedia-en-boris-iofan|§ Palace of Soviets]] [[source/wikipedia-en-boris-iofan|§ Projects]]. He also designed the Soviet pavilion in New York in 1939 [[source/wikipedia-en-boris-iofan|§ Later work]]. After the war he lost the commission for Moscow State University to Lev Rudnev [[source/wikipedia-en-boris-iofan|§ Later work]], and his ever smaller versions of the palace came to nothing [[source/wikipedia-en-palace-of-the-soviets|§ After the demolition (1941–1956)]]. He became People's Architect of the USSR in 1970 [[source/wikipedia-en-boris-iofan|§ Awards]].

  ## Afterlife

  His buildings have been reused in post-Soviet Moscow: a giant Mercedes-Benz logo stood on the roof of the House on the Embankment for over a decade, and his Hotel Moskva was demolished and rebuilt with a copy of its façade [[source/kalashnikov-2023|p. 136]]. In the seminar his palace project stood beside Tatlin's tower [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 29]].
