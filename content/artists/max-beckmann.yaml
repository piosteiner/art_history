biography_md: |-
  German painter, draughtsman, printmaker, sculptor and writer, born into a middle-class family in Leipzig; classified as an Expressionist, he rejected both the term and the movement, and in the 1920s was associated with the [[movement/new-objectivity|New Objectivity]] [[source/wikipedia-en-max-beckmann|introduction; § Life]].

  ## Life and work

  His experiences in the First World War, in which he volunteered as a medical orderly and was discharged after a breakdown, changed his style from academic correctness to a distortion of figure and space [[source/wikipedia-en-max-beckmann|§ Life]]. In the Weimar Republic he enjoyed success and official honours: from 1925 he taught a master class at the Städelschule in Frankfurt, and in 1927–1928 the Nationalgalerie in Berlin acquired *The Bark* and his *Self-Portrait in Tuxedo* [[source/wikipedia-en-max-beckmann|§ Life]]. He is known for the self-portraits he painted throughout his life, and he took up the medieval religious triptych as an allegory of contemporary humanity [[source/wikipedia-en-max-beckmann|§ Life; § Themes]].

  ## Under National Socialism and in exile

  In 1933 the Nazi government called him a "cultural Bolshevik" and dismissed him from his teaching post in Frankfurt [[source/wikipedia-en-max-beckmann|§ Life]]. Peters names him among the important artists who at first "did not go directly into the opposition or completely refused to cooperate" [[source/peters-2017|p. 16]]. In 1937 more than 500 of his works were confiscated from German museums [[source/wikipedia-en-max-beckmann|§ Life]]; works by Beckmann hung in the entrance of the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] in Munich, beside Ludwig Gies's crucifix and works by Nolde, in an introduction meant to present modernism as mocking Christianity [[source/peters-2017|pp. 23–24]]. The day after Hitler's speech on degenerate art in 1937 he left Germany for Amsterdam with his wife Quappi; Hermand lists him among the artists who preferred to emigrate [[source/wikipedia-en-max-beckmann|§ Life]] [[source/hermand-1994|p. 37]]. Paintings by Beckmann were among the twenty-one works from German museums bought by the [[institution/kunstmuseum-basel|Kunstmuseum Basel]] between April 1939 and spring 1940 [[source/peters-2017|p. 29]].

  Beckmann spent ten years in Amsterdam, where he painted several large triptychs; in 1947 he went to the United States, taught in St. Louis and from 1949 at the Brooklyn Museum Art School, and died of a heart attack in New York on 27 December 1950 [[source/wikipedia-en-max-beckmann|introduction; § Life]].
