biography_md: |-
  German carver (about 1480 – after 1521), remembered above all for the Bordesholm altarpiece, now in Schleswig Cathedral.[[source/wikipedia-en-hans-bruggemann|§ introduction]] He is thought to have been born in Walsrode near Hanover and to have travelled to Bremen, Münster, the Lower Rhine and Antwerp before setting up his workshop in Husum.[[source/wikipedia-en-hans-bruggemann|§ Biography]]

  The Bordesholm altarpiece, carved in oak for the Augustinian canons of Bordesholm and completed in 1521, is 12.60 m high; with its finely carved, unpainted figures it is unique in north German art of the period.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 110]][[source/wikipedia-en-hans-bruggemann|§ Bordesholm Altar]] Several of its Passion scenes follow Albrecht Dürer's Small Passion woodcuts, and Hartmut Krohm saw in this a deliberate theological choice of models; Georg Habenicht stresses instead that most of the altarpiece's painting surfaces were simply left bare.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]][[source/habenicht-2016-das-ungefasste-altarretabel|pp. 30, 187]] Other works include a figure of Saint George for St. Mary's in Husum (now in the National Museum of Denmark) and the "Little Bordesholm Altar" at Gottorf; the over-life-size Saint Christopher in Schleswig Cathedral is attributed to him.[[source/wikipedia-en-hans-bruggemann|§ Biography]]
