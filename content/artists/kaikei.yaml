biography_md: Buddhist sculptor, a colleague of [[artist/unkei]], with whom he made the two colossal guardians of the South Gate of Tōdaiji in 1203; also known as An-amida-butsu[[source/kobayashi-1954-unkei|“which Unkei made in collaboration with Kaikei and 16 artisans” · “Kaikei, who is rather famous in his alias, An-amida-butsu”]]. His refined, serene style differs from Unkei's dramatic one[[source/tnm-unkei-exhibition-2017|“this image evokes Kaikei’s refined and serene style more strongly than Unkei’s powerful and dramatic approach”]].
