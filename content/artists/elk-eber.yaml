biography_md: |-
  German painter and graphic artist, born Wilhelm Emil Eber in Haardt on 18 April 1892, who was successful under National Socialism with motifs from the First World War and Nazi propaganda pictures; besides landscapes and sportsmen he painted more and more soldiers and SA men [[source/wikipedia-de-elk-eber|introduction]].

  ## Life

  Eber studied from 1910 in Munich, first art history and anatomy at the university, then at the Kunstgewerbeschule and from 1912 to 1918 at the Academy of Fine Arts under Peter Halm, Adolf Hengeler and Franz von Stuck [[source/wikipedia-de-elk-eber|§ Leben]]. He volunteered in the First World War, took part in the fighting as a war painter, and returned hard of hearing; portraits of comrades and scenes of weapons and war in watercolour, pencil and charcoal followed, many later published as lithographs and postcards [[source/wikipedia-de-elk-eber|§ Leben]]. After the war he joined the Freikorps Werdenfels and in January 1923 the NSDAP, took part in the Hitler Putsch of 1923 and later received the party's Blood Order [[source/wikipedia-de-elk-eber|§ Leben]]. From 1925, after his first contact with Native Americans, he called himself "Elk"; paintings of Native Americans by him are in the Karl May Museum in Radebeul [[source/wikipedia-de-elk-eber|introduction; § Leben]].

  ## Painter of the regime

  Eber joined the SA in 1931 and drew for Nazi papers such as the *Völkischer Beobachter* and *Der SA-Mann*; in 1935 the Städtische Galerie im Lenbachhaus in Munich bought about forty of his drawings of the First World War and the fighting of the Hitler Putsch [[source/wikipedia-de-elk-eber|§ Leben]]. From 1937 he exhibited every year at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition]] in Munich, sixteen oil paintings in all; Hitler bought some of them himself, among them *Die letzte Handgranate*, shown at the opening exhibition of the Haus der Deutschen Kunst in 1937, and on 30 January 1938 he made Eber a professor [[source/wikipedia-de-elk-eber|§ Leben; § Werke (Auswahl)]]. After the invasion of Poland he worked as a war painter in a propaganda company, and pictures of Warsaw by him were shown in the Haus der Deutschen Kunst [[source/wikipedia-de-elk-eber|§ Leben]]. His painting [[artwork/eber-the-battle-for-warsaw|The Battle for Warsaw]] (1940) belongs to this work [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 17]].

  War painting of this kind answered the official line after 1939: with the outbreak of war, Hermand writes, the emphasis on the "heroic" pushed earlier ideas of community further into the background, and in 1944 Wilhelm Westecker called on Germans to celebrate the battlefield as a "grandiose, spectacular drama" [[source/hermand-1994|pp. 43–44]].

  Eber died of tuberculosis in Garmisch-Partenkirchen on 12 August 1941; the Kunstverein München held a memorial exhibition in June 1942, and his poster "Harte Zeiten – Harte Pflichten – Harte Herzen" remained in use until 1945 [[source/wikipedia-de-elk-eber|introduction; § Leben]].
