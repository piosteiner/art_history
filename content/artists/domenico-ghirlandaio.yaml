biography_md: |-
  Domenico di Tommaso Curradi di Doffo Bigordi, known as Domenico Ghirlandaio (2 June 1448 – 11 January 1494), a Florentine painter of the so-called third generation of the Renaissance, with Verrocchio, the Pollaiuolo brothers and Botticelli.[[source/wikipedia-en-domenico-ghirlandaio|introduction]] His particular gift was to set contemporary people and everyday life within religious narratives, which brought him great popularity and many large commissions.[[source/wikipedia-en-domenico-ghirlandaio|introduction]]

  ## Life

  The eldest of six children of Tommaso Bigordi, a dealer in silks, he took his nickname "garland-maker" from his father, who according to Vasari made the metal garlands worn by Florentine women; he trained with Alesso Baldovinetti, or according to another view with Verrocchio.[[source/wikipedia-en-domenico-ghirlandaio|§ Early years]] He led a large, efficient workshop with his brothers Davide and Benedetto and his brother-in-law Bastiano Mainardi; Michelangelo was among his apprentices.[[source/wikipedia-en-domenico-ghirlandaio|introduction; § Critical assessment and legacy]] He died of a "pestilential fever" in January 1494 and was buried in Santa Maria Novella.[[source/wikipedia-en-domenico-ghirlandaio|§ Death]]

  ## Work

  He is known above all for his fresco cycles: the Chapel of Santa Fina in San Gimignano (1477–1478), the *Vocation of the Apostles* on the walls of the Sistine Chapel (from 1481), the life of St Francis in the Sassetti Chapel of Santa Trinita (1482–1485) and the lives of the Virgin and of St John the Baptist in the Tornabuoni Chapel of Santa Maria Novella (1485–1490), with no fewer than twenty-one portraits of the patron families.[[source/wikipedia-en-domenico-ghirlandaio|§ First works in Florence, Rome, and Tuscany; § Later works in Tuscany]] Among his altarpieces is the [[artwork/ghirlandaio-anbetung-der-konige-innocenti|*Adoration of the Magi*]] for the Ospedale degli Innocenti, which includes his self-portrait.[[source/wikipedia-en-domenico-ghirlandaio|§ Later works in Tuscany]] Its contract of 1485, quoted by Michael Baxandall, prescribed the drawing to be followed, the gold and an ultramarine of about four florins the ounce, and a price of 115 large florins.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]] Vasari praised him as one of the most important masters of his age and claimed that he was the first largely to give up gilding, painting golden objects instead.[[source/wikipedia-en-domenico-ghirlandaio|§ Critical assessment and legacy]]
