biography_md: |-
  A tapestry and wine merchant of Tournai, documented from 1447 to 1493.[[source/wikipedia-en-pasquier-grenier|introduction]] Once believed to be a master weaver, he was, as the archives show, one of the most prominent tapestry dealers of 15th-century Western Europe, working with workshops in Tournai, Bruges and Antwerp.[[source/wikipedia-en-pasquier-grenier|introduction]]

  ## Life

  The son of one Lottart, he became a burgher of Tournai on 7 July 1447; with his wife Marguerite de Lannoy he had seven children.[[source/wikipedia-en-pasquier-grenier|§ Life and family]] He lived in the parish of Saint-Quentin, owned houses on the Grand Market and belonged to the noble confraternity of the Damoiseaux.[[source/wikipedia-en-pasquier-grenier|§ Life and family]] From about 1448 he acted in Tournai for the Arras tapestry merchants Truye, and from 1449 sold tapestries to merchants across France; he later set up a branch in Bruges for exports to England, Italy and Spain and kept a showroom in Antwerp, where clients could buy finished hangings or order them.[[source/wikipedia-en-pasquier-grenier|§ Tapestry Merchant; § Wine Merchant]] In 1481 he served as ambassador of King Louis XI to Tournai, and in 1483 he was also registered as a wine dealer.[[source/wikipedia-en-pasquier-grenier|§ Tapestry Merchant; § Wine Merchant]] He paid for the rebuilding of the east end of Saint-Quentin from the 1460s, for paintings in its axial chapel, where he and his wife were buried, and gave the church a set of tapestries of the Seven Sacraments.[[source/wikipedia-en-pasquier-grenier|§ Architectural; § Wall painting and tapestry]] His will is dated 13 July 1493 and he is believed to have died on 21 July 1493.[[source/wikipedia-en-pasquier-grenier|§ Death and legacy]] It left his designs and cartoons to his sons but no tapestries, looms or wool, from which the scholar Guy Delmarcel concluded that he financed the work and subcontracted it to weavers.[[source/wikipedia-en-pasquier-grenier|§ Death and legacy]] His sons Jean and Antoine continued the business until about 1520.[[source/wikipedia-en-pasquier-grenier|§ Death and legacy]]

  ## Sales

  He was the most important supplier of tapestries to the dukes of Burgundy Philip the Good and Charles the Bold.[[source/wikipedia-en-pasquier-grenier|§ Documented tapestry sales to royal clients]] Documented sets include the Story of Alexander (sold to Philip the Good in 1459 for 5,000 écus), the Story of the Trojan War (sets for Charles the Bold, Federico da Montefeltro, Henry VII of England, Charles VIII of France and others), the Passion of Christ (1461), the Swan Knight, Orange Pickers and Woodcutters.[[source/wikipedia-en-pasquier-grenier|§ Documented tapestry sales to royal clients]] Philip the Good bought a suite of woodcutter tapestries in 1461 and another in 1466 for his niece Catherine of Bourbon.[[source/wikipedia-en-pasquier-grenier|§ Woodcutters]] The lecture "Aus dem Wald" opened with a tapestry of [[artwork/holzfaller-bei-der-arbeit-grenier|woodcutters at work in a forest]], about 1460, in the Musée des Arts Décoratifs, Paris, which it gives to the "Atelier Pasquier Grenier".[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 2]]
