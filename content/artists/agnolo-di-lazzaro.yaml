name: Agnolo di Lazzaro
given_name: Agnolo
family_name: di Lazzaro
active: 1436/1440
biography_md: |-
  Agnolo di Lazzaro was a Florentine intarsia maker; the south wall of the Sagrestia delle Messe of [[institution/florence-cathedral|Florence Cathedral]] (1436–1440), with its feigned cupboards and the Agnus Dei relief, is his [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 24]]. The lecture describes his part as intarsia of the south wall with views of cupboards and feigned openings, including a feigned opening with a garland and a feigned relief with the Agnus Dei [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 24–25]], and marked the vanishing lines of the feigned openings in the upper register to show their perspective construction [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 25]]. A further panel with feigned cupboard openings and books, dated 1436–1445, is also given to him [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 51]].

  His work belongs to the earliest phase of the panelling of the [[artwork/sagrestia-delle-messe-intarsie|Sagrestia delle Messe]] (1436–1468), beside that of Antonio Manetti, before [[artist/giuliano-da-maiano|Giuliano da Maiano]] completed the east and west walls in the 1460s [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 21–32]].
