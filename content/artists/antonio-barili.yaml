biography_md: |-
  Antonio Barili was a Sienese architect, engineer, sculptor in wood and intarsia maker [[source/ajmar-2024-reciprocal-design|p. 36]]. Between 1483 and 1504, according to Marta Ajmar, he made an intarsia cycle for the chapel of St John the Baptist in the cathedral of Siena [[source/ajmar-2024-reciprocal-design|p. 36]]; the lecture dates the [[artwork/barili-coro-cappella-san-giovanni-siena|choir stalls]] 1488–1502 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 54]]. Parts survive in the Collegiata of San Quirico d'Orcia, among them a panel with [[artwork/barili-santa-caterina-san-quirico|St Catherine of Alexandria and a lute player]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 55]].

  His best-known work was his [[artwork/barili-autoritratto|self-portrait]], later in the Kunstgewerbemuseum in Vienna and lost in the Second World War [[source/ajmar-2024-reciprocal-design|p. 31]]. It showed him cutting with the shoulder knife the inscription "HOC EGO ANTONIVS BARILIS OPVS COELO NON PENICELLO EXCVSSI AN DN MCCCCCII" — "I, Antonio Barili, have extracted this work with the knife/chisel, not the little brush, AD 1502" [[source/ajmar-2024-reciprocal-design|p. 36]]. Ajmar reads it as a highly self-reflexive work that sets intarsia against painting [[source/ajmar-2024-reciprocal-design|p. 36]] and draws attention to Barili's early use, or possibly invention, of chipboard made from wood shavings [[source/ajmar-2024-reciprocal-design|pp. 30–31]].
