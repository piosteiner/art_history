biography_md: |-
  El Lissitzky (born Lazar Lissitzky, 1890–1941) was a Russian and Soviet painter, illustrator, designer, printmaker, photographer and architect; with his mentor [[artist/kazimir-malevich|Kazimir Malevich]] he developed [[movement/suprematism|Suprematism]] and later designed exhibitions and propaganda for the Soviet Union [[source/wikipedia-en-el-lissitzky|introduction]].

  ## Life

  Born near Smolensk, he studied architectural engineering in Darmstadt from 1909 to 1914 [[source/wikipedia-en-el-lissitzky|§ Early years]]. He began as an illustrator of Yiddish children's books [[source/wikipedia-en-el-lissitzky|introduction]]. In 1919 [[artist/marc-chagall|Marc Chagall]] called him to teach at the art school in Vitebsk, where he persuaded Malevich to join him; in 1920 the two founded the group that became UNOVIS [[source/wikipedia-en-el-lissitzky|§ Suprematism and Vitebsk Art School]] [[source/wikipedia-en-el-lissitzky|§ UNOVIS]]. His poster *Beat the Whites with the Red Wedge* (1919) dates from the civil war [[source/wikipedia-en-el-lissitzky|§ Beat the Whites with the Red Wedge]]. From 1919–1920 he developed his own Suprematist series, the *Prouns* [[source/wikipedia-en-el-lissitzky|§ Prouns]]. In 1921 he went to Berlin as a cultural emissary of Soviet Russia [[source/wikipedia-en-el-lissitzky|§ Return to Germany]]. In 1923 he published the *Victory over the Sun* figurines, among them the [[artwork/lissitzky-new-man]] [[source/wikipedia-en-el-lissitzky|§ Prouns]].

  ## Propaganda years

  After Stalin closed the independent artists' unions in 1932, Lissitzky kept his reputation as a master of exhibition design [[source/wikipedia-en-el-lissitzky|§ Later years]]. From 1932 to 1940 he worked with his wife Sophie on the propaganda magazine *USSR in Construction* [[source/wikipedia-en-el-lissitzky|§ Later years]]. Peter Nisbet saw in this turn "the Prometheus of Proun is transformed into a Stalinist Sisyphus" [[source/wikipedia-en-el-lissitzky|§ Later years]]. One of his last works was a poster calling for more tanks; he died in Moscow on 30 December 1941 [[source/wikipedia-en-el-lissitzky|§ Later years]].

  ## In the seminar

  His New Man is an entirely new being reaching towards an undetermined future, which Mukhina's [[artwork/worker-and-kolkhoz-woman]] only imitates [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]]. In 1930 he published Tatlin's tower design in his book on Soviet architecture, *Russland* [[source/kalashnikov-2023|p. 18]].
