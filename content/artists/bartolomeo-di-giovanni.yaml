biography_md: |-
  Bartolomeo di Giovanni di Domenico (1458? – 1501), a Renaissance painter active in Florence.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]] His works were first identified by Bernard Berenson, who, not knowing his name, called him the "Alunno di Domenico", the pupil of Domenico Ghirlandaio, because he had painted the predella of Ghirlandaio's [[artwork/ghirlandaio-anbetung-der-konige-innocenti|*Adoration of the Magi*]] (1488) in the Ospedale degli Innocenti, the foundling hospital of Florence; archival research later found his real name.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]] He also worked with Sandro Botticelli.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]]

  He painted many narrative panels for predellas, *cassoni* and *spalliere*, as well as altarpieces such as the *Madonna and Child with Four Saints* (1498) for San Giovanni di Boldrone in Florence, now in the Mount Holyoke College Art Museum.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]] He is not to be confused with the sculptor and architect Bartolomeo di Giovanni d'Astore Sinibaldi, with Fra Carnevale (Bartolommeo di Giovanni Corradini), or with two other Florentines of similar name, a cloth painter and a stationer.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]]
