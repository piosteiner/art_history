biography_md: |-
  Iwasa Matabei (1578–1650) is the artist traditionally credited with the parentage of the whole ukiyo genre of illustration, although the only works attributed to him are paintings. [[source/history-of-japanese-art|p. 278]]

  ## Life

  Matabei was the illegitimate son of the samurai Araki Murashige, a trusted adviser of Oda Nobunaga. [[source/history-of-japanese-art|p. 278]] The year after his birth his father rebelled without success and had to flee; his wife and legitimate children were put to death, but Matabei escaped with his wet nurse and was allowed to live in hiding at Honganji in Kyoto. [[source/history-of-japanese-art|p. 278]] He grew up in the capital and probably had a studio there before he left for Fukui in 1615, where he worked for the daimyo Matsudaira Tadanao (1595–1650) and his son; in 1637 he moved to Edo. [[source/history-of-japanese-art|p. 278]] He was trained by Kanō Naizen of the Kanō school but was more influenced by the Tosa tradition, and in 1640 he signed a series of portraits of the Thirty-six Poetry Immortals, commissioned by the shōgun Tokugawa Iemitsu, as "the artist Matabei of the later current from Tosa Mitsunobu". [[source/wikipedia-en-iwasa-matabei|introduction]]

  ## Work

  The best explanation for the name "Ukiyo Matabei" in Edo-period documents is that he pioneered a style of wiry black outlines and bright colours with themes of people in moments of extreme emotion — caught in the noise and excitement of a festival, or in crimes of passion. [[source/history-of-japanese-art|p. 278]] This style probably appealed to the rough townsmen and low-ranking samurai of early Edo, with their taste for action-packed Kabuki, and may have given the early printmakers' designs greater intensity and force. [[source/history-of-japanese-art|p. 278]] A pair of word pictures (moji-e) attributed to him ([[artwork/moji-e-matabei-burke]]) shows a beggar and a samurai official whose thick outlines are in fact hiragana spelling "beggar" and "I humbly thank you". [[source/history-of-japanese-art|p. 278]] His workshop painted long emakimono on jōruri texts, such as the *Yamanaka Tokiwa*, *Jōruri monogatari* and *Horie monogatari* scrolls in the MOA Museum of Art. [[source/wikipedia-en-iwasa-matabei|§ Notable works]] His only work designated a National Treasure is the Funaki screen of scenes in and around Kyoto in the Tokyo National Museum. [[source/wikipedia-en-iwasa-matabei|§ Notable works]] Few works can be attributed to him with certainty, and scholars disagree whether his paintings are ukiyo-e at all or the work of an independent Tosa painter for high-ranking patrons. [[source/wikipedia-en-iwasa-matabei|introduction]]

  The lecture "War and Peace in East Asian Art" showed [[artwork/matabei-twelve-scrolls-battle-scene|a battle scene from a set of twelve scrolls]] attributed to him, dated about 1625–30. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]]
