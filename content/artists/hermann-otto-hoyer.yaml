biography_md: |-
  German painter, born in Bremen on 15 January 1893 and died in Oberstdorf on 30 May 1968 [[source/wikipedia-de-hermann-otto-hoyer|introduction]].

  ## Life

  Hoyer trained as a glass painter and enrolled at the Kunstgewerbeschule in Dresden in 1914 [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]]. Wounded in the First Battle of the Marne in 1914, he spent three years as a French prisoner of war, made four attempts to escape — one from a punishment camp in Tunisia — and lost his right arm in the last, in October 1917, after which he was exchanged and sent back to Germany [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]]. He learned to paint with his left hand, was fitted with a prosthesis by the surgeon Ferdinand Sauerbruch, and from May 1919 studied drawing at the Munich Academy under Hermann Groeber, Carl von Marr and Franz von Stuck [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]].

  From 1925 he lived in Oberstdorf in the Allgäu; he joined the NSDAP on 1 January 1931, served for a time as deputy local group leader, and in April 1933 became one of ten new NSDAP members of the municipal council [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]]. He clashed with the party several times — saying that there were "also decent Jews" and calling a vote of confidence at a party meeting — and withdrew from his party post, without harm to his reputation as a painter [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]]. In 1943 he received the title of professor; in December 1948 a denazification tribunal in Kempten classed him as a *Mitläufer* (follower) [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]].

  ## Work

  Hoyer painted many politically charged pictures and, from 1940, mainly peasant scenes [[source/wikipedia-de-hermann-otto-hoyer|§ Leben]]. His *Der SA-Mann* was placed in the Brown House, the party headquarters in Munich, in 1932; *Fuchstobel im Schnee* (1933) was bought by the Bavarian prime minister Ludwig Siebert in 1935 and is in the [[institution/bavarian-state-painting-collections|Bavarian State Painting Collections]] [[source/wikipedia-de-hermann-otto-hoyer|§ Werk]]. At the [[event/great-german-art-exhibition-1937|Great German Art Exhibition of 1937]] he showed [[artwork/hoyer-am-anfang-war-das-wort|Im Anfang war das Wort]], one of the best-known depictions of Hitler as a speaker, and he exhibited at the following Great German Art Exhibitions of 1938 and 1940 and in "Deutsche Künstler und die SS" (Breslau, 1944) [[source/wikipedia-de-hermann-otto-hoyer|§ Werk; § Ausstellungen (Auswahl)]].

  His peasant pictures fit the official taste Hermand describes: at the 1937 exhibition pastoral landscapes made up about forty per cent of the paintings, motifs of peasant life about twenty per cent, and only five per cent dealt with strictly Nazi themes such as SA pictures or portraits of functionaries [[source/hermand-1994|p. 46]]. Reviewing the 2016 exhibition "Artige Kunst", Sabine Oelze wrote that artists such as Hoyer fell back on "a clumsy and falsifying realism", and that pictures like his *Bauernmahl* (1935) showed the "mendacious visual language" of the National Socialists [[source/wikipedia-de-hermann-otto-hoyer|§ Rezeption]].
