biography_md: |-
  German sculptor, born in Elberfeld on 19 July 1900, best known for his public works in Nazi Germany, where the authorities promoted him as the antithesis of "degenerate art" [[source/wikipedia-en-arno-breker|introduction; § Life]].

  ## Life and work

  The son of a stonemason, Breker studied architecture, stone-carving and anatomy and from the age of twenty sculpture at the Düsseldorf Academy of Arts [[source/wikipedia-en-arno-breker|§ Life]]. In 1927 he moved to Paris, which he considered his home; the dealer [[person/alfred-flechtheim|Alfred Flechtheim]] took him on, and Aristide Maillol later called him "Germany's Michelangelo" [[source/wikipedia-en-arno-breker|§ Life]]. A prize of the Prussian Ministry of Culture took him to Rome for a year in 1932, and in 1934 he returned to Germany [[source/wikipedia-en-arno-breker|§ Life]].

  Although Alfred Rosenberg at first denounced some of his work as degenerate, Breker was supported by Nazi leaders, above all Hitler [[source/wikipedia-en-arno-breker|§ Life]]. In 1936 he made a *Decathlete*, which won the silver medal for statues in the Olympic art competition in Berlin; in 1937 he joined the party and was made "official state sculptor" by Hitler, with a large property and a studio with forty-three assistants, and he was exempted from war service as one of the "Gottbegnadeten" (divinely gifted) artists [[source/wikipedia-en-arno-breker|§ Life]]. His twin figures *The Party* and *The Army* stood at the entrance to Albert Speer's new Reich Chancellery [[source/wikipedia-en-arno-breker|§ Life]]. Neoclassical works with titles such as *Comradeship*, *Torchbearer* and *Sacrifice* typified Nazi ideals and suited Nazi architecture [[source/wikipedia-en-arno-breker|§ Life]]. With [[artist/josef-thorak|Josef Thorak]] he was one of the two "official sculptors" of the Third Reich [[source/wikipedia-en-josef-thorak|§ Career]].

  Breker sat on the nine-member jury of the first [[event/great-german-art-exhibition-1937|Great German Art Exhibition]] in 1937, whose selection so enraged Hitler that the jury was replaced [[source/peters-2017|pp. 15–16, n. 27]]. Peters names him, with Albert Speer and Leni Riefenstahl, among the "competent but second-rate figures" who "stepped into the front row" once Nazi art policy had driven out important artists, and "their artistic achievements are still disputed today" [[source/peters-2017|pp. 16–17]].

  ## After 1945

  About ninety per cent of his public works were destroyed in the bombing of Germany; in 1948 he was classed as a "fellow traveller", but continued to thrive in West Germany, based in Düsseldorf, with commissions from businesses and private patrons, among them portrait busts [[source/wikipedia-en-arno-breker|§ Post-Nazi career]]. Exhibitions of his work at the Centre Georges Pompidou and in Berlin in 1981 met with protests [[source/wikipedia-en-arno-breker|§ Post-Nazi career]]. He died on 13 February 1991 [[source/wikipedia-en-arno-breker|introduction]].
