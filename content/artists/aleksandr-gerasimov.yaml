biography_md: |-
  Aleksandr Gerasimov (1881–1963) was a leading Soviet painter of socialist realism ([[movement/socialist-realism]]) who painted Stalin and other Soviet leaders [[source/wikipedia-en-aleksandr-gerasimov-painter|introduction]].

  ## Life

  Born on 12 August 1881 in Kozlov (now Michurinsk), he studied at the Moscow School of Painting, Sculpture and Architecture from 1903 to 1915, where he championed realistic art against the avant-garde [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. After service in the First World War and the Civil War he worked as a stage designer in his home town and returned to Moscow in 1925 [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. His "heroic realism" showed revolutionary leaders such as Lenin as larger-than-life heroes [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. As Stalin tightened his grip, he concentrated on official portraits, such as *Stalin and Voroshilov in the Kremlin*, which won him a Stalin Prize in 1941 [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]].

  ## Power over art

  In 1943 he was among the first People's Artists of the USSR, with Vera Mukhina among others [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. From 1947 to 1957 he was the first president of the Academy of Arts of the USSR, and he led the attacks on "cosmopolitanism" and "formalism" under Zhdanov [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. On his initiative the Academy moved into Ivan Morozov's former mansion on Prechistenka, where the Museum of New Western Art had been [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]] — the museum that a decree of 6 March 1948 liquidated for spreading "formalist views" [[source/rasmussen-2022|p. 50]]. He replaced his namesake [[artist/sergey-gerasimov|Sergey Gerasimov]] at the head of the artists' union [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. As president of the Academy he is reported to have said that he would hang anyone who dared to exhibit Picasso in the USSR [[source/wikipedia-en-sergey-vasilyevich-gerasimov|§ Biography]]. Groys describes the system behind such careers: the officials of the artists' union, drawn from artists close to the Party elite, controlled exhibitions, criticism and state purchases, and museums had to buy from them [[source/groys-1994|p. 159]].

  ## In the seminar

  His [[artwork/gerasimov-lenin-on-the-tribune]] (1930) opened the theme of the leader's image [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]], and [[artwork/gerasimov-stalin-at-a-meeting-with-commanders]] (1937) the question "Photographic realism or social optimism?" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 21]].
