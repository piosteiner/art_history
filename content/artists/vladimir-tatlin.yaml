biography_md: |-
  Vladimir Tatlin (1885–1953) was a Russian and Soviet painter, architect and stage designer; with [[artist/kazimir-malevich|Kazimir Malevich]] he was one of the two most important figures of the Soviet avant-garde ([[movement/avant-garde]]) of the 1920s [[source/wikipedia-en-vladimir-tatlin|introduction]].

  ## Life

  Born in Moscow or Kharkov, he went to sea as a young man, studied at the art school in Penza from 1905 to 1910 and began his career in Moscow in 1911 as an icon painter [[source/wikipedia-en-vladimir-tatlin|§ Biography]]. A trip to Paris in 1913 acquainted him with Picasso's work [[source/wikipedia-en-vladimir-tatlin|§ Biography]]. His counter-reliefs, three-dimensional constructions of wood and metal, made him a forerunner of Soviet Constructivism, though he did not call himself a constructivist [[source/wikipedia-en-vladimir-tatlin|§ Biography]]. At the *0,10* exhibition of 1915 he quarrelled publicly with Malevich [[source/wikipedia-en-vladimir-tatlin|§ Biography]]. Groys quotes his rule that the artist's way leads "neither toward the new, nor toward the old, but toward the necessary" [[source/groys-1994|p. 152]].

  ## The tower

  In 1919 he began the [[artwork/monument-to-the-third-international]], commissioned under the Lenin Plan for Monumental Propaganda and never built [[source/wikipedia-en-vladimir-tatlin|introduction]] [[source/kalashnikov-2023|p. 17]]. He saw it as a programmatic challenge to the traditional understanding of monuments [[source/kalashnikov-2023|p. 17]].

  ## Later years

  He taught at the Kyiv Art Institute from 1925 to 1927, worked for Moscow theatres from the 1930s, and built the *Letatlin* flying apparatus [[source/wikipedia-en-vladimir-tatlin|§ Biography]]. In 1948 he was attacked as anti-communist and lost his job, but was not repressed; he died in Moscow in 1953 [[source/wikipedia-en-vladimir-tatlin|§ Biography]].
