biography_md: |-
  Boris Yakovlev (1890–1972) was a Russian and Soviet landscape painter and one of the organisers of the Association of Artists of Revolutionary Russia (AKhRR) in 1922 [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|introduction]].

  ## Life

  Born in Moscow on 17 September 1890 (5 September Old Style), he graduated from Moscow University and in 1918 from the Moscow School of Painting, Sculpture and Architecture, in the studio of Apollinary Vasnetsov and Aleksei Stepanov [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Биография]]. In the 1920s and 1930s he travelled widely in the Soviet Union, to Samarkand, the Crimea, Baku, the Urals and Karelia, and during the war painted pictures of Moscow [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Биография]]. He had solo exhibitions at the [[institution/tretyakov-gallery|Tretyakov Gallery]] in 1943 and in 1966, taught at the film school VGIK from 1956 to 1963 and died in Moscow on 8 December 1972 [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Биография]].

  ## Industrial landscape

  Yakovlev was one of the first Soviet painters of the industrial landscape, which celebrated the "romanticism" of socialist construction; *Transport Is Getting Better* (1923) is among his best-known works [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Работы]]. In the seminar it showed how landscapes, still lifes and nudes carried ideology [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]] ([[artwork/yakovlev-transport-is-getting-better]]).
