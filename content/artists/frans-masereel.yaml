biography_md: |-
  Belgian painter and graphic artist who worked mainly in France, known above all for woodcuts on political and social subjects such as war and capitalism, and for more than forty wordless novels in woodcut [[source/wikipedia-en-frans-masereel|introduction]].

  ## Life

  Masereel was born in Blankenberge in West Flanders and grew up in Ghent, where his stepfather, a physician with strong socialist convictions, took the family to protest against the working conditions of the textile workers [[source/wikipedia-en-frans-masereel|§ Upbringing]]. He studied at the École des Beaux-Arts in Ghent; reading Kropotkin and other Russian authors shaped his revolutionary and then anti-militarist outlook [[source/wikipedia-en-frans-masereel|§ Education]]. After four years in Paris from 1911 he moved to Switzerland, where he worked as a graphic artist for journals and magazines [[source/wikipedia-en-frans-masereel|§ Education]]. As a pacifist who had refused to serve in the Belgian army, he could not return to Belgium at the end of the First World War [[source/wikipedia-en-frans-masereel|§ Emigre]].

  From 1921 he lived again in Paris, and for a time in Berlin, where his closest friend among artists was [[artist/george-grosz|George Grosz]]; after the fall of France in 1940 he fled south, taught after 1946 in Saarbrücken, settled in Nice in 1949, and died in Avignon in 1972 [[source/wikipedia-en-frans-masereel|§ Emigre; § Post-World-War II; § Death]].

  ## Work

  His woodcut series, socially critical in content and expressionist in form, made him internationally known — among them the wordless novels *25 Images of a Man's Passion* (1918), *Passionate Journey* (1919), *The Sun* (1919) and *The Idea* (1920) [[source/wikipedia-en-frans-masereel|§ Influence]]. He illustrated works by Romain Rolland, Émile Verhaeren and Pierre Jean Jouve, among them the pacifist anthology *Les Poètes contre la Guerre* (1920) [[source/wikipedia-en-frans-masereel|§ Illustrator]]. His woodcuts influenced Lynd Ward and later graphic artists [[source/wikipedia-en-frans-masereel|§ Influence]].

  In the seminar "Art and Totalitarianism" his woodcut [[artwork/masereel-debout-les-morts|Debout les morts]] stood, with Éric Michaud, for the war's casualties, "maimed and disfigured", who "trace the negative side of all the figures of the New Man that will soon spring from the pencils of artists or the pens of writers and ideologues" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 61]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 92]].
