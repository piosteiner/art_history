biography_md: |-
  Virgil Solis or Virgilius Solis (1514 – 1 August 1562), a German draughtsman and printmaker in engraving, etching and woodcut, a member of a prolific family of artists, who worked in his native city of [[place/nuremberg|Nuremberg]] and died there.[[source/wikipedia-en-virgil-solis|introduction; § Biography]]

  ## Work

  His etchings and engravings were mostly sold as single sheets, while his woodcuts normally illustrated books; many prints signed by him are probably by assistants, among them Jost Amman before he set up his own workshop.[[source/wikipedia-en-virgil-solis|§ Biography]] After his death his widow married his assistant and continued the workshop into the early 17th century.[[source/wikipedia-en-virgil-solis|§ Biography]] In 1555 he published an armorial of the Holy Roman Empire.[[source/wikipedia-en-virgil-solis|§ Biography]] His woodcuts illustrating Ovid's *Metamorphoses*, which partly borrow from earlier illustrations by the French artist Bernard Salomon, were especially influential and were reprinted and copied in many editions, in Latin and in translation.[[source/wikipedia-en-virgil-solis|§ Biography]] One of them, [[artwork/solis-erysichthon|Erysichthon felling the tree of Ceres]], printed in 1569 in Johannes Posthius's *Tetrasticha* in Frankfurt, seven years after his death, was shown in the lecture "Aus dem Wald" as an image of sacrilege against a sacred grove.[[source/rijksmuseum-rp-p-ob-22-088-v]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 64]]
