biography_md: |-
  Arnaldo Enzo Carpanetti was born in [[place/ancona|Ancona]] on 15 January 1898 and died in Milan on 5 April 1969 [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]]. He began his studies in Manaus, Brazil, where at fourteen he painted the halls of the "Casa degli Italiani"; the success earned him a scholarship to the [[institution/brera-academy|Brera Academy]] in Milan, which he left in 1923 [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]]. He belonged to the second wave of the [[movement/novecento-italiano|Novecento Italiano]] and kept to large narrative compositions at a time when such painting was dismissed as rhetorical illustration [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]]. He showed at the Rome Quadriennale and at the Venice Biennale of 1928, 1930, 1934 and 1936, and won the gold medal of the Ministry of Public Education in 1926 and the Premio Principe Umberto in 1928 [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]].

  At the Biennale of 1930 his [[artwork/carpanetti-incipit-novus-ordo|Incipit novus ordo]] won the prize of the National Fascist Party [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]]. For the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] of 1932 he designed two rooms, among the artists — with [[artist/mario-sironi|Mario Sironi]], Esodo Pratelli and Giuseppe Terragni — whose montage installations Emily Braun analysed [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]] [[source/antliff-2002|p. 154]]; Braun reproduces his Room E [[source/braun-2000|p. ix, fig. 110]]. He also painted a fresco in the Ministry of Corporations [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]].
