biography_md: |-
  Tetiana Yablonska (Tatyana Yablonskaya, 1917–2005) was a Russian-Ukrainian painter [[source/wikipedia-en-tetiana-yablonska|introduction]].

  ## Life

  Born in Smolensk on 24 February 1917, she studied from 1935 at the Kyiv State Institute of Art under the modernist Fedir Krychevsky; the German invasion of 1941 interrupted her work, and she returned to Kyiv after its liberation [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. She taught at the institute in 1944–1952 and 1966–1973 [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. Her large canvas of grain and collective farmers of 1949 — [[artwork/yablonska-bread]] — expressed the optimism and zest for work of the post-war years [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. She won Stalin Prizes in 1949 and 1951 and the USSR State Prize in 1979, became People's Artist of the USSR in 1982 and Hero of Ukraine in 2003 [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. Her later style became more laconic and restrained [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. She died in Kyiv on 17 June 2005 [[source/wikipedia-en-tetiana-yablonska|§ Biography]].

  ## In the seminar

  *Bread* stood for labour in totalitarian art; the slide names the painter "Olga Yablonskaya" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]].
