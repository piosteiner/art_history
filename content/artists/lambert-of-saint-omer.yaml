biography_md: |-
  Canon in [[place/saint-omer]], then in the County of Flanders, compiler, scribe and illustrator of the [[literature/liber-floridus|Liber Floridus]], one of the best-known encyclopedias of the Middle Ages.[[source/wikipedia-en-liber-floridus]][[source/wikipedia-de-liber-floridus]] His father Onulfus, who died in 1077, had also been a canon at the church of Notre-Dame of Saint-Omer.[[source/wikipedia-en-liber-floridus]][[source/wikipedia-fr-lambert-de-saint-omer]] The French and Dutch Wikipedia say he was received into the Benedictine abbey of Saint-Bertin as a youth, attended important schools in France and taught grammar, theology and music;[[source/wikipedia-fr-lambert-de-saint-omer]] the English one insists he was a canon of Notre-Dame and must not be confused with his contemporary Lambert, abbot of Saint-Bertin (1095–1125).[[source/wikipedia-en-liber-floridus]]

  He began the Liber Floridus in 1090 and completed it around 1120/21:[[source/wikipedia-fr-lambert-de-saint-omer]] extracts from some 192 works — Isidore's *Etymologiae*, the *Historia Brittonum*, Bartolf of Nangis's crusade chronicle — with a universal history down to 1119, and accounts of crusaders from Saint-Omer whom he apparently met on their return.[[source/wikipedia-en-liber-floridus]][[source/wikipedia-de-liber-floridus]] His own manuscript survives as the [[artwork/liber-floridus-gent|Ghent autograph]] (University Library, Ms. 92); its maps — a map of parts of Europe and two climate-zone drawings after Macrobius — are believed to be by his own hand.[[source/wikipedia-en-liber-floridus]] The codicologist Albert Derolez called his study of it *Lambertus qui librum fecit* (1978) — "Lambert, who made the book".[[source/wikipedia-fr-lambert-de-saint-omer]]
