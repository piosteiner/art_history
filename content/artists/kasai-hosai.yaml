biography_md: Kasai Hōsai was a Japanese painter active in the late 19th and early 20th centuries. [[source/thomsen-2019-war-and-peace|image list, 5 April 2019]] The lecture "War and Peace in East Asian Art" showed his hanging scroll [[artwork/kasai-hosai-nasu-no-yoichi|Nasu no Yoichi on Horseback]], painted in colours and ink on silk in the Meiji period, early 20th century. [[source/thomsen-2019-war-and-peace|image list, 5 April 2019]] Its subject, the archer who shot down the Taira's fan at the Battle of Yashima in 1185, comes from the *Heike monogatari*. [[source/wikipedia-en-nasu-no-yoichi|introduction]]
