biography_md: |-
  Jean Colombe (Latin Ioannes Colombus; about 1430 – about 1493), a French miniature painter and illuminator, the son of Philippe Colombe and Guillemette and brother of the sculptor Michel Colombe.[[source/wikipedia-en-jean-colombe|introduction]]

  ## Work

  For Louis de Laval he painted the miniatures of the *Heures de Louis de Laval* in 1470–1472 and, around 1475, illuminated Sébastien Mamerot's chronicle of the crusades, *Les Passages d'oultre mer*.[[source/wikipedia-en-jean-colombe|§ Work]] He is best known for completing the [[artwork/tres-riches-heures|Très Riches Heures]] of the Duke of Berry, left unfinished in 1416, between 1485 and 1490: he painted the month of November below the zodiac arch, completed the Limbourg brothers' design for September and retouched other pictures.[[source/wikipedia-en-jean-colombe|§ Work]] Duke Charles I of Savoy paid him 25 gold pieces for this work.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|§ Jean Colombe]] Colombe set his large miniatures in frames of marble and gold columns, gave his faces more pronounced features than the Limbourgs and used a very intense blue in his landscapes; he worked in his own style without imitating theirs, and in folio 75 included one of his patron's castles in Savoy, as the Limbourgs had shown the Duke of Berry's.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|§ Jean Colombe]]
