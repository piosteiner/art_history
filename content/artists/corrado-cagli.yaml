biography_md: |-
  Corrado Cagli (1910–1976) was an Italian painter of Jewish family who spent the Second World War in exile in the United States [[source/wikipedia-en-corrado-cagli|§ Introduction]]. He was born in [[place/ancona|Ancona]] on 23 February 1910 and moved with his family to [[place/rome|Rome]] in 1915, where he attended the Academy of Fine Arts [[source/wikipedia-it-corrado-cagli|§ Il primo periodo romano]].

  ## Murals under the regime

  Cagli began as a decorator and muralist: in 1928 he painted scenes of life in the fields, workshops and gymnasiums for the hall of a Rome section of the National Fascist Party, and in 1930 a sixty-metre fresco on the "Battle for Grain" in Umbertide, where he was artistic director of the Rometti ceramics works [[source/wikipedia-it-corrado-cagli|§ Il primo periodo romano]] [[source/wikipedia-it-corrado-cagli|§ A Umbertide]]. In 1932 he founded the group of the "New Roman Painters" with Giuseppe Capogrossi and Emanuele Cavalli, known as the Scuola Romana, and in 1933 he wrote *Muri ai pittori*, a key text of Italian mural painting with positions close to those of [[artist/mario-sironi|Mario Sironi]] [[source/wikipedia-it-corrado-cagli|§ Cagli e i nuovi pittori romani]] [[source/wikipedia-en-corrado-cagli|§ Introduction]]. At the second Rome Quadriennale in 1935 he showed four panels almost four metres high on the reclamation of the Agro Pontino, and he painted *The Battle of San Martino and Solferino* for the Milan Triennale of 1936 and the decorations of the vestibule of the Italian pavilion at the [[event/paris-international-exposition-1937|Paris exhibition of 1937]] [[source/wikipedia-it-corrado-cagli|§ Di nuovo a Roma]]. One of his murals for the Opera Nazionale Balilla in Rome was ordered destroyed by Renato Ricci as thematically unsuitable; another, hidden by Cagli behind a false wall, survived [[source/wikipedia-it-corrado-cagli|§ Di nuovo a Roma]].

  ## Exile

  At the end of 1938, after the Racial Laws and growing anti-Semitic attacks on him and his work, Cagli, Jewish and homosexual, was forced into exile; he went first to [[place/paris|Paris]] and at the end of 1939 sailed from Cherbourg to [[place/new-york-city|New York]], where he soon exhibited at the Julien Levy Gallery [[source/wikipedia-it-corrado-cagli|§ L'esilio e la partecipazione alla Seconda guerra mondiale]]. His collage [[artwork/cagli-new-york|*New York*]] dates from 1940 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 37]]. In 1941 he enlisted in the US Army; he took part in the Normandy landings of 1944 and the campaigns in Belgium and Germany, became an American citizen, and was among the troops that liberated the Buchenwald concentration camp, which he recorded in a series of drawings [[source/wikipedia-en-corrado-cagli|§ Introduction]] [[source/wikipedia-it-corrado-cagli|§ L'esilio e la partecipazione alla Seconda guerra mondiale]]. After the war he co-founded the Ballet Society (today New York City Ballet) with George Balanchine and Lincoln Kirstein [[source/wikipedia-it-corrado-cagli|§ L'esilio e la partecipazione alla Seconda guerra mondiale]].

  ## Return

  In 1948 Cagli settled again in Rome and worked in abstract and non-figurative idioms; he received a Guggenheim Fellowship in 1946 and the Marzotto Prize in 1954 [[source/wikipedia-en-corrado-cagli|§ Introduction]]. In the early 1970s he made the graffito of a dead deportee beside the camp fence for the Museum-Monument to the Political and Racial Deportee in Carpi [[source/wikipedia-it-corrado-cagli|§ Il rientro in Italia]]. He died in Rome on 28 March 1976 [[source/wikipedia-it-corrado-cagli|§ Il rientro in Italia]].
