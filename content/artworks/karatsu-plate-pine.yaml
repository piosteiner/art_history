description_md: "A plate of [[karatsu-ware]] with a slightly raised rim: sandy clay rich in iron, a pine painted in iron brown under a white glaze, the curving trunk and limbs answering the round dish. Karatsu was made by Korean potters in northern Kyūshū; its simple decoration and warm colour suited the tea ceremony. [[source/history-of-japanese-art|p. 252, fig. 289]]"
