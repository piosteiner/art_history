provenance:
  - owner_label: Gaspare di Zanobi del Lama
    acquired: c. 1475
    ended: 1556
    method: commission
    place: florence
    label: for the chapel of the Magi he founded in Santa Maria Novella in 1469
    sources:
      - url: https://www.uffizi.it/en/artworks/boticelli-adoration-lami
        note: He was Gaspare di Zanobi del Lama (1411-1481), an ambitious businessman and agent for the Guild of Cambio. In 1469, he founded a chapel in the Church of Santa Maria Novella dedicated to the Magi and the Epiphany.
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner_label: the Fedini family
    acquired: 1556
    ended: c. 1570
    label: patrons of the chapel
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Botticelli_Uffizi%29
        note: Il patronato della cappella passò nel 1556 ai Fedini e poi verso il 1570 a Flavio Mondragone, istruttore di Francesco I de' Medici.
        source: wikipedia-it-adorazione-botticelli-lama
        accessed: 2026-10-20
  - owner_label: Flavio Mondragone, tutor of Francesco I de' Medici
    acquired: c. 1570
    place: florence
    label: had it taken to his own palace
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Botticelli_Uffizi%29
        note: poi verso il 1570 a Flavio Mondragone, istruttore di Francesco I de' Medici. Il Mondragone fece trasportare il dipinto nel proprio palazzo.
        source: wikipedia-it-adorazione-botticelli-lama
        accessed: 2026-10-20
  - owner_label: the grand-ducal collections (Francesco I de' Medici)
    method: confiscation
    place: florence
    label: Mondragone, accused of treason by Francesco I, was exiled and his goods confiscated
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Botticelli_Uffizi%29
        note: L'esilio di Flavio, accusato di tradimento dallo stesso Francesco, comportò una confisca dei suoi beni, tra cui doveva trovarsi anche il dipinto botticelliano che finì nelle raccolte granducali.
        source: wikipedia-it-adorazione-botticelli-lama
        accessed: 2026-10-20
