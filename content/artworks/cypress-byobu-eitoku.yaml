description_md: "The high point of [[artist/kano-eitoku]]’s formulaic late blue-and-gold style, made under the heavy demands of Hideyoshi’s commissions (Azuchi Castle, Jurakudai, Osaka Castle): a single massive cypress dominates the right half, a pond and faceted rocks the left, unified by gold leaf. Probably painted in 1590 as fusuma for the mansion of Prince Toshihito and later remade into an eight-panel screen, trimmed along its short sides; whether by Eitoku or a pupil is debated. [[source/history-of-japanese-art|pp. 256–257, fig. 296]]"
