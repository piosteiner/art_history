description_md: |-
  The studiolo of [[person/federico-da-montefeltro|Federico da Montefeltro]] in the [[institution/palazzo-ducale-urbino|Palazzo Ducale]] of [[place/urbino|Urbino]] is lined with wooden panelling with intarsia, made in 1474–1476; the lecture gives it to [[artist/benedetto-da-maiano|Benedetto da Maiano]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]]. It was shown next to [[artwork/diptych-of-federico-da-montefeltro-and-battista-sforza|Piero della Francesca's double portrait]] of Federico and Battista Sforza [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 59]].

  ## The panels

  Among the scenes in the panelling are a portrait of the duke himself ([[artwork/studiolo-urbino-federico-da-montefeltro|Federico da Montefeltro]]) [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 61]], his [[artwork/studiolo-urbino-rustung|armour]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 62]], a [[artwork/studiolo-urbino-fingierter-schrank|feigned cupboard]] with books, an hourglass, a candle and a hand brush [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 64]], and a [[artwork/studiolo-urbino-ausblick-landschaft|perspectival view through an arcade onto a landscape]] with a basket of fruit and a squirrel in the foreground [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 65]]. The lecture compared this view with the painted [[artwork/citta-ideale-urbino|view of an ideal city]] in the Galleria Nazionale delle Marche [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 72]].

  ## Intarsia and perspective

  The studiolo stood in the lecture for the perspectival picture as a cut surface: Leon Battista Alberti defined a painting as the intersection of the visual pyramid on a surface, and described the rectangle he drew on the surface as "an open window through which the subject is viewed" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 77–79]]. The illusionistic views of the studiolo were then shown again in this light [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 80]]. The technique was summarised after Thomas Rohark: different woods are laid into or against each other on a flat surface so that a level surface with inclusions of different colour and structure results, the pieces ending flush with the surface; the visibility of the wood itself is decisive [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]].
