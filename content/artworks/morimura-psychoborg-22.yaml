description_md: In a computer-manipulated image [[artist/yasumasa-morimura]] (b. 1951) appears twice in the costumes of Michael Jackson and Madonna — appropriating American pop personalities, as he had put himself into European paintings since the 1980s, and drawing a parallel between their trademark poses and the characters of Japanese cartoons. [[source/history-of-japanese-art|p. 389, fig. 465]]
