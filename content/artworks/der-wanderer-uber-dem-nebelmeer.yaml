provenance_status_note: 'Hamburger Kunsthalle: "ungeklärt, bedenklich" (unresolved, questionable) — research ongoing. A gap of about 120 years, from 1813/1817 to 1938; whether Luz took the work from Jewish owners as an expert of the Reichskammer der bildenden Künste is still open (Bauer/Haug 2024). Unknown too: when it left Henke (1949–1957).'
description_md: |-
  Neither signed nor dated, the painting is known only from 1938, when the Berlin dealer Wilhelm August Luz had it judged by art historians: Karl Wilhelm Jähnig and Ludwig Grote took it for a work by Friedrich, Eberhard Hanfstaengl for one by Carl Gustav Carus; Robert Oertel took the landscape for Friedrich and the figure for Carus[[source/bauer-haug-2024|S. 20–21, 24–27]]. The evidence for Friedrich was his drawing *Felsige Kuppe* of 3 June 1813 in Dresden, used for the rocks in the foreground[[source/bauer-haug-2024|S. 26–27]]. Ludwig Grote gave the painting its title[[source/bauer-haug-2024|S. 27: „Ich taufte es Wanderer über dem Nebelmeer und diesen Titel hat es behalten.“]].

  Bauer and Haug (Hamburger Kunsthalle, 2024) hold the attribution on style alone to be problematic: Carus, Georg Friedrich Kersting or a work of two hands (Friedrich the landscape, Kersting the figure) cannot be ruled out, and a technical examination is still to be made[[source/bauer-haug-2024|S. 20–21, 28–29, 35]]. Proposed dates range from 1813 to around 1820; the museum dates it about 1817[[source/bauer-haug-2024|S. 19, note 1]]. Luz said the man shown was a Saxon forestry official named von Brinken; that is unproven and may have been told to make the work more attractive[[source/bauer-haug-2024|S. 21–23]].
