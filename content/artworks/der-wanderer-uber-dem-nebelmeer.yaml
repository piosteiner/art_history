  - owner: artist/caspar-david-friedrich
    acquired: c. 1817
    method: creation
    direct: true
    notes_md: "When, to whom and how Friedrich sold or passed on the work is unknown; the date is not secure — the work is neither signed nor dated. It is not in the inventory of Friedrich's estate (Sächsisches Staatsarchiv Dresden, Amt Dresden 2686), and Luz will not have had it from Friedrich's family, or he would not have needed the experts' opinions of 1938. Detailed report: [[source/bauer-haug-2024|Bauer/Haug 2024]]."
    sources:
      - url: https://online-sammlung.hamburger-kunsthalle.de/de/objekt/HK-5161#provenienz
        source: hamburger-kunsthalle-online-sammlung
        locator: Provenienz, note 1
        accessed: 2026-10-17
      - note: „Nachlassverzeichnis von Caspar David Friedrich … Kein Befund für den Wanderer ermittelbar.“ (note 3) · „Vermutlich stammt das Gemälde nicht unmittelbar von der Familie Friedrich“ (S. 35)
        source: bauer-haug-2024
        locator: S. 19–20, 24, 35, notes 3, 96
  - owner: institution/galerie-dr-wilhelm-august-luz
    role: dealer
    acquired: 1938-07-06 or earlier
    ended: 1938-10
    place: berlin
    label: "shown to art historians in July–August 1938 (Jähnig, Hanfstaengl, Grote, Oertel): Friedrich or Carl Gustav Carus?"
    notes_md: First documented on 6 July 1938, when Luz showed it to Karl Wilhelm Jähnig — the same day the Reichskammer der bildenden Künste put Luz on its list of experts. Where and as whose work Luz got it is unknown. Jähnig, dismissed in 1937 because his wife was Jewish, and Hanfstaengl, dismissed as director of the Nationalgalerie in 1937, gave their opinions at an insecure time of their lives. A "Gebirgslandschaft mit einsamem Wanderer" by an unknown artist, 73 × 97 cm, auctioned in Berlin on 28 February 1934 (lot 216), is of other measurements.
    sources:
      - url: https://online-sammlung.hamburger-kunsthalle.de/de/objekt/HK-5161#provenienz
        source: hamburger-kunsthalle-online-sammlung
        locator: Provenienz, note 3
        accessed: 2026-10-17
      - note: „Bemerkenswert ist, dass an demselben Tag, an dem Luz seine neue Funktion als Kunstsachverständiger begann, auch der Wanderer erstmals aktenkundig nachweisbar ist.“ (S. 23)
        source: bauer-haug-2024
        locator: S. 20–28, notes 26–27, 4
    records:
      - kind: sighting
        date: 1938-07-06
        note: shown to Karl Wilhelm Jähnig, who recognised it as Friedrich's on the strength of the drawing in Dresden
        place: berlin
        document: data sheet Jähnig / Börsch-Supan
      - kind: document
        date: 1938-07-16
        note: "expert opinion: „eine eigenhändige bedeutende Arbeit von Caspar David Friedrich“"
        document: Jähnig to Luz, DKA Nürnberg, Nachlass Ernst Gosebruch, IC26
      - kind: document
        date: 1938-08-04
        note: "Hanfstaengl had seen it too; Jähnig had considered Carus and Kersting; Hanfstaengl noted: „unzweifelhaft Carus“ (answered 9 August)"
        document: Jähnig to Hanfstaengl, DKA, Nachlass Eberhard Hanfstaengl, 602
      - kind: document
        date: 1938-08-28
        note: "expert opinion: Friedrich, with the drawing of 3 June 1813 as proof"
        place: berlin
        document: Ludwig Grote to Luz, DKA, Nachlass Gosebruch, IC26
      - kind: document
        date: 1938-08-30
        note: first called „Wanderer über dem Nebelmeer“
        place: berlin
        document: Luz to Hanfstaengl, DKA, Nachlass Hanfstaengl, 284
