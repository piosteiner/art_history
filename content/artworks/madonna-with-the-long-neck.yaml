provenance:
  - owner_label: Elena Baiardi Tagliaferri
    acquired: 1534-12-23
    method: commission
    place: parma
    label: commissioned for her chapel in Santa Maria dei Servi, Parma — to be finished in five months; unfinished in the artist's studio when he died in 1540; set up in the chapel in 1542
    price:
      amount: 33
      currency: SCU
      note: paid in advance
    sources:
      - url: https://www.uffizi.it/en/artworks/parmigianino-madonna-long-neck
        note: He was commissioned to paint the Madonna with the long neck in 1534 by Elena Baiardi Tagliaferri for the church of Santa Maria dei Servi in Parma. In the commissioning contract, the artist undertook to finish the painting in five months, but when he died in 1540, the altarpiece was in his study, still unfinished.
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Madonna_dal_collo_lungo
        note: con un contratto datato 23 dicembre 1534. Nel contratto l'artista si impegnava, per trentatré scudi versati in anticipo, a compiere il dipinto in cinque mesi […] venne infine collocata nella cappella nel 1542
        source: wikipedia-it-madonna-collo-lungo
        accessed: 2026-10-20
  - owner: institution/santa-maria-dei-servi-parma
    acquired: 1542
    ended: 1698
    place: parma
    label: the Servite fathers, by then the owners — Cardinal Leopoldo de' Medici negotiated in vain in 1674
    sources:
      - url: https://it.wikipedia.org/wiki/Madonna_dal_collo_lungo
        note: Nel 1674 si interessò all'opera il cardinale Leopoldo de' Medici che, tramite il suo emissario Annibale Ranuzzi, iniziò una trattativa con i padri serviti, divenuti all'epoca proprietari della tavola, che però non portò a un accordo e si interruppe.
        source: wikipedia-it-madonna-collo-lungo
        accessed: 2026-10-20
  - owner: person/grand-prince-ferdinando-de-medici
    acquired: 1698
    method: purchase
    direct: true
    place: florence
    sources:
      - url: https://www.uffizi.it/en/artworks/parmigianino-madonna-long-neck
        note: Joining the Medici collections in 1698, the painting is part of an altarpiece that the Grand Prince Ferdinando had purchased
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner: institution/musee-du-louvre
    role: possessor
    acquired: 1799
    ended: 1815
    method: spoils_of_war
    place: paris
    label: taken to Paris in the Napoleonic spoliations; recovered in 1815 by Senator Giovanni degli Alessandri, who went to Paris with the painter Pietro Benvenuti
    sources:
      - url: https://it.wikipedia.org/wiki/Madonna_dal_collo_lungo
        note: Nel 1799, durante le spoliazioni napoleoniche, fu portata a Parigi, dove restò fino al 1815, grazie alle pratiche espletate dal senatore Giovanni degli Alessandri che si era recato appositamente a Parigi, accompagnato dal pittore Pietro Benvenuti.
        source: wikipedia-it-madonna-collo-lungo
        accessed: 2026-10-20
  - owner: institution/uffizi-gallery
    acquired: 1815
    method: restitution
    place: florence
    label: Palatine Gallery inventory n. 230 — now in the Uffizi
    sources:
      - url: https://www.uffizi.it/en/artworks/parmigianino-madonna-long-neck
        note: Inventory Palatina n. 230
        source: uffizi-artworks
        accessed: 2026-10-20
