provenance:
  - owner_label: unknown
    role: event
    acquired: c. 70–60 BCE
    label: lost in the Antikythera shipwreck; the ship had probably begun its journey on the Ionian coast; in Antikythera
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_Ephebe
        note: The wreck site, which is dated about 70–60 BC … leading scholars to surmise that it had begun its journey on the Ionian coast, perhaps at Ephesus
        source: wikipedia-en-antikythera-ephebe
        accessed: 2026-11-24
  - owner_label: sponge divers
    acquired: 1900
    method: find
    label: retrieved in numerous fragments; in Antikythera
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_Ephebe
        note: a Greek bronze statue of a young man of languorous grace that was found in 1900 by sponge-divers in the area of the ancient Antikythera shipwreck off the island of Antikythera, Greece. … was retrieved in numerous fragments.
        source: wikipedia-en-antikythera-ephebe
        accessed: 2026-11-24
  - owner: institution/national-archaeological-museum-of-athens
    method: transfer
    place: athens
    label: registered as 'Bronze statue of a youth', inventory X 13396; first restoration revised in the 1950s under Christos Karouzos
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_Ephebe
        note: The Antikythera Ephebe, registered as Bronze statue of a youth in the museum collections … Its first restoration was revised in the 1950s, under the direction of Christos Karouzos
        source: wikipedia-en-antikythera-ephebe
        accessed: 2026-11-24
      - url: https://www.namuseum.gr/en/to-moyseio/istoria-toy-moyseioy/the-rescue-of-the-statues/
        note: Bronze statue of a youth. From the Antikythera shipwreck (retrieved in 1900-1901). Around 340-330 BC (X 13396).
        source: nam-athens-rescue-of-the-statues
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1940/1941
    place: athens
    label: photographed among the antiquities hidden by the museum in 1940–1941; the occupation forces' request of June 1941 to exhibit it among 103 statues was never carried out
    sources:
      - url: https://www.namuseum.gr/en/to-moyseio/istoria-toy-moyseioy/the-rescue-of-the-statues/
        note: Indeed, already in June 1941 Hans Ulrich von Schönebeck … had asked persistently for the re-opening of the National Museum. For this purpose, the occupation forces compiled a list of 103 statues with the request to be exhibited, among them the Poseidon of Artemision, the ephebe of Anticythera and the ephebe of Marathon, an order that was never implemented.
        source: nam-athens-rescue-of-the-statues
        accessed: 2026-11-24
