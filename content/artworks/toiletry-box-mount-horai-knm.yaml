description_md: "A small toiletry box of black lacquer, painted on four sides in gold [[maki-e]] with flying geese and trees — pure [[kara-e]]: Mount Hōrai, the Daoist mountain of the elixir of immortality, with a weathered rock and a stunted cypress by a lake (such rocks came from a lake near Hangzhou) and two groups of geese flying south, an image of the coming of winter. [[source/history-of-japanese-art|p. 178, fig. 205]]"
