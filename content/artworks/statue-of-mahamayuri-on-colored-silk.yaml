provenance:
  - owner_label: unknown Buddhist painter
    acquired: 12th century
    method: creation
    label: Heian period; based on the Kūkai-related icon then at Ninna-ji; a high-ranking noble may have had it made to pray for a safe childbirth
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=0&content_base_id=100158&content_part_id=0&content_pict_id=0
        note: 平安時代・12世紀 … 当時仁和寺（にんなじ）にあった由緒ある作例にもとづいたことが明らかにされている。 … 図像の改変には高位の貴族がかかわり安産祈願を目的に制作されたこと … が指摘されている。
        source: emuseum-100158
        accessed: 2026-11-24
  - owner: person/inoue-kaoru
    label: formerly owned by the Meiji statesman Inoue Kaoru
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=0&content_base_id=100158&content_part_id=0&content_pict_id=0
        note: 本図は明治・大正期の政治家、井上馨（いのうえかおる）旧蔵である。
        source: emuseum-100158
        accessed: 2026-11-24
  - owner: person/hara-sankei
    acquired: 1903
    method: purchase
    label: bought by Hara Sankei (Tomitarō), then 35, for the unheard-of price of ¥10,000 — the purchase that made his name as a collector
    price:
      amount: 10000
      currency: JPY
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=0&content_base_id=100158&content_part_id=0&content_pict_id=0
        note: 明治36年（1903）、当時35歳の原三渓（はらさんけい）（富太郎（とみたろう）、1868～1939）が一万円という破格の値段で入手し、美術コレクターとして彼の名を知らしめる契機となった作品である。
        source: emuseum-100158
        accessed: 2026-11-24
  - owner_label: Hara family
    label: remained with the Hara family
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=0&content_base_id=100158&content_part_id=0&content_pict_id=0
