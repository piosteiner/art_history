description_md: |-
  This intarsia panel in the studiolo of [[person/federico-da-montefeltro|Federico da Montefeltro]] in the [[institution/palazzo-ducale-urbino|Palazzo Ducale]] of Urbino shows the duke's armour; it was made by [[artist/benedetto-da-maiano|Benedetto da Maiano]] in 1474–1476 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 62]]. It belongs to the wooden panelling of the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]].

  The lecture showed it beside the intarsia [[artwork/studiolo-urbino-federico-da-montefeltro|portrait of the duke]] in the same room [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 62]]. Like the other panels of the studiolo it is built from pieces of wood of different colour and grain laid flush into a flat ground [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]]; the usual palette of Italian Renaissance intarsia ranged from the white of spindle wood through the mid-brown of walnut and the red-brown of pear to the black of bog oak [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]].
