provenance:
  - owner_label: Minoan palace at Knossos
    acquired_label: no earlier than Middle Minoan III
    method: creation
    label: stucco relief panel on the upper storey of the east wall of the palace at Knossos
    sources:
      - url: https://en.wikipedia.org/wiki/Bull-Leaping_Fresco
        note: The Bull-Leaping Fresco is the most completely restored of several stucco panels originally sited on the upper-story portion of the east wall of the Minoan palace at Knossos in Crete. … They are, in other words, instances of the "mature art" created no earlier than MM III.
        source: wikipedia-en-bull-leaping-fresco
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired_label: Late Minoan II
    label: the panels fell from the upper storey when the palace was destroyed, probably by earthquake
    sources:
      - url: https://en.wikipedia.org/wiki/Bull-Leaping_Fresco
        note: The flakes of the destroyed panels fell to the ground from the upper story during the destruction of the palace, probably by earthquake, in Late Minoan (LM) II.
        source: wikipedia-en-bull-leaping-fresco
        accessed: 2026-11-24
  - owner: person/arthur-evans
    acquired: 1901
    method: find
    label: fragments found in the Court of the Stone Spout, Knossos, in Evans's excavation (Evans owned the palace site); reconstructed by Émile Gilliéron père
    sources:
      - url: https://en.wikipedia.org/wiki/Bull-Leaping_Fresco
        note: Arthur Evans, Keeper of the Ashmolean Museum, owner of the palace and director of excavation, presents the topic in Chapter III of his monumental work on Knossos and Minoan Civilization, Palace of Minos.
        source: wikipedia-en-bull-leaping-fresco
        accessed: 2026-11-24
      - url: https://minoanroom.ashmolean.org/catalogue/aje_4_1_15_1_7/
        note: The Taureador Fresco was reconstructed from fragments discovered in the Court of the Stone Spout in 1901. Emile Gilliéron père both reconstructed the fragments and painted this copy for Evans, which was first exhibited in 1902 in Oxford.
        source: ashmolean-minoan-room-taureador-fresco
        accessed: 2026-11-24
  - owner: institution/heraklion-archaeological-museum
    place: heraklion
    label: the restored panel; when it came to the museum is not stated
    sources:
      - url: https://en.wikipedia.org/wiki/Bull-Leaping_Fresco
        note: "| city = [[Heraklion]], Crete | museum = [[Heraklion Archaeological Museum]]"
        source: wikipedia-en-bull-leaping-fresco
        accessed: 2026-11-24
