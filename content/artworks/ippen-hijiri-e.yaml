description_md: "Twelve scrolls on the life and travels of [[person/ippen]] (1239–1289), founder of the Ji school, who wandered Japan spreading the nenbutsu and the ecstatic dancing nenbutsu (nenbutsu odori). The text was composed in 1299 by his younger brother Shōkai; the illustrations are by [[artist/en-i]], perhaps a monk-painter or a professional. Accurate views of well-known places make it a valuable historical document, and Eni gives it a lyric quality: Ippen and his followers crossing the snow-covered fields of the Kantō in soft browns and greens, and the throng gathered in two pavilions for a dancing nenbutsu. [[source/history-of-japanese-art|pp. 203–205, figs. 236–237]]"
