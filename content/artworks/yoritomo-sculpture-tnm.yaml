description_md: "A posthumous portrait of [[person/minamoto-no-yoritomo]] as shogun that translates the yamato-e portrait into three dimensions: the pale, alert face of a confident young courtier, in a hunting jacket (kariginu) over baggy trousers and a tall black hat of starched gauze. Such images were common in the ancestral shrines of the great clans; it probably stood among those of a Minamoto family shrine. [[source/history-of-japanese-art|p. 169, fig. 202]]"
