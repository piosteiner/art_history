description_md: |-
  This lead pilgrim's flask (ampulla), only 4.6 cm high, shows the Crucifixion and the women at the tomb; it dates from the late sixth or early seventh century and is in the Dumbarton Oaks Collection in Washington, D.C. (BZ.1948.18).[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 44]] Its Greek inscription reads ΕΛΑΙΟΝ ΞΥΛΟΥ ΖΩΗΣ ΤΩΝ ΑΓΙΩΝ ΧΥ ΤΟΠΩΝ, "oil of the wood (tree) of life of the holy places of Christ".[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 45]]

  The lecture read the flask with the pilgrims' reports from Jerusalem.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 42]] Around 570 the anonymous pilgrim of Piacenza described how the wood of the cross, which he says was of walnut, was carried out for veneration in the atrium of Constantine's church at the Holy Sepulchre; small flasks of oil were brought to be blessed, and as soon as the cross touched the rim of a flask, the oil bubbled up and had to be quickly closed in.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 42]] Such flasks were thus contact relics: they carried home oil that had touched the "wood of life".[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 42]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 45]] A century and a half earlier, the pilgrim Egeria (381–384) described the Good Friday veneration of the wood of the cross on Golgotha, guarded by deacons since someone had once bitten off and stolen a splinter.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 41]]
