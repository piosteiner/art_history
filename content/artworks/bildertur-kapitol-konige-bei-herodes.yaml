description_md: "This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the three Magi before Herod and the Adoration of the Magi.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 92]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 109]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] Richard Hamann used this panel to distinguish two carvers: compared with the healing of the blind man on the right leaf, the Magi before Herod are carved fully in the round and richly worked, while the other carver works with clear structure and vertical lines.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]] The lecture took the Herod scenes – the Magi at Herod's court, the sending out and return of the messengers, the massacre of the innocents – together as a sequence.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 109]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 110]]"
