description_md: The hall of the Four Guardian Kings at [[institution/manpuku-ji]], the temple of the Ōbaku Zen school founded by the Chinese priest [[person/ingen]] (1592–1673), who reached Nagasaki in 1654 and was given land near Uji by the Konoe family in 1661. Inside sit a Hotei (an incarnation of Miroku) and a standing Idaten; covered passages connect it with the subsidiary buildings. Round windows and railings give the temple its Chinese flavour. [[source/history-of-japanese-art|pp. 307–308, fig. 356]]
