  - owner_label: unknown sculptor
    acquired: late 10th century
    method: creation
    label: seated portrait of Chishō Daishi (Enchin, 814–891), dated by style to the later 10th century; some think it was newly made at Onjō-ji around 993
    certainty: probable
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 作風的には10世紀後半頃のものと見られ、正暦4年頃に園城寺で新たに造像されたとの見方もある。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/207
        note: 時代 ： 平安
        source: kunishitei-201-207
        accessed: 2026-11-24
  - owner: institution/enryaku-ji-temple
    label: said to have been at the Sannō-in (Senju-in) on Mount Hiei, where Enchin had lived and died; in Mount Hiei
    certainty: probable
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: この像はもと比叡山内の山王院（千手院）にあったといわれ
        source: jawiki-onjo-ji
        accessed: 2026-11-24
  - owner: institution/mii-dera
    acquired: 993
    method: transfer
    place: otsu
    label: carried down from Mount Hiei by Enchin's followers when they left it in 993 and enshrined in Onjō-ji's Tōin; now in the central shrine of the Tōin Daishi-dō, shown only on 29 October; Onjō-ji is the owner today
    certainty: probable
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 円珍派は千手院に安置されていた円珍像を持って比叡山を下ると別院であった当寺に移り、円珍像を当寺の唐院に安置して延暦寺から独立した … 唐院大師堂の中央の厨子に安置。秘仏で、毎年10月29日の円珍の命日にのみ開扉される。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/207
        note: 所有者名 ： 園城寺
        source: kunishitei-201-207
        accessed: 2026-11-24
  - owner: institution/shoko-in-kyoto
    role: custodian
    acquired: 1595
    ended: 1598
    method: transfer
    label: Hideyoshi confiscated Onjō-ji in 1595; Dōchō, former head of Onjō-ji, took 'the seated statue of Chishō Daishi' to his Shōkō-in for safety; moved back to Onjō-ji's Jōkō-in in 1598 (the article does not say which of the two statues)
    certainty: possible
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 文禄4年（1595年）11月、当寺は突如として秀吉の怒りに触れ、闕所（寺領の没収、事実上の廃寺）を命じられた … 本尊の弥勒菩薩像や智証大師坐像、黄不動尊などは元園城寺長吏の道澄が自ら住持を務める照高院 … に避難させ … 照高院に避難させていた弥勒菩薩像、智証大師坐像、黄不動尊などを園城寺闕所の際にも存続が許されて残っていた上光院に移している。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
