title: Pine Trees in the Snow
creator: maruyama-okyo
created: 1776/1800
kind: byōbu
medium: Pair of six-panel screens, ink, light colour and gold on paper
materials: [ink, gold, paper]
dimensions: [155.5, 362]
dimensions_note: each screen
institution: mitsui-memorial-museum
web_url: https://kunishitei.bunka.go.jp/heritage/detail/201/33
description_md: "A pair of screens commissioned by a member of the Mitsui merchant family: a single pine thrusts up beyond the upper edge, its branches filling the screen — at first glance like Eitoku’s Cypress, but [[artist/maruyama-okyo]]’s pines bend as any tree would in the wind. The trunks are not outlined but modelled with daubs of ink ([[tsuketate]]), patches of snow left white on the gold: the still, serene beauty of nature. [[source/history-of-japanese-art|p. 321, fig. 372]]"
