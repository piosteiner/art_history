description_md: |-
  A study for [[artwork/sironi-italia-fra-le-arti-e-le-scienze]], the mural [[artist/mario-sironi|Mario Sironi]] painted in 1935 for the Aula Magna of the university city in Rome; it is in a private collection (Collezione Credito Industriale Sardo, Cagliari) [[source/steiner-2025-mario-sironi|pp. 14–15, fig. 5]]. Emily Braun reproduces it as a colour plate, *Study for Italy among the Arts and Sciences*, 1935 [[source/braun-2000|p. vi, pl. XIV]].

  In the study, Italy holds a sword [[source/steiner-2025-mario-sironi|pp. 14–15, fig. 5]] [[source/braun-2000|pl. XIV]]. The photographs of the mural available to Pio Steiner did not show this sword, while after the restoration of 2015–2017 Italy wears a halo or crown that older images lack [[source/steiner-2025-mario-sironi|p. 14]]. Flaminia Bartolini states that Sironi's original did include a sword and a crown for Italy, and also that the sword and helmet of the winged Victory were removed at some point — claims Steiner could not verify and for which he points to the catalogue of the restoration, *Sironi svelato* [[source/steiner-2025-mario-sironi|p. 14]] [[source/bartolini-2020|p. 26]]. The drawing thus documents a stage of the design in which the allegory of Italy was armed, like the Victory flying above the figures on the left of the finished mural [[source/steiner-2025-mario-sironi|p. 5]].
