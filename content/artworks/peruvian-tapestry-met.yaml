description_md: |-
  This Peruvian carpet (tapestry) with figural motifs dates from the seventeenth century; it is woven of wool and measures 2.27 × 2.15 m [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 29]]. It is in the [[institution/metropolitan-museum-of-art|Metropolitan Museum of Art]] in New York, and the lecture showed a detail of its border on a blue indigo ground [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 29]].

  Indigo was obtained from Indigofera tinctoria, a shrub up to 1.5 m high of the legume family native to India, China and tropical Africa, and from Indigofera suffruticosa, native to the subtropical and tropical regions of the Americas [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 28]]. Quoting Elena Phipps, the lecture described how such dyestuffs, previously unavailable to European dyers or only in small quantities and at high prices, made the European textile industry the centre of a global commercial network, while their production in the New World often had a corrosive effect on local communities [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 31]].
