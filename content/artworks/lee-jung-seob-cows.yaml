description_md: "[[artist/lee-jung-seob]] (1916–1956), from the north, studied in Japan and married the daughter of a Japanese businessman; during the Korean War his wife and children had to return to Japan. His violent, distorted cows symbolize perseverance and toil — his own and Korea’s. [[source/portal-2000|p. 171, fig. 93]]"
