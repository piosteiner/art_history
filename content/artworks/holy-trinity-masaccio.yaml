provenance:
  - owner: institution/santa-maria-novella
    acquired: 1425/1427
    method: commission
    place: florence
    label: in the Dominicans' church, before the door to the cemetery; the patron (kneeling with his wife) is undocumented — perhaps Berto di Bartolomeo del Banderaio, honoured by the prior Fra Benedetto di Domenico di Lenzo
    sources:
      - url: https://it.wikipedia.org/wiki/Trinit%C3%A0_%28Masaccio%29
        note: Nessun documento scritto attesta la data esatta di esecuzione del dipinto e l'identità del committente […] Il dogma della Trinità era dopotutto un tema di importanza fondamentale per i domenicani, proprietari della chiesa
        source: wikipedia-it-trinita-masaccio
        accessed: 2026-10-20
  - owner_label: hidden behind Vasari's altar
    role: event
    acquired: 1570
    place: florence
    label: Giorgio Vasari, charged with taking down the rood screen, hid it behind a new altar (with his own Madonna of the Rosary for the Capponi) and so preserved it
    certainty: probable
    sources:
      - url: https://it.wikipedia.org/wiki/Trinit%C3%A0_%28Masaccio%29
        note: Egli, incaricato di smontare il tramezzo, nelle vicinanze del quale l'opera era collocata (per ragioni legate alla Controriforma), non trovando altro luogo dove conservarla all'interno della chiesa […] decise di nasconderla dietro ad un nuovo altare.
        source: wikipedia-it-trinita-masaccio
        accessed: 2026-10-20
  - owner_label: rediscovered and moved
    role: event
    acquired: 1860
    place: florence
    label: found again when Vasari's altar was removed; cut out with the wall behind it (“a massello”) by Gaetano Bianchi and moved to the inner façade; put back in 1952, when Ugo Procacci found the skeleton and sarcophagus below
    sources:
      - url: https://it.wikipedia.org/wiki/Trinit%C3%A0_%28Masaccio%29
        note: Nel 1860, durante la rimozione dell'altare vasariano […] venne riscoperto l'affresco della Trinità. Per non farlo coprire dall'altare neogotico, l'affresco fu trasportato "a massello" […] e spostato sulla parte bassa della controfacciata della chiesa. Quasi un secolo dopo, nel 1952 […] fu scoperto però che la Trinità era in realtà composta anche da uno scheletro e dal suo sarcofago dipinto
        source: wikipedia-it-trinita-masaccio
        accessed: 2026-10-20
