description_md: |-
  [[artist/titian|Titian]]'s group portrait shows the brothers Andrea and Gabriele Vendramin with Andrea's seven sons; it was painted in 1540–43 and about 1550 in oil on canvas and measures 206.1 × 288.5 cm [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 27]]. It is in the [[institution/national-gallery-london|National Gallery]] in London [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 27]].

  In the lecture it followed the slides on cochineal — the red dye from dried insects living on the Opuntia cactus — and on textiles dyed with it, an Italian silk brocade of the late seventeenth or early eighteenth century and an English suit of 1750–70 in the Metropolitan Museum [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 25–27]]. It belongs to the lecture's argument that new dyestuffs from the colonies changed the colours of European dress and became drivers of globalisation and colonial exploitation [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 31]].
