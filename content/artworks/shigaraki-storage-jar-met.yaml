description_md: "A storage jar of [[shigaraki-ware]], built up from coils of clay: the unglazed body has fired brick-red from the iron in the clay, while ash falling on the shoulders in the kiln has formed a grey glaze and a bib of shiny green. Its roughness and simplicity answered the Zen aesthetic of [[wabi]]. [[source/history-of-japanese-art|p. 180, fig. 209]]"
