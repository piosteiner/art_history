description_md: |-
  Nazi war painting, beside [[artwork/andreoni-aeropainting-and-tanks]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 17]]. Title as on the slide.

  ## Context

  [[artist/elk-eber|Elk Eber]], a party member since 1923 and a professor by Hitler's appointment since 1938, worked after the invasion of Poland in 1939 as a war painter in a propaganda company; his pictures of Warsaw from this time, among them a watercolour of Polish prisoners before the command post in Warsaw and a drawing of burning Warsaw seen from Wola, were shown in the Haus der Deutschen Kunst in Munich [[source/wikipedia-de-elk-eber|§ Leben]]. His works of 1940 include a painting *Kampf in Warschau Vorstadt* (Battle in a Warsaw suburb) [[source/wikipedia-de-elk-eber|§ Werke (Auswahl)]]. From 1937 he showed sixteen oil paintings at the Great German Art Exhibitions, some of them bought by Hitler himself [[source/wikipedia-de-elk-eber|§ Leben]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed the painting with [[artist/cesare-andreoni|Cesare Andreoni]]'s *Aeropainting and Tanks* (1936) under the theme "War" — war, in the regimes' art, was depicted as heroic — and set against them, on the next slide, [[artwork/grosz-to-them-peace-is-assured|George Grosz]] and [[artwork/dix-der-krieg|Otto Dix]], whose post-war pictures showed its gruesome aspects [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 17–18; class notes, 24 September 2024]]. Golomstock, the seminar's core reading, describes how totalitarian art embodied the idea of struggle "more concretely, through the image of war": war, the events of the past and everyday labour "were all portrayed as heroic struggle" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]] [[source/golomstock-1990|p. 3]]. In Germany, Hermand notes, the outbreak of the war pushed the "heroic" to the fore of official art theory, and Wilhelm Westecker's *Krieg und Kunst* (1944) called for the battlefield to be celebrated as a "grandiose, spectacular drama" [[source/hermand-1994|pp. 43–44]].
