description_md: "An early [[imari-ware]] bottle painted in [[underglaze-blue]] after Chinese landscapes — a tall mountain, a thatch-roofed pavilion, angular pines — thickly potted and hastily made: the pines do not quite follow the curved surface. The porcelain of Arita began when the Korean potter Ri Sampei, brought to Japan by the daimyo Nabeshima Naoshige, found kaolin clay there in 1616. [[source/history-of-japanese-art|p. 294, fig. 335]]"
