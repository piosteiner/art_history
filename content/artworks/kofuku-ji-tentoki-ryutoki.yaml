description_md: "Two lantern-bearing demons made by [[artist/koben]] in 1215 for the monk Shōshō of Kōfukuji, according to an inscription; they stood before the main altar of the western kondō until it burnt. [[artist/koben]] joins the guardians of a gate, one open-mouthed and one closed, with mischievous little demons: squat Tentōki balances his lantern on his shoulder; Ryūtōki carries his on his head, a dragon coiled round his body — a petulant boy and a taunting brat in grotesque, humorous realism. [[source/history-of-japanese-art|p. 194, fig. 225]]"
