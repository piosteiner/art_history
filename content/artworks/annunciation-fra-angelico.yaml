description_md: "Fra Angelico’s altarpiece for San Domenico in Fiesole, 1425–26: the angel Gabriel and the Virgin in a loggia, Adam and Eve driven from Paradise on the left; the predella tells the life of the Virgin[[source/prado-la-anunciacion-fra-angelico|dated 1425–1426 · „pintada para el convento de Santo Domingo en Fiésole“ · „cuya tabla central muestra el ciclo de la pérdida (Adán y Eva expulsados del Paraíso) y salvación del hombre (Anunciación de María), mientras los cinco paneles de la predella ilustran otros tantos episodios de la vida de la Virgen“]]. Bought in 1611 as a gift for the Duke of Lerma, it came to the Prado in 1861[[source/prado-la-anunciacion-fra-angelico|Procedencia: „Convento de Santo Domingo, Fiesole, 1425/28-1611; Mario Farnese, Roma, lo adquiere para obsequiar a Francisco Sandoval y Rojas V marqués de Denia y I duque de Lerma, … Isabel II lo cede al Museo del Prado, 1861“]]."
