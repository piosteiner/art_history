    label: eaves and porch rebuilt 1567 after the fire of 1558 as the main hall of the Benzaiten shrine on Chikubushima (shrine and Hōgon-ji then one); in 1602 Toyotomi Hideyori, through Katagiri Katsumoto, set a moved building in it as its core
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/1519
        note: 本殿は創建以来数度の火災にあい、永禄元年の火災後、同十年（一五六七）再建されたが、さらに慶長七年（一六〇二）に豊臣秀頼が片桐且元を奉行として旧本殿を改造し、ほかよりの移建建物と組み合わせて造った。これが今の本殿である。
        source: kunishitei-102-1519
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E9%83%BD%E4%B9%85%E5%A4%AB%E9%A0%88%E9%BA%BB%E7%A5%9E%E7%A4%BE&oldid=111731126
        note: 永禄元年の大火後、慶長7年（1602年）に豊臣秀頼が片桐且元を普請奉行として竹生島権現を復興している。この際復興されたのが現・宝厳寺の唐門・観音堂・渡り廊下、その渡り廊下と繋がっている現・都久夫須麻神社本殿である本堂である。 … 現・当社本殿は伏見城の日暮御殿を移築したものである
        source: wikipedia-ja-tsukubusuma-jinja
        accessed: 2026-11-24
  - owner: institution/tsukubusuma-shrine
    acquired: 1874
    method: transfer
    direct: true
    place: nagahama
    label: "Meiji separation of Shinto and Buddhism: in 1871 the Ōtsu prefectural office ordered the shrine renamed Tsukubusuma Shrine; boundary with Hōgon-ji fixed 1874, the hall becoming the shrine's main sanctuary; property divided 1883; owner today"
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/1519
        note: 所有者名 ： 都久夫須麻神社 所有者種別 ： 神社
        source: kunishitei-102-1519
