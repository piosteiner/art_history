      - url: https://ja.wikipedia.org/w/index.php?title=%E9%83%BD%E4%B9%85%E5%A4%AB%E9%A0%88%E9%BA%BB%E7%A5%9E%E7%A4%BE&oldid=111731126
        note: 大津県庁は竹生島権現宝厳寺を廃寺にして神社としたうえで、社名を『延喜式神名帳』から採った「都久夫須麻神社」に改めるよう命じた。 … 1874年（明治7年）に都久夫須麻神社と宝厳寺の境界が決められ、これまでの本堂が都久夫須麻神社の本殿となった。1883年（明治16年）には寺の財産と神社の財産が区別されて今日に至っている。
        source: wikipedia-ja-tsukubusuma-jinja
