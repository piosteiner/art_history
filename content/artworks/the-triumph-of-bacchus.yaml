description_md: "Velázquez’s first mythology, painted in 1628–29 before his first journey to Italy[[source/prado-los-borrachos|„Estamos en las vísperas del primer viaje del pintor a Italia“ · „Era la primera vez que se enfrentaba a una fábula mitológica“]]: Bacchus crowns a kneeling young man — with ivy, the poets’ plant, not vine — beside a beggar and four weather-beaten drinkers in brown cloaks who look out at the viewer[[source/prado-los-borrachos|„a la derecha se agolpan un mendigo y cuatro hombres de capas pardas, rostros curtidos y expresión achispada“ · „la corona que está colocando Baco al joven arrodillado no sea de vid, como la que luce él mismo en su cabeza, sino de hiedra, atributo con el que se relacionaba a los poetas“]]."
