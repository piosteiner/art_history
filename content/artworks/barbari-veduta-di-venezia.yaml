description_md: |-
  ## Description

  The view of Venice inscribed "Venetie MD" is a woodcut printed from six blocks on six sheets; the impression in the [[institution/minneapolis-institute-of-art|Minneapolis Institute of Art]] measures 132.7 × 277.5 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 40]]. Beate Böckem gives the whole as 134 × 282 cm, a surface of 3.7 m² that far exceeded the multi-sheet prints known before; the sheets of about 70 × 100 cm also set a new standard for folio formats [[source/bockem-2016-jacopo-de-barbari|pp. 32, 39]]. It is the earliest surviving autonomous city view of its time in monumental format [[source/bockem-2016-jacopo-de-barbari|p. 39]]. The viewpoint is constructed: no real place offered such a view of the city, and the beholder looks down obliquely from high above the clouds [[source/bockem-2016-jacopo-de-barbari|p. 40]]. The inscription "Venetie MD" names the subject and the "moment" of the view [[source/bockem-2016-jacopo-de-barbari|p. 40]]. Clouds in the lower part of the image even hide the carefully drawn buildings of the outlying islands, heightening the illusion of hovering, while the view reaches across the lagoon to the mainland at the foot of the Alps, which frames the upper edge like a frieze [[source/bockem-2016-jacopo-de-barbari|p. 40]]. On the water, broad parallel hatching alternates with light areas and small hooks to render currents and reflections, and boats of types that can still be identified cross the lagoon [[source/bockem-2016-jacopo-de-barbari|p. 40]].

  The Arsenal, the shipyard of Venice whose layout was a closely guarded secret well into the sixteenth century, is shown prominently, which suggests that the view was made with the Senate's consent; it stresses shipbuilding rather than militarily useful detail [[source/bockem-2016-jacopo-de-barbari|p. 41]]. The district of [[place/piazza-san-marco|San Marco]] and the [[place/doge-s-palace|Doge's Palace]] are equally prominent, and the city is tilted diagonally into the field of view to show its full extent [[source/bockem-2016-jacopo-de-barbari|p. 41]]. Instead of compass points, the directions are given in the antique manner by winds with their gods [[source/bockem-2016-jacopo-de-barbari|p. 41]]. Only two figures rise parallel to the picture plane: Mercury enthroned on clouds above the inscription and Neptune riding a dolphin in the water below; their inscriptions read "MERCVRIVS PRECETERIS HVIC FAVSTE EMPORIIS ILLVSTRO" and "AEQVORA TVENS / PORTV . RESIDEO / HIC NEPTVNVS." [[source/bockem-2016-jacopo-de-barbari|p. 42]] Together they mark an axis between the Piazza San Marco and the Doge's Palace and the trading centre at the [[place/rialto-bridge|Rialto Bridge]], which leads on towards the mountains and the road marked "Seraval" in the direction of the Brenner [[source/bockem-2016-jacopo-de-barbari|p. 42]]. Böckem reads the choice of Mercury and Neptune, instead of the more common pairing of Mars and Neptune, as stressing trade and traffic rather than territorial power [[source/bockem-2016-jacopo-de-barbari|p. 43]]. In her reading the view joins depiction and praise of the city: Venice rising from the sea, its divine protection, its churches and its climate favoured by the winds are the topoi of a literary city eulogy, and she points to parallels with Marino Sanudo's "Laus urbis Venetae" of 1493 — for instance the tides, shown by people using steps to board their boats at San Giorgio Maggiore while fishermen wade knee-deep nearby [[source/bockem-2016-jacopo-de-barbari|pp. 43–44]].

  ## Making

  The Nuremberg merchant Anton Kolb, the publisher, petitioned the Venetian Signoria on 30 October 1500; the summary of the petition says the work had taken three years and stresses the difficulty of the subject, the unprecedented size of the paper and "the new art of printing forms of such size" [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 41]]. Kolb asked to sell the print at about three florins without customs duty throughout the Venetian territories [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 41]]; Böckem identifies the sum as three Rhenish gulden (3.75 ducats), a minimum price calculated to recover the costs, and notes that the request was granted together with protection against copies for four years [[source/bockem-2016-jacopo-de-barbari|pp. 35–37]]. A rival publisher, Girolamo Biondo, had already obtained a ten-year privilege for a view of Venice on 5 April 1498, but no impression of it is known [[source/bockem-2016-jacopo-de-barbari|pp. 38–39]].

  The precision of the view rests on survey work: sketches were probably made from high points such as church towers and combined with measurements at ground level in a network of reference points, which also explains some compressions and inconsistencies; the irregularities suggest a team that worked systematically through the city from east to west [[source/bockem-2016-jacopo-de-barbari|p. 45]]. The lecture showed Juergen Schulz's reconstruction of a 100 × 100 m grid laid over a ground plan of Venice and transferred onto the view [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 61]]. Whether the compressions are errors in transferring the plan to the blocks (Schulz) or deliberate choices (Brunckhorst, who notes that unsightly trades such as slaughterhouses and brick kilns are left out) is disputed [[source/bockem-2016-jacopo-de-barbari|p. 46]].

  ## Authorship

  The lecture presents the view under the name of [[artist/jacopo-de-barbari|Jacopo de' Barbari]] [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 40]], to whom it has been attributed without question since Ernst Georg Harzen proposed this in 1855 [[source/bockem-2016-jacopo-de-barbari|p. 50]]. Böckem points out that Kolb's direction of the project is documented, whereas Barbari's share is not; the attribution rests on Dürer's report that Kolb praised a painter "Jacob" and on a payment of 1504 naming Kolb and Barbari together [[source/bockem-2016-jacopo-de-barbari|p. 51]]. Barbari was in the service of Maximilian I from 1 April 1500 and was therefore absent during the final phase of the project [[source/bockem-2016-jacopo-de-barbari|pp. 54–55]]. She concludes that sole authorship by Barbari cannot be maintained: he may have been one of many artists involved — perhaps combining the studies into one composition or designing the figures — and the print should rather be called "Anton Kolb's view of Venice" [[source/bockem-2016-jacopo-de-barbari|pp. 53, 58]].

  ## States and use

  In the first state of 1500, block B carries the date and block E shows the campanile of San Marco as it was after the lightning strike of 1489; in a second state of about 1514 the date was removed and the campanile updated to its rebuilt form; a third state, probably from the later sixteenth century, restored the date and the old campanile [[source/bockem-2016-jacopo-de-barbari|p. 47]]. At least 24 complete impressions are known [[source/bockem-2016-jacopo-de-barbari|p. 47]]. Kolb's price is the earliest recorded price for a giant woodcut; the Nuremberg Chronicle was valued at one and a half gulden for Kolb's sales in Venice in 1499 [[source/bockem-2016-jacopo-de-barbari|p. 48]]. Most surviving impressions are mounted, which shows that the print served as wall decoration competing with wall painting and tapestry, while collectors such as Ferdinand Columbus kept such prints rolled; there is no evidence for the often repeated idea that it hung in the offices of Nuremberg merchants [[source/bockem-2016-jacopo-de-barbari|pp. 49–50]]. The six pear-wood [[artwork/barbari-matrici-veduta-di-venezia|blocks]] survive in the [[institution/museo-correr|Museo Correr]] [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 63]].

  ## Venice and wood

  The lecture set the view beside the city's enormous demand for timber: wood was needed for the foundations of houses and quays, for the palisades protecting the lagoon front — some 140,000 trunks by the end of the sixteenth century — and above all for the Arsenal, according to Piero Bevilacqua [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 70]]. A law of 1470, the "provisio quercuum", reserved all oaks of the Venetian mainland territories for shipbuilding regardless of ownership [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 71]]. For comparison the lecture showed earlier views of [[place/venice|Venice]] by [[artwork/reuwich-ansicht-von-venedig|Erhard Reuwich]] (1486) and [[artwork/wolgemut-venedig-schedelsche-weltchronik|Michael Wolgemut]] (1493) and the [[artwork/pianta-della-catena-berlin|Pianta della Catena]] of Florence [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 54–56]].
