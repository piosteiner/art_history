description_md: |-
  The carved wooden door of [[institution/santa-sabina|Santa Sabina]] on the Aventine in Rome, with pictures from the Old and New Testaments, dates from around 432; in the lecture's data its leaves are of fir and its reliefs of cypress, and it measures 5.35 × 3.35 m, in the narthex of the church.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 20]] English Wikipedia describes the doors as cypress wood carved in 430–432, generally agreed to be the church's original door, although apparently not made for this doorway.[[source/wikipedia-en-santa-sabina]][[source/wikipedia-en-santa-sabina|§ Exterior]]

  ## The panels

  The door originally had 28 panels; ten are lost and have been left without ornament.[[source/wikipedia-en-santa-sabina|§ Doors]] Seventeen of the remaining eighteen show a scene from the Old or New Testament; the eighteenth, near the bottom, shows homage paid to a man in a chlamys, thought to refer to a historical event involving a powerful ruler.[[source/wikipedia-en-santa-sabina|§ Doors]] One of the smaller upper panels shows the Crucifixion of Jesus and two other figures before a building recalling a Roman mausoleum – the first known publicly displayed image of the Crucifixion.[[source/wikipedia-en-santa-sabina|§ Doors]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 21]] The panels are carved in two styles, one more detailed and classical, one simpler, suggesting several carvers; the vegetal ornament of the frames points to a Mesopotamian style.[[source/wikipedia-en-santa-sabina|§ Doors]]

  ## Date

  The cramped compositions and the thin outer frame suggest that the door was originally larger and was cut down to fit Santa Sabina, so it may have been made for another building.[[source/wikipedia-en-santa-sabina|§ Doors]] It was probably made close to the church's construction in 432: the ruler in the chlamys scene resembles depictions of Theodosius II, and dendrochronological and radiocarbon dating place the wood at the beginning of the 5th century, in the reigns of Celestine I (421–431) or Sixtus III (431–440).[[source/wikipedia-en-santa-sabina|§ Doors]]

  ## Later significance

  The doors of Santa Sabina set scenes of the Old and New Testament against each other typologically; Bishop [[person/bernward-of-hildesheim|Bernward of Hildesheim]] may have seen them during his stay in Rome in 1001/02, and they are named among the models of the [[artwork/bernwardstur|Bernward door]].[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 78]] They are also counted among the late antique precedents of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Vorbilder und Nachahmungen]] In the lecture they followed the medieval doors of Cologne, Le Puy and Gurk as their late antique precedents.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 20]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 21]]
