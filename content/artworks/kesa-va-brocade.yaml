description_md: A [[kesa]], the patchwork robe of the Buddha and his first mendicant disciples, here created from a single length of brocade figured with butterflies and peonies — and adorned with patches bearing Sanskrit seed syllables, among them “Hum”, the last of the mantra of Kannon, “Om mani padme hum”. [[source/history-of-japanese-art|p. 311, fig. 361]]
