description_md: "[[artist/utagawa-hiroshige|Utagawa Hiroshige]]'s print of the Kawachiya at Yanagibashi belongs to his series of famous Edo restaurants, *Edo kōmei kaitei zukushi*, of about 1838–1840 [[source/met-jp1164|JP1164]]. It shows a *[[term/shogakai|shogakai]]* in the restaurant's rooms [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 34, fig. 4]]. The Kawachiya was the most used *shogakai* venue in Edo, with 50 of 266 gatherings known from flyers of about 1835–1860 [[source/campbell-1987-tenpoki-zengo-shogakai|p. 59]]."
