description_md: |-
  A copy by the Viennese painter [[artist/karl-agricola]] of Rubens' [[artwork/boreas-entfuhrt-oreithya]], which hangs in the same collection (GG-626). Both came to the Academy of Fine Arts with the bequest of [[person/anton-franz-de-paula-graf-lamberg-sprinzenstein]] in 1822, so the copy was made while the original was in Lamberg's collection in Vienna. The Academy lists both artists on the copy: Agricola as the artist, Rubens with the attribution “Kopie nach” (copy after).

  Not signed (recto).

  The copy is on canvas, not on an oak panel, and is smaller: 88 × 70 cm against the original's 146 × 140.5 cm. It is also an upright format rather than a nearly square one. Comparing the Academy's photographs, the copy shows the whole group, including the two putti at the lower edge that the original cuts off, with more cloud around them.
