description_md: |-
  [[artist/gentile-bellini|Gentile Bellini]]'s procession in the [[place/piazza-san-marco|Piazza San Marco]] shows a miracle of the relic of the True Cross; it is dated 1496, painted in oil on canvas and measures 373 × 745 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 46]]. It is in the [[institution/gallerie-dell-accademia-venice|Gallerie dell'Accademia]] in Venice [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 46]]. Böckem dates it 1496, gives its size as 367 × 745 cm and notes that it was painted for the Scuola di San Giovanni [[source/bockem-2016-jacopo-de-barbari|p. 46]]. It belongs to the [[artwork/true-cross-cycle|cycle of the Miracles of the True Cross]], which was begun by the Bellini workshop in 1493 [[source/bockem-2016-jacopo-de-barbari|p. 43]].

  Böckem uses the painting to show how a painted city view could serve the self-presentation of the Serenissima: the verifiable precision of the architecture, above all San Marco, is meant to underline the authenticity of the relic, and the calm order of the procession on the wide square corresponds to the harmony of the whole republic [[source/bockem-2016-jacopo-de-barbari|p. 46]]. For the same reason Gentile left out the booths, pillories, latrines and cisterns that are documented on the square at the time [[source/bockem-2016-jacopo-de-barbari|p. 46]]. Brunckhorst sees a similar alteration of the proportions of the area around the Piazza in the Bellini painting and in the [[artwork/barbari-veduta-di-venezia|view of Venice]] of 1500 [[source/bockem-2016-jacopo-de-barbari|p. 41]]. In the lecture the painting was shown with the view of Venice and with [[artwork/carpaccio-miracolo-della-croce-a-rialto|Vittore Carpaccio's miracle at the Rialto]] from the same cycle [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 46–47]].
