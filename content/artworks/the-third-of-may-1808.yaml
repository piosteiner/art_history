description_md: "Painted in 1814 with its companion, the Second of May, after the war, most likely once Ferdinand VII was back in Madrid that May[[source/prado-el-3-de-mayo-de-1808|„casi con seguridad, después de mayo de 1814, cuando el rey regresó a Madrid“]]: the execution of Madrilenians by French soldiers on the night after the uprising of 2 May 1808[[source/prado-el-3-de-mayo-de-1808|„las ejecuciones de la noche y la lluviosa madrugada del 3 de mayo a las afueras de Madrid“]]. The men come in a line from the city and face the firing squad, each showing his fear in his own way — the man in the white shirt with his arms raised[[source/prado-el-3-de-mayo-de-1808|„Los violentos patriotas de la mañana se enfrentan ahora aquí, sin salvación ni ayuda, al pelotón de ejecución, … reflejándose el miedo de distintas formas en cada uno de los que van a ser fusilados. Llegan en oleadas desde la ciudad, en una fila interminable que termina con su muerte“]]."
