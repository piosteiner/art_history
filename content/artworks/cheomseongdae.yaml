description_md: "The bottle-shaped astronomical observatory built in Kyŏngju under [[person/queen-seondeok-of-silla]] (r. 632–647): 9 m high, of 364 stone blocks in 27 courses — thought the oldest existing observatory in East Asia. Its round body and square top follow the Chinese “round heaven, square earth”; a south-facing window lets sunlight fall to the floor at the equinoxes. [[source/portal-2000|pp. 70–71, fig. 36]]"
