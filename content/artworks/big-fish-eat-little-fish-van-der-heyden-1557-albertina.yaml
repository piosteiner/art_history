description_md: The engraving after Bruegel's drawing of 1556, published by Hieronymus Cock in Antwerp in 1557, in its first state. It names Hieronymus Bosch as its inventor — "Hieronymus.Bos. / inuentor" lower left, "COCK . EXCV . 1557" lower right; under the Latin verse "GRANDIBVS EXIGVI SVNT PISCES PISCIBVS ESCA"[[source/albertina-sammlungen-online|DG1955/116]].
