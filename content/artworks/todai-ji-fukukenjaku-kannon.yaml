description_md: "The eight-armed [[kannon]] “of the never-empty lasso” on the altar of the [[artwork/todai-ji-hokkedo]]: one of the most austere forms of the bodhisattva, with a third eye in the forehead, the lotus, the pilgrim’s staff and the lasso in its hands, an openwork silver crown with a standing Amida and a halo of flame-like rays. Made in [[hollow-dry-lacquer]] in the official atelier, probably under [[artist/kuninaka-no-kimimaro]]. [[source/history-of-japanese-art|p. 88, fig. 106, 108]]"
