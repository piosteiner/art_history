  Cover of *Africa Italiana*, 15 February 1942: labour as colonisation [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]].

  ## Context

  The cover, signed C. Mancioli, was shown in the seminar under the theme "Labor" beside the Soviet painting *Bread* (1949) by Olga Yablonskaya [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]]: agriculture as a field in which the regimes shaped norms [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]].

  Italian colonial propaganda had to make up for a lack of interest: at the opening of Rome's Museo Coloniale in 1923 the colonial minister Luigi Federzoni admitted that "the colonies are not greatly loved" by Italians, and the museum, conceived as a vehicle of government propaganda rather than science, was to "awaken" their colonial pride [[source/falcucci-2021|pp. 702–703]]. Falcucci speaks of a "visual colonialism" in which maps, photographs, paintings, postcards, films and exhibitions together served "to map, explain, justify and define the experience of subjugation"; popular enthusiasm for empire was limited to times of crisis, as in Italy in the 1930s, though such propaganda was in general very effective [[source/falcucci-2021|pp. 716–717]]. The colonial enterprise also shaped the image of the [[term/new-man|New Man]]: for many Fascists it raised the question of a "colonising superiority", with the New Men as "dominators and conquerors above all" [[source/dagnino-2016|p. 145]].
