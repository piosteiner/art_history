        note: 『本朝月令』によると、天武天皇6年（677年）に高野川と加茂川の合流する河合の地域に社殿を造営したのが当社の始まりであるという … 井上光貞の説でも、奈良時代前期まで「賀茂社」といえば現在の上賀茂神社だけで
