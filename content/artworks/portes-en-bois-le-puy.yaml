title: Portes en bois de la cathédrale du Puy
attribution_label: Anonymous
created: second half of the 12th century
created_span: uncertain
medium: wood, reliefs
institution: le-puy-cathedral
description_md: |-
  The carved wooden doors of [[institution/le-puy-cathedral|Le Puy Cathedral]] (Notre-Dame du Puy-en-Velay) date from the second half of the 12th century; the lecture showed two of them, a picture door of the Passion of Christ and a picture door of the childhood of Christ, from which it singled out the Presentation in the Temple.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 18]]

  In the porch of the cathedral, on either side of the great stair, two doors of cedar wood from the last quarter of the 12th century lead to the chapels of St Giles (left) and St Martin (right); the left one has scenes from the life of Christ, and its panels are framed with ornament imitating Arabic script.[[source/wikipedia-fr-cathedrale-notre-dame-du-puy-en-velay|§ La façade]] Further carved wooden doors, which once closed the façade, were set against the walls of the stair where it narrows under the porch; the stair, 102 steps long, leads under the nave because the church had to be enlarged over the slope for the crowds of 13th-century pilgrims.[[source/wikipedia-fr-cathedrale-notre-dame-du-puy-en-velay|§ La façade]] The list of the cathedral's works names "under the porch, carved wooden doors of the 12th century showing episodes of the life of Christ".[[source/wikipedia-fr-cathedrale-notre-dame-du-puy-en-velay|§ À voir dans la cathédrale]]

  In the lecture the doors of Le Puy stood between the Cologne door and the door of Gurk in a sequence of medieval wooden picture doors.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 18]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 19]]
