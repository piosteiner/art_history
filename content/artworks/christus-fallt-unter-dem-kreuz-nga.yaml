description_md: |-
  This small woodcut of Christ falling under the cross was made about 1480/90, perhaps in Ulm; it is coloured by hand, printed on paper and measures 12.6 × 18.8 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 27]]. It is in the Rosenwald Collection of the [[institution/national-gallery-of-art|National Gallery of Art]] in Washington [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 27]].

  In the lecture it belongs to the section "Leidensdruck" — early woodcuts as a medium of the Passion of Christ [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 25]]. Religious single-leaf prints of this kind were used above all in individual prayer and could be kept loose or pasted into manuscripts [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]].
