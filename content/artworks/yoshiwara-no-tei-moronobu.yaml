description_md: "From the set of single-sheet prints of 1678 by [[artist/hishikawa-moronobu]] (1618–1694), who brought the print designer out of anonymity and was the first to sign his prints — the age when the novels of [[person/ihara-saikaku]] (1642–1693) were published with ever better illustrations: in a teahouse of the Yoshiwara pleasure quarter patrons sitting on the floor watch a courtesan dance to a drum and two [[samisen]]; on the left a two-panel screen bears Moronobu’s signature. [[source/history-of-japanese-art|pp. 280–281, fig. 319]]"
