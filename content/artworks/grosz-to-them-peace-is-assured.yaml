description_md: |-
  After the First World War war was often shown in its gruesome aspects — Grosz beside [[artwork/dix-der-krieg]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 18]]. Title as on the slide (English); the German title remains to be found.

  ## In the seminar

  The seminar "Art and Totalitarianism" took the work as one of two counter-images to the heroic war painting of the regimes: on the slide before, [[artwork/andreoni-aeropainting-and-tanks|Cesare Andreoni's Aeropainting and Tanks]] (1936) and [[artwork/eber-the-battle-for-warsaw|Elk Eber's The Battle for Warsaw]] (1940) stand for the theme of war in totalitarian art [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 17–18]]. The class notes sum up the contrast: war was depicted as heroic, while after the First World War depictions of war often focused on its gruesome aspects [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]].

  [[artist/george-grosz|George Grosz]] made the work in 1920, the year he published the satirical drawings *Gott mit uns* — for which he was fined for insulting the army — and organised the First International Dada Fair in Berlin [[source/wikipedia-en-george-grosz|§ Political engagement (1918–1921)]]. Wounded soldiers and corpulent businessmen were among the great subjects of his drawings of these years [[source/wikipedia-en-george-grosz|§ Work]].
