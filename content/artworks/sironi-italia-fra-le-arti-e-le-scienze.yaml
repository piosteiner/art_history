description_md: |-
  ## Place and commission

  *L'Italia fra le Arti e le Scienze* is the mural of the Aula Magna in the Rettorato of the new [[place/citta-universitaria-rome|Città universitaria]] of Rome, today the [[institution/sapienza-university-of-rome|Sapienza]], covering the apse-like alcove behind the speakers [[source/sapienza-2017-sironi-restauro|p. 2]] [[source/steiner-2025-mario-sironi|p. 4]]. It spreads over the slightly curved back wall and the two sides of the alcove, facing the audience [[source/steiner-2025-mario-sironi|p. 4]]. The university city was built under the Fascist regime: its sixteen buildings by eleven architects testify to the importance of the project for Mussolini [[source/steiner-2025-mario-sironi|p. 6]]. For the decoration of the Aula Magna, [[person/marcello-piacentini|Marcello Piacentini]] proposed [[artist/mario-sironi|Mario Sironi]] to the head of government, and Sironi painted the 140 square metres in barely two months [[source/sapienza-2017-sironi-restauro|p. 2]] — about 7 by 20 metres [[source/steiner-2025-mario-sironi|p. 4]]. The university's restoration report calls the work, finished in 1935, the "manifesto" of the new university city [[source/sapienza-2017-sironi-restauro|p. 1]].

  ## Description

  The painting is composed like a sacred image, a scheme the apse-like shape of the space reinforces [[source/sapienza-2017-sironi-restauro|p. 2]]. At the centre stands Italy, a woman in a white robe, surrounded by the Arts and Sciences: Astronomy, Mineralogy, Botany, Geography, Architecture, Letters, Painting and History, the last a woman in the foreground seen from behind with an open book [[source/sapienza-2017-sironi-restauro|p. 2]]. Pio Steiner identifies, from left to right, astronomy in a figure turned towards the stars, mineralogy in one holding a dark mineral, geography in the study of a globe, painting in a figure seated before a canvas and architecture in the classical and modern building on the far right [[source/steiner-2025-mario-sironi|pp. 4–5]]. The three half-naked figures between the robed figures of astronomy and geology, who seem to work on and under the ground, have not been identified [[source/steiner-2025-mario-sironi|p. 14]]. There are 32 figures in all, in long robes or barely covered by a loincloth, before a rocky terrain without vegetation [[source/steiner-2025-mario-sironi|p. 5]]. On the right a triumphal arch and an eagle stand for the Roman triumphs; on the left flies a winged Victory armed with a sword [[source/sapienza-2017-sironi-restauro|p. 2]], slightly larger than the other figures and wearing a helmet of the Fascist era [[source/steiner-2025-mario-sironi|p. 5]]. To the right of Italy are two Roman insignia [[source/steiner-2025-mario-sironi|p. 6]].

  On the front of the arch is a horseman in relief — the image of a ruler that Sironi used for Mussolini, as in his illustration of 1937 with the letters DVX ([[artwork/sironi-dux-illustration-1937]]) — and above Italy, over the eagle, stand the numerals XIV: year 14 of the [[era-fascista]], 1935 [[source/steiner-2025-mario-sironi|pp. 4–5]]. The same rider appears in [[artwork/sironi-condottiero-a-cavallo]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. In the study for the mural ([[artwork/sironi-studio-per-l-italia-fra-le-arti-e-le-scienze]]) Italy holds a sword; after the restoration she wears a halo or crown that earlier photographs do not show [[source/steiner-2025-mario-sironi|p. 14]].

  ## Style and meaning

  Sironi joins classicism and modernism: the figures draw on classical Italian art, but the lines are clear and simple and the forms sometimes nearly geometric, most visibly in the Victory's wings, reduced to their outline with a few lines for the feathers [[source/steiner-2025-mario-sironi|p. 6]]. The muted, earthy palette of ochres, browns and greys adds to the monumental effect [[source/steiner-2025-mario-sironi|p. 6]]. The dress of the figures recalls the Roman past and ties the image of a modern Italy to that heritage [[source/steiner-2025-mario-sironi|p. 5]]: the "primacy" of the Italian people that, in Mark Antliff's and Emily Braun's words, Sironi's myth was to convey [[source/antliff-2002|p. 152]] [[source/braun-2000|p. 188]]. Steiner reads the title and the composition — the arts and sciences side by side without hierarchy, Italy at the centre "between" them — as an image of a young nation united by its culture and its science [[source/steiner-2025-mario-sironi|p. 8]]. A seminar slide shows the mural, dated 1936, as an image of the Fascist "New Man" as power and authority ([[new-man]]) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 57]].

  The mural was painted less than two years after Sironi signed the [[literature/manifesto-della-pittura-murale|Manifesto della pittura murale]], which states that "the educational function of painting is above all a matter of style" [[source/steiner-2025-mario-sironi|p. 9]]. Its audience was the one it addressed: the students, researchers and teachers of the university and its visitors [[source/steiner-2025-mario-sironi|p. 6]].

  ## History

  [[person/benito-mussolini|Benito Mussolini]] spoke under the mural on 28 October 1935, after the completion of the university city [[source/steiner-2025-mario-sironi|pp. 6–7]]. In the immediate post-war years the painting was covered with wallpaper — archival research for the restoration confirmed that this was an act of censorship — and in 1950, in a changed political climate, it was extensively repainted with thick layers that hid its whole surface [[source/sapienza-2017-sironi-restauro|p. 1]]. The horseman on the arch, the numerals XIV and the eagle disappeared [[source/steiner-2025-mario-sironi|p. 10]]. The poor state of the work required a conservation treatment in the 1980s [[source/sapienza-2017-sironi-restauro|p. 1]]. A full restoration, hoped for since the studies for the university city's fiftieth anniversary in 1985, followed an agreement between the Sapienza and the Istituto superiore per la conservazione e il restauro (ISCR) signed on 20 April 2015 [[source/sapienza-2017-sironi-restauro|p. 1]]. Diagnostic campaigns and cleaning tests established that Sironi's original survived under the repainting, which was then removed completely; losses were integrated with *tratteggio* or, in small areas, with "mimetic" glazes [[source/sapienza-2017-sironi-restauro|p. 1]]. About twenty specialists worked on it, together with students of the ISCR and of the Sapienza, and the work was funded by the Ministry of Culture (MiBACT) [[source/sapienza-2017-sironi-restauro|pp. 2, 4]]. The restored mural was unveiled on 23 November 2017, which Steiner gives as the 80th anniversary of the university city [[source/steiner-2025-mario-sironi|p. 11]], with the exhibition [[event/sironi-svelato-2017|Sironi svelato]] [[source/sapienza-2017-sironi-restauro|p. 2]].

  The university justified the decision by calling the painting "a figurative document of extraordinary importance" for Sironi's work, the history of the university city and Italian figurative art between the wars [[source/sapienza-2017-sironi-restauro|p. 1]]. Flaminia Bartolini criticised that the unveiling treated Fascism as a closed chapter of the past [[source/bartolini-2020|pp. 26–27]]; Pio Steiner argues that a university, of all places, can show the work as it was, as an occasion for critical reflection [[source/steiner-2025-mario-sironi|pp. 12–13]].

  Steiner calls it a fresco; the university calls it a *dipinto murale*, a mural painting [[source/steiner-2025-mario-sironi|p. 4]] [[source/sapienza-2017-sironi-restauro|p. 2]].
