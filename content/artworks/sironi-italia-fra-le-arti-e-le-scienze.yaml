description_md: |-
  The mural of the Aula Magna in the Rettorato of the new [[place/citta-universitaria-rome]], covering the apse-like alcove behind the speakers. [[person/marcello-piacentini]] proposed [[artist/mario-sironi]] to the head of government; Sironi painted the 140 square metres in about two months [[source/sapienza-2017-sironi-restauro|p. 2]] — about 7 by 20 metres [[source/steiner-2025-mario-sironi|p. 4]].

  Italy, a woman in a white robe, stands at the centre, surrounded by the arts and sciences: astronomy, mineralogy, botany, geography, architecture, letters, painting, and history — a woman seen from behind with an open book. On the right a triumphal arch and an eagle stand for the Roman triumphs, on the left flies a winged Victory armed with a sword [[source/sapienza-2017-sironi-restauro|p. 2]]. On the arch a horseman in relief, the image of a ruler that Sironi used for Mussolini, and above Italy the numerals XIV — year 14 of the [[era-fascista]] [[source/steiner-2025-mario-sironi|pp. 4–5]]. Classical figures in simple, nearly geometrical forms and earthy colours join the Roman past to a modern Italy: the "primacy" of the Italian people that Sironi's myth was to convey [[source/antliff-2002|p. 152]] [[source/braun-2000|p. 188]].

  [[person/benito-mussolini]] spoke under the mural on 28 October 1935, when the university city was completed [[source/steiner-2025-mario-sironi|pp. 6–7]]. After the war it was covered — first with wallpaper, for censorship — and in 1950 extensively repainted, which hid the whole surface; the horseman, the XIV and the eagle disappeared. A restoration by the Istituto superiore per la conservazione e il restauro and the Sapienza (2015–2017) removed the repainting and brought back Sironi's original, shown on 23 November 2017, the 80th anniversary of the university city [[source/sapienza-2017-sironi-restauro|pp. 1–2]]. Flaminia Bartolini criticised that the unveiling treated Fascism as a closed chapter of the past [[source/bartolini-2020|pp. 26–27]]; the owner's paper argues that a university, of all places, can show it as it was [[source/steiner-2025-mario-sironi|pp. 12–13]].

  The paper calls it a fresco; the university calls it a "dipinto murale", a mural painting.
