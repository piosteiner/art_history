  - owner: person/nikolai-borisovich-yusupov
    acquired: 1803 or earlier
    place: saint-petersburg
    label: seen in 1803 by Heinrich Christoph von Reimers in the family's palace on the Fontanka, Saint Petersburg; moved in 1811 to the Arkhangelskoye estate near Moscow
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1206.html
        note: Prince Nicolai Borisovich Yusupov [1751-1831], Saint Petersburg and Moscow, by 1803;[2] — [2] … Heinrich Christoph von Reimers (1768-1812) visited the collection in 1803 when it was housed in the family's palace on the Fontanka River in Saint Petersburg; his description of it, published in 1805, mentions the Gallery's painting … [4] The Yusupov collection, including the two portraits by Rembrandt, was moved in 1811 from Saint Petersburg to the family's Arkhangelskoye estate near Moscow
        source: nga-1942-9-67
