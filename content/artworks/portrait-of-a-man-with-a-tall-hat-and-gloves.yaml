        note: by inheritance to his daughter, Princess Zinaida [Zenaida] Nikolaievna Yusupova [1861-1939], Saint Petersburg, Yalta, and London;[3] — [3] … The Yusupov art collection, however, was hers, and, after the death in 1908 of her first son, Nicolai, the heir to it became her second son, Felix.
        source: nga-1942-9-67
        accessed: 2026-11-24
  - owner: person/felix-yusupov
    role: agent
    acquired_label: before April 1919
    method: transfer
    direct: true
    place: london
    label: smuggled out of the Moika Palace before April 1919, taken to London and sold there in 1921 as her son and heir
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1206.html
        note: sold 1921 by her son and heir, Prince Felix Felixovich Yusupov [1887-1967],[4] — [4] … The two Rembrandt paintings, however, were smuggled out of the Moika Palace at some point prior to April 1919, when Prince Felix Felixovich Yusupov, his wife and parents, and other members of the Russian nobility left Yalta aboard a British ship. The paintings were taken by the prince to London, where negotiations for their sale began.
        source: nga-1942-9-67
        accessed: 2026-11-24
