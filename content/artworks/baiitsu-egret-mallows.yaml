public_id: 107924
title: Egret Under Flowering Mallows
creator: yamamoto-baiitsu
created: 1833
kind: kakemono
medium: Hanging scroll, ink and colour on silk
materials: [ink, silk]
dimensions: [115, 41]
description_md: "A bird-and-flower painting by [[artist/yamamoto-baiitsu]] (1783–1856) of Nagoya, admired for his delicately coloured decorative style: the egret’s feathers built up in spontaneous strokes against its thin dark legs and long beak, the mallow leaves and lily pads in [[tarashikomi]], the pink of the flowers completing the composition. [[source/history-of-japanese-art|pp. 339–340, fig. 396]]"
