description_md: "A seated [[yakushi]] whose halo carries an inscription: made in 607 by Tori Busshi for [[person/prince-shotoku]]’s new temple, Wakakusadera. Most scholars now think it a work of Hōryūji’s rebuilding after the fire of 670, replacing the original: the face is softer than the Shaka Triad’s, the folds fewer. [[source/history-of-japanese-art|p. 72, fig. 85]]"
