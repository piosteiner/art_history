description_md: |-
  This pear-wood block, 39.1 × 27.9 × 2.5 cm, is the one from which [[artist/albrecht-durer|Albrecht Dürer]]'s woodcut [[artwork/durer-samson-und-der-lowe|Samson Rending the Lion]] of about 1497/98 was printed; block and impression are both in the [[institution/metropolitan-museum-of-art|Metropolitan Museum of Art]] [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 24]]. In the lecture it served as an example of the material of early printmaking: woodblocks were mostly made of hard fruit woods with fine and dense fibres — pear, apple and cherry, and increasingly box in the sixteenth century — and cut as plank wood, with the grain running parallel to the printing surface [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]].

  The block shows the result of a division of labour: a design on paper was transferred in reverse onto the wood (the "Reissen") and then cut with knives (the "Formschnitt"), usually by different people [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Böckem's figures for a Nuremberg book project of the 1490s show how this work was valued: the block cutter received more than four times as much as the draughtsman who drew on the block, and the latter three times as much as the designer [[source/bockem-2016-jacopo-de-barbari|p. 54]].
