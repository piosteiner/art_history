description_md: One of three surviving paintings of a set of five Godairiki Bosatsu — wrathful deities worshipped in the ceremony of the Benevolent Kings, held for the protection of the nation after the Ninnō sutra. Kongōku, the Adamantine Howl, sits against an aureole of red flames on a black ground, drawn in black, moderately calligraphic lines; the drapery is flat, the figure full of volume and vitality. The set is dated on its style; kept on Mount Kōya. [[source/history-of-japanese-art|pp. 139–141, fig. 170]]
