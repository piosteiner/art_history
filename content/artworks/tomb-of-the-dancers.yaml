description_md: "A fifth-century tomb at Tong’gou near Ji’an (Ji’an Tomb no. 1), the early Koguryŏ capital: wall paintings of dancers in long-sleeved jackets and trousers tied at the ankles, armoured horsemen and a hunt — invaluable sources on the dress, architecture and beliefs of Koguryŏ. [[source/portal-2000|pp. 46–47, fig. 23]]"
