description_md: |-
  The carved wooden picture door in the west portal of [[institution/gurk-cathedral|Gurk Cathedral]] in Carinthia shows scenes from the Old and New Testaments and dates from 1230/40; its leaves are of larch, the reliefs of limewood, originally with silver colouring, and it measures 396 × 230 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 19]] The lecture showed it together with the scenes of the Passion of Christ with their typological prefigurations.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 19]]

  The door belongs to the funnel-shaped west portal of around 1200, 5.5 m wide and 7 m high, which fills almost the whole east wall of the outer vestibule and, thanks to this sheltered position, is one of the best-preserved Romanesque portals in Austria.[[source/wikipedia-de-dom-zu-gurk|§ Äußere Vorhalle]] The remains of the wooden reliefs from the early 13th century are carved, painted foliage: the left leaf shows Christ surrounded by the four evangelists, with angels, prophets or apostles, and above them three of probably seven doves, symbols of the seven gifts of the Holy Spirit; the right leaf shows scenes from the life of Jesus, each set against the corresponding Old Testament scene.[[source/wikipedia-de-dom-zu-gurk|§ Äußere Vorhalle]] The vestibule itself is almost entirely covered with paintings of around 1340, rows of biblical scenes in the manner of a Biblia pauperum.[[source/wikipedia-de-dom-zu-gurk|§ Äußere Vorhalle]]

  The cathedral is a Romanesque pillared basilica built between 1140 and 1200, whose crypt received the tomb of St Hemma of Gurk in 1174.[[source/wikipedia-de-dom-zu-gurk]] In the lecture the door stood in a sequence of medieval wooden picture doors after Cologne and Le Puy.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 18]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 19]]
