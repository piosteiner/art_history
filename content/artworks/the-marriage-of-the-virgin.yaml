        note: The Goudstikker firm and most of its contents were sold in July 1940 to Alois Miedl, an agent of Hermann Goering … the July 1940 contract for the sale of the firm specifically noted that any works of art in which third parties held interest were not included in the sale … It was discovered in one of Miedl's buildings in the Netherlands after the war
        source: nga-1961-9-39
        accessed: 2026-11-24
