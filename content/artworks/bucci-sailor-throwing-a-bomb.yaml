description_md: |-
  The New Man as warrior: the soldier of the trenches as "a man among men", returning to a country of the "effeminate and old" [[source/dagnino-2016|p. 135]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 56]].

  ## Context

  [[artist/anselmo-bucci|Anselmo Bucci]], who had volunteered for the Volunteer Cyclist Battalion in 1915 [[source/wikipedia-en-anselmo-bucci|§ Biography]], made *Sailor Throwing a Bomb* in 1918, the last year of the [[event/world-war-i|First World War]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 56]]. The seminar showed it under the heading "The 'New Man' as warriors", with the passage from Jorge Dagnino in which the future Fascist hierarch Giuseppe Bottai, himself a volunteer, describes the soldier of the trenches as "a 'man among men', in possession of a 'youthful masculinity' who had returned to Italy transformed, to a country where there 'had remained nothing but effeminate and old people'" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 56]] [[source/dagnino-2016|p. 135]].

  ## The war and the New Man

  For many future Fascists the Great War was the first regenerative experiment in nationalising the masses and the dawn of a new era; in the trenches the [[term/new-man|New Men]] had fortified their characters and wills, ready to replace the old institutions, ideas and hierarchies after the war [[source/dagnino-2016|p. 134]]. Mussolini spoke of a "trenchocracy" whose members were the aristocrats of the future [[source/dagnino-2016|p. 135]]. Fascist propaganda presented intervention as a choice between heroism and cowardice; only the interventionist was a "true and virile man", while neutralists were portrayed as lacking manhood [[source/dagnino-2016|p. 135]]. The seminar followed the New Man through further images — as power and authority (Sironi), as worker ([[artwork/cambellotti-la-redenzione-dell-agro|Cambellotti's *La redenzione dell'Agro*]]) and in the cult of [[term/squadrismo|squadrismo]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 56–59]].
