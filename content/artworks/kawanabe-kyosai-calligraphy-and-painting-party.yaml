description_md: "A *[[term/shogakai|shogakai]]* painted by the guests themselves: [[artist/kawanabe-kyosai|Kawanabe Kyōsai]] drew the figures and the outlines of the screens and scrolls, and ten literati completed the pictures and calligraphy within it, each with his own signature [[source/cma-1983-88|1983.88]]. The physician and calligrapher Nakane Hanrei wrote 'longevity' (壽) with an enormous brush, Fukushima Ryūho painted the plum on the folding screen and Matsuoka Kansui the lotus [[source/cma-1983-88|1983.88]]. The hanging scroll, dated 1880, measures 139 × 69 cm and came to Cleveland in 1983 from David Newman, New York [[source/cma-1983-88|1983.88]]."
