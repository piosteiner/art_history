description_md: |-
  The third field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the Fall.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 35]] Several moments of the story are combined in one field, after the practice of contemporary book painting, so that the apple appears five times.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] The tree of knowledge stands at the centre of the scene.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 55]]

  Opposite it on the right leaf is the Crucifixion: the lecture paired the two and juxtaposed the tree of knowledge in this relief with the wood of life – the cross – in the opposite one, a theme that ran through the lecture's earlier session on "Das Holz des Lebens".[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 54]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 55]] Ittai Weinryb stresses that, following Harvey Stahl and Isabelle Marchesin, the trees in the background of the door's scenes point to the parts of the biblical narrative that mattered to medieval viewers, and that the story of loss and survival told through the Fall and the Incarnation corresponds to the place forests held in Slavic belief.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 104]]

  On the back of the door a large second pour (Überfangguss) lies in the area of this relief: here the molten bronze had not filled the mould completely and had to be cast again.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 72]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 73]]
