public_id: 107684
title: Tea bowl called Muichimotsu (Holding Nothing)
creator: chojiro
created: late 16th century
created_span: uncertain
kind: tea bowl
medium: Raku earthenware with transparent glaze
materials: [earthenware]
dimensions: [8.5]
institution: egawa-museum-of-art
description_md: "One of the most famous bowls of [[artist/chojiro]]: red [[raku]], formed by hand rather than thrown, under a transparent glaze — a cylinder rising abruptly from a narrow base to a wide mouth, the epitome of simplicity that [[person/sen-no-rikyu]] preferred. Raku ware is fired at low temperature and taken from the kiln while hot, so chance shapes its glaze. [[source/history-of-japanese-art|p. 251, fig. 287]]"
