description_md: |-
  This Annunciation by [[artist/domenico-veneziano|Domenico Veneziano]] comes from the predella of the altarpiece for Santa Lucia de' Magnoli in Florence; it is dated 1445–47, painted in tempera on wood and measures 24.3 × 54 cm [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 75]]. It is in the [[institution/fitzwilliam-museum|Fitzwilliam Museum]] in Cambridge [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 75]].

  In the lecture it was placed between two views of [[artist/giuliano-da-maiano|Giuliano da Maiano]]'s intarsia Annunciation on the east wall of the Sagrestia delle Messe in Florence Cathedral (1463–1465), to compare how painting and intarsia construct the same subject in perspective [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 74–76]]. The section belonged to the lecture's theme of the perspectival picture as an intersection of the visual pyramid, after Leon Battista Alberti's "De pictura" (1435), which compares the picture surface to "an open window" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 77–79]].
