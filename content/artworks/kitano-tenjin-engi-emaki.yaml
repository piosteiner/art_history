description_md: "The illustrated [[engi]] of the Kitano shrine: the life of [[person/sugawara-no-michizane]], his exile and death, the vengeance of his spirit and the founding of the shrine in his honour. In the scene of the first scroll the future Michizane appears as a child in the garden of his father, Sugawara no Koreyoshi (812–880), who sits in his hall and looks out onto it — the garden of a [[shinden-zukuri]] residence with its stream and miniature landscape of rocks and trees. [[source/history-of-japanese-art|p. 108, fig. 133]] The last scrolls of the set are [[rokudo-e]]; the most exciting scene shows Michizane’s vengeful spirit as the red-skinned God of Thunder riding a mass of black clouds and wreaking havoc in the palace — in the tradition of Fūjin and Raijin. [[source/history-of-japanese-art|p. 233, fig. 270]]"
