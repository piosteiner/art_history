description_md: "An icon of Kitano Tenjin, the deified [[person/sugawara-no-michizane]], patron of scholars: [[artist/konoe-nobutada]] (1565–1614), Minister of the Left and regent, one of the Three Master Calligraphers of the Kan’ei era, painted a fresh image of the deity every day. Broad, relaxed ink strokes for the robe, and his confident inscription: “[Kitano Tenjin] is one to whom the destiny of the empire may be entrusted.” A scholar-painter in the Chinese literati tradition. [[source/history-of-japanese-art|p. 266, fig. 306]]"
