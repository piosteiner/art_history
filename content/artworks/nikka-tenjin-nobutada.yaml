description_md: |-
  An icon of Kitano Tenjin, the deified [[person/sugawara-no-michizane]], patron of scholars: [[artist/konoe-nobutada]] (1565–1614), Minister of the Left and regent, one of the Three Master Calligraphers of the Kan’ei era, painted a fresh image of the deity every day. Broad, relaxed ink strokes for the robe, and his confident inscription: “[Kitano Tenjin] is one to whom the destiny of the empire may be entrusted.” A scholar-painter in the Chinese literati tradition. [[source/history-of-japanese-art|p. 266, fig. 306]]

  ## Inscriptions and where it is

  Besides the title 日課天神 and the line on Tenjin, the scroll bears a line of eight characters, 今須望足護皇基 — since the wish has been fulfilled, the speaker will now protect the imperial foundation — and a waka dated in the year Keichō tsuchinoto-tori (1609): "If just the heart is set on the path of truth, / even without prayers, will not gods protect me?" (translated by Miyeko Murase) [[source/yale-2024-62-1|Inscriptions]]. Mason gives the holder as Imadegawa Yōko in Shiga [[source/history-of-japanese-art|p. 266, fig. 306]]; by 1979 it was with the dealer Takashi Yanagi in Kyoto, who sold it that year to Peggy and Richard M. Danziger of New York; lent to the [[institution/yale-university-art-gallery|Yale University Art Gallery]] from 2009, it was given to the museum in 2024, which catalogues it as *Tenjin Traveling to China (Totō Tenjin)* [[source/yale-2024-62-1|Provenance]].
