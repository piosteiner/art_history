    label: finial raised 18th day of the 12th month of Jōwa 4 (1348) per the inscription on its base, built under the abbot Raishū with small donations ('one-mon' alms); the temple, then Jōfuku-ji, was renamed Myōō-in in the Edo period; owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/3143
        note: 明王院はもと常福寺と呼ばれ、律宗に属し、西大寺の末であった。 … 元和年間（一六一五～二四）水野勝成が福山入国後、寺籍を移してここをを明王院とした。五重塔はその伏鉢の刻銘により、貞和四年（一三四八）十二月十八日九輪を上げたことが明らかである。 … 所有者名 ： 明王院 所有者種別 ： 寺院
        source: kunishitei-102-3143
        accessed: 2026-11-24
      - url: http://www.chisan.net/myooin/page1/
        note: この塔は貞和4年(1348)住持頼秀のとき、一文勧進の少資を積んで造られたことが、伏鉢の陰刻銘からわかっています。 … 仏壇の来迎図は、明治年間皇室に献上され、現在は東京国立博物館に保管されています。
        source: myooin-official-pagoda
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/wiki/%E6%98%8E%E7%8E%8B%E9%99%A2_%28%E7%A6%8F%E5%B1%B1%E5%B8%82%29
        note: 明暦元年（1655年）に水野勝貞が福山藩3代藩主になると、本庄村にあった明王院を常福寺に合併し、常福寺は明王院と改め
        source: wikipedia-ja-myoo-in-fukuyama
        accessed: 2026-11-24
