description_md: |-
  War depicted as heroic, in [[movement/aeropittura]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 17]].

  ## Context

  [[artist/cesare-andreoni|Cesare Andreoni]] painted *Aeropainting and Tanks* in 1936, in the last phase of his Futurist work, when his aeropainting turned openly aviatory and documentary and dealt with Italy's wars — *La beffa di Addis Abeba* (1935–36) and *La guerra di Spagna* (1936) date from the same years [[source/wikipedia-it-cesare-andreoni|§ Le fasi della pittura futurista di Andreoni]]. Aeropainting ranged from abstraction to realism, the latter "especially in works of propaganda" [[source/wikipedia-en-aeropittura|§ Introduction]].

  ## War as heroic

  The seminar showed the painting under the heading "War" beside [[artwork/eber-the-battle-for-warsaw|*The Battle for Warsaw*]] (1940) by the German painter [[artist/elk-eber|Elk Eber]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 17]], and against [[artist/george-grosz|George Grosz]]'s [[artwork/grosz-to-them-peace-is-assured|*To them peace is assured*]] (1920) and [[artist/otto-dix|Otto Dix]]'s [[artwork/dix-der-krieg|*War*]] triptych (1932) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 18]]: after the First World War depictions of war often showed its gruesome side, whereas the totalitarian regimes again depicted war as heroic [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Golomstock saw in this a translation of Futurism: the idea of struggle, which the early Futurists expressed through abstract "lines of force", became in totalitarian art the concrete image of war [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. Walter Benjamin quoted a Futurist text praising the beauty of the war in Ethiopia as the prime example of Fascism's aestheticisation of politics [[source/antliff-2002|p. 154]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 6]].
