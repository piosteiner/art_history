        note: (Erich von Kreibig, Munich) [By 1970] — In late 1970, Munich dealer Erich von Kreibig corresponded extensively with CMA curator Ann Tzeutschler Lurie … All that is known about von Kreibig’s acquisition of the Waldmüller is that his family bought it in Switzerland.
        source: cma-1988-57
        accessed: 2026-11-24
