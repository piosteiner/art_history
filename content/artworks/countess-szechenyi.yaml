  - owner: institution/kunsthandlung-fritz-und-peter-nathan
    role: dealer
    acquired: 1940
    method: auction
    direct: true
    place: zurich
    label: photograph in the gallery's 1941–1942 album; buyer not recorded, possibly von Kreibig; perhaps resold through Fischer 1941/42
    sources:
      - url: https://clevelandart.org/art/1988.57
        note: (Galerie Nathan, Zürich) [1940-] — The records of Galerie Nathan include a photograph of the Waldmüller in the gallery's 1941-1942 album and describe its sale “durch [through] Fischer LU[cerne],” … Gallery records do not show to whom Nathan sold the painting, although Peter Nathan wrote to Ann Tzeutschler Lurie in 1993 that it was possible the buyer was von Kreibig
        source: cma-1988-57
        accessed: 2026-11-24
  - owner: person/erich-von-kreibig
    role: dealer
    acquired: 1970 or earlier
    place: munich
    label: his family bought it in Switzerland; offered to the CMA 1970 (declined January 1971); Grimschitz 1957 names a Munich private collector
    sources:
