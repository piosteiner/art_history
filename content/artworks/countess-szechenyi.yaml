        note: (Sale, Neumeister, Munich, Sept. 20-22, 1972, lot 1689 [1972] — … Kreibig wrote to Ann Tzeutschler Lurie on December 31, 1971 … that he had been unable to sell the painting, so he may have consigned it to Neumeister for sale.
        source: cma-1988-57
        accessed: 2026-11-24
