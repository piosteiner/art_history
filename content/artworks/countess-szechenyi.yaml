provenance:
  - owner: person/izidor-deutsch
    acquired_label: before 1906
    place: budapest
    label: red wax seal on the back "Dr. Deutsch Ügyved [attorney] Budapest"; no documentary confirmation, his will mentions no paintings
    certainty: possible
    sources:
      - url: https://clevelandart.org/art/1988.57
        note: "Possibly Dr. Izidor Deutsch [d. 1906], Budapest [Before 1906] — A red wax seal on the back of the painting reads: “Dr. Deutsch Ügyved [attorney] Budapest.” This seal may refer to Dr. Izidor Deutsch, a Hungarian attorney who lived in Budapest, although thus far no documentary confirmation of his ownership has been located."
        source: cma-1988-57
        accessed: 2026-11-24
  - owner: person/maximilian-mauthner
    place: feistritz-am-wechsel
    label: Schloss Feistritz, Wechsel; probably until 1925 (Feuchtmüller); a banker who bought Schloss Feistritz in 1922
    sources:
      - url: https://clevelandart.org/art/1988.57
        note: Maximilian Mauthner, Schloss Feistritz, Wechsel, Austria [Probably until 1925] — Mautner, a banker, purchased Schloss Feistritz in 1922, so if the attachment of Feistritz to Mautner’s name in Rupert Feuchtmüller's Waldmüller catalogue raisonné is at all linked with Mautner’s place of residence when he owned the painting, then his earliest possible year of ownership would be 1922.
        source: cma-1988-57
        accessed: 2026-11-24
  - owner: institution/dorotheum
    role: agent
    acquired: 1925-06-15
    method: auction
    place: vienna
    label: sale, lot 69; Mautner as consignor not confirmed
    sources:
      - url: https://clevelandart.org/art/1988.57
        note: (Sale, Dorotheum, Vienna, June 15, 1925, lot 69) [1925] — Feuchtmüller's catalogue raisonné says that Mautner had the painting until 1925. However, because the Dorotheum’s records do not include buyer/consignor information for sales prior to the late 1960s, that Mautner was the consignor to the sale has not been confirmed.
        source: cma-1988-57
        accessed: 2026-11-24
  - owner: person/paul-eger
    acquired_label: before 1940
    place: basel
    label: theatre director; named in Feuchtmüller's catalogue raisonné, Carritt gives a Basel private collection; the museum suspects a confusion with the Egger family of Budapest
    certainty: possible
    sources:
      - url: https://clevelandart.org/art/1988.57
        note: Possibly Dr. Paul Eger [1881-1947], Basel [Before 1940] — The catalogue raisonné lists Dr. Paul Eger as a former owner of the Waldmüller, while the information provided to CMA by David Carritt, Ltd. situates it in a Basel private collection, presumably Eger's, prior to Galerie Nathan … one must consider the possibility that the name “Eg[g]er” was seen at some point in connection with the painting
        source: cma-1988-57
        accessed: 2026-11-24
