description_md: "The Hall of the Lotus Sutra, or Third Month Hall: the oldest building of Tōdaiji, the Konshōji that Emperor Shōmu built in 733 for [[person/roben]], the first abbot. In the thirteenth century a worship hall was added in front and the two roofs were joined. On its altar the [[artwork/todai-ji-fukukenjaku-kannon]] among clay and dry-lacquer guardians and attendants — a mixture of images made for it and “guest” sculptures. [[source/history-of-japanese-art|p. 69, fig. 80, 106]]"
