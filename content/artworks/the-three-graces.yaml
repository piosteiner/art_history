description_md: Rubens painted the three daughters of Zeus, in a ring dance under a garland of flowers, in his last years (1630–35); the figure on the left is often seen as a likeness of his second wife, Helena Fourment. It was among the nudes kept out of view in the Academy’s reserved room before it came to the Prado.
