description_md: "A grove of snow-covered trees and a scholar’s pavilion against towering white mountains, recalling Sesshū: two overlapping right-angled triangles, balanced by their baselines. [[artist/tani-buncho]] (1763–1840), retainer of the Tayasu family in Edo and protégé of [[person/matsudaira-sadanobu]], brought bunjinga to the shogun’s capital. [[source/history-of-japanese-art|pp. 340–341, fig. 397]]"
