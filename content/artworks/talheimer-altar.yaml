description_md: |-
  A winged altarpiece made around 1520 for the parish church of Saints Cyriacus and Pancras at Talheim (today part of Mössingen, district of Tübingen), now in the Landesmuseum Württemberg, Stuttgart (inv. 1956-22).[[source/wikipedia-de-talheimer-altar|§ introduction]][[source/wikipedia-de-talheimer-altar|§ Künstler, Datierung und Standorte]] Its figures come from the workshop of [[artist/niklaus-weckmann|Niklaus Weckmann]] in Ulm; the painting of the figures and the panels is by another, unknown workshop, named after this work the [[artist/master-of-the-talheimer-altars|Master of the Talheim Altarpiece]].[[source/wikipedia-de-talheimer-altar|§ introduction]]

  ## Material

  It is made of lime and fir and keeps its original painting; it is 243.5 cm high and 44.5 cm deep.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 66]] Open, it is 425 cm wide.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]]

  ## Description

  In the shrine the Virgin sits enthroned on a raised seat with the Child on her lap, between Saint Cyriacus and Saint Pancras, before a gold ground and among four small angels; the saints and angels form her court.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]] The outer sides of the robes are gilded, the linings and undergarments set off in matt green, blue and red.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]] Above the Virgin are the arms of the donors, Ludwig von Stetten and his wife, née von Adelsheim.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]] Open, the wings show the Nativity and the Adoration of the Magi; closed, the Annunciation and the Visitation; the predella shows Christ and the twelve apostles.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]] Because the altar stood free as a high altar, its back is painted too, with a Last Judgment before which the faithful could make their confession.[[source/wikipedia-de-talheimer-altar|§ Beschreibung]]

  ## In the lecture

  The lecture showed the shrine with and without its figures, to make visible how the separately carved figures were set into a box made by the cabinetmaker.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 66]] The division of labour between carver, cabinetmaker and painter is typical of the Ulm workshops: Weckmann often worked as a subcontractor of Jörg Syrlin the Younger, who built the cases and gave the figure work to Weckmann and the panels to Ulm painters.[[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]]

  The altarpiece has been in the Old Palace in Stuttgart since 1844 and has belonged to the Landesmuseum since 1902; it is considered the largest, most splendid and best-preserved altarpiece of its medieval collection.[[source/wikipedia-de-talheimer-altar|§ Künstler, Datierung und Standorte]]
