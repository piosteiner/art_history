description_md: |-
  This intarsia panel in the studiolo of [[person/federico-da-montefeltro|Federico da Montefeltro]] in the [[institution/palazzo-ducale-urbino|Palazzo Ducale]] of Urbino shows a perspectival view through an arcade onto a landscape, with a basket of fruit and a squirrel in the foreground; it was made by [[artist/benedetto-da-maiano|Benedetto da Maiano]] in 1474–1476 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 65]]. It belongs to the wooden panelling of the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]].

  The lecture returned to the panel several times. It was compared with the views through arches by [[artist/fra-giovanni-da-verona|Fra Giovanni da Verona]] at [[artwork/coro-monte-oliveto-maggiore|Monte Oliveto Maggiore]] and in the [[artwork/sagrestia-santa-maria-in-organo-tarsie|sacristy of Santa Maria in Organo]] in Verona [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 67–71]] and with the painted [[artwork/citta-ideale-urbino|view of an ideal city]] in Urbino [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 72–73]]. It then served to illustrate Alberti's definition of the picture as the intersection of the visual pyramid, seen through the frame as through "an open window" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 77–80]]. In the following session it was shown beside the green elf-cup fungus (Chlorociboria), whose stain gave intarsia makers their "green wood" [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 8–9]].
