description_md: This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the presentation of Christ in the Temple and the Baptism of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 96]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] Like other large panels of this leaf it combines two scenes, whereas the corresponding panels of the right leaf show only one.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]
