description_md: |-
  A [[term/shrine-madonna|Shrine Madonna]] made in West Prussia around 1390 and now in the Germanisches Nationalmuseum, Nuremberg.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 92]] According to the museum the type probably arose in the lands of the Teutonic Order in Prussia; this statue is said to come from the castle chapel of Roggenhausen near Graudenz.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] The lecture names its origin as the town chapel of Roggenhausen.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 92]]

  ## Material

  The figure is carved from a solid block of limewood with a flattened back and keeps its original painting and gilding.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] It is 126 cm high, 82 cm wide closed and 103 cm open, and 34 cm deep.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]]

  ## Closed

  Closed, [[person/mary|Mary]] sits upright on a wide throne decorated with tracery and a high footstool; the clothed Christ Child stands on her right knee and grasps the index finger of her right hand.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] Apart from the flesh, everything is gilded; the linings are blue for Mary and green for the Child, the hems carry punched ornament, and two busts of prophets are painted in grisaille on the front of the footstool.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]]

  ## Opened

  The statue can be split vertically.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] Opened, Mary's body becomes a niche in which God the Father sits enthroned in a golden mantle, holding the cross; with outstretched arms Mary holds the wings, on which the clergy and the laity are painted in three rows as supplicants sheltering under her spread cloak.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] The real treasure inside is thus the carved Throne of Mercy, God the Father with the crucifix and the dove of the Holy Spirit – both now lost.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]] The museum explains the combination as the fourteenth century's mystical speculation joining the old idea of the Mother of God as a golden shrine with the image of the Virgin of Mercy (Schutzmantelmadonna).[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]]

  Elina Gertsman describes the same arrangement in other Prussian Shrine Madonnas: the Crucifixion at the centre points to Mary's second, painful "birth" of all humanity at the foot of the cross, and the painted men and women flanking the Throne of Mercy turn the statue into a variation on the Virgin of Mercy.[[source/gertsman-2015-worlds-within|pp. 89, 91]] Opened, Prussian Madonnas show three or four hands at once – one or both still visible outside and two carved again inside.[[source/gertsman-2015-worlds-within|p. 82]]

  ## Condition

  The Virgin's left hand and two jewels at the neckline are missing; the top of her head was cut off for a later crown; the gilding is worn on the ridges of the folds; and the paintings on the wings are badly damaged, especially at the bottom.[[source/gnm-objektkatalog-pl-o-2397|Beschreibung]]

  ## In the lecture

  The lecture returned to the statue several times and compared it with the ivory Boubon Madonna in Baltimore of around 1200.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 92–95, 104, 115, 117]]
