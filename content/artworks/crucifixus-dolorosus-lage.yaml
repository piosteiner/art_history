description_md: |-
  A crucifixus dolorosus in the former commandery of the Knights of St John at Lage, made in the early fourteenth century.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 68]] It is carved in oak; its painting has been reconstructed from remains of the first painting.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 68]]

  The cross in St. Johannes in Lage (Rieste, Lower Saxony) is counted among the later forked crucifixes that followed the cross of St. Maria im Kapitol in Cologne.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] The term crucifixus dolorosus, the "suffering crucified Christ", was introduced by the Italian art historian Géza de Francovich; such crosses date from around and just after 1300, before the great plague epidemics, so the older name "plague cross" is misleading.[[source/wikipedia-de-gabelkreuz|§ Entstehung]]

  In the lecture it followed the Rhenish forked crosses and preceded the crucifixi dolorosi of Santa Maria Novella in Florence and of Perpignan.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 66–70]]
