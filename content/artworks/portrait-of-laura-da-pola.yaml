provenance:
  - owner_label: Febo da Brescia, Laura's husband
    acquired: 1543
    method: commission
    label: Lotto noted the commission at Treviso in his account book in 1543 (“dui quadri de retrati grandi de naturale meze figure”) and complained of the payment in March 1544
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/ritratto-di-laura-da-pola/
        note: nel 1543 l’artista registrava nel proprio Libro di spese l’incarico avuto a Treviso “per dui quadri de retrati grandi de naturale meze figure” e, nel marzo del 1544, si lamentava del pagamento ricevuto da Febo da Brescia
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
  - owner_label: Count Castellane Harrach, Turin
    ended: 1859
    place: turin
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/ritratto-di-laura-da-pola/
        note: "provengono dalla collezione torinese del conte Castellane Harrach: messi in vendita nel 1859"
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
  - owner: artist/francesco-hayez
    role: agent
    acquired: 1859
    ended: 1859
    method: purchase
    direct: true
    label: bought them for the Pinacoteca, fearing they would go to the National Gallery in London
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/ritratto-di-laura-da-pola/
        note: furono acquistati per conto della Pinacoteca da Francesco Hayez, nel timore che venissero acquistati per la National Gallery di Londra
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
  - owner: institution/pinacoteca-di-brera
    acquired: 1859
    method: purchase
    place: milan
    label: King Victor Emmanuel II refunded the cost to Brera in 1860
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/ritratto-di-laura-da-pola/
        note: nel 1860, il costo dell’operazione fu restituito a Brera da re Vittorio Emanuele II.
