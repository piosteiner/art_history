description_md: |-
  [[place/zoagli|Zoagli]] on the Ligurian coast, painted in 1937 by [[artist/arturo-tosi|Arturo Tosi]], a painter of the [[movement/novecento-italiano|Novecento Italiano]] [[source/ragghianti-tosi-zoagli-dal-ponte]]; on the seminar slide "Zoagli Bridge, 1937", for the topic "Arturo Tosi and the Novecento Italiano group" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]].

  Tosi was best known for his landscapes; he sat on the governing committee of the Novecento Italiano, took part in its exhibitions of 1926 and 1929, and from the 1930s was among the most respected Italian painters [[source/wikipedia-en-arturo-tosi|§ Introduction]] [[source/wikipedia-en-arturo-tosi|§ Biography]]. Under the totalitarian regimes, landscapes, still lifes and nudes too carried ideological values [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]].
