description_md: |-
  This South German woodblock of about 1470/75 shows the martyrdom of St Sebastian; it is of pear wood, measures 27.3 × 19.3 × 1.9 cm and is in the [[institution/british-museum|British Museum]] (inv. 1847,0522.1) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 20]]. A hand-coloured [[artwork/martyrium-des-sebastian-holzschnitt-guildhall|impression]] printed from it (26.6 × 19.0 cm) is in the [[institution/guildhall-library|Guildhall Library]] in London, and the lecture showed block and print side by side [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 21]]; it returned to the pair at the start of the following session [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 3]].

  The block exemplifies the material of late medieval printmaking as described in the lecture: hard fruit woods with fine, dense fibres, pear above all, cut with the grain parallel to the printing surface; the lines to be printed were left standing as ridges while the rest was cut away [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Woodcut became the most important printing technique of late medieval Europe after about 1400, with the German-speaking lands as its centre, and single-leaf prints of religious subjects served above all private prayer [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]].
