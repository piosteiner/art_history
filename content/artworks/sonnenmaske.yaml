    label: circumstances unknown; possibly taken from a shaman's grave house near Port Mulgrave, Yakutat, where he found painted wooden masks in 1886
    sources:
      - url: https://rietberg.ch/sammlungen/rna-204
        note: '1886: George Thornton Emmons (1852–1945), Erwerbsumstände unbekannt in Yakutat "Möglicherweise wurde die Sonnenmaske 1886 aus dem Grabhaus geholt. In diesem Jahr hatte der Leutnant nämlich in einem Schamanengrab in der Nähe von Port Mulgrave, Yakutat, neben anderen Objekten eine Anzahl von bemalten Holzmasken gefunden." (Vgl. Wege der Kunst, S. 40)'
        source: rietberg-rna-204
        accessed: 2026-11-24
