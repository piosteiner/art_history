    label: "not documented: a mask with a similar historical inventory number suggests the same route"
    certainty: possible
    sources:
      - url: https://rietberg.ch/sammlungen/rna-204
        note: '1888–1893: American Museum of Natural History, New York (1869), angekauft, in New York Nicht belegt: Eine Maske mit ähnlicher hist. Inventarnummer legt nahe, dass die Sonnenmaske denselben Weg machte. Emmons bot 1888 dem AMNH Objekte an, 1893 wurden nach Leihgabe durch Emmons für die "Worlds Columbian Exposition" in Chicago weitere gekauft. (Vgl. Wege der Kunst, S. 40)'
        source: rietberg-rna-204
        accessed: 2026-11-24
