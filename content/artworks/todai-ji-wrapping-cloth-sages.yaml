description_md: "A soft leather cloth, probably the cover of a rectangular box, dyed with scrolling grape vines — a motif from far west along the Silk Roads — and at both ends the same scene: two Chinese sages divided by a tree, each seated on a rocky outcrop, one playing the qin. [[source/history-of-japanese-art|p. 53, fig. 57]]"
