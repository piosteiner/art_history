    label: bought for him by Sir Thomas Lawrence (1769–1830) (Hofstede de Groot); the annotated catalogue names 'Woodin' as buyer; London and Novar House, Ross-shire; not found in the Munro sales
    sources:
      - url: https://www.nga.gov/collection/art-object-page.83.html
        note: purchased by Sir Thomas Lawrence [1769-1830] for Hugh Andrew Johnstone Munro [1797-1864], London, and Novar House, near Evanton, Ross-shire, Scotland.[2] — [2] … the Wallace Collection (London) Library’s copy of the sale catalogue is annotated with the name “Woodin” as the buyer … Munro acquired a significant collection that was dispersed in sales both before and after his death, but the painting has not been located in any of the sale catalogues.
        source: nga-1937-1-76
        accessed: 2026-11-24
