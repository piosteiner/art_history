      - url: https://www.nga.gov/collection/art-object-page.83.html
        note: (sale, Phillips, London, 14-15 April 1826, 1st day, no. 64, bought in); — [1] Although the main seller at the April 1826 sale was Lord Berwick, there were also other consignors. One annotation in the Wallace Collection (London) Library’s copy of the sale catalogue indicates that Zachary was the consigner of the NGA painting; another annotation next to the Lucretia entry reads “Sir T Lawrence.” The Getty Provenance Index© Database, Sale Catalogs, lot 0064 from sale catalog Br-2806, identifies the latter annotation as indicating a previous owner.
        source: nga-1937-1-76
