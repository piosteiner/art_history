description_md: "Three handscrolls telling a scandal of 866: the Ōten Gate of the imperial palace burnt down, and the major counsellor Tomo no Yoshio (Ban Dainagon) blamed his rival, the minister Minamoto no Makoto, until a quarrel between two boys revealed that he had set the fire himself; he was sent into exile. The scroll opens with a long passage of crowds running towards the gate in flames; inside the palace Emperor Seiwa and his grandfather Fujiwara no Yoshifusa confer in the Seiryōden. The children’s fight is told in one continuous picture — the fight, the father kicking the other boy, the gossip spreading through the neighbourhood — and the grief of the Ban household with the faces shown openly. The figures are drawn with a free calligraphic line as in [[otoko-e]], but with the bright, thick colours of [[tsukuri-e]]. Attributed to [[artist/tokiwa-mitsunaga]] on the style of the Nenjū gyōji emaki; dated between 1157 and 1180. [[source/history-of-japanese-art|pp. 104, 121–122, figs. 127, 146–147]]"
