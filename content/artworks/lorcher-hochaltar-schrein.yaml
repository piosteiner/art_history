description_md: |-
  The shrine of the Lorch high altarpiece (1483), seen when the altarpiece is open, with Saint Martin, patron of the parish church, dividing his cloak with the beggar.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 99]] The sculpture and ornament are limewood.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 97]]

  The two-storey shrine is divided into five niches, designed as chapel choirs with varied vaults and covered with fine, intertwined branch-work.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] Saint Martin with the beggar stands in the upper register directly above the Virgin, flanked by Wendelin, Bartholomew, John the Baptist and Anthony the Great; in the lower register the Virgin and Child on the crescent moon, 159 cm high, stand between the four virgin martyrs Catherine, Barbara, Margaret and Dorothy, while the other shrine figures are only about 115 cm high.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] Two small niches hold the busts of the master of the works and of the carver, who holds a scroll with the date 1483.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]]

  The figure identified as Bartholomew was given a saw instead of a knife in the nineteenth-century restoration and so became Simon the Zealot; it is therefore named Simon, Bartholomew or Matthias in different publications.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]]
