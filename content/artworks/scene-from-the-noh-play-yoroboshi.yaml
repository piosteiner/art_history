description_md: "A pair of six-fold screens[[source/tnm-a-10508-yoroboshi|„6曲1双“]], shown at the second exhibition of the revived Japan Art Institute (Inten) in 1915[[source/tnm-a-10508-yoroboshi|„再興第２回院展の出品作“]]. The museum records the screens as one object, „6曲1双“ — six folds (曲), one pair (双) —, so it holds both; its own page shows a photograph of the right screen only, ColBase, the national museums’ image database, has both[[source/colbase-tnm-a-10508]]; a single screen would be counted with 隻, as „6曲1隻“[[source/wikipedia-ja-byobu|„これを接続したものが屏風の一単位、一隻（一畳、一帖）である“ · „14世紀前半には二隻（一双）を単位とする、六曲一双形式が定型となった“]]. A scene from the Noh play *[[yoroboshi|Yoroboshi]]*: in the garden of Shitennō-ji, where the plum trees are in bloom, the blind youth Shuntokumaru, disowned by his father, begs and prays towards the setting sun of the equinox[[source/tnm-a-10508-yoroboshi|„盲目の弱法師俊徳丸が、梅の花の咲く四天王寺の庭で、彼岸の落日に向かって拝む謡曲『弱法師』の一場面。“ · English page: “In a garden with blooming plum trees at Shitennoji Temple, a blind youth, disowned by his father, begs and offers a prayer facing the setting sun”]]. He stands on the right screen beneath an old plum tree; the left screen holds only the red sun and a branch of plum on the gold ground. Kanzan took the tree from the Garyūbai, the “reclining-dragon plum” in the Sankeien garden in Yokohama[[source/tnm-a-10508-yoroboshi|„観山は三渓園内の臥龍梅の木に着想を得てこの絵を描いた“]]; the face, like a Noh mask, gives the screens the mood of the Noh stage[[source/tnm-a-10508-yoroboshi|„能面を思わせる面貌とともに能楽的情緒を漂わせている“]]. Important Cultural Property[[source/tnm-a-10508-yoroboshi|„重要文化財“]]."
