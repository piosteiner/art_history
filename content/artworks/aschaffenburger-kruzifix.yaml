description_md: |-
  The Aschaffenburg Crucifix is a monumental crucifix from south-west Germany of about 980/1000, with a corpus of poplar on an oak cross and remains of the original polychromy, 195 cm high, in the collegiate church of Aschaffenburg.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 18]] Klaus Endemann lists it as Middle Rhenish, 980, and places it in the former collegiate church of Sts Peter and Alexander.[[source/endemann-2020-wood-carving-and-staffering|pp. 144, 147]]

  It is one of the early monumental crucifixes that still await technical examination.[[source/endemann-2020-wood-carving-and-staffering|p. 142]] Today it hangs on a heavily battered fourteenth-century cross; it was almost certainly altered in the late Middle Ages, when the original T-shaped cross (*crux commissa*) was turned into a Latin cross with recesses imitating cabochons, as a jewelled cross understood as the tree of life (*lignum vitae*).[[source/endemann-2020-wood-carving-and-staffering|p. 142]] The breaks in the modelling of the thorax, abdomen and loincloth cannot be explained without a laboratory study.[[source/endemann-2020-wood-carving-and-staffering|p. 142]] It is unclear whether feet and footrest were pierced originally or were damaged; cracks near the ankles suggest a repair.[[source/endemann-2020-wood-carving-and-staffering|p. 155]] Like the [[artwork/gerresheimer-kruzifix|Gerresheim]] and [[artwork/boston-crucifix|Boston]] crucifixes and unlike the [[artwork/gero-cross|Gero Cross]], the figure was not originally hollowed out.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] The lecture showed it with the Gerresheim Crucifix among the oldest preserved wooden crucifixes.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 18]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 71]]
