description_md: "The best-known of the rock-art sites of southern Korea, on a river bank near Ulsan: animals, fish, whales, boats, hunting and fishing scenes, pecked, ground and engraved in a “silhouette” and an “x-ray” style; Sasse has compared them with Arctic rock art. A dam now submerges the panel for much of the year. [[source/portal-2000|pp. 33–34, fig. 14]]"
