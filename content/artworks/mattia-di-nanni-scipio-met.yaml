description_md: |-
  This intarsia panel by [[artist/mattia-di-nanni|Mattia di Nanni]] shows Scipio Africanus; it comes from the [[artwork/mattia-di-nanni-ciclo-sala-del-consiglio|cycle for the Sala del Consiglio]] of the [[institution/palazzo-pubblico|Palazzo Pubblico]] in Siena, made in 1426–1430 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 48]]. It is inlaid with walnut, poplar, bog oak, rosewood and bone, measures 61.5 × 43.3 cm and is in the [[institution/metropolitan-museum-of-art|Metropolitan Museum of Art]] in New York [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 48]].

  Walnut, the mid- to dark-brown wood used both for the ground and for inlays, was the staple of Italian Renaissance intarsia; poplar served, besides walnut, elm, chestnut, larch and fir, for the supporting structure [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]]. The larger surviving panel of the cycle, with [[artwork/mattia-di-nanni-tarsie-montreal|three Roman heroes]], is in Montreal [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 45]].
