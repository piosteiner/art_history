description_md: |-
  A crucifixus dolorosus – a crucifix of the suffering Christ – in the church of Santa Maria Novella, Florence, made around 1300/1320.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 69]] The cross is made of cedar and is 1.67 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 69]]

  The lecture showed it after the Rhenish forked crosses and before the Dévot Christ of Perpignan, as an Italian example of the same new image of the wounded Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62–70]] Many crucifixi dolorosi are found with Dominicans and Franciscans, especially in Italy, and Italian influence is clearly visible in the early Rhenish examples.[[source/wikipedia-de-gabelkreuz|§ Entstehung]][[source/wikipedia-de-gabelkreuz|§ Vorkommen]]
