description_md: "A handscroll in which [[artist/yosa-buson]] (1716–1783), the haiku poet second only to [[person/matsuo-basho]], wrote out and illustrated Bashō’s poetic diary: Bashō and his companion Sora start on their journey, sketchily drawn in ink lines and colour washes, moving away while three friends stand deferentially and sadly bid them farewell — setting the melancholy, sentimental tone of the text. [[source/history-of-japanese-art|pp. 333–334, fig. 389]]"
