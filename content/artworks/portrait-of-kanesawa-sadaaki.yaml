    acquired_label: Kamakura period, painted close to the sitter's lifetime
    place: yokohama
    label: one of the 'Four Generals' portraits of the Kanazawa Hōjō handed down at their family temple Shōmyō-ji (Kanazawa, Yokohama); sitter Kanazawa Sadaaki, Sanetoki's grandson
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/151
        note: 本図は″四将像″の名で金沢北条氏の菩提寺、称名寺【しようみようじ】に伝わったもので、歴史上著名な武人の一門四代にわたる肖像画として、文化史的にもきわめて価値の高いものである。画像の製作時期はいずれも像主の生存年代に近く、描写もすぐれ、鎌倉時代の代表的作品である。 … 時代 ： 鎌倉 … 所有者名 ： 称名寺
        source: kunishitei-201-151
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E7%A7%B0%E5%90%8D%E5%AF%BA_(%E6%A8%AA%E6%B5%9C%E5%B8%82)&oldid=111486752
        note: 絹本著色北条実時像・北条顕時像・金沢貞顕像・金沢貞将像、文選集注（国宝）
        source: ja-wikipedia-shomyoji-yokohama
        accessed: 2026-11-24
