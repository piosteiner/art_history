description_md: |-
  A forked crucifix (Gabelkreuz) in the Liebfrauenkirche (Maria Himmelfahrt) at Andernach, known as the Ungarnkreuz ("Hungarian cross"); the lecture dates it 1320/40.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 64]][[source/wikipedia-de-maria-himmelfahrt-andernach|§ Ungarnkreuz]] The corpus, 1.02 m high, is carved in alder, the head in walnut, and it carries several layers of paint.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 64]]

  The cross came to Andernach in the fourteenth century, brought by Hungarian pilgrims on their way to Cologne; Wikipedia dates its making to the beginning of the fourteenth century.[[source/wikipedia-de-maria-himmelfahrt-andernach|§ Ungarnkreuz]] It shows the tortured body of Christ, as Gothic art represented it, hanging from a three-branched cross, and is almost identical to the forked crucifix of St. Maria im Kapitol in Cologne.[[source/wikipedia-de-maria-himmelfahrt-andernach|§ Ungarnkreuz]] The lecture set the two side by side.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 64]] The type arose under the influence of mysticism in the late thirteenth or early fourteenth century and is found above all in the Rhineland.[[source/wikipedia-de-gabelkreuz|§ introduction]]
