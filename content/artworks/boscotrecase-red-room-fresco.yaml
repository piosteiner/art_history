description_md: |-
  One of the large landscape panels of the Red Room (cubiculum 16) in the villa of Agrippa Postumus at Boscotrecase, on the slopes of Vesuvius: a sacral-idyllic landscape with trees, columns and statues, floating on a white ground in the middle of a red wall divided by slender painted columns, above a black dado.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 84]][[source/wikipedia-en-villa-of-agrippa-postumus|§ The Red Room]] The fresco measures 303 × 325 cm and is in the Museo Nazionale in Naples (inv. 147501).[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 84]]

  The villa was buried in the eruption of 79 CE and excavated in 1903–1905; its paintings are divided between the Museo Archeologico Nazionale in Naples and the Metropolitan Museum of Art in New York.[[source/wikipedia-en-villa-of-agrippa-postumus|introduction]] A roof tile naming the consuls of 11 BCE is commonly taken to date the decoration of the rooms, which belongs to the Third Pompeian Style. Who commissioned it is open: Agrippa before his death in 12 BCE, or his widow Julia for their infant son Agrippa Postumus.[[source/wikipedia-en-villa-of-agrippa-postumus|§ History; § Frescoes]] The painters are not known.

  ## Trees, columns and statues

  The lecture "Aus dem Wald" showed the panel in its section on the tree and the image of the god, after the Anaglypha Traiani with the sacred fig of the Forum.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 79]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 80]] Carole M. Cusack's study of sacred trees, the reading for this session, describes the setting of such cults: in early Greek times, as John Pedley observes in a passage she quotes, worship took place in sanctuaries "often marked only by a special spot hallowed by nature – a tree, a rock, a hilltop, a cave, a spring – and an altar".[[source/cusack-2011-the-sacred-tree|p. 33]] Greek vernacular religion venerated nature: the woodlands were full of nymphs and satyrs, and the rural landscape was filled with "simple rustic shrines and local festivals".[[source/cusack-2011-the-sacred-tree|p. 40]] Aniconic pillars that stood for deities were gradually replaced by anthropomorphic statues from the Archaic period onward.[[source/cusack-2011-the-sacred-tree|p. 33]]
