provenance:
  - owner_label: Sanctuary of Apollo, Delphi
    acquired: c. 470 BCE
    method: gift
    place: delphi
    label: dedicated by Polyzalus, tyrant of Gela, for his chariot victory at the Pythian Games of 478 or 474 BC; part of a group with chariot and horses
    sources:
      - url: https://en.wikipedia.org/wiki/Charioteer_of_Delphi
        note: The work was dedicated at the Sanctuary of Apollo at Delphi … to commemorate one of two victories of the tyrant Polyzalus of Gela in Sicily and his chariot in the Pythian Games of either 478 or 474 BC
        source: wikipedia-en-charioteer-of-delphi
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: -373
    place: delphi
    label: buried in the debris of the earthquake of 373 BC
    sources:
      - url: https://en.wikipedia.org/wiki/Charioteer_of_Delphi
        note: Unlike many other artworks from the sanctuary that were looted or destroyed, it survived because it had been buried in the debris of the great earthquake of 373 BC.
        source: wikipedia-en-charioteer-of-delphi
        accessed: 2026-11-24
  - owner_label: French excavation of Delphi
    acquired: 1896
    method: find
    place: delphi
    label: found in three pieces with fragments of the horses
    sources:
      - url: https://en.wikipedia.org/wiki/Charioteer_of_Delphi
        note: The statue was discovered in 1896 during excavations at Delphi. … When discovered, the statue was in three pieces—head and upper torso, lower torso, and right arm.
        source: wikipedia-en-charioteer-of-delphi
        accessed: 2026-11-24
      - url: https://el.wikipedia.org/wiki/%CE%97%CE%BD%CE%AF%CE%BF%CF%87%CE%BF%CF%82_%28%CE%AC%CE%B3%CE%B1%CE%BB%CE%BC%CE%B1_%CE%94%CE%B5%CE%BB%CF%86%CF%8E%CE%BD%29
        note: Η γαλλική ανασκαφή των Δελφών, το 1896 τον έφερε ξανά στο φως, σχεδόν ανέπαφο
        source: wikipedia-el-iniochos-agalma-delfon
        accessed: 2026-11-24
  - owner: institution/delphi-archaeological-museum
    method: transfer
    place: delphi
    sources:
      - url: https://en.wikipedia.org/wiki/Charioteer_of_Delphi
        note: The statue is housed today in the Delphi Archaeological Museum.
