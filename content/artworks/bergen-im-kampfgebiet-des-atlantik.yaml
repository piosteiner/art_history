description_md: "*Im Kampfgebiet des Atlantik* by [[artist/claus-bergen|Claus Bergen]] (before 1940) was shown at the Great German Art Exhibition of 1941 in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; reproduced as a postcard from a photograph by Heinrich Hoffmann ([Bayerische Staatsbibliothek, Bildarchiv hoff-70527](https://bildarchiv.bsb-muenchen.de/fylr/L/3b6cf618-ee4e-439a-ab2b-6adef8ed8910)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] With the war, Schlenker writes, military and warlike pictures multiplied in the exhibitions.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Auswirkungen des Zweiten Weltkriegs]]"
