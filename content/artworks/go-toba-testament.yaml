description_md: The testament [[person/emperor-go-toba]] (1179–1239) composed in exile on the island of Oki a few months before his death, after the failure of his Jōkyū Rebellion against the shogunate in 1221. The calligraphy is among the most refined of a long tradition; the hand and palm prints, long reputed to be of blood, are of red seal ink, as John Carpenter has shown — pressed so hard that they are an almost intact record of the exiled emperor’s hands. [[source/history-of-japanese-art|pp. 181–182, fig. 210]]
