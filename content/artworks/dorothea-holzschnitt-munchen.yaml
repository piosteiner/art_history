description_md: |-
  This early woodcut shows St Dorothy with the Christ Child; it was made in Bavaria or Salzburg about 1410/20, is coloured by hand and printed on paper measuring 28.7 × 20.9 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 15]]. It belongs to the [[institution/staatliche-graphische-sammlung-munchen|Staatliche Graphische Sammlung]] in Munich (inv. 171056) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 15]].

  It is one of the earliest single-leaf prints shown in the lecture, which dated the beginning of figurative printing on paper with wooden blocks in western Europe to about 1400, centred on the German-speaking lands [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]]. Prints with religious subjects were used above all in private devotion and could be kept loose or pasted into manuscripts [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]]. Technically the woodcut is a relief process: a drawing was transferred in reverse onto the block and cut with knives, and early prints were made by stamping the inked block onto the paper or by rubbing the paper laid on the block [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]].
