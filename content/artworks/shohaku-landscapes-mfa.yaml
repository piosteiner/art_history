description_md: "A pair of screens by [[artist/soga-shohaku]] (1730–1781), dated by Money L. Hickman shortly after his fortieth birthday: at first the familiar foreground rocks, trees and hazy mountains, but disparate elements are juxtaposed almost to the limit, so that perspective shifts from one rock to the next. Shōhaku, born Miura in Kyoto, invented a genealogy back to the fifteenth-century painter Dasoku. [[source/history-of-japanese-art|pp. 324–325, fig. 377]]"
