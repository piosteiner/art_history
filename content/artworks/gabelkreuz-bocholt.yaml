description_md: |-
  A forked crucifix (Gabelkreuz) in the church of St. Georg in Bocholt, made before 1315.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62]] The corpus, 1.02 m high, is carved in walnut and keeps its original painting over a chalk ground.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62]]

  The Bocholt cross took the forked crucifix of St. Maria im Kapitol in Cologne as its model, although different painters worked on the two; its original painting has been visible again since 1967.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] Small uncovered areas of the first painting on the Cologne cross show striking similarities with it.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] It is one of the later forked crosses of the Münsterland, beside those of Coesfeld, Borken and Haltern.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]]

  The Bocholt cross is the oldest and most important object in the church and remains the centre of a regional pilgrimage; it stands on a pedestal at the right-hand steps to the choir.[[source/wikipedia-de-st-georg-bocholt|§ introduction]][[source/wikipedia-de-st-georg-bocholt|§ Gebäude und Ausstattung]] According to legend, on Easter Monday 1315 blood flowed from the cross onto the dress of a woman.[[source/wikipedia-de-st-georg-bocholt|§ Gebäude und Ausstattung]]

  In the lecture it was the first of the crosses compared with the Cologne Gabelkreuz of 1304.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62–63]]
