    label: "Zen temple founded by Musō Soseki, who built a Kannon pavilion here in 1314 (Musō nenpu); the present hall dates by style from the Nanbokuchō period (temple tradition: 1314); owner Eihō-ji"
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/1044
        note: 正和2年（1313）に夢窓疎石（1275-1351）が現地を「山水の景物、天開図画の幽致なり」と賞して古𧮾庵を営み、翌年に観音閣を建てた。これが当寺の草創だが … 『夢窓年譜』に正和3年（1314）の観音閣建立がみえるが、現在の観音堂は様式上より南北朝期に下っての建立であろう。 … 所有者名 ： 永保寺
        source: kunishitei-102-1044
