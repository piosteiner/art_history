        note: Rev. John Sanford [1777-1855], Florence and London;[3] — [3] … Sanford commissioned Aristodemo Costoli to make a cast of the bust and to carve a marble version. … Sanford took the bust to England, and offered it for sale
        source: nga-1943-4-92
        accessed: 2026-11-24
