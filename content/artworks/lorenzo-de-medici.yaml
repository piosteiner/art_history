    label: the 'Avvocato' Rivani, scholar and collector, secretary of the Società Colombaria (Sanford's letter quoted by Dennys, 1843)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.12189.html
        note: Alessandro Rivani [1746-c. 1832], Florence.[1] — [1] … "It was previously in the possession of the 'Avvocati Rivani, a very distinguished scholar and collector of works of Art, who died about ten years since. He was Secretary to the Antiquarian Society called Colombaria."
        source: nga-1943-4-92
        accessed: 2026-11-24
  - owner: person/carlo-ernesto-liverati
    ended: c. 1835
    place: florence
    label: for sale in the artist's studio as the undoubted work of Michelangelo
    sources:
      - url: https://www.nga.gov/collection/art-object-page.12189.html
        note: Carlo Ernesto Liverati [1805-1844], Florence, until c. 1835;[2] — [2] … Sanford tells Dennys that he (Sanford) "purchased it of an artist, in whose studio he found it for sale as the undoubted work of Michael Angelo [sic]." Giancarlo Gentilini … confirms the artist as Liverati
        source: nga-1943-4-92
        accessed: 2026-11-24
