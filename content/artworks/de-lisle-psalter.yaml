description_md: The Psalter of Robert de Lisle, made about 1310, is in the British Library, London (Arundel 83 II).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]] Fol. 7r shows a Tree of Vices.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]] In the lecture the page belonged to the high-medieval tree diagrams and was set beside the tree of the fruit of the three estates in the [[artwork/speculum-virginum-koln-w-276a|Speculum virginum]] of about 1140–50.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 105]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]] Already the [[artwork/liber-floridus-gent|Liber Floridus]] of about 1120 uses trees for the Beatitudes, for virtues and vices and for the ages of the world.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 118]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 119]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 128]]
