description_md: "The main hall of the grand shrine at Izumo, dedicated to Ōkuninushi no Mikoto, and the type of [[taisha-zukuri]]: two square bays with eight pillars and a central one, raised on round piles, under a curved gable roof; the stair to the door at one end, off centre. Said to be modelled on the palaces of the early Yamato rulers; the present building dates from 1744 but keeps its ancient form. [[source/history-of-japanese-art|p. 56, fig. 61]]"
