    label: mid-8th-century clay figures in the Hokkedō, probably made in the government atelier; their origin is unknown and the names Nikkō/Gakkō are later (first in the Genroku era) — perhaps Bonten and Taishakuten
    sources:
      - note: 109 Nikko, in the Hokkedō, Tōdaiji. Mid-8th century. Clay with remains of paint … Scholars today consider that … these two images were probably not originally intended to be Nikko and Gakko, but instead are representations of Bonten and Taishakuten.
        source: history-of-japanese-art
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E6%9D%B1%E5%A4%A7%E5%AF%BA%E6%B3%95%E8%8F%AF%E5%A0%82&oldid=109083415
        note: 本尊が立つ八角仏壇上の左右に脇侍のように立っていた像で … その伝来は不明であり、「日光・月光菩薩」という名称も本来のものではない。…元禄年間 (1688年 - 1704年)の『東大寺諸伽藍略録』が初出である。
        source: jawiki-todaiji-hokkedo
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/194
        note: 時代 ： 奈良 … 所有者名 ： 東大寺
