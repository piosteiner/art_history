description_md: |-
  The closed state of the Blaubeuren high altarpiece: the outer sides of the wings, painted by [[artist/bernhard-strigel|Bernhard Strigel]] and [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]] in 1491–1494 with four scenes of the Passion – Christ praying on the Mount of Olives, the Crowning with Thorns, the Carrying of the Cross and the Crucifixion.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 39]] The wings are of spruce; the shrine they close is 4.50 m high and 4.20 m wide.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 39]]

  On most days of the year a winged altarpiece stood closed, so these painted Passion scenes were what the congregation usually saw.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 186]] Opened, the wings revealed first sixteen painted scenes from the life of John the Baptist and then the carved shrine.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 40–41]]
