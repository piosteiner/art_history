description_md: Ofuji, the “ginkgo girl” of the toothpick shop behind the Asakusa Kannon and one of the two great beauties of Edo, flirts with a young samurai — slender, graceful, innocent and untouched by life like all [[artist/suzuki-harunobu]]’s women; ginkgo leaves at her feet and a willow, emblem of the pleasure quarter, behind her. [[source/history-of-japanese-art|p. 284, fig. 322]]
