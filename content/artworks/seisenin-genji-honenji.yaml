description_md: "A pair of screens by [[artist/kano-osanobu]] (1796–1846), known as Seisenin, the best Kanō painter of the early nineteenth century, who drew on the [[movement/tosa-school]] yamato-e: the dance of Genji and his rival Tō no Chūjō at the autumn excursion, and the New Year’s Day at Lady Murasaki’s spring palace, the plum trees and pines framed by clouds. [[source/history-of-japanese-art|pp. 312–313, fig. 363]]"
