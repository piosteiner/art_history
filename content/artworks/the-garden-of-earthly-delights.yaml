description_md: "A triptych by Hieronymus Bosch: closed, the wings show the creation of the world in grisaille; open, Paradise, the garden of earthly delights and Hell. It belonged to the Nassau family in Brussels, was confiscated by the Duke of Alba in 1568 and given by Philip II to El Escorial in 1593; it is a deposit of Patrimonio Nacional at the Prado."
