public_id: 107929
title: Bare Peaks of Mount Gabi
creator: yosa-buson
created: 1778/1783
kind: handscroll
medium: Handscroll, ink and colour on paper
materials: [ink, paper]
dimensions: [28.8]
description_md: "[[artist/yosa-buson]]’s most personal style, after a poem by Li Bai (701–762) on the moonlit Mount Emei in Sichuan: the boldly written title and the painter’s signature open the scroll, then peak after peak in dark grey ink with thin red ocher, each different, until at the very end a sliver of moon is left in the untouched paper — the moon, so important in the poem, is the scroll’s surprise. [[source/history-of-japanese-art|pp. 334–335, fig. 390]]"
