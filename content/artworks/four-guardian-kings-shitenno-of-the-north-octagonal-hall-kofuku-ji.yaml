    place: nara
    label: wood-core dry-lacquer figures made in the 4th month of Enryaku 10 (791) as the Four Kings of Daian-ji, according to the 1285 repair inscription
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/264
        note: 増長天、多聞天像台座裏面の弘安八年興福寺僧経玄の修理銘に、大安寺四天王像、延暦十年四月造立とある
        source: kunishitei-201-264
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E8%88%88%E7%A6%8F%E5%AF%BA&oldid=111607028
        note: 弘安8年（1285年）の修理銘によると、本来は大安寺のもので、延暦10年（791年）に造立されたという。
        source: wikipedia-ja-kofuku-ji
        accessed: 2026-11-24
  - owner: institution/kofuku-ji
    acquired: 1285 or earlier
    place: nara
    label: repaired 1285 (Kōan 8) by the Kōfuku-ji monk Kyōgen; now in the North Octagonal Hall, not the hall's original set (Unkei's Shitennō of 1210–12 are lost)
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/264
        note: 年代 ： 791／修理銘 1285 … 弘安八年興福寺僧経玄の修理銘 … 所有者名 ： 興福寺
        source: kunishitei-201-264
        accessed: 2026-11-24
      - note: a Miroku Butsu … that was originally attended by a large retinue of two bodhisattvas, Shitenno (Four Guardian Kings), and two Indian rakan … Of these only the Miroku and the two standing rakan … have survived the centuries
        source: history-of-japanese-art
        locator: p. 189
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E8%88%88%E7%A6%8F%E5%AF%BA&oldid=111607028
        note: なお、本来は現在中金堂に安置されている四天王像が、北円堂の本来像ではないだろうかと判断する学説が根強い。
        source: wikipedia-ja-kofuku-ji
        accessed: 2026-11-24
