    notes_md: A Viennese editor working as a dealer in Berlin and Paris; Jewish, threatened by Nazi persecution, he fled from Paris to the USA in 1940. When and how he sold the painting is unknown. The Kunsthaus published it on Lost Art in 2025 (find 630031) and has been in contact with the representatives of Gold’s heirs since 2026.
    sources:
