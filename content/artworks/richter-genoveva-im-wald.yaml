description_md: |-
  A painting by [[artist/ludwig-richter|Ludwig Richter]], *Genoveva in der Waldeinsamkeit*, signed and dated lower right "L. Richter 1841.", in the [[institution/hamburger-kunsthalle|Hamburger Kunsthalle]].[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]] The lecture "Aus dem Wald" calls it *Genoveva im Wald* and gives oil on canvas, 116.5 × 100.5 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 11]]

  ## Description

  Richter turned to the subject several times from the late 1830s.[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]] Here Genoveva and her son Schmerzensreich, cast out into the wilderness, are set in a fairy-tale-like Romantic forest solitude and singled out by a ray of sunlight like a spotlight — in the words of the museum's text by Markus Bertsch, existential distress turned into an idyll.[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]] The hind whose milk saved them from certain death appears as a sign of heavenly help.[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]] The striking rock formation with its cave-like opening, in front of which Genoveva sits, is based on an oil study by Richter of the so-called [[place/nadelohr|Nadelöhr]] in the Rabenauer Grund south of Dresden (Kunsthalle, inv. 5474).[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]]

  ## Provenance

  Richter sold the painting in May 1841 to the Sächsischer Kunstverein, which intended it for its lottery; it may then have been in the collection of Leonhardi, a pupil of Richter (not documented), and it was given to the Kunsthalle by Friedrich Carl Theodor Heye, also a pupil of Richter, by 1913.[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]]

  ## The legend

  The museum traces the legend back to around 1400.[[source/hamburger-kunsthalle-hk-1236|Genoveva in der Waldeinsamkeit]] Genoveva of Brabant is, according to legend, the daughter of a duke of Brabant and wife of the count palatine Siegfried; that she existed as a historical person is unlikely, and the story was probably first written down at the abbey of Maria Laach in the early 14th century.[[source/wikipedia-de-genoveva-von-brabant|introduction; § Quellen, Autoren und Überlieferungen]] While Siegfried is at war, his steward Golo desires her; rejected, he accuses her of adultery and condemns her to death, but the executioner spares her, and she lives for six years with her newborn son in a cave in the forest, where the Virgin feeds them through a hind, until Siegfried finds her again.[[source/wikipedia-de-genoveva-von-brabant|§ Inhalt der Sage]] The legend became widely known in the 19th century through Christoph von Schmid's tale (1810), Ludwig Tieck's tragedy (1799), Friedrich Hebbel's play and Robert Schumann's opera; Richter also etched the subject in 1848.[[source/wikipedia-de-genoveva-von-brabant|§ Verbreitung und Rezeption; § Genoveva in der Dichtung; § Genoveva in der bildenden Kunst]]

  ## Waldeinsamkeit

  The word in the title, *Waldeinsamkeit* (solitude of the forest), describes an ascetic ideal of withdrawal into the woods known from medieval hermits; in German Romanticism it became a key term, linking the forest as an idyllic, timeless ideal with the solitude of the introverted Romantic poet.[[source/wikipedia-de-waldeinsamkeit|introduction; § Religion; § Literatur der Romantik]] It first appeared in the Romantic movement in 1796 in Ludwig Tieck's fairy tale *Der blonde Eckbert*, and Joseph von Eichendorff used it to glorify the forest as a timeless idyll set against transient human life.[[source/wikipedia-de-waldeinsamkeit|§ Literatur der Romantik]]

  ## In the lecture

  The lecture "Aus dem Wald" showed the painting among Romantic images of the forest, after two works by [[artist/caspar-david-friedrich|Caspar David Friedrich]] and before [[artwork/struth-paradise-19|Thomas Struth's photograph of the Bavarian Forest]], in its opening survey of modern attitudes to the forest.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 8]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 11]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 12]]
