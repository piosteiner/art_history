    label: log storehouse (azekura) probably built when the temple was founded (from 759); twice dismantled and repaired before, and raised about 1 m (found at the 1958 restoration); the temple is the owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/2480
        note: 宝蔵の建立は明らかでないが、奈良時代にこの寺が創立された頃であろう。沿革についても明らかでないが、昭和三十三年の解体修理にあたり、かつて二回の解体修理を受け、また一メートル程の地上げも行われていることが判明した。… 所有者名 ： 宗教法人唐招提寺 所有者種別 ： 寺院
        source: kunishitei-102-2480
        accessed: 2026-11-24
      - note: And in 759 the first steps towards the building of Toshodaiji were taken. … There are no clear records concerning the dates at which specific buildings were completed.
        source: history-of-japanese-art
        locator: p. 70
        accessed: 2026-11-24
      - url: https://toshodaiji.jp/about_houzoh.html
        note: 経蔵とともに並んで建つ校倉で、北側の蔵です。 唐招提寺創建にあわせて建立されたといわれ
