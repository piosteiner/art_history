    label: the royal collection confiscated by the State of Prussia after the annexation of Hanover and placed under the Fideikommiss-Galerie des Gesamthauses Braunschweig und Lüneburg; stayed at Hausmann's residence until May 1873
    sources:
      - url: https://www.nga.gov/collection/art-object-page.210038.html
        note: From 1866 until 1893, the royal collection was confiscated by the State of Prussia following the annexation of Hanover, and placed under the control of the Fideikommiss-Galerie des Gesamthauses Braunschwieg und Lüneburg. Despite the confiscation, from 1866 until Hausmann’s death in May 1873, the collection remained at his residence.
        source: nga-2017-55-1
        accessed: 2026-11-24
