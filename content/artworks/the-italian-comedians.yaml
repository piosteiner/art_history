  - owner: person/heinrich-thyssen-bornemisza
    acquired: July 1930 or earlier
    label: Schloss Rohoncz, Rechnitz, Hungary, and Amsterdam; in the Thyssen-Bornemisza exhibition that opened July 1930; Wildenstein has no record when between February and July 1930 it changed hands
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: Baron Heinrich Thyssen-Bornemisza [1875-1947], Schloss Rohoncz, Rechnitz, Hungary, and Amsterdam, by July 1930.[6] — [6] The painting was in an exhibition of the Thyssen-Bornemisza collection that opened in July 1930. However, Wildenstein has no record of exactly when between February and July 1930 ownership of the painting changed hands
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: institution/wildenstein-co
    role: dealer
    acquired: December 1936 or earlier
    place: new-york-city
    label: with their New York office by December 1936
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: (Wildenstein & Co., Inc., Paris, New York, and London), by December 1936; — [7] Wildenstein records provide the date by which the painting was with their New York office
        source: nga-1946-7-9
        accessed: 2026-11-24
