        note: Augustus Henry, 3rd duke of Grafton [1735-1811], Euston Hall and London.
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/thomas-baring
    acquired: 1851/1856
    place: london
    label: recorded by Waagen among the additions to the Baring collection since 1851
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: acquired between 1851 and 1856 by Thomas Baring [1799-1873];[3]
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/thomas-george-baring
    acquired: 1873
    method: inheritance
    direct: true
    place: london
    label: his nephew
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: by inheritance to his nephew, Thomas George Baring, 1st earl of Northbrook [1826-1904], London;
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/asher-wertheimer
    role: dealer
    direct: true
    place: london
    label: later references identify him as Asher rather than his brother Charles
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: (Asher Wertheimer, London); — [4] … "[W]e bought the picture from the famous dealer, Wertheimer, in 1888 …" Later references identify the Wertheimer as Asher, rather than his brother Charles, who was also an art dealer.
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: institution/thomas-agnew-sons-ltd
    role: dealer
    acquired: 1888-06
    method: purchase
    direct: true
    place: london
    label: stock book 1885–1891, p. 90 (NGA27/1/1/7)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: purchased June 1888 by (Thos. Agnew and Sons, Ltd., London); — The Watteau is recorded on page 90 of the stock book for 1885-1891 (reference number NGA27/1/1/7)
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/edward-guinness-1st-earl-of-iveagh
    acquired: 1888-06
    method: purchase
    direct: true
    label: Sir Edward Cecil Guinness, later 1st Earl of Iveagh; Dublin, London, Cowes and Elveden Hall, Suffolk
    sources:
