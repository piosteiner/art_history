  - owner: institution/wildenstein-co
    role: dealer
    acquired: 1930-02-18
    method: purchase
    direct: true
    label: Paris, New York and London; from Wildenstein records
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
