  - owner_label: Langford, auctioneer, London
    role: agent
    acquired: 1754-03
    method: auction
    direct: true
    place: london
    label: Mead estate sale, Langford, London, 20–22 March 1754, 3rd day, no. 43, paired with no. 42, A Pastoral Conversation
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: (his estate sale, Langford, London, 20-22 March 1754, 3rd day, no. 43, paired with no. 42, A Pastoral Conversation);
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner_label: Alderman William Beckford (1709–1770) or his brother Richard Beckford (d. 1756)
    direct: true
    place: london
    label: which brother bought it is unclear (Raines 1977); William was Richard's heir; London and Fonthill, Wiltshire
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: Alderman William Beckford [1709-1770], London and Fonthill, Wiltshire, or his brother, Richard Beckford [d. 1756], London.[1] — [1] See Robert Raines … for a discussion of which Beckford might have purchased the painting. William was his brother Richard's heir
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/james-colebrooke
    acquired: 1756-04
    method: purchase
    place: london
    label: "only if Richard Beckford owned it: possibly among the furnishings of his London house sold by his executors to Sir James Colebrooke"
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: If Richard owned the painting, it might possibly have been part of the "useful and ornamental furnishings" of his London house that were sold by his executors in April 1756 to Sir James Colebrooke, whose name is sometimes included in the provenance.
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/roger-harenc
    place: london
    label: sometimes spelled Harene; bought Watteau paintings at English sales in the 1740s and 1750s
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: Roger Harenc [d. 1763], London;[2] — [2] Sometimes spelled "Harene." … He is recorded as the buyer of Watteau paintings in sales in England in the 1740s and 1750s.
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner_label: Langford, auctioneer, London
    role: agent
    acquired: 1764-03
    method: auction
    direct: true
    place: london
    label: Harenc estate sale, Langford, London, 1–3 March 1764, 3rd day, no. 52, a pair with A Musical Conversation
    sources:
      - url: https://www.nga.gov/collection/art-object-page.32687.html
        note: (his estate sale, Langford, London, 1-3 March 1764, 3rd day, no. 52, a pair with A Musical Conversation [each day's lots begin with no. 1]);
        source: nga-1946-7-9
        accessed: 2026-11-24
