        note: sold the same month to Sir Edward Cecil Guinness [later 1st earl of Iveagh, 1847-1927], Dublin, London, Cowes, and Elveden Hall, Suffolk;[4]
        source: nga-1946-7-9
        accessed: 2026-11-24
  - owner: person/walter-guinness-1st-baron-moyne
    acquired: 1927
    method: inheritance
