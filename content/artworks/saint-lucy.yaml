        accessed: 2026-11-24
  - owner: person/pompeo-aldrovandi
    acquired: c. 1731
    ended_label: no longer there in 1782
    direct: true
    place: bologna
    label: Cardinal, successor of the Griffoni in the chapel; the altarpiece was taken to the Casa Aldrovandi, Bologna (his agent wrote of cutting it into small pictures); not in the 1782 inventory
    sources:
      - url: https://www.nga.gov/collection/art-object-page.369.html
        note: moved to the Casa Aldrovandi, Bologna, c. 1731, but no longer there in 1782.[2] — [2] … transportate in Casa Aldrovandi allorchè il Cardinal Pompeo Aldrovandi successore de' Griffoni fece ridurre questa Cappella … An inventory of the Casa Aldrovandi in 1782 … does not include any pictures that could come from the Griffoni altarpiece
        source: nga-1939-1-228
        accessed: 2026-11-24
  - owner: person/ugo-beni
    acquired: 1858 or earlier
    place: gubbio
    label: Count; seen there with its companion by Otto Mündler, 3 June 1858
    sources:
      - url: https://www.nga.gov/collection/art-object-page.369.html
        note: Count Ugo Beni, Gubbio, by 1858;[3] — [3] The presence of Saint Florian and the companion Saint Lucy (NGA 1939.1.228) in the Beni collection is noted in a diary entry of 3 June 1858 by Otto Mündler
        source: nga-1939-1-228
        accessed: 2026-11-24
  - owner: person/joseph-spiridon
    acquired: 1881/1882
    method: purchase
    direct: true
    place: paris
    label: "bought from Count Beni in Florence in 1881 (Spiridon sale catalogue) or at the Beni sale, Gubbio, April 1882 (Davies: lots 4 and 5; catalogue unlocated)"
    sources:
      - url: https://www.nga.gov/collection/art-object-page.369.html
        note: 'purchased 1881 or at (Beni sale, Gubbio, April 1882, no. 4, as Saint Martin by Zoppo) by Joseph Spiridon [1845-1930], Paris;[4] — [4] The catalogue of the 1929 Spiridon collection sale indicates that both NGA paintings were purchased from Count Beni in Florence in 1881. This contradicts the citation in Davies 1961: 152 n. 16, that refers to them as lots 4 and 5 in the "Conte U. Beni" sale of April/May 1882 in Gubbio.'
        source: nga-1939-1-228
        accessed: 2026-11-24
