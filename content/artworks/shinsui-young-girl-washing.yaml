description_md: "An early print by [[artist/ito-shinsui]] (1898–1972), recruited by Watanabe in 1916: a girl, nude to the waist, squats on a platform to reach the washing bucket, her neck — an erotic part for the Japanese — partly hidden; the strong curves of back and thigh balanced by the curve of her arms. [[source/history-of-japanese-art|pp. 384–385, fig. 459]]"
