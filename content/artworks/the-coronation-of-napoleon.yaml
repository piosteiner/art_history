        note: Commandé à l’artiste par l’empereur Napoléon Ier, en septembre 1804, sans prix fixé à l'avance et sans destination précise […] payé 65 000 francs par l’Intendance générale de la Maison de l’empereur, en trois versements
        source: louvre-collections
