        note: 建立年代は重源（一一二一～一二〇六）の在世中正治二年（一二〇〇）と考えられ、南無阿弥陀仏作善集に記す「僧正堂」がこれにあたる。当時は方一間の小堂であったが、その後建長二年（一二五〇）に移築し、外陣を付加して現状のような方三間の堂となったと考えられる。… 所有者名 ： 東大寺 所有者種別 ： 寺院
        source: kunishitei-102-2439
