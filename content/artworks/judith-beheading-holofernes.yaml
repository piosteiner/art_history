    label: painted for the grand duke, who died shortly after; Artemisia got the agreed payment only late, with Galileo's help; its violence kept it out of the Gallery — relegated to a dark corner of the Pitti
    sources:
      - url: https://www.uffizi.it/en/artworks/judith-beheading-holofernes
        note: the painting was denied the honor of being exhibited in the Gallery; in fact, it was only with great difficulty and the help of her friend Galileo Galilei that the painter managed to extract the payment, with a significant delay, that had been agreed with Grand Duke Cosimo II de’ Medici, who died in 1621 shortly after the great canvas was completed.
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Giuditta_che_decapita_Oloferne_%28Artemisia_Gentileschi_Firenze%29
        note: La versione fiorentina fu realizzata per Cosimo II de' Medici, ma per il suo crudo realismo fu disprezzata e relegata in un angolo buio di Palazzo Pitti
        source: wikipedia-it-giuditta-artemisia-uffizi
