title: Cycle of four altar pieces for the patron saints of Siena
names:
  - lang: de
    role: translation
    text: Zyklus von vier Altarbildern für die Stadtpatrone von Siena
attribution_label: Simone Martini, Ambrogio Lorenzetti, Pietro Lorenzetti and Bartolomeo Bulgarini (attributed)
created: 14th century
created_span: uncertain
kind: cycle
description_md: "Four altarpieces for the side altars of Siena Cathedral, each dedicated to one of the city's patron saints, commissioned between 1330 and 1350: the Annunciation by Simone Martini (altar of Saint Ansanus), the Presentation in the Temple by Ambrogio Lorenzetti (1342, Saint Crescentius), the Nativity of the Virgin by Pietro Lorenzetti (1342, Saint Sabinus) and a Nativity attributed to Bartolomeo Bulgarini (1351, Saint Victor), now disassembled[[source/wikipedia-en-annunciation-with-saint-margaret-and-saint-ansanus|“commissioned as part of a cycle of four altarpieces dedicated to the city's patron saints during 1330–1350”]]."
