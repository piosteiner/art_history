provenance:
  - owner: artist/en-i
    acquired: 1299
    method: creation
    label: scroll 7 of the twelve-scroll Ippen hijiri-e, compiled by Shōkai and painted by Hōgen En'i; colophon of scroll 12 dated 23rd day, 8th month, Shōan 1 (1299)
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=&content_base_id=100156&content_part_id=0&content_pict_id=0
        note: 正安元年（1299）8月23日に記された巻第十二の奥書（おくがき）によれば、この絵巻は一遍の実弟とみられる聖戒（しょうかい）が撰述し、法眼円伊が絵を担ったという。
        source: emuseum-100156-ja
        accessed: 2026-11-24
      - note: The Ippen Hijiri-e (Pictures of the Holy Man Ippen), an illustrated set of twelve scrolls depicting Ippen's life and travels … The text was composed in 1299 by Ippen's younger brother Shokai, himself a monk and an adherent of the Ji sect, and was illustrated by an artist named Eni
        source: history-of-japanese-art
        locator: pp. 203–204
        accessed: 2026-11-24
  - owner: institution/kankiko-ji
    ended_label: late Edo period
    place: kyoto
    label: the set at Kankikō-ji, Kyoto; repaired in 1755 by the temple's 30th abbot (colophon); scroll 7 separated from the set in the late Edo period (the rest now at Shōjōkō-ji)
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=&content_base_id=100156&content_part_id=0&content_pict_id=0
        note: 京都・歓喜光寺（かんきこうじ）へと遡るという。 … 〔奥書〕此壱巻 寶暦五秊｛乙／亥｝八月廿三日及破損間修補之 當寺三十世彌阿輪山
        source: emuseum-100156-ja
        accessed: 2026-11-24
      - url: https://emuseum.nich.go.jp/detail?langId=en&webView=&content_base_id=100156&content_part_id=0&content_pict_id=0
        note: In the latter part of the Edo period (1615-1868), the original twelve handscrolls of this set in Kankikô-ji Temple in Kyoto were separated.
        source: emuseum-100156-en
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?oldid=111877863
        note: 元の第7巻は江戸時代後期に歓喜光寺から流出し、原富太郎（原三溪）らの所蔵を経て、第2次大戦後、現在東京国立博物館が所蔵する。
        source: jawiki-111877863
        accessed: 2026-11-24
  - owner: person/asano-nagayoshi
    place: kyoto
    label: Asano Baidō, town magistrate of Kyoto; this and the next two owners from Hara Sankei's notes
    sources:
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=&content_base_id=100156&content_part_id=0&content_pict_id=0
        note: その手記によれば、三溪の前は三崎亀之助（みさきかめのすけ）（1858～1906）、税所（さいしょ）子爵（篤（あつし）か）、京都町奉行浅野梅堂（あさのばいどう）（長祚（ながよし）、1816～80）、京都・歓喜光寺（かんきこうじ）へと遡るという。
        source: emuseum-100156-ja
        accessed: 2026-11-24
