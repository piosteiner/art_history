description_md: |-
  A small opening statue of the Virgin from the Rhineland, made around 1300 and one of the two most striking examples of the [[term/shrine-madonna|Shrine Madonna]] (Vierge ouvrante) in Elina Gertsman's study of the type.[[source/gertsman-2015-worlds-within|p. 70]] It came from a convent in Cologne[[source/gertsman-2015-worlds-within|p. 70]] and is now in the Metropolitan Museum of Art, New York, as a gift of J. Pierpont Morgan in 1917.[[source/metropolitan-museum-collection|object 464142]]

  ## Material

  The statue is carved in oak and painted over a chalk ground; it is 36.8 cm high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 85]] The museum lists oak, a linen covering, polychromy, gilding and gesso; opened, it measures 36.8 × 34.6 × 13 cm.[[source/metropolitan-museum-collection|object 464142]]

  ## Exterior

  Closed, the sculpture shows the crowned [[person/mary|Virgin]] as Maria lactans: the Christ Child sits on her left knee, holds the dove of the Holy Spirit and nurses avidly.[[source/gertsman-2015-worlds-within|p. 70]] The lecture introduced it as a "Madonna lactans mit Kind" before showing it opened.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 85–90]] Gertsman notes how the body is displaced in the manner of the monstrous: the breast sits up at the collarbone, and the womb that opens below is enlarged until it takes up the whole body.[[source/gertsman-2015-worlds-within|p. 82]] In the Rhenish Madonnas the bare breast of the exterior gives way, once the figure is opened, to a large, vertical, birth-giving wound which the viewer was meant to see as akin to Christ's side wound.[[source/gertsman-2015-worlds-within|p. 87]]

  ## Interior

  The statue opens along a cut that runs vertically through the Virgin's body from neck to feet and reveals a sculpted Trinity – the Throne of Mercy – set in the hollow of her body; the two wings formed by the opened halves carry six painted scenes, three on each side.[[source/gertsman-2015-worlds-within|p. 70]] The figure of Christ and the dove are lost; a cruciform halo was later added around the head of God the Father to turn him into Christ.[[source/gertsman-2015-worlds-within|p. 199]]

  All six paintings tell of Christ's [[person/jesus-christ|infancy]].[[source/gertsman-2015-worlds-within|p. 70]] At the top, on the back of Mary's chest, are the Annunciation – Gabriel stepping towards Mary, an empty speech scroll dividing them – and the Visitation, Elizabeth embracing Mary; both scenes are narrow and austere.[[source/gertsman-2015-worlds-within|p. 70]] Below, the [[event/nativity-of-jesus|Nativity]] faces the Presentation in the Temple: Mary lies stretched across a bed, Joseph keeps guard at her feet and the ox and donkey press against each other above the Child in the manger, while opposite Christ is passed to Simeon above an altar table that repeats the shape of the manger.[[source/gertsman-2015-worlds-within|p. 70]] The Nativity shows the birth after the fact – the Virgin on her bed, the infant neatly swaddled – as almost all medieval Nativities do.[[source/gertsman-2015-worlds-within|p. 62]] In the lowest register the three shepherds of the Annunciation to the Shepherds answer the three Magi of the Adoration; the shepherds raise their hands towards the angel and the middle king points upwards, so that the gestures lead the eye up and down each side.[[source/gertsman-2015-worlds-within|pp. 70–71]] The gestures invite the viewer to read each side vertically: the left chronicles Christ's becoming man, from his conception through the infant in the manger to the child-God blessing from his mother's lap; the right shows him in the womb at the Visitation, as an implied sacrifice passed over the altar, and finally through the shepherds' lambs.[[source/gertsman-2015-worlds-within|p. 71]]

  ## Interpretation

  Gertsman reads the layout – three small cells on each side of a large central compartment – as a recollection of late medieval descriptions and diagrams of the womb, which was thought to have seven cells.[[source/gertsman-2015-worlds-within|p. 72]] Although the scenes concern the Infancy, they are paired across the Throne of Mercy around the idea of sacrifice: the upper pair links Mary's womb with the oven in which the bread is baked, the Nativity and the Presentation are joined by the theme of offering, and one shepherd points emphatically at the animal at his feet, marking Christ as the sacrificial lamb.[[source/gertsman-2015-worlds-within|p. 76]] The Nativity resembles the one on the inner lid of the Swinburne Pyx in the Victoria and Albert Museum (ca. 1310–20), an object made for the Eucharist.[[source/gertsman-2015-worlds-within|p. 76]] The statue thus shows three births at once: the Virgin and Child outside stand for Christ's birth in time, the Throne of Mercy inside for his birth in eternity, and the opening statue as a whole for his daily birth in the hearts of the faithful.[[source/gertsman-2015-worlds-within|p. 100]]

  ## Use

  Given its small size, the statue was probably made for the private devotion of a nun; documents of the fifteenth-century Observant reform show that nuns in German lands kept devotional objects for their own use.[[source/gertsman-2015-worlds-within|p. 95]] The much larger Vierge ouvrante of Morlaix (114 cm), by contrast, was given to its town church by a confraternity of weavers for public veneration.[[source/gertsman-2015-worlds-within|p. 95]]
