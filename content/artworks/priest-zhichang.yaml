        note: 因陀羅、楚石梵琦題 禅機図断簡 智常禅師図 元時代（14世紀） 紙本墨画 中国の禅僧・楚石梵琦（1296～1370）の題詩によれば、老僧は唐時代の廬山帰宗寺の智常禅師。
        source: seikado-national-treasures
        accessed: 2026-11-24
      - url: https://web.archive.org/web/20211202025948/https://www.artizon.museum/collection/category/detail/199
        note: 《寒山拾得図》（東京国立博物館）、《布袋図》（根津美術館）、《智常禅師図》（静嘉堂文庫美術館）、《智常李渤図》（畠山記念館）とあわせ、もとはひとつの巻物として伝来したと考えられます。いずれも絵は因陀羅、賛は楚石梵琦。
        source: artizon-danxia-burning-buddhist-statues
