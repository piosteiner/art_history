provenance:
  - owner: person/louis-xvi-of-france
    acquired: 1781/1782
    method: commission
    label: commissioned through the comte d'Angiviller, Director of the King's Buildings; painted in Rome, finished July 1785; Salon of 1785, no. 103 (“est pour le Roi”)
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010062239
        note: Commandé à l'artiste par le roi Louis XVI, par l’intermédiaire du comte d’Angiviller (1730-1809), directeur des Bâtiments du roi, à la fin de l’année 1781 ou au début de l’année 1782 […] peint à Rome probablement durant le premier semestre de l'année 1785 et achevé en juillet 1785
        source: louvre-collections
        accessed: 2026-10-20
    records:
      - kind: exhibition
        date: 1785-09
        note: « Ce tableau de 13 pieds de long, sur 10 de haut, est pour le Roi »
        place: paris
        number: "103"
        document: Salon de 1785
  - owner: artist/jacques-louis-david
    role: custodian
    acquired: 1785-09
    ended: 1804-01
    place: paris
    label: taken back by the artist after the Salon (to paint the Toledo replica) and kept in his studio at the Louvre; claimed by the Muséum in 1797, 1801, 1802
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010062239
        note: repris par l’artiste à l’issue de l'exposition pour en faire une répétition (Toledo Museum of Art) ; présenté dans l'atelier personnel de l'artiste au palais du Louvre (pavillon nord-est de la Cour carrée) de l'automne 1785 jusqu’en août 1791
        source: louvre-collections
        accessed: 2026-10-20
  - owner_label: Sénat conservateur
    role: custodian
    acquired: 1804-01-29
    ended: 1826-01-07
    place: paris
    label: at the Senate's gallery in the Luxembourg palace, from 1818 the Musée royal du Luxembourg
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010062239
        note: présenté (ensemble avec "Brutus") au palais du Luxembourg, Paris à partir du 29 janvier 1804, puis inclus au musée royal du Luxembourg inauguré le 24 avril 1818 ; déplacé au palais du Louvre le 7 janvier 1826
        source: louvre-collections
        accessed: 2026-10-20
