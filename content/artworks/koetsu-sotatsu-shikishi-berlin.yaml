description_md: One of thirty-six [[shikishi]] in which [[artist/honami-koetsu]] wrote poems from the imperial anthology Shin kokinshū (1206) over paintings chiefly by [[artist/tawara-sotatsu]]. The poem by [[person/kamo-no-chomei]] (1155?–1216) — “The autumn wind blows on all sleeves; why then is mine alone so wet with tears upon this evening?” — fills the page in vigorous, sensuous writing over a close-up of a rice paddy in green, gold and silver, the plants heavy with grain like a sleeve wet with tears (Miyeko Murase). [[source/history-of-japanese-art|pp. 267–268, fig. 308]]
