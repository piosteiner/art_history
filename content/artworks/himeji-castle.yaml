description_md: "Popularly the White Heron Castle, the most beautiful surviving Japanese castle. [[person/toyotomi-hideyoshi]] built a three-storied keep on the site in 1581; after Sekigahara it passed to [[person/ikeda-terumasa]] (1564–1613), son-in-law of [[person/tokugawa-ieyasu]], charged with watching the Toyotomi at Osaka, and between 1601 and 1609 it was rebuilt in its present form. Maze-like enclosures surround the [[honmaru]]: three three-storied keeps linked by towers and the five-storied [[tenshu]], whose sequence of curved and pointed gables gives a light, ascending rhythm. [[source/history-of-japanese-art|pp. 240–241, fig. 273]]"
