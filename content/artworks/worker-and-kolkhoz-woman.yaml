description_md: |-
  *Worker and Kolkhoz Woman* is a stainless-steel group of two figures raising a hammer and a sickle, 24.5 metres high, made by [[artist/vera-mukhina|Vera Mukhina]] for the 1937 World's Fair in Paris; the concept and composition were [[artist/boris-iofan|Boris Iofan]]'s [[source/wikipedia-en-worker-and-kolkhoz-woman|introduction]]. The worker's hammer and the kolkhoz woman's sickle together form the hammer and sickle [[source/wikipedia-en-worker-and-kolkhoz-woman|introduction]].

  ## Paris 1937

  The group crowned the Soviet pavilion at the [[event/paris-international-exposition-1937]], where the organisers had placed the Soviet and the German pavilions facing each other across the main boulevard [[source/wikipedia-en-worker-and-kolkhoz-woman|§ History]]. Both meant to show their superiority and showed the same [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 13]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. The painter Gino Severini wrote of "the obvious intention of making size, of making immense pompous size. The same gloomy rhetoric was also to be found in the German Pavilion which stood exactly opposite the Russian" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 13]]. Besides heroes, symbols were to be celebrated, like this statue set against the German pavilion [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].

  Mukhina drew on the classical *Tyrannicides* (Harmodius and Aristogeiton), the *Winged Victory of Samothrace* and François Rude's *Marseillaise* [[source/wikipedia-en-worker-and-kolkhoz-woman|§ History]]. Stainless steel was chosen over bronze and copper because it reflected light better: the group was to shine brighter than the eagle on the German pavilion and the Eiffel Tower [[source/wikipedia-en-worker-and-kolkhoz-woman|§ Manufacturing and installation]]. Its shell of 0.5 mm steel sheets, joined by spot welding, hung on a frame of 63 tons; the work took three and a half months, and Stalin inspected the finished group before it was taken apart for Paris [[source/wikipedia-en-worker-and-kolkhoz-woman|§ Manufacturing and installation]]. A long fluttering scarf made both massive figures seem to fly; the French press called the group "the greatest work of sculpture of the 20th century" [[source/wikipedia-en-vera-mukhina|§ In Moscow]].

  ## The New Man in steel

  Mukhina's realism only imitates the movement of [[artwork/lissitzky-new-man]] and blocks it with classical, forceful bodies [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]]. In Michaud's words, "While El Lissitzky's New Man remains an entirely ideal construction reaching toward an indeterminate future, Vera Moukhina's realist sculpture only imitates the movement El Lissitzky's work and blocks its momentum with classical, forceful bodies" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 65]].

  ## In Moscow

  After the fair the group was moved to Moscow and placed outside the All-Union Agricultural Exhibition [[source/wikipedia-en-worker-and-kolkhoz-woman|§ History]]. There it stood on a low pedestal with its back to the sun, and Mukhina complained that "the monument creeps on the ground" [[source/wikipedia-en-vera-mukhina|§ In Moscow]]. It earned her a Stalin Prize in 1941 [[source/wikipedia-en-worker-and-kolkhoz-woman|§ History]]. In 1947 it became the logo of the Mosfilm studio [[source/wikipedia-en-worker-and-kolkhoz-woman|§ In culture]]. Taken down for restoration in 2003, it returned on 4 December 2009 on a new pavilion that raised its total height from 34.5 to 60 metres [[source/wikipedia-en-worker-and-kolkhoz-woman|§ History]].

  ## Afterlife

  A Russian stamp of 2000 put it beside Tatlin's [[artwork/monument-to-the-third-international]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 30]]. The opening ceremony of the 2014 Winter Olympics in Sochi showed it, with the Stalinist high-rises, in Russia's grand historical narrative [[source/kalashnikov-2023|p. 137]]. Kalashnikov notes how little context it is given: the massive pedestal held a small display on the story of the sculpture from 2010 to 2017 and is now an open exhibition space, while Mukhina's former workshop houses a museum of Orthodox icons [[source/kalashnikov-2023|p. 142]].
