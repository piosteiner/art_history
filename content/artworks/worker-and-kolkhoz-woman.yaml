description_md: "At the [[event/paris-international-exposition-1937]], where the German and the Soviet pavilions stood face to face: both meant to show their superiority and showed the same [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 13; class notes, 24 September 2024]]. Mukhina's realism only imitates the movement of [[artwork/lissitzky-new-man]] and blocks it with classical, forceful bodies [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]]."
