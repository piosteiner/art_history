description_md: "The only surviving part of Inuyama Castle on the Kiso River north of Nagoya: a four-storied [[tenshu]] on a tall, tapering stone base of dry-stone walls (rough stone, crushed rock, gravel and sand behind, so that rain drains away and earthquakes do not crack it). Once dated 1469, it is now thought no earlier than the late sixteenth century, though its two lowest storeys resemble early sixteenth-century structures; the curved Chinese gables were added in 1620. Of the great castles of the age — [[person/oda-nobunaga]]’s Azuchi, Momoyama, Osaka — none survives; most surviving castles were built between 1600 and 1615, before the shogunate limited each daimyo to one castle and banned new ones. [[source/history-of-japanese-art|pp. 239–240, fig. 272]]"
