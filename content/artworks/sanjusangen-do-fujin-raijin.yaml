public_id: 107545
title: Fūjin and Raijin, Sanjūsangendō
attribution_label: Anonymous
created: 13th century
created_span: uncertain
kind: sculpture
medium: Wood with lacquer, gold leaf and paint, inlaid eyes
materials: [hinoki wood, lacquer, gold leaf, rock crystal]
dimensions: [111.5]
dimensions_note: Fūjin, from the base of the right knee; Raijin 100 cm
institution: sanjusangen-do
description_md: "The gods of Wind and Thunder at the two ends of the platform before the thousand Kannon, with twenty-eight attendants probably made by Tankei’s studio in the 1250s. Both climb out of swirling thunderclouds with wide-open eyes looking down on the world: Fūjin holds the ends of his bag of wind, Raijin is ringed by drums he beats with dumbbell-shaped sticks. An unnamed Kei sculptor has given a dramatic, human form to the force and sound of a storm. [[source/history-of-japanese-art|p. 195, fig. 227]]"
