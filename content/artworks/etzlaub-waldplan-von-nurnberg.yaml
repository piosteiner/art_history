description_md: |-
  A map of Nuremberg and its two great forests, the Lorenzer Wald (above) and the Sebalder Wald (below), painted on parchment, 61.5 × 71.5 cm, in the [[institution/germanisches-nationalmuseum|Germanisches Nationalmuseum]] in Nuremberg; the lecture "Aus dem Wald" gives it to [[artist/erhard-etzlaub|Erhard Etzlaub]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 29]] Michael Baxandall dates it 1516 and calls it a painting on parchment "after Erhard Etzlaub".[[source/baxandall-1980-limewood-sculptors|p. 30]] The German Wikipedia lists the forest plan *Nürnberg im Reichswald* (parchment, 69 × 59 cm, 1516) as, with some probability, Etzlaub's design, because of its similarity to his map of Nuremberg's territory of 1519, painted on parchment by Michel Graf.[[source/wikipedia-de-erhard-etzlaub|§ Weitere Karten]]

  ## The Reichswald

  The forests around Nuremberg belonged in the Middle Ages to the imperial domain, the crown land of the German kings near their castle in Nuremberg, and were administered by the imperial city; following the division of the old town by the Pegnitz into the parishes of St Lorenz and St Sebald, the forest is divided into the Lorenzer Reichswald south and the Sebalder Reichswald north of the river.[[source/wikipedia-de-nurnberger-reichswald|§ Beschreibung]] It is regarded as the oldest planted forest in the world: overused for wood and litter already in the 14th century, it was sown with pine on a large scale by Peter Stromer in 1368, the first planned sowing of this kind in Europe, and the Lorenzer forest was protected by a ban in 1385, the Sebalder in 1465.[[source/wikipedia-de-nurnberger-reichswald|introduction; § Waldgeschichte]] In the Middle Ages beekeeping was very important there; the beekeepers (*Zeidler*) had special rights from 1296, and the forest was called the bee garden of the Holy Roman Empire (*des Heiligen Römischen Reiches Bienengarten*).[[source/wikipedia-de-nurnberger-reichswald|§ Wirtschaftliche Nutzung]]

  ## The forests and the sculptors

  Baxandall uses the map to show that good carving limewood was relatively expensive and sought after even in southern Germany.[[source/baxandall-1980-limewood-sculptors|p. 28]] In 1516 the city of Nuremberg recodified the rules for selling wood from its two large forests of St Sebald and St Lorenz: charges were reckoned from a basic fee, sliding scales for size and quality, and a surcharge for a few specially valuable kinds if cut without a special permit.[[source/baxandall-1980-limewood-sculptors|p. 28]] The surcharge was 3 Pfund for beech, 5 for oak and 10 for limewood and sallow.[[source/baxandall-1980-limewood-sculptors|p. 29]] In a tightly run town like Nuremberg the supply of wood was one more control over the craftsmen: a council minute of 30 May 1506, from a time when [[artist/veit-stoss|Veit Stoss]] was in dispute with the council, grants him a limetree from the forest "according to forest regulations" for two figures under the Cross in the Liebfrauenkirche on the market, and in the same breath refuses his request to travel beyond his garden outside the walls without special permission.[[source/baxandall-1980-limewood-sculptors|p. 29]] From this tree the confined Stoss carved the grieving Mary and John now in St Sebald's.[[source/baxandall-1980-limewood-sculptors|p. 30]]

  In the lecture the map followed Baxandall's argument that a preliminary condition for limewood sculpture in the south was the availability of limewood: the southern carver had the "good tame limewood" of the broad-leaved lime, the northern carver cheap East Baltic timber, oak but not lime, imported by the Hansa.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 28]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 29]] In the second session it was shown between two views of [[artwork/durer-adam-und-eva-1504|Dürer's *Adam and Eve*]] of 1504.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 60]] The forest historian Hansjörg Küster notes that the threatening decline of the wood available in the forests was recognised in Central Europe already at the end of the Middle Ages, when pine seed was sown for the first time.[[source/fansa-vorlauf-2007-holz-kultur|p. 32]]
