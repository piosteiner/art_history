description_md: "One of a group of six bodhisattvas at Hōryūji, made in the single-block technique ([[ichiboku-zukuri]]) of camphor wood and covered with lacquer and gold leaf — the jewellery, hair and ornaments modelled in lacquer: the first known use of lacquer in Japanese sculpture other than as a coating. [[source/history-of-japanese-art|p. 80, fig. 98]]"
