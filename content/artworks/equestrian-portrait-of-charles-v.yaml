description_md: "Titian painted the Emperor Charles V in Augsburg in 1548[[source/prado-carlos-v-en-la-batalla-de-muhlberg|„mientras Tiziano pintaba el retrato en Augsburgo, Carlos auspiciaba en la ciudad la celebración del Interim, concluido el 12 de marzo de 1548“]], on horseback in the armour he wore at his victory over the Protestant princes at Mühlberg the year before[[source/prado-carlos-v-en-la-batalla-de-muhlberg|„El retrato conmemora la victoria de Carlos V sobre la Liga de Smalkalda en Mühlberg el 24 de abril de 1547.“ · on the armour: „algunos de sus elementos fueron utilizados en la batalla de Mühlberg“]]. Italian painting had nothing like it; it found no followers at once — the equestrian portrait took its place at court only with Rubens in the early 17th century[[source/prado-carlos-v-en-la-batalla-de-muhlberg|„carece de precedentes en la pintura italiana“ · „Pese a su carácter seminal, esta obra verdaderamente excepcional no tuvo consecuencias inmediatas, y el retrato ecuestre debió aguardar a las décadas iniciales del siglo XVII para, de la mano de Rubens, ocupar un lugar de honor en el arte cortesano“]]."
