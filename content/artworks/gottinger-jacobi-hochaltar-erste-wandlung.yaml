description_md: |-
  The first opening – the "Sunday side" – of the high altarpiece of St. Jacobi in Göttingen (1402): painted scenes from the childhood and the Passion of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 29]][[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]] Wikipedia counts sixteen scenes.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]]

  The Sunday side lies between the everyday view with the legend of Saint James and the fully opened feast-day side with the Coronation of the Virgin.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 28–30]]
