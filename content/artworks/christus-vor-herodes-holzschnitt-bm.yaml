description_md: |-
  This early woodcut of Christ before Herod was made, probably in Franconia, about 1420/30; it is printed on paper and measures 39.5 × 28.5 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 16]]. It is in the [[institution/british-museum|British Museum]] (inv. 1972,U.1047) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 16]].

  The lecture showed it among the earliest single-leaf woodcuts, which appear in western Europe from about 1400 and served mainly private prayer [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 16–18]]. Its size makes it one of the larger sheets of the group [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 14–16]]. Unlike most of the other early prints shown, the caption does not describe it as coloured [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 16]].
