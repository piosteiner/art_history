description_md: |-
  The sixth field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the earthly life of Adam and Eve after the expulsion: Adam labouring and Eve with her sons.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 38]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] Its composition, like that of the creation of Adam, is almost identical with the corresponding page of the Carolingian Moutier-Grandval Bible from Tours (around 840).[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]]

  Opposite it on the right leaf is the Adoration of the Magi; the lecture listed the two fields as a typological pair, Eve with her sons set against Mary with the Christ Child.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] Plants form the setting here, as on the rest of the left leaf, while the right leaf favours architecture.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]]
