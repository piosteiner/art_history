description_md: One of six panels painted by [[artist/kano-motonobu]] (1476–1559) about 1513 for the guest hall of [[institution/daisen-in]], first as wall and door paintings, now hanging scrolls — Zen patriarchs in strongly drawn Chinese-style landscapes. Kyōgen (d. 898), unable to answer his master’s question about his life before birth, burned his books; years later, sweeping his garden, he heard a tile strike a bamboo and was enlightened. Motonobu, son of the official painter Kanō Masanobu, made the [[movement/kano-school]] the painters of the shogunate. [[source/history-of-japanese-art|pp. 229–230, fig. 265]]
