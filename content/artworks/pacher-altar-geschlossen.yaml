description_md: |-
  The closed state – the weekday side – of [[artist/michael-pacher|Michael Pacher]]'s high altarpiece at St. Wolfgang im Salzkammergut (1471–81): four painted scenes from the legend of Saint Wolfgang, patron of the church.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 69]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Werktagsseite, Schauseite mit geschlossenen Flügeln]] The wings are of spruce.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]]

  When the altarpiece is closed the shrine guardians become visible: Saint George on the left and Saint Florian on the right, both in armour with long lances that rise above the shrine, and above them Saint Catherine and Saint Margaret.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Werktagsseite, Schauseite mit geschlossenen Flügeln]] The closed predella shows the four Latin Church Fathers, very close to those of Pacher's Church Fathers altarpiece for Neustift, now in Munich.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Werktagsseite, Schauseite mit geschlossenen Flügeln]] Some scholars attribute these outer paintings to Pacher's brother Friedrich.[[source/wikipedia-en-michael-pacher|§ St. Wolfgang Altarpiece]]
