        note: la pala giunse a Brera dalla chiesa di San Bernardino a Urbino, edificata da Federico da Montefeltro per ospitare la propria sepoltura. È possibile, ma non certo, che il dipinto fosse originariamente destinato a questa sede e alla tomba del duca.
