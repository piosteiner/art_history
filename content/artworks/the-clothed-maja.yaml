description_md: The clothed companion of Goya’s nude Maja, painted a few years after it, in the same pose[[source/prado-la-maja-vestida|dated 1800–1807]][[source/prado-la-maja-desnuda|dated 1795–1800]]. Both belonged to Manuel Godoy[[source/prado-la-maja-vestida|„Se menciona por primera vez a fines de enero de 1808, junto a La maja desnuda, en el inventario de los bienes de Manuel Godoy realizado por Frédéric Quilliet“]], were sequestered after his fall[[source/prado-la-maja-vestida|„En el inventario de los bienes incautados a Godoy efectuado en 1813 …“]] and came to the Prado from the Academy of San Fernando in 1901[[source/prado-la-maja-vestida|„Trasladada a la Real Academia de Bellas Artes de San Fernando el 13 de abril de 1836.“ · „Ingresó en el Museo del Prado en 1901“]].
