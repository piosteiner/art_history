description_md: |-
  The Tree of Jesse window in the west façade of [[institution/chartres-cathedral|Chartres Cathedral]], made about 1150.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 54]] It is the right-hand one of the three windows above the Royal Portal and beneath the western rose, and Wikipedia dates it 1140–1150.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]]

  ## Description

  The window has eight square central panels with seven rectangular ones on either side, separated by heavy iron armatures, as is usual in 12th-century windows without stone tracery.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]] In the lowest central panel lies Jesse, the tree rising from his middle; in each of the seven panels above it branches out into regular scrolls, each bearing leaves in the heraldic form of the fleur-de-lis.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]] In the centre of each panel is a figure — David, Solomon, two more crowned kings, Mary and, surrounded by the doves of the gifts of the Spirit, a majestic Christ, larger than the rest — while the narrow side panels hold fourteen prophets with scrolls.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]] It derives from the oldest known complex Tree of Jesse, the window that Abbot Suger placed in Saint-Denis around 1140, now heavily restored; Saint-Denis and Chartres became the model for many later Jesse windows, among them those of Canterbury Cathedral (about 1200) and St. Kunibert in Cologne (1220–1235).[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]] The subject suits a tall, narrow window as a single unified composition, where most other tall windows were divided into separate scenes.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]]

  ## Text and image

  The image rests on Isaiah 11:1–3a: "Et egredietur virga de radice Iesse et flos de radice eius ascendet" — a shoot shall come forth from the root of Jesse and a flower shall rise from his root, and the spirit of the Lord shall rest upon him, the spirit of wisdom and understanding, of counsel and strength, of knowledge and piety and of the fear of the Lord.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 51]] Medieval readers took the *virga*, a near-pun on *virgo*, for Mary and the flower for Christ.[[source/wikipedia-en-tree-of-jesse|§ Origins; § Use]] The doves around Christ bear the gifts of the Spirit, which the passage from Isaiah enumerates.[[source/wikipedia-en-tree-of-jesse|§ Jesse Tree at Chartres Cathedral]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 51]]

  The lecture "Aus dem Wald" showed the window after two manuscript versions of the subject, in the Bible of Saint-Bénigne in Dijon (about 1125/35) and the Lambeth Bible (about 1150), as background to the oak predella with the Root of Jesse in [[artwork/douwerman-sieben-schmerzen-altar-predella|Henrick Douwerman's altarpiece at Kalkar]], 1518–1521.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 52]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 53]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 55]]
