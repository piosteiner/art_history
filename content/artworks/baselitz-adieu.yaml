description_md: |-
  [[source/tate-t03672]] With [[artwork/chia-water-bearer]] the opening of the seminar: Golomstock's question whether the figurative painting of the 1980s takes up the realism of the totalitarian regimes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 10–11]] [[source/golomstock-1990]].

  ## Context

  [[artist/georg-baselitz|Georg Baselitz]] painted *Adieu* in 1982, in the years when he kept a studio at Castiglion Fiorentino near Arezzo, had his first exhibitions in New York and turned increasingly to sculpture [[source/wikipedia-en-georg-baselitz|§ 1981–1989]]. By then he had been painting his subjects upside down for over a decade, a practice begun in 1969 to stress colour, form and the surface of the picture rather than its content [[source/wikipedia-en-georg-baselitz|§ Inverted paintings]]. His many influences included Socialist Realism [[source/wikipedia-en-georg-baselitz|introduction]].

  ## In the seminar

  The seminar "Art and Totalitarianism" placed the painting at the start of its first session, right after introducing Igor Golomstock's *Totalitarian Art* (1990), the first comparative study of the art of the Soviet Union, the Third Reich, Fascist Italy and the People's Republic of China [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 10–11]]. For Golomstock, totalitarian art "was not so much an artistic genre, but a cultural phenomenon with its own aesthetics and ideology, arising from the use of art as a propaganda tool of the totalitarian state", and he distinguished art under totalitarian regimes from totalitarian art proper [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 10]]. The next slide showed the exhibition "1930s. Art and Culture in Italy" at the Palazzo Reale in Milan, also of 1982 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 12]].
