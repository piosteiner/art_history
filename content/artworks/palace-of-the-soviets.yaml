description_md: |-
  The Palace of the Soviets was a project for a political convention centre in Moscow on the site of the demolished Cathedral of Christ the Saviour; its grand hall was to house the sessions of the Supreme Soviet [[source/wikipedia-en-palace-of-the-soviets|introduction]]. At 416 metres it would have become the tallest structure in the world [[source/wikipedia-en-palace-of-the-soviets|introduction]]. In the seminar [[artist/boris-iofan|Boris Iofan]]'s project, in the version of 1937, stood beside [[artwork/monument-to-the-third-international]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 29]].

  ## A monument to the epoch

  When the Stalinist regime announced the construction of the palace in 1931, it went beyond commemorating a leader and called for commemorating the entire epoch [[source/kalashnikov-2023|p. 21]]. Only "synthetic" monuments, fusing grand architecture with commemorative sculpture and art, were thought able to leave the Stalin era's mark on history [[source/kalashnikov-2023|p. 21]]. Anatolii Lunacharskii's call that the palace be built to last was taken up by art professionals and applied generally [[source/kalashnikov-2023|p. 22]]. The design competitions were held in 1932, while a famine claimed millions of lives [[source/kalashnikov-2023|p. 23]].

  ## Competitions and design

  In February 1931 the government set up a project management structure in which Iofan became chief architect [[source/wikipedia-en-palace-of-the-soviets|§ The architect]]. His victory in four competitions held between 1931 and 1933 marked a sharp turn in Soviet architecture from radical modernism to the monumental historicism of Stalinist architecture [[source/wikipedia-en-palace-of-the-soviets|introduction]]. Archival research of the 2010s supported the old suspicion that the competitions were arranged in Iofan's favour [[source/wikipedia-en-palace-of-the-soviets|§ The architect]]. Stalin privately judged that "Iofan's plan is unconditionally the best", and on 10 May 1933 the Politburo decided for Iofan and told him to crown the palace with a giant statue of Lenin [[source/wikipedia-en-palace-of-the-soviets|§ Third and fourth rounds (March 1932 – February 1933)]]. Iofan named the Pergamon Altar and the Victor Emmanuel II Monument in Rome as his main models [[source/wikipedia-en-palace-of-the-soviets|§ Third and fourth rounds (March 1932 – February 1933)]]. In June 1933 the Politburo made Vladimir Shchuko and Vladimir Helfreich his co-authors [[source/wikipedia-en-palace-of-the-soviets|§ Forced collaboration]].

  The definitive design took its final shape in 1937: a staggered stack of ribbed cylinders crowned with a 100-metre statue of Lenin, blending Art Deco and Neoclassical forms with American skyscraper technology [[source/wikipedia-en-palace-of-the-soviets|introduction]]. The statue, designed by Sergey Merkurov, was publicly criticised by artists such as [[artist/boris-korolev|Boris Korolev]] [[source/wikipedia-en-palace-of-the-soviets|§ Forced collaboration]]. Iofan's design received a gold medal at the [[event/paris-international-exposition-1937|1937 exhibition in Paris]] [[source/wikipedia-en-boris-iofan|§ Palace of Soviets]].

  ## Construction and abandonment

  Work on the site began in 1933 [[source/wikipedia-en-palace-of-the-soviets|introduction]]. Marble from the dynamited cathedral was used for the Dvorets Sovetov metro station [[source/kalashnikov-2023|p. 140]]. Around 1939 the outline of the palace was so omnipresent in Soviet media — on postcards, stationery and candy wrappers — that it became more familiar than any existing building [[source/wikipedia-en-palace-of-the-soviets|§ Construction and demolition (1933–1942)]]. The German invasion of June 1941 ended the project, and the steel already erected was taken down in 1942 for fortifications and bridges [[source/wikipedia-en-palace-of-the-soviets|introduction]]. After the war Stalin lost interest, and Iofan's scaled-down revisions failed to revive it [[source/wikipedia-en-palace-of-the-soviets|introduction]].

  Under Khrushchev the flooded foundation pit became the world's largest open-air swimming pool [[source/kalashnikov-2023|p. 28]]. The palace project, moved to another site, went through further competitions in 1957 and 1958 that asked for a low-rise building fifteen times smaller; it was abandoned, and its conceptual heir was the Palace of Congresses in the Kremlin (1961) [[source/kalashnikov-2023|p. 28]].

  ## Afterlife

  The unbuilt palace lives on in images: Aleksei Andrianov's film *Spy* (2012) brought it to life with computer graphics among the "hyper-Stalinist" cityscapes of the film [[source/kalashnikov-2023|p. 133]].
