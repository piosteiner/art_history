description_md: The golden hall of Murōji, set in a recess cut out of the mountain, its front supported by a masonry foundation. The original hall is a central [[moya]] three bays wide and one deep with a corridor; a porch ([[raido]]) was added across the front in the late thirteenth or early fourteenth century. Inside, five large standing Yakushi images stand before a wooden screen with the twelve yasha generals below them, under simple wood forms and bracketing. [[source/history-of-japanese-art|p. 136, fig. 163]]
