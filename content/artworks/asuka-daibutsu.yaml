description_md: "A seated [[shaka]] about three metres high, the right hand raised palm outward in the gesture of fearlessness, the left lowered in the gesture of wish-granting: the image Tori Busshi is credited with for Asukadera, Japan’s first full temple complex. Much restored over the centuries; the head is the least restored part. [[source/history-of-japanese-art|p. 71, fig. 84]]"
