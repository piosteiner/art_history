description_md: "A set of seven portraits legitimizing the Shingon teaching from master to pupil. Five were painted in late Tang China and given to [[person/kukai]] by his teacher [[person/huiguo]] before 806; in 821 Kūkai had two more made by a Japanese artist to replace damaged ones. An inscription names the Chinese painter [[artist/li-zhen]] on the portrait of the sixth patriarch, [[person/amoghavajra]] (705–774): a monk deep in meditation, his shoes removed, hands in the gesture of the outer bonds, the face modelled with grey shading over the flesh and drawn in black iron-wire lines — not flattering, but a great teacher in thought. The Japanese portrait of Nāgabodhi (Ryūchi), in a red robe with a notebook in his hand, has little shading: a study of flat forms. [[source/history-of-japanese-art|pp. 128–129, figs. 154–155]]"
