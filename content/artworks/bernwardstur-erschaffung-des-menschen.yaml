description_md: |-
  The top field of the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the creation of the first human being.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 33]] Following the custom of contemporary book painting, several moments of the story appear in one field, so that Adam appears twice in the scene of his awakening by the Creator.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] Its composition is almost identical with the corresponding page of the Moutier-Grandval Bible from Tours (around 840), a Carolingian manuscript tradition Bernward may have known from his journey to Tours in 1006.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]] Plants dominate the sparse setting, as on the whole left leaf.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]]

  What exactly is shown was left open in the lecture: in the list of typological pairs the field is called the creation of Eve, and a later slide asks "Creation of Eve (or of Adam?)".[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 79]] Opposite it, at the top of the right leaf, is the Noli me tangere; the lecture presented the two as a typological pair, the creation of the first human matched with the risen Christ's encounter with Mary Magdalene.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]] The left leaf is read from the top downwards, so this field opens the Old Testament cycle that ends with the murder of Abel.[[source/wikipedia-de-bernwardstur|§ Ikonografie]]
