    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1964.292
        note: On February 11, 1823, five days before his death, Prud'hon bequeathed to Boisfremont, his friend and student, “tous [ses] portefeuilles de dessins, études, etc.” The CMA painting was likely among these works
        source: cma-1964-292
        accessed: 2026-11-24
