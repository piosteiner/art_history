description_md: "One of the few dated paintings of [[artist/ogata-korin]], from his years in Edo with the mint official Nakamura Kuranosuke: a handscroll, now mounted on four panels, of peonies, hollyhocks, iris, chrysanthemums, daffodils and many other flowers outlined in pale ink and filled with thin, moist colours, the leaves in the boneless method with [[tarashikomi]]. [[source/history-of-japanese-art|p. 316, fig. 367]]"
