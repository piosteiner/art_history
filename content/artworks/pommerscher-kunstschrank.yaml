description_md: |-
  The Pomeranian Kunstschrank was a cabinet made in 1610–1617 for Duke Philipp II of Pomerania; [[artist/ulrich-baumgartner|Ulrich Baumgartner]] did the joinery, [[artist/hans-rottenhammer|Hans Rottenhammer]] the silver figures and [[artist/anton-mozart|Anton Mozart]] the paintings, among others [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 38]]. It was veneered with ebony and decorated with silver and ivory and measured 1.15 × 1.36 m; formerly in the [[institution/kunstgewerbemuseum-berlin|Kunstgewerbemuseum]] in Berlin, it was lost in the war [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 38]]. It was a luxurious writing cabinet of the Augsburg type, fitted out like a miniature cabinet of curiosities; its case burned in Berlin during the Second World War, but most of the utensils kept in it survive [[source/wikipedia-de-pommerscher-kunstschrank|§ Einleitung]].

  ## Commission and making

  The duke, who knew the Augsburg art dealer and diplomat Philipp Hainhofer personally, ordered a writing cabinet for his Kunstkammer from him; Hainhofer had it made by Augsburg craftsmen from 1610 [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. Between 24 and 28 people are said to have taken part, among them the stone cutter Daniel Griessbeck for the inlays of precious stones, goldsmiths including David Altenstetter and [[artist/matthias-walbaum|Matthias Walbaum]], the painters Johann Matthias Kager, Anton Mozart and Achilles Langenbucher, locksmiths, a sculptor, an engraver, an organ builder, a bookbinder, a case maker and clockmakers [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. Because new ideas were constantly added, completion was delayed; at the end of August 1617 the dismantled cabinet reached Stettin, where Baumgartner reassembled it, and the duke took possession of it on 2 September 1617 [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. Hainhofer supplied a description of the cabinet and of the roughly 200 objects in it [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The price of 20,000 gulden had not been paid in full when Philipp II died in February 1618 [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The handing over is shown in [[artwork/mozart-ubergabe-des-pommerschen-kunstschranks|Anton Mozart's painting]] of 1617, which the lecture discussed in detail [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 32–37]].

  ## Appearance

  The exterior was of ebony with mounts and inlays of silver and precious stones, the interior of sandalwood and red leather; the cabinet stood on four griffins holding the arms of Pomerania and Holstein, and a smaller tapering upper part carried a Mount Parnassus with Pegasus, probably by Matthias Walbaum [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]]. Silver ornaments with fruit and musical instruments, six of the liberal arts in silver ovals, musician statuettes and ten enamelled medallions decorated the sides; the inner sides of the four doors had landscapes with the Four Elements attributed to Anton Mozart, and a boxwood panel with the twelve labours of Hercules on the back concealed the pipes of a miniature organ [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]]. The contents included a games board, an apothecary's set, a barber's set with surgical instruments, combs and scissors, tools, tableware, geometrical and astronomical instruments, a table clock with sundial and compass, and a telescope [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]].

  ## Later history

  The cabinet stayed with the house of Griffins until the male line died out in 1637, passed through Anna von Croy to her son Ernst Bogislaw von Croy — who first called it a "Kunstschrank" — and was bequeathed by him to Electress Dorothea of Brandenburg, so that it came into the Electoral, later Royal Kunstkammer in Berlin [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. In the nineteenth century it passed to the Kunstgewerbemuseum, where it was the centrepiece of a collection of similar furniture; in 1945 it burned in the deep vault of the Neue Münze in Berlin, where it had been stored for safety [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The surviving contents remain in the Kunstgewerbemuseum [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]] — among them the [[artwork/pommerscher-kunstschrank-pultbrett|writing desk]], the [[artwork/pommerscher-kunstschrank-apothekenzubehor|apothecary's set]], the [[artwork/pommerscher-kunstschrank-toilettenzubehor|toilet set and iron instruments]] and the [[artwork/pommerscher-kunstschrank-spielkasten|games box]] [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 40–43]].

  ## In the lecture

  The cabinet stood for the "profane shrine": the cabinet as a Kunstkammer in miniature, in the section of the lecture on ebony as the wrapping of European luxury furniture [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]]. As Jeffrey Chipps Smith puts it, in such cabinets "the microcosm of the Kunstkammer had been reduced still further, becoming here a world inside of a single cabinet": the viewer activates it by opening doors and drawers, searching for hidden compartments and moving the cabinet to learn how it opens, so that "the furniture can be as marvelous as the contents" [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 63]].
