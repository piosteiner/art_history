description_md: "A [[vajra]] (kongō) of cast and gilded bronze: held in the right hand in Shingon ritual for the Kongōkai mandala and the indestructible nature of truth. The five prongs at each end stand for the five transcendental Buddhas, the central one for [[dainichi]]. With the bell (suzu) in the left hand, for the Taizōkai, it symbolizes the union of the two mandalas. [[source/history-of-japanese-art|p. 124, fig. 148]]"
