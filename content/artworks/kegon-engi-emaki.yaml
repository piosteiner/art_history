description_md: Two narrative scroll sets on the Korean monks Wŏnhyo (Gangyō, 617–686) and Ŭisang (Gishō, 625–702), founders of the Korean Kegon school, made for Kōzanji in connection with [[person/myoe]]. Gishō goes on to China, where the beautiful Zenmyō falls in love with him; when he sails home she throws herself into the sea and becomes a dragon to carry his ship — a scene of swirling blue waves and a ferocious green and red dragon. In the Gangyō scrolls an imperial messenger of Silla descends to the palace of the king of the sea, with the dialogue written in hiragana. Karen Brock has argued that the Gishō scrolls were made at the instigation of Lady Sanmi, a consort of [[person/emperor-go-toba]], around the Jōkyū Rebellion for the nuns of Zenmyōji; the Gangyō scrolls have been attributed to [[artist/enichibo-jonin]]. [[source/history-of-japanese-art|pp. 198–200, figs. 230–231]]
