description_md: |-
  A [[haori]] of silk in jacquard weaving, dated 1932, in the [[institution/museum-funf-kontinente|Museum Fünf Kontinente]] (inv. no. 2017-64-11). [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]] It was shown in Klaus Friese's guest lecture "Trumpets and Textiles – War in the Japanese Material Culture from 1931 to 1945". [[source/thomsen-2019-war-and-peace|syllabus, p. 3]]

  ## The garment

  A haori is a traditional Japanese jacket worn over a kimono, like a shortened kimono without overlapping front panels and usually tied at the front with two short cords. [[source/wikipedia-en-haori|introduction]] In the Edo period merchant-class men, held back by sumptuary edicts, began to wear haori with plain outsides and lavishly decorated linings — a habit still seen in men's haori today. [[source/wikipedia-en-haori|introduction]] Wartime haori used this hidden surface for propaganda: Kushner shows a man's haori whose inner lining reproduces an extra edition of the *Asahi* newspaper with the headline "Japanese and Chinese soldiers clash violently in Manchuria". [[source/kushner-2011-drive-to-mobilize|p. 20]] Another haori in the same catalogue shows the "Human Bombs" (Nikudan Sanyūshi), three soldiers celebrated as national heroes for breaching the enemy's barbed wire outside Shanghai. [[source/kushner-2011-drive-to-mobilize|p. 16]] [[source/kushner-2011-drive-to-mobilize|p. 17]]

  ## Context

  Kushner describes such textiles as "wearable propaganda", woven, embroidered, tie-dyed and printed on kimono, scarves, fans and obi, and as evidence of a programme of social mobilisation that reached far beyond what the government or the military had imagined. [[source/kushner-2011-drive-to-mobilize|p. 9]] They were not designed or handed out by the state: commercial factories or small workshops made the fabrics, and the garments were cut by kimono tailors, so that a whole network of producers and consumers took part. [[source/kushner-2011-drive-to-mobilize|p. 22]] The guest lecture's vocabulary — "multisensory", "social aesthetics", "embodiment", Shōwa jidai, [[term/good-wife-wise-mother|ryōsai kenbo]], nagajuban, haori — frames such clothes as objects worn and felt rather than only looked at. [[source/thomsen-2019-war-and-peace|vocabulary list, 10 May 2019 (guest lecture, Klaus Friese)]] David Howes, read for the session, argues that every artefact embodies a particular sensory mix in its making, its qualities and its use. [[source/howes-2006-scent-sound-synaesthesia|p. 166]]
