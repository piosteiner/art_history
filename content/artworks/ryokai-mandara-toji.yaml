description_md: The pair of [[mandala]] paintings of the Womb World ([[taizokai]]) and Diamond World ([[kongokai]]) — the oldest and best preserved in Japan. In the Taizōkai, Dainichi sits on an eight-petalled lotus at the centre of twelve courts, with the four transcendental Buddhas and four bodhisattvas on the petals; the Kongōkai has nine squares with Dainichi in the wisdom-fist gesture. Yanagisawa Taka has shown that they are Japanese copies of a set made in China for Emperor Montoku and brought back by the Tendai monk [[person/enchin]] in 859. The figures are drawn in red [[iron-wire-line]]s with animated hands but without movement in their bodies; the shading makes a decorative pattern rather than modelling. [[source/history-of-japanese-art|pp. 126–128, figs. 152–153]]
