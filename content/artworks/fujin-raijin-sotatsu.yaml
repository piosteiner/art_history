description_md: Probably made after 1621, when the wife of the shogun Hidetada commissioned [[artist/tawara-sotatsu]] to decorate the Yōgenin; by then he had left the fan shop to his successor and turned to screens and fusuma. The God of Thunder takes the demon of the Kitano Tenjin engi as model, the God of Wind perhaps the Kei-school statues of the Sanjūsangendō. Raijin, white against gold, and Fūjin striding forward, both in flat solid colours with horns in [[tarashikomi]] (colour dropped into wet colour), suggest the course of a storm across the gold void between them. [[source/history-of-japanese-art|pp. 270–271, fig. 312]]
