public_id: 108243
title: Portrait of Hagiwara Sakutarō
creator: onchi-koshiro
created: 1943
kind: Japanese woodblock print
medium: Polychrome woodblock print on paper
materials: [paper]
dimensions: [52.5, 42.5]
description_md: "The master print of [[artist/onchi-koshiro]] (1891–1955), leader of [[sosaku-hanga]], his response to the death in 1942 of his friend [[person/hagiwara-sakutaro]], the troubled nihilist poet: a three-quarter view with rumpled hair and an intense, unfocused gaze, the wrinkles like the grain of wood. Seven separately carved blocks re-inked through fifteen stages (Elizabeth de Sabato Swinton); only seven impressions. [[source/history-of-japanese-art|pp. 385–386, fig. 460]]"
