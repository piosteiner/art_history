    label: "part of the altarpiece (predella): on the main altar (cited 1677, as by Andrea del Castagno), probably until restoration 1712–1715; in the sacristy by 1728; on the third altar right of the nave by 1762; no longer in the church by 1827"
    sources:
      - url: https://www.nga.gov/collection/art-object-page.281.html
        note: Main altar of the church of Santa Lucia de' Magnoli, Florence, probably until the early 18th century.[1] Sacristy of the same church, by 1728.[2] Third altar on the right of the nave of the same church, by 1762 and probably until the early 1800s.[3] — [3] … leads one to suppose that by this date [1827] it was no longer in the church.
        source: nga-1939-1-140
        accessed: 2026-11-24
