description_md: "The building that best shows the Heian court’s belief in Amida and his Western Paradise. [[person/fujiwara-no-michinaga]] bought the site on the Uji River in 998; his son [[person/fujiwara-no-yorimichi]] turned the villa into a temple in 1052 and dedicated the hall in 1053. It stands on an island in an artificial pond, close to the water and reflected in it: a single-storied central hall treated as if it had two storeys, with two-storied walkways ending in towers at the sides and a tail corridor behind — like a bird with outstretched wings, two gilt bronze phoenixes on the roof. Inside sits [[artwork/byodo-in-amida]] with his host on the walls, and the doors are painted with Amida’s welcome ([[raigo]]): the whole hall is a materialization of the raigō. [[source/history-of-japanese-art|pp. 143–145, figs. 172–173]]"
