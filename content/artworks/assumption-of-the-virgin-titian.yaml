provenance:
  - owner: institution/santa-maria-gloriosa-dei-frari
    acquired: 1516
    method: commission
    place: venice
    label: commissioned by the prior, Father Germano, for the high altar; unveiled on 20 March 1518 (Sanudo) — the friars nearly refused it until the Austrian ambassador, Charles V's envoy, offered to buy it
    sources:
      - url: https://it.wikipedia.org/wiki/Assunta_%28Tiziano%29
        note: Nel 1516 il priore del convento francescano dei Frari, padre Germano, commissionò una nuova pala a Tiziano per l'altare maggiore […] Il 20 marzo 1518, come ricorda il Sanudo, l'opera fu solennemente inaugurata […] I frati stavano infatti per rifiutarla, se non fosse stato per l'ambasciatore austriaco, emissario dell'imperatore Carlo V, che si offrì di acquistarla
        source: wikipedia-it-assunta-tiziano
        accessed: 2026-10-20
  - owner: institution/gallerie-dell-accademia-venice
    role: custodian
    acquired: 1818
    ended: 1919
    place: venice
    label: kept in deposit at the Accademia after the Napoleonic suppressions
    sources:
      - url: https://it.wikipedia.org/wiki/Assunta_%28Tiziano%29
        note: In seguito alle soppressioni napoleoniche, fu tenuta in deposito alle Gallerie dell'Accademia per un secolo, dal 1818 al 1919.
        source: wikipedia-it-assunta-tiziano
        accessed: 2026-10-20
  - owner: institution/santa-maria-gloriosa-dei-frari
    acquired: 1919
    method: restitution
    place: venice
    label: back on the high altar, “today as then”
    sources:
      - url: https://it.wikipedia.org/wiki/Assunta_%28Tiziano%29
        note: conservato nella basilica di Santa Maria Gloriosa dei Frari a Venezia, dove decora, oggi come allora, l'altare centrale.
        source: wikipedia-it-assunta-tiziano
        accessed: 2026-10-20
