description_md: "One of the masterpieces of [[artist/asai-chu]] (1856–1907), Fontanesi’s most talented pupil and a founder of the Meiji Art Society, shown at its exhibition of 1890: soft golden light pervades three peasants at the harvest, giving the whole a lyrical, unfocused quality much like Fontanesi’s. [[source/history-of-japanese-art|p. 373, fig. 444]]"
