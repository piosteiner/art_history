description_md: |-
  This English manuscript miscellany of about 1460/70 is in the [[institution/british-library|British Library]] (Add MS 37049) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 37]]. The lecture showed fol. 23r with the "Charter of Christ" [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 37]].

  It was shown in the section on early woodcuts as a medium of the Passion of Christ, between the double pages of the prayer book [[artwork/egerton-1821|Egerton MS 1821]] with its red ground, drops of blood and pasted-in woodcuts of the Man of Sorrows and the Five Wounds [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 32–38]].
