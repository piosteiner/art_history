        note: "Footnote: Erworben von dem oben Genannten, AStEGB, Brief von Emil Bührle an Dr. Peter N. Witt, Bern, 03.02.1951, in dem er den Erhalt des obigen Schreibens bestätigt und die Überweisung von CHF 550.000 für die beiden Gemälde ankündigt; Brief von Dr. Peter N. Witt, Bern, an Emil Bührle, 11.02.1951, in dem er den Erhalt von CHF 550.000 bestätigt; Eingangsbuch I, 15.01.1951, das Dr. F. Nathan als Einlieferer ausweist und einen Preis von CHF 280.000 angibt. Der Preis für [F.717], von Nathan am 05.01.1951 eingeliefert, wird im Eingangsbuch mit CHF 350.000 angegeben; als das Gemälde jedoch kurz darauf für eine Reproduktion an eine Druckerei in Zürich ausgeliehen wurde, war es für CHF 300.000 versichert, AStEGB, Versicherungspolice der Helvetia Feuer St. Gallen, ausgestellt auf J. E. Wolfensberger, Zürich, 19.07.1951; daher ist anzunehmen, dass es sich bei den im Eingangsbuch I angegebenen Preisen um Angebotspreise handelte und sich die individuell bezahlten Preise für die beiden Gemälde auf CHF 300.000 für F.717 und CHF 250.000 für F.820 beliefen."
        source: kunsthaus-zurich-sammlung-online
