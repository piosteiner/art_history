description_md: |-
  A Slavic image of a god with two heads, carved from wood in the 11th century and found at the Tollensesee; it is 178 cm high and belongs to the Landesamt für Denkmalpflege Mecklenburg-Vorpommern.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 87]]

  ## The find

  The Fischerinsel is a small island, 150 m long and 40 m wide, in the southern part of the Tollensesee south of Neubrandenburg, opposite the village of Wustrow; it has long been investigated as a possible site of Rethra, the legendary chief sanctuary of the Slavic Liutizian federation.[[source/wikipedia-de-fischerinsel-tollensesee|introduction]] In 1969 an excavation led by Eike Gringmuth-Dallmer and Adolf Hollnagel recovered two wooden figures there, one of them two-headed, representing a male Slavic deity; the German Wikipedia dates them to the 12th–13th century, whereas the lecture gives the 11th century.[[source/wikipedia-de-fischerinsel-tollensesee|introduction]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 87]] The excavators also found much timber from a castle documented as *castrum Wustrow*, which existed until the 13th century, and a bridge discovered in 1886 led from the shore at Wustrow to the island.[[source/wikipedia-de-fischerinsel-tollensesee|introduction]] Whether the island was Rethra has been neither proved nor disproved.[[source/wikipedia-de-fischerinsel-tollensesee|introduction]]

  ## Tree and image of the god

  The lecture "Aus dem Wald" showed the figure at the end of its third session, in the section on the tree and the image of the god.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 79]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 87]] It came directly after the Christian missionaries' fight against sacred trees in the early Middle Ages: the life of St Boniface (died 754), as quoted by Ittai Weinryb, tells how he cut down an oak of tremendous size at Geismar, which the pagans called the oak of Idsis, and was cursed by them as an enemy of their gods.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 86]] The reading for the session, Carole M. Cusack's *The Sacred Tree*, notes for ancient Greece that anthropomorphic sculptures of deities seem to have developed from unworked logs or planks, suggesting the identity of the tree and the god or goddess.[[source/cusack-2011-the-sacred-tree|p. 28]] The earliest image of Hera on Samos, for instance, was said to have been nothing more than a wooden plank, and the *daedala* of the Boeotian festival of Hera were wooden figures made from tree trunks, probably only roughly hewn.[[source/cusack-2011-the-sacred-tree|p. 37]] The aniconic representation of deities as pillars was gradually replaced by anthropomorphic images from the Archaic period on.[[source/cusack-2011-the-sacred-tree|p. 33]]
