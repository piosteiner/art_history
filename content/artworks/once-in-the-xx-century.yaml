description_md: |-
  *Once in the XX Century* (2004) is a video by [[artist/deimantas-narkevicius|Deimantas Narkevičius]], shown in the seminar for contemporary perspectives on the Soviet legacy, beside [[artwork/akhunov-red-mantra-cccp]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 40]].

  ## The work

  The video, 7 minutes 56 seconds long and made on Betacam SP, uses footage of the removal of a monumental statue of Lenin from Lukiškės Square in Vilnius in 1991, from the Lithuanian national television archive and a freelance reporter [[source/wikipedia-en-deimantas-narkevicius|§ Once in the XX Century]]. The images of the figure hanging above the crowd with raised hand had been broadcast hundreds of times as a symbol of the disintegration of the Soviet Union and the failure of communism [[source/wikipedia-en-deimantas-narkevicius|§ Once in the XX Century]]. Narkevičius cut the action in reverse: a cheering crowd greets the statue as it is raised from a vehicle and swung onto its plinth, where Lenin is reunited with his legs [[source/wikipedia-en-deimantas-narkevicius|§ Once in the XX Century]]. The reversal ironically points to the repetition of scenes in history and to the longing for, or denial of, political and economic systems [[source/wikipedia-en-deimantas-narkevicius|§ Once in the XX Century]]. Public monuments and monumentality are a central theme of his work [[source/wikipedia-en-deimantas-narkevicius|§ Film career]].

  ## Monuments after 1991

  The fall of the Soviet Union set off a second, more thorough wave of iconoclasm, in Russia as elsewhere [[source/kalashnikov-2023|p. 131]]. Monuments occupy public space, and the removal of older monuments mattered as much as their making [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Groys speaks of the "perpetual discussions" of what to do with the monuments of "real socialism", "whose mass is far too great to house in any museum" [[source/groys-1994|p. 145]].
