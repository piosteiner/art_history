description_md: |-
  This Virgin in Majesty from the Auvergne, dated about 1150, is carved in walnut and painted over a chalk ground; it is 84 cm high and in the Musée du Louvre (RF 987).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 36]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  Walnut was favoured for such statues in the south of France and especially in the Auvergne, although the region's forests were rich in resinous woods rather than walnut.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] The Auvergne produced the largest number of surviving [[term/sedes-sapientiae|sedes sapientiae]] statues.[[source/forsyth-1972-the-throne-of-wisdom|p. 19]] The lecture showed the statue among the enthroned Madonnas of Burgundy, the Auvergne, Switzerland, Catalonia and Tuscany.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 36]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 37]]
