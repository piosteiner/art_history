description_md: "The premier ceramic work of [[artist/honami-koetsu]], an accomplished amateur potter: like the mountain, white around the top and greyish black below, shaped by hand, the marks of the shaving knife proudly left at base and lip. Filled with foamy green tea it becomes a volcano’s crater. [[source/history-of-japanese-art|pp. 251–252, fig. 288]]"
