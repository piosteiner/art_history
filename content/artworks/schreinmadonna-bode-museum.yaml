description_md: |-
  A [[term/shrine-madonna|Shrine Madonna]] from the Upper Rhine, made around 1330 and now in the sculpture collection of the Bode-Museum, Berlin.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 106]] It is carved in a softwood and painted over a chalk ground; it is 1.11 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 106]]

  The lecture showed it closed and opened, between the Rhenish Shrine Madonna in New York (around 1300) and the Cologne Shrine Madonna of Yvonand (around 1330/40), as one of the early German examples of the type.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 105–109]] Such statues open along a vertical cut through the Virgin's body to reveal sculpted and painted images inside – in the Rhenish examples the Throne of Mercy flanked by narrative scenes.[[source/gertsman-2015-worlds-within|p. 70]]
