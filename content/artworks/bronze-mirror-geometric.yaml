description_md: A Korean bronze mirror with fine hatched triangles and two off-centre loop handles on the back — unlike Chinese mirrors; Kim Won-yong traced its Z-patterns to mirrors found with “Liaoning” daggers. Probably used in shaman rituals, perhaps fastened to a garment; the finest were probably cast in clay moulds. [[source/portal-2000|pp. 35–36, fig. 17]]
