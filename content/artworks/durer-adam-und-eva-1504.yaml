description_md: |-
  An engraving by [[artist/albrecht-durer|Albrecht Dürer]], completed in 1504, of Adam and Eve in the Garden of Eden surrounded by symbolic animals; it changed how the first couple was depicted in art.[[source/wikipedia-en-adam-and-eve-durer|introduction]] It is engraved with the burin on copper, 25.1 × 19.8 cm.[[source/wikipedia-en-adam-and-eve-durer|§ Background]] The lecture "Aus dem Wald" shows the impression in the [[institution/albertina|Albertina]], Vienna.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 59]]

  ## Making

  Dürer drew on the Apollo Belvedere and the Medici Venus, known to him second-hand, and on Jacopo de' Barbari, who came to Nuremberg in 1500 and introduced him to the Vitruvian canon of proportions; he went on to measure living models himself.[[source/wikipedia-en-adam-and-eve-durer|§ Background]] He made separate preparatory drawings for each figure, constructing the body with ruler and compass on one side of the sheet and modelling it on the reverse; two trial proofs survive and show, for example, that the cat was added late.[[source/wikipedia-en-adam-and-eve-durer|§ Imagery, style and technique]] Both figures stand in antique contrapposto, their bodies turned to the viewer and their heads in profile; they shine out from the dark forest that fills nearly the whole plate.[[source/wikipedia-en-adam-and-eve-durer|§ Imagery, style and technique]]

  ## The trees

  Between the two figures stands the Tree of Knowledge, a fig bearing apples, as was usual; the snake offers Eve a fruit, and she already holds one on a broken branch whose fig leaves cover her — an allusion to Genesis 3:7.[[source/wikipedia-en-adam-and-eve-durer|§ Symbolism]] Adam holds a branch of mountain ash, the Tree of Life, on which hangs the tablet inscribed "Albert Dürer noricvs faciebat 1504", with a parrot perched above it.[[source/wikipedia-en-adam-and-eve-durer|§ Symbolism]] The cat, rabbit, ox and elk around the couple stand for the four temperaments, still in balance before the Fall.[[source/wikipedia-en-adam-and-eve-durer|§ Symbolism]]

  In the lecture the engraving belongs to the section on trees and forests in cultural origin stories, after the text of Genesis 2–3 in which God plants the Tree of Life and the Tree of the Knowledge of Good and Evil in the middle of the garden, and the eyes of Adam and Eve are opened once they have eaten of its fruit.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 51]] Between two views of the engraving the lecture showed the Nuremberg forest map of 1516, the [[artwork/etzlaub-waldplan-von-nurnberg|Waldplan]] of the city's forests of St Lorenz and St Sebald.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 60]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 61]] The engraving was shown again in the third session.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 26]]
