description_md: "*Bildnis Professor P. L. Troost* by [[artist/paul-roloff|Paul Roloff]] (1936) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; photographed by Wilhelm Nortz ([Stadtarchiv München, DE-1992-FS-NS-00563](https://stadtarchiv.muenchen.de/scopeQuery/detail.aspx?ID=462065)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Troost had designed the Haus der Deutschen Kunst and died in 1934, before it was finished.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Vorgeschichte]]"
