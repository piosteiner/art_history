description_md: A page from the Ise shū, the poems of the earliest woman master Ise (c. 877–c. 940), in the anthology of the thirty-six immortal poets compiled around 1112, now mounted as a hanging scroll. The paper is a collage of coloured papers suggesting a hilly landscape, with clouds, birds, trees and fences added in gold and silver; over it runs the poem in an elegant running-grass script — kana and hiragana blurred together. [[source/history-of-japanese-art|p. 110, fig. 136]]
