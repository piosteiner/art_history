description_md: |-
  Sunflowers past their bloom — heavy, drooping heads with curling petals — in a red and black vase before a blue-green ground, signed and dated at the lower left. By [[artist/hanasaki-toshiyoshi]], 1958; it belongs to the [[institution/keio-art-collection|Keio Art Collection]] (KAC-2020-0459) and is kept on the Mita Campus of [[institution/keio-university|Keio University]].[[source/objecthub-keio-ac-jp|object 6332 (ひまわり)]]

  The wilting sunflowers in a vase recall [[artwork/sunflowers-arles|Vincent van Gogh’s Sunflowers]] — an own observation: no source that connects the painting with van Gogh’s series has been found.
