description_md: |-
  Notre-Dame de Montvianeix is an enthroned Virgin and Child from the Auvergne of 1150–1200, of walnut with remains of polychromy over a chalk ground and canvas, 68.6 cm high, now in the Metropolitan Museum of Art, New York (67.153).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 38]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  ## A work by the master of the Morgan Madonna

  Forsyth attributed it to the same master as the [[artwork/morgan-madonna|Morgan Madonna]].[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] Like that statue it looks solid, but it is assembled from at least eighteen separately worked pieces of walnut.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 81]] The heads, the Child's hands and feet and the colonnettes of the throne were made separately and joined with wooden dowels; near the lower edge of the Child's tunic such a dowel is pinned in place by a smaller one.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] The base is also a composite.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] Traces of the linen glued to the wood under the gesso are particularly visible on it.[[source/forsyth-1972-the-throne-of-wisdom|p. 19]]

  ## A "Black Virgin" cleaned

  The statue was black until a cleaning in 1931 revealed the original natural flesh tones beneath the dark paint.[[source/forsyth-1972-the-throne-of-wisdom|p. 22]] Forsyth used it to argue that Romanesque Madonnas were not conceived as "Black Virgins"; the blackening of such figures belongs to later centuries.[[source/forsyth-1972-the-throne-of-wisdom|pp. 20–22]] When Forsyth published it in 1972 it was in a private collection (her register no. 3).[[source/forsyth-1972-the-throne-of-wisdom|fig. 60]]

  The lecture showed it, with the Morgan Madonna, as an example of the joinery technique of the Auvergne.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 81]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 83]]
