description_md: |-
  The central shrine of the Blaubeuren high altarpiece, visible when both pairs of wings are open.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 41]] Its five figures – the Virgin and Child, John the Baptist, John the Evangelist, Benedict and Scholastica – were carved by [[artist/michel-erhart|Michel Erhart]] in 1491–1494 and painted by the workshop of [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]].[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 63]]

  The figures are limewood and keep their original paint and leaf-metal gilding over a chalk ground.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 63]] The Virgin stands on the crescent moon in the centre, holding the Child on her arm; John the Baptist is the patron of the church, while Benedict, founder of the order, and Scholastica, founder of its female branch, stand for the Benedictine abbey.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] De Wikipedia attributes the carving to Michel Erhart and his son Gregor in varying shares.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  In Zeitblom's workshop the same painters worked on panels and on carved figures: the lecture compared eyes and mouths painted on panels with those on sculpture from the Kilchberg retable of about 1494.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 65]] At Blaubeuren the shrine, gilded and fully coloured, forms the culmination of the altarpiece's gradation from painted panels outside to carved figures inside.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 35, 63–64]]
