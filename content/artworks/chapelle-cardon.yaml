description_md: |-
  A small Marian tabernacle known as the Chapelle Cardon, made on the Lower Rhine around 1400 of painted and gilded wood, 99 cm high; it is now in the Musée du Louvre, Paris.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 21]]

  In the lecture it opened a sequence on the "logic of the shrine" – the housing and unveiling of the holy – in which shrines with opening doors led from small devotional tabernacles and reliquaries to the winged high altarpieces of the late Middle Ages.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 21–30, 35]] It was followed by a Marian shrine from the Middle Rhine of around 1460 in the Sebastian chapel at Darsberg and by the Stavelot reliquary triptych of around 1150.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 22–23]]
