description_md: One of the three repetitions of the [[artwork/sunflowers-arles|Sunflowers]] that Van Gogh painted in Arles in January 1889 — a loose copy of the [[artwork/sunflowers-national-gallery|version now in London]]. Gauguin had asked for a sunflower picture as a gift, which Vincent was reluctant to give him; instead he made two loose copies, this one among them. Fifteen sunflowers, from bud to wilting, in three shades of yellow.
