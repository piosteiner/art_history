description_md: |-
  [[artist/tetiana-yablonska|Tetiana Yablonska]]'s *Bread* shows the harvest on a collective farm — labour as the shaping of norms [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]].

  ## The painting

  Wikipedia describes a large canvas of 1949, nearly four metres wide, under the title *Corn* (*Sacking Grain*): mounds of golden grain, the flushed and smiling faces of collective farmers and sunlight permeating the whole scene [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. In that account it reflects the "joyous confidence" and "triumphant enthusiasm" of people who had left the burden of war behind, and the optimism and zest for work of the post-war years [[source/wikipedia-en-tetiana-yablonska|§ Biography]]. Yablonska won the Stalin Prize in 1949 and 1951 [[source/wikipedia-en-tetiana-yablonska|§ Biography]].

  ## Labour in totalitarian art

  In the seminar labour was one of the themes of totalitarian art, and *Bread* stood beside the Italian [[artwork/mancioli-the-plow-tills-africa]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]]. Labour on the land — agriculture and the forming of norms — was one of the themes through which the regimes taught how to live [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Socialist realism showed busy industrial and agricultural scenes and happy, muscular peasants on collective farms; tragedy and negativity had no place in this "forced optimism" [[source/wikipedia-en-socialist-realism|§ Characteristics]]. Golomstock counted everyday labour, like war, among the subjects that totalitarian art portrayed as heroic struggle [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]].

  The slide names the painter "Olga Yablonskaya" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 19]]: she is Tetiana (Tatyana) Yablonska [[source/wikipedia-en-tetiana-yablonska|introduction]].
