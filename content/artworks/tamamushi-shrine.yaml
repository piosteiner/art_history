description_md: "A portable [[zushi]] in the form of a [[kondo]] on a tall plinth: the earliest evidence of Japanese Buddhist architecture, older than the golden hall of Hōryūji. Named after the iridescent wings of the tamamushi beetle once set under its openwork metal. The paintings in red, yellow and green on black lacquer — the only Buddhist painting left from the Asuka period — show bodhisattvas, the Four Guardian Kings and [[jataka]] tales; on one side the Hungry Tigress, told in continuous narrative down the panel. [[source/history-of-japanese-art|p. 75, fig. 90–91]]"
