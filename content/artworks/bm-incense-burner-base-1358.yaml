description_md: The base of a cast-bronze incense burner inlaid with silver thread and strips — clouds and scrolls on the dark patina. The inscription incised around it says it was part of a royal incense burner made for [[person/gongmin-of-goryeo]] in 1358 as a pious offering at Sojae temple. [[source/portal-2000|pp. 95–96, figs. 48a–b]]
