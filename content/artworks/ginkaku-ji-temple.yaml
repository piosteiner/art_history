description_md: The retirement villa of Ashikaga Yoshimasa (1430–90), Yoshimitsu's grandson, in the Higashiyama (Eastern Hills) district of Kyoto, begun after the Ōnin War; later the temple Jishōji, nicknamed “Temple of the Silver Pavilion”. It is nothing like its so-called twin, the Kinkakuji[[source/history-of-japanese-art|pp. 170–171, 226–229]].
