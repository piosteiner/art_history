description_md: "The retreat of [[person/ashikaga-yoshimasa]] on the site of an abandoned Tendai temple he acquired in 1465; he lived there from 1483. Nothing like its so-called twin: a two-storied building, three bays by four below and three by three above, the upper floor a chapel to Kannon; it was never covered in silver. Its gardens were meant to be walked through. [[source/history-of-japanese-art|pp. 228–229, fig. 263]]"
