provenance:
  - owner_label: woman's grave, Dipylon cemetery, Kerameikos
    acquired: -760/-750
    method: creation
    place: athens
    label: grave vase marking a woman's grave; made by the Dipylon Master, probably also its potter; perhaps brought to the findspot after the Persian destruction of the city
    sources:
      - url: https://de.wikipedia.org/wiki/Dipylon-Amphora
        note: Die monumentale, 1,55 Meter hohe Bauchhenkel-Amphora … war eine Grabvase und kennzeichnete das Grab einer Frau. … Möglicherweise kam die Vase nach der Zerstörung der Stadt durch die Perser 490 v. Chr. dorthin und stand zuvor auf einem Grab.
        source: wikipedia-de-dipylon-amphora
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Dipylon_Amphora
        note: The Dipylon Amphora (also known as Athens 804) is a large Ancient Greek painted vase, made around 760–750 BC
        source: wikipedia-en-dipylon-amphora
        accessed: 2026-11-24
  - owner_label: excavation at the Dipylon cemetery, Kerameikos
    method: find
    place: athens
    label: found intact on an aristocratic gravesite near the Dipylon Gate; date and excavator not reliably given in the sources read
    sources:
      - url: https://de.wikipedia.org/wiki/Dipylon-Amphora
        note: Die Dipylon-Vase wurde in Athen am später errichteten Dipylon-Tor gefunden, in der Nähe des Friedhofes auf dem Kerameikos.
        source: wikipedia-de-dipylon-amphora
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Dipylon_Amphora
        note: The Dipylon Amphora was found intact on an aristocratic gravesite at the Dipylon cemetery, near the Dipylon Gate, in Kerameikos, the ancient potters' quarter on the northwest side of the ancient city of Athens.
        source: wikipedia-en-dipylon-amphora
        accessed: 2026-11-24
  - owner: institution/national-archaeological-museum-of-athens
    method: transfer
    place: athens
    label: inventory 804
    sources:
      - url: https://de.wikipedia.org/wiki/Dipylon-Amphora
        note: Das Stück befindet sich heute im Archäologischen Nationalmuseum Athen. [Inventarnummer 804.]
        source: wikipedia-de-dipylon-amphora
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Dipylon_Amphora
        note: The Dipylon Amphora (also known as Athens 804) … is now held by the National Archaeological Museum, Athens.
        source: wikipedia-en-dipylon-amphora
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1940/1941
    place: athens
    label: the museum's antiquities concealed in 1940–41 (clay works packed and taken to air-raid shelters); uncovered after the war, first halls reopened 1947 — the page does not name this work
    certainty: probable
    sources:
      - url: https://www.namuseum.gr/en/to-moyseio/istoria-toy-moyseioy/the-rescue-of-the-statues/
        note: «When the occupation army entered the capital in April 1941, the task of concealing the ancient treasures of the National Museum had already been completed» … Sculptures, bronze and clay artworks had been packed and transported to various raid shelters in Athens … the large statues had been deposited in large trenches that were dug in the floor of the museum halls. … To uncover the buried antiquities was the main priority after the end of the war.
        source: nam-athens-rescue-of-the-statues
        accessed: 2026-11-24
