        note: 平安時代の末期に平清盛（一一一八～八一）の援助によって社殿が造営されたと伝え … 神社は承元元年（一二〇七）、貞応二年（一二二三）の両度炎上し、仁治二年（一二四一）ほぼ全社殿にわたる造営が行われているので、現社殿は古式の部分も存するが、ほぼこの時のものと思われる。 … 所有者名 ： 厳島神社
        source: kunishitei-102-3166
        accessed: 2026-11-24
      - note: The shrine, completely rebuilt by Taira no Kiyomori after his elevation to governor of Aki province, created a kind of dream-palace, extending out over the sea in front of Miyajima Island. Although it has been destroyed many times, it has always been rebuilt in the same design.
        source: history-of-japanese-art
