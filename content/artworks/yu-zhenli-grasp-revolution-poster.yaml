description_md: |-
  Peace as productivity and harmony in a well-run system — a picture that veils famine and the excesses of Mao's last years. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]

  ## Description

  [[artist/yu-zhenli|Yu Zhenli]]'s poster *We must grasp revolution and increase production, increase work, increase preparation for struggle, to do an even better job* dates from May 1976. [[source/thomsen-2019-war-and-peace|image list, 24 May 2019]] The class notes read it as the depiction of a brilliant social system that knows no fear, showing peace, productivity, harmony and a well-run system. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] What it leaves out — famine and the turmoil of Mao's last years — is part of how it works. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]

  ## In the lecture

  The poster was shown on 24 May 2019 in the session "World War II, Looking Back", whose vocabulary lists "Mao Posters". [[source/thomsen-2019-war-and-peace|syllabus, p. 4]] [[source/thomsen-2019-war-and-peace|vocabulary list, 24 May 2019]] The same session compared it with [[artist/xu-yang|Xu Yang]]'s [[artwork/xu-yang-southern-inspection-tour-scroll-four|Qianlong Emperor Inspecting Water Control Measures]] of 1770: both claim through the image that their rulers are in charge of a well-run system, which makes the court scroll comparable to modern propaganda. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] [[source/thomsen-2019-war-and-peace|image list, 3 May 2019]] The course's first session had named order, the stability of the regime and prosperity among the common symbols of peace, as in [[artwork/han-ruozhuo-sparrows-and-rice-stalks|Sparrows and Rice Stalks]]. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]
