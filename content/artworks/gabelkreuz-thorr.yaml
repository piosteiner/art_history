description_md: |-
  A forked crucifix (Gabelkreuz) in the church of St. Simon und Juda in Thorr (district of Bergheim), made in the early fourteenth century.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 66]][[source/wikipedia-de-gabelkreuz|§ Vorkommen]] The corpus, 1.20 m high, is carved in oak and carries three layers of paint; the loincloth was originally gilded.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 66]]

  It belongs to the group of Rhenish forked crucifixes that followed the cross of St. Maria im Kapitol in Cologne.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] Typical of these crucifixi dolorosi are the body hanging from a Y-shaped fork with the head sunk deep on the chest, the arms stretched upwards rather than sideways, the emaciated body with protruding ribs and a gaping side wound, and cramped, spread fingers and toes.[[source/wikipedia-de-gabelkreuz|§ Beschreibung]] The lecture showed it twice, after the Cologne cross and the crosses of Bocholt, Andernach and St. Georg.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62–67]]
