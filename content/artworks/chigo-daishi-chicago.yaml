description_md: "One of the most popular icons of the cult of [[person/kukai]] (Kōbō Daishi): the boy Kūkai at the moment he had a vision and told his parents he wanted to become a monk, kneeling on a lotus within a moon disc, hands together. Such [[chigo]] images belong to the tales of Enlightenment (hosshin mono) in which the love of an older monk for a novice leads to Enlightenment, the boy revealed as a bodhisattva. [[source/history-of-japanese-art|pp. 200–201, fig. 233]]"
