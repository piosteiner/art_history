        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Dog%C5%AB_with_palms_pressed_together
        note: Excavated by the Hachinohe City Board of Education over five seasons from 1988 to 1992 … The dogū with palms pressed together was unearthed during rescue excavation in July 1989.
