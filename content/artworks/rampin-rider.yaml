provenance:
  - owner_label: found on the Acropolis of Athens
    acquired: 1877
    method: find
    place: athens
    label: the head (the torso, found separately in the Perserschutt, is in the Acropolis Museum, Inv. 590)
    sources:
      - url: https://de.wikipedia.org/wiki/Reiter_Rampin
        note: Der namengebende Kopf Rampin wurde 1877 auf der Akropolis gefunden
        source: wikipedia-de-reiter-rampin
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Rampin_Rider
        note: The head of the rider was found on the Acropolis of Athens in 1877 and donated to the Louvre.
        source: wikipedia-en-rampin-rider
        accessed: 2026-11-24
  - owner: person/georges-rampin
    direct: true
    place: athens
    label: secretary of the French embassy in Athens, for his collection
    sources:
      - url: https://de.wikipedia.org/wiki/Reiter_Rampin
        note: und von dem französischen Botschaftssekretär in Athen, Georges Rampin, für seine Sammlung erworben.
        source: wikipedia-de-reiter-rampin
        accessed: 2026-11-24
  - owner: institution/department-of-greek-etruscan-and-roman-antiquities-of-the-louvre
    acquired: 1896
    method: bequest
    direct: true
    place: paris
    label: inventory 3104 (Ma 3104); 'donated' in the English article
    sources:
      - url: https://de.wikipedia.org/wiki/Reiter_Rampin
        note: Im Jahr 1896 vermachte er den 27 Zentimeter hohen Kopf dem Louvre in Paris, wo er unter der Inventarnummer 3104 ausgestellt wird.
        source: wikipedia-de-reiter-rampin
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1935
    place: athens
    label: Humfry Payne recognised that the head belongs to the torso in the Acropolis Museum, checked with a plaster cast of the head in Athens (published 1936)
    sources:
      - url: https://de.wikipedia.org/wiki/Reiter_Rampin
        note: Im Jahr 1935 erkannte Humfry Payne die Zusammengehörigkeit beider Funde, die er mit Hilfe eines Gipsabgusses des Kopfes in Athen überprüfte. Das Ergebnis publizierte er 1936.
        source: wikipedia-de-reiter-rampin
        accessed: 2026-11-24
