description_md: |-
  This walnut relief at the top of the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the Annunciation and the Visitation.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 89]] It opens the childhood of Christ in the upper half of the leaf.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 88]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] The large rectangular panels of the left leaf each combine two scenes, as here, while those of the right leaf show only one – one of the observations with which Richard Hamann distinguished two carvers.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]

  The lecture returned to this relief in the last part of the session, showing it in a series of details.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 122]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 123]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 126]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 129]]
