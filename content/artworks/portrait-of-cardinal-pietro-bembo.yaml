provenance:
  - owner: person/pietro-bembo
    method: commission
    place: padua
    label: probably commissioned by the sitter; Padua and Rome
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: Probably commissioned by the sitter, Cardinal Pietro Bembo [1470-1547], Padua and Rome;
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/torquato-bembo
    method: inheritance
    direct: true
    place: padua
    label: his son; left the whole collection by the will of 1544; began to disperse it about twenty years later (parts sent to Rome for sale in 1581 and 1583) — perhaps sold then
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: by inheritance to his son, Torquato Bembo [1525-1595].[1] — In his final testament, drawn up in 1544, Bembo left his entire art collection to Torquato … sending important parts of it back to Rome for sale in 1581 and 1583.
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/ferrante-carlo
    role: dealer
    place: rome
    label: the dealer 'Ferrante de Carolis'
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: probably (Ferrante Carlo [1578-1641], Rome), and acquired from him before 1631 by Don Fabrizio Valguarnera [d. 1632], Rome.[2]
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/fabrizio-valguarnera
    acquired: before 1631
    method: purchase
    direct: true
    place: rome
    label: Sicilian nobleman; the portrait is in the inventory of his possessions and in Carlo's testimony at Valguarnera's trial for theft, 1631
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: acquired from him before 1631 by Don Fabrizio Valguarnera [d. 1632], Rome.[2] — "Il Ritratto di Monse Bembo è di mano di Titiano è quell’istesso che hò detto di sopra d’haver compro da Ferrante de Carolis"
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/leone-galli
    place: rome
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: Leone Galli; acquired 1636 by Cardinal Antonio Barberini — According to an inventory of Cardinal Barberini, the picture was acquired on 20 November 1636 from Leone Galli.
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/antonio-barberini
    acquired: 1636-11-20
    method: purchase
    direct: true
    place: rome
    label: Cardinal Antonio Barberini, Palazzo Barberini; his inventories of 1636 (no. 334, as a cardinal by Titian), 1644 and 1671
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: acquired 1636 by Cardinal Antonio Barberini [1608-1671], Palazzo Barberini, Rome; — the picture was acquired on 20 November 1636 from Leone Galli.
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/maffeo-barberini
    method: bequest
    direct: true
    place: rome
    label: Principe di Palestrina, his nephew; inventory of the Cardinal's bequests, 1672
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
        note: by inheritance to his nephew, Maffeo Barberini, Principe di Palestrina [d. 1685], Rome; — the inventory of his bequests of 1672 (Lavin 1975, 345 no. 230), according to which it was inherited by his nephew.
        source: nga-1952-5-28
        accessed: 2026-11-24
  - owner: person/urbano-barberini
    method: inheritance
    direct: true
    place: rome
    label: his son; posthumous 1686 inventory of Maffeo's legacy
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41638.html
