description_md: |-
  A monumental column of the Flagellation by [[artist/hans-witten|Master H.W. (Hans Witten)]], carved in 1510–1522 from oak and painted (polychrome); it is 4.43 m high and 1.20 m in diameter and stands in the [[institution/schlosskirche-chemnitz|Schlosskirche]] in Chemnitz, formerly the church of the Benedictine monastery there.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 40]] The German Wikipedia dates the column 1515 and lists it among the works attributed on grounds of style to the master, beside the branchwork portal of the same church (1504–1505).[[source/wikipedia-de-hans-witten|§ Leben und Namensgebung; § Werke]]

  ## Wood as subject

  The lecture "Aus dem Wald" showed the column in several views as its main example of Gregory C. Bryda's book *The Trees of the Cross: Wood as Subject and Medium in the Art of Late Medieval Germany* (2023).[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 38]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 40]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]] Bryda's subject is wood in relation to religious art in late medieval Germany, a period in which wood "embraced both multiple materials and multiple meanings" — as the material of artworks, as a feature of agrarian life and as a symbol of the Cross.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 39]] Of works like this he writes: "In so deliberately foregrounding woodiness in both subject and medium, the artists sought to render more immediate arboreal metaphors for Christ and the Arma Christi (instruments of the passion) that, while not new, had become more entrenched and pervasive in this period."[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]]

  The lecture contrasts this with Michael Baxandall: where Baxandall treats wood mainly as a potential that skilled carvers exploited, Bryda gives the material a central role in the meaning and function of the works, with a strong focus on the wood of the Cross and the Passion; the environmental and economic history of wood, however, remains outside his view too, and his concern is rather to embed the works in the visual and material culture of their time.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 32]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]] The column was shown again with the same quotation at the start of the second session.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 7]]
