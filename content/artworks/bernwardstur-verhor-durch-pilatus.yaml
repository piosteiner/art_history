description_md: |-
  The fifth field from the bottom on the right leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows Christ before Pilate.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 46]] With it the right leaf passes straight from Christ's childhood to the Passion; his public life is left to Bernward's bronze column.[[source/wikipedia-de-bernwardstur|§ Ikonografie]]

  Opposite it on the left leaf is God's interrogation of Adam and Eve; the lecture listed the two as a typological pair, "interrogation and condemnation of Adam and Eve" against "interrogation of Christ by Pilate".[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]]
