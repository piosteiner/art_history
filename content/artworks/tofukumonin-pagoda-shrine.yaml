description_md: The personal shrine of [[person/tofukumon-in]] (1607–1678), Tokugawa Kazuko, the granddaughter of Ieyasu married to [[person/emperor-go-mizunoo]]; with their marriage wealth flooded into the imperial court (Elizabeth Lillehoj). The inscription inside records that she worshipped before it every day and left it to the temple at her death. [[source/history-of-japanese-art|pp. 310–311, fig. 360]]
