  - owner: person/john-hope
    acquired: 1774-01-26
    method: purchase
    direct: true
    place: amsterdam
    label: seen by Sir Joshua Reynolds in the Hope Cabinet in 1781
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: sold 26 January 1774 to John Hope [1737-1784], Amsterdam;[1] — Van Dyck's painting was seen by Sir Joshua Reynolds in the Hope Cabinet in 1781
        source: nga-1942-9-88
        accessed: 2026-11-24
  - owner: person/john-hope
    role: estate
    acquired: 1784
    direct: true
    label: left to his three sons; administered by their mother Philippina Barbara van der Hoeven and Henry Hope; the paintings stayed undivided in the estate; Amsterdam and London
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: his estate, Amsterdam and London;[2] — [2] John Hope's estate, which was left to his three sons--Thomas [1769-1831], Adrian Elias [1772-1834] and Henry Philip [1774-1839]--was administered by the children's mother, Philippina Barbara van der Hoeven and their father's cousin, Henry Hope [1736-1811] … the collection of paintings was not divided, but remained in the estate.
        source: nga-1942-9-88
        accessed: 2026-11-24
  - owner: person/henry-hope
    role: custodian
    acquired: 1789
    ended: 1811
    place: london
    label: controlled the estate's paintings after the mother's death in 1789; took them from Amsterdam to London in 1794; insurance list of 17 December 1795, house at the corner of Harley Street
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: After the mother's death in 1789, Henry Hope assumed control of the collection of paintings in Amsterdam. … which was taken by Henry Hope to London in 1794 when he and other members of the family fled the invading French army … On December 17, 1795, he signed insurance lists of 'Pictures in the House No. 1 the corner of Harley Street, belonging to Mr. Henry Hope," … Included in the lists from catalogue B was "Van Dijck...Ascension of the Virgin...400,"
        source: nga-1942-9-88
        accessed: 2026-11-24
  - owner: person/thomas-hope
    role: custodian
    acquired: 1811
    place: london
    label: presumably held the paintings for Henry Philip Hope, at 2 Hanover Square and from 1819 in Duchess Street; seen in Thomas Hope's Cabinet by C. M. Westmacott, 1824
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: "After Henry Hope's death in 1811, possession of the collection presumably went to Thomas Hope, with whom it remained because of Henry Philip Hope's peripatetic life … NGA 1942.9.88 was seen in Thomas Hope's Cabinet by C.M. Westmacott (British Galleries of Painting and Sculpture, London, 1824: 228)."
        source: nga-1942-9-88
        accessed: 2026-11-24
  - owner: person/henry-philip-hope
    acquired: 1819 or earlier
    method: inheritance
    place: london
    label: youngest son of John Hope; sole heir of the paintings no later than 1819, for reasons unknown
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: by inheritance to his youngest son, Henry Philip Hope [1774-1839], London;[3] — [3] It is not clear when, and for what reason, Henry Philip Hope became the sole heir of the paintings, but he seems to have inherited the collection no later than 1819.
        source: nga-1942-9-88
        accessed: 2026-11-24
  - owner: person/henry-thomas-hope
    acquired: 1839
    method: inheritance
    direct: true
    place: london
    label: his nephew; London (Duchess Street until 1851, then Piccadilly) and Deepdene, near Dorking, Surrey
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1227.html
        note: by inheritance to his nephew, Henry Thomas Hope [1808-1862], London and Deepdene, near Dorking, Surrey;[4] — [4] Henry Thomas Hope maintained the property and its collections on Duchess Street until 1851, when he moved to a new residence in Piccadilly
        source: nga-1942-9-88
        accessed: 2026-11-24
