description_md: |-
  This intarsia panel by [[artist/mattia-di-nanni|Mattia di Nanni]] shows three heroes of Roman history, Manius Curius Dentatus, Pompey the Great (Magnus Pompeius) and Mettius Curtius [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 45]]. It comes from the [[artwork/mattia-di-nanni-ciclo-sala-del-consiglio|cycle for the Sala del Consiglio]] of the Palazzo Pubblico in Siena, made in 1426–1430 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 47]]. It is inlaid with walnut, oak, bog oak, fruit wood and bone, measures 105.4 × 212 × 3 cm and is in the [[institution/montreal-museum-of-fine-arts|Montreal Museum of Fine Arts]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 45]].

  The lecture showed the panel together with a view of the council hall for which the cycle was made [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45–47]]. The dark bog oak in the panel was explained in the lecture's survey of the intarsia palette: oak that has lain in peat bogs, where tannins reacting with iron turn it dark brown to black [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]]. A single figure from the same cycle, [[artwork/mattia-di-nanni-scipio-met|Scipio Africanus]], is in New York [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 48]].
