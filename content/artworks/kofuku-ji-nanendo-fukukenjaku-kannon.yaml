public_id: 107535
title: Fukūkenjaku Kannon, Nan’endō, Kōfukuji
creator: kokei
created: 1189
kind: sculpture
medium: Wood with paint and gold leaf, inlaid eyes
materials: [wood, gold leaf, rock crystal]
dimensions: [336]
institution: kofuku-ji
description_md: "The main image of the South Octagonal Hall of Kōfukuji, made by [[artist/kokei]] in 1189 to replace the original of 746, lost when the Taira burnt the temple in 1180. In style it stands between Jōchō’s Amida and Unkei’s Miroku: the proportions are close to Jōchō’s, but the eyes are of crystal, the urna of rock crystal and the carving of face and drapery deeper — a graceful reworking of the mid-Heian style. Kōkei, active 1175–1200, organized his son and disciples into the Kei school. [[source/history-of-japanese-art|pp. 188–189, fig. 217]]"
