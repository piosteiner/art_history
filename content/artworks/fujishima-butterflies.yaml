description_md: "A representative work of [[artist/fujishima-takeji]] (1867–1943), Kuroda’s assistant at the Tokyo Bijutsu Gakkō: a young girl kissing a flower, highlighted against deep blue amid a swarm of butterflies — some shading for face and hands, but flat and two-dimensional overall, a modern work drawing on Japan’s decorative tradition. (Mason’s caption dates it 1906, his text 1904.) [[source/history-of-japanese-art|p. 376, fig. 448]]"
