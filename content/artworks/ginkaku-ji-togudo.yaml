description_md: A single-storied building with a hipped-gable roof, completed in 1486 after the western Amida hall of Saihōji, at [[person/ashikaga-yoshimasa]]’s retreat. Its interior shows the features of the later [[shoin-zukuri]] — staggered shelves ([[chigaidana]]), a desk alcove ([[tsuke-shoin]]) and sliding [[shoji]] — and its Dōjinsai is the room where the ideas of the tea master [[person/murata-juko]] (1423–1502) on [[chanoyu]] were first expressed. [[source/history-of-japanese-art|pp. 231–233, figs. 266, 268]]
