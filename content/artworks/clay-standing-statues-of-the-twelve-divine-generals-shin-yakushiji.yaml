provenance:
  - owner_label: Iwabuchi-dera, foot of Mt Takamado (tradition)
    acquired: 729/749
    method: creation
    place: nara
    label: made in the Tenpyō era (ink inscription 'Tenpyō' on a pedestal board); a tradition says they were moved from Iwabuchi-dera — how they were made is not known
    certainty: possible
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/232
        note: "年代 ： 729～749 … 附名称 : 木造台座裏桟 附員数 : 二枚 附ト書 : 各に天平の墨書がある"
        source: kunishitei-201-232
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E6%96%B0%E8%96%AC%E5%B8%AB%E5%AF%BA&oldid=110015429
        note: これらの像は高円山麓にあった岩淵寺から移されたとする伝承もあるが、造立の事情は明らかでない。作風や、12躯のうち1躯の台座裏桟から「天平」云々の墨書が見出されたことなどから、天平期の作と見なされている。
        source: jawiki-shin-yakushiji
        accessed: 2026-11-24
  - owner: institution/shin-yakushiji
    place: nara
    label: round the main image in the Main Hall; one of the twelve (Kubira) fell in an earthquake late in the Edo period, replaced 1931 by Hosoya Jiraku and not designated
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/232
        note: 員数 ： 11躯 … 所有者名 ： 新薬師寺
        source: kunishitei-201-232
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E6%96%B0%E8%96%AC%E5%B8%AB%E5%AF%BA&oldid=110015429
        note: 12躯のうちの1躯（宮毘羅（くびら）大将像、寺伝では波夷羅（はいら）大将像）のみは江戸時代末期の地震で倒壊し、1931年（昭和6年）に細谷而楽が補作したもので、国宝指定外である
        source: jawiki-shin-yakushiji
        accessed: 2026-11-24
