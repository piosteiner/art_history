description_md: "This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows Joseph's dream and the Flight into Egypt.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 93]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] Richard Hamann compared the Flight into Egypt with the Last Supper on the right leaf to separate two carvers of one workshop: one modelling his figures fully and in detail, the other – Hamann's \"master of the parallel figures\" – working with clear structure and vertical lines.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]"
