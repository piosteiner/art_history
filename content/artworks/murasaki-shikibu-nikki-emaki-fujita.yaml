description_md: Illustrations to the diary of [[person/murasaki-shikibu]], lady-in-waiting to Empress Shōshi. In this scene the empress’s father, [[person/fujiwara-no-michinaga]], stands on the veranda of his mansion watching two elaborate boats on the lake, prepared for the festivities at the birth of his grandson, the imperial heir. [[source/history-of-japanese-art|p. 108, fig. 134]]
