description_md: "Painted by Velázquez in the late 1650s: in the foreground women spin wool in a tapestry workshop; behind, the helmeted Pallas (Minerva) contends with Arachne before a tapestry of the rape of Europa after Titian — the fable from Ovid that ends with Arachne turned into a spider[[source/prado-las-hilanderas|dated 1655–1660 · „la diosa Palas, armada con casco, discute con Aracne, compitiendo sobre sus respectivas habilidades en el arte de la tapicería. Tras ellas se encuentra un tapiz que reproduce El rapto de Europa que pintó Tiziano para Felipe II“ · „que sirvieron a Palas de excusa para convertirla en araña“]]. It was long read as an everyday scene in a tapestry workshop; an inventory of 1664 naming a *Fábula de Aracne* by Velázquez confirmed the myth[[source/prado-las-hilanderas|„durante mucho tiempo los espectadores del cuadro han visto en él exclusivamente la representación de una escena cotidiana en un taller de tapicería“ · „el inventario de bienes de don Pedro de Arce … Fue realizado en 1664, y en él se cita una Fábula de Aracne realizada por Velázquez“]]."
