description_md: A cosmetic box with a hempen core under layers of black lacquer, decorated in [[maki-e]] — gold powder sprinkled onto the damp lacquer — and with inlaid mother-of-pearl ([[raden]]). Its motif, half-submerged wooden cartwheels left to soak in a stream so that they would not dry out and crack, is purely Japanese in concept and drawn from poetic imagery. [[source/history-of-japanese-art|p. 106, fig. 130]]
