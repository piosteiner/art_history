description_md: "From one of the most elaborate illustrated lives of [[person/honen]] (1133–1212), founder of the Jōdo sect: originally forty-eight scrolls compiled over ten years from 1307, edited by the Mount Hiei priest Shunshō at the request of the retired emperor Go Fushimi, with calligraphy by eight men of the court. Hōnen, his back to the wall in a temple room, inscribes a copy of his portrait for his disciple [[person/shinran]], who kneels before him. A document of events rather than a gripping narrative. [[source/history-of-japanese-art|pp. 201–203, fig. 234]]"
