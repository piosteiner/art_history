provenance:
  - owner: institution/san-niccolo-oltrarno-florence
    acquired: 1417/1426
    ended: c. 1800
    method: creation
    place: florence
    label: altarpiece of the Guardini chapel (founded by Michele Guardini's will of 1417); moved c. 1567 and 1576 to the sacristy; removed from the church by c. 1800
    sources:
      - url: https://www.nga.gov/collection/art-object-page.18.html
        note: Painted to serve as the altarpiece of the Guardini chapel on the left side of the rood screen in the church of San Niccolò Oltrarno, Florence, and probably in place by 1426;[1] transferred by c. 1567 (the date of the demolition of the rood screen) to the altar of the other chapel of the Guardini family in the same church; moved 1576 to the Sacristy (and replaced by the Annunciation altarpiece newly painted by Alessandro Fei);[2] in a room annexed to the sacristy, probably until the end of the eighteenth century.[3]
        source: nga-1937-1-16
        accessed: 2026-11-24
