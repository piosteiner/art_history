description_md: |-
  The "precious gospel book" (Kostbares Evangeliar) is a richly decorated gospel book in the [[institution/dommuseum-hildesheim|Hildesheim Cathedral Museum]], given by Bishop [[person/bernward-of-hildesheim|Bernward of Hildesheim]] to his foundation of St. Michael, for the altar of Mary in the crypt below the west choir, which was consecrated in 1015 and which he had chosen as his tomb.[[source/wikipedia-en-rich-bernward-gospels]] It has 232 parchment leaves of 28 × 20 cm and contains the Vulgate text of the four gospels with prefaces and a pericope list.[[source/wikipedia-en-rich-bernward-gospels|§ Contents and decoration]] The lecture gives it as parchment, 28 × 20 cm, Hildesheim, Dom- und Diözesanmuseum, DS 18, and showed fol. 16v–17r.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 65]]

  ## Binding

  The cover consists of two oak boards decorated with images, silver mounts and gems; already costly when Bernward had it made, it was further adorned at the time of his canonisation in the 12th century.[[source/wikipedia-en-rich-bernward-gospels|§ Contents and decoration]] At the centre of the front cover is a Byzantine ivory with Christ between Mary and John the Baptist (a Deesis), surrounded by prayers that name Bernward, as do those on the back, which shows Mary with the Christ Child.[[source/wikipedia-en-rich-bernward-gospels|§ Contents and decoration]]

  ## Dedication image

  The most important miniature is the two-page dedication image (fol. 16v–17r): in an arcaded space Bernward stands in liturgical vestments beside an altar prepared for the Eucharist and offers the book to the Mother of God, who sits frontally on the right, is crowned by angels as Nikopoia and holds her son, shown as a small adult, on her lap; the inscription names Bernward with pious and humble words.[[source/wikipedia-en-rich-bernward-gospels|§ Contents and decoration]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 65]] In the lecture this image – "Bernward presents the precious gospel book to Mary and Christ" – stood in the discussion of the [[artwork/bernwardstur|Bernward door]] as gates of paradise, followed by two Latin verses on Mary as the gate of paradise, which Eve had closed and Mary opened to all.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 65]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 66]]

  ## Other decoration

  Each gospel has three or four miniatures; the last in each shows the evangelist's symbol, while the others are devoted to the theme of salvation history that church writers (Gregory the Great, Alcuin) assigned to each evangelist – incarnation (Matthew), resurrection (Mark), death as redeeming sacrifice (Luke), ascension (John). The initials are richly decorated as well.[[source/wikipedia-en-rich-bernward-gospels|§ Contents and decoration]]
