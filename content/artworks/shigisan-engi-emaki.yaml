description_md: A twelfth-century narrative scroll in three parts, the legends of the temple on Mount Shigi. In the last part an elderly nun travels to Nara to pray before the Great Buddha for news of her brother; this scene shows the Daibutsuden before it burnt in 1180 and gives an idea of how it looked. [[source/history-of-japanese-art|p. 69, fig. 79]]
