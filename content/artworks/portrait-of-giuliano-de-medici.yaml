        note: Grand Duke Ferdinand I de' Medici [1551-1609], Florence.[1] — The emblem of the queen bee surrounded by her subjects, visible on the reverse of the painting, appears also on the reverse of a medal made by Michele Mazzafirri for Grand Duke Ferdinand I de' Medici in 1588
        source: nga-1952-5-56
