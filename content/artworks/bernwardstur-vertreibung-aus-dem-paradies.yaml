description_md: |-
  The fifth field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows Adam and Eve being driven out of paradise.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 37]] The lecture paired it with the presentation of Christ in the Temple on the opposite leaf.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] It returned to this relief several times, showing it in detail and setting beside it two Latin verses on the gate of paradise: "PORTA PARADISI PRIMEVAM CLAVSA PER AEVAM: NVNC EST PER S(AN)C(T)AM CVNCTIS PATEFACTAM MARIA(M)" – the gate of paradise, closed by the first Eve, is now opened to all by holy Mary – and "AVE PORTA DEI POST PARTV(M) CLAVSA P(ER) EVV(M)" – hail, gate of God, closed for ever after the birth.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 60]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 61]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 66]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 67]] With them the lecture read the bronze leaves themselves as gates of paradise.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]]

  The scene had a place in the liturgy: according to the Hildesheim ordinal of 1473 the public penitents were expelled from the church on Ash Wednesday, after which the bishop and clergy left the cathedral barefoot through the bronze doors and returned through them; the expulsion of the first parents from paradise already prefigures this rite in the door's programme.[[source/wikipedia-de-bernwardstur|§ Liturgische Bedeutung]]
