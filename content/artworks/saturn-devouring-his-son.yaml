description_md: |-
  One of the Black Paintings Goya painted on the walls of his house outside Madrid, the Quinta del Sordo, in 1820–23, on the ground floor[[source/prado-saturn|“It occupied the wall across from Leocadia Zorrilla on the ground floor of “la Quinta del Sordo.”” · dated 1820–1823]]: the Titan Saturn, who devoured his children for fear that one of them would overthrow him[[source/prado-saturn|“This mythological god could be the personification of such a human feeling as the fear of losing one´s power”]].

  [Francisco Goya: Was steckt hinter seiner düsteren Kunst? | Die Geheimnisse der Meisterwerke | ARTE](https://www.youtube.com/watch?v=ZyEJL9Xx28M)
