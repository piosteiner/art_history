description_md: "*Schwarzwald* by [[artist/hermann-gradl|Hermann Gradl]] (1937 or earlier) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; photographed by Heinrich Hoffmann ([Bayerische Staatsbibliothek, Bildarchiv hoff-70483](https://bildarchiv.bsb-muenchen.de/fylr/L/4627ed8c-922f-4292-b8e0-f47541878baa)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Landscapes and peasant scenes, Schlenker writes, stood for the regime's \"blood and soil\" ideology.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]"
