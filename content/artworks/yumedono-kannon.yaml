description_md: A [[kannon]] carved from a single piece of camphor wood and covered with gold leaf, kept in the octagonal Yumedono (Hall of Dreams) of Hōryūji, built in the eighth century to honour Prince Shōtoku. Hidden for centuries in a closed shrine, it was opened for Ernest Fenollosa in the late nineteenth century and is therefore unusually well preserved. [[source/history-of-japanese-art|p. 75, fig. 89]]
