    label: Asuka period; kept in the Yumedono (Hall of Dreams, eastern precinct) as a hidden image in a closed shrine until opened for Ernest Fenollosa and Okakura Kakuzō (1884); the temple is the owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/183
        note: 木造観音菩薩立像（夢殿安置） … 時代 ： 飛鳥 … 所有者名 ： 法隆寺
        source: kunishitei-201-183
        accessed: 2026-11-24
      - note: The Yumedono sculpture has always been one of the most treasured images at Hōryūji, and was hidden away for so many years in a closed wooden shrine that even the monks of the temple had lost memory of it. The shrine was opened in the late nineteenth century on the occasion of a visit by the American scholar Ernest Fenollosa … 89 Yumedono Kannon, in the Yumedono (Hall of Dreams), Hōryūji, Ikaruga, Nara prefecture. Early 7th century. … A similar hall, also dating to the early eighth century, the Yumedono, or Hall of Dreams, was built at Hōryūji to honor Prince Shōtoku and today houses the Yumedo
        source: history-of-japanese-art
        locator: p. 74, fig. 89; pp. 66–67
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E6%95%91%E4%B8%96%E8%A6%B3%E4%B8%96%E9%9F%B3%E8%8F%A9%E8%96%A9&oldid=110443976
        note: 法隆寺の救世観世音菩薩像は、200年間公開されていなかった厳重な秘仏で、1884年（明治17年）、国から調査の委嘱を受けたアーネスト・フェノロサが、夢殿厨子と救世観音の調査目的での公開を寺に求め、長い交渉の末、公開されたものである。
        source: wikipedia-ja-guze-kannon
        accessed: 2026-11-24
