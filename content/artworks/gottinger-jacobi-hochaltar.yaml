description_md: |-
  The winged high altarpiece of the church of St. Jacobi in Göttingen, made in 1402 by unknown artists; it stands in the choir of the church.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 27]][[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]] It is the most important treasure of the church and of more than regional significance.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]][[source/wikipedia-de-st-jacobi-gottingen|§ introduction]]

  ## Three views

  The altarpiece has two pairs of wings and so three views for different days.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]]

  - **Everyday side (closed):** eight scenes from the legend of Saint James the Greater, patron of the church.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 28]]
  - **Sunday side (first opening):** sixteen scenes from the childhood and Passion of Christ.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 29]]
  - **Feast-day side (fully open):** the Coronation of the Virgin as Queen of Heaven among saints.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 30]]

  ## Context

  The church, a Gothic hall church, was built from 1361 to 1433; its patron, James the Greater, is the patron of pilgrims, and the church lay on the Way of St James that runs through the Weender Strasse.[[source/wikipedia-de-st-jacobi-gottingen|§ introduction]][[source/wikipedia-de-st-jacobi-gottingen|§ Geschichte]] In the lecture the Göttingen altarpiece stood in a sequence on the "logic of the shrine" – the housing and unveiling of the holy – that led from Mosan and ivory shrines through the high altarpieces of Doberan (around 1300) and Marienstatt (around 1350) to the great Late Gothic retables.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 21–30, 35]] A monograph on the altarpiece was edited by Bernd Carqué and Hedwig Röckelein in 2005.[[source/wikipedia-de-st-jacobi-gottingen|§ Literatur]]
