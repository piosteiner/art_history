description_md: "A diptych by [[artist/torii-kiyonaga]] of a public bathhouse — a mother washing her child, women chatting as they rinse, the head of the proprietor above. A copy of it hung in the bedroom of Edgar Degas, who admired its spatial dissonances: the oblique floorboards lead the eye deep into the room, the figures in an asymmetrical pattern around a recess. [[source/history-of-japanese-art|pp. 285–286, fig. 324]]"
