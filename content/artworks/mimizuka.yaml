description_md: 'The "ear mound" in Kyoto: the ears and noses of thousands of Koreans killed in the [[event/japanese-invasions-of-korea]] — whole heads were too much to carry, so ears and noses were pickled and brought back. A stupa on top was to bring the dead peace, so they would not haunt the Japanese. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]]'
