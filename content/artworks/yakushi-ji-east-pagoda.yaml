description_md: "The only building of Yakushiji left from its early eighth-century construction: a three-storeyed pagoda with a [[mokoshi]] at each level, so that it seems to have six — more stable and more buoyant than the pagoda of Hōryūji, with three-stepped brackets and latticed ceilings that let more light under the eaves. [[source/history-of-japanese-art|p. 67, fig. 76]]"
