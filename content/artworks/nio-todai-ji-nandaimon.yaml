description_md: The two gigantic [[nio]], Agyō and Ungyō, both about 8.5 metres tall, installed in 1203 in the outermost bays of the Nandaimon — a collaboration of [[artist/unkei]] and [[artist/kaikei]] made in seventy-two days with two other masters and sixteen assistants, a testimony to the efficiency of the Kei studio and of [[yosegi-zukuri]]. They stand in hip-slung poses as if they had just stepped out to meet a danger, their scarves and skirts sweeping behind; unusually they face each other across the gate, perhaps since an eighteenth-century restoration. [[source/history-of-japanese-art|pp. 187–188, fig. 216]]
