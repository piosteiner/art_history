description_md: The two colossal guardian kings flanking the Great South Gate of Tōdai-ji, Unkei's most famous work[[source/kobayashi-1954-unkei|“As the creator of the famous statues of the Giant Devas flanking the South Gate of Todai-ji Temple, Nara, his fame is still nation wide among the Japanese people”]]. Unkei made them with [[artist/kaikei]] and sixteen assistants between 24 July and 3 October 1203[[source/kobayashi-1954-unkei|“The last and the most famous of his works in Todai-ji Temple began on July 24, 1203, and was finished on Oct. 3 of the same year. It was the erection of the statues of Giant Devas, flanking the South Gate, which Unkei made in collaboration with Kaikei and 16 artisans”]], part of the rebuilding of the temple after the Genpei War[[source/tnm-unkei-exhibition-2017|“in 1203 (Kennin 3) he fashioned a pair of enormous Vajra Warriors for Todaiji temple” · “the central role Unkei played in the restoration of Nara temples such as Kohfukuji and Todaiji in the wake of their destruction by the Taira forces during the Genpei Wars”]].
