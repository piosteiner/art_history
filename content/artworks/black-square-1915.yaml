description_md: The starting point of art from nothing — in line with the new power after 1917. After 1924 Malevich lost his state positions; in the 1930s he gave up abstraction and painted peasants in traditional dress, still in a Futurist-Cubist form. When he died, Daniil Kharms wrote *On the Death of Malevich* [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]].
