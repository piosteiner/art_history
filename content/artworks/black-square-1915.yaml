description_md: |-
  [[artist/kazimir-malevich|Kazimir Malevich]]'s *Black Square* of 1915 is the first of four painted versions; he called it his breakthrough and the beginning of [[movement/suprematism|Suprematism]] [[source/wikipedia-en-black-square|introduction]].

  ## Origin and making

  Malevich first used the motif of a black square in his designs for the opera *Victory over the Sun*, staged in Saint Petersburg on 3 December 1913 [[source/wikipedia-en-black-square|§ Conception]]. He painted the 1915 version in broad strokes of thick black oil paint on a linen canvas of 79.5 × 79.5 cm, with the border in shades of white and grey [[source/wikipedia-en-black-square|§ Composition]]. The inscription "1913" on the back probably refers to the design for the opera [[source/wikipedia-en-black-square|§ Composition]]. X-rays made in 2015 found two earlier compositions underneath, a Cubo-Futurist and a "proto-Suprematist" one, and an inscription that may allude to a black joke-picture by the French humorist Alphonse Allais (1897) [[source/wikipedia-en-black-square|§ Composition]].

  The painting was first shown in December 1915 at the Last Futurist Exhibition *0,10* in Petrograd, among 39 abstract works by Malevich, hung high in the corner of the room where icons hang in Russian homes [[source/wikipedia-en-kazimir-malevich|§ Last Futurist Exhibition 0,10 (1915)]]. Malevich called it the "zero point of painting" [[source/wikipedia-en-black-square|introduction]].

  ## Art from nothing

  In the seminar the *Black Square* was the starting point of art from nothing — in line with the new power after 1917 [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. Boris Groys reads it the same way: Suprematism arises from removing every remnant of traditional representation from the picture, leaving the *Black Square* as a sign of pure nonobjectivity [[source/groys-1994|p. 148]]. For the Russian avant-garde, he argues, creativity was no longer the addition of something to what exists but the deletion of something from it, so that for Malevich destruction coincided with creativity [[source/groys-1994|p. 149]]. In his essay "On the Museum" Malevich even asked the authorities not to hinder the ruin of old art, proposing to burn it [[source/groys-1994|pp. 147–149]]. Yet Groys sees in the insistence of Malevich and the constructivists on the material "thingness" of their works a "museum art par excellence" [[source/groys-1994|p. 149]].

  ## Versions

  Malevich painted three more versions: around 1923, about 1929 for his solo exhibition — perhaps to stand in for the original, already in poor condition — and a last, smallest one, probably for the exhibition *Artists of the RSFSR: 15 Years* in Leningrad in 1932, where it hung with a *Red Square* [[source/wikipedia-en-black-square|§ Versions]].

  ## Under Stalin

  After 1924 Malevich lost his state positions; in the 1930s he gave up abstraction and painted peasants in traditional dress, still in a Futurist-Cubist form [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. Malevich was arrested for several days in 1930, and his work was banned in the USSR shortly after his death in 1935 [[source/wikipedia-en-black-square|§ Censorship]]. On his deathbed he lay under the *Black Square*, and mourners carried a banner with a black square [[source/wikipedia-en-kazimir-malevich|§ Death]]. When he died, Daniil Kharms wrote *On the Death of Malevich* [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 3 December 2024]]. The *Black Square* was not shown again until the 1980s and is in poor condition, partly because it was hidden and neglected under Stalin [[source/wikipedia-en-black-square|§ Censorship]] [[source/wikipedia-en-black-square|§ Condition]].
