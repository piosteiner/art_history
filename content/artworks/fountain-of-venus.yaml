provenance_status_note: Confiscated from Maurice de Rothschild's Paris mansion by the ERR on 6 September 1940 (ERR no. R 252), selected for Hitler's Linz collection (Linz no. 1583); its path from the Thürntal repository back to the Rothschild family is unknown.
