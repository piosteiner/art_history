description_md: |-
  [[artist/gustave-courbet|Gustave Courbet]]'s *Stone Breakers* exist in two versions. The large picture, begun in November 1849 after Courbet had seen two men breaking stones on the road near Maisières, caused a sensation at the Paris Salon of 1850–1851; it was bought for the Gemäldegalerie Alte Meister in Dresden around 1882 and was lost in 1944/45.[[source/wikipedia-en-the-stone-breakers|§ History; § Reception]] A smaller version, with the same composition reversed and possibly painted later, is in the Oskar Reinhart Collection «Am Römerholz» in Winterthur.[[source/bundessammlungen-sor1923-15|description]]

  - Version 1: [[artwork/the-stone-breakers|Dresden, Gemäldegalerie Alte Meister]] (war loss)
  - Version 2: [[artwork/courbet-die-steinklopfer-winterthur|Winterthur, Sammlung Oskar Reinhart «Am Römerholz»]], c. 1849, 56 × 65 cm[[source/bundessammlungen-sor1923-15|record]]

  A copy of the large picture by [[artist/l-schunzel|L. Schünzel]], 1926/27, 85 × 121 cm, is in the Albertinum in Dresden: [[artwork/schunzel-die-steinklopfer-kopie-nach-courbet|*Die Steinklopfer (Kopie nach Gustave Courbet)*]].[[source/skd-online-collection-189729|record]]
