description_md: |-
  The Lichtenstein Crucifix comes from south-west Germany and dates from the mid-eleventh century; its corpus is of poplar, the upright of the cross of oak and the crossbeam of fir, the corpus 98.2 cm and the cross 131 cm high.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 19]] It is in the Landesmuseum Württemberg in Stuttgart as a permanent loan (L 1977-100) from the Duke of Urach, Schloss Lichtenstein.[[source/endemann-2020-wood-carving-and-staffering|p. 145]] Klaus Endemann lists it as Alemannic, 1040.[[source/endemann-2020-wood-carving-and-staffering|p. 147]]

  The figure is solid; because the pith of the poplar trunk was left in the work, the shrinkage opened one or two gaping cracks.[[source/endemann-2020-wood-carving-and-staffering|p. 148]] [[source/endemann-2020-wood-carving-and-staffering|p. 163]] It is the only known crucifix whose arm pegs were originally round; when the arms were refitted — presumably after the cross entered the Urach collection in the nineteenth century — the rotten armholes were cut off with the thick round pins.[[source/endemann-2020-wood-carving-and-staffering|p. 159]] Traces of paring tools of different sizes remain, and a V-shaped tool (*Gaißfuß*) has been suggested for the beard, though worn surfaces leave this uncertain.[[source/endemann-2020-wood-carving-and-staffering|pp. 170–171]] A white primer has been suspected; the report describes a glue-gypsum base, but whether the "deep black" layer beneath it is original remains highly uncertain.[[source/endemann-2020-wood-carving-and-staffering|p. 174]] The lecture showed it beside a Cologne crucifix of about 1050 in the Liebieghaus, Frankfurt.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 19]]
