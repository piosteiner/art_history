    label: by tradition the private devotional image (nenjibutsu) of Lady Tachibana (Tachibana no Michiyo), mother of Empress Kōmyō
    certainty: possible
    sources:
      - url: https://www.mlit.go.jp/tagengo-db/en/R1-00187.html
        note: Lady Tachibana was the mother of Empress Komyo (701–760) … Lady Tachibana may have prayed before this wooden altar-shrine … 橘三千代（橘夫人、生年不詳～733年）… この木製の厨子を拝んでいたのが橘三千代とされている。
        source: jta-r1-00187
        accessed: 2026-11-24
