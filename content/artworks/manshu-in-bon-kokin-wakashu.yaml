  - owner_label: Unknown scribe (traditionally Fujiwara no Yukinari)
    acquired: 11th century
    method: creation
    label: Kokin wakashū, book 17 only, copied in the 11th century; traditionally attributed to Fujiwara no Yukinari
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=曼殊院本古今和歌集&oldid=107193839
        note: 巻第十七のみの残巻である。巻子本。書写は11世紀と推定される。伝称筆者は藤原行成。
        source: jawiki-manshuin-bon-kokin-wakashu
        accessed: 2026-11-24
  - owner: person/emperor-sutoku
    label: "'the book of the Shin-in' (Retired Emperor Sutoku), per the colophon of 1299"
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=曼殊院本古今和歌集&oldid=107193839
        note: 新院御本自勝浄 僧正至勝穢十三代相伝 其後為妻女被譲畢 正安第一之暦孟秋初日之候 右金吾記 … 新院は崇徳院で、正安元年（1299年）の8月に右金吾（右衛門督）だったのは藤原嗣実である。…崇徳院から勝浄に渡り勝穢まで13代相伝、その後嗣実夫人に譲られたことが分かる。
        source: jawiki-manshuin-bon-kokin-wakashu
        accessed: 2026-11-24
  - owner_label: Sōjō Shōjō and his successors to Shōe (13 generations)
    method: inheritance
    direct: true
    label: passed from Sutoku to the priest Shōjō and handed down for thirteen generations to Shōe
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=曼殊院本古今和歌集&oldid=107193839
        note: 新院御本自勝浄 僧正至勝穢十三代相伝 其後為妻女被譲畢 正安第一之暦孟秋初日之候 右金吾記 … 新院は崇徳院で、正安元年（1299年）の8月に右金吾（右衛門督）だったのは藤原嗣実である。…崇徳院から勝浄に渡り勝穢まで13代相伝、その後嗣実夫人に譲られたことが分かる。
        source: jawiki-manshuin-bon-kokin-wakashu
        accessed: 2026-11-24
