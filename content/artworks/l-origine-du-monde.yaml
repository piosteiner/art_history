    role: dealer
    acquired: 1912
    ended: 1913-06-16
    place: paris
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: de 1912 à 1913, galerie Bernheim-Jeune
