provenance:
  - owner: person/khalil-bey
    acquired: 1866
    method: commission
    place: paris
    label: commissioned for his private collection of erotic paintings (with Courbet's Sleep, also bought in 1866); not in his sale of 1868 — perhaps taken to Constantinople, back in Paris with it in 1877
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: collection Khalil-Bey
        source: musee-d-orsay-collections
        accessed: 2026-10-20
      - url: https://fr.wikipedia.org/wiki/L%27Origine_du_monde
        note: Présenté par Sainte-Beuve à Courbet, il commande une toile à ce dernier pour sa collection personnelle de tableaux érotiques […] Courbet lui vend simultanément, en 1866, Le Sommeil et L'Origine du monde […] Certains supposent qu'il conserve L'Origine du monde et qu'il l'emporte à Constantinople. […] revient à Paris avec son tableau en 1877.
        source: wikipedia-fr-origine-du-monde
        accessed: 2026-10-20
  - owner_label: Antoine de La Narde, antique dealer
    role: dealer
    place: paris
    label: seen at his shop by Edmond de Goncourt
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: galerie Antoine de La Narde
        source: musee-d-orsay-collections
        accessed: 2026-10-20
