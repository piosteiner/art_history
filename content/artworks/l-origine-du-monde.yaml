    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: 1995, accepté par l'Etat à titre de dation en paiement de droits de succession pour les Musées nationaux (comité du 12/01/1995, conseil du 18/01/1995, commission interministérielle d'agrément du 07/03/1995, décision du Ministre du Budget du 10/05/1995, arrêté du 13/06/1995) 1995, attribué au musée d'Orsay, Paris
        source: musee-d-orsay-collections
