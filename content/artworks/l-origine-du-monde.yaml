  - owner: person/mor-lipot-herzog
    acquired: 1913-06-16
    method: purchase
    direct: true
    place: budapest
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: 1913, dans la collection du baron Herzog, vendu par Bernheim le 16 juin 1913
        source: musee-d-orsay-collections
        accessed: 2026-10-20
  - owner: person/ferenc-von-hatvany
    method: purchase
    direct: true
    place: budapest
    label: bought from Herzog in Budapest; in 1944 hidden with 70 of his works in bank vaults under the names of trusted Hungarians, Hatvany being Jewish
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: collection du baron Ferenc Hatvany
        source: musee-d-orsay-collections
        accessed: 2026-10-20
      - url: https://fr.wikipedia.org/wiki/L%27Origine_du_monde
        note: il cède l'Origine du monde à son compatriote le baron François de Hatvany. […] L'Origine du monde, figure parmi 70 œuvres de la collection du baron déposées dans des coffres de banques, sous les noms d'emprunt de Hongrois de confiance, car Hatvany est juif.
        source: wikipedia-fr-origine-du-monde
        accessed: 2026-10-20
  - owner_label: Soviet troops
    role: possessor
    acquired: 1945
    ended: 1946
    method: theft
    place: budapest
    label: the banks plundered when the Red Army took Hungary; the painting went east — in summer 1946 a man calling himself Hungarian offered Hatvany to buy back some ten of his paintings, this one among them
    sources:
      - url: https://fr.wikipedia.org/wiki/L%27Origine_du_monde
        note: quand les Russes envahissent la Hongrie au début de 1945, les banques du pays sont totalement pillées. L'Origine du monde part à l'est. À l'été 1946, un homme, se disant hongrois, vient trouver le baron Hatvany […] et lui propose de racheter une partie de sa collection (une dizaine de tableaux). Parmi eux figure L'Origine du monde
        source: wikipedia-fr-origine-du-monde
        accessed: 2026-10-20
  - owner: person/ferenc-von-hatvany
    further_places: [paris]
    acquired: 1946
    ended: 1955
    method: purchase
    place: budapest
    label: bought back; it went with him to Paris
    sources:
      - url: https://fr.wikipedia.org/wiki/L%27Origine_du_monde
        note: Parmi eux figure L'Origine du monde, qui l'accompagne lorsqu'il rejoint Paris avec sa famille.
        source: wikipedia-fr-origine-du-monde
        accessed: 2026-10-20
  - owner: person/jacques-lacan
    co_owners: [person/sylvia-bataille]
    acquired: 1955
    ended: 1981
    method: purchase
    place: guitrancourt
    label: in their country house at Guitrancourt, behind a sliding panel painted by André Masson (Terre érotique)
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/lorigine-du-monde-69330
        note: à partir de 1955, dans la collection Jacques Lacan
        source: musee-d-orsay-collections
        accessed: 2026-10-20
      - url: https://fr.wikipedia.org/wiki/L%27Origine_du_monde
        note: Avec l'actrice Sylvia Bataille, il en fait l'acquisition en 1955 pour l'installer dans sa maison de campagne de Guitrancourt dans les Yvelines. […] le psychanalyste demande à André Masson, son beau-frère, de construire un cadre à double fond et de peindre une autre œuvre par-dessus.
        source: wikipedia-fr-origine-du-monde
        accessed: 2026-10-20
  - owner_label: Lacan's heirs (a private collection)
    acquired: 1981
    ended: 1995
    method: inheritance
    direct: true
