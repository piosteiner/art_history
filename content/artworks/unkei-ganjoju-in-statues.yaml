description_md: Five statues — Amida with two attendant bodhisattvas, Fudō and Bishamon — carved in 1186 for the warrior Hōjō Tokimasa, who prayed for the success of his campaign to the north-east; two inscribed plates name Unkei beside Tokimasa[[source/kobayashi-1954-unkei|“Statues of Amida with two waiting Sattvas, and those of Fudo and of Bishamon and two inscribed plates, attached to the two latters, still remain, dated 1186, at Ganjoju-in Temple, in Izu Province. They were made on the commission of Hojo Tokimasa, praying for the success of his North-eastern expedition.” · “he had his name written on these plates side by side with that of Hojo Tokimasa”]]. Unkei's own style appears here for the first time, already mature; they are his first work for the Kamakura shogunate[[source/tnm-unkei-exhibition-2017|“Unkei’s original style can be observed for the first time in a set of five sculptures he carved for Ganjojuin temple in Shizuoka in 1186 (Bunji 2) at the order of the warrior Hojo Tokimasa. Judging from the quality of these images, it would appear that Unkei’s artistic style had already matured fully by this time”]][[source/kobayashi-1954-unkei|“these statues were his first work, made on the commission of the Kamakura Shogunate”]].
