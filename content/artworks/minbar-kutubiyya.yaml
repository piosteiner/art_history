description_md: |-
  The minbar (pulpit) of the Kutubiyya Mosque in Marrakesh was made in Córdoba in 1137–1144 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 36]]. Its wooden structure is of cedar and oak, 3.86 m high and 3.46 m deep, with inlays of African blackwood (Dalbergia), jujube (Ziziphus), padauk (Pterocarpus), boxwood and bone [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 36]]. It is now in the [[institution/el-badi-palace|El Badi Palace]] in Marrakesh [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 36]].

  The lecture showed it in its section on the history and technique of intarsia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 34–37]]. The word intarsia derives from Italian "tarsia", inlay, which goes back to the Arabic tarṣīʿ, incrustation [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]]. Marta Ajmar notes that the immediate antecedents of Italian Renaissance intarsia are usually sought in Islamic Spain, where wood inlay was used for important commissions such as minbars as well as for many smaller objects; she refers to the study of this minbar by Jonathan M. Bloom and others (1998) [[source/ajmar-2024-reciprocal-design|p. 28]].
