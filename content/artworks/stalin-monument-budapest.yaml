description_md: |-
  The Stalin Monument in [[place/budapest|Budapest]], by [[artist/sandor-mikus|Sándor Mikus]], was completed in December 1951 as a "gift to Joseph Stalin from the Hungarians on his seventieth birthday" and torn down on 23 October 1956 [[source/wikipedia-en-stalin-monument-budapest|introduction]].

  ## The monument

  It stood on the edge of the Városliget, the city park, 25 metres high in all: an eight-metre bronze statue on a four-metre limestone base, on a tribune eighteen metres wide [[source/wikipedia-en-stalin-monument-budapest|§ Monument]]. Stalin was shown as a speaker, standing upright with his right hand on his chest, and reliefs on the tribune showed the Hungarian people welcoming their leader [[source/wikipedia-en-stalin-monument-budapest|§ Monument]]. Mikus won the commission in a competition in 1950 [[source/wikipedia-hu-mikus-sandor|§ Pályafutása]], and the monument earned him the Kossuth Prize [[source/wikipedia-en-stalin-monument-budapest|§ Monument]]. A Budapest journalist wrote on its completion: "Stalin was with us earlier; now he will be with us even more" [[source/wikipedia-en-stalin-monument-budapest|§ Background]].

  ## The fall

  During the [[event/hungarian-revolution-of-1956]] the demonstrators of 23 October demanded its removal; the crowd cut the statue down, leaving only the boots on the tribune, in which they planted a Hungarian flag [[source/wikipedia-en-stalin-monument-budapest|§ Destruction]]. The slide shows it after it was taken down [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 33]]. Monuments occupy public space, so their removal mattered as much as their making [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. After the de-Stalinising party congress of 1956 nearly all images of Stalin were destroyed throughout the Soviet Union and its satellites [[source/kalashnikov-2023|p. 131]]. Where the Soviet authorities proceeded with discretion, demolition even of a Stalin monument was a last resort: Prague's monument on Letná Hill, the largest of all, was destroyed only after experts had concluded that keeping its sculptural entourage of workers, peasants and soldiers was technically unfeasible [[source/kalashnikov-2023|p. 131]].

  ## Afterlife

  The Monument of the 1956 Revolution, completed in 2006, now occupies the site [[source/wikipedia-en-stalin-monument-budapest|§ Present]]. In Memento Park, the open-air museum of the statues of Hungary's Communist period, a replica of "Stalin's Boots", which became a symbol of the 1956 revolution, stands in Witness Square, and the architect Ákos Eleőd built a free recreation of the tribune with the broken boots in 2006 [[source/wikipedia-en-memento-park|introduction]] [[source/wikipedia-en-memento-park|§ History]].
