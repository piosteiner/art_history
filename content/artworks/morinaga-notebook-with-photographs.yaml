  ## Description and context

  The anonymous notebook with photographs dates from the 1940s. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] It was shown in the session "World War II, Prior and During" on 17 May 2019, whose vocabulary lists "Morinaga candy" and "Children's drawings". [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]] Morinaga & Company, a confectioner founded in Tokyo in 1899 by Taichirō Morinaga, made the first chocolate produced in Japan in 1918 and, in 1944, Japan's first domestically produced penicillin. [[source/wikipedia-en-morinaga-company|§ History]]

  Kushner argues that Japan's imperial goals were reflected in the products people bought in daily life, and that many wartime items were sponsored by companies with a hand in supporting the war. [[source/kushner-2011-drive-to-mobilize|p. 18]] Advertising and children's entertainment, he writes, showed children how to behave and presented the war as their fate. [[source/kushner-2011-drive-to-mobilize|p. 21]]
