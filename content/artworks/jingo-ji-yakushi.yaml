description_md: Probably the main image of Jinganji, the temple vowed by [[person/wake-no-kiyomaro]] and completed by 793, moved to Jingoji on Mount Takao in 824, where [[person/kukai]] held the first Shingon initiation ([[kanjo]]) in Japan in 812, for [[person/saicho]] among others. The healing Buddha is life-size and heavy-set, the drapery cut in deep folds; he holds a medicine jar in his left hand and makes the fear-not gesture with his right. The left shoulder is slightly higher, so that he seems to turn, and his heavy features give him a brooding, strange presence. Carved from a single block of [[hinoki-wood]] ([[ichiboku-zukuri]]) without hollowing, so that cracks have formed; traces of paint remain on lips, eyes and curls. An austere statement of religious renewal in the tradition of Indian and Chinese plain-wood sculpture. [[source/history-of-japanese-art|p. 133, fig. 160]]
