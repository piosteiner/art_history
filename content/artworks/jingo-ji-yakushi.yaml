        source: kunishitei-201-164
        accessed: 2026-11-24
      - note: The temple he built, Jinganji, was completed by 793, but in 824 it was moved to the slopes of Mount Takao and renamed Jingoji.
        source: history-of-japanese-art
        locator: p. 132
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?oldid=111415509
        note: 寺号を「神護国祚真言寺（じんごこくそしんごんじ）」として神護寺が成立している。… 神願寺の本尊である薬師如来立像（国宝）もこの地に移されて当寺の本尊となっている
        source: jawiki-111415509
        accessed: 2026-11-24
