  - owner_label: Jingan-ji (temple of Wake no Kiyomaro)
    acquired: c. 793
    method: creation
    label: single-block hinoki statue, thought to be the main icon of Jingan-ji, the temple pledged by Wake no Kiyomaro and completed by 793; another theory places it at Takaosan-ji
    certainty: probable
    sources:
      - note: A standing Yakushi image in Jingoji is thought to be the main icon of Kiyomaro's previous Jinganji, probably completed by 793 and subsequently moved to the later structure of Jingoji (Fig. 160).
        source: history-of-japanese-art
        locator: p. 132
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/w/index.php?oldid=1381365073
        note: A newer theory by historians Nakano Tadaaki and Nagaoka Ryūsaku uses the timeline of the publication of the Kōnin shizaichō … which points to Takaosan-ji as the origin of the statue.
        source: enwiki-1381365073
        accessed: 2026-11-24
  - owner: institution/jingo-ji
    acquired: 824
    method: transfer
    direct: true
    place: kyoto
    label: Jingan-ji moved to Mount Takao and merged with Takaosan-ji as Jingo-ji; the Yakushi became its main image; in the Kondō rebuilt in 1935 (earlier in the Bishamon-dō); shown in Tokyo in 2024, its first time out of the temple
    sources:
