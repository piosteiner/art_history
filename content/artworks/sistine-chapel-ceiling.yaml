description_md: |-
  The ceiling of the Sistine Chapel in the Vatican, painted in fresco by [[artist/michelangelo|Michelangelo]] between 1508 and 1512 for Pope Julius II; it is a cornerstone of High Renaissance art.[[source/wikipedia-en-sistine-chapel-ceiling|introduction]] The chapel itself had been built in 1477–1480 by Pope Sixtus IV, and its walls painted by Botticelli, Ghirlandaio, Perugino and others twenty years before Michelangelo's work.[[source/wikipedia-en-sistine-chapel-ceiling|introduction; § Context and creation]]

  ## Commission and execution

  Julius II conceived the programme in 1506; his own scheme of twelve Apostles in the spandrels was replaced by a far more complex one when Michelangelo was allowed, in his words, "to do as I liked".[[source/wikipedia-en-sistine-chapel-ceiling|§ Context and creation]] The contract was signed on 8 May 1508, with a fee of 3,000 ducats.[[source/wikipedia-en-sistine-chapel-ceiling|§ Context and creation]] Michelangelo, a sculptor more than a painter, had freestanding scaffolding built and worked from the west end, beginning with the Drunkenness of Noah and working back through the story; the first half was shown on 14 August 1511, the finished ceiling on 31 October 1512.[[source/wikipedia-en-sistine-chapel-ceiling|§ Context and creation]] The scheme comprises more than 300 figures.[[source/wikipedia-en-sistine-chapel-ceiling|§ Context and creation]]

  ## The scenes from Genesis

  Along the centre of the vault nine scenes from Genesis form three groups: the creation of heaven and earth; the creation of Adam and Eve, their disobedience and expulsion from Eden; and the story of Noah.[[source/wikipedia-en-sistine-chapel-ceiling|§ Nine scenes from the Book of Genesis]] The lecture "Aus dem Wald" showed the ceiling in its section on trees in cultural origin stories, under the heading "Szenen aus Geschichte von Schöpfung, Sündenfall und Sintflut", and singled out the Fall and Expulsion from Paradise.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 57]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 58]] In this panel Michelangelo combines two scenes: Adam and Eve take the fruit from the forbidden tree — a fig, not the apple tree common in Western art — Eve from the hand of the serpent, shown as Lilith, and Adam picking it for himself; and their banishment from the garden into a world where they must fend for themselves and experience death.[[source/wikipedia-en-sistine-chapel-ceiling|§ Adam and Eve]] The Genesis text quoted in the lecture places the Tree of Life and the Tree of the Knowledge of Good and Evil in the middle of the garden.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 50]] The Fall and Expulsion was painted in the second phase of the work, together with the Creation of Eve; it was only after he had seen the completed first half from the floor that Michelangelo resumed with the Temptation and Fall.[[source/wikipedia-en-sistine-chapel-ceiling|§ Method]]

  ## Reception

  When the ceiling was uncovered, Vasari reports, people came from everywhere to see it and were left "amazed and speechless"; Michelangelo, then 37, was called *il divino*.[[source/wikipedia-en-sistine-chapel-ceiling|§ Context and creation]] The ceiling has been restored several times, most recently from 1980 to 1994.[[source/wikipedia-en-sistine-chapel-ceiling|introduction]]
