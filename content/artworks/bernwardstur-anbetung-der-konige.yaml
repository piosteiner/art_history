description_md: |-
  The third field from the bottom on the right leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the Adoration of the Magi.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 44]] It is the clearest example of the door's peculiar relief style: Mary's lower body is worked in flat relief, while her upper body and the Christ Child project further and further towards the top, until Mary's shoulder and head are fully in the round; this is a deliberate design, not a consequence of the casting.[[source/wikipedia-de-bernwardstur|§ Figuren]] Seen from the side, the figures "lean" out of the ground in this way like a "trellis of roses with nodding heads".[[source/wikipedia-de-bernwardstur|§ Figuren]]

  Opposite it on the left leaf is the earthly life of Adam and Eve; the lecture listed the two as a typological pair.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]]
