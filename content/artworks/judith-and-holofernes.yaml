    label: possibly the 'little Judith of Rafell Urbin' of van der Doort's 1639 inventory (Passavant); Millar rejects the identification
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1181.html
        note: "Possibly Charles I, King of England [1600-1649]; — [1] Passavant … connected it with the mention of a painting of Judith by Raphael in Abraham van der Doort's 1639 inventory of the collection of King Charles I … But Millar 1960: 232, rejecting Passavant's identification, has suggested that the Judith in the inventory may be identifiable with Giorgione's"
        source: nga-1942-9-42
