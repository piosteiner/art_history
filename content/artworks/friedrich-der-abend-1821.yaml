description_md: |-
  A painting by [[artist/caspar-david-friedrich|Caspar David Friedrich]], dated 1821, oil on canvas, 22.3 × 31 cm, in the [[institution/landesmuseum-hannover|Landesmuseum Hannover]]; it belongs to the cycle of the *Times of Day* with *Der Morgen*, *Der Mittag* and *Der Nachmittag*.[[source/wikipedia-de-der-abend-gemalde|introduction]] The lecture "Aus dem Wald" dates it 1821/22.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 9]]

  ## Description

  A light pine forest fills the whole picture.[[source/wikipedia-de-der-abend-gemalde|§ Bildbeschreibung]] In the foreground is a clearing with pine shrubs and red flowers on the slightly undulating forest floor; the trunks stand in a rhythmic sequence, with wider gaps towards the centre, where the red and yellow bands of the sunset shine through.[[source/wikipedia-de-der-abend-gemalde|§ Bildbeschreibung]] The sky takes up two thirds of the picture.[[source/wikipedia-de-der-abend-gemalde|§ Bildbeschreibung]] In the centre two figures in "altdeutsch" dress stand on a forest path that runs diagonally across the middle ground, looking towards the sunset.[[source/wikipedia-de-der-abend-gemalde|§ Bildbeschreibung]] For the idea of watching a sunset from the middle of a forest, pine is the only possible native tree; extensive natural pine forests occurred mainly in the lowlands of north-eastern Germany, Friedrich's home region, and the pine was always part of the typical forest landscape there, even where woods were overused.[[source/wikipedia-de-der-abend-gemalde|§ Botanik]]

  ## Interpretation

  The painting has been read in religious, political and nature-philosophical terms; Helmut Börsch-Supan sees the forest, with Christian connotations, as a symbol of death and its openness to the light as the promise of the beyond.[[source/wikipedia-de-der-abend-gemalde|§ Bilddeutung]] A political reading draws on the old-German costume of the figures in the years of the persecution of "demagogues" after the Carlsbad Decrees of 1819, but research tends to treat the two wanderers as staffage, anonymous like the trees.[[source/wikipedia-de-der-abend-gemalde|§ Bilddeutung]] *Der Morgen* and *Der Abend* were probably painted as a pair, the other two pictures added later; Willi Geismeier recognised in 1966 that the cycle corresponds to texts in Christian Cay Lorenz Hirschfeld's *Theorie der Gartenkunst*, the one for evening being a quotation from the Marquis de Girardin on his park at Ermenonville that refers to Claude Lorrain's *Evening* of 1666.[[source/wikipedia-de-der-abend-gemalde|§ Zeit und Zyklus; § Konstruktionsbild]]

  ## Provenance

  The painting was probably acquired from the artist together with *Der Morgen* by Wilhelm Körte in July 1821; in 1906 it belonged to the Berlin physician Friedrich Körte, and the Landesmuseum bought it on the art market in 1916.[[source/wikipedia-de-der-abend-gemalde|§ Provenienz]]

  ## In the lecture

  The lecture "Aus dem Wald" showed it in its opening survey of modern images of the forest, after [[artwork/mann-und-frau-den-mond-betrachtend|*Man and Woman Contemplating the Moon*]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 8]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 9]]
