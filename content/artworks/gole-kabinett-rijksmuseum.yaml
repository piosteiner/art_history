description_md: |-
  [[artist/pierre-gole|Pierre Gole]]'s cabinet with reliefs and free-standing figures was made in 1645–1650 [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 47]]. Its carcass is of softwood and oak, veneered with ebony and decorated with ivory; it is 2.12 m high and 1.90 m wide and is in the [[institution/rijksmuseum|Rijksmuseum]] in Amsterdam [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 47]].

  ## Description

  The reliefs show scenes from the Old Testament: the entry of Solomon into Jerusalem, Jephthah and his daughter, and Solomon and the Queen of Sheba [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 48]]. A stage-like architecture in the cabinet shows the Judgement of Solomon [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 49]]. The black ebony sets off the white ivory of the figures [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 47–50]].

  ## Context

  In the lecture the cabinet introduced ebony as the "wrapping" of European luxury furniture [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]]. Ebony (Greek ἔβενος, Latin hebenus, botanically Diospyros) comes from evergreen trees up to 30 m high with trunks up to 1.3 m in diameter, native to Sri Lanka and southern India, with related species in Madagascar and Cameroon; its heartwood is hard, heavy and dark brown to black, its sapwood light [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 46]].
