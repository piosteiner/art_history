description_md: |-
  Two carved portrait busts in the crowning pieces (Auszug) above the inner wings of the Blaubeuren high altarpiece: Count Eberhard V "im Bart" of Württemberg (reigned 1471–1496) and Abbot Heinrich III Fabri of Blaubeuren (abbot 1475–1495), the patrons of the work.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 38]] The figures are by [[artist/michel-erhart|Michel Erhart]], their painting by [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]], 1491–1494.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 38]]

  De Wikipedia places Fabri on the left and Eberhard on the right.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] Fabri, who reformed and restored the abbey, became a bishop in 1492, the year after building of the new abbey church began.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] He was closely involved in founding the University of Tübingen in 1477.[[source/wikipedia-en-blaubeuren-abbey|§ History: Catholic]]
