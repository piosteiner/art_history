description_md: |-
  A lithograph from the book *Gott mit uns*: an artistic strategy of resistance, beside [[artwork/heartfield-wie-im-mittelalter-so-im-dritten-reich]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]].

  ## Context

  [[artist/renato-guttuso|Renato Guttuso]] made the work in 1944 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]]. A member of the clandestine Communist Party since 1940, Guttuso took part in the partisan struggle from 1943 [[source/wikipedia-en-renato-guttuso|§ Social art and the Second World War]]; his war drawings, the *Massacri*, circulated clandestinely because they showed Nazi repressions such as the massacre of the Ardeatine Caves in Rome [[source/wikipedia-it-renato-guttuso|§ L'arte sociale di Guttuso]].

  ## Strategies of resistance

  The seminar's section "Artistic strategies of resistance" set the lithograph beside [[artist/john-heartfield|John Heartfield]]'s photomontage *Wie im Mittelalter … so im Dritten Reich* (1934) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]]: two printed images, a photomontage and a lithograph from a book, turned against the regimes.
