description_md: "One of five designs [[artist/katsushika-hokusai]] made for a series on ghost tales: a servant girl falsely accused of breaking one of ten blue-and-white plates was drowned in a well; at night her voice counts up to nine and wails. Against a deep-blue sky her head rises from the well on a neck of plates, a thin trail of white smoke issuing from her mouth. [[source/history-of-japanese-art|pp. 290–291, fig. 332]]"
