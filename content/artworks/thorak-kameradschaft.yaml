description_md: "*Kameradschaft* by [[artist/josef-thorak|Josef Thorak]] (1937 or earlier) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; photographed by Heinrich Hoffmann ([Bayerische Staatsbibliothek, Bildarchiv hoff-70680](https://bildarchiv.bsb-muenchen.de/fylr/L/ad4ce158-a6c6-405e-a151-7b7a8f542eaf)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Like Breker's *Die Siegerin*, it was meant to demonstrate \"Aryan superiority\" or German virtues.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]"
