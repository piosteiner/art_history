description_md: |-
  The view from his window at the Saint-Rémy asylum before sunrise, with an imagined village[[source/moma-the-starry-night|“Inspired by the view from his window at the Saint-Paul-de-Mausole asylum in Saint-Rémy” · “"This morning I saw the countryside from my window a long time before sunrise …"” · “The picturesque village nestled below the hills was based on other views—it could not be seen from his window”]].

  Ein Team um den Astronomen Elijah Jeong-hyun Kim (Kyung Hee University) hat den Morgenhimmel des Juni und Juli 1889 im Ausschnitt von Van Goghs Fenster nachgerechnet: Mond, Venus und die Hyaden stehen am ehesten um den 22. Juli so wie im Bild – einen Monat später als die übliche Datierung, die auf seinem Brief an Theo von etwa dem 18. Juni beruht. Das Bild wäre dann ein übersteigerter wirklicher Himmel und keine reine Erfindung; endgültig ist das Ergebnis nach den Autoren selbst nicht, Van Gogh könnte die Himmel mehrerer Nächte verbunden haben.[[source/guardian-2026-starry-night-dating|“Researchers say the celestial bodies depicted in the famous painting match the sky the Dutch artist may have seen on about 22 July 1889, a month later than the usual date given for the work.” · “The June date rests on a letter Van Gogh wrote to his brother Theo on about 18 June” · “making the painting an exaggerated reality rather than pure fantasy” · “the researchers acknowledged the results were not conclusive, with Kim noting that Van Gogh may have combined the skies of several days”]]

  Das Van Gogh Museum hält am Juni fest: Am 2. Juli schickte Van Gogh Theo schon eine Zeichnung nach dem Bild, und nach einem schweren Zusammenbruch um den 22. Juli konnte er über einen Monat nicht malen; die Stellung der Gestirne tauge nicht zur Datierung, weil es ihm nicht um genaue Ähnlichkeit ging.[[source/guardian-2026-starry-night-dating|“on 2 July Van Gogh sent his brother Theo a drawing based on it” · “the artist had a severe breakdown on about 22 July that left him unable to paint for more than a month” · “Van Gogh was not concerned with exact likenesses,” a museum spokesperson said. “The positions of the celestial bodies depicted can therefore not form a reliable basis for dating the work.”]]
