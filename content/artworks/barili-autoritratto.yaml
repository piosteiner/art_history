description_md: |-
  [[artist/antonio-barili|Antonio Barili]]'s intarsia self-portrait comes from the choir stalls of the chapel of St John the Baptist in Siena Cathedral; it was formerly in the Kunstgewerbemuseum in Vienna and was destroyed in the Second World War [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 54]]. The lecture dates the [[artwork/barili-coro-cappella-san-giovanni-siena|choir stalls]] 1488–1502 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 54]]; Marta Ajmar dates the panel 1502 [[source/ajmar-2024-reciprocal-design|p. 31]].

  ## Description

  Barili shows himself in the act of incising, with a shoulder knife, an inscription on a plaque that at once proclaims his authorship and stresses the physical labour of the work [[source/ajmar-2024-reciprocal-design|p. 36]]: "HOC EGO ANTONIVS BARILIS OPVS COELO NON PENICELLO EXCVSSI AN DN MCCCCCII" — "I, Antonio Barili, have extracted this work with the knife/chisel, not the little brush, AD 1502" [[source/ajmar-2024-reciprocal-design|p. 36]]. The lecture translates "excussi" as "torn out" or "driven out" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 56]]. For Ajmar the panel sets up a paragone between intarsia and painting: the shoulder knife, the tool unique to intarsia, stands for a skill in which pattern and design are extracted from within the material rather than merely imposed on it [[source/ajmar-2024-reciprocal-design|p. 36]].

  The setting is a microcosm in which interior and outdoors blend: Barili's posture and prominent features suggest total sensory immersion — eyes, hands and the shoulder holding the knife, but also hearing and smell — and a lively parakeet, probably of "green wood", nibbles a fruit, perhaps a pear, from a young tree before a variegated sky [[source/ajmar-2024-reciprocal-design|p. 44]]. The panels framing the imitation-marble alcove show Barili's early use, or possibly invention, of chipboard (legno composito), made of wood shavings [[source/ajmar-2024-reciprocal-design|pp. 30–31]].

  ## Loss

  After the dispersal of the choir stalls the panel was held in the Kunstgewerbemuseum in Vienna, where it was lost in the Second World War [[source/ajmar-2024-reciprocal-design|p. 31]].
