description_md: "A diptych by [[artist/torii-kiyonaga]] (1752–1815), head of the Torii school from 1785, whose tall, elegant women in decorous pursuits set the standard of [[bijinga]] for the rest of the century: two groups of women meet on the bridge, those on the left returning from a pilgrimage to Enoshima, with Edo Castle and Mount Fuji behind. [[source/history-of-japanese-art|pp. 284–285, fig. 323]]"
