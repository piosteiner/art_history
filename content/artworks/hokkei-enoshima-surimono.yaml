public_id: 107945
title: Mount Fuji and the Island of Enoshima, from Shichiri Beach
creator: totoya-hokkei
created: 1821
kind: Japanese woodblock print
medium: Surimono polychrome woodblock print with embossing
materials: [paper]
dimensions: [21, 18.2]
institution: chester-beatty-library
description_md: "A [[surimono]] — a privately printed, small-format print for a New Year greeting — by [[artist/totoya-hokkei]] (1780–1850), the fishmonger who became Hokusai’s most distinguished pupil: a long sandy beach, waves embossed in the white water, a village of red-roofed houses and a pagoda under the cliffs of Enoshima, and Fuji almost invisible as an embossed white triangle. Enoshima’s dragon tamed by the goddess Benten made it a symbol for the year of the snake. [[source/history-of-japanese-art|pp. 291–292, fig. 333]]"
