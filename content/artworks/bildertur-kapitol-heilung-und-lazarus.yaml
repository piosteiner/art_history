description_md: This walnut relief on the right leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the raising of Lazarus — no. 14 of the door's scenes, after the [[artwork/bildertur-kapitol-heilung-des-blindgeborenen|healing of the man born blind]] (no. 13); on the right leaf each relief holds a single scene.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] The lecture showed the two neighbouring reliefs together as "Heilung des Blinden, Auferweckung des Lazarus".[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folien 100–101]] The right leaf shows Christ's ministry and Passion.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]]
