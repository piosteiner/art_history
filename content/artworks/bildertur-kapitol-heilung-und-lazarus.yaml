description_md: "This walnut relief on the right leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the healing of the blind man and the raising of Lazarus.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 100]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 101]] The right leaf shows Christ's ministry and Passion.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] Richard Hamann compared the healing of the blind man with the Magi before Herod on the left leaf to distinguish two carvers: one modelling fully and plastically, the other working with clear structure and vertical lines.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]"
