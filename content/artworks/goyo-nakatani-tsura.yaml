description_md: "One of the best works of [[artist/hashiguchi-goyo]] (1880–1921), who designed [[shin-hanga]] for the publisher [[person/watanabe-shozaburo]] and then set up his own shop in 1918, following Utamaro: against a silvery mica ground the model sits in a gossamer black kimono with a gold wedding ring — cool, pensive, set apart in her private world. [[source/history-of-japanese-art|pp. 384–385, fig. 458]]"
