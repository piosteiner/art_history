description_md: Pieter Bruegel the Elder’s panorama of death’s army overrunning the living, painted around 1562–63. It was in Italy with the Gonzaga of Sabbioneta and in Naples before Queen Elisabeth Farnese acquired it for La Granja; it came to the Prado in 1827.
