description_md: |-
  Bequest of Stephen Carlton Clark [[source/yale-1961-18-34]]. The seminar's example of the circulation of objects under the regimes — loot, displacement, sales [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 35–36]]; for the fate of the Moscow collections nationalised after the revolution see [[source/rasmussen-2022]] (on Shchukin's).

  ## Description

  [[artist/vincent-van-gogh|Vincent van Gogh]] painted *Le café de nuit* in Arles in September 1888; the title is inscribed lower right beneath the signature [[source/wikipedia-en-the-night-cafe|introduction]]. It shows the Café de la Gare at 30 Place Lamartine, run by Joseph-Michel Ginoux and his wife Marie: five customers sit at tables along the walls, and the landlord, said to be Ginoux, stands beside the billiard table facing the viewer [[source/wikipedia-en-the-night-cafe|introduction; § Description]]. The ceiling is green, the upper walls red, the gas lamps and the floor largely yellow; the paint is thick, and the lines of the room lead towards a half-curtained doorway at the back [[source/wikipedia-en-the-night-cafe|§ Description]]. Van Gogh sat up for three nights in early September to paint it, sleeping by day [[source/wikipedia-en-the-night-cafe|§ Genesis]].

  He wrote to his brother Theo: "I have tried to express the terrible passions of humanity by means of red and green", and the next day: "In my picture of the Night Café I have tried to express the idea that the café is a place where one can ruin oneself, go mad or commit a crime" [[source/wikipedia-en-the-night-cafe|§ Van Gogh on the painting]]. Critics have stressed its "shocking perspectival rush" (Antonia Lant) and its use of what van Gogh called "suggestive colour", infused with emotion in a way later called Expressionism [[source/wikipedia-en-the-night-cafe|§ Reaction of critics and scholars]].

  ## From Moscow to New Haven

  Van Gogh used the picture to settle debts with Ginoux; it later became a highlight of Ivan Morozov's collection in Moscow, was nationalised, and was sold by the Soviet authorities in the 1930s [[source/wikipedia-en-the-night-cafe|§ History]]. Lenin's decree of 29 October 1918 nationalising Sergei Shchukin's collection also nationalised Morozov's; the two collections became the State Museum of New Western Art, united in 1923 in the former Morozov residence [[source/rasmussen-2022|p. 49]]. Under Stalin, desperate for revenue to finance economic modernisation, the regime sold works recognised as among the most important in the lives of artists such as Cézanne and van Gogh [[source/rasmussen-2022|p. 50]]. *The Night Café* from the Morozov collection was one of the four most significant works sold in this period, under a decree of sale dated 9 May 1933 [[source/rasmussen-2022|p. 50, n. 4]]. Stephen Carlton Clark acquired it and bequeathed it to the Yale University Art Gallery [[source/wikipedia-en-the-night-cafe|§ History]] [[source/yale-1961-18-34]].

  In 2009 Yale sued Pierre Konowaloff, a purported great-grandson of Morozov, who claimed the painting on the grounds that the Soviet nationalisation was invalid; Yale dropped the suit that October, and in 2016 the United States Supreme Court rejected Konowaloff's appeal, leaving Yale's ownership secure under the "act of state" doctrine [[source/wikipedia-en-the-night-cafe|§ History]].

  The seminar "Art and Totalitarianism" showed the painting under the heading "The circulation of objects and people: loot, displacement, diaspora, exile" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 35–36]].
