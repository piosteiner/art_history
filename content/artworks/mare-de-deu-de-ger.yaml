description_md: |-
  The Mare de Déu de Ger is an enthroned Virgin and Child from Catalonia of 1150–1200, carved in willow and painted over a chalk ground, 51.8 cm high, in the Museu Nacional d'Art de Catalunya, Barcelona (065503-000).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 44]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  In the lecture it represented the spread of the enthroned wooden Madonna as "a type that conquered Europe", beside examples from Burgundy, the Auvergne, Switzerland and Tuscany.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 26]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 44]] Willow, with poplar, was among the soft woods of loose growth used for all kinds of carved objects up to the end of the twelfth century.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] Height varied with regional type; in the neighbouring Pyrénées-Orientales Majesties are commonly 66–72 cm.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] The lecture returned to the statue under the role of wood as material of the Marian image.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 70]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 74]]
