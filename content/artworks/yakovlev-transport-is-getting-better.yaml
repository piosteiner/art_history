description_md: |-
  [[artist/boris-yakovlev|Boris Yakovlev]]'s *Transport Is Getting Better* (1923) is one of the early Soviet industrial landscapes; the Russian Wikipedia names it among his best-known works on the industrialisation of the country [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Работы]].

  ## Landscape as ideology

  The seminar showed it, as "Transport returns to normal", under landscapes, still lifes and nudes as carriers of ideology [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]] [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Beside it stood Josef Thorak's [[artwork/thorak-the-family]] from the German pavilion in Paris in 1937 and the Italian [[literature/eroi-macchine-ali-contro-nature-morte]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]]. Yakovlev was among the first Soviet artists to turn to the industrial landscape, which celebrated the "romanticism" of socialist construction [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|§ Работы]]. He was one of the organisers of the Association of Artists of Revolutionary Russia (AKhRR) in 1922 [[source/wikipedia-ru-yakovlev-boris-nikolaevich-khudozhnik|introduction]], the group whose "heroic realism" was the beginning of the socialist realist archetype [[source/wikipedia-en-socialist-realism|§ Association of Artists of Revolutionary Russia (AKhRR)]].
