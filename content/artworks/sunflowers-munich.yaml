description_md: One of the four [[artwork/sunflowers-arles|Sunflowers]] Van Gogh painted in Arles in August 1888 to decorate the studio where he meant to paint with Paul Gauguin. Vase, flowers, table and background are rendered simply and flat; the icy turquoise of the ground heightens the yellows and yellow-browns. The simple form and strong colour go back to Japanese prints. Van Gogh saw this version and the one now in [[artwork/sunflowers-national-gallery|London]] as pendants; later he thought of hanging two sunflower paintings on either side of *La Berceuse* as a festive frame — a triptych.
