        note: by descent to Giacomo Roccabruna (died 1735) [The picture and the portrait of Gian Federico Madruzzo, as well as the portrait of their uncle Cardinal Cristoforo Madruzzo by Titian, are presumably the “I tre quadri grandi di Madruzzi” mentioned in a 1682 Roccabruna inventory cited by Oberziner 1900];
        source: aic-1929-912
        accessed: 2026-11-24
