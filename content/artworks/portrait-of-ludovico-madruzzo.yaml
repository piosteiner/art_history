  - owner: person/carlo-emanuele-madruzzo
    method: inheritance
    direct: true
    place: trento-2
    label: with its pendant (Gian Federico Madruzzo, NGA) the “due quadri de ritratti de Madruzzi” of the Castello inventory, Dec. 1658–13 Jan. 1659
    sources:
      - url: https://www.artic.edu/artworks/4081
        note: by descent to Carlo Emanuele Madruzzo (died 1658) [the painting and its pendant, the portrait of his brother Gian Federico Madruzzo now in the National Gallery of Art, Washington D.C., have been identified as the “due quadri de ritratti de Madruzzi” recorded in an inventory of the Castello made between December 1658 and January 13, 1659, see Oberziner 1900 and Shapley, 1979];
        source: aic-1929-912
        accessed: 2026-11-24
  - owner: person/charlotte-de-lenoncourt
    label: his cousin
    certainty: possible
    sources:
      - url: https://www.artic.edu/artworks/4081
        note: possibly his cousin Charlotte de Lénoncourt [see Oberziner 1900].
        source: aic-1929-912
        accessed: 2026-11-24
  - owner_label: Barons Roccabruna, Trent
    acquired: 1682 or earlier
    place: trento-2
    label: presumably the “I tre quadri grandi di Madruzzi” of a 1682 Roccabruna inventory (with Gian Federico Madruzzo and Titian's Cardinal Cristoforo Madruzzo)
    sources:
      - url: https://www.artic.edu/artworks/4081
        note: Barons Roccabruna, Trent, by 1682;
