description_md: |-
  Pilgrims kneeling before the Madonna: Caravaggio's realism of ordinary people, beside [[artwork/the-stone-breakers]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 24]].

  ## Description

  The painting, also called the *Pilgrims' Madonna*, shows the barefoot Virgin holding her naked child in a doorway before two kneeling peasants on a pilgrimage; it is in the Cavalletti Chapel of the church of [[institution/basilica-of-saint-augustine-in-campo-marzio|Sant'Agostino]], just north-east of Piazza Navona in Rome [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]]. The doorway is a partly decrepit wall of flaking brick rather than a heavenly cloud of putti, and only a slim halo marks the Virgin's status; as in many of [[artist/caravaggio|Caravaggio]]'s Roman paintings, an ordinary person meets the divine, whose appearance is equally ordinary [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]]. The model for Mary appears to be the same woman as in the *Madonna and Child with St. Anne* (1605) in the Galleria Borghese [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]].

  ## Commission and reception

  In 1603 the heirs of the marquis Ermete Cavalletti, who had died on 21 July 1602, commissioned a painting of the Madonna of Loreto for a family chapel; as his will required, they bought a chapel in Sant'Agostino in Rome on 4 September 1603 [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]]. Caravaggio's rival Giovanni Baglione reported that the unveiling "caused the common people to make a great cackle (*schiamazzo*) over it" [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]]. Robert Hughes saw in it Caravaggio's project "to give traditional motifs the immediacy of real life", with the elegant Madonna set against "two wrinkled and almost incongruously and devout plebians" [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]]. The composition may derive in part from a 1574 engraving of the *Adoration of the Magi* after Rosso Fiorentino by Caravaggio's friend Cherubino Alberti [[source/wikipedia-en-madonna-di-loreto-caravaggio|introduction]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed it, dated 1604–1606, beside [[artist/gustave-courbet|Courbet]]'s *Stone Breakers* (1849) — two older realisms of ordinary people, set after the regimes' "photographic realism or social optimism" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 21–24]].
