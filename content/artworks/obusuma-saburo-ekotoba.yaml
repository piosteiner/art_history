description_md: "The tale of two warrior brothers of the Kantō: the elder, Yoshimi Jirō, longs for life in the capital and marries a lady who served at court; the younger, Obusuma Saburō, devoted only to the martial arts, marries the plainest woman of the east. Jirō, who has neglected arms, is killed by bandits on his way to guard duty in Kyoto — a story that asks what a warrior's calling is. [[source/colbase-tnm-a-11889]]"
