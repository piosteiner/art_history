description_md: "A northern “table”-type [[dolmen]] on Kanghwa island west of Seoul: two upright slabs and a huge capstone. Judging by their burial goods, dolmens were tombs for people of higher rank such as clan chiefs; ninety per cent of the 200,000 on the peninsula are in South Korea. [[source/portal-2000|p. 30, fig. 13]]"
