    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: (Kunsthandlung Abels, Cologne), in 1950; — [9] How and when the Kunsthandlung Abels acquired the painting is not known. The 1985 catalogue … lists the Wallraf-Richartz-Museum in Cologne in the provenance; this has not yet been confirmed.
        source: nga-2016-118-1
        accessed: 2026-11-24
