  - owner: artist/caspar-netscher
    acquired: 1666
    method: creation
    label: sold by the artist for 100 or 130 guilders, per his inscription on the ricordo drawing (British Museum, Oo,11.250)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: The artist.[1] — [1] … “Geschildert voor h..d..[crossed out] guldens / 1666” … indicating that the artist sold the painting for either one hundred or one hundred and thirty guilders.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/gerrit-uylenburgh
    role: dealer
    acquired: 1674
    method: purchase
    place: amsterdam
    label: 'no. 89 in his 1675 inventory and appraisal for the Amsterdam Bankruptcy Chamber: "Young woman with a parrot by Netscher, the same as I paid in cash last year – 140"'
    price:
      amount: 140
      currency: NLG
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: Purchased 1674 for 140 guilders by (Gerrit Uylenburgh [1625 – 1679], Amsterdam);[2] — [2] … Uylenburgh lists as no. 89 “Young woman with a parrot by Netscher, the same as I paid in cash last year – 140”
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: artist/peter-lely
    role: agent
    acquired: 1675-04-19 or earlier
    method: transfer
    direct: true
    place: london
    label: consigned by Uylenburgh; one of eight paintings "with Mr. Pieter Lelij in England"; not identifiable in Lely's sale of 18 April 1682
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: consigned by 19 April 1675 to Sir Peter Lely [1618-1680], London.[3] — [3] … the Netscher is included in a list of eight paintings described as being “with Mr. Pieter Lelij in England.” … The eight paintings seem to have been with Lely on commission
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/pierre-plongeron
    place: the-hague
    label: 'agent and chamberlain to the Elector Palatine; estate inventory of 27 September 1694: "een vrouwtien … met papegaij op de hant, van Netsgaer"'
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: possibly Pierre Plongeron [d. 1694], The Hague.[4] — [4] Plongeron was agent and chamberlain to the Elector Palatinate. His estate inventory of 27 September 1694 lists “een vrouwtien geschildert op peneel met papegaij op de hant, van Netsgaer”
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/johann-wilhelm-elector-palatine
    place: dusseldorf
    label: Detail des Peintures du Cabinet Électoral de Dusseldorff (1719?), no. 80
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: Johann Wilhelm II [1658-1716], Elector Palatine, Düsseldorf; — [5] The painting was published an undated inventory (1719?) of the Elector’s collection, Detail des Peintures du Cabinet Électoral de Dusseldorff, no. 80.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/charles-iii-philip-elector-palatine
    method: inheritance
    direct: true
    place: mannheim
    label: moved 1730 with the collection to the palace in Mannheim; in Van der Schlichten's drawing of the picture cabinet (1731) and the Mannheim catalogue of 1736, no. 71
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: by inheritance to Karl III Philipp [1661-1742], Elector Palatine, and transferred 1730 with the collection to the elector’s palace in Mannheim; — [5] … a 1731 drawing of the Elector’s picture cabinet in Mannheim made by Jan Philips van der Schlichten … the 1736 catalogue of the Mannheim cabinet … no. 71.
        source: nga-2016-118-1
        accessed: 2026-11-24
