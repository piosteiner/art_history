  - owner: institution/alte-pinakothek
    acquired: 1836
    method: transfer
    direct: true
    place: munich
    label: inv. no. 417 (cat. no. 1399 up to 1930); no longer in the 1936 catalogue
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: transfered 1836 to the Alte Pinakothek, Munich;[5] — [5] … The painting was inventory no. 417 in the collection of the Alte Pinakothek (catalogue number 1399 in museum publications up through 1930).
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: institution/kunsthandlung-julius-bohler
    co_owners: [institution/kunsthandel-ag, institution/galerie-fischer]
    role: dealer
    acquired: 1936
    method: exchange
    direct: true
    place: lucerne
    label: traded by the Pinakothek for a painting by Giuseppe Maria Crespi (first called Pietro Longhi); Böhler records suggest it may have gone to Lucerne in 1931/32, half owned by Theodor Fischer
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: traded 1936 with (Julius Böhler, Munich/Kunsthandlung AG Lucerne and the Galerie Fischer, Lucerne) in exchange for a painting by Giuseppe Maria Crespi;(6) — [6] … suggest that the painting may have been sent already in 1931 or 1932 to the Kunsthandel AG Lucerne (a sibling firm of Böhler) with a half share owned by Theodor Fischer. However, Lucerne index card L 10404 … confirms the exchange for the Crespi painting took place in 1936.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/d-katz
    role: dealer
    acquired: 1937-01-01
    method: purchase
    direct: true
    place: dieren
    label: Firma D. Katz; Lucerne index card L 10404; shown in Katz's exhibition of Dutch art, 3 July–15 September 1937, no. 56
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: sold 1 January 1937 to (Firma D. Katz, Dieren, Netherlands).[7] — [7] See index card no. L 10404 … Katz included the painting in an exhibition of Dutch art from 3 July to 15 September 1937 (no. 56).
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/hugo-daniel-andriesse
    co_owners: [person/elisabeth-j-spanjaard-andriesse]
    acquired: 1938 or earlier
    place: brussels
    label: lent to an exhibition in Rotterdam opening late 1938; the couple fled Europe and settled in New York
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: Hugo Daniel [1867-1942] and Elisabeth J. Spanjaard [1871-1963] Andriesse, Brussels, by 1938.[8] — [8] Hugo Andriesse, a Dutch industrialist and philanthropist living in Brussels, lent the painting to an exhibition in Rotterdam that opened in late 1938
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: institution/royal-museums-of-fine-arts-of-belgium
    role: custodian
    acquired: 1939
    method: transfer
    place: brussels
    label: deposited by Andriesse with other paintings of his collection
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: In 1939 he deposited it, with other paintings from his collection, with the Musées Royaux des Beaux-Arts, Brussels, before fleeing Europe with his wife and eventually settling in New York.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: institution/einsatzstab-reichsleiter-rosenberg
    role: possessor
    acquired: 1941-12-03
    method: confiscation
    place: brussels
    label: confiscated with the rest of the Andriesse collection, ERR no. HA 9; taken to the Jeu de Paume, Paris, 12 March 1942
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: After the Germans occupied Belgium during World War II, the painting was confiscated with the rest of the Andriesse collection on 3 December 1941 by the Einsatztab Reichsleiter Rosenberg (ERR no. HA 9), and on 12 March 1942 transferred to the Jeu de Paume, in Paris.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: person/hermann-goring
    role: possessor
    acquired: 1944-03-20
    method: transfer
    direct: true
    place: potsdam
    label: acquired for Göring, RM no. 1203; taken to his "Kurfürst" Luftwaffe bunker in Potsdam
    sources:
      - url: https://www.nga.gov/collection/art-object-page.163917.html
        note: On 20 March 1944 it was acquired for the Nazi’s Reichsmarschall Hermann Goering (RM no. 1203), and transferred to Goering’s “Kurfürst” bunker, a command center for the Nazi Luftwaffe, in Potsdam.
        source: nga-2016-118-1
        accessed: 2026-11-24
  - owner: institution/kunsthandlung-abels
    role: dealer
    acquired_label: in 1950
    place: cologne
