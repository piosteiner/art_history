        note: "Footnote: «Verzeichnis der an das Kunstmuseum Zürich ausgeliehenen Kunstwerke» von Dr. Etienne Grandjean, 15.12.1950, ZKG/KHZ, Depot-Korrespondenz 1940-56; Kat. Palais des Thermes 1949, Nr. 60. Im Ausstellungskatalog von 1949 wird der Leihgeber als «Coll. Dr. Grandjean, Oxford» angegeben. Ein Werk von Dali mit dem Titel «Deux femmes», vom Eigentümer Dr. med. Etienne Grandjean, der ab 1950 an der ETH Zürich tätig war, befand sich ab dem 15.12.1950 als Depositum im Kunsthaus Zürich. Eine handschriftliche Notiz auf der Auflistung verweist auf die Abholung «sämtlicher Werke» am 27.07.1951."
