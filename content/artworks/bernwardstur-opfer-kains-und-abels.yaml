description_md: |-
  The seventh field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the offerings of Cain and Abel – in the lecture's caption Cain on the right and Abel on the left.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 39]] It belongs to the sequence of the left leaf that tells, from top to bottom, of humankind's growing distance from God, ending with the fratricide.[[source/wikipedia-de-bernwardstur|§ Ikonografie]]

  Opposite it on the right leaf is the Nativity of Christ; the lecture listed the two as a typological pair, the offerings of the brothers set against the birth of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] The lower fields of both leaves formed the second group of pairs in the lecture.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 58]]
