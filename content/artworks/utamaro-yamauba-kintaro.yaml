description_md: The mountain woman Yamauba teases her chubby son Kintarō, holding just beyond his reach a twig with two chestnuts; frustrated, he grabs her kimono and tries to climb her leg. By [[artist/kitagawa-utamaro]], who studied with Toriyama Sekien; in 1804 a triptych of Hideyoshi with his concubines at Daigoji earned him three days in jail and fifty days in hand chains. [[source/history-of-japanese-art|pp. 287–288, fig. 328]]
