description_md: "A portrait by [[artist/kaburaki-kiyokata]] (1878–1972), trained as an ukiyo-e artist, of the writer [[person/higuchi-ichiyo]] (1872–1896), who supported her family by sewing for the prostitutes of her poor neighbourhood and died of tuberculosis at twenty-four: she sits pensively by an oil lamp, swatches of cloth before her — the desire to write overshadowed by the need to earn. Shown in 1940 at the exhibition for the 2,600th anniversary of the founding of Japan. [[source/history-of-japanese-art|pp. 370–371, fig. 440]]"
