description_md: "Ten dishes by [[artist/ogata-kenzan]] (1663–1743), the younger brother of Kōrin: with patches of white slip and motifs brushed in cobalt and iron — maple leaves and waves — he adapted his brother’s [[movement/rinpa]] designs to the rounded surfaces, wrapping the images around them. Kenzan built a kiln at Narutaki near Ninnaji in 1699 and moved to central Kyoto in 1712. [[source/history-of-japanese-art|p. 299, fig. 342]]"
