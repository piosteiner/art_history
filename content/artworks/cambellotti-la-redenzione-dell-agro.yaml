description_md: |-
  The cycle in the Palazzo del Governo of [[place/latina]]: the New Man as worker [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 58]].

  ## The reclamation of the Pontine Marshes

  The "redemption" of the title is the draining and settlement of the Pontine Marshes south of Rome, the Agro Pontino [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 58]]. Under the *bonifica integrale*, planned from 1922 and carried out under "Mussolini's Law" from 1929, the marshes were drained, cleared and divided into homesteads; the regime called it "the battle of the swamps" because it needed an army of workers — at its peak in 1933 some 124,000 men [[source/wikipedia-en-pontine-marshes|§ Bonifica integrale]]. About 2,000 settler families, most from northern Italy, received farmhouses, tools and land; the workers themselves lived in overcrowded camps on low wages, and many caught malaria [[source/wikipedia-en-pontine-marshes|§ Bonifica integrale]]. Mussolini used the operation for propaganda, having himself photographed among the workers and filmed for newsreels [[source/wikipedia-en-pontine-marshes|§ Bonifica integrale]]. Littoria, founded in 1932 at the centre of the reclaimed land, became the capital of a new province and was renamed Latina after the war [[source/wikipedia-en-pontine-marshes|§ Introduction]] [[source/wikipedia-en-pontine-marshes|§ Agro Pontino]].

  ## The work

  [[artist/duilio-cambellotti|Duilio Cambellotti]] painted the cycle in 1934 in tempera on panels of artificial slate. He had been committed to the Agro for three decades: in 1905 he and other Roman intellectuals, among them [[artist/giacomo-balla|Giacomo Balla]], founded the first schools for peasants on the edge of the marshes, and in the years of the *bonifica* his art turned to labour and the "conquest of the land" [[source/wikipedia-it-duilio-cambellotti|§ Il mondo contadino]]. In the seminar the cycle illustrated the [[term/new-man|New Man]] as worker, after the New Man as warrior ([[artwork/bucci-sailor-throwing-a-bomb|Bucci]]) and as power and authority ([[artwork/sironi-italia-fra-le-arti-e-le-scienze|Sironi]]) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 56–58]]. For Fascist ideologues the maker of history passed from being "a spectator to an actor in the history of the nation" and became a "builder of the future" [[source/dagnino-2016|p. 138]]; Dagnino notes that the exaltation of the peasant world was often a recourse to a mythical past serving future-oriented politics [[source/dagnino-2016|p. 132]].
