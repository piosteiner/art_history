description_md: "Painted from memory by [[artist/tani-buncho]] after the death of his friend [[person/kimura-kenkado]], the Osaka saké brewer whose fortune had been confiscated for brewing above his quota and who then kept a stationery shop and recorded the visits of his literati friends in his diary: not flattering, but a clear image of a talkative man with sharp, shrewd eyes. [[source/history-of-japanese-art|p. 341, fig. 398]]"
