description_md: |-
  A smaller version of [[artist/gustave-courbet|Gustave Courbet]]'s *Stone Breakers*, painted in oil on canvas around 1849 and measuring 56 × 65 cm; it belongs to the [[institution/sammlung-oskar-reinhart-am-romerholz|Oskar Reinhart Collection «Am Römerholz»]] in Winterthur (SOR1923.15) and is at present not on display.[[source/bundessammlungen-sor1923-15|record]][[source/roemerholz-courbet-steinklopfer|page]]

  ## Description

  Two stone breakers do their hard work in ragged clothes; their bodies are shaped by the labour, yet they radiate dignity and honesty. Their faces are shadowed or turned away from the viewer — the individual gives way to the type. The art of the French Realists, of whom Courbet was one of the most important, set the life and work of ordinary people in pictures that were at times monumental.[[source/bundessammlungen-sor1923-15|description]] The revolution of 1848 had led to the proclamation of the Second French Republic; Courbet supported the republican idea and rejected the monarchy with its thinking in social ranks.[[source/bundessammlungen-sor1923-15|description]]

  ## The two versions

  The museum describes its picture as a smaller, possibly later version of the *Stone Breakers*: the large canvas, with the same composition reversed, is today regarded as a war loss.[[source/bundessammlungen-sor1923-15|description]] That large picture, begun in November 1849 and shown at the Salon of 1850–1851, was in the Gemäldegalerie Alte Meister in Dresden and disappeared in 1944/45 — see [[artwork/the-stone-breakers|*The Stone Breakers* (Dresden)]] and the group [[artwork/courbet-the-stone-breakers-versions|*Les Casseurs de pierres*]].[[source/wikipedia-en-the-stone-breakers|§ History]] Wikipedia gives the Winterthur version as 56 × 85 cm; the collection's own record gives 56 × 65 cm.[[source/wikipedia-en-the-stone-breakers|§ History]][[source/bundessammlungen-sor1923-15|dimensions]]

  ## Provenance

  The painting first appears at an anonymous auction at the Hôtel des Commissaires-Priseurs in Paris on 27 June 1855 (lot 18). It then belonged to the Mazaroz-Ribalier collection, sold at the Hôtel Drouot on 13–14 May 1890 (lot 3), and to a collector "M. B.", whose sale at the Hôtel Drouot on 13 April 1892 (lot 14) brought it to the Galerie [[institution/bernheim-jeune|Bernheim-Jeune]]. After the collection of Baron Blanquet de Fulde, sold at the Hôtel Drouot on 12 March 1900 (lot 20), it came to [[person/wilhelm-hansen|Wilhelm Hansen]] in Copenhagen, from whom [[person/oskar-reinhart|Oskar Reinhart]] acquired it in 1923. With his collection it passed as his gift to the Swiss Confederation (1958/1965).[[source/bundessammlungen-sor1923-15|provenance]]

  ## Literature

  *Sammlung Oskar Reinhart «Am Römerholz» Winterthur. Gesamtkatalog*, ed. Mariantonia Reinhard-Felice, 2003, pp. 408–409, cat. 109; *100 Meisterwerke aus der Sammlung Oskar Reinhart «Am Römerholz»*, 2008, pp. 148–149, cat. 109.[[source/bundessammlungen-sor1923-15|literature]]
