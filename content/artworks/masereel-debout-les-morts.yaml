description_md: |-
  Masereel's woodcuts against the war: in one, two beheaded soldiers, a French and a German, carry their own heads on a stretcher — the maimed and disfigured trace the negative side of every figure of the New Man [[source/cioli-ricciardi-schiera-2019|Éric Michaud, pp. 92–93]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 61–62]].

  ## The image

  Éric Michaud describes it as one of the works by [[artist/frans-masereel|Frans Masereel]] that "get closer to the nightmare": a woodcut entitled *Debout les morts: Résurrection infernale*, "which shows two decapitated soldiers (French and German) carrying their own heads on a stretcher" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 62]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 93]].

  ## Context

  Masereel, a pacifist who had refused to serve in the Belgian army, spent the war years in Switzerland, working as a graphic artist for journals and magazines; in these years he made his first wordless novels in woodcut, such as *25 Images of a Man's Passion* (1918) [[source/wikipedia-en-frans-masereel|§ Education; § Emigre; § Influence]]. For Michaud, "it is they, the casualties, maimed and disfigured, who trace the negative side of all the figures of the New Man that will soon spring from the pencils of artists or the pens of writers and ideologues" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 61]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 92]]. The seminar "Art and Totalitarianism" showed the woodcut with [[artwork/leger-la-partie-de-cartes|Léger's Card Players]] and [[artwork/dix-die-skatspieler|Dix's Skat Players]] as the wartime figures of the body against which the regimes' New Man was later shaped [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 60–64]].
