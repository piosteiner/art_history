description_md: |-
  The carved wooden door of [[institution/basilica-di-sant-ambrogio|Sant'Ambrogio]] in Milan, with pictures from the Old and New Testaments, dates from the late 4th century and was renewed around 1750; in the lecture's data its reliefs are of elm and it measures 4.27 × 0.83 m, at the main portal.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 22]] The lecture showed two of its scenes: the messenger before David (below) and the anointing of David by Samuel (above).[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 22]]

  The basilica was built in 379–386 at the wish of Bishop Ambrose, outside the Roman walls of Milan.[[source/wikipedia-it-basilica-di-sant-ambrogio|§ L'antica basilica paleocristiana]] Of the early Christian basilica little survives besides its plan, among it the decoration of the entrance door, kept in the Museo diocesano of Milan: four panels with the story of David, episodes chosen by Ambrose himself.[[source/wikipedia-it-basilica-di-sant-ambrogio|§ L'antica basilica paleocristiana]][[source/wikipedia-it-basilica-di-sant-ambrogio|§ Opere artistiche]] German Wikipedia calls the fragments of this door, made towards the end of the 4th century, the oldest example of church doors with reliefs.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Vorbilder und Nachahmungen]]

  The doors of Sant'Ambrogio are named among the possible models of the [[artwork/bernwardstur|Bernward door]] in Hildesheim and, together with those of Santa Sabina, of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]][[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Vorbilder und Nachahmungen]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]]
