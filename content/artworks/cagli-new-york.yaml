  Shown in the seminar among the works on the circulation of people under the regimes — displacement, diaspora, exile [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 35, 37]].

  ## Context

  [[artist/corrado-cagli|Corrado Cagli]] made the collage *New York* in 1940 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 37]], in his first year in the city. A successful muralist under the regime, he had been forced into exile at the end of 1938, after the Racial Laws and anti-Semitic attacks on him and his work; via Paris he reached New York from Cherbourg at the end of 1939 and soon exhibited at the Julien Levy Gallery [[source/wikipedia-it-corrado-cagli|§ L'esilio e la partecipazione alla Seconda guerra mondiale]]. The seminar showed the work in its section on "the circulation of objects and people: loot, displacement, diaspora, exile", which began with looted art stored by the Germans in a church at Ellingen [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 35]].

  ## Exile in the Americas

  The United States and Mexico were, with Brazil, the countries of the Americas that most welcomed artists and intellectuals fleeing authoritarian regimes in Italy, Germany and elsewhere [[source/cardoso-2020|p. 194]]. For the young and little known, Rafael Cardoso observes, exile could even become an opportunity to reinvent oneself in another language and context [[source/cardoso-2020|p. 196]]. In 1941 Cagli enlisted in the US Army; he drew the liberated Buchenwald camp and returned to Rome only in 1948 [[source/wikipedia-en-corrado-cagli|§ Introduction]] [[source/wikipedia-it-corrado-cagli|§ L'esilio e la partecipazione alla Seconda guerra mondiale]].
