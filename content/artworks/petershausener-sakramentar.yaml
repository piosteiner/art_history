description_md: The Petershausen Sacramentary (Heidelberg, Universitätsbibliothek, Cod. Sal. IXb) was made on the Reichenau around 980; the double page fol. 39v–40r shows Ecclesia and Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 55]] The lecture showed it in the section on the "New Eve, Ecclesia, Throne of Wisdom" — the iconographic facets of the enthroned wooden Madonnas.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 49]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 55]] Ilene Forsyth related the priestly gesture of the Christ Child on the [[term/sedes-sapientiae|Throne of Wisdom]] statues, holding a book and blessing, to [[person/mary|Mary]] as symbol of the Church.[[source/forsyth-1972-the-throne-of-wisdom|p. 23]]
