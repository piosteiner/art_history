attribution_label: "Artist unknown (Hellenistic art). The base bears the Greek inscription ΚΛΕΟΜΕΝΗΣ ΑΠΟΛΟΔΩΡΟΥ ΑΘΗΝΑΙΟΣ ΕΠΩΕΣΕΝ (Made by Cleomenes son of Apollodorus of Athens): base and trunk come from another, damaged statue by Cleomenes and were fitted to the Venus after its discovery in the 16th century."
created: late 2nd century BCE–early 1st century BCE
created_span: uncertain
kind: statue
medium: Parian marble of the lychnite variant (statue); Pentelic marble (base)
materials: [marble]
dimensions: [153]
