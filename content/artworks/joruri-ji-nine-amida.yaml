description_md: "Nine Amida images on the altar of the Amida hall, the central one about a metre taller than the others and making the welcoming gesture (raigōin) — the nine grades of rebirth in Amida’s Western Paradise. Said to be in the style of Jōchō, the central Amida is close to the Byōdōin image, but the crossed legs are smaller and the drapery and features more sharply cut: a step away from the mid-Heian image. Judged by technique, the central figure is somewhat earlier than the flanking ones; the group belongs with the hall to the early Insei period. [[source/history-of-japanese-art|pp. 150–152, figs. 183–184]]"
