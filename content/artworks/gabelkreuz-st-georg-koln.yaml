description_md: |-
  A forked crucifix (Gabelkreuz) in the church of St. Georg in Cologne, made around 1380.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 65]] The corpus, 1.66 m high, is carved in walnut and carries two layers of paint; the cross itself was replaced in the twentieth century.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 65]]

  Made some three generations after the forked crucifix of St. Maria im Kapitol (1304), it shows how long the type remained in use in Cologne; the lecture set the two side by side.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 65]] The forked crucifix, or crucifixus dolorosus, arose under the influence of mysticism in the late thirteenth or early fourteenth century and is found above all in the Rhineland.[[source/wikipedia-de-gabelkreuz|§ introduction]]
