description_md: "A mountain-shaped incense burner excavated at Nŭngsan-ri near Puyŏ in 1993 — the only one found in Korea, and one of the most splendid: a dragon stand, a lotus bowl and a lid of overlapping mountains with immortals, musicians and animals, crowned by a phoenix. It adapts the Chinese boshanlu of the Daoist isles of the immortals, with Buddhist lotus motifs; close links with the Liang. [[source/portal-2000|pp. 52–54, fig. 28]]"
