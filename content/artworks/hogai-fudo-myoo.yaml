description_md: "A work of the last four years of [[artist/kano-hogai]] (1828–1888), the Kanō painter of the Mōri family who fared badly after the Restoration until [[person/ernest-fenollosa]] discovered him in 1884: Fudō’s dark-grey body and bright red robe are modelled with highlights and shadows, a synthesis of Eastern and Western elements in the spirit of the Kangakai. [[source/history-of-japanese-art|pp. 363–364, fig. 430]]"
