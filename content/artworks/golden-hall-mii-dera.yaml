      - url: https://ja.wikipedia.org/w/index.php?title=%E5%9C%92%E5%9F%8E%E5%AF%BA&oldid=111672295
        note: 園城寺は[[文禄]]4年（[[1595年]]）に[[豊臣秀吉]]により[[闕所]]とされ、堂塔が破却された。金堂は … 延暦寺西塔に移築され、釈迦堂（転法輪堂）とされた。現在の金堂は、園城寺再興を許可した豊臣秀吉の遺志により、[[高台院]]が[[慶長]]4年（[[1599年]]）に寄進したものである
        source: wikipedia-ja-onjo-ji
