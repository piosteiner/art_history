description_md: |-
  This manuscript (Cologne, Historisches Archiv, MS W 276a) of about 1140–50 is an early copy of the *Speculum virginum*.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]] The *Speculum virginum* ("Mirror of Virgins") is a twelfth-century didactic treatise on the life of religious women, cast as a dialogue between the teacher Peregrinus and his pupil Theodora.[[source/wikipedia-en-speculum-virginum|§ Introduction]] Its author is uncertain: Conrad of Hirsau has been proposed, as has a priest Conrad at the Augustinian house of Andernach.[[source/wikipedia-en-speculum-virginum|§ Introduction]] The text survives in 30 Latin and 26 Middle Low German recensions; the Cologne manuscript (c. 1140) preserves an early version of the Latin text and may come from Andernach.[[source/wikipedia-en-speculum-virginum|§ Introduction]]

  In the lecture the manuscript belonged to the high-medieval tree diagrams discussed as "trees of knowledge".[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 105]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 106]] The double page fol. 11v–12r shows the Trees of the Virtues and of the Vices.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 121]] A further page shows the tree of the fruit of the three estates.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]] The lecture set these pages beside the good and bad trees of the [[artwork/liber-floridus-gent|Liber Floridus]], the tree of vices of the [[artwork/de-lisle-psalter|De Lisle Psalter]] and the trees of Joachim of Fiore's [[artwork/liber-figurarum-oxford|Liber Figurarum]].[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 106]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 111]]
