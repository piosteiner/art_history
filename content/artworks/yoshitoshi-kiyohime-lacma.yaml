description_md: "By [[artist/tsukioka-yoshitoshi]] (1839–1892), pupil of Kuniyoshi and the print artist who best answered the demands of the new age: Kiyohime, spurned by a monk, crosses a river after him and turns into a giant snake that will coil around the bell of Dōjōji in which he hides — long black hair, rough waves and the scaly pattern of her robe. [[source/history-of-japanese-art|pp. 382–383, fig. 455]]"
