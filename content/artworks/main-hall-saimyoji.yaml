    label: built in the early Kamakura period as a five-bay hall, enlarged to seven by seven bays later, three-bay porch added c. mid-Muromachi; temple founded by tradition 834; owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/1510
        note: 西明寺は承和元年（八三四）の創立と伝えられるが、現在の本堂は様式上鎌倉時代に属し … もとは方五間の堂であったものが、鎌倉時後期頃に、正側面とも各一間通りが拡張され … 所有者名 ： 西明寺 所有者種別 ： 寺院
        source: kunishitei-102-1510
        accessed: 2026-11-24
      - url: https://saimyouji.com/history/
        note: 本堂（瑠璃殿）国宝 鎌倉時代の初期飛騨の匠が建立した純和様建築で釘を使用していない。
        source: saimyoji-ryaku-engi
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1571
    place: kora
    label: "spared when the temple was burned on Oda Nobunaga's order by Niwa Nagahide and Kawajiri Hidetaka (temple's account: monks burned the lodgings near the gate so the whole temple seemed to burn)"
    sources:
      - url: https://saimyouji.com/history/
        note: 戦国時代に織田信長は比叡山を焼き打ちしてその直後に当寺も焼き打ちをしましたが、幸に国宝一号指定の本堂、三重塔、二天門が火難を免れ現在しています。
        source: saimyoji-ryaku-engi
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/w/index.php?title=%E8%A5%BF%E6%98%8E%E5%AF%BA_%28%E6%BB%8B%E8%B3%80%E7%9C%8C%E7%94%B2%E8%89%AF%E7%94%BA%29&oldid=111639306
        note: 当寺は信長の家臣である丹羽長秀と河尻秀隆によって焼き討ちされる運命にあった。しかし、寺僧の機知により、山門近くの房舎を激しく燃やして全山焼失のように見せかけたため、山奥に位置する本堂や三重塔は焼失をまぬがれたという
        source: wikipedia-ja-saimyo-ji-kora
        accessed: 2026-11-24
