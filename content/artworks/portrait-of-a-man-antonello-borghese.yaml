provenance:
  - owner_label: unknown (probably a Venetian patrician)
    acquired: c. 1475–1476
    label: painted during Antonello's stay in Venice, 1475–1476; the sitter's red gown and black cap those of Venetian patricians
    sources:
      - url: https://www.collezionegalleriaborghese.it/opere/ritratto-duomo
        note: L’uomo ritratto indossa una veste rossa e una berretta nera, tipici capi d’abbigliamento di quei patrizi veneziani che furono estimatori e committenti di Antonello da Messina. Per ragioni stilistiche, il dipinto si deve fare risalire alla trasferta veneziana del 1475-1476.
        source: galleria-borghese-collezione
        accessed: 2026-10-20
  - owner: institution/borghese-collection
    acquired: 1790 or earlier
    ended: 1902
    place: rome
    label: the Borghese family collection — bound by the fideicommissum (Fidecommisso) of 1833 and listed in its inventory
    sources:
