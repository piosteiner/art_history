description_md: |-
  Painted in 1942, during the siege [[source/russian-museum-deineka-sevastopol]]. It is one of the monumental paintings of [[artist/aleksandr-deyneka|Aleksandr Deyneka]], with *The Defence of Petrograd* (1928) and *The Outskirts of Moscow. November 1941* [[source/wikipedia-en-aleksandr-deyneka|§ Life and career]].

  ## Socialist realism

  The seminar presented it as socialist realism ([[movement/socialist-realism]]), in Deineka's own words: "I don't know whether it's a good picture or a bad one, but it seems that it's real" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 45]]. It was shown at the Great Patriotic War exhibition of 1942 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 43, 45, 67]], one of the exhibitions through which works of art and totalitarian regimes were related to each other [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 67]]. Such collective exhibitions, devoted to themes like the glorification of the Soviet Army, were the usual way art reached the Soviet public [[source/groys-1994|p. 159]].

  ## Futurist lines of force, heroic struggle

  The seminar set the painting beside [[artist/umberto-boccioni|Umberto Boccioni]]'s [[artwork/boccioni-carica-di-lancieri]] (1915) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. Golomstock: "Totalitarianism translated the ideas of the avant-garde into its own language and forged them into a weapon with which to destroy its enemies. The idea of struggle as the driving force of history and culture was expressed by the Futurist through the image of abstract 'lines of force' and dynamic shapes: in totalitarian art, however, this idea was embodied more concretely, through the image of war" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]] [[source/golomstock-1990|p. 3]]. War, the past and everyday labour were all portrayed as heroic struggle [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. The pair raised the relation to the past, the projection of a future and the visual elaboration of power [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 46]]. Under the totalitarian regimes war was shown as heroic, whereas after the First World War its gruesome side had often been shown [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]].
