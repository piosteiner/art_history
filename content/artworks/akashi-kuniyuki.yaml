images:
  - url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/%E5%A4%AA%E5%88%80_%E6%98%8E%E7%9F%B3%E5%9B%BD%E8%A1%8C%2C_Tachi%2C_Akashi_Kuniyuki.jpg/1280px-%E5%A4%AA%E5%88%80_%E6%98%8E%E7%9F%B3%E5%9B%BD%E8%A1%8C%2C_Tachi%2C_Akashi_Kuniyuki.jpg
