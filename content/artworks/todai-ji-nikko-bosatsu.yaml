description_md: "A clay figure of serene, gentle youth, palms together, beside the Fukūkenjaku Kannon in the Hokkedō: the bodhisattva of sunlight, a name probably given later — the pair may first have been Bonten and Taishakuten, and are “guest” sculptures not made for the hall. Its garment is open across the chest like a monk’s robe; its crown sits low. [[source/history-of-japanese-art|p. 89, fig. 109]]"
