  History painting in Stalin's time, beside Balla's [[artwork/balla-marcia-su-roma]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]].

  ## Lenin in 1917

  In 1946–1947 [[artist/yevgeny-kibrik|Yevgeny Kibrik]] made a series of drawings, *V. I. Lenin in 1917*, counted among the most important works of the Soviet images of Lenin; he went on with the theme until 1959 [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Биография]]. Two sheets of the series, "There is such a party!" and "Lenin in Razliv", earned him a Stalin Prize of the third degree in 1948 [[source/wikipedia-ru-kibrik-evgeny-adolfovich|§ Признание]].

  ## History painting

  In the seminar the picture represented history painting, one of the themes of totalitarian art, and was compared with Balla's *March on Rome* (1931–1932) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]]. The usual way such works reached the Soviet public was the collective exhibition devoted to themes like episodes of Soviet history [[source/groys-1994|p. 159]].
