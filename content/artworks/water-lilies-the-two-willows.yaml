    method: gift
    direct: true
    place: paris
    label: given by Monet; the State built two oval rooms for the eight panels in the Orangerie of the Tuileries, opened 17 May 1927, months after his death
    sources:
      - url: https://fr.wikipedia.org/wiki/Les_Nymph%C3%A9as
        note: "Pendant les années 1920, l'État français y a construit deux pièces ovales pour l'exposition permanente de ces huit peintures du bassin aux nénuphars par Monet. […] 17 mai 1927 : inauguration officielle des Nymphéas au musée de l'Orangerie."
