        note: "1914 : encouragé par Clemenceau, Monet commence une série de panneaux décoratifs sur le thème des Nymphéas. 12 avril 1922 : Monet signe à Vernon, devant notaire, un acte de donation dans lequel il s’engage à remettre des panneaux des Nymphéas à l’État en avril 1924."
