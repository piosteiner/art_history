title: Eight Views of the Xiao and Xiang Rivers
creator: soami
created: early 16th century
created_span: uncertain
kind: fusuma-e
medium: Sixteen fusuma panels, now hanging scrolls; ink on paper
materials: [ink, paper]
dimensions: [174.8, 139.7]
dimensions_note: each panel
institution: daisen-in
description_md: Sliding-door paintings of the confluence of the Xiao and Xiang rivers, a favourite theme of Chinese literati painting, by [[artist/soami]] (1455–1525), the most innovative of the Ami family — Nōami, Geiami and Sōami, curators of the Ashikaga collection of Chinese paintings. Mountains modelled with grey washes and sharpened with short dark strokes combine the dots and washes of Mu Qi with the style of Mi Fu. [[source/history-of-japanese-art|pp. 229–230, fig. 264]]
