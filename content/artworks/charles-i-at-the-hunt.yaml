provenance:
  - owner: person/charles-i-of-england
    acquired: c. 1635
    method: commission
    label: very probably commissioned by the king, but found in none of his palaces — perhaps given to someone at court (the Duke of Hamilton?)
    certainty: probable
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010062167
        note: Très probablement commandé par Charles Ier, roi d’Angleterre, mais on ne sait dans quelle circonstance ni à quelle date (vers 1635 ?) ; non gardé par le roi car signalé dans aucun de ses palais
        source: louvre-collections
        accessed: 2026-10-20
  - owner: person/jeanne-baptiste-d-albert-de-luynes
    ended: 1736
    place: paris
    label: Jeanne d'Albert, comtesse de Verrue — perhaps a gift of Victor Amadeus II of Savoy; in the middle of a long wall of her Grande Galerie
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010062167
        note: en possession de Jeanne d’Albert (1670-1736), comtesse de Verrue, Paris, laquelle avait pu le recevoir en don de Victor-Amédée II de Savoie dont elle avait été la maîtresse avant 1700
        source: louvre-collections
        accessed: 2026-10-20
