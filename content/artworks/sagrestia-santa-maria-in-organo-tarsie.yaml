description_md: |-
  The sacristy of [[institution/santa-maria-in-organo|Santa Maria in Organo]] in [[place/verona|Verona]] is panelled with intarsia by [[artist/fra-giovanni-da-verona|Fra Giovanni da Verona]]; the lecture dates the panelling 1518–1525 and showed a perspectival view through a triumphal arch [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 69]]. Marta Ajmar dates the sacristy panels (spalliere) 1519–1523; each measures 58 × 99 cm [[source/ajmar-2024-reciprocal-design|pp. 26, 40]]. Fra Giovanni had earlier made the choir of the same church (1493–1499), with a large workforce of other artisans [[source/ajmar-2024-reciprocal-design|p. 40]].

  ## The panels

  At the centre of one panel a colourful rooster, a Christian symbol of resurrection and hope, walks through an open landscape on a carpet of grass [[source/ajmar-2024-reciprocal-design|p. 25]]. Its feathers are made of dozens of tight-fitting tesserae — bog oak for the black, walnut and possibly maple for the lighter browns — chosen for their inner figure and then worked over with coloured pastes and perhaps wood filaments in fine incisions [[source/ajmar-2024-reciprocal-design|p. 25]]. The silvery green grass at its feet was made of "green wood" (legname verde), wood stained by the emerald fungus Chlorociboria; originally it was much more variegated and intensely green [[source/ajmar-2024-reciprocal-design|p. 25]]. Another panel shows the ruins of an amphitheatre with brilliantly green grass in the foreground, which Ajmar reads as the power of nature conquering the fading man-made world of antiquity [[source/ajmar-2024-reciprocal-design|pp. 40–41]]. A third shows a cupboard from which a bunch of ripe grapes bursts out; their rounded chiaroscuro was produced with heat, by a burning tool or hot sand [[source/ajmar-2024-reciprocal-design|p. 41]]. Green-stained poplar also appears in imitation-porphyry roundels and behind holy figures such as St Zeno [[source/ajmar-2024-reciprocal-design|p. 41]].

  ## Wood supply

  The monastery lay by the Acqua Morta, a branch of the Adige with intense timber traffic, and traded with the rafters (radaroli) who floated wood down from Trentino; a chapel in the church was dedicated to them [[source/ajmar-2024-reciprocal-design|p. 40]]. Its own orchards may have supplied smaller amounts of wood [[source/ajmar-2024-reciprocal-design|p. 40]]. The surviving accounts do not list green wood among the timber ordered, although it is found throughout, so it may have come from a supplier or from the monastery's lands [[source/ajmar-2024-reciprocal-design|p. 41]].
