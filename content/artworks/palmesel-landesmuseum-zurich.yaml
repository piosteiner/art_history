description_md: |-
  This Palm Sunday donkey (Palmesel) of the mid-11th century, carved from spruce and fir and measuring 176.5 × 165 × 85 cm as a whole, is in the [[institution/swiss-national-museum|Swiss National Museum]] in Zurich.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 113]] It shows Christ riding on a donkey, the subject of Christ's entry into Jerusalem.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 113]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 114]]

  Such figures served the Palm Sunday procession, which with green branches and hymns recalls Christ's entry into Jerusalem and is attested from the 7th century; from the 10th century village priests rode a donkey in the procession, and because the animal was often stubborn it was usually replaced by a wooden donkey with a riding figure of Christ.[[source/wikipedia-de-palmesel|§ Geschichte und Gestaltung]] During the Enlightenment the custom was pushed back and at times forbidden – in Salzburg, for instance, Archbishop Hieronymus von Colloredo banned such "theatrical representations" in 1779 and again in 1782 – which led to the destruction of many Palmesel; in 1897 only fifty were said to survive in the whole of Bavaria.[[source/wikipedia-de-palmesel|§ Geschichte und Gestaltung]] In Tyrol old Palmesel are still used in church custom at Thaur and Hall.[[source/wikipedia-de-palmesel|§ Beispiele]]

  The lecture placed the Zurich Palmesel beside the relief of the Entry into Jerusalem on the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) and beside present-day Palm Sunday processions in Seville, Ammerschwihr (Alsace) and Thaur (Tyrol), in its discussion of the church as a new Jerusalem.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 108]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 112]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 115]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 116]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 117]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 119]]
