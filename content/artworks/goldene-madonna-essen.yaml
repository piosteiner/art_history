description_md: |-
  The Golden Madonna of Essen is an enthroned Virgin and Child made in the Rhineland around 980: a carved figure of poplar wood (the throne of lime and walnut) entirely clad in gold sheet, 74 cm high, kept in the cathedral treasury of [[place/essen|Essen]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 14]] It is counted as the oldest known sculpture of the Madonna and the oldest free-standing medieval sculpture north of the Alps.[[source/wikipedia-en-golden-madonna-of-essen|§ Introduction]]

  ## Description

  [[person/mary|Mary]] sits on a stool with a slightly oversized Christ Child on her lap; she wears a tight, long-sleeved tunic, a cloak (*palla*) and a veil.[[source/wikipedia-en-golden-madonna-of-essen|§ Description]] In her right hand she holds up a globe between thumb and two fingers, while her left hand supports the Child, who presses a book to his breast.[[source/wikipedia-en-golden-madonna-of-essen|§ Description]] The coloured eyes are of cloisonné enamel; the Child's right hand of cast silver was added only in the fourteenth century, the eagle agrafe on Mary's cloak in the early thirteenth.[[source/wikipedia-en-golden-madonna-of-essen|§ Description]] Ilene Forsyth took the statue as the work that best shows what gold and goldsmith's technique could achieve in a figure in the round: the goldsmith created "an illusion of warm and delicate femininity" from leaves of gold, and in the Virgin's protective gesture the metal sheath suggests "the limpness of silk, finely pleated about a soft body".[[source/forsyth-1972-the-throne-of-wisdom|p. 11]] She quoted Albert Boeckler, for whom the play of gold glints was an indispensable enhancement of the plastic form.[[source/forsyth-1972-the-throne-of-wisdom|p. 11]] The gilded copper plates now covering the throne appear to replace a more valuable original facing in gold.[[source/forsyth-1972-the-throne-of-wisdom|pp. 14–15]]

  Frank Fehrenbach doubted that the Essen figure can be classed with the Romanesque "Throne of Wisdom" type ([[term/sedes-sapientiae|sedes sapientiae]]): the Child is not enthroned and does not address the beholder frontally; the statue rather stands in the tradition of Byzantine icons and ivories that stress the relationship of mother and child.[[source/fehrenbach-1996-die-goldene-madonna|p. 76]]

  ## Material and technique

  Klaus Endemann counts the Essen Madonna, with the reliquary of [[artwork/sainte-foy-conques|Sainte Foy]] in Conques, among the two statues of the time up to c. 1000 that were completely covered with gold foil, so that the wood was only the "support" of the sculpture.[[source/endemann-2020-wood-carving-and-staffering|p. 147]] Unlike Sainte Foy, whose wooden core is only a scaffold for the metalwork, the forms of the Essen Madonna (as of the later [[artwork/imad-madonna|Imad Madonna]]) were fully worked out in the wooden core before it was covered with gold.[[source/endemann-2020-wood-carving-and-staffering|p. 147]] The freestanding legs of the throne were cut from the same block — a laborious practice that later sculptors abandoned.[[source/endemann-2020-wood-carving-and-staffering|p. 149]] Because the wooden core is no longer extant, it cannot be decided whether a whole poplar trunk or a cut piece was used; a wood sample from the original material of the head, analysed in 2012, confirmed poplar.[[source/endemann-2020-wood-carving-and-staffering|p. 149]] According to Endemann the figure was not originally hollowed out, and only the carved throne came from the trunk.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] A cavity inside the figure is accessible through a grille under Mary's seat, but it allows no conclusion about an earlier relic deposit; no inserted relics are known.[[source/fehrenbach-1996-die-goldene-madonna|p. 57]] The cavity may go back to the sculptor's removal of the heartwood, and any relics could have lain under the seat plate of the stool.[[source/fehrenbach-1996-die-goldene-madonna|pp. 57–59]]

  The figure was restored in 1905, after the Second World War and, most recently, on site in 2004.[[source/wikipedia-en-golden-madonna-of-essen|§ Preservation efforts]]

  ## Processions and the crowning

  The fourteenth-century *Liber ordinarius* of the Essen canonesses' foundation describes the processions in which the Golden Madonna was carried: on the Monday of Ascension week to the chapel of St Mark at Bredeney on the land of Werden Abbey, on the Tuesday of Rogation week across the foundation's fields, and on the Assumption (15 August) around the churchyard.[[source/fehrenbach-1996-die-goldene-madonna|p. 47]] The most spectacular took place at Candlemas (2 February): early in the morning the youngest canon received the image from the treasurer and took it, veiled, to the market church of St Gertrude; canons and scholars then carried the still veiled image through the town to the "stone" under the linden tree before the Johanneskirche, where the celebrant unveiled it and crowned it with a golden crown.[[source/fehrenbach-1996-die-goldene-madonna|p. 47]] The canonesses meanwhile sang the antiphon "Hail, Virgin, Mother of God, full of grace; for from you has come forth the shining sun of justice".[[source/fehrenbach-1996-die-goldene-madonna|p. 47]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 68]] The lecture presented the statue, on the strength of this ritual, as an "acting image" (*handelndes Bildwerk*).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 65]]

  The crown used, a lily crown, was not made for the statue: it was later reduced to the size of the head with an inserted iron ring.[[source/fehrenbach-1996-die-goldene-madonna|pp. 49–50]] Hermann Fillitz dated it to the tenth century with alterations in the later eleventh, which supports Hugo Schnitzler's suggestion that it was the child's crown of Otto III, crowned in Aachen in 983 at the age of three.[[source/fehrenbach-1996-die-goldene-madonna|p. 50]] Fehrenbach thought the crowning ceremony could have arisen soon after the image was completed — perhaps on the occasion of Otto III's stay in Essen in 993 — but no documents survive.[[source/fehrenbach-1996-die-goldene-madonna|p. 50]] He also noted that the Candlemas procession met the town's carnival customs, which may explain why the canonesses kept away from the procession proper.[[source/fehrenbach-1996-die-goldene-madonna|pp. 51–52]]

  ## History

  The statue was made under Abbess Mathilde (973–1011), a granddaughter of Otto the Great, who commissioned it.[[source/fehrenbach-1996-die-goldene-madonna|pp. 49, 56]] The first documented mention is in the *Liber ordinarius* of about 1370; it has been called "Golden Madonna" only since the nineteenth century.[[source/wikipedia-en-golden-madonna-of-essen|§ Medieval mentions]] It was evacuated in the Thirty Years' War, in 1794 and during the two world wars.[[source/wikipedia-en-golden-madonna-of-essen|§ Evacuations in early modern times]] [[source/wikipedia-en-golden-madonna-of-essen|§ 20th century]] In 1959 Pope John XXIII named the image patroness of the new Diocese of Essen.[[source/wikipedia-en-golden-madonna-of-essen|§ Introduction]] On 11 October 1959 Bishop Hengsbach transferred the Madonna to its present place.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 64]] The Candlemas crowning, revived in 1978, was stopped in 2000 because of conservation concerns.[[source/wikipedia-en-golden-madonna-of-essen|§ Liturgical significance, past and present]]
