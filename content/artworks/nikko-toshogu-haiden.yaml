public_id: 107979
title: Haiden (worship hall), Tōshōgū, Nikkō
attribution_label: Anonymous
created: 1636
kind: building
medium: Wood, lacquer, paint
materials: [wood, lacquer]
institution: nikko-toshogu
description_md: "The mausoleum and shrine of [[person/tokugawa-ieyasu]], deified as Tōshō Daigongen: begun in 1636, a roofed corridor and an inner enclosure of openwork walls contain the main buildings — a worship hall of four by nine bays linked by a stone room to the main hall, in the [[gongen-zukuri]]. The bracketing, railings and round pillars are Chinese, the rest Japanese; inside, fusuma and a coffered ceiling; outside, kirin, dragons, lions, phoenixes and chrysanthemums painted in brilliant colours. [[source/history-of-japanese-art|pp. 305–306, fig. 353]]"
