provenance:
  - owner: person/enrico-scrovegni
    acquired: 1303/1305
    method: commission
    place: padua
    label: part of Giotto's cycle in the private chapel of his palace on the site of the Roman arena (bought in February 1300 from Manfredo Dalesmanini); consecrated 25 March 1305
    sources:
      - url: https://it.wikipedia.org/wiki/Cappella_degli_Scrovegni
        note: La cappella fu commissionata da Enrico degli Scrovegni […] che agli inizi del Trecento aveva acquistato da un nobile decaduto, Manfredo Dalesmanini, l'area dell'antica arena romana di Padova. […] Nell'arco di tempo tra il 25 marzo 1303 e il 25 marzo 1305 si colloca dunque il lavoro di Giotto.
        source: wikipedia-it-cappella-scrovegni
        accessed: 2026-10-20
  - owner_label: the Foscari
    place: padua
    label: owners of the Arena; in the 1820s they began demolishing the palace and the chapel to sell the materials
    sources:
      - url: https://it.wikipedia.org/wiki/Cappella_degli_Scrovegni
        note: L'interesse della città di Padova per la Cappella degli Scrovegni risale agli anni Venti del XIX secolo, quando i Foscari, proprietari dell'area dell'Arena, iniziarono a demolire il palazzo e la cappella per venderne i materiali.
        source: wikipedia-it-cappella-scrovegni
        accessed: 2026-10-20
  - owner_label: the Baglioni-Gradenigo family
    ended: 1881
    place: padua
    sources:
      - url: https://it.wikipedia.org/wiki/Cappella_degli_Scrovegni
        note: La famiglia Baglioni-Gradenigo vendette quindi l'intera area dell'arena al Comune di Padova per 54.971 lire.
        source: wikipedia-it-cappella-scrovegni
        accessed: 2026-10-20
  - owner_label: Comune di Padova
    acquired: 10 May 1880–1881
    method: purchase
    direct: true
    place: padua
    label: bought by the city with the whole Arena — council resolution of 10 May 1880, deed of 1881; now part of the Musei civici
    price:
      amount: 54971
      currency: ITL
    sources:
      - url: https://it.wikipedia.org/wiki/Cappella_degli_Scrovegni
        note: La cappella fu ufficialmente acquisita dalla municipalità di Padova con delibera del 1880 (seduta del Consiglio Comunale del 10 maggio 1880) e con successivo atto notarile del 1881.
        source: wikipedia-it-cappella-scrovegni
        accessed: 2026-10-20
