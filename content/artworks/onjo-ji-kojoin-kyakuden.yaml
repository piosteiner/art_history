description_md: "One of the earliest surviving fully developed [[shoin-zukuri]] buildings, built in 1601 by a samurai who had been ordained and retired to Onjōji on Lake Biwa. An oblong building of five rooms: steps lead past a carriage rest into a vestibule and the master’s reception room, with [[tokonoma]], [[chigaidana]] and an attached study (tsuke shoin); behind decorated doors ([[chodaigamae]]) lies his sleeping room, and a veranda faces the garden. [[source/history-of-japanese-art|pp. 241–242, fig. 276]]"
