description_md: Goya’s nude, painted in the last years of the 18th century[[source/prado-la-maja-desnuda|dated 1795–1800 · „habría que pensar en una datación relativamente temprana, en torno a 1795-96“]], belonged with its companion, the clothed Maja, to the royal favourite Manuel Godoy[[source/prado-la-maja-desnuda|„La primera mención de esta obra data de noviembre de 1800, en la descripción del palacio de Godoy“]]. After his fall both were sequestered; in November 1814 the Inquisition claimed them as obscene paintings[[source/prado-la-maja-vestida|„En noviembre de 1814 son reclamadas por el Tribunal de la Inquisición al considerarse ambas como "pinturas obscenas"“]], to bring proceedings against Goya[[source/wikipedia-es-la-maja-desnuda|„reclamadas ambas obras por el Tribunal de la Inquisición por ser «pinturas obscenas» … y así poder iniciar un juicio contra Goya“]]. They came to the Prado from the Academy of San Fernando in 1901[[source/prado-la-maja-desnuda|„Trasladada a la Real Academia de Bellas Artes de San Fernando el 13 de abril de 1836.“ · „Ingresó en el Museo del Prado en 1901“]].
