description_md: |-
  The carved and inlaid wooden choir of the chapel in the [[institution/palazzo-pubblico|Palazzo Pubblico]] in Siena, made by [[artist/domenico-di-niccolo-dei-cori|Domenico di Niccolò]] from 1415 to 1428: twenty-one stalls along the walls of the chapel. The work gave its maker his nickname, "dei Cori".[[source/wikipedia-it-palazzo-pubblico-siena|§ Anticappella e cappella di Palazzo]]

  The lecture showed one of its panels, the [[artwork/domenico-di-niccolo-creazione-del-mondo|Creation of the World]].[[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 11]]
