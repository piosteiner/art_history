description_md: |-
  [[artist/domenico-di-niccolo-dei-cori|Domenico di Niccolò]]'s intarsia work in the [[institution/palazzo-pubblico|Palazzo Pubblico]] in Siena dates from 1415–1428; the lecture showed a panel with the Creation of the World from it [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 11]]. The panel had already been shown at the end of the preceding session, together with the Creation of the World in Santa Maria Maggiore in Bergamo [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 89–90]].

  The lecture set Domenico's Creation beside the [[artwork/capoferri-lotto-tarsie-bergamo|Creation of the World]] that [[artist/giovan-francesco-capoferri|Giovan Francesco Capoferri]] made after a design by [[artist/lorenzo-lotto|Lorenzo Lotto]] for the backrest of the choir stalls of Santa Maria Maggiore in Bergamo (1524–1532), a century later [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 12–14]]. The comparison belonged to the question of the role of natural materials in intarsia, which Marta Ajmar describes as "reciprocal design", where patterns emerge from the co-operation of the maker with the wood and with more-than-human agents such as fungi, woodworm, fire and water [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 88]] [[source/ajmar-2024-reciprocal-design|p. 25]].
