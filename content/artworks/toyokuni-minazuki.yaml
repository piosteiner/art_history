description_md: "A fan print by [[artist/utagawa-toyokuni]] (1769–1825), whose actor prints of the 1790s made the Utagawa school the most prolific of the nineteenth century: a young woman holds a mirror behind her head to check the nape of her neck in a covered table mirror — a pun on the month’s name, “month without water” or “month of not seeing”. [[source/history-of-japanese-art|pp. 288–289, fig. 329]]"
