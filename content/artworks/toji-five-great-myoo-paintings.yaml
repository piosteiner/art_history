description_md: "For the Mishihō rites held in the Shingonin of the imperial palace in the first week of the new year (begun by Kūkai in 834) the Five Myōō were hung as ritual images. Tōji’s original paintings could no longer be used by 1040; the replacements burnt in 1127, and the first new set was rejected by [[person/emperor-toba]] as too rough and violent — the present set follows another model than Kūkai’s. Kongō Yasha leaps into space in a garment decorated with [[kirikane]], his aura of flames hanging behind him like a curtain: an elegant little creature, nothing like the rough Kongōku of the tenth century. [[source/history-of-japanese-art|pp. 157–158, fig. 192]]"
