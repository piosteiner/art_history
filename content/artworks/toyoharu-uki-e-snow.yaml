description_md: "An [[uki-e]] by [[artist/utagawa-toyoharu]] (1735–1814), the founder of the Utagawa school, using Western one-point perspective: in tatami rooms open to a snow-covered garden, people are served food and drink by young ladies, play Japanese checkers or talk, while one group makes a gigantic snowball. [[source/history-of-japanese-art|pp. 276–277, fig. 315]]"
