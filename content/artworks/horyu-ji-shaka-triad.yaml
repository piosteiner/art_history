description_md: "Tori Busshi’s masterpiece: [[shaka]] seated on a rectangular platform, his robe falling over its front like a waterfall, between two [[bodhisattva|bodhisattvas]], before a halo of flames with the Seven Buddhas of the Past. The inscription on the back of the halo says that [[person/empress-suiko]] and the court commissioned it after the deaths of two court ladies in 621 and during the illness of [[person/prince-shotoku]] the next year, for his recovery or rebirth in paradise; he died in 622, and the triad was dedicated in 623. The style of the Wei dynasty of northern China; the bodhisattvas, seen from the side, are half-reliefs made to be seen only from the front. [[source/history-of-japanese-art|p. 73, fig. 86, 88]]"
