description_md: "The earliest true portrait sculpture in Japan: [[person/ganjin]], the Chinese monk who founded Tōshōdaiji, seated cross-legged in meditation, his blind eyes almost closed; in the Founder’s Hall, dated to the year of his death. The [[dry-lacquer]] is painted, the brocade of the outer robe set against the flesh tones. [[source/history-of-japanese-art|p. 95, fig. 119]]"
