description_md: Ono Hakuko’s speciality is the difficult Chinese technique of cut gold foil used by Eiraku Hozen — but she coats the foil with lacquer before applying it and covers it with a translucent glaze, so that her gilding is brighter and more luminous. [[source/history-of-japanese-art|p. 355, fig. 414]]
