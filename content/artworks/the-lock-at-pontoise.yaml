    ended: 1928-03-19
    place: paris
    label: deposited by Behrendt for the exhibition Tableaux de Camille Pissarro
    sources:
      - url: https://clevelandart.org/art/1990.7
        note: Durand-Ruel’s records show that Behrendt, who lived at 11 rue de Maréchal Maunoury, Paris, deposited the painting with the gallery on January 31, 1928 for the exhibition, Tableaux de Camille Pissarro, and retrieved it on March 19 of that year.
        source: cma-1990-7
        accessed: 2026-11-24
