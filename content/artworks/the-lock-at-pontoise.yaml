    label: 11 rue du Maréchal Maunoury; lent to exhibitions 1928 (Durand-Ruel) and 1931 (Paul Rosenberg); owner per the 1939 catalogue raisonné
    sources:
      - url: https://clevelandart.org/art/1990.7
        note: "Max Behrendt, Paris [date: 1901-at least 1939] — Behrendt is listed as the owner of the painting in the 1939 Pissarro catalogue raisonné, and he lent it to exhibitions in 1928 (Durand-Ruel) and 1931 (Paul Rosenberg)."
        source: cma-1990-7
