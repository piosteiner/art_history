    label: earlier Durand-Ruel (1872) and Tissot (1873) owners in the Wildenstein catalogue raisonné are doubted
    sources:
      - url: https://clevelandart.org/art/1990.7
        note: "Charles Guasco [date: Until 1900] — Prior to Guasco, the Wildenstein catalogue raisonné says that Durand-Ruel, London purchased the painting from Pissarro on May 25, 1872 and then sold it to Tissot on November 17, 1873. In spite of the specificity of these dates, the catalogue raisonné precedes each transaction with a question mark"
