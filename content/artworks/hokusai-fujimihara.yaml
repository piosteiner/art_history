description_md: "From [[artwork/thirty-six-views-of-mount-fuji]], begun in 1823 and completed around 1831: a tiny man kneels inside an enormous barrel, smoothing the joints between its planks, beyond him a parched rice field and, in the far distance, the snow-covered tip of Fuji — the circle of the barrel encloses the craftsman, his work and the beauty of the landscape. [[source/history-of-japanese-art|pp. 290–291, fig. 331]]"
