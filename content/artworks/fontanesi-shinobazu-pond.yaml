description_md: "By [[artist/antonio-fontanesi]] (1818–1882), the Barbizon painter invited to teach at the Kōbu Bijutsu Gakkō, so revered that eleven students left when he returned to Italy in 1878 and formed the Society of the Eleven: the last pink rays of sunset glisten on the small lake near Ueno Park as trees and marsh grass fade into brown dusk. [[source/history-of-japanese-art|pp. 372–373, fig. 442]]"
