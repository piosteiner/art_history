description_md: |-
  An ivory [[term/shrine-madonna|Shrine Madonna]] made in France around 1200, known as the Boubon Madonna and described in the lecture as a Shrine Madonna with Christ as Maiestas Domini (Christ in Majesty).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 110]] It is 43.5 cm high and is now in the Walters Art Museum, Baltimore (inv. 71.152).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 110]]

  Dated around 1200, it is the earliest of the Shrine Madonnas shown in the lecture, which set it beside two later wooden examples: the Rhenish shrine in New York of around 1300 and the West Prussian one from Roggenhausen of around 1390.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 110–115]]
