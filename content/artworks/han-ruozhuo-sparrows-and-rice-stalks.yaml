description_md: |-
  *Sparrows and Rice Stalks* by [[artist/han-ruozhuo|Han Ruozhuo]] dates from the early 12th century. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]] The rice stalks are so heavy with grain that they bend down: a sign of a well-run, prosperous country — peace shown through plenty. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]

  ## In the lecture

  The painting was shown in the session "Early Views of War and Peace" on 1 March 2019, beside the [[artwork/kneeling-crossbowman-qin|kneeling crossbowman]] of the First Emperor's terracotta army. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]] After the military figures, the session asked how peace could be depicted, and named commonly understood symbols: tranquillity and order, leisure and play, the stability of the regime, prosperity and commerce. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]] One such symbol is a rooster resting on a war drum — the land is so peaceful that the drum is never beaten and the bird is not frightened away. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]] Sparrows and rice stalks belong with these images of plenty, in which peace appears as wealth or as the wish for leisure. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]

  The same image list continues with [[artist/zhang-zeduan|Zhang Zeduan]]'s *Going Upriver at the Qingming Festival* (12th century) and [[artist/guo-xi|Guo Xi]]'s *Early Spring*, signed and dated 1072. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]] In Guo Xi's painting the mountain top overseeing the land was read as a symbol of the ruler and of a realm under control, in order and prosperous; in Zhang Zeduan's scroll all the symbols of peace come together, with merchants, harbour, restaurants and crowds on the bridge proclaiming the perfect state. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]
