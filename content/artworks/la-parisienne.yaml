provenance:
  - owner_label: palace of Knossos
    acquired: c. 1450–1350 BCE
    method: creation
    place: knossos
    label: part of the Camp Stool Fresco, probably painted on a wall of the Sanctuary Hall on the upper floor (piano nobile)
    sources:
      - url: https://en.wikipedia.org/wiki/La_Parisienne_(fresco)
        note: The Minoan fresco fragment known as La Parisienne, or sometimes the Minoan Lady, is part of the Camp Stool Fresco, which was probably painted on the wall of the Sanctuary Hall on the room sometimes called the piano nobile at the palace of Knossos on Crete. It dates to the Final Palatial Period, c. 1450–1350/1300 BC
        source: wikipedia-en-la-parisienne-fresco
        accessed: 2026-11-24
  - owner: person/arthur-evans
    acquired: 1901
    method: find
    place: knossos
    label: excavated by Arthur Evans; restored by Émile Gilliéron for him — critics call the recreation almost an invention
    sources:
      - url: https://en.wikipedia.org/wiki/La_Parisienne_(fresco)
        note: The fragment was excavated in 1901 by the British archaeologist Arthur Evans. Evans employed the services of Emile Gillieron to restore some of the excavated frescoes (including La Parisienne).
        source: wikipedia-en-la-parisienne-fresco
        accessed: 2026-11-24
  - owner: institution/heraklion-archaeological-museum
    method: transfer
    place: heraklion
    sources:
      - url: https://en.wikipedia.org/wiki/La_Parisienne_(fresco)
        note: It dates to the Final Palatial Period, c. 1450–1350/1300 BC, and is now in the Heraklion Archaeological Museum.
        source: wikipedia-en-la-parisienne-fresco
        accessed: 2026-11-24
