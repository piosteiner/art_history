description_md: |-
  A limewood relief of the Flagellation of Christ from Zwiefalten by [[artist/niklaus-weckmann|Niklaus Weckmann]], 1520, now in the Landesmuseum Württemberg, Stuttgart; it measures 140 × 120 cm (174 × 148 cm with frame, according to the second measurement given in the lecture).[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 62]]

  In the lecture it stood in a section on wood as a traded material and on the south German carvers' preference for limewood, after images of the carver's workshop: a timber store of the early sixteenth century, Jost Amman's woodcuts of a joiner's and a sculptor's workshop (1568), and late Gothic figures that still show the marks of the clamps that held them on the carving bench.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 59–62]] Weckmann's Ulm workshop was the leading carving workshop of southern Germany; some 600 works from it survive.[[source/wikipedia-de-niklaus-weckmann|§ introduction]][[source/wikipedia-de-niklaus-weckmann|§ Wiederentdeckung]]
