description_md: "From the series that made [[artist/utagawa-hiroshige]] (1797–1858) famous almost overnight, after his journey along the Tōkaidō in 1832: two ships with lowered sails, having just crossed the seventeen miles of Ise Bay from Miya, before Kuwana Castle; the left half has a distinctly Western feeling, the ground tilting to the horizon line. [[source/history-of-japanese-art|pp. 292–293, fig. 334]]"
