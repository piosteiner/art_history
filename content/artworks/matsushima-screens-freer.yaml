description_md: "One of [[artist/tawara-sotatsu]]’s masterworks: a richly coloured rocky outcrop in raging white-capped water, a golden cloud and pine-capped rocks, gold clouds turning into island shores. Called after Matsushima near Sendai, one of the three most beautiful views of Japan, the screens may rather show the Wedded Rocks of Futamigaura near Ise and illustrate the poem of a banished courtier in the Tales of Ise gazing at the foaming surf — the loneliness of the exile in the distorted reality of the landscape. [[source/history-of-japanese-art|pp. 269–271, fig. 311]]"
