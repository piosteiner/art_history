description_md: |-
  Three war cripples at cards: "a frightening mix of wounded flesh, metal pieces, and tubes" — the chaos against which the New Man of the twentieth century takes shape [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 93]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 64]].

  ## Description

  [[artist/otto-dix|Otto Dix]] painted *Die Skatspieler* in oil and collage on canvas in 1920; it was later titled *Kartenspielende Kriegskrüppel* (War cripples playing cards) and is one of his first works in the style of the [[movement/new-objectivity|New Objectivity]] [[source/wikipedia-en-the-skat-players|introduction]]. It shows three mutilated veterans of the First World War playing skat: one holds his cards in his mouth, one with his toes, one with a mechanical hand; part of the head of the man on the left is burnt and his leg replaced by a stick, the man on the right has lost both legs [[source/wikipedia-en-the-skat-players|§ History and description]]. His lower jaw is a prosthesis made from a fragment of a cigarette packet, on which Dix wrote "Unterkiefer: Prothese Mark: Dix", with a photograph of the artist and the words "Nur echt mit dem Bild des Erfinders" (only genuine with the inventor's portrait); behind the players hang three newspapers, the *Dresdner Anzeiger*, the *Dresdner Neueste Nachrichten* and the *Berliner Tageblatt*, and in the lamp there is a skull [[source/wikipedia-en-the-skat-players|§ History and description]].

  ## Context

  The picture belongs to a group of four paintings of 1920 on the post-war atmosphere — *The Street in Prague*, *The Match Seller*, *The Skat Players* and *The Barricade* [[source/wikipedia-en-the-skat-players|§ History and description]]. After the war there were 2.7 million wounded German soldiers, 800,000 of them disabled; Dix had seen three mutilated veterans playing cards in the back room of a Dresden café, drew the scene at once, and in the painting heightened its horror [[source/wikipedia-en-the-skat-players|§ History and description]].

  For Éric Michaud, Dix's soldiers are "out of joint", and "it is by way of contrast with this present chaos that the New Man articulates his various figures" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 64]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 93]]. The seminar set it beside [[artwork/leger-la-partie-de-cartes|Léger's card players]] of 1917, whose metallic soldiers Michaud reads as the positive side of the same transformation [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 63–64]].

  ## Later history

  Considered "degenerate" under National Socialism, the painting was hidden by a friend and survived the bombing of Dresden in February 1945 [[source/wikipedia-en-the-skat-players|§ Provenance]]. A collector bought it in 1959 and lent it to the Galerie der Stadt Stuttgart; his heirs sold it in 1995 to the Nationalgalerie in Berlin, which raised donations to acquire it [[source/wikipedia-en-the-skat-players|§ Provenance]].
