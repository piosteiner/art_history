description_md: "Twelve murals of the golden hall: four wide panels with the Buddhas of the four directions in their paradises — among them [[amida]] on the west wall between Kannon and Seishi — and narrow panels with bodhisattvas. Painted on plaster from cartoons transferred by pouncing, the lines in red of even width (“iron wire”), the style close to the Tang paintings of China. A fire in 1949 left most of them blackened; the Amida Triad is in the Treasure House. [[source/history-of-japanese-art|p. 82, fig. 101]]"
