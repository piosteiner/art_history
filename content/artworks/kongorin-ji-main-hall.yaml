        note: 本堂（[[国宝]]）は、[[元寇]]の戦勝記念として佐々木頼綱（六角頼綱）によって建立されたものであるという … [[天正]]元年（[[1573年]]）に[[織田信長]]の兵火で[[湖東三山]]の1つである[[百済寺]]は全焼し、当寺も被害を受けるが、現存の本堂、[[三重塔]]は寺僧の尽力で焼失をまぬがれた
