    label: Baccio di Maso Bacci (d. 1428) left a legacy to decorate the choir of San Francesco; Bicci di Lorenzo began, fell ill in 1452 — Giovanni Bacci then probably called Piero della Francesca, who finished by 1466
    sources:
      - url: https://it.wikipedia.org/wiki/Storie_della_Vera_Croce
        note: Nel 1428 era morto Baccio di Maso Bacci, un ricco mercante appartenente a un'importante famiglia aretina, nelle cui disposizioni testamentarie era previsto un generoso lascito per la decorazione del coro della basilica francescana, patronato dalla famiglia stessa. […] Presumibilmente Giovanni Bacci […] chiamò allora un artista della nuova corrente artistica, scegliendo Piero della Francesca
        source: wikipedia-it-storie-vera-croce
