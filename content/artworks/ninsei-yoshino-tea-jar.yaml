description_md: "A storage jar for tea leaves by Nonomura [[artist/nonomura-ninsei]] (c. 1574–1660s), the first potter known by name of [[kyoyaki]]: on the round, short-necked form of the Tamba kilns he painted low rolling hills overlaid with squares of gold leaf and cherry blossoms, suggesting Yoshino — the yamato-e revival of Kōetsu and Sōtatsu turned to ceramics. His studio name joins Ninnaji, the temple beside his kiln, with Seiemon. [[source/history-of-japanese-art|pp. 297–298, fig. 341]]"
