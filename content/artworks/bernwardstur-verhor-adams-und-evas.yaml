description_md: |-
  The fourth field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows God questioning Adam and Eve after the Fall.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 36]] In the lecture's list of typological pairs it is the "interrogation and condemnation of Adam and Eve", set opposite Christ's interrogation by Pilate on the right leaf.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]] The door's figures characteristically answer one another with gestures across large empty fields – Alexander von Reitzenstein called these spaces a "field of corresponding gestures" – and hardly any figure would make sense without its counterpart.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]]

  The pairing turns the scene into a contrast of judgements: the first human beings answer for their guilt before God, while on the opposite leaf Christ, without guilt, stands before a human judge.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 53]]
