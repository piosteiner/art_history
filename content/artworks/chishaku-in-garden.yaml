description_md: "A masterpiece of early Edo garden design at [[institution/chishaku-in]], the Chizan Shingon temple founded in 1601 at the foot of the Eastern Hills on the site of a temple destroyed by Hideyoshi in 1585. Designed by one of its early abbots, Zuiō Hakunyo, it is no dry garden: a long, narrow pond below the veranda of the residence, a tearoom at one end, plantings clipped into the shapes of the rolling hills around Kyoto. [[source/history-of-japanese-art|p. 244, fig. 280]]"
