        note: Possibly Comte André de Ganay [1863-1912], Paris — The catalogue of the 1914 Galerie Georges Petit sale of the Fairfax Murray collection says that this painting was formerly in the Comte de Ganay collection. ... It is possible that the Galerie Georges Petit incorrectly assumed that the Largillière in the 1903 sale was the painting in Fairfax Murray’s collection, and that Ganay should not be in this provenance.
