description_md: |-
  The two-leaf oak door from Burg Lenzen on the Elbe dates from around 1000.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 78]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 63]] Ittai Weinryb gives its size as 187 × 32 cm and its holder as the Brandenburg State Office for the Preservation of Historical Monuments and State Archaeological Museum (inv. 2001:703/775), after the exhibition catalogue "Credo. Christianisierung Europas im Mittelalter" — the lecture's slide gives 178 cm and the Mecklenburg-Vorpommern office, the caption of the Tollensesee idol shown two slides before.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 64]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 143]] It is a simple but decoratively perforated door through which one could look in and through which light fell.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 63]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 65]]

  Burg Lenzen (Slavic Luczyn) is first named in September 929, when Saxon troops took it in the battle of Lenzen; after the Slavic uprising of 983 it was again under Slavic control.[[source/wikipedia-de-lenzen-elbe|§ Mittelalter]] Weinryb introduces the door after the reconstructed Slavic temple site of Groß Raden, as a clue to how such sites were built and looked in the time before the [[artwork/bernwardstur|Hildesheim bronze door]].[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 63]] The light passing outwards through the holes of the leaves may, he suggests, have resembled the light that later broke on the bronze leaves; the wooden door could thus be seen as a forerunner of the Hildesheim door not only in its function but also in the experience it offered – an entirely different aesthetic experience from that of the bronze.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 65]]

  The lecture showed the door after a two-headed Slavic oak idol from the Tollensesee and the temple site of Groß Raden, in the section on Bernward's decision for bronze.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 76]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 77]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 78]]
