title: Yuima, Kōfukuji
creator: jokei
created: 1196
kind: sculpture
medium: Wood with paint and inlaid eyes
materials: [wood, rock crystal]
dimensions: [87.9]
institution: kofuku-ji
description_md: The lay sage Vimalakirti, a pair with the bodhisattva Monju, after the debate in the Yuima sutra — but [[artist/jokei]] makes him a robust figure rather than the sick old man of the text, seated on a tall platform backed by a structure draped with brocade, the lion throne Chinese in flavour. An inscription by Jōkei in the chest cavity says he carved it in 1196 in fifty-three days, and that the painter Kōen took fifty days for the surface and colours. [[source/history-of-japanese-art|pp. 192–193, fig. 223]]
