description_md: "The altarpiece of the [[institution/contarelli-chapel]], in two versions. The [[artwork/san-matteo-e-langelo-prima-versione]] was installed on 26 May 1602 and replaced by the [[artwork/san-matteo-e-langelo-seconda-versione]] in February 1603. Whether the first was rejected for an “irreverent” saint, as Giovanni Baglione wrote, is doubted: it may only have been hung for a while until the altar was finished. Vincenzo Giustiniani bought it; it is known today only from photographs."
