description_md: |-
  [[person/benito-mussolini|Benito Mussolini]] at the threshing, painted in 1939 by [[artist/basilio-cascella|Basilio Cascella]]: the leader as one of the people. The seminar set it beside [[artwork/gerasimov-lenin-on-the-tribune]] under the theme of the image of the leader [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]]. Images of leaders were produced to spread their likeness through society, and agricultural labour served to shape norms [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]].

  The motif belongs to the cult of the Duce built up from 1926 onward: millions of photographs showed Mussolini in characteristic poses, often bare-chested while swimming or harvesting, and he was presented to Italians from school onward as a figure with superhuman qualities [[source/wikipedia-en-benito-mussolini|§ Consolidation of power]]. Cascella, a member of the National Fascist Party and a deputy from 1929 to 1934, turned after his move to Rome in 1928 to celebrating events of the regime; among his late works is a *Trebbia del grano* (threshing of the wheat), formerly at the Ministry of Agriculture in Rome [[source/wikipedia-en-basilio-cascella|§ Biography]] [[source/wikipedia-en-basilio-cascella|§ Work and style]].
