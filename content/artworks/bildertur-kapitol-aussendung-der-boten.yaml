description_md: This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows Herod sending out his messengers and the messengers reporting the departure of the Magi.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 94]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] The lecture grouped it with the neighbouring Herod scenes – the Magi before Herod and the massacre of the innocents.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 109]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 110]] The door's unusually extensive Herod episodes are the subject of Klaus Gereon Beuckers's study "Rex iubet – Christus imperat" (1999) on the doors and on depictions of Herod before the Investiture Controversy.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Literatur]]
