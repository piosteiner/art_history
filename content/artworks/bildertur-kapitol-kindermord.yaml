description_md: This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows Herod giving the order for the massacre of the innocents, and the killing of the children.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 95]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] The lecture showed it together with the sending out and return of Herod's messengers as one sequence of the Herod story.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 110]]
