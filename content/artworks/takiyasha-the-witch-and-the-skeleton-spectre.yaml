description_md: "A triptych by [[artist/utagawa-kuniyoshi]] (1798–1861) after the Kabuki play Sōma dairi (1844) on the rebellion of Taira no Masakado (d. 940): his daughter Takiyasha, disguised as a courtesan, summons a giant skeleton to overpower a samurai who has come to the ruined Sōma palace. Kuniyoshi, best known for his warrior prints, truly captured the late Edo taste for the bizarre. [[source/history-of-japanese-art|pp. 289–290, fig. 330]]"
