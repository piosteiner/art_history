description_md: |-
  The high altarpiece that [[artist/veit-stoss|Veit Stoss]] made in 1520–23 for the Carmelite church of the Assumption of the Virgin in Nuremberg, now in Bamberg Cathedral.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 100]] The supporting parts are fir, the figures and reliefs lime; the altarpiece is 3.55 m high and 2.92 m wide when open.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 100]] It was heavily restored in the eighteenth, nineteenth and twentieth centuries, and its left wing and crowning have been lost.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 100]]

  ## Commission

  It was Stoss's last work, commissioned in 1520 by his son Andreas, prior of the Nuremberg Carmelites, and was to remain without hasty painting.[[source/wikipedia-de-veit-stoss|§ Nürnberg]] Stoss's presentation drawing (Visierung) of 1520 survives in the Jagiellonian University Museum in Kraków.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 101]][[source/wikipedia-de-veit-stoss|§ Zweidimensionale Werke]] In 1523 the prior wrote into the anniversary book of the monastery:

  > "No prior shall lightly have this panel painted with colours; all the masters skilled in that art will tell him the reason. The panel shall be opened only at Christmas, Easter, Pentecost and the two following days, Ascension, Trinity, All Saints, Epiphany, Corpus Christi, the dedication of the church and all feasts of the Virgin; on these days it shall be closed as soon as second Vespers are over. It shall be cleaned twice a year. And no large candles on the altar because of the smoke; two small wax candles suffice, the others shall be placed beside the altar."[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 102]]

  The Latin begins "Nullus prior faciat eam [tabellam] coloribus pingere faciliter".[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 102]] It is one of very few documents that say anything about leaving a carved altarpiece unpainted.[[source/wikipedia-de-tilman-riemenschneider|§ Farbige Fassung und „Holzsichtigkeit“]] Georg Habenicht argues that, apart from small boxwood retables, hardly any unpainted winged retable can be shown with certainty to have been meant to stay unpainted, since nothing could stop a patron from having it painted later.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 184]]

  ## Later history

  With the Reformation the monastery was dissolved and the last instalments were never paid to Stoss; the altarpiece came to the Upper Parish Church of Our Lady in Bamberg.[[source/wikipedia-de-veit-stoss|§ Nürnberg]] A nineteenth-century restoration is responsible for its present dark appearance; since 1937 the reliefs of the centre, with the Adoration of Christ, and the wings have been displayed in Bamberg Cathedral, other parts in the Diocesan Museum.[[source/wikipedia-de-veit-stoss|§ Nürnberg]]
