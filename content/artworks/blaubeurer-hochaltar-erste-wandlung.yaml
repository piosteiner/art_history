description_md: |-
  The first opening of the Blaubeuren high altarpiece: sixteen painted scenes from the life of John the Baptist, patron of the abbey church, from the annunciation to his father Zacharias to the burial of the Baptist's head.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 40]] They were painted by [[artist/bernhard-strigel|Bernhard Strigel]] and [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]] in 1491–1494.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 40]]

  The scenes cover the outer wings' inner sides and the outer sides of the inner wings; they form the middle stage between the Passion scenes of the closed altarpiece and the carved shrine with the Virgin and saints.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 39–41]] Multiple wings allowed the display to be matched to the rank of the feast day, each opening showing a new "page" of images.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 187]]
