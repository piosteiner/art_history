description_md: "Late in life Gahō returned to the classic ink painting of his Japanese forebears: light and dark ink, precise brushstrokes and wet washes, each scene anchored by a robust outcropping of rocks[[source/philamuseum-338956|“Late in life Hashimoto Gahō returned to the classic ink painting techniques of his Japanese forebears, as in this lyrical landscape. The artist skillfully balances light and dark ink, precise brushstrokes, and wet washes, anchoring each scene with a robust outcropping of rocks”]]. Bought by the museum in 2016[[source/philamuseum-338956|“Purchased with the Hollis Fund for East Asian Art Acquisitions, 2016”]]."
