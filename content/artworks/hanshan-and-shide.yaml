        note: 因陀羅【いんだら】は、本図の款記より、法名を壬梵因といい、開封【かいほう】の大光教禅寺に住し、大師号を授けられた高僧とわかります。本図は禅林とその周辺の人物にかかわる逸話を主題にした禅機図巻(ぜんきずかん)の断巻といわれます。 … 作者 | 因陀羅筆、楚石梵琦賛 | 時代・世紀 | 元時代・14世紀
        source: tnm-ta343
        accessed: 2026-11-24
