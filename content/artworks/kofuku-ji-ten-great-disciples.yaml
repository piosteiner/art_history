description_md: Six surviving figures from a set of the ten disciples of [[shaka]], made in [[hollow-dry-lacquer]] for the western golden hall that [[person/empress-komyo]] dedicated to her mother in 734. Monkish figures on rock-shaped bases; the face of Kasenen, contorted in an open-mouthed grimace above an emaciated chest, evokes his long self-denial. [[source/history-of-japanese-art|p. 84, fig. 104]]
