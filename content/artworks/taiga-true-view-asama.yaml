public_id: 107992
title: True View of Mount Asama
creator: ike-taiga
created: c. 1760
created_span: uncertain
kind: kakemono
medium: Ink and colour on paper
materials: [ink, paper]
dimensions: [57, 102.7]
description_md: "The first painting identified as a [[shinkeizu]]: on the evidence of style [[artist/ike-taiga]] had seen Western copperplate etchings, and he used layered perspective, etching-like lines and light washes for what claims to be the true appearance of the mountain. But, as Melinda Takeuchi has shown, it combines two views — the lower right from a separate drawing, the horizon a reworked sketch of Fuji — and its poem, dedicated to Master Gion, makes it an expression of the painter’s character. [[source/history-of-japanese-art|pp. 330–331, fig. 385]]"
