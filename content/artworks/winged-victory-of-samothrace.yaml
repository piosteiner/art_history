        note: En 1863, Charles Champoiseau (1830-1909), chargé par intérim du consulat de France à Andrinople […] entreprend du 6 mars au 7 mai l'exploration des ruines du sanctuaire des Grands Dieux dans l'île de Samothrace. Le 13 avril 1863, il découvre une partie du buste et le corps d'une grande statue féminine
        source: wikipedia-fr-victoire-de-samothrace
