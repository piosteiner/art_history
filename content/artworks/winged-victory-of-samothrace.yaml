description_md: |-
  A Hellenistic statue of Nike, the winged goddess of victory, alighting on the prow of a warship. The Louvre dates it to the first quarter of the 2nd century BC (about 200–175 BC) and names [[place/rhodes|Rhodes]], with a question mark, as the place where it was made. The statue is of [[parian-marble|Parian marble]]; the ship's prow and the plinth are of grey [[lartos-marble|Lartos marble]].[[source/louvre-victoire-de-samothrace-ma-2369]]

  [[person/charles-champoiseau|Charles Champoiseau]] excavated it in 1863 at Palaiopolis on [[place/samothrace|Samothrace]], in the sanctuary of the Great Gods. It reached the Louvre in stages, in 1864, 1879 and 1891, which is why the museum records three entry numbers beside its catalogue number Ma 2369.[[source/louvre-victoire-de-samothrace-ma-2369]]

  The monument was assembled from many pieces. The bust and the wings of the statue were carved separately and attached, as were pieces of drapery at the back and on the ground; joint surfaces remain on the right arm, the left calf, the right foot and the front of the drapery. The prow is built of 16 blocks in three courses, the plinth of six slabs laid side by side, and Greek letters cut into the plinth (alpha, beta, gamma, three deltas and epsilon) marked where the slabs belonged. In all the monument stands 564 cm high, the statue alone 328 cm; the Louvre estimates the statue's weight at about 2 tonnes and the whole at about 32 tonnes.[[source/louvre-victoire-de-samothrace-ma-2369]]

  The head, the neck, both arms, the left side and the back of the bust, the right wing, the right foot, the left calf and foot and the lower drapery at the back are lost. The left breast, the area of the belt, the back of the bust and the right wing were made up in plaster, and a metal frame holds the wings. One block of the prow's upper course is kept in the museum on Samothrace; the most recent restoration, in 2014, put back two fragments of feathers and nine of the prow. The statue stands in the Denon wing, on the landing named after it (room 703).[[source/louvre-victoire-de-samothrace-ma-2369]]

  In the founding manifesto of [[movement/futurism|Futurism]] in 1909, [[person/filippo-tommaso-marinetti|Filippo Tommaso Marinetti]] declared "a roaring car that seems to ride on grapeshot" to be "more beautiful than the Victory of Samothrace".[[source/cioli-ricciardi-schiera-2019|p. 176]]
