    label: the Medici bank's representative in Bruges commissioned it for the Portinari chapel in Sant'Egidio, church of the hospital of Santa Maria Nuova; by sea to Pisa, up the Arno, in Florence on 28 May 1483
    sources:
      - url: https://www.uffizi.it/en/artworks/adoration-of-the-shepherds-with-angels-and-saints-recto-annunciation-verso
        note: During his time in Flanders, Tommaso Portinari commissioned Flemish painter Hugo van der Goes to paint the Adoration of the Shepherds Triptych to adorn the Portinari family chapel in the church of Saint Giles in the Santa Maria Nuova hospital in Florence. The painting's arrival in Florence in 1483, having first reached Pisa by sea, was quite an event
        source: uffizi-artworks
