description_md: |-
  A Koryŏ Buddhist painting of breathtaking beauty — Amitābha descending with two bodhisattvas, the main figure overpoweringly large, the robes covered with roundels, the jewellery and transparent silks rendered with gold. Most such paintings survive in Japanese temples and were long thought Chinese; their re-attribution began with an exhibition at the Yamato Bunkakan in 1978. [[source/portal-2000|pp. 89–90, fig. 45]]

  ## In Tokyo

  The painting is the Tokyo National Museum's *Amitābha with Two Attendants* (TA-59): a descent (raigō) in which Amitābha floats on auspicious clouds with his right hand stretched out, Avalokiteśvara with a willow branch on his right and Mahāsthāmaprāpta on his left; the red and green of the Buddha's robe and the translucent veils of the two bodhisattvas are covered with very fine patterns in gold paint [[source/colbase-tnm-ta-59|description]]. The museum dates it to the 13th–14th century, Jane Portal to the 13th [[source/colbase-tnm-ta-59|date]] [[source/portal-2000|p. 90, fig. 45]]. Portal names it among the examples of Amitābha triads — with those in the Brooklyn Museum and the Hoam Museum in Korea — a type that also goes by the name "Descending Amitābha" (Naeyong-do), after the belief that Amitābha comes down with bodhisattvas to fetch a dying devotee to the Pure Land [[source/portal-2000|p. 89]].
