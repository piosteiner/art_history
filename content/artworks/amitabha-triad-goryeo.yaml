description_md: A Koryŏ Buddhist painting of breathtaking beauty — Amitābha descending with two bodhisattvas, the main figure overpoweringly large, the robes covered with roundels, the jewellery and transparent silks rendered with gold. Most such paintings survive in Japanese temples and were long thought Chinese; their re-attribution began with an exhibition at the Yamato Bunkakan in 1978. [[source/portal-2000|pp. 89–90, fig. 45]]
