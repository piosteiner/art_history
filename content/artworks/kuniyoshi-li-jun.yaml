description_md: |-
  Li Jun, "the Dragon in the Turbulent River", from the series 通俗水滸伝豪傑百八人之一個 (*One of the 108 Heroes of the Popular Water Margin*) — the 26th of the 108 heroes of the [[literature/water-margin]], signed Ichiyūsai Kuniyoshi ga. The British Museum keeps three impressions. [[source/arc-bm-1906-1220-1249]]

  ## The series

  [[artist/utagawa-kuniyoshi|Utagawa Kuniyoshi]] (1798–1861), a pupil of Toyokuni who then went his own way, produced in 1827 a series of warrior prints of one hundred and eight heroes from the Chinese novel *Shuihuzhuan* (Japanese *Suikoden*), which tells of a band of outlaws who valiantly sacrifice themselves for the emperor. [[source/history-of-japanese-art|p. 288]] The images, stylistically inspired by Shōun Genkei's sculptures of the five hundred rakan at the Gohyaku Rakanji in Edo, were an instant sensation. [[source/history-of-japanese-art|p. 288]] The publisher Kagaya Kichibei had commissioned the series, which appeared from 1827 to 1830 and made Kuniyoshi famous. [[source/wikipedia-en-water-margin|§ Non-English translations]] It also set off a craze for multicoloured pictorial tattoos covering the body from the neck to the mid-thigh. [[source/wikipedia-en-water-margin|§ Non-English translations]] The way had been prepared by Kyokutei Bakin's Japanese version of the novel with illustrations by [[artist/katsushika-hokusai|Hokusai]], published from 1805, which started a "Suikoden" craze. [[source/wikipedia-en-water-margin|§ Non-English translations]] Though Kuniyoshi worked in other genres too, he is best known today for such musha-e (warrior pictures), especially his triptychs. [[source/history-of-japanese-art|p. 288]]

  ## In the lecture

  The lecture dates the print about 1827–30 and showed it on 3 May 2019 in the session "Early Modern Views of War and Peace", whose sample objects were woodblock prints and imperial tours of the south. [[source/thomsen-2019-war-and-peace|image list, 3 May 2019]] [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] On the image list it follows prints of Japan's modern wars — [[artist/taguchi-beisaku|Taguchi Beisaku]]'s *Lt. Takenouchi* (1894), [[artist/migita-toshihide|Migita Toshihide]]'s *After the Fall of Weihaiwei* (1895) and [[artist/kobayashi-kiyochika|Kobayashi Kiyochika]]'s *Japanese Dentist Pulls out the Tooth of Russian Soldier* (1904). [[source/thomsen-2019-war-and-peace|image list, 3 May 2019]] The vocabulary of the day lists "Shuihuzhuan / Suikoden / Tales of the Water Margin" and "Tattoos" beside the Sino-Japanese and Russo-Japanese wars. [[source/thomsen-2019-war-and-peace|vocabulary list, 3 May 2019]]
