description_md: "From the bust portraits of [[artist/tsuruya-kokei]] (b. 1946), who single-handedly revived the ukiyo-e actor print after Sharaku: the great onnagata [[person/nakamura-utaemon-vi]] as Tonase, the strong, virtuous samurai lady of Chūshingura, grasping the hilt of her absent husband’s sword. Tsuruya prints only some seventy impressions and then defaces his blocks. [[source/history-of-japanese-art|pp. 386–387, fig. 462]] The British Museum's impression is no. 14 of 45. [[source/british-museum-1986-0707-0-8]]"
