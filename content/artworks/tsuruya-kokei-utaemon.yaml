public_id: 108258
title: The Actor Nakamura Utaemon VI as Tonase in Kanadehon Chūshingura
creator: tsuruya-kokei
created: 1984
kind: Japanese woodblock print
medium: Colour woodblock print with powdered mica
materials: [paper]
dimensions: [39.5, 25]
institution: british-museum
description_md: "From the bust portraits of [[artist/tsuruya-kokei]] (b. 1946), who single-handedly revived the ukiyo-e actor print after Sharaku: the great onnagata [[person/nakamura-utaemon-vi]] as Tonase, the strong, virtuous samurai lady of Chūshingura, grasping the hilt of her absent husband’s sword. Tsuruya prints only some seventy impressions and then defaces his blocks. [[source/history-of-japanese-art|pp. 386–387, fig. 462]]"
