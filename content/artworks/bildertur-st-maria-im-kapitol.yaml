description_md: |-
  The two-leaf carved door of [[institution/st-maria-im-kapitol|St. Maria im Kapitol]] in Cologne was made around the middle of the 11th century and is the only almost completely preserved wooden church door of its time.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol]] The lecture called it "the oldest wooden picture door of the Middle Ages" and dated it 1040/65 or 1050/65; its leaves are of oak, the reliefs and frames of walnut, each leaf 485 × 125 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 81]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 86]] Its 26 reliefs with scenes from the life of Christ form the most important surviving Christological relief cycle of the 11th century.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol]]

  ## Commission and setting

  In the middle of the 11th century Archbishop Hermann II of Cologne and his sister Ida, abbess of the house of canonesses of St. Maria im Kapitol, began the new church, a cross-shaped basilica with three conches whose plan follows the Church of the Nativity in Bethlehem; Pope Leo IX consecrated the cross altar and nave in 1049 in the presence of Emperor Henry III, and Archbishop Anno II gave the final consecration in 1065.[[source/wikipedia-de-st-maria-im-kapitol|§ Hoch- und Spätmittelalter]] The lecture framed the door with the theme of the Entry into Jerusalem – the church as a new Jerusalem – and with "Ida's decision for wood", in contrast to Bernward's decision for bronze at Hildesheim.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 56]] The door was hung at the town-side portal of the north conche when the church was completed around 1060; because the convent stood on the Kapitol hill and the north conche lay higher than the rest of the building, only a wooden bridge led to this main entrance, where on special occasions the abbess greeted the emperor.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Standorte der Tür]] From the 12th century a porch protected it.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Standorte der Tür]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 83]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 84]]

  ## Construction

  Each leaf consists of three oak planks onto which the walnut frames and panels are fixed with iron pins and nails driven through round knobs at the corners; bead mouldings and openwork interlace bands hide the joints, so that the whole looks carved from a single piece, a construction that follows antique and late antique tradition.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Herstellung]] Painted tituli between the panels and the outer frame name each scene.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Herstellung]] The reliefs are deeply carved, with figures projecting beyond the frames, feet, legs and heads coming further forward than the bodies.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Tafeln und Figuren]] Remains of the original colouring were uncovered in 1936 at the Schnütgen-Museum: strong red in the frames, red or green bead mouldings, yellow grounds recalling the gold grounds of book painting, and eyes, mouths and folds painted where they were too fine for the knife.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Tafeln und Figuren]] A project by Regina Urbanek at the TH Köln (2021) reconstructed the first colouring of the 11th century and a second one of the mid-12th century.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 130]]

  ## Programme

  Twenty-two panels tell the life of Jesus from the Annunciation to Pentecost; four further panels at the bottom show the three temptations of Christ and his veneration by two cherubim.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] The left leaf shows the birth and childhood of Christ after Matthew, the right leaf his ministry and Passion.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] Several panels were rearranged over time: by the tituli the Annunciation to the shepherds came before the Nativity, and on the right the Crucifixion should come first, then the women at the tomb and the Ascension; the lower right panel of the left leaf was lost, probably after a plaster cast of around 1900.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Anordnung und Verlust]] Richard Hamann distinguished two carvers from one workshop – the large panels of the left leaf each show two scenes, those of the right leaf one – and called one of them the "master of the parallel figures".[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]

  ## History

  The porches were rebuilt in 1832; in the early 20th century the leaves were taken off and put in a corner of the porch behind a wire grille.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Standorte der Tür]] During the Second World War they were evacuated, kept after the war in Cologne Cathedral, and returned to the church in 1950; today they stand in the south aisle.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Standorte der Tür]] Recent thefts of carved parts have caused more damage than weathering or the war.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Anordnung und Verlust]]

  ## Models

  Its closest relative is the bronze [[artwork/bernwardstur|Bernward door]] in Hildesheim (around 1015), which German Wikipedia calls its main model in structure and choice of subject; older precedents are the late antique wooden doors of [[artwork/porta-lignea-sant-ambrogio|Sant'Ambrogio]] in Milan and [[artwork/porta-di-santa-sabina|Santa Sabina]] in Rome, and Cologne and Liège ivories of the early 11th century may have shaped the reliefs.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Vorbilder und Nachahmungen]][[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]
