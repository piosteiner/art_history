description_md: |-
  Courbet's realism of labour — with [[artwork/madonna-di-loreto]] the seminar's reminder of the traditions of realism that totalitarian art drew on [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 24]].

  ## Description

  The painting shows two road labourers, a young man and an old man, breaking stones by the roadside, in tattered clothes and wooden clogs; their faces are not shown [[source/wikipedia-en-the-stone-breakers|§ Description and analysis]]. [[artist/gustave-courbet|Gustave Courbet]] described them himself: "On one side is an old man of seventy, bent over his work, his sledgehammer raised, his skin parched by the sun, his head shaded by a straw hat … On the other side is a young man with swarthy skin, his head covered with dust; his disgusting shirt all in tatters reveals his arms and parts of his back" [[source/wikipedia-en-the-stone-breakers|§ Description and analysis]]. Unlike the peasants of Jules Breton, Courbet's are not idealised [[source/wikipedia-en-gustave-courbet|§ The Stone Breakers]].

  ## Origin

  Courbet began the picture in November 1849, after seeing two men breaking stones on the road near Maisières, and wrote to Francis and Marie Wey: "One rarely encounters the most complete expression of poverty, so right there on the spot I got an idea for a painting" [[source/wikipedia-en-the-stone-breakers|§ History]]. He painted it on the same scale as *A Burial at Ornans* [[source/wikipedia-en-the-stone-breakers|§ Description and analysis]]. It is considered the first of his great works [[source/wikipedia-en-gustave-courbet|§ The Stone Breakers]].

  ## Reception

  At the Paris Salon of 1850–1851 the picture caused a sensation: critics found the subject unfit for high art, the workers "brutish, worn and dirty", and some objected to the thick paint applied with the palette knife [[source/wikipedia-en-the-stone-breakers|§ Reception]]. Champfleury declared: "starting today, critics can get ready to fight for or against realism in art" [[source/wikipedia-en-the-stone-breakers|§ Reception]]. [[person/pierre-joseph-proudhon|Pierre-Joseph Proudhon]] called it "a masterpiece in its genre" and a successful "socialist painting" [[source/wikipedia-en-the-stone-breakers|§ Reception]]. In the seminar "Art and Totalitarianism" it stood with Caravaggio's *Pilgrims' Madonna* for the long tradition of realism that the regimes' official art claimed [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 24]].

  ## Loss

  The picture was bought around 1882 by the Gemäldegalerie Alte Meister in Dresden [[source/wikipedia-en-the-stone-breakers|§ History]]. It is usually said to have been destroyed during the bombing of Dresden on 13–15 February 1945, together with 153 other paintings, when a transport taking works to the Königstein Fortress was hit [[source/wikipedia-en-gustave-courbet|§ The Stone Breakers]] [[source/wikipedia-en-the-stone-breakers|§ History]]. Richard Raskin, however, wrote in 1988 that it was not on that transport and that the museum lists it as missing since a transfer in 1944 [[source/wikipedia-en-the-stone-breakers|§ History]]. A smaller second version, a mirror image measuring 56 × 85 cm, is in the Oskar Reinhart Collection in Winterthur [[source/wikipedia-en-the-stone-breakers|§ History]].
