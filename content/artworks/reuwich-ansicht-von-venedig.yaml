description_md: |-
  [[artist/erhard-reuwich|Erhard Reuwich]]'s view of [[place/venice|Venice]] is a woodcut printed on four sheets, 30 × 163.5 cm, in Bernhard von Breidenbach's "Peregrinatio in terram sanctam", printed in [[place/mainz|Mainz]] in 1486 [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 54]]. Breidenbach (c. 1440–1497), a canon of Mainz, took the Dutch painter Reuwich of Utrecht with him on his pilgrimage to Jerusalem, on which he accompanied Count Johannes von Solms and his vassal, the knight Philipp von Bicken [[source/bockem-2016-jacopo-de-barbari|p. 55]]. The woodcuts of the book were made after models and sketches that Reuwich drew on the journey of cities, islands such as Rhodes and Crete, inhabitants and animals; the book was printed by Reuwich himself in Mainz and appeared in many editions, also in other languages [[source/bockem-2016-jacopo-de-barbari|p. 55]].

  The panoramas of Venice and Jerusalem are bound into the book as fold-outs, so that the view of Venice could be spread out; Böckem counts the book's views among the early examples of a city view drawn from first-hand observation [[source/bockem-2016-jacopo-de-barbari|p. 55]]. In the lecture it served, together with [[artwork/wolgemut-venedig-schedelsche-weltchronik|Michael Wolgemut's view of Venice]] in the Nuremberg Chronicle (1493), as a forerunner of the far larger [[artwork/barbari-veduta-di-venezia|view of Venice of 1500]] [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 54–55]]. Unlike that view, both earlier ones were part of a book [[source/bockem-2016-jacopo-de-barbari|p. 55]].
