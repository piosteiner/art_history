description_md: The honden of the Naikū, the inner shrine of Ise dedicated to the sun goddess Amaterasu, whose mirror it holds. The classic example of [[shinmei-zukuri]], reached through three further fences; since the reign of Empress Jitō (686–697) rebuilt every twenty years on the empty plot beside the old one — Mason knew the sixty-first rebuilding, of 1993. [[source/history-of-japanese-art|p. 55, fig. 60]]
