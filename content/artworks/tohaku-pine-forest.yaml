description_md: "A pair of six-panel screens in monochrome ink without gold or colour by [[artist/hasegawa-tohaku]]: tall pines seen from a distance in thick mist that hides the lower half of some and the middle of others, appearing and disappearing like grey apparitions — perhaps remembering Mu Qi’s bamboo in mist. Nature here is gentle and hospitable, not an awe-inspiring backdrop for a warlord. [[source/history-of-japanese-art|pp. 262–263, fig. 302]]"
