description_md: |-
  This intarsia panel in the studiolo of Federico da Montefeltro in the [[institution/palazzo-ducale-urbino|Palazzo Ducale]] of Urbino shows a feigned cupboard with books, an hourglass, a candle and a hand brush; it was made by [[artist/benedetto-da-maiano|Benedetto da Maiano]] in 1474–1476 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 64]]. It belongs to the wooden panelling of the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]].

  Feigned cupboards had been a theme of Florentine intarsia since the panelling of the Sagrestia delle Messe in Florence Cathedral, where Antonio Manetti and [[artist/agnolo-di-lazzaro|Agnolo di Lazzaro]] showed cupboard openings with liturgical vessels and books from 1436 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 23–25]]. Vasari later judged that intarsia was suited only to designs with buildings and objects with rectangular outlines, to which light and shade could lend relief, and had always been practised by people "possessing more patience than disegno" [[source/ajmar-2024-reciprocal-design|p. 29]].
