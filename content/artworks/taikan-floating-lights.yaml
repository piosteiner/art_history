public_id: 108254
title: Floating Lights
creator: yokoyama-taikan
created: 1909
kind: kakemono
medium: Hanging scroll, colour on silk
materials: [silk]
dimensions: [143, 52]
institution: museum-of-modern-art-ibaraki
description_md: "[[artist/yokoyama-taikan]] (1868–1958) and Hishida Shunsō saw this form of divination at Varanasi in 1903: women in pale saris float plates of burning oil on the Ganges — if the flame does not go out, good fortune will follow. No outline, only flat areas of colour; the atmosphere light and clear, as if bleached by the Indian sun. [[source/history-of-japanese-art|pp. 366–367, fig. 434]]"
