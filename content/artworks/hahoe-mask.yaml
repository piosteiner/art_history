description_md: One of a set of nine wooden masks from Hahoe village, in the National Museum of Korea and thought to date to the Koryŏ period — rare survivors, for masks were often burnt after a performance. Hahoe masks have separate chins attached with strings; the village’s dance-drama, part of a kut performed every ten years, mocks aristocrats and monks. [[source/portal-2000|pp. 158–160, fig. 87]]
