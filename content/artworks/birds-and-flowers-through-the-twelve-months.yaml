description_md: |-
  A set of twelve hanging scrolls, one for each month, each with the plants and a bird or insect of its season, painted by [[artist/sakai-hoitsu]] in 1823[[source/shozokan-szk000142-twelve-months|“Edo period, dated 1823” · “set of twelve hanging scrolls”]]. “Various kinds of Flowers and Birds of the Twelve Months are known in his works, and this one is superior among them with neat composition and distinct color arrangement. This is also important as a standard work identified to have been painted at age sixty-three.”[[source/shozokan-szk000142-twelve-months|“Various kinds of Flowers and Birds of the Twelve Months are known in his works, and this one is superior among them with neat composition and distinct color arrangement. This is also important as a standard work identified to have been painted at age sixty-three.” (quoting Grace, Beauty and Ingenuity, vol. 1, 2003)]]

  The eighth month, autumn plants under the moon, is discussed by Mason: [[artwork/eighth-month-autumn-plants-and-grasshopper]].
