        source: wikipedia-el-peplophoros-kore
        accessed: 2026-11-24
  - owner_label: excavation on the Athenian Acropolis
    acquired: 1886
    method: find
    place: athens
    label: found in three pieces north-west of the Erechtheion
    sources:
      - url: https://en.wikipedia.org/wiki/Peplos_Kore
        note: The statue was found, in three pieces, in an 1886 excavation north-west of the Erechtheion on the Acropolis of Athens and is now in the Acropolis Museum in Athens.
        source: wikipedia-en-peplos-kore
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Peploskore
        note: Sie wurde 1886 westlich des Erechtheions auf der Akropolis gefunden und befindet sich heute im Athener Akropolismuseum.
        source: wikipedia-de-peploskore
        accessed: 2026-11-24
