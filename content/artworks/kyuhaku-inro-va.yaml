description_md: "An [[inro]] by [[artist/koma-kyuhaku]] in togidashie lacquer: shadows of drunken merriment at a teahouse party fall on the paper of a shōji — a courtesan playing the samisen, a customer dancing. Julia Hutt has traced the design to a woodblock triptych of 1820 by Kikugawa Eizan. The [[ojime]] bead is carved with the face of Daruma. [[source/history-of-japanese-art|pp. 301–302, fig. 347]]"
