public_id: 107196
title: Seated Shaka, Mirokudō, Murōji
attribution_label: Anonymous
created: second half of the 9th century
created_span: uncertain
kind: sculpture
medium: Cypress wood with traces of gofun and paint
materials: [hinoki wood, gofun]
dimensions: [104.1]
institution: muro-ji
description_md: "The most impressive sculpture of Murōji: Shaka seated, carved from a single piece of [[hinoki-wood]] except the knees and forearms, but hollowed in head and chest and the openings closed with fitted pieces. The heavy torso and huge head lean forward over the broad base of the crossed legs, creating a tension between viewer and image. The robe is carved in the rolling-wave style (honpa shiki), a thick fold alternating with a shallow one; it was painted with gofun and textile designs, of which only the white ground and a patch of vermilion remain. [[source/history-of-japanese-art|p. 137, fig. 165]]"
