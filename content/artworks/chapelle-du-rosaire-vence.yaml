        note: La chapelle du Rosaire, dite aussi chapelle Matisse, est une chapelle érigée de 1949 à 1951 à Vence (Alpes-Maritimes) pour le couvent des Dominicains. Conçue par l'architecte Auguste Perret (1874-1954) et décorée par Henri Matisse (1869-1954), elle est consacrée le 25 juin 1951.
