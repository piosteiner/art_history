provenance:
  - owner: person/matsudaira-naomasa
    acquired: 1633
    ended: 1638
    method: commission
    place: matsumoto
    label: lord of Matsumoto 1633–1638; adds the moon-viewing turret to the keep, begun in 1633 as Matsumoto Castle was to lodge Tokugawa Iemitsu on his way to Zenkō-ji in 1634 (he did not come)
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1633（寛永10） 松平直政が松本城主となり、以後辰巳附櫓や月見櫓を天守に増設したり、城内外を整備したりする。
        source: matsumoto-castle-history
        accessed: 2026-11-24
      - url: https://www.matsumoto-castle.jp/about/tower/yagura
        note: 徳川家光は寛永11年（1634）に上洛し、その帰り道に善光寺参詣を願い、宿城として松本城を宛てることになりました。時の松本城主・松平直政は、急遽寛永10年（1633）から普請にかかったと伝えられています。しかし、家光は中山道木曽路等に落石があり、来松しなかったといいます。
        source: matsumoto-castle-yagura
        accessed: 2026-11-24
      - url: https://www.matsumoto-castle.jp/value/national-treasure
        note: 直政は大天守に付け足して、辰巳附櫓と月見櫓を建築しました。
        source: matsumoto-castle-national-treasure
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/924
        note: 棟名 ： 月見櫓 … 時代 ： 江戸前期 年代 ： 寛永 西暦 ： 1624-1643 … その後寛永年間（一六二四～四四）に大増築があり、辰巳附櫓、月見櫓の新築が行われて現在の姿に整えられ
        source: kunishitei-102-924
        accessed: 2026-11-24
  - owner: person/hotta-masamori
    acquired: 1638
    ended: 1642
    method: transfer
    place: matsumoto
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 堀田氏 正盛（まさもり） 寛永15～寛永19（1642）
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Mizuno family
    acquired: 1642
    ended: 1725
    method: transfer
    place: matsumoto
    label: six lords from Mizuno Tadakiyo to Tadatsune; attainted after Tadatsune's sword attack in Edo Castle
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 水野氏 忠清（ただきよ） 寛永19～正保4（1647） … 1725（享保10） 水野忠恒が江戸城内で刃傷事件を起こし、水野家は改易になる。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/tokugawa-shogunate-2
    acquired: 1725
    ended: 1726
    method: confiscation
    place: matsumoto
    label: taken back by the shogunate; received and held for it by the Sanada of Matsushiro
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 松本城は幕府が収公し、松代の真田氏が城を受けとり預かる。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Toda family
    acquired: 1726
    ended: 1871
    method: transfer
    place: matsumoto
    label: nine lords from Toda Mitsuchika to Toda Mitsuhisa, the last, who left for Tokyo after the abolition of the domains
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1726（享保11） 戸田氏が再び松本へ入る。 … 同4年7月に、廃藩置県で松本藩は松本県となり、8月には城主・藩知事であった戸田氏は東京へ移っていきました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/ministry-of-war-hyobusho
    acquired: 1871-10
    method: transfer
    place: matsumoto
    label: main bailey and keep handed over by Matsumoto Prefecture to the Ministry of War
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 松本城本丸・天守は明治4年（1871）10月に松本県から兵部省へ引き渡されました。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1872
    place: matsumoto
    label: keep offered for sale by tender; knocked down for 235 ryō 1 bu 150 mon (Shinpi Shinbun no. 1, October 1872), but not demolished
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 明治5年10月の「信飛新聞」第1号には 「 松本城内天守櫓入札御払下ケ仰セ出サレ代金二百三十五両一分永百五十文ニテ落札相成タリ 」 との記事があります。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner: person/ichikawa-ryozo
    role: custodian
    acquired: November 1873 or earlier
    ended: 1876
    place: matsumoto
    label: asked Chikuma Prefecture to lend him the main bailey and keep for exhibitions, offering the bid money raised with supporters; five exhibitions held in the keep 1873–1876
    certainty: probable
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 「 落札金員三百三十余両ハ、同志ヲ募リ献納イタシ、併セテ地租等モ相納可申候間、自今十ヶ年右破却ノ命ヲ弛、拝借被仰付様仕度 」 と本丸・天守の借り受けを申し出ています。 この結果、博覧会は明治6年11月の第1回を皮切りに、明治9年まで天守をつかって5回開催されています。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner: institution/matsumoto-nojikai-matsumoto-agricultural-society
    role: custodian
    acquired: 1880
    place: matsumoto
    label: rented the main bailey, keep and storehouse as a trial ground for fruit and vegetables; per Kubota Utsubo the moon-viewing turret, laid with tatami, served as a rest room
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 明治13年（1880）に安曇郡・筑摩郡の有志50人によって松本農事会が組織されました。この会は、農業試験場にあてる目的で松本城本丸と天守および附属の官庫を借りいれ、果樹蔬菜（野菜）の新種を試験栽培し会員に配布しました。 … 天守の月見櫓に畳を敷いて休憩室にし、天守に登る者からは一人5厘を徴収したとも書かれています（『窪田空穂全集 第6巻』）。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/matsumoto-middle-school
    role: custodian
    acquired: 1902
    ended: 1931
    place: matsumoto
    label: Nagano Prefectural Matsumoto Middle School used the main bailey as its grounds from 1902; the management passed from it to the city in 1931
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 明治35年には、校庭の拡張の必要から本丸庭園を中学校の校庭として使用するようにしました。 … 昭和5年（1930）に松本城が国の史跡に指定されると、これが転機となり翌6年には管理が松本中学校から松本市へ移管されました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: place/matsumoto
    role: custodian
    acquired: 1931
    place: matsumoto
    label: City of Matsumoto manages the castle (managing body under the Cultural Properties law)
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 昭和5年（1930）に松本城が国の史跡に指定されると、これが転機となり翌6年には管理が松本中学校から松本市へ移管されました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/924
        note: 管理団体・管理責任者名 ： 松本市
        source: kunishitei-102-924
        accessed: 2026-11-24
  - owner: institution/ministry-of-education-culture-sports-science-and-technology
    place: matsumoto
    label: owned by the State of Japan (Ministry of Education, Culture, Sports, Science and Technology)
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/924
        note: 所有者名 ： 国(文部科学省) 所有者種別 ： 国 管理団体・管理責任者名 ： 松本市
        source: kunishitei-102-924
        accessed: 2026-11-24
