description_md: |-
  *The Knife Grinder* or *Principle of Glittering* is a Cubo-Futurist painting by [[artist/kazimir-malevich|Kazimir Malevich]]; it came to the [[institution/yale-university-art-gallery|Yale University Art Gallery]] as a gift of the Collection Société Anonyme [[source/yale-1941-553]].

  ## Cubo-Futurism

  Malevich described himself at this time as working in a "Cubo-Futurist" style ([[movement/cubo-futurism]]) and first showed the *Knifegrinder or Principle of Glittering* at the *Target* exhibition in Moscow in March 1913, together with Natalia Goncharova and Mikhail Larionov [[source/wikipedia-en-kazimir-malevich|§ Target Exhibition and Cubo-Futurism (1913)]]. Excerpts of Marinetti's Futurist manifesto had been published in Russia in 1909; artists like Malevich turned its celebration of machines and violence towards experiments with language and perception [[source/wikipedia-en-kazimir-malevich|§ Target Exhibition and Cubo-Futurism (1913)]]. Malevich and other Moscow artists also knew Western modern art from the collections of Sergei Shchukin and Ivan Morozov [[source/wikipedia-en-kazimir-malevich|§ Kursk and Moscow (1896–1905)]]; Shchukin's Matisse panel *Dance* in particular freed the Russian avant-garde from the bounds of European convention [[source/rasmussen-2022|p. 44]].

  ## Italian and Russian Futurism

  In the seminar the painting stood for Russian Futurism beside the Italian ([[movement/futurism]]): in the First World War the Italian Futurists joined the nationalists' war, the Russians were pacifists and internationalists [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 47]] [[source/golomstock-1990|p. 8]]. Golomstock: "Although war was hailed by Marinetti as 'the world's only hygiene', the First World War placed the Italian and Russian Futurists in ideologically opposed camps: the former joined the protagonists of nationalist war whereas the latter were pacifists and internationalists" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 47]].
