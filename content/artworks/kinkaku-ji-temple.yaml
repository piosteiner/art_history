description_md: Ashikaga Yoshimitsu (1358–1409) gave up the office of shogun in 1395 and retired to a villa in the Kitayama (Northern Hills) district of Kyoto, later the temple Rokuonji; “Temple of the Golden Pavilion” is a nickname given later. Its three-storied pavilion, covered with gold foil, stands at the edge of a large artificial lake. The original was burnt in 1950 by an acolyte and rebuilt[[source/history-of-japanese-art|pp. 170–171, 226–229]].
