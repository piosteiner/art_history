description_md: "The retreat of [[person/ashikaga-yoshimitsu]], who took over the site of an older mansion and garden in 1397 and retired there in 1399; it became a temple after his death. The three-storied pavilion, covered with gold foil at the edge of a large lake, combines three styles: a Heian [[shinden-zukuri]] ground floor with hinged lattice panels, a warrior-style second floor with an L-shaped room and veranda for moon viewing, and a top floor with bell-shaped windows housing Amida with twenty-five bodhisattvas and a Buddha relic from Engakuji. Burnt by a disturbed acolyte in 1950 and rebuilt (1964) much as it was. [[source/history-of-japanese-art|pp. 227–228, fig. 262]]"
