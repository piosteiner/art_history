description_md: "A spectacular [[uchikake]] painted in ink with gold leaf and gold powder on white figured silk: bamboo in the mist. Robert T. Singer attributes it to [[artist/gion-nankai]] (1677–1751), founder of the Japanese literati school, after a poem by [[person/rai-sanyo]] describing how a wealthy townsman of Izumi commissioned it for his mistress and persuaded Nankai to add his brush. [[source/history-of-japanese-art|pp. 304–305, fig. 350]]"
