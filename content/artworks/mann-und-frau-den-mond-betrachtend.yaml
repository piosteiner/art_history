description_md: |-
  A painting by [[artist/caspar-david-friedrich|Caspar David Friedrich]] in the [[institution/alte-nationalgalerie|Alte Nationalgalerie]], Berlin: a man and a woman, seen from behind, look at the moon from a path in a dark forest.[[source/wikipedia-en-two-men-contemplating-the-moon|introduction; § Man and Woman Contemplating the Moon]] The lecture "Aus dem Wald" dates it about 1818–1824 and gives oil on canvas, 34 × 44 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 8]]

  ## Description

  It is a variant of *Two Men Contemplating the Moon*, of which Friedrich painted at least three versions; the 1819–1820 painting in Dresden is considered the original, the Berlin variant with a woman is usually dated about 1824.[[source/wikipedia-en-two-men-contemplating-the-moon|introduction]] The art historian Kaspar Monrad has suggested that a man-and-woman version may be the earliest of all, predating 1818, when the Danish writer Peder Hjort reported obtaining such a painting from Friedrich.[[source/wikipedia-en-two-men-contemplating-the-moon|§ Versions]] The couple stands left of centre, the woman's arm on the man's shoulder; their quiet pose contrasts with the contorted, half-uprooted oak, which is set against the upright pine on the left — an asymmetrical construction rare in Friedrich's work.[[source/wikipedia-en-two-men-contemplating-the-moon|§ Man and Woman Contemplating the Moon]] Bare oaks and tree stumps recur in Friedrich's paintings and usually symbolise death, while the slender moon suggests hope and the nearness of Christ.[[source/wikipedia-en-caspar-david-friedrich|§ Landscape and the sublime]] Compared with the Dresden picture, the stump is broken rather than sawn, the dead branch is left out, and the walking stick is missing, though X-rays show where it was planned.[[source/wikipedia-en-two-men-contemplating-the-moon|§ Versions]] In the reading going back to Friedrich's friend Wilhelm Wegener, who saw Friedrich himself in the man of the Dresden picture, the woman would be Friedrich's wife Caroline.[[source/wikipedia-en-two-men-contemplating-the-moon|§ Image description and composition]]

  ## History

  The painting was with the Salomon dealership in Dresden in 1922, was shown at the Paul Cassirer gallery in Berlin in 1932 as a loan from the collection of Lulu Böhler in Lucerne, and was bought by the Alte Nationalgalerie that year from the Fritz Nathan Gallery in Lucerne.[[source/wikipedia-en-two-men-contemplating-the-moon|§ Provenance]] Samuel Beckett is reported to have said in front of it: "This was the source of Waiting for Godot, you know."[[source/wikipedia-en-two-men-contemplating-the-moon|introduction]]

  ## In the lecture

  The lecture "Aus dem Wald" opened with present-day attitudes to the forest — "tree hugging" and "forest bathing" — and then turned to Romantic images of the forest by Friedrich and [[artist/ludwig-richter|Ludwig Richter]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 6]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 8]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 11]]
