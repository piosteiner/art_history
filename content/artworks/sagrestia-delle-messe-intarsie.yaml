title: Tarsie della Sagrestia delle Messe
created: 1436/1468
kind: intarsia
medium: intarsia
institution: florence-cathedral
description_md: |-
  The north sacristy of [[institution/florence-cathedral|Florence Cathedral]], the Sagrestia delle Messe, is lined with wooden panelling made between 1436 and 1468 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 21]]. In the lecture it stood at the beginning of Italian Renaissance intarsia and its link with central perspective: Giorgio Vasari reports that Filippo Brunelleschi demonstrated his perspective to the makers of intarsia — "the art of making inlays of coloured wood" — and that thanks to his suggestions many excellent works were made which brought Florence fame and profit for many years [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 20]].

  ## The panels

  The earliest parts are feigned cupboard openings with liturgical vessels and books by Antonio Manetti, 1436–1445 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 23]]. [[artist/agnolo-di-lazzaro|Agnolo di Lazzaro]] made the intarsia of the south wall with views of cupboards and feigned openings, among them an opening with a garland and a feigned relief with the Agnus Dei, 1436–1440 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 24–25]]; the lecture marked the vanishing lines of the feigned openings in the upper register [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 25]]. A further panel with feigned cupboard openings and books is ascribed to Agnolo di Lazzaro and dated 1436–1445 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 51]]. [[artist/giuliano-da-maiano|Giuliano da Maiano]] made the east wall with the Annunciation, saints and prophets in 1463–1465 — among them St Crescentius and the prophet Isaiah — and the west wall with the Nativity and the Presentation in the Temple in 1465–1468 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 26–32]]. The lecture again marked the vanishing lines of the east wall [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 33]] and compared Giuliano's Annunciation with the predella panel of the same subject by [[artwork/domenico-veneziano-annunciazione-fitzwilliam|Domenico Veneziano]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 74–76]].

  ## Material

  Spalted "green wood" (legname verde), stained blue-green by the fungus Chlorociboria, has been detected in Renaissance intarsia from the fifteenth century onwards, including panels in Santa Maria del Fiore [[source/ajmar-2024-reciprocal-design|p. 39]]. The lecture showed the Nativity of the west wall next to the fungus and to wood coloured blue-green by it [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 85–87]].
