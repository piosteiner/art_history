provenance:
  - owner: institution/compagnia-della-purificazione-della-vergine-e-di-san-zanobi
    acquired: 1461-10-23
    ended_label: until 1785 (altarpiece in the refectory of the Ospedale dei Pellegrini, under the confraternity's charge, from at least 1757)
    method: commission
    place: florence
    label: predella of the altarpiece for the confraternity's altar near San Marco; moved 1 May 1506 to its new Oratory beside San Marco, 1570 to its new seat in Via San Gallo (possibly then divided from the altarpiece)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41582.html
        note: Part of the predella of the altarpiece commissioned 23 October 1461 for the altar of the Compagnia della Purificazione della Vergine (also called of San Marco or of San Zanobi) [Confraternity of the Purification of the Virgin] in the confraternity's meeting place near the church of San Marco, Florence;[1] transferred 1 May 1506 to the newly built Oratory of the confraternity across the street flanking San Marco,[2] and in 1570, possibly divided from the altarpiece, to the confraternity's new seat in Via San Gallo.[3] by 1757 the altarpiece, possibly no longer complete with predella, was in the…
        source: nga-1952-2-3
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1784
    method: dissolution
    label: confraternity and Ospedale suppressed 1784; property inventoried August 1785 ("cinque quadretti traversi" — practically certainly the five predella panels) and sold
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41582.html
        note: '[4] … The Ospedale and compagnia were suppressed in 1784 and its property sold, after having been inventoried in August 1785 … It seems practically certain that the "cinque quadretti traversi larghi soldi 12 di braccia alti 8 soldi" described in the inventory of 1785 are the five panels of the already dismembered predella'
        source: nga-1952-2-3
        accessed: 2026-11-24
  - owner: person/alfonso-tacoli-canacci
    acquired: 1796 or earlier
    ended: 1801
    place: florence
    label: in his printed catalogue raisonné, Parma, 1796 (not in the manuscript of 1789)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41582.html
        note: marchese Alfonso Tacoli Canacci [1724-1801], Florence, by 1796; — [5] The printed Catalogue raisonné … Parma, 1796, includes, apart from NGA 1952.2.3, the Presentation now in Philadelphia, whereas the manuscript version of 1789 … omits them
        source: nga-1952-2-3
        accessed: 2026-11-24
  - owner: person/pietro-tacoli
    acquired: 1801
    method: inheritance
    direct: true
    place: modena
    label: his nephew ("Petro" in the main text); the collection was dispersed
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41582.html
        note: by inheritance to his nephew, Petro Tacoli [1773-1847], Modena.[5] — After Tacoli Canacci's death in 1801, his collection was inherited by nephew, Pietro Tacoli, and dispersed.
        source: nga-1952-2-3
        accessed: 2026-11-24
  - owner: person/vittorio-cini
    acquired: 1940s
    place: venice
    label: Count Vittorio Cini; probably among the 15th-century Florentine paintings he bought in Modena in 1942
