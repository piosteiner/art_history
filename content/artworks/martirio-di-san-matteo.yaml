    place: rome
    label: commissioned for the right wall of the Contarelli Chapel (400 scudi for the two side canvases); hung there in July 1600, where it still is
    notes_md: Paid from the funds Cardinal [[person/matthieu-cointerel]] (Matteo Contarelli, d. 1585) left in his will for the chapel; the commission came from the church’s administrators.
    sources:
      - url: https://en.wikipedia.org/wiki/Paintings_in_the_Contarelli_Chapel
        note: "“A contract dated 23 July 1599, provided for the payment of 400 ecus for the two side canvases, which were inaugurated barely a year later, in July of the Holy Year 1600: the Calling and the Martyrdom of Saint Matthew” · “Caravaggio was finally commissioned in 1599 when the church administrators decided to reopen the Contarelli Chapel to worship.”"
        source: wikipedia-en-paintings-in-the-contarelli-chapel
        accessed: 2026-10-27
      - url: https://it.wikipedia.org/wiki/Martirio_di_san_Matteo
        note: La commissione del dipinto si deve al cardinale Matteo Contarelli, il quale, intorno al 1590, aveva lasciato fondi e istruzioni specifiche nel suo testamento per la decorazione di una cappella dedicata al suo omonimo San Matteo.
        source: wikipedia-it-martirio-di-san-matteo
        accessed: 2026-10-27
