description_md: |-
  This panel with a view of an ideal city measures 67.7 × 239.4 cm; the museum gives it to an anonymous artist of central Italy and dates it 1480–1490, oil on panel [[source/gndm-citta-ideale]] — the lecture dated it about 1470–1480 and called it tempera on wood [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 72]].

  It has been attributed to several artists, among them the architect Luciano Laurana, for the precision of its drawing and for its classical architecture, which resembles that of the Palazzo Ducale in Urbino, which Laurana in part designed; today scholars give it to a painter of central Italy. Its purpose is open: a study in perspective, the panel of a piece of furniture (spalliera) or the model for a stage set [[source/gndm-citta-ideale]]. It came from the convent of Santa Chiara in Urbino and probably belonged to the ducal family — Federico's daughter Elisabetta da Montefeltro may have brought it with her when she entered the convent after being widowed in 1482; about 1861 it came into the state collections [[source/gndm-citta-ideale]]. It is in the [[institution/galleria-nazionale-delle-marche|Galleria Nazionale delle Marche]] in [[place/urbino|Urbino]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 72]].

  The lecture showed it between two views of [[artist/benedetto-da-maiano|Benedetto da Maiano]]'s intarsia [[artwork/studiolo-urbino-ausblick-landschaft|view through an arcade onto a landscape]] in the studiolo of Federico da Montefeltro (1474–1476), comparing perspectival construction in painting and in intarsia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 71–73]]. The slide gives no author for the painting [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 72]].
