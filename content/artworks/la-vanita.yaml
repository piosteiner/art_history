    sources:
      - url: https://collection.kunsthaus.ch/de/collection/item/1263/
        note: "Footnote: Die Deutsche Reichsbank überschrieb Pauls Vermögen an seine Schwestern Hermine und Helene Wittgenstein. Die Schwestern schlossen ein Abkommen mit den Nationalsozialisten, wodurch Paul einen grossen Teil seines Vermögens verlor. Die Schwestern erhielten dadurch am 29. August 1939 den «Mischlingsstatus» mit dem sie im Land verbleiben konnten. Bewegliche Güter sollte Paul nach der Vereinbarung zunäch…"
        source: kunsthaus-zurich-sammlung-online
        accessed: 2026-11-03
