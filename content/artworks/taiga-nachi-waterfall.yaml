description_md: "Painted by [[artist/ike-taiga]] at about fifty: not a minutely detailed record but a recreation of impressions — rocks and trees carry the eye to a large triangular mountain with the waterfall a void of white paper at its centre; loose, rhythmic brushwork and abundant washes give a wet, atmospheric quality. [[source/history-of-japanese-art|pp. 331–332, fig. 386]]"
