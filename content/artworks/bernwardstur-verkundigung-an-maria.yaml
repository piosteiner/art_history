description_md: |-
  The bottom field of the right leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the Annunciation to Mary.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 42]] With it the New Testament cycle begins; it reads from the bottom upwards, from the Annunciation and Nativity through the Passion to the Resurrection.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] Architecture rather than plants frames the scenes on this leaf.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]] The lecture showed the relief in detail.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 62]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 63]]

  Opposite it, at the bottom of the left leaf, is the murder of Abel; the lecture listed the two as a typological pair.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]]
