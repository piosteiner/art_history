description_md: This printed invitation announces a *[[term/shogakai|shogakai]]* on the 28th day of the eighth month at the restaurant Kawachiya Hanjirō in Yanagibashi, rain or shine, at which 'the masters will write and paint at the table' [[source/koyama-2026-ryogoku-yanagibashi-shogakai|pp. 31–32]]. The host was the painter Kita Buichi, son of Kita Busei; the sheet lists 69 names, among them [[artist/sakai-hoitsu|Sakai Hōitsu]], [[artist/watanabe-kazan|Watanabe Kazan]], Ōkubo Shibutsu, Kikuchi Gozan and 25 of the Kitas' pupils [[source/koyama-2026-ryogoku-yanagibashi-shogakai|pp. 32, 35–36]]. Since Hōitsu died in 1828 and the youngest participant, Hasegawa Settei, was active from 1826, Shūko Koyama dates it between 1826 and 1828 [[source/koyama-2026-ryogoku-yanagibashi-shogakai|pp. 32–33]]. It measures 15.7 × 22.5 cm and was bought by the [[institution/edo-tokyo-museum|Edo-Tokyo Museum]] from a bookseller in 1990 [[source/koyama-2026-ryogoku-yanagibashi-shogakai|p. 31]].
