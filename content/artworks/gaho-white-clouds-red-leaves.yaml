description_md: By [[artist/hashimoto-gaho]] (1835–1908), Hōgai’s fellow student of the Kanō master Shōsen’in, who painted fans for export and maps for the Naval Cadet School before Fenollosa found him; chief professor of painting at the Tokyo Bijutsu Gakkō, then at the Nihon Bijutsu’in. Layers of rock overlap to carry the eye into a distance hidden by mist — Western atmospheric perspective in a traditional landscape scheme. [[source/history-of-japanese-art|pp. 364–365, fig. 431]]
