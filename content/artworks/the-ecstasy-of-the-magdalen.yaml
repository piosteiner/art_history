  - owner: person/gian-carlo-doria
    method: commission
    place: genoa
    label: very likely 'una madalena rapita da angeli del procasino' (inventory 1617–1621, no. 436, 150 scudi) and no. 437 of the inventory after his death (600 scudi)
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.121887.html
        note: Probably commissioned by Gian Carlo Doria [d. 1625], Genoa.[1] — [1] … The inventory made between 1617-1621 included a work titled una madalena rapita da angeli del procasino (no. 436), valued at 150 scudi … The last of the inventories, made after Doria's death in 1625 and before 1641, also describes a picture (no. 437) as La Madalena rapita dagli angeli del Procaccino, valued at 600 scudi … it is very likely this was the NGA canvas.
        source: nga-2002-12-1
        accessed: 2026-11-24
  - owner: person/gonzalo-de-ulloa
    place: madrid
    label: 9th Count of Adanero; assembled the Adanero collection in the second half of the 19th century
    sources:
      - url: https://www.nga.gov/collection/art-object-page.121887.html
        note: Gonzalo de Ulloa, 9th Count of Adanero [1831-1882], Madrid; — The Adenero collection … was assembled during the second half of the 19th century by Gonzalo de Ulloa and passed down in the family.
        source: nga-2002-12-1
        accessed: 2026-11-24
  - owner: person/jose-maria-de-ulloa
