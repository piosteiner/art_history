  - owner: person/alvaro-de-ulloa
    acquired: after 1905
    method: inheritance
    direct: true
    place: madrid
    label: his grandson, 11th Count of Adanero; probably no. 1629 'Una Matrona con dos niños' (125 pesetas) of the inventory after José María's death, assigned to Álvaro
    sources:
      - url: https://www.nga.gov/collection/art-object-page.121887.html
        note: "by inheritance to his grandson, Álvaro de Ulloa, 11th count of Adanero [1889-1948], Madrid; — no. 1629 on the inventory is a painting whose size and subject seems to match the NGA canvas: \"1629. Otro cuadro de la Escuela Italiana, cuyo asunto es 'Una Matrona con dos niños' … tasado en ciento veinticinco pesetas. [Álvaro de Ulloa]\""
        source: nga-2002-12-1
        accessed: 2026-11-24
  - owner: institution/junta-de-incautacion-y-proteccion-del-tesoro-artistico
    role: possessor
    acquired_label: during the Spanish Civil War
    ended: 1939-06
    method: confiscation
    place: madrid
    label: seized with other works of the Adanero collection by the Republican government's board; photographed 1936 (Archivo de Recuperación del Patrimonio Artístico)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.121887.html
        note: During the Spanish Civil War, the painting was seized, along with other works in the Adanero collection, by the Junta de Incautación y Protección del Patrimonio Artístico (Board of Seizure and Protection of Artistic Heritage), which was established by the Republican government.
        source: nga-2002-12-1
        accessed: 2026-11-24
  - owner: person/alvaro-de-ulloa
