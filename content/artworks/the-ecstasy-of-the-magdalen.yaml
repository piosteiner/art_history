        note: The painting was returned to Álvaro de Ulloa in June 1939, after the end of the civil war. See no. 76 on the list of paintings in the restitution file, "Expediente de devolución de Álvaro María de Ulloa y Fernández-Durán, conde de Adanero," 23 June 1939
