description_md: |-
  A painted crucifix (croce dipinta) from the church of the Holy Sepulchre (Santo Sepolcro) in Pisa, made around 1200 in tempera and gold on panel, 282 × 236 cm; it is now in the Museo Nazionale di San Matteo, Pisa.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]]

  The lecture set it beside [[artist/giunta-pisano|Giunta Pisano]]'s crucifix for San Domenico in Bologna (1254) to contrast two images of the crucified Christ: Christus triumphans, alive and victorious on the cross, and Christus patiens, the suffering, dying Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]] Giunta's crucifixes are credited with replacing the older, serene type with the image of Christ in agony.[[source/wikipedia-en-giunta-pisano|§ Influence]] Wikipedia also notes other Pisan crucifixes of about this date in the San Matteo museum, some of which may be early works of Giunta.[[source/wikipedia-en-giunta-pisano|§ Works]]
