description_md: |-
  Rodin erhielt 1880 von der französischen Regierung den Auftrag für ein monumentales Bronzetor des geplanten Musée des Arts décoratifs in Paris, mit Szenen aus Dantes «Inferno»; das Museum wurde nie gebaut.[[source/kunsthaus-zurich-1949-0022|“1880 erhielt Rodin von der französischen Regierung den Auftrag, für ein Musée des Arts Décoratifs ein monumentales Bronzetor mit Szenen aus Dantes «Inferno» zu schaffen. Das Museum wurde nie gebaut”]] In fieberhafter Arbeit schuf er mehr als zweihundert Figuren und Gruppen, aus denen er für den Rest seiner Laufbahn schöpfte. 1900 zeigte er das Tor zum ersten Mal, aber ohne die am stärksten vortretenden Figuren; um 1907 sollte es in Bronze und Marmor im Musée du Luxembourg aufgestellt werden. Erst 1917 überzeugte [[person/leonce-benedite|Léonce Bénédite]], der erste Konservator des Musée Rodin, den Bildhauer, das Tor für einen Guss rekonstruieren zu lassen; Rodin starb, bevor er das Ergebnis sah.[[source/musee-rodin-s01304|“il créa plus de deux cents figures et groupes qui forment un véritable vivier dans lequel il puisa durant le reste de sa carrière” · “Vers 1907, La Porte fut proche de voir le jour dans une version luxueuse, alliant le bronze et le marbre” · “C’est en 1917 seulement que Léonce Bénédite, premier conservateur du musée Rodin, parvint à convaincre le sculpteur de le laisser reconstituer son chef-d’œuvre pour en faire réaliser une fonte, Rodin mourut avant de voir le résultat de tous ses efforts.”]]

  ## Die Güsse

  Alle Bronzen entstanden nach Rodins Tod. Die ersten vier goss die Giesserei [[institution/fonderie-alexis-rudier|Alexis Rudier]] im Sandguss: für Philadelphia und Paris, für Tokio (um 1930–1933) und für Zürich. Drei Jahrzehnte später beauftragte das Musée Rodin die [[institution/fonderie-de-coubertin|Fonderie de Coubertin]], die nun im Wachsausschmelzverfahren goss: für Stanford, Shizuoka und Seoul; der achte und letzte Guss steht im Museo Soumaya in Mexiko-Stadt.[[source/museo-soumaya-puerta-del-infierno|“Es el octavo y último vaciado. Lo preceden en orden cronológico cuatro a la arena que produjo la casa Alexis Rudier” · “Tres décadas después, el museo parisino solicitó a la Fundidora Coubertin realizar los siguientes encargos. El procedimiento que utilizó fue el vaciado a la cera perdida”]] Das Gipsmodell ist im Musée d'Orsay.[[source/musee-orsay-porte-de-lenfer]]
