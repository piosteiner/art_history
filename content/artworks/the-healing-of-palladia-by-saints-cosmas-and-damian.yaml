    role: dealer
    acquired: 1923-02-15
    direct: true
    place: lucerne
    label: stock card L-3993 (Böhler Archive, ZI Munich; incoming date written 1922, meant 1923); the bank Koenigs, Amsterdam, also involved
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: (acquired 15 February 1923 by Kunsthandel AG Lucerne);[6] — [6] See stock card L-3993 … The bank Koenigs Amsterdam was also involved in the transaction.
