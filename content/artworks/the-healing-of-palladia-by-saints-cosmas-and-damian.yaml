provenance:
  - owner: institution/san-marco-florence
    acquired: c. 1440
    method: commission
    place: florence
    label: predella of the high altarpiece of the church of San Marco (Vasari 1568); altarpiece removed c. 1677 to the convent, possibly the passageway to the sacristy by 1758, or the convent's Spezieria (early 19th century)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: High altar of the church of San Marco, Florence, from about 1440 until about 1677.[1] Possibly in the passageway to the sacristy of the same church, by 1758,[2] or in the Spezieria of the Convent of San Marco (recorded here in the early 19th century).[3]
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner: institution/galleria-dell-accademia-florence
    acquired: after 1810
    method: transfer
    direct: true
    place: florence
    label: possibly after the suppression of the Dominican order, 1810–1812
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: possibly in the Galleria dell'Accademia, Florence, after 1810-1812,
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner_label: private hands, Florence
    place: florence
    label: from the Accademia, if not directly from the Spezieria of San Marco, into private hands
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: and from here (if not directly from the Spezieria) in private hands.[4]
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner: person/james-pourtales-gorgier
    acquired: 1841 or earlier
    place: paris
    label: first recorded in Dubois's catalogue of the Pourtalès-Gorgier collection, 1841, no. 3, as by Masaccio
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: "James-Alexander, comte de Pourtalès-Gorgier [1776-1855], Paris, by 1841; — [4] … mentioned for the first time in Paris, in the Pourtalès-Gorgier collection, only in 1841 (see Léon-Jean-Joseph Dubois, Description des tableaux … Paris, 1841: 3, no. 3, as by Masaccio)."
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner_label: Pourtalès-Gorgier sale, Hôtel Pourtalès-Gorgier, Paris
    role: agent
    acquired: 1865-03-27
    ended: 1865-04-04
    method: auction
    direct: true
    place: paris
    label: his sale, Hôtel Pourtalès-Gorgier, Paris, 27 March–4 April 1865, no. 86, as by Masaccio
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: (his sale, Hôtel Pourtalès-Gorgier, Paris, 27 March-4 April 1865, no. 86, as by Masaccio);
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner: person/edmond-de-goncourt
    co_owners: [person/jules-de-goncourt]
    acquired: 1865
    method: auction
    direct: true
    place: paris
    label: buyer's name noted in the sale catalogue, read 'de Zincourt?' (Shapley) or 'de Goncourt' (Waterhouse, 1980)
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: probably Edmond [1822-1896] and Jules Huot [1830-1870] de Goncourt, Paris.[5] — [5] A handwritten note with the name of the purchaser in the sale catalogue has been read as "de Zincourt" … Ellis Waterhouse … suggests instead the reading "de Goncourt"
        source: nga-1952-5-3
        accessed: 2026-11-24
  - owner: person/julius-bohler
    role: dealer
    label: '"L Bohler" on the Lucerne stock card, read by the Böhler Archive as Julius Böhler, co-owner of the Kunsthandel AG Lucerne with Fritz Steinmeyer'
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41613.html
        note: (Julius Böhler); — [6] … “L Bohler” is given as the source of the painting, but the Böhler Archive interprets this as Julius Böhler, owner of the Kunsthandel AG Lucerne together with Fritz Steinmeyer.
        source: nga-1952-5-3
        accessed: 2026-11-24
