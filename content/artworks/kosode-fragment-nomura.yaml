institution: national-museum-of-japanese-history
description_md: "A fragment of a samurai lady’s [[kosode]], mounted on a screen as was the fashion from this time: mountains, snowflake roundels, wisteria and plants of the four seasons in tie-dyeing, embroidery and stencilled gold and silver leaf on red, black, white and blue figured satin. Its style, named after the Keichō and Kan’ei eras (1596–1644), is relatively sober. [[source/history-of-japanese-art|pp. 253–254, fig. 292]]"
