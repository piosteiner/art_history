description_md: |-
  This small English prayer book of about 1490 is written on parchment; its leaves measure 12.5 × 8.9 cm, and it is in the [[institution/british-library|British Library]] (Egerton MS 1821) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 32]]. The lecture showed a double page (fols. 6v–7r) painted with a red ground and drops of blood [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 32–33]]. Two hand-coloured woodcuts are pasted into the manuscript at fols. 8v–9r: the Man of Sorrows with the [[term/arma-christi|Arma Christi]] and the Five Wounds of Christ, English work of about 1490 [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 34]].

  The book illustrates how early woodcuts were used: single-leaf religious prints served private prayer and could be kept loose or pasted into manuscripts [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]]. Next to the woodcuts the lecture quoted an indulgence promising "32.755 years of pardon" to all who devoutly say five Pater Nosters, five Aves and a Creed "before such a figure" [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 35]]. It also compared the book with the "Charter of Christ" in the [[artwork/carthusian-miscellany-add-37049|Carthusian Miscellany]] (Add MS 37049) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 37]].
