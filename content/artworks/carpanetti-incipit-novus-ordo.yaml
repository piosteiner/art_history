title: Incipit novus ordo
creator: arnaldo-carpanetti
created: 1930
kind: painting
description_md: |-
  *Incipit novus ordo* ("a new order begins") by [[artist/arnaldo-carpanetti|Arnaldo Carpanetti]] won the competition sponsored by the National Fascist Party at the Venice Biennale of 1930 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]] [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]]. In the same year the Ministry of National Education bought [[artwork/prampolini-feminine-landscape]] by the Futurist Enrico Prampolini; the seminar set the two side by side to ask whether Fascist art policy was an imperfect totalitarianism or a strategic artistic pluralism [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]] [[source/stone-1998]].

  Both readings have their historians. Emily Braun describes how the regime, without ever sanctioning an official style, steered the arts by administrative controls, prizes and commissions — a pluralism that let the avant-garde and the retrograde, abstraction and neoclassicism, be absorbed by the state's eclectic patronage [[source/braun-2000|pp. 1–2]]; studies of culture became a means to expose the regime as a flawed or "imperfect totalitarianism" [[source/braun-2000|p. 4]]. Marla Stone's periodisation of Fascist patronage places 1930 at the end of the "period of stabilization" (1925–30), before the "years of consensus" (1931–36) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 66]] [[source/stone-1998]]. Carpanetti, a painter of the second wave of the Novecento Italiano who held to large narrative compositions, also designed two rooms of the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] two years later [[source/wikipedia-it-arnaldo-carpanetti|§ Introduction]] [[source/antliff-2002|p. 154]].
