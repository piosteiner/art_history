description_md: "A set of handscrolls recording the annual ceremonies and celebrations of the imperial court and the capital, made by [[artist/tokiwa-mitsunaga]] (active about 1173) for the retired emperor [[person/emperor-go-shirakawa]], who wished to revive important court ceremonies. The original is lost; it survives in a seventeenth-century copy by [[artist/sumiyoshi-jokei]]. Scenes shown in the book: a cockfight in the garden of a nobleman’s [[shinden-zukuri]] residence on the third day of the third month, the lord and his guests watching from the raised shutters, the ladies behind blinds; and the Shingonin of the imperial palace prepared for the Mishihō rites of the new year, with paintings of the Five Myōō hung as ritual furnishings. Mason’s captions date the original to the mid and to the late twelfth century. [[source/history-of-japanese-art|pp. 109, 157, figs. 135, 191]]"
