description_md: |-
  The Morgan Madonna is an enthroned Virgin and Child from the Auvergne of 1175–1200, carved in walnut, with remains of polychromy over a chalk ground and canvas, 79 cm high, in the Metropolitan Museum of Art, New York.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 39]] It was a gift of J. Pierpont Morgan in 1916 and opens Ilene Forsyth's register of French Madonnas in Majesty as no. 1.[[source/forsyth-1972-the-throne-of-wisdom|fig. 54]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  ## A statue made of many pieces

  The Morgan Madonna and Notre-Dame de [[artwork/montvianeix-madonna|Montvianeix]] are two works by the same master.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] Both look like solid statues carved from single billets of wood, but the Morgan Madonna is made up of at least twenty-two individually worked pieces of walnut.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 81]] The seams where the heads of Mary and the Child join their bodies are particularly visible.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] Carving the heads separately made the work easier and allowed finer wood to be chosen for the expressive parts; the Child's hands and feet and the colonnettes of the throne with their plinths and imposts were also worked separately and joined with wooden dowels up to several inches long.[[source/forsyth-1972-the-throne-of-wisdom|p. 17]] The joinery, akin to the preparation of panels for painting, simulated a solid form while reducing the danger of cracking.[[source/forsyth-1972-the-throne-of-wisdom|pp. 16–17]] Walnut, favoured in the south of France, was not available in large natural supply in the Auvergne, where resinous woods abound; Forsyth found the preference for it interesting.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 80]] After carving, thin linen was glued to the surface, followed by gesso and paint; the traces of linen are particularly visible on the Morgan Madonna.[[source/forsyth-1972-the-throne-of-wisdom|p. 19]]
