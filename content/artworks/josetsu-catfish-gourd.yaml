description_md: "Commissioned by the shogun [[person/ashikaga-yoshimitsu]]’s son [[person/ashikaga-yoshimochi]] (1380–1428) for a small Chinese-style standing screen; thirty Zen monks wrote poems on it, introduced by Taigaku Shūsū, and it was later remounted as a hanging scroll with the poems above. A [[koan]] made visible: how to catch a slippery catfish with a gourd? A strange, solitary man with a porcine face holds a gourd in front of the fish in a flat, barren landscape, mountains in the mist beyond. [[artist/josetsu]], a monk of Shōkokuji, was a teacher of Shūbun. [[source/history-of-japanese-art|p. 224, fig. 258]]"
