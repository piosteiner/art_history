description_md: |-
  The masterwork of [[artist/okuma-ujihiro]] (1856–1934), Ragusa’s most talented student: [[person/fukuzawa-yukichi]] (1835–1901), founder of Keiō University and one of the founders of new Japan, seated in a formal pose with an alert, enquiring expression; the textures of jacket and trousers differ so that natural light makes a believable pattern of highlights and shadows. [[source/history-of-japanese-art|p. 356, fig. 418]]

  The statue belongs to the [[institution/keio-art-collection|Keio Art Collection]] (KAC-2020-0255) and is in the charge of [[institution/keio-shiki-senior-high-school|Keio Shiki Senior High School]] (所管). Keio dates it to 1893 (Meiji 26) and measures it 118.0 × 112.0 × 90.5 cm;[[source/objecthub-keio-ac-jp|object 6130 (福澤諭吉座像)]] Mason gives 1892 and a height of 120 cm.[[source/history-of-japanese-art|p. 356, fig. 418]]
