description_md: "The masterwork of [[artist/okuma-ujihiro]] (1856–1934), Ragusa’s most talented student: [[person/fukuzawa-yukichi]] (1835–1901), founder of Keiō University and one of the founders of new Japan, seated in a formal pose with an alert, enquiring expression; the textures of jacket and trousers differ so that natural light makes a believable pattern of highlights and shadows. [[source/history-of-japanese-art|p. 356, fig. 418]]"
