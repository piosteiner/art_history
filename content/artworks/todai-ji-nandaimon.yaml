description_md: The building that best preserves the concept of [[person/chogen]] (1121–1206), the priest who led the rebuilding of Tōdaiji after the Taira burnt it in 1180, collecting funds across the country (Minamoto no Yoritomo was a generous donor). The original gate had fallen in a typhoon in 962. Built in 1199 in the [[daibutsuyo]] that Chōgen had studied on three journeys to China; its two great guardians were installed in 1203. [[source/history-of-japanese-art|pp. 185–187, fig. 214]]
