title: Ansicht von Venedig (Schedelsche Weltchronik)
creator: michael-wolgemut
created: 1493
kind: woodcut
medium: Holzschnitt auf zwei Blättern, koloriert
dimensions: [19, 52.7]
description_md: |-
  [[artist/michael-wolgemut|Michael Wolgemut]]'s view of [[place/venice|Venice]] is a hand-coloured woodcut printed across two pages (19.0 × 52.7 cm) in Hartmann Schedel's "Weltchronik", published in [[place/nuremberg|Nuremberg]] by Anton Koberger in 1493 [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 55]]. The city views of the Nuremberg Chronicle are often named as forerunners of the [[artwork/barbari-veduta-di-venezia|large view of Venice of 1500]], but they are by no means all individual: some blocks were used dozens of times for different cities [[source/bockem-2016-jacopo-de-barbari|p. 55]]. The double-page view of Nuremberg in the same book measures 34.2 × 50 cm [[source/bockem-2016-jacopo-de-barbari|p. 55]].

  The chronicle is linked to the later view of Venice through its sale: the Nuremberg merchant Anton Kolb, publisher of the view of 1500, distributed the chronicle in Venice, where he had 34 copies, half of which were sold by 1499 [[source/bockem-2016-jacopo-de-barbari|p. 34]]; for these sales a copy was valued at one and a half gulden [[source/bockem-2016-jacopo-de-barbari|p. 48]]. The chronicle also shows wind gods on fol. 5v, a motif otherwise found mainly on portolan charts, which reappears on the view of Venice [[source/bockem-2016-jacopo-de-barbari|p. 41]]. The Nuremberg patrician Sebald Schreyer was one of the chronicle's financiers [[source/bockem-2016-jacopo-de-barbari|p. 53]]. In the lecture the woodcut was shown with [[artwork/reuwich-ansicht-von-venedig|Erhard Reuwich's view of Venice]] of 1486 [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 54–55]].
