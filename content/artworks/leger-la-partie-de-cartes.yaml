description_md: |-
  [[source/kroller-muller-soldiers-playing-cards]] The metallic sheen of the soldiers' limbs marks a mechanisation that has penetrated their whole lives: already "new men" [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 92]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 63]].

  ## Origin

  [[artist/fernand-leger|Fernand Léger]] painted *La partie de cartes* (The Card Players) in 1917 while convalescing in Villepinte, after he had nearly died in a mustard-gas attack at Verdun in September 1916; its robot-like, monstrous figures reflect his experience of the war, in which he had spent two years at the front in the Argonne [[source/wikipedia-en-fernand-leger|§ 1914–1920]]. Léger explained the change in his painting by the war: "I was stunned by the sight of the breech of a 75 millimeter in the sunlight. It was the magic of light on the white metal. That's all it took for me to forget the abstract art of 1912–1913" [[source/wikipedia-en-fernand-leger|§ 1914–1920]]. The painting marked the beginning of his "mechanical period", in which figures and objects take sleek, tubular, machine-like forms [[source/wikipedia-en-fernand-leger|§ 1914–1920]].

  ## Interpretation

  Éric Michaud reads the soldiers as figures of the New Man: "the metallic sheen of these soldiers' limbs is a mark of a mechanization that has penetrated their entire lives, but that is precisely what motivates the way Fernand Léger looks at them. In the fully mechanic precision of their gestures, these soldiers are already 'new man' that presents us the positive side of the radical transformation humanity undergoes in the war" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 63]] [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 93]]. The seminar "Art and Totalitarianism" set the painting against [[artist/otto-dix|Otto Dix]]'s [[artwork/dix-die-skatspieler|Skat Players]] of 1920, whose soldiers are "a frightening mix of wounded flesh, metal pieces, and tubes", and against [[artwork/masereel-debout-les-morts|Masereel's woodcut]] of the dead carrying their own heads [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 61–64]]. For Michaud this European imagination of the New Man grew out of the "front line experience", which was "undoubtedly primarily, a physical experience, an experience of the body", and was not limited to cultures under totalitarian regimes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 60]].
