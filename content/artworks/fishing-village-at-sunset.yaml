        source: kunishitei-201-101
        accessed: 2026-11-24
  - owner: person/ashikaga-yoshimitsu
    label: bears his collector's seal 'Dōyū'; thought to have cut the handscroll into hanging scrolls for display
    sources:
      - url: https://www.nezu-muse.or.jp/jp/collection/detail.php?id=10390
        note: 同様に足利義満の鑑蔵印「道有(どうゆう)」が捺され、法量も一致する作品が他に３幅現存し、もとは八景を備えた画巻を、義満が座敷飾りのために切断したものと考えられている。
        source: nezu-10390
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/101
        note: 「道有」の鑑蔵印がある
