        accessed: 2026-11-24
  - owner_label: rulers and daimyo families (e.g. Tokugawa Ieyasu, Matsudaira Fumai)
    acquired: 1728 or earlier
    label: "said of the set as a whole: it passed through the hands of Tokugawa Ieyasu, Matsudaira Fumai and others; in July 1728 Tokugawa Yoshimune gathered the scrolls then divided among daimyo houses"
    certainty: possible
    sources:
      - url: https://ja.wikipedia.org/wiki/%E7%89%A7%E8%B0%BF
        note: 足利義満によって8幅の掛物に改装され、徳川家康や松平不昧など、時の権力者や文化人の所蔵を経て伝来した。徳川吉宗は1728年7月、当時大名家に分蔵されていた八景図を一堂に集め賞玩を試みている
