        note: 牧谿(もっけい)筆 中国・南宋時代 13世紀 … 中国江南地方、瀟水(しょうすい)と湘江(しょうこう)周辺の８つの景勝を描いた「瀟湘八景(しょうしょうはっけい)図」のうちの1図。
        source: nezu-10390
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/101
