provenance:
  - owner_label: Chiavello Chiavelli, lord of Fabriano (?)
    acquired: 1406/1414
    method: commission
    place: fabriano
    label: the most attractive hypothesis — he restored the Valdisasso hermitage in 1406 and chose it for his burial
    certainty: possible
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/incoronazione-della-vergine-e-santi-polittico-di-valle-romita/
        note: la più suggestiva ascrive la commissione del dipinto a Chiavello Chiavelli, signore di Fabriano, che nel 1406 fece restaurare il convento di Valdisasso e lo elesse come luogo della propria sepoltura
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
  - owner_label: Santa Maria di Valdisasso, Fabriano (Observant Franciscan hermitage)
    ended: 1811
    place: fabriano
    label: perhaps taken apart already in the 18th century
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/incoronazione-della-vergine-e-santi-polittico-di-valle-romita/
        note: Forse smembrato già nel XVIII secolo, il polittico giunse in Pinacoteca a partire dal 1811, in seguito alla soppressione dell’eremo francescano osservante di santa Maria di Valdisasso, presso Fabriano
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
  - owner: institution/pinacoteca-di-brera
    acquired: 1811
    method: confiscation
    direct: true
    place: milan
    label: the five large panels after the suppression of the hermitage; the four small ones bought from a private collection in 1901
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/incoronazione-della-vergine-e-santi-polittico-di-valle-romita/
        note: il polittico giunse in Pinacoteca a partire dal 1811, in seguito alla soppressione dell’eremo […] da cui provennero le cinque tavole maggiori; le quattro tavole minori furono acquistate da una collezione privata nel 1901.
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
