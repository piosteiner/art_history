description_md: |-
  The Psalter of Louis the German (Berlin, Staatsbibliothek, Ms. theol. lat. fol. 58) is a Carolingian illuminated manuscript made between 820 and 826 in the abbey of [[place/abbey-of-saint-bertin|Saint-Bertin]], commissioned by Emperor Louis the Pious on the elevation of his son Louis the German to king in the east of the empire.[[source/wikipedia-de-psalter-ludwigs-des-deutschen|§ Introduction]] Its decoration is strongly influenced by Insular book painting, and it is the earliest work of the so-called Franco-Saxon school.[[source/wikipedia-de-psalter-ludwigs-des-deutschen|§ Introduction]] It has 120 parchment leaves of 29.5 × 23.5 cm, with frames and initials richly decorated in gold.[[source/wikipedia-de-psalter-ludwigs-des-deutschen|§ Introduction]]

  The lecture showed a later addition of about 890 (fol. 119v–120r): a prayer to the cross of Christ with Arnulf of Carinthia praying before a crucifix.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 56]] By the end of the ninth century the book was indeed in the hands of the East Frankish king and later emperor Arnulf in Regensburg.[[source/wikipedia-de-psalter-ludwigs-des-deutschen|§ Introduction]] It was found in 1536 near the canonesses' foundations of Rellinghausen or Vreden, came to the electors of Brandenburg in the early seventeenth century and is now in the Staatsbibliothek zu Berlin.[[source/wikipedia-de-psalter-ludwigs-des-deutschen|§ Introduction]] In the lecture it appeared with the [[artwork/gebetbuch-karls-des-kahlen|prayer book of Charles the Bald]] as evidence of Carolingian prayer before the image of the Crucified.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 54]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 56]]
