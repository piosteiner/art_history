description_md: |-
  Van Gogh painted his bedroom in the Yellow House in Arles three times. The first version, now in the [[artwork/bedroom-in-arles-van-gogh-museum|Van Gogh Museum]] in Amsterdam, he made in October 1888; it was damaged by water while he was in hospital in Arles[[source/orsay-la-chambre-de-van-gogh-a-arles|“The first, in the Van Gogh Museum in Amsterdam, was executed in October 1888, and damaged during a flood that occurred while the painter was in hospital in Arles”]]. Almost a year later, in September 1889 at Saint-Rémy-de-Provence, he painted two repetitions of it: one the same size, now in the [[artwork/bedroom-in-arles-chicago|Art Institute of Chicago]], and a smaller one for his mother and sister in Holland, now in the [[artwork/bedroom-in-arles-orsay|Musée d’Orsay]][[source/orsay-la-chambre-de-van-gogh-a-arles|“Almost a year later, Van Gogh made two copies of it: one, the same size, is now in the Art Institute in Chicago; the other, in the Musée d’Orsay, produced for his family in Holland, is smaller”]][[source/artic-the-bedroom-1926-417|“in September 1889”]].



  He described the colours to his brother Theo — pale lilac walls, a faded red floor, chrome-yellow bed and chairs, a blood-red blanket[[source/artic-the-bedroom-1926-417|“the walls pale lilac, the floor in a broken and faded red, the chairs and the bed chrome yellow, the pillows and the sheet very pale lemon green, the bedspread blood-red …”]] — and wanted them to express “absolute repose”[[source/vangoghmuseum-the-bedroom-s0047v1962|“The bright colours were meant to express absolute ‘repose’ or ‘sleep’”]]. The flat colours without shadows and the simple furniture recall the Japanese prints he admired[[source/vangoghmuseum-the-bedroom-s0047v1962|“he had deliberately ‘flattened’ the interior and left out the shadows so that his picture would resemble a Japanese print”]].
