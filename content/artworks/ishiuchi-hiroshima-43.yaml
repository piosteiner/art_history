description_md: In 2007 [[artist/ishiuchi-miyako]] photographed the belongings of victims kept at the Hiroshima Peace Memorial Museum — often only part of an object. She was struck by the colours and patterns of garments that could still be worn today, worn under the national uniform or at home. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]
