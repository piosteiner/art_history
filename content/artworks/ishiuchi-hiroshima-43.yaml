description_md: |-
  In 2007 [[artist/ishiuchi-miyako]] photographed the belongings of victims kept at the Hiroshima Peace Memorial Museum — often only part of an object. She was struck by the colours and patterns of garments that could still be worn today, worn under the national uniform or at home. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]

  ## Description

  *ひろしま/hiroshima #43 (Yamane Shizuko)* is a chromogenic print of 2007. [[source/thomsen-2019-war-and-peace|image list, 24 May 2019]] In her series *Hiroshima* Ishiuchi photographed the clothes of victims of the atomic bombing of [[place/hiroshima|Hiroshima]]; her later work addresses skin, clothing and time. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] She had studied textile dyeing and weaving in the design department of Tama Art University before turning to photography. [[source/wikipedia-en-miyako-ishiuchi|§ Life and work]] By photographing only a part of an object she made the pictures more striking, turning communal suffering into an individual fate. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] The garments were everyday clothes; they had been worn under the national uniform or at home because it was forbidden to look fashionable. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]

  ## In the lecture

  The photograph was shown on 24 May 2019 in the session "World War II, Looking Back", whose sample objects were "remembering Hiroshima" and Makoto Aida. [[source/thomsen-2019-war-and-peace|syllabus, p. 4]] It followed [[artist/iri-maruki|Maruki Iri]] and [[artist/toshi-maruki|Maruki Toshi]]'s screens *Fire* and *Water* of 1950 from the [[artwork/the-hiroshima-panels|Hiroshima Panels]]. [[source/thomsen-2019-war-and-peace|image list, 24 May 2019]] The session asked whether war is shown from the side of the aggressor or of the suffering party, and whether the focus lies on the individual or the group; it observed that Japan was not only an aggressor but also a victim of the war, and that it may be easier to show oneself as a victim than to apologise for war crimes. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] The atomic bomb dropped on Hiroshima on 6 August 1945 killed an estimated 80,000 people directly, and by the end of the year injury and radiation had raised the toll to 90,000–140,000. [[source/thomsen-2019-war-and-peace|vocabulary list, 29 March 2019]]
