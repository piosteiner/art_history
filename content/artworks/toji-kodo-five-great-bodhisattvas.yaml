institution: to-ji
description_md: "The five Kokūzō bodhisattvas of boundless wisdom in the sculptural mandala of the Tōji lecture hall. Kongō Hō (Vajraratna), in the south-east corner of the group, is close to Nara-period sculpture: seated calmly in the lotus position, with elaborate necklace, armbands and crown and the natural folds of his garment. The bodies have greater bulk and a sensuality that Sawa Takaaki connects with [[person/kukai]]’s preferences. Head, body and the heart of the pedestal are carved from a single block, hollowed from the back; details are modelled in lacquer and the figures covered with gold leaf. Of the original images the central Kongō Haramitsu is a later replacement. [[source/history-of-japanese-art|pp. 131–132, fig. 159]]"
