  - owner_label: French State (Ministry of Commerce and Public Works)
    acquired: 1831-08
    method: purchase
    direct: true
    place: paris
    label: bought from the artist instead of a commissioned history painting; shown at the Musée du Luxembourg 1832–1833, then put in store
    price:
      amount: 3000
      currency: AFRF
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010065872
        note: finalement acheté à l'artiste par le ministère du Commerce et des Travaux publics en août 1831, au prix de 3 000 francs […] présenté au musée du Luxembourg, Paris, en 1832 et en 1833 […] mis en réserve vers 1833-1834
        source: louvre-collections
        accessed: 2026-10-20
  - owner: artist/eugene-delacroix
    role: custodian
    acquired: c. 1839
    ended: 1849-03
    place: frepillon
    label: entrusted to the artist, who kept it at his aunt Félicité Riesener's house at Frépillon; reclaimed March 1848; lent by him to Alphonse Jame for Lyon, May 1848 – March 1849
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010065872
        note: confié à l'artiste vers 1839 qui le met en dépôt au domicile de sa tante, Félicité Riesener, et de son cousin Léon Riesener, à Frépillon (Val-d'Oise) ; réclamé à l'artiste par la direction des Musées nationaux (ministère de l'Intérieur) en mars 1848 […] restitué à l'administration en mars 1849
        source: louvre-collections
        accessed: 2026-10-20
  - owner: institution/luxembourg-museum
    role: custodian
    acquired: 1863
    ended: 1874-11
    place: paris
    label: in store at the Louvre 1850–1855; Exposition universelle 1855; in store 1856–1863; shown at the Musée du Luxembourg 1863–1874
    sources:
