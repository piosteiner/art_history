description_md: "Porcelain, by now standard enough to be used for ceramics once made in stoneware: a crackled [[celadon]] glaze in imitation of a Chinese stoneware prototype, the product of a double firing — a luminous jade-like quality and a network of crazing. Typical of the Nabeshima or Hirado kilns. [[source/history-of-japanese-art|p. 297, fig. 340]]"
