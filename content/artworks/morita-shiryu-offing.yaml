public_id: 108233
title: Offing (Okitsu)
creator: morita-shiryu
created: 1965
kind: byōbu
medium: Four-panel screen, pigment and lacquer on gold-leafed paper
materials: [lacquer, paper, gold leaf]
dimensions: [166, 312]
institution: kiyoshi-kojin-seichoji
description_md: "A four-panel screen by [[artist/morita-shiryu]] (1912–1999) of the Bokujinkai (Ink Human Society), founded in 1952 by calligraphers who saw calligraphy as a kind of expressionist painting: lacquer and ink on the gold screen of the Momoyama period, a calligraphic landscape of the characters of the title — the moment of leaving the harbour for the open sea, the soul embracing the ocean of Buddhist wisdom. [[source/history-of-japanese-art|pp. 379–381, fig. 453]]"
