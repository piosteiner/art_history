description_md: "The most controversial painting of [[artist/kuroda-seiki]] (1866–1924), made in France under Raphael Collin: a nude Western woman before a mirror, praised at the Société Nationale des Beaux-Arts in Paris, but considered pornographic in Japan — a frontal female nude never shown in public before. Destroyed during World War II. [[source/history-of-japanese-art|pp. 374–375, fig. 446]]"
