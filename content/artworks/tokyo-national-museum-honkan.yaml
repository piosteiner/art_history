description_md: "The prize-winning design of Watanabe Jin (1887–1973) for the Tokyo Imperial Museum in the “imperial-crown style” of Japanese nationalism in the 1930s: a curving Japanese roof and porte-cochère, a façade that reads as two storeys over three, upper galleries lit by daylight for sculpture and objects, the lower ones artificially for light-sensitive paintings. [[source/history-of-japanese-art|p. 349, fig. 406]]"
