  - owner: person/nicolas-rolin
    acquired: c. 1430
    method: commission
    label: probably commissioned by Nicolas Rolin, chancellor of Philip the Good, Duke of Burgundy — perhaps as a portable devotional panel, after his death in 1462 an epitaph
    certainty: probable
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010061856
        note: Vraisemblablement commandé vers 1430 par Nicolas Rolin (vers 1370-1462), chancelier du duc de Bourgogne Philippe le Bon.
        source: louvre-collections
        accessed: 2026-10-20
  - owner_label: Collegiate church of Notre-Dame-du-Châtel, Autun
    ended: 1793
    place: autun
    label: in the canons' sacristy beside the choir — described there in 1748 (a visit of 1705), 1778 and 1785
    sources:
      - url: https://collections.louvre.fr/ark:/53355/cl010061856
        note: Le panneau est décrit pour la première fois en 1748 dans l'église Notre-Dame-du-Châtel à Autun par un visiteur anonyme qui relate une visite de 1705. Il est à nouveau décrit au même endroit en 1778 et 1785.
        source: louvre-collections
        accessed: 2026-10-20
