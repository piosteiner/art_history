        note: Le panneau est saisi à la Révolution et déposé à l’École centrale d’Autun, où il est sélectionné (avec un tableau de Fra Bartolomeo, également transféré au Louvre, INV 97) par Alexandre Lenoir pour le Louvre, où il entre en 1800.
