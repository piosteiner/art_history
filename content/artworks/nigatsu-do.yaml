    label: hall of the Shuni-e (Omizutori) rite, east of the Great Buddha Hall; spared by the fires of 1180 and 1567, burnt during the Shuni-e in 1667 and rebuilt by December 1669 with the shogun Tokugawa Ietsuna as patron; owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/2457
        note: 東大寺二月堂は、大仏殿の東方にあり、八世紀後期の成立と考えられている。治承四年（一一八〇）及び永禄十年（一五六七）の火難を免れ、古代・中世を通じて存続したが、寛文七年（一六六七）二月、修二会の行法中に内陣から出火して焼失し、同九年十二月に徳川家綱を檀越として再建された。 … 所有者名 ： 東大寺
        source: kunishitei-102-2457
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/wiki/%E6%9D%B1%E5%A4%A7%E5%AF%BA%E4%BA%8C%E6%9C%88%E5%A0%82
        note: 修二会は大仏開眼供養と同年の752年（天平勝宝4年）に初めて行われたとされ、二月堂の創建もこの時とされる。ただし堂の創建については同時代の史料に言及がなく、確実なことは不明である。
        source: wikipedia-ja-todai-ji-nigatsu-do
        accessed: 2026-11-24
