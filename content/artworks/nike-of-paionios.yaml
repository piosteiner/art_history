provenance:
  - owner_label: Messenians and Naupaktians (dedication to Olympian Zeus)
    acquired: c. 420 BCE
    method: commission
    place: ancient-olympia
    label: votive of the spoils, made by Paionios of Mende and set up on a triangular pillar about 30 m southeast of the Temple of Zeus
    sources:
      - url: https://de.wikipedia.org/wiki/Nike_des_Paionios
        note: Gestiftet wurde die Nike dem Gott Zeus in Olympia von den mit Athen im Attischen Seebund verbündeten Messeniern und Naupaktiern. … lokalisieren den ursprünglichen Standort der Nike etwa 30 Meter südöstlich des Zeustempels in Olympia, wo sie als Beuteanathem aufgestellt worden war.
        source: wikipedia-de-nike-des-paionios
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Nike_of_Paionios
        note: made by the sculptor Paeonius of Mende between 425 BC and 420 BC to stand at the Temple of Zeus at Olympia … The Messenians and the Naupaktians dedicated this to Zeus Olympios as a tithe from the enemies.
        source: wikipedia-en-nike-of-paionios
        accessed: 2026-11-24
  - owner: person/ernst-curtius-2
    co_owners: [person/gustav-hirschfeld, person/friedrich-adler]
    acquired: 1875/1876
    method: find
    place: ancient-olympia
    label: fragments found October 1875 – May 1876 and in 1880–81; foundation of the base found in situ March 1876; the head on 3 November 1879, over 100 m from the base; with German excavations at Olympia
    sources:
      - url: https://de.wikipedia.org/wiki/Nike_des_Paionios
        note: Die fragmentarisch erhaltenen Überreste der Skulptur und der Basis wurden bei den deutschen Grabungskampagnen von Oktober 1875 bis Mai 1876 und der Jahre 1880 und 1881, unter der Leitung von Ernst Curtius, Gustav Hirschfeld und Friedrich Adler, in Olympia aufgefunden … Der Kopf der Statue wurde am 3. November 1879 mehr als 100 Meter von der Basis entfernt gefunden.
        source: wikipedia-de-nike-des-paionios
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Nike_of_Paionios
        note: The statue was excavated at Olympia in 1875–76, in the area of Elis, Greece.
        source: wikipedia-en-nike-of-paionios
        accessed: 2026-11-24
  - owner: institution/archaeological-museum-of-olympia
    method: transfer
    place: ancient-olympia
    label: inventory 46-8; the base remains in situ at the sanctuary
    sources:
      - url: https://de.wikipedia.org/wiki/Nike_des_Paionios
        note: Das Original der Skulptur ist heute im Archäologischen Museum in Olympia zu sehen (Inventarnummer 46-8).
        source: wikipedia-de-nike-des-paionios
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Nike_of_Paionios
        note: The pedestal that this figure would have originally sat on is still in situ in Olympia.
        source: wikipedia-en-nike-of-paionios
        accessed: 2026-11-24
