provenance:
  - owner_label: a member of the Medici family (perhaps Lorenzo di Pierfrancesco de' Medici)
    acquired: c. 1485
    method: commission
    certainty: possible
    sources:
      - url: https://www.uffizi.it/en/artworks/birth-of-venus
        note: It is highly probable that the work was commissioned by a member of the Medici family, although there is nothing written about the painting before 1550
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner: person/cosimo-i-de-medici
    acquired: before 1550
    place: florence
    label: in the Medici villa at Castello, where Vasari saw it in 1550 — Cosimo may have inherited it from the cadet branch, bought it, or taken it in a state confiscation; first in a villa inventory in 1598
    sources:
      - url: https://www.uffizi.it/en/artworks/birth-of-venus
        note: when Giorgio Vasari describes it in the Medici’s Villa of Castello, owned by the cadet branch of the Medici family since the mid-15th century
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Nascita_di_Venere
        note: Al tempo del riferimento vasariano l'edificio era di proprietà di Cosimo I de' Medici, che aveva sì potuto ereditare il dipinto dai suoi antenati del ramo "Popolano", ma anche averlo acquistato per conto personale o averlo sottratto durante una confisca di stato. La prima menzione in un inventario della villa risale al 1598.
        source: wikipedia-it-nascita-di-venere
        accessed: 2026-10-20
