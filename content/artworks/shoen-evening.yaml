description_md: "A late [[bijinga]] by [[artist/uemura-shoen]] (1875–1949), Japan’s most notable woman painter before the war and the first to receive the Order of Cultural Merit, raised by her mother in a tea shop: a frugal young woman threads a needle by moonlight — the image of her own mother, painted in 1941, when women were asked to conserve the country’s resources. [[source/history-of-japanese-art|pp. 369–370, fig. 439]]"
