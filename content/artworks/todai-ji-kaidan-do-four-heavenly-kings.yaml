web_url: https://kunishitei.bunka.go.jp/heritage/detail/201/195
description_md: "The Four Guardian Kings ([[shitenno]]) of the ordination hall: clay over a wooden armature, each figure in armour over cloth robes, standing on a subdued demon in a hip-slung pose — Tamonten with a reliquary, Kōmokuten with brush and scroll, Jikokuten with a long sword, Zōchōten with a lance. Made for a small platform where they could be seen close, and individualised as no two figures are alike. [[source/history-of-japanese-art|p. 90, fig. 111–114]]"
