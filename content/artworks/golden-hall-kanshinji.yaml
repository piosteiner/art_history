        note: 後醍醐天皇は当寺を厚く信任され、建武新政後(1334年頃)、 楠木正成 を奉行として金堂外陣造営の勅を出され、 現在の金堂ができた。… 室町時代初期に建立され、豊臣秀頼の時、江戸時代の中期、明治の初め、昭和の初め等たびたび修理し、昭和五十九年に昭和大修理の落慶をみた。
