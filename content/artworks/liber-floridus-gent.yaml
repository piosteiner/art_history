description_md: |-
  The autograph of the [[literature/liber-floridus|Liber Floridus]]: the manuscript written by its compiler, [[artist/lambert-of-saint-omer]], canon of Saint-Omer, who began the work in 1090 and completed it around 1121; its latter part is lost.[[source/wikipedia-fr-lambert-de-saint-omer]][[source/wikipedia-en-liber-floridus]] The oldest of the known manuscripts, it contains a map of parts of Europe and two climate-zone drawings after the Macrobian model as an attempt at a complete world map — believed to have been drawn by Lambert himself; the later copies in Wolfenbüttel and Paris (around 1150) are not his.[[source/wikipedia-en-liber-floridus]] Albert Derolez published a facsimile edition in 1968 and a codicological study, *Lambertus qui librum fecit*, in 1978.[[source/wikipedia-fr-lambert-de-saint-omer]]

  ## Author and title

  One picture shows Saint Audomar and Lambert as author in the town of Saint-Omer.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 115]] In his prologue Lambert explains the title: "I, Lambert, son of Onulfus, canon of Saint-Omer, have for God and Saint-Audomarus woven together this little book from the flowers of various authors, such that, with the various flowers brought together as if from a celestial meadow, the faithful bees may come to them and draw from them the sweetness of their heavenly flavour."[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 116]] Because the book "flowers with the beauty of a variety of books", he called it *Floridus*.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 116]]

  ## Trees

  In the lecture the manuscript stood at the beginning of the high-medieval tree diagrams.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 105]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 106]] Its pages show the names of islands and the rivers of Paradise with Paradise as a city around the Tree of Life (fol. 51v–52r); eight trees symbolising Christ's Beatitudes — cedar, cypress, palm, rose bush, olive, plane, terebinth and vine (fol. 139v–140r); and a palm with virtues and vices beside notes on the First Crusade and lists of the kings and patriarchs of Jerusalem (fol. 76v–77r).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 117]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 118]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 119]] The double page with the *Arbor bona* and the *Arbor mala*, the good and the bad tree, is on fol. 231v–232r.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 120]] The bad tree is labelled *Hec arbor autumnalis et infructuosa, bis mortua* ("this autumnal and fruitless tree, twice dead"), with the Gospel verses *Omnis arbor que non facit fructum bonum excidetur* and John the Baptist's *iam securis ad radicem arboris posita est* ("the axe is laid to the root of the tree").[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 125]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 126]] On the following opening Lambert illustrates Nebuchadnezzar's dreams of the statue symbolising the six ages of the world and of the tree (fol. 232v–233r).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 128]]
