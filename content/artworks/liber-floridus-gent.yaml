description_md: "The autograph of the [[literature/liber-floridus|Liber Floridus]]: the manuscript written by its compiler, [[artist/lambert-of-saint-omer]], canon of Saint-Omer, who began the work in 1090 and completed it around 1121; its latter part is lost.[[source/wikipedia-fr-lambert-de-saint-omer]][[source/wikipedia-en-liber-floridus]] The oldest of the known manuscripts, it contains a map of parts of Europe and two climate-zone drawings after the Macrobian model as an attempt at a complete world map — believed to have been drawn by Lambert himself; the later copies in Wolfenbüttel and Paris (around 1150) are not his.[[source/wikipedia-en-liber-floridus]] Albert Derolez published a facsimile edition in 1968 and a codicological study, *Lambertus qui librum fecit*, in 1978.[[source/wikipedia-fr-lambert-de-saint-omer]]"
