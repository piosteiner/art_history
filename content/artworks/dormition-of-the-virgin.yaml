provenance:
  - owner: artist/el-greco
    acquired: before 1567
    method: creation
    label: painted in Crete near the end of El Greco's Cretan period, probably before 1567; signed on the base of the central candlestick
    certainty: probable
    sources:
      - url: https://en.wikipedia.org/wiki/Dormition_of_the_Virgin_(El_Greco)
        note: Dormition of the Virgin is a tempera painting on panel executed by El Greco near the end of his Cretan period, probably before 1567. El Greco's signature on the base of the central candelabrum was discovered in 1983.
        source: wikipedia-en-dormition-of-the-virgin-el-greco
        accessed: 2026-11-24
      - url: https://el.wikipedia.org/wiki/Κοίμηση_της_Θεοτόκου_(Θεοτοκόπουλος)
        note: είναι έργο του Δομήνικου Θεοτοκόπουλου το οποίο δημιούργησε κοντά στο τέλος της περιόδου όπου ζούσε ακόμα στην Κρήτη, πιθανώς πριν το 1567.
        source: wikipedia-el-koimisi-tis-theotokou-theotokopoulos
        accessed: 2026-11-24
  - owner: institution/church-of-the-dormition-of-the-virgin-ermoupoli
    acquired: 1826/1829
    place: ermoupoli
    label: probably brought to Syros during the Greek War of Independence by refugees from Psara, who built the church in 1826–1829; recorded there since 1850 (church archives lost); still venerated there; signature found 1983 by Georgios Mastoropoulos
    certainty: probable
    sources:
      - url: https://en.wikipedia.org/wiki/Dormition_of_the_Virgin_(El_Greco)
        note: The icon, which retains its function as an object of veneration in the Church of the Dormition of the Virgin in Syros, was probably brought to the island during the Greek War of Independence.
        source: wikipedia-en-dormition-of-the-virgin-el-greco
        accessed: 2026-11-24
      - url: https://el.wikipedia.org/wiki/Κοίμηση_της_Θεοτόκου_(Θεοτοκόπουλος)
        note: Εξακολουθεί να βρίσκεται στον Ιερό Ναό Κοιμήσεως της Θεοτόκου στην Ερμούπολη, και κατά την επικρατέστερη άποψη μετακινήθηκε εκεί κατά την περίοδο της Ελληνικής Επανάστασης από κατοίκους των Ψαρών οι οποίοι μετά την καταστροφή των Ψαρών κατέφυγαν στη Σύρο, έκτισαν τον ναό την περίοδο 1826-1829 … η παλαιότερα γνωστή καταγραφή αναφέρει πως η εικόνα βρισκόταν στον ναό από το 1850.
        source: wikipedia-el-koimisi-tis-theotokou-theotokopoulos
        accessed: 2026-11-24
