description_md: "One of the oldest dated [[shigajiku]] and the record of an event: in 1413 the priest Junshihaku of Nanzenji built himself a study, Keiin (“valley shade”), and invited friends who wrote poems praising it; their poems and a long preface stand above the landscape. Below, the Chinese scholar’s ideal: a simple room with a stone-tiled floor and a bell-shaped window over a meandering stream, in a grove before tall Chinese mountains. No inscription names the painter, but most scholars accept the traditional attribution to [[artist/mincho]]. [[source/history-of-japanese-art|pp. 218, 221, fig. 254]]"
