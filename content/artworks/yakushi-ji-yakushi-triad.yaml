description_md: "[[yakushi]] seated on a rectangular throne between the bodhisattvas Nikkō and Gakkō, who stand in the hip-slung pose of the Tang style: the first Japanese sculptures in a fully Tang manner. The rich black colour comes from bronze high in tin and arsenic; the halos are Edo-period replacements. Whether the triad was cast for the first Yakushiji at Fujiwara and brought to Nara or made new for the second temple is still debated. [[source/history-of-japanese-art|p. 83, fig. 102–103]]"
