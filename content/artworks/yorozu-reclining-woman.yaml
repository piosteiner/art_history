description_md: "Painted in the year [[artist/yorozu-tetsugoro]] (1885–1927) graduated and co-founded the Fusainkai: a woman, nude to the waist, on a grassy hill, the grass, the trees and the background seen from three different viewpoints — Matisse and Van Gogh melded into Yorozu’s own vision. [[source/history-of-japanese-art|p. 378, fig. 451]]"
