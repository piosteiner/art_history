description_md: "From a series of satirical prints by [[artist/kobayashi-kiyochika]] (1847–1915), named after the English magazine Punch: in the graveyard of Tennōji a skeletal policeman points his finger at two skeletons, one of whom has taken off all but her underskirt to fan herself — a satire on the government’s attempt to control nudity to please Westerners. [[source/history-of-japanese-art|p. 383, fig. 456]]"
