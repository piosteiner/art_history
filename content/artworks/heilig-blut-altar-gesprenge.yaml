description_md: |-
  The superstructure (Gesprenge) of the Holy Blood altarpiece in St. Jakob, Rothenburg ob der Tauber, carved in 1501–1505: two angels hold a metal cross of the thirteenth century with the relic of the Holy Blood under rock crystal – the relic the whole altarpiece was made to serve.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 83]] The carving is by [[artist/tilman-riemenschneider|Tilman Riemenschneider]], the spruce framework by [[artist/erhart-harschner|Erhart Harschner]].[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]]

  The altarpiece stands in the west choir of St. Jakob, built in 1453–1471 for the Holy Blood altar.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]] The relic of Christ's blood, whose Eucharistic meaning is taken up by the Last Supper in the shrine below, drew generous indulgence offerings from pilgrims and townspeople.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]] The whole altarpiece is 9.70 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]] Riemenschneider's altarpieces of this type rise into extremely tall, filigree Gothic superstructures in which further figures – often an Annunciation, small angels and a figure of Christ at the top – are placed.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]]
