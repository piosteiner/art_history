description_md: |-
  [[artist/vittore-carpaccio|Vittore Carpaccio]]'s miracle of the relic of the Cross at the [[place/rialto-bridge|Rialto Bridge]] is dated 1494, painted in oil on canvas and measures 371 × 392 cm; it is in the [[institution/gallerie-dell-accademia-venice|Gallerie dell'Accademia]] in Venice [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 47]]. It belongs to the [[artwork/true-cross-cycle|cycle of the Miracles of the True Cross]], begun in 1493 in the Bellini workshop, in which — following Patricia Fortini Brown's idea of an "eye-witness style" — the realistic depiction of real places and everyday life anchors abstract content with the highest credibility [[source/bockem-2016-jacopo-de-barbari|p. 43]].

  In the lecture it was shown, with details, beside [[artwork/bellini-processione-in-piazza-san-marco|Gentile Bellini's procession in the Piazza San Marco]] as a painted counterpart to the [[artwork/barbari-veduta-di-venezia|woodcut view of Venice]] of 1500 [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 46–52]]. Carpaccio's later "Lion of St Mark" (1516) in the Doge's Palace already shows the rebuilt roof of the campanile of San Marco, which was also inserted into the second state of the view of Venice [[source/bockem-2016-jacopo-de-barbari|p. 47]].
