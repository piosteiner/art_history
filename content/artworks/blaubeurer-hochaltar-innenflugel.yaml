description_md: |-
  The inner wings of the Blaubeuren high altarpiece, shown when the altarpiece is fully open: carved reliefs of the Nativity and the Adoration of the Magi.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 47]] The reliefs are by [[artist/michel-erhart|Michel Erhart]]; their painting and the painted backgrounds are by [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]] and a further Ulm painters' workshop, 1491–1494.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 41]] De Wikipedia places the Nativity on the right wing and the Adoration on the left.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  The wings form the transition between the painted views of the closed and half-open altarpiece and the fully carved shrine: here relief figures stand before painted landscapes and architecture.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 41, 47]] Their outer sides carry the paintings of the first opening, sixteen scenes from the life of John the Baptist.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 40]][[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]
