description_md: "The [[pagoda]] beside the golden hall of Hōryūji: the fifth storey is about half as wide as the first, which gives the tower its lightness and stability. A heart pillar rises from a foundation stone holding relics to the bronze finial with nine rings. On its ground floor the [[artwork/horyu-ji-pagoda-clay-tableaux]] of 711. [[source/history-of-japanese-art|p. 64, fig. 72]]"
