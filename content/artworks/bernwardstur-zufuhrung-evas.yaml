description_md: |-
  The second field from the top on the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows God leading Eve to Adam.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 34]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]] It follows the creation of the first human and precedes the Fall in the Genesis cycle, which runs from the top of the left leaf downwards.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] As elsewhere on this leaf the setting is reduced to a few plants, and the empty ground lets the gestures of the figures carry the scene.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]]

  Opposite it on the right leaf is the scene of the three Marys at the tomb; the lecture listed the two as a typological pair – God bringing Eve to Adam set against the women who come to Christ's tomb on Easter morning.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]] Both scenes show women approaching: the first woman brought to the first man, and the women who find the tomb of the new Adam empty.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]]
