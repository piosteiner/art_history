description_md: "Four scenes of clay figures set among rock shapes around the central pillar on the ground floor of the [[artwork/horyu-ji-five-storied-pagoda]], finished in 711. North: the death of [[shaka]], his disciples in violent grief, the bodhisattvas calm; east: the debate between the layman Yuima and the bodhisattva Monju; west: the distribution of the relics. [[source/history-of-japanese-art|p. 81, fig. 99–100]]"
