description_md: "One of the five hundred [[rakan]] that [[artist/shoun-genkei]] (1648–1710), a Buddhist sculptor turned wandering priest, carved for the Gohyaku Rakanji in Edo between 1688 and 1695 with permission of an Ōbaku abbot and support from the shogun [[person/tokugawa-tsunayoshi]]: [[yosegi-zukuri]] with black lacquer and gold leaf, less polished than the Chinese sculptor Fan Daosheng’s, but closer to Japanese naturalism. [[source/history-of-japanese-art|pp. 308–309, fig. 358]]"
