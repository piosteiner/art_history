provenance:
  - owner_label: excavation for the foundations of the old Acropolis museum
    acquired: 1865/1866
    method: find
    place: athens
    label: torso found in the Perserschutt on the Acropolis (1865 in en; late 1865 or early 1866 in de)
    sources:
      - url: https://en.wikipedia.org/wiki/Kritios_Boy
        note: The torso was found in 1865 while excavating the foundation of the old museum on the Athenian Acropolis.
        source: wikipedia-en-kritios-boy
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Kritios-Knabe
        note: Der Torso wurde Ende 1865 oder früh im Jahr 1866 als Teil des sogenannten Perserschutts gefunden.
        source: wikipedia-de-kritios-knabe
        accessed: 2026-11-24
  - owner: person/panagiotis-kavvadias
    co_owners: [person/georg-kawerau]
    acquired: 1888
    method: find
    place: athens
    label: head found between the museum and the Acropolis south wall and joined to the torso (a head joined before, Inv. 699, removed)
    sources:
      - url: https://en.wikipedia.org/wiki/Kritios_Boy
        note: The head of this statue was found twenty-three years later between the museum and the Acropolis south wall, in the latest stage of the rubble of destruction undergone in the Persian Wars.
        source: wikipedia-en-kritios-boy
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Kritios-Knabe
        note: Der zugehörige Kopf wurde erst 1888 bei den Grabungskampagnen unter der Leitung von Panagiotis Kavvadias und Georg Kawerau entdeckt … Ein zuvor mit dem Torso verbundener und aus dessen Fundkomplex stammender Kopf (Akropolismuseum Inv. 699) wurde daraufhin wieder entfernt
        source: wikipedia-de-kritios-knabe
        accessed: 2026-11-24
  - owner: institution/acropolis-museum
    method: transfer
    place: athens
    label: inventory 698
    sources:
      - url: https://en.wikipedia.org/wiki/Kritios_Boy
        note: It is on display in the Acropolis Museum, Athens, near the site where it was excavated. [Inv. no. 698.]
        source: wikipedia-en-kritios-boy
        accessed: 2026-11-24
