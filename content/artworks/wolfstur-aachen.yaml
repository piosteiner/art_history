description_md: |-
  The Wolfstür is a two-leaf bronze door of around 800 in the vestibule of [[institution/aachen-cathedral|Aachen Cathedral]]; it measures 392.3 × 134.5 cm, and its lion heads are riveted on.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]] It belongs to the Carolingian bronze doors of the palace chapel, which are among its most precious furnishings and are largely preserved.[[source/wikipedia-de-aachener-dom]] Apart from its lion-head door pulls it has no figurative decoration.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]]

  When a single-storey baroque porch was set in front of the westwork in 1788, the Carolingian Wolfstür was moved there and has formed the main portal of the church ever since; today it is opened only on high church feasts and for the Aachen pilgrimage (Heiligtumsfahrt).[[source/wikipedia-de-aachener-dom|§ Bauhistorie]][[source/wikipedia-de-aachener-dom|§ Bauliche Veränderungen]] It was repaired in 1924, and at the outbreak of the Second World War its leaves were opened and boarded over with wood behind a protective brick wall in the vestibule.[[source/wikipedia-de-aachener-dom|§ Alliierte Rheinlandbesetzung und Weimarer Republik]][[source/wikipedia-de-aachener-dom|§ Zeit des Nationalsozialismus]]

  Like the Mainz doors and the Hildesheim door that followed, the Aachen doors were cast by the lost-wax process.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]] In the lecture the Wolfstür and the [[artwork/mainzer-marktportal-bronzetur|Mainz bronze door]] of Archbishop Willigis stood side by side as the monumental bronze doors before the [[artwork/bernwardstur|Bernward door]], whose lion-head pulls, unlike the riveted ones in Aachen, were cast together with the leaves.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 74]]
