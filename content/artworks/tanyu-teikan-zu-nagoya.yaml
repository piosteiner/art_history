public_id: 107994
title: Emperor Wen, from the Mirror of Emperors (Teikan zu)
creator: kano-tanyu
created: 1634
kind: fusuma-e
medium: Fusuma panels, colour, gold paint and gold dust on paper
materials: [paper, gold]
dimensions: [192, 140.5]
dimensions_note: each panel
institution: nagoya-castle
description_md: "From the wall paintings [[artist/kano-tanyu]] (1602–1674) made for the Jōrakuden of Nagoya Castle, built for the shogun Iemitsu’s stay in 1634: on fusuma of the most important room he chose the Mirror of Emperors, Chinese rulers good and bad judged by Confucian standards. Emperor Wen, informed of the cost of a tower he had ordered, rescinds the order; framed by an evergreen and white mist under gold dust. Tanyū, grandson of Eitoku and official painter to the shogunate at fifteen, set the model for two centuries of Kanō painters. [[source/history-of-japanese-art|pp. 311–312, fig. 362]]"
