description_md: "By [[artist/ike-gyokuran]] (1727–1784), Taiga’s wife and collaborator, from a family of women poets and a student of Yanagisawa Kien — the first known female [[bunjinga]] artist: mountain scenery piled up in time-honoured fashion, but with an exquisite sense of placement leading the eye across the composition. [[source/history-of-japanese-art|pp. 332–333, fig. 387]]"
