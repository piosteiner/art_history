description_md: |-
  The calendar of an Anglo-Saxon miscellany of the mid-11th century in the [[institution/british-library|British Library]], London (Cotton MS Tiberius B V).[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 52]]

  ## September: hunters and pigs in the forest

  The lecture "Aus dem Wald" showed the picture for September on fol. 7r, with hunters and pigs in a forest.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 52]] It illustrated two of the ways in which pre-modern people used the forest: as pasture for pigs, goats, sheep and cows, and as a hunting ground for bears, wild boar and deer.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 51]] Wood pasture produced its own type of forest, the *Hudewald*, with little undergrowth and a characteristic browse line low on the trees.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 55]] Another Anglo-Saxon calendar of the early 11th century, Cotton MS Julius A VI in the British Library, was shown for the labour of January.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 37]] Later in the session the hunting scene of December in the [[artwork/tres-riches-heures|Très Riches Heures]] took up the theme of the hunt.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 53]]
