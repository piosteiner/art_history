description_md: "A pair of two-panel screens from [[artist/ogata-korin]]’s last Kyoto period: a plum on either side of a curving stream whose surface is a series of flat decorative wave patterns in ink and silver; slender branches with small blossoms against angular forms — rich in pattern and contrasts of light and dark against glistening gold. [[source/history-of-japanese-art|pp. 315–316, fig. 366]]"
