description_md: "A standing [[yakushi]] on the other side of the Birushana in Tōshōdaiji: stocky, with deep folds over the chest, its robe falling tightly over the thighs. Dated after 796 by a coin in the cavity of the image; [[wood-core-dry-lacquer]], perhaps a technique brought by Ganjin’s monk-sculptors. [[source/history-of-japanese-art|p. 97, fig. 123]]"
