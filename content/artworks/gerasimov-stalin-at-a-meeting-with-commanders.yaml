description_md: |-
  [[artist/aleksandr-gerasimov|Aleksandr Gerasimov]]'s picture of [[person/joseph-stalin|Stalin]] with commanders of 1937 was shown in the seminar under the question "Photographic realism or social optimism?", beside Hermann Otto Hoyer's [[artwork/hoyer-im-anfang-war-das-wort]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 21]].

  ## Official portraiture

  As Stalin tightened his grip on the country, Gerasimov concentrated on official portraits such as *Stalin and Voroshilov in the Kremlin*, for which he won a Stalin Prize in 1941 [[source/wikipedia-en-aleksandr-gerasimov-painter|§ Biography]]. During the Stalin period socialist realist painters produced numerous heroic portraits of Stalin, in the most realistic fashion possible, to serve his cult of personality [[source/wikipedia-en-socialist-realism|§ Characteristics]]. Groys explains why such "photographic" realism was not meant as a copy of reality: Stalinist realism aimed to make an ideal real, and art was to show the world as it must become [[source/groys-1994|pp. 156–157]].

  Title as on the slide [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 21]]; which of Gerasimov's paintings of Stalin it is remains to be checked.
