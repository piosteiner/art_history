description_md: The main hall of [[institution/yakushi-ji]], a towering two-storeyed building with a [[mokoshi]] on each storey, with room before it for a large assembly. The original of about 730 was lost; the present hall is a reconstruction of the late twentieth century, restoring the compound to something close to its first appearance. It houses the [[artwork/yakushi-ji-yakushi-triad]]. [[source/history-of-japanese-art|p. 66, fig. 75]]
