description_md: "This walnut relief on the right leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the Last Supper.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 102]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 103]] The right leaf shows Christ's ministry and Passion.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] Richard Hamann compared it with the Flight into Egypt on the left leaf: the panels of the right leaf each show only one scene, and their figures are built with clear structure and vertical lines – the manner of the carver he called the \"master of the parallel figures\".[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Meisterfrage]]"
