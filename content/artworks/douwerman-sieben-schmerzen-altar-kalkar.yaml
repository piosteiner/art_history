description_md: |-
  A carved retable by [[artist/heinrich-douvermann|Henrick Douwerman]] in the south aisle of St. Nicolai in [[place/kalkar|Kalkar]], made of oak in 1518–1521.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]] Its shrine shows scenes of the Seven Sorrows of Mary — the Presentation in the Temple, the Flight into Egypt, the twelve-year-old Jesus in the Temple, the Carrying of the Cross, the Crucifixion, the Deposition and the Entombment — and its predella the [[artwork/douwerman-sieben-schmerzen-altar-predella|Root of Jesse]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]]

  ## Commission

  Douwerman, a citizen of Kalkar since 1517 at the latest, received the commission for the retable in 1518; it was consecrated in 1522.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] It is his only authenticated work made entirely in his workshop and the basis for every other attribution to him; stylistic traces in some figures suggest that Arnt van Tricht worked on it.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] The German Wikipedia names, besides Douwerman, Hendrik Grotens and Ferdinand Langenberg among the makers of the altar.[[source/wikipedia-de-st-nicolai-kalkar|§ Altäre]] St. Nicolai, a three-aisled hall church largely completed by its consecration in 1450, keeps nine of what were at least sixteen carved retables.[[source/wikipedia-de-st-nicolai-kalkar|introduction; § Geschichte und Architektur]] Its high altar, carved from 1488 by Master Arnt of Zwolle and finished by Ludwig Juppe in 1498–1500, was never painted, either for lack of money or because of a change in taste; the wood for its shrine was bought by the church's confraternity — boards in Amsterdam, Kampen and Nijmegen, heavy timber from the forest of Cleves.[[source/wikipedia-de-st-nicolai-kalkar|§ Hochaltar]]

  ## A case study

  The lecture "Aus dem Wald" made the altarpiece the case study of its first session, showing it in several views and details.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 45]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 47]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 48]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 55]] It followed the session's comparison of two scholarly approaches to wood.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 32]] For Michael Baxandall wood enters mainly as an "affordance", a range of possibilities for artistic form that the masters exploited with skill.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 32]] For Gregory C. Bryda wood is central to the meaning and function of the works, with a strong focus on the wood of the Cross and the Passion.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]] At Kalkar the Passion scenes of the shrine stand above a predella in which the genealogy of Christ grows as a tree out of the sleeping Jesse, carved in oak.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 49]]

  ## Oak

  Douwerman belonged to the sculptors of the Lower Rhine between Cleves, Kalkar and Xanten who worked mainly in oak.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] In northern Germany and the Netherlands wood sculptors generally used oak, or sometimes walnut, rather than the limewood of southern Germany; the Lübeck guild even prescribed oak for all religious images.[[source/baxandall-1980-limewood-sculptors|p. 27]] Northern carvers had access to cheap and excellent East Baltic timber, including oak, imported by the Hansa by sea.[[source/baxandall-1980-limewood-sculptors|p. 28]] Baxandall describes oak as "dense and aggressively structured", with rays strong enough to resist the tool,[[source/baxandall-1980-limewood-sculptors|p. 34]] a wood that offers the carver "a positive cubic medium" in the middle forms of a sculpture.[[source/baxandall-1980-limewood-sculptors|p. 39]] Unlike limewood, which splits rather than warps, oak warps more than it splits.[[source/baxandall-1980-limewood-sculptors|p. 34]]
