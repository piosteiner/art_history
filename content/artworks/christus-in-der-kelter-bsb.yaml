description_md: |-
  This South German woodcut of Christ in the winepress was made about 1460–70; it is coloured by hand, printed on paper and measures 38.8 × 25.7 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 29]]. It is in the [[institution/bayerische-staatsbibliothek|Bayerische Staatsbibliothek]] in Munich (Rar. 327) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 29]].

  The lecture placed it in its section "Leidensdruck" on early woodcuts as a medium of the Passion of Christ [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 25]], after an earlier [[artwork/christus-in-der-kelter-gnm-h-4|version of the subject]] from the first quarter of the fifteenth century [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 28]]. It was then set beside a winepress with spindle press of the early eighteenth century in the Historisches Museum der Pfalz in Speyer and beside an eighteenth-century printing press from Nuremberg in the Germanisches Nationalmuseum [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 30–31]], and shown again with the printing press at the start of the next session [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 4]]. From about 1460 portable hand presses and from 1470 printing presses were in use [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]].
