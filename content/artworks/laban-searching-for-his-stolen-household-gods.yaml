  - owner_label: Marquis of Villamanrique
    acquired: 1665
    method: commission
    place: seville
    label: probably Manuel Luis de Guzmán y Manrique de Zúñiga, IV Marqués de Villamanrique (d. 1692); then likely by descent in the family
    sources:
      - url: https://clevelandart.org/art/1965.469
        note: "Marquis of Villamanrique, Seville [1665-] — The Marquis of Villamanrique, probably Manuel Luis de Guzmán y Manrique de Zúñiga, IV Marqués de Villamanrique (d. 1692) commissioned this painting from Murillo. The painting then passed down through the family, likely following this line of descent: Melchor de Guzmán Osorio Davila Manrique de Zuñiga, V Marqués de Villamanrique (d. 1710); Ana Nicolasa de Guzmán Osorio Dávila y Manrique de Zúñiga, VI Marquesa de Villamanrique (d. 1762); Ventura Antonio Osorio de Moscoso y Guzmán Dávila y Aragón, VII Marqués de Villamanrique, (d. 1746); Ventura Osorio …"
        source: cma-1965-469
        accessed: 2026-11-24
