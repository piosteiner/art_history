description_md: |-
  *Ulysses' Gaze* (1995) is a film by [[artist/thodoros-angelopoulos|Theo Angelopoulos]], loosely based on Homer's *Odyssey*, with Harvey Keitel, Maia Morgenstern and Erland Josephson [[source/wikipedia-en-ulysses-gaze|introduction]].

  ## The film

  A Greek filmmaker, called only A, travels across the Balkans — Albania, North Macedonia, Bulgaria, Romania, Serbia — in search of three undeveloped reels by the Manaki brothers, pioneers of film in the region, and ends in besieged Sarajevo [[source/wikipedia-en-ulysses-gaze|§ Plot]]. On the way he travels on a barge carrying a statue of Lenin, cast as Polyphemus [[source/wikipedia-en-ulysses-gaze|§ Plot]]. The film is part of Angelopoulos's trilogy on borders and the first he made outside Greece; it won the Grand Jury Prize at Cannes in 1995 [[source/wikipedia-en-ulysses-gaze|§ Production]] [[source/wikipedia-en-ulysses-gaze|§ Accolades]].

  ## The afterlife of monuments

  The seminar showed the frame in which the statue of Lenin, taken apart and reassembled like a body in a funeral parlour, passes on a barge down a river through the Balkans [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 34]]. Monuments occupy public space, so their removal mattered as much as their making [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. After the fall of the Soviet Union a second wave of iconoclasm removed or demolished many monuments, in Russia as elsewhere [[source/kalashnikov-2023|p. 131]]. Groys notes the "perpetual discussions" of what to do with the monuments of "real socialism", "whose mass is far too great to house in any museum" [[source/groys-1994|p. 145]].
