description_md: "From the series New Images of the Floating World (Shinban Uki-e) by [[artist/katsushika-hokusai]] (1760–1849): courtesans and townspeople bustle around the gate of the Asakusa temple, guarded by enormous Niō, the crowds on its balcony and in the street giving a sense of the vitality of the culture of the entertainment quarters — and of a new leisure tourism. [[source/history-of-japanese-art|p. 275, fig. 313]]"
