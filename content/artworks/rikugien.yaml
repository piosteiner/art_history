title: Rikugien gardens
attribution_label: Anonymous
created: 1699/1706
kind: garden
medium: Water, stones, plants
institution: rikugien-institution
description_md: "One of the first large gardens laid out in Edo between 1699 and 1706 by Yanagisawa Yoshiyasu, a favourite of the shogun [[person/tokugawa-tsunayoshi]] (1680–1709): almost 25 acres (10 ha) with a lake and artificial hills, planted like a daimyo garden but on a vast scale — today a public park, as such spaces became places where the population of Edo gathered on holidays. [[source/history-of-japanese-art|pp. 275–276, fig. 314]]"
