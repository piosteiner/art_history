description_md: "[[artist/ito-jakuchu]] (1716–1800), the eldest son of a Kyoto greengrocer, gave the shop to his brother at thirty-nine and devoted his life to painting; after copying Chinese works he kept hens and cocks and drew them from life ([[shaseiga]]). Cock, hen and hydrangea are painted with hyper-realism; space is suggested only by superimposing one shape on another. [[source/history-of-japanese-art|pp. 323–324, fig. 375]]"
