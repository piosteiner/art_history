description_md: |-
  A poster by the Swiss artist [[artist/hans-erni|Hans Erni]], *Rettet den Wald* ("Save the forest"), of 1983, in the poster collection of the [[institution/museum-fur-gestaltung-zurich|Museum für Gestaltung]] in Zurich.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 13]] It is one of about 300 posters Erni made in the course of his career.[[source/wikipedia-en-hans-erni|introduction]]

  ## In the lecture

  The lecture "Aus dem Wald" showed the poster in its opening survey of how the forest is seen today, beside present-day attitudes summed up as "tree hugging" and "forest bathing", Romantic forest paintings by [[artist/caspar-david-friedrich|Caspar David Friedrich]] and [[artist/ludwig-richter|Ludwig Richter]], and [[artwork/struth-paradise-19|Thomas Struth's photograph of the Bavarian Forest]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 6]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 12]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 13]] It was followed by covers of *Time* (April 2008 and September 2019) and *The Economist* (September 2010) on the forests, and by four recent exhibitions on the subject: "Mythos Wald.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 14]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 15]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 16]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 18]] Das Flüstern der Blätter" (Emden, Kunsthalle, 2022), "Among the Trees" (London, Hayward Gallery, 2020), "Into the Wood" (Vienna, KunstHausWien, 2024) and "Im Wald" (Zurich, Landesmuseum, 2022).[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 14]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 15]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 16]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 17]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 18]]
