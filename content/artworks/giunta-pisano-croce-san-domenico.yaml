description_md: |-
  The painted crucifix (croce dipinta) made by [[artist/giunta-pisano|Giunta Pisano]] for the church of San Domenico in Bologna, dated 1254 in the lecture and painted in tempera and gold on panel; it measures 336 × 285 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]] Wikipedia calls it his masterpiece, dates it 1250 and records its inscription "Cuius docta manus me pixit Junta Pisanus" (painted by the skilled hand of Giunta Pisano); it hangs in the left transept of the basilica.[[source/wikipedia-en-giunta-pisano|§ Works]]

  Giunta's crucifixes show a new way of representing Christ: the traditional Byzantine image of the crucified Christ serene in victory (Christus triumphans or gloriosus) gives way to Christ dying in agony (Christus patiens).[[source/wikipedia-en-giunta-pisano|§ Influence]] The lecture paired the Bologna cross with an older painted cross from the church of the Holy Sepulchre in Pisa (around 1200) to show precisely this change.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]] The Bologna crucifix strongly influenced Cimabue.[[source/wikipedia-en-giunta-pisano|§ Influence]] Giunta is the earliest Italian painter whose name is found inscribed on a surviving work.[[source/wikipedia-en-giunta-pisano|§ introduction]]
