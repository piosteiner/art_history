description_md: |-
  The central shrine of the Holy Blood altarpiece in St. Jakob, Rothenburg ob der Tauber, with the Last Supper; the figures are by [[artist/tilman-riemenschneider|Tilman Riemenschneider]], the case by the Würzburg cabinetmaker [[artist/erhart-harschner|Erhart Harschner]], who made it in 1499–1502.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82, 86]] The figures were carved in 1501–1505.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]]

  ## Description

  Judas stands in the centre, in front of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 86]] The figures and the foliage ornament (Rankenwerk) are limewood and were left unpainted, with a protective glaze; the case is spruce.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]] As in Riemenschneider's Creglingen altarpiece, the central group stands before a row of glazed Gothic windows that let light in from behind: the scene takes place in an architecture like the window-lit choir in which the altarpiece stands.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]] The Last Supper expresses the Eucharistic meaning of the relic of Christ's blood kept in the superstructure above, which brought generous indulgence offerings from pilgrims and townspeople.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]]

  ## Unpainted

  When a transparent surface film was first diagnosed on the Rothenburg altarpiece, Riemenschneider came to be regarded as the "inventor" of the unpainted winged retable.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 30]] De Wikipedia, however, says the figures at first had to work without the painting planned for later, and Georg Habenicht argues that even Riemenschneider knew that the carvings he delivered unpainted were as a rule meant to be painted.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]][[source/habenicht-2016-das-ungefasste-altarretabel|p. 184]]
