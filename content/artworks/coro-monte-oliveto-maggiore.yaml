description_md: |-
  The intarsia of the choir stalls of the abbey church of [[institution/monte-oliveto-maggiore|Monte Oliveto Maggiore]] was made by [[artist/fra-giovanni-da-verona|Fra Giovanni da Verona]] in 1504–1506 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 67]]. The lecture showed a panel of the wall panelling with a perspectival view through an arcade onto ancient ruins [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 67, 83]].

  ## Material

  Records show that "green wood" (legname verde) was bought in 1504 for this cycle for the considerable price of 14 soldi, which points to an external supplier [[source/ajmar-2024-reciprocal-design|p. 41]]. This wood, stained blue-green by the fungus Chlorociboria, had an established market because its long-lasting colour could not be produced artificially at the time [[source/ajmar-2024-reciprocal-design|p. 41]]; it had to be harvested at the right moment, since longer exposure to the fungus would disintegrate the wood [[source/ajmar-2024-reciprocal-design|p. 25]]. Fra Giovanni used it systematically in his large cycles, often for things naturally green such as grass, foliage and the plumes of birds [[source/ajmar-2024-reciprocal-design|pp. 39–40]].

  In the lecture the Monte Oliveto view was compared with [[artist/benedetto-da-maiano|Benedetto da Maiano]]'s [[artwork/studiolo-urbino-ausblick-landschaft|view through an arcade]] in the studiolo of Urbino and with Fra Giovanni's later [[artwork/sagrestia-santa-maria-in-organo-tarsie|sacristy panels in Verona]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 66–71]], and it opened the section "Fungi as artists? The role of natural materials" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 82–83]].
