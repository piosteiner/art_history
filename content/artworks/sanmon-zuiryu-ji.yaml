        note: 現在の門は文政3年（1820年）に竣工したものである。 … 正保2年（1645年）竣工した山門は万治年間（1658年 - 1661年）に場所を移して建てかえられたが、延享3年（1746年）の火災で焼失した。長らく仮の門が建てられていたが、17世紀天外和尚や町年寄の懇願により、山上善右衛門善順を棟梁として文化11年（1814年）建設着手、文政元年（1818年）に焼失した門と同様の古式な禅宗様式で再建された
