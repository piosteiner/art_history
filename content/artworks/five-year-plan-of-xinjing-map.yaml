description_md: |-
  A map insert of Xinjing (today [[place/changchun]]), the capital of [[polity/manchukuo]], as planned. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]

  ## Description

  The anonymous *Five-Year Plan of Xinjing, Manchukuo* is a lithographed map insert printed in Japan in 1935. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] It was shown in the session "World War II, Prior and During" on 17 May 2019, whose vocabulary lists "Manchukuo maps". [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]]

  ## The city plan

  Changchun was made the capital of Manchukuo on 10 March 1932 and renamed Xinjing ("New Capital", Japanese Shinkyō) on 13 March. [[source/wikipedia-en-changchun|§ Manchukuo and World War II]] In March 1932 the South Manchuria Railway began to draw up the Metropolitan Plan of Great Xinjing, carried out by a capital construction bureau under the State Council of Manchukuo; the Kwantung Army's chief of staff and his deputy fixed a construction area of 200 km². [[source/wikipedia-en-changchun|§ Construction of Hsinking]] The plan drew on the 19th-century renovation of Paris, the garden-city movement and American city planning of the 1920s, with broad avenues and extensive tree planting. [[source/wikipedia-en-changchun|§ Construction of Hsinking]] [[source/wikipedia-en-changchun|§ Manchukuo and World War II]] Because of the war it remained unfinished. [[source/wikipedia-en-changchun|§ Construction of Hsinking]]

  ## Maps as propaganda

  Maps of Japan's inroads into China were a common motif on kimono and scarves, helping viewers to measure the extent of Japanese power in East Asia, with Japanese-controlled railways and aeroplanes over China. [[source/kushner-2011-drive-to-mobilize|p. 21]] Such maps linked into the textbooks taught in schools and into the imagination of all ages; tourist guides and rail schedules spread the same picture. [[source/kushner-2011-drive-to-mobilize|p. 21]] Kushner shows a man's under-kimono on which a newspaper page about the expansion into Manchukuo is laid across a map of the colony — "Images of their new colonial 'homeland' were everywhere." [[source/kushner-2011-drive-to-mobilize|p. 15]] A printed plan of a new capital belongs with this cartography of empire. [[source/kushner-2011-drive-to-mobilize|p. 21]]
