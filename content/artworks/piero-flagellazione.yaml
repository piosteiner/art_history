description_md: |-
  [[artist/piero-della-francesca|Piero della Francesca]]'s Flagellation of Christ dates from about 1450/55; it is painted in tempera on wood and measures 58 × 81.5 cm [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 18]]. It is in the [[institution/galleria-nazionale-delle-marche|Galleria Nazionale delle Marche]] in Urbino [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 18]].

  The lecture showed it as an example of the central perspective developed in early Renaissance Florence, after Giorgio Vasari's account of Filippo Brunelleschi's perspective demonstrations and of his teaching of the young [[artist/masaccio|Masaccio]], and after Masaccio's Trinity in Santa Maria Novella (1425–28) [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 11–18]]. It was followed by [[artwork/pozzo-volta-sant-ignazio|Andrea Pozzo's ceiling]] in Sant'Ignazio in Rome as a late example of perspectival illusion [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 19]], before the lecture turned to intarsia, whose makers, according to Vasari, also learned perspective from Brunelleschi [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 20]].
