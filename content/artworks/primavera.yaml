  - owner_label: the heirs of Lorenzo di Pierfrancesco de' Medici
    acquired: 1503
    method: inheritance
    place: florence
    label: in the house in Via Larga at the end of the 15th century, later moved to the villa of Castello, where Vasari described it in 1550
    sources:
      - url: https://www.uffizi.it/en/artworks/botticelli-spring
        note: towards the end of the 15th century, it was to be found in the house in Via Larga (modern-day Via Cavour) that belonged to the heirs of Lorenzo di Pierfrancesco de’ Medici, cousin of Lorenzo the Magnificent. It was later moved to the Villa di Castello, where Giorgio Vasari (1550) describes it together with the Birth of Venus.
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner_label: the Medici grand dukes (Guardaroba)
    place: florence
    label: by 1815 in the Medici Guardaroba
    sources:
      - url: https://it.wikipedia.org/wiki/Primavera_%28Botticelli%29
        note: Nel 1815 si trovava già nel Guardaroba mediceo
        source: wikipedia-it-primavera
        accessed: 2026-10-20
  - owner: institution/galleria-dell-accademia-florence
    acquired: 1853
    ended: 1919
    method: transfer
    place: florence
    label: for the young artists studying at the Academy
    sources:
