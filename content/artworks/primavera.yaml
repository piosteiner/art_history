    acquired: c. 1480
    method: commission
    place: florence
    label: painted for Lorenzo “il Popolano”, second cousin of Lorenzo the Magnificent; in his palace in Via Larga (family inventories of 1498, 1503, 1516)
    sources:
      - url: https://it.wikipedia.org/wiki/Primavera_%28Botticelli%29
        note: Il dipinto venne eseguito per Lorenzo il Popolano (1463-1503) […] Gli inventari di famiglia del 1498, 1503 e 1516 hanno anche chiarito la sua collocazione originaria, nel Palazzo di via Larga
        source: wikipedia-it-primavera
        accessed: 2026-10-20
