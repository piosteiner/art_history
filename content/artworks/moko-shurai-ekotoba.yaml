description_md: A pair of handscrolls on the deeds of Takezaki Suenaga, a vassal of Higo Province who fought against the [[event/mongol-invasions-of-japan]] of 1274 and 1281. Pages are out of order, some are lost and other copies are mixed in, but its manners and depiction are of the Kamakura period — a visual record of historical events. Bought for the imperial household in 1890 from Ōyano Jūrō of Kumamoto. [[source/colbase-szk002942]]
