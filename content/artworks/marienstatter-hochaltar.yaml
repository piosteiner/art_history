description_md: |-
  The high-altar shrine with wings of the former Cistercian abbey church of Marienstatt in the Westerwald, made in Cologne around 1350.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 26]] It is of oak; the shrine is 2.30 m high and 2.78 m wide.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 26]]

  In the lecture it followed the high altar of Doberan (around 1300), another Cistercian shrine with wings, and preceded the Göttingen altarpiece of 1402, in a sequence on the "logic of the shrine": the housing and the unveiling of the holy.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 25–27, 35]]

  Marienstatt was founded from Heisterbach in 1212, moved to its present site in 1222, and its first church was consecrated in 1227; the abbey belonged to the diocese of Cologne.[[source/wikipedia-en-marienstatt-abbey|§ History]] The abbey church of Our Lady was begun in 1222 and finished in 1425.[[source/wikipedia-de-abtei-marienstatt|§ Abteikirche]] From 1476 lay people were allowed to attend services in the abbey church, and in 1485 the pilgrimage day was set on the octave of Corpus Christi.[[source/wikipedia-en-marienstatt-abbey|§ History]]

  Winged altarpieces arose around 1300 as a liturgically changeable form of retable; one reason discussed for the new type is the display of relics and (miracle-working) images, which is especially clear in examples with many compartments such as the side altars of Doberan, the Clare altar in Cologne and the retable at Marienstatt.[[source/wikipedia-de-flugelaltar|§ Geschichte]]
