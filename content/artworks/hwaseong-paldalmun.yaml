description_md: "The south gate of the new city wall of Suwŏn, which [[person/jeongjo-of-joseon]] built near the tomb of his father [[person/crown-prince-sado]] to atone for his murder by King Yŏngjo: a double-roofed gate with baffled walls, built under Prime Minister [[person/chae-je-gong]] with Western-inspired techniques and cranes devised by [[person/jeong-yak-yong]]. [[source/portal-2000|p. 121, fig. 61]]"
