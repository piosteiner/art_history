description_md: Scenes of the ills that befall human beings, from toothache to hallucinations, in a small format (a sheet only about 27 cm high) for intimate viewing. In a bedroom with three soundly sleeping women, a sufferer from insomnia props herself on one arm, counting on her fingers; the single black lamp stand echoes her wakeful figure. [[source/history-of-japanese-art|p. 211, fig. 244]]
