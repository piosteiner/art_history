description_md: A small gilt-bronze image of the newborn [[shaka]], already with the marks of a Buddha, raising his right hand to heaven and lowering the left to the earth as he proclaims himself lord of all above and below. Said to have been made for the eye-opening ceremony of 752; set in a basin engraved with landscapes and figures for the yearly ritual on the Buddha’s birthday, when coloured water is poured over it. [[source/history-of-japanese-art|p. 93, fig. 117]]
