      currency: GBP
    sources:
      - url: https://www.artic.edu/artworks/11392
        note: "his heirs, sold Christie’s, London, 6-21 May 1853, no. 74, for £660 [there is some confusion about the buyer at the Louis-Philippe sale: though the Illustrated London News, 21 May 1853, p. 400 states that it was bought by Farrer for a client in Manchester, the copy of the auctioneer’s book in Christie’s archives appears to be marked to Steward, Stewand or Towend …]"
