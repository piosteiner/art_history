description_md: |-
  The late Gothic high altarpiece of the parish church of St. Martin at Lorch am Rhein, completed in 1483 and considered the first carved altarpiece in Germany designed to remain monochrome, without polychromy.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 97]][[source/wikipedia-de-lorcher-hochaltar|§ introduction]] It is the largest winged altarpiece of the German-speaking lands and the best preserved in its furnishings, and the most valuable work of art of the diocese of Limburg.[[source/wikipedia-de-lorcher-hochaltar|§ introduction]]

  ## Material and form

  The load-bearing parts of the shrine and the filling boards of the wings are oak, the sculpture and ornament lime; the lecture gives a total height of 12.80 m, a shrine 4.20 m high and 3.60 m wide, and a width of 7.22 m with the wings open.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 97–98]] Wikipedia gives a height of 13.96 m.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] To give the whole a uniform bronze tone, the surfaces were probably treated with a stain containing pigments from walnuts and tea, and polished.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]]

  Above a predella with two busts of unidentified, lively debating figures rises a two-storey shrine in five vertical parts.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] Below, the Virgin and Child stand on the crescent moon in the central niche – at 159 cm the largest figure – between the four virgin martyrs Catherine, Barbara, Margaret and Dorothy; above her stands the patron of the church, Saint Martin dividing his cloak with the beggar, between Wendelin, Bartholomew, John the Baptist and Anthony.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] In two small niches of the lower register are busts of the master of the works (magister fabricae) and of the carver himself, whose scroll bears the date 1483.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]] A filigree superstructure (Gesprenge) with three towers rising almost to the vault crowns the shrine.[[source/wikipedia-de-lorcher-hochaltar|§ Beschreibung]]

  ## The carver

  No documents on the making of the altarpiece survive; it was once wrongly attributed to Jörg Syrlin the Elder of Ulm and later to followers of Niclaus Gerhaert van Leyden.[[source/wikipedia-de-lorcher-hochaltar|§ Geschichte]] In 1993 Hanns Hubach identified the carver as Hans Bilger of Worms, mainly on the strength of the early use of pure branch-work ornament, the busts in the shrine and the early monochrome finish.[[source/wikipedia-de-lorcher-hochaltar|§ Geschichte]] Georg Habenicht also names the "Master of the Lorch high altar (Hans Bilger?)".[[source/habenicht-2016-das-ungefasste-altarretabel|p. 185]]

  ## Unpainted

  At the end of the 1980s the restorer Eike Oellermann proved that the altarpiece was originally conceived as monochrome.[[source/wikipedia-de-lorcher-hochaltar|§ Geschichte]] This finding took from Tilman Riemenschneider the title of "inventor" of the unpainted winged retable, which he had held since a transparent surface film was diagnosed on his Holy Blood altarpiece at Rothenburg.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 30]] For Habenicht, Riemenschneider was simply not the first to deliver unpainted carvings; unpainted retables arose above all from the division of the trades working on an altarpiece, which let patrons commission and pay for the parts separately.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 185]]

  ## Later history

  In 1597 the still monochrome wings were painted in camaïeu, after their low reliefs had been removed; in 1719 the whole altarpiece received a polychrome Rococo finish and the wings their present paintings.[[source/wikipedia-de-lorcher-hochaltar|§ Geschichte]] After years of neglect it was restored in 1852–58, when lost figures in the superstructure were replaced; in 1949/50 the later painting was removed to restore a monochrome appearance, but the delicate ornament of shrine and superstructure was coated with a brown glaze instead, and the 1719 panels were kept on the wings.[[source/wikipedia-de-lorcher-hochaltar|§ Geschichte]]
