description_md: |-
  The Bernward door is a two-leaf bronze door dated around 1015 in the west portal of [[institution/hildesheim-cathedral|Hildesheim Cathedral]]; its sixteen figurative reliefs set scenes from Genesis against scenes from the life of Christ and are regarded as the first pictorial cycle of German sculpture.[[source/wikipedia-de-bernwardstur]] It takes its name from its patron, Bishop [[person/bernward-of-hildesheim|Bernward of Hildesheim]], and counts as one of the principal works of Ottonian art.[[source/wikipedia-de-bernwardstur]] In the lecture "Aus dem Wald" it opened the session on wooden doors as "the oldest monumental picture door of the Middle Ages", described as the first monumental picture door cast in bronze in one piece.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 70]]

  ## Inscription and date

  A Latin inscription on the middle cross-rail, chased while Bernward was still alive, gives 1015 as the date by which the doors were made.[[source/wikipedia-de-bernwardstur|§ Werkgeschichte]] In the lecture's transcription it reads "AN[NO] DOM[INICE] INC[ARNATIONIS] MXV B[ERNVVARDUS] EP[ISCOPUS]. DIVE MEM[ORIE] HAS VALVAS FVSILES IN FACIE[M] ANGELICI TE[M]PLI OB MONIM[EN]TVM SVI FEC[IT] SVSPENDI" – in the year of the Incarnation 1015 Bishop Bernward of divine memory had these cast door leaves hung at the front of the "temple of the angel" as his memorial.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 69]]

  ## Where it hung

  Part of the scholarship identifies the "temple of the angel" with Bernward's burial church of St. Michael: on this view the leaves first hung there and came to the cathedral only when Bishop Godehard gave it a west entrance in 1035 and had his predecessor's door hung in it.[[source/wikipedia-de-bernwardstur|§ Werkgeschichte]] Other scholars hold that the door was meant for the cathedral from the start, whose west block may have been dedicated to the archangel Michael.[[source/wikipedia-de-bernwardstur|§ Werkgeschichte]] Ittai Weinryb follows the first view and treats the door as made for St. Michael, which Bernward deliberately built outside the fortified walls of Hildesheim on a hill at the edge of the "untamed wilderness".[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 61]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 74]] The leaves escaped the bombing of Hildesheim on 22 March 1945 because the cathedral chapter had moved them, together with many other furnishings, almost three years earlier to an underground passage at the Kehrwiederwall.[[source/wikipedia-de-bernwardstur|§ Werkgeschichte]] During the restoration of the cathedral in 2010–2014 the door was moved back to its original place in the east wall of the west "paradise" (vestibule), where the leaves again turn on their historical bronze pivots.[[source/wikipedia-de-bernwardstur|§ Werkgeschichte]]

  ## Material and casting

  Each leaf was cast in one piece; the leaves measure 472 × 125 cm (left) and 472 × 114.5 cm (right) and weigh about 1.85 tonnes each.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]] The lecture gives 472 × 125 cm for each leaf, 1,850 kg per leaf and 3,700 kg in all.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 70]] The alloy is a leaded gunmetal: the lecture gives 81–83 % copper, 3.7–5.3 % tin, 5.4–8.7 % lead and 5.3–6.6 % zinc.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 70]] Like its predecessors in Aachen and Mainz the door was made by [[term/lost-wax-casting|lost-wax casting]], in which the mould can be used only once.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]] A wax model of the whole door was made, about 210 kg per leaf; the relief fields were modelled separately in wax and set into the overall form lying flat, and details, surface textures and the inscription were worked into the bronze only after casting.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 71]] The mould of fired clay was strengthened at the back by an iron grid.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 71]] Because of the great quantity of metal several furnaces had to be used at once; the molten bronze ran through channels into the hollow clay mould, whose pressure forced the mould apart below the channels, and where the metal did not fill the form, second pours (Überfangguss) were needed.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 72]] The back of the door shows a large such repair in the area of the Fall relief, and the pivots on which the door hangs were cast together with the leaves.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 73]] So were the door pulls, lion heads holding rings.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 74]][[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]] Technical analyses show that the clay mould was filled standing on its long side, and the rough cast had to be extensively finished by chasing.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]]

  Where the metal came from is open. The lecture pointed to silver, copper and lead mining around the Rammelsberg in the Harz from the 10th century – ores dug by "montani", charcoal made and ores smelted by "silvani", and trade through Goslar, Magdeburg and Hildesheim.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 75]] German Wikipedia states, however, that material analyses have not identified the deposit and that the Rammelsberg smelter can be ruled out.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]] Weinryb calculates the fuel: smelting 40 kg of copper takes about 50 kg of charcoal, made from 500 kg of dry wood; if 1,400 kg of copper had to be smelted for the door, that step alone needed more than twenty grown beeches of about 800 kg each – an area the size of a football pitch.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 102]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 103]]

  ## Composition and style

  The door imitates an antique frame-and-panel door, but the narrow frames and flat relief make the bands read like the picture strips of a contemporary de-luxe manuscript.[[source/wikipedia-de-bernwardstur|§ Gesamtkonzeption]] Backgrounds are reduced to plants (mainly on the left leaf) and architecture (mainly on the right), and large empty fields set off the outlines of the few figures, whose gestures answer one another.[[source/wikipedia-de-bernwardstur|§ Komposition der Szenen]] The figures have the large oval faces and almond eyes typical of Ottonian sculpture, and they do not rise evenly from the ground but lean out of it, so that the head of Mary in the Adoration of the Magi is fully in the round while her lower body is flat relief.[[source/wikipedia-de-bernwardstur|§ Figuren]] No master's name is recorded, unlike the Mainz market portal; Rainer Kahsnitz has doubted older attempts to divide the reliefs among several masters.[[source/wikipedia-de-bernwardstur|§ Meisterfrage]]

  ## Programme

  The left leaf shows, from the top downwards, the Old Testament story of humankind's growing distance from God – creation, Fall, fratricide; the right leaf, from the bottom upwards, Christ's work of redemption from the Annunciation to the Resurrection.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] The lecture set the horizontally opposite fields side by side as pairs: creation of Eve – Noli me tangere; God bringing Eve to Adam – the Marys at the tomb; Fall – Crucifixion; judgement of Adam and Eve – Christ before Pilate; expulsion – presentation in the Temple; Adam labouring and Eve with her sons – Adoration of the Magi; the offerings of Cain and Abel – Nativity; the murder of Abel – Annunciation.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] In the Fall and the Crucifixion it confronted the tree of knowledge with the wood of life.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 55]] Christ's public life, which the door leaves out, is told on Bernward's bronze column, which stood in the east choir of St. Michael until the 18th century.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] According to the cathedral ordinal of 1473 the bishop led the clergy barefoot out through the bronze doors and back again after the expulsion of the public penitents on Ash Wednesday, and the left leaf's subjects match the breviary readings for Septuagesima, with which the pre-Lenten season begins.[[source/wikipedia-de-bernwardstur|§ Liturgische Bedeutung]]

  ## Models

  Monumental bronze doors already existed in the palace chapel at Aachen ([[artwork/wolfstur-aachen|Wolfstür]], around 800) and in the [[artwork/mainzer-marktportal-bronzetur|market portal of Mainz Cathedral]], cast for Archbishop Willigis by [[artist/berenger|Berenger]]; neither had figures apart from the Aachen lion-head handles.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]] During his stay in Rome in 1001/02 Bernward could have studied the bronze door of Old St. Peter's and perhaps the late antique [[artwork/porta-di-santa-sabina|wooden doors of Santa Sabina]], which also set Old and New Testament scenes against each other; the doors of [[artwork/porta-lignea-sant-ambrogio|Sant'Ambrogio]] in Milan are named as possible models too.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]] Several Genesis scenes are almost identical in composition with the Moutier-Grandval Bible, made in Tours around 840; Bernward travelled to Tours in 1006.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]]

  ## The door in its frontier setting

  Weinryb reads the door and the column as a technical, scientific and artistic "avant-garde" inside the political, military and colonial project of the Ottonian empire.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 53]] Around 1000 Hildesheim lay on the front line of the dioceses along the Elbe, in the conflict with the pagan Slavs east of it.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 59]] In 1013, two years before the door was consecrated, Henry II confirmed the see's perpetual rights over the two forts Bernward had built against the Slavs, Mundburg and Wyrinholt, and Weinryb argues that this, among other things, prompted Bernward to commission the door – a door at the threshold of the Christian church against which the "idol-worshipping" Slavs kept campaigning.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 60]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 61]] He contrasts the bronze with the Slavs' cult objects of wood or stone and their simple metalwork, and with a perforated wooden door from [[artwork/holztur-burg-lenzen|Burg Lenzen]] of around 1000, which he sees as a forerunner of the Hildesheim door in function and in the experience it offered.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 65]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 72]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 95]] The sheer quantity of material and skill set door and column far above those objects, and the bronze, linked to the sound of church bells, made the door a "technical miracle" in Alfred Gell's sense.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 95]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 96]] Following Harvey Stahl and Isabelle Marchesin on the trees in the background of the scenes, Weinryb reads them not only as decoration but as a reminder of the forest felled to make the door, and concludes that Hildesheim's Christian bronzes, in their own way, paid homage to the wooden gods of the Slavs.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 104]][[source/weinryb-2023-die-hildesheimer-avantgarde|p. 105]]

  ## Later echoes

  Later medieval bronze doors show no recognisable connection with Hildesheim, and the technique of casting each leaf solid did not prevail; the doors of Augsburg, Verona (San Zeno) and Novgorod are bronze reliefs fixed on a wooden core.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]] In 1881 Lorenz Gedon made a faithful cast-iron copy for the west portal of the Pauluskirche in Worms, without the top two fields of each leaf.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]]
