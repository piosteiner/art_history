    period: "1015"
    notes_md: "Die erste monumentale Bildertür aus Bronze, jeder Flügel in einem Guss im Wachsausschmelzverfahren: ein Wachsmodell der ganzen Tür, die Form in einer Grube, mehrere Öfen zugleich wegen der Metallmenge; mitgegossen die Türzapfen und die Löwenkopf-Türzieher, auf der Rückseite eine grosse Nachgussstelle beim Sündenfallrelief. Kupfer und Silber kamen aus dem Rammelsberg im Harz. Die Inschrift nennt das Jahr 1015 und Bischof Bernward."
