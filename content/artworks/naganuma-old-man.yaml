description_md: A bronze head by [[artist/naganuma-moriyoshi]] (1857–1942), who studied in Venice and co-founded the Meiji Art Society; the model is said to have been a gardener near his house. Freed from the need for a likeness, the modelling is softer and deeper than Ōkuma’s and seems to penetrate beneath the sitter’s features. [[source/history-of-japanese-art|p. 357, fig. 419]]
