description_md: The only one of the original buildings of Shimo (Lower) Daigoji to survive, completed in 951 and the only example of its type left from the tenth century. Placed so that the visitor climbing the gentle slope sees its soaring height without looking down on it. Inside, the casings around the central pillar, the walls and even the doors are painted with the mandalas of the Two Realms and the Shingon patriarchs. [[source/history-of-japanese-art|pp. 137–138, fig. 167]]
