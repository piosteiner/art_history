  - owner: person/friedrich-welz
    acquired: 1939
    ended: 1944
    method: theft
    direct: true
    place: salzburg
    notes_md: 'Taken from Lea Bondi Jaray on the eve of her escape to England; the US Attorney: "a Nazi stole [it] from a Jewish woman in 1939".'
    sources:
      - url: https://onlinecollection.leopoldmuseum.org/objekt/527-bildnis-wally-neuzil/
        note: “Lea Bondi Jaray, Wien (vor 1925-1939); (1) / Friedrich Welz, Salzburg (1939-1944); (2) / Salzburger Landesgalerie, Salzburg (1944-1945); / 1945 Sicherstellung durch die US-Besatzungsmacht und 1947 Übergabe an das / Land Salzburg (3) / Dr. Robert Rieger und Tana Berger, New York (1948); (4) / Österreichische Galerie Belvedere, Wien (1950-1954); (5) / Dr. Rudolf Leopold, Wien (1954-1994); (6) / Leopold Museum Privatstiftung, Wien (seit 1994) / Salzburger Landesarchiv, Rückstellungskommission beim Landesgericht Salzburg, Rk 108/48, Teilerkenntnis vom 3. Mai 1948”
        source: leopold-museum-online-sammlung
        accessed: 2026-10-19
      - url: https://www.justice.gov/archive/usao/nys/pressreleases/July10/portraitofwallysettlementpr.pdf
        note: “the United States has entered into a settlement agreement with the Leopold Museum Privat-Stiftung (the "Foundation") and LEA BONDI JARAY's estate (the "Estate") to resolve the civil forfeiture action against Portrait of Wally ("Wally"), an oil painting by EGON SCHIELE that a Nazi stole from a Jewish woman in 1939. According to the terms of the settlement agreement, the Leopold Museum will pay BONDI's Estate $19 million in exchange for the painting.”
        source: us-attorney-sdny-2010-wally
        accessed: 2026-10-19
