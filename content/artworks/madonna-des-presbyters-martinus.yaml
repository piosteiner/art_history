description_md: |-
  The Madonna of the priest Martinus comes from the Camaldolese monastery of Borgo San Sepolcro in southern Tuscany and is dated January 1199; it is of poplar, painted and gilded, 184 cm high, and in the Skulpturensammlung of the Bode-Museum, Berlin (Inv. 29).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 45]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 57]]

  ## The inscription

  The statue is dated and signed by its inscription: ANNO DOMINI MCLXXXXVIIII MENSE GENVARII / IN GREMIO MATRIS FVLGET SAPIENTIA PATRIS / FACTVM EST AUTEM HOC OPUS MIRABILE DONNI PETRI ABBATIS TEMPORE / PRESBITERI MARTINI LABORE DEVOTO MINISTRATO AMORE — "In January of the year 1199. In the lap of the mother shines the wisdom of the father. This wonderful work was made in the time of Abbot Peter through the devout labour and offered love of the priest Martinus."[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 57]] Ilene Forsyth cited it beside the reliefs of Arezzo and Beaucaire, whose inscriptions express the idea of the [[term/sedes-sapientiae|Throne of Wisdom]] with the same terseness: "On the lap of the Mother sits the Wisdom of the Father."[[source/forsyth-1972-the-throne-of-wisdom|pp. 26–27]]

  ## The throne of Solomon

  The lecture read the statue against the biblical description of Solomon's great throne of ivory overlaid with gold, with its six steps and lions (1 Kings 10:18–20).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 58]] Peter Damian (c. 1007–1072/73) interpreted that throne as [[person/mary|Mary]]: "our Solomon", Christ, who is the Wisdom of the Father, prepared a throne for himself in the lap of the chaste Virgin.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 59]] In the Romanesque period Mary thus figured the throne of Solomon, holding in her lap the incarnate Divine Wisdom.[[source/forsyth-1972-the-throne-of-wisdom|p. 26]]
