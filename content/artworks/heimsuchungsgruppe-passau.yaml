description_md: |-
  A sandstone group of the Visitation – the meeting of the pregnant [[person/mary|Mary]] and her cousin Elizabeth – made in Passau around 1420 and now in the Germanisches Nationalmuseum, Nuremberg (Pl.O.2401).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 100]] The museum names the convent of Niedernburg in Passau as its origin.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]] It is 96 cm high, 89 cm wide and 33 cm deep.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]]

  ## Description

  Mary and Elizabeth step towards each other and embrace at the hips, above almond-shaped hollows in their rounded bellies; Mary's holds the small figure of the blessing Christ Child, Elizabeth's the kneeling infant John the Baptist.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]] The two unborn children are modelled in clay and set into the stone; the hollows were once closed by small lids or windows of glass.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 100]][[source/gnm-objektkatalog-pl-o-2401|Beschreibung]] The two women seem to assure each other of their pregnancies by touching each other's bodies; Mary, as a virgin, shows her curling hair, once gilded, while the married Elizabeth covers hers.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]] The museum sees the group as a devotional image of the intense piety of women's convents and its swirling drapery as typical of the late Soft Style.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]]

  ## The two wombs

  Elina Gertsman uses the group to show that the wombs themselves could be ranked: the Virgin encloses Christ in a clean, unblemished cavity, while Elizabeth's uterus – clearly a far less holy place – is a tangle of inner organs.[[source/gertsman-2015-worlds-within|p. 59]] Visitation scenes were the commonest setting for images in which the Virgin's body becomes transparent and shows Christ inside.[[source/gertsman-2015-worlds-within|p. 59]]

  ## Condition

  Traces of an old but not original brown painting on a chalk ground survive; Mary's mantle was once red, and a later painting of 1862 that the group still had when it was acquired in 1927 was removed.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]] Small drill holes along the hems probably held gilded tin balls.[[source/gnm-objektkatalog-pl-o-2401|Beschreibung]]

  In the lecture the group followed the walnut Visitation by Master Heinrich of Constance in New York and preceded Henry Suso's vision of looking into his own heart.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 99–101]]
