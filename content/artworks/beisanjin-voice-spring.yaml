description_md: "[[artist/okada-beisanjin]]’s mature style: overlapping rectangular rocks and triangular mountains carry the eye into deep space, but the strange angular shapes at top and bottom pull the peaks forward against the recession — a tension between perspective and surface. He was largely self-taught from Chinese manuals. [[source/history-of-japanese-art|pp. 336–337, fig. 392]]"
