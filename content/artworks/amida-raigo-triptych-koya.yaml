description_md: Amida, a resplendent gold figure on a golden lotus, faces the viewer as he descends on a lavender cloud — a very public ceremony after [[person/genshin]]’s description of the welcome. Before him Kannon holds the lotus pedestal for the deceased and Seishi prays; [[jizo]] and the legendary master Nāgārjuna are near, and twenty-eight figures — monks, bodhisattvas and musicians — complete the retinue in red iron-wire outlines, bright garments and [[kirikane]]. A lake with marsh grass and a hill with pines and maples in autumn colour are the landscape of Heian. Dated after the Byōdōin doors, probably to the late eleventh century; kept on Mount Kōya. [[source/history-of-japanese-art|pp. 146–147, fig. 178]]
