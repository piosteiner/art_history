description_md: |-
  The so-called Pianta della Catena ("chain map") is a view of [[place/florence|Florence]] by [[artist/lucantonio-degli-uberti|Lucantonio degli Uberti]], a woodcut on eight sheets measuring 57.8 × 131.6 cm, in the [[institution/kupferstichkabinett-berlin|Kupferstichkabinett]] in Berlin [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 56]]. The lecture dates it about 1510/20 and describes it as made after an engraving by Francesco Rosselli [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 56]]. Böckem relates it to a six-part engraving of about 1490 by Alessandro di Francesco Rosselli, of which only the upper left sheet survives (Florence, Accademia Toscana di Scienze e Lettere "La Colombaria", 29 × 44 cm) [[source/bockem-2016-jacopo-de-barbari|p. 56]].

  The view is taken from a raised point that is motivated within the image: in the lower right corner a draughtsman sits on a steep hill [[source/bockem-2016-jacopo-de-barbari|p. 56]]. Böckem suggests that projects of this kind may have inspired Anton Kolb's [[artwork/barbari-veduta-di-venezia|view of Venice]] of 1500 [[source/bockem-2016-jacopo-de-barbari|p. 56]]. An inventory of the workshop drawn up by Alessandro Rosselli's son after his death in 1525 shows that between 1480 and 1490 he had made and sold further city views on blocks and copper plates — Pisa in five parts, Rome in three blocks printed on twelve sheets, and Constantinople in six parts — none of which survives [[source/bockem-2016-jacopo-de-barbari|p. 56]].
