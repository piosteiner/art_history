description_md: |-
  The [[event/march-on-rome]] of 1922 painted ten years later by a former Futurist: history painting under Fascism [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 16, 71]].

  ## Context

  [[artist/giacomo-balla|Giacomo Balla]], once a leading [[movement/futurism|Futurist]], renounced Futurism and abstraction in the 1930s and returned to a naturalistic style [[source/wikipedia-en-giacomo-balla|§ Biography]]. *Marcia su Roma* (1931–32) belongs to this phase. The seminar showed it under the heading "History painting" beside the Soviet [[artwork/kibrik-leaders-of-october|*Leaders of October*]] (1946–47) by [[artist/yevgeny-kibrik|Yevgeny Kibrik]]: in both systems the events of the revolution — for Fascism the March on Rome of October 1922 — became subjects of official history painting [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 16]]. Golomstock saw totalitarian art portraying "war, the events of the past and everyday labour" as heroic struggle [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]], and the seminar's list of totalitarian themes — the image of the leader, history, war, labour — placed Balla's painting in the second of them [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 15–19]]. The painting dates from the years of the [[event/exhibition-of-the-fascist-revolution|Exhibition of the Fascist Revolution]] (1932), which retold the Fascists' rise to power [[source/antliff-2002|p. 154]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 31]].

  ## Modernism and totalitarian art

  The seminar set the painting against Balla's own [[artwork/balla-velocita-astratta|*Velocità astratta*]] (1913) as a case for the relations between modernism and totalitarian art [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. Golomstock notes that in Italy the formation of a totalitarian art "stretched out over two decades and was never fully completed" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]]; Balla, at first sympathetic to Fascism, later turned away from it and was shunned by the regime [[source/wikipedia-en-giacomo-balla|§ Biography]].
