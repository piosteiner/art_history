description_md: "A sea of figures on the ten stepped levels of the altar: one thousand standing images of the thousand-armed Kannon ([[senju-kannon]]) flanking a central seated one, with twenty-eight attendants. When the first Rengeōin burnt, 156 Kannon sculptures were saved and formed the nucleus of the new installation; the rest were made under [[artist/tankei]] in the thirteenth century, faithful to the older forms. Most stand frontally, some with a slight shift of weight. [[source/history-of-japanese-art|pp. 154–156, fig. 188]]"
