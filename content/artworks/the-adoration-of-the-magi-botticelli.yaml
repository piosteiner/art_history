  - owner_label: the engraver Peralli
    direct: true
    label: according to the Hermitage catalogue of 1891, on Vivant Denon's word; possibly Piero Pieralli (NGA note)
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.24.html
        note: "Said to have been acquired from a private collection in Rome by the engraver Peralli.[1] — [1] Information given by E. Brüningk and Andrei Somov, … 1891: 73: \"d'après le témoignage du baron Vivant Denon.\""
        source: nga-1937-1-22
        accessed: 2026-11-24
  - owner: person/dominique-vivant-denon
    place: paris
    label: the 1891 Hermitage catalogue says only that it was acquired through his intermediation; NGA thinks his ownership quite possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.24.html
        note: "Dominique Vivant Denon [1747-1825], Paris;[2] — [2] Actually Brüningk and Somov 1891: 73 say only that the painting was acquired \"par l'entremise\" (\"through the intermediation\") of Denon.  It is quite possible, however, that Denon … was already in possession of The Adoration of the Magi when in 1808 he was entrusted with augmenting the Russian Imperial collections"
        source: nga-1937-1-22
        accessed: 2026-11-24
  - owner: person/alexander-i-of-russia
    acquired: 1808
    method: purchase
    direct: true
    place: saint-petersburg
    sources:
      - url: https://www.nga.gov/collection/art-object-page.24.html
        note: sold 1808 to Czar Alexander I of Russia, [1777-1825], Saint Petersburg;
        source: nga-1937-1-22
        accessed: 2026-11-24
  - owner: institution/hermitage-museum-st-petersburg
    direct: true
    place: saint-petersburg
    label: the catalogues' mark 'A' (acquired by Paul I) is an error, the NGA says
