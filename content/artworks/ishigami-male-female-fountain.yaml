description_md: "A stone carving of a man and a woman entwined, water spouting from both mouths: one of the stone sculptures that once ornamented a garden at the palace of Kiyomihara at Asuka. A deliberately rough, comic piece beside the refined Buddhist sculpture of the time; Like the cone-shaped stone of Mount Sumeru from the same site, it points to Chinese garden sculpture. [[source/history-of-japanese-art|p. 45, fig. 47]]"
