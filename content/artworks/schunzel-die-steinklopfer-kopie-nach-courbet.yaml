description_md: |-
  A copy after [[artist/gustave-courbet|Gustave Courbet]]'s [[artwork/the-stone-breakers|*Stone Breakers*]], painted in 1926/27 by [[artist/l-schunzel|L. Schünzel]] in oil on canvas, 85 × 121 cm, and inscribed lower left "nach G. Courbet. von L. Schünzel."; it is in the [[institution/albertinum|Albertinum]] of the Staatliche Kunstsammlungen Dresden (Inv.-Nr. 89/30).[[source/skd-online-collection-189729|record]]

  Courbet's original, bought for the Dresden gallery around 1882, was lost in 1944/45.[[source/wikipedia-en-the-stone-breakers|§ History]] A smaller version by Courbet himself is in the Oskar Reinhart Collection in Winterthur: [[artwork/courbet-die-steinklopfer-winterthur|*Die Steinklopfer*]].[[source/bundessammlungen-sor1923-15|description]]
