description_md: "The best work of [[artist/ogata-korin]]’s first Kyoto period, shortly after he was given the title Hokkyō: clusters of velvety irises painted without outlines ([[mokkotsu]]), their petals in flat areas of light and dark blue, arranged in rhythmic groups over the gold leaf of two six-panel screens — the episode of the Tales of Ise in which the exiled hero composes a poem on the iris (kakitsubata) at Yatsuhashi, reduced to its poetic essence. [[source/history-of-japanese-art|pp. 314–315, fig. 365]]"
