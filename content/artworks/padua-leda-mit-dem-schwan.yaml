description_md: "*Leda mit dem Schwan* by [[artist/paul-mathias-padua|Paul Mathias Padua]] (1936) was shown at the Great German Art Exhibition of 1939 in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; photographed there ([Bayerische Staatsbibliothek, Bildarchiv hoff-26231](https://bildarchiv.bsb-muenchen.de/fylr/L/f1958a1c-f5ca-48ce-a4b6-ba2581c7ffa2)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Scenes from classical mythology were among the subjects shown beside landscapes, portraits and genre scenes.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]"
