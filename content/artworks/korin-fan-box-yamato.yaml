description_md: A gold-lacquer box on which [[artist/ogata-korin]] (1658–1716) pasted fan paintings of figures and flowers — perhaps an episode from the Tales of the Hōgen Rebellion, a frequent subject of Sōtatsu’s fans. Kōrin came from the Kariganeya, the textile shop that supplied the wives of Hideyoshi and Hidetada and the Empress Tōfukumon’in. [[source/history-of-japanese-art|pp. 313–314, fig. 364]]
