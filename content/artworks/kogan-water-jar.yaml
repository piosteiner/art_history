institution: hatakeyama-museum
description_md: "One of the most famous pieces of E [[shino-ware]]: a tea-ceremony water jar of fine white-firing clay under a thick, crackled white glaze over marsh grass sketched in iron brown. The thick glaze, almost like water, and its crazing suggest at once great age and agelessness — the [[wabi]] and [[sabi]] that tea masters such as Takeno Jōō and [[person/sen-no-rikyu]] sought in locally made wares. [[source/history-of-japanese-art|pp. 249–250, fig. 284]]"
