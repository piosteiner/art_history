description_md: The bronze doors that Archbishop Willigis had cast for his cathedral by [[artist/berenger|Meister Berenger]]; according to their inscription the first doors made of metal since Charlemagne — a claim that those who see Willigis's cathedral as a rival to Aachen as the place of coronation read as another sign of it.[[source/wikipedia-de-mainzer-dom]] Like the Aachen [[artwork/wolfstur-aachen|Wolfstür]] (around 800), whose only ornament is its lion-head handles, they have no figures; the Hildesheim [[artwork/bernwardstur|Bernward door]] (around 1015) followed with a whole biblical cycle.[[source/wikipedia-de-bernwardstur]] When the Liebfrauenkirche was pulled down in 1803 the doors came to the cathedral, where they form the Marktportal.[[source/wikipedia-de-mainzer-dom]]
