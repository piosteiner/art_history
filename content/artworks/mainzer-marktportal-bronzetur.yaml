description_md: |-
  The bronze doors that Archbishop Willigis had cast for his cathedral by [[artist/berenger|Meister Berenger]]; according to their inscription the first doors made of metal since Charlemagne – a claim that those who see Willigis's cathedral as a rival to Aachen as the place of coronation read as another sign of it.[[source/wikipedia-de-mainzer-dom]] The lecture dates them around 1000 and gives their size as 370 × 107/102 cm, in the north aisle portal of [[institution/mainz-cathedral|Mainz Cathedral]].[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]] German Wikipedia's account of the Bernward door dates them around 1009.[[source/wikipedia-de-bernwardstur|§ Vorbilder und Nachwirkungen]] Like the Aachen [[artwork/wolfstur-aachen|Wolfstür]] (around 800), whose only ornament is its lion-head handles, they have no figures; the Hildesheim [[artwork/bernwardstur|Bernward door]] (around 1015) followed with a whole biblical cycle.[[source/wikipedia-de-bernwardstur]] Like their predecessor in Aachen and their successor in Hildesheim they were made by lost-wax casting, and unlike the Hildesheim door they name their maker.[[source/wikipedia-de-bernwardstur|§ Herstellung und technische Merkmale]][[source/wikipedia-de-bernwardstur|§ Meisterfrage]]

  ## History

  The doors were originally set in the Liebfrauenkirche in front of the cathedral, which extended towards the Rhine and, according to the ceremonial, received the king or emperor arriving by ship.[[source/wikipedia-de-mainzer-dom|§ Ausstattung zur Zeit des Willigis]] In 1135 Archbishop Adalbert I of Saarbrücken had the town privilege he granted engraved in the upper part of the doors.[[source/wikipedia-de-mainzer-dom|§ Ausstattung zur Zeit des Willigis]] When the Liebfrauenkirche was pulled down in 1803 the doors came to the cathedral, where they form the Marktportal.[[source/wikipedia-de-mainzer-dom]]

  ## Willigis and Bernward

  Willigis had been appointed by Otto I and served Otto II as imperial chancellor; he ordained Bernward, whose links with the Ottonian court thus predated Bernward's own appointments.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 58]] On 15 January 993 Bernward was consecrated bishop in Mainz; Ittai Weinryb names the Mainz bronze door, together with the great Jupiter column there, among what Bernward could see in Mainz.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 88]] In the lecture the Mainz and Aachen doors stood side by side as the bronze doors before Hildesheim.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 30]]
