description_md: |-
  This intarsia panel by [[artist/antonio-barili|Antonio Barili]] shows St Catherine of Alexandria and a lute player; it comes from the [[artwork/barili-coro-cappella-san-giovanni-siena|choir stalls of the chapel of St John the Baptist]] in Siena Cathedral and is dated 1488–1502 in the lecture [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 55]]. It is now in the [[institution/collegiata-di-san-quirico-d-orcia|Collegiata]] of San Quirico d'Orcia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 55]].

  Together with Barili's [[artwork/barili-autoritratto|self-portrait]] from the same stalls, destroyed in Vienna in the Second World War, it was shown in the lecture as an example of the technique and its working steps [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 53–56]]: the pieces of wood were cut after a design drawing — which was used up as a cutting template, explaining why complete designs hardly survive — fitted together and trimmed on the panel with the shoulder knife, then glued to the base plate, the joints filled, the surface smoothed and varnished [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 53]].
