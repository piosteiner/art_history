description_md: The shrine on Miyajima, dedicated to three daughters of Susanoo who became the tutelary deities of the Taira family; completely rebuilt by [[person/taira-no-kiyomori]] after his appointment as governor of Aki as a dream palace extending over the sea. Destroyed many times and always rebuilt in the same design (the main buildings in 1556 on the twelfth-century model), it keeps the world of a Heian [[shinden-zukuri]] mansion on the Inland Sea. [[source/history-of-japanese-art|p. 165, fig. 200]]
