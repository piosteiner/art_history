description_md: The hall of the [[artwork/todai-ji-daibutsu]] at the heart of Tōdaiji, the temple [[person/emperor-shomu]] founded as the head of all provincial temples. The first hall was eleven bays long and seven deep, larger than the imperial audience hall; it burnt to the ground in 1180 in the Genpei War and was rebuilt at once. [[source/history-of-japanese-art|p. 68, fig. 78]]
