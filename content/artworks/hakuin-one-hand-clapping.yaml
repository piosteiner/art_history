title: One Hand Clapping
creator: hakuin-ekaku
created: 1766
kind: kakemono
medium: Ink on paper
materials: [ink, paper]
dimensions: [86, 26.4]
description_md: "Hakuin’s own koan, “the sound of one hand”, explained in a letter of 1753, illustrated two years before his death: the monk Hotei stands on his cloth bag, one hand hidden in his robe, the other raised; his eyes, unusually, look straight ahead as if laughing. “Young people, no matter what you say, everything is nonsense unless you hear the sound of one hand.” [[source/history-of-japanese-art|pp. 325–326, fig. 379]]"
