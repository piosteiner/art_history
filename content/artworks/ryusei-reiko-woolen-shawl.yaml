description_md: "From the series of portraits of his daughter Reiko by [[artist/kishida-ryusei]] (1891–1929), son of a well-known journalist, who moved from Van Gogh to Dürer and Van Eyck: the six-year-old’s full cheeks and intense eyes, the smooth planes of her face against the texture of the woollen shawl. [[source/history-of-japanese-art|p. 376, fig. 449]]"
