description_md: "Shown at the first exhibition of the Nihon Bijutsu’in, founded after [[person/okakura-kakuzo]] was forced out of the Tokyo Bijutsu Gakkō: the Chinese poet [[person/qu-yuan]], who like Sugawara no Michizane fell from his ruler’s favour and drowned himself, stands heroically against a hostile wind — recognized at once as a comment on Okakura’s battle with the Ministry of Education. [[source/history-of-japanese-art|p. 367, fig. 435]]"
