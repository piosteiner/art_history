description_md: |-
  An advertisement in the *Yomiuri Shinbun* of 21 April 1932: soldiers charge — "Totsugeki!!" — beside the brewery's name. [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]]

  ## Context

  The advertisement was shown in Klaus Friese's guest lecture "Trumpets and Textiles – War in the Japanese Material Culture from 1931 to 1945" on 10 May 2019. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] The brewery behind it goes back to the Japan Brewery Company, founded in Yokohama in 1885, which launched Kirin Beer in 1888; the Kirin Brewery Company was established in 1907, and Kirin is a core member of the Mitsubishi group. [[source/wikipedia-en-kirin-company|introduction]] [[source/wikipedia-en-kirin-company|§ History]] The *Yomiuri Shimbun*, published in Tokyo, is one of Japan's five major newspapers. [[source/wikipedia-en-the-yomiuri-shimbun|introduction]]

  The date places the advertisement in the first months after Japan created a puppet state in Manchukuo in 1932, when, as Barak Kushner writes, a sense of euphoria about Japan's imperial strength reached a fevered pitch. [[source/kushner-2011-drive-to-mobilize|p. 10]] The capital of [[polity/manchukuo|Manchukuo]] had been established in Changchun on 10 March 1932 and renamed Xinjing three days later. [[source/wikipedia-en-changchun|§ Manchukuo and World War II]] Kushner argues that Japan's imperial goals were reflected in the everyday products the population bought, and that no small number of wartime items were sponsored by companies that had a hand in supporting the war. [[source/kushner-2011-drive-to-mobilize|p. 18]] Advertising and children's entertainment, he notes, showed how children should behave and presented the war and their part in it as fate. [[source/kushner-2011-drive-to-mobilize|p. 21]]
