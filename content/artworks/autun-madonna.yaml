description_md: |-
  The Autun Madonna is a [[term/sedes-sapientiae|Throne of Wisdom]] statue from Burgundy of 1130/40, carved in birch and painted over a chalk ground, 102.9 cm high, in the Metropolitan Museum of Art, New York (47.101.15).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 34]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  ## Wood and technique

  Ilene Forsyth cited the Autun Madonna as the example of birch, used, like oak, in the north of France, whereas walnut was favoured in the south.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] Its height matches the Burgundian Majesties, which range from about 98 to 102 cm.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] It illustrates clearly the second of the two methods with which Romanesque sculptors avoided cracks: the entire figure of Mary, head and all, was shaped from a single block, the back hollowed out from just below the shoulders to the base, and the opening closed with a separate panel so carefully pegged that the seams were almost invisible and the statue looked solid.[[source/forsyth-1972-the-throne-of-wisdom|pp. 17–18]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 81]] The same method is seen in the [[artwork/grosse-goldene-madonna-hildesheim|Great Golden Madonna of Hildesheim]].[[source/forsyth-1972-the-throne-of-wisdom|p. 18]] Frank Fehrenbach referred to Forsyth's catalogue entry on "the Madonna from Autun (12th century) of the New York Metropolitan Museum" when discussing cavities in the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]].[[source/fehrenbach-1996-die-goldene-madonna|p. 77]]

  The lecture compared it with the [[artwork/raron-madonna|Raron Madonna]] in the discussion of the statues' iconography and wood.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 53]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 54]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 78]]
