description_md: |-
  A length of printed cotton of about 1936–1940 in the [[institution/museum-funf-kontinente|Museum Fünf Kontinente]] (inv. no. 2015-73-54). [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]] It was shown in Klaus Friese's guest lecture on war in Japanese material culture 1931–1945, "Trumpets and Textiles". [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]] [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] On propaganda textiles: [[source/kushner-2011-drive-to-mobilize|pp. 8–25]]

  ## Propaganda textiles

  Japanese wartime textiles show the reach of propaganda from the Sino-Japanese War of 1894–95 to the Second World War, with a thematic imagery that stayed remarkably constant across generations. [[source/kushner-2011-drive-to-mobilize|p. 9]] Their images were woven, embroidered, tie-dyed and printed on adult and children's kimono, furoshiki wrapping cloths, scarves, fans and obi. [[source/kushner-2011-drive-to-mobilize|p. 9]] Printed fabrics were sold by fabric sellers and taken to a kimono tailor for cutting and sewing; the military and the government neither designed nor distributed them. [[source/kushner-2011-drive-to-mobilize|p. 22]] Motifs ranged from soldiers, tanks, aeroplanes and maps of Japan's advance in China to puppies and children at play, much of it aimed at the young. [[source/kushner-2011-drive-to-mobilize|p. 10]] [[source/kushner-2011-drive-to-mobilize|p. 16]] [[source/kushner-2011-drive-to-mobilize|p. 21]] As the war years went on, such goods were often made of increasingly poor wool and even an early form of rayon. [[source/kushner-2011-drive-to-mobilize|p. 21]] Most were probably made commercially for parties and festive occasions, while others served as advertisements for companies, and department stores seem to have sold propaganda clothing ready to wear. [[source/kushner-2011-drive-to-mobilize|p. 25]]

  ## In the lecture

  On the image list the cotton opens the guest lecture, followed by the title page of *Shufu no Tomo* of 1938, a Kirin beer advertisement of 1932 and a silk haori of 1932 from the same museum. [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]] The session's reading included Kushner's essay and David Howes on the senses in material culture, for whom an artefact's meaning lies also in the sensory skills of its making and in its use. [[source/howes-2006-scent-sound-synaesthesia|p. 166]]
