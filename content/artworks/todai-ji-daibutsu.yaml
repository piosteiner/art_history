description_md: " The colossal image [[person/emperor-shomu]] ordered in 743 for the Kegon school. On the bronze petals of the lotus pedestal, which survive from the original, each petal is engraved with Shaka and attendant bodhisattvas — a universe of the Kegon sutra, and the best idea of the first Birushana. [[source/history-of-japanese-art|p. 87, fig. 105]]"
