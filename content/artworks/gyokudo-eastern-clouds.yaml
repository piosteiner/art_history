description_md: "The full force of [[artist/uragami-gyokudo]]’s mature style, painted, says its inscription, after he had been drinking saké: the familiar literati motifs — a scholar reading in his cottage, a bridge, a village, a pagoda — dissolved in a dense atmosphere of layered ink, from a light underlying sketch to near-black accents, as if seen through falling snow. A cold, hostile world in which only the scholar, unaware, survives. [[source/history-of-japanese-art|p. 338, fig. 394]]"
