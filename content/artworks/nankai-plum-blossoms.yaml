public_id: 107978
title: Plum Blossoms
creator: gion-nankai
created: 1740s
created_span: uncertain
kind: kakemono
medium: Hanging scroll, ink on paper
materials: [ink, paper]
dimensions: [96, 52.5]
description_md: "A monochrome plum by [[artist/gion-nankai]] (1677–1751), a doctor’s son with a Confucian education at the shogunal academy, exiled for ten years for an unrecorded offence: vigorous branches in the “flying-white” technique, where the split brush leaves a ragged swath of ink with the paper showing through, and small, delicately drawn petals. The plum is one of the Four Gentlemen of literati painting. [[source/history-of-japanese-art|pp. 327–328, fig. 381]]"
