description_md: |-
  The high altarpiece carved by [[artist/hans-bruggemann|Hans Brüggemann]] for the church of the Augustinian canons at Bordesholm, completed in 1521 and now in Schleswig Cathedral (St. Peter).[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 110]] It is carved in oak and left unpainted, and is 12.60 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 110]][[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]]

  ## Description

  Brüggemann worked on it from 1514 to 1521; an inscription on the altarpiece gives 1521 as the year of completion.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]][[source/wikipedia-en-hans-bruggemann|§ Biography]] With 392 figures it tells the Passion from the arrest of Jesus to Pentecost; the Carrying of the Cross and the Crucifixion are emphasised in the centre by larger formats, the Ascension and Pentecost appear on the wings, Adam and Eve stand beside the raised central section, and above everything is a Last Judgment that, lacking any threat, may rather mean Christ's return at the end of time.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]] Several scenes follow woodcuts from Albrecht Dürer's Small Passion.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]] English Wikipedia counts sixteen Passion reliefs with some 400 figures and sees influences from the Netherlands and southern Germany, and the deep, freely carved foreground figures recall Tilman Riemenschneider and Dürer; the scenes look Renaissance, the decoration and overall design Gothic.[[source/wikipedia-en-hans-bruggemann|§ Bordesholm Altar]] With its finely carved unpainted figures, the altarpiece is unique in north German art of its time.[[source/wikipedia-en-hans-bruggemann|§ Bordesholm Altar]]

  ## Unpainted – programme or provisional?

  The altarpiece is a central case in the debate on unpainted retables.[[source/habenicht-2016-das-ungefasste-altarretabel|pp. 30, 187]] Hartmut Krohm (1996) argued that Brüggemann's borrowings from Dürer's Small Passion were a spiritual appropriation rather than a mere adoption of forms: he chose his models for their content, to give artistic form to particular theological "core theses" with the help of unpainted sculpture.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 30]] Ingeborg Kähler (1981) read the altarpiece as a "sign in a crisis", linked to the lay piety of the devotio moderna.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 32]] Georg Habenicht counters that most unpainted retables were simply unfinished: at Bordesholm the greater part of the "pages" stayed blank or were only provisionally painted – in all, 24 large painting surfaces and two smaller predella surfaces remained bare.[[source/habenicht-2016-das-ungefasste-altarretabel|p. 187]]

  ## History

  After the Reformation the Bordesholm foundation was dissolved, and when the princely school that then used its buildings was closed in favour of the University of Kiel in 1666, Duke Christian Albrecht of Gottorf had the altarpiece set up in Schleswig Cathedral the same year; the carver Klavs Eibe dismantled, moved and re-erected it.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]] The young Emil Nolde took part in its restoration in Flensburg at the end of the nineteenth century, and in 2006 it was included in the Danish Culture Canon.[[source/wikipedia-de-schleswiger-dom|§ Brüggemann- oder Bordesholmer Altar]]
