provenance:
  - owner: person/lorenzo-nasi
    acquired: 1506
    method: commission
    place: florence
    label: commissioned for his marriage to Sandra di Matteo Canigiani (23 February 1506), says Vasari; broken into seventeen pieces when the Nasi house on Costa San Giorgio collapsed in a landslide on 12 November 1547, probably restored by Michele di Ridolfo del Ghirlandaio
    sources:
      - url: https://www.uffizi.it/en/artworks/mary-christ-and-the-young-john-the-baptist-known-as-the-madonna-of-the-goldfinch
        note: Giorgio Vasari says that the painting was commissioned for the marriage of Lorenzo Nasi with Sandra di Matteo Canigiani, celebrated on 23 February 1506. When, the Nasi home was destroyed by a landslide in 1547, the painting was broken into seventeen fragments and probably given to Michele di Ridolfo del Ghirlandaio for restoration. Its subsequent history is unknown
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner: person/gian-carlo-de-medici
    acquired: before 1646
    ended: 1663
    place: florence
    label: recorded in the cardinal's collection in 1646–1647; valued at 600 scudi in his estate inventory, one of the highest values of all
    sources:
      - url: https://www.uffizi.it/en/artworks/mary-christ-and-the-young-john-the-baptist-known-as-the-madonna-of-the-goldfinch
        note: until it is recorded as being part of the collection of Cardinal Giovan Carlo de’ Medici in 1646-47.
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Madonna_del_Cardellino
        note: Nell'inventario redatto alla morte del cardinale l'opera era stimata 600 scudi, un costo record
        source: wikipedia-it-madonna-del-cardellino
        accessed: 2026-10-20
  - owner: institution/uffizi-gallery
    acquired: before 1705
    place: florence
    label: in the Tribune in 1705
    sources:
      - url: https://it.wikipedia.org/wiki/Madonna_del_Cardellino
        note: confluì infine agli Uffizi. […] Si trovava nella Tribuna nel 1705
        source: wikipedia-it-madonna-del-cardellino
        accessed: 2026-10-20
