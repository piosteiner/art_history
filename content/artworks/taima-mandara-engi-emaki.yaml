description_md: "Two scrolls by an unknown artist on the legend of the original Taima tapestry: [[person/princess-chujo]], a nun at Taimadera, vowed to see Amida in living form; a young woman visiting from the court — Kannon in disguise — weaves the mandala in one night from lotus threads she has dyed five colours, and an old nun — Amida — explains it to her. A rare glimpse of the role of women in Japanese Buddhism. [[source/history-of-japanese-art|pp. 207–209, fig. 240]]"
