description_md: "A grimacing guardian in armour clutching a thunderbolt (vajra), its scarves swinging: the secret treasure of the Hokkedō, linked with the founding of Rōben’s temple, the Konshōji, in 733. Kept in a lacquered cabinet behind the altar and shown only once a year, it keeps much of its original colour and gold leaf. [[source/history-of-japanese-art|p. 92, fig. 115]]"
