description_md: |-
  The Limburg Staurotheke is a Byzantine reliquary of the True Cross, shown in the lecture closed and open, with a cross relic composed of seven particles; it is dated 968–985, measures 48 × 35 × 6 cm and is kept in the Dom- und Diözesanmuseum of Limburg an der Lahn.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 47]] It is one of the best surviving examples of Byzantine cloisonné enamel and was made in [[place/constantinople|Constantinople]].[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] It probably came to Germany as loot from the Fourth Crusade.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]]

  The reliquary ([[term/staurotheke|staurotheke]], from the Greek for "cross" and "container") consists of two parts made at different times.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The removable double-armed cross, of sycamore covered with gilded silver, gems and pearls, holds the seven fragments where the main arms meet; its inscription names the co-emperors Constantine VII and Romanos II (945–959).[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The box with its sliding lid was made later: around the cross, enamel plaques show angels in court dress and cherubim and seraphim, behind which ten compartments hold relics of the Passion, of the Virgin and of John the Baptist.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The lid shows the Deesis with archangels and apostles.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The inscription on the rim names Basil Lekapenos as donor, so the box was made between 963 and 985.[[source/wikipedia-en-limburg-staurotheke|§ Introduction]] The back of the box shows a cross framed by leaf scrolls.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 48]]

  In the lecture the staurotheke illustrated the veneration of the cross as the Christian "wood of life": pilgrims' reports from Jerusalem describe how the faithful kissed the wood of the cross in the Church of the Holy Sepulchre, and Irenaeus of Lyon contrasted the disobedience at the tree with the obedience on the wood.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 41]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 46]]
