description_md: "A five-lobed dish of [[oribe-ware]], named after the tea master [[person/furuta-oribe]], moulded rather than thrown: bamboo stalks and leaves cover two thirds, a geometric pattern of hexagons with five-petalled blossoms the rest; vines and small flowers garland the rim, and irregular flows of green glaze at three places contrast with the painted decoration. [[source/history-of-japanese-art|p. 251, fig. 285]]"
