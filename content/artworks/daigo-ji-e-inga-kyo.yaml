description_md: "A scroll of the Sutra of Cause and Effect, the life of Shaka from his youth to his first preaching, the illustrations above the text in a band of their own: the earliest surviving illustrated narrative scroll ([[emakimono]]). This part shows the Temptation of Mara — his daughters and hordes of demons around the meditating Buddha — in unshaded red, orange, green, white and black, framed by tall mountains with trees. Copied after a Chinese prototype between 749 and 756. [[source/history-of-japanese-art|p. 98, fig. 124]]"
