description_md: |-
  This intarsia portrait of the duke in the panelling of the studiolo of [[person/federico-da-montefeltro|Federico da Montefeltro]] in the [[institution/palazzo-ducale-urbino|Palazzo Ducale]] of Urbino was made by [[artist/benedetto-da-maiano|Benedetto da Maiano]] in 1474–1476 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 61]]. It is part of the wooden panelling of the [[artwork/studiolo-di-federico-da-montefeltro-urbino|studiolo]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 58]].

  In the lecture it followed [[artwork/diptych-of-federico-da-montefeltro-and-battista-sforza|Piero della Francesca's double portrait]] of Battista Sforza and Federico da Montefeltro (1465–1472) [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 59]], and it was shown beside the intarsia of the duke's [[artwork/studiolo-urbino-rustung|armour]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 62–63]]. The portrait is made of fitted pieces of wood laid flush into a flat surface, a technique in which the visibility of the wood is decisive [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]].
