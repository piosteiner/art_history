description_md: |-
  In the *Arbeiter-Illustrierte-Zeitung* 13, no. 22, 31 May 1934 [[source/adk-heartfield-mittelalter]]: a man broken on the wheel, from a medieval church, beneath the swastika. An artistic strategy of resistance [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]].

  ## Context

  [[artist/john-heartfield|John Heartfield]] made the montage in exile: after the SS broke into his Berlin flat in April 1933 he fled to Czechoslovakia, and in 1933–1934 his montages appeared in the AIZ published in Prague [[source/wikipedia-en-john-heartfield|§ Interwar period; § Selection of notable works]]. His montages on the AIZ's covers reached a weekly circulation of up to 500,000 copies, so that his work was widely seen at newsstands [[source/wikipedia-en-john-heartfield|§ Interwar period]]. The work belongs to the 240 political photomontages of 1930–1938 in which Heartfield turned Nazi symbols such as the swastika against their own propaganda [[source/wikipedia-en-john-heartfield|§ Works]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed it under the heading "Artistic strategies of resistance", beside a lithograph by [[artist/renato-guttuso|Renato Guttuso]] from the book *Gott mit Uns* (1944) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 38]]. Heartfield's anti-Nazi collages were the subject of a student presentation on 19 November 2024 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 77]].
