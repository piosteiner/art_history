    label: handed it to Nathan Katz for sale for Robert Gendebien some months before the outbreak of war (statement of 23 July 1948)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.53141.html
        note: consigned c. 1939 for Baron Robert Gendebien [1885-1954] by Eric-Emil Lyndhurst, Brussels, to (Firma D. Katz, Dieren, The Netherlands); — [5] According to his statement of 23 July 1948, "[S]ome months before the outbreak of war in 1939, [he] handed over to Mr. Nathan Katz (of the Firm D. Katz, Dieren) [the Teniers painting] belonging to Baron Robert Gendebien for sale."
        source: nga-1972-10-1
        accessed: 2026-11-24
