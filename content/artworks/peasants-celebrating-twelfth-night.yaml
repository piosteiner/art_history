    sources:
      - url: https://www.nga.gov/collection/art-object-page.53141.html
        note: Edward Ladd Betts [d. 1695], England.[1] — [1] The painting is inscribed on the reverse "E'd Ladd Betts, Esq." This is probably Edward Betts, a famous English physician, who died on 27 April 1695.
        source: nga-1972-10-1
        accessed: 2026-11-24
