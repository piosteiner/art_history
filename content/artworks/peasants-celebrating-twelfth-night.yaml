    sources:
      - url: https://www.nga.gov/collection/art-object-page.53141.html
        note: "The records of the Munich Central Collecting Point indicate that after the war the painting was recovered at Alt Ausee and restituted to the Netherlands on 15 April 1946 (Munich property card #2588/Aussee 1932"
