  - owner_label: the Netherlands (Dutch restitution authorities)
    role: custodian
    acquired: 1946-04-15
    method: restitution
    direct: true
    label: Dutch Receipt for Cultural Objects no. 10a, item no. 34; arrived in the Netherlands 28 May 1946; unclear to whom it was returned
    sources:
      - url: https://www.nga.gov/collection/art-object-page.53141.html
        note: restituted to the Netherlands on 15 April 1946 (… Dutch Receipt for Cultural Objects No. 10a, item no. 34 …). The painting arrived in the Netherlands on 28 May 1946. Although it is unclear to whom the painting was returned by the Dutch authorities, Robert Gendebien was assumed to be the rightful owner and was involved in the restitution.
        source: nga-1972-10-1
        accessed: 2026-11-24
