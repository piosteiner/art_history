description_md: |-
  The so-called Great Golden Madonna of Hildesheim is an enthroned Virgin and Child of lime wood, 56.6 cm high without its head, clad in gold sheet with remains of the original polychromy; the lecture dated it before 1022.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 16]] It is kept in the Dommuseum [[place/hildesheim|Hildesheim]] (DS 82).[[source/endemann-2020-wood-carving-and-staffering|p. 140]] With the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]] it is one of the two oldest Marian statues, both wooden figures encased in thinly hammered sheets of pure gold.[[source/endemann-2020-wood-carving-and-staffering|p. 139]]

  ## Condition

  The head and right hand of the Madonna, the head and both arms of the Child, the plinth and the back of the throne are restorations.[[source/endemann-2020-wood-carving-and-staffering|p. 140]] New heads were made by Walter Moroder in 2014.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 31]] The gold revetment has suffered various vicissitudes.[[source/forsyth-1972-the-throne-of-wisdom|p. 15]] When the sheath was removed in a restoration, photographs showed how the drapery was worked in the gold foil: the goldsmith added fine strokes "almost like those of a pen" for the fabric over Mary's knees, back and sleeves, while only the bare outlines were carved in the wood.[[source/forsyth-1972-the-throne-of-wisdom|p. 13]]

  ## A planned working process

  Endemann's investigation found an unusually well thought-out procedure.[[source/endemann-2020-wood-carving-and-staffering|p. 154]] The figure was carved, with the openwork seat of its throne and its base, from a single trunk of about 30 cm diameter, worked while still fresh, as the strong shrinkage shows.[[source/endemann-2020-wood-carving-and-staffering|p. 149]] The sculptor first carved the whole figure in a simplified form and scratched the drapery system on it with a knife; then cut away all parts that stood in the way of the gold casing, recarved them with pegs and attached them again after the foil was applied — the heads of Mary and Child, the left arm of the tunic, the Child's right arm, Mary's back and all the hands.[[source/endemann-2020-wood-carving-and-staffering|p. 154]] Not all the incised lines were carved out, so the working process can still be read (on the shins and at the elbow).[[source/endemann-2020-wood-carving-and-staffering|p. 158]] The rectangular pegs were pressed into pockets filled with white putty, and the back is a separate plate that slides into a dovetailed groove.[[source/endemann-2020-wood-carving-and-staffering|p. 159]] The box-shaped opening at the back served to contain relics, not to prevent cracks or reduce weight.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] Forsyth cited Hildesheim with the Autun Madonna for the method of hollowing a figure and closing the back with a fitted panel.[[source/forsyth-1972-the-throne-of-wisdom|p. 18]]

  ## Painting

  Although sheathed in gold, the figure already had painted zones — skin, shoes, pedestal.[[source/endemann-2020-wood-carving-and-staffering|p. 147]] Here a white ground is observed for the first time: a primer bound with glue (chalk?) over a thin sealant, applied only under the painted skin, shoes and the top of the plinth.[[source/endemann-2020-wood-carving-and-staffering|p. 173]] The fresh pink flesh tone corresponds exactly to that of the [[artwork/ringelheimer-kruzifix|Ringelheim Crucifix]] from the same region and period.[[source/endemann-2020-wood-carving-and-staffering|p. 176]] [[source/endemann-2020-wood-carving-and-staffering|p. 148]]
