description_md: |-
  The six woodblocks from which the view of Venice inscribed "Venetie MD" was printed survive in the [[institution/museo-correr|Museo Correr]] in Venice (inv. Cl. XXXIII, n. 1535) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 63]]. They are of pear wood; together they measure 132.7 × 277.5 cm at a thickness of about 1.5 cm, the single blocks 68.5 × 90.9–99.5 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 63]]. Böckem gives the exact sizes of the blocks as A 68.3 × 91 cm, B 68.3 × 99.8 cm, C 68.3 × 91.7 cm, D 68 × 90.8 cm, E 68 × 99.8 cm and F 68 × 91.2 cm, and calls their survival "a real stroke of luck" [[source/bockem-2016-jacopo-de-barbari|pp. 39–40]]. The lecture showed details of blocks E and F to make the cutting visible [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 65–67]].

  ## Material and technique

  The blocks illustrate the technique of the woodcut as described in the lecture: a relief process in which the printing lines stand as raised ridges and the non-printing parts are cut away; a drawing on paper was transferred in reverse onto the block and then cut with knives, usually by different people [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Hard fruit woods with fine, dense fibres such as pear, apple and cherry were mostly used, cut as plank wood with the grain parallel to the printing surface [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. The size of the blocks made the project exceptional: Kolb's petition of 1500 speaks of "the new art of printing forms of such size" [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 41]].

  ## Alterations and later history

  The blocks record the history of the print. For the second state of about 1514 the date in block B was removed — in one variant the gap was simply left, in another filled with a hatched wooden plug — and a repair showing the rebuilt campanile of San Marco was inserted into block E; for the third state the date and the earlier campanile were restored, more summarily, by later block cutters [[source/bockem-2016-jacopo-de-barbari|p. 47]]. In the eighteenth century the blocks belonged to Count Tassi and then passed into the collection of Teodoro Correr; Terisio Pignatti described them in 1964, and they were examined and restored in the 1990s [[source/bockem-2016-jacopo-de-barbari|p. 39]]. In 1838 further impressions were taken from the surviving blocks on the occasion of a visit of the Austrian emperor Ferdinand I [[source/bockem-2016-jacopo-de-barbari|p. 40]].

  The lecture names [[artist/jacopo-de-barbari|Jacopo de' Barbari]] as their maker [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 63]], while Böckem attributes the project to the publisher Anton Kolb and a team of artists and block cutters [[source/bockem-2016-jacopo-de-barbari|p. 58]]. For the printed view see [[artwork/barbari-veduta-di-venezia|Veduta di Venezia]].
