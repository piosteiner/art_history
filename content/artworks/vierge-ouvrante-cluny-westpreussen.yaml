description_md: |-
  A small [[term/shrine-madonna|Shrine Madonna]] from the former West Prussia, made around 1400 and now in the Musée de Cluny, Paris.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 96]] It is carved in limewood and painted and gilded over a chalk ground; it is 44.5 cm high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 96]]

  The lecture showed it after the much larger Shrine Madonna from Roggenhausen, also from West Prussia, as a second example of the type.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 92–97]] Prussian Shrine Madonnas typically show the Throne of Mercy inside, surrounded by painted men and women who shelter in the Virgin's body; when opened they show three or four hands at once, one or both still outside and two carved again inside.[[source/gertsman-2015-worlds-within|pp. 82, 89–91]] Writing on the Vierge ouvrante in the Musée de Cluny, Alain Erlande-Brandenburg applied the medieval idea of Christ's threefold birth – in eternity, in time and in the hearts of the faithful – to such statues and suggested that it fits the Prussian ones only, because there the third birth appears in the images of men and women gathered within Mary's body.[[source/gertsman-2015-worlds-within|p. 205]]
