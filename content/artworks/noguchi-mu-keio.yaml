description_md: "The first major commission in Japan of [[artist/isamu-noguchi]] (1904–1988): a visualization of the Zen concept of “nothingness”, a frequent subject of [[zenga]] — but where the Zen masters wrote the character, Noguchi created an abstract, biomorphic image of the concept itself. [[source/history-of-japanese-art|p. 361, fig. 426]]"
