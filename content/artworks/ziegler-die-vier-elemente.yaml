description_md: "*Die vier Elemente* by [[artist/adolf-ziegler|Adolf Ziegler]] (before 1937) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; photographed by Heinrich Hoffmann ([Bayerische Staatsbibliothek, Bildarchiv hoff-70484](https://bildarchiv.bsb-muenchen.de/fylr/L/d4d87cb3-76ed-4476-888c-96331ff6a113)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Academic nudes transfigured into allegories were among the subjects of the exhibitions.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]"
