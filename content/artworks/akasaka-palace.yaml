description_md: "The first Meiji building of true grandeur in Western vocabulary, by [[artist/katayama-tokuma]] (1853–1917), one of [[artist/josiah-conder]]’s first students and architect to the imperial family: often called the Japanese Versailles, with a magnificent staircase, a large state dining room, a ballroom, ceiling paintings by leading Japanese painters and gilt lamps; Japanese only in the sequence of reception rooms. Its splendour was its undoing — the emperor found it too luxurious for his son, and it was never used as an imperial residence; it housed the Diet library until the 1970s and is now the state guest house. [[source/history-of-japanese-art|pp. 346–347, fig. 403]]"
