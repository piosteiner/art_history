description_md: |-
  The choir of [[institution/santa-maria-maggiore|Santa Maria Maggiore]] in [[place/bergamo|Bergamo]] is decorated with an intarsia cycle made between 1523 and 1533 in a long and at times tense collaboration between the intarsia master [[artist/giovan-francesco-capoferri|Giovan Francesco Capoferri]], the painter [[artist/lorenzo-lotto|Lorenzo Lotto]], the Franciscan theologian Girolamo Terzi and a large team of sculptors, carvers and carpenters [[source/ajmar-2024-reciprocal-design|p. 42]]. The panel of the Creation of the World in the backrest of the choir stalls measures 44 × 45.6 cm; the lecture dates it 1524–1532 [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 12]].

  ## The Creation and the Magnum Chaos

  The stalls hold a long series of Biblical narratives, protected by covers with symbolic images, sometimes with enigmatic inscriptions, which Lotto called "imprese" [[source/ajmar-2024-reciprocal-design|p. 42]]. Lotto designed the Creation in 1523 under theological guidance; Capoferri executed it in the same year, probably to secure the commission, and another version by Capoferri, set in place in the 1530s, is the one in the stalls today [[source/ajmar-2024-reciprocal-design|p. 43]]. Its cover, the "Magnum Chaos", was designed by Lotto in chiaroscuro in 1524: God's eye, open arms and feet emerge from nine concentric spheres of a flaming sky, and its forty flames recall the forty days of Moses on Mount Sinai and of Elijah in the desert [[source/ajmar-2024-reciprocal-design|p. 43]]. It is the only cover of the cycle made of bog oak (legno nero), all the others being of the lighter walnut [[source/ajmar-2024-reciprocal-design|pp. 43–44]]. In the Creation itself, walnut, boxwood, ash, red sandalwood and pear are combined with coloured stucco; a strongly figured walnut root wood in the background renders the slow dissolving of primordial darkness, with barely perceptible monstrous eyes fading in its pattern [[source/ajmar-2024-reciprocal-design|p. 44]].

  ## Materials

  The documentation of the commission records purchases of timber from 1522 onwards: first larch and fir, then above all walnut, and occasionally oak including bog oak, maple, pear, boxwood, poplar, olive and elder; sandalwood, apple, ash and plum were probably used in small quantities [[source/ajmar-2024-reciprocal-design|p. 42]]. Regular payments for substances to dye the wood — verdigris, orpiment, white lead, saffron, indigo, oak galls, cinnabar, mercury, arsenic and other apothecary's goods — show how far colour was produced by "alchemical" manipulation, an effect hard to see today after the decay of the colourings and later restorations [[source/ajmar-2024-reciprocal-design|p. 42]].

  The lecture compared the Bergamo Creation with the [[artwork/domenico-di-niccolo-coro-palazzo-pubblico|Creation of the World]] by Domenico di Niccolò in the Palazzo Pubblico in Siena (1415–1428) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 12–14]].
