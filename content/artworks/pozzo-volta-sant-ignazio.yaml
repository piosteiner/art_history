description_md: |-
  [[artist/andrea-pozzo|Andrea Pozzo]]'s painting of the nave vault of [[institution/sant-ignazio-rome|Sant'Ignazio]] in Rome shows the spreading of the fire of faith through [[person/ignatius-of-loyola|Ignatius]]; the lecture dates it 1691–94 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 19]].

  In the lecture it closed a short survey of central perspective, from Vasari's account of Filippo Brunelleschi's demonstrations and Masaccio's Trinity in Santa Maria Novella (1425–28) to [[artwork/piero-flagellazione|Piero della Francesca's Flagellation]] (c. 1450/55) [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 11–19]]. It was followed by Vasari's report that Brunelleschi also taught perspective to the makers of intarsia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 20]].
