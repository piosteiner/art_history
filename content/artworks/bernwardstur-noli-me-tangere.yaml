description_md: |-
  The top field of the right leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the risen Christ appearing to Mary Magdalene – "Noli me tangere", "do not touch me".[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 49]] It closes the Christ cycle, which reads from the bottom of the right leaf upwards to the Resurrection.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] The lecture showed the relief in detail.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 64]]

  Opposite it, at the top of the left leaf, is the creation of the first human being; the lecture listed the two as a typological pair (in its words "creation of Eve – Noli me tangere").[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]]
