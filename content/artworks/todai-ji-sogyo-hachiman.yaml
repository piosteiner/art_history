title: Hachiman in the Guise of a Monk, Tōdaiji
creator: kaikei
created: 1201
kind: sculpture
medium: Wood with paint
materials: [wood]
dimensions: [87.5]
institution: todai-ji
description_md: Made by [[artist/kaikei]] in 1201 on commission from [[person/chogen]] for the newly rebuilt Hachiman Shrine of Tōdaiji. Chōgen had wanted to install a painting of [[hachiman]] owned by Jingoji, then in the hands of [[person/emperor-go-toba]], but Jingoji’s restorer [[person/mongaku]] won it back; Kaikei’s “second-choice” image is thought to follow that painting. The god sits cross-legged on a lotus with a monk’s staff (shakujō) with six rings; the idealized face of a divinity, the colours added in fifty days by the painter Kōen. Kaikei, adopted by Kōkei and a follower of Pure Land Buddhism under the name Anamidabutsu, gave his name to the gentle “anami” style. [[source/history-of-japanese-art|pp. 191–192, fig. 222]]
