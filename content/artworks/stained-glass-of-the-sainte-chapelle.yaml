        note: elle a été privée de ses reliques à la Révolution française […] En 1797, elle est transformée en dépôt d'archives du Palais de Justice, et l'expansion de celui-ci menace son existence même. Son sauvetage est décidé en 1836 sous la pression de l'opinion publique, et sa restauration est lancée un an plus tard et dure vingt-six ans.
