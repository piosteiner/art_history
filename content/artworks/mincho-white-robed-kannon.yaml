description_md: "A [[doshakuga]] by [[artist/mincho]]: Kannon in a white robe sits informally in her grotto and gazes out over the ocean, a beautiful, languid and feminine figure whose divinity is suggested only by crown and halo — a circle of mist through which the rock can be seen. [[source/history-of-japanese-art|pp. 217–218, fig. 253]]"
