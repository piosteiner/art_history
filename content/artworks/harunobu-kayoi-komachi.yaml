description_md: "From a series by [[artist/suzuki-harunobu]] (1725–1770), the first to produce [[nishiki-e]], modernizing the events in the life of the Heian poet Ono no Komachi: here she stands on her veranda while her maidservant counts on her fingers the nights the would-be lover has kept his promise to visit — the Nō play has him die on the hundredth. [[source/history-of-japanese-art|pp. 281–283, fig. 321]]"
