description_md: "One of the two famous Silla meditating bodhisattvas, usually identified as Maitreya, the Buddha of the future: flowing drapery, finely modelled face of supreme beauty, the naked torso set against the drapery over the seat — a pose very like that of a wooden example in Japan made under Korean influence. [[source/portal-2000|pp. 66–67, fig. 35]]"
