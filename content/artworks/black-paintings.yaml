description_md: "Fourteen paintings Goya made in 1820–23 on the walls of the Quinta del Sordo, his house across the Manzanares outside Madrid — on the ground floor and the upper floor. The Prado calls them *Pinturas de la Quinta del Sordo (Pinturas negras)*. Baron d’Erlanger had them transferred to canvas after 1873 and gave them to the Spanish State in 1881; they have been in the Prado since 1889. Their provenance is that of the house: see each painting."
