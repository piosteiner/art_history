description_md: The Werden crucifix is a cast bronze corpus from the Rhineland of about 1060, chased and engraved, with remains of its original gilding, in the treasury of the Catholic parish of St Ludgerus in Essen-Werden.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 20]] The lecture showed it directly after the wooden crucifixes from Schloss Lichtenstein and Cologne.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 19]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 20]] Of the twenty-seven crucifixes preserved from the ninth to the eleventh century, twenty-one are carved and six hammered or cast in metal.[[source/endemann-2020-wood-carving-and-staffering|pp. 137–138]]
