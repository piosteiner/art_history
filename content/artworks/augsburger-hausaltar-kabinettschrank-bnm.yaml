description_md: |-
  This house-altar cabinet was made about 1600 by Augsburg cabinetmakers, goldsmiths and painters [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 53]]. Its carcass is of walnut, veneered with ebony, with silver, bronze and paintings in oil on copper; it is in the [[institution/bayerisches-nationalmuseum|Bayerisches Nationalmuseum]] in Munich [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 53]]. The lecture showed it closed and opened [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 53–54]].

  It belongs to the lecture's section on ebony — a hard, heavy, dark brown to black heartwood from trees of the genus Diospyros of Sri Lanka and southern India, with related species in Madagascar and Cameroon — as the "wrapping" of European luxury furniture [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 15, 46]].
