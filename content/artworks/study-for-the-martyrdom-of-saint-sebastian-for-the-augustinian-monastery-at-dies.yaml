        note: (Sale, Schloss Schleißheim, Augsburg, April 13-23, 1852, lot 16, sold to “Eberle”) … Possibly Robert Eberle [1815-1860], Munich, probably by descent to a Vienna collector [1852-1860] — “Eberle,” the name listed as the buyer in the inventory of the 1852 sale, may be Robert Eberle, a painter living in Munich.
        source: cma-1946-277
        accessed: 2026-11-24
