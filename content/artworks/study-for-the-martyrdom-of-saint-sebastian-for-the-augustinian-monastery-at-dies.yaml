        note: “Minor collector,” Vienna, probably sold or consigned to Galerie Fröhlich [1921-1928?] — Fröhlich’s letter to Seligmann says that the Tiepolo was acquired in 1921 by a “minor collector and distrustful odd, old man.”
        source: cma-1946-277
        accessed: 2026-11-24
  - owner_label: Swiss dealer (unnamed)
