    not_sold: true
    acquired: 1804
    method: auction
    place: munich
    label: after the secularization of the monasteries (Diessen among them); depot in the Theatine monastery; sale, Munich, 1804, lot 1084 (handwritten list only), unsold
    sources:
      - url: https://clevelandart.org/art/1946.277
        note: Sale, Munich, 1804, unsold and then transferred to the Zentralgemäldegalerie — After the secularization of the monasteries, including the one at Diessen, many works were transferred immediately to the Zentralgemäldegalerie …, while others first went to the Conservatorium der aufgehobenen Klöster, a depot in the Theatiner monastery (today, Odeonsplatz). From there they were auctioned off, and if they failed to sell, as was the case with the Tiepolo (lot 1084), they were given to the Zentralgemäldegalerie
        source: cma-1946-277
        accessed: 2026-11-24
  - owner: institution/bavarian-state-painting-collections
    acquired: 1804-08-20
    method: transfer
    direct: true
    place: munich
    label: as the Zentralgemäldegalerie; at Schleißheim, no. 2186 of the Zweibrücker Nachtragsinventar, no. 4150 in 1822; deaccessioned and sold at auction 1852
    sources:
      - url: https://clevelandart.org/art/1946.277
        note: Bayerischen Staatsgemäldesammlungen, Munich, deaccessioned and sold at auction [1804-1852] — the Tiepolo was transferred there on August 20, 1804 … transported to Schleißheim castle … the Tiepolo was entered as No. 2186 in the "Zweibrücker Nachtragsinventar" … In the new inventory of 1822, the “St. Sebastian” and “St. Stephen” were listed as Nos. 4150 and 4151
        source: cma-1946-277
        accessed: 2026-11-24
