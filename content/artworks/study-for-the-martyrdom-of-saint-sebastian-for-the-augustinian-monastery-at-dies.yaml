        note: Collector, Vienna, sold to a “minor collector” [Late 19th century -1921] — According to Fröhlich's letter to Seligmann of Oct. 27, 1928, the Viennese collector was a “well-positioned official” (“hoheren Beamten”) who sold the painting to a “minor collector” (“kleiner Sammler”) in 1921.
        source: cma-1946-277
        accessed: 2026-11-24
