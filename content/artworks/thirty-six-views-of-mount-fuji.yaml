description_md: "Hokusai’s series of landscape prints with Mount Fuji, seen from near and far, in all seasons and weathers — published by Nishimuraya Yohachi (Eijudō) in Edo around 1830–1832. Its success led to ten more prints beyond the thirty-six of the title: forty-six in all. The prints, among them [[artwork/the-great-wave-off-kanagawa|The Great Wave off Kanagawa]], made the landscape a subject of its own in ukiyo-e, and the Prussian blue newly imported to Japan gave many of them their colour."
