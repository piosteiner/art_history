description_md: |-
  Hokusai’s series of landscape prints with Mount Fuji, seen from near and far, in all seasons and weathers — published by Nishimuraya Yohachi (Eijudō) in Edo around 1830–1832[[source/wikipedia-en-thirty-six-views-of-mount-fuji|“a series of landscape prints by the Japanese ukiyo-e artist Hokusai” · “1830 to 1832, when Hokusai was in his seventies …, and published by Nishimura Yohachi”]]. Its success led to ten more prints beyond the thirty-six of the title: forty-six in all[[source/wikipedia-en-thirty-six-views-of-mount-fuji|“The immediate success of the publication led to another ten prints being added to the series.” · “publication stopped at forty-six”]]. The prints, among them [[artwork/the-great-wave-off-kanagawa|The Great Wave off Kanagawa]], made the landscape a subject of its own in ukiyo-e[[source/wikipedia-en-hokusai|“Hokusai was instrumental in developing ukiyo-e from a style of portraiture largely focused on courtesans and actors into a much broader style of art that focused on landscapes, plants, and animals”]], and the Prussian blue newly imported to Japan gave many of them their colour[[source/wikipedia-en-thirty-six-views-of-mount-fuji|“Prussian blue pigment had not long before been introduced to Japan from Europe and Hokusai used it extensively”]][[source/met-under-the-wave-off-kanagawa-jp1847|“The artist became famous for his landscapes created using a palette of indigo and imported Prussian blue”]].

  # Exhibitions
  Die [Dulwich Picture Gallery](https://www.dulwichpicturegallery.org.uk/whats-on/hokusai-thirty-six-views-of-mt-fuji-from-the-iuchi-collection/) zeigte bis Januar 2027 die [[artwork/thirty-six-views-of-mount-fuji]]. ([the Guardian Artikel zur Ausstellung](https://www.theguardian.com/artanddesign/2026/oct/19/hokusai-thirty-six-views-of-mount-fuji-review-dulwich-picture-gallery?shem=dsdf,sharefoc,agadiscoversdl,,sh/x/discover/m1/4)) Die 46 ausgestellten Holzschnittdrucke an der Ausstellung sind jedoch nicht online zugänglich.
