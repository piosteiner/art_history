description_md: |-
  A small group of the Visitation – [[person/mary|Mary]] greeting her cousin Elizabeth, both pregnant – carved by [[artist/master-heinrich-of-constance|Master Heinrich of Constance]] around 1310–20.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 99]] It is now in the Metropolitan Museum of Art, New York, a gift of J. Pierpont Morgan in 1917.[[source/metropolitan-museum-collection|object 464596]]

  The group is carved in walnut, painted and gilded, and set with rock-crystal cabochons in gilded-silver mounts; it measures 59.1 × 30.2 × 18.4 cm.[[source/metropolitan-museum-collection|object 464596]][[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 99]] Visitation scenes were the commonest setting for late medieval images in which the Virgin's body becomes transparent and shows Christ inside.[[source/gertsman-2015-worlds-within|p. 59]]

  The lecture placed it in a sequence on images that open the body to the gaze: it was followed by the stone Visitation from Passau, whose clay embryos sit in hollows in the women's bellies, and by Henry Suso's vision of seeing his own body "clear as a crystal" above his heart, with Eternal Wisdom inside.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 99–101]]
