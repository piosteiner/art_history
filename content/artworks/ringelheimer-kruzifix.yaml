description_md: |-
  The Ringelheim Crucifix is a monumental corpus of lime wood made in [[place/hildesheim|Hildesheim]] in the early eleventh century.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 17]] It is in the Dommuseum Hildesheim as a permanent loan (L 1993-8) from the church of Sts Abdon and Sennen in Salzgitter-Ringelheim.[[source/endemann-2020-wood-carving-and-staffering|p. 144]] The lecture gave its height as 162 cm; Endemann dates it before 1022 and gives 182 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 17]] [[source/endemann-2020-wood-carving-and-staffering|p. 163]]

  ## Carving

  The crucifix uses the whole volume of a lime trunk almost 50 cm in diameter.[[source/endemann-2020-wood-carving-and-staffering|p. 149]] The sculptor chose a tree with an asymmetrical fork in order to place the head, bowed to the right, in the widening of the trunk.[[source/endemann-2020-wood-carving-and-staffering|p. 150]] He did not know that the fork of a lime starts deeper than it appears, with both branches under one bark; when he noticed it during carving, he secured the endangered head with long iron nails to the stronger branch and accepted stripes of bark about 3 cm wide on both sides of the neck, which the paint would cover.[[source/endemann-2020-wood-carving-and-staffering|pp. 150–151]] The figure is the first with a deep box-shaped cavity divided by a ridge; below the belt it opens downwards, so that one can look up through the open loincloth.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] The carver used only paring chisels 8.5–30.5 mm wide for the base form and a broader chisel for the hollowing and for the peg holes in the shoulders.[[source/endemann-2020-wood-carving-and-staffering|p. 166]] The face (on its right side) still shows the original surface, compacted by scraping and burnishing like ivory; Endemann suspected a carver experienced in ivory work.[[source/endemann-2020-wood-carving-and-staffering|pp. 171–172]] With Gerresheim and the Frankfurt crucifix it is one of the few figures of the time with the classical proportion of 1:7.[[source/endemann-2020-wood-carving-and-staffering|p. 158]]

  ## Relics

  A 3 cm hole in the back of the head lies exactly on the figure's axis and served to fix it on the workbench; in the crucifix relics were found with the famous handwritten seal of Bishop [[person/bernward-of-hildesheim|Bernward]].[[source/endemann-2020-wood-carving-and-staffering|p. 156]] Bruno Reudenbach, quoted in the lecture, cited it as the counter-example to the [[artwork/gero-cross|Gero Cross]]: this crucifix had a relic sepulchre, the Gero Cross did not.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 59]]

  ## Colour and later history

  A UV-Vis analysis showed that the dark layer on the wood is neither pigment nor protein binder nor resin, probably an oil, perhaps pitch.[[source/endemann-2020-wood-carving-and-staffering|p. 173]] On it lies a very finely pigmented pink flesh tone, preserved behind the ear, which corresponds exactly to the flesh of the [[artwork/grosse-goldene-madonna-hildesheim|Great Golden Madonna]].[[source/endemann-2020-wood-carving-and-staffering|p. 176]] The loincloth was luminous lapis-lazuli blue outside and bright minium red inside.[[source/endemann-2020-wood-carving-and-staffering|p. 177]] After a heavy loss in the second half of the twelfth century the figure was recarved, largely keeping the original colours.[[source/endemann-2020-wood-carving-and-staffering|p. 175]]
