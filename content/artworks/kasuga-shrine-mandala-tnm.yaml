description_md: "A bird’s-eye view of the Kasuga Shrine at Nara, the Fujiwara family’s shrine on the slopes of Mount Mikasa: the four small aligned halls of the kami, raised on piles with gabled roofs extending over the stairs, within corridors and cloister walls like a Buddhist temple, among cherry trees, with the torii at the bottom. Date unknown. [[source/history-of-japanese-art|pp. 163–164, fig. 198]]"
