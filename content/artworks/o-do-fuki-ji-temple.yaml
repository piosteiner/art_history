        note: 富貴寺は寺伝によれば仁聞の開基になり、養老二年（七一八）の建立というが、現本堂は平安時代後期の手法を示している。 … 文和二年（一三五三）の墨書を有する旧棟木が残っている … 九州地方における最古の遺構である。 所有者名 ： 富貴寺
        source: kunishitei-102-3597
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/wiki/%E5%AF%8C%E8%B2%B4%E5%AF%BA
        note: 宇佐神宮大宮司の到津（いとうづ）家に伝わる貞応2年（1223年）作成の古文書のなかに「蕗浦阿弥陀寺（富貴寺のこと）は当家歴代の祈願所である」旨の記載があり、12世紀前半 - 中頃、宇佐八幡大宮司家によって創建されたものと推定されている。
        source: wikipedia-ja-fuki-ji
        accessed: 2026-11-24
