    label: main (Amida) hall, late Heian; by temple tradition founded by Ninmon in 718; probably founded in the 12th century by the chief-priest family of Usa Hachiman as its prayer temple; old ridge beam inscribed 1353; the oldest surviving building in Kyushu; owner today
