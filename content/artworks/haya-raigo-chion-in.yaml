description_md: "The classic [[haya-raigo]]: from the upper left a diagonal of white clouds carries a golden Amida and his host down to a monk seated at a low table with sutra rolls of indigo paper, Kannon kneeling towards him. Mountains with pines and flowering cherries fill the lower left; in the upper right a tiny building like the Byōdōin suggests Amida’s palace. [[source/history-of-japanese-art|p. 209, fig. 241]]"
