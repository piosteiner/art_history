  ## The work and its painter

  *Water Bearer* (1981), in oil paint and pastel on canvas, is by [[artist/sandro-chia|Sandro Chia]] and belongs to the [[institution/tate-gallery|Tate]] [[source/tate-t03469]]. Chia painted it in the year he spent between a study grant in Mönchengladbach (winter 1980–81) and his move to New York [[source/wikipedia-en-sandro-chia|§ Life]]. Since the mid-1970s he had turned from Conceptualism to figuration, and in 1979 the critic Achille Bonito Oliva grouped him with Francesco Clemente, Enzo Cucchi, Nicola De Maria and Mimmo Paladino as the Transavanguardia [[source/wikipedia-en-sandro-chia|§ Work]] — the Italian form of [[movement/neo-expressionism|neo-expressionism]], which revived painting, figuration and mythic imagery against Conceptual art [[source/wikipedia-en-transavantgarde|§ Introduction]].

  ## In the seminar

  The seminar opened with *Water Bearer* and Georg Baselitz's *Adieu* (1982) — two figurative paintings of the early 1980s — and then turned to the exhibition *1930s. Art and Culture in Italy* held at the Palazzo Reale in Milan in 1982 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 11–12]]. The seminar justified its subject with Pierangelo Schiera: while studying the avant-garde that flourished between the two World Wars, "we also need to look forward to today's avant-gardes, in order to decrypt their stances and messages that may help us in the preservation of our values" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 8]].
