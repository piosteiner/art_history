description_md: "A saddle of black lacquer inlaid with mother-of-pearl: sprays of bush clover and spider webs, motifs of poetry and the seasons, cover the surface without crowding it. Probably made for a ceremonial procession in the capital and never used outside it; Mason sets its elegant, balanced Japanese taste against the dense Chinese-derived pattern of the Chūsonji altar table. [[source/history-of-japanese-art|p. 107, fig. 132]]"
