title: Miroku Butsu, Hokuendō, Kōfukuji
names: [興福寺北円堂弥勒仏坐像]
creator: unkei
created: 1212
kind: sculpture
medium: Wood with paint and gold leaf, inlaid eyes
materials: [katsura wood, gold leaf, rock crystal]
dimensions: [141.9]
institution: kofuku-ji
description_md: "The altar’s central image, originally with two bodhisattvas, the Shitennō and two rakan. Compared with Jōchō’s Amida, the torso rises higher above the spread of the legs, yet the figure is not top-heavy; face and drapery are carved more deeply, the crystal eyes look down with a melancholy expression. [[yosegi-zukuri]] in [[katsura-wood]]: an approachable, almost human Buddha. [[source/history-of-japanese-art|pp. 189–190, fig. 219]]"
