institution: kiyoshi-kojin-seichoji
description_md: "From a pair painted in his eighties by [[artist/tomioka-tessai]] (1837–1924), the most famous bunjinga master of the Meiji period, trained as a Shinto priest and encouraged by the nun-poet Otagaki Rengetsu: Su Dongpo, born on the same day as Tessai, on his second, late-autumn visit — patches of colour over strong strokes of dark ink, a vivacity rare in earlier masters. [[source/history-of-japanese-art|pp. 361–362, fig. 427]]"
