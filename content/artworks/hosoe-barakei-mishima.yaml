description_md: "From the series [[artist/eiko-hosoe]] (b. 1933) made of [[person/yukio-mishima]] at his Tokyo home in 1961 and 1962, after his collaboration with the dancer [[person/tatsumi-hijikata]]: composite, theatrical images combining hysterical sensuality with morbid sobriety — later read as a rehearsal for Mishima’s death in 1970. [[source/history-of-japanese-art|pp. 387–388, fig. 463]]"
