description_md: |-
  A book of hours — a devotional book of prayers to be said at the canonical hours — made for John, Duke of Berry, brother of King Charles V of France, by the [[artist/limbourg-brothers|Limbourg brothers]] Paul, Johan and Herman between about 1412 and 1416; it is now MS 65 in the [[institution/musee-conde|Musée Condé]], Chantilly.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction]] Its 206 leaves of very fine parchment, about 30 × 21.5 cm, contain 66 large and 65 small miniatures, painted with rare and costly pigments and gold; it is one of the most lavish illuminated manuscripts of the late Middle Ages and belongs to the late phase of the International Gothic.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction]]

  ## History

  When the Limbourg brothers and the duke died in 1416, possibly of plague, the manuscript was unfinished.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction; § Provenance]] It was continued in the 1440s by an anonymous painter whom many identify with [[artist/barthelemy-d-eyck|Barthélemy d'Eyck]], and completed in 1485–1489 by [[artist/jean-colombe|Jean Colombe]] for Duke Charles I of Savoy.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction; § Provenance]] The name comes from the inventory of the duke's estate of 1416, which described the unbound gatherings as "très riches heures" to tell them apart from his fifteen other books of hours.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|§ Duke of Berry]] The Duke of Aumale bought it in 1856 and placed it in his library at Chantilly, which he bequeathed to the Institut de France as the Musée Condé.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|§ Provenance]] Since the 1980s the original has been withdrawn from display and replaced by a facsimile; its fame rests largely on reproductions, above all of the calendar pictures.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction; § Recent history]]

  ## The calendar and the forest

  The calendar miniatures show peasants at agricultural work and aristocrats in formal dress before buildings of the period.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|introduction]] The lecture "Aus dem Wald" used two of them to show how intensively pre-modern people used the forest.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 47]] The February picture with its calendar page (fol. 2v–3r, about 1412–1416) stands for the use of branches, twigs and leaves as fuel and fertiliser;[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 47]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 48]] the December picture with a hunting scene (fol. 12v, 1414–1418) for the forest as a hunting ground for bears, wild boar and deer.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 51]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 53]] Who painted these months is debated: Cazelles and Rathofer give both to Paul de Limbourg, while Pognon assigns February to a "rustic painter" and December to the "Master of the Shadows", the later intermediate painter.[[source/wikipedia-en-tres-riches-heures-du-duc-de-berry|§ Attribution of the calendar miniatures]]
