description_md: "One of the many feline subjects of [[artist/asakura-fumio]] (1883–1964), the outstanding sculptor of the early twentieth century and an influential teacher: a cat held by the scruff of its neck dangles in midair, its discomfort and frustration as palpable as its sleek, muscular body. [[source/history-of-japanese-art|p. 357, fig. 420]]"
