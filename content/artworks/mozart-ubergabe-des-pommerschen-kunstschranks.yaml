description_md: |-
  [[artist/anton-mozart|Anton Mozart]]'s painting of the handing over of the [[artwork/pommerscher-kunstschrank|Pomeranian Kunstschrank]] to Duke Philipp II of Pomerania is dated 1617, painted in oil on wood and measures 39.4 × 45.4 cm; it is in the [[institution/kunstgewerbemuseum-berlin|Kunstgewerbemuseum]] in Berlin [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 32]]. It shows Philipp Hainhofer presenting the writing cabinet to the ducal couple and their court, together with the artists and craftsmen who made it; the painting could be pulled out of the cabinet itself [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]].

  The duke took possession of the cabinet on 2 September 1617, after it had arrived dismantled in Stettin at the end of August and had been reassembled by the cabinetmaker [[artist/ulrich-baumgartner|Ulrich Baumgartner]] [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. Between 24 and 28 people were involved in making it [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The lecture examined the painting in a series of details [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 32–37]] before turning to the cabinet, whose case was lost in the war, and its surviving contents [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 38–43]].
