description_md: "A pair of [[rakuchu-rakugai]] screens painted while the Tokugawa were attacking Osaka Castle, perhaps for a wealthy townsman rather than a daimyo: Kyoto as Hideyoshi had rebuilt it, seen from a much lower altitude than the Rekihaku screens, streets crowded with people. The first panels of the right screen show Hōkōji with Hideyoshi’s Great Buddha and, above, his mausoleum; the left screen ends in the Tokugawa’s Nijō Castle — the old regime and the new side by side, with the portable shrines of the Gion festival between them. [[source/history-of-japanese-art|pp. 245–247, fig. 281]]"
