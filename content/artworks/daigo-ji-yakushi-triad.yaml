dimensions: [176.5]
dimensions_note: Yakushi
institution: daigo-ji
description_md: "The only work surviving from the original Kami (Upper) Daigoji, the mountain temple founded by [[person/shobo]] and supported by [[person/emperor-daigo]]: the healing Buddha seated on a tall lotus base, flanked by the much shorter bodhisattvas Nikkō and Gakkō. Begun around 907 and completed by 913, it is a benchmark of early tenth-century sculpture: a large figure of calm power whose spread knees give a solid base. Carved mainly in [[ichiboku-zukuri]] with more added blocks than before, hollowed from the back, lacquered and gilded. The hall that houses it dates from 1121. [[source/history-of-japanese-art|pp. 137–138, fig. 166]]"
