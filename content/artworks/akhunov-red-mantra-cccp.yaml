  *Red Mantra CCCP* (1978–1988), pen on print, by [[artist/vyacheslav-akhunov|Vyacheslav Akhunov]], was one of two works in the seminar for contemporary perspectives on the Soviet legacy, beside [[artwork/once-in-the-xx-century]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 40]].

  ## Context

  Akhunov began with conventional landscapes, workers and propaganda posters and turned to conceptual art after coming into contact with the Moscow Conceptualists; his later work satirises Soviet slogans and propaganda in text and image [[source/wikipedia-en-vyacheslav-akhunov|§ Artistic works and exhibitions]]. He has spoken of having been silenced in the Soviet years [[source/wikipedia-en-vyacheslav-akhunov|§ Biography]]. The Soviet visual world that such work answers was, in Groys's account, saturated with art: posters, monuments, frescoes and mosaics everywhere, reproducing the same images until the eye no longer registered art as such [[source/groys-1994|p. 158]] [[source/groys-1994|p. 160]].
