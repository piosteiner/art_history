description_md: |-
  The Gerresheim Crucifix is an oak corpus from the Rhineland made before 1000, 192 cm high, with remains of the original polychromy, in the parish church of St Margaret in Düsseldorf-Gerresheim.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 18]] Klaus Endemann lists it as Lower Rhenish, 980, and notes that recent literature dates it anywhere from 960–80 to 1050.[[source/endemann-2020-wood-carving-and-staffering|pp. 147, 141]]

  The figure was not originally hollowed out (Endemann: c. 970/980, oak, 210 cm).[[source/endemann-2020-wood-carving-and-staffering|p. 163]] Its head shows one of the holes that may have served to clamp the figure on the workbench.[[source/endemann-2020-wood-carving-and-staffering|p. 156]] With the [[artwork/ringelheimer-kruzifix|Ringelheim]] and Frankfurt crucifixes it is one of the few figures of the time to reach the classical proportion of 1:7.[[source/endemann-2020-wood-carving-and-staffering|p. 158]] The long concave grooves of the loincloth were probably cut as V-notches and burnished, although later revisions make this uncertain.[[source/endemann-2020-wood-carving-and-staffering|p. 167]] The lowest paint layers were read inconclusively: in one place a "thinly applied, bright pink" directly on the wood, elsewhere a white layer of white lead and calcium carbonate; a protein in the preparation is not ruled out.[[source/endemann-2020-wood-carving-and-staffering|pp. 172–173]] The lecture showed it together with the [[artwork/aschaffenburger-kruzifix|Aschaffenburg Crucifix]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 18]]
