provenance:
  - owner: person/richard-semmel
    acquired: 1933-06-13 or earlier
    ended: 1937-03-20
    notes_md: A German-Jewish textile manufacturer in Berlin; persecuted for his origins and his politics, he fled to the Netherlands in April 1933 with his wife Clara and had much of his collection auctioned in Amsterdam (June and November 1933) to live and to pay discriminatory levies. This painting found no buyer there. Fled again in 1940, via Chile to New York, where he died in 1950.
    sources:
      - url: https://collection.kunsthaus.ch/de/collection/item/512961/
        note: "Footnote: Wildenstein 2001, Bd. I, No. 127, S. 146; Auktion Frederik Muller & Cie. (13.06.1933), Lot 15; Das Wildenstein-Werkverzeichnis nennt als möglichen Vorbesitzer des Gemäldes Eduard Simon-Wolfskehl, Frankfurt (M.). Diese Angabe basiert auf einer fehlerhaften Interpretation von Peter Kropmanns (Kat. Museum Würth 1997, No. 160, S. 52, 67), und einer ebenso fehlerhaften Identifizierung des Gemäldes mit …"
        source: kunsthaus-zurich-sammlung-online
        accessed: 2026-10-15
