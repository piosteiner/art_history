description_md: "The most famous painting of [[artist/shigeru-aoki]] (1882–1911), of the Romantic movement that reinterpreted Japan’s myths: the hunter who lost his brother’s fishhook sits in a tree in the garden of the sea god’s palace, falling in love with the princess on the left. Poorly received at the Tokyo Industrial Exposition; Aoki died of tuberculosis at twenty-nine. Mason gives its owner as the [[institution/ishibashi-museum-of-art]] in Kurume, whose collection has since moved to the Artizon Museum in Tokyo. [[source/history-of-japanese-art|pp. 375–376, fig. 447]]"
