description_md: "The storehouse of Tōdaiji built for the treasures Empress Kōmyō gave to the temple after the death of Emperor Shōmu in 756. Three units joined together, in the [[azekura]] style: walls of triangular logs that interlock at the corners, the whole raised more than two metres off the ground on round posts. In use by 761; since 1953 the collection is kept in concrete storehouses, and shown each autumn at the Nara National Museum. [[source/history-of-japanese-art|p. 48, fig. 50]]"
