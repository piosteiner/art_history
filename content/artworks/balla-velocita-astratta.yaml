description_md: |-
  Balla's Futurist abstraction, which the seminar set against his later [[artwork/balla-marcia-su-roma]]: modernism and totalitarian art [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. Balla painted several works of this title in 1913; which one the slide shows is open.

  ## The speed paintings

  [[artist/giacomo-balla|Giacomo Balla]] painted a series of studies of speed symbolised by the automobile; the best known, *Abstract Speed + Sound* (1913–14), may originally have been part of a triptych [[source/wikipedia-en-giacomo-balla|§ Notable works]]. Balla later said that after some twenty pictures on the velocity of cars he understood that "the single plane of the canvas did not permit the suggestion of the dynamic volume of speed in depth", and in 1915 he moved on to abstract three-dimensional "reconstructions" [[source/wikipedia-en-futurism|§ Italian Futurism]] — the programme of the manifesto [[literature/ricostruzione-futurista-dell-universo|*Ricostruzione futurista dell'universo*]] that he wrote with Fortunato Depero [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]]. The speed paintings belong to the [[movement/futurism|Futurist]] celebration of the machine, which Monica Cioli calls a pillar of the movement and a "transversal myth" of the avant-gardes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 52]].

  ## Abstraction and the regime

  In the 1930s Balla renounced Futurism and abstraction and returned to a naturalistic style [[source/wikipedia-en-giacomo-balla|§ Biography]]; the seminar's pairing of an abstract speed painting with *Marcia su Roma* (1931–32) asks how modernism related to totalitarian art [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]].
