        note: secondo le più recenti ma non risolutive ipotesi, nel 1628 il dipinto fu venduto a Carlo I di Inghilterra insieme ai pezzi più prestigiosi della quadreria gonzaghesca; dalla collezione reale sarebbe poi passato al mercato antiquario e alla raccolta del cardinale Mazarin, dispersa la quale sparì per più di un secolo.
