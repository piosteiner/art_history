provenance:
  - owner: person/agnolo-doni
    acquired: 1505/1507
    method: commission
    place: florence
    label: painted for the Florentine merchant, perhaps for his marriage to Maddalena Strozzi (1504) or the birth of their daughter Maria (1507)
    price:
      amount: 140
      currency: DUC
      note: "Vasari: Doni offered 40 instead of the 70 asked, and had to pay double"
    sources:
      - url: https://www.uffizi.it/en/artworks/holy-family-known-as-the-doni-tondo
        note: Michelangelo painted this Holy Family for a Florentine merchant, Agnolo Doni, whose prestigious marriage to Maddalena Strozzi in 1504 took place in a period that was crucial for early 16th-century Florentine art.
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Tondo_Doni
        note: alla richiesta di settanta ducati come pagamento, il Doni […] offrendone invece solo quaranta. Michelangelo allora fece riportare indietro il dipinto e acconsentì a recapitarlo solo al prezzo raddoppiato di centoquaranta ducati.
        source: wikipedia-it-tondo-doni
        accessed: 2026-10-20
  - owner_label: the Doni family
    ended: 1591 or later
    method: inheritance
    place: florence
    label: still in the Doni house in Via San Niccolò in 1591 (Bocchi)
    sources:
      - url: https://it.wikipedia.org/wiki/Tondo_Doni
        note: Nel 1591, Bocchi ricorda l'opera ancora in casa Doni in via San Niccolò
        source: wikipedia-it-tondo-doni
        accessed: 2026-10-20
  - owner: institution/uffizi-gallery
    acquired: before 1677
    place: florence
    label: in the Tribune of the Uffizi by 1677 — in the grand-ducal collections
    sources:
      - url: https://it.wikipedia.org/wiki/Tondo_Doni
        note: mentre nel 1677 risulta già collocata nella Tribuna degli Uffizi, quindi tra le collezioni granducali.
        source: wikipedia-it-tondo-doni
        accessed: 2026-10-20
