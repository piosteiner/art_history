description_md: "[[artist/kawanabe-kyosai|Kawanabe Kyōsai]]'s hanging scroll of about 1876 shows a painting and calligraphy gathering at the Nakamurarō restaurant in Ryōgoku [[source/met-2023-583-34|2023.583.34]]. It is painted in ink and colour on paper, 138.5 × 64.5 cm, and came to the Metropolitan Museum in 2023 with the Mary and Cheney Cowles Collection [[source/met-2023-583-34|2023.583.34]]."
