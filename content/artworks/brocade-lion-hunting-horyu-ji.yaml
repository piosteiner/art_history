description_md: A silk brocade with medallions of archers on winged horses hunting lions — a Persian subject going back to the Achaemenid dynasty. Mason’s caption calls it Chinese; his text, almost certainly made in Persia and carried across the Silk Roads. Records of the Kamakura period say it belonged to [[person/prince-shotoku]]. [[source/history-of-japanese-art|p. 52, fig. 56]]
