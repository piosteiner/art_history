description_md: "Two paintings by [[artist/suzuki-kiitsu]] (1796–1858), Hōitsu’s follower, originally on the front and back of a single two-panel screen: white camellias outlined in pale grey under an arch of deep green on gold, and autumn grasses in grey ink on a silver ground now tarnished to a rich greyish brown, softened by a sinuous line of mist — a step beyond his master towards a boldly abstract depiction of nature. [[source/history-of-japanese-art|pp. 317–318, fig. 369]]"
