description_md: |-
  The cycle of the months in the Sala dei mesi of the Torre Aquila in [[place/trento-2|Trento]], painted before 1407 in fresco and tempera, with remains of gold leaf and *pastiglia* (raised gesso decoration).[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 67]] The Torre Aquila, the Eagle Tower, stands at the southern end of the [[institution/buonconsiglio-castle|Castello del Buonconsiglio]], the seat of the prince-bishops of Trento, which Bishop George of Liechtenstein had first enlarged into a residence in the late 14th century.[[source/wikipedia-en-buonconsiglio-castle|§ History]] The English Wikipedia attributes the frescoes to [[artist/maestro-venceslao|Master Wenceslas]] (Mistr Václav) from Bohemia and calls them one of the most noteworthy examples of International Gothic painting in Europe, valued for their accurate portrayal of the landscape, economic activities, customs and fashions of medieval Trentino.[[source/wikipedia-en-buonconsiglio-castle|§ Interior]] The German Wikipedia is more cautious: no artist's name can be securely linked with them; whether the Wenzel named as the bishop's court painter in 1397 took part, and whether he was Bohemian, can only be surmised, though it is agreed that the painter came from the north.[[source/wikipedia-de-zyklus-der-monate|§ Geschichte]]

  ## History

  The Torre Aquila was originally one of the four gates in Trento's 13th-century town wall.[[source/wikipedia-de-zyklus-der-monate|§ Geschichte]] Prince-Bishop George of Liechtenstein (1390–1419) had it converted for private use at the end of the 14th century, raised and decorated with paintings, of which only the months in the central room survive; the painter was probably inspired by the miniatures of a *Tacuinum sanitatis* manuscript owned by the bishop.[[source/wikipedia-de-zyklus-der-monate|§ Geschichte]] After the town's uprising of 1407 the bishop was expelled and the gate returned to the town's control.[[source/wikipedia-de-zyklus-der-monate|§ Geschichte]] Twelve fields, separated by painted columns, open "views" onto a continuous mountain landscape that changes with the seasons; only March is lost, destroyed by fire.[[source/wikipedia-de-zyklus-der-monate|§ Darstellungen]] They show the work of the peasants in each month — farming, herding, viticulture — mostly in the background, and above all the seasonal pleasures of the nobility, such as falconry, tournaments and a snowball fight; the colourful clothes of the nobles are set against the plainer, practical dress of the working people.[[source/wikipedia-de-zyklus-der-monate|§ Darstellungen]]

  ## The months on the west wall

  The lecture "Aus dem Wald" showed several months from the west wall as images of the pre-modern forest as a natural space intensively used and shaped by people.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 38]] November and December show hunting and woodcutting, illustrating the forest as a supplier of timber for building, crafts and fuel.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 42]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 43]] The summer months with haymaking and the grain harvest were set beside them.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 44]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 45]] The November–December scene was first shown in the second session, after the [[artwork/holzfaller-bei-der-arbeit-grenier|tapestry of woodcutters]] from the workshop of Pasquier Grenier, in the section on human use of nature.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 62]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 66]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 67]]

  ## Forest work in the Middle Ages

  The lecture lists the uses of the forest: timber for building, crafts and fuel; branches, twigs and leaves as fuel and fertiliser; pasture for pigs, goats, sheep and cows; and hunting ground for bears, wild boar and deer.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 51]] Different uses produced different kinds of forest: selection forest (*Plenterwald*), where single trees are felled instead of whole stands; coppice (*Niederwald*), whose stumps sprout again and are harvested at short intervals; and wood pasture (*Hudewald*), with little undergrowth and a browse line low on the trees.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 55]] The forest historian Hansjörg Küster describes how in permanently used woods trees that resprout from the stump, such as oak and hornbeam, were favoured, and how forests were pushed back far in many places in the Middle Ages and the early modern period.[[source/fansa-vorlauf-2007-holz-kultur|pp. 30–31]]
