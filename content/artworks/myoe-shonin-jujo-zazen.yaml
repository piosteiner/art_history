description_md: "[[person/myoe]] (1173–1232), who refounded Kōzanji for the Kegon school, sits in meditation in the fork of a twin-trunked tree among scraggy pines, his rosary and an incense burner hanging on the branches. The composition follows Chinese rakan paintings and is almost naive; ink lines with thin washes of colour, except for the finely drawn face — a painting that prefigures the [[movement/nanga]] school. Traditionally attributed to [[artist/enichibo-jonin]], a monk of Kōzanji. [[source/history-of-japanese-art|pp. 196–197, fig. 228]]"
