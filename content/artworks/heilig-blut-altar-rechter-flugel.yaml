description_md: |-
  The right wing of the Holy Blood altarpiece in St. Jakob, Rothenburg ob der Tauber: a limewood relief of Christ praying on the Mount of Olives by [[artist/tilman-riemenschneider|Tilman Riemenschneider]], carved in 1501–1505 and left unpainted.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82, 85]]

  It closes the three-part Passion sequence that begins with the Entry into Jerusalem on the left wing and centres on the Last Supper in the shrine.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 85]] The figures were carved in limewood, while the case and superstructure, by [[artist/erhart-harschner|Erhart Harschner]], are spruce.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82]] Unpainted works of Riemenschneider were not left untreated: the carver usually painted eyes black and lips and blood with red lake directly on the wood, and after installation the sculpture was coated with a pigmented glaze that made the wood shimmer slightly and protected it.[[source/wikipedia-de-tilman-riemenschneider|§ Farbige Fassung und „Holzsichtigkeit“]]
