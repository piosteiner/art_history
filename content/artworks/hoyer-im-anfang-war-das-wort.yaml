description_md: |-
  "Photographic realism or social optimism?" — beside [[artwork/gerasimov-stalin-at-a-meeting-with-commanders]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 21]]. On popular painting under National Socialism: [[source/hermand-1994]].

  ## The picture

  The painting by [[artist/hermann-otto-hoyer|Hermann Otto Hoyer]], 191.8 × 270.5 cm, is counted among the best-known depictions of Hitler as a speaker [[source/wikipedia-de-hermann-otto-hoyer|§ Werk]]. Hoyer, a party member since 1931, showed it at the first [[event/great-german-art-exhibition-1937|Great German Art Exhibition]] in the Haus der Deutschen Kunst in Munich in 1937 [[source/wikipedia-de-hermann-otto-hoyer|§ Leben; § Werk]]. Together with some 400 other works of the Nazi period regarded as "politically charged", it remains in the possession of the U.S. Army [[source/wikipedia-de-hermann-otto-hoyer|§ Werk]].

  ## Context

  At that exhibition such openly political pictures were the exception: according to Hermand only five per cent of the paintings dealt with a strictly Nazi theme such as SA pictures or portraits of leading functionaries, while pastoral landscapes made up about forty per cent [[source/hermand-1994|p. 46]]. Hitler's opening speech set "German" art — uplifting, easily comprehensible, national — against "modern" art as decay [[source/hermand-1994|p. 41]]. The concept of an art for the masses, Hermand argues, rested on "the indissoluble synthesis of the masses and the Führer": "What mattered was not what the people wanted, but, rather, what Hitler wanted, since he embodied the will of the entire German nation" [[source/hermand-1994|p. 41]]. Peters adds that the first exhibition's jury failed so badly that Hitler had it replaced; from then until 1944 his photographer Heinrich Hoffmann chose the works — in 1937 about 1,500 out of some 15,000 submissions [[source/peters-2017|p. 16, n. 27]].

  ## In the seminar

  The seminar "Art and Totalitarianism" set it beside [[artist/aleksandr-gerasimov|Aleksandr Gerasimov]]'s *Stalin at a Meeting with Commanders* (1937) under the question "Photographic realism or social optimism?", in the series of themes of totalitarian art that began with the image of the leader [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 15, 21]]. The slide gives the title in English as "In the Beginning was the World" [*sic*] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 21]].
