      - url: https://en.wikipedia.org/wiki/Piraeus_Apollo
        note: The sculpture was discovered in the ancient harbor of Piraeus in July 1959, along with the Piraeus Athena and Piraeus Artemis. It was excavated by John Papadimitriou.
        source: wikipedia-en-piraeus-apollo
        accessed: 2026-11-24
