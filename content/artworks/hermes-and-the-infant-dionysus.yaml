provenance:
  - owner_label: Temple of Hera (Heraion), Olympia
    acquired: 2nd century or earlier
    place: ancient-olympia
    label: mentioned in the Heraion by Pausanias (5.17.3) in the 2nd century AD; probably its original setting
    sources:
      - url: https://de.wikipedia.org/wiki/Hermes_von_Olympia
        note: Da Pausanias (5, 17, 3) im 2. Jahrhundert n. Chr. diese Statue im Heraion zu Olympia erwähnt, ist davon auszugehen, dass die Statuengruppe an ihrem ursprünglichen Aufstellungsort aufgefunden wurde.
        source: wikipedia-de-hermes-von-olympia
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: late 3rd century
    place: ancient-olympia
    label: buried in the rubble when an earthquake under Diocletian collapsed the roof of the Temple of Hera
    sources:
      - url: https://en.wikipedia.org/wiki/Hermes_and_the_Infant_Dionysus
        note: The Olympia site was hit by an earthquake during the reign of the Roman emperor Diocletian in the final years of the third century C.E, collapsing the roof of the Temple of Hera and burying the statue in rubble.
        source: wikipedia-en-hermes-and-the-infant-dionysus
        accessed: 2026-11-24
  - owner: person/ernst-curtius-2
    co_owners: [person/gustav-hirschfeld]
    acquired: 1877-05-08
    method: find
    place: ancient-olympia
    label: found in the cella of the Temple of Hera; excavations under the 1874 agreement between Greece and Germany — led by Curtius (en), on site under Hirschfeld (de); six more finds completed it; with German excavations at Olympia
    sources:
      - url: https://en.wikipedia.org/wiki/Hermes_and_the_Infant_Dionysus
        note: In 1874, the Greek state signed an agreement with Germany for an archaeological exploration of the Olympia site … The German excavations in 1875 were led by Ernst Curtius. On 8 May 1877, in the temple of Hera, he uncovered the body (head, torso, legs, left arm) of a statue
        source: wikipedia-en-hermes-and-the-infant-dionysus
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Hermes_von_Olympia
        note: Gefunden wurde die Statue am 8. Mai 1877 bei Ausgrabungen in der Cella des Heratempels in Olympia unter der Leitung von Gustav Hirschfeld.
        source: wikipedia-de-hermes-von-olympia
        accessed: 2026-11-24
  - owner: institution/archaeological-museum-of-olympia
    method: transfer
    place: ancient-olympia
    sources:
      - url: https://en.wikipedia.org/wiki/Hermes_and_the_Infant_Dionysus
        note: It is displayed at the Archaeological Museum of Olympia.
        source: wikipedia-en-hermes-and-the-infant-dionysus
        accessed: 2026-11-24
