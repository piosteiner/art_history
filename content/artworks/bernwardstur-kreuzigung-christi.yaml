description_md: |-
  The sixth field from the bottom on the right leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the Crucifixion.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 47]] The lecture paired it with the Fall on the opposite leaf and set the cross, the wood of life, against the tree of knowledge.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 54]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 55]] The opposed trees were central to the lecture's reading of the door, whose themes it summarised as trees and doors – the door leaves as gates of paradise.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]]

  Ittai Weinryb reads the door's trees, after Harvey Stahl and Isabelle Marchesin, as visual cues to the elements of the biblical and Christological narrative that mattered to medieval viewers, and the pairing of loss and survival through the Fall and the Incarnation as a counterpart to the forests that Slavic belief held sacred.[[source/weinryb-2023-die-hildesheimer-avantgarde|p. 104]]
