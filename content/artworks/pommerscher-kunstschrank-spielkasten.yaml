description_md: |-
  This box with a chessboard and other game boards and its playing pieces comes from the contents of the [[artwork/pommerscher-kunstschrank|Kunstschrank for Philipp II of Pomerania]], made in 1610–1617 [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 43]]. It is veneered with ebony and palisander, inlaid with ivory and silver; the pieces are of ivory and bone; it measures 46 × 37.5 × 4.5 cm and is in the [[institution/kunstgewerbemuseum-berlin|Kunstgewerbemuseum]] in Berlin [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 43]].

  The cabinet's equipment included an ebony games board with a chessboard with silver on one side and a mill board with ivory inlay on the other, with the pieces, various dice and playing cards [[source/wikipedia-de-pommerscher-kunstschrank|§ Ausstattung]]. While the cabinet's case burned in 1945, the greater part of the contents survived [[source/wikipedia-de-pommerscher-kunstschrank|§ Geschichte]]. The lecture quoted Jeffrey Chipps Smith on the element of play that was central to such cabinets [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 63]].
