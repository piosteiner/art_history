created_span: uncertain
kind: calligraphy
medium: Ink on paper
materials: [ink, paper]
dimensions: [43.6, 42.2]
description_md: "A [[zenga]] by [[artist/hakuin-ekaku]] (1685–1768), the most influential Zen master of the Edo period: the character mu, “nothingness”, of the [[koan]] in which the Chinese master Jōshū answered whether a dog has Buddha nature. Where the standard strokes suggest counting four items and cancelling them, Hakuin’s mu is a jumble of strokes — vitality rather than negation. [[source/history-of-japanese-art|p. 325, fig. 378]]"
