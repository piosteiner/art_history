description_md: Of the five versions, this is the one Augustine Roulin chose for herself; Van Gogh remarked that she “had a good eye and took the best”[[source/metmuseum-la-berceuse-1996-435|“Of the five versions of Van Gogh’s portrait of Augustine Roulin, wife of his friend the postmaster of Arles, the present canvas is the one the sitter chose for herself. Van Gogh remarked that ‘she had a good eye and took the best.’”]]. He began the portraits just before his breakdown in Arles in December 1888 and completed them in early 1889[[source/metmuseum-la-berceuse-1996-435|“He began the portraits just before his breakdown in Arles, in December 1888, and completed them in early 1889”]].
