        note: "Fritz Nathan, sold to Dr. Tobler [date: Until 1937] — According to Johannes Nathan, Fritz Nathan was frequently in Vienna in the 1930s and may very well have purchased the painting there prior to 1937."
        source: cma-1983-155
        accessed: 2026-11-24
  - owner_label: Dr. Tobler
    acquired: 1937
    method: purchase
    direct: true
    label: Galerie Nathan's archives record the sale to Dr. Tobler in 1937; 'Dr. Tobler' handwritten on the von Hirsch label
    sources:
      - url: https://clevelandart.org/art/1983.155
        note: "Dr. Tobler [date: 1937-] — The archives of Galerie Nathan show that they sold the painting to one Dr. Tobler in 1937."
