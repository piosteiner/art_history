    label: bought from von Hirsch during the war (recollection of Peter Nathan); sold to a Swiss private collector
    sources:
      - url: https://clevelandart.org/art/1983.155
        note: "Dr. Fritz Nathan, St. Gallen, sold to a Swiss private collector [date: By 1945] — Peter Nathan recalled that his father, dealer Fritz Nathan, had purchased the painting from von Hirsch during the war."
