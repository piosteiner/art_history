        accessed: 2026-11-24
  - owner: person/robert-von-hirsch
    acquired: 1943 or earlier
    place: basel
    label: lent to the Kunsthalle Basel's 1943 exhibition of 19th-century art; perhaps sold to him by Fritz Nathan on Tobler's behalf (unconfirmed)
    sources:
      - url: https://clevelandart.org/art/1983.155
        note: "Baron Robert von Hirsch [1883-1977], Basel, sold to Dr. Fritz Nathan [date: By 1943 - by 1945] — German industrialist von Hirsch lent the Waldmüller to an exhibition of nineteenth-century artworks at the Basel Kunsthalle in 1943."
        source: cma-1983-155
        accessed: 2026-11-24
  - owner: person/fritz-nathan
    role: dealer
