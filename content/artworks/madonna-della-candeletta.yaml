provenance:
  - owner_label: Camerino Cathedral
    acquired: 1488-05-10
    method: commission
    place: camerino
    label: the centre of a polyptych for the high altar, commissioned by the chaplain Bartolomeo di Angelo Consuli (contract of 10 May 1488); perhaps already removed in 1548
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/madonna-col-bambino-e-i-santi-pietro-e-paolo-ansovino-e-gerolamo-madonna-della-candeletta/
        note: commissionato nel 1488 per l’altare maggiore della cattedrale di Camerino dal cappellano Bartolomeo di Angelo Consuli e probabilmente danneggiato dal rovinoso terremoto che distrusse la cattedrale nel 1799.
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Madonna_della_Candeletta
        note: Il contratto di allogazione a Carlo Crivelli di un polittico per l'altare centrale della cattedrale di Camerino è datato 10 maggio 1488
        source: wikipedia-it-candeletta
        accessed: 2026-10-20
  - owner_label: San Domenico, Camerino
    role: custodian
    acquired: 1799
    place: camerino
    label: sheltered there, damaged, after the earthquake destroyed the cathedral
    sources:
      - url: https://it.wikipedia.org/wiki/Madonna_della_Candeletta
        note: Quando la chiesa fu distrutta da terremoto del 1799 il dipinto fu danneggiato e, con molti altri della zona, venne ricoverato nella chiesa di San Domenico. Qui i commissari napoleonici prelevarono l'opera per portarla al nascente museo di Brera, a Milano.
        source: wikipedia-it-candeletta
        accessed: 2026-10-20
  - owner: institution/pinacoteca-di-brera
    method: confiscation
    direct: true
    place: milan
    label: taken by the Napoleonic commissioners for the nascent museum of Brera
    sources:
      - url: https://it.wikipedia.org/wiki/Madonna_della_Candeletta
        note: Qui i commissari napoleonici prelevarono l'opera per portarla al nascente museo di Brera, a Milano.
