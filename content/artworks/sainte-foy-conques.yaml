description_md: |-
  The reliquary statue of Sainte Foy (Fides) in the abbey church of [[place/conques-en-rouergue|Conques]] is a seated figure of gold, gems and crystal over a core of yew wood, 85 cm high, made in southern France; the lecture dated it to the late ninth and late tenth centuries.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 14]] Klaus Endemann describes it as the earliest figure preserved fully in the round from any region of medieval Europe.[[source/endemann-2020-wood-carving-and-staffering|pp. 138–139]]

  ## Making

  The wooden core consists of three pieces of yew, nailed and dowelled together, only roughly cut and shaped with a rasp.[[source/endemann-2020-wood-carving-and-staffering|p. 152]] Yew has been verified in no other early European sculpture; the wood is hard, tough and toxic, the trunks are narrow and often hollow, and the tree was in demand for archers' bows.[[source/endemann-2020-wood-carving-and-staffering|p. 143]] For Endemann the choice of material, the lack of finish and the assembly show a maker with little knowledge of woodworking, for whom the core was a mere "coat-rack": the gold sheath was "modelled" on the frame, and the metalworker pressed the drapery folds without reference to the wood.[[source/endemann-2020-wood-carving-and-staffering|p. 152]] An ancient repoussé portrait of an emperor was reused for the face.[[source/endemann-2020-wood-carving-and-staffering|p. 140]]

  The figure grew over centuries: crown, earrings, throne, filigree and gems were added as gifts, crystal balls in the fourteenth century, silver arms and hands in the sixteenth, bronze shoes and knee plates in the eighteenth.[[source/wikipedia-en-abbey-church-of-sainte-foy|§ Treasury]] Jean Taralon showed that pieces of the gold were snipped away over the centuries and the gaps hidden under gems of lesser value; the great carbuncles at the knees mask such pilferings.[[source/forsyth-1972-the-throne-of-wisdom|p. 14]] The dating is disputed: Endemann gives c. 950 in his text, notes that recent literature moves it between "870" and the last quarter of the tenth century, and lists it as Auvergne, 880 (formerly dated 960).[[source/endemann-2020-wood-carving-and-staffering|pp. 138, 141, 147]] Fehrenbach summarised the investigations as showing that the statue was made towards the end of the ninth century and only lavishly renewed in the tenth.[[source/fehrenbach-1996-die-goldene-madonna|p. 59]]

  ## Relics and cult

  The relics of the martyr came to Conques through theft in 866.[[source/wikipedia-en-abbey-church-of-sainte-foy|§ Introduction]] They lay inside the statue, wrapped in oriental textiles in a reliquary cavity, among them the top of her skull.[[source/forsyth-1972-the-throne-of-wisdom|p. 12]] [[source/fehrenbach-1996-die-goldene-madonna|p. 56]] In 1013 Bernard of Angers, a pupil of Fulbert of Chartres, travelled to the Auvergne to see such reliquary statues and at first mocked the golden figures of Sainte Foy and St Gerald as pagan idols.[[source/forsyth-1972-the-throne-of-wisdom|p. 10]] He left as a devotee, recording the saint's miracles in the *Liber miraculorum Sancte Fidis*.[[source/forsyth-1972-the-throne-of-wisdom|p. 10]] He addressed the statue: "St. Foy, of whom a part rests in this image, help me on the Day of Judgment."[[source/forsyth-1972-the-throne-of-wisdom|p. 12]] And he called it "nothing but a shrine that holds the venerable relics of the virgin, to which the goldsmith gave a human form in his own way".[[source/fehrenbach-1996-die-goldene-madonna|p. 56]] Harald Keller built his influential thesis that free-standing sculpture returned only through the alliance of image and relic on this report.[[source/fehrenbach-1996-die-goldene-madonna|p. 56]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 58]]

  The lecture placed the statue beside the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]] as an early wooden image under a precious-metal skin.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 80]]
