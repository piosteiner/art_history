description_md: |-
  Collezione Jucker; published in *La Grande Illustrazione* on 13 January 1915 [[source/zeri-boccioni-carica-di-lancieri]]. The seminar set it beside [[artwork/deineka-defence-of-sevastopol]]: the Futurists' abstract "lines of force" for struggle become, in totalitarian art, the concrete image of war [[source/golomstock-1990]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 43–46]]; it was shown again at the [[event/exhibition-of-the-fascist-revolution]] in 1932 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 44, 67]].

  ## Description and context

  *Carica di lancieri* (*Charge of the Lancers*), a small work in tempera, varnish and collage on paper mounted on canvas, was made by [[artist/umberto-boccioni|Umberto Boccioni]] in 1915, the year in which Italy entered the [[event/world-war-i|First World War]] and Boccioni joined the Lombard Battalion of Volunteer Cyclists and Motorists [[source/wikipedia-en-umberto-boccioni|§ Military service and death]]. The [[movement/futurism|Futurists]] had glorified war as "the world's only hygiene" and campaigned for Italian intervention since 1914 [[source/wikipedia-en-futurism|§ Italian Futurism]]. In the seminar the work stood for Boccioni's idea of painting, as he put it in 1914: "While the impressionists paint a picture to give one particular moment and subordinate the life of the picture to its resemblance to this moment, we synthesize every moment (time, place, form, color-tone) and thus paint the picture" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 44]].

  ## Futurism and totalitarian art

  Golomstock: "Totalitarianism translated the ideas of the avant-garde into its own language and forged them into a weapon with which to destroy its enemies. The idea of struggle as the driving force of history and culture was expressed by the Futurist through the image of abstract 'lines of force' and dynamic shapes: in totalitarian art, however, this idea was embodied more concretely, through the image of war" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 43]]. The comparison with Deineka's socialist-realist battle picture of 1942 raised three issues: the complicated relationship with the past, the projection of a future and an idea of modernity, and the conceptual and visual elaboration of power [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 46]]. After the First World War depictions of war often turned to its gruesome sides, whereas totalitarian art again showed war as heroic [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Its showing at the Mostra della Rivoluzione Fascista in 1932 — an exhibition that recapitulated the Fascists' rise to power in didactic photomontage installations [[source/antliff-2002|p. 154]] — placed the pre-war work in the regime's own history [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 67]].
