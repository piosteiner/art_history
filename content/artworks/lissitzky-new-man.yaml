description_md: "Plate 10 of the portfolio *Figurines: The Three-Dimensional Design of the Electro-Mechanical Show \"Victory over the Sun\"* (Hanover, 1923); impressions in several museums, e.g. the Brooklyn Museum, 50.191.10 [[source/brooklyn-50-191-10]]. Lissitzky's New Man is an entirely new being reaching towards an undetermined future — which [[artwork/worker-and-kolkhoz-woman]] only imitates and stops with classical, forceful bodies [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 26, 48–49, 65]]."
