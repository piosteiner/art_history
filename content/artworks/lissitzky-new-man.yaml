description_md: |-
  Plate 10 of the portfolio *Figurines: The Three-Dimensional Design of the Electro-Mechanical Show "Victory over the Sun"* (Hanover, 1923); impressions are in several museums, for example the [[institution/brooklyn-museum|Brooklyn Museum]], 50.191.10 [[source/brooklyn-50-191-10]].

  ## The portfolio

  Lissitzky published the *Victory over the Sun* figurines in 1923 as a rethinking of the UNOVIS design of 1920 for that Futurist opera; Yve-Alain Bois called the album an "anthropomorphization of the Prouns" [[source/wikipedia-en-el-lissitzky|§ Prouns]]. The opera itself had premiered in 1913 at the Luna Park in Saint Petersburg, with a libretto in *zaum* by Aleksei Kruchonykh, music by Mikhail Matyushin, a prologue by Velimir Khlebnikov and stage designs by [[artist/kazimir-malevich|Kazimir Malevich]] [[source/wikipedia-en-victory-over-the-sun|introduction]]. Its protagonists set out to destroy reason by disposing of time and capturing the sun [[source/wikipedia-en-victory-over-the-sun|§ Plot and reception]]. The figures of Lissitzky's "show machinery" include the announcer, the sentry, anxious people, the globetrotter (in time), the sportsman, the troublemaker, the old man, the gravediggers and the New Man [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 49]].

  ## The figure

  Lissitzky's New Man is an entirely new being reaching towards an undetermined future [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]]. Michaud writes that "when El Lissitzky, for example, designs [...] a New Man [...], he does not conceive of it as remodelling of the old human being but as the production of an entirely new being" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 65]]. The art historian Birnholz saw Leonardo's *Vitruvian Man* behind the figure, which Peter Nisbet found plausible for its "evocation of an ideal, transformed humanity"; Peter Larson rejected the comparison and saw Lissitzky himself in "the new technological-artistic man" who hurls the sun from the heavens [[source/wikipedia-en-el-lissitzky|§ Prouns]].

  ## Avant-garde and totalitarian art

  In the seminar the sheet stood for the role of modernism and the avant-gardes, beside Balla and Depero's *Futurist Reconstruction of the Universe* (1915) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 26]], and for the transformation of the Russian vanguards after 1917 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 48]]. The New Man as an idea runs through the totalitarian regimes ([[term/new-man]]); [[artwork/worker-and-kolkhoz-woman]] only imitates Lissitzky's figure and stops it with classical, forceful bodies [[source/cioli-ricciardi-schiera-2019|Éric Michaud, p. 104]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 65]].

  ## Later

  For the exhibition "Lissitzky+" four figurines — the Announcer, the Time Traveller, the Gravediggers and the New Man — were built as large models [[source/wikipedia-en-el-lissitzky|§ Scholarly assessment and legacy]].
