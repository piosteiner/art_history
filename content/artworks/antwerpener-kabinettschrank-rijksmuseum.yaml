description_md: |-
  This cabinet was made about 1650 by Antwerp cabinetmakers and painters [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 51]]. Its carcass is of softwood and oak, veneered with ebony and decorated with bone and tortoiseshell, oil paintings and silver; it is 1.59 m high and 1.09 m wide and is in the [[institution/rijksmuseum|Rijksmuseum]] in Amsterdam [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 51]]. The lecture showed it whole and in detail [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 51–52]].

  It illustrates the lecture's theme of tropical woods as the outer skin of European luxury furniture: ebony, the dark heartwood of Diospyros species from Sri Lanka and southern India, with related species in Madagascar and Cameroon, was used as a veneer over a carcass of cheaper wood [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 15, 46, 51]]. The same construction — softwood and oak covered with ebony — is found in [[artist/pierre-gole|Pierre Gole]]'s [[artwork/gole-kabinett-rijksmuseum|cabinet]] in the same museum [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 47]].
