description_md: |-
  The choir stalls of the chapel of St John the Baptist in [[institution/siena-cathedral|Siena Cathedral]] were decorated with intarsia by [[artist/antonio-barili|Antonio Barili]]; the lecture dates the work 1488–1502 [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 54]]. The ensemble has been dispersed: panels are now in the Collegiata of San Quirico d'Orcia, and the self-portrait was destroyed in Vienna in the Second World War [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 54–55]]. Marta Ajmar dates the cycle 1483–1504 [[source/ajmar-2024-reciprocal-design|p. 36]].

  ## Surviving and lost parts

  A panel with [[artwork/barili-santa-caterina-san-quirico|St Catherine of Alexandria and a lute player]] is in the [[institution/collegiata-di-san-quirico-d-orcia|Collegiata]] of San Quirico d'Orcia [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 55]]. The [[artwork/barili-autoritratto|self-portrait]] was formerly in the Kunstgewerbemuseum in Vienna and was destroyed in the Second World War [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 54]]. It showed Barili cutting an inscription with the knife: "HOC EGO ANTONIVS BARILIS OPVS COELO NON PENICELLO EXCVSSI AN DN MCCCCCII" — "I, Antonio Barili, have extracted this work with the knife, not with the brush, in the year 1502" [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 56]].

  ## Technique

  Ajmar points out that the panels framing the imitation-marble alcove of the self-portrait show Barili's early use, or possibly invention, of chipboard (legno composito), a man-made wood substitute made of shavings — an example of how intarsia could reuse waste wood at a time of growing timber scarcity [[source/ajmar-2024-reciprocal-design|pp. 30–31]].
