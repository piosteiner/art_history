description_md: "The retirement villa of [[person/yamagata-aritomo]] (1838–1922), statesman and general of the Meiji period, in Kyoto: a strolling garden by the master gardener [[artist/ogawa-jihei]] (1860–1933) with views towards the Eastern Hills, its expanses of lawn adapted from British gardens, but mainly streams, ponds, mossy banks, mature trees and stones — a naturalistic Japanese sylvan idyll. [[source/history-of-japanese-art|p. 351, fig. 408]]"
