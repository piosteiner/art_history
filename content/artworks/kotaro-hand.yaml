description_md: The best-known work of [[artist/takamura-kotaro]] (1883–1956), Kōun’s son, who studied in New York, London and Paris and took Rodin as his hero; also a poet, whose essay “The Green Sun” (1910) urged artists to express their own vision. The taut flexing of the fingers is not a natural pose but an emotional state. [[source/history-of-japanese-art|p. 359, fig. 422]]
