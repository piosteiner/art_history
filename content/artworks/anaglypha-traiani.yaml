description_md: |-
  Two carved marble balustrades of the time of Trajan or Hadrian, today displayed inside the [[institution/curia-julia|Curia Julia]] on the Roman Forum, though not part of the original building.[[source/wikipedia-en-plutei-of-trajan|introduction]] The lecture "Aus dem Wald" shows panel I, the address of the emperor (*adlocutio*), dated about 118/120, marble, 5.37 × 1.75 m.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 80]]

  ## Description

  Where the panels originally stood is unknown: on the edge of the Rostra, or on either side of the Lapis Niger that marks the so-called Tomb of Romulus.[[source/wikipedia-en-plutei-of-trajan|introduction]] In the foreground one relief shows the emperor in the Forum instituting the *alimenta*, a charitable foundation for orphans, seated on a podium with a personification of Italia holding a child; the other shows wooden tablets with tax records being carried in and burned before the emperor, probably Hadrian in 118.[[source/wikipedia-en-plutei-of-trajan|§ Foreground carvings]] The backgrounds of both reliefs show the buildings along the Forum, and on each the Ficus Ruminalis appears together with the statue of Marsyas.[[source/wikipedia-en-plutei-of-trajan|§ Background carvings]] The fig tree stands on a plinth, as if it too were a sculpture; whether this means that sacred trees could be replaced by artificial or pictorial ones is unclear.[[source/wikipedia-en-ficus-ruminalis|§ History]]

  ## The sacred fig

  The Ficus Ruminalis was the fig under which, in Roman tradition, the she-wolf suckled Romulus and Remus.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 72]] Pliny describes a fig tree on the Comitium, sacred through lightning buried there and through the memory of the twins' tree, which the priests replaced whenever it withered.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 72]] The lecture notes that its location — at the Lupercal at the foot of the Palatine or on the Comitium — is uncertain, and that the tree served as a sign that could be replaced.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 73]] According to Varro, shepherds had planted it in honour of the milk goddess Rumina because its sap resembled milk.[[source/cusack-2011-the-sacred-tree|p. 52]] The lecture placed the relief in its section on the tree and the image of the god, beside a view of the area of the Comitium.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 79]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 82]]
