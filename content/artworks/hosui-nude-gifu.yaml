description_md: "Painted in Paris by [[artist/yamamoto-hosui]] (1850–1906), the first Japanese artist to study abroad, a pupil of Jean-Léon Gérôme: technically accomplished and academic in its idealized nude. His greatest contribution to [[yoga]] was converting Kuroda Seiki from law to painting. [[source/history-of-japanese-art|p. 372, fig. 443]]"
