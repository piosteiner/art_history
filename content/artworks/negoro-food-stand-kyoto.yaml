description_md: "One of the rare well-preserved pieces of Heian household furniture: a round stand for food on a single stem, modelled on a wooden core and lacquered red. It differs only slightly from those shown in the interiors of narrative scrolls. Plain red and black were the standard colours of Japanese lacquer ([[negoro]]). [[source/history-of-japanese-art|p. 106, fig. 129]]"
