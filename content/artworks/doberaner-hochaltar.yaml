description_md: |-
  The high altarpiece of the former Cistercian abbey church at Doberan in Mecklenburg, a shrine with wings made around 1300.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 25]] It is of oak; the whole altar is 10 m high, the shrine 2.42 m high and 2.89 m wide.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 25]] It is often called the oldest winged altarpiece in Germany, even in art history; German Wikipedia names it the oldest surviving winged retable, followed by the Holy Blood altarpiece of Cismar (around 1310/20).[[source/wikipedia-en-doberan-minster|§ The main altar]][[source/wikipedia-de-flugelaltar|§ Auswahl berühmter Werke]]

  ## Description

  The altar was made around 1300 as an enclosed altar by unknown artists; the upper and middle sections date from that time.[[source/wikipedia-en-doberan-minster|§ The main altar]] The upper row tells stories from the New Testament, matched by Old Testament scenes in the middle row; the left wing shows the joys of Mary, the right wing her sorrows.[[source/wikipedia-en-doberan-minster|§ The main altar]] The lower row was probably carved by the same carver who made the church's great tabernacle in 1350–1360.[[source/wikipedia-en-doberan-minster|§ The main altar]]

  ## Use

  Until around 1400 a figure of the Virgin stood in the central niche; it was then replaced by a large monstrance and several holy images, and relics and monstrances were kept in the shrine – all lost in the Thirty Years' War.[[source/wikipedia-en-doberan-minster|§ The main altar]] The Virgin, a statue of about 1280, now stands on an ornamental candle holder made around 1400.[[source/wikipedia-en-doberan-minster|§ The main altar]]

  In the lecture the Doberan altar opened the series of carved high-altar shrines with wings that leads to the great retables of the Late Gothic – a shrine that houses and, on opening, reveals the holy.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 25–30, 35]] The abbey church in which it stands was begun around 1280 and consecrated in 1368; no other Cistercian church in Europe keeps so much of its original furnishing.[[source/wikipedia-en-doberan-minster|§ introduction]]
