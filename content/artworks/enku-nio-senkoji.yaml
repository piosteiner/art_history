description_md: "Two of the most impressive late works of the wandering priest-sculptor [[artist/enku]] (1628?–1695), who carved roughly finished images ([[natabori]]) for country people: each Niō from a single tall, roughly cut vertical piece of wood, feather-like crowns at the top. They radiate energy and mystical power — awe-inspiring to peasants for whom provincial imitations of classical sculpture had lost meaning. [[source/history-of-japanese-art|pp. 309–310, fig. 359]]"
