web_url: https://www.fujibi.or.jp/en/collection/artwork/06618/
description_md: "Spring and autumn as a pair: on the right a field of cherry trees in full bloom with a pheasant in flight, on the left a Japanese maple shedding its leaves and wild geese in the distance. Kanō-school brushwork shapes the trunks and rocks, Western aerial perspective the depth[[source/fujibi-06618|“The right of these paired screens shows a spring field with fully blooming cherry blossom and a pheasant in flight, while the left side is an autumnal view with a Japanese maple shedding its leaves and a flock of wild geese in the distance. The powerful brush strokes of the Kano school are evident in the tree trunks and the depictions of rocks, giving an accent to the screens. In addition, the western aerial perspective is employed effectively to express the depth of space”]]. A work of Gahō's mature period[[source/fujibi-06618|“This is a work from the mature period of Hashimoto Gaho”]]. The museum's data describe it as two hanging scrolls (a diptych), its text as paired screens[[source/fujibi-06618|“Color on silk, hanging scroll (diptych)” · “The right of these paired screens …”]]."
