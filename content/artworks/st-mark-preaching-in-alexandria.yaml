provenance:
  - owner: institution/scuola-grande-di-san-marco
    acquired: 1504-07
    method: commission
    place: venice
    label: for the great hall of the confraternity — commissioned from Gentile Bellini, unfinished at his death (February 1507) and completed by his brother Giovanni, as his will asked (confirmed by the Scuola on 7 March 1507)
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/predica-di-san-marco-in-una-piazza-di-alessandria-degitto/
        note: L’imponente telero ornava il salone della Scuola Grande di San Marco a Venezia, una delle più prestigiose e potenti confraternite della città lagunare. Fu commissionato a Gentile Bellini nel 1504 ma nel 1507 restò incompiuto […] e fu portato a termine dal fratello Giovanni, incaricato in tal senso dal testamento di Gentile.
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Predica_di_san_Marco_ad_Alessandria_d%27Egitto
        note: La tela venne iniziata da Gentile nel luglio del 1504, ma dopo la sua morte (febbraio 1507) […] passò al fratello Giovanni […] La commissione venne confermata a Giovanni dalla Scuola Grande il 7 marzo 1507.
        source: wikipedia-it-predica-san-marco
        accessed: 2026-10-20
  - owner: institution/pinacoteca-di-brera
    method: confiscation
    place: milan
    label: now at Brera — the Venetian scuole were suppressed under Napoleon (the date of the transfer is not on Brera's page)
    certainty: probable
    sources:
      - url: https://pinacotecabrera.org/collezioni/collezione-on-line/predica-di-san-marco-in-una-piazza-di-alessandria-degitto/
        note: Inventario 160 […] Sala VIII
        source: pinacoteca-di-brera-collezione
        accessed: 2026-10-20
