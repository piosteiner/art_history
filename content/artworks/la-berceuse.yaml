description_md: Van Gogh painted Augustine Roulin, the wife of his friend the postman Joseph Roulin, as “La Berceuse” — seated, holding the cord of a cradle out of view — five times between December 1888 and March 1889[[source/kroller-muller-la-berceuse-km-109-725|“In Arles, Van Gogh befriended the postmaster Joseph Roulin and his wife Augustine. He painted portraits of them and their three children.”]][[source/metmuseum-la-berceuse-1996-435|“Of the five versions of Van Gogh’s portrait of Augustine Roulin, wife of his friend the postmaster of Arles, the present canvas is the one the sitter chose for herself.”]]. The first, now in the [[artwork/la-berceuse-kroller-muller|Kröller-Müller Museum]], he began before his breakdown in December 1888; he gave one version to Madame Roulin herself, now in the [[artwork/la-berceuse-met|Metropolitan Museum]], and sent the other four to his brother Theo[[source/van-gogh-letters|letter 776, notes]]. The others are in [[artwork/la-berceuse-chicago|Chicago]], [[artwork/la-berceuse-boston|Boston]] and the [[artwork/la-berceuse-stedelijk|Stedelijk Museum]] in Amsterdam.
