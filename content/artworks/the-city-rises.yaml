description_md: |-
  *The City Rises* (*La città che sale*) is a large oil painting of 1910 by [[artist/umberto-boccioni|Umberto Boccioni]], his first major [[movement/futurism|Futurist]] work [[source/wikipedia-en-the-city-rises|§ Introduction]]. Futurism: the city rising, painted in 1910. The seminar set it beside Sironi's urban landscapes of the 1920s — totalitarian modernism, with another relation to the past and to tradition [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 53]].

  ## Description

  The painting shows the building of a new city: houses under construction in a suburb, with factory chimneys at the top, while most of the canvas is filled with men and horses fused in one dynamic effort [[source/wikipedia-en-the-city-rises|§ Subject]]. At the centre of the foreground a huge rearing red horse strains against the workmen who try to hold it [[source/wikipedia-en-futurism|§ Italian Futurism]]; the domesticated beast of burden overpowering its handlers stands for the modern city and for the violence, energy and speed of progress [[source/wikipedia-en-the-city-rises|§ Subject]]. Boccioni worked on it for nearly a year and wrote to a friend: "I attempted a great synthesis of labor, light and movement" [[source/wikipedia-en-umberto-boccioni|§ Development of Futurism]]. Realistic elements remain — the buildings, a space still built in perspective — and the picture is not markedly different from his earlier suburban scenes, but their naturalistic vision gives way to a more dynamic one [[source/wikipedia-en-the-city-rises|§ Background]].

  ## History

  The painting was first shown under the title *Il lavoro* (*Work*) at the Mostra d'arte libera in [[place/milan|Milan]] in 1911 [[source/wikipedia-en-the-city-rises|§ Background]], where it drew mostly admiring reviews; by 1912 it headed the Futurist exhibition travelling through Europe, and that year the composer and pianist Ferruccio Busoni bought it for 4,000 lire [[source/wikipedia-en-umberto-boccioni|§ Development of Futurism]]. Boccioni's last painting, a portrait of Busoni of 1916, returned to the man who had bought his first Futurist work [[source/wikipedia-en-umberto-boccioni|§ Development of Futurism]]. The picture is now in the [[institution/museum-of-modern-art|Museum of Modern Art]] in New York, often hung at the entrance to the painting galleries [[source/wikipedia-en-the-city-rises|§ Provenance]] [[source/wikipedia-en-umberto-boccioni|§ Development of Futurism]].

  ## Two images of the city

  Mario Sironi's urban landscapes of 1920–21 answered the Futurist city with its opposite: using the pictorial means of Giorgio de Chirico, Sironi shrouded the suburbs of Milan in silence and immobility, "denuding it of the vibrancy and energy so evident in Futurist images of the city" [[source/antliff-2002|p. 152]]. In the seminar the comparison illustrated a "totalitarian modernism" with a different relationship to the past and to tradition [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 53]].
