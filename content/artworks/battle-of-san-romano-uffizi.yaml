provenance:
  - owner_label: Lionardo Bartolini Salimbeni
    acquired: 1438
    method: commission
    place: florence
    label: one of three panels he paid for in 1438, for his palace in Florence; his sons Damiano and Andrea moved them to the family villa at Santa Maria a Quinto
    sources:
      - url: https://www.uffizi.it/en/artworks/battle-of-san-romano
        note: The decorative cycle was commissioned by Lionardo Bartolini Salimbeni, leading light in Florentine political life from the early 15th century, for his palace in Florence, just a few years after the epic feat itself.
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Battaglia_di_San_Romano
        note: le tavole erano state pagate nel 1438 dal ricco ed eminente Lionardo Bartolini Salimbeni […] I suoi due figli, Damiano e Andrea avevano trasferito l'opera nella villa di famiglia nei dintorni di Firenze, a Santa Maria a Quinto
        source: wikipedia-it-battaglia-san-romano
        accessed: 2026-10-20
  - owner_label: Damiano and Andrea Bartolini Salimbeni
    ended: 1484
    method: inheritance
    place: florence
    sources:
      - url: https://it.wikipedia.org/wiki/Battaglia_di_San_Romano
        note: I suoi due figli, Damiano e Andrea avevano trasferito l'opera nella villa di famiglia nei dintorni di Firenze, a Santa Maria a Quinto […] Qui le vide il Magnifico, che insistette tanto per averle e le ottenne nel 1484.
        source: wikipedia-it-battaglia-san-romano
        accessed: 2026-10-20
  - owner: person/lorenzo-il-magnifico
    acquired: 1484
    ended: 1492
    method: purchase
    place: florence
    label: he insisted until he had them, and hung them in the Medici palace in Via Larga (the “camera di Lorenzo”), probably having Uccello change their shape
    sources:
      - url: https://www.uffizi.it/en/artworks/battle-of-san-romano
        note: The heirs of Lionardo Bartolini then sold the paintings to Lorenzo il Magnifico, who had them placed in his palace in via Larga (now known as Palazzo Medici-Riccardi in via Cavour) probably asking Paolo Uccello, the painter of the cycle, to change the shape
        source: uffizi-artworks
        accessed: 2026-10-20
      - url: https://it.wikipedia.org/wiki/Battaglia_di_San_Romano
        note: Qui le vide il Magnifico, che insistette tanto per averle e le ottenne nel 1484.
        source: wikipedia-it-battaglia-san-romano
        accessed: 2026-10-20
    records:
      - date: "1492"
        room: camera grande terrena, detta La camera di Lorenzo
        place: florence
        document: inventory after the death of Lorenzo the Magnificent
  - owner_label: the Medici (Guardaroba)
    acquired: 1659
    method: transfer
    place: florence
    label: to the Medici Guardaroba with the furnishings when the palace was sold to the Riccardi
    sources:
      - url: https://it.wikipedia.org/wiki/Battaglia_di_San_Romano
        note: Con la vendita di Palazzo Medici ai Riccardi, nel 1659, il dipinto, assieme a tutti gli altri arredi, pervenne alla Guardaroba medicea.
        source: wikipedia-it-battaglia-san-romano
        accessed: 2026-10-20
  - owner: institution/uffizi-gallery
    acquired: 1784
    method: transfer
    place: florence
    label: the three panels came to the Uffizi in 1784; the best-preserved was kept, the other two sold as duplicates (London 1857, Louvre 1863)
    sources:
      - url: https://it.wikipedia.org/wiki/Battaglia_di_San_Romano
        note: Nel 1784 le tre tavole arrivarono agli Uffizi; in seguito si decise che i tre pannelli erano troppo simili e si tenne a Firenze quello meglio conservato (Disarcionamento di Bernardino della Carda), vendendo gli altri due come inutili doppioni.
        source: wikipedia-it-battaglia-san-romano
        accessed: 2026-10-20
