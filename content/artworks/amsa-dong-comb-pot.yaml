description_md: "A pointed-based pot with incised herringbone pattern from Amsa-dong near Seoul, the best-known Neolithic site of Korea: discovered after a flood in 1925 and excavated from 1967, with some thirty pit dwellings. [[chulmun]] pottery appears around 5000 BCE between the Ch’ŏngch’ŏn and Han rivers. [[source/portal-2000|p. 27, fig. 11]]"
