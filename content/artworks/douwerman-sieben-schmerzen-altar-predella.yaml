description_md: |-
  The predella of [[artist/heinrich-douvermann|Henrick Douwerman]]'s Seven Sorrows altarpiece in St. Nicolai, Kalkar, carved in oak in 1518–1521, shows the Root of Jesse: the genealogy of Christ as a tree growing out of the sleeping Jesse.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 46]] In the lecture "Aus dem Wald" it is the example of wood as subject and as working material at once.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 49]] Douwerman is counted among the great masters of sculpture in visible, unpainted wood, a judgement usually illustrated by this predella — although at least as many of his carvings are or were painted.[[source/wikipedia-de-heinrich-douvermann|§ Die einzelnen Werke]]

  ## Subject

  The image goes back to Isaiah 11:1–3a, which the lecture quotes from the Vulgate: "Et egredietur virga de radice Iesse et flos de radice eius ascendet" — a shoot will come forth from the root of Jesse and a flower will rise from his root, and the spirit of the Lord, of wisdom, understanding, counsel, strength, knowledge and piety will rest upon him.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 51]] The lecture sets the predella beside older versions of the theme: the Root of Jesse in the Bible of Saint-Bénigne of about 1125/35 (Dijon, Bibliothèque municipale, Ms. 2, fol. 148r), the Isaiah frontispiece of the Lambeth Bible of about 1150 (London, Lambeth Palace Library, Ms. 3, fol. 198r) and the Jesse window of about 1150 in the west façade of [[artwork/wurzel-jesse-fenster-chartres|Chartres Cathedral]].[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 52]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 53]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 54]]

  ## Wood as theme and medium

  In the oak predella the biblical tree is carved from the timber of a tree.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 49]] The lecture showed the detail again in its second session, after Gregory C. Bryda's thesis that late medieval German artists "deliberately foreground[ed] woodiness in both subject and medium" to make arboreal metaphors for Christ and the instruments of the Passion more immediate.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 7]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 8]] Unlike Michael Baxandall, Bryda gives wood a central role for the meaning and function of such works, though he too leaves the environmental and economic history of wood aside.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 44]]

  Douwerman belonged to the sculptors of the Lower Rhine between Cleves, Kalkar and Xanten who worked mainly in oak.[[source/wikipedia-de-heinrich-douvermann|§ Leben und Werk]] In northern Germany and the Netherlands, as Michael Baxandall notes, sculptors generally used oak rather than the limewood of the south.[[source/baxandall-1980-limewood-sculptors|p. 27]] According to Baxandall, oak has a very strong character in the middle forms of a carving and offers the carver "a positive cubic medium", where limewood is passive and simply tractable.[[source/baxandall-1980-limewood-sculptors|p. 39]]
