description_md: |-
  Triptych with predella. After the First World War war was often shown in its gruesome aspects — with [[artwork/grosz-to-them-peace-is-assured]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 18; class notes, 24 September 2024]].

  ## Description

  *Der Krieg* (The War) is a triptych with predella painted by [[artist/otto-dix|Otto Dix]] on wood, begun in 1929 and finished in 1932; the centre panel measures 204 × 204 cm, the wings 204 × 102 cm, and the predella, running the full width, is 60 cm high [[source/wikipedia-de-der-krieg-otto-dix|introduction]]. It is painted in an old-master style and takes its motifs from that tradition [[source/wikipedia-de-der-krieg-otto-dix|§ Bildbeschreibung]]. The centre panel shows a completely devastated landscape strewn with corpses and body parts, where only a soldier in a gas mask seems to be alive; Dix took up the composition of his earlier, now lost painting *Der Schützengraben* (The Trench) and combined it with the drastic imagery of Matthias Grünewald's Isenheim Altarpiece [[source/wikipedia-de-der-krieg-otto-dix|§ Bildbeschreibung]]. On the left wing a column of fully equipped soldiers marches through a misty war landscape, perhaps into battle; on the right wing men withdraw from the fighting, and the dominant figure, helping a comrade, is a self-portrait of Dix [[source/wikipedia-de-der-krieg-otto-dix|§ Bildbeschreibung]]. The predella shows soldiers lying side by side, asleep or dead, after Hans Holbein the Younger's *Dead Christ in the Tomb* [[source/wikipedia-de-der-krieg-otto-dix|§ Bildbeschreibung]].

  ## Origin

  Dix had served from 1914 to 1918 in the German army, as a non-commissioned officer of a machine-gun unit on the Western Front and at the Battle of the Somme, and was wounded in the neck in August 1918; he later described a recurring nightmare of crawling through destroyed houses [[source/wikipedia-en-otto-dix|§ World War I service]]. He worked through these experiences in many works — first the portfolio of fifty etchings *Der Krieg* (1924), then the triptych, painted from 1929 to 1932 [[source/wikipedia-en-otto-dix|§ World War I service]]. He began it around the tenth anniversary of the end of the war, when Erich Maria Remarque's *All Quiet on the Western Front* appeared alongside many memoirs glorifying the war; Dix wanted to counter the latter [[source/wikipedia-de-der-krieg-otto-dix|§ Bildbeschreibung]]. By then he painted in thin oil glazes over a tempera underpainting, in the manner of the old masters [[source/wikipedia-en-otto-dix|§ Post-war artwork]]. *The Trench* (1923), the model for the centre panel, had caused such a furore that the Wallraf-Richartz Museum hid it behind a curtain [[source/wikipedia-en-otto-dix|§ Post-war artwork]].

  ## Reception and history

  The triptych was completed in the year before the National Socialists came to power; in April 1933 Dix was dismissed from his professorship at the Dresden Academy for a "violation of the moral sensibilities" of the nation [[source/wikipedia-en-otto-dix|§ The Nazis and World War II]]. In the [[event/degenerate-art-exhibition|Degenerate Art exhibition]] of 1937 Dix stood for "antiwar themes", shown with the rooms on Nolde, the Brücke and Klee "in a comparatively conventional way in a crowded, two-row hanging" [[source/peters-2017|p. 24]]. From 1946 the triptych was on loan in Dresden and for some years in the Kunstmuseum Moritzburg in Halle; in 1968 the Dresden museum bought it for 500,000 Deutsche Mark, and it is in the Galerie Neue Meister of the [[institution/staatliche-kunstsammlungen-dresden|Staatliche Kunstsammlungen Dresden]] [[source/wikipedia-de-der-krieg-otto-dix|introduction]].

  ## In the seminar

  The seminar "Art and Totalitarianism" set the triptych, with Grosz, against the heroic war paintings of the regimes, such as [[artwork/eber-the-battle-for-warsaw|Elk Eber's The Battle for Warsaw]] and [[artwork/andreoni-aeropainting-and-tanks|Cesare Andreoni's Aeropainting and Tanks]]: war in the regimes' art was depicted as heroic, while after the First World War it was often shown in its gruesome aspects [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 17–18; class notes, 24 September 2024]]. "Otto Dix and the Degenerate Art Exhibition (1937)" was also one of its examples of the relation between works and exhibitions under totalitarian regimes [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 67]].
