description_md: One of the images added in the thirteenth century under [[artist/tankei]], master of the new installation. Compared with the rescued twelfth-century figures, the drapery is heavier over the legs and its folds flow over the whole area between waist and feet, and the arms are more graded in size — the new interest in volume of the Kamakura period, held within a fidelity to the older forms. [[source/history-of-japanese-art|pp. 155–156, fig. 190]]
