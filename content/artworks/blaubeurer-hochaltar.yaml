description_md: |-
  The high altarpiece of the former Benedictine abbey church of St John the Baptist at Blaubeuren, made in 1491–1494 by the Ulm carver [[artist/michel-erhart|Michel Erhart]], the cabinetmaker [[artist/jorg-syrlin-the-younger|Jörg Syrlin the Younger]] and the painter [[artist/bartholomaus-zeitblom|Bartholomäus Zeitblom]], who also painted the sculpture.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36]][[source/wikipedia-en-blaubeuren-abbey|§ Further reading]] It stands in the choir built in 1491–1493 and is 11.90 m high and 8.05 m wide.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36]] The load-bearing parts are oak, the tracery superstructure (Gesprenge) and the filling boards spruce, and the sculptures lime.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 36]][[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 125]]

  ## Commission

  The abbey was reformed and restored under its abbots Ulrich Kundig (1456–1475) and Heinrich III Fabri (1475–1495); building of the new abbey church began in 1491, a year before Fabri became a bishop.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] No written sources on the altarpiece survive; it is dated 1493 and 1494 but not signed.[[source/wikipedia-de-michel-erhart|§ Werk]] The carved figures are attributed to Michel Erhart and his son [[artist/gregor-erhart|Gregor Erhart]], whose shares are disputed.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] Abbot Fabri and Count Eberhard V "im Bart" of Württemberg appear as portrait busts in the crowning pieces above the inner wings.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 38]][[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] Michael Baxandall called it the finest surviving work of the Ulm school of carvers.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  ## Three views

  The altarpiece is a transforming altar (Wandelaltar) with two pairs of opening wings, a predella and a Gesprenge rising to almost twelve metres; the outer wings, the outsides of the inner wings and the predella wings are painted, and only when all wings are open does the carved work come fully into view.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  - **Closed:** four scenes of the Passion – Christ on the Mount of Olives, the Crowning with Thorns, the Carrying of the Cross and the Crucifixion – painted by [[artist/bernhard-strigel|Bernhard Strigel]] and Zeitblom.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 39]]
  - **First opening:** sixteen painted scenes from the life of John the Baptist, the church's patron, from the annunciation to Zacharias to the burial of the Baptist's head.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 40]]
  - **Fully open:** the shrine with the Virgin and Child, John the Baptist, John the Evangelist, Benedict and Scholastica, flanked by carved reliefs of the Nativity and the Adoration of the Magi on the inner wings.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 41]]

  In the predella Christ and the apostles appear as carved half-figures; in the centre of the Gesprenge stands Christ as Man of Sorrows between two angels with the instruments of the Passion, with Mary and John and busts of saints in the side towers.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]]

  ## Grades of carving and colour

  The lecture presented Blaubeuren as the paradigm case of graded plasticity and colour: painted panels outside, increasingly sculptural reliefs and finally fully carved figures in gold and colour inside.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 35, 41–50]][[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] The combination of sculpture, relief and painting is characteristic of the German carved altarpiece around 1500.[[source/wikipedia-de-michel-erhart|§ Der Blaubeurer Hochaltar]] The shrine figures keep their original paint and leaf-metal gilding over a chalk ground, applied by Zeitblom's workshop.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 63]]

  ## Wood

  The lecture set the altarpiece in the context of the timber trade: rafts carried wood down the Danube to Ulm, whose raft landing appears on a sixteenth-century view of the city, and south German carvers preferred limewood for sculpture.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 122–127]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 55–59]] The choir stalls of the church, also by Jörg Syrlin the Younger, date from about the same time.[[source/wikipedia-en-blaubeuren-abbey|§ History: Catholic]]
