description_md: |-
  The Dévot Christ ("devout Christ"), a crucifixus dolorosus in the chapel of the same name beside the cathedral of Saint-Jean-Baptiste in Perpignan, carved in the early fourteenth century in limewood; the corpus is 1.52 m high, the cross 2.42 m, and remains of two layers of paint survive.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 70]]

  ## Date and origin

  The sculpture was long thought to be a Spanish work of 1529, on the strength of a document of the cathedral chapter; a new reading showed that the date referred to a restoration.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]] Frederick B. Deknatel pointed to its likeness to crucifixes from Westphalia and the Rhineland, especially the forked crucifix of St. Maria im Kapitol in Cologne, dated 1304.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]] On 4 July 1952 relics were found in a cavity in Christ's back, with a damaged paper in fourteenth-century script recording that they had been placed there in 1307, on the feast of Saint Maurice and his companions.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]] This confirmed the date 1307 and a probable origin in the Rhineland; the figure reached Perpignan in 1528, by unknown means.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]] Analysis showed that it was originally nailed, like the Cologne cross, to two curved branches rising from a trunk, later replaced by a horizontal crossbar.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]]

  ## Use

  The chapel was built in 1534 to receive the crucifix, which was placed there in 1543.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]] Until 16 October 1988 the Dévot Christ was carried in the Procession de la Sanch of the penitents' confraternity; because of its poor condition a consecrated copy has since taken its place.[[source/wikipedia-fr-cathedrale-saint-jean-baptiste-de-perpignan|§ Chapelle du Dévot-Christ]]

  In the lecture it closed the series of crucifixi dolorosi that began with the Cologne forked crucifix of 1304.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62–70]]
