description_md: |-
  This Kunstschrank was assembled by Philipp Hainhofer in Augsburg about 1625–1631 and given in 1632 to King Gustav Adolf of Sweden; [[artist/ulrich-baumgartner|Ulrich Baumgartner]] did the joinery and [[artist/anton-mozart|Anton Mozart]] the paintings, among others [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 55]]. It is veneered with ebony and decorated with silver, ivory, stones and corals, stands 2.40 m high with its table and 1.20 m wide, and is in the Museum [[institution/gustavianum|Gustavianum]] in Uppsala [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 55]].

  The lecture showed it closed and open, from the front and from the back [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 55–56]]. It is crowned by a "mountain" with a ewer made of a Seychelles nut, Venus and Neptune, of Seychelles nut, silver, corals and minerals [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 57]]. Among its paintings is an alabaster panel by [[artist/johann-konig|Johann König]] with the [[artwork/konig-untergang-der-agypter-im-roten-meer|drowning of the Egyptians in the Red Sea]], painted in oil [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 58]].

  The cabinet was shown as the most complete example of the cabinet as a Kunstkammer in miniature, beside a view of the Kunstkammer of Francesco Calzolari in Verona (1622) and [[artist/frans-francken-the-younger|Frans Francken the Younger]]'s painting of a [[artwork/francken-kunstkammer-1618|Kunstkammer]] with artificialia and naturalia (1618) [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 59–61]]. As Jeffrey Chipps Smith puts it, in such cabinets "the microcosm of the Kunstkammer had been reduced still further, becoming here a world inside of a single cabinet": the viewer activates it by opening doors and drawers, searching for hidden compartments and moving the cabinet to learn how it opens, so that "the furniture can be as marvelous as the contents" [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 63]].
