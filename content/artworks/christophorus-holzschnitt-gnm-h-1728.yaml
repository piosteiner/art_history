description_md: |-
  This South German woodcut of St Christopher, made about 1430/40, is coloured by hand and measures 15.9 × 12.3 cm; the sheet has been trimmed [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 14]]. It is in the [[institution/germanisches-nationalmuseum|Germanisches Nationalmuseum]] in Nuremberg (inv. H 1728) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 14]].

  The lecture opened its session on printmaking with this sheet and other early single-leaf prints [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 14–16]]. Printing images and texts from cut wooden blocks had been practised in China since the seventh century and was later taken up in Korea and Japan; in western Europe wooden blocks were used to print figurative images on paper from about 1400, with the German-speaking lands as the centre, and the genre of the single-leaf print (Einblattdruck) emerged, preceded by the printing of textiles with wooden blocks [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]]. Such religious prints served above all private prayer and could be kept loose or pasted into manuscripts [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 18]].
