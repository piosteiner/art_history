description_md: This walnut relief on the left leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the Annunciation to the shepherds and the Nativity of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 90]] The left leaf tells the birth and childhood of Christ after the Gospel of Matthew.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]][[source/wikipedia-de-st-maria-im-kapitol|§ Holztür]] According to the painted tituli the Annunciation to the shepherds originally came before the Nativity; the second and third panels of the left leaf were rearranged at some point.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Anordnung und Verlust]]
