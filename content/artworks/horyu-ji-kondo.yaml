description_md: The [[kondo]] of Hōryūji, with the pagoda the oldest building of the temple, completed perhaps by 680 when the temple was rebuilt after the fire of 670. A double roof of square rafters on bracket arms carved like clouds; inside, an altar platform with the [[artwork/horyu-ji-shaka-triad]], the [[artwork/horyu-ji-kondo-yakushi]] and the [[artwork/horyu-ji-kondo-four-heavenly-kings]], and on the walls the [[artwork/horyu-ji-kondo-murals]]. [[source/history-of-japanese-art|p. 63, fig. 69]]
