description_md: |-
  Futurist [[movement/aeropittura]] against the genres of still life — landscapes, still lifes and nudes as carriers of ideology [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]].

  ## The work

  *Eroi macchine ali contro nature morte* (*Heroes, Machines, Wings against Still Lifes*) is by [[artist/renato-righetti|Renato Di Bosso]] and [[artist/alfredo-ambrosi|Alfredo G. Ambrosi]] and dates from 1942 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]]. According to Italian Wikipedia it was a booklet (*opuscolo*) in which the two artists renewed the Futurist critique of still life as a genre [[source/wikipedia-it-renato-righetti|§ Biografia]]. Both were aeropainters; the critic Enrico Crispolti counted Ambrosi among the painters of an "aeronautical documentarism that comes dizzyingly close to direct celebration of machinery" [[source/wikipedia-en-aeropittura|§ Origins]].

  ## Genres as ideology

  The seminar showed the work under the heading "Landscape, still lifes and nudes", beside [[artwork/thorak-the-family|*The Family*]] by [[artist/josef-thorak|Josef Thorak]] in the German Pavilion at the Paris exhibition of 1937 and a Soviet painting by [[artist/boris-yakovlev|Boris Iakovlev]], *Transport returns to normal* (1923) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20]]: under the totalitarian regimes even landscapes, still lifes and nudes carried ideological values [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. Against the quiet genre of the still life the Futurists set heroes, machines and wings — the cult of the machine that Monica Cioli calls a pillar of the movement [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 52]].
