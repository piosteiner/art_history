public_id: 107953
title: Saké bottle with phoenix and paulownia design
creator: sakaida-kakiemon
created: second half of the 17th century
created_span: uncertain
kind: bottle
medium: Porcelain with overglaze enamels
materials: [Kakiemon ware]
dimensions: [32.2]
institution: seikado-bunko-art-museum
description_md: "A fine example of [[kakiemon-ware]]: a phoenix in mid-flight, its tail feathers echoing the swelling body of the vessel, over clusters of paulownia leaves and flowers. The paulownia was the crest (mon) of several samurai families, and the bottle may have been made on commission for a daimyo or a wealthy merchant. [[source/history-of-japanese-art|pp. 294–295, fig. 336]]"
