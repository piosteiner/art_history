  At the German Pavilion of the [[event/paris-international-exposition-1937]], which faced the Soviet one with [[artwork/worker-and-kolkhoz-woman]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 13, 20]].

  ## Description and setting

  [[artist/josef-thorak|Josef Thorak]]'s *Familie* (The Family) and its companion *Kameradschaft* (Comradeship) were figural groups 23 feet high outside the German pavilion at the Paris World's Fair of 1937; *Comradeship* showed two nude men clasping hands, standing side by side "in a pose of racial camaraderie" [[source/wikipedia-en-josef-thorak|§ Works]]. Thorak was then, with [[artist/arno-breker|Arno Breker]], one of the two "official sculptors" of the Third Reich [[source/wikipedia-en-josef-thorak|§ Career]].

  ## In the seminar

  The seminar "Art and Totalitarianism" showed the group under the theme "Landscape, still lifes and nudes" — genres which, the class notes say, carried ideological values [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 20; class notes, 24 September 2024]]. The German and the Soviet pavilions in Paris stood exactly opposite each other: both tried to show their superiority but in fact showed the same [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]]. The slides quote Gino Severini on the Soviet pavilion: "One was struck at once, in looking at the whole, by the obvious intention of making size, of making immense pompous size. The same gloomy rhetoric was also to be found in the German Pavilion which stood exactly opposite the Russian" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 13]].
