description_md: "[[person/benito-mussolini]] as a mask, in Carrara marble on a slab of green marble; the first version, in plaster, was shown on 28 October 1923, the first anniversary of the [[event/march-on-rome]], and versions followed until 1928, one of them acquired by the Galleria d'Arte Moderna, Milan [[source/manchester-wildt-maschera-di-mussolini]]. On the slide \"Dux, 1923\", a topic for the seminars: Wildt and the representations of Mussolini [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]."
