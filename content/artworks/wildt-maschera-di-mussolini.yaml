description_md: |-
  [[person/benito-mussolini|Benito Mussolini]] as a mask, carved by [[artist/adolfo-wildt|Adolfo Wildt]] in Carrara marble and set on a slab of green marble; the first version, in plaster, was shown on 28 October 1923, the first anniversary of the [[event/march-on-rome|March on Rome]], and versions followed until 1928, one of them acquired by the Galleria d'Arte Moderna, Milan [[source/manchester-wildt-maschera-di-mussolini]]. The March had taken place on 28 October 1922; two days later the King appointed Mussolini prime minister [[source/wikipedia-en-march-on-rome|§ Introduction]]. The anniversary was one of the days of the Fascist calendar that gave public time a "mythic" meaning [[source/antliff-2002|p. 162]].

  The mask was made by a sculptor known for marble surfaces of a smoothness that lends his busts purity and plastic integrity alongside an almost frenzied dramatic feeling, in a manner shaped by the Secession and by Art Nouveau [[source/wikipedia-en-adolfo-wildt|§ Artwork]]. On a seminar slide it appears as "Dux, 1923", for the topic "Adolfo Wildt and the representations of Mussolini" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. Images of the leader were produced to spread his likeness through society — the first theme of totalitarian art in the seminar [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]].
