description_md: "One of fifteen hanging scrolls illustrating Genshin’s Essentials of Salvation (Ōjō yōshū), with excerpts in small rectangles at the top — [[rokudo-e]]. The impurity of the human realm is shown in a woman’s body: newly laid out on a straw mat, then swollen, then decaying under a maple, and at last picked by birds and animals. Yamato-e in flavour; other scrolls are in a Chinese ink style. Dated to the thirteenth century from their styles and repairs, the first in 1313. [[source/history-of-japanese-art|p. 210, fig. 243]]"
