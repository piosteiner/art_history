description_md: The pair Goya painted in 1814, after the French had left Madrid, of the uprising of 2 May 1808 and the executions that followed it on the night to 3 May. The Prado lists them in its series *Escenas de la Guerra de la Independencia* as *El Dos de Mayo de 1808 en Madrid*, (1) and (2).
