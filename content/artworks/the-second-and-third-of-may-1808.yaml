description_md: "The pair Goya painted in 1814, after the war, most likely once Ferdinand VII was back in Madrid that May[[source/prado-el-3-de-mayo-de-1808|„indican que fueron financiados por Fernando VII y por lo tanto pintados para las salas de Palacio, casi con seguridad, después de mayo de 1814, cuando el rey regresó a Madrid“]], of the uprising of 2 May 1808 and the executions that followed it on the night to 3 May[[source/prado-el-3-de-mayo-de-1808|„el violento ataque del pueblo de Madrid a las tropas de Murat en la mañana del 2 de mayo y la consiguiente represalia del ejército francés“ · „las ejecuciones de la noche y la lluviosa madrugada del 3 de mayo“]]. The Prado lists them in its series *Escenas de la Guerra de la Independencia* as *El Dos de Mayo de 1808 en Madrid*, (1) and (2)[[source/prado-el-3-de-mayo-de-1808|tags: „Escenas de la Guerra de la Independencia, El Dos de Mayo de 1808 en Madrid, (2)“ · „Goya pintó solamente dos cuadros con los hechos del 2 de mayo de 1808 y no cuatro“]]."
