description_md: |-
  Vladimir Tatlin's design for a *Monument to the Third International*, shown as a model in Moscow in 1920 [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 29]], is the best-known monument project of the first Soviet years; it was never built [[source/wikipedia-en-tatlin-s-tower|introduction]].

  ## Commission and programme

  The project belonged to the Lenin Plan for Monumental Propaganda, which followed the [[event/decree-on-the-monuments-of-the-republic|decree "On the monuments of the republic"]] of 12 April 1918 [[source/kalashnikov-2023|pp. 16–17]]. Tatlin's design was originally conceived as a Monument to the Russian Revolution and was commissioned as part of that plan [[source/kalashnikov-2023|p. 17]]. The change of name expressed the hope of a global communist transformation rather than a commemoration of the Revolution [[source/kalashnikov-2023|pp. 17–18]]. The tower was to straddle the banks of the Neva in Petrograd and to house the headquarters of the Third International, the recently founded alliance of communist parties [[source/kalashnikov-2023|p. 17]].

  ## Design

  Kalashnikov describes it as "a fantastic pyramid of upward-spiraling steel girders supporting three rotating glass volumes", 300 metres high, to be fitted with radio transmitters, figure projectors, a telegraph exchange and a printing press [[source/kalashnikov-2023|p. 17]]. Wikipedia gives the height of its twin helix as 400 metres and lists iron, glass and steel as its materials [[source/wikipedia-en-tatlin-s-tower|§ Plans]]. In that account a cube for lectures, conferences and legislative meetings was to turn once a year, a pyramid for the executive once a month, and a cylinder for an information centre, sending out news and manifestos by telegraph, radio and loudspeaker, once a day, with a hemisphere for radio equipment at the top [[source/wikipedia-en-tatlin-s-tower|§ Plans]]. A projector was even to cast messages onto the clouds on overcast days [[source/wikipedia-en-tatlin-s-tower|§ Plans]].

  ## A monument against monuments

  Tatlin saw his creation as a programmatic challenge to the traditional understanding of monuments; Vladimir Mayakovsky hailed it as "the first monument without a beard" [[source/kalashnikov-2023|p. 17]]. Because of its functionalism, its hyper-modernist aesthetic and its "monumental antimonumentalism", scholars still ask whether it was rather an object "commemorating the future" [[source/kalashnikov-2023|p. 17]]. Instead of historicising the Revolution it expressed the limitless technological possibilities of tomorrow [[source/kalashnikov-2023|p. 18]]. The critic Viktor Shklovsky is said to have called it a monument "made of steel, glass and revolution" [[source/wikipedia-en-tatlin-s-tower|§ Evaluations]]. Boris Groys counts Tatlin, with Rodchenko, among the constructivists who perceived the work of art as a mere "thing" signifying nothing [[source/groys-1994|p. 149]], and quotes his claim that the artist's way lies "neither toward the new, nor toward the old, but toward the necessary" [[source/groys-1994|p. 152]].

  On the surface the tower foreshadowed the [[artwork/palace-of-the-soviets|Palace of the Soviets]]: both fused the functions of a government centre with a commemorative mission [[source/kalashnikov-2023|p. 17]]. In the seminar the model stood beside Iofan's project of 1937 — the avant-garde's utopia beside Stalin's monumentality [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 29]].

  ## Never built

  The tower was never seriously expected to be built and remained a pipe dream; the young regime, with a country at war and an economy in tatters, spent only meagre resources on monuments [[source/kalashnikov-2023|pp. 18–19]]. Wikipedia also notes serious doubts whether the steel it needed could have been found in bankrupt post-revolutionary Russia [[source/wikipedia-en-tatlin-s-tower|§ Evaluations]]. In Soviet architectural practice the project remained an outlier [[source/kalashnikov-2023|p. 19]].

  ## Afterlife

  A draft design of 1920 was reproduced by [[artist/el-lissitzky|El Lissitzky]] in *Russland: die Rekonstruktion der Architektur in der Sowjetunion* (Vienna, 1930) [[source/kalashnikov-2023|p. 18]]. Models stand in the Moderna Museet in Stockholm, the [[institution/tretyakov-gallery|Tretyakov Gallery]] and the Centre Pompidou; a 1:42 model was built at the [[institution/royal-academy-of-arts|Royal Academy of Arts]] in London in 2011 and set up at the Sainsbury Centre in Norwich in 2017 [[source/wikipedia-en-tatlin-s-tower|§ Models]]. A Russian stamp of 2000 put it beside [[artwork/worker-and-kolkhoz-woman]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 30]].
