description_md: "The model for Tatlin's *Monument to the Third International*, Moscow 1920, beside [[artwork/palace-of-the-soviets]] (1937): the avant-garde's utopia and Stalin's monumentality [[source/beatrice-marinho-2024-art-and-totalitarianism|slide 29, 24 September 2024]]. A Russian stamp of 2000 put it beside [[artwork/worker-and-kolkhoz-woman]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 30]]."
