provenance:
  - owner: person/ludovico-sforza
    acquired: 1494
    method: commission
    place: milan
    label: commissioned by Ludovico il Moro for the refectory of the Dominican convent of Santa Maria delle Grazie, which he had chosen as the Sforza family's church; painted “a secco” 1494–1498
    sources:
      - url: https://it.wikipedia.org/wiki/Ultima_Cena_%28Leonardo%29
        note: realizzato su commissione di Ludovico il Moro nel refettorio del convento adiacente al santuario di Santa Maria delle Grazie a Milano. […] Ludovico il Moro, il quale aveva infatti eletto la chiesa domenicana di Santa Maria delle Grazie a luogo di celebrazione della casata Sforza.
        source: wikipedia-it-ultima-cena
        accessed: 2026-10-20
  - owner: institution/santa-maria-delle-grazie
    acquired: 1498
    place: milan
    label: on the wall of the friars' refectory
    sources:
      - url: https://it.wikipedia.org/wiki/Ultima_Cena_%28Leonardo%29
        note: nel refettorio del convento adiacente al santuario di Santa Maria delle Grazie a Milano
        source: wikipedia-it-ultima-cena
        accessed: 2026-10-20
  - owner_label: Napoleonic troops
    role: event
    acquired: early 19th century
    place: milan
    label: the refectory turned into a bivouac and a stable
    sources:
      - url: https://it.wikipedia.org/wiki/Ultima_Cena_%28Leonardo%29
        note: All'inizio del XIX secolo le truppe napoleoniche trasformarono il refettorio in bivacco e stalla.
        source: wikipedia-it-ultima-cena
        accessed: 2026-10-20
  - owner_label: the bombing of Milan
    role: event
    acquired: 1943-08
    place: milan
    label: the convent bombed — the refectory's vault destroyed; the Last Supper survived among the rubble behind sandbags, open to the weather for days
    sources:
      - url: https://it.wikipedia.org/wiki/Ultima_Cena_%28Leonardo%29
        note: "Danni ancora più gravi vennero causati durante la seconda guerra mondiale, quando il convento venne bombardato nell'agosto del 1943: venne distrutta la volta del refettorio, ma il Cenacolo rimase salvo tra cumuli di macerie, protetto solo da un breve tetto e da una difesa di sacchi di sabbia"
        source: wikipedia-it-ultima-cena
        accessed: 2026-10-20
  - owner_label: Italian Ministry of Culture (Museo del Cenacolo Vinciano)
    role: custodian
    acquired: 2014-12
    place: milan
    label: the Ministry runs the Museo del Cenacolo Vinciano through the Polo museale della Lombardia (since December 2019 the Direzione regionale Musei)
    sources:
      - url: https://it.wikipedia.org/wiki/Ultima_Cena_%28Leonardo%29
        note: Dal dicembre 2014 il Ministero per i beni e le attività culturali gestisce il Museo del Cenacolo Vinciano tramite il Polo museale della Lombardia, nel dicembre 2019 divenuto Direzione regionale Musei.
        source: wikipedia-it-ultima-cena
        accessed: 2026-10-20
