description_md: |-
  The bottom field of the left leaf of the [[artwork/bernwardstur|Bernward door]] (around 1015) shows the murder of Abel and God questioning Cain.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 40]] It closes the left leaf's Old Testament sequence, which runs from the creation downwards to the fratricide.[[source/wikipedia-de-bernwardstur|§ Ikonografie]] The figure of Cain is singled out for its expression: he looks up with frightened, wide-open eyes to the hand of God in the sky and holds his cloak protectively in front of his body.[[source/wikipedia-de-bernwardstur|§ Figuren]]

  Opposite it, in the bottom field of the right leaf, is the Annunciation, with which the Christ cycle begins; the lecture listed the two as a typological pair.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 51]] The lowest pair thus joins the end of the story of the Fall with the beginning of the story of redemption.[[source/wikipedia-de-bernwardstur|§ Ikonografie]]
