description_md: "Velázquez painted the scene in 1656 in the Cuarto del Príncipe of the Alcázar in Madrid[[source/prado-las-meninas|„Gracias a Palomino sabemos que se pintó en 1656 en el Cuarto del Príncipe del Alcázar de Madrid, que es el escenario de la acción“]]: the Infanta Margarita with her maids of honour, dwarfs and a mastiff, the painter himself at a large canvas, and in the mirror the faces of Philip IV and Mariana of Austria[[source/prado-las-meninas|„En el espejo se ven reflejados los rostros de Felipe IV y Mariana de Austria, padres de la infanta y testigos de la escena“]]. Antonio Palomino devoted a section of his lives of Spanish painters (1724) to it alone[[source/prado-las-meninas|„el cuadro se convirtió en la única pintura a la que el tratadista Antonio Palomino dedicó un epígrafe en su historia de los pintores españoles (1724)“]]; the name *Las Meninas* first appears in the Prado’s catalogue of 1843[[source/wikipedia-en-las-meninas|“In 1843, the Prado catalogue listed the work for the first time as Las Meninas”]]."
