title: Sketch for The Seven Fortunes and Misfortunes
creator: maruyama-okyo
created: 1768
kind: handscroll
medium: Ink on paper
materials: [ink, paper]
dimensions: [31]
institution: manno-art-museum
description_md: "A preparatory sketch for the three scrolls (about 45 m long) commissioned in 1768 by Yūjō, abbot of Enmanin in Ōtsu, to show the blessings and evils of life — he wanted real-life phenomena rather than fantastic tales of heaven and hell. [[artist/maruyama-okyo]] (1733–1795), the founder of the [[movement/maruyama-school]], looked for actual examples even of the most unusual scenes: a naked man torn apart by two bulls with their tails set afire. [[source/history-of-japanese-art|pp. 320–321, fig. 371]]"
