title: First and Second Visits to the Red Cliffs
creator: sakaki-hyakusen
created: 1746
kind: byōbu
medium: Pair of six-panel screens, ink on paper
materials: [ink, paper]
dimensions: [161.5, 368]
dimensions_note: each screen
institution: hayashibara-museum
description_md: "A pair of screens by [[artist/sakaki-hyakusen]] (1697–1752), of a Nagoya pharmacy family of Chinese descent: the poet Su Dongpo’s two excursions to the Red Cliffs of the Yangzi in 1082 — a pleasant autumn boat trip, and the late visit in frost, when he climbs the cliffs alone, sees a crane and dreams of an immortal. James Cahill has noted how close it is to the literati painting of Suzhou. [[source/history-of-japanese-art|pp. 328–329, fig. 383]]"
