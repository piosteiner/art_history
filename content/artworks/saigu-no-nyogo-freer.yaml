description_md: From a picture scroll of the thirty-six immortal poets ([[otoko-e]] portraits of the early Kamakura period). The empress’s name and biography are written in “standard cursive” characters, followed by one of her poems in hiragana in running-grass script; she sits behind a curtain of state in many-layered robes, leaning to the edge of her dais beside a black lacquer writing box — the position in which Heian ladies composed poetry, diaries and novels. [[source/history-of-japanese-art|p. 111, fig. 137]]
