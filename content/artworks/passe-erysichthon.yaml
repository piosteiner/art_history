description_md: |-
  An engraving by [[artist/crispijn-van-de-passe-the-elder|Crispijn van de Passe]] for an edition of Ovid's *Metamorphoses*, made in 1602–1607: Erysichthon fells the tree of Demeter/Ceres.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 65]] The impression is in the Rijksmuseum, Amsterdam.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 65]]

  ## The story

  In Ovid's version Erysichthon orders all the trees in the sacred grove of Ceres to be cut down.[[source/wikipedia-en-erysichthon-of-thessaly|§ Ovid]] One huge oak is covered with votive wreaths, each a sign of a prayer Ceres had granted, and his men refuse to cut it; Erysichthon takes the axe himself and fells it, killing the dryad who lives in the tree.[[source/wikipedia-en-erysichthon-of-thessaly|§ Ovid]] Her dying words are a curse, and Ceres answers it by sending Fames, insatiable hunger, into his stomach: the more he eats, the hungrier he becomes, until he has sold everything, even his daughter Mestra, and at last devours himself.[[source/wikipedia-en-erysichthon-of-thessaly|§ Ovid]] The older version in Callimachus' hymn to Demeter sets the story in a grove planted by the Pelasgians, where Erysichthon attacks a great poplar with twenty men armed with double axes and hatchets; Demeter, disguised as her priestess Nikippe, warns him in vain.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 61]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 62]]

  ## In the lecture

  The lecture "Aus dem Wald" set the engraving beside [[artwork/solis-erysichthon|Virgil Solis's woodcut]] of the same subject, printed in 1569, in its section on sacrilege against trees in the sacred grove.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 64]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 65]] Callimachus' core message, that trees in sacred groves were not to be touched, corresponds to inscriptions from the 5th century BCE into the Imperial period forbidding the felling of trees and the cutting of branches in groves.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 63]] Greek myth gave such trees inhabitants: the hamadryads, nymphs whose lives were coterminous with their tree, died when it was cut down.[[source/cusack-2011-the-sacred-tree|p. 46]]
