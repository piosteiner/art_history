description_md: "One of twelve hanging scrolls painted by [[artist/sakai-hoitsu]] (1761–1828) at sixty-two: four autumn plants under a pale harvest moon, so subtly placed that a slight breeze seems to touch them. Hōitsu, born into the daimyo family of Himeji, became a priest in 1797 and from 1810 revived Kōrin’s style, publishing his Hundred Paintings by Kōrin for the centenary of his death in 1815. [[source/history-of-japanese-art|pp. 316–317, fig. 368]]"
