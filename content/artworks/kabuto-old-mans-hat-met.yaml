description_md: "A [[kabuto]] in the whimsical shape of an old man’s cloth cap, made of gilded iron and fronted by a three-pronged flame bearing an image of Fudō Myōō. Whom it was made for is unknown, but the message is clear: the wearer has nothing of an old man’s weakness. [[source/history-of-japanese-art|p. 253, fig. 291]]"
