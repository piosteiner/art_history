description_md: |-
  A memorial to the [[comfort-women]], the girl seated beside an empty chair, set up opposite the Japanese embassy in [[place/seoul]] on 14 December 2011 for the 1000th Wednesday demonstration, the weekly protest demanding Japan's apology and compensation.[[source/won-2016-kim-seo-kyung-kim-eun-sung]] It was made by [[artist/kim-seo-kyung]] and [[artist/kim-eun-sung]] in about nine months of discussion with the Korean Council for the Women Drafted for Military Sexual Slavery by Japan.[[source/wikipedia-ko-kim-eun-sung]] The design began as a memorial stone; Kim Seo-kyung chose a girl of the age the women had been when they were taken. The cropped hair stands for the ties cut against her will, the bird on her left shoulder for a link with the dead, the raised heels for a life never at rest — twelve such signs in all; the empty chair is for the grandmothers who have died and a place for those who stand by them.[[source/won-2016-kim-seo-kyung-kim-eun-sung]]

  By August 2016 the couple had set up 29 further statues in Korea and 4 abroad,[[source/won-2016-kim-seo-kyung-kim-eun-sung]] by 2019 some 80.[[source/kim-2019-press-freedom-monument]] People put scarves on the girl in the cold and hold umbrellas over her in the rain; when the governments argued in 2015–16 whether its removal had been agreed, students camped beside it through the winter.[[source/won-2016-kim-seo-kyung-kim-eun-sung]]
