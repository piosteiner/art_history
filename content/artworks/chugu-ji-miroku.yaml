description_md: "[[miroku]] as a bodhisattva seated with one leg pendant, the right hand raised to the face in thought: the Future Buddha meditating in his paradise. Chūgūji was the residence of Prince Shōtoku’s mother and became a convent; the softly modelled face and torso and the natural pose show the Hakuhō relaxing of the Wei style. [[source/history-of-japanese-art|p. 79, fig. 96–97]]"
