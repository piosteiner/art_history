description_md: A tall slender [[kannon]] of camphor wood, the drapery barely cut into the surface, the scarves at its feet curving forward; it holds a water jar. Kudara is another name for Paekche, and the statue was long thought Korean, but its woods are Japanese. [[source/history-of-japanese-art|p. 79, fig. 95]] A full-size copy made in the 1920s, in the British Museum, shows how Paekche wooden sculpture would have looked; Portal points to its Paekche features — the gently smiling face, flaming mandorla, openwork crown and double-veined lotus petals. [[source/portal-2000|p. 52, fig. 27]]
