description_md: "One of the most starkly realistic portraits of the period, probably made shortly after [[person/chogen]]’s death in 1206 for memorial services in his honour. An old man sits hunched forward, reciting the nenbutsu as he counts the beads of his rosary: prominent cheekbones, wrinkled flesh, pursed lips, eyes deep under bony brows — one opened slightly wider than the other — and the thick fingers of a man used to manual labour. [[hinoki-wood]] in [[yosegi-zukuri]], flesh tones for the head and black for the robe. No sculptor is recorded; perhaps one of the Kei masters. [[source/history-of-japanese-art|pp. 185–186, fig. 215]]"
