  - owner: person/lorenzo-il-magnifico
    method: inheritance
    direct: true
    place: florence
    label: probably the large tondo by "fra Giovanni" valued at 100 florins in his bedroom in the inventory after his death (copy of 23 December 1512)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41581.html
        note: by inheritance to Lorenzo de' Medici [1449-1492], Florence.[1] — [1] The inventory drawn up after the death of Lorenzo the Magnificent is known today from a copy made on 23 December 1512 … "Nella chamera grande terrena detta chamera di Lorenzo...uno tondo grande...la nostra Donna e nostro Signore e e' Magi che vanno a offerire, di mano di fra Giovanni, f. 100"
        source: nga-1952-2-2
        accessed: 2026-11-24
  - owner: person/piero-guicciardini
    place: florence
    label: possibly from the Medici through his father Agnolo Guicciardini (1506–1581)
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41581.html
        note: probably Marchese Piero Guicciardini [1569-1626];
        source: nga-1952-2-2
        accessed: 2026-11-24
  - owner: person/simona-machiavelli
    method: inheritance
    direct: true
    place: florence
