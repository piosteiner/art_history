  - owner: person/francesco-guicciardini-2
    co_owners: [person/ferdinando-guicciardini]
    acquired: 1803
    method: inheritance
    direct: true
    place: florence
    label: given possession of their inheritance while their parents were still living; Guicciardini gallery inventory of 1 September 1807
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41581.html
        note: by inheritance to his sons, Count Francesco [1776-1838] and Colonel Ferdinando [1782-1833] Guicciardini, Florence, in 1803;[3] — [3] … Francesco and Ferdinando were "emancipati" and given possession of their inheritance in 1803, while their parents were still living.
        source: nga-1952-2-2
        accessed: 2026-11-24
  - owner: person/francois-honore-dubois
    acquired: 1810-07
    method: purchase
    direct: true
    place: florence
    label: as by Botticelli; bought the entire Guicciardini gallery at about two-thirds of its assessed value (tondo valued at 50 zecchini); police commissioner of Napoleonic Florence
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41581.html
        note: sold July 1810 to Chevalier François-Honoré Dubois, Florence and Paris, as by Botticelli.[4] — [4] … was transformed into a bill of sale when "M. Dubois" bought the entire contents (at about two-thirds assessed value) in July 1810. The two tondi were valued at 50 zecchini each.
        source: nga-1952-2-2
        accessed: 2026-11-24
  - owner: person/samuel-woodburn
    role: dealer
    acquired: 1826 or earlier
    place: london
    label: as by Fra Angelico; private-treaty sale catalogue of 25 March 1826, no. 1, probably unsold; perhaps acquired directly from Dubois
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41581.html
        note: (Samuel Woodburn, London), by 1826, as by Fra Angelico.[5] — [5] … a 25 March 1826 private-treaty sale catalogue of the stock of Messrs. Woodburn … two Adoration of the Magi tondi, both with a Guicciardini provenance, attributed to Fra Angelico (no. 1) and Botticelli (no. 2)
        source: nga-1952-2-2
        accessed: 2026-11-24
