description_md: "A votive painting ([[ema]]) dedicated in 1797 at the Itsukushima Shrine by [[artist/nagasawa-rosetsu]] (1754–1799), Ōkyo’s troublesome pupil: the mountain woman as an old, ugly court lady in tattered garments once gorgeous, the child more monkey than infant — a cynical view of the reality behind tender maternal care. [[source/history-of-japanese-art|pp. 322–323, fig. 374]]"
