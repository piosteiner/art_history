provenance:
  - owner: person/shimadachi-sadanaga
    acquired: 1504
    method: creation
    place: matsumoto
    label: built Fukashi Castle, the forerunner of Matsumoto Castle, according to tradition
    certainty: probable
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1504（永正元） 島立右近貞永が深志城を築くと伝える。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Takeda clan
    acquired: 1550
    ended: 1582
    place: matsumoto
    label: Takeda Shingen invades Fukashi, Ogasawara Nagatoki flees; Takeda rule with a castellan for 32 years
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1550（天文19） 武田信玄が深志へ攻め込む。小笠原長時は深志から逃れる。武田氏が深志城の改修に着手する。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/kiso-yoshimasa
    acquired: 1582
    place: matsumoto
    label: enters Fukashi Castle after Oda Nobunaga destroys the Takeda
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1582（天正10） 織田信長軍が武田勝頼をやぶり、武田家が滅びる。 深志城に木曽義昌が入る。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/ogasawara-dosetsu
    acquired: 1582
    place: matsumoto
    label: enters the castle with the backing of Uesugi Kagekatsu
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: その後上杉氏の後ろ盾で小笠原洞雪が入る。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/ogasawara-sadayoshi
    acquired: 1582
    ended: 1590
    place: matsumoto
    label: drives out Dōsetsu, renames Fukashi Matsumoto; moves to Koga with his son Hidemasa in 1590
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 小笠原貞慶が洞雪を追い出して、深志を松本と改称し、城郭と城下町の整備に取り組む。 1590（天正18） 小笠原貞慶・秀政が古河へ移る。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/ishikawa-kazumasa
    acquired: 1590
    method: transfer
    place: matsumoto
    label: made lord of Matsumoto Castle by Toyotomi Hideyoshi
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 豊臣秀吉は石川数正を松本城主とする。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/ishikawa-yasunaga
    acquired: 1592
    ended: 1613
    method: inheritance
    place: matsumoto
    label: builds the keep (tenshu), probably 1594–1599; attainted in 1613 over the Ōkubo Nagayasu affair
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 康長（やすなが） 文禄元～慶長18（1613） … 1613（慶長18） 石川康長が大久保長安事件に連座して改易になる。
        source: matsumoto-castle-history
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/920
        note: 天正十八年（一五九〇）この地に封ぜられた石川数正はただちに改修に着手したが、文禄二年に没したので、その子康長がこれを継ぎ、天守を築き城郭を整備した。現存の天守はこの時のもので、文禄三年（一五九四）から慶長四年（一五九九）にかけて造営されたものと思われる。
        source: kunishitei-102-920
        accessed: 2026-11-24
  - owner: person/ogasawara-hidemasa
    acquired: 1613
    ended: 1615
    method: transfer
    place: matsumoto
    label: moves from Iida; killed with his son Tadanaga at the summer campaign of Osaka, 1615
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 小笠原秀政が信濃飯田から松本へ入る。 … 1615（慶長20） 小笠原秀政・忠脩親子が大坂夏の陣で戦死する。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/ogasawara-tadamasa
    acquired: 1615
    ended: 1617
    method: inheritance
    place: matsumoto
    label: Ogasawara Tadamasa (later Tadazane); moved to Akashi in Harima
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 忠政（ただまさ） ［忠真（ただざね）］ 元和元（1615）～元和3（1617）
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Toda family (Toda Yasunaga, Toda Yasunao)
    acquired: 1617
    ended: 1633
    method: transfer
    place: matsumoto
    label: Toda Yasunaga moves from Takasaki (1617–1632), followed by Yasunao (1633)
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 戸田氏 康長（やすなが） 元和3～寛永9（1632） 康直（やすなお） 寛永10（1633）
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/matsudaira-naomasa
    acquired: 1633
    ended: 1638
    method: transfer
    place: matsumoto
    label: adds the Tatsumi annex turret and the moon-viewing turret (Tsukimi yagura) to the keep
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1633（寛永10） 松平直政が松本城主となり、以後辰巳附櫓や月見櫓を天守に増設したり、城内外を整備したりする。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: person/hotta-masamori
    acquired: 1638
    ended: 1642
    method: transfer
    place: matsumoto
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 堀田氏 正盛（まさもり） 寛永15～寛永19（1642）
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Mizuno family
    acquired: 1642
    ended: 1725
    method: transfer
    place: matsumoto
    label: six lords from Mizuno Tadakiyo to Tadatsune; attainted after Tadatsune's sword attack in Edo Castle
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 水野氏 忠清（ただきよ） 寛永19～正保4（1647） … 1725（享保10） 水野忠恒が江戸城内で刃傷事件を起こし、水野家は改易になる。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/tokugawa-shogunate
    acquired: 1725
    ended: 1726
    method: confiscation
    place: matsumoto
    label: taken back by the shogunate; received and held for it by the Sanada of Matsushiro
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 松本城は幕府が収公し、松代の真田氏が城を受けとり預かる。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner_label: Toda family
    acquired: 1726
    ended: 1871
    method: transfer
    place: matsumoto
    label: nine lords from Toda Mitsuchika to Toda Mitsuhisa, the last, who left for Tokyo after the abolition of the domains
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 1726（享保11） 戸田氏が再び松本へ入る。 … 同4年7月に、廃藩置県で松本藩は松本県となり、8月には城主・藩知事であった戸田氏は東京へ移っていきました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/ministry-of-war-hyobusho
    acquired: 1871-10
    method: transfer
    place: matsumoto
    label: main bailey and keep handed over by Matsumoto Prefecture to the Ministry of War
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 松本城本丸・天守は明治4年（1871）10月に松本県から兵部省へ引き渡されました。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1872
    place: matsumoto
    label: keep offered for sale by tender; knocked down for 235 ryō 1 bu 150 mon (Shinpi Shinbun no. 1, October 1872), but not demolished
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 明治5年10月の「信飛新聞」第1号には 「 松本城内天守櫓入札御払下ケ仰セ出サレ代金二百三十五両一分永百五十文ニテ落札相成タリ 」 との記事があります。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner: person/ichikawa-ryozo
    role: custodian
    acquired: November 1873 or earlier
    ended: 1876
    place: matsumoto
    label: asked Chikuma Prefecture to lend him the main bailey and keep for exhibitions, offering the bid money raised with supporters; five exhibitions held in the keep 1873–1876
    certainty: probable
    sources:
      - url: https://www.matsumoto-castle.jp/value/citizens
        note: 「 落札金員三百三十余両ハ、同志ヲ募リ献納イタシ、併セテ地租等モ相納可申候間、自今十ヶ年右破却ノ命ヲ弛、拝借被仰付様仕度 」 と本丸・天守の借り受けを申し出ています。 この結果、博覧会は明治6年11月の第1回を皮切りに、明治9年まで天守をつかって5回開催されています。
        source: matsumoto-castle-citizens
        accessed: 2026-11-24
  - owner: institution/matsumoto-nojikai-matsumoto-agricultural-society
    role: custodian
    acquired: 1880
    place: matsumoto
    label: society of 50 men of Azumi and Chikuma districts; rented the main bailey, keep and storehouse as a trial ground for fruit and vegetables; returned when the main bailey became the middle school's grounds
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 明治13年（1880）に安曇郡・筑摩郡の有志50人によって松本農事会が組織されました。この会は、農業試験場にあてる目的で松本城本丸と天守および附属の官庫を借りいれ、果樹蔬菜（野菜）の新種を試験栽培し会員に配布しました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: institution/matsumoto-middle-school
    role: custodian
    acquired: 1902
    ended: 1931
    place: matsumoto
    label: Nagano Prefectural Matsumoto Middle School used the main bailey as its grounds from 1902; the management passed from it to the city in 1931
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 明治35年には、校庭の拡張の必要から本丸庭園を中学校の校庭として使用するようにしました。 … 昭和5年（1930）に松本城が国の史跡に指定されると、これが転機となり翌6年には管理が松本中学校から松本市へ移管されました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
  - owner: place/matsumoto
    role: custodian
    acquired: 1931
    place: matsumoto
    label: City of Matsumoto manages the castle (managing body under the Cultural Properties law)
    sources:
      - url: https://www.matsumoto-castle.jp/about/history
        note: 昭和5年（1930）に松本城が国の史跡に指定されると、これが転機となり翌6年には管理が松本中学校から松本市へ移管されました。
        source: matsumoto-castle-history
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/920
        note: 管理団体・管理責任者名 ： 松本市
        source: kunishitei-102-920
        accessed: 2026-11-24
  - owner: institution/ministry-of-education-culture-sports-science-and-technology
    place: matsumoto
    label: owned by the State of Japan (Ministry of Education, Culture, Sports, Science and Technology)
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/920
        note: 所有者名 ： 国(文部科学省) 所有者種別 ： 国 管理団体・管理責任者名 ： 松本市
        source: kunishitei-102-920
        accessed: 2026-11-24
