description_md: "The paintings of a small tomb near Asuka, found in 1972: the animals of the four directions (the Dark Warrior of the North — a tortoise with a snake — and the dragon and tiger), the sun, the moon and the constellations, and groups of men and women, among them four court ladies on the west wall. [[source/history-of-japanese-art|p. 39, fig. 42–43]]"
