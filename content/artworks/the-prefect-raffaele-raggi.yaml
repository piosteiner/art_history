  - owner: person/tommaso-raggi
    acquired: 1664 or earlier
    place: rome
    label: Marchese; Bellori's 1664 guide names many Van Dyck portraits of the Raggi family in his palazzo below the Campidoglio
    certainty: probable
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1229.html
        note: 'Probably Marchese Tomasso Raggi [c. 1597-1679], Rome, by 1664;[1] — [1] … lists: "Marchese Raggi. Palazzo sotto Campidoglio con gran numero di ritratti della famiglia Raggi, di mano di Antonio Van-Dych" … The "Marchese" mentioned here is presumably Tommaso Raggi'
        source: nga-1942-9-90
        accessed: 2026-11-24
  - owner: person/francesco-maria-balbi
    acquired: 1780 or earlier
    place: genoa
    label: possibly Ratti's 'Ritratto d'un Generale vestito d'armadura del Vandik' (1780); perhaps came to the Balbi through a Raggi marriage
    certainty: possible
    sources:
      - url: https://www.nga.gov/collection/art-object-page.1229.html
        note: "possibly Francesco Maria Balbi, Genoa, by 1780;[2] — [2] Ratti … 1780: 193, mentions a \"Ritratto d'un Generale vestito d'armadura del Vandik\" in the collection of Francesco Maria Balbi in Genoa."
        source: nga-1942-9-90
        accessed: 2026-11-24
  - owner: person/walter-rockcliffe-farquhar
    method: purchase
    label: 3rd baronet; said to have bought it from the Balbi family in Genoa (1894 Widener inventory)
