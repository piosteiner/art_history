description_md: "Painted in Rome in 1630[[source/wikipedia-en-apollo-in-the-forge-of-vulcan|“This work was created in Rome”]]: Apollo tells Vulcan, at work in his forge, that his wife Venus is deceiving him with Mars[[source/prado-la-fragua-de-vulcano|„Cuenta Ovidio en las Metamorfosis (IV) que Apolo … fue al taller del herrero de los dioses del Olimpo, Vulcano, para darle la humillante noticia de que su mujer, Venus, estaba cometiendo adulterio con el dios guerrero Marte“]]; the smiths stop to listen. Philip IV bought it for the Buen Retiro in 1634[[source/prado-la-fragua-de-vulcano|„el otro lienzo que Velázquez trajo a Madrid después de su estancia en Italia, adquirido con su pareja para las colecciones reales en 1634 y destinado al Buen Retiro“]]."
