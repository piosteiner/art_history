description_md: |-
  A Marian shrine from the Middle Rhine of around 1460, on the altar of the Sebastian chapel at Darsberg (Neckarsteinach); the sculpture measures 105 × 33 × 25 cm, the shrine 141 × 60 × 30 cm and the wings 124 × 30 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 22]]

  ## Description

  The shrine has the form of a canopy shrine with four wings.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]] Closed, the two inner wings lean against the Gothic tracery of the canopy over the Virgin as side walls, and the outer sides of the front wings show the Annunciation: on the left panel Mary kneels praying at a desk beneath the dove of the Holy Spirit.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]] Open, the wings show, before a gold ground, Saint Nicholas and Saint Catherine on the right and Saint Barbara and the chapel's patron, Saint Sebastian, on the left, each named in the halo.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]]

  In place of a central painting stands the crowned Virgin, about 1.20 m high, holding an apple in her right hand and on her left arm the naked Child, who holds a dove – the Fall and the Incarnation side by side.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]] Her mantle is patterned with gilded lozenges on a white ground; behind her two winged half-figures hold up the curtain of the Annunciation scene, so that she seems to have stepped out of the house into public view.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]] The carver and painter are unknown.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Marienschrein]]

  ## Context

  The chapel was probably built in the second half of the fifteenth century at the latest; it may even have been built for the already existing shrine, because the church in Neckarsteinach was being rebuilt.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Geschichte]] With its lords, the community turned Lutheran very early, around 1524.[[source/wikipedia-de-sebastianskapelle-darsberg|§ Geschichte]] In the lecture the shrine illustrated the "logic of the shrine" – the housing and unveiling of the holy – between the Chapelle Cardon in the Louvre and the Stavelot reliquary triptych.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 21–23, 35]]
