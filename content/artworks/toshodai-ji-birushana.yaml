description_md: "The seated [[birushana]] of the golden hall of Tōshōdaiji, the largest Buddha in dry lacquer of the Nara period, covered in gold leaf, against a halo with hundreds of small Buddhas. Stylised rather than naturalistic: short thick neck, long upturned profile. An ink inscription found in 1917 names those who made it — Mononobe Hirotari, Nuribe Otomaro and Jōfuku. [[source/history-of-japanese-art|p. 94, fig. 118]]"
