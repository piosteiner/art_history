        note: Inv. B1, Archaeological Museum of Thessaloniki. … displayed at the Archaeological Museum of Thessaloniki.
        source: wikipedia-en-derveni-krater
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Derveni-Krater
        note: Heute befindet er sich im Archäologischen Museum von Thessaloniki.
