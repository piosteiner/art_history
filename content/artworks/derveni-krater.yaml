provenance:
  - owner_label: tomb B, Derveni — burial of Astiouneios, son of Anaxagoras, of Larissa
    acquired: 4th century BCE
    label: at Derveni near Thessaloniki; used as the funerary urn of a Thessalian aristocrat whose name is engraved on it; held the burnt bones of a man and a younger woman
    sources:
      - url: https://en.wikipedia.org/wiki/Derveni_Krater
        note: "The krater was discovered buried, as a funerary urn for a Thessalian aristocrat whose name is engraved on the vase: Astiouneios, son of Anaxagoras, from Larissa."
        source: wikipedia-en-derveni-krater
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Derveni-Krater
        note: Der Krater wurde 1962 in Grab Β von Derveni entdeckt. Die Gräber von Derveni werden in die zweite Hälfte des 4. Jahrhunderts v. Chr. datiert.
        source: wikipedia-de-derveni-krater
        accessed: 2026-11-24
  - owner: institution/greek-archaeological-service
    acquired: 1962
    method: find
    label: graves found in January 1962 when the Thessaloniki–Kavala road was widened; excavated January–August 1962 under C. I. Makaronas, supervised by Petros Themelis; krater found 16 January 1962 (el)
    sources:
      - url: https://en.wikipedia.org/wiki/Derveni_Krater
        note: The Derveni Krater is a volute krater, the most elaborate of its type, discovered in 1962 in a tomb at Derveni, not far from Thessaloniki
        source: wikipedia-en-derveni-krater
        accessed: 2026-11-24
      - url: https://www.cambridge.org/core/books/derveni-papyrus/find/FD4B19F34E99503F2F95FEC033C9AA31
        note: during the widening of the national road leading from Thessalonica to Kavala … The following day another similar but even larger cist grave came to light 4.5 metres away. … undertook a systematic excavation of the graves and the surrounding area between January and August 1962 … under the direction of C. I.Makaronas and under the supervision of Petris Themelis … the stunning bronze krater with a Dionysiac scene found in tomb B
        source: betegh-2004-derveni-papyrus-the-find
        accessed: 2026-11-24
      - url: https://el.wikipedia.org/wiki/%CE%9A%CF%81%CE%B1%CF%84%CE%AE%CF%81%CE%B1%CF%82_%CF%84%CE%BF%CF%85_%CE%94%CE%B5%CF%81%CE%B2%CE%B5%CE%BD%CE%AF%CE%BF%CF%85
        note: Ο κρατήρας του Δερβενίου είναι οστεοφυλάκιο και τεφροδόχο σκεύος που ανευρέθη,στις 16 Ιανουαρίου 1962, μέσα σ΄ ένα κιβωτιόσχημο τάφο, κοντά στο Δερβένι, 9,5 χλμ. βορειοδυτικά της Θεσσαλονίκης.
        source: wikipedia-el-krateras-tou-derveniou
        accessed: 2026-11-24
  - owner: institution/archaeological-museum-of-thessaloniki
    method: transfer
    place: thessaloniki
    label: inventory B1
