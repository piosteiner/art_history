description_md: |-
  The Atlas Miller is a Portuguese atlas of 1519 in the [[institution/bibliotheque-nationale-de-france|Bibliothèque nationale de France]]; the lecture showed fol. 5r with the coast of Brazil ("Terra Brasilis") by [[artist/lopo-homem|Lopo Homem]] and Antonio da Holanda, measuring 42 × 59 cm [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 16, 19]].

  ## Brazil and brazilwood

  The map opened the lecture's section on brazilwood, the tropical wood traded for its dye in the colonial period [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 15]]. Brazilwood (Paubrasilia echinata) is a tree of the carob family, 8 to 30 m high with trunks up to 70 cm across, native to the coastal region of Brazil; its heartwood contains the red dye brasilin [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 17]]. At the end of April 1500 Pedro Álvares Cabral landed on the coast of Brazil with a royal Portuguese fleet of thirteen ships and took it for an island; he sent Gaspar de Lemos back to Lisbon to report the discovery to King Manuel, and Lemos carried a cargo of brazilwood [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 18]]. In the first decades of colonisation brazilwood was the most important raw material that the Portuguese imported from America; the trees were felled by the Indigenous population and carried to the Portuguese forts, and as the coastal forests were overexploited, the harvest moved further inland and prices rose [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 18]]. Cabral first called the land "Ilha de Vera Cruz"; under the merchant Fernão de Loronha, who directed the brazilwood trade in 1502–1512, the name "Terra do Brasil" was introduced [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 18]].

  Brasilin was known to Europeans before the "discovery" of Brazil from sappanwood (Caesalpinia sappan), a shrub or tree of India, Sri Lanka and as far as the Philippines [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 20]]. The heartwood was ground to fine powder to make a dye solution, from which red lake pigments were also produced [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 21]]. Citing Elena Phipps, the lecture stressed that the new dyestuffs transformed European textile production into the centre of a global commercial network, while their production devastated local communities and drove the Portuguese slave trade, which brought hundreds of thousands of enslaved Africans to Brazil, first to harvest and haul dyewood [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 31]].
