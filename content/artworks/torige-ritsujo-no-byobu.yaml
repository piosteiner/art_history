description_md: "One of a set of six screen panels from the Shōsōin, each with a beautiful woman standing under a tree: a full-figured court lady of Tang taste. Faces and bare skin were painted in strong colours, hair and garments drawn in ink and once covered with pasted pheasant feathers. Dated by a scrap of paper of 752 in the backing of one panel; Chinese in style and subject but thought to be by a Japanese artist. [[source/history-of-japanese-art|p. 49, fig. 51]]"
