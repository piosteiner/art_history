description_md: |-
  The triumphal-cross group in the former church of the Augustinian canons, Heilig Kreuz, at Wechselburg in Saxony, carved in oak around 1230/35; the cross is 530 × 350 cm.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 73]] It stands on the reconstructed choir screen (Lettner) of the same date, in a church built in 1160/80 whose vaults date from the fifteenth century.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 73]]

  The church is the Romanesque basilica of the Holy Cross, famous for its huge, intricately carved medieval rood screen; the monastery was founded by Dedo V of Wettin and dedicated in 1168, given to the Teutonic Order in 1278 and dissolved in 1570.[[source/wikipedia-en-wechselburg-priory|§ First foundation]][[source/wikipedia-en-wechselburg-priory|§ Basilica]]

  In the lecture the group represented the monumental Crucifixion of the thirteenth century – the cross raised above the screen between choir and nave – against which the wounded Christ of the forked crosses of around 1300 appeared as a new type.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 72–73]]
