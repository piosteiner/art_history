description_md: "[[artist/jeong-seon]] (1676–1759), who spread the Southern School style in Korea and developed “true-view” landscapes of actual places (chin’gyŏng sansu): the Diamond Mountains, a needle-forest of white peaks around a darker earthen core. In the nineteenth century the poet and calligrapher [[person/kim-jeong-hui]] (Ch’usa) and his followers carried on the Southern School style. [[source/portal-2000|p. 131, fig. 68]]"
