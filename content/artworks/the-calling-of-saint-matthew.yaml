  - owner: person/matthieu-cointerel
    acquired: 1599-07
    method: commission
    place: rome
    label: Cardinal Matteo Contarelli (Matthieu Cointrel, d. 1585) had left funds and instructions in his will for a chapel of St Matthew; the commission (July 1599) was for the two side canvases
    sources:
      - url: https://it.wikipedia.org/wiki/Vocazione_di_san_Matteo
        note: La commissione del dipinto si deve al cardinale Matteo Contarelli, il quale, intorno al 1590, aveva lasciato fondi e istruzioni specifiche nel suo testamento per la decorazione di una cappella dedicata al suo omonimo San Matteo. […] la commissione, datata luglio 1599, prevedeva la realizzazione di sole due tele per le pareti laterali della cappella
        source: wikipedia-it-cappella-contarelli
        accessed: 2026-10-20
