description_md: One of four surviving scrolls illustrating the diary of [[person/murasaki-shikibu]], now in several collections and covering only about fifteen per cent of the text; perhaps the set begun in 1233 by courtiers around the ex-emperor Go Horikawa, mentioned in Fujiwara no Teika’s diary. Two drunken courtiers try to get into her room one moonlit night, and she holds the shutters closed. The compositions follow the Heian Genji scrolls, but the figures express themselves directly and the [[tsukuri-e]] is applied with less care. [[source/history-of-japanese-art|p. 183, fig. 212]]
