    label: probably unsold at the Dubarry sale; remained with the auction house or with Remy as agent until the Prince de Conti acquired it
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1996.1
        note: (Pierre Remy, Paris, France) [1774-] — Remy, who is indicated as the buyer at the Dubarry sale by an annotation in the catalogue, presided over both the Dubarry and Prince de Conti auctions, and thus he was likely not the "buyer" of the painting. Rather, the painting was probably unsold or was bought in at the Dubarry sale, and thus the Vien remained with the auction house or with Remy, in his capacity as an agent, until the Prince de Conti somehow acquired it.
        source: cma-1996-1
        accessed: 2026-11-24
