    sources:
      - url: https://clevelandart.org/art/1996.1
        note: Jean Louis Antoine le Vaillant de Damery, Chevalier de l’Ordre Royal Militaire de St-Louis [1723-1803] [c. 1765] — Some versions of the painting’s provenance list Damery followed by Durbarry, while they appear in the reverse order in others. Although this is not confirmed, it seems that Damery should appear first … An engraving after the painting by Beauvarlet, published c. 1765, situates the painting in the Damery collection … It is possible that Damery sold the painting in 1764
        source: cma-1996-1
        accessed: 2026-11-24
