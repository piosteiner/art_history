description_md: Part of an imperial decree sent to twelve temples of the Kansai, granting linen, cotton and land and asking for prayers for peace and the spread of Buddhism. The emperor wrote only the large character for choku (imperial decree) at the end; the text is the confident hand of a government clerk, and the ministers signed below. The rescript of the year of [[person/emperor-shomu]]’s abdication. [[source/history-of-japanese-art|p. 47, fig. 48]]
