description_md: "The illustrated tale of the events of 1160, when Minamoto no Yoshitomo and Fujiwara no Nobuyori (1133–1160) imprisoned the retired emperor [[person/emperor-go-shirakawa]] — a coup crushed by [[person/taira-no-kiyomori]]. Nobuyori’s troops attack the Sanjō Palace at night, bundle Go Shirakawa into a carriage and set the buildings on fire; servants and ladies jump into a well, others are trampled by horses. The scroll is unusually long and uninterrupted by text: the flames fill the upper part, the human action the lower, in bright colours and free brushwork. The artist owes a debt to the Ban Dainagon scroll; nothing is known of him. [[source/history-of-japanese-art|pp. 183–184, fig. 213]]"
