description_md: |-
  A postcard design of [[polity/korea-under-japanese-rule]]: two boys, Japan and Korea, as one team. In fact Japanese names and customs were forced on Koreans. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]

  ## Description and date

  The anonymous design, titled *Japan-Korea: Teamwork and Unity, Champions of the World*, is a Japanese postcard of the 1930s. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] It was shown in the session "World War II, Prior and During" on 17 May 2019, whose vocabulary begins with "Colonial Korea" and "Manchukuo maps". [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]]

  ## Context

  Japan had fought the Sino-Japanese War of 1894–95 and the Russo-Japanese War of 1904–05 over Chinese and Russian influence on the Korean peninsula, and in 1910 officially took over Korea as a colony. [[source/history-of-japanese-art|p. 346]] In the Taishō and early Shōwa periods the imperialist and militarist tendencies of the government only increased. [[source/history-of-japanese-art|p. 346]] The class notes contrast the postcard's message with reality: it was not that easy, for Japanese names and customs were obligatory for Koreans. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]] Under the policy known as sōshi-kaimei, Ordinance No. 19 of 1939 required Koreans to create a Japanese-style family name and Ordinance No. 20 of 1940 permitted the change of given names, reversing an earlier order that had forbidden Koreans to take Japanese names. [[source/wikipedia-en-soshi-kaimei|introduction]] Historians count the policy among the measures of forced assimilation and cultural genocide that Japan tried to impose on its non-Japanese territories. [[source/wikipedia-en-soshi-kaimei|introduction]]

  In the session of 24 May the postcard was discussed with a Korean War picture, *Charge of the Glorious Korean Army*, and [[artist/taguchi-beisaku|Taguchi Beisaku]]'s print of 1894, as common ways of depicting war across the region. [[source/thomsen-2019-war-and-peace|lecture of 24 May 2019, class notes]]
