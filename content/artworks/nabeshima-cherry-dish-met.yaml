description_md: "A [[nabeshima-ware]] dish from the Nangawara kiln: a blossoming cherry tree combined with an abstract pattern suggesting the curtains of an outdoor blossom-viewing enclosure, in three colour zones — pale blue, pale green and chocolate brown. Pressed in a mould and outlined in underglaze blue from a single sketch. [[source/history-of-japanese-art|p. 295, fig. 337]]"
