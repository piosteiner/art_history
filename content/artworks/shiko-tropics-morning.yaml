description_md: "The masterpiece of [[artist/imamura-shiko]] (1880–1916), after a journey to India in 1914: two [[yamato-e]] handscrolls of a south Indian landscape in the morning and the evening, a seamless blend of Eastern and Western techniques — the absence of outlines a nod to Rinpa, the naive charm and repetitive brushstrokes reminiscent of Van Gogh and Gauguin. [[source/history-of-japanese-art|pp. 367–368, fig. 436]]"
