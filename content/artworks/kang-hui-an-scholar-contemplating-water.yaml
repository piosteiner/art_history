description_md: "The famous painting of [[artist/kang-hui-an]] (1419–1464), scholar-painter and deputy leader of the embassy to Ming China in 1455: a scholar leaning on a rock gazes at the water — close to the Ming Zhe school in its cliffs and the importance of the figure. [[source/portal-2000|pp. 130–131, fig. 67]]"
