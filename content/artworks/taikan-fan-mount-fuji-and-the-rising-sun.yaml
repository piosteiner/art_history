description_md: |-
  A fan painting of Mount Fuji and the rising sun by [[artist/yokoyama-taikan|Yokoyama Taikan]], ink and pigments on paper, Japan, early 1940s. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] From the collection of [[person/reinhold-schulze]] (1905–1993), from 1940 to 1945 cultural attaché at the German embassy in Tokyo. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]

  ## Subject

  Influenced by the nationalist thought of his teacher [[person/okakura-kakuzo|Okakura Tenshin]], Taikan repeatedly used [[place/mount-fuji|Mount Fuji]] as a motif and even presented such paintings to the imperial family. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]] Before the war the Japanese government sent him to Italy as an official representative of Japan's artistic community; during the Second World War he gave his earnings from painting sales to the military, which led to his arrest and interrogation by the occupation authorities after the surrender. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]] In 1937 he was among the first to receive the newly founded Order of Culture. [[source/wikipedia-en-yokoyama-taikan|§ Artistic career]]

  ## In the lecture

  The fan was shown in the session "World War II, Prior and During" on 17 May 2019, after [[artist/tsuguharu-foujita|Tsuguharu Foujita]]'s *Suicide Attack on Attu Island* (1943) and before [[artist/tsuji-kako|Tsuji Kakō]]'s [[artwork/tsuji-kako-the-rising-sun|The Rising Sun]] of about 1930. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] The day's vocabulary names Yokoyama Taikan beside Foujita, Tsuji Kakō, Eduard von der Heydt, Monte Verità, Ars Una, Weltkunst, Karl With and Johannes Itten. [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]] Fuji and the rising sun together were images of Japan in wartime propaganda too: a kimono in Kushner's catalogue shows "the looming figure of Mount Fuji, the symbol of Japan" beside a fighter plane and the flags of the Axis powers. [[source/kushner-2011-drive-to-mobilize|p. 18]]
