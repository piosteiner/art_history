description_md: "The earliest surviving building in the [[karayo]]: built in 1285 as the Buddha hall of the nunnery Taiheiji and moved to the Shōzokuin subtemple of Engakuji in 1563. Three bays square with a pent roof (mokoshi) around it and a two-tiered hipped-gable roof, now thatched where it once had tiles; inside, the rafters radiate from a hidden central point — a delicate, jewel-like interior. [[source/history-of-japanese-art|p. 215, fig. 249]]"
