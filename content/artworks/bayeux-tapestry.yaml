description_md: |-
  An embroidered cloth almost 70 metres long that tells the events leading up to the Norman conquest of England and the Battle of Hastings in 1066, from the last years of [[person/edward-the-confessor|Edward the Confessor]] to the victory of [[person/william-the-conqueror|William, Duke of Normandy]], over [[person/harold-godwinson|Harold Godwinson]]; the final scenes are missing.[[source/wikipedia-en-bayeux-tapestry|introduction]] The lecture "Aus dem Wald" dates it about 1070 and gives wool embroidery on linen, 68.38 m × 45.7–53.6 cm, in Bayeux, Centre Guillaume le Conquérant.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 39]]

  ## Making

  Despite its name the work is an embroidery, not a woven tapestry: it is worked in wool on a coarse linen ground with four different stitches and ten natural dye colours.[[source/wikipedia-en-bayeux-tapestry|introduction]] Nine linen panels, between fourteen and three metres long, were embroidered separately and then sewn together, the joins disguised with further embroidery.[[source/wikipedia-en-bayeux-tapestry|§ Construction, design and technique]] The 58 surviving scenes, all with Latin *tituli*, contain 623 human figures, 994 animals, 438 plants, 37 buildings and 41 ships and boats; scenes are generally separated by highly stylised trees.[[source/wikipedia-en-bayeux-tapestry|introduction; § Construction, design and technique]] The borders carry birds, beasts, fables and scenes of agriculture and hunting.[[source/wikipedia-en-bayeux-tapestry|§ Construction, design and technique]]

  It is generally thought to have been commissioned by William's half-brother [[person/odo-earl-of-kent|Bishop Odo of Bayeux]], who appears four times, and made in England, probably in or around Canterbury, in the years after the Conquest; it may have been designed for the dedication of Bayeux Cathedral in 1077.[[source/wikipedia-en-bayeux-tapestry|introduction; § Origins; § Construction, design and technique]] The earliest written reference is a 1476 inventory of the cathedral, which shows that it was hung there every year in the week of the feast of St John the Baptist.[[source/wikipedia-en-bayeux-tapestry|§ To the French Revolution]] In 1792 it was confiscated to cover military wagons and rescued by a local lawyer; it was shown in Paris in 1797 and returned to Bayeux in 1804.[[source/wikipedia-en-bayeux-tapestry|§ French Revolution onwards]] Since 2007 it has been on UNESCO's Memory of the World Register.[[source/wikipedia-en-bayeux-tapestry|introduction]]

  ## Shipbuilding

  The lecture showed the scenes in which the Norman fleet is built, as an image of the forest as a supplier of timber for building, crafts and fuel.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 38]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 39]] After the news of Harold's coronation reaches Normandy, William orders a fleet of ships to be built, although it is Bishop Odo who is shown giving the instructions (scene 35).[[source/wikipedia-en-bayeux-tapestry|§ Events depicted]] Hansjörg Küster notes that in permanently used woods the curved timber of oaks, the *Krummholz*, gained particular value and was built into ships' hulls.[[source/fansa-vorlauf-2007-holz-kultur|p. 31]]
