description_md: |-
  [[artist/mattia-di-nanni|Mattia di Nanni]]'s cycle of intarsia panels for the Sala del Consiglio of the [[institution/palazzo-pubblico|Palazzo Pubblico]] in Siena, made in 1426–1430, showed heroes of Roman history; the surviving panels are now in Montreal and New York [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45–48]]. The lecture showed the council hall itself [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 46]].

  ## Surviving panels

  The panel in the [[institution/montreal-museum-of-fine-arts|Montreal Museum of Fine Arts]] shows [[artwork/mattia-di-nanni-tarsie-montreal|Manius Curius Dentatus, Pompey the Great and Mettius Curtius]] in intarsia of walnut, oak, bog oak, fruit wood and bone and measures 105.4 × 212 × 3 cm [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 45, 47]]. A single figure of [[artwork/mattia-di-nanni-scipio-met|Scipio Africanus]] in the [[institution/metropolitan-museum-of-art|Metropolitan Museum of Art]] is made of walnut, poplar, bog oak, rosewood and bone and measures 61.5 × 43.3 cm [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 48]].

  ## Materials

  Bog oak, used in both panels, is oak that has lain for a long time under water in peat bogs, where the tannins of the wood react with the iron of the surroundings and darken it to dark brown or black [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]]. Ajmar describes it as an archaeobotanical wood on its way to coal-like petrification, formed over hundreds of years without oxygen in acidic, wet conditions such as the muddy beds of rivers in northern Italy [[source/ajmar-2024-reciprocal-design|p. 43]].
