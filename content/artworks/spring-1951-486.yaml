        note: Mantacheff collection, St. Petersburg, sold to Wildenstein & Co [Until 1910] — It was most likely Alexander Mantacheff (d. 1911) who owned the Paters, although his son, Leon, who lived in Moscow and Paris, was also a collector (active in the 1910s). … the Mantacheffs believed that the four Paters were in the collection of the Duc de Choiseul … The Choiseul provenance is dubious
        source: cma-1951-486
