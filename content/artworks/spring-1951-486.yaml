    label: claimed from Pater's estate by his agent Louis-Jacques Landrin on 13 August 1736; four oval Seasons in his dining room
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1951.486
        note: "Probably Victor-Amédée, prince de Carignan [1690-1741], Paris, France [1736-1741] — They were claimed soon thereafter by Louis-Jacques Landrin, Carignan’s agent, as was stipulated in Pater’s scellé après décès: “le 13 août, de Louis-Jacques Landrin, avocat au Parlement…chargé de pouvoir de Son Altesse Serenss. Monsigneur le Pce de Carignan, réclamant ‘deux tableaux sur toille …, représentant les Saisons, commandés par Son Altesse au deffunt Pater …’” Carignan had four oval Seasons installed in his dining room."
        source: cma-1951-486
        accessed: 2026-11-24
