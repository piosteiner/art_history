    label: held in trust; Carignan sales of 1742 and 1743 (four oval Seasons as Watteau) — whereabouts after the sales unknown
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1951.486
        note: Held in trust by the Estate of the prince de Carignan [1741-1743] — In Carignan’s sales of 1742 and 1743, these are attributed to Watteau; however, according to art historian Rochelle Ziskin, they were partly—or, more likely, entirely—by Pater.
        source: cma-1951-486
        accessed: 2026-11-24
  - owner_label: Mantacheff collection, St. Petersburg
