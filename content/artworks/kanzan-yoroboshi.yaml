public_id: 108222
title: Yorobōshi (The Beggar Monk)
creator: shimomura-kanzan
created: 1915
kind: byōbu
medium: Pair of six-panel screens, colour and gold leaf on paper
materials: [paper, gold leaf]
dimensions: [187.5, 407]
dimensions_note: each screen
institution: tokyo-national-museum
description_md: "A pair of screens by [[artist/shimomura-kanzan]] (1873–1930) after the Nō play: the blind monk Shuntokumaru, falsely accused and disowned, looks to the west at sunset and, holding the image of the sun in his heart, sees the whole landscape. A flowering plum against gold spreads across twelve panels; between its branches the thin figure prays, a cluster of grave markers half hidden by the trunk — the debt to Kōrin’s Red and White Plum Blossoms is obvious. [[source/history-of-japanese-art|pp. 365–366, fig. 433]]"
