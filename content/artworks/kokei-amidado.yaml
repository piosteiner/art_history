description_md: "An early masterwork of [[artist/kobayashi-kokei]] (1883–1957): the long, narrow hanging scroll is divided horizontally by a brightly coloured view of the [[artwork/byodo-in-phoenix-hall]], as if moonlight had suddenly lit the temple, splashing light across the upper part of the red posts; through the open doors the Amida glows as if from a second light within. [[source/history-of-japanese-art|pp. 368–369, fig. 438]]"
