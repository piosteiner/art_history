description_md: "*Condottiero a cavallo* (leader on horseback), 1934–35, by [[artist/mario-sironi|Mario Sironi]], shown in the Art and Totalitarianism seminar as an example for the topic \"Mario Sironi and fascist art\" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]]. The rider was a widely used image of a ruler, and Sironi used it for Mussolini: in an illustration of 1937 the horseman is accompanied by the letters DVX ([[artwork/sironi-dux-illustration-1937]]), and a horseman in relief appears on the triumphal arch of [[artwork/sironi-italia-fra-le-arti-e-le-scienze]], painted in 1935 [[source/steiner-2025-mario-sironi|pp. 4–5]]. The motif goes back in Sironi's work to the Futurist years — Emily Braun reproduces a *Horseman* of 1915 [[source/braun-2000|p. vii, fig. 8]]. Braun counts the \"omnipotent Duce\" among the images by which Sironi gave the regime its visual legitimation [[source/braun-2000|p. 16]]."
