description_md: "This walnut relief on the right leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows Christ's entry into Jerusalem.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 98]] The right leaf shows Christ's ministry and Passion.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] It stood at the centre of the lecture's reading of the door: the entry into Jerusalem as the door's theme, and the church as a new Jerusalem.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 27]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 108]] The lecture placed the relief beside the Palm Sunday donkey of the mid-11th century in the [[artwork/palmesel-landesmuseum-zurich|Swiss National Museum]] and beside Palm Sunday processions still held in Seville, Ammerschwihr (Alsace) and Thaur (Tyrol); in its account the relief is the model of the Palm Sunday donkey with which the procession passed through this door.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 112]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 113]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 115]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 116]][[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 117]] The Palm Sunday procession with green branches recalls Christ's entry into Jerusalem on a donkey and is attested from the 7th century; from the 10th century village priests rode on a donkey in it, later replaced by a wooden donkey with a figure of Christ.[[source/wikipedia-de-palmesel|§ Geschichte und Gestaltung]] The lecture showed the relief again together with the Last Supper and the Pentecost miracle of the right leaf.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 121]]"
