description_md: |-
  The land reclaimed and its wheat — the plenty of the regime [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 23]]. Title as on the slide.

  ## The work

  [[artist/alfredo-catarsini|Alfredo Catarsini]] showed *Il grano della bonifica lucchese* (*The Wheat of Lucca's Reclamation*) at the second Premio Cremona in 1940; a selection of the prize's works, Catarsini's among them, was sent to Hannover in September 1940 to represent Italian art [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. The year before he had won a shared second prize at the first Premio Cremona with *I rurali ascoltano* [[source/wikipedia-it-alfredo-catarsini|§ Gli anni trenta e quaranta]]. The Premio Cremona was a state-sponsored exhibition, begun at the end of the 1930s, that emulated the didactic realism of Nazi art — the kind of painting to which the label "Fascist art" is usually applied [[source/braun-2000|p. 4]].

  ## Labour, land and wheat

  In the seminar the painting stood with the theme of labour — agriculture and the shaping of norms [[source/beatrice-marinho-2024-art-and-totalitarianism|class notes, 24 September 2024]] — beside [[artist/sergey-gerasimov|Sergei Gerasimov]]'s [[artwork/s-gerasimov-collective-farm-festival|*A Collective Farm Festival*]] (1937) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slides 22–23]]. Wheat and land reclamation (*bonifica*) were central images of the regime: [[artist/basilio-cascella|Basilio Cascella]] painted [[artwork/cascella-mussolini-harvesting-wheat|*Mussolini harvesting wheat*]] (1939) [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 15]], and during the reclamation of the Pontine Marshes Mussolini had himself photographed and filmed threshing wheat at harvest time for propaganda newsreels [[source/wikipedia-en-pontine-marshes|§ Bonifica integrale]]. Dagnino notes that the Fascist exaltation of the peasant world was frequently a recourse to a mythical past that served as a springboard for future-oriented politics [[source/dagnino-2016|p. 132]].
