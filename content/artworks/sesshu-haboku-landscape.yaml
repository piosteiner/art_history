description_md: A [[haboku]] landscape by [[artist/sesshu-toyo]], given in 1495 to his pupil Josui Sōen of Engakuji as a farewell gift and a kind of certificate that his training was complete. Above it Sesshū wrote of his experiences in China and of Josetsu and Shūbun as his models; six Kyoto Zen monks added colophons. With incredible economy, splashed ink suggests land, trees, mountains, two figures in a boat and a saké house with its flag. [[source/history-of-japanese-art|p. 227, fig. 261]]
