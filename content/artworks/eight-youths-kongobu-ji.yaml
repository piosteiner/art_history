description_md: "The eight youths attending Fudō Myōō, made for Kongōbu-ji on Mount Kōya for an aristocratic patron: coarse characters given intelligence and elegance, and brimming with life[[source/tnm-unkei-exhibition-2017|“Unkei also received commissions from various aristocratic families. His rendition of the Eight Youths Attending Fudo Myo’o (No. 18) for Kongobuji temple in Wakayama imbues this group of coarse characters with an aura of intelligence and elegance on the one hand, and a brimming sense of vitality on the other”]]."
