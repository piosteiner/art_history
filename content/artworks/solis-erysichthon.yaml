description_md: |-
  A woodcut by [[artist/virgil-solis]] for Ovid's *Metamorphoses* (book VIII): Erysichthon fells the oak consecrated to Ceres. This impression was printed in 1569 as an illustration in Johannes Posthius's *Tetrasticha in Ovidii metam.*, published in Frankfurt am Main by Georg Rab, Sigmund Feyerabend and the heirs of Weigand Han; the heading on the sheet reads "Erisichthonis impietas". Picture and ornamental border were printed from two separate blocks, each of them also used apart from the other in other publications — the borders several times within this book. On the other side of the leaf: Ceres orders the punishment of Erysichthon.[[source/rijksmuseum-rp-p-ob-22-088-v]]

  Solis, who worked in Nuremberg, died on 11 August 1562: the design is his, the printing of 1569 came seven years after his death — his Ovid woodcuts were reprinted and copied in many editions.[[source/wikipedia-en-virgil-solis]]

  ## The story

  In Ovid's version Erysichthon orders all the trees in the sacred grove of Ceres to be cut down; when his men refuse to fell a huge oak hung with votive wreaths, he takes the axe himself and kills the dryad who lives in it, whose dying curse Ceres answers by sending Fames, insatiable hunger, into his stomach.[[source/wikipedia-en-erysichthon-of-thessaly|§ Ovid]] In the older version of Callimachus' hymn to Demeter the tree is a great poplar in a grove planted by the Pelasgians; Demeter, in the form of her priestess Nikippe, warns the king, and he answers that the trees will make the hall for his banquets.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 61]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 62]] The goddess then shows herself in her true shape and condemns him to "frequent banquets" — the hunger that ruins him.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 62]]

  ## In the lecture

  The lecture "Aus dem Wald" showed the woodcut in its section on sacrilege against trees in the sacred grove.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 60]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 64]] The core of Callimachus' story, the inviolability of trees in sacred groves, corresponds to inscriptions from the 5th century BCE into the Imperial period that forbid felling trees or cutting branches in groves.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 63]] Greek myth also knew tree nymphs, the hamadryads, whose lives were coterminous with the tree they inhabited, so that they died when it was cut down.[[source/cusack-2011-the-sacred-tree|p. 46]] A later version of the scene is [[artwork/passe-erysichthon|Crispijn van de Passe's engraving]] for an Ovid edition of 1602–1607.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 65]]
