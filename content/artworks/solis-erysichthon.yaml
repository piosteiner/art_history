description_md: |-
  A woodcut by [[artist/virgil-solis]] for Ovid's *Metamorphoses* (book VIII): Erysichthon fells the oak consecrated to Ceres. This impression was printed in 1569 as an illustration in Johannes Posthius's *Tetrasticha in Ovidii metam.*, published in Frankfurt am Main by Georg Rab, Sigmund Feyerabend and the heirs of Weigand Han; the heading on the sheet reads "Erisichthonis impietas". Picture and ornamental border were printed from two separate blocks, each of them also used apart from the other in other publications — the borders several times within this book. On the other side of the leaf: Ceres orders the punishment of Erysichthon.[[source/rijksmuseum-rp-p-ob-22-088-v]]

  Solis, who worked in Nuremberg, died on 11 August 1562: the design is his, the printing of 1569 came seven years after his death — his Ovid woodcuts were reprinted and copied in many editions.[[source/wikipedia-en-virgil-solis]]
