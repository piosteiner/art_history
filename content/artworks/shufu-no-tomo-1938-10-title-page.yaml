description_md: |-
  The cover of the magazine *Shufu no Tomo* (主婦の友), vol. 22, no. 10, 1938; the vocabulary of the day lists [[good-wife-wise-mother]]. [[source/thomsen-2019-war-and-peace|image list and vocabulary list, 10 May 2019 (guest lecture, Klaus Friese)]]

  ## The magazine

  *Shufu no Tomo* ("Housewife's Friend") was a monthly women's magazine published in Tokyo from March 1917 to 2008, founded by Ishikawa Takemi. [[source/wikipedia-en-shufu-no-tomo|introduction]] [[source/wikipedia-en-shufu-no-tomo|§ History and profile]] It took a conservative stance, addressed young married women and the mass market of lower-middle-class readers, and covered home management, saving and birth control. [[source/wikipedia-en-shufu-no-tomo|§ History and profile]] By 1931 it sold some 600,000 copies a month. [[source/wikipedia-en-shufu-no-tomo|§ Circulation]]

  ## Good wife, wise mother

  The phrase *ryōsai kenbo* ("good wife, wise mother") was coined by Nakamura Masanao in 1875 and accompanied the slogan "wealthy country, strong army". [[source/wikipedia-en-good-wife-wise-mother|introduction]] During the 1930s and the Second World War the state pushed the ideal further as part of its family-state ideology, with propaganda stressing women's duty to bear future soldiers. [[source/wikipedia-en-good-wife-wise-mother|§ Japan]] Mason describes how, in Japan's effort at empire building, women were urged as part of the war effort to tend to their families and to conserve the country's resources. [[source/history-of-japanese-art|p. 370]] Kushner writes that girls, too, understood that maintaining vigilance on the home front was their role in the war. [[source/kushner-2011-drive-to-mobilize|p. 21]]

  ## In the lecture

  The cover was shown in Klaus Friese's guest lecture "Trumpets and Textiles – War in the Japanese Material Culture from 1931 to 1945" on 10 May 2019, after a length of printed cotton and before a Kirin beer advertisement and a haori. [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]] [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] The vocabulary of the day also names Shōwa jidai, nagajuban and haori. [[source/thomsen-2019-war-and-peace|vocabulary list, 10 May 2019 (guest lecture, Klaus Friese)]]
