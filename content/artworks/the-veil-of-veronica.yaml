provenance:
  - owner: person/ferdinando-gonzaga-duke-of-mantua
    acquired: 1627 or earlier
    place: mantua
    label: "6th Duke of Mantua; 1627 Mantua inventory: 'il sudario di Nostro Signore di mano del Sig. Perfetti' (most likely a mistranscription of 'per mano di Fetti')"
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: Ferdinando Gonzaga, 6th duke of Mantua [1587-1626], by 1627;[1] — The relevant entry reads "il sudario di Nostro Signore di mano del Sig. Perfetti."
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/ferdinando-carlo-gonzaga
    method: inheritance
    direct: true
    place: mantua
    label: 10th and last Duke of Mantua; in the 1706 Mantua inventory; in exile in Venice and Padua after the fall of Mantua in 1707, died intestate
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: by inheritance to Ferdinando Carlo Gonzaga, 10th and last duke of Mantua [1650-1708], in Mantua 1706, and Venice 1709;[2] — Following the fall of Mantua to imperial troops in 1707, Ferdinando Carlo went into exile first in Venice and later in Padua, where he died intestate.
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/ferdinando-carlo-gonzaga
    role: estate
    acquired_label: posthumous Venice inventory, 1709
    direct: true
    place: venice
    label: in the posthumous 1709 Venice inventory; the collection shown in the Palazzo Michiel dalle Colonne while the courts sought the legal heir; works not taken by heirs or ceded to Charles of Lorraine sold on the Venetian market
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: For the painting's inclusion in the 1706 Mantua inventory and the posthumous 1709 Venice inventory … his art collection was exhibited in one of his Venetian properties, the Palazzo Michiel dalle Colonne.
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/pierre-crozat
    acquired: 1728 or earlier
    place: paris
    label: named as owner on Charles Simonneau's engraving in the Recueil Crozat (1729–1742); no. 113 in his posthumous inventory (1740)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: Pierre Crozat [1665-1740], Paris, by 1728;[3] — The Veil of Veronica is no. 113 in Crozat's posthumous inventory (1740)
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/louis-francois-crozat
    co_owners: [person/joseph-antoine-crozat]
    method: inheritance
    direct: true
    place: paris
    label: his nephews, the marquis du Châtel and the baron de Tugny; in the 1751 sale listed among the works of Louis-François ('M. Crozat')
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: by inheritance to his nephews, Louis-François Crozat, marquis du Châtel [1691-1750], Paris, and Joseph Antoine Crozat, baron de Tugny [1696-1751];
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner_label: Crozat collection sale, Paris
    role: agent
    acquired: 1751-06-15
    method: auction
    direct: true
    place: paris
    label: Crozat collection sale, Paris, 15 June 1751, no. 119, organised by Louis-Antoine Crozat, baron de Thiers (1699–1770); catalogue by Mariette
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: (Crozat collection sale, Paris, 15 June 1751, no. 119);[4] — The sale was organized by the surviving brother, Louis-Antoine Crozat, baron de Thiers [1699-1770].
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/charles-cressent
    acquired: 1751-06-15
    method: auction
    direct: true
    place: paris
    label: buyer per Stuffmann (annotated sale catalogue); not in Cressent's sales or inventories published by Ballot (1919)
    sources:
      - url: https://www.nga.gov/collection/art-object-page.41617.html
        note: Charles Cressent [1685-1768].[5] — Stuffmann lists Cressent as the purchaser, presumably on the basis of an annotated copy of Mariette's sale catalogue.
        source: nga-1952-5-7
        accessed: 2026-11-24
  - owner: person/adolphe-thiers
    place: paris
    label: according to the 1925 Ehrich Gallery catalogue only; not in Blanc's catalogue of his collection — perhaps a confusion with the baron de Thiers
