description_md: '*Der Boxer Schmeling* by [[artist/rudolf-belling|Rudolf Belling]] (1929) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] In 1937 Belling was shown at the same time in this exhibition and in the [[event/degenerate-art-exhibition|*Entartete Kunst*]] exhibition; after a critic noticed, his two works were removed from the defamatory show, while the *Schmeling* stayed in the Great German Art Exhibition as an embodiment of "Aryan" ideals.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Bewertung]]'
