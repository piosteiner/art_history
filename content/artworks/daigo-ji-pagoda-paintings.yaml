description_md: "The wall paintings inside the pagoda of Shimo Daigoji: the deities of both mandalas arranged on the heart pillar, Taizōkai Dainichi on the west face, Kongōkai Dainichi on the east, with secondary figures on the window shutters and the patriarchs on the wainscoting. The best preserved is the Taizōkai Dainichi: red iron-wire lines and a palette of cool greens and reds with quiet flesh tones, [[kirikane]] for the textile designs, soft shading — a quietude far from the exuberant flatness of the Tōji mandalas. [[source/history-of-japanese-art|pp. 138–140, fig. 169]]"
