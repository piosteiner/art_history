description_md: |-
  The Gero Cross in [[place/cologne|Cologne]] Cathedral is a monumental crucifix of oak; the corpus is 187 cm high, the cross 285 cm, and its polychromy is modern.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 21]] It is considered the oldest large sculpture of the crucified [[person/jesus-christ|Christ]] north of the Alps and has always been displayed in the cathedral.[[source/wikipedia-en-gero-cross|§ Introduction]] It was commissioned by Gero, Archbishop of Cologne, who died in 976.[[source/wikipedia-en-gero-cross|§ Introduction]]

  ## Form

  The span of the arms is 165 cm.[[source/wikipedia-en-gero-cross|§ Introduction]] The figure is the oldest known Western image of Christ dead on the cross: the head slumps, the body hangs lifeless, the eyes are closed.[[source/wikipedia-en-gero-cross|§ Particular significance to medieval art]] The halo and the cross-pieces are original, the Baroque surround was added in 1683.[[source/wikipedia-en-gero-cross|§ Introduction]] The art historian Bruno Klein, quoted in the lecture, saw it as the first sculpture whose material carried no meaning of its own: the corpus, previously always hidden under sheet metal, is stripped of that covering, in an attempt to deny the artificial character of the object and produce "only" a lifelike image of the Crucified.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 69]]

  ## Making

  According to Klaus Endemann the figure (c. 980, oak) was carved from a halved trunk and hollowed out at the back, following the contours of the body "with rare consistency and perfection in craftsmanship".[[source/endemann-2020-wood-carving-and-staffering|pp. 162–163]] The back surface lay about 8 cm from the pith; whether the hollowing was meant to prevent radial cracks can only be guessed, since the other monumental crucifixes of the period were not hollowed.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] A broad gouge driven with a mallet was used for the hollowing; its marks show only inside the cavity.[[source/endemann-2020-wood-carving-and-staffering|p. 169]] The arms were attached to the block at an early stage and carved with it.[[source/endemann-2020-wood-carving-and-staffering|p. 152]] The joint between arms and shoulders was filled with a paste of sawdust and glue and covered with fine canvas — a technique so far observed only on the Gero Cross.[[source/endemann-2020-wood-carving-and-staffering|pp. 159–160]] Beneath all painted areas the wood surface was very dark brown.[[source/endemann-2020-wood-carving-and-staffering|p. 172]] The loincloth was painted bright minium over a cool whitish layer, and its inside is assumed to have been gilded.[[source/endemann-2020-wood-carving-and-staffering|pp. 177–178]]

  ## A relic in the head?

  Thietmar of Merseburg, writing 1012–1018, reports that Gero had the crucifix over his grave made of wood (*ex ligno fabricari*); when a crack appeared in the head, he inserted a piece of the Host together with a particle of the True Cross into the crack and prayed until the crack closed.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 53]] Harald Keller made such reports the basis of his thesis that sculpture became legitimate around 1000 only through relics.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 58]] Bruno Reudenbach objected that the Gero Cross had no relic sepulchre, whereas the [[artwork/ringelheimer-kruzifix|Ringelheim Crucifix]] had one.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 59]] Frank Fehrenbach likewise concluded that inserting relics was no indispensable condition for early statues of Christ and Mary.[[source/fehrenbach-1996-die-goldene-madonna|p. 57]] The 1976 investigations found no space for relics in the back of the head.[[source/wikipedia-en-gero-cross|§ History]]

  ## History and dating

  Thietmar says the crucifix was originally displayed above Gero's grave.[[source/wikipedia-en-gero-cross|§ History]] In 1322 it was placed in the new Gothic cathedral, where it remains.[[source/wikipedia-en-gero-cross|§ History]] In 1904 it was repainted by W. Batzem; X-rays showed that the eyes were closed in the original paint layer as well.[[source/wikipedia-en-gero-cross|§ History]] Dendrochronology confirmed the early date in 1976.[[source/wikipedia-en-gero-cross|§ History]] The lecture gave the date as "before 976" and also as 970/990, Endemann as 970–80 or c. 980, Wikipedia as around 965–970.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 21]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 52]] [[source/endemann-2020-wood-carving-and-staffering|pp. 147–148]] [[source/wikipedia-en-gero-cross|§ Introduction]] In the lecture the cross was compared with the crucified Christ of the [[artwork/lindau-gospels|Lindau Gospels]] cover and with the [[artwork/goldene-madonna-essen|Golden Madonna of Essen]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 68]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 79]]
