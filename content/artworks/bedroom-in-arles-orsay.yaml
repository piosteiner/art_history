description_md: "The third and smallest version of [[artwork/bedroom-in-arles|The Bedroom]], painted at Saint-Rémy-de-Provence in September 1889 for Van Gogh’s mother and sister in Holland, after the [[artwork/bedroom-in-arles-van-gogh-museum|first version]] of October 1888 had been damaged by water. Through its colours Van Gogh referred to Japan, to its crêpe paper and its prints: “The Japanese lived in very simple interiors.” A composition almost entirely of straight lines and a strict combination of coloured surfaces give the empty room — “a wooden bed and two chairs” — its sparseness and balance the unstable perspective."
