  - owner_label: French State (Domaines de la Seine)
    role: possessor
    acquired: 1944
    ended: 1959
    method: confiscation
    place: paris
    label: sequestered as enemy property after the Liberation, France counting Japan among the enemy countries
    sources:
      - url: https://fr.wikipedia.org/wiki/K%C5%8Djir%C5%8D_Matsukata
        note: Le gouvernement provisoire mis en place en 1944 dans la France libérée […] classe le Japon parmi les pays ennemis. À la suite d'une ordonnance stipulant que tous les biens ennemis doivent être placés sous séquestre au profit de l’administration, les Domaines de la Seine en prennent le contrôle.
        source: wikipedia-fr-kojiro-matsukata
        accessed: 2026-10-20
  - owner: institution/musee-du-louvre
    acquired: 1959-05-27
    method: settlement
    direct: true
    place: paris
    label: "ceded to the Musées nationaux under the peace treaty with Japan (committee 12 February, council 19 February, decree 27 May 1959): France gave the collection to Japan for the National Museum of Western Art in Tokyo, the family renouncing all claims — about fifteen major works, this one among them, stayed in France"
    sources:
      - url: https://www.musee-orsay.fr/fr/oeuvres/la-chambre-de-van-gogh-arles-746
        note: 1959, cédé aux Musées nationaux en application du traité de paix avec le Japon (comité du 12/02/1959, conseil du 19/02/1959, arrêté du 27/05/1959) 1959, attribué au musée du Louvre
        source: musee-d-orsay-collections
        accessed: 2026-10-20
      - url: https://fr.wikipedia.org/wiki/K%C5%8Djir%C5%8D_Matsukata
        note: Le gouvernement français offre pour sa part au gouvernement japonais les œuvres de la collection, sur laquelle la famille Matsukata déclare renoncer à l'intégralité de ses revendications. Cependant, la collection sera amputée d'une quinzaine d'œuvres majeures, destinées à rester en France […] C'est le cas en particulier de la troisième version de La Chambre de Van Gogh à Arles
        source: wikipedia-fr-kojiro-matsukata
        accessed: 2026-10-20
