description_md: |-
  The oldest of the three manuscripts of the [[literature/liber-figurarum|Liber Figurarum]], discovered by the British historian Marjorie Reeves in 1942.[[source/wikipedia-en-liber-figurarum]] It was made around 1220/30,[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 107]] two to three decades after the death of [[person/joachim-of-fiore]] (1202), whose figures it copies — figures that go back to Joachim himself or his first followers.[[source/wikipedia-de-liber-figurarum]] The scribes and the painter are not known. Among its pages: the Tree of the Holy Spirit and the Tree of the twofold coming of Christ (fol. 9v–10r).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 107]]

  ## Tree diagrams

  The lecture closed its session on "trees of knowledge" with the manuscript's tree diagrams.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 105]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 136]] Facing pages show the trees of the generations of humankind in the Old and the New Testament (fol. 9v–10r and 10v–11r).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 136]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 137]] Another opening (fol. 12v–13r) combines a tree diagram of the Trinity with the trees of the concord of the two Testaments.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 138]] The lecture placed the Oxford manuscript in a series of high-medieval tree diagrams with the [[artwork/liber-floridus-gent|Liber Floridus]] in Ghent, the [[artwork/speculum-virginum-koln-w-276a|Speculum virginum]] in Cologne and manuscripts in New Haven and Paris.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 106]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 130]]
