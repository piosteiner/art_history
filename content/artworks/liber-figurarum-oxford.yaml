description_md: "The oldest of the three manuscripts of the [[literature/liber-figurarum|Liber Figurarum]], discovered by the British historian Marjorie Reeves in 1942.[[source/wikipedia-en-liber-figurarum]] It was made around 1220/30,[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 107]] two to three decades after the death of [[person/joachim-of-fiore]] (1202), whose figures it copies — figures that go back to Joachim himself or his first followers.[[source/wikipedia-de-liber-figurarum]] The scribes and the painter are not known. Among its pages: the Tree of the Holy Spirit and the Tree of the twofold coming of Christ (fol. 9v–10r).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 107]]"
