description_md: |-
  This South German woodcut of Christ in the winepress dates from the first quarter of the fifteenth century; it is coloured by hand and measures 26.6 × 18.3 cm [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 28]]. It is in the [[institution/germanisches-nationalmuseum|Germanisches Nationalmuseum]] in Nuremberg (inv. H 4) [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 28]].

  The lecture showed it in the section "Leidensdruck" on early woodcuts as a medium of the Passion of Christ [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 25]], together with a later and larger [[artwork/christus-in-der-kelter-bsb|version of the subject]] in the Bayerische Staatsbibliothek [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 29]]. That later print was compared with a winepress with spindle press and with a printing press, making visible the link between the pressing of Christ in the winepress and the press that produced the image [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folien 30–31]].
