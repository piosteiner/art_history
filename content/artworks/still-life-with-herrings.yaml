  - owner: person/david-david-weill
    acquired: 1925 or earlier
    ended: 1952
    place: paris
    label: much of his collection was seized by the Nazis after he fled Paris in 1940; this painting apparently stayed with him through the war (in no database of looted objects)
    sources:
      - url: https://clevelandart.org/art/1974.1
        note: David David-Weill [1871-1952], Paris, France [By 1925-1952] — In 1937 he sold many objects to Wildenstein & Co., and then in 1940, he fled Paris. At this time, much of his collection was seized by the Nazis, and many of these items were returned to him after the war. This painting, however, appears to have remained in David-Weill’s collection throughout the war and until 1952; it appears in no databases of looted objects or in NARA’s archival records.
        source: cma-1974-1
        accessed: 2026-11-24
  - owner: institution/lazard-freres
    role: agent
    acquired: 1952
    direct: true
    label: the financial firm of which David-Weill was chairman, sold it to Rosenberg and Stiebel
    sources:
      - url: https://clevelandart.org/art/1974.1
        note: Rosenberg and Stiebel purchased this painting from Lazard Frères, the financial firm of which David-Weill was chairman.
