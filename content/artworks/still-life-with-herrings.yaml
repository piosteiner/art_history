        note: Henri Viollet [1849-1926?], Tours, France [Possibly 1860-by 1881] — Viollet may have purchased the painting at the 1860 Lecocq sale of the collection of Monsieur R. The 1881 sale at Hôtel Drouot of Viollet's collection does not include this painting, and thus, it was most likely no longer in his possession by that point.
