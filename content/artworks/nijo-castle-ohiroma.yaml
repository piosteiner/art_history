description_md: The Great Audience Hall of the Tokugawa residence in Kyoto, remodelled about 1625 for formal interviews with the shogun — the shoin elements of a guest hall on a grand scale. The lower level was for the vassals; on the upper level the shogun sat before a [[tokonoma]] painted with a massive pine on gold, a metaphor for the strength of his rule, beside [[chigaidana]], [[chodaigamae]] and an attached study; coffered ceiling, carved and painted panels. [[source/history-of-japanese-art|pp. 242–243, fig. 277]]
