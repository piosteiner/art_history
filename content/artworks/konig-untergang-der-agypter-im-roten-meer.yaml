description_md: |-
  [[artist/johann-konig|Johann König]]'s drowning of the Egyptians in the Red Sea is painted in oil on alabaster and dates from about 1625–1631; it belongs to the [[artwork/kunstschrank-gustav-adolf-uppsala|Kunstschrank]] assembled by Philipp Hainhofer and given in 1632 to King Gustav Adolf of Sweden, in the Museum [[institution/gustavianum|Gustavianum]] in Uppsala [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 55, 58]].

  The cabinet is veneered with ebony and set with silver, ivory, stones and corals, and crowned by a "mountain" with a Seychelles nut ewer [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 55–57]].
