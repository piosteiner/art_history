description_md: "An offering tray from the Ryūkyū islands, an independent kingdom until the daimyo of Satsuma captured its ruler in 1609, and a vassal of both the Tokugawa and the Qing: two dragons contend for a pearl in mother-of-pearl of the yakōgai, the “nocturnal light shell”, glistening from blue to purple against black. [[source/history-of-japanese-art|pp. 302–303, fig. 348]]"
