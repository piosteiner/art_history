description_md: |-
  The paintings on the inner sides of the inner wings of [[artist/michael-pacher|Michael Pacher]]'s high altarpiece at St. Wolfgang im Salzkammergut (1471–81), visible on the feast-day side around the carved Coronation of the Virgin: four scenes from the life of Mary and Christ, among them the Nativity and, on the left wing, the Circumcision.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 71, 77, 79]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Flügel]]

  The paintings and the shrine are linked through the death of the Virgin: above the dying Mary, Christ appears among hovering angels beneath an arch to take his mother into heaven, and her coronation follows in the shrine.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Flügel]] The inner paintings all seem to be by Michael Pacher himself.[[source/wikipedia-en-michael-pacher|§ St. Wolfgang Altarpiece]] Pacher had visited Padua, where the frescoes of Andrea Mantegna, with their low viewpoints and command of perspective, shaped his style – an Italian influence that set him apart from most German artists of his time.[[source/wikipedia-en-michael-pacher|§ Early life and influences]]
