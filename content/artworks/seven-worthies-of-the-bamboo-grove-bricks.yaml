description_md: |-
  *Seven Worthies of the Bamboo Grove* is a relief of the Eastern Jin, late 4th century CE, from China; the lecture showed it as rubbings from the stamped bricks. [[source/thomsen-2019-war-and-peace|image list, 8 March 2019]]

  ## Subject

  The Seven Sages, or Seven Worthies, of the Bamboo Grove were a group of Chinese scholars, writers and musicians of the 3rd century CE: Ji Kang, Liu Ling, Ruan Ji, Ruan Xian, Xiang Xiu, Wang Rong and Shan Tao. [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|introduction]] [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|§ The Seven Sages]] As they are traditionally depicted, they withdrew from the intrigues and corruption of court life in the politically fraught Three Kingdoms period and met in a bamboo grove near Ji Kang's house in Shanyang, praising the simple, rustic life. [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|§ The Seven Sages]] They stressed wine, personal freedom, spontaneity and the celebration of nature; Ji Kang's refusal to serve the new regime of Sima Zhao eventually led to his execution. [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|§ The Seven Sages]] Their rural life became a common theme of art and inspired later artists who wished to retreat in times of political upheaval. [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|§ The Seven Sages]]

  ## The bricks

  A tomb near Nanjing of the 4th century CE shows the group together with Rong Qiqi, who in fact lived much earlier. [[source/wikipedia-en-seven-sages-of-the-bamboo-grove|§ The Seven Sages]] The lecture presented the scene in its session "Medieval Views of War and Peace" on 8 March 2019, whose announced sample objects were Song landscapes, Heian scrolls and burning palaces. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|image list, 8 March 2019]]
