description_md: |-
  [[artist/albrecht-durer|Albrecht Dürer]]'s woodcut of Samson rending the lion, dated about 1497/98, is printed on paper and measures 40.6 × 30.2 cm in the impression of the [[institution/metropolitan-museum-of-art|Metropolitan Museum of Art]] [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 22]]. The museum also owns the pear-wood [[artwork/durer-samson-druckstock-met|block]] from which it was printed (39.1 × 27.9 × 2.5 cm), and the lecture showed print and block side by side [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 24]].

  The lecture used the pair to explain the woodcut as a relief process: the lines that print stand as raised ridges, the rest is cut away; the drawing was transferred in reverse onto the block and cut with knives, as a rule by different people [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Hard fruit woods such as pear were preferred, cut with the grain parallel to the surface; printing was at first done by stamping or rubbing, from about 1460 with portable hand presses and from 1470 with printing presses [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 19]]. Dürer's sheet was shown next to the hand-coloured South German [[artwork/martyrium-des-sebastian-holzschnitt-guildhall|Martyrdom of St Sebastian]] of about 1470/75, whose block also survives [[source/ganz-2024-aus-dem-wald|Sitzung 9 (28.11.2024), Folie 22]].
