description_md: Part of the sculptural mandala of twenty-one images on the altar of the lecture hall (kōdō) of Tōji, which [[person/kukai]] planned after becoming abbot in 823; their eye-opening ceremony was held in 839, four years after his death. Dainichi sits at the centre with the four transcendental Buddhas, the five Kokūzō bodhisattvas to the east, the five Myōō to the west, the Shitennō at the corners and Bonten and Taishakuten between them — probably Kūkai’s own synthesis of old and new. [[fudo]] sits on a base of rectangular shapes abstracting a rock, a lasso in his left hand and a vajra-handled sword in his right, his hair in a braid and two tusks pointing up, his eyes looking down; Mason suggests that he follows a drawing Kūkai brought from China and begins the “Daishi” lineage of Fudō images. The Myōō are carved largely from single blocks, coated with [[gofun]] and painted in bright colours. [[source/history-of-japanese-art|pp. 130–132, figs. 156, 158]]
