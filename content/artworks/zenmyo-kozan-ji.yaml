description_md: A tiny, gem-like figure of Zenmyō, the Chinese woman who protected Gishō on his journey home, paired with a statue of Byakkō Jin and commissioned by [[person/myoe]] in 1225. A classic Chinese beauty standing on a rock, holding the box of farewell gifts, calm and at peace with her life; green shawl-collared robe over a white undergarment, an openwork metal ornament framing her face. [[source/history-of-japanese-art|p. 200, fig. 232]]
