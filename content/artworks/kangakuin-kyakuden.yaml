description_md: The guest hall of the Kangakuin precinct of Onjōji on Lake Biwa, commissioned in 1600 by Toyotomi Hideyori; very like the neighbouring Kōjōin hall but without tsuke shoin, chigaidana and chōdaigamae — the room is dominated by a [[tokonoma]] across the whole west wall, painted with the rest of the room by [[artist/kano-mitsunobu]] ([[artwork/kangakuin-fusuma-mitsunobu]]). [[source/history-of-japanese-art|p. 257]]
