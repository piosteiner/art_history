description_md: Twelve paintings of victories of Philip IV’s armies for the Hall of Realms (Salón de Reinos) of the Buen Retiro Palace, painted in 1634–35 by Velázquez, Zurbarán, Maíno, Carducho, Cajés and others; Velázquez’s *Surrender of Breda* is one of them. The Prado calls them *Serie de Batallas, Salón de Reinos, Palacio del Buen Retiro*.
