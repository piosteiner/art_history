description_md: Twelve paintings of victories of Philip IV’s armies for the Hall of Realms (Salón de Reinos) of the Buen Retiro Palace — one of them is lost[[source/wikipedia-es-salon-de-reinos|„En los laterales norte y sur colgaban doce escenas (una de ellas perdida) cuyo tema eran las grandes batallas ganadas por los ejércitos de Felipe IV en los primeros años de su reinado“]] —, painted in 1634–35 by Velázquez, Zurbarán, Maíno, Carducho, Cajés and others[[source/wikipedia-es-salon-de-reinos|„En los lienzos de batallas trabajaron tanto pintores pertenecientes a la antigua generación, caso de Vicente Carducho o Eugenio Cajés, … como los más jóvenes, …, caso de Juan Bautista Maíno, Zurbarán, …, Antonio de Pereda y el propio Velázquez“ · the hall „construido entre 1630 y 1635“]]; Velázquez’s *Surrender of Breda* is one of them[[source/prado-las-lanzas|„cuando se decidió la decoración del Salón de Reinos del Palacio del Buen Retiro con una serie de pinturas de victorias obtenidas durante el reinado de Felipe IV se incluyera ésta“ · dated „Hacia 1635“]]. The Prado calls them *Serie de Batallas, Salón de Reinos, Palacio del Buen Retiro*.
