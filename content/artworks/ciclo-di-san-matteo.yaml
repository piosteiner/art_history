description_md: "Three large canvases Caravaggio painted for the [[institution/contarelli-chapel]] in [[institution/san-luigi-dei-francesi]] — his first public commission: the [[artwork/the-calling-of-saint-matthew]] on the left wall and the [[artwork/martirio-di-san-matteo]] on the right (contract of 23 July 1599, hung in July 1600), and the altarpiece [[artwork/san-matteo-e-langelo]] (1602). The altarpiece exists in two versions: the first was replaced in 1603 by the second, which hangs there today; the first was sold to Vincenzo Giustiniani, came to Berlin in 1815 and presumably burnt in May 1945. The three were made to be seen together in this chapel, and they still are."
