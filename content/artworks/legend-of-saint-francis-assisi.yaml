description_md: |-
  The fresco cycle of the life of Saint Francis in the Upper Church of San Francesco at [[place/assisi|Assisi]], painted around 1290/95.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 75]] The lecture showed two of its scenes, each with the text it follows.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 75–77]]

  - **The miracle of San Damiano:** praying before the crucifix in the church of San Damiano, Francis heard the painted Christ speak to him by name: "Francis, go and repair my house, which, as you see, is falling completely into ruin." Thomas of Celano, in his second Life of Francis (1246/47), adds that Francis's soul was then filled with compassion for the Crucified and the marks of the Passion were impressed on his heart.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 75]]
  - **The stigmatisation:** around the feast of the Exaltation of the Cross, as Francis prayed on the mountainside, a seraph with six fiery wings came down from heaven with the figure of a crucified man between its wings; when the vision vanished, the marks of the nails appeared in Francis's hands and feet. The scene follows Bonaventure's Legenda maior (1266), XIII.3.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 76]]

  In the lecture the two scenes explained the new devotion to the suffering Christ around 1300: a painted crucifix that speaks, and a saint whose own body takes on Christ's wounds.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74–77]] The painted crosses of the thirteenth century had already turned from the triumphant to the suffering Christ (Christus triumphans and Christus patiens).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 74]]
