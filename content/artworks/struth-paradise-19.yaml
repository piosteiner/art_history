description_md: |-
  A colour photograph by [[artist/thomas-struth|Thomas Struth]] of 1999, showing a stretch of the Bavarian Forest near Zwiesel; it belongs to his series *Paradise*.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 12]]

  ## The series

  Between 1998 and 2006 Struth searched for jungle settings in Japan, Australia, China, America and Europe; the first eight large-format *Pictures from Paradise* were made in 1998 in the Daintree Rainforest in Australia.[[source/wikipedia-en-thomas-struth|§ Work]] Struth, born in Geldern in 1954, trained at the Düsseldorf Academy, first in painting with Gerhard Richter and from 1976 in the photography class of Bernd and Hilla Becher.[[source/wikipedia-en-thomas-struth|§ Early life and education]] His photographs are neither staged nor digitally manipulated.[[source/wikipedia-en-thomas-struth|§ Work]]

  ## In the lecture

  The lecture "Aus dem Wald" showed the photograph in its opening survey of present-day images of the forest, after paintings by [[artist/caspar-david-friedrich|Caspar David Friedrich]] and [[artist/ludwig-richter|Ludwig Richter]] and before [[artwork/erni-rettet-den-wald|Hans Erni's poster *Rettet den Wald*]] of 1983, magazine covers on the state of the world's forests and recent exhibitions on the forest in Emden, London, Vienna and Zurich.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 11]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 13]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 14]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 15]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 18]]
