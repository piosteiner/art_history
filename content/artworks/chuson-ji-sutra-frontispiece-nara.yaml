description_md: |-
  From the sutras once kept at Chūsonji in Hiraizumi, written in gold and silver ink on indigo-dyed paper — a fashion shared with Korea, though this is certainly a Japanese production. The frontispiece shows Shaka in gold on a high lotus throne turning the Wheel of the Law on Vulture Peak, flanked by two bodhisattvas and his disciples, with tiny worshippers — perhaps the commissioners — in the foreground; a palace building recalls Amida’s paradise, and soft hills dotted with trees are pure [[yamato-e]]. The gold and silver are applied in thick washes, a kind of [[tsukuri-e]]. [[source/history-of-japanese-art|pp. 159–160, fig. 193]]

  It is volume 460 of the Great Wisdom Sutra (大般若経), from the canon that [[person/fujiwara-no-kiyohira]] had copied in lines of gold and silver ink in turn — from 1117, over some eight years — and dedicated to Chūsonji, founded in 1126. Of perhaps 4,600 surviving scrolls, Chūsonji keeps only fifteen; most (4,296, a National Treasure) are at Kongōbu-ji on Mount Kōya. This one is among the best preserved. [[source/bunka-online-182025]]
