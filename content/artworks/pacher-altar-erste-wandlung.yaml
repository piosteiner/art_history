description_md: |-
  The first opening – the Sunday side – of [[artist/michael-pacher|Michael Pacher]]'s high altarpiece at St. Wolfgang im Salzkammergut (1471–81): painted scenes from the life of Christ.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 70]] With the outer wings open, eight scenes in two rows of four show miracles and events from Christ's life, among them Christ and the woman taken in adultery.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]][[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 78]]

  Except for the Baptism and the Feeding of the Multitude, which are set in landscape, the scenes are dominated by Gothic architecture that almost always fills the whole background.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]] In the Temptation all three temptations by the devil are shown at once, the first – to turn stones into bread – as the main scene.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]] In most scenes Christ is surrounded by many people; only in the Baptism and the Temptation is he alone with his counterpart, attended by angels.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]] The panels are of spruce.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]]
