description_md: |-
  A [[term/shrine-madonna|Shrine Madonna]] known as the Shrine Madonna of Yvonand or Notre-Dame de Grâce, made in Cologne around 1330/40.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 108]] It is carved in walnut and was painted over a chalk ground in two layers; it is 1.07 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 108]] It belonged to the parish church of Cheyres and was stolen in 1978.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 108]]

  Like many Shrine Madonnas whose interiors are divided into several cells, the Yvonand Virgin carries only seven separate scenes inside – a number Elina Gertsman relates to the medieval notion of a womb with seven cells.[[source/gertsman-2015-worlds-within|p. 200]] Its literature includes a study by Schmid on the "Schreinmadonna von Cheyres".[[source/gertsman-2015-worlds-within|p. 199]]

  In the lecture it followed the Upper Rhenish Shrine Madonna in the Bode-Museum (around 1330) as a near contemporary from Cologne.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 106–109]]
