description_md: |-
  The Raron Madonna is an enthroned Virgin and Child of lime wood, painted over a chalk ground, 90.5 cm high, made in Burgundy or in Saint-Maurice/Sion about 1120/50; it is in the Swiss National Museum, Zurich (LM 16545).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 42]] Such Romanesque Madonnas in Majesty combine the iconography of the Throne of Wisdom with mobility: they were small enough and light enough to be carried, and therefore made of wood and carved on all sides.[[source/forsyth-1972-the-throne-of-wisdom|p. 8]]

  Lime wood was the most common wood for such statues in Germany and Switzerland, and Forsyth named Raron among her examples.[[source/forsyth-1972-the-throne-of-wisdom|p. 16]] Klaus Endemann cited the Raron Madonna, of the mid-twelfth century, as a late example of the "difficult prior method" of the Ottonian figures, in which the figure and its throne were carved from a single block.[[source/endemann-2020-wood-carving-and-staffering|p. 150]] [[source/endemann-2020-wood-carving-and-staffering|p. 149]] The lecture compared it with the [[artwork/autun-madonna|Autun Madonna]] and discussed it again under the role of wood as material of the Marian image.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 54]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 73]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 84]]
