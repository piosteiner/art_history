description_md: The only one of the more than thirty halls for nine Amida images built in the Insei period — the age of the retired emperors from [[person/emperor-shirakawa]] on — that survives intact; first built in 1107 and moved to the present site of [[institution/joruri-ji]] in 1157. On the west bank of an artificial lake, it recalls a [[shinden-zukuri]] mansion with its black lattice and white paper-panelled interior. A central [[moya]] nine bays long and one deep, the central bay twice as wide for the larger main image; no ceiling, the sloping beams left exposed. Its cypress-bark roof was replaced with tiles in the Edo period. [[source/history-of-japanese-art|pp. 150–151, fig. 181]]
