description_md: "The actor Ichikawa Danjūrō as Gorō, a stocky man with bulging muscles straining to pull a thick bamboo from the ground: the line that marks the body’s contour is remarkably calligraphic. By [[artist/torii-kiyomasu]] (active 1697–mid-1720s) of the [[movement/torii-school]], the family that held a monopoly on Kabuki posters. [[source/history-of-japanese-art|pp. 281–282, fig. 320]]"
