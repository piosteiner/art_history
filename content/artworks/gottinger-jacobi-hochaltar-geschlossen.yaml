description_md: |-
  The closed state – the "everyday side" – of the high altarpiece of St. Jacobi in Göttingen (1402): scenes from the life of Saint James the Greater, the patron of the church.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 28]][[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]] Wikipedia counts eight scenes from the legend of the saint.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]]

  On ordinary days the congregation saw only these paintings; the Sunday and feast-day sides were revealed by opening the wings.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]] The choice of the saint's legend for the everyday view fits a church whose patron was the saint of pilgrims and which stood on the Way of St James.[[source/wikipedia-de-st-jacobi-gottingen|§ Geschichte]]
