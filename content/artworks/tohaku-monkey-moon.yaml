institution: konchi-in
description_md: Four fusuma in the teahouse of Konchiin by [[artist/hasegawa-tohaku]] (1539–1610), based on [[artist/mu-qi]]’s mother monkey at Daitokuji, which Tōhaku saw through [[person/sen-no-rikyu]]. The monkey, symbol of the unenlightened in Zen, clings to a thin branch with one long arm and reaches for the moon’s reflection in the pond, mistaking it for the real thing — an allegory of the impossibility of possessing absolute knowledge. [[source/history-of-japanese-art|pp. 260–261, fig. 300]]
