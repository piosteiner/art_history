description_md: |-
  An altarpiece of the Adoration of the Magi by [[artist/domenico-ghirlandaio|Domenico Ghirlandaio]], painted on a wooden panel, 285 × 243 cm, for the Spedale degli Innocenti, the foundling hospital of Florence, and completed in 1488.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]] Ghirlandaio included a self-portrait in it.[[source/wikipedia-en-domenico-ghirlandaio|§ Later works in Tuscany]] Its predella was painted by [[artist/bartolomeo-di-giovanni|Bartolomeo di Giovanni]], whom Bernard Berenson, not knowing his name, had called the "Alunno di Domenico" because of this work.[[source/wikipedia-en-bartolomeo-di-giovanni|introduction]]

  ## The contract

  The painting is known for its contract, which Michael Baxandall quotes in *Painting and Experience in Fifteenth Century Italy* (1972).[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]] On 23 October 1485 Francesco, the prior of the Spedale degli Innocenti, commissioned Domenico to paint a wooden panel that Francesco had had made and supplied; Domenico was to pay for the panel, to colour and paint it with his own hand as shown in a drawing on paper, with the figures and in the manner shown there in every detail, and not to depart from the manner and composition of that drawing.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]] He was to colour the panel at his own expense with good colours and with powdered gold on the ornaments that required it, bear all further costs, and use ultramarine worth about four florins the ounce; his price was to be 115 large florins, if the friar Bernardo, writing the document, judged the work worth that sum.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]]

  Baxandall observed that as the 15th century went on, contracts with Italian painters said less and less about gold and ultramarine — the gold increasingly reserved for the frame — and that the conspicuous consumption of precious pigments was replaced by the equally conspicuous consumption of something else, artistic skill: the decisive distinction became that between the value of precious materials and the value of skilful working of materials.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 33]] Vasari, too, says that Ghirlandaio was the first to give up gilding to a great extent, painting golden objects instead — though gold leaf still appears in some of his altarpieces.[[source/wikipedia-en-domenico-ghirlandaio|§ Critical assessment and legacy]]

  ## In the lecture

  The lecture "Aus dem Wald" set the contract beside Baxandall's later book on the limewood sculptors of southern Germany, asking whether the value of the material was replaced by the value of art.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 27]][[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 33]] In the Ghirlandaio contract the wooden panel is made and supplied by the prior but paid for by the painter, who also answers for the pigments, the gold and the work of his own hand.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 34]]

  The museum dates it 1488–89, tempera and oil on panel, 285 × 240 cm: the commission is represented by the prior Francesco Tesori and by richly dressed figures, probably portraits of members of the silk guild (Arte della Seta); the painter signs the work with his self-portrait. Kneeling, Saint John the Baptist, patron of Florence, and Saint John the Evangelist, patron of the guild, attend the scene with two small martyrs of the Massacre of the Innocents; the men at work in the background perhaps show the building of the hospital.[[source/museo-degli-innocenti-percorso-arte|no. 6]]
