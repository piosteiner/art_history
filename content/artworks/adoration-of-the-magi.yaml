provenance:
  - owner_label: the Augustinian monks of San Donato a Scopeto
    acquired: 1481-07
    method: commission
    label: commissioned for the high altar of their church outside the walls; Leonardo left for Milan in 1482, the friars later commissioned Filippino Lippi (1496)
    sources:
      - url: https://www.uffizi.it/en/artworks/leonardo-adoration-of-the-magi
        note: A document from July 1481 states that Leonardo da Vinci had received a commission from the Augustinian monks to paint a panel for the high altar in the church of San Donato in Scopeto, outside Florence’s city walls. […] The Augustinian friars waited in vain for the artist to return
        source: uffizi-artworks
        accessed: 2026-10-20
  - owner_label: Amerigo de' Benci
    place: florence
    label: left unfinished in his house (the father of Ginevra), where Vasari saw it
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Leonardo%29
        note: L'Adorazione di Leonardo nel frattempo era rimasta allo stato di abbozzo in casa Amerigo de' Benci, il padre di Ginevra, della quale Leonardo dipinse un famoso ritratto; qui la vide Vasari.
        source: wikipedia-it-adorazione-leonardo
        accessed: 2026-10-20
  - owner: person/antonio-de-medici
    acquired: before 1601
    place: florence
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Leonardo%29
        note: Nel 1601 si trovava nelle raccolte di don Antonio de' Medici e, dopo la morte di suo figlio Giulio, nel 1670 approdò alle Gallerie fiorentine.
        source: wikipedia-it-adorazione-leonardo
        accessed: 2026-10-20
  - owner_label: Giulio de' Medici, Antonio's son
    ended: 1670
    method: inheritance
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Leonardo%29
        note: dopo la morte di suo figlio Giulio, nel 1670 approdò alle Gallerie fiorentine
        source: wikipedia-it-adorazione-leonardo
        accessed: 2026-10-20
  - owner: institution/uffizi-gallery
    acquired: 1670
    method: inheritance
    place: florence
    label: in the Florentine Galleries; at the villa of Castello around 1681 (the frame lost then), back in the museum for good in 1794
    sources:
      - url: https://it.wikipedia.org/wiki/Adorazione_dei_Magi_%28Leonardo%29
        note: nel 1670 approdò alle Gallerie fiorentine. Nel 1681 andò perduta la cornice cinquecentesca con dorature, probabilmente in occasione dello spostamento della tavola alla villa di Castello. Dal 1794 tornò definitivamente al museo.
        source: wikipedia-it-adorazione-leonardo
        accessed: 2026-10-20
