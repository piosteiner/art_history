description_md: "Exhibited at the Bunten of 1908 by [[artist/ogiwara-morie]] (1879–1910), who had seen Rodin’s Thinker in Paris and become his frequent visitor: the twelfth-century warrior-monk [[person/mongaku]], restorer of Jingoji, who had accidentally killed the married woman he loved — powerful physical distortions, the broad shoulders and strong gaze evoking the monk’s strong but aged body. Ogiwara, too, loved a married woman. [[source/history-of-japanese-art|p. 359, fig. 423]]"
