description_md: |-
  The Lindau Gospels (New York, Morgan Library, MS M.1) appeared in the lecture with a cover of 34.4 × 26.2 cm dated about 860, set beside the [[artwork/gero-cross|Gero Cross]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 64]] [[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 68]] The manuscript is famous above all for its treasure binding, whose metal covers are of different periods.[[source/wikipedia-en-lindau-gospels|§ Introduction]] The back cover, in Insular style, was probably made in the later eighth century in present-day Austria; the upper cover, with a Crucifixion in low repoussé relief and lavish gems, is late Carolingian work of about 880; the text was written and decorated at the Abbey of St Gall about the same time or slightly later.[[source/wikipedia-en-lindau-gospels|§ Introduction]] [[source/wikipedia-en-lindau-gospels|§ Upper cover]]

  The upper cover is attributed to the workshop associated with Emperor Charles the Bald (his "Palace School"), which also made the cover of the Codex Aureus of St Emmeram (870).[[source/wikipedia-en-lindau-gospels|§ Upper cover]] Ilene Forsyth cited "the attenuated elegance of the figures on the famous Lindau Book Cover in New York" as testimony to the skill of early medieval goldsmiths.[[source/forsyth-1972-the-throne-of-wisdom|p. 11]] The book is first securely documented in 1691 in the canonesses' foundation on the island of Lindau; J. P. Morgan bought it in 1901, his first major purchase of a medieval manuscript.[[source/wikipedia-en-lindau-gospels|§ History]] [[source/wikipedia-en-lindau-gospels|§ Introduction]]
