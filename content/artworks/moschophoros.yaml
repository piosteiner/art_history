provenance:
  - owner_label: Rhombos (dedicator)
    acquired: c. 560 BCE
    method: creation
    place: athens
    label: votive statue dedicated on the Athenian Acropolis by one Rhombos (name incomplete; possibly Kombos or Bombos)
    sources:
      - url: https://en.wikipedia.org/wiki/Moschophoros
        note: The inscription on that plinth claims that this statue was dedicated by someone named Rhombos (possibly Kombos or Bombos; the beginning of the name is missing).
        source: wikipedia-en-moschophoros
        accessed: 2026-11-24
  - owner_label: unknown
    role: event
    acquired: 1864
    method: find
    place: athens
    label: body excavated in fragments in the Perserschutt on the south-east Acropolis in 1864; the base found in 1887
    sources:
      - url: https://en.wikipedia.org/wiki/Moschophoros
        note: It was excavated in fragments in the Perserschutt on the Acropolis of Athens in 1864. … The sculpture was found on the Athenian Acropolis in 1864. In 1887, the base was discovered.
        source: wikipedia-en-moschophoros
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Kalbträger
        note: Der Körper wurde 1864, die Basis 1887 bei Ausgrabungen auf der südöstlichen Akropolis von Athen im sogenannten Perserschutt gefunden.
        source: wikipedia-de-kalbtraeger
        accessed: 2026-11-24
      - url: https://el.wikipedia.org/wiki/Μοσχοφόρος
        note: Το σώμα βρέθηκε το 1864 και η βάση το 1887 στην Περσική Τάφρο, στις ανασκαφές της Ακρόπολης.
        source: wikipedia-el-moschoforos
        accessed: 2026-11-24
  - owner: institution/acropolis-museum
    place: athens
    label: now in the Acropolis Museum (earlier history in the old Acropolis Museum not covered by the sources read)
    sources:
      - url: https://en.wikipedia.org/wiki/Moschophoros
        note: The statue, dated c. 560 BC and estimated to have originally measured 1.65 meters (5.4 ft) in height, is now in the Acropolis Museum in Athens, Greece.
        source: wikipedia-en-moschophoros
        accessed: 2026-11-24
      - url: https://de.wikipedia.org/wiki/Kalbträger
        note: Heute wird die Statue im Akropolis-Museum in Athen aufbewahrt.
        source: wikipedia-de-kalbtraeger
        accessed: 2026-11-24
