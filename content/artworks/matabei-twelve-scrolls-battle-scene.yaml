description_md: |-
  A scene from a set of twelve scrolls attributed to [[artist/iwasa-matabei|Iwasa Matabei]] (1578–1650), dated about 1625–30 and painted in colours, metals and ink on paper. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]] The lecture's title breaks off after "The Tale of" — which of the Matabei scroll sets this is remains to be found. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]]

  ## The artist and his scrolls

  Matabei is traditionally credited with the parentage of the whole ukiyo genre, although the only works attributed to him are paintings. [[source/history-of-japanese-art|p. 278]] He pioneered a style in which wiry black outlines and bright colours were combined with themes showing human beings in moments of extreme emotion — caught in the noise and confusion of a festival, or even crimes of passion. [[source/history-of-japanese-art|p. 278]] He took this manner from Kyoto to Fukui, where he worked for the daimyo Matsudaira Tadanao and his son, and in 1637 to Edo. [[source/history-of-japanese-art|p. 278]] His workshop painted long emakimono on the texts of jōruri narratives; the MOA Museum of Art keeps three such sets, the *Yamanaka Tokiwa monogatari emaki*, the *Jōruri monogatari emaki* and the *Horie monogatari emaki*. [[source/wikipedia-en-iwasa-matabei|§ Notable works]] The *Yamanaka Tokiwa* tells of Ushiwaka's revenge for the murder of his mother, Tokiwa Gozen, and the *Horie monogatari* of a son who avenges his parents. [[source/wikipedia-en-iwasa-matabei|§ Notable works]] Few works can be given to Matabei with certainty, and scholars disagree whether his paintings are ukiyo-e themselves. [[source/wikipedia-en-iwasa-matabei|introduction]]

  ## In the lecture

  The scene was shown on 22 March 2019 in the session "The Tools of War", between the *Jūnirui kassen emaki* of the 15th century and the *Tale of the Heiji Rebellion* of the 13th. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]] Matabei's style, Mason suggests, appealed to the rough townsmen and low-ranking samurai of early Edo, with their taste for action-packed Kabuki plays, and may have made the designs of the early printmakers more intense and forceful. [[source/history-of-japanese-art|p. 278]]
