description_md: |-
  The left wing of the Holy Blood altarpiece in St. Jakob, Rothenburg ob der Tauber: a limewood relief of Christ's Entry into Jerusalem by [[artist/tilman-riemenschneider|Tilman Riemenschneider]], carved in 1501–1505 and left unpainted.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 82, 85]]

  With the Last Supper in the shrine and the Prayer on the Mount of Olives on the right wing, the relief completes a sequence of three Passion scenes that frame the relic of Christ's blood kept above in the superstructure.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 83, 85]] The case of the altarpiece is by the cabinetmaker [[artist/erhart-harschner|Erhart Harschner]].[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 85]] In Riemenschneider's altarpieces the reliefs on the wings, like the central scene, are framed by foliage ornament.[[source/wikipedia-de-tilman-riemenschneider|§ Material und Stil]]
