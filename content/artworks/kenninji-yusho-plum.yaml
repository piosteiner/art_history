description_md: "From a series of twelve fusuma by [[artist/kaiho-yusho]] (1533–1615) for the Zenkoan, a subtemple of [[institution/kennin-ji]]. Yūshō, a samurai’s son who was saved by being a ward of Tōfukuji when his father and brothers fell in 1573, left the temple at forty-one to become a painter, trained by a Kanō master. Quick calligraphic strokes on white: an ancient, rough-barked plum with thin, sword-like branches and new blossoms; an indistinct pine of broad, dry strokes sheltering two black mynah birds — each tree isolated, to reaffirm the Zen ideal of unity between man and nature. [[source/history-of-japanese-art|pp. 263–265, figs. 303–304]]"
