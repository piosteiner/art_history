description_md: |-
  The crucifix torso from St Georg in [[place/cologne|Cologne]] is a willow-wood corpus of about 1067 with remains of the original polychromy, 189.5 cm high, now in the Museum Schnütgen.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 21]] Originally about 210 cm high, it is a notable exception to the rule that crucifixes of the eleventh century are smaller than the large figures of the tenth.[[source/endemann-2020-wood-carving-and-staffering|p. 138]] [[source/endemann-2020-wood-carving-and-staffering|p. 143]] A graphic reconstruction completes the lost arms, feet and loincloth folds.[[source/endemann-2020-wood-carving-and-staffering|p. 138]]

  As with the [[artwork/ringelheimer-kruzifix|Ringelheim Crucifix]], the sculptor deliberately chose a bent tree into which the tense curve of the body could be carved without wasting material.[[source/endemann-2020-wood-carving-and-staffering|p. 151]] The figure is carved from an entire trunk and has a divided cavity in the back, closed at the bottom.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] Endemann's reconstruction of its carving shows forms first cut into facets, then refined and smoothed with a paring chisel held at a right angle.[[source/endemann-2020-wood-carving-and-staffering|p. 168]] A V-shaped tool may have been used for beard and loincloth hem.[[source/endemann-2020-wood-carving-and-staffering|p. 170]] The original surface was probably modelled perfectly, but medieval and later restorations have obscured it.[[source/endemann-2020-wood-carving-and-staffering|p. 172]] Its oldest paint layers lack a ground layer; the hair and beard were reddish brown, like the Child's hair on the [[artwork/imad-madonna|Imad Madonna]], recalling Romanesque book painting.[[source/endemann-2020-wood-carving-and-staffering|pp. 172–173, 176]]
