description_md: "A [[yoroi]] of the kind a daimyo would wear for battle: a densely woven padding of lacquered iron and leather scales laced with silk, the decorative parts of gilt copper and doeskin; on the breastplate a stencilled, coloured image of Fudō. The decoration is intact, so the armour probably never took a blow — great daimyo, like their European equals, usually directed battles from a distance. [[source/history-of-japanese-art|pp. 176–178, fig. 204]]"
