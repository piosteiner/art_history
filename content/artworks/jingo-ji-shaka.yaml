description_md: "Shaka as the sole subject, seated on a brightly coloured lotus throne and making the fear-not gesture. His body, outlined in red and painted golden yellow, seems to radiate light against the dark ground; [[kirikane]] floral patterns fill his halo and rays, and his red robe carries an overall pattern of circles with eight-petalled blossoms. The iconography is that of Amida images, the body hardly modelled: a luminous being held in a net of gold lines. [[source/history-of-japanese-art|p. 149, fig. 180]]"
