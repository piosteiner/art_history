description_md: "Imaginary portraits by [[artist/unkei]] of the Indian brothers Asanga (Muchaku) and Vasubandhu (Seshin), early [[rakan]] whose philosophy was central to the Hossō school of Kōfukuji. Muchaku is slender, holding a cylindrical object wrapped in cloth, perhaps a reliquary — reflective and turned inward; Seshin is fleshy and gestures as he speaks, seeking the viewer’s eye. Free-standing, naturally posed, in deeply carved robes: completely believable figures. [[source/history-of-japanese-art|pp. 189–191, figs. 220–221]]"
