description_md: The standing statues of the Indian monks Mujaku (Asanga) and Seshin (Vasubandhu), completed in 1212 for the rebuilt Northern Round Hall (Hokuendō) of Kōfuku-ji[[source/tnm-unkei-exhibition-2017|“in 1212 (Kenryaku 2), he completed standing images of Mujaku Bosatsu and Seshin Bosatsu (No. 20) for the restored Northern Round Hall of Kohfukuji”]], each about six feet high, among the figures of the hall made from 1208 by Unkei with his six sons and his senior pupils[[source/kobayashi-1954-unkei|“In Dec. 1208, the erection of the statues of Hokuen-do, North Round Hall, of Kofuku-ji Temple, was commenced, in which he was enganged with his six sons” · “two standing statues of Mujaku and Seshin (each 6 feet high)”]]. Kobayashi saw Unkei here as the master in charge, without carving of his own[[source/kobayashi-1954-unkei|“Here we must notice that at this big construction work, he was the superintendant, and had no sculptural work of his own”]].
