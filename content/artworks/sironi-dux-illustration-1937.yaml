description_md: |-
  An illustration by [[artist/mario-sironi|Mario Sironi]] in a special edition of *La Rivista Illustrata del Popolo d'Italia*, 1937, its dimensions unknown [[source/steiner-2025-mario-sironi|p. 5, fig. 2]]. A rider on horseback is accompanied by the large letters DVX — the "Duce", [[person/benito-mussolini|Benito Mussolini]] — so that the widely used image of a ruler on horseback here clearly refers to him [[source/steiner-2025-mario-sironi|p. 5]].

  *La Rivista Illustrata del Popolo d'Italia* belonged to Mussolini's newspaper, for which Sironi was chief caricaturist for over two decades; with *Il Popolo d'Italia* it received more than 1,700 of his drawings [[source/braun-2000|p. 8]] [[source/wikipedia-en-mario-sironi|§ Biography]]. Emily Braun counts the "omnipotent Duce" among the images by which Sironi first gave visual form to the regime's legitimation [[source/braun-2000|p. 16]]. The same rider returns in relief on the triumphal arch of [[artwork/sironi-italia-fra-le-arti-e-le-scienze]] (1935), where it was painted over in 1950 and uncovered in the restoration of 2015–2017 [[source/steiner-2025-mario-sironi|pp. 5, 10]] [[source/sapienza-2017-sironi-restauro|p. 1]], and in [[artwork/sironi-condottiero-a-cavallo]] [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 71]].
