description_md: |-
  *The Rising Sun* is a hanging scroll ([[term/kakemono|kakemono]]) by [[artist/tsuji-kako|Tsuji Kakō]] (1870–1931), painted in colours and gold on silk in Japan about 1930. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]

  ## The painter

  Tsuji Kakō, born in Kyoto in 1870, was trained by Kōno Bairei in the Maruyama and Shijō schools of painting. [[source/wikipedia-en-tsuji-kako|introduction]] Nihonga in Kyoto centred on artists trained in the Maruyama–Shijō school, which since the eighteenth century had taken in elements of Western realism — perspective, modelling through light and shade, and drawing directly from nature. [[source/history-of-japanese-art|p. 369]] Kakō's Zen training, begun in 1899, shaped much of his painting, and his individual, unconventional manner cost him the popularity of contemporaries such as [[artist/takeuchi-seiho|Takeuchi Seihō]]. [[source/wikipedia-en-tsuji-kako|introduction]] In the last decade of the Meiji era he was preoccupied with the study of waves and experimented with colour. [[source/wikipedia-en-tsuji-kako|introduction]]

  ## In the lecture

  The scroll closed the image list of the session "World War II, Prior and During" on 17 May 2019, after [[artist/yokoyama-taikan|Yokoyama Taikan]]'s [[artwork/taikan-fan-mount-fuji-and-the-rising-sun|fan painting of Mount Fuji and the rising sun]] of the early 1940s. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] Tsuji Kakō is also the last word on that day's vocabulary list. [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]] Painted about a year before the painter's death, the scroll shows the motif that Taikan's wartime fan took up about a decade later. [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]]
