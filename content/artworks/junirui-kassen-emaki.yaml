description_md: |-
  The *Jūnirui kassen emaki* is a handscroll ([[term/emakimono|emakimono]]) of the [[movement/muromachi-period|Muromachi period]], 15th century, painted in colours and ink on paper. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]]

  ## In the lecture

  The lecture showed it in its session of 22 March 2019, "The Tools of War", whose sample objects were Korean armour, samurai swords and iron cannons. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] On the image list it follows the *Illustrated Scroll of the Tale of the Warrior Obusuma Saburō* ([[artwork/obusuma-saburo-ekotoba]]) of the Kamakura period, 13th century, and comes before a scene from a set of twelve scrolls attributed to [[artist/iwasa-matabei|Iwasa Matabei]] and the *Tale of the Heiji Rebellion* with the night attack on the Sanjō Palace. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]] The handscroll thus stood in a sequence of narrative scrolls of warfare from the 13th to the 17th century. [[source/thomsen-2019-war-and-peace|image list, 22 March 2019]]

  Narrative handscrolls of war have older roots: the conflicts of the twelfth century such as the Heiji and Genpei wars were dramatised in epics like the *Heike monogatari*, which brought the war epic into the monogatari form. [[source/history-of-japanese-art|p. 181]] This marked a departure into more aggressive and masculine territory in the medieval period. [[source/history-of-japanese-art|p. 181]]
