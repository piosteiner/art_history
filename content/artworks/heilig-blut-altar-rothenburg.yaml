description_md: "An altarpiece for the relic of the Holy Blood in St. Jakob, Rothenburg ob der Tauber: in 1499 the town council commissioned the casing from [[artist/erhart-harschner|Erhart Harschner]], on 15 April 1501 the figures from [[artist/tilman-riemenschneider|Tilman Riemenschneider]]; the shrine was set up in the west choir together with the reliquary cross on 8 May 1502, and the figures were completed by January 1505. Its scenes are the Entry into Jerusalem, the Last Supper in the shrine and Christ on the Mount of Olives; new were not only the carving but the unpainted, monochrome surface and the retable as a permanent display — the wings have no weekday side. The relic itself, said to be a drop spilled from the chalice at the Last Supper, is kept in the crowning work in the rock-crystal capsule of a reliquary cross of about 1270[[source/wikipedia-de-stadtkirche-st-jakob-rothenburg]] — the date Wikidata gives the altar as a whole."
