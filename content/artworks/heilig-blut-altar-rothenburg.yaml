description_md: |-
  An altarpiece for the relic of the Holy Blood in St. Jakob, Rothenburg ob der Tauber: in 1499 the town council commissioned the casing from [[artist/erhart-harschner|Erhart Harschner]], on 15 April 1501 the figures from [[artist/tilman-riemenschneider|Tilman Riemenschneider]]; the shrine was set up in the west choir together with the reliquary cross on 8 May 1502, and the figures were completed by January 1505. Its scenes are the Entry into Jerusalem, the Last Supper in the shrine and Christ on the Mount of Olives; new were not only the carving but the unpainted, monochrome surface and the retable as a permanent display — the wings have no weekday side. The relic itself, said to be a drop spilled from the chalice at the Last Supper, is kept in the crowning work in the rock-crystal capsule of a reliquary cross of about 1270[[source/wikipedia-de-stadtkirche-st-jakob-rothenburg]] — the date Wikidata gives the altar as a whole.

  ## Material and construction

  The retable is about 9.70 m high and 4.17 m wide.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 35]] Its load-bearing parts and the soaring tracery superstructure (*Sprengwerk*) are of spruce, while the sculptures and the foliage scrolls are of limewood.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 35]] The division of labour follows the materials: Harschner made the casing, Riemenschneider the figures, among them the Last Supper in the central shrine.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 36]]

  Limewood was the central carving medium of southern Germany, the wood of the region's central genre, the retable altarpiece.[[source/baxandall-1980-limewood-sculptors|p. 27]] Michael Baxandall stresses that the monochrome altarpieces of Riemenschneider were never bare, unfinished wood: new limewood is an impractically light colour that discolours unevenly, and in a large complex the pieces of timber differ in shade, so brown-tinted glazes were applied to protect, unify and darken the wood.[[source/baxandall-1980-limewood-sculptors|p. 44]] The glaze on the Holy Blood altarpiece has been analysed: it "consists of egg-white and oil coloured with ochre, black, lime and lead-white, and it was applied direct to the wood".[[source/baxandall-1980-limewood-sculptors|p. 44]] Giving up the coat of gesso that polychromy required freed the carver to work the surface of the wood itself, and the best sculptors used this to find a substitute for the multi-textured effect of painted figures.[[source/baxandall-1980-limewood-sculptors|p. 44]] Riemenschneider had made the first known monochrome limewood retable, at Münnerstadt in 1490–1492; from the 1490s on it was possible to choose between polychromy and monochromy.[[source/baxandall-1980-limewood-sculptors|p. 42]] Baxandall also warns that much bare-wood sculpture seen today is polychrome sculpture that has lost its paint, and that original wood-coloured glaze has sometimes been removed in the belief that it was Victorian varnish.[[source/baxandall-1980-limewood-sculptors|p. 48]]

  ## In the lecture

  In the lecture "Aus dem Wald" the altarpiece illustrates the question of material as Baxandall framed it: wood as a potential that the masters — Michel Erhart, Riemenschneider, Veit Stoss and Hans Leinberger — exploited with skill, while the ecological and economic qualities of wood and its meaning as a symbol stay largely outside his view.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 32]]
