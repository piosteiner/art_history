description_md: |-
  A reliquary of the True Cross in the form of a triptych, made by Mosan goldsmiths around 1150 (Wikipedia: around 1156) at the abbey of Stavelot in present-day Belgium; it is of gilded copper with enamel, 48.4 × 66 cm, and is now in the Morgan Library & Museum, New York.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 23]][[source/wikipedia-en-stavelot-triptych|§ introduction]]

  ## Description

  The wings of the outer triptych close over a central panel holding two smaller Byzantine triptychs with relics of the True Cross; these are in cloisonné enamel, while the six large medallions on the wings are in the champlevé technique in which Mosan metalworkers led Europe.[[source/wikipedia-en-stavelot-triptych|§ Description]] The medallions tell the legend of the Cross: on the left wing the conversion of Constantine (his dream before the battle at the Milvian Bridge, his victory under the cross, his baptism), on the right Saint Helena's finding of the True Cross.[[source/wikipedia-en-stavelot-triptych|§ Description]] The larger inner triptych shows Constantine and Helena beside two slivers of the Cross, the smaller one a Crucifixion with the Virgin and Saint John; the black velvet background is modern and was originally gold set with stones.[[source/wikipedia-en-stavelot-triptych|§ Description]]

  ## History

  The Byzantine inner triptychs predate the Mosan outer one by some decades; it is thought that Prince-Abbot Wibald of Stavelot received them as diplomatic gifts in Constantinople, where Frederick Barbarossa sent him in 1154, and then commissioned the outer triptych.[[source/wikipedia-en-stavelot-triptych|§ Description]] The last prince-abbot took it to Germany during the Napoleonic Wars; in 1910 a London dealer bought it and sold it to J. P. Morgan.[[source/wikipedia-en-stavelot-triptych|§ Description]]

  In the lecture it served as an early example of the "logic of the shrine" – the wings as doors that protect and reveal the holy – in a sequence leading from reliquaries and ivory triptychs to the winged altarpieces of the late Middle Ages.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 23–26, 35]]
