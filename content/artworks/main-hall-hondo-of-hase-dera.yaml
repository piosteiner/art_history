    label: built 1645–1650 by the Edo shogunate with a donation from Tokugawa Iemitsu; master carpenter Nakai Yamato-no-kami Masazumi; Hase-dera (Shingon, Buzan school) is the owner today
    sources:
      - url: https://kunishitei.bunka.go.jp/heritage/detail/102/2644
        note: 現在の本堂は、慶安三年（一六五〇）に完成した間口九間、奥行九間に達する巨大な建築で、造営は大工中井大和守正純、小工今奥和泉守、今村河内守があたった。 … 長谷寺本堂は、江戸幕府による大規模な造営になる近世初期の代表的な寺院本堂である。 … 所有者名 ： 長谷寺
        source: kunishitei-102-2644
        accessed: 2026-11-24
      - url: https://ja.wikipedia.org/wiki/%E9%95%B7%E8%B0%B7%E5%AF%BA
        note: 現存の本堂は、徳川家光の寄進を得て正保2年（1645年）から工事に取り掛かり、5年後の慶安3年（1650年）に落慶したものである。
        source: wikipedia-ja-hase-dera
