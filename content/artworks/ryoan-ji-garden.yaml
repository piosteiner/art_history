medium: Stones, pebbles, moss
institution: ryoan-ji
location: [135.71833, 35.03444]
description_md: "The most famous [[karesansui]]. The temple was founded in 1450 by [[person/hosokawa-katsumoto]], one of the instigators of the Ōnin War, and rebuilt by 1488 by his son Masamoto; the garden, 23 by 9 metres, existed by 1500 at the latest — the present one dates from after a fire of the late eighteenth century. Fifteen rocks set in raked pebbles: a seascape, or a tigress leading her cubs across a river. Traditionally credited to [[artist/soami]] without evidence; two [[kawaramono]], Kotarō and Seijirō, inscribed their names on a stone. [[source/history-of-japanese-art|pp. 215–216, fig. 250]]"
