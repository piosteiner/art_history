description_md: |-
  The Imad Madonna is an enthroned Virgin and Child of lime and oak wood, 112 cm high, with remains of its original polychromy, dated by the lecture to 1051–1058 and kept in the Erzbischöfliches Dom- und Diözesanmuseum in [[place/paderborn|Paderborn]].[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 16]] Forsyth dated it ca. 1051–1076.[[source/forsyth-1972-the-throne-of-wisdom|p. 10]]

  ## A painted cult image

  The Imad Madonna marks a break with the gold-clad statues of [[artwork/goldene-madonna-essen|Essen]] and [[artwork/grosse-goldene-madonna-hildesheim|Hildesheim]]: in its original state it was only painted, not set in a metal sheath.[[source/endemann-2020-wood-carving-and-staffering|p. 139]] It was the first of the preserved early wooden statues to be completely polychromed, and the only one whose early colour system can be reconstructed.[[source/endemann-2020-wood-carving-and-staffering|pp. 174–175, 178]] Its noble dignity was underscored by a calm, almost monochrome colour scheme that seems indebted to its metal predecessors.[[source/endemann-2020-wood-carving-and-staffering|p. 175]] Tunic and *palla* were white, bordered with a red fringe; red lines accented the folds and the tunic carried a dense pattern of small red circles.[[source/endemann-2020-wood-carving-and-staffering|pp. 180–181]] The Child wore a grey-blue tunic studded with small red stars, a malachite-green cushion lay on the throne, and the Child's hair was reddish brown.[[source/endemann-2020-wood-carving-and-staffering|p. 181]] Walnut oil served as binder for the blue of the Child's tunic, and traces of a thick oil varnish survive.[[source/endemann-2020-wood-carving-and-staffering|p. 182]] Here too, for the first time, the paint layers were built up over a white ground covering the whole surface.[[source/endemann-2020-wood-carving-and-staffering|pp. 173–174]]

  ## Carving

  The sculptor carved the very large figure (over 90 cm in diameter) together with its throne from one block, as at Hildesheim; the throne later broke because of the fragility of this hollow structure.[[source/endemann-2020-wood-carving-and-staffering|p. 149]] Radial cracks began to open in the massive block during carving; the sculptor pierced them to stop further breakage and later trimmed and burnished them.[[source/endemann-2020-wood-carving-and-staffering|pp. 163–164]] The Child's right hand, raised in blessing, is set into the sleeve with an almost invisible teardrop-shaped join otherwise known only from ivory carving.[[source/endemann-2020-wood-carving-and-staffering|p. 160]] A strip of fine canvas lies beneath the plate that closes the reliquary cavity.[[source/endemann-2020-wood-carving-and-staffering|p. 160]] The Madonna had relics, but no relic of the Virgin.[[source/fehrenbach-1996-die-goldene-madonna|p. 57]]

  ## Later history

  After the figure was severely damaged in the fire of Paderborn Cathedral in 1058, it was repaired and sheathed with gilded copper plating.[[source/endemann-2020-wood-carving-and-staffering|p. 160]] [[source/endemann-2020-wood-carving-and-staffering|p. 147]] It was stripped of this sheath in 1762.[[source/forsyth-1972-the-throne-of-wisdom|p. 15]] [[source/endemann-2020-wood-carving-and-staffering|p. 156]]
