description_md: "An illuminated copy of Gregory the Great's Moralia in Job, a commentary on the Book of Job and one of the most popular theological texts of its time, made at [[institution/citeaux-abbey|Cîteaux Abbey]] around 1111 by its [[artist/citeaux-scriptorium|scriptorium]]: five scribes and one illuminator. Many of its pictures show scenes of violence; the decidedly English style is explained by the English abbot Stephen Harding. It served as the model for a copy made at La Ferté Abbey, whose pictures are less violent and closer to the regional Burgundian style. Today in the Bibliothèque municipale of Dijon.[[source/wikipedia-en-citeaux-moralia-in-job]]"
