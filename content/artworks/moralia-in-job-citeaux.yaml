description_md: |-
  An illuminated copy of Gregory the Great's Moralia in Job, a commentary on the Book of Job and one of the most popular theological texts of its time, made at [[institution/citeaux-abbey|Cîteaux Abbey]] around 1111 by its [[artist/citeaux-scriptorium|scriptorium]]: five scribes and one illuminator. Many of its pictures show scenes of violence; the decidedly English style is explained by the English abbot Stephen Harding. It served as the model for a copy made at La Ferté Abbey, whose pictures are less violent and closer to the regional Burgundian style. Today in the Bibliothèque municipale of Dijon.[[source/wikipedia-en-citeaux-moralia-in-job]]

  ## The initial of *Intellectus*

  The lecture "Aus dem Wald" showed the I-initial of the word *Intellectus* on fol. 41r of Ms. 173 in Dijon, dated 1111, on three slides.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 34]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 35]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 36]] It illustrated the question whether the High Middle Ages were a time of "great clearings".[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 33]] Since Charles Higounet's study of 1965 on the forests of western Europe, the 11th to 13th centuries have counted as the age of *les grands défrichements*, when forest was turned into ploughland by felling the trees and removing the stumps.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 33]] More recent research criticises the weak data behind this thesis — vague terms in the written sources and the lack of comprehensive empirical studies — and assumes a smaller share of closed forest at the beginning of the Middle Ages and regionally different developments: in England only 15 per cent of the land was wooded in 1086, and in France the forest is said to have shrunk from 30 to 13 million hectares between the time of Charlemagne and Philip IV around 1300.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 33]] The lecture went on to clearing as the precondition for intensive farming — more grain, the horse-drawn iron plough and the slow change from two- to three-field rotation, which is seen as a precondition for Europe's population growth from the 8th century.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 37]]
