description_md: "The golden hall of Tōshōdaiji, seven bays wide and four deep, the best example of building at the end of the Nara period: long and low, with three-stepped brackets and a simple hipped roof — raised by 2.5 m in the Edo period. Inside the [[artwork/toshodai-ji-birushana]] between the [[artwork/toshodai-ji-senju-kannon]] and the [[artwork/toshodai-ji-yakushi]]. [[source/history-of-japanese-art|p. 71, fig. 83]]"
