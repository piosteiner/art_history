description_md: |-
  A tapestry of woodcutters at work in a forest, woven in wool and silk about 1460 in the workshop of [[artist/pasquier-grenier|Pasquier Grenier]]; it measures 315 × 495 cm and is in the [[institution/musee-des-arts-decoratifs|Musée des Arts Décoratifs]] in Paris.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 2]] The lecture "Aus dem Wald" opened with it and returned to it twice.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 21]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 66]]

  ## Description

  Aby Warburg described the hanging in 1907 in his essay on working peasants on Burgundian tapestries, which he treated as "textile Bilderfahrzeuge", textile vehicles of images.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 3]] Eight woodcutters labour in an oak forest.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 3]] In the middle of the picture one brings down a tree that he has cut above the root; beside him a second lops the larger branches off a trunk; two in the foreground chop up the felled trunks with an axe or a sickle-shaped billhook, while two sturdy woodmen do the sawing.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 3]] The split logs are stacked by a man in a turban-like headdress, and his neighbour, the only idle one, fortifies himself with a hearty swig from a capacious bottle.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 3]]

  Warburg found the single figures surprisingly true to nature in pose and expression, but missed a higher perspectival unity: the weaver's urge to fill (*Fülltrieb*) destroys the space with foliage and a teeming crowd of animals — monkeys, stags, roe deer, pheasants, rabbits and even wild beasts, a lion, a wolf and a leopard, gathered in the forest for decorative purposes — while the great hunting mastiff in the foreground seems unwilling to disturb this animal paradise in earnest.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 4]]

  ## Grenier and the woodcutter tapestries

  Pasquier Grenier of Tournai, long thought to be a master weaver, was in fact one of the leading tapestry dealers of 15th-century Europe, who owned designs and cartoons and had them woven by workshops in Tournai, Bruges and Antwerp.[[source/wikipedia-en-pasquier-grenier|introduction; § Death and legacy]] Woodcutter tapestries are documented among his sales: in 1461 Philip the Good, Duke of Burgundy, bought a suite (*chambre*) of nine pieces with woodcutters — wall hangings, cushions and bed covers of linen and silk — and in 1466 another for his niece Catherine of Bourbon, Duchess of Guelders; in 1505 Grenier's son Jean sold a further set, probably from the same cartoons, to Philip the Handsome.[[source/wikipedia-en-pasquier-grenier|§ Woodcutters]]

  ## The forest as a worked landscape

  For the lecture the tapestry stands for the forest of the pre-modern period as a natural space intensively used and shaped by people: a hunting ground for bears, wild boar and deer, a pasture for pigs, goats, sheep and cows, a source of fuel and fertiliser in its branches, twigs and leaves, and the supplier of timber for building, crafts and burning.[[source/ganz-2024-aus-dem-wald|Sitzung 1 (26.9.2024), Folie 20]] In the second session it reappeared in the section on human use of forests, beside the months of the Torre Aquila in Trento.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 66]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 67]] The forest historian Hansjörg Küster describes how, in the Middle Ages and the early modern period, forests were pushed back far in many places, and timber was traded over long distances, above all along the Rhine, rafted down the rivers to the centres of consumption.[[source/fansa-vorlauf-2007-holz-kultur|p. 31]] In woods used continually, trees that sprout again from the stump after felling, such as oak and hornbeam, were favoured.[[source/fansa-vorlauf-2007-holz-kultur|pp. 30–31]]
