description_md: |-
  The fully opened state – the second opening or "feast-day side" – of the high altarpiece of St. Jacobi in Göttingen (1402): the Coronation of the Virgin and saints.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 30]] Wikipedia describes it as the Coronation of Mary as Queen of Heaven in the presence of saints.[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]]

  This view was shown only on feast days; on other days the altarpiece showed the legend of Saint James (closed) or scenes from the childhood and Passion of Christ (Sunday side).[[source/wikipedia-de-st-jacobi-gottingen|§ Ausstattung]]
