description_md: |-
  The forked crucifix (Gabelkreuz) in St. Maria im Kapitol, Cologne, dated 1304, is an early example of the crucifixus dolorosus, the "suffering crucified Christ" of around 1300.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 41]][[source/wikipedia-de-gabelkreuz|§ Vorkommen]] It hangs in a chapel of the ambulatory.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 41]]

  ## Material and construction

  The corpus, 1.75 m high, is carved in walnut; the Y-shaped cross, 3.00 m high, is made of softwood and oak.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 41]] The figure is covered with canvas and a chalk ground and carries two layers of paint.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 41]] Restorers' drawings show a wooden core built up from added pieces and a cavity in the chest; a view into this cavity in 2000 showed the relics kept there, and X-rays revealed iron bands holding the construction together.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 54–58]]

  ## A new image of the Crucifixion

  The lecture presented the cross as a new type of Crucifixion image – the wounded Christ on the forked cross – and set it against the [[artwork/gero-cross|Gero Cross]] of 970/990 in Cologne Cathedral, an oak corpus 187 cm high.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 40, 42]] The new type belongs to the late medieval devotion of compassio and imitatio Christi: visionaries such as the Cistercian nun Lukardis of Oberweimar (c. 1262–1309) and [[person/heinrich-seuse|Henry Suso]] (1295/97–1366) sought to share Christ's wounds in their own bodies.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 71, 78–81]]

  ## Date and influence

  The cross was long held to be the oldest forked crucifix of all; restoration work showed instead that it was not the original form of the type but probably prompted its spread in the Rhineland.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] Wikipedia gives its date as before 1312.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] Recent restoration largely uncovered the second, late medieval painting; small windows onto the first painting show striking similarities with the original painting of the cross in Bocholt, which took the Cologne cross as its model, though the painters were different.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]] In style the figure can hardly be linked to Rhenish or Cologne sculpture of its time; connections to crosses in other countries, above all Italy, suggest that the first forked crucifixes were imports or the work of travelling carvers.[[source/wikipedia-de-gabelkreuz|§ Vorkommen]]

  The lecture compared it with the forked crosses of Bocholt (before 1315), Andernach (1320/40), St. Georg in Cologne (around 1380) and Thorr (early fourteenth century).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 62–67]] The standard study is Godehard Hoffmann's monograph of 2006.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 61]]
