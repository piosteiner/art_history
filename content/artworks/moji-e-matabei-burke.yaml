description_md: "A beggar and a samurai retainer whose thick black outlines are in fact [[hiragana]] — tsu ma ichi (“beggar”) and orei o mōshi sōrō (“I humbly thank you”): [[moji-e]] in the witty brushwork identified with [[artist/iwasa-matabei]] (1578–1650), traditionally credited with founding the ukiyo genre. Christine Guth has seen in such images the playfulness (asobi) of Edo art and the growing literacy of its public. [[source/history-of-japanese-art|pp. 278–279, fig. 316]]"
