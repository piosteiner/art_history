provenance:
  - owner: artist/el-greco
    acquired: c. 1608–1614
    method: creation
    place: toledo
    label: upper (heavenly) part of an Annunciation, probably for the chapel of the Hospital de Tavera, Toledo; left unfinished; later cut down (when unknown)
    sources:
      - url: https://www.nationalgallery.gr/en/artwork/the-concert-of-the-angels/
        note: This strange yet “modern” painting is the heavenly section of an “Annunciation”, today in the collections of a Madrid bank. It is one of the very last works painted by Greco shortly before he died in Toledo in 1614. Left unfinished, the painting teaches us a lot about the artist’s technique.
        source: national-gallery-athens-p152
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Concert_of_Angels
        note: art historians have disputed whether this painting is a finished work or part of a working study for a commission of the Annunciation for the chapel of the Hospital de Tavera. … It once formed part of a threesome of paintings for the chapel. It is unknown when the paintings were removed from the chapel. It is also unknown when this painting was cut down, but Tiziana Frati assumes it was done in the latter half of the 19th century.
        source: wikipedia-en-concert-of-angels
        accessed: 2026-11-24
  - owner: institution/national-gallery-of-athens
    acquired: 1931
    method: auction
    place: athens
    label: bought at auction in Munich for 5,900,775 drachmas; the National Gallery's most important acquisition; inventory Π.152
    sources:
      - url: https://nationalgallery.gr/en/?p=46651
        note: "In 1931, moreover, the National Gallery’s most important acquisition was made at auction in Munich: Domenikos Theotokopoulos’s Concert of the Angels , the upper part of his Annunciation, was acquired for the sum of 5,900,775 Drachmas."
        source: national-gallery-athens-history
        accessed: 2026-11-24
