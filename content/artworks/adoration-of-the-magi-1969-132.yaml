    place: florence
    label: through the daughters of Prince Carlo Felice Barberini-Colonna di Sciarra, Anna (1840–1911, m. Prince Tommaso Corsini) and Luisa (1844–1906, m. Pietro Francesco Corsini); sold by Princess Corsini to Colnaghi
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1969.132
        note: Corsini Collection, Florence, to Colnaghi [Probably 1880-by 1968] — When Prince Carlo Felice Barberini-Colonna di Sciarra, Duca di Castelvecchio, died in 1880, his collection was divided between his two daughters, Anna [1840-1911], who married Prince Tommaso Corsini, and Luisa [1844-1906], who married Tommaso’s younger brother, Pietro Francesco Corsini. It was probably at this time that the paintings entered the Corsini collection in Florence.
        source: cma-1969-132
        accessed: 2026-11-24
