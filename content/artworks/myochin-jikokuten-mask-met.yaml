description_md: A face guard by the master armourer [[artist/myochin-muneakira]] (1673–1745) in the form of Jikokuten, one of the [[shitenno]], with the fierce features of the guardian Niō at temple gates — iron that a fighting warrior could still have used, though it was made for display in procession. [[source/history-of-japanese-art|p. 303, fig. 349]]
