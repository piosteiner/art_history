title: Vitrail de l'Arbre de Jessé de Saint-Denis
attribution_label: Anonymous, French
created: c. 1145
created_span: uncertain
medium: stained glass
institution: basilica-of-saint-denis
description_md: |-
  The Tree of Jesse window in the Lady Chapel of the former abbey church of [[place/saint-denis|Saint-Denis]] dates from about 1145.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 97]] It belongs to the choir and ambulatory built in 1137–1145 (the upper parts date from the thirteenth century).[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 97]]

  The [[term/tree-of-jesse|Tree of Jesse]] traces the genealogy of Christ from David through the kings of Judah to the Virgin.[[source/forsyth-1972-the-throne-of-wisdom|p. 23]] In the lecture the window appeared between Abbot Suger's account of his search for timber and the high-medieval tree diagrams.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 94]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 97]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 105]] It was compared with Jesse trees in books — an L-initial of the Gospel of Matthew (*Liber generationis*) of the early thirteenth century in the British Library (Royal 4 D I) and the Bible des Capucins of 1175–1200 (Paris, BnF, lat. 16746) — and with the Jesse window of [[artwork/wurzel-jesse-fenster-chartres|Chartres]], about 1150.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 103]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 104]]

  The lecture also connected the new choir with the scarcity of wood in the twelfth century: Abbot Suger reports in *De consecratione* that the carpenters of Paris told him no beams of the required size could be found in the region for lack of forests, and that he himself then searched the woods of the Chevreuse and found the twelve trunks he needed.[[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 92]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 93]] [[source/ganz-2024-aus-dem-wald|Sitzung 6 (7.11.2024), Folie 94]]
