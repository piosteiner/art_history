description_md: A study in realism taken to the limits of literal representation by [[artist/kosho]], one of Unkei’s sons. [[person/kuya]] (903–972) wandered through Japan teaching the [[nenbutsu]] in a dance with gongs and bells; here he walks with a gong at his chest held by a yoke and a staff topped by deer antlers (by legend he became a priest after killing a deer). From his mouth a wire carries six small standing Amida figures — the six syllables of the nenbutsu. [[source/history-of-japanese-art|pp. 193–194, fig. 224]]
