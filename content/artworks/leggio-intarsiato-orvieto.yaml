description_md: |-
  This lectern with intarsia was made by a Sienese workshop in 1350–1375 and is in the [[institution/museo-dell-opera-del-duomo-orvieto|Museo dell'Opera del Duomo]] in [[place/orvieto|Orvieto]] [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 42]]. The lecture showed it, with a detail, among the early Italian examples of the technique, together with the [[artwork/incoronazione-della-vergine-coro-orvieto|Coronation of the Virgin]] from the tympanum of the cathedral's choir stalls [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folien 42–44]].

  Intarsia, as the lecture defines it after Thomas Rohark, lays different woods into or against each other on a flat surface so that a level surface with inclusions of different colour and structure results; the inserted pieces end flush with the surface, and the visibility of the wood is decisive [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 35]]. Ajmar dates the beginnings of the specifically Italian technique, in which a thin veneer of wooden tesserae was applied to a flat matrix or laid into a hollow carved to receive it, to the fourteenth century [[source/ajmar-2024-reciprocal-design|p. 28]].
