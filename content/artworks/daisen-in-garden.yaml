title: Garden of the hōjō, Daisenin
attribution_label: Anonymous
created: c. 1513
created_span: uncertain
kind: garden
medium: Stones, pebbles, plants
institution: daisen-in
description_md: "One of the most complicated small gardens, in [[institution/daisen-in]], the subtemple of Daitokuji founded in 1509 by [[person/kogaku-soko]]; its [[hojo]] was completed in 1513, and the garden along its east and north sides is attributed to Sōkō himself. Its motif is a river: two tall rocks in the north-east corner a waterfall, the pebbles the river, a flat rock a bridge, a humpbacked stone a fish swimming upstream — a panorama to free the mind, and a background for gatherings of renga poets. [[source/history-of-japanese-art|pp. 216–217, fig. 251]]"
