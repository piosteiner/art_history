provenance:
  - owner: artist/li-di
    acquired: 1197
    method: creation
    label: two leaves by the Southern Song court painter Li Di, each signed with the date Qingyuan 3 (1197); probably album leaves at first, remounted in Japan as a pair of hanging scrolls
    sources:
      - url: https://www.tnm.jp/modules/r_collection/index.php?controller=dtl&colid=TA137
        note: 李迪＠りてき＠は12世紀後半に活躍した宮廷画家で花鳥画をよくしました。 … 各幅に「慶元丁巳歳李迪画＠けいげんていしのとしりてきが＠」の落款があります。
        source: tnm-ta-137
        accessed: 2026-11-24
      - url: https://emuseum.nich.go.jp/detail?langId=ja&webView=&content_base_id=100216&content_part_id=0&content_pict_id=0
        note: 2幅の図は、本来はそれぞれ独立した冊仕立の作品であったと思われるが、日本の茶の湯の美意識から生まれた唐絵鑑賞に合わせて、対幅に改装された。
        source: emuseum-100216-ja
        accessed: 2026-11-24
  - owner_label: unknown owner in Japan
    acquired: 15th century
    label: in Japan by the 15th century (Muromachi period)
    certainty: probable
    sources:
      - url: https://www.tnm.jp/modules/r_collection/index.php?controller=dtl&colid=TA137
        note: おそらく室町時代には伝来していた、南宋院体花鳥画の最優品として知られています。
        source: tnm-ta-137
        accessed: 2026-11-24
      - url: https://bunka.nii.ac.jp/heritages/detail/455131
        note: 日本には室町時代15世紀には伝来しており、現在まで大切に伝えられてきた、中国宮廷花鳥画の名品です。
        source: bunka-online-455131
        accessed: 2026-11-24
