description_md: "One of thirty scrolls of [[artist/ito-jakuchu]]’s Colourful Realm of Living Beings: insects, frogs, lizards and snakes minutely and colourfully depicted, yet flattened, with the plants around them, into a swirling decorative pattern — hyper-realism meeting a Rinpa-inspired aesthetic. [[source/history-of-japanese-art|p. 324, fig. 376]]"
