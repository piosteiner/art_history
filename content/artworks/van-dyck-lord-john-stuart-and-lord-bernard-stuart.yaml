description_md: |-
  [[artist/anthony-van-dyck|Anthony van Dyck]]'s portrait of [[person/lord-john-stewart|Lord John Stuart]] and his brother [[person/lord-bernard-stewart|Lord Bernard Stuart]] is dated 1638; it is painted in oil on canvas and measures 237.5 × 146.1 cm [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 30]]. It is in the [[institution/national-gallery-london|National Gallery]] in London [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 30]].

  The lecture showed it after the slides on indigo — from Indigofera tinctoria, native to India, China and tropical Africa, and Indigofera suffruticosa of the tropical Americas — and on a seventeenth-century Peruvian carpet with a border on an indigo-blue ground [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folien 28–30]]. With Elena Phipps the lecture stressed that the crimson reds, deep blues, purples, greys and blacks obtained from the new dyestuffs were quickly taken up by European dyeworks [[source/ganz-2024-aus-dem-wald|Sitzung 11 (12.12.2024), Folie 31]].
