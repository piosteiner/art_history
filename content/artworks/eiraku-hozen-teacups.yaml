description_md: "Cups for sencha, tea made from leaves, by [[artist/eiraku-hozen]] (1795–1854), whose studio name recalls the Chinese Yongle era (1403–1424): birds, flowers and lingzhi fungus in cut gold leaf on a bright red ground, a deliberately archaic evocation of the lost splendours of the Ming. [[source/history-of-japanese-art|p. 300, fig. 345]]"
