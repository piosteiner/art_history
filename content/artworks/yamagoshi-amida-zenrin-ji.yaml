description_md: "The most famous [[yamagoshi-raigo]]: Amida’s golden head and torso glow against a dark sky above the mountains, his halo like the moon; Kannon and Seishi have already crossed and bend forward to greet the deceased; two boys point up from the banks of a river, the Shitennō stand in pairs, and in the corner is the Sanskrit seed syllable of Amida. [[source/history-of-japanese-art|p. 209, fig. 242]]"
