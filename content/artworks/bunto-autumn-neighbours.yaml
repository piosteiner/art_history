title: Autumn Neighbours
creator: hayashi-bunto
kind: kakemono
medium: Ink and colours on silk
materials: [ink, silk]
dimensions: [33.1, 29.2]
description_md: "A [[haiga]] by [[artist/hayashi-bunto]] (1882–1966), noted for his humour: a forlorn seaside holidaymaker in a beach robe and scarf turns out to be a kappa, the river demon whose head holds the water that gives him power — covered here by a scarf, his summer fun over. “Shops by the beach / all closed and boarded up — / insect voices.” [[source/history-of-japanese-art|pp. 362–363, fig. 429]]"
