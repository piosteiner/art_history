description_md: "The hall for the major ceremonies of state in the imperial palace of Heian (Kyoto), the capital [[person/emperor-kanmu]] founded in 794. The present building of 1855 reproduces the early Heian [[shinden-zukuri]] style: an imposing hall on tall pillars under a massive double roof of cypress bark, the interior a wood-plank floor with large wooden platforms, behind which panels with Confucian sages form a wall. The Heian court took over the great audience hall (Daigokuden) of the Chinese model, but by the ninth century the Shishinden and the more intimate Seiryōden had taken over its functions; none of the original buildings survives. [[source/history-of-japanese-art|p. 103, fig. 126]]"
