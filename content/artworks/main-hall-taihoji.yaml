        note: 今の本堂は建立年次を知る資料を欠いているが、形式手法からみると鎌倉時代前期頃の特質を表している。その後寛永八年（一六三一）修理と厨子の新設があり、貞享二年（一六八五）修理、大正十年解体修理を施して、今に至っている。 … 所有者名 ： 大宝寺 所有者種別 ： 寺院
