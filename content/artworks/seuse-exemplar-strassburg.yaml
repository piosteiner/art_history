description_md: |-
  An illustrated manuscript of the Exemplar of [[person/heinrich-seuse|Henry Suso]] (Heinrich Seuse, 1295/97–1366), made around 1370 and now in the Bibliothèque nationale et universitaire, Strasbourg (Ms. 2929).[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 79, 81]] The Exemplar is the collection Suso himself put together late in life, possibly in 1361–63 in Ulm: his Life of the Servant, the Little Book of Eternal Wisdom, the Little Book of Truth and a small book of eleven letters, with a prologue.[[source/wikipedia-en-henry-suso|§ Writings]][[source/wikipedia-en-henry-suso|§ Career]]

  ## Images

  Two of its illustrations were shown in the lecture with the passages of Suso's Life they illustrate:
  - **The Servant looks at Eternal Wisdom in his heart** (fol. 8v), illustrating chapter 5 of the Life: in a vision the angel told the Servant to look into himself, and he saw his body above his heart "clear as a crystal", with Eternal Wisdom resting in his heart and his soul held in its arms.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 101]]
  - **The Servant before the Crucified** (fol. 65v), illustrating chapter 43: when the Servant asked God to teach him to suffer, the crucified Christ appeared to him in the form of a six-winged seraph, the wings inscribed "Accept suffering willingly", "Bear suffering patiently" and "Learn to suffer as Christ suffered".[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 81]]

  ## Context

  Suso's Life also describes how, out of compassion with the Crucified, he carried on his bare back for eight years a wooden cross with thirty iron nails, and scourged himself with a strap set with sharp brass points until the blood ran.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 79–80]] The lecture used these passages and images to explain the new, wounded image of Christ on the forked crosses of around 1300 – devotion that sought compassio and imitatio Christi in one's own body.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 71, 79–82]] The vision of the heart "clear as a crystal" stood beside Visitation groups whose bellies open to show the unborn children.[[source/ganz-2024-aus-dem-wald|Sitzung 7 (14.11.2024), Folie 99–102]]

  Suso, a Dominican, was born in Überlingen or Constance, studied in Strasbourg and Cologne – where he probably met Meister Eckhart – and died in Ulm on 25 January 1366.[[source/wikipedia-en-henry-suso|§ Biography]][[source/wikipedia-en-henry-suso|§ Career]] Judged by the number of surviving manuscripts he was the most popular vernacular writer of the fourteenth century; his Little Book of Eternal Wisdom alone survives in 232 manuscripts.[[source/wikipedia-en-henry-suso|§ introduction]][[source/wikipedia-en-henry-suso|§ Writings]]
