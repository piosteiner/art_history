description_md: "A bust of his wife [[artist/kiyohara-tama]] (1861–1939), herself a painter, by [[artist/vincenzo-ragusa]], who taught Western modelling and bronze casting at the Kōbu Bijutsu Gakkō from 1876 to 1882 and set up a foundry in his house: a technically accomplished example of the realistic neoclassical style, the smooth planes of the face against her Western-style hair. [[source/history-of-japanese-art|pp. 355–356, fig. 417]]"
