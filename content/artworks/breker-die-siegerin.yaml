description_md: '*Die Siegerin* by [[artist/arno-breker|Arno Breker]] (1936) was shown at the [[event/great-german-art-exhibition-1937|Great German Art Exhibition 1937]] in the [[institution/haus-der-kunst|Haus der Deutschen Kunst]] in Munich; a photograph by Kurt Huhle shows it in the middle of a hall ([Stadtarchiv München, DE-1992-FS-NS-00734](https://stadtarchiv.muenchen.de/scopeQuery/detail.aspx?ID=461955)).[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke, Abb.]] Sculptures like this one, Schlenker writes, demonstrated "Aryan superiority" or German virtues.[[source/schlenker-2020-grosse-deutsche-kunstausstellung|§ Ausgestellte Werke]]'
