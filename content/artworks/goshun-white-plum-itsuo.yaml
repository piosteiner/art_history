public_id: 107936
title: White Plum Tree
creator: matsumura-goshun
created: 1781/1789
kind: byōbu
medium: Pair of six-panel screens, light colour on silk
materials: [silk]
dimensions: [175.5, 373.5]
dimensions_note: each screen
institution: itsuo-art-museum
description_md: "A pair of undated screens by [[artist/matsumura-goshun]] (1752–1811), who studied with Buson, worked beside Ōkyo after the Kyoto fire of 1788 and founded the Shijō school: white plums against pale blue on rough yellow pongee silk with four seams per panel, painted in grey-blue strokes; the left screen’s small trees silhouetted as if by the moon on a cloudless night. [[source/history-of-japanese-art|pp. 321–322, fig. 373]]"
