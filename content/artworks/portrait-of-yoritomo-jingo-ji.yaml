description_md: One of three surviving portraits from a set of five commemorating the retired emperor [[person/emperor-go-shirakawa]], who restored Jingoji, and four of his most trusted advisers, kept in the Sentōin, the hall built in his honour. Traditionally attributed to [[artist/fujiwara-no-takanobu]] (c. 1146–c. 1206) and dated 1179, when all the sitters were alive; the paintings are now thought to be copies of the early thirteenth century. The figure identified as [[person/minamoto-no-yoritomo]], thirty-two in 1179, wears formal court costume and sits on three layers of tatami holding a shaku — among the earliest secular portraits in the [[yamato-e]] style. [[source/history-of-japanese-art|pp. 168–169, fig. 201]]
