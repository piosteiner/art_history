description_md: |-
  This Coronation of the Virgin was the tympanum of the choir stalls of Orvieto Cathedral and is now in the [[institution/museo-dell-opera-del-duomo-orvieto|Museo dell'Opera del Duomo]] in [[place/orvieto|Orvieto]]; the lecture gives it to a Sienese workshop [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 44]]. It is built on a base plate of walnut measuring 2.90 × 2.90 m, with inlays of walnut, chestnut, alder, oak, cherry, red pear, mulberry, spindle wood, boxwood and rowan [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 44]].

  The many species show the range of colours available to intarsia makers: in the lecture's summary of the Italian Renaissance palette, walnut gave mid to dark brown and was used both for the ground and for inlays, spindle wood white to beige, pear mid to red-brown, mulberry golden to red-brown, cherry and boxwood light to mid brown [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 52]]. The pieces were cut after a design drawing, fitted together and trimmed on the panel with a shoulder knife, glued to the base plate with bone or fish glue, the joints filled, the surface smoothed with planes and sand, and finally coated with an oily varnish [[source/ganz-2024-aus-dem-wald|Sitzung 10 (5.12.2024), Folie 53]].
