provenance:
  - owner_label: Pierrey, Paris
    acquired: c. 1908
    label: 'MCCP card: "exposition Monte Carlo/[sous?] Pierrey, Paris/ca. 1908 (?)" — perhaps lent by him to an exhibition in Monte Carlo; identity undetermined'
    certainty: possible
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: "Possibly Pierrey, Paris [Probably c. 1908] — The Munich Central Collecting Point property card for the van Beyeren painting notes the following under “identifying marks”: “exposition Monte Carlo/[sous?] Pierrey, Paris/ca. 1908 (?),”"
        source: cma-1960-80
        accessed: 2026-11-24
  - owner: institution/galerie-a-s-drey
    role: dealer
    ended: 1936
    place: munich
    label: with the gallery or possibly in the Drey family's own collection before the war
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: (Probably Galerie A.S. Drey, Munich) [Probably until 1936] — it seems likely that the painting was indeed with Galerie A.S. Drey or possibly in the personal collection of the family before the war.
        source: cma-1960-80
        accessed: 2026-11-24
  - owner: person/walter-bornheim
    acquired: 1936
    direct: true
    place: munich
    label: took over Galerie A.S. Drey on its "Aryanization" (RM 30,000 for the firm, stock valued at RM 300,000), as Galerie für Alte Kunst; certain works held for the Dreys
    certainty: possible
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: Walter Bornheim [1888-1971], Munich [Possibly 1936-1946] — Upon his decision in 1936 to move to the United States, Franz Drey, owner of A.S. Drey, asked sculpture dealer Bornheim to take over upon the “Aryanization” of the gallery. Bornheim paid RM 30,000 for the firm and took over its stock, valued at RM 300,000.
        source: cma-1960-80
        accessed: 2026-11-24
  - owner: institution/munich-central-collecting-point
    role: custodian
    acquired: 1946-05
    ended: 1947-09-17
    direct: true
    place: munich
    label: cleared by the Allies from Bornheim's depot in the Dresdner Bank, Tegernsee; Munich no. 30958; returned to Bornheim 17 Sept. 1947
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: The MCCP card says that the van Beyeren came to the Collecting Point from Tegernsee, one of Bornheim’s depots [...] Upon its arrival at the Collecting Point, the van Beyeren was assigned Munich no. 30958. The Collecting Point card notes that on Sept. 17, 1947 the painting was returned to Bornheim
        source: cma-1960-80
        accessed: 2026-11-24
  - owner: person/walter-bornheim
    acquired: 1947-09-17
    method: restitution
    direct: true
    place: munich
    label: returned by the Collecting Point; held only in trust for the owners of A.S. Drey
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: Walter Bornheim, Munich, restituted to Paul Drey [1947-1949] — they were only held in trust by Bornheim
        source: cma-1960-80
        accessed: 2026-11-24
  - owner: person/paul-drey
    co_owners: [person/elizabeth-drey]
    acquired: 1949-08-04
    method: settlement
    direct: true
    place: new-york-city
    label: compromise between Bornheim and Paul Drey; still with Elizabeth Drey or the gallery after Paul's death in 1953 (RKD photograph)
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: Probably Paul Drey [1885-1953] and Elizabeth Drey, New York [1949-at least 1953] — On August 4, 1949, Bornheim and Paul Drey reached a compromise wherein the former was obliged to return some artworks to the owners of A.S. Drey
        source: cma-1960-80
        accessed: 2026-11-24
  - owner_label: private collection, United States
    acquired: 1956 or earlier
    label: offered at "Erlesene Kunstwerke aus amerikanischem Besitz" (French & Co. with Lempertz, Cologne, 1956, no. 2A), unsold and sent back to the owner
    certainty: possible
    sources:
      - url: https://clevelandart.org/art/1960.80
        note: Possibly private collection, United States [By 1956] — Lempertz records show that the van Beyeren failed to sell and was sent back to its owner in the United States.
