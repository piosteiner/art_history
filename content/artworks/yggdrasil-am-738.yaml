description_md: |-
  An illustration of the world ash Yggdrasil in AM 738 4to, a late 17th-century Icelandic paper manuscript also known as *Edda oblongata* or *Langa Edda*, now in the [[institution/arni-magnusson-institute|Árni Magnússon Institute for Icelandic Studies]] in Reykjavík.[[source/wikipedia-en-am-738-4to|introduction]] The lecture "Aus dem Wald" presents the picture as the world ash Yggdrasil as a home of birds and mammals, in an Icelandic manuscript of about 1680.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 45]]

  ## The manuscript

  The manuscript has 135 leaves in an unusually tall and narrow format, 33 × 10.5 cm.[[source/wikipedia-en-am-738-4to|§ Description]] Dated to about 1680, it gathers chapters from the Prose Edda, many Eddic poems, skaldic poetry, a rune poem, the Christian visionary poem *Sólarljóð* and other short texts, among them three poems by the minister and poet Hallgrímur Pétursson.[[source/wikipedia-en-am-738-4to|§ Description]] An illustrated title page before the Prose Edda chapters suggests that this part, perhaps the whole book, was finished in 1680; its initials "S G" may refer to the poet Sigurður Gíslason (1655–1688), whom the collector Árni Magnússon named as an owner.[[source/wikipedia-en-am-738-4to|§ History]] The book passed to his half-sister Ingibjörg Jónsdóttir and then to Magnús Jónsson of Leirá, a schoolmaster in Skálholt, from whom Árni Magnússon received it around 1700; it stayed in Copenhagen until its return to Iceland in 1991.[[source/wikipedia-en-am-738-4to|§ History]] Most of its many coloured illustrations show subjects from Norse mythology.[[source/wikipedia-en-am-738-4to|§ Illustrations]]

  ## In the lecture

  The picture opened the lecture's section on trees and forests in cultural origin stories, which went on to Virgil's *Aeneid*, where the Arcadian king Euander tells of a primeval race born of tree trunks and hard oaks that lived in the forests from tree fruit and hunting before Saturn gave them laws, and to Ovid's Golden Age, when the earth gave everything untouched by hoe and plough and people gathered the acorns that fell from Jupiter's tree.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 44]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 46]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 47]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 49]]
