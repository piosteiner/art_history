description_md: |-
  The Boston Crucifix is a painted willow-wood corpus from southern Germany or Salzburg of the early eleventh century, 176 cm high, in the Museum of Fine Arts, Boston.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 17]] It came from the former Fuld Collection (MFA 51.1405).[[source/endemann-2020-wood-carving-and-staffering|pp. 144, 147]] A volume edited by Shirin Fozi and Gerhard Lutz in 2020, *Christ on the Cross*, is devoted to it and to the rise of monumental wood sculpture between 970 and 1200.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 27]]

  ## Making

  Klaus Endemann lists it as Alemannic, c. 1000, while noting that its dating is still controversial.[[source/endemann-2020-wood-carving-and-staffering|pp. 138, 147]] The arms are joined to the body not with pegs but with small boards cemented into irregular holes.[[source/endemann-2020-wood-carving-and-staffering|pp. 159–160]] The figure was not originally hollowed: the hollowing belongs to its late Gothic recasting, and the large hole in the head may have served to mount it on a workbench then.[[source/endemann-2020-wood-carving-and-staffering|p. 163]] [[source/endemann-2020-wood-carving-and-staffering|p. 157]] Narrow chisels under 5 mm and a slightly concave chisel were used on the cingulum, a scorper of about 2 mm for the spherical forms of the twisted cloth.[[source/endemann-2020-wood-carving-and-staffering|pp. 166, 169]] The long concave folds of the loincloth seem to have been cut as V-notches and then rounded by burnishing.[[source/endemann-2020-wood-carving-and-staffering|p. 167]]

  ## Colour

  Under the paint the wood surface was dark, as on the [[artwork/gero-cross|Gero Cross]].[[source/endemann-2020-wood-carving-and-staffering|p. 172]] The inner lining of the loincloth was red, a thick, coarse red lead.[[source/endemann-2020-wood-carving-and-staffering|p. 177]] [[source/endemann-2020-wood-carving-and-staffering|p. 178]] A rare find is the pattern on the twisted cingulum: crossed red lines on a white ground, overlaid with yellow lines — an impression of how strong colours were used to render textiles.[[source/endemann-2020-wood-carving-and-staffering|p. 178]]

  The lecture placed the crucifix among the early wooden crucifixes and showed how the figure lay in its tree trunk, compared with the Gero and Ringelheim crosses.[[source/ganz-2024-aus-dem-wald|Sitzung 4 (17.10.2024), Folie 76]]
