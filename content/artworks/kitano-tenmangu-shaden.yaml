description_md: The shrine of [[person/sugawara-no-michizane]] (845–903), scholar and poet exiled to Kyūshū in 901 through the plotting of the Fujiwara. When his enemies died one after another, his angry spirit was blamed; he was reappointed Minister of the Right in 923 and the shrine built at Kitano in 947. As Tenjin he became the patron of learning — some 3,500 shrines are his. The plan joins worship hall ([[haiden]]) and main hall under one roof by a stone room, a type later used for the mausoleums of Hideyoshi and Ieyasu ([[gongen-zukuri]]). The present buildings date from 1607. [[source/history-of-japanese-art|p. 164, fig. 199]]
