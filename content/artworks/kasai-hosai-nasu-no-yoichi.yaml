description_md: |-
  *Nasu no Yoichi on Horseback* is a hanging scroll ([[term/kakemono|kakemono]]) by [[artist/kasai-hosai|Kasai Hōsai]], painted in colours and ink on silk in the [[movement/meiji-era|Meiji period]], early 20th century. [[source/thomsen-2019-war-and-peace|image list, 5 April 2019]]

  ## Subject

  Nasu no Yoichi (c. 1169 – c. 1232) was a samurai who fought for the Minamoto in the [[event/genpei-war|Genpei War]] and is famous above all for the Battle of Yashima in 1185. [[source/wikipedia-en-nasu-no-yoichi|introduction]] According to the *Heike monogatari*, the Taira placed a fan on a pole on one of their ships and dared the Minamoto warriors to shoot it down; sitting on his horse in the waves, with the target rocking on the ship, Yoichi brought it down with a single shot. [[source/wikipedia-en-nasu-no-yoichi|introduction]] His deeds are known mainly from the war chronicles, the *Tale of the Heike* and the *Genpei seisuiki*, rather than from records of his time. [[source/wikipedia-en-nasu-no-yoichi|§ Biography]]

  The Genpei War began in 1180 when the retired emperor Go-Shirakawa encouraged the Minamoto brothers Yoritomo and Yoshitsune to take power from the Taira, and ended in 1185 with the Taira defeat at Dannoura. [[source/history-of-japanese-art|p. 167]] The story of the Taira family's tragic fortunes was told in one of the great works of the fourteenth century, the *Heike monogatari*. [[source/history-of-japanese-art|p. 167]] Such epics introduced the war epic into the monogatari form, a departure into more aggressive and masculine territory in the medieval period. [[source/history-of-japanese-art|p. 181]]

  ## In the lecture

  The scroll was shown on 5 April 2019 in the session "Invasion Case Studies", together with the Mongol Invasion Scrolls and a suit of armour (yoroi) of the Kamakura period. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] [[source/thomsen-2019-war-and-peace|image list, 5 April 2019]] The day's vocabulary began with [[term/bunbu|bunbu]], the dual path of the literary and the military arts, both of which one should know. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]] The class notes ask whether such aesthetic memorials of war were used only to heroicise, and observe that they carry no critical view of war. [[source/thomsen-2019-war-and-peace|lecture of 5 April 2019, class notes]]
