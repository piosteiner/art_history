description_md: "Unkei's earliest extant work[[source/tnm-unkei-exhibition-2017|“his son and pupil Unkei produced his earliest extant work, Dainichi Nyorai (No. 4) for Enjoji temple in Nara”]]: the seated Dainichi Nyorai, about a metre high in the form of a bodhisattva, made under the direction of his father Kōkei. Its inscription is dated 1175; it took 326 days and carries Unkei's ornamental signature[[source/kobayashi-1954-unkei|“Statue of Dainichi-nyorai, Vairocana, or the esoteric Saka, at Enjo-ji Temple, Nara, dated 1175, which was made under the direction of his father” · “The statue is in the form of Bodhisattva about 1-metre high” · “it took 326 days for its completion” · “Also it bears his ornamental signature”]]."
