description_md: "An [[installation]] by [[artist/yayoi-kusama]] (b. 1929), whose “obsessional art” of infinitely repeated images has a compelling and provocative voice: a mirrored room, a canvas she has used since the 1960s, looked into from one open end and filled with soft-sculpture pumpkins — a psychedelic, almost ominously cute vision of the infinite. [[source/history-of-japanese-art|pp. 390–391, fig. 467]]"
