description_md: A printed handbill announcing that on the 5th day of the tenth month of 1817 Hokusai would paint, as *[[term/sekiga|sekiga]]*, an image of Daruma on 120 mats in the open ground of Monzenchō in Nagoya, with brushes made from five rice bales [[source/kato-hokusai-kyokuhitsu-daruma|§ 1817]]. Katō Yoshio records it in the [[institution/nagoya-city-museum|Nagoya City Museum]] [[source/kato-hokusai-kyokuhitsu-daruma|§ 1817]].
