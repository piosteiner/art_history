description_md: "A pair of eight-panel screens on which forty-eight fans by [[artist/tawara-sotatsu]] are pasted — his shop, the Tawaraya, was known for fans with themes from classical literature. One shows an episode of the Tales of Ise ([[person/ariwara-no-narihira]]): a nobleman and the girl he has carried off shelter from a storm in a ruined storehouse, she inside, he guarding the door; at dawn she is gone, eaten by a demon, who climbs through the air above the roof — the twin of the God of Thunder of the Kitano Tenjin engi. [[source/history-of-japanese-art|pp. 268–269, fig. 310]]"
