provenance:
  - owner_label: unknown sculptor
    acquired: late 9th century
    method: creation
    label: seated portrait of Chishō Daishi (Enchin, d. 891), thought to be made soon after his death; holds his cremated remains ('Okotsu Daishi'), older than the Chūson Daishi
    certainty: probable
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 荼毘に付した円珍の遺骨を納めるところから「御骨大師」と呼ばれて寺内で尊崇され … 中尊大師像より古く、9世紀末、円珍没後まもない頃の作と思われる。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/208
        note: 時代 ： 平安
        source: kunishitei-201-208
        accessed: 2026-11-24
  - owner: institution/mii-dera
    place: otsu
    label: in a shrine to the left of the Chūson Daishi in the Tōin Daishi-dō; a hidden image; Onjō-ji is the owner today
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 唐院大師堂内、中尊大師像の向かって左の厨子内に安置する。秘仏で、特別な行事の時以外、開扉はされない。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
      - url: https://kunishitei.bunka.go.jp/heritage/detail/201/208
        note: 所有者名 ： 園城寺
        source: kunishitei-201-208
        accessed: 2026-11-24
  - owner: institution/shoko-in-kyoto
    role: custodian
    acquired: 1595
    ended: 1598
    method: transfer
    label: Hideyoshi confiscated Onjō-ji in 1595; Dōchō, former head of Onjō-ji, took 'the seated statue of Chishō Daishi' to his Shōkō-in for safety; moved back to Onjō-ji's Jōkō-in in 1598 (the article does not say which of the two statues)
    certainty: possible
    sources:
      - url: https://ja.wikipedia.org/w/index.php?title=園城寺&oldid=111672295
        note: 文禄4年（1595年）11月、当寺は突如として秀吉の怒りに触れ、闕所（寺領の没収、事実上の廃寺）を命じられた … 本尊の弥勒菩薩像や智証大師坐像、黄不動尊などは元園城寺長吏の道澄が自ら住持を務める照高院 … に避難させ … 照高院に避難させていた弥勒菩薩像、智証大師坐像、黄不動尊などを園城寺闕所の際にも存続が許されて残っていた上光院に移している。
        source: jawiki-onjo-ji
        accessed: 2026-11-24
