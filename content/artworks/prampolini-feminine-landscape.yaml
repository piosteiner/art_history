  Bought by the Ministry of National Education: the regime acquired a Futurist work too [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]].

  ## Context

  [[artist/enrico-prampolini|Enrico Prampolini]] painted *Feminine Landscape* in 1930, between his return to figuration in *Umbrian Landscape* (1929) and the biomorphic "cosmic idealism" he had adopted by 1931 [[source/wikipedia-en-enrico-prampolini|§ Introduction]]. The seminar showed the ministry's purchase beside [[artwork/carpanetti-incipit-novus-ordo|*Incipit novus ordo*]] by [[artist/arnaldo-carpanetti|Arnaldo Carpanetti]], which won a competition sponsored by the National Fascist Party at the Venice Biennale of the same year, under the question: "Fascism: Imperfect totalitarianism or strategic artistic pluralism?" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 14]]. The pairing shows the regime rewarding an allegory of the new order and at the same time buying a [[movement/futurism|Futurist]] work. Mussolini gave patronage to many styles to keep artists loyal, and Marinetti's wish to make Futurism the official state art was never fulfilled [[source/wikipedia-en-futurism|§ 1920s and 1930s]]. Historians describe this as the Fascists' promotion of "all strands of modernism" [[source/antliff-2002|p. 148]]; Emily Braun argues that such "creative freedom" was itself a pre-eminent form of Fascist propaganda, presenting the regime as a "Third Way" between Communism and liberal individualism [[source/braun-2000|p. 4]]. For Golomstock, by contrast, the formation of a totalitarian art in Italy "stretched out over two decades and was never fully completed" [[source/beatrice-marinho-2024-art-and-totalitarianism|slides, 24 September 2024, slide 50]].
