description_md: |-
  The superstructure (Gesprenge) above the shrine of [[artist/michael-pacher|Michael Pacher]]'s high altarpiece at St. Wolfgang im Salzkammergut (1471–81); it is 5.84 m high, of Swiss stone pine with its original painting, and the whole altarpiece is 10.88 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]]

  It is built of five two-storey canopy towers holding ten carved figures: at the top in the centre God the Father; below him the Annunciation with the Archangel Gabriel and Mary; below that Christ on the cross between Mary and John the Evangelist; on the left the Archangel Michael as vanquisher of the devil and weigher of souls, above him a holy nun, perhaps Scholastica; on the right John the Baptist, above him Saint Odile.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Das Gesprenge]] Originally the altarpiece was 11.50 m high from the altar table to the top, but the top had to be shortened by about 60 cm when it was set up.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Beschreibung]]
