description_md: A votive plaque ([[ema]]) of a prize horse — daimyo pledged such paintings at Shinto shrines, a tradition going back to the horses and bulls of Tang emperors and Japanese insei. Dated 1569 and signed “Kanō Jibu Shōyū”, the court rank of [[artist/kano-hideyori]], son of Kanō Motonobu, the only Kanō master to hold it then. Mason’s caption places it at the Kamo Shrine in Shimane, his text at the Kamigamo Shrine. [[source/history-of-japanese-art|pp. 254–255, fig. 293]]
