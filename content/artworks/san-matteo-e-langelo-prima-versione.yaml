  - url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Caravaggio_%28Michelangelo_Merisi%29_%281571_-_1610%29_-_The_Evangelist_Matthew_-_365_-_Gem%C3%A4ldegalerie.jpg/1280px-Caravaggio_%28Michelangelo_Merisi%29_%281571_-_1610%29_-_The_Evangelist_Matthew_-_365_-_Gem%C3%A4ldegalerie.jpg
    source_url: https://commons.wikimedia.org/wiki/File:Caravaggio_(Michelangelo_Merisi)_(1571_-_1610)_-_The_Evangelist_Matthew_-_365_-_Gem%C3%A4ldegalerie.jpg
