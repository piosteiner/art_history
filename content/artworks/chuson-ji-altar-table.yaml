description_md: A black lacquer altar table from the provincial temple [[institution/chuson-ji]] in Hiraizumi, of the standard type for the chapels that noblemen’s houses and temples were required to have. The overall design and the dense floral pattern from brocade are Chinese, but the almost gaudy mother-of-pearl inlay betrays a Japanese taste. [[source/history-of-japanese-art|p. 107, fig. 131]]
