description_md: |-
  A black lacquer altar table from the provincial temple [[institution/chuson-ji]] in Hiraizumi, of the standard type for the chapels that noblemen’s houses and temples were required to have. The overall design and the dense floral pattern from brocade are Chinese, but the almost gaudy mother-of-pearl inlay betrays a Japanese taste. [[source/history-of-japanese-art|p. 107, fig. 131]]

  It is one of the four furnishings of the sutra hall (中尊寺経蔵堂内具) — with a ritual dais (礼盤), a stand for a stone chime (磬架) and a lamp stand (螺鈿平塵燈台) — kept by the [[institution/daichoju-in]] and designated a National Treasure. The national database describes the table as lacquered wood with mother-of-pearl scrolls (宝相華唐草文) on a ground of gold dust (平塵) and gilt bronze fittings; its period field says Kamakura, while its commentary sees in the group the forms of the Heian period and takes it to be, by and large, from the founding of the hall. [[source/bunka-online-203829]]
