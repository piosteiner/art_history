provenance:
  - owner_label: Balboni collection, Venice
    ended: 1913
    place: venice
    label: Balboni may be Carlo Balboni, a dealer in Venice
    sources:
      - url: https://clevelandart.org/art/1950.251
        note: "Balboni collection, Venice, probably sold to Leopold Koppel [date: Until 1913] — Max J. Friedlaender's handwritten inventory of Leopold Koppel's collection, apparently the earliest documentation for the Veronese, states that Koppel purchased the painting in 1913 from Balboni in Venice. Balboni may refer to Carlo Balboni, a dealer in Venice"
        source: cma-1950-251
        accessed: 2026-11-24
  - owner: person/leopold-koppel
    acquired: 1913
    ended: 1933
    method: purchase
    direct: true
    place: berlin
    label: purchase recorded in Max J. Friedländer's handwritten inventory of Koppel's collection; the expected gift to the Kaiser-Friedrich-Museum never materialized
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1950.251
        note: "Leopold Koppel [1854-1933], Berlin, by descent to his son, Albert Koppel [date: Probably 1913-1933] — Koppel purchased the painting in 1913 from Balboni in Venice. … The donation never materialized, however, as the Koppel famly had to leave Germany when Hitler came to power."
        source: cma-1950-251
        accessed: 2026-11-24
  - owner: person/albert-koppel
    acquired: 1933
    ended_label: c. 1950
    method: inheritance
    direct: true
    place: toronto
    label: the family had to leave Germany when Hitler came to power; went to Switzerland, then settled in Toronto (footnote calls him Alfred)
    certainty: probable
    sources:
      - url: https://clevelandart.org/art/1950.251
        note: "Albert Koppel, Switzerland and Toronto, Ontario, consigned to Rosenberg & Stiebel [date: Probably 1933 - c. 1950] — After leaving Germany, Alfred Koppel went to Switzerland before settling in Toronto."
        source: cma-1950-251
        accessed: 2026-11-24
  - owner: institution/rosenberg-stiebel-inc
    role: agent
    acquired_label: consigned c. 1950
    direct: true
    place: new-york-city
    label: consigned by Koppel; Saemy Rosenberg had visited Koppel in Toronto during the war and it was agreed R&S would sell his collection
    sources:
      - url: https://clevelandart.org/art/1950.251
        note: "(Rosenberg & Stiebel, New York, sold to the Cleveland Museum of Art) [date: Until 1950] — Saemy Rosenberg visited Koppel in Toronto during the war and it was determined that Rosenberg & Stiebel would sell Koppel's collection"
        source: cma-1950-251
        accessed: 2026-11-24
