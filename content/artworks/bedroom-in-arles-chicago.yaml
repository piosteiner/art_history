description_md: "The second version of [[artwork/bedroom-in-arles|The Bedroom]], painted at Saint-Rémy-de-Provence in September 1889, nearly a year after the [[artwork/bedroom-in-arles-van-gogh-museum|first]][[source/artic-the-bedroom-1926-417|“The painting in the Art Institute’s collection is Van Gogh’s second version of the scene, made nearly a year after the first, in September 1889”]], and of the same size[[source/orsay-la-chambre-de-van-gogh-a-arles|“Almost a year later, Van Gogh made two copies of it: one, the same size, is now in the Art Institute in Chicago”]]. Van Gogh sent it to his brother Theo in Paris on 18 December 1889[[source/artic-the-bedroom-1926-417|provenance: “sent to his brother, Theo van Gogh (died 1891), Paris, Dec. 18, 1889” · after letter 829 of 19 December 1889: “notes that The Bedroom was sent the day before”]]. With its bold colours, thick broken brushwork and sharply receding lines the picture may seem nervous, but Van Gogh meant it as a calm and restful image[[source/artic-the-bedroom-1926-417|“With its bold colors, thick and broken brushwork, and sharply receding lines, the picture might suggest a nervous energy. But the artist understood it as a calming and restful image”]]. At the same time he painted a third, smaller version as a gift for his mother and sister[[source/artic-the-bedroom-1926-417|“He produced a third, smaller version at the same time as a gift for his mother and sister”]], now in the [[artwork/bedroom-in-arles-orsay|Musée d’Orsay]]."
