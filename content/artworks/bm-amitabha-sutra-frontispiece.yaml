description_md: |-
  One of the few Koryŏ illuminated sutras outside Japan and Korea, in the [[institution/british-museum]]: written in 1341 in silver and gold on indigo paper by the monk Chŏnggo to earn merit for his mother. The frontispiece shows Amitābha preaching in paradise, drawn entirely in fine gold “iron-wire” lines; the cover bears “precious visage” flowers. [[source/portal-2000|pp. 86–88, fig. 44]]

  A concertina album of 31 panels of indigo-dyed paper; the cover bears three flowers with vines in gold and silver around the title. The sutra, Kumārajīva's Chinese translation, is written in silver; the frontispiece, spread over two leaves within a border of vajras, shows the sermon in the palace of the Pure Land with "treasure trees" round the principal Buddha — Amitābha in the 2016 catalogue entry, Śākyamuni in the museum's description — while two bodhisattvas welcome souls to paradise. The dedicatory inscription at the end gives the first year of Zhizheng (1341) and the scribe, the monk [[artist/chonggo]], who wrote it for his mother's spiritual benefit. Kept in a paulownia wood box. [[source/british-museum-1983-1008-0-1|Description, Inscriptions, Curator's comments (NRICH 2016)]]
