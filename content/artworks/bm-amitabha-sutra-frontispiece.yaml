description_md: "One of the few Koryŏ illuminated sutras outside Japan and Korea, in the [[institution/british-museum]]: written in 1341 in silver and gold on indigo paper by the monk Chŏnggo to earn merit for his mother. The frontispiece shows Amitābha preaching in paradise, drawn entirely in fine gold “iron-wire” lines; the cover bears “precious visage” flowers. [[source/portal-2000|pp. 86–88, fig. 44]]"
