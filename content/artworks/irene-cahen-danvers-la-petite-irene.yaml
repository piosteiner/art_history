    notes_md: Granddaughter of Louise Cahen d’Anvers, daughter of Irène. Lent the painting to the Orangerie in 1933. Béatrice Reinach, her husband Léon and their children Fanny and Bertrand were arrested in 1942 and murdered in Auschwitz.
