    notes_md: "Two versions: in 1946 René Joly wrote that the painting had never belonged to Béatrice Reinach but always to Irène Sampieri-Camondo, and had only been deposited with her daughter. In 1941 Léon Reinach had written that it was a gift to his wife from her grandmother Louise."
    sources:
