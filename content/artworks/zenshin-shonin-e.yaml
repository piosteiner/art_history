description_md: The illustrated life of [[person/shinran]] (1173–1263), founder of the Jōdo Shin sect; the text was written by his great-grandson [[person/kakunyo]] in 1295 and illustrated by an unknown, probably monk-painter. In this scene Hōnen writes an inscription for Shinran on a portrait of himself, then hands him his writings on the nenbutsu (Senjakushū) to copy — a sign of his confidence in his brightest pupil; to the left a lotus blooms in his garden. [[source/history-of-japanese-art|p. 203, fig. 235]]
