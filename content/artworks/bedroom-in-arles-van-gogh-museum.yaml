description_md: |-
  The first of the three versions of [[artwork/bedroom-in-arles|The Bedroom]], painted in Arles in October 1888[[source/vangoghmuseum-the-bedroom-s0047v1962|“Vincent van Gogh (1853 - 1890), Arles, October 1888”]]: Van Gogh’s bedroom in the Yellow House, which he had furnished himself with simple furniture and his own works on the wall. The bright colours were to express “repose” or “sleep”. Research shows that today’s strong contrasts are partly the result of discolouration — the walls and doors, now blue, were originally purple. The skewed rear wall is no mistake: the corner of the room really was at an angle. Van Gogh deliberately “flattened” the interior and left out the shadows so that it would resemble a Japanese print. He thought it among his best: “When I saw my canvases again after my illness, what seemed to me the best was the bedroom.”[[source/vangoghmuseum-the-bedroom-s0047v1962|“He prepared the room himself with simple furniture and with his own work on the wall. The bright colours were meant to express absolute ‘repose’ or ‘sleep’. Research shows that the strongly contrasting colours we see in the work today are the result of discolouration over the years. The walls and doors, for instance, were originally purple rather than blue. The apparently odd angle of the rear wall … – the corner really was skewed.” · “he had deliberately ‘flattened’ the interior and left out the shadows so that his picture would resemble a Japanese print”]]



  The canvas was damaged by water while he was in hospital in Arles[[source/orsay-la-chambre-de-van-gogh-a-arles|“damaged during a flood that occurred while the painter was in hospital in Arles”]]. He sent it to Theo at the end of April 1889[[source/vangoghmuseum-the-bedroom-s0047v1962|provenance: “Sent by the artist from Arles to his brother Theo van Gogh, Paris, at the end of April 1889”]]; almost a year after painting it, at Saint-Rémy in September 1889, he made the two repetitions now in [[artwork/bedroom-in-arles-chicago|Chicago]] and the [[artwork/bedroom-in-arles-orsay|Musée d’Orsay]][[source/orsay-la-chambre-de-van-gogh-a-arles|“Almost a year later, Van Gogh made two copies of it”]][[source/artic-the-bedroom-1926-417|“made nearly a year after the first, in September 1889”]].
