description_md: This walnut relief on the right leaf of the [[artwork/bildertur-st-maria-im-kapitol|wooden door of St. Maria im Kapitol]] in Cologne (1050/65) shows the miracle of Pentecost.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 107]] It ends the door's life of Christ, which runs from the Annunciation to Pentecost; four further panels at the bottom show the temptations of Christ and his veneration by two cherubim.[[source/wikipedia-de-holztur-von-st-maria-im-kapitol|§ Ikonografie]] The lecture showed it together with the Entry into Jerusalem and the Last Supper of the same leaf.[[source/ganz-2024-aus-dem-wald|Sitzung 5 (31.10.2024), Folie 121]]
