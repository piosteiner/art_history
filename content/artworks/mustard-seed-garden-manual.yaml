region: east_asia
description_md: The Chinese manual of painting printed in two instalments (landscape in 1679; bamboo, plum and bird-and-flower in 1701) that, with the Eight Albums of Painting, became the main source of [[bunjinga]] in Japan; editions printed in Japan from 1748. Its woodblock illustrations reduced brushwork and ink tones to lines and flat colours — so that Japanese literati were long slow to learn true Chinese brushwork. [[source/history-of-japanese-art|pp. 326–327, fig. 380]]
