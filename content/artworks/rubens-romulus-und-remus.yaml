description_md: |-
  A painting by [[artist/peter-paul-rubens|Peter Paul Rubens]] in the Pinacoteca of the [[institution/capitoline-museums|Capitoline Museums]] in Rome: the twins Romulus and Remus cared for by the she-wolf.[[source/wikipedia-en-romulus-and-remus-rubens]] Rubens also shows the god of the river Tiber sitting on his urn, the woodpecker that watched over the twins and brought them food, and the shepherd who discovers the infants.[[source/wikipedia-en-romulus-and-remus-rubens]] The lecture "Aus dem Wald" titles it *Romulus and Remus discovered by the shepherd Faustulus* and gives oil on canvas, 213 × 212 cm, and the date 1612;[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 75]] Wikipedia dates it 1615–1616.[[source/wikipedia-en-romulus-and-remus-rubens]]

  ## The fig tree

  The setting is the place where, according to tradition, the floating cradle of the twins came to rest on the bank of the Tiber: the Ficus Ruminalis, a wild fig near the Lupercal cave at the foot of the Palatine, where the she-wolf suckled them until Faustulus found them.[[source/wikipedia-en-ficus-ruminalis|introduction; § Legend]] Carole M. Cusack calls it the most famous sacred tree of Rome; Varro says shepherds had planted it long before in honour of the milk goddess Rumina, because its sap resembled milk, which made the suckling of the twins beneath it fitting.[[source/cusack-2011-the-sacred-tree|p. 52]] As Rumina faded in importance, the tree came to be called *ficus Romularis*, a name used by Ovid and Livy.[[source/cusack-2011-the-sacred-tree|p. 52]]

  In the lecture the painting closes a section on sacred trees as bridges to gods and myths, after the Ficus Ruminalis had been introduced through Pliny's *Natural History* (XV, 77): a fig tree on the Forum, at the Comitium, was tended with veneration in memory of the tree that had sheltered Romulus and Remus, and when it withered a new one was planted by the priests.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 72]] The lecture notes the uncertainty about where the tree stood — at the Lupercal at the foot of the Palatine or at the Comitium — and that the tree had the function of a sign and could be replaced.[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 73]]
