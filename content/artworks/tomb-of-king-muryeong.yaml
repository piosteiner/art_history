description_md: "The brick chamber tomb of [[person/muryeong-of-baekje]] (r. 501–523) at Kongju, discovered intact in 1971: its epitaph tablets name the king and the date of his burial (525); a string of Liang coins paid the earth spirits for the land. Vaulted corridor and chamber, moulded bricks with lotus and geometric patterns and niches for lamps follow Chinese Liang tombs; the gold and silver ornaments are Korean. [[source/portal-2000|pp. 42, 51, fig. 22]]"
