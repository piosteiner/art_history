description_md: Van Gogh painted Augustine Roulin, the wife of the postal worker Joseph Roulin, holding the rope of a cradle beyond the frame, and inscribed the title lower right[[source/mfa-lullaby-la-berceuse-48-548|“The rope in her hands leads to a cradle beyond the confines of the frame. At right, the painter inscribed the title ‘La Berceuse,’ which means both ‘lullaby’ and ‘she who rocks the cradle.’”]]. He wished to see it “in the cabin of a boat”, where fishermen would feel rocked and remember their own lullabies[[source/mfa-lullaby-la-berceuse-48-548|“writing to his brother that he would like to see this painting ‘in the cabin of a boat’ where fishermen in ‘their melancholy isolation, exposed to all the dangers, alone on the sad sea…would experience a feeling of being rocked, reminding them of their own lullabies.’”]]. He sent it to Theo and had him give it to Émile Bernard.
