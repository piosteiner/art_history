description_md: "An eleven-headed, thousand-armed [[kannon]] beside the Birushana in the golden hall of Tōshōdaiji — the only such image in Japan that really had a thousand arms, 953 of them left: six large, thirty-four smaller with attributes, the rest tiny hands forming a second halo. Made in [[wood-core-dry-lacquer]]. [[source/history-of-japanese-art|p. 96, fig. 122]]"
