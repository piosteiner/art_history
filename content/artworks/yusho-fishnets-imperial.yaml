description_md: "A pair of screens by [[artist/kaiho-yusho]] in colour on gold: from the right, a bold stand of marsh grass in bright green and a narrow band of water; then nets hung out to dry on poles, gold serving as shore and sky. The left screen repeats the elements with more weight on the nets — without figures, an ethereal realm far from the bustle of a fishing village. [[source/history-of-japanese-art|p. 266, fig. 305]]"
