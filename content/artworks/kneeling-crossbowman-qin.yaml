description_md: |-
  ## Description

  The figure of a kneeling crossbowman is a terracotta sculpture of about 210 BCE from the mausoleum complex of the emperor of the Qin dynasty. [[source/thomsen-2019-war-and-peace|image list, 1 March 2019]] It is one of the terracotta army of the [[place/mausoleum-of-the-first-qin-emperor|mausoleum of the First Qin Emperor]], whose figures are detailed to the point that each can be told apart from all the others. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]] Armoured kneeling crossbowmen or archers are one of the general types among the figures, beside unarmoured standing archers, armoured and unarmoured infantry, cavalrymen, charioteers, generals and lower-ranking officers. [[source/wikipedia-en-terracotta-army|§ The warriors]] The figures are life-sized, typically between about 1.75 and 2 metres tall, and vary in height, uniform and hairstyle according to the rank they portray. [[source/wikipedia-en-terracotta-army|§ The warriors]] Scholars have identified ten basic face forms, which were developed further to give each figure an individual face. [[source/wikipedia-en-terracotta-army|§ The warriors]]

  ## Making

  The figures were made in workshops by government labourers and local craftsmen from local materials; heads, arms, legs and torsos were formed separately and then joined, and clay added after assembly gave each face its own features. [[source/wikipedia-en-terracotta-army|§ Construction]] They were originally painted, among other pigments with cinnabar, malachite, azurite and Han purple, under a coloured lacquer finish. [[source/wikipedia-en-terracotta-army|§ The warriors]] Most of the figures held real weapons; among more than 40,000 bronze weapon parts recovered are crossbows and crossbow triggers. [[source/wikipedia-en-terracotta-army|§ Weaponry]]

  ## Context

  The mausoleum was built for Qin Shi Huang, the first emperor of the Qin dynasty, from 246 to 208 BCE, and the terracotta army east of the tomb mound served as its garrison. [[source/wikipedia-en-mausoleum-of-qin-shi-huang|introduction]] The soldiers were laid out as if to protect the tomb from the east, where the states conquered by Qin lay. [[source/wikipedia-en-terracotta-army|§ Pits]] The figures were found in 1974 by farmers digging a well about 1.5 km east of the tomb mound. [[source/wikipedia-en-terracotta-army|§ Discovery]]

  The lecture showed the figure in its second session, "Early Views of War and Peace", whose sample objects were Zhou bronzes, Han mural paintings and the First Emperor. [[source/thomsen-2019-war-and-peace|syllabus, p. 3]] It placed the terracotta army in a Chinese history of many dynasties and constant quarrels over land, as a reflection on the importance of military force. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]] The number of soldiers among the figures, compared with the other personnel, was read as a sign of the presence of the military in the population of the Qin state. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]] The same session set against it pictures of peace — tranquillity and order, leisure, the stability of the regime, prosperity and commerce — such as [[artwork/han-ruozhuo-sparrows-and-rice-stalks|Sparrows and Rice Stalks]]. [[source/thomsen-2019-war-and-peace|lecture of 1 March 2019, class notes]]
