title: Segawa Tomisaburō II as Yadorigi, wife of Ōgishi Kurando
names: ["Segawa Tomisaburō as Yadorigi, wife of Ogishi Kurando"]
creator: toshusai-sharaku
created: 1794
kind: Japanese woodblock print
medium: Polychrome woodblock print with mica background
materials: [paper]
dimensions: [38.1, 23.2]
dimensions_note: ōban
institution: tokyo-national-museum
description_md: "The actor called “Nasty Tomi” for his acerbic personality, in a female role, glaring through hard eyes as he pulls up one sleeve: truthful, unflattering, frozen in a mie pose against glistening grey mica. [[artist/toshusai-sharaku]] produced about 150 actor prints between spring 1794 and New Year 1795 and disappeared; a law of 1794 forbade mica. [[source/history-of-japanese-art|p. 286, fig. 325]]"
