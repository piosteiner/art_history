description_md: "[[artist/park-su-geun]] (1914–1965), self-taught and often compared with Millet, painted peasant women in thick layers built up on hardboard like the earthen walls of Korean cottages — a “lonely artist” outside any group. [[source/portal-2000|pp. 172–173, fig. 94]]"
