description_md: |-
  A Carolingian illuminated manuscript of the complete Latin Bible, made around 840 in the monastery of St Martin in Tours by its [[artist/tours-scriptorium|scriptorium]], when Adalhard was lay abbot: about twenty monks are said to have worked on its 449 pages; four full-page miniatures; 375 × 510 mm.[[source/wikipedia-de-bibel-von-moutier-grandval]] (Wikidata dates it 835.)

  In the late 16th century it belonged to the Swiss abbey of Moutier-Grandval, after whose closure it came to Delémont. In the early 19th century children found it in an attic there; soon afterwards the mayor of Delémont sold it to a bookseller in Basel, who sold it on to the British Library, where it has been since 1836 (Add. MS 10546). It was shown in Switzerland in 1981 and 2025.[[source/wikipedia-de-bibel-von-moutier-grandval]]

  ## The Genesis page

  The lecture "Aus dem Wald" showed the full-page miniature with scenes from Genesis on fol. 5v, dating the manuscript to about 840 and placing it in Tours.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 52]] It opened the section on trees at the centre of the story of the Fall, after the text of Genesis 2–3: God plants a garden with every tree pleasant to look at and good to eat, the Tree of Life in its midst and the Tree of the Knowledge of Good and Evil, and forbids Adam to eat of the latter; the serpent persuades the woman, she eats and gives to her husband, their eyes are opened, they sew fig leaves together and hide from God among the trees of the garden.[[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 50]][[source/ganz-2024-aus-dem-wald|Sitzung 2 (3.10.2024), Folie 51]] In the third session the page was shown again, followed by the [[artwork/sistine-chapel-ceiling|Sistine ceiling]] and [[artwork/durer-adam-und-eva-1504|Dürer's engraving of 1504]].[[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 19]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 24]][[source/ganz-2024-aus-dem-wald|Sitzung 3 (10.10.2024), Folie 26]]
