description_md: |-
  The high altarpiece of the pilgrimage and parish church of St. Wolfgang im Salzkammergut, made by [[artist/michael-pacher|Michael Pacher]] in 1471–81.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]] It is a transforming altar with a carved shrine and two pairs of movable wings painted on both sides, and it is the only altarpiece by Pacher that survives complete.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ introduction]]

  ## Commission

  At the end of the fifteenth century St. Wolfgang was one of the most visited places of pilgrimage; Abbot Benedikt Eck of Mondsee, under whose lordship it lay, found in Michael Pacher of Bruneck in South Tyrol the master to whom, in 1471, he entrusted a precious altarpiece.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Geschichte des Altars]] Pacher worked on it in his workshop in the Puster valley for almost ten years; then it was taken apart and transported to the Wolfgangsee.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Geschichte des Altars]]

  ## Material and size

  Shrine, superstructure (Gesprenge) and sculptures are of Swiss stone pine, the wings of spruce, and the original painting survives.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]] The whole altarpiece is 10.88 m high; the shrine is 3.86 m high and 97 cm deep, the superstructure 5.84 m and the predella 1.18 m high.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 68]] Open, it is 6.60 m wide; originally it was 11.50 m high, but the top had to be shortened by about 60 cm when it was set up.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Beschreibung]] It has 71 carved and painted figures and 24 paintings.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Beschreibung]]

  ## Three views

  - **Weekday side (closed):** four scenes from the legend of Saint Wolfgang, flanked by the shrine guardians Saint George and Saint Florian in armour.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 69]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Werktagsseite, Schauseite mit geschlossenen Flügeln]]
  - **Sunday side (outer wings open):** eight scenes from the life and miracles of Christ, among them Christ and the woman taken in adultery.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 70, 78]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]]
  - **Feast-day side (inner wings open):** the carved and gilded Coronation of the Virgin in the shrine, flanked by four paintings from the life of Mary and Christ, among them the Nativity and the Circumcision.[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 71, 74, 77, 79]][[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Festtagsseite, Schauseite mit geöffneten Innenflügeln]]

  Today the feast-day side is shown all year except in Lent; formerly the faithful saw it only on high feasts.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Beschreibung]] Some scholars think that Pacher's brother Friedrich painted the outer Wolfgang scenes, while the inner paintings seem to be by Michael Pacher himself.[[source/wikipedia-en-michael-pacher|§ St. Wolfgang Altarpiece]]

  ## Wood between transparency and transcendence

  The lecture presented the altarpiece under the heading "Between transparency and transcendence: wood as image support in Michael Pacher's retable for St. Wolfgang".[[source/ganz-2024-aus-dem-wald|Sitzung 8 (21.11.2024), Folie 67]] In the Sunday-side paintings Gothic architecture almost always fills the whole background.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Die Sonntagsseite, Schauseite mit geöffneten Außenflügeln]] Apart from overpainting in 1625 the altarpiece has remained unchanged; the restorations of 1856/62 and 1969/76 only cleaned and secured it.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Geschichte des Altars]] It inspired the church and winged altarpiece of Kefermarkt.[[source/wikipedia-de-pacher-altar-st-wolfgang|§ Rezeption]]
