        source: nga-2000-95-1
        accessed: 2026-11-24
  - owner: institution/ulm-museum
    role: custodian
    acquired: 1925
    direct: true
    place: ulm
    label: loan no. L117, 'Bretonisches Bauernhaus'
    sources:
      - url: https://www.nga.gov/collection/art-object-page.116570.html
        note: The painting was originally a loan to the Ulm Museum in 1925, as number L117, with the title _Bretonisches Bauernhaus_.
        source: nga-2000-95-1
        accessed: 2026-11-24
  - owner: institution/ulm-museum
    acquired: 1925
    method: purchase
    direct: true
    place: ulm
    label: 1933 deaccession list and defamation show '10 Jahre Ulmer Kunstpolitik'; escaped the 1937 seizures; on display again by 1950; deaccessioned 1955
    sources:
      - url: https://www.nga.gov/collection/art-object-page.116570.html
        note: purchased 1925 by the Ulm Museum, Germany; — The painting was included in a 1933 list of works to be deaccessioned … in 1937 the painting somehow escaped the fate of over 200 works of art that were seized from the Ulm Museum
        source: nga-2000-95-1
        accessed: 2026-11-24
