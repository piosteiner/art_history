provenance:
  - owner_label: unknown
    role: event
    acquired: c. 70–60 BCE
    label: lost in the wreck of a Roman cargo ship off Point Glyphadia, Antikythera; how the mechanism came on board is unknown; in Antikythera
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_mechanism
        note: This wreck of a Roman cargo ship was found at a depth of 45 m off Point Glyphadia on the Greek island of Antikythera. … It is unknown how the mechanism came to be on the cargo ship.
        source: wikipedia-en-antikythera-mechanism
        accessed: 2026-11-24
      - url: https://en.wikipedia.org/wiki/Antikythera_Ephebe
        note: The wreck site, which is dated about 70–60 BC, also yielded the Antikythera mechanism
        source: wikipedia-en-antikythera-ephebe
        accessed: 2026-11-24
  - owner: person/dimitrios-kontos
    acquired: 1901
    method: find
    label: wreck discovered early 1900; retrieved in 1901, probably July, during the first expedition with the Hellenic Royal Navy (1900–1901); in Antikythera; with sponge divers from Symi
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_mechanism
        note: Captain Dimitrios Kontos (Δημήτριος Κοντός) and a crew of sponge divers from Symi island discovered the Antikythera wreck in early 1900, and recovered artefacts during the first expedition with the Hellenic Royal Navy, in 1900–1901. … The mechanism was retrieved from the wreckage in 1901, probably July.
        source: wikipedia-en-antikythera-mechanism
        accessed: 2026-11-24
  - owner: institution/national-archaeological-museum-of-athens
    acquired: 1902 or earlier
    method: transfer
    direct: true
    place: athens
    label: gear wheel recognised by Valerios Stais on 17 May 1902; inventory Χ 15087
    sources:
      - url: https://en.wikipedia.org/wiki/Antikythera_mechanism
        note: All of the items retrieved from the wreckage were transferred to the National Museum of Archaeology in Athens for storage and analysis. … On 17 May 1902, archaeologist Valerios Stais, together with his cousin, the Greek politician Spyridon Stais, found one of the pieces of rock had a gear wheel embedded in it.
        source: wikipedia-en-antikythera-mechanism
        accessed: 2026-11-24
      - url: http://odysseus.culture.gr/h/4/eh430.jsp?obj_id=5582
        note: "The Metals Collection. The Antikythera mechanism … Inventory number: Χ15087"
        source: odysseus-nam-antikythera-mechanism
        accessed: 2026-11-24
