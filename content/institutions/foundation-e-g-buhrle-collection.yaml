description_md: Founded on 24 February 1960 by Emil Bührle's widow Charlotte Bührle-Schalk, his son [[person/dieter-buhrle]] and his daughter [[person/hortense-anda-buhrle]], who gave it one third of the collection, on a division proposed by [[person/arthur-kauffmann]]. Its museum in the villa at Zollikerstrasse 172 in Zürich opened in April 1960 and closed in May 2015, when it could not be secured for regular opening; on 10 February 2008 four works were stolen there in an armed robbery and recovered by 2012. In 2016 Dieter Bührle left it ten more paintings [[source/buehrle-ch-the-foundation]]. Since 9 October 2021 its 203 works are shown at the [[institution/kunsthaus-zurich]], in the building by David Chipperfield. The foundation had no part in the report on its provenance research that Raphael Gross wrote for the city, the canton and the Zürcher Kunstgesellschaft, published on 28 June 2024 [[source/buehrle-ch-mm-2024-06-28]].
