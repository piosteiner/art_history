public_id: 112412
name: Geheime Staatspolizei
kind: police
description_md: The secret state police of the Nazi regime, founded as its instrument of domination and control. It took part in the November pogrom of 1938 and seized Jewish property, among it the collection of Eduard Fuchs (25 October 1933) and the art in the homes of the Bernheimer family in Munich (15–17 November 1938); it commissioned experts to value and auction Jewish possessions [[source/proveana-gestapo]].
