description_md: The school of art, design and architecture founded by Walter Gropius in Weimar in 1919[[source/wikipedia-de-bauhaus|„Das Staatliche Bauhaus … war eine 1919 von Walter Gropius in Weimar gegründete Kunstschule“]]. It moved to Dessau in 1925 — into the Bauhaus building there from December 1926 — and to Berlin in 1932, where it closed in 1933[[source/wikipedia-de-bauhaus|„1925 erfolgte der Umzug nach Dessau.“ · „Dezember 1926 wurde das neue, von Gropius entworfene Bauhausgebäude eingeweiht.“ · „1932 musste das Bauhaus nach Berlin umziehen; 1933 wurde es unter dem Druck der Nationalsozialisten geschlossen“]]. The style it stands for is the movement [[movement/bauhaus|Bauhaus]].
