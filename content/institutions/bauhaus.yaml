name: Bauhaus
names: [Staatliches Bauhaus]
kind: art school
founded: 1919
description_md: The school of art, design and architecture founded by Walter Gropius in Weimar in 1919. It moved to Dessau in 1925 — into the Bauhaus building there from December 1926 — and to Berlin in 1932, where it closed in 1933. The style it stands for is the movement [[movement/bauhaus|Bauhaus]].
