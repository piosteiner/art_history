description_md: Morinaga & Company is a Japanese confectionery company headquartered in Tokyo. [[source/wikipedia-en-morinaga-company|introduction]] Taichirō Morinaga founded it in 1899, opening a shop for Western confectionery in Tokyo after his return from the United States; it was incorporated in 1912. [[source/wikipedia-en-morinaga-company|§ History]] In 1918 it made the first chocolate produced in Japan, and in 1944, during the Second World War, Japan's first domestically produced penicillin. [[source/wikipedia-en-morinaga-company|§ History]] The lecture "War and Peace in East Asian Art" showed a [[artwork/morinaga-notebook-with-photographs|notebook with photographs]] of the 1940s from the Morinaga Archives, and its vocabulary lists "Morinaga candy". [[source/thomsen-2019-war-and-peace|image list, 17 May 2019]] [[source/thomsen-2019-war-and-peace|vocabulary list, 17 May 2019]]
