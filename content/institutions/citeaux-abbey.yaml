description_md: |-
  The first house of the Cistercian order, in Saint-Nicolas-lès-Cîteaux south of Dijon. It was founded on Saint Benedict's Day, 21 March 1098, by monks from Molesme Abbey who sought to follow the Rule of Saint Benedict more strictly, led by Robert of Molesme, its first abbot; its third abbot, Stephen Harding, wrote the Carta Caritatis on which the order was organised. Bernard of Clairvaux was a monk here before he was sent to found Clairvaux in 1115.[[source/wikipedia-en-citeaux-abbey]]

  In 1111 the monastery produced the illuminated [[artwork/moralia-in-job-citeaux|Cîteaux Moralia in Job]][[source/wikipedia-en-citeaux-abbey]] — the work of its [[artist/citeaux-scriptorium|scriptorium]]. The great church, begun around 1140 and completed in 1193, became the burial place of the Dukes of Burgundy. The abbey belongs today to the Trappists.[[source/wikipedia-en-citeaux-abbey]]
