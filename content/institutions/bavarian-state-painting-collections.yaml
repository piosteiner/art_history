description_md: "The Bavarian state authority for paintings and sculpture: it owns the collections and runs the Alte Pinakothek, the Neue Pinakothek, the Sammlung Moderne Kunst in the Pinakothek der Moderne, the Museum Brandhorst, the Sammlung Schack and branch galleries across Bavaria[[source/wikipedia-de-bayerische-staatsgemaeldesammlungen|„Zu den Bayerischen Staatsgemäldesammlungen gehören folgende Museen und Sammlungen: in München: Alte Pinakothek, Neue Pinakothek, Sammlung Moderne Kunst in der Pinakothek der Moderne, Museum Brandhorst, Sammlung Schack und als Filialgalerien: in Ansbach … in Aschaffenburg … in Augsburg …“]]."
