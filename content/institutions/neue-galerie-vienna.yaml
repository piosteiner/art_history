description_md: Art gallery in Vienna founded in 1923 by Otto Nirenstein ([[person/otto-kallir]])[[source/wikipedia-de-otto-kallir|„Otto Kallir (geboren als Otto Nirenstein)“ · „1923 mit der „Neuen Galerie“ in Wien-Innere Stadt“]]. After the Anschluss in 1938 he had to emigrate, first to France, and in 1939 opened the [[institution/galerie-st-etienne]] in New York[[source/wikipedia-de-otto-kallir|„Da nach dem Anschluss Österreichs die Gefahr der Inhaftierung durch die Nationalsozialisten bestand, war Kallir … zur Emigration nach Frankreich gezwungen.“ · „musste er 1939 in die USA emigrieren, wo er im selben Jahr in New York ebenfalls die Galerie „St. Etienne“ … gründete“]].
