description_md: |-
  The Reich Chamber of Culture was the professional body to which every creative artist in National Socialist Germany had to belong. It was set up by the law of 22 September 1933, in the course of the *Gleichschaltung*, at the instigation of [[person/joseph-goebbels|Joseph Goebbels]] — against the ambitions of his rival Robert Ley's German Labour Front — to bring the whole of cultural life under control and promote "Aryan" art. Membership required an "Aryan certificate", and a rejection amounted to a ban on working.[[source/wikipedia-en-reich-chamber-of-culture|introduction]]

  Goebbels headed it himself; it was attached to his [[institution/reichsministerium-fur-volksaufklarung-und-propaganda|ministry]] on Wilhelmplatz in Berlin, with a state secretary of the ministry as vice-president (Walther Funk 1933–1938, Karl Hanke 1938–1941, Leopold Gutterer 1941–1944, Werner Naumann 1944–1945); the SS officer Hans Hinkel was in charge of removing Jews from German cultural life. Its seven chambers covered film, music, the visual arts, theatre, literature, the press and radio — the Reich Music Chamber, for instance, was headed by Richard Strauss and from 1935 by Peter Raabe.[[source/wikipedia-en-reich-chamber-of-culture|§ Structure and organisation]]

  For painters and sculptors the Reich Chamber of the Fine Arts under [[artist/adolf-ziegler|Adolf Ziegler]] mattered most. Its members on the jury of the first Great German Art Exhibition — Ziegler and the graphic artist Hans Schweitzer ("Mjölnir") — drew Hitler's anger in June 1937.[[source/peters-2017|pp. 15–16]] In the spring of that year the chamber had still hesitated over showing Brücke artists as "degenerate", against the ministry's propaganda section.[[source/peters-2017|p. 22]] Through it, artists were expelled and banned from work: [[artist/emil-nolde|Emil Nolde]] in August 1941 was forbidden "any professional [...] activity in the area of the fine arts", and his future works had to go before a "Committee for the Assessment of Inferior Artistic Products".[[source/fulda-soika-2014|pp. 186, 193]]
