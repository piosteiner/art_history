description_md: |-
  Der Palazzo Pubblico an der Piazza del Campo war der Sitz der Regierung der Republik Siena. Geplant seit 1282, wurde er etwa zwischen 1297 und 1310 unter dem Governo dei Nove gebaut, der 1310 einzog; bis heute ist er Sitz der Stadtverwaltung.[[source/wikipedia-it-palazzo-pubblico-siena]] Die Torre del Mangia entstand 1325–1348, ihr Abschluss aus Travertin nach einem Entwurf Lippo Memmis; die Cappella di Piazza wurde 1352 als Dank für das Ende der Pest gebaut.[[source/wikipedia-it-palazzo-pubblico-siena]]

  Die Säle gehören zu den wichtigsten Zeugnissen der sienesischen Malerei: in der Sala del Mappamondo Simone Martinis Maestà (1312–1315) und der ihm zugeschriebene Guidoriccio da Fogliano (1330); in der Sala dei Nove oder della Pace [[artwork/allegory-of-good-and-bad-government|Ambrogio Lorenzettis Allegorie und Wirkungen des Guten und Schlechten Regiments]] (1338–1339); in der Sala di Balia der Zyklus Spinello Aretinos und Parri Spinellis zu Papst Alexander III. (1407); in der Anticappella die Fresken Taddeo di Bartolos (um 1415).[[source/wikipedia-it-palazzo-pubblico-siena]] Seit den 1930er Jahren ist im ersten Stock das Museo Civico eingerichtet.[[source/wikipedia-it-palazzo-pubblico-siena]]
