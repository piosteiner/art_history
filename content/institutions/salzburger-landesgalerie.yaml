name: Salzburger Landesgalerie
kind: gallery
place: salzburg
description_md: "The Salzburg state gallery set up during the Second World War (inventory 1942–1944), built up with works bought from the art trade, among them from [[person/friedrich-welz]], who bought in occupied France; many of them had to be returned after 1945[[source/wikipedia-de-friedrich-welz|„Im teils besetzten Frankreich erwarb Welz während des Zweiten Weltkrieges zu Billigstpreisen wertvolle Kunstwerke, die er im Deutschen Reich mit großem Profit verkaufte oder teilweise in den Besitz der sich in Gründung befindlichen „Salzburger Landesgalerie“ stellte.“ · „Viele der auf diese Weise erworbenen Bilder und Kunstwerke der Landesgalerie mussten jedoch nach 1945 … wieder zurückgegeben werden.“ · Literatur: „Fritz Koller: Inventarbuch der Landesgalerie Salzburg 1942–1944“]]."
