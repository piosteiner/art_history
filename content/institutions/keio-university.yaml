description_md: A private university in Minato, Tokyo, founded in 1858 in Edo as a school of Western studies[[source/wikipedia-en-keio-university]] by [[person/fukuzawa-yukichi]][[source/history-of-japanese-art|p. 356]] — at first a school of Dutch studies for the vassals of the Nakatsu domain. In 1868 Fukuzawa moved it to Mita and named it Keio Gijuku after the era name Keiō.[[source/wikipedia-en-fukuzawa-yukichi]] It was granted university status in 1920, one of the first private universities in Japan.[[source/wikipedia-en-keio-university]]
