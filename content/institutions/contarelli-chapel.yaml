description_md: "A side chapel of [[institution/san-luigi-dei-francesi]] in Rome, founded with the bequest of Cardinal [[person/matthieu-cointerel]] (Matteo Contarelli, d. 1585). Caravaggio’s three paintings of Saint Matthew were made for it and still hang there: the [[artwork/ciclo-di-san-matteo]][[source/wikipedia-en-contarelli-chapel|“The decorative cycle began with the painting on the left side of the chapel” · “On the right side of the wall is the Martyrdom of St. Matthew”]][[source/smb-der-evangelist-matthaeus-caravaggio|„… hängt Caravaggios zweite Version desselben Themas noch heute über dem Altar der Cappella Contarelli“]]."
