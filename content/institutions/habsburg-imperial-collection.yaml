description_md: "The art collections of the Habsburg emperors: Rudolf II's, Ferdinand of Tyrol's at Ambras, the Treasury (Schatzkammer) and the picture gallery in Vienna — Archduke Leopold Wilhelm's, in the Stallburg until 1776[[source/wikipedia-de-stallburg|„Von 1659 bis 1776 war hier die Kunstsammlung des Erzherzogs Leopold Wilhelm untergebracht, die sogenannte Stallburg-Galerie“]], then in the Belvedere. Shown together in the [[institution/kunsthistorisches-museum-wien]] since its opening in 1891[[source/wikipedia-de-kunsthistorisches-museum-wien|„Das Museum ist aus den Sammlungen der Habsburger entstanden, vor allem aus der Porträt- und Harnischsammlung Ferdinands von Tirol, der Sammlung Kaiser Rudolfs II. … und der Gemäldesammlung von Erzherzog Leopold Wilhelm.“ · „Die Zusammenführung und Aufstellung der anderen Sammlungen des Allerhöchsten Kaiserhauses aus dem Unteren und Oberen Belvedere, der Hofburg und Schloss Ambras in Tirol …“ · „… Oktober 1891 von Kaiser Franz Joseph I. offiziell eröffnet“]]."
