description_md: "The art collections of the Habsburg emperors: Rudolf II's in Prague, the Treasury (Schatzkammer) and the picture gallery in Vienna (in the Stallburg, from 1776 in the Upper Belvedere), Ambras for the Tyrolean line. Shown together in the [[institution/kunsthistorisches-museum]] since its opening in 1891."
