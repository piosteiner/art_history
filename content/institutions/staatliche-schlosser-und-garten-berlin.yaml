name: Staatliche Schlösser und Gärten, Berlin
kind: palace administration
place: berlin
description_md: |-
  The administration of the former royal palaces in Berlin (West Berlin after the division of Germany), which came from the Prussian administration set up in 1927 after the property settlement between the House of Hohenzollern and the Free State of Prussia[[source/wikipedia-de-stiftung-preussische-schloesser-und-gaerten|„Die SPSG ist ein Zusammenschluss der durch die Teilung Deutschlands entstandenen Verwaltungen der „Staatlichen Schlösser und Gärten Potsdam-Sanssouci“ (DDR) und der „Verwaltung der Staatlichen Schlösser und Gärten Berlin“ (West-Berlin). Diese Institutionen sind aus der preußischen „Verwaltung der Staatlichen Schlösser und Gärten“ hervorgegangen, die nach der Vermögensauseinandersetzung zwischen dem Haus Hohenzollern und dem Freistaat Preußen am 1. April 1927 gegründet worden war und bis 1947 existiert hatte“]]. The Staatliche Museen zu Berlin name it, as legal successor, as the holder of Caspar David Friedrich's [[artwork/monch-am-meer]] from 1928 to 1957[[source/smb-moench-am-meer-965511|Provenienz: „Staatliche Schlösser und Gärten, Berlin (Rechtsnachfolge), 1928–1957“ · Erwerbung: „Aus dem zerstörten Berliner Stadtschloß“]].

  Not to be confused with the Prussian Verwaltung der Staatlichen Schlösser und Gärten (1927–1947, Wikidata Q108606055), whose Berlin successor it was, nor with today's Stiftung Preußische Schlösser und Gärten Berlin-Brandenburg (since 1995).
