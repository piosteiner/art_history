place: munich
location: [11.56662, 48.14521]
description_md: Set up by the American Allies as the central collecting point for art found after the war; every object was recorded on an index card — artist, title, size, condition, the dates it came in and went out, where it came from. Its American head was Edgar Breitenbach. In August 1948 the objects held there were transferred to the Bavarian minister president, and on 22 February 1952 what was left went to the trusteeship for cultural property of the Federal Foreign Office [[source/proveana-ccp-munchen]].
