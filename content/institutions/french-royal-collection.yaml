description_md: The collection of the kings of France, from Francis I to Louis XVI — at Fontainebleau, the Louvre, the Tuileries and Versailles[[source/wikipedia-fr-musee-du-louvre|« Depuis la fin du Moyen Âge, les souverains français s’attachaient à passer des commandes aux plus grands artistes européens et à rassembler les chefs-d’œuvre de leur temps et des époques passées » · « le château de Fontainebleau » · « Louis XVI reprend les achats de tableaux pour les collections royales »]]; the Revolution showed it to the public in the Louvre, opened in August 1793, and it became the museum’s core[[source/wikipedia-fr-musee-du-louvre|« Le projet naît au siècle des Lumières d’y présenter au public les chefs-d’œuvre de la collection de la Couronne. La Révolution accomplit ce dessein en inaugurant le musée en août 1793 » · « Augmentées à l’ouverture en 1793 par les œuvres confisquées chez des nobles émigrés ou dans des églises, ces collections … »]].
