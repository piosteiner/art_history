description_md: The museum of the [[movement/mingei|Mingei]] movement in Tokyo. In 1925 [[person/yanagi-soetsu]] coined the word mingei with the potters [[artist/kawai-kanjiro]] and [[artist/hamada-shoji]]; in the following year he announced a prospectus for a museum of folk crafts, which was founded in 1936 with Yanagi as its first president. From it he travelled to Tōhoku, Kyūshū and Okinawa to study and collect crafts, and showed Joseon crafts, Ōtsu-e and works of the Ainu and of Taiwan’s peoples. Yanagi designed the main hall himself, down to its fittings — a wooden building with Ōya stone; the old wing and the stone wall along the street have been a Tangible Cultural Property designated by the Tokyo Metropolitan Government since 2021. Before it, in 1924, he had founded the Korean Folk Art Museum in Seoul.[[source/mingeikan-about]]
