description_md: The Zürich gallery of Toni Aktuaryus, from which [[person/emil-georg-buhrle]] made most of his first purchases from 1936 [[source/buehrle-ch-the-collection]]. It took works of the collection of Alfred and Thekla Hess on commission (probably from 1934) and on 19 April 1937 sent nineteen prints of that collection, by Lehmbruck, Heckel and Maillol, to the Kunsthaus Zürich for safekeeping [[source/proveana-aktuaryus]].
