description_md: The Lucerne gallery and auction house of [[person/theodor-fischer]]. In June 1939 it held the auction of "degenerate art" from German museums, at which [[person/emil-georg-buhrle]] bid; Fischer later sold him French Impressionists, and most of the 13 works looted in France that Bührle had to return in 1948 had come from Fischer [[source/buehrle-ch-the-collection]]. After 1957 it belonged to Arthur Fischer (1905–1981) and Paul Fischer (1911–1976) [[source/proveana-galerie-fischer]].
