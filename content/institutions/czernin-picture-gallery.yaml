description_md: "The picture gallery of the Counts Czernin in Vienna, founded by [[person/johann-rudolf-czernin-von-und-zu-chudenic]] in the early 19th century[[source/wikipedia-de-johann-rudolf-czernin|„Um die Jahrhundertwende fing Czernin an zu sammeln und besaß zwanzig Jahre später die wichtigste private Kunstsammlung der Monarchie: 1813 kaufte er Die Malkunst, ein Gemälde von Johannes Vermeer.“ · „Von 1817 bis 1825 war František Tkadlík als Hofmaler der Czernin und Aufseher von deren Galerie in Wien tätig“]][[source/khm-die-malkunst-gg-9128|Provenienz: „1813 Rudolf Graf Czernin; Gräflich Czerninsche Galerie, Wien; 1940 A. Hitler …“]]."
