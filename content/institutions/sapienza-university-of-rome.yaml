description_md: |-
  ## History

  The Sapienza was founded on 20 April 1303 by a bull of Pope Boniface VIII as a *studium* for ecclesiastical studies, more under papal control than the universities of Bologna and Padua [[source/wikipedia-en-sapienza-university-of-rome|§ History]]. In 1431 Pope Eugene IV reorganised it with the four schools of law, medicine, philosophy and theology, funded by a tax on wine that bought the palace later housing Sant'Ivo alla Sapienza [[source/wikipedia-en-sapienza-university-of-rome|§ History]]. The *studium* closed in the sack of Rome of 1527 and was restored by Paul III after 1534; in the 1650s it became known as the Sapienza ("wisdom") [[source/wikipedia-en-sapienza-university-of-rome|§ History]]. In 1870 it ceased to be the papal university and became the university of the capital of Italy [[source/wikipedia-en-sapienza-university-of-rome|§ History]]. With over 110,000 students it is today the largest university in Europe [[source/wikipedia-en-sapienza-university-of-rome|§ Introduction]].

  ## The Città universitaria

  In 1932 Mussolini put [[person/marcello-piacentini|Marcello Piacentini]] in charge of the plans for the new university city, the [[place/citta-universitaria-rome|Città universitaria]], completed in 1935 [[source/wikipedia-en-marcello-piacentini|§ Fascist period]] [[source/wikipedia-en-sapienza-university-of-rome|§ History]]; it covers 44 hectares [[source/wikipedia-en-sapienza-university-of-rome|§ Campuses]]. Its sixteen buildings by eleven architects testify to the importance of the project under Mussolini, who spoke in the Aula Magna after its completion on 28 October 1935 [[source/steiner-2025-mario-sironi|pp. 6–7]]. Piacentini was also professor of urban planning and president of the university [[source/wikipedia-en-marcello-piacentini|§ Fascist period]].

  For the Aula Magna in the Rettorato, [[artist/mario-sironi|Mario Sironi]] painted [[artwork/sironi-italia-fra-le-arti-e-le-scienze|L'Italia fra le Arti e le Scienze]] (1935), repainted in 1950 and restored in 2015–2017 by the university and the Istituto superiore per la conservazione e il restauro [[source/sapienza-2017-sironi-restauro|pp. 1–2]]. Students of the university's school of specialisation in art history worked on the history of the mural during the restoration, whose results were shown in [[event/sironi-svelato-2017|Sironi svelato]] at the university's MLAC – Museo Laboratorio di Arte Contemporanea in the Palazzo del Rettorato [[source/sapienza-2017-sironi-restauro|p. 2]]. Pio Steiner argues that a university is the one place where the restored mural, a work of Fascist propaganda, can serve as a prompt for critical reflection [[source/steiner-2025-mario-sironi|pp. 12–13]].
