description_md: |-
  The works of art in the possession of Keio Gijuku (慶應義塾所蔵美術作品, "works of art held by Keio Gijuku"), the body of [[institution/keio-university|Keio University]] and its schools. They are published on Keio Object Hub, the portal for art and culture at Keio run by the Keio University Museum Commons (KeMCo, 慶應義塾ミュージアム・コモンズ), each with a number of the series KAC-…; its photographs are under a CC BY 4.0 licence, credited to Keio Museum Commons.[[source/objecthub-keio-ac-jp|object 6130 (福澤諭吉座像); Behind the hub]]

  A work is kept by the part of Keio that is in charge of it (所管): [[artwork/okuma-fukuzawa-yukichi|Ōkuma Ujihiro’s seated statue of Fukuzawa Yukichi]] (KAC-2020-0255), for example, by [[institution/keio-shiki-senior-high-school|Keio Shiki Senior High School]].[[source/objecthub-keio-ac-jp|object 6130 (福澤諭吉座像)]]
website_url: https://objecthub.keio.ac.jp/
