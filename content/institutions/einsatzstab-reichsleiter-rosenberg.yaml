public_id: 100309
name: Einsatzstab Reichsleiter Rosenberg
founded: 1940
dissolved: 1945
description_md: The Nazi party's organisation for looting cultural property in the countries occupied during the Second World War. It grew out of Alfred Rosenberg's "Hohe Schule", founded by a decree of Hitler in early 1940 to collect books and archives of the regime's opponents; in the western campaign this quickly became the looting of art. Its "Amt Westen" was set up in Paris in July 1940; it worked in special staffs (Sonderstäbe) for the visual arts, music and others, with 350 staff early in 1943. The works it seized were gathered first in the Louvre, then in the Jeu de Paume — among them some 1,400 paintings, sculptures and objects of [[person/alphonse-kann]], inventoried there in 1941, and much of the David-Weill collection [[source/proveana-err]].
