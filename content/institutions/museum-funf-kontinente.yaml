address: Maximilianstraße 42
description_md: "The Museum Fünf Kontinente in [[place/munich|Munich]] is a museum of non-European art and cultural objects; until 9 September 2014 it was called the Staatliches Museum für Völkerkunde (Bavarian State Museum of Ethnology). [[source/wikipedia-en-museum-five-continents|introduction]] Its building on Maximilianstrasse was built in 1859–1865 by Eduard Riedel for the Bavarian National Museum. [[source/wikipedia-en-museum-five-continents|§ The building]] The collection was founded in 1868, although its history goes back to the non-European objects collected by the Wittelsbach family; with about 200,000 objects it is the second largest of its kind in Germany after Berlin. [[source/wikipedia-en-museum-five-continents|§ The collections]] In Klaus Friese's guest lecture of 10 May 2019 on war in Japanese material culture, two of its textiles were shown: a [[artwork/mfk-printed-cotton-2015-73-54|length of printed cotton]] of about 1936–1940 and a [[artwork/mfk-haori-2017-64-11|silk haori]] of 1932. [[source/thomsen-2019-war-and-peace|image list, 10 May 2019 (guest lecture, Klaus Friese)]]"
