name: Vincent van Gogh
sort_name: Gogh, Vincent van
birth: 1853-03-30
death: 1890-07-29
biography_md: |
  Dutch painter whose roughly ten-year career produced some 860 oil paintings, most of them in his last two years.
  In Paris he discovered Impressionism and collected hundreds of Japanese woodblock prints; in Arles and
  Saint-Rémy he developed the saturated colour and expressive brushwork that made him a founder of modern art.
