# Tests and builds frontend/, then publishes it to GitHub Pages (https://arthistory.piogino.ch).
# Requires Settings → Pages → Source: "GitHub Actions". Optional repository variable MAPTILER_KEY
# (Settings → Secrets and variables → Actions → Variables); without it the map uses OpenFreeMap tiles.
name: Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # daily: new or changed content gets its own page (title, preview image) and the tests check the live API
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # "Re-run" on an old run would publish that old commit over the current site: only the newest commit deploys
      - name: Only deploy the newest commit on main
        working-directory: .
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "::error::This run is for an older commit ($(git rev-parse --short HEAD)); main is at $(git rev-parse --short FETCH_HEAD). Use 'Run workflow' instead of re-running an old run."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # browser tests against the live API (through the dev server's proxy); a failure stops the deploy
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - run: npm run build
        env:
          VITE_MAPTILER_KEY: ${{ vars.MAPTILER_KEY }}
      # one page per entry with its own title/description/preview image, sitemap.xml, robots.txt, 404.html
      - run: npm run prerender
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
