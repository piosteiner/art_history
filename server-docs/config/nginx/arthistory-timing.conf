# Art history API: the access log with how long each request took (2026-10-28) — the standard "combined" fields, then
# rt = the whole request in seconds (nginx) and urt = the app's part (upstream). Appended at the end, so tools that
# read the combined format still read these lines. Used by the API's access_log only (sites-available/arthistory).
log_format arthistory_timed '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
