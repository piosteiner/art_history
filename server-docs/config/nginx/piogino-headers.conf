# Basic security headers for the sites on this server (2026-11-10). Include it in the server block AND in every
# location that has its own add_header — nginx drops inherited add_header lines in such a location.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
