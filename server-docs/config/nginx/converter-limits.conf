# File converter (api.piogino.ch → Flask on :5000, 2026-11-10): limits on new jobs only. GET requests (progress,
# downloads, health) and CORS preflights have an empty key and are not counted. Per address: at most 2 jobs at the
# same time (the server has 2 workers × 2 threads) and 30 a minute, 20 at once allowed.
map $request_method $converter_job_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone  $converter_job_key zone=converter_jobs:10m rate=30r/m;
limit_conn_zone $converter_job_key zone=converter_conns:10m;
