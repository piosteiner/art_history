# Art history admin: failed logins. The app answers a wrong password with 401 on POST /login
# (nginx no longer does basic auth, so every 401 here is the app's). Log format: nginx "combined".
# Copy: server-docs/config/fail2ban/ in the art_history repo.
[Definition]
failregex = ^<HOST> \S+ \S+ .*"POST /(?:admin/)?login HTTP/[0-9.]+" 401 
ignoreregex =
