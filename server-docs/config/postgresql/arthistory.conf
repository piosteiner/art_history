# PostgreSQL 18 tuning for piogino-matterhorn (2 vCPU, 4 GB RAM, shared with MySQL + 5 Node/Python apps).
# Installed at /etc/postgresql/18/main/conf.d/arthistory.conf — copy kept in the repo for documentation.
# Apply: sudo systemctl restart postgresql   (shared_buffers needs a restart)

listen_addresses = 'localhost'      # never exposed; ufw blocks 5432 anyway
max_connections = 30                # 2 small app pools (5 each) + migrations + psql + dev

# Memory — budget ~400 MB for Postgres on a 4 GB box
shared_buffers = 256MB
effective_cache_size = 1GB          # planner hint: OS page cache available
work_mem = 8MB                      # per sort/hash node, per query
maintenance_work_mem = 64MB         # VACUUM, CREATE INDEX
huge_pages = off
jit = off                           # JIT compile overhead not worth it for small OLTP queries

# SSD storage
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL — small dataset, keep disk footprint low
max_wal_size = 512MB
min_wal_size = 80MB
wal_compression = on

# Logging — errors + slow queries only (disk is shared; avoid verbose logs)
log_min_duration_statement = 1000   # ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 10MB

timezone = 'UTC'
